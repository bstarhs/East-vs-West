l_simp_chinese:
 bel.1.t:0 "利奥波德三世宣布返回比利时"
 
 bel.2.t:0 "比利时议会选举"
 
 bel.3.t:0 "社会党赢得比利时选举"
 
 bel.4.t:0 "基督教社会党赢得比利时选举"
 
 bel.5.t:0 "反对利奥波德三世回国的游行示威"
 bel.5.d:0 "布鲁塞尔、列日、安特卫普等地爆发了游行示威，反对利奥波德三世回国！"
 
 bel.6.t:0 "国王问题"
 bel.6.d:0 "反对利奥波德三世的社会运动不断激化，我们必须认真考虑国王的问题。保守势力强烈要求守护利奥波德三世的王位，而左派和进步势力要求国王退位。"
 
 bel.7.t:0 "利奥波德三世退位"
 bel.7.d:0 "利奥波德三世已决定退位，由于比利时由于实行君主制度，因此议会希望选举长子博杜安亲王即位。然而，比利时社会中有许多的左派共和主义者，希望借此结束比利时的君主制度实现共和。"
 
 bel.8.t:0 "利奥波德三世抵达布鲁塞尔"
 
 bel.9.t:0 "瓦隆地区的流血冲突"
 
 bel.10.t:0 "比利时的新国王"
 bel.10.d:0 "在巨大的政治压力面前，比利时国王利奥波德三世被迫宣布退位，以平民愤，其长子博杜安一世宣布即位。"
 
 bel.11.t:0 "瓦隆地区的流血冲突"
 
 bel.20.t:0 "FN FAL半自动步枪诞生"
 bel.20.d:0 "比利时埃斯塔勒国营工厂成功研发出最新的FN FAL半自动步枪，这是一种使用中威力步枪弹的新型步枪。比利时政府宣布，为了感谢英美盟国将比利时从纳粹德国统治下解放，比利时允许北约各国无偿仿制与生产FN FAL步枪。"
 
 bel.21.t:0 "[FROM.GetName]购买FN FAL"
 bel.21.d:0 "[FROM.GetName]向比利时获取了一批FN FAL步枪以仿制和生产。"
 
 bel.30.t:0 "布鲁塞尔世博会开幕"
 bel.30.d:0 "1958年世界博览会在比利时首都正式开幕，这是第二次世界大战结束后的首次世界博览会，超过40个国家参展。在这次世博会上，苏联展馆大放异彩，吸引了大批游客参观，苏联展馆的镇馆之宝，便是大名鼎鼎的斯普特尼克一号人造卫星的一比一模型，以及各种有关太空探索的艺术品。此外，苏联还展示了核电站与核动力破冰船的模型，充分体现出了苏联在科技竞赛中的领先优势。"