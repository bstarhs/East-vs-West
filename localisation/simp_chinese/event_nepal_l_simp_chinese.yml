 nep.7.d:0 "在国内外反对声音的压力下，拉纳家族最终决定终止其对"
 nep.7.a:0 "接受。" #尼泊尔国家凝聚力+15% #触发特里布汶国王回国
 nep.7.b:0 "拒绝。" #尼泊尔国家凝聚力-10% #触发尼泊尔内战事件
 
