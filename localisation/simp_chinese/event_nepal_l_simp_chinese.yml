 nep.40.t:0 "埃德蒙·希拉里登上珠穆朗玛峰！" 
 nep.40.d:0 "今日，人类登山史迎来辉煌一页。新西兰探险家艾德蒙·希拉里与其夏尔巴人向导丹增·诺盖，于尼泊尔时间上午11时30分成功登上海拔8,850米的珠穆朗玛峰峰顶，成为历史上首次站上地球之巅的人类。\n两位勇士是英国珠峰探险队的成员。在克服了昆布冰瀑的裂缝、洛子壁的陡峭冰岩及“希拉里台阶”等极端险阻后，他们最终携手完成了这前所未有的壮举。希拉里在峰顶拍摄了标志性照片，丹增则留下了巧克力与饼干作为供品。当消息传回大本营时，世界为之沸腾。\n探险队凯旋后，英国政府授予希拉里爵士爵位，丹增·诺盖则获颁乔治勋章。此次成功登顶不仅标志着人类对自然极限的挑战取得历史性突破，更成为了不同国家、民族间团结协作的永恒象征。珠峰之巅从此留下了人类勇气的印记。" 
 
 nep.41.t:0 "埃德蒙·希拉里登山队遇难！" 
 nep.41.d:0 "举世瞩目的英国珠峰探险队传来噩耗。新西兰登山家艾德蒙·希拉里与其忠实的夏尔巴人向导丹增·诺盖，在海拔接近8600米、距离峰顶仅一步之遥的最后营地附近，不幸遭遇突发的大型雪崩。尽管队友全力救援，二人仍被掩埋，确认遇难。这次被寄予厚望的登顶尝试，以最悲壮的方式戛然而止。\n希拉里的遗体随后被艰难运回新西兰。在他的家乡奥克兰，人们为其举行了隆重的国葬级别的葬礼，悼念这位勇敢的探险家。而丹增·诺盖则按其民族传统，长眠于神圣的雪山之中。整个登山界与世界为之扼腕。他们的遇难，成为人类挑战自然极限历程中一次沉痛的损失，但其无畏的探索精神，依然照亮着后来者的征途。珠穆朗玛峰的顶峰，仍在静静等待下一位征服者的到来。" 