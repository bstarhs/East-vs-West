 nep.1.t:0 "特里布汶国王出逃！" #印度控制 尼泊尔是中立主义且有国家精神Lhana
 nep.1.d:0 "昨天，尼泊尔国王特里布汶在野外狩猎时，突然改变路线前往印度驻加德满都使馆并请求“政治避难”。自1846年以来，尼泊尔实权实际上处于拉纳家族控制之下，君主成为有名无实的傀儡。人们纷纷猜测特里布汶国王此举意在推翻拉纳家族，夺取国家大权。"
 nep.1.a:0 "有意思。" #触发特里布汶请求避难和国民大会党组织政权 成为尼泊尔中立领导人

 nep.2.t:0 "特里布汶国王请求避难！" #tag = IND
 nep.2.d:0 "昨天，尼泊尔国王特里布汶在野外狩猎时，突然改变路线前往印度驻加德满都使馆并请求“政治避难”。自1846年以来，尼泊尔实权实际上处于拉纳家族控制之下，君主成为有名无实的傀儡。人们纷纷猜测特里布汶国王此举意在推翻拉纳家族，夺取国家大权。我们是否接受？"
 nep.2.a:0 "我们当然欢迎。" #触发印度向尼泊尔试压
 nep.2.b:0 "与我们无关。" #触发特里布汶被迫回国

 nep.3.t:0 "尼泊尔国民大会党组织临时政府"
 nep.3.d:0 "就在拉纳当局对国王出逃惊慌失措时，印度最大的资产阶级民主政党——国民大会党在南部德赖地区组织了临时政府，要求当局结束落后的专制统治，实行宪政改革。"
 nep.3.a:0 "确定。" #尼泊尔国家凝聚力-5% 民主支持率+12%

 nep.4.t:0 "特里布汶国王被迫回国"
 nep.4.d:0 "特里布汶国王向印度求援的计划最终落空，后者拒绝了他的避难请求。失落的国王在印度保护下回到加德满都，当局立即将他软禁在王宫中禁止其出门。"
 nep.4.a:0 "确定。" #尼泊尔国家凝聚力-15% 

 nep.5.t:0 "印度向尼泊尔试压" tag = NEP
 nep.5.d:0 "在印度的庇护下，特里布汶国王成功地乘飞机抵达德里。随后印政府向尼政府施压，要求其和平解决国内争端。"
 nep.5.a:0 "接受。" #尼泊尔国家凝聚力+15% #触发特里布汶国王回国
 nep.5.b:0 "拒绝。" #尼泊尔国家凝聚力-10% #触发尼泊尔内战 

 nep.6.t:0 "特里布汶回到尼泊尔" #印度向尼泊尔试压事件触发 或尼泊尔内战民主主义胜利
 nep.6.d:0 "在国内外反对声音的压力下，拉纳家族最终决定终止其对尼泊尔长达数年的统治，让出首相位置。特里布汶风尘仆仆地回到了自己的宫殿，宣布尼泊尔以及结束了与世隔绝的历史，将进入新的政治建设时期。"
 nep.6.a:0 "接受。" #尼泊尔国家凝聚力+15% 删除Lhana精神
 
