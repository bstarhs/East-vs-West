l_simp_chinese:
 BRA_the_effect_with_immediate:0"\n§Y效果已经被触发§!"
 BRA_the_effect_with_days_country_event:0"\n§Y1095天§! 后触发事件 §Y“迁都巴西利亚”§!"
 
 bra.1.t:0 "Election in 1951"
 bra.1.a:0 "让瓦加斯先生再次领导我们的国家！"
 bra.1.b:0 "戈麦斯元帅适合成为新的领袖。"
 
 bra.2.t:0 "托涅雷洛事件"
 bra.2.d:0 "昨天上午，里约热内卢的托涅雷洛大街发生了令人震惊的事件：鲁本斯·瓦兹少校企图谋杀巴西反对党领袖，瓦加斯总统的对手卡洛斯·拉塞尔达时被警方击毙，舆论普遍认为瓦加斯总统指使了这次刺杀。军队将领要求瓦加斯引咎辞职。"
 bra.2.a:0 "无稽之谈！"
 bra.2.b:0 "让瓦加斯下台！"
 
 bra.3.t:0 "巴西爆发政变！"
 bra.3.d:0 "瓦加斯拒绝为托涅雷洛事件负责的行为激怒了军队，他们组织武装在里约热内卢发动政变，冲入了总统府。大势已去的瓦加斯总统在留下遗书后开枪自杀，副总统若昂·卡费·菲略接替他的职位。"
 bra.3.a:0 "确定。"
 
 bra.4.t:0 "巴西爆发政变！"
 bra.4.d:0 "瓦加斯拒绝为托涅雷洛事件负责的行为激怒了军队，他们组织武装在里约热内卢发动政变，但是很快被忠于总统的武装力量击退。瓦加斯宣布里约进入戒严状态，策动政变的将领被逮捕。"
 bra.4.a:0 "有惊无险。"
 
 bra.5.t:0 "若昂·卡费·菲略辞职"
 bra.5.d:0 "若昂·卡费·菲略接替总统职位不久后，身体状况开始恶化。昨日他向议会发出申请，以身体为由请求辞去职。经过审议，他的请求最终被同意。议院议长卡洛斯·卢斯接替总统职位。"
 bra.5.a:0 "确定。"
 
 bra.6.t:0 "卡洛斯·卢斯被弹劾"
 bra.6.d:0 "国防部长恩里克·洛特向议会提出了要求弹劾总统卡洛斯·卢斯的提议，他指责卡洛斯阴谋阻挠1955总统大选的候选人儒塞利诺·库比契克参与选举。最终，继任仅仅三天的卡洛斯·卢斯被议会弹劾，众议院领袖内雷乌·拉莫斯接替总统职位。"
 bra.6.a:0 "多事之秋。"
 
 bra.7.t:0 "巴西总统大选"
 bra.7.2.d:0 "新一届巴西总统选举开始。已经73岁高龄的现总统瓦加斯决定放弃连任机会。来自社会民主党的洛奥里桑特州州长儒塞利诺·库比契克和来自国家民主联盟的胡亚雷斯·塔沃拉将军进行竞争。"
 bra.7.1.d:0 "内雷乌·拉莫斯完成了原本属于瓦加斯总统的任期，新一届总统大选开始。来自社会民主党的洛奥里桑特州州长儒塞利诺·库比契克和来自国家民主联盟的胡亚雷斯·塔沃拉将军进行竞争。"
 bra.7.a:0 "确定。"
 bra.7.b:0 "确定。"
 
 bra.8.t:0 "儒塞利诺的发展计划"
 bra.8.d:0 "儒塞利诺在担任洛奥里桑特市市长时，曾大力推动当地经济发展。现在他已经成为总统，准备将他的改革计划推广到全国，内容包括大力发展交通、教育和重工业等。"
 bra.8.a:0 "我们应当大力支持！"
 bra.8.b:0 "多此一举。"
 
 bra.9.t:0 "建造巴西利亚"
 bra.9.d:0 "儒塞利诺提出了一项大胆的建设计划——为了加快内地发展、扩大内需和远离保守势力盘踞的里约，他决定在中央高地建设一座新的城市，作为新的首都。"
 bra.9.a:0 "我们应当大力支持！"
 bra.9.b:0 "多此一举。"
 
 bra.10.t:0 "儒塞利诺·库比契克当选巴西总统！"
 bra.10.d:0 "来自社会民主党的洛奥里桑特州州长儒塞利诺·库比契克赢得巴西总统大选的多数选票，当选巴西总统！库比契克曾是前总统热图利奥·瓦加斯的支持者，同时也是一名工业主义和发展主义的拥趸，在他任州长期间，致力于加快工业建设。/n库比契克在就任仪式上宣布，他将推出一系列的高速发展计划，以加快巴西的现代化发展。巴西将用五年完成五十年的进步！"
 bra.10.a:0 "太棒了！"
 bra.10.b:0 "多此一举。"
 
 bra.11.t:0 "迁都巴西利亚"
 bra.11.d:0 "在经历三年的建造开发之后，一座崭新的、美丽的、现代化的都市终于在巴西中央高地拔地而起，她被命名为“巴西利亚”，成为了巴西共和国新的行政首都。"
 bra.11.a:0 "太棒了！"
 
 bra.12.t:0 "1961大选"
 bra.12.d:0 "库比契克总统在完成自己的第一次任期后希望取得连任，他的对手是来自社会党的民众主义者若昂·古拉特。"
 bra.12.a:0 "库比契克先生应当继续领导我们的国家。"
 bra.12.b:0 "古拉特先生会带领我们走出贫困。"
 
 bra.14.t:0 "军事政变！"
 bra.14.d:0 "古拉特总统激进的改革和言论令上层社会感到不安，且激怒了军方。几架坦克冲入了巴西利亚的国会大楼，宣布古拉特已经被废黜，军方接管政权。"
 bra.14.a:0 "多事之秋。"
 
 bra.16.t:0 "新的总统"
 bra.16.d:0 "巴西军方宣布，阿图尔·达科斯达·席尔瓦将军将接替卡斯特略·布朗库，成为巴西军政府的新任领导人。"
 bra.16.a:0 "确定。"
 
 bra.18.t:0 "新的总统"
 bra.18.d:0 "巴西军方宣布，埃米利奥·加拉斯塔苏·梅迪西将军将接替阿图尔·达科斯达·席尔瓦，成为巴西军政府的新任领导人。"
 bra.18.a:0 "确定。"
 
 bra.30.t:0 "热图利奥·瓦加斯再次当选巴西总统！"
 
 bra.31.t:0 "热图利奥·瓦加斯宣布辞职！"
 
 bra.32.t:0 "若昂·古拉特接任总统！"
 
 bra.33.t:0 "总统会见切格瓦拉！"