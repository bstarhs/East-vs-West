l_simp_chinese:
 per.1.t:0 "波斯帝国成立2500年庆典"
 per.1.d:0 "为了庆祝波斯帝国成立2500年，伊朗国王礼萨·巴列维将在波斯帝国曾经的首都波斯波利斯举办宏大的庆典，届时将邀请世界各国政府代表出席。巴列维此举不仅在于提高伊朗的国际形象和地位，也试图争取民众支持，但在底层群众看来，这个庆典不过证明了国王的奢侈腐败。"
 
 per.2.t:0 "穆罕默德·摩萨德就任总理"
 per.2.d:0 "民族主义在穆罕默德·摩萨德将出任伊朗政府总理，此举引起了西方国家的警惕，因为摩萨德致力于排除西方国家在伊朗的势力，尤其是在石油股权上。"
 
 per.3.t:0 "伊朗石油国有化"
 per.3.d:0 "伊朗政府宣布，他们已经决定将与西方合资的伊朗石油公司完全国有化，剔除外国资本，将石油收入完全收归国有。"
 
 per.4.t:0 "伊朗石油国有化"
 per.4.d:0 "伊朗政府宣布，他们已经决定将与西方合资的伊朗石油公司完全国有化，剔除外国资本，将石油收入完全收归国有。我们如何应对？"
 
 per.5.t:0 "伊朗爆发政变"
 per.5.d:0 "反对摩萨台的暴徒袭击总理府并扣押了摩萨台，随后伊朗亲君主的军方宣布接管政权，伊朗总理摩萨台被迫辞职并遭软禁。"
 
 per.6.t:0 "伊朗爆发政治变动！"
 
 per.7.t:0 "伊朗内战！"
 per.7.d:0 "伊朗国王镇压人民的行为最终彻底点燃了群众的怒火，反对国王的起义者和倒戈的军方向德黑兰进军，伊朗已经陷入全面内战当中！"
 
 per.8.t:0 "游行示威!"
 per.8.d:0 "巴列维国王的倒施逆行已经让伊朗人民积累的愤怒终于爆发！全国各大城市都出现了示威游行！人群高喊打倒沙阿的口号，学生、工人乃至军方都参与了反对运动！我们应该怎么办？"
 per.8.a:0 "沙阿失败了，他必须离开伊朗"
 per.8.b:0 "镇压暴徒！"
 
 per.9.t:0 "伊朗宪政改革"
 
 per.10.t:0 "伊朗宪法颁布"
 
 per.11.t:0 "巴列维国王离开伊朗!"
 per.11.d:0 "伊朗国王礼萨·巴列维最终屈服于人民的怒火，仓惶逃出德黑兰前往伊朗，统治伊朗五十多年的巴列维王朝宣告终结。"
 
 per.12.t:0 "伊朗的未来"
 per.12.a:0 "伟大的阿亚图拉·霍梅尼伊玛目将领导我们回到真主的道路。"
 per.12.b:0 "民主和社会主义才能拯救伊朗。"
 
 per.13.t:0 "石油危机"
 
 per.14.t:0 "示威者围攻大使馆！"
 
