 per.16.t:0 "来自伊朗的回应"
 
 per.17.t:0 "美国接受我方要求"
 
 per.18.t:0 "人质被释放"
 
 per.19.t:0 "美国拒绝我们的要求！"
 
 per.20.t:0 "人质遇害！"
 
