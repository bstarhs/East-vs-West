 per.24.t:0 "伊朗同意"
 
 per.25.t:0 "伊朗门丑闻！"
 
 per.26.t:0 "IR655班机空难"
 
 per.27.t:0 "伊朗伊斯兰共和国成立！"
 per.27.d:0 "伊朗选举得到了毫无悬念的结果，阿亚图拉·霍梅尼领导的伊斯兰党赢得了选举，宣布成立伊斯兰共和国，这将是现代世界第一个实行政教合一的共和政权。霍梅尼承诺伊斯兰共和国将使伊朗的政治生活回到伊斯兰主导之下，实现真正的和平与民主，但外界普遍认为伊斯兰共和国不过是另一种形式的独裁政权。"
 
 per.28.t:0 "伊朗共和国成立！"
 per.28.d:0 "经过激烈的角逐，伊朗民主运动领袖阿布哈桑·巴尼萨德尔领导下的共和党赢得大选，成为了伊朗第一届民主政府的总统。大阿亚图拉·霍梅尼主张的伊斯兰共和国未能如期实现，但其承认选举结果，并保留了议员席位。"
 
 per.30.t:0 "霍梅尼去世"
 
 per.40.t:0 "阿塞拜疆人民政府沦亡"
 per.40.d:0 "随着伊朗军队占领大不里士，苏联在伊朗西北部扶持成立的阿塞拜疆人民政府灭亡，其领导人大部分逃亡，或被伊朗政府逮捕。"
 per.40.a:0 "共产主义在中东的失败尝试"
 
 per.51.t:0 "来自英美的抗议"
 
 per.52.t:0 "伊朗取消石油国有化进程"
 
 per.53.t:0 "伊朗无视我们的警告"
 
 per.54.t:0 "暴徒袭击总理府"
 per.54.d:0 "一群暴徒突然袭击了总理府，要求总理摩萨台辞职！"
 
 per.55.t:0 "巴列维国王返回伊朗"
 
 
 per.100.t:0 "[FROM.GetName]策划对伊朗开战"
 
 per.101.t:0 "波斯湾战争！"
 per.101.d:0 "由于拒绝伊朗政府强制收回伊朗石油的主权，英国与以色列已出动军队入侵伊朗！"
 
 per.102.t:0 "来自[FROM.GetName]的警告"
 per.102.d:0 "[FROM.GetName]对我们军事介入波斯湾问题的行为非常不满，他们已经在联合国提出决议，要求我们撤出伊朗。"
 
 per.103.t:0 "[ROOT.GetName]撤出伊朗"
 per.103.d:0 "在联合国和美苏的压力下，[ROOT.GetName]被迫撤离伊朗，这标志着[ROOT.GetName]试图维持其在中东政治存在行动的失败，也标志着其殖民帝国的崩塌。"
 
 per.104.t:0 "[PER.GetName]请求加入中央条约组织"
 per.104.d:0 "[PER.GetName]外交部向我们发来信息，希望能加入中央条约组织。"
 
 per.105.t:0 "英国拒绝我们加入中央条约组织"
 per.105.d:0 "英国拒绝我们加入中央条约组织"
 
 per.106.t:0 "伊朗寻求与[ROOT.GetName]改善关系"
 per.106.d:0 "伊朗外交部门宣称，该国正寻求与[ROOT.GetName]改善外交关系"
 
 per.107.t:0 "伊朗伊斯兰党的崛起"
 per.107.d:0 "随着伊朗进行政治改革以转向政治多元化，许多政党开始壮大并积极参与政治。伊朗伊斯兰党在最近的政治局势中迅速崛起，他们是一支由保守派知识分子组成的保守政党，他们认为伊朗未来的政治道路应当遵循《古兰经》的原则，反对社会和经济的过度改革。领导人库特布认为，伊朗只有坚持伊斯兰教的教义，优先追群稳定，反对共产主义和自由主义的渗透。才能在两级对抗中保护自己。"
 
 per.108.t:0 "伊朗复兴党成立"
 per.108.d:0 "随着伊朗进行政治改革以转向政治多元化，许多政党开始壮大并积极参与政治。华夫脱党在最近的政治局势中迅速崛起，该党是伊朗最早创立的政党之一，党名Waft意为“组织”。该党派由社会精英阶层组成，其中大部分是旧王国时代的权贵。华夫脱党支持实行君主立宪制度，抑或稳步走向共和制，并维持现有的政治局面，从而保证国家在稳定中走向现代化，"
 
 per.109.t:0 "伊斯兰党赢得伊朗议会选举！"
 per.109.d:0 "随着伊朗大选落幕，伊斯兰党赢得了伊朗议会的选举！"
 
 per.110.t:0 "复兴党赢得伊朗议会选举！"
 per.110.d:0 "随着伊朗大选落幕，华夫脱党赢得了伊朗议会的选举！"

 per.111.t:0 "伊朗宣布进行君主立宪改革"
 per.111.d:0 "伊朗政府正式宣布，即将颁布新宪法，以改革君主立宪制度。新的伊朗宪法将加强议会和内阁的权力，进行更广泛的民主选举，并限制国王的权力。"
 
 per.112.t:0 "巴列维国王宣布退位"
 per.112.d:0 "伊朗政治局势日渐复杂，法鲁克一世国王在各个政治势力压力下，被迫正式宣布退位。"
 
 per.113.t:0 "巴列维三世即位"
 per.113.d:0 "在伊朗国王法鲁克一世退位后，年轻的巴列维三世即位，伊朗摄政委员会宣布接管权力。"
 
 per.114.t:0 "伊朗民族阵线的崛起"
 per.114.d:0 "随着伊朗进行政治改革以转向政治多元化，许多政党开始壮大并积极参与政治。伊朗民族阵线在最近的政治局势中迅速崛起，该党是由受到民族主义影响的精英阶级组成，他们主张反对西方帝国主义和苏联共产主义的干涉，反对君主制，促使国家走向现代化和世俗化。"
 
 per.115.t:0 "伊朗宣布支持[ROOT.GetName]革命"
 per.115.d:0 "[PER.GetName]已发表公开声明，正式宣布支持[ROOT.GetName]国热火朝天的社会主义革命。德黑兰方面表示，该国将为反对帝国主义殖民统治的[ROOT.GetName]人民提供必要的援助。"
 
 per.116.t:0 "伊朗政府表态批判君主制！"
 per.116.d:0 "[PER.GetLeader]发表措辞严厉的声明，指责其他阿拉伯国家中的君主制政权敌视且试图颠覆新生的共和国政权。[PER.GetLeader]领导人指出，君主制与君主已成为出卖阿拉伯人民利益的叛徒集团和帝国主义的傀儡，呼吁阿拉伯各国人民站起来推翻君主制度。"
 
 per.117.t:0 "伊朗政府宣布进行文字改革"
 per.117.d:0 "[PER.GetLeader]发表声明，表态支持阿拉伯国家中不断壮大的共和主义革命。[PER.GetLeader]领导人指出，君主制与君主已成为出卖阿拉伯人民利益的叛徒集团和帝国主义的傀儡，呼吁阿拉伯各国人民站起来推翻君主制度。"
 
 per.118.t:0 "伊朗政府推行新的文化政策"
 per.118.d:0 "[PER.GetLeader]宣布，该国已决定推行新的文化政策，以引导该全国人民认同波斯文化。"
 
 per.119.t:0 "伊朗政府推行新的语言政策"
 per.119.d:0 "[PER.GetLeader]宣布，该国已决定推行新的语言政策，波斯语和波斯文将成为该国唯一的官方语言，而库尔德人、亚美尼亚人和阿拉伯人的语言文化将被从教育和行政中剔除。"
 
 per.120.t:0 "伊朗政府推行新的宗教政策"
 per.120.d:0 "[PER.GetLeader]宣布，该国已决定推行新的宗教政策，什叶派教的教义和思想将被纳入全国的教育和社会体系，而基督教和逊尼派将被打压。"
 
 per.121.t:0 "伊朗政府表态支持[ROOT.GetName]共和派！"
 per.121.d:0 "[PER.GetLeader]发表声明，表态支持[ROOT.GetName]不断壮大的共和主义革命。[PER.GetName]领导人指出，君主制与君主已成为出卖阿拉伯人民利益的叛徒集团和帝国主义的傀儡，呼吁[ROOT.GetName]人民站起来推翻君主制度。"
 
 per.122.t:0 "[FROM.GetName]宣布支持土耳其库尔德武装"
 per.122.d:0 "[FROM.GetName]已发表公开声明，正式宣布支持土耳其境内的库尔德人武装团体。德黑兰方面表示，该国将为反对土耳其统治的库尔德人民提供军事援助。"
 
 per.123.t:0 "[FROM.GetName]宣布支持巴勒斯坦圣战组织"
 per.123.d:0 "[PER.GetLeader]发表声明，表态支持不断壮大的巴勒斯坦圣战组织。[PER.GetLeader]领导人指出，该国将为反对锡安主义统治的巴勒斯坦人民提供必要的援助。"
 
 per.124.t:0 "伊朗伊斯兰党组建政府"
 per.124.d:0 "伊斯兰党在伊朗政府中的影响力不断扩大，已经完全把握了伊朗的政权。近日，伊朗政府进行改组，伊斯兰党正式获得了组阁权。"
 
