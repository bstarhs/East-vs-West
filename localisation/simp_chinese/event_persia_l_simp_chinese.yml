 per.141.t:0 "警惕共产主义在伊朗的影响力"
 per.141.d:0 "伊朗的政治斗争以共产党的胜利结束，这给阿拉伯国家敲响警钟，共产党的势力在中东的不断扩大已经威胁到了我们的利益，而他们夺取伊朗政权，意味着他们将继续扩大，这对我们来说是不可接受的，我们的外交和情报部门要求我们尽快进行干涉。"
 
