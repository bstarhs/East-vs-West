l_simp_chinese:
 ven.5.t:0 "委内瑞拉爆发军事政变！"
 
 
 ven.30.t:0 "委内瑞拉发生未遂政变"
 ven.30.d:0 "委内瑞拉空军战斗机在苏醒的加拉加斯上空翱翔，试图向总统府发起攻击，但却以失败告终。\n这是一个敏感的信号，意味着马科斯·佩雷斯·希门尼斯将军统治下的委内瑞拉军政府内部出现了反对者。"
 
 ven.31.t:0 "对军政府的日益不满"
 ven.31.d:0 "马科斯·佩雷斯·希门尼斯将军领导下的委内瑞拉军政府不仅没有达成他们上台之初的承诺，没能推进委内瑞拉民主化和经济的发展，相反，当局的腐败和独裁问题愈发严重。委内瑞拉民间对军政府的不满情绪不断恶化。"
 
 ven.32.t:0 "委内瑞拉反动派掀起反对活动"
 ven.32.d:0 "反对委内瑞拉军政府的政治运动继续发酵。\n作曲家阿隆·科普兰执导的《林肯画像》演出期间。女演员胡安娜·苏乔在佩雷斯·希门尼斯的陪同下朗读了西班牙语译文。演出接近尾声时，当苏乔引用葛底斯堡演说的歌词时，观众为她欢呼，并开始大声反对总统，声音之大，以至于科普兰都听不到音乐。"
 
 ven.33.t:0 "加拉加斯爆发大规模示威游行！"
 ven.33.d:0 "马科斯·佩雷斯·希门尼斯将军领导下的委内瑞拉军政府不仅没有达成他们上台之初的承诺，没能推进委内瑞拉民主化和经济的发展，相反，当局的腐败和独裁问题愈发严重。委内瑞拉民间对军政府的不满情绪不断恶化。"
 
 ven.34.t:0 "示威者包围总统府"
 ven.34.d:0 "愤怒的示威人群包围了加拉加斯总统府，要求马科斯·佩雷斯·希门尼斯辞职下台！"
 
 ven.35.t:0 "教会呼吁军方辞职！"
 ven.35.d:0 "天主教会致信，要求马科斯·佩雷斯·希门尼斯辞职下台！"
 
 ven.36.t:0 "军方内部的兵谏"
 ven.36.d:0 "军方内部的反对派致信，要求马科斯·佩雷斯·希门尼斯辞职下台！"
 
 ven.37.t:0 "委内瑞拉政治变动"
 ven.37.d:0 "委内瑞拉爆发的政治动荡，以马科斯·佩雷斯·希门尼斯将军在民众、教会及军方内部反对派压力下，宣布辞职下台告终。希门尼斯乘飞机逃亡多米尼加。委内瑞拉军方宣布成立以海军上将沃尔夫冈·拉拉扎巴尔为首的过度军政府，处理委内瑞拉政治民主化的问题。"
 
 ven.40.t:0 "委内瑞拉公开支持古巴革命"
 ven.40.d:0 "委内瑞拉军政府的新任领导人沃尔夫冈·拉拉扎巴尔公开表示，其本人对菲德尔·卡斯特罗领导下的古巴革命军十分赞赏和同情，他表示，愿意为古巴革命者提供力所能及的帮助。委内瑞拉将为遭到巴蒂斯塔政府通缉的异见人士提供庇护。\n沃尔夫冈·拉拉扎巴尔表示：我觉得我们的爱国主义是另一种共产主义。由于他深厚的爱国传统，没有一个委内瑞拉人会接受来自国外的命令。"
 
 ven.41.t:0 "理查德·尼克松访问委内瑞拉"
 ven.41.d:0 "自从委内瑞拉发生政变后，美国政府内对新任总统沃尔夫冈·拉拉扎巴尔的态度就发生了分裂。有人认为拉拉扎巴尔将延续亲美政策，也有人认为拉拉扎巴尔可能是一位民粹主义领导人，有接近苏联的危险。\n预期空有怀疑，不如一探虚实。美国副总统理查德·尼克松于今天早上抵达加拉加斯，开始对委内瑞拉的正式访问。沃尔夫冈·拉拉扎巴尔总统在机场接待了尼克松一行。\n在总统府的晚宴上，尼克松对委内瑞拉军政官员大谈反对苏联扩张的重要性，尤其是警惕正在发生的古巴革命，而拉拉扎巴尔不以为然，他对尼克松表示，拉丁美洲国家的内政主权应该得到尊重。\n晚宴结束后，尼克松将乘车前往下榻的酒店。"
 ven.41.a:0 "副总统先生，车已经准备好了。"
 
 ven.42.t:0 "尼克松在委内瑞拉遭到袭击！"
 ven.42.d:0 "来自加拉加斯的突发消息！\n美国副总统理查德·尼克松的车队在委内瑞拉加拉加斯遭到暴徒袭击。尼克松在向解放者西蒙·玻利瓦尔的陵墓敬献花圈后，乘车离开时，数百名愤怒的群众涌向车队，向尼克松抗议美国政府对前独裁者马科斯·希门尼斯的庇护。事态很快向暴力发展，人群开始向尼克松的汽车投掷石头，右侧副驾驶挡风玻璃被击碎。委内瑞拉军警好不容易才驱散人群，使得尼克松得以逃离现场。\n美国政府愤怒地指责委内瑞拉没有保护好美国副总统，并认为委内瑞拉共产党指使了这次袭击，华盛顿要求委内瑞拉政府严肃处理此事。"
 
 ven.43.t:0 "美国人要求我们严惩凶手！"
 ven.43.d:0 "美国人对尼克松遇刺一事大为愤怒！美国政府要求我们严惩凶手！"
 
 ven.44.t:0 "委内瑞拉政府判处刺客终身监禁！"
 ven.44.d:0 "委内瑞拉政府逮捕了多名试图向尼克松座驾发起攻击的示威者，其中一名投掷石头打碎轿车玻璃的暴徒被判处终身监禁。\n委内瑞拉政府宣布，一切破坏美国与委内瑞拉关系的暴徒都将受到严厉的惩罚，并希望美国政府不要迁怒于委内瑞拉人民。委内瑞拉共产党对当局的软弱大为不满。"
 
 ven.45.t:0 "委内瑞拉刺客仅被判处一年监禁！"
 ven.45.d:0 "尽管美国施加了强大的外交压力，但委内瑞拉仅仅逮捕了不到十名袭击尼克松车队的示威者，其中只有一人被判处一年监禁。美国政府勃然大怒，斥责委内瑞拉纵容暴徒及其背后的共产党势力，美委关系急剧恶化。"
 
 ven.46.t:0 "委内瑞拉的未来"
 ven.46.d:0 "独裁者希门尼斯下台后建立的军政府，至今已执政一年，过度时期即将结束，委内瑞拉的未来，走到了十字路口。\n军政府领导人拉拉扎巴尔将军、民主行动党领导人贝坦柯尔特齐聚总统府，就国家大事进行详谈，大家希望委内瑞拉的的所有政党和政治势力达成共识：确认并保卫委内瑞拉的民主制度，使其成为国家的基本制度，让独裁无法再卷土重来。"
 
 ven.47.t:0 "委内瑞拉各党派达成民主化共识！"
 ven.47.d:0 "委内瑞拉军政府领导人拉拉扎巴尔将军、委内瑞拉民主进步联盟的拉斐尔·卡尔德拉、民主行动党领导人罗慕洛·贝坦科尔特齐聚总统府，经过谈判和妥协，委内瑞拉的的所有政党和政治势力达成共识：确认并保卫委内瑞拉的民主制度，使其成为国家的基本制度，让独裁无法再卷土重来。"
 
 ven.48.t:0 "委内瑞拉政局的迷茫"
 
 
 ven.49.t:0 "委内瑞拉总统大选即将开始！"
 ven.49.t:0 "委内瑞拉总统大选即将开始，民主行动党领导人罗慕洛·贝坦科尔特将对阵获得委内瑞拉共产党支持的沃尔夫冈·拉拉扎巴尔。"
 
 ven.50.t:0 "罗慕洛·贝坦科尔特当选委内瑞拉总统！"
 ven.50.d:0 "民主行动党领导人罗慕洛·贝坦科尔特击败沃尔夫冈·拉拉扎巴尔，赢得委内瑞拉总统大选的多数票！贝坦科尔特将就任新任委内瑞拉总统。贝坦科尔特承诺将进行更多的民主和经济改革，继续保持与美国的关系。\n委内瑞拉共产党支持的拉拉扎巴尔遗憾未能获选，拉拉扎巴尔本人接受了失败，但苏联支持下的委内瑞拉共产党对此大为不满。"
 
 ven.51.t:0 "拉拉扎巴尔当选委内瑞拉总统！"
 ven.51.d:0 "获得委内瑞拉共产党支持的沃尔夫冈·拉拉扎巴尔击败民主行动党的罗慕洛·贝坦科尔特，赢得委内瑞拉总统大选的多数票！拉拉扎巴尔将从临时军政府领导人，就任正式的委内瑞拉总统。拉拉扎巴尔承诺将进行更多的民主和经济改革，尤其是推动土地改革和国有化，并加强与第三世界的外交关系。\n尽管贝坦科尔特本人接受了选举失败，但委内瑞拉的精英阶层对此大为不满。"
 
 ven.52.t:0 "美国撤离驻委内瑞拉大使！"
 ven.52.d:0 "美国政府对拉拉扎巴尔及委内瑞拉共产党赢得大选极为愤怒！美国政府召回驻加拉加斯的大使，并指责新政府是共产党伸向西半球的傀儡！"