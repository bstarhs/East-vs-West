 usatext.220.t:0 "亚利桑那州大峡谷发生严重空难！"
 usatext.220.d:0 "来自美国洛杉矶的消息！一架隶属联合航空的道格拉斯DC-7客机和一架隶属环球航空的L-1049超级星客机在亚利桑那州大峡谷地区失踪，今天早上，经过搜寻，两家失事客机的残骸已被找到，机上合计128人已全部遇难。这起严重的空难是世界上第一起遇难人数超过一百的空中浩劫，引起了美国舆论的关注。目前美国政府已启动调查程序。"
 
 usatext.221.t:0 "美国法院逮捕Oleta Yates等美共党员"
 usatext.221.d:0 "来自加利福尼亚的消息，Oleta Yates等14名美国共产党员遭美国政府逮捕，他们被指控违反《史密斯法案》。《史密斯法案》规定，倡导或组织以武力摧毁或推翻任何美国政府的行为均属违法，在美国政府支持麦卡锡主义的背景下，这些共产党员因为宣传社会主义而被认为试图推翻美国的现有政治制度，"
 
 usatext.222.t:0 "Oleta Yates案件初审判决"
 usatext.222.d:0 "加利福尼亚州法院裁定，Oleta Yates等14名美国共产党员在美国宣传社会主义的行为，违背了《史密斯法案》，是试图颠覆美国政府的叛国罪。美国共产党代表不服上诉，他们的代理律师认为，共产党从事的是消极的政治活动，任何违反《史密斯法案》的行为都必须涉及积极推翻政府的企图。"
 
 usatext.223.t:0 "Oleta Yates案终审判决即将举行"
 usatext.223.d:0 "Oleta Yates案件今日在美国最高法院开庭审理。"
 
 usatext.224.t:0 "Oleta Yates被判无罪"
 usatext.224.d:0 "美国最高法院正式宣布，Oleta Yates等14名美国共产党员无罪，大法官们以6比1的投票结果推翻了这些定罪，认为美国共产党并没有采取激进的实际行动推翻美国政府，因此不违背《史密斯法案》。\n联邦调查局局长埃德加·胡佛对审判结果大为不满，认为这是美国共产党有史以来取得的最大的胜利，而记者I.F.斯通认为，这一天将作为最高法院挫败猎巫行动的一天载入史册。"
 
 usatext.225.t:0 "Oleta Yates被判颠覆罪！"
 usatext.225.d:0 "在以埃德加·胡佛为首的强硬派压力下，美国最高法院正式宣布，Oleta Yates等14名美国共产党员图谋美国政府，根据《史密斯法案》判处叛国罪。\n这一判决结果引起了美国社会各界和国际舆论的一片哗然，美国许多媒体认为这一判决是麦卡锡主义侵犯公民言论自由的体现。猎巫风波正在恶化，"
 
 usatext.226.t:0 "阿拉斯加精神健康法案"
 usatext.226.d:0 "阿拉斯加州参议院鲍勃·巴特利特先生提出，阿拉斯加至今缺少足够的医院和卫生设施，为精神疾病患者提供治疗，参议院向美国国会提交了《阿拉斯加精神健康法案》，希望华盛顿拨款帮助阿拉斯加成立相关机构。"
 
