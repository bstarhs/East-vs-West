 usatext.350.t:0 "IBM公司推出新款商用计算机"
 usatext.350.d:0 "美国IBM公司成功研发出世界上首款商用的晶体管计算机——IBM 1401，晶体管的使用成功让计算机的体积大为缩小，从而让计算机投入民用成为可能。\nIBM 1401采用了许多首次在计算机上应用的新技术，包括磁带储存、打孔卡读取和针孔打印，计算机由一台读卡打孔机、一台储存单元、一台磁盘单元、一台查询机、一台处理单元、两台磁盘机和一台打印机组成，用户可以通过将信息通过打孔卡录入到计算机中，然后计算机将会根据信息进行计算、分析等工作，并讲信息录入到磁带中储存。\nIBM 1401的出现标志着计算机不再是高不可攀的高端科技，他将有机会更多的为民用工作服务，IBM已接受了来自美国多家政府部门和银行的订单，将为他们提供计算机以用于资料储存和信息计算服务。"
 
 usatext.351.t:0 "黛西……黛西……"
 usatext.351.d:0 "在IBM公司的实验室内，计算机工程师们正在使用IBM 7094晶体管计算机测试世界上首个电子声音合成程序。经过多次调试后，声音信息被计算机传输到音响当中……\n\nDaisy, Daisy,Give me your answer, do!\nI'm half crazy,All for the love of you!\nIt won't be a stylish marriage,I can't afford a carriage\nBut you'll look sweet upon the seat,Of a bicycle built for two!"
 
 
 
 usatext.355.t:0 "美国民权委员会成立"
 
 usatext.356.t:0 "美国南方发起反对民权改革的大规模抵抗！"
 usatext.356.d:0 "弗吉尼亚州长今日联合南方六州政客，在里士满宣布启动"大规模抵抗运动"，公然抵制联邦最高法院关于废除种族隔离的判决。这场以"关闭学校优于混合种族"为口号的运动，已导致该州三所公立学校停课，三千余名白人学生被迫转入私立教会学校。\n弗吉尼亚州长托马斯·B·斯坦利在记者会上挥舞着州权宣言，声称"南方的生活方式不容破坏"。其支持者在州议会台阶当众焚毁最高法院判例汇编，参议员伯德更扬言"不惜动用国民警卫队阻止黑人入学"。\n白宫发言人拒绝评论总统立场。这场宪法危机正持续升级，南卡罗来纳州议会今日通过决议，授权州长可宣布进入"种族紧急状态"。"
 
 usatext.357.t:0 "弗吉尼亚州授权州长关闭学校！"
 usatext.357.d:0 "弗吉尼亚、密西西比与阿拉巴马三州议会今日联合成立"州权委员会"，系统性阻挠学校种族融合。该机构被授权监督各地学区，对执行联邦法令的教育官员实施撤职处罚。\n弗吉尼亚州法院今晨作出争议判决，宣布州长有权关闭任何接收黑人学生的公立学校。诺福克市已有五所中学接到关闭通知，上万名学生突失就学场所。在里士满，白人选民组成"校园巡逻队"封锁校门，与举着宪法第十四修正案的黑人家长形成对峙。\n与此同时，密西西比州议会正起草《跨种族就读禁令》，拟对接收黑白混读学生的教师判处藐视法庭罪。"
 
 usatext.358.t:0 "美国政府首次提出更新民权法案！"
 usatext.358.d:0 "在美国最高法院正式作出在教育系统中废除种族隔离的决定后，美国民权运动进入到了一个新的阶段。美国的有色人种不仅要求获得社会制度和教育上的公平，还希望将这种公平和反歧视加以法律保障。有鉴于此，美国总统[USA.GetLeader]在今天的讲话中正式宣布，加强保护非裔美国人投票权的法案，以平息要求进行更深远改革的呼声。\n立法保护有色人种权益的法案一经提出，立刻引起美国社会与国会两党的广泛关注和讨论。民主党参议院领袖林登·约翰逊担心此法案会撕裂民主党，因为南方民主党普遍反对民权运动，而北方民主党则支持民权运动。民主党参议员詹姆斯·伊斯特兰、小理查德·拉塞尔谴责该法案侵犯州权和种族纯净。而共和党则虽然也有少部分保守派反对民权运动，但他们乐见民主党因此法案遭受挫折，尤其是副总统尼克松表达了积极的支持。"
 
 usatext.359.t:0 "民权法案之激烈辩论！"
 usatext.359.d:0 "新《民权法案》昨天正式在美国国会进行讨论，各党、各派都对民权法案进行了激烈的争论，其中，来自南卡罗莱纳的民主党参议员，以极端支持种族隔离制度闻名的斯特罗姆·瑟蒙德，为了阻挠民权法案通过，进行了长达整整24小时的冗长辩论。\n晚上8 点54分，瑟蒙德的冗长辩论开始，首先宣读48个州的选举法，然后是宣读美国最高法院的裁决、托克维尔的《论美国的民主》和乔治·华盛顿的告别演说。冗长辩论开始时，参议院议事厅旁听席上挤满了数百名观众，但到了凌晨时分，旁听席上只剩下全国有色人种协进会成员小克拉伦斯·米切尔和瑟蒙德的妻子吉恩。次日上午，瑟蒙德的声音变得含糊不清，语调也变得越来越单调。瑟蒙德于今日晚上9点12分结束了长达24小时18分钟的冗长辩论，成为美国历史上时间最长的国会发言。\n作家约瑟夫·克雷斯皮诺将瑟蒙德的冗长演说描述为“一种泌尿科之谜”。"
 
 usatext.360.t:0 "民权法案的最终裁定"
 usatext.360.d:0 "民权法案将在今天的美国国会正式进行投票表决，眼见无法阻止民权法案，民主党控制下的参议院司法委员会提出了一个妥协方案：安德森-艾肯修正案，删除了​​允许司法部长就公共场所歧视行为提起诉讼的条款，并对任何被控限制个人投票权的人进行陪审团审判。这项新的修正案将使得民权法案的实际力度大打折扣。"
 
 usatext.361.t:0 "民权法案最终通过"
 
 usatext.362.t:0 "民权法案的妥协议案通过"
 usatext.362.d:0 "《民权法案》及其修正案以60票赞成、15票反对的结果获得通过，这将是美国82年来第一部通过的民权法案。为了推动民权法案通过，美国政府最终做出妥协，接受了安德森-艾肯修正案，这意味着尽管新的法案保护黑人投票权并起诉干扰选举程序之人，但对其判罚将由陪审团负责。由白人控制的南方法院陪审团当然不会惩罚任何阻挠黑人投票的破坏者，因此民权法案的实际力度被大大缩小。"
 
 usatext.363.t:0 "尼克松与马丁·路德·金的短暂会面"
 usatext.363.d:0 "在《民权法案》通过立法次日，副总统尼克松于国会办公室接见马丁·路德·金博士。这场四十分钟的会晤中，尼克松赞扬民权领袖"以理性良知推动社会进步"，金牧师则手持法案文本回应："这仅是通向自由的第一级台阶。"\n金指出法案未包含选举权保障条款，且南方各州已开始制定规避法律的对策。他列举亚拉巴马州刚通过的《公共集会管制法》："他们正把种族隔离改头换面成治安条例。"尼克松承诺将成立跨党派监督委员会，但没有就联邦干预作出具体承诺。\n会谈结束后，金在林肯纪念堂对三千群众坦言："没有人能用一支笔抹去三百年伤痕。当金乘坐的车辆驶离国会时，抗议者举着的标语在夕阳下分外刺眼："我们还要等多少个一百年？""
 
 usatext.364.t:0 "美国南方大量学校仍处于关闭状态"
 
 usatext.365.t:0 "爱德华·默罗锐评美国南方状况"
 usatext.365.d:0 "在昨晚播出的《现在请看》电视节目中，著名主持人爱德华·默罗以罕见的尖锐语调抨击南方多州关闭公立学校的行径。当背景屏幕出现阿肯色州空荡教室的照片时，他质问："当我们用铁锁禁锢校门，究竟是在保护什么传统？"\n节目披露了弗吉尼亚州prince Edward县已关闭所有公立学校，293名黑人学童被迫在废弃仓库上课。镜头捕捉到黑人儿童用粉笔在木箱上演算加减法，默罗的画外音响起："这些孩子正在学习美国宪法的另一课——关于等待的课程。""
 
 usatext.366.t:0 "美国南方学校开始恢复运作"
 
 usatext.367.t:0 "萨凡纳号核动力货船落成启航！"
 usatext.367.d:0 "美国首艘民用核动力船舶“萨凡纳号”今日在礼炮声中缓缓驶出造船厂。这艘洁白如邮轮的货船搭载74兆瓦压水反应堆，可装载1.4万吨货物以21节航速持续环球航行，标志着艾森豪威尔总统“和平利用原子能”倡议迈入新阶段。\n原子能委员会主席在剪彩仪式上强调：“船尾的核标志不是武器，而是繁荣的象征。”该船设计独特，上层建筑采用游轮式流线造型，货舱与反应堆间隔着4层防护屏障。首航将装载棉花与机械前往不来梅港，预计较传统航线节省40%时间。美国海运局数据显示，该船每海里的燃料成本仅为油轮的七分之一。欧洲多国已申请“萨凡纳号”停靠许可。"
 
 
 usatext.370.t:0 "阿拉斯加建州委员会的成立"
 usatext.370.d:0 "阿拉斯加领地行政长官欧内斯特·格鲁今日宣布成立跨党派建州委员会，正式启动第49州建制运动。该委员会由淘金世家、因纽特酋长及二战老兵代表组成，将在国会展开为期三年的系统性游说。\n格鲁宁在朱诺市政厅展示特制铜质州徽草案，其设计的北斗七星图案呼应北极星方位。委员会已收集七万居民联署，并派出狗拉雪橇队向华盛顿运送重达一吨的请愿冰雕——雕刻着"从俄罗斯到美利坚，八十二年的等待足够漫长"。\n参议院领地委员会主席承诺将举行听证会，但南方议员担忧阿拉斯加"可能产生两名支持民权的参议员"。军方则支持建州，强调该地在冷战中的战略地位。"
 
 usatext.371.t:0 "有关阿拉斯加建州的辩论"
 usatext.371.d:0 "国会今日就阿拉斯加建州案展开激烈辩论，反对派议员直言不讳地警告"将诞生两个民权法案的坚定支持者"。密西西比州参议员更在发言中摊开地图："这个冰封荒原的人口不及伯明翰市，却要在参议院获得平等投票权？"\n财政委员会出示数据称阿拉斯加年度财政赤字达8500万美元，反对派嘲讽其为"需要48州供养的冻土包袱"。支持建州的议员则举起二战期间日军登陆阿图岛的照片："当敌人在阿拉斯加登陆时，没人质疑它是否属于美国！"\n阿拉斯加建州委员会主席当场打开装满因纽特儿童信的桦木盒，最上面一封写着："我们已在星条旗下生活91年，何时才能拥有完整的星星？"听证会尾声，工作人员突然拉开帷幕——来自朱诺的巨型冰雕正在空调房中融化，水滴声伴随着主席的结语："这就是阿拉斯加的现状，每一分钟都在流失忠诚。"\n随着民权运动升温，这场建州之争已超越地理范畴。当反对派议员走出会场时，发现廊柱上不知被谁刻了小小的北极星标志。"
 
 usatext.372.t:0 "阿拉斯加建州法案的正式通过！"
 usatext.372.d:0 "今日，艾森豪威尔总统在白宫东厅签署历史性公告，宣布阿拉斯加正式成为美利坚合众国第49州。签字仪式上，总统用因纽特工匠特制的海象牙钢笔在羊皮纸上落款。\n"从沙皇亚历山大二世到星条旗，这片土地历经92年等待，"总统向在场阿拉斯加代表展示法案文本时，特意指向禁止种族歧视的条款。参议院多数党领袖透露，最终表决前仍有南方议员试图用"经济落后"阻挠，但军方提供的苏联在白令海峡的军事部署照片扭转了局势。\n在朱诺新落成的州议会大厦，前建州委员会主席敲响由旧金矿轨道铸成的自由钟，钟声通过新铺设的电话线传遍全州。当北极星旗首次在国会山升起时，安克雷奇电台主持人哽咽宣布："我们不再是地图下方的插图，而是联邦平等的成员。""
 
 usatext.373.t:0 "夏威夷的建州之路"
 usatext.373.d:0 "就在阿拉斯加建州法案通过两个月后，夏威夷参议员今日在国会发起第50州建制倡议，却遭遇比北极地区更强烈的反对声浪。密西西比州议员在听证会上挥舞着檀香山码头罢工照片："这个太平洋岛屿充斥着共产主义煽动者！\n"财政委员会报告强调夏威夷年均赤字达阿拉斯加的两倍，佐治亚州代表更直言："我们真要接受一个亚裔人口超半数的州？"会场出现印有"不接收东方殖民地"的传单。"
 
 usatext.374.t:0 "夏威夷建州遭到抵制"
 usatext.374.d:0 "拥有夏威夷王室血统的爱丽丝·坎贝尔参议员今日向联邦法院提起诉讼，指控夏威夷地方政府"非法转让祖先土地"。她在伊奥拉尼宫旧址前举行记者会，身后悬挂着卡美哈梅哈王朝的旗帜。\n"1893年的刺刀至今仍抵在我们脊背上，"坎贝尔身着传统穆穆袍，手持莉莉乌卡拉尼女王签署的1897年宪法原稿，"他们先推翻王国，现在又要永远埋葬我们的主权。"诉状要求冻结总面积达30万英亩的王室信托土地。"
 
 usatext.380.t:0 "美国南方学校开始恢复运作"
 
 usatext.400.t:0 "共产主义恐慌蔓延美国社会"
 usatext.400.d:0 "苏联在东欧的行动，共产党在中国内战的胜利，对苏联研发原子弹的恐慌，以及苏联间谍的影响。这一切加剧了美国对共产主义担忧，美国媒体反共倾向日益高涨，公众笼罩在红色恐慌之下。"
 red_fear_gain:0 "民众对共产主义的恐慌正在增长"