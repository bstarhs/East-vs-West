 usatext.228.t:0 "反共主义者抵制饮水加氟"
 usatext.228.d:0 "卫生部大楼前突然聚集起人群。他们举着手绘的标语牌，上面画着骷髅头和水龙头，扭曲的箭头指向克里姆林宫。美国政府表示，饮用水中添加氟化物有利于减少牙齿疾病，但反共主义者认为，被共产党渗透的美国政府，可能会有共产匪谍在饮用水中添加毒药，残害美国人的健康。\n"纯净水权！"一个戴防毒面具的妇人尖叫着，她的推车里堆满瓶装山泉水。退伍老兵散发传单，用红笔圈出氟化物的化学式，声称那与苏联实验室里的某种神经毒剂只差一个原子。穿实验室白大褂的官员试图解释，声音很快淹没在口哨和汽笛声中。"
 usatext.228.a:0 "啊？？？"
 
 usatext.229.t:0 "《国家评论》杂志的创立"
 usatext.229.d:0 "美国保守主义政治家小威廉·F·巴克利创立杂志《国家评论》，为保守主义、反共主义和种族隔离制度呐喊助威。小威廉·F·巴克利大力支持麦卡锡主义打击共产党，并呼吁，善良和正直的人应当团结一致，对抗共产主义。"
 
 
 
 usatext.230.t:0 "苏联撤离驻纽约侨民"
 usatext.230.d:0 "随着苏联和西方国家在柏林发生紧张的军事对峙，美苏关系急剧恶化。为了避免事态扩大，莫斯科向苏联在美国的外交官和侨民发出通知，要求尽快撤离在美国的所有苏联公民。纽约将成为第一个撤离苏联侨民的地区。苏联驻纽约总领事雅科夫·洛马金将处理此事。"
 
 usatext.231.t:0 "苏联籍教师在纽约失踪！"
 usatext.231.d:0 "来自纽约的突发消息！在纽约为侨民学校工作的女教师奥萨娜·卡森金娜失踪！她在登船返回苏联的时候迟迟没有出现，苏联领事馆不得不宣布卡森金娜失联，并发布寻人启事，要求纽约市警察局协助寻找。"
 
 usatext.232.t:0 "卡森金娜被警察寻获"
 usatext.232.d:0 "苏联驻纽约大使馆和纽约市警察局发布联合声明，数日前失踪的苏联公民卡森金娜已被找到，她在一个由俄罗斯白军移民组成的反苏组织的据点中获救，目前已经送至领事馆。洛马金领事表示，卡森金娜被误当成反苏分子，被这个组织强行带走，这已经构成绑架行为，苏联政府强烈谴责，并将会和美国政府进一步沟通法律事宜。"
 
 usatext.233.t:0 "卡森金娜事件舆论反转！"
 usatext.233.d:0 "纽约消息！前不久强行带走奥萨娜·卡森金娜的组织托尔斯泰基金会宣称，卡森金娜并非被绑架，她是真心想要逃离苏联，才寻求基金会的庇护。但苏联政府欺骗美国警察，将卡森金娜带走并交给共产党，使得卡森金娜失去了投奔自由的机会。"
 
 usatext.234.t:0 "记者包围苏联领事馆！"
 usatext.234.d:0 "美国各大媒体记者包围了苏联驻纽约领事馆，要求洛马金领事解释卡森金娜是否真的想要叛逃。"
 
 usatext.235.t:0 "卡森金娜跳楼自杀！"
 usatext.235.d:0 "在美国记者层层包围苏联领事馆要求领事出面解释时，一声沉闷的响声从领事馆侧面的地面传来。记者们惊讶的发现一名妇女正奄奄一息地躺在地上，鲜血直流，而上方是打开的窗户。毫无疑问，奥萨娜·卡森金娜从苏联领事馆的窗户上跳了下来！\n卡森金娜跳楼立刻震惊了整个美国，记者们认为，卡森金娜女士遭到了苏联领事馆的虐待而跳楼，并呼吁美国政府调查真相！"
 
 usatext.236.t:0 "卡森金娜案件引起全美关注！"
 usatext.236.d:0 "卡森金娜跳楼立刻震惊了整个美国，记者们认为，卡森金娜女士遭到了苏联领事馆的虐待而跳楼，并呼吁美国政府调查真相！"
 
 usatext.237.t:0 "美国宣布卡森金娜并未受到绑架"
 usatext.237.d:0 "在巨大的舆论热议中，美国国务院宣布了对卡森金娜事件的调查结果：美方的态度与苏联领事馆的主张大差不差，卡森金娜是因为乌龙事件误入托尔斯泰基金会的，没有遭到任何人的绑架，而卡森金娜本人的意愿是回到苏联，美国政府将尊重她的决定。"
 
 usatext.238.t:0 "卡森金娜离开纽约"
 usatext.238.d:0 "在经历了失踪、绑架和跳楼等一系列荒唐的风波后，疲惫不堪的奥萨娜·卡森金娜在苏联领事馆的人员陪同下，登上轮船离开纽约返回苏联，至此这件牵动两国政府的外交大案宣布结束。"
 
 usatext.239.t:0 "美国右翼指责美国政府软弱"
 usatext.239.d:0 "尽管美国国务院、纽约警方都已经宣布卡森金娜绑架案是一场误会，然而，仍有人相信卡森金娜遭到了苏联迫害，想要投奔自由。随着卡森金娜离开纽约回到苏联，愤怒的美国右翼势力，包括政客、报纸和媒体猛烈地批评美国政府，指责美国外交软弱，没有帮助自由义士逃离共产党的魔爪。"
 
 usatext.240.t:0 "美国要求卡森金娜留在美国"
 usatext.240.d:0 "在巨大的舆论热议中，美国国务院宣布了对卡森金娜事件的调查结果：美国政府采纳了托尔斯泰基金会的证词，认为卡森金娜有意留在美国，不愿意回到苏联。美国政府宣布，他们将要求苏联政府尊重卡森金娜的人权和自由，将卡森金娜留在美国。\n苏联领事馆的外交官们愤怒地斥责美国政府扭曲事实，颠倒黑白，予以强烈的外交抗议。"
 
 usatext.241.t:0 "苏联外交官全部撤离纽约"
 usatext.241.d:0 "苏联和美国之间的关系因卡森金娜事件加速恶化，为表抗议，苏联撤离了驻扎美国，尤其是纽约的所有外交官员，这无疑为冷战危机火上浇油。"
 
 usatext.242.t:0 "伊丽莎白·居莱·弗林被捕"
 usatext.242.d:0 "美国工会领袖、女权主义者伊丽莎白·居莱·弗林被美国政府逮捕，因为她试图帮助几名被指控违背《史密斯法案》的美国共产党员保释。法院宣称伊丽莎白也试图暴力推翻美国政府。"
 
 usatext.243.t:0 "美国公共关系论坛"
 usatext.243.d:0 "一个自称为美国公共关系论坛的保守反共主义组织在南加州成立，这个组织由保守的天主教妇女组成，他们对外表示：我们是妻子和母亲，对国家正在发生的事情至关重要。\n该论坛反对任何其认为的社会主义或反民族主义的言论，组织会议和写信活动施加政治压力。"
 
 usatext.244.t:0 "美国妇女义勇军成立"
 usatext.244.d:0 "一个自称为美国美国妇女义勇军的保守反共主义妇女团体在康涅狄格成立，这个组织由保守的天主教妇女组成，他们对外表示：我们是妻子和母亲，对国家正在发生的事情至关重要。\n妇女义勇军的许多成员是医生的妻子和女儿，因此媒体认为，这个组织的成立，体现出美国医疗界对医疗公共化的反对，并指责这是共产主义阴谋。"
 
 usatext.245.t:0 "玛格丽特·史密斯议员抨击麦卡锡主义"
 usatext.245.d:0 "麦卡锡主义掀起的猎巫风波在美国社会造成的深入的影响，尽管他得到了保守主义者的支持，却也被进步主义者所反对。\n缅因州参议院玛格丽特·蔡斯·史密斯女士在今天的参议院会议上，严厉地抨击麦卡锡主义的扩大化。\n在美国，言论自由已经不像以前那样了……"
 
 usatext.246.t:0 "电视节目《See It Now》引起热议"
 usatext.246.d:0 "哥伦比亚广播公司的电视访谈节目《See It Now》，昨晚引起了美国社会的广泛关注和讨论。主持人爱德华·默罗评论了最近在美国空军内引起风波的麦洛·拉多罗维奇中尉事件。拉多罗维奇被麦卡锡主义分子指责为共产党，并要求美国空军将其驱逐。空军处理此事的手法遭到默罗的严厉批评。"
 
 usatext.247.t:0 "爱德华·默罗对麦卡锡的抨击"
 usatext.247.d:0 "在昨晚的电视节目节目《See It Now》中，多次质疑美国政府无理由解雇可能涉嫌共产主义的美国军人的评论家爱德华·默罗，在节目上公开演说，直言不讳地抨击走向疯狂的麦卡锡主义……我们不能把异议和不忠混为一谈。\n我们必须时刻牢记，指控不等于证据，定罪应依赖于证据和公正的法律过程。我们不会一次又一次地在恐惧中行走。要深入挖掘我们的历史和教条，并牢记我们不是懦夫的传人。"
 
 usatext.248.t:0 "麦卡锡vs美国军方听证会"
 usatext.248.d:0 "麦卡锡参议员对共产主义者的追究愈发深入，他已不是第一次将矛头对准美国军方。美军代表对阵麦卡锡的听证会再一次举行，这一次，美国广播公司进行了全程电视直播。\n麦卡锡参议院首次将其咄咄逼人、富有攻击性的审问方式展示在大众面前，面对这种极具争议的问询，美国军方代理律师约瑟夫·韦尔奇问道：\n参议员先生，你还有没有良知？难道你到最后连一点起码的良知也没有保留下来吗？"
 
 
 usatext.250.t:0 "波音367-80进行试飞"
 usatext.250.d:0 "尽管彗星式客机连续发生多次重大事故，但并没有影响各国开发新型喷气式客机的热情。美国波音公司宣布，该公司已成功进行了其首架喷气式客机的试飞。"
 
 usatext.251.t:0 "波音707喷气客机成功首飞！"
 usatext.251.d:0 "在激烈的喷气式客机竞争中，波音公司取得了优势！波音正式宣布其首款喷气式科技波音707首飞成功，不日将投入量产！泛美航空已向波音递交第一批订单！"
 
 
 
 usatext.252.t:0 "莱斯特·C·亨特当选参议院"
 usatext.252.d:0 "前怀俄明州州长莱斯特·C·亨特当选为美国国会参议员，亨特先生坚定地支持美国的医疗保险政策改革，反对种族隔离，尤其反对麦卡锡主义走向疯狂。"
 
 usatext.253.t:0 "莱斯特·C·亨特的丑闻曝光"
 usatext.253.d:0 "莱斯特·亨特大力反对反共产主义猎巫的行为激怒了麦卡锡。麦卡锡在今天的参议院听证会上，曝光亨特的儿子小莱斯特是同性恋，这使得亨特的威望遭到了严重打击。麦卡锡还威胁，如果亨特不放弃连任竞选参议员，就将起诉小莱斯特。"
 
 usatext.254.t:0 "莱斯特·亨特参议员自杀！"
 usatext.254.d:0 "参议员亨特办公室的台灯仍亮着。他第三次重读那封匿名信——自己儿子与他人发生同性关系的证据在麦卡锡手中，明早就会出现在《华盛顿邮报》。\n钢笔在辞职信上洇出墨团。他对着空办公室呢喃，药瓶在抽屉里发出轻响。三小时前麦卡锡在电话里大笑：莱斯特，要么自己体面，要么我帮你体面。\n这场荒诞的猎巫才是真正的叛国...他在便签上写道，又狠狠划掉。窗外的华盛顿纪念碑正浸在晨雾里，像柄蒙霜的刺刀。\n\n来自华盛顿的惊人消息！参议员莱斯特·亨特先生在自己的办公室中开枪自杀！清洁工在惊魂未定中发现了倒下的亨特和他的辞职信，但这封信件已被联邦调查局收走，内容未知。媒体认为麦卡锡参议院涉及此事，因为亨特参议员一直反对麦卡锡主义。对此麦卡锡回应道：心理脆弱的人，不适合从政。"
 
 usatext.255.t:0 "约瑟夫·麦卡锡去世"
 usatext.255.d:0 "美国参议员约瑟夫·麦卡锡今日因急性肝炎逝世，终年48岁，官方诊断结果是急性肝炎。这位以反共猎巫闻名的威斯康星州议员，最终在贝塞斯达海军医院病床上结束了他充满争议的政治生涯。\n葬礼上，极右翼团体高举美国英雄的标语，前FBI官员罗伊·科恩致辞称：麦卡锡参议员是抵御红色渗透的盾牌，他的离世让国家失去了一位真正的爱国者。而与此同时，国会走廊里，不少官员低声交谈，如释重负。\n猎巫终于结束了。一位不愿透露姓名的国务院官员说道。\n麦卡锡的政治生涯在1954年陆军听证会后急转直下，历史学者指出，他的去世恰逢冷战紧张局势的微妙缓和期。白宫仅发表简短声明，未提及他在麦卡锡主义时期的作为。\n夜幕降临时，国会大厦的旗帜降下半旗，而几家酒吧里，有人悄悄举杯。"
 usatext.255.a:0 "为了理性与正义的回归。"
 
 usatext.256.t:0 "美国首座核电站落成！"
 usatext.256.d:0 "美国原子能委员会与西屋电气合作开发的首座原子能发电站已在宾夕法尼亚州落成，这座核电站采用压水反应堆（PWR），电力功率60MW，可以为美国数百万户家庭提供能源，这标志着美国正式踏入了民用核能时代。"
 
 usatext.257.t:0 "美国政府提出和平利用原子能"
 usatext.257.d:0 "随着世界各大国纷纷研发原子武器，对原子能过度发展的恐慌引起美国舆论的担忧，反对原子能发展的声音开始出现。对此，美国总统[USA.GetLeader]在最近的讲话中表示，原子能并非只能用于制造武器，也可以利用于和平和民用范围，例如原子发电、原子生物学、太空船动力和利用核爆开发运河等。总统表示，美国政府将致力于研究民用原子能的各项技术，以让原子能更好地运用于和平和改善生活。"
 
 usatext.258.t:0 "吉尔伯特的U-238原子能实验室"
 usatext.258.d:0 "随着世界进入原子时代，有关原子能的研究不仅成为美国政府的重点项目，也成为美国民间的热门话题。\n美国著名玩具制造商吉尔伯特公司，推出了一款名为原子能实验室的玩具套装，以帮助孩子们自己建立一个迷你的源自实验室。套装内包括四个玻璃罐，内含天然含铀（U-238）的铀云母、铀云母、铀矿和钒钾铀矿样品、由Ru-106组成的低水平辐射源等。\n产品目录对这套装置进行了如下描述：令人惊叹的景象！让您能够真实看到电子和α粒子以每秒超过10,000英里的速度运动的路径！电子以惊人的速度飞驰，形成精细复杂的电子凝聚路径——美不胜收。观看云室活动是人类迄今为止最接近观察原子的体验！\n除其他活动外，该套件建议“与伽马射线源玩捉迷藏”，挑战玩家使用盖革计数器找到隐藏在房间中的放射性样本。"
 usatext.258.a:0 "这玩具可太有辐气了"
 
 usatext.259.t:0 "原子能的时代即将来临……！"
 usatext.259.d:0 "随着美国的原子能技术不断发展，美国社会掀起一股原子能热潮。著名科幻杂志《大众机械》最近刊登了一系列文章和图画，向人们展示艺术家对原子能未来的想象。\n在杂志插画中，无污染的核能将在未来成为人类最大的能源生产方式，高污染且不可再生的石油资源将被淘汰。微型原子能反应炉将进入人们生活的方方面面，为客机、轮船、公共交通乃至私家汽车供应能源。原子能将为极寒和荒芜地区提供能源，人类的生存条件将大大改善，最重要的是，未来的宇宙飞船将使用核能作为发动机，带领人类飞翔浩瀚银河……\n总之，杂志呼吁民众支持原子能发展。"
 usatext.259.a:0 "科技将改变一切"
 
 usatext.260.t:0 "电影《他们！》在上映"
 usatext.260.d:0 "华纳兄弟公司出品的科幻恐怖片《它们！》近日在全美公映，迅速引发媒体与公众热议。影片构思大胆，讲述了新墨西哥州阿拉莫戈多沙漠因核试验辐射，导致蚂蚁变异为体型达8至20英尺的巨型嗜肉怪物，它们潜伏于洛杉矶下水道系统，对人类世界构成致命威胁。\n这一“核辐射创造怪物”的核心概念，精准击中了冷战初期美国社会对核技术的深切焦虑。影片不仅呈现了惊悚视效，更被主流影评杂志广泛解读为对原子能时代潜在危机的寓言。多数媒体给予好评，认为其超越了单纯的娱乐，成功地将“核试验是否在创造未知灾难”这一严肃的社会议题，推向公共讨论的中心，引发了关于科技进步边界的全新思考。"
 
 usatext.261.t:0 "《华氏451度》"
 usatext.261.d:0 "美国作家雷·布拉德伯里所著的小说《华氏451度》出版，该小说叙述了一个压制自由的近未来世界，禁止人们阅读及拥有书籍，所谓的消防员的工作不是灭火，而是焚书。\n尽管雷·布拉德伯里一再强调此书旨在关注电视对人们阅读习惯的威胁，但依然有许多人认为，本书影射了眼下美国猖獗的麦卡锡主义风波，以及大国之间毁灭性的核战争。"
 
 usatext.262.t:0 "一场乌龙"
 usatext.262.d:0 "警察先生！他们在我家装了窃听器！史密斯太太抓着项链的手指不停颤抖。就在卧室的墙里——那种喀嚓声，绝对是共党的间谍设备！\n两名警官交换了个眼神。最近三个月，这已经是第七起窃听器报案。他们跟着主妇冲进贴满米老鼠壁纸的房间，手电光扫过玩具箱时，一个锡皮制的圆柱体正在地板上缓缓旋转，发出规律的咔嗒声。\n天杀的俄国人竟敢......史密斯太太正在控诉，她五岁的小儿子从床底爬出来，鼻尖还沾着银色颜料：妈妈！我的宇宙火箭会自己转啦！\n老警官弯腰拾起玩具，发条装置在他掌心又喀嚓响了一声。新来的年轻警官突然笑出声，被搭档用手肘狠狠捅了下肋骨。\n女士，建议您下次......\n窗外忽然传来铃铛声只见邻居琼斯先生骑在自行车上喊道：史密斯太太！我发现你家树上有克格勃的信号灯！哈哈哈哈哈！\n路灯照耀下，一只知更鸟站在圣诞彩灯中间，喙里叼着闪亮的铝箔糖纸。"
 usatext.262.a:0 "都魔怔了。"
 
 usatext.263.t:0 "艾森豪威尔与士兵"
 usatext.263.d:0 "新当选成为美国总统的艾森豪威尔，在华盛顿会见了曾经与他一起征战欧洲的美国军人。当总统正逐个与老兵们握手时，一位佩戴紫心勋章的独臂黑人老兵突然立正发问：总统先生，我和白人士兵在奥马哈海滩流过同样的血，为何他们能领住房贷款，我却连退伍医院都进不去？\n士兵，你叫什么名字？\n詹姆斯·威尔逊，第761坦克营，总统先生。老兵空荡荡的袖管在风中轻晃。我们营救了201步兵师，但回国后连庆功宴都不让进正门。\n记者们的相机突然停止闪烁。艾森豪威尔摘下将星帽檐，露出花白鬓角：这不对，詹姆斯。当年在莱茵河，是你们营最先......\n所以您会修改《退伍军人权利法》吗？\n我会让幕僚长......\n谢谢您，长官。詹姆斯挺直脊背敬礼。但我的战友们等不起又一个'慢慢来'。"
 usatext.263.a:0 "这真是一次漫长的等待。"
 
 usatext.264.t:0 "冯·诺伊曼逝世"
 usatext.264.d:0 "20世纪最杰出的数学家和计算机科学先驱之一冯·诺伊曼今日在沃尔特·里德陆军医疗中心逝世，终年53岁。这位出生于布达佩斯的科学巨匠因骨癌病情恶化不治身亡。\n冯·诺伊曼在量子力学、博弈论、核物理等多个领域做出开创性贡献，被誉为"最后一位数学全才"。二战期间，他参与曼哈顿计划，为原子弹研发提供关键数学支持。战后提出的"冯·诺伊曼架构"，至今仍是现代计算机设计的理论基础。\n从核裂变方程式到第一台电子计算机，这位科学奇才的智慧之光，将继续照亮人类探索未知的道路。美国总统亲自致电哀悼，称这是"自由世界科学事业的重大损失"。"
 
 usatext.265.t:0 "电影《桂河大桥》上映"
 usatext.265.d:0 "由哥伦比亚影业出品、威廉·荷顿主演的战争电影《桂河大桥》再美国和英国上映。"
 
 usatext.266.t:0 "阿拉斯加爆发特大地震"
 usatext.266.d:0 "昨日晚间，阿拉斯加东南部发生里氏8.3级强烈地震，震中位于费尔韦瑟断层带。剧烈的地壳运动导致利图亚湾周边山体大规模滑坡，约3000万立方米的岩体和冰川坠入海湾，引发史上罕见的巨型海啸。\n据地质调查局报告，海啸掀起的水墙高达524米，创下现代观测史最高纪录。巨浪以每小时160公里的速度横扫海湾，将沿岸森林连根拔起。一艘恰巧经过的渔船被抛至海拔60米的山脊，船员奇迹生还但船只彻底损毁。\n本次地震唯二两名遇难者死于利图亚湾的大海啸，受灾最严重的雅库塔特镇三分之二建筑被毁。救援队发现，海岸线向海推进了整整1.5公里，原本的沙滩被厚达10米的碎石和冰碛覆盖。美国海岸警卫队已紧急调派直升机运送物资，科学家警告余震可能持续数周。"
 
 usatext.267.t:0 "南方基督教领袖会议成立"
 usatext.267.d:0 "在联合抵制蒙哥马利公车运动胜利后，马丁·路德·金与贝亚德·鲁斯汀、埃拉·贝克等人邀请约60名黑人牧师和领袖到亚特兰大的埃比尼泽教堂集会，宣布成立南方基督教领袖会议。\n该组织号召人们通过公民不服从、抵制和游行等方法达成目标，因此一般认为比全国有色人种协进会更激进。"
 
 usatext.268.t:0 "美国普雷斯顿堡发生校车坠河事故"
 usatext.268.d:0 "美国肯塔基州普雷斯顿斯堡附近一辆校车与一辆火车相撞坠入大桑迪河\n事故发生当天，肯塔基州寒冷多雨，经过一段时间的大雨和解冻后，一辆载有48名小学生和中学生的弗洛伊德县校车在前往肯塔基州普勒斯顿斯堡上学的路上撞上了23号美国公路上的一辆清障车的尾部，然后冲下路堤，坠入大桑迪河莱维萨支流汹涌的河水中，被冲到下游淹没。\n国民警卫队和其他当局及机构对这场灾难做出了响应，州长哈皮·钱德勒命令来自9个不同城市的500名国民警卫队队员加入搜寻失踪人员的行动。\n巴士完全被汹涌的洪水淹没后，最初几分钟内，22名儿童成功逃生，安全离开河面。然而，另有26名儿童和巴士司机溺亡。[USA.GetLeader]总统宣布为事故的死难者沉痛哀悼。"
 
 usatext.270.t:0 "有关合并两国防空机制的建议"
 usatext.270.d:0 "尊敬的加拿大总理阁下：\n随着俄国在航空航天领域的技术发展，自由世界的领空面临着前所未有的威胁，俄国的飞行器、火箭和人造卫星随时可能出现在北美洲上空，威胁我们的国防安全。加拿大和美国都致力于保卫北美洲不受红色威胁，为了更好地保护北美洲的领空，我们建议将两国的防空军事机构进行合并，以协调防空机制，强化反应能力。"
 
 usatext.271.t:0 "加拿大拒绝了我们的建议"
 usatext.271.d:0 "尊敬的总统阁下：\n我们遗憾地婉言谢绝您的建议，加拿大有足够的能力自主防御俄国人的空中威胁，将两国的防空系统合并只会造成不必要的混乱和机构臃肿，因此我国将独立进行领空安全工作，也许未来我们可以在其他方面进行合作。"
 
 usatext.272.t:0 "北美防空司令部的成立"
 usatext.272.d:0 "加拿大和美国政府宣布，将两国的军事防空机构进行合并，建立北美防空司令部，以推动两国更深入的合作，保卫北美洲的领空安全。"
 
 usatext.273.t:0 "南卡罗莱纳州发生核武器丢失意外"
 usatext.273.d:0 "美国南卡罗莱纳州发生一次令人惊讶的核武器丢失意外，一架美国空军的B-47轰炸机由于操作失误，意外将一枚Mark 6核弹从一万五千英尺的高空中投下，最后核弹飞入寻常百姓家，坠落到马尔斯布拉夫市的一座住宅当中。\n幸运的是，由于核弹没有安装引爆用的核芯，因此没有引发核爆，但核弹内的高爆炸药依然在触地后发生爆炸，摧毁了附近多座房屋和一座教堂，造成6名市民死亡。美国军方迅速前往现场进行勘探和救灾，《纽约时报》被允许报道此事。军方宣布，核弹没有引起放射性泄露，并向遇难者家庭赔偿5.4万美元。此事在美国引起轰动，民众怀疑这已不是美国军方第一次丢失核武器，并对原子能的发展产生怀疑。"
 usatext.273.a:0 "真吓人。"
 
 
 usatext.274.t:0 "[FROM.GetName]希望与我国进行能源合作"
 usatext.274.d:0 "[FROM.GetName]外交部致信总统阁下，我国有意加入和平原子能计划，以申请美国对我国核技术开发和研究的支持，以推动两国在原子能技术、资源开发的合作与共享。"
 
 usatext.275.t:0 "美国拒绝了我们的请求"
 usatext.275.d:0 "我们遗憾地告知阁下，美国政府目前由于各种因素考虑，不能协助贵国发展核能，或许未来某天时机成熟后可以再商讨此事。"
 
 usatext.276.t:0 "美国同意了我们的请求"
 usatext.276.d:0 "我们愉快地告知阁下，美国政府同意对贵国核技术开发和研究的支持，以推动两国在原子能技术、资源开发的合作与共享。"
 
 
 usatext.280.t:0 "在贵国部署战略弹道导弹的建议"
 usatext.280.d:0 "尊敬的阁下：\n随着俄国在核导弹领域的技术发展，自由世界的国家安全面临着前所未有的威胁，俄国的火箭随时可能携带核弹头出现在西欧上空，威胁我们的国防安全。[ROOT.GetName]和美国都致力于保卫欧洲不受红色威胁，为了更好地对抗俄国人的火箭威慑，我们建议在贵国部署PGM-19朱庇特弹道导弹，以通过核平衡的方式，抵消俄国人的核武器威胁。"
 
 usatext.281.t:0 "[FROM.GetName]拒绝了我们的建议"
 usatext.281.d:0 "尊敬的总统阁下：\n我们遗憾地婉言谢绝您的建议，[FROM.GetName]和有足够的能力自主防御俄国人的核武威胁，在欧洲部署战略核导弹只会引发不必要的局势升温，也许未来我们可以在其他方面进行合作。"
 
 usatext.282.t:0 "[FROM.GetName]接受了我们的建议"
 usatext.282.d:0 "尊敬的总统阁下：\n我们愉悦地接受了您的建议，[FROM.GetName]将允许美国在我国国土上部署战略核导弹，以对抗俄国人的核武威胁。"
 
 usatext.285.t:0 "美国国务卿约翰·杜勒斯去世"
 usatext.285.d:0 "美国前国务卿杜勒斯今日因癌症逝世，享年71岁。这位冷战时期最具影响力的外交家，其倡导的"大规模报复"战略深刻塑造了战后国际格局。\n杜勒斯出身外交世家，早年参与起草《联合国宪章》，1953年起担任国务卿。他是"遏制政策"主要设计师，首创"战争边缘"理论，主导建立东南亚条约组织，推动中央情报局推翻多个左翼政府。在日内瓦会议中拒绝与中方握手的行为，成为冷战对峙的经典象征。\n任内处理了苏伊士运河危机、匈牙利事件等多场国际危机，坚持对苏联强硬路线。杜勒斯生前最后著作《战争与和平》即将出版，其中写道："与共产主义共存意味着死亡。"
 
 usatext.286.t:0 "约翰·菲茨杰拉德·肯尼迪当选马萨诸塞州参议员"
 usatext.286.d:0 "来自著名的肯尼迪家族的约翰·菲茨杰拉德·肯尼迪，高票当选马萨诸塞州在美国国会的参议员代表席位，成为美国最年轻的参议员。约翰·肯尼迪雄心勃勃，不仅积极参与公共事务和共产主义威胁等议题，且公开提出希望能参选美国总统。"
 
 usatext.287.t:0 "美国民防委员会的成立"
 usatext.287.d:0 "随着美国上下对苏俄拥有核武器的可能性愈发担忧，美国政府开始研究如何指导民众躲避原子弹轰炸。美国政府宣布将第二次世界大战期间，用于指挥民众躲避轰炸机袭击的民防办公室、应急委员会、民防巡逻队和志愿者服务队等机构，统一合并为联邦民防委员会，负责对美国民众的核武器知识、躲避和防护的指导工作。"
 
 usatext.288.t:0 "美国建立紧急公众广播系统"
 usatext.288.d:0 "美国与苏联关系愈发紧张，为了更好地引导民众躲避来自苏联的核打击，美国政府成立了CONELRAD紧急公众广播系统，该系统由美国军方直接负责，当常规广播因为遭到核打击而无法工作时，紧急广播系统将继续运行，民众可以通过将收音机调到特定频率以收听紧急广播，以获取资讯并接受有关避难的指示。"
 
 usatext.289.t:0 "《原子弹袭击下的生存指南》"
 usatext.289.d:0 "1.尝试获得保护\n如果有时间，可以躲进地下室或地铁。如果意外被困户外，可以寻找建筑物旁的避难所，或者跳进任何方便的沟渠或排水沟。\n2.平放在地面或地板上\n为了避免被抛来抛去，并减少被坠落或飞来的物体击中的机会，请将其平放在墙底或河岸底部。\n3.把脸埋在手臂里\n当你平躺时，用肘弯遮住眼睛。这样可以保护你的脸部免受闪光灼伤，防止暂时失明，并防止飞来的物体进入你的眼睛。\n4.爆炸发生后不要立即冲出室外\n空中爆炸后，请等待几分钟再前往灭火。其他类型的爆炸后，请至少等待1小时，让残留辐射逐渐消散。\n5.不要冒险食用敞开容器中的食物或水\n为预防放射性中毒或疾病，请谨慎选择食物和水。如有理由怀疑食物和水可能受到污染，请尽可能选择罐装和瓶装食品。\n6.不要散布谣言\n在爆炸发生后的混乱中，一个谣言就可能引发恐慌，甚至可能夺走你的生命。"
 
 usatext.290.t:0 "见证人类奇观！拉斯维加斯独家核爆观景之旅"
 usatext.290.d:0 "沙漠晨曦中，一道前所未有的壮丽奇观正在上演！距拉斯维加斯仅100公里的内华达试验场，此刻正为您呈现人类最震撼的科技奇迹——原子能蘑菇云腾空绽放的辉煌瞬间。\n每周日黎明时分，我们专业的观光巴士将带您前往最佳观景台。当震波掠过沙漠、七彩云霞裹挟着科技伟力直冲三万英尺高空时，您将手持特制防护镜，见证太阳般炽烈的光芒如何照亮整个莫哈韦沙漠。全程配备辐射检测仪和军事级安全防护，更有物理学教授现场解说核能科学。\n晚间更可享受"原子鸡尾酒"主题派对，在酒店天台用望远镜回味晨间奇景。\n历史正在眼前爆发！即刻预订即可获赠防尘面罩与放射性玻璃纪念品（绝对安全）。咨询热线：555-ATOMIC（28642）。"
 
 usatext.291.t:0 "原子小姐选美比赛"
 usatext.291.d:0 "为了推广拉斯维加斯的原子旅游事业，《每日电讯报》在维加斯发起了原子小姐选美大赛，四位参赛选手身着核爆蘑菇云样式的服装参与其中。来自密歇根州的Candyce King获得了原子小姐的称号。"
 
 usatext.292.t:0 "蟋蟀乐队的诞生"
 usatext.292.d:0 "来自美国德克萨斯州的摇滚乐手巴迪·霍利，联合吉他手尼基·沙利文、鼓手杰瑞·埃里森和贝斯手乔·莫尔丁，组建了一支名为蟋蟀的摇滚爵士乐队，并在迪卡唱片公司支持下发行了首个专辑《That'll Be the Day》。"
 
 usatext.293.t:0 "艾奥瓦州发生重大空难"
 usatext.293.d:0 "来自艾奥瓦州明湖的突发消息！一架载有4人的私人包机在这一地区因意外事故坠毁，机上四人全部遇难，包括一名驾驶员和大名鼎鼎的蟋蟀乐队的三位成员——巴迪·霍利，里奇·瓦伦斯和吉尔斯·查尔森。\n飞机起飞后，因为恶劣的天气条件，加上飞行员操作失误，飞行员罗杰·彼得森产生空间定向障碍，使得飞机失去控制。飞机公司老板休伯特·德怀尔无法与飞机无线电联系，第二天早上报告当局飞机失踪。他驾驶塞斯纳180起飞后，在艾奥瓦州明湖附近麦田发现飞机残骸。\n这次事故引发了美国音乐界的悲伤，蟋蟀乐队是美国最重要的摇滚乐团之一，出道当年便获得了告示牌百大单曲榜登上第三名，然而乐队却在事业巅峰期遭此劫难，令人唏嘘。"
 
 usatext.294.t:0 "马丁·路德·金遭到未遂刺杀！"
 usatext.294.d:0 "来自纽约的突发消息！美国黑人运动领袖马丁·路德·金在纽约曼哈顿遭到一名妇女持刀袭击！\n马丁·路德·金昨日早上再曼哈顿的黑人聚居区哈莱姆宣传自己的自传《迈向自由》，一名黑人妇女再接近金，并确认金的身份后，突然将一把拆信刀刺进了金的胸膛，导致金险些丧命。\n著名黑人报纸《阿姆斯特丹新闻》的一位广告主管抓住并制服了库里。一位好心的旁观者伸手想从金的胸口拔出拆信刀，但此时纽约市警察艾尔·霍华德和菲利普·罗马诺已经赶到现场并迅速采取行动。他们立即意识到拔出拆信刀的风险，阻止了旁观者采取行动，然后打电话给哈莱姆医院，协调医生如何将金安全地带出商店。\n这名妇女名叫艾佐拉·科里患有精神病，当时她认为金与共产党密谋陷害自己。"
 
 usatext.295.t:0 "《迈向自由》"
 usatext.295.d:0 "在蒙哥马利巴士抵制运动结束后，美国黑人运动领袖马丁·路德·金名声大噪，于是金宣布将出版自己的自传《迈向自由》。本书描述了当时生活在阿拉巴马州的非裔美国人的状况，并记述了事件以及参与者对抵制运动及其后果的计划和想法。\n金还在书中阐述了自己的非暴力运动主张，主张通过社会运动争取美国黑人的平等地位。"
 
 usatext.296.t:0 "阿拉巴马州政府向《纽约时报》提起诽谤诉讼"
 usatext.296.d:0 "阿拉巴马州政府向《纽约时报》提起诽谤诉讼"
 
 usatext.297.t:0 "阿拉巴马州地方法院判处《纽约时报》败诉"
 
 usatext.298.t:0 "最高法院判处《纽约时报》胜诉"
 
 usatext.299.t:0 "最高法院判处《纽约时报》败诉"
 
 usatext.300.t:0 "《七年之痒》"
 usatext.300.d:0 "好莱坞女星玛丽莲·梦露主演的电影《七年之痒》上映并一炮而红。"
 
 usatext.301.t:0 "玛丽莲·梦露与阿瑟·米勒结婚"
 usatext.301.d:0 "好莱坞当红女星玛丽莲·梦露宣布，他将与著名剧作家阿瑟·米勒结为夫妻，二人的婚礼将在不久后举行。"
 
 usatext.302.t:0 "阿瑟·米勒被捕"
 usatext.302.d:0 "来自洛杉矶的消息！好莱坞著名电影编剧阿瑟·米勒今日被捕！\n阿瑟·米勒是好莱坞的著名剧作家，曾创作过《推销员之死》、《萨勒姆的女巫》等著名作品，此外，他还是当红女星玛丽莲·梦露的第三任丈夫。\n阿瑟·米勒以反对麦卡锡主义而闻名，因而使其被右翼导演伊利亚·卡赞告发，称其参加了共产党的秘密集会。阿瑟·米勒因为拒绝提供参与共党集会者的姓名，被控藐视国会，于今日被联邦调查局逮捕，引发巨大轰动。"
 
 usatext.303.t:0 "玛丽莲·梦露出席法院听证会"
 usatext.303.d:0 "玛丽莲·梦露今日出席了丈夫阿瑟·米勒被控藐视国会案件的法院听证会。在回答记者采访时，梦露坚信丈夫没有违反任何法律，并支持丈夫取得官司胜利。"
 
 usatext.304.t:0 "玛丽莲·梦露被捕！"
 usatext.304.d:0 "今日凌晨，美国联邦调查局以"涉嫌包庇共产主义渗透分子"为由，突然拘留好莱坞著名影星玛丽莲·梦露。据知情人士透露，此次行动源于其丈夫亚瑟·米勒——知名剧作家被列入黑名单后，梦露仍拒绝配合众议院非美活动调查委员会提供证词。\n事件发生在《热情似火》拍摄期间，片场突然闯入八名便衣探员，当着全体剧组的面将梦露带离。拘留持续了12小时，期间未允许律师会见。联邦调查局发言人声称，梦露涉嫌帮助丈夫销毁"危害国家安全"的手稿资料。"
 
 usatext.305.t:0 "梦露被捕引发轩然大波"
 usatext.305.d:0 "好莱坞自由联盟发表紧急声明，谴责"麦卡锡主义的幽灵正在践踏宪法"。纽约百老汇剧院连夜组织守夜活动，抗议者举着"艺术不是犯罪"的标语包围联邦法院。白宫记者会上，当被问及此事时，总统仅表示"司法程序应当得到尊重"。\n据悉，梦露获释后立即前往丈夫住所，狗仔队拍到她手持《权利法案》小册子走进大门的画面。这场发生在日落大道的拘捕事件，已然成为检验美国公民自由的新试金石。"
 
 usatext.306.t:0 "电影《王子与舞女》上映"
 usatext.306.d:0 "好莱坞当红影星玛丽莲·梦露主演的新电影《王子与舞女》在美国和英国上映，本片由华纳兄弟公司制作，英国男演员劳伦斯·奥利维尔出演男主角。\n影片讲述虚构国家卡帕西亚的国王尼古拉斯八世与梦露饰演的英国舞女之间的爱情故事，影片在英国很受欢迎，但在美国没有像梦露的其他作品那样受到追捧，但也仍赚得一些利润。"
 
 usatext.307.t:0 "电影《冰海沉船》上映"
 usatext.307.d:0 "英国灾难纪录片《冰海沉船》上映，该片根据沃尔特·路德于1955年出版的同名书籍改编而成。该影片深入探讨1912年4月15日泰坦尼克号沉没事故的最后一夜。电影由埃里克·安布勒改编，罗伊·沃德·贝克执导，肯尼斯·摩尔出演泰坦尼克号的二副查尔斯·莱托勒，其他演员包括大卫·麦考姆、肯尼斯·格里菲斯、劳伦斯·奈史密斯、麦可·古德利夫和塔克·麦奎尔。该片在英国拍摄，以纪录片风格生动呈现了主要事件和参与者，并极为讲究细节。\n制作团队在制片人威廉·马奎蒂（他亲身见证了泰坦尼克号下水）的监督下，使用了该船的蓝图来打造真实的布景，而四副约瑟夫·博克斯霍尔和前冠达邮轮准将哈里·格拉蒂奇则担任本片的技术顾问。"
 
 
 usatext.310.t:0 "北卡罗莱纳州的黑人团体激进化"
 usatext.310.d:0 "随着黑人民权运动不断发展，暴力冲突愈发激烈。南方一些黑人组织开始实行武力反抗。最先公开实施的北卡罗来纳州门罗地方协进会的罗伯特·F·威廉斯。当三K党的恐吓吓跑了协进会成员后，威廉斯对其进行了重建。他的方式是鼓励新来的工人阶级成员拿起武器进行抵抗。"
 
 usatext.311.t:0 "北卡罗莱纳州发生枪战事件！"
 usatext.311.d:0 "北卡罗莱纳州的黑人运动驻地遭到KKK分子袭击！三K党巡夜人袭击协进会成员阿尔伯特·佩里博士的家时，罗伯特·F·威廉斯的民兵开火反击，将其击退。"
 
 usatext.312.t:0 "门罗KKK团体被要求缴械！"
 usatext.312.d:0 "黑人民兵武装与KKK之间的火并闹到了北卡罗莱纳州法院，法院宣布KKK团体非法持枪、谋杀和破坏公共秩序，要求其全部解散武装并交出枪支。"
 
 usatext.313.t:0 "门罗黑人协进会被要求缴械！"
 usatext.313.d:0 "黑人民兵武装与KKK之间的火并闹到了北卡罗莱纳州法院，法院宣布黑人团体非法持枪、谋杀和破坏公共秩序，要求其全部解散武装并交出枪支。"
 
 
 usatext.314.t:0 "北卡罗莱纳州发生大规模种族冲突！"
 usatext.314.d:0 "来自北卡罗莱纳州的突发消息！该州莱克斯顿镇爆发了KKK分子与伦比人原住民之间的激烈冲突！\nKKK准军事组织北卡罗莱纳骑士团头目詹姆斯·科尔纠集种族主义者在该州莱克斯顿镇举行鼓吹种族主义、种族隔离和白人至上主义的集会，并开着装有扩音器的卡车招摇过市，激怒了该地区的伦比族原住民。伦比人闯入集会现场进行阻挠，双方爆发激烈肢体冲突，随后双方纠集人群，一百多名KKK分子和五百多名伦比人在海耶斯湖旁的玉米地持枪对峙。一声不知哪来的枪响后，伦比人立刻举枪朝天射击，KKK分子仓皇逃串，詹姆斯·科尔逃入沼泽后被赶来的警察逮捕，而伦比人缴获了KKK分子的旗帜后向记者公开焚毁。"
 
 usatext.315.t:0 "詹姆斯·科尔被捕！"
 usatext.315.d:0 "发生在莱克斯顿的种族冲突引发全美关注，詹姆斯·科尔纠集KKK武装团体公然煽动种族暴力的行为，引发舆论不满。北卡罗莱纳州法院指控詹姆斯·科尔犯下叛乱罪和危害公共安全罪，对其下达逮捕令，并在不久后进行起诉。"
 
 usatext.316.t:0 "詹姆斯·科尔被释放！"
 
 
 usatext.317.t:0 "罗伯特·F·威廉斯呼吁以暴制暴"
 usatext.317.d:0 "美国黑人民权运动愈发激进，北卡罗莱纳州的黑人领袖罗伯特·F·威廉斯在《纽约时报》刊登头版头条，呼吁民众团结起来，武装起来，随时准备以暴制暴。"
 
 usatext.320.t:0 "堪萨斯州威齐托发生抵隔离的静坐抗议"
 usatext.320.d:0 "美国堪萨斯州威齐托市发生了黑人民权运动组织抵制种族隔离制度的抗议！\n据报道，威齐托市一家名为达科姆商店的柜台只为白人提供午餐服务，而拒绝服务黑人，因此，当地的有色人种协会决定通过静坐的方式进行抗议。昨天早上，十几名黑人学生进入商店内试图点单，一名女性服务员为他们递上了可口可乐，但服务员似乎突然想起商店不为黑人服务，于是便拿走了可乐。双方就这一直僵持到商店关门。\n而到了今天早上，更多的示威者前往达科姆商店占座，尽管有些白人至上主义分子对他们进行了骚扰，但他们不为所动。"
 
 usatext.321.t:0 "达科姆药店宣布废除种族隔离制度"
 usatext.321.d:0 "“给他们上菜吧——我损失太多钱了。\n堪萨斯州的抵制达科姆商店的静坐运动取得成功，商店总经理对记者表示，他们将接受示威者的诉求，向所有顾客提供平等的服务，无论他们的肤色是什么。"
 
 usatext.322.t:0 "威齐托警察与示威者爆发激烈冲突"
 usatext.322.d:0 "黑人民权组织在威齐托的示威活动激怒了堪萨斯州当局，在收到达科姆商店的报警电话后，警方出动前往商店驱散示威者，双方爆发激烈冲突。"
 
 
 usatext.325.t:0 "北卡罗莱纳格林斯伯勒发生静坐抗议"
 usatext.325.d:0 "北卡罗来纳州立农业技术大学的四名黑人学生坐在午餐柜台，抗议伍尔沃市斯拒绝为非裔美国人服务的政策。\n四位学生从店里买了些其它小东西，并保留了收据，然后坐在午餐柜台前要求服务。在被拒绝后，他们拿出了收据，问为什么用钱可以在其它地方买到东西，但是在午餐柜台就不行。\n抗议者们都穿着体面，安静地坐着，隔一个位子坐一个人，以方便其它白人同情人士加入抗议。"
 
 usatext.326.t:0 "静坐抗议进一步扩大"
 usatext.326.d:0 "格林斯伯勒静坐抗议很快在里士满、纳什维尔、亚特兰大被示威者模仿。最直接的影响是纳什维尔，为了配合抵制运动，数以百计组织有序、素质良好的大学生在纳什维尔组织静坐抗议。"
 
 usatext.327.t:0 "静坐抗议向南方多地蔓延"
 usatext.327.d:0 "在黑人民权组织的支持下，静坐抗议向南方多地蔓延，从弗吉尼亚州的海岸，到佐治亚、佛罗里达、阿拉巴马和密西西比州的城市，再到德克萨斯，多地都爆发了黑人反对种族隔离的静坐活动。示威人士不单在午餐柜台前静坐抗议，还在公园、长椅、图书馆、剧院、博物馆和其他公共场所内抗议示威，通过占据公共设施表达不满。"
 
 usatext.328.t:0 "静坐抗议向更多地区蔓延"
 usatext.328.d:0 "静坐抗议已经扩散到整个南方和周边地区，甚至到了内华达州、 伊利诺伊州和俄亥俄州内歧视黑人的地方。洛杉矶的黑人居民也发起了静坐运动。"
 
 usatext.329.t:0 "学生非暴力协调委员会的形成"
 usatext.329.d:0 "组织静坐抗议的积极分子受到南方基督教领袖协会积极分子艾拉·贝克的邀请，在北卡罗来纳州罗利的传统黑人大学萧尔大学举行会议。会议促进了学生非暴力协调委员会的形成。"
 
 usatext.330.t:0 "反隔离静坐抗议遭到暴力驱散"
 usatext.330.d:0 "美国政府出动警察，暴力驱散了反对种族隔离的静坐示威活动。"
 
 usatext.331.t:0 "KKK骑士团的形成"
 usatext.331.d:0 "在美国黑人运动愈发扩大的同时，反对黑人运动、支持捍卫种族隔离政策的白人至上主义团体也在兴起。北卡罗莱纳州KKK头目詹姆斯·科尔宣布成立所谓的骑士团组织，自称大祭司，进行反对黑人民权的活动。"
 
 usatext.332.t:0 "美国最高法院督促尽快废除种族隔离制度"
 usatext.332.d:0 "美国最高法院在最近的会议上，在此讨论了前不久发生的奥利弗起诉托皮卡教育局案，并宣布，呼吁全国各地尽快废除广泛存在于美国社会中的隔离制度。\n沃伦·厄尔大法官对记者强调，所谓的隔离单平等，本质上依然是不平等，因为绝大部分公立学校将黑人学生单独划出小教室，并使他们无法获得白人能使用的设施，会对学生的心理和精神状态造成影响，使他们无法正常生活。大法官强调，最高法院将采取行动监督种族隔离废除的实施。\n美国南方的白人至上主义者强烈抵制这一决策，许多白人控制下的州立学校宁愿直接关门，也不愿意接受黑人学生。一些白人富豪试图通过投资私立学校以躲避审查。"
 
 
