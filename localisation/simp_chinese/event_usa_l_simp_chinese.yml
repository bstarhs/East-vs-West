 usatext.214.t:0 "马丁·路德·金被捕"
 usatext.214.d:0 "阿拉巴马州地方法院以组织抵制公共汽车系统为由，对马丁·路德·金牧师签发逮捕令。这位年轻的浸信会牧师成为蒙哥马利巴士抵制运动第89位被起诉的黑人领袖。\n当法警给金牧师戴上手铐时，数百名非裔民众在法院台阶上唱起圣歌。这是对宪法第一修正案的侮辱。金夫人在接受采访时表示：我丈夫只是在践行基督的教诲。\n州检察官在起诉书中指控金牧师煽动叛乱，最高可判10年监禁。全美有色人种协进会已组建豪华律师团，前第一夫人埃莉诺·罗斯福更公开谴责：阿拉巴马正在重演奴隶制的暴行。\n白宫新闻秘书拒绝对此置评，但消息人士透露总统已要求司法部密切关注。入夜时分，金牧师的牢房外排起长队——黑人工人们轮流守夜，这位危险分子的囚室里传来的是《圣经》翻页声，而非仇恨的咆哮。"
 
 usatext.215.t:0 "电视剧《我爱露西》开播"
 usatext.215.d:0 "晚上8点，数百万台电视机同时亮起。当露西尔·鲍尔那张表情丰富的脸出现在荧屏上，对着丈夫里奇大喊"你有个大大的解释要给我！"时，整个美国都笑出了声。\n在纽约的一户公寓里，一家挤在9寸的黑白电视机前，小女儿模仿着露西著名的葡萄踩踏动作，把客厅地毯弄得全是果汁渍。芝加哥的电器商店外，路人驻足围观橱窗里播放的《我爱露西》，笑声穿透了秋夜的薄雾。连白宫接线员都向记者透露，当晚总统热线异常安静——"大概都在看电视"。\n当露西试图把巧克力工厂的传送带塞进嘴里时，收视率飙升至68%，打破了所有纪录。次日清晨，主妇们纷纷在超市模仿露西的滑稽腔调，而工厂工人们则讨论着里奇的管教方式。\n这不是节目。《电视指南》在头版写道。这是一场全国性的集体治疗。这个古巴丈夫和美国红发妞的故事，治愈了战后焦虑的整个国家。"
 usatext.215.a:0 "电视剧《我爱露西》开播"
 
 usatext.216.t:0 "演员詹姆斯·迪恩遭遇车祸去世"
 usatext.216.d:0 "美国知名男演员詹姆斯·拜伦·迪恩在加利福尼亚州遭遇车祸去世，年仅24岁，詹姆斯·迪恩因参演《伊甸园之东》而声名鹊起，后又参演了《无因的反叛》及《巨人》，原本前途无量的影视明星却意外的英年早逝，令美国民众无不惋惜。"
 
