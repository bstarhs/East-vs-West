l_simp_chinese:
 usatext.1.t:0 "美国总统杜鲁门发表国情咨文"
 usatext.1.d:0 "昨天，哈里·杜鲁门总统向国会发表了国情咨文。他说,当今世界面临的形势十分严峻,世界上有两种生活方式。一个是基于多数人的意愿。它的特点是自由制度、代议政制、自由选举、保障人身自由、言论和信仰自由以及免受政治压迫。第二种生活方式是基于少数人强加给多数人的意愿。它依赖于恐怖和压迫、受控制的报纸和广播、国内选举和对个人自由的压制。我认为，美国的政策必须是支持自由国家，这些国家抵抗武装少数派或试图征服它们的外国人民的压力\n这一讲话引起了苏联的警惕，苏联认为这是美国敌对行为的开始。"
 usatext.1.a:0 "看看接下来会发生什么。"
 
 usatext.4.t:0 "美国想和我们签订一项军事合作条约"
 usatext.4.d:0 "华盛顿给我们发来消息，希望与我国签署一项军事互助条约。白宫声称美国有责任帮助自由世界。有了美国的支持，我们可以更好地同共产党及其所支持的反对派作斗争。"
 usatext.4.a:0 "我们应该与自由世界并肩战斗。"
 usatext.4.b:0 "这不符合我们的国家利益。"
 
 usatext.5.t:0 "[From.GetName] 接受了我们的军事合作。"
 usatext.5.d:0 "现在[From.GetName] 已经和我们签订了共同防御条约，今后我们将共同打击共产主义和恐怖分子。"
 usatext.5.a:0 "很好。"
 
 usatext.8.t:0 "美国援助"
 usatext.8.d:0 "美国国务卿马歇尔提出了欧洲复苏计划，美国政府将向欧洲国家提供相当大的贷款。我们应该接受这笔钱吗？"
 usatext.8.a:0 "欢迎美国。"
 usatext.8.b:0 "这都是美国佬的阴谋。"
 
 usatext.9.t:0 "[PREV.GetName]接受了美国的援助"
 usatext.9.d:0 "[PREV.GetName]接受了美国的的经济援助，两国关系正在不断靠近。"
 usatext.9.a:0 "很好。"
 
 usatext.10.t:0 "北大西洋公约组织"
 usatext.10.d:0 "昨天，美国、加拿大和8个欧洲国家在布鲁塞尔举行会议，宣布签署北大西洋公约组织。在该条约中，美国和其他自由国家将建立军事合作，共同对抗军事威胁。苏联谴责该条约是对欧洲社会主义国家的威胁。"
 usatext.10.a:0 "很好。"
 
 usatext.11.t:0 "玛丽莲·梦露——兴起的好莱坞新星"
 usatext.11.d:0 "随着电影《Niagara》上映，一位新的好莱坞女星吸引了媒体的注意。27岁的女演员玛丽莲·梦露在影片中扮演一位性感、迷人的弑夫之女，为观众所着迷。"
 usatext.11.a:0 "很好。"
 
 usatext.12.t:0 "玛丽莲·梦露慰问驻韩美军"
 usatext.12.d:0 "当红女星玛丽莲·梦露前往南韩，为驻扎南韩的美军士兵劳军。"
 usatext.12.a:0 "很好。"
 
 usatext.13.t:0 "玛丽莲·梦露支持民权运动"
 usatext.13.d:0 "随着黑人民权运动愈演愈烈，好莱坞女星玛丽莲·梦露表达了自己的主张。在她的坚持下，一位黑人女演员得到了重要角色的演出，这是黑人在影视圈地位的重要突破。"
 usatext.13.a:0 "很好。"
 
 usatext.14.t:0 "玛丽莲·梦露支持民权运动"
 usatext.14.d:0 "女星玛丽莲·梦露身着朴素的服装，探访了洛杉矶郊区的一处贫民窟，并与居民近距离交谈，其中不乏黑人。面对记者的提问，梦露抱怨并批评美国现存的社会制度，呼吁改善下层阶级的地位。"
 usatext.14.a:0 "很好。"
 
 usatext.15.t:0 "[ROOT.GetName]加入美洲进步同盟"
 usatext.15.d:0 "[ROOT.GetName]政府官员与美国外交官，今日早上在该国首都正式签署条约。[ROOT.GetName]将加入美国主导的美洲进步同盟，美国政府将为该国提供物资、贷款和其他援助，以帮助该国的经济发展。\n就像富兰克林·罗斯福说的那样，腐败和贫穷是独裁的土壤。美国官员对记者说道。\n美国政府将帮助拉丁美洲国家摆脱贫穷，当人们得到自由世界给予的繁荣和发展时，自然就会对共产党的谎言保持警惕。"
 
 usatext.16.t:0 "玛丽莲·梦露丑闻！"
 usatext.16.d:0 "在媒体的摄像头下，玛丽莲·梦露公开了自己与美国总统约翰·菲茨杰拉德·肯尼迪的情人关系！梦露宣称，肯尼迪长期向梦露赠送礼物，二人幽会时，肯尼迪偶尔会向梦露泄露国家机密。梦露警告肯尼迪，如果不能给她一个名分，她将向社会公布五角大楼的秘密。"
 
 usatext.17.t:0 "约翰·肯尼迪辞职"
 usatext.17.d:0 "受玛丽莲·梦露事件的影响，肯尼迪被迫辞去自己的总统职务，由林登·贝恩斯·约翰逊接任。"
 usatext.17.a:0 "很好。"
 
 usatext.18.t:0 "梦露在家中自杀！"
 usatext.18.d:0 "玛丽莲·梦露被发现在家中死亡！她服用大量安眠药之后倒在了家中的沙发上。联邦调查局宣布梦露死于自杀，但绝大部分人相信，梦露是因为卷入政治阴谋被杀害。"
 usatext.18.t:0 "多么令人惋惜的悲剧。"
 
 usatext.20.t:0 "蒙哥马利事件"
 usatext.20.d:0 "一些黑人民权运动在阿拉巴马州的蒙哥马利举行抗议活动，抗议逮捕罗莎·帕克斯，一名拒绝在公共汽车上给白人让座的黑人妇女。抗议者抵制公共汽车，要求有色人种享有公民权利。"
 usatext.20.a:0 "历史的巨轮已经启动。。"
 
 usatext.21.t:0 "黑人暴动"
 usatext.21.d:0 "昨天，一些有色人种的民权抗议者与警方发生了激烈的冲突。他们在底特律和芝加哥等城市举行了一些示威游行，警方试图阻止他们，但愤怒的抗议者冲向警车。它导致一些人受伤。"
 usatext.21.a:0 "快制止骚乱。"
 
 usatext.22.t:0 "我有一个梦想。"
 usatext.22.d:0 "马丁·路德·金今天在林肯纪念堂发表了美国历史上最伟大的演讲。“我梦想有一天，这个国家将站起来，实现其信条的真正含义：我们认为这些真理是不言而喻的，人人生而平等。我梦想有一天，在佐治亚州的红山上，前奴隶的儿子们和前奴隶主的儿子们将能够一起坐在餐桌旁兄弟情谊。”"
 usatext.22.a:0 "都给我冷静下来。"
 
 usatext.23.t:0 "[USA.GetLeader] 会见马丁·路德·金"
 usatext.23.d:0 " [USA.GetLeader] 总统在白宫会见有色人种民权领袖马丁·罗瑟·金，他们正在寻求解决黑人权利问题的途径"
 usatext.23.a:0 "好兆头。"
 
 usatext.24.t:0 "民权法案"
 usatext.24.d:0 "今天， [USA.GetLeader] 总统签署了一项新的民权法案，宣布禁止任何的种族歧视。教育、公共服务和其他领域的一切种族歧视都将被禁止，这是有色人种抗议运动的新成果。"
 usatext.24.a:0 "好兆头。"
 
 usatext.25.t:0 "美洲进步同盟"
 usatext.25.d:0 "美国政府邀请我们加入美洲进步同盟，以支持拉丁美洲国家的发展。古巴革命后，华盛顿方面意识到贫穷和落后是共产主义起义的主要原因，只有联合其他国家才能遏制这些红色魔鬼。"
 usatext.25.a:0 "好兆头。"
 
 usatext.27.t:0 "肯尼迪遇刺！！！"
 usatext.27.d:0 "今天，肯尼迪总统的车队在达拉斯的巡游路线经过达拉斯最繁华地区，车队在埃尔姆街道上行驶，车队的车速仅15~20公里每小时。正当一切顺利时，车队经过德克萨斯州教科书仓库，一声枪响，肯尼迪总统被远处高楼上的杀手打击中额头后倒在了车后座上。。。"
 usatext.27.a:0 "真是个可怕的噩耗！"
 usatext.27.b:0 "好死！开香槟了！"
 
 usatext.28.t:0 "肯尼迪还活着！！！"
 usatext.28.d:0 "天佑总统！万幸，杀手的子弹只是擦破了肯尼迪的额头，州长和第一夫人都只是受了轻伤，杀手在枪击后迅速离开现场，乘坐公交回到其居住地，在其住所特工们发现了杀手的尸体。"
 usatext.28.a:0 "结束了。"
 
 usatext.29.t:0 "我们选择前往月球。"
 usatext.29.d:0 "我们决定登月。我们决定在这十年间登上月球，并实现更多梦想，并非它们轻而易举，而是它们困难重重。因为这个目标将促进我们实现最佳的组织并测出我们最佳的能力，因为这个挑战我们乐于接受，因为这个挑战我们不愿推迟，因为这个挑战我们志在必得，其他的挑战也是如此。"
 usatext.29.a:0 "局势不断恶化。"
 
 usatext.30.t:0 "反战集会"
 usatext.30.d:0 "自从越战爆发以来，全国各地每个月都有几百名抗议者走上街头抗议，部分抗议者与军警爆发了小型冲突。"
 usatext.30.a:0 "都给我冷静下来。"
 
 usatext.31.t:0 "肯特大学的枪声!"
 usatext.31.d:0 "在尼克松在竞选中信誓旦旦，承诺结束越南战争。但是在当选后又宣布向柬埔寨派遣了美国作战部队，对柬埔寨东部的“胡志明小道”狂轰烂炸，以摧毁在那里的越南军队。此事再次激起美国人民的反战浪潮。肯特大学的大学生终于也组织起了集会来反对越南战争。 学校当局向国民警卫队发出请求，要求恢复校园秩序。荷枪实弹的国民警卫队开进校园，驱散示威学生。愤怒的学生向士兵叫喊并投掷石块。在混乱中，国民警卫队开枪射击，打死四人，打伤多人。"
 usatext.31.a:0 "悲剧！"
 
 usatext.32.t:0 "[USA.GetLeader]发表国情咨文"
 usatext.32.d:0 "美国总统[USA.GetLeader]发表国情咨文，主张在英法势力离开中东后取而代之。由国务卿杜勒斯起草的《中东决议案》指出，美国将对中东国家实行“经济合作”和军事援助计划；授权总统在他认为必要时使用武力来“保护”任何请求军事援助的国家，以维护它的领土完整和政治独立，防止“共产主义侵略”。"
 usatext.32.a:0 "确定"
 
 usatext.33.t:0 "缓和政策"
 usatext.33.d:0 "美国总统[USA.GetLeader]近日提出，主张与苏联建立缓和的关系，减少世界大战的威胁。"
 usatext.33.a:0 "确定"
 
 usatext.34.t:0 "多米诺骨牌理论"
 usatext.34.d:0 "美国总统[USA.GetLeader]在新闻发布会上发表讲话。他指出，随着中国共产党夺取中国大陆，亚洲各地的共产党，尤其是东南亚地区的共产党暴动正进一步加剧。如果共产党夺取朝鲜或越南政权，那么亚洲各国就会像多米诺骨牌一样，从越南，到老挝、老挝、柬埔寨、泰国、缅甸、马来西亚等一步一步被控制。"
 usatext.34.a:0 "确定"
 
 usatext.35.t:0 "《与台湾关系法》"
 usatext.35.d:0 "美国国会近日通过了《与台湾关系法》，以处理美国与中华人民共和国建交后，同中华民国之间的特殊关系。尽管美国政府强调了承认中华人民共和国为中国的唯一合法政府，但仍然通过《与台湾关系法》，暗示了自己仍然会和台湾保持必要的合作关系。"
 usatext.35.a:0 "确定"
 
 usatext.36.t:0 "民主党的支持率下跌"
 usatext.36.d:0 "由于美国政府与民权运动分子进行接触，招致了民主党最大票仓——南方白人保守人士的不满，民主党的支持率有所下滑。"
 usatext.36.a:0 "确定"
 
 usatext.40.t:0 "水门事件"
 usatext.40.d:0 "为了取得民主党内部竞选策略的情报，美国共和党尼克松竞选班子的首席安全问题顾问詹姆斯·麦科德为首的5人潜入位于华盛顿水门大厦的民主党全国委员会办公室，在安装窃听器并偷拍有关文件。"
 usatext.40.a:0 "美国的耻辱！"
 
 usatext.41.t:0 "尼克松辞职了！"
 usatext.41.d:0 "由于水门事件的持续发酵，尼克松曾一度竭力掩盖开脱，但在随后对这一案件的继续调查中，尼克松政府里的许多人被陆续揭发出来，并直接涉及到尼克松本人，从而引发了严重的宪法危机，美国众议院决定由该院司法委员会负责调查、搜集尼克松的罪证，为弹劾尼克松作准备。司法委员会决定公布与弹劾尼克松有关的全部证据，最终陆续通过了三项弹劾尼克松的条款。尼克松迫于舆论压力致信国务卿基辛格宣布辞职，从而成为美国历史上首位因丑闻而辞职的总统。"
 usatext.41.a:0 "骗子！"
 
 
 usatext.45.t:0 "美国希望向我国派遣军事顾问"
 usatext.45.d:0 "美国政府提出向我国派遣一支军事顾问，协助我国训练军队，强化军事能力，以抵抗可能的共产主义入侵。"
 
 usatext.46.t:0 "[ROOT.GetName]向我国请求军事顾问"
 usatext.46.d:0 "[ROOT.GetName]政府向我们发来请求，希望派遣一支军事顾问，协助该国训练军队，强化军事能力，以抵抗可能的共产主义入侵。"
 
 usatext.47.t:0 "美国向[FROM.GetName]派遣军事顾问"
 usatext.47.d:0 "美国政府与[FROM.GetName]发表共同声明，美国将向该国派遣一支美军军事顾问团，协助[FROM.GetName]训练军队，强化军事能力，以抵抗可能的共产主义入侵。"
 
 usatext.48.t:0 "美国拒绝了我们的请求"
 usatext.48.d:0 "美国拒绝派出军事顾问协助我们的军事发展。"
 
 usatext.49.t:0 "美国向[ROOT.GetName]派遣军事顾问"
 usatext.49.d:0 "美国政府与[ROOT.GetName]发表共同声明，美国将向该国派遣一支美军军事顾问团，协助[FROM.GetName]训练军队，强化军事能力，以抵抗可能的共产主义入侵。"
 
 usatext.50.t:0 "联合国大厦在纽约落成"
 usatext.50.d:0 "位于纽约曼哈顿东河河畔的联合国总部建筑群正式宣告落成，并举行了隆重的竣工典礼。世界多国代表出席了这一仪式，共同见证了这一象征着国际合作与和平愿景的物理载体的诞生。\n联合国秘书长特里格夫·赖伊在典礼上发表演讲。他高度评价这座新建筑不仅是一个工作场所，更是“全人类对更美好未来共同信念的体现”。赖伊秘书长祝福联合国的未来工作能在这个新家顺利开展，为世界和平与安全做出更大贡献。\n这座建筑本身亦是典礼的焦点。它由国际顶尖建筑师团队设计，其中巴西的奥斯卡·尼迈耶与法国的勒·柯布西耶发挥了核心作用。其简洁的线条、大面积的玻璃幕墙与创新的功能布局，完美体现了二战后兴起的现代主义建筑风格，彻底打破了传统官方建筑的沉闷面貌，被誉为“国际风格”的典范之作。它的落成，不仅为联合国提供了永久的家，也立即成为纽约的新地标，并将对全球建筑设计与城市规划产生深远影响。"
 
 
 usatext.60.t:0 "绑架记者事件"
 usatext.60.d:0 "黎巴嫩持续出现亲伊朗的什叶派穆斯林和亲叙利亚的逊尼派穆斯林之间相互绑架人质的事件。十余天内，已经连续发生了7起绑架事件，共有9名人质被扣。"
 usatext.60.a:0 "祝他们好运。"
 
 usatext.70.t:0 "世界文化自由大会成立"
 usatext.70.d:0 "在美国政府支持下，世界文化自由大会在西柏林正式成立，该团体旨在包围世界各国地文化、言论、信仰和政治自由，对抗共产主义和极权主义。"
 
 usatext.71.t:0 "和平信息中心的成立"
 usatext.71.d:0 "美国社会运动家WEB·杜波依斯宣布成立名为和平信息中心的反战组织，提供其他国家和平倡议的信息，并推广斯德哥尔摩呼吁。\nWEB·杜波依斯是一位坚定的核武器反对者，他致力于在美国宣传斯德哥尔摩和平呼吁。该呼吁的主要目的是收集请愿书上的签名，呼吁世界各国政府禁止所有核武器。和平信息中心出版了一份名为《和平电报》的刊物，报道与和平相关的国际动态。"
 
 usatext.72.t:0 "美国和平组织抵制朝鲜战争！"
 usatext.72.d:0 "美国和平组织联合多名社会活动家，发起了反对美国介入朝鲜战争的政治运动！该团体猛烈抨击道格拉斯·麦克阿瑟，并表示担心朝鲜战争最终会导致核浩劫。该组织支持美军撤出朝鲜半岛、与中华人民共和国进行谈判以及撤掉道格拉斯·麦克阿瑟，该组织认为这将有助于结束战争。"
 
 
 usatext.80.t:0 "纽约多地炸弹袭击事件！"
 usatext.80.d:0 "啪！！！！！\n\n来自纽约市的突发消息！今天上午，美国纽约中央车站突然传来一声巨响，候车室内的一个烟灰缸被崩上了天，把旅客们弄得灰头土脸。正当车站内的人惊慌失措地逃离时，车站外的电话亭和纽约公共图书馆门口的电话亭也发生了爆炸。\n尽管爆炸没有导致人员伤亡，纽约警方认为这是某个疯狂小孩的恶作剧，但依然引起了纽约市民的恐慌。"
 
 usatext.81.t:0 "联合爱迪生公司大楼遭炸弹恐吓"
 usatext.81.d:0 "位于纽约的联合爱迪生公司大楼今日收到一个可怕的快递，快递内装载着一枚雷管制成的炸弹，好在炸弹没有安装引信。爱迪生公司认为这是某种敲诈勒索，宣布已经报警处理。"
 
 usatext.82.t:0 "F.P.致信纽约时报"
 usatext.82.d:0 "《纽约时报》收到了一封自称F.P.的匿名者所寄的信件，信件中，此人自称制造了先前在纽约中央车站、公共图书馆和爱迪生公司总部的炸弹袭击事件，并表示：\n\n炸弹将继续存在，直到联合爱迪生公司因他们对我的卑鄙行为受到惩罚。我已经用尽了所有办法，只能借助炸弹让别人为我伸张正义。\n在你阅读此信的同时，一枚威力更强的炸弹已经被安装在派拉蒙剧院和宾夕法尼亚车站的其中一个地方。\n——F.P.\n\n自从F.P.致信纽约时报后，这个炸弹客终于引起了纽约市民和警察的关注，人们将其称为疯狂炸弹人。"
 
 usatext.83.t:0 "纽约中央车站再遭爆炸袭击！"
 usatext.83.d:0 "嘣！！！！！\n\n在疯狂炸弹人沉寂一年多以后，纽约中央车站传出巨大的爆炸声，车站的男厕里一声巨响，三个裤子都没提上的男人满脸鲜血地顶着xx冲了出来，一股芬芳在中央车站开始弥漫。\n炸弹客F.P.致信报纸宣布制造了此次袭击，这是F.P.的炸弹袭击首次造成人员受伤。"
 
 usatext.84.t:0 "纽约陷入爆炸恐慌！"
 usatext.84.d:0 "短短几个月时间，纽约市民寝食难安，从电影院到电话亭，到处都是被怀疑安放了炸弹的地方，纽约警察局已经接到了无数的炸弹预警，他们有的是虚惊一场，有的在意料之外突然爆炸。还有大量的别有用心者冒充F.P.发出炸弹恐吓。\n就在昨天，宾夕法尼亚车站一声巨响，五十多岁的列车员本尼·约翰逊被炸弹冲击波直接弹到了隔间的门板上，差点成为疯狂炸弹客手下的第一个亡魂。\n市民们将一切归咎于警察的无能，纽约警察面临着巨大压力。"
 
 usatext.85.t:0 "派拉蒙剧场遇袭"
 usatext.85.d:0 "嘭！！！！！\n\n纽约市派拉蒙剧院里，一个正在上演舞台剧的剧场突然传出一声巨响，随之升起滚滚浓烟，一千五百多名观众惊慌失措，连滚带爬地逃出剧院，最终导致6人重伤，踩踏事故还导致一百多人轻伤。这是F.P.所制造的最为严重的袭击事件。"
 
 usatext.86.t:0 "疯狂炸弹人的公开信"
 usatext.86.d:0 "嘭！！！！！！\n\n昨天深夜，纽约公共图书馆再次发生爆炸。这一次，纽约警察的忍耐到了极点。今天早上，纽约警方和各路媒体联合发表一封公开信，敦促疯狂炸弹人尽快自首，承诺会公平审理炸弹人与联合爱迪生公司之间的矛盾。F.P.已于今天下午回信，强调在联合爱迪生得到应有的惩罚前，绝对不会停止。随后，F.P.在信中简单介绍了自己的经历——他曾为联合爱迪生公司工作了数年，却在1931年的一次爆炸事故中受了伤，联合爱迪生公司不仅没有为其支付任何赔偿金，反而立刻中断了雇佣关系，拒绝为他承担任何责任。"
 
 usatext.87.t:0 "疯狂炸弹人落网！"
 usatext.87.d:0 "康涅狄格州沃特伯里市，纽约警察局探长霍华德·芬尼带着四名警察敲开了一座山丘上的房子的门。一个戴着眼镜的四十多岁男子打开了门。警察出示搜查令，进入了房子，并找到了一本笔记本。\n男子见状说到：我知道你们来干什么了，你们认为我说疯狂炸弹客。\n那么你留下的F.P.是什么意思？\n公平竞争啊。你不觉得公平很重要吗？探长？\n\n来自康涅狄格州的消息！肆虐纽约将近六年的疯狂炸弹客——本名乔治·彼得·梅特斯基，今日正式落网！纽约警察局的霍华德·芬尼探长通过媒体与炸弹客互通书信，逐渐摸清的炸弹客的身份和特征，并在今天前往康涅狄格，将这名四十多岁的袭击者绳之以法！乔治·梅特斯基被捕时，身着双排深褐色外套，并干净利索地承认了32起炸弹袭击事件。现在等待他的将是法律的审判。"
 
 usatext.88.t:0 "对梅特斯基的审判"
 usatext.88.d:0 "乔治·梅特斯基被捕后，其早年经历也被媒体所公布，于是，社会舆论发生变化，一些民众认为他并不是邪恶的恐怖分子，而是一个被爱迪生公司抛弃、被迫走向极端的可怜老工人。纽约市法院以谋杀未遂、爆炸破坏建筑物、恶意危害生命以及携带隐藏武器等47项罪名起诉梅特斯基时，立刻引发了社会公众的热烈讨论。"
 
 usatext.89.t:0 "梅特斯基被判处强制治疗"
 
 usatext.90.t:0 "梅特斯基被判处终身监禁"
 
 usatext.91.t:0 "加州独立运动"
 usatext.91.d:0 "近日来，加州部分团体主张增加加州自主权或独立，甚至部分组织宣称要将加州从美国独立出来。"
 usatext.91.a:0 "这不是个好兆头。"
 
 usatext.92.t:0 "夏威夷独立运动"
 usatext.92.d:0 "20世纪70年代以来，夏威夷原住民中出现多个要求获得某种形式主权的团体，他们认为，1893年推翻夏威夷女王的政变和1898年的兼并，都是非法的，要求美国政府对这两个事件和1898年后长期的军事占领进行道歉和赔偿。他们要求主权的运动迫使美国政府开始让步。"
 usatext.92.a:0 "这不是个好兆头。"

 usatext.93.t:0 "来自三K党的威胁"
 usatext.93.d:0 "近日来，国内一个奉行白人至上的组织三K党开始蠢蠢欲动，开始针对其他的有色人种群体。"
 usatext.93.a:0 "这不是个好兆头。"

 usatext.94.t:0 "南方叛乱"
 
 usatext.95.t:0 "卡尔弗特悬崖核电站事件"
 usatext.95.d:0 "昨夜，卡尔弗特悬崖核电站遭遇恐怖袭击发生核泄露事故，核电站的第二号反应堆发生了爆炸。连续的爆炸引发了大火并散发出大量高能辐射物质到大气层中，这些辐射尘涵盖了大面积区域。美国政府紧急将核电站附近的居民撤离，这次灾难所释放出的辐射线剂量是二战时期爆炸于广岛的原子弹的600倍以上。据专家估计，此次事故将造成大面积的无人区以及数以千亿计美元的损失。"
 usatext.95.a:0 "这不是个好兆头。"
 
 usatext.96.t:0 "美国邀请我们加入北约"
 usatext.96.d:0 "华盛顿方面向我们传递了一个信息，经过讨论，白宫认为邀请我们加入北约是有利的，这将保护我们免受共产主义和恐怖主义的袭扰。同时，他们也认为，作为一个盟友，我们有责任协助其他国家抗击军事威胁。"
 usatext.96.a:0 "我们应该与自由世界并肩战斗。"
 usatext.96.b:0 "这不符合我们的国家利益。"
 
 usatext.97.t:0 "[FROM.GetName]拒绝了我们的要求。"
 usatext.97.d:0 "[FROM.GetName]的领导人拒绝了我们的提议，他们的这个错误的决定将会使自己暴露在共产主义的威胁之下！"
 usatext.97.a:0 "愚蠢的决定!"
 
 nuke.5.t:0 "限制战略武器会谈"
 nuke.5.d:0 "昨天, 美国总统[USA.GetLeader]与苏联领导人[SOV.GetLeader]在维也纳举行了一次重要会议。会上，双方讨论了如何避免核武器和大规模杀伤性武器对人类造成的破坏，最终达成重要共识。双方签署了历史性的《削减战略武器条约》，同意在10年内销毁部分核武器并限制其发展。"
 nuke.5.a:0 "因为他们不愿意看见人类灭亡。"
 
 usatext.99.t:0 "罗森堡夫妇的审判"
 usatext.99.d:0 "美国青年共产主义联盟的两位领导人朱利叶斯·罗森堡和艾瑟尔·格林格拉斯·罗森堡被逮捕，他们被指控为苏联提供美国核武器情报。根据1917年的《间谍法》，他们将可能被除以极刑。"
 usatext.99.a:0 "愚蠢的决定!"
 
 usatext.100.t:0 "罗森堡夫妇的审判"
 usatext.100.d:0 "美国青年共产主义联盟的两位领导人朱利叶斯·罗森堡和艾瑟尔·格林格拉斯·罗森堡被逮捕，他们被指控为苏联提供美国核武器情报。根据1917年的《间谍法》，他们被除以极刑。罗森堡夫妇的处决引起了美国舆论的关注，人们普遍认为这是麦卡锡主义影响下的冤案。"
 usatext.100.a:0 "愚蠢的决定!"
 
 usatext.101.t:0 "罗森堡夫妇被释放"
 usatext.101.d:0 "在美国政府干涉下，罗森堡夫妇最终被无罪释放，成为麦卡锡主义迫害下的幸存者。罗森堡夫妇案件引起了美国社会广泛关注，人们注意到共产主义罪名可能被施加到无辜的人身上，而FBI和中情局对此大为光火。"
 usatext.101.a:0 "愚蠢的决定!"
 
 
 
 
 usatext.103.t:0 "参议员约瑟夫·麦卡锡的演讲"
 usatext.103.d:0 "在西弗吉尼亚共和党妇女俱乐部纪念亚伯拉罕·林肯诞辰的晚会上，参议院约瑟夫·麦卡锡发表了如下讲话：\n\n我手里有一份名单，上面列有205名共产党员，国务卿已获悉他们都是共产党员，但他们仍然在国务院工作并参与制定政策……"
 usatext.103.a:0 "铁拳怎么砸我头上了？"
 
 usatext.104.t:0 "非美行为调查委员会解散"
 usatext.104.d:0 "在美国最高法院的压力下，荒唐的非美行为调查委员会宣告解散，麦卡锡主义的时代随之结束。"
 usatext.104.a:0 "愚蠢的决定!"

 usatext.105.t:0 "美国政府赦免越战逃兵"
 usatext.105.d:0 "[USA.GetLeader]总统签署法令，宣布美国政府赦免在越南战争中逃避服兵役的美国公民。"
 usatext.105.a:0 "确定。"
 
 usatext.106.t:0 "嬉皮士文化的繁荣"
 usatext.106.d:0 "60年代末是20世纪西方国家反文化运动的兴盛期，其中最有代表性的莫过于美国的嬉皮士运动。嬉皮士们以长发、色彩鲜艳的打扮和流行音乐为特征，投入到反对越南战争、歧视和追求和平主义及性解放的运动当中，成为60、70年代美国的一道风景线。"
 usatext.106.a:0 "愚蠢的决定!"
 
 usatext.107.t:0 "绿色和平组织在加拿大成立"
 usatext.107.d:0 "60年代末是20世纪西方国家反文化运动的兴盛期，其中最有代表性的莫过于美国的嬉皮士运动。嬉皮士们以长发、色彩鲜艳的打扮和流行音乐为特征，投入到反对越南战争、歧视和追求和平主义及性解放的运动当中，成为60、70年代美国的一道风景线。"
 
 usatext.108.t:0 "马丁·路德·金遇刺"
 usatext.108.d:0 "美国黑人民权运动领袖马丁·路德·金在田纳西州被刺杀！"
 usatext.108.a:0 "愚蠢的决定!"
 
 usatext.109.t:0 "马丁·路德·金遇刺引发骚乱"
 usatext.109.d:0 "美国黑人民权运动领袖马丁·路德·金在田纳西州被刺杀！"
 usatext.109.a:0 "愚蠢的决定!"
 
 usatext.110.t:0 "美国发起特种战争"
 usatext.110.d:0 "美国总统[USA.GetLeader]宣布，为了支持越南等印度支那国家对抗共产主义的扩张，阻止东南亚赤化，美国将向东南亚派出武装力量。"
 usatext.110.a:0 "局势不断恶化。"
 
 usatext.111.t:0 "美国邀请我国加入美洲进步同盟
 usatext.111.d:0 "美国邀请我们加入美洲进步同盟，以共同保护美洲地区的和平，支持美洲国家的发展。\n加入美洲国家组织可以获得更多的美国经济和军事援助。"
 usatext.111.a:0 "我们应当接受。"
 usatext.111.b:0 "我们拒绝。"
 
 usatext.112.t:0 "[FROM.GetName]宣布加入美洲进步同盟"
 usatext.112.d:0 "[FROM.GetName]宣布加入美国主导下的美洲进步同盟。"
 usatext.112.a:0 "确定。"
 
 usatext.113.t:0 "美国总统[USA.GetLeader]提出外交政策转变"
 usatext.113.d:0 "美国总统[USA.GetLeader]在关岛提出了美国的新外交政策。美国将尽可能少，或不会再派出地面部队参与到亚洲盟友的防卫任务当中，而是以军事、经济援助和核保护伞作为替代。"
 usatext.113.a:0 "确定。"
 
 usatext.114.t:0 "美国总统[USA.GetLeader]公布战略武器防御计划"
 usatext.114.d:0 "美国总统[USA.GetLeader]公布战略武器防御计划，以各种手段攻击敌方的外太空的洲际战略导弹和外太空航天器，以防止敌对国家对美国及其盟国发动的核打击。"
 usatext.114.a:0 "确定。"
 
 usatext.115.t:0 "邪恶帝国"
 usatext.115.d:0 "美国总统[USA.GetLeader]在佛罗里达州奥兰多全国福音派协会发表演说，称苏联为“邪恶帝国”。"
 usatext.115.a:0 "确定。"
 
 usatext.116.t:0 "乔治·凯南发表X论文"
 usatext.116.d:0 "美国驻苏联大使馆参赞乔治·凯南，以X先生的化名，发表了论文《论苏联行动的根据》。乔治·凯南尖锐的批评俄罗斯及共产主义政府的对外扩张，并敦促美国政府采取行动。这篇论文已被交到美国国务院，显然其将影响未来几十年的国际局势。"
 usatext.116.a:0 "确定。"
 
 usatext.117.t:0 "《世界人权宣言》颁布"
 usatext.117.d:0 "由联合国主要成员国派出的法官起草的《世界人权宣言》再巴黎颁布，《宣言》是第二次世界大战反对纳粹主义胜利的结果，强调人人生而平等和自由，人民言论自由、信仰自由、免于恐惧和匮乏的自由是不可被剥夺的。"
 usatext.117.a:0 "确定。"
 
 usatext.118.t:0 "美国空军成立"
 usatext.118.d:0 "美国国防部决定成立新的独立空军，将原有的美国陆军航空兵和海军航空兵脱离陆海军后合并成为新的军种。"
 usatext.118.a:0 "确定。"
 
 usatext.119.t:0 "美国总统[USA.GetLeader]表态支持民权改革"
 usatext.119.d:0 "在第二次世界大战中，美国黑人踊跃参军，为击败纳粹做出巨大贡献，然而这并没有改变黑人在美国依然广泛遭受歧视的现状，甚至发生了退役黑人军人依然遭到歧视和迫害的情况。美国总统[USA.GetLeader]发布声明，强烈谴责这种行为，并正式宣布，其政府将进一步支持消除种族暴力。"
 usatext.119.a:0 "确定。"
 
 usatext.120.t:0 "美国总统[USA.GetLeader]签署行政命令9981号"
 usatext.120.d:0 "美国总统[USA.GetLeader]宣布签署行政命令9981号，该决议宣布彻底废除美国军队中的种族隔离行为，使得每一个美国士兵无论肤色，均享受平等待遇。"
 usatext.120.a:0 "确定。"
 
 usatext.121.t:0 "阿尔杰·希斯事件"
 usatext.121.d:0 "《时代周刊》编辑惠特克·钱伯斯的最新文章引发美国社会关注，他指控国务院官员阿尔杰·希斯长期为苏联和共产党从事间谍活动，引发了美国社会针对共产主义渗透活动的担忧。"
 usatext.119.a:0 "确定。"
 
 usatext.122.t:0 "美国宣布撤回对[ROOT.GetName]的援助"
 usatext.122.d:0 "美国宣布撤回对[ROOT.GetName]的一系列经济和军事援助"
 usatext.119.a:0 "确定。"
 
 usatext.123.t:0 "麦克阿瑟被解除职务"
 usatext.123.d:0 "由于在朝鲜战争中的糟糕表现以及与白宫的矛盾，传奇五星上将道格拉斯·麦克阿瑟被[USA.GetLeader]宣布解除职务，离开日本返回美国。麦克阿瑟面对记者，对此事评价道：老兵不死，只是凋零。"
 
 usatext.124.t:0 "美国国家广播公司开播彩色电视"
 
 usatext.125.t:0 "电视剧《迷离时空》开播"
 usatext.125.d:0 "由哥伦比亚广播公司拍摄的玄幻题材系列电视剧《迷离时空》开播。"
 
 usatext.126.t:0 "查尔斯·舒尔茨创作漫画《花生》"
 usatext.126.d:0 "美国联合报业集团收购了漫画家查尔斯·舒尔茨创作的《小家伙》系列漫画，但由于已经存在一个名为《小家伙》的漫画名称，联合报业将其更名为《花生》。在最新一期的《花生》当中，小狗史努比首次登场。"
 
 usatext.127.t:0 "麦当劳餐厅获得特许经营权"
 usatext.127.d:0 "美国商人雷·克洛克赞助下，由麦克唐纳兄弟在加州圣贝纳迪诺市创立的麦克唐纳快餐厅，成功在亚利桑那州菲尼克斯市设立了第一家分店，麦当劳餐厅也获得了进行餐饮连锁的经营权。"
 
 usatext.128.t:0 "肯德基公司获得特许经营权"
 usatext.128.d:0 "由哈兰德·桑德斯在肯塔基州创立的炸鸡快餐餐厅，今日正式获得特许经营权，在全美多地开设分店。"
 
 usatext.129.t:0 "杂志《花花公子》第一期发行"
 usatext.129.d:0 "芝加哥出版了一家名为《花花公子》的杂志，由企业家休·赫夫纳赞助支持，并选择了当红女星玛丽莲·梦露为第一期的封面人物。\n当杂志出现在报摊时，男人们为最后一本撕打起来。家庭主妇们偷偷用围巾包裹着翻阅，而神学院学生则把它藏在《圣经》封皮下。那组梦露在红丝绒上舒展的日历照片，让首期5万册在两周内售罄。"
 
 usatext.130.t:0 "美国在比基尼环礁进行核试验"
 usatext.130.d:0 "美国国防部于今日上午召开新闻发布会，宣布该国已经在马绍尔群岛的比基尼环礁进行了代号布拉沃城堡行动的大规模核试验，并引爆了约1500万吨爆炸当量的核武器。美军表示，这次核试验进一步展示了核武器的杀伤力和美国的核威慑能力，但一些媒体发现，核试验后，北太平洋出现了多地核辐射检测超标现象。"
 
 usatext.131.t:0 "动画《躲避与掩护》公映"
 usatext.131.d:0 "美国民防司令部今日制作了一部动画短片，通过“乌龟伯特”这一角色向公众演示如何在核袭击中进行躲避与掩护。\n有只乌龟名叫博特，小小博特十分谨慎，危险来临不会慌张，他知道怎么做。\n他卧倒，并躲避。他卧倒，并躲避。\n他做了我们每个人都必须学会的事情，而你，而你\n卧倒，并躲避。"
 
 usatext.132.t:0 "动画《小飞侠》公映"
 usatext.132.d:0 "迪士尼工作室制作的动画电影《小飞侠》今日上映。"
 
 usatext.133.t:0 "电影《罗马假日》上映"
 usatext.133.d:0 "由派拉蒙公司出品，奥黛丽·赫本、格里高利·派克主演的电影《罗马假日》今日上映。"
 
 usatext.134.t:0 "电影《乱世忠魂》获得奥斯卡金像奖"
 usatext.13d.t:0 "由哥伦比亚影业出品，伯特·兰开斯特主演的电影《乱世忠魂》获得第26届奥斯卡金像奖"
 
 usatext.135.t:0 "艾伦·图灵在家中去世"
 usatext.135.d:0 "英国知名数学家和计算机学家艾伦·图灵在伦敦的家中意外去世，根据苏格兰场的声明，艾伦·图灵生前食用的带有氰化物溶液的苹果而中毒身亡。艾伦·图灵是现代世界最优秀的科学家之一，他不仅最早提出了通过计算机实现人工智能的设想，并在第二次世界大战中为破译德军密码做出了巨大贡献。然而，艾伦·图灵也是一名同性恋者，他因为同性恋倾向遭到英国警方监控，媒体认为艾伦·图灵服毒自杀。"
 
 usatext.136.t:0 "罗素与爱因斯坦发表联合宣言"
 usatext.136.d:0 "哲学家伯特兰·罗素与科学家阿尔伯特爱因斯坦发表联合宣言，呼吁反对扩大核武器，呼吁世界各国警惕核武器的毁灭性力量。"
 
 usatext.137.t:0 "阿尔伯特·爱因斯坦去世"
 usatext.137.d:0 "二十世纪最伟大的的科学家，阿尔伯特·爱因斯坦在美国新泽西州去世，这位伟大的天才改变了人类现代科技的面貌，从相对论，再到原子弹……这位伟大的科学家带着他的智慧离开了人世，但他而遗产将永远留在我们的物理教科书当中。"
 
 usatext.138.t:0 "美国在比基尼及埃内韦塔克进行大当量核试验"
 usatext.138.d:0 "美国国防部于今日上午召开新闻发布会，宣布该国已经在马绍尔群岛的比基尼环礁及埃内韦塔克进行了代号常春藤麦克大规模核试验，并引爆了约1000万吨爆炸当量的核武器。美军表示，这次核试验进一步展示了核武器的杀伤力和美国的核威慑能力，但一些媒体发现，核试验后，北太平洋出现了多地核辐射检测超标现象。"
 
 usatext.139.t:0 "歌手小理查德发行歌曲"
 usatext.139.d:0 "美国黑人歌手理查德·韦恩·潘尼曼发行了自己创作的歌曲，理查德擅长创作爵士乐，并配之以充满活力的音乐和富有魅力的演出，最重要的是，他的作品能够同时获得黑人和白人的喜爱。"
 
 usatext.140.t:0 "《That's All Right》"
 usatext.140.d:0 "几天以前，孟菲斯太阳录音室里，19岁的卡车司机埃尔维斯·普雷斯利在休息时突然抱起吉他，即兴演唱了一首蓝调老歌《That's All Right》。录音师山姆·菲利普斯猛地摘下耳机，冲进录音间：老天，就是这个！\n现在，这首歌在WHBQ电台首播。DJ杜威·菲利普斯接到的点播电话几乎烧坏了交换机。白人们惊讶于这个白人男孩唱出的黑人的声音，黑人们则在街角唱片店前驻足——从未有人把乡村音乐和节奏布鲁斯这样搅拌在一起。\n在田纳西州的加油站里，工人们跟着收音机跺脚；高中舞会上，少女们为那扭动的臀部尖叫；而保守派牧师们则愤怒地写信给报社，称这是魔鬼的新节奏。唱片预计将在一周内卖出两万张，当地唱片行的橱窗被疯狂乐迷挤碎。\n没人能否认，当埃尔维斯唱出那句"没关系，妈妈"时，摇滚乐诞生的阵痛已经过去——美国青年文化的新黎明，正随着这张薄薄的78转唱片旋转升起。"
 
 usatext.141.t:0 "奥利弗·布朗起诉堪萨斯州托皮卡市教育局"
 usatext.141.d:0 "来自堪萨斯州的一起诉讼案引起了全美媒体的注意。黑人工程师奥利弗·布朗的两个孩子因学校离家太远希望入读新学校，却被当地教育局以黑人不能进入白人学校唯有拒绝。布朗在有色人种协会支持下决定向托皮卡教育局提起诉讼，此事引发全美关注，因为他涉及到了美国目前实行的“隔离但平等”原则是否依然适用。"
 
 usatext.142.t:0 "奥利弗·布朗败诉"
 usatext.142.d:0 "布朗诉托皮卡案件得到了意料之中的结果。美国最高法院宣布奥利弗·布朗败诉，教育系统内的种族隔离依然适用，美国黑人和有色人种依然不能进入白人垄断的高等学府就读。有色人种协会和黑人民权团体发起抗议。"
 
 usatext.143.t:0 "奥利弗·布朗胜诉"
 usatext.143.d:0 "美国最高法院宣布奥利弗·布朗起诉托皮卡市教育局的诉讼胜诉，并宣布教育系统内的种族隔离违背宪法精神，任何肤色的学生应当都有机会进入任何学校就读。这一结果得到了有色人种协会和黑人民权团体的大力支持，并认为这是美国民权向平等迈进的里程碑，然而美国南方的白人优越主义者却对此非常不满。"
 OliverBrownWin:0 "奥利弗诉托皮卡教育局案胜诉"
 
 usatext.144.t:0 "南方地区国会议员发表联合声明"
 usatext.144.d:0 "来自美国南方多个州的一百多名议员发表联合声明，反对废除教育系统中的种族隔离制度，他们认为，将下等民族排除在白人的社会生活之外，对保护美国的传统价值观很有必要。"
 
 usatext.145.t:0 "阿肯色州小石城的冲突"
 usatext.145.d:0 "阿肯色州首府小石城高等中学发生了白人与黑人之间的冲突。11名黑人学生在开学第一天进入该学校时遭到白人优越主义者的拦截与骚扰。"
 
 usatext.146.t:0 "阿肯色州爆发严重流血事件"
 usatext.146.d:0 "阿肯色州首府小石城高等中学发生了白人与黑人之间的冲突，11名黑人学生在开学第一天进入该学校时遭到白人优越主义者的拦截与骚扰，事件很快恶化成为两个种族之间的大规模冲突，多人受伤。"
 
 usatext.147.t:0 "美军进入小石城维持秩序"
 usatext.147.d:0 "阿肯色州首府小石城高等中学发生了白人与黑人之间的冲突，11名黑人学生在开学第一天进入该学校时遭到白人优越主义者的拦截与骚扰，美国政府宣布派出军队进入小石城维持秩序，以保护黑人学生的合法权利。"
 
 usatext.148.t:0 "蒙哥马利示威活动遭到镇压"
 usatext.148.d:0 "美国警察暴力驱散了进行示威游行反对种族隔离的示威者，多名示威者受伤或被捕。" 
 
 usatext.149.t:0 "弗吉尼亚州抵制最高法院判决结果"
 usatext.149.d:0 "弗吉尼亚州多名议员发表联合声明，反对废除教育系统中的种族隔离制度，他们认为，将下等民族排除在白人的社会生活之外，对保护美国的传统价值观很有必要。"
 
 usatext.150.t:0 "格林斯伯勒宣布支持最高法院判决结果"
 usatext.150.d:0 "北卡罗莱纳州的格林斯伯勒宣布，该市将成为第一个主动支持最高法院判决结果的南方城市，该地还表示，将在不久之后逐步废除种族隔离措施。"
 
 usatext.151.t:0 "美国进步党的崛起"
 usatext.151.d:0 "在最近的选举活动中，美国进步党成为了一匹令人意外的黑马，在全美多个地区获得了不俗的支持率。该党由创建，目的是反对冷战，促进和平，支持民权运动和反对麦卡锡主义。"
 
 usatext.152.t:0 "乔治·华莱士与美国独立党的崛起"
 usatext.152.d:0 "在最近的选举活动中，美国独立党成为了一匹令人意外的黑马，以阿拉巴马州为基本盘，在全美多个地区获得了不俗的支持率。该党由民粹主义政客乔治·华莱士创建，旨在反对黑人运动，保护种族隔离制度，以捍卫美国南方的传统价值观。"
 
 usatext.153.t:0 "KKK的影响力正在扩大"
 usatext.153.d:0 "随着美国白人与黑人之间的矛盾日益激烈，臭名昭著的白人至上主义团体Kan Kluk Klan似乎有了复兴的迹象。他们在美国南方多地举行大型集会，反对民权运动，甚至呼吁重建白人至上主义政府。"
 
 
 usatext.154.t:0 "第三党运动的兴起"
 usatext.154.d:0 "美国社会问题的恶化，令民主党和共和党都逐渐失去了民众的支持。诸如进步党、改革党、自由党甚至KKK这样的第三党得到了民众的关注，"
 
 usatext.155.t:0 "美国左派的崛起"
 
 usatext.156.t:0 "美国共产党的合法化"
 usatext.156.d:0 "美国司法部正式宣布，取消针对美国共产党的一系列限制政策，承认美国共产党合法化并允许其进行政治活动。"
 
 usatext.157.t:0 "[USA.GetLeader]呼吁进行选举制度改革"
 usatext.157.d:0 "美国总统[USA.GetLeader]在最近的一次活动中指出，美国目前的选举人团制度并不合理，尤其是胜者全得制度，抹杀了中小政党参与总统大选的机会，将权力高度集中在部分政治寡头手中，因此他呼吁废除选举人团和胜者全得制度，根据选票比例分配国会席位。"
 
 usatext.158.t:0 "迪克西民主党的崛起"
 usatext.158.d:0 "在最近的选举活动中，迪克西民主党成为了一匹令人意外的黑马，这个从民主党保守分子中分离出来的党派在全美多个地区获得了不俗的支持率。该党由创建，目的是反对民权运动，保护白人传统价值观和种族隔离制度。"
 
 usatext.159.t:0 "迪克西民主党成立"
 usatext.159.d:0 "不断扩大的民权运动引起了民主党内部的分裂，以南卡罗莱纳州长斯特罗姆·瑟蒙德为首的保守主义者宣布脱离民主党，另组迪克西民主党。"
 
 usatext.160.t:0 "[USA.GetLeader]的最新讲话"
 usatext.160.d:0 "美国总统[USA.GetLeader]的一次讲话引起了争议。\n\n……激进的社会改革只会给共产主义颠覆分子和自称民主的反政府势力制造机会，我们需要的是一个保守而稳定的社会。我们应当争取基督教会的合作与支持，将人民重新带回到圣经的指引和上帝的福音之中，只有谨遵耶稣和圣徒的教诲，我们的国家才能成为幸福与和平的伊甸园……\n"
 
 usatext.161.t:0 "关于扩大隔离制度的法案"
 usatext.161.d:0 "今日，保守主义者控制下的美国国会通过了一项极具争议的法案。国会宣布，先行的种族隔离制度不仅会被巩固，还将进一步扩大，有色人种对公共设施和社会服务的使用将被进一步限制，从而确保国家和社会的财政支出被优先使用于“合众国的主体民族”。"
 
 usatext.162.t:0 "伟大的自由社会"
 
 usatext.163.t:0 "美国政府开始进一步限制黑人政治权力"
 usatext.163.d:0 "在巨大的争议中，美国国会宣布，为了控制共产主义在有色人种当中的扩大，有色人种的政治权利，包括司法权等将被限制，黑人必须在白人监督和陪同下，才能参与司法诉讼等活动。"
 
 usatext.164.t:0 "美国开始限制黑人使用公共服务"
 usatext.164.d:0 "在巨大的争议中，美国国会宣布，黑人等有色人种对公共交通等公共服务的使用将被限制。黑人将不再允许与白人搭乘同一交通工具，必须搭乘数量稀少且昂贵的黑人专用交通工具。"
 
 usatext.165.t:0 "美国开始限制黑人接受教育"
 usatext.165.d:0 "美国政府正式宣布，即日起，有色人种将不再允许在公立学校中接受教育！"
 
 usatext.166.t:0 "美国宣布剥夺黑人投票权"
 usatext.166.d:0 "美国政府正式宣布，即日起，有色人种将不再允许在选举中投票！"
 
 usatext.167.t:0 "美国宣布对黑人进行生育限制"
 usatext.167.d:0 "美国政府正式宣布，即日起，所有已育有一个孩子的黑人必须在规定时间内前往医院进行结扎手术，以控制黑人人口数量！"
 
 usatext.168.t:0 "关注美国黑人问题"
 usatext.168.d:0 "美国白人优越主义政府实施的一系列疯狂的种族主义政策引起了国际社会关注，我们如何回应？"
 
 usatext.169.t:0 "[FROM.GetName]谴责美国政府的种族主义复兴"
