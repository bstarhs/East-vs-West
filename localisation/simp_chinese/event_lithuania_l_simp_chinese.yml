 lle.4.t:0 "波罗的海之路"
 lle.4.d:0 "苏联统治下的波罗的海地区爆发了民众运动，为了纪念承认苏俄吞并波罗的海的《苏德互不侵犯条约》签订50周年，立陶宛、拉脱维亚和爱沙尼亚民众发起了波罗的海之路运动，一道长达数千公里的人链横穿三个国家，向世界展示了波罗的海人民反对莫斯科统治的决心。"
 lle.4.a:0 "点火。"
 
 lle.8.t:0 "致苏共中央委员会关于波罗的海地区反苏武装活动的绝密报告"
 lle.8.d:0 "自1944年我军解放波罗的海地区以来，当地潜伏的反苏民族主义武装（当地语言称“森林兄弟”）活动仍持续构成严重威胁。根据内务人民委员部及国家安全机关近期情报汇总，其活动呈现以下特点：\n以分散游击单元为主，依托森林及乡村地区建立隐蔽据点，与部分农村居民存在被动或主动联系，并获取有限物资补给。\n过去六个月累计记录袭击事件127起，包括：\n\n针对地方苏维埃干部、集体农庄负责人的刺杀\n铁路线、电报线路的破坏\n散布反集体化、反苏维埃传单\n存在通过波罗的海沿岸偷渡渠道与瑞典、英国情报机构接触的迹象，可能获取轻武器及资金支援。\n\n建议采取的综合肃清措施：\n增派内卫部队特种作战分队，针对已知森林营地实施夜间突袭，配合军犬及无线电侦测技术压缩其活动空间。\n切断游击队粮食供应链，对森林周边村庄实行严格的物资配给制与通行管制。\n预计六个月内可基本瓦解其系统性活动能力，残余分子将转入孤立犯罪形态。\n\n国家安全部第三总局"
 lle.8.a:0 "已阅，我们将采取措施。"