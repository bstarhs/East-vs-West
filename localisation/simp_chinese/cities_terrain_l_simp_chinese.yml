l_simp_chinese:
 canton_desc:0 "\n广州位于中国南部的珠江入海口，是广东省的省会，也是中国最发达的城市之一。历史上，广州作为丝绸之路的重要节点，曾经是中国最发达的贸易港口之一，而在18-19世纪初，广州更是垄断了所有的海上贸易，并成为鸦片战争的爆发地。20世纪初，广州的经济迅速发展，同时也成为了国民党和共产党的重要活动据点。在中华人民共和国成立后，由于靠近香港澳门，广州继续扮演中国大陆与西方世界的中转站。改革开放后，广东得到了大量来自香港和台湾的投资，经济迅速起飞，如今广东省已经是中国最发达的省份。\n图为广州市中山纪念堂"
 africaurban_desc:0 "\n图为非洲某城市"
 agra_desc:0 "\n图为阿格拉泰姬陵"
 alabama_desc:0 "\n图为阿拉巴马市"
 alexandria_desc:0 "\n图为亚历山大要塞"
 algiers_desc:0 "\n图为阿尔及尔中央邮局"
 brussle_desc:0 "布鲁塞尔于979年建立于赛尼河畔,意为“沼泽上的家”，城市沿河而建,地势低,经常被洪水淹没。11世纪到14世纪,市民们一直努力在这低洼的地方生存下去,致力于将其建设成“新欧洲”的工业中心。在1830年比利时革命中,荷兰王国南部一些讲法语的省份分离出来。布鲁塞尔能够逃脱两次世界大战并相对毫发无损的很大原因是它的位置没有战略意义,德国占领者根本注意不到它,它的居民也很被动。也许正是这一点一一或者事实上它是一个重要的交通枢纽一一让它成为当代国际贸易中心、欧盟的实际首都和北约总部。"
 mexico_desc:0 "14世纪,阿兹特克人前往墨西哥的山谷定居,并在特斯科科湖岸边建立定居点。传说阿兹特克人得到了一个神示，他们的定居处有一只鹰,它嘴里叼着蛇栖息在仙人掌上。鹰、蛇和仙人掌至今仍然是墨西哥的国家象征。新建的城市被命名为特诺奇蒂特兰,通过三条堤道与陆地相连,堤坝、沟渠和运河组成了庞大的系统。西班牙殖民者埃尔南·科尔特斯最终包围了这座城市,并迫使其在1521年投降。此城随即改名为墨西哥城,成为西班牙新世界殖民政府最大的中心之一。墨西哥城作为墨西哥首都的地位从未改变。这座城市的面积和人口仍在继续增长,市区GDP几乎占全墨西哥的五分之一,此比例是全球最高之一。但今日它仍然面临着一些固有问题一一生态恶化、收入不均、水质污染。"
 kabul_desc:0 "喀布尔是一座有3500多年历史的古城。多个世纪以来,无数帝国和王朝都曾占领过喀布尔。1504年,帖木儿的后裔巴布尔占领了喀布尔，是这里成为莫卧儿王朝的发源地，后来普什图人建立的杜兰尼王朝占领了这里，并从此成为阿富汗的首都。"
 geneva_desc:0 "日内瓦发源于公元前500年左右，最早是高卢人的要塞，在1033年被神圣罗马帝国占有以后，成为一个重要的宗教中心。这里的控制权萨伏依公爵和天主教教皇对日内瓦的权力进行不断争夺。当最后一任掌权主教于1533年逃离日内瓦时,日内瓦市民宣布日内瓦成为一个主权国家，并与临近的施维茨、苏黎世等地组成瑞士联邦。接下来的几年里,它仍然是新教信仰的大本营,1559年,约翰·加尔文成立了日内瓦学院，使得这里成为加尔文教的发源地。1865年在日内瓦成立的红十字会使这里成为了国际和平对话的场所，一战后日内瓦便成为了国际联盟总部。"
 peking_desc:0 "北京意为北方的都城，曾经作为中华帝国的首都长达八百年。北京最早的称呼是幽州或燕京，他是公元前2世纪周朝诸侯国燕国的首都，秦统一中国后，这里成为长城的重要关隘。1153年，女真人建立的金朝正式将燕京设立为首都，之后的元朝也定都于这里。1335年，永乐皇帝成为明朝皇帝后，将首都从南京迁移到这里，并大兴土木建造了宏伟的紫禁城。1644年清朝进入中国后，这里继续作为大清首都，并一度发展为当时人口最多的城市之一。1912年中华民国成立后，这里改名为北平，1927年蒋介石将首都迁到他的政治大本营南京，直到1949年中华人民共和国再次将首都迁回北京。\n图为北京天安门广场。"
 tokyo_desc:0 "东京是日本的首都，也是亚洲乃至世界上最大的城市之一。东京原名江户，起源于13世纪，最早是一个村落，16世纪日本大名松平元康（也就是后来的德川家康）将自己的主城迁到了这里，1605年德川家康成为征夷大将军后，江户便成为了幕府的统治中心，并迅速发展。1868年，江户幕府倒台，天皇和新的日本政府从京都迁到这里，并将其改名东京，使其成为日本实际上的首都。东京在明治和大正天皇统治时期迅速现代化，建立了大量的高楼和工厂，但第二次世界大战时期，美军的轰炸几乎将东京夷为平地。二战结束后，日本借助美国的资助和合理的政策重建，到了60年代，东京再次成为亚洲最发达的城市之一。"
 seoul_desc:0 "首尔是大韩民国的首都和最大城市，他在二战前也被称为汉城（目前中国和北朝鲜沿用这一称呼），这来源于横穿城市的河流汉江。汉城在1358年被朝鲜王朝国王李成桂选为首都，此后便开始发展，逐渐成为朝鲜半岛的中心。在1910-1945年的日本统治时期，汉城被称作京城，韩国独立后为表示与历史的分离，便改名为首尔，即“首都”。首尔在朝鲜战争时期遭受严重破坏，直到60年代初仍然十分破败，韩国独裁者朴正熙上台后，首尔才以极快的速度发展，成为了韩国的经济中心和亚洲重要的金融中心。"