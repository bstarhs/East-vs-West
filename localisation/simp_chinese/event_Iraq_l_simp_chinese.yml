l_simp_chinese:
 
 irq.1.t:0 "巴格达发生市民动乱"
 
 irq.2.t:0 "伊拉克内阁总辞职"
 irq.2.d:0 "伊拉克试图加入英国主导下的中央条约组织，这引起了许多伊拉克群众，尤其是左派势力和知识分子的不满，巴格达爆发了大规模群众运动。伊拉克国王不得不宣布接受示威者的诉求，勒令伊拉克内阁为此负责并辞职，同时推出中央条约组织。"
 
 irq.3.t:0 "巴格达发生群众暴动"
 irq.3.d:0 "伊拉克试图加入英国主导下的中央条约组织，这引起了许多伊拉克群众，尤其是左派势力和知识分子的不满，巴格达爆发了大规模群众运动。伊拉克军队迅速介入，派遣军队进行了暴力镇压，军队的无差别攻击导致的严重的伤亡，大量政界人士被捕。"

 irq.15.t:0 "军事政变!"

 irq.18.t:0 "军事政变!"

 irq.20.t:0 "萨达姆·侯赛因上台"

 irq.23.t:0 "Sink the tanker!"

 irq.24.t:0 "伊拉克军队攻陷哈马丹"
 irq.24.d:0 "在伊拉克军队的攻击下，伊朗西部重镇哈马丹失守，大量伊朗残军和市民被迫撤离，两伊战争的天平似乎正在朝萨达姆倾斜。"

 irq.25.t:0 "Ask for peace"

 irq.26.t:0 "两伊战争结束"
 irq.26.d:0 "随着伊朗与伊拉克代表签署停火协议，这场导致数万人死亡的战争宣告结束。"

 irq.27.t:0 "伊拉克入侵科威特!"
 irq.27.d:0 "今天上午，数个师的伊拉克军队向科威特发起了突然进攻！伊拉克领导人萨达姆·侯赛因宣布，科威特说伊拉克未收复的一个省，这场军事行动旨在实现伊拉克的统一。"

 irq.30.t:0 "哈希姆家族的联合"

 irq.31.t:0 "[FROM.GetName]支持建立联合王国的主张"

 irq.32.t:0 "[FROM.GetName]拒绝建立联合王国的主张"

 irq.33.t:0 "约旦与伊拉克计划进行合并"

 irq.34.t:0 "哈希姆阿拉伯联邦的正式形成"
 

 irq.40.t:0 "伊拉克爆发军事政变！"
 irq.40.d:0 "伊拉克爆发了民族主义军人发动的军事政变！"

 irq.41.t:0 "革命军官组织夺取巴格达！"
 irq.41.d:0 "伊拉克政变军人夺取了巴格达的广播电台和皇宫，宣布完全控制政权！"

 irq.42.t:0 "伊拉克皇室被屠杀！"
 irq.42.d:0 "伊拉克国王费萨尔二世、首相努里·赛义德被政变军人处决！"

 irq.43.t:0 "伊拉克政变被镇压！"

 irq.44.t:0 "伊拉克内战全面爆发！！"

 irq.45.t:0 "阿联军队夺取巴格达！"

 irq.46.t:0 "伊拉克共和国成立！"
 irq.46.d:0 "阿卜杜勒-卡里姆·卡塞姆领导下的伊拉克军方宣布废黜君主制，成立伊拉克共和国！"

 irq.47.t:0 "[FROM.GetFlag][ROOT.GetName]谴责伊拉克军人政变"
 irq.47.d:0 "[FROM.GetFlag][ROOT.GetName]外交部发表声明，谴责伊拉克军人发动政变夺取政权并屠杀伊拉克皇室，同时指责埃及和苏联干涉了伊拉克内政！"

 irq.48.t:0 "[FROM.GetFlag][ROOT.GetName]表态支持伊拉克军人政变"
 irq.48.d:0 "[FROM.GetFlag][ROOT.GetName]外交部发表声明，祝贺伊拉克反封建、反帝国主义的共和革命取得成功！[ROOT.GetName]第一时间表达了对新政府的支持和承认。"
 
 

 irq.50.t:0 "武装干涉伊拉克局势的可能"
 irq.50.d:0 "致华盛顿总部急电：/n伊拉克政变已严重危及中东战略平衡。卡塞姆政权正在迅速向莫斯科靠近，并宣布退出《巴格达条约》。建议立即启动干涉行动，以避免伊拉克赤化：/n激活摩苏尔军区潜伏网络，向反卡塞姆军官提供加密通讯设备/n通过约旦渠道向王室遗老输送资金，策动南部部落起义/n在基尔库克油田制造生产事故，削弱政权经济基础/n苏联军事顾问团预计下周抵达。若不能在60天内扭转局势，伊拉克将沦为苏联永久基地，波斯湾油路及以色列安全均遭致命威胁。请求授权特别预算与行动权限。"
 irq.50.a:0 "也许我们需要争取约旦的支持"
 irq.50.b:0 "也许我们需要争取英国的支持"
 irq.50.c:0 "也许我们需要争取土耳其的支持"
 irq.50.g:0 "也许我们需要争取伊朗的支持"
 irq.50.e:0 "还是避免中东局势的激化"
 irq.50.f:0 "通知CIA在中东支部尽快执行"

 irq.51.t:0 "美国寻求推翻卡塞姆政权"
 irq.51.d:0 "美国政府致阁下：/n伊拉克变局已威胁我们共同安全。卡塞姆政权向苏联开放霍尔木兹海峡的举动，将危及波斯湾千年秩序。为维护地区稳定，恳请阁下支持以下合作：/n允许我国侦察机使用贵国机场监测伊拉克兵力调动/n提供边境据点用于训练伊拉克反政府力量/n共享波斯湾海军情报，协同保护油轮航线/n期待三日内获复。/n美国特别代表"

 irq.52.t:0 "[FROM.GetName]接受了我们的要求"
 irq.52.d:0 "致美国政府：/n[FROM.GetName]将为推翻伊拉克卡塞姆政权提供必要的军事和情报合作，以合力保卫自由世界在中东的影响力不被赤化所威胁。"
 irq.52.a:0 "继续……"

 irq.53.t:0 "[FROM.GetName]拒绝了我们的要求"
 irq.53.d:0 "致美国政府：/n[FROM.GetName]政府恐怕不能向贵国提供任何协助以推翻卡塞姆政权，如果伊拉克陷入全面内战，将加剧中东地区的局势紧张，这不利于我国的利益。"

 irq.54.t:0 "伊拉克保皇派发起武装暴动！"
 irq.54.d:0 "来自巴格达的突发消息！伊拉克民族主义者建立的军政府根基未稳之时，在基尔库克、希贾拉沙漠和鲁特拜沙漠，爆发了保皇党和反共产主义者的大规模暴动！暴动者自称伊拉克救国阵线，宣称要推翻卡塞姆领导下的共产政权。"

 irq.55.t:0 "伊拉克革命政府致信"
 irq.55.d:0 "伊拉克革命政府致[THIS.GetName]兄弟：/n伊拉克革命正面临帝国主义反扑。我们截获的情报显示，美国中情局正在摩苏尔和基尔库克策动叛乱，雇佣军已渗透至迪亚拉省。为捍卫阿拉伯民族的共同事业，恳请贵方立即伸出援手。/n这片孕育了《一千零一夜》的土地，绝不会成为第二个危地马拉。底格里斯河与尼罗河自古血脉相连，当新月之地燃起烽火，整个阿拉伯世界都应共擎火炬。"

 irq.56.t:0 "伊拉克内战全面爆发！！"
 irq.56.d:0 "来自巴格达的突发消息！伊拉克民族主义者建立的军政府根基未稳之时，在基尔库克、希贾拉沙漠和鲁特拜沙漠，爆发了保皇党和反共产主义者的大规模暴动！暴动者自称伊拉克救国阵线，宣称要推翻卡塞姆领导下的共产政权，而卡塞姆政权则斥责他们为帝国主义支持下的叛乱分子。目前，军政府已和反政府武装爆发激烈交火！"

 irq.57.t:0 "埃及武力介入伊拉克内战！"

 irq.58.t:0 "伊朗武力介入伊拉克内战！"

 irq.59.t:0 "约旦武力介入伊拉克内战！"

 irq.60.t:0 "土耳其武力介入伊拉克内战！"

 irq.61.t:0 "伊拉克救国阵线夺取政权！"
 irq.61.d:0 "来自巴格达的消息！经过激烈的战斗，由伊拉克保皇派、民族主义者和反共势力组成的伊拉克救国阵线武装，今日正式宣布夺取了巴格达市区，大部分终于卡塞姆的武装部队被迫逃亡或投降，卡塞姆本人下落不明。保皇派武装分子在巴格达宫殿中搜刮到多具被焚烧得面目全非的成年男子尸体，他们对外宣布，卡塞姆及其党羽已畏罪自杀。卡塞姆之死宣布伊拉克内战宣告结束，短暂的卡塞姆军政府也随之灭亡。由于伊拉克哈希姆家族皇室已在军事政变中被屠戮，经过商议，救国阵线不得不承认伊拉克确实已无重建君主制的可能，因此将保留伊拉克共和国国号和共和制政体，同时推举伊拉克王国前首相阿里·阿尤布为临时政府的新总统。"

 irq.62.t:0 "伊拉克保皇党叛乱被平息！"

 irq.63.t:0 "[FROM.GetName]向伊拉克军政府提供援助！"
 irq.63.d:0 "[FROM.GetName]外交部发表声明，该国已正式承认伊拉克共和国政府并与其建立外交关系，同时为其提供援助以帮助伊拉克新政府巩固政权。"
 

 irq.65.t:0 "阿拉伯复兴党希望加入新政府"

 irq.66.t:0 "阿拉伯复兴党的兴起"
 irq.66.d:0 "来自巴格达消息。伊拉克共和国总统卡塞姆与阿拉伯复兴社会党的多位领导人，在总统府内进行了会议，卡塞姆欣然支持与复兴党建立联合政府，以实现阿拉伯民族主义的复兴。卡塞姆邀请复兴党领导人米歇尔·阿弗拉克从叙利亚来到伊拉克担任重要官职，此外还提携了许多复兴党的年轻成员，年仅二十多岁的萨达姆·侯赛因被任命为党的副总书记。"
 irq.66.a:0 "巴格达来了位年轻人……"
 

 irq.67.t:0 "伊拉克共产党的对话"

 irq.68.t:0 "共产主义者与新政府的失败谈判"
 irq.68.d:0 "经过紧张的谈判，伊拉克政府最终没有同意伊拉克共产党请求获得合法地位并参加选举的要求。"

 irq.69.t:0 "伊拉克共产党重建"
 irq.69.d:0 "经过紧张的谈判，伊拉克新政府宣布，伊拉克共产党将重新获得合法地位，废除伊拉克王国对共产主义团体的禁令。"
 

 irq.70.t:0 "民族主义与共产主义之争"

 irq.71.t:0 "摩苏尔爆发民族主义者叛乱！"
 irq.71.d:0 "伊拉克摩苏尔军区今日爆发大规模武装叛乱，叛军控制省政府大楼并宣布成立"自由伊拉克临时政府"。这场由前王室军官、部落武装与阿拉伯复兴党组成的联合势力，在黎明时分同时袭击了城郊的伊拉克政府军驻地。\n叛军指挥官通过电台宣称卡塞姆总理"将伊拉克出卖给莫斯科"，并出示疑似苏联军火商提供的武器清单。政府军第5装甲师正从基尔库克驰援，米格战机已对叛军占领的炼油厂实施轰炸。卡塞姆愤怒地警告"将坚决捍卫革命政权"。\n随着持有苏联武器的军方迅速向摩苏尔推进，这场原本的地方叛乱正急速升级为东西方代理人的直接较量。"

 irq.72.t:0 "巴士拉爆发伊拉克共产党叛乱！"

 irq.73.t:0 "摩苏尔叛乱的政治后果"

 irq.74.t:0 "伊拉克与埃及的关系破裂"

 irq.75.t:0 "巴士拉叛乱的政治后果"

 irq.76.t:0 "伊拉克与苏联的关系破裂"

 irq.77.t:0 "卡塞姆遭遇未遂刺杀！"
 irq.77.d:0 "伊拉克复兴党激进分子萨达姆·侯赛因在巴格达刺杀卡塞姆总理未遂后，昨夜经叙利亚秘密抵达开罗。这名22岁的前法学院学生因身中两枪，被用担架抬下偷渡渔船时仍高呼"阿拉伯革命万岁"。\n侯赛因所在的五人行动小组在拉希德大街伏击总理车队，造成卡塞姆左肩中弹。政府军随后在提克里特展开大搜捕，其叔父等三名亲属已被处决。埃及情报部门证实，逃亡途中曾有贝都因游牧民族为其提供庇护。"
 
 

