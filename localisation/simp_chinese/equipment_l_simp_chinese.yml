 train_equipment_1:0 "蒸汽机车"
 train_equipment_1_desc:0 "飞驰的火车、铺设全国的铁路网、列车上运输的矿产、军火和乘客，是我们的国家进入工业化的象征。"
 train_equipment_2:0 "燃气机车"
 train_equipment_2_desc:0 "以煤矿为燃料的蒸汽机车已经是老古董了，以柴油或汽油为燃料的列车将以更少的能源需求带来更高的运输效率。"
