 at_missile_2_desc:0 "反坦克导弹（AIM〕、反坦克制导导弹（ATGM）、反坦克制导武器（AIGw）以及反装甲制导武器（AAGW）等基本都是为攻墼摧毁重装甲机动车辆而设计的专用导弹。"
