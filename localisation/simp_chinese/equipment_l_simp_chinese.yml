 medium_tank_artillery_equipment:0 "自行火炮"
 medium_tank_artillery_equipment_short:0 "自行火炮"
 medium_tank_artillery_equipment_desc:0 "自行火炮是同车辆底盘构成一体，自身即能运动的火炮。自行火炮越野性能好，进出阵地快，多数有装甲防护，战场生存力强，有些可浮渡。自行火炮的使用，更有利于不间断地实施火力支持使炮兵和装甲兵、摩托化步兵的战斗协同更加紧密。自行火炮主要由武器系统、底盘部分和装甲车体组成。"
