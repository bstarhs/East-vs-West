 atomic_artillery_equipment_0:0 "核子加农炮"
 atomic_artillery_equipment_0_short:0 "核子加农炮"
 atomic_artillery_equipment_0_desc:0 "核子火炮是20世纪50年代，超级大国都试图在战争中尽可能多的发挥核武器力量的产物，美国和苏联都制造了可以发射小型战术核弹的巨型加农炮，但由于冷战已经不是常规战争，而是局部冲突的时代，因此这些核子加农炮最终也没有投入实战，这或许对人类来说是件好事。"
