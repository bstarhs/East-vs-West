 #artillery
 
 rocket_artillery_equipment:0 "火箭炮"
 rocket_artillery_equipment_short:0 "火箭炮"
 rocket_artillery_equipment_desc:0 "在大部分的历史记载中，火炮在过去是利用化学物质的爆炸来朝目标推动弹头，将没有动力的弹头射向目标。而火箭炮则不一样，这种火炮发射后能够自己提供动力。因此火箭炮的炮管比传统火炮更小、更轻，改进后，就成了火力同株强大，而且具有高速机动能力的机动式火箭炮更先进的火箭炮还配备导航系统，火箭炮在飞行时能够自行纠正弹道方向。"
 
 artillery_equipment_1:0 "牵引式火炮"
 artillery_equipment_1_short:0 "二战火炮"
 artillery_equipment_1_desc:0 " 榴弹炮是地面炮兵的主要炮种之一，早在17世纪欧洲就把这种射角很大的炮称为榴弹炮。第二次世界大战期间，有些国家不再发展口径在203毫米以上的重榴弹炮。这一时期榴弹炮的炮身长为口径的0~30倍，初速逹635米/秒，最大射角达65°，最大射程可18100米。20世纪60年代以来，榴弹炮已发展到炮身长为口径的30~44倍，初速达827米/秒，最大射角速75°发射制式榴弹，最大射程逹24500米，发射火箭增程弹最大射程逹30000米。"
 rocket_artillery_equipment_1:0 "牵引式火箭炮"
 rocket_artillery_equipment_1_short:0 "火箭炮"
 rocket_artillery_equipment_1_desc:0 "火箭炮比起传统炮组在准确性和稳定性上都要差得多，不过他们拥有多个火箭同时击中单个目标的毁灭性效果。"
 infantry_equipment:0 "步枪"
 infantry_equipment_short:0 "步枪"
 infantry_equipment_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs."
 infantry_equipment_0:0 "二战步枪"
