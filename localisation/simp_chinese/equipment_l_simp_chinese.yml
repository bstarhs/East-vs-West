 artillery_equipment_3_desc:0 "Light-weight artillery capable of being broken down for transport, making it possible to bring artillery support to areas previously difficult to reach."
 anti_air_equipment_1:0 "二战高射炮"
 anti_air_equipment_2:0 "高射炮 1950"
 anti_air_equipment_2_desc:0 "这些炮管朝空中发射炮弹，到逹预设的高度后，炮弹爆炸，向邻近的飞行器爆出一团致命的霰弹。防空炮（或称高射炮本身对来自地面的攻墼，就不堪一凿：在没有防卫之下，任一敌人的步兵或武装单位，都可轻易地摧毁。"
 anti_air_equipment_3:0 "高射炮 1970"
 anti_air_equipment_3_desc:1 "这些炮管朝空中发射炮弹，到逹预设的高度后，炮弹爆炸，向邻近的飞行器爆出一团致命的霰弹。防空炮（或称高射炮本身对来自地面的攻墼，就不堪一凿：在没有防卫之下，任一敌人的步兵或武装单位，都可轻易地摧毁。"
 rocket_artillery_equipment_2:0 "自行火箭炮 II"
 rocket_artillery_equipment_2_desc:0 "多管火箭炮系统是一种发射火箭弹的多发联装发射装置虽然其火力精确度比传统火炮要低，但是火箭炮发射速度快，火力猛烈，机动能力强，可在极短的时间里发射大量火箭弹，问远距离的大面积目标实施突然经垄，给敌人精神上带来极大的震撼."
 anti_tank_equipment_2:0 "升级反坦克武器"
 anti_tank_equipment_2_desc:0 "Larger caliber guns to combat heavier tanks with sloped armor."
 anti_tank_equipment_3:0 "升级反坦克武器"
 anti_tank_equipment_3_desc:0 "Combining different kinds of new ammunition technology with guns with higher muzzle velocities, these anti-tank guns are prepared for whatever new armor our enemies may develop."
 motorized_rocket_equipment:0 "自行火箭炮 II"
