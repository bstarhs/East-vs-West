 aa_missile_1:0 "防空导弹 I"
 aa_missile_1_desc:0 "需要先研究§R电子机械工程§W\n防空导弹可以较为精确的击落高空固定翼飞机，但是对直升机效果一般。他可以搭载在步兵战车上，为前线部队提供机动防空力量。"
