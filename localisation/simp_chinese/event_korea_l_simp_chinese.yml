l_simp_chinese:
 kor.1.t:0 "大韩民国建立"
 kor.1.d:0 "经过日本殖民者残酷的统治和美国的管制，大韩人民终于迎来了自由。著名的民族主义政治家、韩国独立运动的重要领导人金九在汉城正式宣布大韩民国独立，标志着朝鲜半岛新时代的到来。然而，半岛北部仍在苏联的控制之下，国家仍处于分裂当中，北方的北朝鲜人民委员会拒绝承认南方的任何政府，而南韩也同样处于国家草创之初的剧烈动荡之中。"
 kor.1.a:0 "大韩独立万岁！"

 kor.2.t:0 "韩国首次国会选举"
 kor.2.d:0 "在经历了多年的政治动荡后，在美国的安排下，韩国南部决定绕过北方，单方面进行选举，以结束美国的托管统治以建立一个独立的韩国政府。韩国右翼政客李承晚大力支持在南方进行选举，并进行积极的竞选活动。而韩国著名的民族主义政治家、韩国独立运动的重要领导人金九尽管反对在南方进行单独选举，但最终金九所属的独立党还是选择了参选。另一位著名的政治家金奎植反对南方的单独选举，宣布拒绝参选并隐退政界。"

 kor.3.t:0 "金九成为大韩民国总统"
 kor.3.d:0 "韩国独立运动的领导人、温和派政治家金九赢得了第一届韩国国会选举，成为南韩第一届政府的领导人。美国支持的李承晚未能赢得多数支持，但其所属的自由党在右翼势力支持下，依然在国会赢得了许多席位。金九作为大韩民国临时政府的领导人，拥有较高的威望，但其能否妥善解决撕裂的南韩政局，处理好北朝鲜问题，依然需要持续关注。"

 kor.4.t:0 "李承晚成为大韩民国总统"
 kor.4.d:0 "韩国独立运动的领导人之一、右派政治家李承晚赢得了第一届韩国国会选举，成为南韩第一届政府的领导人。美国政府对此表示欢迎，因为李承晚是一位亲近美国，且极端反对共产主义的人物。然而，李承晚的威望却不足以支持自己的领导地位，南韩的独立党、韩民党和南朝鲜劳动党都抵制李承晚的政府。"

 kor.5.t:0 "是时候解放南方了！"

 kor.6.t:0 "北朝鲜入侵南韩！"
 kor.6.d:0 "汉城急电\n今日凌晨，北朝鲜军队在炮火掩护下越过三八线，向大韩民国发起全面进攻。朝鲜战争正式爆发，东亚局势骤然紧张。\n据韩国国防部通报，北朝鲜出动10万余人、百余辆坦克，沿瓮津半岛、开城、春川三路突进。汉城以北的临津江防线在重炮轰击下崩溃，韩国守军正节节后撤。平壤广播宣称这是"祖国解放战争"，而韩国总统府则紧急向联合国求援。"
 kor.6.t:0 "新的热战爆发了！"

 prk.7.t:0 "联合国第83号决议未能通过！"
 prk.7.d:0 "由于苏联的反对，联合国安理会第83号决议未能通过，美国无法组织多国联军进入南韩。"

 kor.8.t:0 "南韩入侵北朝鲜！"
 kor.8.d:0 "来自南韩的军队入侵北方！南韩总统[KOR.GetLeader]表示，北朝鲜共产党是苏联和中国人的傀儡。大韩民国国军在北纬38°线向朝鲜军队发起进攻，并宣布将再次统一朝鲜半岛。"
 kor.8.t:0 "新的热战爆发了！"

 kor.9.t:0 "总参谋部探讨使用核武器可能"

 kor.10.t:0 "美国总统授权在朝鲜使用战术核武器！"

 kor.11.t:0 "韩国军队溃退！"
 kor.11.d:0 "在中国共产党军队的猛烈进攻下，大韩民国军队在仓促和混乱中撤退，韩军几乎完全失去了组织力和秩序，大量军队溃散！"

 kor.12.t:0 "中国人民志愿军进入朝鲜!"
 kor.12.d:0 "随着联合国军逐渐逼近中朝边境，中共政府认为，美国对朝鲜半岛的控制将严重威胁东北地区的安全，中共政府正式宣布，将派出武装部队组成中国人民志愿军，进入朝鲜半岛作战!"

 kor.13.t:0 "联合国军进入朝鲜！"
 kor.13.d:0 "在联合国安理会第83号决议通过后，美国主导下的多国联军已于今日进入朝鲜南部，与大韩民国军队共同作战，抵抗北朝鲜共产党的攻势！美国政府强调，联合国军此举旨在反对共产主义的扩张威胁，拯救南韩的民主政府，但这也是美国军队第一次公开介入二战结束后的大规模军事冲突，并于共产党军队直接交火。"

 kor.14.t:0 "和平谈判"
 kor.14.t:0 "随着朝鲜战场进入僵持阶段，双方均陷入了消耗战。[FROM.GetName]提出了和平谈判的请求。"
 
 kor.19.t:0 "朴正熙发动政变！"
 kor.19.d:0 "由于不满政府的政策，韩国陆军参谋长朴正熙等人发动军事政变，并率领效忠朴正熙的部队袭击了青瓦台和议会。"
 kor.19.a:0 "迅速镇压叛乱！"
 kor.19.b:0 "朴正熙是正确的，我们应当与他合作。"

 kor.20.t:0 "学生示威！"

 kor.21.t:0 "朴正熙当选总统！"

 kor.25.t:0 "朴正熙在刺杀中幸存！"

 kor.26.t:0 "朴正熙被刺杀！"
 kor.26.d:0 "令人震惊的消息！韩国总统朴正熙与夫人陆英修在出席光复节纪念活动时，遭到刺客文世光开枪袭击！总统夫妇均中弹身亡！文世光被当场逮捕，并极有可能与朝鲜有关。大韩民国的历史进入了一个转折点。朴正熙死后，副总统崔圭夏接任。"
 kor.26.a:0 "悲剧。"

 kor.27.t:0 "朴正熙被刺杀！"
 kor.27.d:0 "令人震惊的消息！韩国总统朴正熙在宫城洞中央情报部餐厅用餐时时，被情报部长金载圭杀害！总统被金载圭用手枪击中胸部，警察局长车智澈也死了。目前，金载圭已被逮捕，目前还不确定他是否与朝鲜有关。大韩民国的历史进入了一个转折点。他死后，副总统崔圭夏接任。"
 kor.27.a:0 "悲剧。"

 kor.28.t:0 "军事政变！"
 kor.28.d:0 "全斗焕将军和卢泰愚将军的部队突然进入汉城，试图夺取最高军事指挥权，控制总统府。全将军在韩国军队中的组织“一心会”已经渗透到军队的高层，使他们的政变得到大多数军队的支持。"
 kor.28.a:0 "我们只能选择交出政权。"
 kor.28.b:0 "这些叛匪，给我老实呆着，看我派坦克把你们送上天！"

 kor.29.t:0 "韩国内战爆发！"
 kor.29.d:0 "韩国动荡不安的局势终于爆发，大韩民国国军中支持保安司令部首脑全斗焕上台的叛军发动政变，试图夺取政权！"
 kor.29.a:0 "这些叛匪，给我老实呆着，看我派坦克把你们送上天！"

 kor.30.t:0 "韩国爆发政变！"
 kor.30.d:0 "韩国动荡不安的局势终于爆发，大韩民国国军中支持保安司令部首脑全斗焕发动军事政变，夺取了政权！"
 kor.30.a:0 "这些叛匪，给我老实呆着，看我派坦克把你们送上天！"

 kor.31.t:0 "光州爆发游行示威！"
 kor.31.d:0 "金大中领导的民主党人在光州举行集会，发表《促进民主化国家宣言》，要求全斗焕总统下台。在目前集会的示威者和多达3万人中，警方一直无法阻止示威。一些将军建议我们增兵对抗示威者。我们该怎么办？"
 kor.31.b:0 "Give in."
 kor.31.a:0 "Put down the mob immediately."

 kor.32.t:0 "光州起义！"
 kor.32.d:0 "韩国军方派出武装部队参加了在光州举行的大规模示威。装甲车和直升机包围了这座城市。在光州国立大学，当军队向示威者开枪时，54人丧生。愤怒的市民组织、封锁军队，包围市政府，闯入警察局和武库没收枪支，组织武装抵抗部队，并试图将镇压部队赶出城市。"

 kor.33.t:0 "金钟泌接任韩国总统"
 kor.33.d:0 "经历了朴正熙遇刺后激烈的政治斗争，韩国迎来了民主的曙光。崔圭夏政府成功清除了军部的影响力，使政权和平移交给民主共和党领袖金钟泌。金钟泌曾是朴正熙的女婿和接班人，但因与朴政见不合辞职流亡美国。金钟泌继任后，可能会采取一系列的改革政策，使得政权平稳地过渡到民主制度。"

 kor.34.t:0 "美国希望支持韩国民主运动"
 kor.34.d:0 "美国总统[USA.GetLeader]最近在一次讲话中，指责韩国现政府过于独裁和暴力，敦促韩国政府停止侵犯人权，尽快走向民主改革。"

 kor.35.t:0 "大韩航空KOL009航班遭苏联击落！"
 kor.35.d:0 "大韩航空KOL009航班在飞抵苏联远东地区时，遭苏联战斗机击落。"

 kor.36.t:0 "韩国政府提出新的国境线！"
 kor.36.d:0 "韩国政府政府发表声明，宣布了大韩民国海上边界线的设定，但是这一设定囊括大量与日本领海重复的地域，引起了日本不满。"

 kor.37.t:0 "韩国政府请求与我们改善关系！"
 kor.37.d:0 "韩国政府政府发表声明，希望能够改善与日本的关系。"

 kor.38.t:0 "日本与韩国宣布建立外交关系！"
 kor.38.d:0 "韩国与日本政府政府发表声明，宣布两国建立外交关系。"

 kor.39.t:0 "日本拒绝改善关系！"
 kor.39.d:0 "日本政府拒绝了我国有关改善两国关系的请求。"

 kor.40.t:0 "爆发游行示威！"
 kor.40.d:0 "汉城街头爆发了由学生组织的游行示威，他们抗议政府与日本达成外交协议。日本作为侵略者的历史是无法被抹去的。"

 kor.41.t:0 "韩国政府发起新村运动"
 kor.41.d:0 "韩国总统[KOR.GetLeader]宣布，为了尽快改善韩国民众的生活水平，使韩国人民脱离贫穷，韩国将发起新村运动，为农村建设基础设施、学校等，使得韩国农村拜托落后的发展状况。"

 kor.42.t:0 "韩国政府希望改善与平壤的关系"
 kor.42.d:0 "韩国总统[KOR.GetLeader]宣布，韩国希望改善与北朝鲜的关系，尽快实现半岛的永久和平和民族的和平统一"

 kor.43.t:0 "平壤作出回应"
 kor.43.d:0 "北朝鲜领导人[PRK.GetLeader]回答了韩国的请求，支持南北双方尽早实现和平对话的提议。"

 kor.44.t:0 "平壤拒绝韩国请求"
 kor.44.d:0 "北朝鲜领导人[PRK.GetLeader]拒绝了韩国有关请求，宣称朝鲜将致力于武力统一半岛。"
 

 kor.45.t:0 "金九遇刺！"
 kor.45.d:0 "大韩民国的国父，朝鲜政治家金九被极端右翼分子刺杀！金九此前一直反对南方单独成立李承晚政府，主张与北方的金日成政府和平谈判实现统一，这使得他遭到反共主义者的敌视，金九在住所被一名右翼军官刺杀！"
 kor.45.a:0 "朝鲜半岛局势恶化了！"

 kor.46.t:0 "金九躲过刺杀！"
 kor.46.d:0 "大韩民国的国父，朝鲜政治家金九在家中遭遇袭击！金九此前一直反对南方单独成立李承晚政府，主张与北方的金日成政府和平谈判实现统一，这使得他遭到反共主义者的敌视，金九在住所被一名右翼军官行刺，但安保及时赶到击毙了歹徒，金九只受到轻伤。金九遇刺事件震惊韩国，阴谋论者认为是韩国总统李承晚指使了刺杀，他和金九的矛盾由来已久。"
 kor.46.a:0 "朝鲜半岛局势恶化了！"

 kor.48.t:0 "李承晚当选韩国临时总统"
 kor.48.d:0 "韩国独立运动的领导人之一李承晚赢得韩国国会选举，当选大韩民国总统。"
 
 

 kor.50.t:0 "国民防卫军溃败"
 kor.50.d:0 "在中共军队的猛烈攻击下，本来就是由临时征召的民兵组成的南韩国民防卫军被迫撤退，仓促后撤导致了严重的补给混乱和队伍崩溃，国民防卫军以极快的速度瓦解。"

 kor.51.t:0 "美国开始向日本企业派发军事订单"
 kor.51.d:0 "为了支持南韩对抗北朝鲜，美国政府决定向日本的企业和工厂下达订单，生产所需的物资。"

 kor.60.t:0 "反对托管统治运动"
 kor.60.d:0 "朝鲜多地爆发了示威游行事件，反对美国的委任统治，要求尽快建立一个由朝鲜人组成的独立政府，以实现朝鲜的完全独立。"

 kor.61.t:0 "朝鲜内部的政治动荡"
 kor.61.d:0 "在朝鲜还未建立独立国家和选举政府之时，朝鲜政界内部发生了分裂。以朴宪永、金日成为代表的左翼共产主义者希望在苏联支持下，建议南北统一的社会主义政府。而李承晚、金奎植等右派势力则要求美国支持他们建立一个反共的民族主义国家，最具威望的韩国独立运动领袖金九态度暧昧，他希望建立一个大联合政府。"

 kor.62.t:0 "吕运亨被刺杀"
 kor.62.d:0 "来自汉城的消息！朝鲜左派政治家、社会人民党领袖吕运亨在汉城遭到极右翼分子枪击身亡，此事引发南韩社会的动荡不安，这意味着南韩的政治动荡正走向极端化和暴力化。"

 kor.63.t:0 "李承晚提出由南方单独选举"
 kor.63.d:0 "朝鲜右翼政治家李承晚在接受记者采访时表示，朝鲜正处于南北分裂状态，共产主义苏联统治下的北方，无法进行民主选举，更无法进行全朝鲜的总选举。因此，等待美苏协商进行总选举是不可能的，而南韩混乱的政治局势，使得韩国人民已没有时间等待。他认为，现在最好的选择是忽略北方，在南韩进行单方面的选举，并建立民选的南方政府，等待日后合适时机再统一北方。"

 kor.65.t:0 "韩国颁布新的宪法"
 kor.65.d:0 "在内战的阴影下，韩国总统李承晚通过戒严令，打击反对党，并强行通过了所谓《拔萃改宪案》，新的宪法将总统产生方式，从国会选举改为公民普选，毫无疑问，这使得总统选举绕过了李承晚所在的自由党处劣势的韩国国会。"

 kor.66.t:0 "李承晚提出新的宪法法案"
 kor.66.d:0 "韩国总统李承晚的第二任期即将结束，为了谋取继续统治，在他的指示下，韩国自由党向国会提出了新的宪法草案，新宪法将允许总统无限连任。"

 kor.67.t:0 "韩国新宪法在争议中强行通过"
 kor.67.d:0 "汉城消息。李承晚总统为谋求无限连任而颁布的新宪法，在韩国国会充满争议的表决中通过。203名议员中，135人投票赞成宪法，没有达到能达到修宪所需总数203的2/3（135.3）票，但李承晚坚持0.3应忽略不计，由此，韩国国会宣布新宪法通过，李承晚将得以参加1956年大选。"

 kor.68.t:0 "反对新宪法的大规模示威游行"
 kor.68.d:0 "韩国总统李承晚通过新宪法，允许总统无限期连任的行为激怒了韩国的民主派和反对派，大规模的示威游行在汉城爆发，示威者与警察爆发了激烈的冲突。"

 kor.70.t:0 "韩国政府成立保导联盟"
 kor.70.d:0 "在大力镇压共产党的政策下，南韩政府根据国家安全法，成立国民保导联盟，该组织收纳同情和支持共产主义的民众，并对他们进行在教育。"

 kor.71.t:0 "韩国政府对共产主义者的大屠杀被曝光"
 kor.71.d:0 "来自釜山的惊人消息！\n在北朝鲜入侵南韩后，处于对共产党的恐惧，韩国政府未经审判，下令处死了大量被怀疑支持共产主义的民众。美军记者发现，江原道和庆尚道的大量群众被集体处死，这些民众许多并不是共产党，他们可能只是当局的反对派甚至是完全无辜的民众。\n南韩政府的屠杀行为引起了舆论广泛关注，人们对南韩政府的正义性产生怀疑。"

 kor.72.t:0 "美国政府要求我们停止反共镇压"
 kor.72.d:0 "我国政府镇压共产分子的行动被外国媒体曝光，并被指责为屠杀罪行。美国政府担心这会影响国际社会对我国反对北韩共产军侵略的同情和支持，要求我们停止对共产分子的强硬镇压。"

 kor.73.t:0 "韩国国民防卫军成立"
 kor.73.d:0 "在北朝鲜军大肆入侵的危急时刻，南韩政府宣布成立国民防卫军，征兆所有成年男性拿起武器，保卫国家。"

 kor.74.t:0 "济州岛爆发大规模暴动"
 kor.74.d:0 "在远离韩国本土的济州岛，爆发了大规模的农民暴动，暴动者反对李承晚政府和南方单方面选举，要求实现全国的总选举。韩国政府指责暴动由共产主义者支持，并表示会采取强硬手段。"

 kor.75.t:0 "济州岛暴动被镇压"
 kor.75.d:0 "南韩政府表示，在济州岛爆发的大规模共产主义暴乱已被平息，济州岛已恢复稳定，但在被记者提问暴动造成多少人死亡时，韩国政府的发言人回避了这一问题。"

 kor.76.t:0 "美军沃尔顿·沃克将军意外身亡"
 kor.76.d:0 "来自韩国消息！美国陆军上将、朝鲜联合国军指挥官沃尔顿·哈里斯·沃克在南韩遭遇意外车祸丧生。"

 kor.77.t:0 "朝鲜交战各方开始交换战俘"
 kor.77.d:0 "随着朝鲜战争停战谈判开始进行，为了表示诚意，双方开始尝试交换战俘。\n战俘交换得并不顺利，因为台湾的中华民国当局提出，许多中共军队的士兵是被迫来到朝鲜的，如果将他们送回中国大陆，会遭到中共政权的迫害，因此应该将他们送至自由台湾。\n另一方面，许多被中共俘虏的美军并不希望返回美国，他们令人惊讶地对美军记者表示，他们在中共战俘营得到了人道的待遇。"

 kor.78.t:0 "[FROM.GetName]的部队已抵达韩国参战"
 kor.78.d:0 "[FROM.GetName]派遣的远征军已抵达韩国，他们将与美军及南韩军队一同抵抗共产主义入侵。"

 kor.79.t:0 "我们的勇士从韩国归来！"
 kor.79.d:0 "经历长途跋涉，我们派往韩国抵抗共产党侵略的军人已经光荣归国！在这次自由世界联合起来抵抗共产党的侵略战争中，我国派出武装部队，与美军、韩军和世界各国军人并肩作战，成功从共产主义威胁中拯救了自由韩国，我们证明了共产党的军队并非不可战胜，自由世界有能力保卫我们的盟国。[FROM.GetLeader]亲自为这些勇士授勋，以赞扬他们的功绩。"
 

 kor.90.t:0 "1956年韩国大选即将举行"
 kor.90.d:0 "韩国总统大选和国会改选即将开始，韩国总统李承晚在1954年修改宪法，使其得以参与此次精选以谋求第三届任期。韩国进步党领袖曹奉岩为首的韩国民主势力将挑战李承晚的地位。"

 kor.91.t:0 "1956年韩国大选即将举行"
 kor.91.d:0 "韩国总统大选和国会改选即将开始，韩国总统李承晚宣布不谋求第三任期的连任，但支持他的亲信、自由党领袖李起鹏参选下一任总统。韩国进步党领袖曹奉岩为首的韩国民主势力将挑战自由党的地位。"

 kor.92.t:0 "李承晚连任韩国总统！"
 kor.92.d:0 "韩国总统选举的结果在人们的意料之中，李承晚以巨大优势获得胜利，并宣告其第三届任期的开始。"

 kor.93.t:0 "李起鹏当选韩国总统！"
 kor.93.d:0 "韩国总统选举的结果在人们的意料之中，在李承晚的大力支持下，李起鹏当选为韩国总统，继续自由党的执政。\n李起鹏在汉城的国会议事堂前宣布就职，并承诺推进大韩民国的经济发展、公民自由和南北统一，而李承晚就站在他的身后，很显然，大韩民国真正的统治者并没有改变。"

 kor.94.t:0 "曹奉岩当选韩国总统！"
 kor.94.d:0 "韩国总统选举得到了令人意外的结果！韩国进步党候选人曹奉岩以微弱优势击败韩国自由党，当选为韩国总统！李承晚的亲信们在美国的压力下，不情不愿地接受了这一结果。\n曹奉岩在汉城的国会议事堂前宣布就职，并承诺推进大韩民国的经济发展、公民自由和南北统一，而李承晚就站在他的身后，很显然，韩国的政治局势并不会因为总统的改变而改变。"

 kor.95.t:0 "光复节的一天"
 kor.95.d:0 "8月15日，在南韩首府汉城，无数的太极旗悬挂在街头巷尾，以纪念第二个光复节——两年前的今天，日本正式宣布投降，结束了日本对朝鲜半岛长达35年的残暴统治。\n汽笛轰鸣，一名姓崔的男人走下邮轮，他刚刚结束漫长的流亡生活，从美国回到阔别已久的故乡。二十多年前，崔向汉城的日本警察局安放了一枚炸弹，随着一声巨响，残暴的日本警察化为灰烬，而他也走上了逃亡之路。\n风尘仆仆的崔走进一家咖啡馆，店里最显眼的墙壁悬挂着一米多长的太极旗，人们举起玻璃杯，齐唱爱国歌。崔走到一张餐桌前，面前带着圆框眼镜的男人等待已久。李先生比崔早几个月回国，和那位著名的金九先生一起。\n金先生，这次回国，我真的无比开心，祖国解放了，同胞自由了，大街小巷都飘扬着我们自己的旗帜和歌曲，可你怎么看起来不太高兴呢？\n金放下茶杯，用手指了指外面的美国军人。\n崔，我们这次回来，不是来庆祝解放的，首先我需要告诉你，我们的任务没有结束……"

 kor.96.t:0 "釜山街头"
 kor.96.d:0 "哎呀！你这个狗崽子！我死都不可能忘了你！\n南韩釜山街头，一名年老的水果小贩抓住一名警察的衣领，狠狠地盯着他破口大骂。几分钟前，警察以小贩占据道路为由索取贿赂，老人无奈掏出几个硬币，突然，老人抓住警察的衣服，他认出了这张熟悉的脸，几年以前，面前这个男人以同样的理由索贿被拒后，抄起警棍把他的妻子打伤，只不过那时候，男人穿的是日本警服，而现在，男人帽子上的徽章是个太极。\n你这个老混蛋，胡说什么呢！我现在可是……大韩民国警察！大韩民国知道吗！\n老人并没有放过对方，随着围观的人越来越多，警察的声音越来越小，神态越来越慌张……"

 kor.97.t:0 "逃亡之旅"
 kor.97.d:0 "妈妈，我们去哪里？\n我们要到釜山去……要走很远……\n那为什么不叫上爸爸？\n因为爸爸要留在汉城……\n\n美国《华盛顿邮报》的几名记者灰头土脸的从南韩首都汉城逃出来，尽管这座城市还没有被北朝鲜军占领，但这只是时间问题。因为城市已经乱作一团，大量市民从成立逃出来，涌向南方，以躲避北朝鲜军，因为李承晚政府告诉民众，残暴的共产军会杀死他们的妻子，霸占他们的女儿……\n朝鲜战争引起国际社会广泛关注，许多外国记者在釜山、光州和大田驻扎，在记者的豪华酒店外，街道旁到处都挤满了躲避战争的难民，他们灰头土脸，有的人身上还有鲜血，他们骨瘦如柴，已经一连几天没有进食。"

 kor.99.t:0 "战俘交换"
 kor.99.d:0 "长官，我们最好小心点儿……\n\n随着朝鲜停战谈判即将开始，交战双方在短暂的停火期间，进行了战俘交换。中共军队表示将向美军移交一批重伤俘虏，因为中共方面的医院无法治疗他们。\n\n你好，我是杰克逊少校，我奉命来处理这次接受战俘。\nGreetings，我是团指挥官陈，这份名单是我们即将交还给你的美国士兵，他们的伤势，我们无法治疗。\n谢谢……嗯，你英语说得不错。\n谢谢，我的首长教的，他毕业于伊利诺伊大学。\n啊，是吗，我也是那儿的……"

 kor.100.t:0 "朝鲜冬夜"
 kor.100.d:0 "俺的娘嘞，俺长那么大，还是第一次喝自己的尿……\n\n在零下几十度的朝鲜半岛，大雪已经摸过膝盖，在中国人民志愿军的前线里，几名志愿军战士蜷缩在地洞里，他们身上裹着自己的外套，外套外面还裹着死去的战友的外套……在这漫长的冬季拉锯战中，在战斗中牺牲不可怕，可怕的是在冰雪中活活冻死……\n为了不让美军炮兵所发现，他们不能生火。当饮用水耗尽时，也不能喝冰雪融水而导致体温下降，他们唯一能用来解渴的，是自己的尿液。\n唉，这个尿也是自己身子里出来的，喝进去也一样。一名瘦弱的战士捏着鼻子一口饮尽，他身旁的另一名战士却面露难色，难以下咽。\n如果我们现在不喝，如果这一仗我们打输了，美国人就会在中朝边境长期驻扎，到时候就会有更大、更持久、更可怕的战争，让下一代中国人去打……\n想到这里，他也捧起装着尿的水杯……"
 kor.100.a:0 "为什么大地春常在……"
 

 kor.110.t:0 "曹奉岩被捕！"
 kor.110.d:0 "韩国进步党领袖曹奉岩被韩国警方逮捕！当局宣称曹奉岩为朝鲜共产党员，将他逮捕监禁，并迅速执行死刑。"
 
 kor.111.t:0 "韩国1960年大选"
 kor.111.d:0 "大韩民国的新一届总统大选即将在1960年举行，由于宪法允许总统无限期连任，因此，已经80岁高龄的李承晚将大概率继续参选总统，并支持他的接班人李起鹏参选副总统。\n韩国民主党将此次大选视为反对李承晚的最后一次机会，因为虽然李承晚大概率一定会当选总统，但副总统却是可以单独选举，且允许与总统不在同一个党派。韩国民主党将支持赵炳玉或张勉参选副总统，如果能够成功，那么一旦李承晚在任上去世，民主党人将接任总统。"
 
 kor.112.t:0 "异常的选举结果"
 kor.112.d:0 "大韩民国总统选举的第一次预选宣布计票结束，然而，韩国民主党立刻提出了对选举结果的质疑。\n自由党候选人李起鹏在选举期间患病入院，在几乎没有参加选举活动的情况下，获得822万张选票，而民主党候选人张勉仅获得185万张选票。\n民主党宣布这一结果是选举舞弊的产物，要求进行重选。"
 
 kor.113.t:0 "马山爆发大规模示威游行！"
 kor.113.d:0 "庆尚南道马山市爆发大规模示威游行，表达对选举舞弊现象的抗议。超过一千居民聚集在民主党马山党部的门前，支持民主党并反对李承晚和自由党对韩国的统治。"
 
 kor.114.t:0 "韩国军警向示威者开枪！"
 kor.114.d:0 "来自韩国马山市的消息！韩国政府调集军警，对反对选举舞弊的示威者进行了武力镇压！\n示威者与军警爆发了大规模肢体冲突，警察向示威者开枪射击。\n此次镇压造成8人死亡，50多人负伤。国际社会对韩国发生的事态高度关注。"
 
 kor.115.t:0 "示威学生的离奇死亡"
 kor.115.d:0 "因参加马山示威运动而行踪不明的马山商业高校学生金朱烈，尸体在马山的港口被一个渔夫发现。当局宣布根据尸检证实他的死因是溺水，但许多人不认同这种解释。一些示威者强行进入医院，他们发现金朱烈的头骨被20厘米长催泪弹贯穿，从金朱烈的后脑勺直通眼睛。这表明警察的催泪瓦斯开枪角度小于45度，如果直接打在一个人的脸上是可能致命的。\n李承晚政权试图审查这一事件，然而随着发现金朱烈的尸体，韩国新闻界遂对该案进行报导，并且透过美联社发送给世界。"
 
 kor.116.t:0 "南韩全国多地爆发大规模示威游行"
 kor.116.d:0 "马山军警射杀示威者、杀害金珠烈的事件，震惊了整个国家，点燃了大韩民国的怒火。\n三千多名高丽大学的学生率先发起反对当局的抗争，他们在景武台前发起游行活动，沿途包括延世大学和汉城国立大学等其他大学和高中生纷纷加入，汉城的市民、工人纷纷加入。"
 
 kor.117.t:0 "反对运动蔓延整个南韩"
 kor.117.d:0 "反对李承晚政权的示威运动已发展到十万人，汉城被愤怒的示威者包围，并与军警紧张对峙。示威者提出了更激进的要求，他们对李承晚长达十二年的腐败、残暴和独裁的统治已忍无可忍，他们要求李承晚立刻辞职，并全面修改宪法，实现国家的民主化与自由选举！"
 
 kor.118.t:0 "南韩军警与示威者爆发流血冲突！"
 kor.118.d:0 "南韩军警与数千米愤怒的示威者在汉城爆发激烈的冲突，军警用警棍袭击示威者，并用水泡冲击示威人群，但市民却坚持继续抵抗。"
 
 kor.119.t:0 "李承晚逃离汉城！"
 kor.119.d:0 " 在席卷全国的大规模学生与市民示威持续数日后，南韩政局于今晨发生戏剧性突变。在位12年的总统李承晚在示威者层层包围其官邸景武台的情况下，于清晨紧急乘坐美军提供的直升机撤离，随后从机场乘机飞往夏威夷，实质流亡海外。\n消息传开，汉城全城沸腾。激动的示威民众冲破警戒线涌入象征最高权力的景武台，将一面巨大的韩国太极旗悬挂在李承晚曾多次发表演讲的中央阳台，以此宣告一个时代的终结。愤怒的浪潮并未平息，人群随后涌向市中心，推倒了光化门前李承晚的巨型铜像，并用黑色油漆涂抹了底座上"万寿无疆“的铭文，表达了彻底清算威权历史的决心。\n面对权力真空，韩国国会召开紧急会议，依据宪法程序任命外交部长官许政为临时国务总理，代行总统职权。许政在就职声明中承认此次人民运动的正当性，承诺将顺应民意，尽快组织一次“民主、公正、透明”的新选举，以恢复国家秩序与宪政。《朝鲜日报》在题为“人民胜利之日”的头版社论中宣告：“四·一九革命”的成功，标志着韩国历史翻开了追求民主的新篇章。"
 
 kor.120.t:0 "韩国颁布新宪法"
 
 kor.121.t:0 "李起鹏被杀死"
 kor.121.d:0 "就在前总统李承晚仓皇流亡之际，其指定的政治接班人、副总统李起鹏及其一家被发现在寓所内离奇死亡。这起惨案发生在示威者包围其宅邸期间，警方驱散人群后进入现场，发现李起鹏、夫人朴玛利亚与次子李康郁均已中弹身亡，而长子李康石亦在附近自杀，身旁留有手枪。\n官方对这起震惊全国的家庭惨剧仅给出模糊说明，未详细解释事发经过与确切动机。由于李起鹏是李承晚独裁体系的核心人物，其突然死亡引发了民众的广泛猜测与诸多阴谋论，有人猜测这是为逃避政治清算，也有人认为是权力内斗或外部干预的结果。这一事件为韩国政坛的权力过渡蒙上了一层更加浓厚的不确定与悬疑色彩。"
 
 kor.130.t:0 "向南韩提供援助的建议"
 kor.130.d:0 "外交部致总统：\n北韩共匪联合中共与苏俄，大举进犯大韩民国，令自由亚洲面临巨大的生存威胁。唇亡则齿寒，若大韩民国沦入共匪魔爪，则自由世界亦不能幸免。我们已与国防部等部门通气联络，应当为南韩尽快提供一批物资和武器援助，同时组织一批顾问团，为韩军提供必要的帮助。\n我们的顾问团队已集结完毕，请阁下尽快决策。"
 
 kor.131.t:0 "[FROM.GetName]向我们提供援助"
 kor.131.d:0 "[FROM.GetName]向我国提供了一批物资和武器援助，以帮助我们抵抗北方共匪入侵，携手捍卫自由世界"
 
 kor.132.t:0 "中华民国顾问抵达釜山"
 kor.132.d:0 "来自台北的消息，为了支援韩国军队抵抗共产主义，尤其是中共军队的入侵，中华民国已向南韩派遣了一支军事顾问团，参与作战，并承担劝降、战俘管理等工作。"
 
 kor.133.t:0 "土耳其军队与中华民国军队意外交火！"
 
 kor.134.t:0 "中华民国顾问在朝鲜战场的工作"
 kor.134.d:0 "根据联合国军的安排，中华民国派出的顾问团将在朝鲜战场负责制作和印刷心战劝降传单。\n\n中國士兵是一個末路英雄，共黨頭子强迫他為奴役全世界賣命。這輩子他再也不會得到一點妻兒的快樂了。沒有妻兒傳代，他的名字將和他一同埋在韓國戰場中。做了中共的兵，不會有妻子，不會有兒女，也不會有好日子。\n中國士兵們！不要再為中共賣命了！現在蘇俄人一方面控制你們的祖國，另一方面又强迫中共軍投入韓國戰爭。"
 
 
 
 kor.140.t:0 "杜鲁门与麦克阿瑟会面"
 kor.140.d:0 "今天早上，联合国军司令官麦克阿瑟将军，与杜鲁门总统在威克岛会面，讨论朝鲜战场局势，尤其是中共可能武力介入朝鲜局势的可能。麦克阿瑟认为，中共武力介入朝鲜的可能性几乎为零。"
 
 kor.141.t:0 "联合国军的存与撤"
 kor.141.d:0 "随着联合国军收复汉城，抵抗北朝鲜入侵南韩的军事任务似乎已经完成，但麦克阿瑟将军希望联军继续北上，进攻平壤，消灭北朝鲜政权，并对中共政权施加压力，而李奇威将军反对继续北上，尤其是担忧联合国军进入北朝鲜领土将危害联军参展的正当性。"
 
 kor.142.t:0 "麦克阿瑟与李奇微的矛盾"
 kor.142.d:0 "麦克阿瑟将军与李奇微将军似乎发生了激烈矛盾。面对中共发起的突然进攻，麦克阿瑟对记者宣称，他已制定了被称作杀手行动的反攻计划，并简要介绍了计划内容。李奇微闻之大怒，表示联合国军处于混乱状态，根本没有能力组织反攻，并指责麦克阿瑟为了在媒体面前出风头，泄露了美军部署的机密。"
 
