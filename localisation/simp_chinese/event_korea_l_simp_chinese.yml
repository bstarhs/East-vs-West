 kor.146.d:0 "麦克阿瑟回到美国"
 
 kor.150.t:0 "韩军在中共军队攻击下溃退！"
 kor.150.d:0 "随着中共政府正式宣布介入朝鲜战争，数万中共军队跨过鸭绿江，向义州、温井一带的韩军发起猛烈进攻！无法经受住攻击的韩军仓皇逃串，向南撤退，并打乱了美军和联合国军在朝鲜半岛北部的部署。"
 

