l_simp_chinese:
 meme.1.t:0 "The detector detected an unknown signal!"
 meme.1.d:0 "Our intelligence, technology and military personnel reported an emergency report to us: our space probe received an unknown electromagnetic signal from the sender not long ago, with the content of an unknown noise. Our scientific and technological personnel cannot confirm whether it is from the earth or not, nor can they decipher its significance. But after calculation, we think that this information comes from the direction of Neptune, and there was a unidentified object nearby that we thought was a comet just a month ago!"
 meme.1.a:0 "I hope to live in a more enlightened era……"
 meme.1.b:0 "Did I fucking play the wrong game?"
 
 meme.2.t:0 "俄国的未来"
 meme.2.d:0 "在攻占莫斯科的同时，如何处理俄国未来道路的问题也摆在了我们面前：尽管一些人建议我们趁这个机会彻底消灭共产主义，建立一个民主、自由的新俄国，但大部分理智的顾问却认为，大部分俄国人对共产主义抱有好感，直接推翻共产党可能会引发不必要的暴乱，应该像曾经处理日本一样，保留苏维埃制度并扶植一名傀儡。"
 meme.2.a:0 "应当立刻建立一个自由的新俄罗斯。"
 meme.2.b:0 "应当保留苏维埃制度，创造一个没有威胁的苏联。"
 
 meme.3.t:0 "星球大战"
 meme.3.d:0 "银河帝国建立后，皇帝下令制造一种可怕的武器——死星，来威胁叛军。为了摧毁它，莱娅公主拿到了设计图并交给了义军。但是现在她被俘虏了，现在她唯一的希望是两架R2D2和C-3PO，还有绝地大师欧比-万·克诺比。这是星球大战的故事。这部电影于1977年上映，我们相信它将成为历史上最伟大的科幻电影。"
 meme.3.a:0 "愿原力与你同在。"
 
 meme.4.t:0 "撒切尔与《是，首相》"
 meme.4.d:0 "英国首相撒切尔夫人决定废除经济学家，以推进她的改革计划，这项计划委托给了吉姆•哈克和汉弗莱爵士。但他们似乎不喜欢这个决定，因为他们都有经济学学位。"
 meme.4.a:0 "Capital!"
 
 meme.9.t:0 "约翰·列侬遭到杀害！"
 meme.9.d:0 "一声枪响震惊了整个纽约，曾经席卷欧美的披头士乐队主唱约翰·列侬倒在血泊中。凶手很快被逮捕，根据审问，凶手马克·查普曼为了搏出名策划了这次袭击。"
 meme.9.a:0 "悲哀。"
 
 meme.10.t:0 "约翰·列侬躲过一劫！"
 meme.10.d:0 "一声枪响震惊了整个纽约，曾经席卷欧美的披头士乐队主唱约翰·列侬遭到袭击，一名男子试图开枪杀害他但没有打中，列侬迅速逃离现场，凶手很快被逮捕。根据审问，凶手马克·查普曼为了搏出名策划了这次袭击。"
 meme.10.a:0 "不幸中的万幸。"
 
