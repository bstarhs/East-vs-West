 meme.34.t:0 "发生在美国罗斯威尔的不明飞行物坠落"
 meme.34.d:0 "一个不明飞行物体在美国新墨西哥州罗斯威尔市的农场坠毁，目击者宣称一个圆圆的像飞碟的东西砸在了耕地上，随后美国军方抵达现场，驱逐当地居民并带走了不明飞行物。尽管美国政府对外宣称这只是一个气象气球，但阴谋论者认为这个不明飞行物来自地球之外，里面甚至可能搭载了外星人。"
 meme.34.a:0 "阴谋论者的狂欢罢了"
 
