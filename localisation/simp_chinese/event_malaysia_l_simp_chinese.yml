l_simp_chinese:
 mal.1.t:0 "共产党暴动！"
 mal.1.d:0 "一支共产党武装部队在我国农村地区发动叛乱!"
 mal.1.a:0 "We have to stop them!"

 mal.2.t:0 "游击队解散"
 mal.2.d:0 "随着共产主义在[FROM.GetName]的衰落和军队的日益严厉的镇压，越来越多的叛军投降，共产党的游击队已趋于崩溃。"
 mal.2.a:0 "Good."
 
 mal.3.t:0 "共产党的袭击！"
 mal.3.d:0 "一支共产党武装部队袭击了一处军事据点，我军与叛军发生激烈交火！"
 mal.3.a:0 "We have to stop them!"
 
 mal.4.t:0 "马来亚共产党发起全面进攻！"
 mal.4.d:0 "一支共产党武装部队在我国农村地区发动叛乱!"
 mal.4.a:0 "We have to stop them!"
 
 mal.6.t:0 "马来亚总督遇刺！！"
 mal.6.d:0 "英属马来亚总督亨利在上任不久后便遭到马来亚共产党的刺杀！亨利总督在自己的座驾中被炸死。这场刺杀案震惊了整个英属远东地区。"
 mal.6.a:0 "We have to stop them!"
 
 mal.7.t:0 "马来民族统一机构赢得马来亚大选"
 mal.7.d:0 "英属马来亚举行了第一次议会选举，马来民族统一机构（巫统）赢得议会多数席位，成为马来亚的第一个民选执政党。巫统承诺将尽快推动马来亚的独立，并争取马来亚各民族之间的和平统一。"
 mal.7.a:0 "We have to stop them!"
 
 mal.8.t:0 "英国宣布马来亚进入紧急状态！"
 mal.8.d:0 "英国当局今日正式宣布马来亚进入紧急状态，以应对日益严重的共产主义武装叛乱。即日起，英军及廓尔喀部队开始大规模调动，向丛林游击区展开清剿行动。\n政府声明，过去一个月已有20余处橡胶园遭袭，多名平民遇害。新加坡军港内，满载士兵的运输舰正在卸下装甲车，皇家空军蚊式轰炸机已开始对霹雳州疑似游击队营地实施空袭。\n伦敦下议院辩论中，工党议员质疑紧急状态法将激化矛盾，但殖民大臣强调"必须阻止东南亚赤化"。随着宵禁令实施和报刊审查启动，这片全球最大橡胶产地将迎来血腥的"丛林战争"。"
 mal.8.a:0 "We have to stop them!"
 
 mal.10.t:0 "马来亚独立！"
 mal.10.d:0 "随着马来亚国旗在吉隆坡缓缓升起，马来亚联邦正式独立，标志着这一地区结束了西方殖民者长达三百年的统治。新生的马来亚是一个联邦君主制国家，由马来亚半岛上的多个苏丹国组成，并在各个苏丹之间选举最高君主，而实权掌握在首相[MAL.GetLeader]手中。尽管马来亚获得独立，但仍然有许多问题摆在这个新国家面前。国内的马来、印尼和华人三大族裔之间的关系仍然紧张，而新加坡、沙捞越和北婆罗洲等地区的未来仍然迷茫。"
 mal.10.a:0 "We have to stop them!"
 
 mal.11.t:0 "马来西亚联邦构想"
 mal.11.d:0 "马来亚首相[MAL.GetLeader]提出了“大马来西亚”联邦的构想，主张将同为英国殖民地的新加坡、砂拉越、文莱和婆罗洲地区纳入马来西亚联邦的一部分，从而解决这些地区悬而未决的前途问题。"
 
 mal.12.t:0 "马来西亚联邦构想"
 mal.12.d:0 "马来亚首相[MAL.GetLeader]提出了“大马来西亚”联邦的构想，主张将同为英国殖民地的新加坡、砂拉越、文莱和婆罗洲地区纳入马来西亚联邦的一部分，从而解决这些地区悬而未决的前途问题。我们如何看待？"
 mal.12.a:0 "支持，这为解决远东问题提供了一个合理的方案。"
 mal.12.b:0 "反对，这不过是马来亚政府的一个野心和妄想。"
 
 mal.13.t:0 "[ROOT.GetName]表态支持马来西亚联邦计划"
 mal.13.d:0 "[ROOT.GetName]表态支持马来西亚联邦计划，认为这为解决远东问题提供了一个合理的方案。"
 
 mal.14.t:0 "[ROOT.GetName]表态反对马来西亚联邦计划"
 mal.14.d:0 "[ROOT.GetName]表态反对马来西亚联邦计划，认为这不过是马来亚政府的一个野心和妄想。"
 
 mal.17.t:0 "沙捞越暴动！"
 mal.17.d:0 "一支共产党武装部队在我国农村地区发动叛乱!"
 mal.17.a:0 "We have to stop them!"
 
 mal.20.t:0 "马来亚民族解放军成立！"
 mal.20.d:0 "随着中国共产党夺取中国大陆政权，东南亚地区的共产党游击队因为受到鼓舞。已经活动了数年之久的马来亚共产党发布声明，正式成立马来亚民族解放军，为驱逐英国殖民统治，建立人民共和国而战。"
 mal.20.a:0 "We have to stop them!"
 
 mal.21.t:0 "马来亚共产党的袭击！"
 mal.21.d:0 "马来亚共产党的武装部队袭击了霹雳、华玲等地的种植园和基础设施，并宣称这是马来亚解放战争的一部分。英国军方宣布将采取紧急措施，镇压共产党暴动。"
 mal.21.a:0 "We have to stop them!"
 
 mal.22.t:0 "动荡的马来亚"
 mal.22.d:0 "英属马来亚正陷入动荡不安之中。吉隆坡昨日发生一场大规模示威游行，示威者为华人支持的工会，他们要求改善华人工人的待遇，同时还希望当局同意马来亚共产党的合法化，并寄希望于马共支持他们的权益。而马来族右翼则坚决反对马来亚共产党，要求保护伊斯兰教下的社会秩序，并敌视支持马共的华人和工会。双方剑拔弩张，有爆发流血冲突的危险。\n驻扎马来亚的英国军警难以调和双方的矛盾，观察家认为，马来亚的局势可能将在不久后走向军事冲突。"
 
 mal.23.t:0 "支持马共的游行示威"
 mal.23.d:0 "尽管当局已宣布马来亚共产党为非法组织，但他依然得到许多左翼人士、华人和工会的支持。吉隆坡、新山等地爆发游行示威，工人要求当局停止镇压马来亚共产党，并尽快进行和谈，以实现马共的合法化。"
 
 mal.24.t:0 "我们已成功争取到当地居民的支持"
 mal.24.d:0 "我们派遣的政府代表团前往了[STATE.GetName]的当地村镇，与村里的话事人和长老进行了会谈。尽管花费了一番功夫，但总的来说，我们成功地降低了当地人对英国人的敌意，并让他们相信反共战争对他们是有益的，并劝说他们远离共产党的叛乱分子。\n我们的代表团离开前为当地居民提供了一批粮食和物资，并告诉他们，只有在民主政府的领导下，马来人和华人才能获得这些来自文明世界的援助，而满嘴谎言的叛乱组织只能带来战争和动荡。"
 
 mal.25.t:0 "当地居民拒绝与我们接触"
 mal.25.d:0 "我们派遣的政府代表团前往了[STATE.GetName]的当地村镇，然而，当地居民却对我们充满敌意。我们的代表团和华语、马来语翻译尝试寻找当地愿意与我们对话的居民，然而，这里的人从长者到孩童，都用仇恨的眼神注视着英国人……\n代表团无功而返，而在返程的路上，随行的军官认为这里或许已被叛乱分子渗透，也许未来需要对这一地区特别关注。"
 
 mal.26.t:0 "致马共分子公告"
 mal.26.d:0 "诸位请看！此人为马来亚共产党分子头目——陈平！你认识他吗？你见过他吗？你了解他吗？你对他一无所知，亦不知道其人其事，更不知道其为何发起叛乱，不知道其所提出的所谓政治诉求是真是假！那么，你为何要为此人卖命，不惜抛妻弃子呢？\n凡任何一位马共人员，能够脱离森林，把一挺布连枪带出来，或是带领保安队伍去将他所知道收藏的布连枪发掘出来，都可获得一千元的赏金！\n获得千元赏金，开始新的生活！"
 
 mal.27.t:0 "媒体批评马来亚军事行动"
 mal.27.d:0 "《泰晤士报》今日头版刊发战地记者调查，揭露英军在马来亚"紧急状态"中多次无差别攻击平民村庄。随文刊登的照片显示，雪兰莪州某华人村落被烧成白地，焦尸旁散落着英制子弹壳。\n为报复游击队袭击，苏格兰步兵团将200余名村民驱赶进橡胶林扫射，仅3名儿童幸存。国防部此前一直将此类事件归咎于"共匪火并"，但记者获得的军方内部文件显示，有军官在备忘录中写明"必要时可摧毁一切庇护游击队的设施"。\n殖民部傍晚发表声明，承诺成立调查委员会，但坚持称马来亚行动是"对抗共产恐怖主义的必要防御"。"
 
 mal.28.t:0 "马来亚当局宣布完善华人法律地位"
 mal.28.d:0 "英属马来亚政府颁布了一项新的法案，关注华人在马来亚的法律权益问题。\n华人自十九世纪中期便大量地来到马来亚，从事务工和商业活动，但他们的合法权益一直没有得到尊重。华人要求得到司法平等地位、投票权和被选举权，而这些需求，在今天有了实现的可能。马来亚政府正式宣布承认华人的公民权，只要是在马来亚出生且居住超过一定年限的华人，便有资格在未来的马来亚大选中投票。\n决定一出，引起马来亚社会各界广泛关注，《星洲日报》被抢购一空，华人群众和由华人组成的工会、政党发起庆祝游行。\n与此同时，一些右翼的马来人团体和政党也发起了反对这一法案的游行示威，他们指责政府把马来人的权力让给外来的阿中，这是不可接受的出卖。"
 
 
 mal.29.t:0 "马来亚当局宣布完善印度人法律地位"
 mal.29.d:0 "英属马来亚政府颁布了一项新的法案，关注印度人在马来亚的法律权益问题。\n印度人自十八世纪中期便大量地来到马来亚，从事务工和商业活动，但他们的合法权益一直没有得到尊重。印度人要求得到司法平等地位、投票权和被选举权，而这些需求，在今天有了实现的可能。马来亚政府正式宣布承认印度人的公民权，只要是在马来亚出生且居住超过一定年限的印度人，便有资格在未来的马来亚大选中投票。\n决定一出，引起马来亚社会各界广泛关注，《星洲日报》被抢购一空，印度人群众和由印度人组成的工会、政党发起庆祝游行。\n与此同时，一些右翼的马来人团体和政党也发起了反对这一法案的游行示威，他们指责政府把马来人的权力让给外来的拉玛萨米，这是不可接受的出卖。"
 
 
 
 
 mal.30.t:0 "罗斯里多比的审判"
 
 mal.31.t:0 "罗斯里多比被处死！"
 mal.31.d:0 "英国当局宣布，砂拉越民族主义者罗斯里多比将被处死！罗斯里多比是砂拉越民族主义团体十三太保的成员之一，该组织反对砂拉越成为英国直辖殖民地并支持砂拉越独立，为此他们策划了对总督司徒华的刺杀。"
 
 mal.32.t:0 "罗斯里多比被释放！"
 mal.32.d:0 "英国当局宣布，砂拉越民族主义者罗斯里多比将被释放！罗斯里多比是砂拉越民族主义团体十三太保的成员之一，该组织反对砂拉越成为英国直辖殖民地并支持砂拉越独立，为此他们策划了对总督司徒华的刺杀。"
 
 mal.35.t:0 "玛丽亚·埃尔托格的抚养权"
 
 mal.36.t:0 "新加坡法院判处玛丽亚·埃尔托格抚养权归养父母"
 mal.36.d:0 "一场引起整个英属马来亚关注的抚养权诉讼落下帷幕，新加坡法院认为，玛丽亚·埃尔托格的抚养权应该归属其穆斯林父母。玛丽亚·埃尔托格出生在荷属东印度一个天主教家庭，他与父母在二战时期失散，辗转流落到了马来亚，被一家穆斯林家庭收养。战争结束后，生父母找到玛丽亚，并与养父母为了争夺抚养权对簿公堂，最终以养父母胜诉告终。"
 
 mal.37.t:0 "新加坡法院判处玛丽亚·埃尔托格抚养权归生父母"
 mal.37.d:0 "一场引起整个英属马来亚关注的抚养权诉讼落下帷幕，新加坡法院认为，玛丽亚·埃尔托格的抚养权应该归属其生父母。玛丽亚·埃尔托格出生在荷属东印度一个天主教家庭，他与父母在二战时期失散，辗转流落到了马来亚，被一家穆斯林家庭收养。战争结束后，生父母找到玛丽亚，并与养父母为了争夺抚养权对簿公堂，最终以生父母胜诉告终。这一判决引起新加坡穆斯林群体的强烈不满！"
 
 mal.38.t:0 "新加坡爆发种族暴动！"
 mal.38.d:0 "玛丽亚·埃尔托格案件引发的政治争议演变为流血冲突！许多新加坡穆斯林反对判决结果，认为这是对穆斯林的歧视，并冲击司法机构，与警方发生激烈冲突！"
 
 mal.40.t:0 "马来亚政府与共产党开展谈判"
 mal.40.d:0 "在经历了十年的武装冲突后，马来亚政府首次与共产党武装力量进行谈判。"
 
 mal.41.t:0 "共产党开出条件"
 
 mal.42.t:0 "马来亚政府与共产党的谈判以失败告终"
 mal.42.d:0 "马来亚政府拒绝了共产党政府提出的所有条件，双方谈判以失败告终。"
 
 mal.43.t:0 "马来亚共产党叛军瓦解"
 mal.43.d:0 "马来亚共产党的武装力量在政府打击下瓦解，领导人陈平逃亡，许多叛乱分子选择投降。"
 
 
 mal.45.t:0 "民众开始支持英军打击马共"
 mal.45.d:0 "持续多年的马来亚紧急状态出现重大转折——越来越多的当地民众开始主动配合英军打击共产主义游击队。殖民政府最新民调显示，支持军事行动的比例大大提高。\n在槟城郊外的安全村，曾紧闭大门的村民近日向巡逻部队举报了三个游击队藏身处。上周，柔佛州某橡胶园工人更是主动伏击了前来征粮的游击队员，缴获武器上交军方。\n心理战专家分析称，医疗站、种子补贴等"民心工程"渐显成效。更关键的是，英军近期严惩了多起士兵虐待平民事件，重建了信任。\n随着越来越多的马来亚人加入辅警队伍，这场"人心争夺战"正迎来拐点。"
 
 mal.46.t:0 "民众迁入新村"
 mal.46.d:0 "英属马来亚当局已将[STATE.GetName]地区丛林地带的居民居民迁入新建的管制定居点。尽管遭遇零星抵抗，但这项旨在切断游击队补给线的战略总体进展顺利。"
 
 
 
 
 mal.50.t:0 "英国提出马来亚实现自治"
 mal.50.d:0 "在马来亚去殖民化运动不断发展的背景下，英国政府宣布，该国决定调整对英属马来亚的政策，伦敦将不再对马来亚进行直接委任专员统治，马来亚将在不久后进行选举，以产生一个民选的自治政府。"
 
 mal.51.t:0 "马来亚代表抵达伦敦进行会谈"
 mal.51.d:0 "以东姑·阿都拉曼为首的马来亚各党派代表团已抵达伦敦，代表团将代表英属马来亚，就马来亚的完全独立同英国进行谈判。"
 
 mal.52.t:0 "英国政府与马来亚代表的会谈结束"
 mal.52.d:0 "随着东姑·阿都拉曼先生与英国首相[ENG.GetLeader]一同走出唐宁街，英国政府与马来亚代表团就马来亚独立一事达成协议。除新加坡外，英国在马来亚半岛上的所有领地将合并为联邦，以马来亚联合邦的名义，成为独立国家，并选举森美兰州的苏丹端古·阿卜杜勒·拉赫曼取代英国国王成为马来亚的国家元首。马来亚将于不久后正式宣布独立，之后马来亚会继续保留英联邦成员国地位，同时双方就新加坡问题进行了谈话。"
 
 mal.53.t:0 "马来亚独立宣言正式公布"
 mal.53.d:0 "经过漫长的过渡期后，马来亚政府与英国达成的宣布独立建国的日子即将到来。首相东姑·阿都拉曼在征集伊斯兰教法学者的建议后，拟定了《马来亚独立宣言》。"
 
 mal.55.t:0 "马来亚人民社会主义阵线成立"
 mal.55.d:0 "随着巫统主导下的联盟成立，马来亚的左翼政党也开始寻求联合。在马来亚人民党主席阿末·博斯达曼支持下，马来亚人民党、马来亚劳工党、泛马来亚回教党、霹雳国民协会、人民进步党宣布联合，建立马来亚人民社会主义阵线。这将是马来亚最大的反对党联盟，也是最大的左翼势力。"
 
 mal.56.t:0 "关注马来亚局势"
 mal.56.d:0 "日本撤离后，英国重新恢复了对马来亚半岛的统治，英国当局计划推动所谓的马来亚联邦计划，以推动马来亚在英国可控范围内走向自治。然而这一次，马来半岛的居民——无论是本土的马来人，还是来自中国、印度等地的移民，都联合起来反对英国的马来亚联邦计划。马来人反对联邦基本法中削弱拉惹（马来传统君主）权力的条款，而华人和印度人则要求扩大投票权。\n日本的侵略为马来亚各族群带来了政治觉醒，他们发现英国人和日本人本质是一样的，都是掠夺马来亚的橡胶、锡矿却不为居民提供基本政治权力的入侵者。\n政治觉醒带来了活跃的政治运动。马来民族统一机构、人民力量中心、泛马联合行动理事会和马来国民党已发起各种运动，以推动英国废除马来亚联邦计划。"
 
 mal.57.t:0 "敏感的种族问题"
 mal.57.d:0 "尽管马来亚的各阶层、各不同种族暂时团结起来，合作反对这个对所有种族都不利的马来亚联邦计划，然而，关于如何建立新的马来亚，不同种族之间还是出现了巨大分歧。\n代表左派的泛马联合行动会认为，马来亚属于所有马来亚人，马来亚的所有居民，无论是土著马来人，还是印度裔、华裔移民，都应当在新国家享有平等政治权力，马来亚属于所有马来亚人，应建立多民族的国族认同。\n右翼的马来民族统一机构则支持马来亚属于马来人，应建立一个马来人优先的国家，印度人和华人是外来者，他们的权益应该受到限制。巫统的极右翼强调，阿中和拉玛萨米不可能永远忠于马来亚。"
 
 mal.58.t:0 "宪法153条的拟定"
 mal.58.d:0 "东姑·阿都拉曼在伦敦召开新闻发布会，表示巫统将在不久后正式颁布新的马来亚宪法，并在国家正式独立后实行。有关马来亚最关注的马来、印度、华人之间的政治权力问题，马来亚政府将作出妥协方案——宪法153条。\n马来亚宪法第153条将在保障马来人具有特殊地位的前提下，承认印度人和华人的公民权。在马来亚生活和出生的印度人、华人等外籍族裔，享有公民权和投票权，但另一方面，马来人拥有在经济、政治、就业上的特权，以保障马来人作为国家主体民族的地位。\n我们认为这是一种社会契约论，我们给予华人和印度人生活在马来亚的权力，作为交换，他们需要承认马来亚人是这片土地的主人。阿都拉曼如此告诉记者。"
 
 mal.59.t:0 "新村的发展"
 mal.59.d:0 "前方记者在马来亚发来报告。马来亚政府为避免马来亚共产党与丛林居民的接触，而将这些地区的居民迁移至政府修建的新村。起初新村计划遭到居民的强烈抵制，美国媒体也指责这种新村是所谓的集中营。然而，经过几个月的生活，居民们还是接受了新村的居住。\n新村的居民对记者表示，新的家园虽然对居民的出入自由进行了限制，但生活质量确实比生活在丛林的村庄和贫民窟要好。这里无论是华人还是印度人都平等地生活在一起，有充足的饮用水和医疗服务，远比生活在战区，面临马共的威胁要好。"
 
 mal.60.t:0 "新村发生暴动！"
 mal.60.d:0 "前方记者在马来亚发来报告。马来亚政府为避免马来亚共产党与丛林居民的接触，而将这些地区的居民迁移至政府修建的新村，但新村计划遭到居民的强烈抵制！\n大批民众聚集在新村的管理中心，痛批这个地方简直是集中营！没有饮用水、住房墙壁开裂又闷热，缺少药品和医院，民众在监狱般的环境中生存，还不如回到马共控制区！\n大批新村居民与警察发生激烈冲突，新村管理人员呼吁尽快为新村修建医院和学校！"
 
 mal.61.t:0 "工会与马共的决裂"
 mal.61.d:0 "记者在吉隆坡最近的活动中注意到，随着英国和马来亚当局对马来亚共产党的镇压逐渐取得优势，马来亚的许多左派组织，包括工会，已不再公开支持马来亚共产党，许多工会宣布，与马共断绝关系。"
 
 
 
 
 sig.1.t:0 "新加坡立法局选举"
 sig.1.d:0 "新加坡举行二战后的第二次立法局选举，但只有极少数英裔精英阶级拥有选举和被选举权。"
 
 sig.2.t:0 "新加坡的前途问题"
 sig.2.d:0 "在英属马来亚走向自治的同时，新加坡殖民地的问题也需要解决。"
 
 sig.3.t:0 "新加坡的自治权将得到扩大"
 sig.3.d:0 "在英属马来亚走向自治的同时，新加坡殖民地的问题也需要解决。英国政府指示乔治·威廉·伦德尔爵士领导的委员会，研究新加坡自治的可能性，其提出了有限形式的自治。\n立法议会将取代立法委员会，在议会制下，立法委员会将选出首席部长作为政府首脑，由部长会议组阁。英国将保留对国防和外交等领域的控制权，以及对立法的否决权。"
 
 sig.4.t:0 "新加坡首次议会选举即将开始"
 sig.4.d:0 "新加坡的首次议会选举即将开始，左翼的劳工党将与亲英的进步党争夺席位。相比过去的立法局选举，议会选举的选民资格大大扩大，其中华人居民的选票将成为选举争夺的重点。"
 
 sig.5.t:0 "新加坡劳工党成立！"
 sig.5.d:0 "新加坡自治权和选举权扩大后，社会各界广泛开展政治活动。大卫·马绍尔和林有福领导下的新加坡劳工阵线宣布成立，该党政治立场偏左翼，主张尽快使新加坡脱离英国直辖实现自治。"
 
 sig.6.t:0 "新加坡人民行动党成立！"
 sig.6.d:0 "新加坡自治权和选举权扩大后，社会各界广泛开展政治活动。李光耀领导下的新加坡人民行动党宣布成立，该党代表精英阶级，主张尽快使新加坡脱离英国直辖实现自治。"
 
 sig.7.t:0 "劳工党赢得新加坡大选！"
 sig.7.d:0 "劳工党赢得新加坡大选！大卫·马绍尔就任新加坡自治领首任总理！"
 
