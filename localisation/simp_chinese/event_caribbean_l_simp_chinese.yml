l_simp_chinese:
 pri.1.t:0 "波多黎各民族主义运动再起"
 pri.1.d:0 "历经多年监禁，波多黎各民族独立运动领袖佩德罗·坎波斯今日在万人簇拥中重返故土。\n佩德罗·阿尔比苏·坎波斯1893年出生于波多黎各的庄园主家庭，后前往美国学习法律，毕业后回国为穷人打官司。在见证了波多黎各底层民众的困苦后，佩德罗转而从政，他认为美国不断地拒绝改善平民待遇的法案，因此波多黎各只有脱离美国才能生存。1935年，佩德罗成立波多黎各民族党，后因煽动暴动被捕入狱，一直到今年才重返故土。\n坎波斯在莫罗城堡前即兴演说，其支持者当场焚烧1898年美国占领时期的旧军旗，而反对独立的部分民众则与警方发生冲突，至少二十人被捕。"
 
 pri.2.t:0 "美国正式颁布波多黎各联邦关系法"
 pri.2.d:0 "美国国务院今日正式宣布，美国已决定颁布新的《波多黎各与联邦关系法》，新的法律将给予波多黎各更大的自治权，包括民选的参议员、民选总督，同时将更多的经济和外交权力移交波多黎各地方政府。这意味着美国似乎已经决定向波多黎各的独立主义让步，未来或许将进一步让波多黎各的完全独立成为可能。"
 
 pri.3.t:0 "波多黎各总督的换届"
 pri.3.d:0 "根据《波多黎各与联邦关系法》，波多黎各将产生一位新的波多黎各本土籍的总督。大部分波多黎各民众支持民族党的路易斯·坎波斯，以更快的实现波多黎各的完全独立，但坎波斯没有从政经验，因此美国国务院希望任命曾在政府内部工作多年的路易斯·马林就任总督。"
 
 pri.4.t:0 "路易斯·马林担任波多黎各总督"
 pri.4.d:0 "来自华盛顿的消息。根据最新的波多黎各与联邦关系法，为了实现波多黎各的自治，美国政府将正式任命路易斯·马林为首位波多黎各本土籍的总督。\n路易斯·马林在就职仪式上，宣布他将对美国效忠，并认为波多黎各只需要一定程度的自治即可，不需要也不应该独立。他强烈谴责以佩德罗·坎波斯为首的波多黎各民族党，并宣称要采取强硬措施。"
 
 pri.5.t:0 "佩德罗·坎波斯宣布参选"
 
 pri.6.t:0 "波多黎各首届立法选举"
 pri.6.d:0 "来自华盛顿的消息。根据最新的波多黎各与联邦关系法，为了实现波多黎各的自治，美国政府将在不久后实行波多黎各的首次立法选举，通过民主的方式产生波多黎各的首个民选政府。"
 
 pri.7.t:0 "波多黎各民族党赢得立法选举"
 pri.7.d:0 "来自圣胡安的消息！波多黎各的首次立法选举今日落下帷幕，佩德罗·坎波斯领导的波多黎各民族党以微弱优势，赢得波多黎各参议员的多数席位，获得组织波多黎各首个民选政府的资格！"
 
 pri.8.t:0 "波多黎各前途问题的谈判"
 
 pri.9.t:0 "波多黎各的独立协议正式签署"
 pri.9.d:0 "波多黎各的独立协议正式签署"
 
 pri.10.t:0 "波多黎各正式宣布独立！"
 
 
 pri.11.t:0 "联邦关系法遭到抵制！"
 pri.11.d:0 "美国政府直接任命路易斯·马林为总督的行为，引发了波多黎各民族主义者的强烈不满，圣胡安和波多黎各多地爆发大规模示威游行，反对联邦关系法，要求立刻进行民主选举！"
 
 pri.12.t:0 "波多黎各爆发大规模暴动！"
 pri.12.d:0 "来自波多黎各的突发消息！波多黎各民族主义者今日凌晨，在全岛多地发起武装叛乱！目前已爆发大规模交火！\n数日之前，波多黎各军警在庞塞查获一辆载有大量武器的车辆，民族党分子因此决定提前发动起义。今天凌晨，三百多名武装分子首先向马亚圭斯的警察局发起进攻，武装分子向警察局投掷手榴弹并发起冲击。圣胡安、哈尤亚和乌图阿多也遭到武装分子袭击。\n有证据显示，这场暴动由波多黎各民族党首领佩德罗·坎波斯直接领导。"
 
 pri.13.t:0 "波多黎各暴动正在扩大！"
 
 pri.14.t:0 "波多黎各民族主义者夺取圣胡安！"
 pri.14.d:0 "佩德罗·坎波斯指挥下的波多黎各民族党武装分子已占领圣胡安、庞塞等主要城市！！波多黎各国民警卫队亦被击溃，美国军队被迫撤离波多黎各。坎波斯宣布美国对波多黎各近五十年的统治正式结束！"
 
 pri.15.t:0 "波多黎各国民警卫队与叛军激烈交火"
 
 pri.16.t:0 "波多黎各暴动被镇压"
 pri.16.d:0 "波多黎各民族党发起的大规模武装暴动已被镇压，大部分武装分子被击毙或俘虏，佩德罗·坎波斯被捕。"
 
 
 pri.17.t:0 "杜鲁门遭遇未遂刺杀！"
 pri.17.d:0 "来自华盛顿的突发消息！\n美国总统哈里斯·杜鲁门在华盛顿郊区的布莱尔宫休息时，遭到两名刺客袭击！刺客与保安人员激烈交火，最终一名刺客被击毙，一名刺客受伤被俘。经过审讯，刺客宣称自己来自波多黎各民族党，刺杀总统旨在引起国际社会对波多黎各独立运动的关注。"
 
 pri.20.t:0 "美国国会遭到武装袭击！"
 
 
 
