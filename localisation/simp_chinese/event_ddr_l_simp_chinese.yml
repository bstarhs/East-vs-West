l_simp_chinese:
 ddr.1.t:0 "德意志民主共和国成立"
 ddr.1.d:0 "在苏联支持下，德意志民主共和国在苏联占领区成立，该国由德国共产党、德国社会民主党合并而成的统一社会党执政，威廉·皮克担任第一任总统。\n民主德国是苏联控制下成立的共产主义卫星国之一，其与西部美国支持下的联邦德国形成对峙。"
 ddr.1.a:0 "德国和欧洲已经陷入分裂。"

 ddr.4.t:0 "统一社会党总书记选举"
 ddr.4.d:0 "1971年，随着乌布利希的逝世，民主德国人民议会和统一社会党召开会议，选举统一社会党下一任总书记兼民主德国国务委员会主席。埃里希·昂纳克同志是最受欢迎的人选，他的的社会政治理论被接纳，还得到苏联领导人勃列日涅夫的支持。但也有人指出，曾担任国防部长、部长会议主席兼国务委员会副主席的维利·斯多夫同志能够更好应对日后可能爆发的同西方的对抗。"
 ddr.4.a:0 "昂纳克同志镇定、有才且经验丰富，国家领导人非他莫属。"
 ddr.4.b:0 "斯多夫部长对战争和政治有足够的能力，领导我们对抗资本主义。"
 
 
 
 ddr.5.t:0 "难民向西方逃亡"
 ddr.5.d:0 "一大批不满统一社会党执政的难民跨过边界前往西德，长此以往将导致我国的人才和知识分子流失。"
 ddr.5.a:0 "真见鬼。"
 
 ddr.9.t:0 "跨过柏林的青年"
 ddr.9.d:0 "在柏林围墙正在建造之时，一名19岁的东德士兵康拉德·舒曼在西柏林市民的呼唤之下，跨过分割东西柏林的铁丝网，来到西柏林，随后坐上一辆警车离去。\n这一瞬间被摄影师彼得·莱宾拍下，并成为各国新闻报纸的头条。目前东德政府还未对此作出回应。"
 ddr.9.a:0 "德国和欧洲已经陷入分裂。"
 
 
 
 ddr.10.t:0 "东柏林爆发抗议游行！"
 ddr.10.d:0 "东柏林的工人和群众发动了游行示威，抗议工人待遇的恶化和党政的腐败，我们应该如何应对？"
 ddr.10.a:0 "这是反动游行，立即镇压。"
 ddr.10.b:0 "应当试图和工人对话。"
 
 ddr.11.t:0 "东柏林爆发抗议游行！"
 ddr.11.d:0 "东柏林市的工人和群众发动了游行示威，抗议工人待遇的恶化和党政的腐败。东德当局选择与示威者对话，我们如何应对？"
 ddr.11.a:0 "由东德政府自己处理。"
 ddr.11.b:0 "这是反动游行，波兰应当立即镇压。"
 
 ddr.12.t:0 "东柏林爆发抗议游行！"
 ddr.12.d:0 "东柏林市的工人和群众发动了游行示威，抗议工人待遇的恶化和党政的腐败。东德当局出动军警对游行进行了武力镇压，造成多人死亡。这一事件严重损害了统一社会党政府在群众心中的威信。"
 ddr.12.a:0 "悲剧。"
 
 ddr.13.t:0 "苏联向我们发来警告"
 ddr.13.d:0 "莫斯科方面提醒我们不要与示威者进行谈判，因为它们可能是反革命的。"
 ddr.13.a:0 "悲剧。"
 
 ddr.14.t:0 "东德无视我们的警告"
 ddr.14.d:0 "东德政府无视了我们的警告，他们将继续和示威者进行对话。"
 ddr.14.a:0 "悲剧。"
 
 ddr.15.t:0 "东德政府与示威者进行谈判"
 ddr.15.d:0 "东德政府与反对增加工作时间的示威者进行了谈判，示威者暂时散去了。"
 ddr.15.a:0 "悲剧。"
 

 ddr.20.t:0 "The going to West!"

 ddr.21.t:0 "Honecker resigned"

 ddr.22.t:0 "柏林墙倒塌"
 ddr.22.d:0 "什么是社会主义？井底之蛙、固步自封不是社会主义。袒露胸怀，面向他人，同别国共处才符合社会主义。不仅是憧憬一个更美好的世界，而是要将它实现。因此我决定，开放民主德国的边境。随着政治局委员沙波夫斯基的电视讲话，隔绝了德国数十年的柏林墙迎来终结。在检查站完成最后一天工作的边防军人离开岗位后，激动的柏林两侧居民涌向勃兰登堡门，打破这堵隔绝了两个世界的墙，拥抱居住在另一边的亲人。"
 ddr.22.a:0 "今夜，德国不在分为东西，分为你我。"
 
 ddr.23.t:0 "Election in DDR"
 
 ddr.24.t:0 "德国统一会议"
 
 ddr.26.t:0 "苏联要求修改西柏林地位！"
 ddr.26.d:0 "苏联领导人发来最后通牒，要求我方与东德签署单独的和平条约，使西柏林成为自由市，从而终止四国协定。西方进入西柏林和东柏林的权利将由苏联军队负责。"
 ddr.26.a:0 "这是不可能的。"
 ddr.26.b:0 "我们没有选择。"
 
 ddr.27.t:0 "美军撤离西柏林！"
 ddr.27.d:0 "在苏联的要求下，北约军队被迫撤离西柏林，结束了西方国家对西柏林十几年的控制。东德边防军队很快接管了这座城市，至于苏联的东德当局是否会遵守承诺，保持西柏林的自由市地位，就不得而知了。"
 ddr.27.a:0 "这是不可能的。"
 
 ddr.28.t:0 "美国拒绝我们的要求！"
 ddr.28.d:0 "美国及北约国家拒绝了我们要求其撤离西柏林的最后通牒。"
 ddr.28.a:0 "封锁柏林。"
 
 ddr.29.t:0 "东德政府开始隔离西柏林！"
 ddr.29.d:0 "随着第二次柏林危机开始恶化，东德政府开始在苏联支持下，在柏林建造钢筋水泥墙，以阻止东德民众进入西柏林。"
 ddr.29.a:0 "封锁柏林。"
 
 
 ddr.32.t:0 "乌布利希的地位动摇！"
 ddr.32.d:0 "东柏林暴动后不久，斯塔西局长威廉·蔡塞尔联合政治局中央委员会委员、《新德意志报》编辑鲁道夫·赫恩施塔特试图推翻乌布利希。蔡塞尔与赫恩施塔特公开批判了乌布利希和负责党内纪律的中央监察委员会主席马特恩的官僚和专制作风，称他们要为此次危机负责，在他们的领导下统一社会党已经不代表工人阶级了。/n蔡塞尔主张替换乌布利希，让赫恩施塔特担任第一书记并实行集体领导。"
 
 ddr.33.t:0 "东德内部的不安定"
 ddr.33.d:0 "东德统一社会党内部的权力斗争愈发激烈。政治局召开会议，蔡塞尔主张替换乌布利希，让赫恩施塔特担任第一书记并实行集体领导，得到了弗里德里希·艾伯特、海因里希·劳和埃利·施密特的支持，而乌布利希只得到了马特恩和埃里希·昂纳克的支持。双方都希望获得决定性的力量——来自莫斯科的支持。"
 
 ddr.34.t:0 "蔡塞尔向乌布利希发起挑战"
 ddr.34.t:0 "威廉·蔡塞尔得到了苏联情报机构领导人、副总理贝利亚的支持，主张缓和与西方国家关系的贝利亚已决定，通过撤换瓦尔特·乌布利希，来平息西方对东德镇压东柏林暴动的舆论怒火。得到苏联支持的威廉·蔡塞尔主张替换乌布利希，让赫恩施塔特担任第一书记并实行集体领导，得到了弗里德里希·艾伯特、海因里希·劳和埃利·施密特的支持。"
 
 ddr.35.t:0 "瓦尔特·乌布利希辞职！"
 ddr.35.d:0 "德国统一社会党的总书记瓦尔特·乌布利希在党内巨大的反对压力下，被迫宣布对东柏林工人暴动负责，引咎辞去总书记职务！"
 
 ddr.36.t:0 "[DDR.GetLeader]就任统一社会党总书记！"
 
 ddr.37.t:0 "苏联向乌布利希表达支持"
 ddr.37.d:0 "苏联领导曾害怕撤掉乌布利希会解读为示弱，因此苏联共产党第一书记赫鲁晓夫和总理马林科夫支持乌布利希。"
 
 ddr.38.t:0 "威廉·蔡塞尔被解除职务"
 ddr.38.d:0 "在得到莫斯科的支持后，乌布利希巩固权力并撤掉了包括蔡塞尔在内的其他潜在对手。乌布利希在中央委员会全体会议上发表了未经政治局讨论的演讲，批判“蔡塞尔-赫恩施塔特集团”在“法西斯政变”中采取“投降的态度”并直接勾结贝利亚以复辟资本主义。蔡塞尔被开除出政治局和中央委员会，被迫辞去部长职务。"
 
 
 ddr.40.t:0 "Vita功能饮料正式发售！"
 ddr.40.d:0 "今天早晨，民主德国全国各地的商店里，出现了一款全新的功能饮料。透明的玻璃杯里装载着黑色的碳酸饮料，杯子上印着一个金黄色的柠檬，用醒目的的文字写着：Vita Cola。\n随着冷战的加剧，西方资本主义国家不断用可口可乐输出他们的消费品制造能力，民主德国民众羡慕不已，统一社会党高层对此十分头疼，此外，由于德国民众居高不下的酒精摄入，频发的事故和社会犯罪也让党感到不安。\n党中央下达命令，要求开发一款能够代替酒精与可口可乐的新饮品，并将任务下达给莱比锡化学研究所的汉斯·津恩博士。津恩博士基于植物基底，在化工原料的基础上添加天然成分，包括由柑橘、香草、可乐果提炼而成的原液，以及大量咖啡因和维生素，一瓶Vita可乐的咖啡因含量大约半杯咖啡，而维生素C的含量相当于一个柠檬。\n在新款可乐上市后，立刻受到了民主德国广大群众的欢迎。由于可乐富含咖啡因，具有较好的提神功能，尤其受工人阶级喜爱。"
 
 ddr.41.t:0 "第一辆Trabant汽车完工下线！"
 ddr.41.d:0 "来自民主德国兹维考市消息。民主德国的第一辆国产汽车在萨克森汽车厂正式组装下线，政府将其命名为Trabant牌，意为卫星。\n卫星牌轿车是民主德国五年计划的重大成果，其目的不仅是为了向民众提供廉价且耐用的民用汽车，且有意与西方国家的汽车竞争。\n卫星牌汽车采用前轮驱动，一体车架；紧凑车身，独立悬吊和两冲程引擎，解决了东德民用汽车从无到有的问题。"
 
 ddr.42.t:0 "东德第一家天体浴场对外开放"
 ddr.42.d:0 "来自东柏林消息。经过了数年的争议、讨论、民众致信和高层决策，民主德国终于宣布：以天体运动为名义开放的裸体浴场在该国获得法律许可，这意味着，民众将可以在指定的海滩浴场脱掉所有衣服，进行全裸活动。民主德国当局表示，在符合法律要求的情况下开放裸体浴场，有利于人民进行健康的体育活动，同时这也是民主德国对比保守的西方国家，更加进步一面。\n\n来自莱比锡大学的物理系女学生安格拉·默克尔作为首位进入浴场的游客接受了我们的采访。"
 
 ddr.43.t:0 "俱乐部可乐的诞生"
 ddr.43.d:0 "在今天的莱比锡国际展销会上，民主德国政府再一次推出了一款新的饮料——俱乐部可乐。与维他可乐不同，俱乐部可乐由对可口可乐的直接逆向工程研发而成，旨在为东德民众提供西方资本主义可乐的替代品。与可口可乐的不同在于，俱乐部可乐减少了糖浆的含量，并使用来自萨克森的天然矿泉水作为原料。民主德国宣称，俱乐部可乐比西方可乐更加健康，有利于人民在想用饮品的同时减少糖分摄入。"
 
 
 ddr.50.t:0 "东德政府开始隔绝德国内部边境！"
 
 ddr.51.t:0 "东德政府开始进一步隔绝德国内部边境！"
 
 ddr.52.t:0 "东德政府开始在德国内部边境建造阻隔设施！"
 
 ddr.53.t:0 "东德政府开始在德国内部边境建造军事分界设施！"
 
 ddr.54.t:0 "东德边防军开始在德国内部边境加强巡逻！"
 
 ddr.55.t:0 "东德海关关闭柏林民间过境！"
 
 ddr.56.t:0 "东德海关关闭德国内部边境过境通道！"
 
 ddr.57.t:0 "东德国家安全局开始扩大对民众的监控！"
 
 
 ddr.60.t:0 "恩斯特·台尔曼先锋队成立！"
 ddr.60.d:0 "在东柏林的广场上，数百名带着鲜艳蓝领巾的少年队列站着一排又一排，广场上飘荡着鲜艳的国旗和党旗，统一社会党的主要领导人来到广场，向少年们挥手致意。\n今天是恩斯特·台尔曼先锋队成立的日子，作为统一社会党的青年组织，先锋队将招收8至14岁的学生进入组织，培养共产主义的接班人。\n[FROM.GetLeader]总书记上台发言，祝贺广场上的孩子们成为第一批加入光荣的先锋队的队员，希望他们认真学习，积极劳动，成为对社会主义事业有贡献的青年才俊，不断发展自己的能力，成为共产党的下一任接班人。随后，总书记同志亲自为少先队代表系上蓝领巾，现场爆发热烈的掌声。"
 
 ddr.61.t:0 "自由德国青年团成立！"
 ddr.61.d:0 "在东柏林的广场上，数百名带着鲜艳蓝领巾的少年队列站着一排又一排，广场上飘荡着鲜艳的国旗和党旗，统一社会党的主要领导人来到广场，向少年们挥手致意。\n今天是自由德国青年团成立的日子，作为统一社会党的青年组织，先锋队将招收14至20岁的学生进入组织，培养共产主义的接班人。\n[FROM.GetLeader]总书记上台发言，祝贺广场上的孩子们成为第一批加入光荣的青年团的队员，希望他们认真学习，积极劳动，成为对社会主义事业有贡献的青年才俊，不断发展自己的能力，成为共产党的下一任接班人。随后，总书记同志亲自为青年团代表系上蓝领巾，现场爆发热烈的掌声。"
 
 ddr.62.t:0 "东德开始拍摄电影《恩斯特·台尔曼传》"
 
 ddr.63.t:0 "民主德国国家人民军成立！"
 ddr.63.d:0 "德意志民主共和国今天在东柏林举行了盛大的阅兵仪式，宣布正式将准军事组织性质的驻营武装警察，改编为国家人民军，成为一支国家和统一社会党领导下的军事武装力量，同时成立国防部和最高军事委员会。"
 
 
 ddr.70.t:0 "东德开始建造柏林电视塔！"
 
 ddr.71.t:0 "柏林电视塔建造完成！"
 
 
 ddr.80.t:0 "卡尔·施尔德万势力的崛起！"
 
 ddr.81.t:0 "卡尔·施尔德万集团向党中央施加压力！"
 
 ddr.82.t:0 "瓦尔特·乌布利希辞职！"
 
 ddr.85.t:0 "德国统一社会党成立！"
 ddr.85.d:0 "在苏联的支持下，德国社会党与德国共产党正式合并，成立德国统一社会党。"
 
 ddr.86.t:0 "民主德国政治体制改组！"
 ddr.86.d:0 "在最近一次德意志民主共和国全国大会上，民主德国正式颁布了新的宪法，对国家机构进行了改革。新宪法废除了德意志民主共和国总统职位，而由集体领导的国务委员会代替。现任总统威廉·皮克将结束自己的国家元首职务退居二线，统一社会党总书记瓦尔特·乌布利希将就任国务委员会主席，成为新的实际领导人。"
 
 
 ddr.90.t:0 "民主德国国家安全局成立！"
 ddr.90.d:0 "东德当局将统一社会党控制的德国内务部正式改组为德意志民主共和国国家安全局，简称斯塔西，负责搜集情报、监听监视、反情报等业务。威廉·蔡塞尔就任国家安全局的首任部长。"
 
 ddr.91.t:0 "民主德国彻底禁止一切非官方出入境！"
 ddr.91.d:0 "德意志民主共和国当局正式发布命令，宣布在没有得到政府许可的情况下，禁止任何公民离开德意志民主共和国，尤其是将私自逃亡西部定为非法行为！/n由于越来越多东部德国人对共产党的统治出现排斥，向西逃亡联邦德国的人口不断增加，民主德国当局决定采用强硬手段来禁止。民主德国军警被紧急部署到两德边境和西柏林周边，阻止民众涌入西方，他们建造了简易的围墙和铁丝网，对所有尝试进入西部地区的民众进行阻拦和排查，并获得了开枪射击的许可。"
 
 ddr.92.t:0 "东德政府开始扩大柏林墙！"
 ddr.92.d:0 "来自西柏林的突发消息，今天凌晨，东德政府突然调动军警和大量工人，在西柏林与民主德国的边境上，建造大规模的围墙！军警首先迅速封锁了西柏林的所有通往东德的道路，禁止任何车辆人员进入，并破坏了道路，随后被动员的工人在军人的监督下，开始用钢筋水泥加固原先东德当局在西柏林周围设下的铁丝网，并最终开始修建高约两米的水泥围墙，柏林西侧外围共修筑156公里、柏林市区43公里。"
 
 ddr.93.t:0 "柏林墙的正式建立！"
 ddr.93.d:0 "经过数个礼拜的修建，长达150公里的西柏林围墙正式建成，东德军警在这座柏林围墙上设立了，多个警戒哨，手持枪械对所有试图靠近围墙的人瞄准警告。/n德国统一社会党总书记[DDR.GetLeader]在今天的记者会上介绍了这一围墙，他表示，东德官方称之为反法西斯防卫墙，其建造目的在于防范西方的潜在侵略威胁和阻挡间谍通向东欧。"
 
