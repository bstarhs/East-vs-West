l_simp_chinese:
 mli.1.t:0 "几内亚民主党的形成"
 mli.1.d:0 "随着法国开始允许殖民地选举代表进入法国国民议会，法国各殖民地出现了积极的政治活动。其中几内亚社会主义联盟和几内亚协议党在过去的几内亚选举中都获得了席位，但随着去殖民化运动开始变得更激进，几内亚民主党和他们的领袖艾哈迈德·塞古·图尔崭露头角。艾哈迈德·塞古主张更进一步的几内亚独立，包括几内亚完全独立建国并排除法国的影响力。"
 
 mli.2.t:0 "法属几内亚国民议会代表的增选"
 mli.2.d:0 "法属几内亚的国民议会代表亚辛·迪亚洛去世，使得几内亚在法国国民议会中的席位出现一个空缺。几内亚将在不久后进行补选，左翼激进的艾哈迈德·塞古·图尔和亲法温和的迪亚瓦杜·巴里将竞争这个席位。"
 
 mli.3.t:0 "法属几内亚补选结束"
 mli.3.t:0 "亲法温和的迪亚瓦杜·巴里在法国支持下赢得选举，成为法属几内亚的国民议会代表。"
 
 mli.4.t:0 "法属几内亚补选结束"
 mli.4.t:0 "艾哈迈德·塞古·图尔赢得几内亚选举的多数票，成为法属几内亚的国民议会代表。"
 
 mli.5.t:0 "艾哈迈德·塞古·图尔与几内亚总工会"
 mli.5.d:0 "艾哈迈德·塞古·图尔与非洲民主联盟发生分裂，艾哈迈德·塞古主张更激烈的去殖民化政策，反对在几内亚民主党中占主流的所谓法兰西共同体模式。艾哈迈德·塞古宣布单独成立几内亚总工会，主张几内亚的完全独立建国。"
 
 mli.6.t:0 "几内亚左翼势力拒绝共同体宪法"
 mli.6.d:0 "法国各殖民地将举行是否接受法兰西第五共和国宪法举行公投，然而，法属几内亚的左派领袖艾哈迈德·塞古·图尔呼吁抵制宪法。艾哈迈德·塞古宣称，公投只允许几内亚人民在成为法国海外省和法兰西共同体自治领中二选其一，这都不能让几内亚人民真正摆脱殖民统治迎来独立，因此他要求法国允许几内亚作出第三个选择——拒绝第五共和国宪法，实现完全独立！\n法国政府中反对几内亚独立的政客威胁，如果几内亚完全脱离法国，巴黎就将全部切断对几内亚的援助，对此艾哈迈德·塞古表示：宁愿要贫穷中的自由，也不要奴役中的富裕！"
 
 mli.7.t:0 "法国拒绝几内亚的独立公投"
 
 mli.8.t:0 "法属几内亚爆发大规模罢工运动！"
 
 mli.9.t:0 "法属几内亚局势恶化"
 
 mli.10.t:0 "法属几内亚发生武力冲突！"
 
 mli.11.t:0 "国际社会关注几内亚局势！"
 
 mli.12.t:0 "宣布支持几内亚独立公投！"
 
 mli.13.t:0 "法国接受了法属几内亚的独立公投"
 mli.13.d:0 "法国政府正式宣布：巴黎已同意几内亚在公投中获得完全独立这一选择，如果大多数几内亚人选择完全脱离法国走向独立，巴黎将不会反对和干涉这一决定，但造成的后果将由几内亚人自己承担。\n消息传到科纳克里后，市民群情激愤，艾哈迈德·塞古和他领导的几内亚总工会立刻开始拉票活动，呼吁民众用选票争取国家的独立自主，而精英阶层和中产阶级对此十分担忧，他们呼吁民众投票这一不合时宜的激进独立政策，因为他们相信几内亚没有了法国的援助将无法存活。"
 
 mli.14.t:0 "几内亚公投宣布独立！"
 mli.14.d:0 "《法兰西第五共和国》在公投中获得不到三分之一的支持率！！这意味着大多数几内亚人民选择脱离法国，成为独立国家！尽管心有不甘，但法国政府还是被迫承认几内亚公投。许多第三世界国家政府立刻宣布承认公投的合法性，并对几内亚人民进行祝贺。这是首次有法国的非洲殖民地，通过完全公投的形式宣布独立！"
 
 mli.15.t:0 "几内亚共和国正式成立！"
 mli.15.d:0 "几内亚共和国今日正式宣布成立！艾哈迈德·塞古·图尔宣誓就任几内亚的第一任总统，并宣布要在几内亚建立非洲的第一个社会主义国家。\n法国政府宣布撤出在几内亚的所有投资建设。"
 
 mli.20.t:0 "马里联邦的构想"
 
 mli.20.t:0 "象牙海岸抵制马里联邦！"
 
