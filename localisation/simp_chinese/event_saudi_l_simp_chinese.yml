l_simp_chinese:
 sau.2.t:0 "石油输出国组织的筹备"
 sau.2.d:0 "[FROM.GetName]提议成立石油输出国组织，以对抗西方石油企业的垄断，保护产油国的利益。"
 sau.2.a:0 "我们应当参与！"
 
 sau.3.t:0 "石油输出国组织的成立"
 sau.3.d:0 "[FROM.GetName]提议成立石油输出国组织，以对抗西方石油企业的垄断，保护产油国的利益。"
 sau.2.a:0 "第三世界的一次团结。"
 
 sau.4.t:0 "[FROM.GetName]宣布加入石油输出国组织"
 sau.4.d:0 "[FROM.GetName]宣布加入石油输出国组织，以对抗西方石油企业的垄断，保护产油国的利益。"
 
 sau.5.t:0 "石油输出国组织宣布降低石油出口！"
 sau.5.d:0 "以沙特阿拉伯为首的石油输出国组织宣布，为报复西方国家在中东战争中对以色列的支持，石油输出国组织将减少石油的生产和出口，专家预计这将导致油价迅速上涨，并引发能源危机和经济动荡！"
 
 sau.6.t:0 "阿拉伯联合酋长国成立！"
 sau.6.d:0 "经过谈判，位于波斯湾的阿布扎比、迪拜等前英国保护领正式宣布独立，并成立联邦性质阿拉伯联合酋长国。"
 
 sau.7.t:0 "来自阿布扎比的邀请"
 sau.7.d:0 "阿布扎比邀请我们加入新成立的阿拉伯联合酋长国，以期统一海湾地区的各个酋长国。"
 
 sau.8.t:0 "[FROM.GetName]宣布加入阿拉伯联合酋长国。"
 sau.8.d:0 "[FROM.GetName]宣布加入阿拉伯联合酋长国。"
 
 sau.9.t:0 "[FROM.GetName]拒绝加入阿拉伯联合酋长国。"
 sau.9.d:0 "谈判未能成功，[FROM.GetName]拒绝加入阿拉伯联合酋长国。"
 
 sau.12.t:0 "沙特国王阿卜杜勒-阿齐兹去世"
 sau.12.d:0 "沙特家族首领暨沙特阿拉伯首任国王阿卜杜勒-阿齐兹于塔伊夫皇宫睡梦中离世，结束他21年的统治。长子沙特·本·阿卜杜勒-阿齐兹·阿勒沙特即位。"