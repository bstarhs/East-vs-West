l_simp_chinese:
 rom.1.t:0 "罗马尼亚人民共和国成立"
 
 
 rom.2.t:0 "罗马尼亚人民共和国成立"
 rom.2.d:0 "罗马尼亚发生政治变动，在罗马尼亚共产党强迫之下，国王米哈伊一世被迫退位并流亡外国，共产党及其盟友夺取政权并成立新政府，使罗马尼亚成为社会主义国家。/n米哈伊尔一世流亡瑞士。"

 rom.3.t:0 "罗马尼亚人民党头目试图叛逃！"
 rom.3.d:0 "罗马尼亚人民党头目试图叛逃！"

 rom.4.t:0 "罗马尼亚人民党领导人被捕！"
 rom.4.d:0 "罗马尼亚人民党的伊柳·米尼亚等领导人被罗马尼亚当局逮捕，共产党控制下的罗马尼亚政府指责伊柳·曼纽勾结西方国家，试图出逃外国组件反共叛国团体。/n伊柳·曼纽等遭到起诉，可能会因叛国罪被监禁。"

 rom.5.t:0 "乔治·塔塔尔司库被边缘化"
 rom.5.d:0 "罗马尼亚政治家、二战前的罗马尼亚首相乔治·塔塔尔司库因被指责故意纵容罗马尼亚人民党的叛国罪行给遭到罗马尼亚共产党的压力，尽管塔塔尔司库已宣布接受共产党政府的执政，但依然可能面临人身安全威胁。塔塔尔司库被迫宣布自己引咎辞职，完全从政界引退。"
 
 
 
 
 
 rom.10.t:0 "来自苏南冲突的政治影响"
 rom.10.d:0 "随着苏联与南斯拉夫关系的不断恶化，两国之间的政治斗争不可避免地对我国产生了影响。当年内不同派系纷纷在这一问题上进行站队，以安娜·波克尔为首的亲苏派坚定的站在莫斯科一边，而以卢克雷奇·帕特拉什卡努为首的民族派则主张中立。"
 rom.10.a:0 "坚定支持斯大林同志，反对铁托主义！"
 rom.10.b:0 "反对莫斯科干涉我党的路线，保持中立。"
 
 rom.11.t:0 "罗马尼亚宣布清洗铁托分子"
 rom.11.d:0 "苏联与南斯拉夫的政治斗争蔓延到了罗马尼亚。罗马尼亚共产党宣布坚定支持斯大林同志在社会主义阵营中的领袖地位，批判铁托的亲西方行为，并连带清洗了卢克雷奇·帕特拉什卡努等在这一问题上态度不坚决的党员。"
 
 rom.12.t:0 "罗马尼亚宣布在苏南冲突中保持中立"
 rom.12.d:0 "苏联与南斯拉夫的政治斗争蔓延到了罗马尼亚。经过激烈的政治斗争，同情铁托一派的党员取得优势，在他们的压力下，亲苏的安娜·波克尔被迫做了自我批评，罗马尼亚共产党亦宣布在苏南问题中保持中立。"

 rom.15.d:0 "党内出现不安与反对"

 rom.16.d:0 "党代会发起对乔治乌-德治的弹劾！"
 
 rom.17.d:0 "乔治乌-德治被罗马尼亚共产党弹劾！"
 
 rom.18.d:0 "党内出现不安与反对"###贝利亚

 rom.19.d:0 "党代会发起对乔治乌-德治的弹劾！"
 
 rom.20.d:0 "毛雷尔接替乔治乌-德治"
 
 
 
 rom.30.t:0 "去斯大林化蔓延至罗马尼亚"
 rom.30.d:0 "赫鲁晓夫在秘密报告中抨击斯大林的内容，传播到了罗马尼亚，在罗马尼亚党政和民间引起不安。/n罗马尼亚的机关、学校内，不公开的辩论正在进行，人们争论罗马尼亚应该如何应对这种突如其来的变化。是跟随苏联政府的脚步，转为批判斯大林和政治改革，还是坚持斯大林主义？文化部门的Iosif Chișinevschi和Miron Constantinescu首先发起了对斯大林主义的批判，呼吁党中央对过去盲目跟随斯大林主义路线的行为进行自我批评。"
 
 rom.31.t:0 "乔治乌-德治的自我批评"
 rom.31.d:0 "赫鲁晓夫在秘密报告中抨击斯大林的内容，传播到了罗马尼亚，在罗马尼亚党政和民间引起不安。/n罗马尼亚共产党内掀起了支持赫鲁晓夫，批判斯大林主义的风潮，在改革派压力下，总书记格奥尔基·乔治乌-德治被迫做自我批评，顽固坚持斯大林主义的安娜·伯克尔和瓦西里·卢卡也被排挤出权力核心。"
 
 rom.32.t:0 "学生运动蔓延至罗马尼亚"
 rom.32.d:0 "在波兰爆发大规模反对共产党的政治运动后，罗马尼亚也出现了对当局不满的政治动荡。/n布加勒斯特大学首先爆发了大规模罢课运动，学生们聚集在大学广场上，宣布抵制俄语课。很快，蒂米什瓦拉、克拉奥华和克卢日也发生了学生罢课。/n但与波兰和匈牙利不同的是，罗马尼亚的学生运动似乎没有那么激进，矛头主要集中在反对经济制度和苏联对罗马尼亚的控制，暂未出现大规模反对共产党的政治目标。"
 
 rom.33.t:0 "学生与官员的冲突"
 rom.33.d:0 "罗马尼亚学生罢课运动愈演愈烈，党中央指示宣传部长Iosif Chișinevschi前往布加勒斯特大学安抚罢课学生。/nIosif一抵达大学门口，便被愤怒的学生包围和质问：/n为什么苏联和罗马尼亚作为友好国家，苏联不愿意归还比萨拉比亚？/n为什么罗马尼亚不能掌握自己的石油资源？/n为什么罗马尼亚在经互会体系中是输血方？"
 
 rom.34.d:0 "罗马尼亚共产党高层与学生会谈"
 
 rom.35.d:0 "大学广场上的共识"
 
 rom.36.d:0 "Iosif Chișinevschi的崛起"
 
 rom.37.t:0 "布加勒斯特宣布戒严"
 rom.37.d:0 "在罗马尼亚蔓延的学生运动引起了罗马尼亚党中央高层的高度警惕，尽管党内的改革派主张对话与缓和，但总书记乔治乌·德治最终选择了强硬态度。/n布加勒斯特在昨晚宣布了戒严，军警携带自动步枪，进驻了首都的各大学校，并封锁了大学广场。原本持对话态度的罢课学生被激怒，许多学生在广场上与军人对峙。蒂米什瓦拉、克拉奥华、克鲁日和雅西也进入了戒备状态。"
 
 rom.38.t:0 "罗马尼亚学生运动被镇压"
 rom.38.d:0 "布加勒斯特消息！/n在匈牙利爆发流血冲突后，罗马尼亚也爆发了罢课学生与当局的激烈冲突！罗马尼亚共产党下令，立刻逮捕带头挑起罢课的学生，并以反国家、反社会主义进行起诉。超过三百名学生领袖遭到逮捕，另有大量同情改革的共产党官员被停止职务。八十多名异见人士逃亡到了南斯拉夫。"
 
 
 rom.50.t:0 "卡罗尔二世在葡萄牙去世"
 rom.50.d:0 "罗马尼亚前国王卡罗尔二世在其流亡地葡萄牙布拉干萨的一所别墅中去世，终年59岁。这位一生充满戏剧性转折与争议的君主，最终在异国他乡走完了其复杂的人生旅程。/n卡罗尔二世的一生堪称一部政治与个人纠葛的传奇。早年，他因执意与平民情妇兰布里诺的关系而引发宪政危机，被迫放弃王位继承权并流亡海外。然而，他于1930年利用国内政治矛盾，在右翼势力支持下发动政变，戏剧性地重返布加勒斯特并加冕为国王。在位期间，他逐渐走向独裁，建立个人威权统治。二战初期，他在纳粹德国与西方盟国间摇摆，曾试图与希特勒合作以巩固权力，却在德国的压力下被迫将北特兰西瓦尼亚等领土割让给匈牙利，这一屈辱性决定使其在国内威信扫地。1940年，他最终被迫退位，将王位传予其子米哈伊一世，自己再度踏上了流亡之路。/n他的去世，为罗马尼亚一段动荡不安的君主制历史画上了句号，也引发了对其毁誉参半一生的重新审视。"
 
 
 
 
 
 

 rom.150.t:0 "蒂米什瓦拉事件"
 
 

 rom.151.t:0 "罗马尼亚革命爆发"
 
 

 rom.152.t:0 "齐奥塞斯库被枪毙"
 rom.152.d:0 "罗马尼亚爆发了一场革命！愤怒的抗议者冲进并占领了布加勒斯特的总统府，尼古拉·齐奥塞斯库被起义的军队推翻，共产党在罗马尼亚的统治结束了！政变部队逮捕了试图逃跑的齐奥塞斯库，并在一次简单的审判后处决了他们。共产党第二号人物伊恩·伊利埃斯库当选为临时政府首脑。"
 rom.22.a:0 "The most important day in Romanian history."
 
 