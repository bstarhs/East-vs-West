l_simp_chinese:
 ISR_NameChange:0 "地名希伯来化"
 ISR_Water:0 "建设国家供水系统"
 ISR_Aria:0 "建设国家供水系统"
 
 ISR_NewGovernment:0 "建立政府"
 ISR_NewGovernment_desc:0 "不需要哲学家的石头，也不需要飞船。创造一个更美好世界所需的一切都已经存在了。你知道吗，伙计，谁能做到呢？给我们指路？你们！你们犹太人！就因为你们太穷了。你们没有什么可失去的。你们可以为人类建造实验地。在那边，我们所在的地方，你们可以建立一个新的联邦。在那片古老的土地上，新旧土地！\n弗里德里希只是在梦中听到了金斯考特的话。他睡着了。而且，他梦想着穿越红海，迎接未来。\n——西奥多·赫茨尔《新故土》"
 ISR_LocalDiplomacy:0 "地区政策"
 ISR_Diplomacy:0 "外交政策"
 ISR_DefenceForce:0 "建立以色列国防军"
 ISR_DefenceForce_desc:0 "锡安主义是一个殖民事业，因此它的成败在于武装力量。重要的是去建设，重要的是说希伯来语，但不幸的是，更重要的是能够射击，否则就无法殖民。\n——泽维·贾鲍京斯基"
 
 ISR_AirForce:0 "建立空军"
 ISR_buy_plane:0 "购买战斗机"
 ISR_buy_plane_desc:0 "我们目前没有自行生产战斗机的能力，但我们可以向友好国家购买现成的战斗机来建立我们的空军。"
 ISR_buy_plane_tool:0 "允许向友好国家购买战斗机设备"
 ISR_jet_1:0 "发展一代喷气机"
 ISR_jet_1_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 ISR_jet_2:0 "发展二代喷气机"
 ISR_jet_2_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 ISR_bomber:0 "发展轰炸机"
 ISR_bomber_desc: "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 ISR_transfer:0 "发展运输机"
 ISR_transfer_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 ISR_anti_air:0 "发展防空设备"
 ISR_anti_air_desc:0 "我们的敌人同样拥有一支具有杀伤力的空中力量，我们需要发展防空设备，尤其是先进的对空导弹武器，以捍卫我们的领空，把敌机打成耐摔王。"
 ISR_air_equip:0 "发展空军装备"
 ISR_air_equip_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 ISR_airbase_1:0 "扩大空军基地 I"
 ISR_airbase_1_desc:0 "我们需要机场和基础设施来承载我们的空军。"
 ISR_airbase_2:0 "扩大空军基地 II"
 ISR_airbase_2_desc:0 "我国的空军力量不断壮大，对空军设施的要求也越来越高。"
 
 
 
 ISR_military_indus1:0 "军工业建设 I"
 ISR_military_indus1_desc:0 "从制造简单的军服、步枪、子弹和炸弹开始。"
 ISR_military_indus2:0 "军工业建设 II"
 ISR_military_indus2_desc:0 "二战后国际格局瞬息万变，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 ISR_military_indus3:0 "军工业建设 III"
 ISR_military_indus3_desc:0 "新时代的武器装备更复杂、多样化且昂贵，唯有进一步扩张我国的军工复合体，才能腾出足以敷用的产能奋起直追。"
 ISR_military_indus4:0 "军工业建设 IV"
 ISR_military_indus4_desc:0 "新时代的武器装备更复杂、多样化且昂贵，唯有进一步扩张我国的军工复合体，才能腾出足以敷用的产能奋起直追。"
 ISR_DefenseIndustry:0 "国防工业"
 ISR_ArmorIndustry:0 "建立装甲部队"
 ISR_ArmorIndustry_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 ISR_buy_weapons:0 "购买外国武器"
 ISR_buy_weapons_desc:0 "我国的军事工业目前还很落后，没有自己生产军火的能力，但我们可以向其他国家购买退役的武器。"
 ISR_mechanized:0 "发展机械化部队"
 ISR_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 ISR_airborn:0 "发展空降部队"
 ISR_airborn_desc:0 "飞机航程和载荷的发展开辟了许多可能性。运输机可以在敌人战线的大后方投下一整个师的部队，在那里他们可以造成严重破坏。"
 ISR_Gadna_service:0 "加德纳"
 ISR_Gadna_service_desc:0 "加德纳是以色列的一项军事项目，旨在培养年轻人为以色列国防军服役做好准备。"
 
 ISR_Navy:0 "建立海军"
 ISR_buy_ship:0 "购买水面舰艇"
 ISR_buy_ship_desc:0 "我们目前还没有建造舰船的能力，但我们可以向其他国家购买退役的舰艇。"
 ISR_buy_submarines:0 "购买潜艇"
 ISR_buy_submarines_desc:0 "我们目前还没有建造潜艇的能力，但我们可以向其他国家购买退役的潜艇。"
 ISR_light_ships:0 "发展轻型舰艇"
 ISR_light_ships_desc:0 "我们的海军刚刚起步，至少需要一些护卫舰和驱逐舰来保护我们的领海。"
 ISR_medium_ships:0 "发展中型舰艇"
 ISR_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 ISR_heavy_ships:0 "发展大型舰艇"
 ISR_heavy_ships_desc:0 "我们的海军已经成长壮大，我们需要发展可以搭载更多设备和飞机的大型舰艇来强化作战能力。"
 ISR_submarines:0 "发展潜艇"
 ISR_submarines_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 ISR_naval_base_1:0 "扩大海军基地 I"
 ISR_naval_base_1_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 ISR_naval_base_2:0 "扩大海军基地 II"
 ISR_naval_base_2_desc:0 "我国的海军力量不断壮大，对海军设施的要求也越来越高。"
 ISR_marines:0 "发展两栖部队"
 ISR_marines_desc:0 "擅长两栖作战的部队越来越不可或缺。临时拼凑的手段、装备已经成为历史，我方海军陆战兵现在已接受相关训练并拥有专属登陆舰船支持。"
 
 ISR_MOSSAD:0 "摩萨德"
 ISR_NaziHunt:0 "猎杀纳粹残余"
 ISR_NaziHunt_desc:0 "我们的情报部门发现了一批逃亡拉丁美洲的纳粹战犯，这些人曾对犹太民族犯下累累罪行，我们可以派出特工把他们抓回来，进行审判，以告诫后人我们民族的苦难。"
 ISR_Sayeret_Matkal:0 "总参谋部侦察大队"
 
 ISR_Zionism_focus:0 "统一的以色列"
 ISR_Zionism_focus_desc:0 "尽管以色列终于获得了独立，但由于联合国采用了不可接受的两国政策，导致以色列民族的首都和圣地——耶路撒冷的东半部分，仍处于阿拉伯人控制之下。以色列人不能接受只拥有半个以色列地和半个耶路撒冷。\n\n耶路撒冷啊，我若忘记你，情愿我的右手失去智慧。我若不记念你，我若不以耶路撒冷为我最大的喜乐，情愿我的舌头贴在上膛。\n——《诗篇》"
 ISR_Jerusalem:0 "夺取约旦河西岸"
 ISR_Jerusalem_desc:0 "以色列国经过重建，在经济和军事上都得到了很大的发展，现在，我们必须统一我们的国家，武力收复约旦河西岸，夺取我们被阿拉伯人占领的故土，并回到耶路撒冷的哭墙下。"
 ISR_Kibbutz:0 "基布兹"
 ISR_Kibbutz_desc:0 "基布兹是以色列的一种集体农庄，最早出现在英国统治巴勒斯坦时期，通过集体农庄集中有限的人力，对巴勒斯坦地区进行农业开发和建设，既可以改造这片贫瘠的土地，使其可以为未来的以色列容纳更多的人口，又可以加强以色列新移民的归属感和集体精神。"
 ISR_Economic:0 "经济政策"
 ISR_Economic_desc:0 "新生的以色列需要尽快建立起一个经济体系以维持国家运作。"
 
 ISR_Aliyah_immigrate:0 "阿利雅运动"
 ISR_Aliyah_immigrate_desc:0 "Aliyah，意为上升，也指代犹太人大流散以来，无数次犹太人对回到故土的尝试，而直到西奥多·赫茨尔正式将犹太复国主义作为一个政治运动推广开来，犹太人才得以大量有组织的回到巴勒斯坦。现在以色列国草创不久，人口不足以支持我国的发展和军事建设，我们应该帮助更多的流散在世界各国的同胞回到新以色列。\n\n犹太人只有一种拯救自己的方法——回到自己的民族并移居到自己的土地。\n——西奥多·赫茨尔"
 ISR_OperationMoses:0 "摩西行动"
 ISR_OperationMoses_desc:0 "埃塞俄比亚人自称是古代士巴王国的后裔，而埃塞俄比亚境内也确实有许多信仰犹太教的居民，我们将采取行动，将他们带回故土。\n我下來要救他們脫離埃及人的手，領他們出那地，到美好寬闊、流奶與蜜之地。\n——《出埃及記》"
 ISR_OperationCarpet:0 "毛毯行动"
 ISR_OperationCarpet_desc:0 "随着我国和阿拉伯国家关系恶化，我们需要尽快采取行动，将也门和伊拉克的犹太人接收回到以色列地。这次有了西方国家的协助，我们不需要再像过去的阿利亚运动那样，让移民们挤在拥挤的移民船中，飞机将更有效地协助移民归国，就如同《以赛亚书》所说：\n但那等候耶和华的，必从新得力。他们必如鹰展翅上腾，他们奔跑却不困倦，行走却不疲乏。"
 ISR_Immigration:0 "一百万计划"
 ISR_Immigration_desc:0 "纳粹在欧洲无止境地杀戮犹太人，无数同胞被迫远离故土，而以色列地，是他们最后的出路。一百万计划在1944年的巴勒斯坦托管委员会上通过，旨在将二战结束后所有从纳粹手中逃离魔爪的犹太人送往巴勒斯坦安置。"
 ISR_OperationMural:0 "壁画行动"
 ISR_OperationMural_desc:0 "五百多年前，西班牙队犹太人的迫害，导致许多犹太人流落北非，我们将采取行动，将他们带回故土。\n我下來要救他們脫離埃及人的手，領他們出那地，到美好寬闊、流奶與蜜之地。\n——《出埃及記》"
 ISR_NationalityLaw:0 "国籍法"
 ISR_NationalityLaw_desc:0 "海外犹太移民入籍以色列有许多复杂的法律问题，颁布《移民法》将授权以色列政府为他们解决相关的法律事务，同时，以色列政府将正式宣布所有流散海外的犹太人，法律上将拥有不可剥夺的、回归以色列的权利。"
 ISR_Cadima:0 "移民援助基金会"
 ISR_Cadima_desc:0 "支持犹太移民是一个需要耗费大量人力物力的工作，我们应该设立一个专门的基金会，收集国内外的捐款以支持海外同胞归来。"
 ISR_Ayarat:0 "发展镇"
 ISR_Ayarat_desc:0 "为了给新移民提供生活、住房和就业，以色列政府将规划建设发展镇，以安置移民，发展产业，同时为他们提供就业机会。"
 ISR_Ulpan:0 "乌尔潘"
 ISR_Ulpan_desc:0 "乌尔潘是一种以色列政府支持的希伯来语学校，他们为来到以色列的犹太移民提供希伯来语和犹太文化教学，以帮助他们更快融入以色列社会。"
 ISR_Natalism:0 "鼓励生育"
 ISR_Natalism_desc:0 "以色列的建立不能过度依赖外来的犹太移民，我们应该更进一步鼓励国民剩余，让更多的犹太人在这片土地上诞生，他们才是以色列的未来。"
 
 Pro_West:0 "亲西方"
 ISR_ContectEurope:0 "与欧洲建立联系"
 ISR_german_pay:0 "向德国索取赔偿"
 ISR_usa_techs:0 "美国技术援助"
 ISR_usa_techs_desc:0 "我们可以请求美国政府向我们派遣技术顾问，帮助我国科技发展和工业建设。"
 ISR_usa_intel:0 "美国情报援助"
 ISR_usa_intel_desc:0 "我们应当邀请美国情报部门来为我国提供情报援助。虽然这有让我国被美国渗透控制的风险，但利大于弊。"
 ISR_euro_techs:0 "欧洲技术援助"
 ISR_euro_techs_desc:0 "我们可以请求欧洲政府向我们派遣技术顾问，帮助我国科技发展和工业建设。"
 ISR_euro_intel:0 "欧洲情报援助"
 ISR_euro_intel_desc:0 "我们应当邀请欧洲情报部门来为我国提供情报援助。虽然这有让我国被欧洲渗透控制的风险，但利大于弊。"
 ISR_talking_group:0 "欧美游说团"
 
 ISR_ProSoviet:0 "亲近苏联"
 ISR_ussr_jews:0 "东欧犹太移民归国"
 ISR_sov_aid:0 "苏联经济援助"
 ISR_sov_aid_desc:0 "我们可以请求苏联政府为我们提供资金支持。"
 ISR_sov_arms:0 "苏联军事援助"
 ISR_sov_arms_desc:0 "我们可以请求苏联政府为我们提供军事援助，包括援助军事装备和军事顾问。"
 ISR_Socialism:0 "社会主义"
 ISR_Socialism_desc:0 "我们的国家和民族长期受到帝国主义、殖民主义和封建主义的压迫。在西方国家不断发展的同时，我们却远远落后于世界。现在苏联人民的胜利给了我们启示。只有建立社会主义，缩小贫富差距，保护劳动者利益，公有化买办财阀并推行土地改革，彻底改变经济工业格局，才能使我国摆脱贫困和落后。"
 ISR_de_jewism:0 "限制犹太教影响力"
 ISR_de_jewism_desc:0 "对我来说，上帝一词不过是人类弱点的表达和产物，《圣经》不过是一些光荣的传说。尽管它们仍然原始，却又相当幼稚，无论多么精妙的解读，都无法改变这一点……对我来说，犹太教如同所有其他宗教一样，都是最幼稚迷信的化身。而我欣然归属的犹太民族，以及我对其思想有着深厚共鸣的犹太民族，在我看来，与所有其他人并无二致……我看不出他们身上有什么被选中的地方。\n——阿尔伯特·爱因斯坦"
 
 ISR_people_republic:0 "以色列人民共和国"
 ISR_people_republic_desc:0 "落后的封建时代已经过去，我们人民将迎来更加先进、民主的社会制度。社会主义有利于生产力的发展，实现社会平等和民主进步。"
 ISR_plan:0 "五年计划"
 ISR_plan_desc:0 "我们将开始实行第一个五年计划，以快速改善我国的落后局面。"
 ISR_people_army:0 "以色列人民军"
 ISR_communisme_party:0 "以色列共产党合法化"
 ISR_join_comecon:0 "经济互助委员会"
 ISR_join_comecon_desc:0 "社会主义阵营的全球经济秩序建立在“产业互助”原则上。简而言之就是社会主义阵营以无偿或低偿援建、援助的形式投资盟国的工业发展，以此增加盟国的消费力和无产阶级人口并签订各种联盟条约。"
 ISR_pioneers:0 "少年先锋队"
 ISR_pioneers_desc:0 "少年先锋队是共产主义事业的接班人，培养少先队就是培养党和社会主义的未来。"
 ISR_worship:0 "党的权威"
 ISR_worship_desc:0 "我国当前政党众多，但大都代表着资本家、政治投机者甚至敌对分子的利益。我们要建设一个无产阶级所有、代表劳动人民的人民民主国家，共产党就必须领导一切。"
 ISR_nkvd:0 "内务委员会"
 ISR_nkvd_desc:0 "我们要建立专门的机构，调查、监视、逮捕反革命分子和帝国主义间谍。"
 ISR_expode_revolution:0 "输出革命"
 ISR_nationalized:0 "企业国有化"
 ISR_anti_muslim:0 "镇压宗教"
 ISR_anti_muslim_desc:0 "宗教是精神的鸦片，他们除了代表封建阶级压迫人民一无是处，只有镇压宗教，才能推动人民接受社会主义意识形态。"
 ISR_supress:0 "镇压反革命"
 ISR_supress_desc:0 "一些敌视社会主义[FROM.GetName]的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。"
 ISR_collective:0 "农业集体化"
 ISR_collective_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 ISR_socialist_kibbuz:0 "社会主义基布兹"
 ISR_socialist_kibbuz_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 ISR_soviet_mode:0 "苏联模式"
 ISR_soviet_mode_desc:0 "在斯大林模式的指导下，苏联人民不仅在短短十年内把俄罗斯变成了工业强国，而且还战胜了法西斯。我们要摆脱贫困，进入工业化和现代化，就必须学习苏联人民的先进经验。"
 
 ISR_China:0 "与中国建立联系"
 ISR_India_dip:0 "与印度建立联系"
 ISR_ladins_dip:0 "与拉美国家建立联系"
 ISR_braz_dip:0 "与巴西建立联系"
 ISR_argentine_dip:0 "与阿根廷建立联系"
