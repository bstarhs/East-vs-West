 ISR_anti_communist:0 "反共产主义"
 ISR_anti_communist_desc:0 "共产主义革命正在危害我们的社会秩序和国家利益，向大家宣布我们国家绝不容忍红色分子，一旦发现，就要投入大牢。"
 ISR_pro_roc:0 "接近中华民国"
 ISR_pro_saf:0 "接近南非"
 
 ISR_GrandeIsrael:0 "大以色列"
 ISR_GrandeIsrael_desc:0 "這樣，耶和華將他向列祖起誓所應許的全地賜給以色列人……耶和華應許以色列家的話，一句也沒有落空，都應驗了。\n——《约书亚记》"
 ISR_back_to_Jerusalem:0 "回到耶路撒冷"
 ISR_back_to_Jerusalem_desc:0 "再经历了两千年的流浪，我们终于回到了阔别已久的故乡……耶路撒冷已再次成为以色列国的首都，未来他也将是我们不可分割的领土！\n\n我们曾在巴比伦的河边坐下，一追想锡安就哭了\n因为在那里，掳掠我们的要我们唱歌，抢夺我们的要我们作乐，说：给我们唱一首锡安歌吧！\n耶路撒冷啊，你要颂赞耶和华！锡安哪，你要赞美你的神！\n——《圣咏集》"
 ISR_take_goland:0 "夺取戈兰高地"
 ISR_ControlAqaba:0 "控制亚喀巴湾"
 ISR_ControlJordan:0 "死海另一边"
 ISR_InfectLebanon:0 "介入黎巴嫩局势"
 ISR_Kataeb_Party:0 "支持黎巴嫩长枪党"
 ISR_lebanon_puppet:0 "建立黎巴嫩傀儡政府"
 ISR_InfectArabia:0 "支持阿拉伯反对派"
 ISR_ControlSinai:0 "夺取西奈半岛"
 ISR_invadeEgy:0 "入埃及记"
 ISR_support_jew_revolt:0 "支持阿拉伯地区的犹太暴动"
 ISR_support_kurds_revolt:0 "支持库尔德人暴动"
 ISR_support_coptic_revolt:0 "支持科普特暴动"
 ISR_support_christ_revolt:0 "支持阿拉伯地区的基督徒暴动"
 ISR_arab_spring:0 "阿拉伯之春"
 ISR_iran_revolt:0 "支持伊朗反对派"
 ISR_iran_revolt_desc:0 "波斯国王亚哈随鲁的犹太人妻子以斯贴，告发大臣哈曼试图谋杀她并灭绝波斯境内的犹太人，国王处死了哈曼，并按照以斯贴的指令，允许所有犹太人杀死所有可能威胁他们的人。随后，七万五千人被犹太人杀死。\n——《以斯贴记》"
 
 ISR_ContectIran:0 "接触伊朗"
 ISR_Iran_cooperate:0 "与伊朗的军事合作"
 ISR_Iran_oils:0 "进口伊朗石油"
 ISR_Iran_jews:0 "伊朗犹太人归国"
 ISR_Iran_jews_desc:0 "阿什舒尔，以及苏萨、阿加德、埃什努纳、扎班、梅图尔努、德尔，直至古提地区，这些位于底格里斯河彼岸的神圣中心，其圣殿早已荒废。我将那些曾居住在那里（巴比伦）的神像归还原处，并让它们居住在永恒的居所中。我聚集了那里所有的居民，并将他们的住所归还给他们。\n——《居鲁士圆柱》"
 
 ISR_PeaceTry:0 "与阿拉伯国家谈判"
 
 ISR_JewishSettlement:0 "巴勒斯坦定居点"
 ISR_MessileResearch:0 "发展导弹"
 ISR_ProThirdWorld:0 "亲第三世界"
 ISR_medic:0 "福利政策"
 ISR_Wall:0 "隔离墙"
 ISR_Wall_desc:0 "\n好篱笆带来好邻居。"
 ISR_Supression:0 "强硬镇压"
 ISR_Supression_desc:0 "把那个使女和她儿子（以实马利，亚伯拉罕之子，阿拉伯人祖先）赶出去，因为那个使女的儿子不可与我的儿子以撒一同承受产业。\n——《创世纪》"
 ISR_Geonocide:0 "种族灭绝"
 ISR_Geonocide_desc:0 "耶和华将以色列人领进迦南地的时候，外邦人必被驱逐，不可与他们立约，也不可怜他们。\n你们要这样待他们：毁坏他们的祭坛，打碎他们的石柱，砍下他们的偶像，用火焚烧他们雕刻的偶像。因为你归耶和华为圣洁的民；耶和华从地上的万民中拣选你，作自己的子民。\n现在你们若实在听从我的话，遵守我的约，就要从万民中作我特别的子民，因为全地都是我的。\n——《申命记》"
 ISR_Dahiya_doctrine:0 "达西亚主义"
 ISR_total_locked:0 "全面封锁"
 ISR_PermisionLand:0 "应许之地"
 ISR_PermisionLand_desc:0 "你吩咐以色列人说：你们到了迦南地，就是归你们为业的迦南四境之地，南角要从寻的旷野，贴著以东的边界；南界要从盐海东头起，绕到亚克拉滨坡的南边，接连到寻，直通到加低斯巴尼亚的南边，又通到哈萨亚达，接连到押们，从押们转到埃及小河，直通到海为止；西边要以大海为界，这就是你们的西界；北界要从大海起，画到何珥山，从何珥山划到哈马口，通到西达达，又通到西斐仑，直到哈萨以难。这要作你们的北界；你们要从哈萨以难划到示番为东界。这界要从示番下到亚延东边的利比拉，又要达到基尼烈湖的东边。这界要下到约但河，通到盐海为止。这四围的边界以内，要作你们的地。\n——《旧约圣经·民数记》"
 
 ISR_OsloTreaty:0 "奥斯陆协议"
 ISR_OsloTreaty_desc:0 "……但如果你愿意，这很可能只是我凭空想象出来的一个传说，而且永远如此。我本想写一个有意义的故事。有人会说，故事多于意义。\n想与行动并非像大多数人想象的那么遥远。所有人的行动都曾是梦想，而所有人的行动终有一天也会成为梦想。\n——西奥多·赫茨尔\n战争一眼望不到头，以色列已为此付出了巨大的代价，阿拉伯人是搬不走的邻居，我们的国家不可能永远和穆斯林陷入无止尽的仇杀。该尝试对话与谈判了，为了我们的下一代。"
 ISR_PalestineAutom:0 "巴勒斯坦自治"
 ISR_unlocked:0 "解除封锁"
 ISR_multiEthnics:0 "多民族国家"
 ISR_multiEthnics_desc:0 "在阿拉伯和以色列政治家的共同努力下，推动两个民族实现和解与和平的进程，尽管历经艰辛，但终于取得突破……阿拉伯人的公民权得到以色列承认，双方的矛盾和冲突在日渐减少，以色列的温和派政府正逐步尝试放弃单一犹太民族政策，以色列地将朝一个犹太人、阿拉伯人共存的多民族国家发展。\n我跟你说，我和我的朋友不会歧视任何人。我们不会问他是什么种族，什么宗教。他必须是人。这对我们来说才是最重要的。\n——西奥多·赫茨尔"
 ISR_islam_leagal:0 "伊斯兰教合法化"
 ISR_latinized_language:0 "语言拉丁化"
 ISR_PalestinePuppet:0 "诱导巴勒斯坦投降派"
 ISR_ArabsCivil:0 "阿拉伯人公民权"
 ISR_ArabsCivil_desc:0 "阿拉伯人公民权"
 ISR_endnd_zionizm:0 "结束锡安主义"
 ISR_endnd_zionizm_desc:0 "第一，以色列人不得强行进入（应许之地）。第二，圣者嘱咐以色列人不可背叛世界列国。第三，圣者嘱咐列国不要过度压迫以色列。\n——犹太教经书《塔木德》\n也许犹太复国主义一开始就是错误的，犹太人的初衷是拥有一个能够容纳犹太人生存的和平之地，而非具有排他性的犹太人单一国家。对单一民族国家的追求导致了无休止的战争，这也许就是耶和华对犹太复国主义的惩罚。因此，也许以色列必须做出改变，我们的选择是放弃犹太单一国家政策，使得以色列地成为一个包含犹太人、阿拉伯人在内的多民族国家。"
 ISR_DivideNation:0 "两国方案"
 ISR_LevanteFederate:0 "黎凡特联邦"
 ISR_PeresCenter:0 "佩雷斯和平中心"
 ISR_PeresCenter_desc:0 "佩雷斯和平中心由以色列外交官西蒙·佩雷斯提议成立，旨在促进中东国家之间的对话，以及政治、经济和文化的交流，以推动中东和平进程。\n实现和平的途径不是通过政府，而是通过人民。\n——西蒙·佩雷斯"
 
 ISR_education:0 "发展教育"
 ISR_HighEducate:0 "发展高等教育"
 ISR_secularist_educate:0 "教育世俗化"
 ISR_Hebrews:0 "推广希伯来语"
 ISR_Hebrews:0 "如果我们希望以色列这个名字不被消灭，那么我们就有责任创造一些东西，作为我们全体人民的中心，就像有机体的心脏一样，血液从那里流入国家身体的所有动脉，并使其充满生命。\n——艾利泽·本·耶胡达  现代希伯来语复兴之父"
 ISR_Halakha:0 "犹太律法"
 ISR_Halakha_desc:0 "你上山到我这里住在那里，我要将石版、律法和诫命赐给你，这些是我所写的，为要教训他们。\n——《出埃及記》"
 
 ISR_forein_invest:0 "吸引国际投资"
 ISR_JewishAid:0 "欧美犹太人援助"
 ISR_ProAmerica:0 "亲近美国"
 ISR_EuroCooperation:0 "欧洲援助"
 ISR_forein_debt:0 "发行债券"
 
 ISR_BanHaredit:0 "废除哈瑞迪特权"
 ISR_Haredit:0 "哈瑞迪特权"
 ISR_support_Likud:0 "成立利库德集团党"
 ISR_support_Lehi:0 "支持莱西组织"
 ISR_militarist_gov:0 "军人政府"
 ISR_militarist_gov_desc:0 "各种不同政治主张的党派在议会里为了各自的利益撕扯，但军队与他们不同，军队能够团结一致，同一目标，代表社会进步阶层，做事果断果敢，且真正为了国家而努力。"
 
 ISR_Farmland:0 "开发耕地"
 ISR_Citurs:0 "经济作物"
 
 ISR_Industry:0 "发展制造业 I"
 ISR_Industry_desc:0 "国际市场中较小的经济体所发展的基础轻工业通常包括食品加工、水泥、棉纺等直接与初级产业（农牧矿业）对接的行业。"
 ISR_Industry2:0 "发展制造业 II"
 ISR_Industry2_desc:0 "在基础轻工业的基础上，小经济体的政府机构通常还会进一步帮扶其国内民族资本家的产业扩张。或采用公私合营、保护产业的模式，或尝试与第一、第二世界的国际资本对接。"
 ISR_Industry3:0 "发展制造业 III"
 ISR_Industry3_desc:0 "在拥有了一定规模的基础民用工业后，新兴或复兴的经济体就可以进一步发展小商品生产基地和初级产品精加工行业。"
 ISR_refineries:0 "发展化学工业"
 ISR_refineries_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 ISR_Autos_focus:0 "发展汽车工业"
 ISR_steel_produc:0 "钢铁工业"
 ISR_steel_produc_desc:0 "以质量计算,铁是地球上最常见的元素,它加热后有很好的延展性…并且非常有用。铁始于公元前3500年左右,在埃及的盖尔扎赫被发掘出来铁对早期文明所需的各式东西都非常有用:如,蒸煮罐、小五金、工具,以及用来刺伤他人的尖锐武器。"
 ISR_port:0 "发展海港"
 ISR_infra:0 "基础设施建设"
 ISR_infra_desc:0 "完善的基础设施是沟通全国各地，发展经济并建立稳固政权的前提。"
 ISR_medical_manufacture:0 "发展制药产业"
 ISR_diamond_manufacture:0 "发展钻石产业"
 ISR_HightechIndustry:0 "发展精密机械制造"
 ISR_WeizmannInstitute:0 "魏茨曼科学研究学院"
 ISR_Electro:0 "发展电子技术"
 ISR_energy:0 "能源建设"
 ISR_energy_desc:0 "电力已经成为了工业时代最重要的能源，电流将点亮我们的国家，从民众家里的电灯，到工厂里的机床。"
 ISR_Solar_power:0 "太阳能发电"
 ISR_seawater:0 "海水淡化"
 ISR_Silicon_Wadi:0 "硅溪科技园区"
 
 ISR_NuclearPower:0 "发展核能"
 ISR_NuclearPower_desc:0 "核子裂变释放出来的能量摧毁了广岛和长崎，也将人类带入一个全新的时代。核技术有着巨大的运用价值，它可以制造毁灭性的可怕武器，也可以用来提供无尽的清洁能源，甚至运用到生物化学领域。\n原子能的释放改变了除人类思维方式以外的一切。\n——阿尔伯特·爱因斯坦"
 ISR_NuclearTest:0 "核计划"
 ISR_Nukes:0 "大卫王的投石器"
 ISR_Nukes_desc:0 "今日耶和华必将你交在我手里；我必杀你，取下你的头。我又要将非利士军兵的尸首给空中的飞鸟、地上的野兽吃。全地就必知道以色列中有神；聚集在这里的众人也必知道耶和华施行拯救，不是用刀用枪，因为争战的胜败于耶和华。祂必将你们交在我们手里。\n——《撒母耳记》"
 ISR_Begin_docrine:0 "贝京主义"
 ISR_operation_babylon:0 "巴比伦行动"
 ISR_strategic_weapon:0 "发展战略武器"
 ISR_strategic_weapon_desc:0 "我只想重申，以色列不会成为第一个向该地区引入核武器的国家。\n——西蒙·佩雷斯"
 ISR_samson_option:0 "参孙的选择"
 ISR_samson_option_desc:0 "以色列政府在拥有核武器后，提出以色列将在外交上执行参孙主义，即如果以色列遭到入侵，他们将向对方立即进行核报复，像《圣经》中的大力士参孙一样，打断房屋的柱子，将自己与腓力士人全部杀死。\n让我的灵魂与非利士人一同死去吧！"
 ISR_Operation_Damocles:0 "达摩克利斯行动"
 
 ISR_AscalonField:0 "Ascalon油气田"