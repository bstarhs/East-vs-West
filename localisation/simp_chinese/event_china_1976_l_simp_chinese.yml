 prc76.100.t:0 "钱学森就任甘宁人民政府主席"
 prc76.100.d:0 "甘肃宁夏人民政府召开会议，宋平同志宣布辞去政府主席职位，并由大会选举著名的中国航天科学家钱学森当选甘宁政府新任政府主席。钱学森作为一位科学家，原本不愿意干涉政治，但在全国战乱依然持续，甘宁地方政局同样不稳定的情况下，这里需要一位具有强大威望的人来稳定局势，而甘肃没有人比大科学家钱学森先生更有知名度了。钱学森接受了当地党政机关的邀请出任政府主席，另外大会还选举了年轻的水利厅长胡锦涛同志任副主席。"
 prc76.1.a:0 "知道了。"
 
 prc76.102.t:0 "钱学森宣布成立临时政府"
 prc76.102.d:0 "随着甘宁人民解放军如排山倒海般控制全国各大城市，北京、上海、武汉、广州等地先后被收复，毛泽东死后席卷中国的第三次内战终于宣布结束，钱学森领导下的甘宁人民政府取得了最后的胜利。钱学森回到北京，与各地的党代表们召开会议后，宣布重组中国共产党，重建中央人民政府，钱出任临时政府主席。中国的再次统一仅是初步胜利，钱学森和他的政府还有很多事情要做。"
 
 prc76.104.t:0 "李洪志接任东北人民政府主席"
 prc76.104.d:0 "东北人民政府召开党代会，来自沈阳市的革委会主任李洪志被选举为新一任的东北人民政府主席。李洪志原本是沈阳市粮油公司的工人，后一步步高升进入政界。李洪志的上台引发了沈阳市民的不安，因为坊间流传着他鼓吹修炼气功，创造新式修炼大法并利用自己的权力进行推广的传言。"