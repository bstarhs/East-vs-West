 common_sov_aid:0 "苏联经济援助"
 common_sov_aid_desc:0 "我们可以请求苏联政府为我们提供资金支持。"
 common_sov_techs:0 "苏联技术援助"
 common_sov_techs_desc:0 "我们可以请求苏联政府向我们派遣技术顾问，帮助我国科技发展和工业建设。"
 common_sov_arms:0 "苏联军事援助"
 common_sov_arms_desc:0 "我们可以请求苏联政府为我们提供军事援助，包括援助军事装备和军事顾问。"
 common_sov_mir:0 "参与和平号工程"
 
 
 common_support_comparty:0 "宣传共产党"
 common_support_comparty_desc:0 "为了支持[FROM.GetName]共产党，扩大党的影响力和支持度，我们需要进行更多的政治活动，包括宣传、推广、建立基层党组织和竞选等。"
 common_comparty_strike:0 "打击反对党"
 common_comparty_strike_desc:0 "许多五花八门的政敌在阻挠共产党影响力的扩大，我们需要进行更多的宣传工作，把这些敌视社会主义运动的反动派打成小丑。"
 
 common_export_revolution:0 "输出革命"
 common_export_revolution_desc:0 "世界革命风起云涌，作为社会主义阵营的一部分，我们应当积极支持世界社会主义民族解放运动！"
 common_latin_revolution:0 "支持拉美革命"
 common_latin_revolution_desc:0 "拉美人民数百年来一直处于美帝国主义、地主资本以及考迪罗军阀的统治之下，现在拉美人民已经掀起了反对帝国主义和考迪罗的统治，我们应当支持他们！"
 common_asia_revolution:0 "支持亚洲革命"
 common_asia_revolution_desc:0 "从日本到印度洋，亚洲人民已经掀起了反对帝国主义列强及其傀儡政府的革命运动，我们应当支持他们！"
 common_europe_revolution:0 "支持欧洲革命"
 common_europe_revolution_desc:0 "欧洲西部正处于亲美的北约集团控制之下，但欧洲各国的进步左翼团体正在反对帝国主义，我们应当支持他们！"
 common_africa_revolution:0 "支持非洲革命"
 common_africa_revolution_desc:0 "非洲人民已经被帝国主义者殖民统治了一百多年，现在是时候支持非洲民族解放运动争取自由了！"
 common_arabs_revolution:0 "支持中东革命"
 common_arabs_revolution_desc:0 "中东人民已经被帝国主义者殖民统治了一百多年，现在是时候支持中东民族解放运动争取自由了！"
 
 common_maoism:0 "毛主义"
 common_maoism_desc:0 "来自中国共产党领袖毛泽东的政策为我们提供了宝贵的经验和理想的学习对象。中国政府所实行的文化革命、工人自治、群众路线和第三世界理论将成为我们走向共产主义的指路明灯。"
 common_culture_revolution:0 "文化大革命"
 common_culture_revolution_desc:0 "毛泽东认为，革命不止需要政治、经济、社会的革命，同时需要文化的革命，将旧时代的宗教和文化影响从我们的思维方式中去除，才能彻底将反革命的元素从我们的社会当中去除，并创造一个革命的、进步的社会。"
 common_people_communie:0 "人民公社"
 common_people_communie_desc:0 "人民公社是中国在60年代建立的农村基层组织，公社的所有农田和生产工具都为集体所有，村民们生产的产品都将平均分配。"
 common_workers_communie:0 "工人委员会"
 common_workers_communie_desc:0 "文化的革命时期的中国，所有企业都成立了工人委员会，工人们以民主形式直接参与工厂的管理和决策，委员会的成员由选举产生，他们不仅参与管理，并且也要参与工作。"
 
 common_people_army:0 "人民军队"
 common_people_army_desc:0 "根据列宁的理论，共产党将在社会主义国家中领导一切，自然也包括军队。一支党领导下的军队是不可缺少的，只有军队成为社会主义的一部分，才能保护社会主义革命和社会主义国家。"
 common_commuist_nationalized:0 "企业国有化"
 common_commuist_nationalized_desc:0 "在从资本主义社会过渡到共产主义社会之前，党和国家将以国有企业的形式管理我国的重要生产资料。"
 common_strike_religion:0 "打击宗教"
 common_strike_religion_desc:0 "宗教是精神的鸦片，他们除了代表封建阶级压迫人民一无是处，只有镇压宗教，才能推动人民接受社会主义意识形态。"
 
 common_usa_techs:0 "美国技术援助"
 common_usa_techs_desc:0 "我们可以请求美国政府向我们派遣技术顾问，帮助我国科技发展和工业建设。"
 common_usa_intel:0 "美国情报援助"
 common_usa_intel_desc:0 "我们应当邀请美国情报部门来为我国提供情报援助。虽然这有让我国被美国渗透控制的风险，但利大于弊。"
 common_garrison:0 "美国军事援助"
 common_garrison_desc:0 "我们可以请求美国政府为我们提供军事援助，包括援助军事装备和军事顾问。"
 USA_militar_advisor_focus:0 "完成美国军事援助国策，允许向美国请求军事援助"
 
 common_militarist_economic:0 "军事经济"
 common_militarist_economic_desc:0 "扩大我们的军事力量，需要经济层面的全力支持。我们应当让我们的经济体制抛弃掉没用的奢侈品生产，将重心投入到军工当中。"
 common_expanded_soldiers:0 "扩大征兵"
 common_expanded_soldiers_desc:0 "现在是国家军力扩大的关键时期，我们要求每个成年男子都为国家献出力量。"
 common_hateful:0 "排外主义"
 common_hateful_desc:0 "外国的文化、外国的商品、外国的意识形态、外国的人……都没有我们本国的好。把他们扔出去，让我们伟大国家的国民支持本国的一切。"
 common_all_soldiers:0 "全民皆兵"
 common_all_soldiers_desc:0 "战争一触即发，我们要求全国所有同胞，无论男女老少甚至老弱病残，都必须拿起武器准备战斗！"
 common_super_race:0 "优越的种族"
 common_super_race_desc:0 "我们是世界上最优秀的民族，我们拥有战无不胜的力量和伟大光荣的历史，我们比他人优秀，自然也就高于他们，并拥有征服弱者的权力。"
 common_majority:0 "单一民族国家"
 common_united_ethnics:0 "同化少数民族"
 common_united_ethnics_desc:0 "非我族类其心必以，作为一个单一民族国家，所谓的少数民族与主体民族的文化、语言、信仰和生活方式如果不尽相同，就会成为叛乱的隐患，我们必须强制我国的所有公民都使用统一的语言文字和宗教信仰，才能团结国家。"
 common_geonicide:0 "纯净的民族国家"
 common_geonicide_desc:0 "我们伟大且优越的种族，不允许劣等种族来玷污。把劣等种族的贱民找出来，然后处理掉。"
 
 common_monarch_party:0 "拥立君主的党派"
 common_monarch_party_desc:0 "尽管我国现在已建立议会制的君主立宪制度，但陛下可以通过成立一个党派，作为我们在议会中的代理人，以继续行使我们的政治权利。"
 common_monarch_worship:0 "君主崇拜"
 common_monarch_worship_desc:0 "伟大的领导我们的民族走过数百年风雨，他们就是我们国家和民族的象征和唯一的君主，陛下的荣耀就是我们民族的荣耀，忠于陛下是我们公民最高的荣誉。"
 common_king_state:0 "朕即国家"
 common_king_state_desc:0 "作为国家团结的象征和最高的政治元首，陛下的意志就是国家的意志，国家的一切都必须团结在陛下周围，按着陛下的指引前进。"
 common_king_law:0 "冒犯君主法"
 common_king_law_desc:0 "以下犯上，当杀无赦。"
 
 common_buy_plane:0 "购买战斗机"
 common_buy_plane_desc:0 "我们目前没有自行生产战斗机的能力，但我们可以向友好国家购买现成的战斗机来建立我们的空军。"
 common_buy_plane_tool:0 "允许向友好国家购买战斗机设备"
 common_jet_1:0 "发展一代喷气机"
 common_jet_1_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 common_jet_2:0 "发展二代喷气机"
 common_jet_2_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 common_bomber:0 "发展轰炸机"
 common_bomber_desc: "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 common_transfer:0 "发展运输机"
 common_transfer_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 common_anti_air:0 "发展防空设备"
 common_anti_air_desc:0 "我们的敌人同样拥有一支具有杀伤力的空中力量，我们需要发展防空设备，尤其是先进的对空导弹武器，以捍卫我们的领空，把敌机打成耐摔王。"
 common_air_equip:0 "发展空军装备"
 common_air_equip_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 common_airbase_1:0 "扩大空军基地 I"
 common_airbase_1_desc:0 "我们需要机场和基础设施来承载我们的空军。"
 common_airbase_2:0 "扩大空军基地 II"
 common_airbase_2_desc:0 "我国的空军力量不断壮大，对空军设施的要求也越来越高。"
 
 common_light_ships:0 "发展轻型舰艇"
 common_light_ships_desc:0 "我们的海军刚刚起步，至少需要一些护卫舰和驱逐舰来保护我们的领海。"
 common_medium_ships:0 "发展中型舰艇"
 common_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 common_heavy_ships:0 "发展大型舰艇"
 common_heavy_ships_desc:0 "我们的海军已经成长壮大，我们需要发展可以搭载更多设备和飞机的大型舰艇来强化作战能力。"
 common_buy_ship:0 "购买水面舰艇"
 common_buy_ship_desc:0 "我们目前还没有建造舰船的能力，但我们可以向其他国家购买退役的舰艇。"
 common_buy_submarines:0 "购买潜艇"
 common_buy_submarines_desc:0 "我们目前还没有建造潜艇的能力，但我们可以向其他国家购买退役的潜艇。"
 common_submarines:0 "发展潜艇"
 common_submarines_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 common_naval_base_1:0 "扩大海军基地 I"
 common_naval_base_1_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 common_naval_base_2:0 "扩大海军基地 II"
 common_naval_base_2_desc:0 "我国的海军力量不断壮大，对海军设施的要求也越来越高。"
 common_marines:0 "发展两栖部队"
 common_marines_desc:0 "擅长两栖作战的部队越来越不可或缺。临时拼凑的手段、装备已经成为历史，我方海军陆战兵现在已接受相关训练并拥有专属登陆舰船支持。"
 
 common_buy_weapons:0 "购买外国武器"
 common_buy_weapons_desc:0 "我国的军事工业目前还很落后，没有自己生产军火的能力，但我们可以向其他国家购买退役的武器。"
 common_armors:0 "发展装甲部队"
 common_armors_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 common_mechanized:0 "发展机械化部队"
 common_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 common_airborn:0 "发展空降部队"
 common_airborn_desc:0 "飞机航程和载荷的发展开辟了许多可能性。运输机可以在敌人战线的大后方投下一整个师的部队，在那里他们可以造成严重破坏。"
 common_military_system:0 "完善军事体制"
 common_military_system_desc:0 "通过设立完善的军事体制、军官制度、指挥系统和军事学院，我们才能把落后的民兵组织建设成为一支有战斗力的职业军队。"
 common_develop_weapons:0 "成立装备发展部"
 common_develop_weapons_desc:0 "从步兵的头盔和背心，再到坦克上的火控系统和动力系统，先进的作战装备往往主导着战场。"
 
 common_Semiconductor:0 "发展半导体"
 common_Semiconductor_desc:0 "半导体是一种可以使得电流朝单方向流动的材料，利用半导体，我们可以将庞大的二极管体积缩小到纳米级别，以制造集成电路，这将是二十世纪最伟大的技术之一。"
 common_massage_tech:0 "发展信息技术"
 common_massage_tech_desc:0 "互联网将计算机连接在一起，使得他们之间可以快速传播和共享信息，如果这项技术进入民用领域，全国乃至全世界的计算机用户都将通过互联网获取知识和信息，这是一项伟大的创造。"
 common_tourism:0 "发展旅游业"
 common_tourism_tool:0 "§Y+25%§W旅游业绩"
 common_tourism_desc:0 "壮丽的风景和避暑胜地将吸引外国游客前来消费，并创造工作岗位。"
 common_nuclear:0 "发展核能"
 common_nuclear_desc:0 "核子裂变释放出来的能量摧毁了广岛和长崎，也将人类带入一个全新的时代。核技术有着巨大的运用价值，它可以制造毁灭性的可怕武器，也可以用来提供无尽的清洁能源，甚至运用到生物化学领域。\n原子能的释放改变了除人类思维方式以外的一切。\n——阿尔伯特·爱因斯坦"
 common_nuclear_power:0 "发展核电"
 common_nuclear_power_desc:0 "核聚变释放出来的能量如果用于发电，不仅能够提供远高于化石能源的电力，并且成本低、低污染。"
 common_railway_1:0 "发展铁路 I"
 common_railway_1_desc:0 "通过铁路来将全国各地与首都连接起来，以发展经济，强化中央集权。"
 common_railway_2:0 "发展铁路 II"
 common_railway_2_desc:0 "电气化的铁道、现代化的车辆设备和先进的管制系统将大大改善铁路运输效率。"
 common_high_railway:0 "发展高速铁路"
 common_high_railway_desc:0 "高速铁道的发展大大改善了交通运输的发展，我们需要尽快掌握这项技术。"
 common_mineral:0 "发展矿业"
 common_mineral_desc:0 "我国拥有丰富的矿产资源，铁、铜、铝、煤都是现代工业不可缺少的基础，我们应该发展矿业规模和技术，勘探新的矿床，引进先进设备，以扩大矿产资源产出，不仅可以供应本国工业消耗，还可以出口外国。"
 common_power:0 "发展电力设施"
 common_power_desc:0 "电力已经成为了工业时代最重要的能源，电流将点亮我们的国家，从民众家里的电灯，到工厂里的机床。"
 
 common_conservatism:0 "支持保守主义"
 common_conservatism_desc:0 "二战后的世界充斥着各种意识形态，共产主义、社会主义、民主主义、无政府主义……但这些新颖的政治主张真的符合我们的国家吗？也许我们应该回到过去的历史中，寻找正确的答案。如果旧日的思想确实给我们带来了稳定和秩序，那么就沿着旧有的道路前进。"
 common_army_gov:0 "支持军方势力"
 common_army_gov_desc:0 "各种不同政治主张的党派在议会里为了各自的利益撕扯，但军队与他们不同，军队能够团结一致，同一目标，代表社会进步阶层，做事果断果敢，且真正为了国家而努力。"
 common_church:0 "接近教会"
 common_church_desc:0 "激进的社会改革只会给共产主义颠覆分子和自称民主的反政府势力制造机会，我们需要的是一个保守而稳定的社会。我们应当争取基督教会的合作与支持，将人民重新带回到圣经的指引和上帝的福音之中，只有谨遵耶稣和圣徒的教诲，我们的国家才能成为幸福与和平的伊甸园。"
 common_catholic:0 "支持天主教"
 common_catholic_desc:0 "我国的人民自古以来就是天主忠实的仆人，耶稣向圣彼得的继承者授予天空、大帝与海洋，并领导我们与天父同在，是我们民族忠于上帝的证明和我们要向子孙后代传播的价值。"
 common_lutherism:0 "支持新教"
 common_lutherism_desc:0 "马丁·路德和加尔文的宗教改革，结束了欧洲处于天主教宗统治下的历史。我们既要尊崇圣经，又要保护自己的民族价值和文化，"
 common_traditional:0 "基督价值观"
 common_traditional_desc:0 "我们要把基督耶稣和上帝的信条深深地刻入我们的社会文化，每一个公民都应当虔诚地根据基督的旨意行事。"
 common_dios_patria_familia:0 "上帝 祖国 家庭"
 common_crusaders:0 "十字军之王"
 common_crusaders_desc:0 "为基督而死是无上的光荣！我们都愿意为了上帝而战，而死！任何不信仰基督的都是我们的死敌，我们会和他们血战到底！"
 common_judge:0 "宗教裁判所"
 common_judge_desc:0 "熊熊烈火在狂热教徒的眼前焚烧，将异教徒和所有的理性化为灰烬。"
 
 
 common_islamic:0 "支持伊斯兰党"
 common_islamic_desc:0 "许多伊斯兰学者关心政治，对伊朗局势发表自己的意见，我们可以邀请他们进入政府，以古兰经的观点为我们的政策指引方向。"
 common_ulima:0 "乌里马会议"
 common_ulima_desc:0 "乌里马是指通晓伊斯兰教知识、理论和沙里亚法学的学者，由乌里马组成的最高会议将成为一个伊斯兰国家的最高统治机关。"
 common_element_non_islam:0 "清楚异教徒"
 common_element_non_islam_desc:0 "熊熊烈火在狂热教徒的眼前焚烧，将异教徒和所有的理性化为灰烬。"
 
 common_social_democratic:0 "社会民主主义"
 common_social_democratic_desc:0 "社会民主主义要求政府关注每一个公民的利益，尤其是贫困阶层和弱势群体的利益，而非富有阶层的利益。促进社会平等以调和社会矛盾是社会民主主义的优先政策。"
 common_expanded_voet:0 "扩大投票权"
 common_expanded_voet_desc:0 "给予妇女选举权是实现平等，推动社会现代化的重要里程碑，当妇女掌握选票时，也就掌握了自己的命运。"
 common_weman_right:0 "妇女权利"
 common_weman_right_desc:0 "数千年以来，封建陋习给我们广大妇女同胞带来了沉重的苦难，解放妇女，不仅是社会主义国家实现民主和平等的要求，而且是解放生产力，鼓励妇女参与工作的重要一步。"
 common_expanded_education:0 "扩大教育权"
 common_minority:0 "关注少数民族"
 common_minority_desc:0 "我国存在许多少数民族，我们应当推行一些政策以促进他们与主体民族的团结与和谐。"
 common_accept_immigrate:0 "接纳移民"
 common_accept_immigrate_desc:0 "随着国家的经济法不断发展，不断繁荣的社会也开始导致我们的国家开始老龄化，高度的福利制度也使得劳动力成本越来越高，为了解决这个问题，引进劳动力不失为一个合理的方案。那些从第三世界国家来的移民可以接受更低的福利和薪水。"
 common_LGBT:0 "LGBT议题"
 common_LGBT_desc:0 "随着嬉皮士运动带来性解放和完全颠覆宗教的性观念，曾被认为是怪胎的变性者和同性恋群体，也开始自称为性少数群体，要求得到政治权利。在选票面前，一些标榜进步主义的政党无论愿不愿意，也不得不与他们进行接触。"
 common_accept_abour:0 "接纳工会"
 common_accept_abour_desc:0 "工业化带来了工人群体的扩大，工人正成为一支强大的政治力量，要求更高的薪资、完善的福利制度和八小时工作制。与其让失望的工人投向共产党，不如主动满足其需求以争取工人的选票。"
 common_labour_right:0 "保护劳动者权益"
 common_progressive:0 "环保议题"
 common_progressive_desc:0 "《寂静的春天》让环境破坏和保护成为了政治议题，当被污染的水源、河流、海洋，死亡并消失的物种、开发殆尽的森林和被二氧化硫侵蚀的天空成为报纸和电视新闻上的热议话题时，公众对环保政策和污染控制的关注便不断提高。有的政府积极支持环保议题，希望以此争取进步主义者的支持。"
 
 common_neo_liberalism:0 "新自由主义"
 common_neo_liberalism_desc:0 "新自由主义者主张减少政府的行政干预，让市场自由运行从而刺激经济增长。政府的腐败、政治混乱和官僚主义使得他们无法有效管理经济，因此让市场无形的大手来促进经济系统自我调节才是最好的办法。政府干预越少，经济运行越好。"
 common_currency_reform:0 "货币改革"
 common_currency_reform_desc:0 "新自由主义反对政府直接使用政令来管控经济，控制货币的发行量，用必要的通胀或通缩来对市场进行宏观的影响是一种不错的选择。"
 common_reduce_tax:0 "税收改革"
 common_reduce_tax_desc:0 "政府向企业收取高额的税收，以此来补贴福利政策，使得企业失去了发展的活力和市场竞争力，应当调整税收，为有发展能力的企业提供减税降税，以鼓励他们扩大生产。"
 consumer_lack_for_add_tool:0 "当消费品的产量小于需求的80%时，额外增加12%的产量和工业研究速度。"
 common_companies_personalized:0 "企业私有化"
 common_companies_personalized_desc:0 "我国国有企业在经济体制改革之后开始失去活力，无法应对日益激烈的市场竞争。为了使国企能够应对市场经济带来的冲击，我们将实行国企改革，使企业自主，自负盈亏。"
 common_close_factories:0 "关闭亏损国企"
 common_reduce_welfare:0 "削减福利"
 common_reduce_welfare_desc:0 "退休金和失业补贴把我们国家的年轻人变成一群懒鬼，许多人宁愿躺在家里拿救济金也不愿意出门找工作，严重拖累了正常的社会生产，必须把失业补助等各种无意义的救助金停掉。"
 common_reduce_cost:0 "削减行政支出"
 common_reduce_cost_desc:0 "政府正用人民的税收供养着一个庞大而臃肿的行政机构，大量的资金被办公室里尸位素餐的公务员浪费，我们必须大刀阔斧地裁减政府机构，解散无所事事的挂牌部门并解雇不称职的公务员，把省出来的资金用到该用的地方。"
 half_financial_to_power:0 "将所有财政转移到行政支出的数值减半"
 clear_financial_to_power:0 "不再允许将财政收入转移为政治点数，直到新自由主义政策被取消"
 common_develop_finacial:0 "发展金融业"
 common_develop_finacial_desc:0 "制造业已经不再适合我国的发展需求，高投入低汇报的低端制造业将流入第三世界国家，而发达国家将拥抱第三产业。金融、证券、信贷、期货、保险、股市和服务业将以更低的投入提供更高的税收。"
 common_reduce_manage:0 "减少政府管理"
 common_reduce_manage_desc:0 "政府应该放松监管，把自由贸易作为市场经济的长期政策，以促进经济增长，形成有效的竞争机制。"
 common_market:0 "扩大市场的大手"
 common_market_desc:0 "既然市场能够比行政机构更好地运营经济，那我们就应该将经济完全交给市场和市场参与者自由运营，一个完全没有行政干涉的经济体制无疑是最健康，最完美的。"
 common_strike_union:0 "打击工会"
 common_strike_union_desc:0 "受共产主义影响的工会分子鼓吹盲目的高薪、低工时和各种乱七八糟的福利制度，反对我们实行的各项经济刺激，拖累经济转型政策的推动，如果他们不愿意为国家的经济发展做出一些经济上的牺牲，那就让他们做出肉体上的牺牲。"
 
 common_Keynesianism:0 "凯恩斯主义"
 common_Keynesianism_desc:0 "凯恩斯主义是二战后英国经济学家凯恩斯提出的经济政策，其主要特点为政府行政干预、国有化、福利制度和通过公共支出刺激需求，从而减少贫富差距，促进社会平等和稳定。在二战后经济萧条、失业严重和社会平等思潮发展的背景下，凯恩斯主义为许多国家所采用。"
 common_companies_nationalized:0 "企业国有化"
 common_companies_nationalized_desc:0 "私有企业总是为自己的利益服务，并在无序的自由市场中疯狂膨胀，挤压中小企业，甚至被外国资本收买。我们应该将大企业国有化，将他们和他们的产业纳入政府的控制之下，从而确保企业本身和他们的产业能够服从政府指令，为我们的经济政策服务。"
 common_support_labour:0 "支持工会"
 common_support_labour_desc:0 "工业化带来了工人群体的扩大，工人正成为一支强大的政治力量，要求更高的薪资、完善的福利制度和八小时工作制。与其让失望的工人投向共产党，不如主动满足其需求以争取工人的选票。"
 common_expand_welfare:0 "扩大福利"
 common_expand_welfare_desc:0 "政府存在的意义就是为人民提供衣食无忧的生活，将福利制度从摇篮推行到坟墓，一个能让公民从出生到死亡都没有经济困难的国家是完美的现代国家，也能为政府提供绝对优势的支持。"
 common_welfare_state:0 "福利国家"
 common_welfare_statee_desc:0 "福利国家正成为战后多国的共识，利用凯恩斯主义经济学说，提供福利保障，以刺激消费，促进社会平等，拉拢劳工阶层。"
 common_unemploy_help:0 "失业救济"
 common_unemploy_help_desc:0 "经济转型淘汰了许多产业，大量的失业者如果生活得不到保障，就会尝试犯罪。政府有义务为他们提供救助，使他们的生活得到基本的保障而非铤而走险。"
 common_high_tax:0 "税收改革"
 common_high_tax_desc:0 "税收是政府管理经济，促进社会平等的重要手段，我们将向高收入的企业和个人征收更高的税收，并将其用于福利制度。"
 common_govern_economic:0 "统制经济"
 common_govern_economic_desc:0 "将产业国有化后，政府将成立专门的部门，由专业的行政官僚管理各行各业的生产工作，将经济体系牢牢控制在政府手中。"
 common_medic_system:0 "医疗保障体系"
 common_medic_system_desc:0 "公共医疗产业的发展是影响一国人口结构和劳工质量的重要因素。如何能维护国民健康，也自古以来是一个政权成功与否的重要指标。"
 
 Focus_Goverment_reform:0 "政府改革"
 Focus_Goverment_reform_desc:0 "可怕的世界大战结束了，人类有了喘息的机会，但战争还没有完全扑灭。两大阵营之间的对抗已经形成。为了使我们的国家在新的国际环境中生存，我们必须使我们的政府和人民做好准备。"
 common_1:0 "保守路线"
 common_1_desc:0 "一种新的思潮正在战后的废墟中蔓延，主张建立一个没有阶级、贫富差距、公有财产和人人平等的世界。然而，我国政府对这种乌托邦理论持怀疑态度，发生在俄国的悲剧证明，这只是独裁者发号施令的借口。我们应当坚持我们原有，警惕红色分子的渗透。"
 common_3:0 "民主化"
 common_3_desc:0 "自由世界在世界大战中的胜利证明了独裁者压迫人民的制度已被人类所抛弃。建立民选的、以人为本的、以人为本的政府，保障人民的自由、民主和监督，保障人民选择政府的权利不受侵犯，是未来世界的主流。"
 common_2:0 "社会主义"
 common_2_desc:0 "我们的国家和民族长期受到帝国主义、殖民主义和封建主义的压迫。在西方国家不断发展的同时，我们却远远落后于世界。现在苏联人民的胜利给了我们启示。只有建立社会主义，缩小贫富差距，保护劳动者利益，公有化买办财阀并推行土地改革，彻底改变经济工业格局，才能使我国摆脱贫困和落后。"
 common_4:0 "军事统治"
 common_4_desc:0 "所谓政党民主，无非是愚蠢贪婪的政客在议会里结成派系，为自己的利益斗争，使我们的政府腐败无能。而红色分子正试图获得工农的支持，威胁我国的安全。现在唯一的出路就是推翻腐败的政治，建立强大的军事政权，让唯一能够保护国家利益的军队掌控国家。"
 common_port:0 "发展海港"
 commons_5:0 "亲近美国"
 commons_5_desc:0 "美国政府致力于对抗世界上的共产主义颠覆运动，他们将成为我们的重要盟友。"
 common_6:0 "保持中立"
 common_6_desc:0 "在世界面临核战争威胁的背景下，与莫斯科和华盛顿的任何密切接触都是危险的。我们的政策应该是在双方之间寻求平衡，宣布我们与任何军事集团都不亲近。"
 common_7:0 "自由主义"
 common_7_desc:0 "每个人都有权决定自己的一切，包括政治观点、经济事务和早餐的苹果派。自由是人类进步的标志，限制和干涉只会阻碍国家和社会的发展。"
 common_8:0 "政治多元化"
 common_8_desc:0 "要通过宪法保障我国的民主制度，必须由人民选举、监督和弹劾我国政府。"
 common_9:0 "压制危险分子"
 common_9_desc:0 "共产党人、无政府主义者和无知的学生正在煽动政治混乱，企图在我国推动革命和颠覆运动。我们的警察机构将被派去监视、警告和逮捕这些嫌疑犯。"
 common_10:0 "反共产主义"
 common_10_desc:0 "共产主义革命正在危害我们的社会秩序和国家利益，向大家宣布我们国家绝不容忍红色分子，一旦发现，就要投入大牢。"
 common_11:0 "情报机关"
 common_11_desc:0 "一些红色分子和反政府武装正在转向地下秘密活动。为了铲除他们，我们需要成立一个专门的部门来调查、监督、逮捕和消灭他们。"
 common_12:0 "白色恐怖"
 common_12_desc:0 "反共反颠覆势力的监视网络必须延伸到全国，对每个人的一举一动都要进行调查。我们一找到共产党，就将立即肉体消灭。"
 common_13:0 "美国援助"
 common_13_desc:0 "请求美国政府提供军事、政治和经济援助。"
 common_14:0 "加入北约"
 common_14_desc:0 "北大西洋公约组织是在自由世界成立的，目的是保护自由国家不受红色国家的入侵。加入他们，我们将得到独立和自由的保障。"
 common_15:0 "军事支援"
 common_15_desc:0 "反对共产主义的斗争正在全世界爆发。我们应该派一些志愿者参加。一方面，我们要学习战斗的经验。另一方面，当我们遇到困难时，美国人也会愿意提供帮助。"
 common_16:0 "部署战略武器"
 common_16_desc:0 "邀请美国在我国境内部署威力强大的弹道导弹武器，以震慑任何敢于入侵的敌人。"
 common_17:0 "共同防御"
 common_18:0 "二元制君主立宪"
 common_18_desc:0 "我国还不具备过渡到完全的君主立宪民主制度的条件，国王陛下必须保留一定的权力，包括解散议会和任命首相，以确保政府的稳定。"
 has_monarchs:0 "有宣称该国王位的王室"
 common_19:0 "君主立宪"
 common_19_desc:0 "随着国家的现代化进程取得成功，政治现代化也将提上议程。陛下至高无上的地位应当走入历史了，我们即将实行立宪制改革，扩大议会和内阁的权力。"
 common_20:0 "军事建设"
 common_20_desc:0 "世界军事技术正在不断地发展，我们必须保证我国的军事力量不能落后世界。"
 common_20_tool:0 "解锁使用步兵装备和火炮制造企业"
 common_21:0 "亲近第三世界"
 common_21_desc:0 "随着殖民体系的瓦解，亚非许多国家独立建立了新的国家。我们必须尽快与这些国家建立良好关系。"
 common_22:0 "支持去殖民化"
 common_22_desc:0 "亚非拉人民反对殖民者，争取民族独立，我们应该支持他们。"
 common_23:0 "经济建设"
 common_23_desc:0 "新生的国家需要发展，人民需要衣食住行，满足人民群众对生活必需品的需求，是我们建设国家的第一步。"
 common_24:0 "加入不结盟运动"
 has_non_aliged:0 "已有国家发起不结盟运动"
 set_non_aliged:0 "发起不结盟运动"
 common_24_desc:0 "美国和苏联正在努力将世界各国纳入其势力范围，这将扩大意识形态冲突，加剧战争威胁。我们呼吁不结盟运动和建立一个全球组织，抵制与强国结盟。"
 common_25:0 "区域合作"
 common_25_desc:0 "建立与周边国家合作的区域性组织，不仅有利于我们自身的发展，也有利于为将来融入经济全球化做准备。"
 common_26:0 "人民共和国"
 common_26_desc:0 "落后的资本主义时代已经过去，我们人民将迎来更加先进、民主的社会制度。社会主义有利于生产力的发展，实现社会平等和民主进步。"
 common_27:0 "特色社会主义"
 common_27_desc:0 "苏联早期建设的经验教训告诉我们，斯大林的模式不能直接照搬。我们要研究创造符合我国具体国情的特色社会主义。列宁早已有过实践，市场经济、商品经济与外来投资并非与社会主义根本上矛盾，只要能够改善国家经济发展和人民生活水平，就有值得采用的价值。"
 common_28:0 "苏联模式"
 common_28_desc:0 "在斯大林模式的指导下，苏联人民不仅在短短十年内把俄罗斯变成了工业强国，而且还战胜了法西斯。我们要摆脱贫困，进入工业化和现代化，就必须学习苏联人民的先进经验。"
 common_29:0 "社会主义市场经济"
 common_29_desc:0 "受斯大林模式的影响，许多人认为市场就是资本主义，只有计划经济才是社会主义。这显然是错误的。列宁早在斯大林之前就通过引入市场经济提高了苏俄的生活水平。我们为什么不试试呢？"
 foreign_companies_tool:0 "允许使用美孚、壳牌、雷诺、大众、菲亚特等外国企业，但使用外国企业会削弱本土企业的效果。"
 common_30:0 "对外开放"
 common_30_desc:0 "自我封闭不是社会主义。我们应该允许外国，甚至资本主义国家的资金、技术和先进经验前来投资，进口国内产品，吸收他们的先进经验，优化自己，而不破坏我们的基本经济制度。"
 common_31:0 "多党合作"
 common_31_desc:0 "一党独大和个人崇拜是斯大林时代的错误遗产。一个真正的社会主义政府，应该懂得团结国内一切可以团结的阶级和力量，同一切支持社会主义的民主党派合作，组成联合政府，共同建设我们的国家。"
 common_32:0 "人道的社会主义"
 common_32_desc:0 "社会主义不是绝对主义。即使是在人民民主专政的国家，人民不分阶级、不分革命，也应有适当的言论、思想、经济、宗教、政治自由。"
 common_33:0 "亲近西方"
 common_33_desc:0 "莫斯科把自己看作社会主义阵营的领导人，无视我们的外交独立和自治。如果我们不愿意成为卫星国家，我们就必须寻求新的外交友谊。"
 common_34:0 "基本原则"
 common_34_desc:0 "在积极倡导开放的同时，也要警惕一些自由化、资本主义思潮。少数人主张经济私有化、自由放任思想和政治多元化，这是不允许的。代表劳动人民利益的党必须始终拥有最高权力。"
 common_35:0 "政治自由化"
 common_35_desc:0 "僵化、保守和政治优先不利于我国进入现代化和融入世界。要在坚持社会主义的前提下，允许和鼓励社会各界发表意见。"
 common_36:0 "政治多元化"
 common_36_desc:0 "虽然党作为社会主义国家的建设者作出了巨大贡献，但要进一步实现国家的现代化、民主化和进步，必须打破一党专政，实现多元化。"
 common_37:0 "一党专政"
 common_37_desc:0 "我国当前政党众多，但大都代表着资本家、政治投机者甚至敌对分子的利益。我们要建设一个无产阶级所有、代表劳动人民的人民民主国家，共产党就必须领导一切。"
 common_39:0 "领袖崇拜"
 common_39_desc:0 "我们伟大的领袖[From.GetLeader] 在推翻帝国主义侵略、推翻反动政权、建立社会主义新国家的历史上，取得了举世瞩目的成就。只有把他尊为我国最伟大的领袖，听从他的一切指示，我们才能建设和保卫祖国！"
 common_40:0 "内务委员会"
 common_40_desc:0 "我们要建立专门的机构，调查、监视、逮捕反革命分子和帝国主义间谍。"
 common_41:0 "肃清"
 common_41_desc:0 "一些敌视社会主义[FROM.GetName]的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。在全国范围内扩大狙击反动势力的监视网，消灭任何涉嫌支持反革命、反社会主义的敌对分子。"
 common_42:0 "计划经济"
 common_42_desc:0 "我国仍然是一个落后的农业国家。要实现快速发展，必须统一现有的一切生产资料，有计划地使用和分配生产生活资料。"
 common_43:0 "农业集体化"
 common_43_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 common_44:0 "合作社"
 common_44_desc:0 "合作社可以将分散的农户合并起来，在保留私人财产的情况下分享劳动工具。"
 common_45:0 "五年计划"
 common_45_desc:0 "我们将开始实行第一个五年计划，以快速改善我国的落后局面。"
 oil_produc:0 "发展石油工业"
 oil_produc_desc:0 "石油是现代工业的血液，如果我们要成为工业国家，发展石油工业是不可缺少的一步。"
 plastic_produc:0 "发展材料工业"
 plastic_produc_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 common_46:0 "重工业优先"
 common_46_desc:0 "重工业是提供生产资料的工业，我们需要先发展重工业，进入工业化，才能发展其他产业。"
 common_47:0 "轻工业优先"
 common_47_desc:0 "我们的人民对消费品的需求日益增高，应该先发展轻工业以满足人民。"
 common_48:0 "亲近苏联"
 common_48_desc:0 "伟大的苏维埃社会主义共和国联盟已经成为社会主义国家和第三世界独立国家最坚定的盟友，我们将坚定地和莫斯科的同志们站在一起，对抗帝国主义和殖民主义！"
 common_49:0 "加入华约"
 common_49_desc:0 "帝国主义国家正不遗余力地寻求颠覆欧洲的社会主义国家，而华沙条约组织将保护我们不被侵犯。"
 common_50:0 "亲近中华人民共和国"
 common_50_desc:0 "中华人民共和国积极且坚定地支持第三世界国家反对帝国主义，它将是我们对抗帝国主义侵略的重要盟友。"
 ethics_committee:0 "宗教法庭"
 ethics_committee_desc:0 "一些质疑伊斯兰教法的破坏分子仍然存在，我们需要建立宗教法庭来惩处他们。"
 common_51:0 "成立议会"
 common_51_desc:0 "成立立法机构，选举出议会，是迈向现代政治的标志。"
 common_52:0 "核计划"
 common_52_desc:0 "核武器的出现彻底改变了人类社会，这种强大的武器结束了二战，但也让20世纪后半页的人民无比担忧第三次世界大战的爆发，因为这种超级武器将有摧毁世界的危险。美国和苏联在二战后分别开发了核武器，作为对抗的筹码，核平衡一定程度上阻止了第三次世界大战。而在其他国家，例如法国、中国和印度眼中，核武器是话语权的象征，只有掌握和武器才不会遭受超级大国的威胁，才有资格在国际社会中不成为棋子，并有威胁其他国家的能力。基于这种思维，除了五大常任理事国外，二战后至少有十几个国家开发了核武器，但成功的并不多。"
 common_53:0 "伊斯兰国家"
 common_53_desc:0 "无论世界如何变幻，《古兰经》和先知的意志仍然是永恒的真理，我们的国家需要伊斯兰教法的治理，以保证我国永远在真理的范围内。真主安拉在呼唤我们砥砺前行。弟兄们，请拾起我们的弯刀，捍卫我们生存的权利！"
 common_54:0 "宗教警察"
 common_54_desc:0 "一些异教徒和敌对分子煽动违背《古兰经》的政治主张，我们将采取强制手段让他们闭嘴。"
 common_55:0 "圣战"
 common_55_desc:0 "对异教徒的讨伐已经开始，为了真理，我们将碾碎一切违背伊斯兰的事物！安拉胡阿克巴！"
 common_56:0 "民族主义"
 common_56_desc:0 "民族主义早在公元前就有雏形，而近代欧洲王权与教权的对抗和资本主义的发展促进了民族主义的成型，法国大革命和拿破仑战争标志着民族主义的诞生。出于对共同的文化、地域或意识形态的认同，民族意识将一个民族团结到一起，从而动员全民为国家的利益服务，一个国家的社会各阶层一起为民族的利益而奋斗。民族主义促进了欧洲各国的统一和独立，但也导致了列强之间的争霸战争，最终导致两次世界大战，一战后世界各地对民族主义出现了不同的态度，土耳其的凯末尔和中国的孙中山将其作为追求国家独立的旗帜，苏加诺、铁托将其视为维护国家统一的工具，托洛茨基和列宁抨击民族主义是资产阶级和君主煽动人民为其利益送死的把戏，此外也有希特勒、墨索里尼、卡扎菲等将其用于自己国家的对外扩张。"
 common_57:0 "军国主义"
 common_57_desc:0 "国家的一切人力、财力和资源都被用于军事建设以及战争，反过来这个国家的经济又由对外战争供养，这便是军国主义的体现。历史上最早的军国主义国家是两河流域的亚述帝国，到了近代，普鲁士、德意志帝国和日本帝国都成为了典型的军国主义国家，他们的国民经济完全依赖对外侵略掠夺资源，然后又将这些资源用于军队建设。二战时间的日本帝国和纳粹德国将军国主义和民族主义相结合，变成极其狂热的战争机器，即使到了二战后相对和平的时代，军国主义仍然广泛存在，美国和苏联之间为了应对随时可能爆发的世界大战进行军备竞赛而将经济与军工复合体绑定，或多或少带有军国主义的色彩，而萨达姆统治下的伊拉克、卡扎菲统治下的利比亚和白人南非都成为了将经济大量投入到军事中的准军国主义国家。"
 common_58:0 "思想改造"
 common_58_desc:0 "如果我们希望人民随时随地为国贡献，那我们必须从小开始教育改造，把他们培养成我们需要的理想公民！"
 common_59:0 "青年团"
 common_59_desc:0 "国家机器的运作离不开人，尤其是这些崭新的······青年。"
 steel_produc:0 "钢铁工业"
 steel_produc_desc:0 "以质量计算,铁是地球上最常见的元素,它加热后有很好的延展性…并且非常有用。铁始于公元前3500年左右,在埃及的盖尔扎赫被发掘出来铁对早期文明所需的各式东西都非常有用:如,蒸煮罐、小五金、工具,以及用来刺伤他人的尖锐武器。"
 common_60:0 "沙里亚法"
 common_60_desc:0 "以伊斯兰教为核心的封建社会组织在我们国内已经存在了上千年，其“教法”即沙里亚法。是我们泛伊斯兰文明的智慧结晶。是经受住时间考验的，指导一切穆斯林社会的，无可争议的天赐圣法。"
 common_61:0 "土地改革"
 common_61_desc:0 "在农业社会工业化的过程中，在旧时代等同于权力、地位和财富的土地必须被彻底地流动起来。无论是以商品化改革的形式，还是以公有化改革的形式，一切以土地为核心的旧社会阶层都要被新的商品经济完全地消灭，其财产成为投资的资本，农民人口成为工人预备队。如此是为土地改革的最终目的。"
 focus_landreform_tool:0 "§R土地改革将减少农场提供的税收§W"
 common_62:0 "维护君主统治"
 common_62_desc:0 "君权可不仅仅是某些自作聪明者口中的旧社会累赘。在我们的国家，至高无上的君主象征着我们社会中那些无可替代的传统和文化。一个僭主渴望权力，而一个君主则渴望荣誉。僭主的卫兵是雇佣兵，而君主的卫兵是公民。"
 common_63:0 "基础工业化"
 common_63_desc:0 "初步工业化的政策将是一系列经济发展和社会改造运动的开始。为此我们将尽一切努力消灭旧特权集团，并利用从土地经济中抽出的资本与国际投资一同扩张工业建设。"
 common_64:0 "轻工业建设 I"
 common_64_desc:0 "国际市场中较小的经济体所发展的基础轻工业通常包括食品加工、水泥、棉纺等直接与初级产业（农牧矿业）对接的行业。"
 common_65:0 "轻工业建设 II"
 common_65_desc:0 "在基础轻工业的基础上，小经济体的政府机构通常还会进一步帮扶其国内民族资本家的产业扩张。或采用公私合营、保护产业的模式，或尝试与第一、第二世界的国际资本对接。"
 common_66:0 "轻工业建设 III"
 common_66_desc:0 "在拥有了一定规模的基础民用工业后，新兴或复兴的经济体就可以进一步发展小商品生产基地和初级产品精加工行业。"
 common_67:0 "军工业建设 I"
 common_67_desc:0 "从制造简单的军服、步枪、子弹和炸弹开始。"
 common_68:0 "军工业建设 II"
 common_68_desc:0 "二战后国际格局瞬息万变，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 common_69:0 "军工业建设 III"
 common_69_desc:0 "新时代的武器装备更复杂、多样化且昂贵，唯有进一步扩张我国的军事工业，才能腾出足以敷用的产能奋起直追。"
 common_fishing_1:0 "发展渔业 I"
 common_fishing_1_tool:0 "所有地区海产品+25%"
 common_fishing_1_desc:0 "\n授人予鱼，不如授人予渔。\n——老子"
 common_fishing_2:0 "发展渔业 II"
 common_fishing_manufacture:0 "发展渔业副产品"
 common_fishing_manufacture_desc:0 "渔船将满满的渔获带回港口，这些收获并不仅仅只能成为人民餐桌上的食品，他们还拥有巨大的经济价值。鱼肉在被做成罐头、鱼饼、鱼油、鱼丸和蟹柳后，可以获得更高的附加价值和利润。鲸鱼骨头可以制作成工业材料，吃剩下的骨头还可以用于堆肥……渔业的经济价值还有很深的开发潜力。"
 common_fishing_manufacture_tool:0 "海产品可以提供额外的税收。增加海产品出口的利润。"
 
 
 common_70:0 "政委制度"
 common_70_desc:0 "政治委员是当在军人中的代表，管理军人的思想和政治教育，以确保军队始终服从于党的领导。一个军事单位的政委几乎与单位指挥官平级，并且他们只服从于党而非军队中的上级，是党确保人民军队始终服从于社会主义意识形态的保证。"
 common_71:0 "少年先锋队"
 common_71_desc:0 "少年先锋队是共产主义事业的接班人，培养少先队就是培养党和社会主义的未来。"
 common_72:0 "亲社会主义外交"
 common_72_desc:0 "自从苏联成立以来，社会主义阵营就秉持着支持全球民族解放运动，打击帝国主义的外交策略。这与我们政权的国际利益不谋而合。"
 common_73:0 "经济互助委员会"
 common_73_desc:0 "社会主义阵营的全球经济秩序建立在“产业互助”原则上。简而言之就是社会主义阵营以无偿或低偿援建、援助的形式投资盟国的工业发展，以此增加盟国的消费力和无产阶级人口并签订各种联盟条约。"
 common_74:0 "教育改革"
 common_74_desc:0 "二战前发展的教育产业已经日渐不能满足我国经济和社会对产业人才的需求，我们必须用行政手段加紧在全国范围内普及公立的、国际化的科教体系。"
 common_75:0 "推进城市化"
 common_75_desc:0 "城市化是工业化的必然结果，也是前提之一，科技革命使得人类的居住地不再受自然条件的束缚，而工业化对劳动力的需求使得大量人口离开农村进入城市，二十世纪下半叶，全世界都有大量人口迁入城市生活，这一方面为工业建设提供了劳动力，但这也意味着这将是对政府建设能力的挑战，城市化需要合理的城市规划、教育、医疗、供电供水和排污系统来支持，没有这些服务的城市将会是一个巨大的贫民窟。"
 common_76:0 "现代化军队"
 common_76_desc:0 "许多在二战时期出现的各种军事发明，在二战后被美苏等大国运用到实战中，例如直升机、导弹、复合装甲、机械化车辆以及合成材料制作的装备等。军事科技是不断发展的，如果我们在军事研究上停滞不前，就随时可能落后。"
 common_intel_war:0 "数字化军队"
 common_intel_war_desc:0 "计算机的出现改变了现代战争，它不仅广泛运用到人民的生活中，而且也广泛运用到军事上。计算机可以使得复杂的坦克、飞机和军舰操作变得简单，可以帮助计算炮弹的弹道，可以更好地处理甚至获取情报……一支数字化的军队将让我们有能力打一场21世纪的战争。"
 common_77:0 "海军建设"
 common_77_desc:0 "有海无防，等同于开门缉盗。"
 focus_space_explore:0 "太空计划"
 common_social_reform:0 "社会改革"
 common_social_reform_desc:0 "许多落后的文化和生活习惯依然影响着我们的国家，例如男女的不平等和等级制度，如果我国想要成为一个现代国家，就必须将这些落后文化清除。"
 common_social_quality:0 "促进社会平等"
 common_social_quality_desc:0 "人人生而平等，消灭社会歧视，普及人权和法制，令我国的每一个公民都有尊严的活着，才能打造一个伟大的自由国家。"
 common_companies_reform:0 "国有企业改革"
 common_hight_tech:0 "发展高新产业"
 common_hight_tech_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一。随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。"
 common_agriculture:0 "发展农业技术"
 common_agriculture_desc:0 "改善农业生产，不仅需要合理的土地制度，且需要先进的农业技术。水利、农药、化肥、配种和机械化，这些都是农业现代化不可缺少的。"
 common_78:0 "空军建设"
 common_78_desc:0 "空军在1912年的意大利-土耳其战争后被世界各国视作陆海之后的第三大军种，战斗机和轰炸机咆哮着称霸了两次世界大战期间的天空。二战向世界各国展示了空中武装的作用和重要性，他们可以作战、可以运输、可以侦察，可以破坏敌人后方……总之，一支合格的空军是一支现代军队必不可少的，至少我们要保证我们头上的飞机不是敌人的。"
 common_79:0 "皇室内阁"
 common_79_desc:0 "特权岂天赋，精英实家传。代代思社稷，黔首能比肩？"
 common_80:0 "领土扩张"
 common_80_desc:0 "我们的剑已经准备好为我们的犁谋取更多的土地"
 common_80_tool:0 "可以通过决议索取周边土地的核心"
 common_81:0 "民族社会主义"
 common_81_desc:0 "马列斯的经济社会理论是符合科学的，但是也不能免俗于他们所处的时代和地区的历史局限性。由此总结出的经验与我们国家的历史和现况南辕北辙。好在我们的伟大领袖已经对社会主义有了深刻的学习、理解，并准备好在实践中向我们传授他对马列思想的天才补充。"
 common_diplomacy:0 "外交政策"
 common_diplomacy_desc:0 "在新的时代里，我们必须抓紧参与世界各国间积极的互动，以防止战略上的孤立带来经济和国防安全上的毁灭性后果。"
 common_diplomacy_latins:0 "改善与拉丁美洲国家关系"
 common_diplomacy_latins_desc:0 "战后世界平等外交、民族解放的格局下，即使是持门罗主义的美国也无法完全封锁拉丁美洲各国的外交渠道，垄断其市场份额。我们可以趁此机会和拉丁美洲各国开展政治和经济上的合作。"
 common_diplomacy_asia:0 "改善与亚洲国家关系"
 common_diplomacy_asia_desc:0 "亚洲新解放的民族国家以工业发展滞后但人力、自然资源丰富为特征。是落后国家或地区中较有潜力的一批后进生。我们与他们提前展开友好交流有益无害。"
 common_medic:0 "推进医疗建设"
 common_medic_desc:0 "公共医疗产业的发展是影响一国人口结构和劳工质量的重要因素。如何能维护国民健康，也自古以来是一个政权成功与否的重要指标。"
 diplomatic_detail_box:0 "你需要足够的情报网才可查看对方外交关系"
 common_missile:0 "发展导弹技术"
 common_missile_tool:0 "解锁使用导弹开发企业"
 common_missile_desc:0 "导弹技术可能是20世纪最重要的军事发明之一，他最早诞生于二战德国的V2火箭，并在50年代的美苏争霸中完善。最早的导弹通过红外线热感应进行制导，通过接收目标反射的热光调整弹道，到了后来出现了电视制导和主动激光制导。导弹的应用相当广泛，它可以用于大型的弹道导弹，也可以用于制导炸弹，或步兵、车载的反坦克或反导导弹，它大大提升了军队的作战效率，但最大的问题就是——他太贵了。"
 focus_electro:0 "发展电子产业"
 focus_electro_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一，1948年ENIAC一条条电路板的运作标志着第三次科技革命的诞生。1960年代，随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。起初计算机只能帮助处理文书工作，但后期计算机有了更多功能，例如制图、传真、模拟和娱乐。计算机不仅可以帮助人们工作，对于80年代的许多国家来说，计算机还是经济腾飞的阶梯，亚洲的日本、韩国、台湾和中国大陆通过承接计算机制造业实现了经济的迅速增长。"
 common_infra:0 "基础设施建设"
 common_infra_desc:0 "完善的基础设施是沟通全国各地，发展经济并建立稳固政权的前提。"
 focus_electro_tool:0 "解锁使用电子企业"