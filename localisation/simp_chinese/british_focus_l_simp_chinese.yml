 ENG_frderal_Rhodesia:0 "罗德西亚联邦"
 ENG_frderal_Rhodesia_desc:0 "罗德西亚是大英帝国的非洲开拓先锋西塞尔·罗德斯的遗产，但此时这片土地正面临黑人民族主义叛乱的威胁。如果我们能把南北罗得西亚及尼亚萨兰三块殖民地合并，那么赞比西河的铜矿、尼亚萨兰的农业将缔造一个中等发达的国家，当地的英裔移民将有能力保护自己，保护大英帝国在非洲的遗产。"
 
 ENG_euronism:0 "欧洲人的欧洲"
 ENG_euronism_desc:0 "欧洲事务必须由欧洲人来共同主导，并与来自遥远前殖民地的暴发户国家保持距离。"
 ENG_french_coop:0 "与法国军事合作"
 ENG_french_coop_desc:0 "英国和法国联合起来，共同赢得了两次世界大战，而第三次世界大战的威胁正在加重，这要求我们再一次与英国建立同盟，即使两国存在诸多的矛盾。"
 ENG_independent_defence:0 "独立发展防务"
 ENG_independent_defence_desc:0 "原子能的释放改变了一切，谁拥有核武器，谁就能拥有国际地位。美国试图向我们出售他们的核保护伞，换取我们不开发核武器，这种骗局我们不会接受，英国必须开发属于自己的核武器。"
 ENG_celear_american:0 "清除美国影响力"
 ENG_exist_nato:0 "退出北约！"
 ENG_exist_nato_desc:0 "北大西洋公约并不是西欧自由国家的庇护伞，而是美国人施加在欧洲大陆身上的枷锁，大英帝国不会屈服于华盛顿的遥控，而是追求自主的政治和外交政策。"
 ENG_EAEC:0 "原子能共同体"
 
