 ENG_indus_oil:0 "发展石油产业"
 ENG_indus_oil_desc:0 "我们需要进一步扩大石油生产以供应不断扩大的能源需求。"
 ENG_indus_plastic:0 "发展化工产业"
 ENG_indus_plastic_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 ENG_indus_steel:0 "发展钢铁产业"
 
 ENG_cas_fac:0 "发展战术攻击机"
 ENG_jet:0 "发展现代化战机"
 ENG_jet_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 ENG_bomber:0 "发展轰炸机"
 ENG_transfer:0 "发展运输机"
 ENG_transfer_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 ENG_air_equip:0 "发展空军装备"
 ENG_airbase:0 "扩大空军基地"
 ENG_airbase_desc:0 "我们需要机场和基础设施来承载我们的空军。"
 ENG_airbase_asia:0 "远东空军基地"
 ENG_airbase_miterrain:0 "地中海空军基地"
 ENG_airbase_west:0 "西非空军基地"
 ENG_airbase_east:0 "东非空军基地"
 
 ENG_medium_ships:0 "发展现代舰艇"
 ENG_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 ENG_naval_missile:0 "发展反舰导弹"
 ENG_submarines:0 "发展潜艇"
 ENG_submarines_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 ENG_marines:0 "发展两栖部队"
 ENG_naval_base_hk:0 "远东海军基地"
 ENG_naval_base_malaya:0 "马来亚海军基地"
 ENG_naval_base_west_africa:0 "西非海军基地"
 ENG_naval_base_east_africa:0 "东非海军基地"
 
 ENG_naval_base_saf:0 "南非海军基地"
 ENG_naval_base_miteerain:0 "地中海海军基地"
 ENG_naval_base_persia:0 "波斯湾海军基地"
 
 ENG_massage_tech:0 "发展信息技术"
 ENG_massage_tech_desc:0 "互联网将计算机连接在一起，使得他们之间可以快速传播和共享信息，如果这项技术进入民用领域，全国乃至全世界的计算机用户都将通过互联网获取知识和信息，这是一项伟大的创造。"
 
 ENG_anglicanists:0 "英国国教的权威"
 ENG_gods_kings:0 "君权神授"
 ENG_cocial_law:0 "社会道德法"
 
 ENG_weman_right:0 "女性权利改革"
 ENG_accept_immigrate:0 "接纳移民"
 ENG_accept_immigrate_desc:0 "随着国家的经济法不断发展，不断繁荣的社会也开始导致我们的国家开始老龄化，高度的福利制度也使得劳动力成本越来越高，为了解决这个问题，引进劳动力不失为一个合理的方案。那些从第三世界国家来的移民可以接受更低的福利和薪水。"
 ENG_labour_right:0 "保护劳动者权益"
 ENG_nature_focus:0 "环保议题"
 ENG_nature_focus_desc:0 "《寂静的春天》让环境破坏和保护成为了政治议题，当被污染的水源、河流、海洋，死亡并消失的物种、开发殆尽的森林和被二氧化硫侵蚀的天空成为报纸和电视新闻上的热议话题时，公众对环保政策和污染控制的关注便不断提高。有的政府积极支持环保议题，希望以此争取进步主义者的支持。"
 
 ENG_armors:0 "发展装甲部队"
 ENG_armors_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 ENG_mechanized:0 "发展机械化部队"
 ENG_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 ENG_airborn:0 "发展空降部队"
 ENG_airborn_desc:0 "飞机航程和载荷的发展开辟了许多可能性。运输机可以在敌人战线的大后方投下一整个师的部队，在那里他们可以造成严重破坏。"
 
 ENG_diplo_prc:0 "与中共建交"
 ENG_diplo_roc:0 "放弃在华特权"
 ENG_nego_hk:0 "香港问题谈判"
 
 
 
 
 ENG_Harrier:0 "开发垂直起降战斗机"
 Harrier_fighter_modifier:0 "鹞式攻击机"
 
 ENG_north_oil:0 "开发北海油田"
 ENG_north_oil_desc:0 "随着战后我国经济和社会的不断发展，我们对石油能源的需求不断增加，然而中东局势的变化使我们来自中东的石油供应受到威胁，也许最好的解决方式，就是勘探和发掘北海地区的海底油田，一旦成功开采，我们不仅将解决我国的能源需求，还能出口石油以获得外汇。"
 ENG_BBC:0 "拉拢BBC"
 ENG_BBC_desc:0 "不列颠广播公司是全世界最有影响力和最为权威的英语媒体，如果他们能为西方国家的政治目的服务，那么他们的权威性可以更上一层。"
 ENG_strike_boer:0 "镇压布尔人"
 ENG_strike_boer_desc:0 "布尔战争已经结束半个世纪，但荷兰裔南非人依然不太服从威斯特敏斯特的统治，随着我们与他们在南非问题上的分期越来越大，他们毫无疑问会成为一个隐患。我们的殖民地官员建议我们限制和打压布尔人在南非政治中的影响力。"
 ENG_east_africa_federate:0 "合并东非联邦"
 ENG_east_africa_federate_desc:0 "如果我们想要维持在非洲的影响力，我们应该将肯尼亚、乌干达、坦噶尼喀和桑给巴尔殖民地合并为一个联邦国家，从而在非洲复制一个有实力的代理人政权，"
 ENG_strike_footbal:0 "打压足球"
 ENG_strike_footbal_desc:0 "足球在英国有巨大的社会影响力，尤其是工人阶级特别热爱，然而像工会这样的左派团体却利用足球比赛来宣传自己的意识形态，这毫无疑问是不可接受的。"
 ENG_tourism_focus:0 "发展旅游业"
 ENG_tourism_focus_desc:0 "无论是著名的大本钟、巨石阵、大英博物馆，还是为了瞻仰女王陛下的风采，每年都有大量的外国游客从世界各地来到我国，因此我们很有必要积极地开发旅游市场。"
 ENG_great_london:0 "大伦敦"
 ENG_great_london_desc:0 "从工业革命开始，伦敦就是世界上最繁华的城市之一，但不断增加的人口意味着对社会服务、基础设施和市政机构更高的要求。"
 ENG_modern_railway:0 "铁路电气化"
 ENG_modern_railway_desc:0 "战后交通运输技术发展迅速，铁路电气化成为改进铁道运输的重要一步，电气化的列车拥有更快的速度和安全性，而电气化的轨道可以改善运输的监控和指挥能力。"
 ENG_europe_fighter:0 "欧洲战机公司"
 ENG_europe_fighter_desc:0 "随着欧洲各国在军事和防卫上的合作日益加深，我们建议各国合作成立一家专门开发战斗飞机的企业，并互相共享技术和开发成果。"
 ENG_FRA_tunnel:0 "英法海底隧道"
 ENG_FRA_tunnel_desc:0 "随着英国和法国等欧洲大陆国家的经贸往来日益增加，航运已无法满足不列颠和欧洲大陆之间人员、车辆与货物的运输，是时候打造一条沟通不列颠与法国的海底隧道了。"
 ENG_invade_france:0 "亨利五世的遗产"
 ENG_invade_france_desc:0 "大不列颠的皇室拥有法国王位的继承权，即便法国变成了共和国，但这不意味着我们就不可以索取了。"
 ENG_invest_singapore:0 "投资新加坡"
 ENG_invest_singapore_desc:0 "新加坡扼守马六甲海峡，是亚洲最重要的航运枢纽。我们应该投资建设开发新加坡作为航运中心，以保障我们对远东航运的控制和我们对亚洲经济中心的控制。"
 ENG_africa_influce:0 "扩大非洲影响力"
 ENG_africa_influce_desc:0 "去殖民化并不能彻底终结我们对非洲的控制。即使我们的非洲自治领宣布成为主权国家，但我们依然在当地留有政治、经济和文化影响力，我们可以利用这些影响力渗透当地政府，进一步保护我们在当地的利益。"
 ENG_east_africa_troop:0 "组建地方部队"
 ENG_east_africa_troop_desc:0 "反殖民运动在我们的海外领地不断扩大，现有的殖民地警察已不足以镇压暴动。我们需要扩大殖民地的准军事部队，并武装当地忠诚于我们的人。"
 ENG_saf_coop:0 "与南非合作"
 ENG_saf_coop_desc:0 "南非有许多沙漠地区适合开发核武器，我们可以与南非当局进行合作，在那里开发核试验基地。当然，实验成果将与南非共享。"
 ENG_australia_coop:0 "与澳洲合作"
 ENG_australia_coop_desc:0 "澳洲有许多沙漠地区适合开发核武器，我们可以与南非当局进行合作，在那里开发核试验基地。当然，实验成果将与澳洲共享。"
 ENG_canada_coop:0 "与加拿大合作"
 ENG_canada_coop_desc:0 "加拿大有许多荒漠地区适合开发核武器，我们可以与南非当局进行合作，在那里开发核试验基地。当然，实验成果将与加拿大共享。"
 ENG_carribea_commonwelth:0 "合并加勒比联邦"
 ENG_carribea_commonwelth_desc:0 "将我们在加勒比海的海岛领地合并为一个联邦国家并加以扶持，帮助他们更好地发展经济以对抗可能的共产主义渗透。"
 ENG_invets_carribea:0 "投资加勒比海"
 ENG_invets_carribea_desc:0 "我们在加勒比海的海岛领地需要进行建设开发，以帮助当地对抗可能的共产主义渗透。"
 ENG_invets_west_africa:0 "投资西非"
 ENG_invets_west_africa_desc:0 "我们在非洲西部的黄金海岸、塞拉利昂和尼日利亚等领地适合生产经济作物，但当地的反殖民运动正在崛起。如果要拉拢当地人支持我们的管制，就必须大力发展当地的经济，创造就业，让当地人相信来自伦敦的治理是有利于他们的。"
 ENG_invets_aouth_africa:0 "投资南非"
 ENG_invets_aouth_africa_desc:0 "非洲南部拥有世界上最大最丰富的贵金属矿藏，我们应该进一步投资开发当地的矿产资源，"
 ENG_tanguanika_peanaut:0 "坦噶尼喀花生计划"
 ENG_east_africa_railway:0 "东非铁路"
 ENG_east_africa_railway_desc:0 "从西塞尔·罗德斯时代开始，建设一条从开罗到开普敦的铁路就是我国最重要的非洲政策，但目前我们在非洲，尤其是东非地区的铁路系统逐渐老化，不足以满足我们的需求，需要进行扩建升级。
 ENG_invets_east_africa:0 "投资东非"
 ENG_invets_east_africa_desc:0 "我们在非洲东部的肯尼亚、乌干达和坦噶尼喀等领地适合生产经济作物，但当地的反殖民运动正在崛起。如果要拉拢当地人支持我们的管制，就必须大力发展当地的经济，创造就业，让当地人相信来自伦敦的治理是有利于他们的。"
 ENG_invets_africa:0 "投资非洲"
 ENG_invets_africa_desc:0 "大不列颠是瓜分非洲的最大获益者，非洲一半的土地都已纳入我们手中，尽管二战给我们带来巨大的创伤，但我们在非洲的统治依然牢固。现在我们需要进一步开发非洲，发展当地的经济，获取当地的资源，并巩固我们在当地的统治。"
 ENG_indonesia:0 "干涉印度尼西亚"
 ENG_indonesia_desc:0 "东印度群岛的反荷兰独立战争不断扩大，战火迟早会烧到我们在马来亚和北婆罗洲的领地，因此我们可以支持荷兰镇压东印度群岛的暴动。"
 ENG_indochina:0 "介入印度支那"
 ENG_indochinadesc:0 "印度支那的反法共产主义暴动不断扩大，战火迟早会烧到我们在马来亚、缅甸和香港的领地，因此我们可以支持法国镇压印度支那的暴动。"
 ENG_malaya_autonomy:0 "马来亚联邦"
 ENG_malaya_autonomy_desc:0 "共产主义正在东南亚蔓延，我们在东南亚的领地也在追求独立，因此我们可以和当地的反共精英阶层进行合作，允许他们独立并建立友好政府，同时将马来亚、新加坡、砂拉越和北婆罗洲合并为一个联邦，联合起来对抗共产主义。"
 ENG_malaya_emergency:0 "马来亚紧急状态"
 ENG_malaya_emergency_desc:0 "马来亚爆发严重的共产主义叛乱！我们必须尽快介入，帮助马来亚当局进行镇压！"
 ENG_invets_malaya:0 "投资东印度"
 ENG_invets_malaya_desc:0 "我们在东南亚的马来亚、新加坡、砂拉越和北婆罗洲等领地适合生产经济作物，但当地的反殖民运动正在崛起。如果要拉拢当地人支持我们的管制，就必须大力发展当地的经济，创造就业，让当地人相信来自伦敦的治理是有利于他们的。"
 ENG_invets_hongkong:0 "投资香港"
 ENG_invets_hongkong_desc:0 "随着中国共产党夺取中国大陆，香港成为远东的关注焦点。大量的人口逃离中国进入香港，大大增加了当地的社会混乱和治理难度，但也带来了大量廉价劳动力。国民党和共产党政府都对香港有所觊觎，因此必须尽快解决香港的社会问题，稳固我们在当地的威信。"
 ENG_constructed_colonies:0 "建设殖民地"
 ENG_constructed_colonies_desc:0 "建设殖民地"
 ENG_open_university:0 "开放大学"
 ENG_auto_indus:0 "扩大汽车产业"
 ENG_auto_indus_desc:0 "随着全球汽车产量增加和汽车技术的发展，汽车已不再是一种富人专属的奢侈品，而实进入中产阶层，成为一种重要的消费品。我国的汽车依然高度依赖进口，因此我们需要发展汽车工业，不仅是为了满足消费需求，也是为了让国家更快实现汽车国产、加速经济和工业发展。"
 ENG_MILITARY_indus3:0 "扩大军工业 III"
 ENG_MILITARY_indus3_desc:0 "新时代的武器装备更复杂、多样化且昂贵，唯有进一步扩张我国的军事工业，才能腾出足以敷用的产能奋起直追。"
 ENG_MILITARY_indus2:0 "扩大军工业 II"
 ENG_MILITARY_indus2_desc:0 "二战后国际格局瞬息万变，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 ENG_MILITARY_indus1:0 "扩大军工业 I"
 ENG_MILITARY_indus1_desc:0 "二战后国际格局瞬息万变，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 ENG_manufacture3:0 "扩大制造业 III"
 ENG_manufacture3_desc:0 "在恢复了主要工业产品的供应之后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 ENG_manufacture2:0 "扩大制造业 II"
 ENG_manufacture2_desc:0 "在恢复了基本消费品的供应之后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 ENG_manufacture1:0 "扩大制造业 I"
 ENG_manufacture1_desc:0 "虽然大不列颠本身已经是世界工厂，但世界大战已经严重损害了我国的基础工业，尤其是消费品制造。我们必须迅速恢复经济生产，以满足人民对消费品的需求。"
 ENG_construc:0 "经济建设"
 ENG_threat_africa:0 "在非洲部署战略威慑"
 ENG_threat_africa_desc:0 "强大的核武器将支持我们在该地区的军事行动并威慑敌对政权。"
 ENG_threat_me:0 "在中东部署战略威慑"
 ENG_threat_me_desc:0 "强大的核武器将支持我们在该地区的军事行动并威慑敌对政权。"
 ENG_threat_asia:0 "在远东部署战略威慑"
 ENG_threat_asia_desc:0 "强大的核武器将支持我们在该地区的军事行动并威慑敌对政权。"
 ENG_threat_europe:0 "在西欧部署战略威慑"
 ENG_threat_europe_desc:0 "强大的核武器将支持我们在该地区的军事行动并威慑敌对政权。"
 ENG_resign:0 "王室退位"
 ENG_communism_colonies:0 "推广社会主义"
 ENG_communism_gov:0 "社会主义政府"
 ENG_royal_law:0 "王室形象法"
 ENG_royal_law_desc:0 "如果不想成为下一个托马斯·莫尔，那么他最好对我们的陛下放尊重点。"
 ENG_social_control:0 "社会监视"
 ENG_expel_left:0 "驱逐左翼政党"
 ENG_anti_communism:0 "反共产主义"
 ENG_anti_communism_desc:0 "共产主义革命正在危害我们的社会秩序和国家利益，向大家宣布我们国家绝不容忍红色分子。"
 ENG_ban_union:0 "强制解散工会"
 ENG_strike_media:0 "敲打媒体"
 ENG_strike_media_desc:0 "《镜报》的读者是自以为在治理国家的人。《卫报》的读者是自以为应该治理国家的人。《泰晤士报》的读者是真的在治理国家的人，《每日邮报》的读者是治理国家的人的夫人，《金融时报》的读者是手里攥着国家的人，《晨星报》的读者是想把国家交给别国治理的人，《每日电讯报》的读者觉得我国正在被别国治理着。《太阳报》的读者不在乎谁治理国家，只要她有个丰乳肥臀就行。"
 ENG_avoid_struggle:0 "《免于冲突》白皮书"
 ENG_unenployee:0 "扩大失业保障"
 ENG_reduce_welfare:0 "削减福利"
 ENG_reduce_welfare_desc:0 "退休金和失业补贴把我们国家的年轻人变成一群懒鬼，许多人宁愿躺在家里拿救济金也不愿意出门找工作，严重拖累了正常的社会生产，必须把失业补助等各种无意义的救助金停掉。"
 ENG_Euro_market:0 "欧洲共同市场"
 ENG_scott_sutonomy:0 "苏格兰自治"
 ENG_ulster_sutonomy:0 "厄尔斯特自治"
 ENG_india_ocean:0 "保持印度洋驻军"
 ENG_limited_monarchs:0 "限制王室影响力"
 ENG_soviet:0 "改善苏联关系"
 ENG_soviet_desc:0 "与苏联的对抗并不有利于我们的利益，我们应该尝试与莫斯科改善关系，以维护欧洲的和平。"
 ENG_leave_NATO:0 "退出北约"
 ENG_leave_NATO_desc:0 "北大西洋公约并不是西欧自由国家的庇护伞，而是美国人施加在欧洲大陆身上的枷锁，大英帝国不会屈服于华盛顿的遥控，而是追求自主的政治和外交政策。"
 ENG_left_wings:0 "强化左派政府"
 ENG_LGBT:0 "LGBT问题"
 ENG_LGBT_desc:0 "随着嬉皮士运动带来性解放和完全颠覆宗教的性观念，曾被认为是怪胎的变性者和同性恋群体，也开始自称为性少数群体，要求得到政治权利。在选票面前，一些标榜进步主义的政党无论愿不愿意，也不得不与他们进行接触。"
 ENG_expanded_immigrate:0 "改善移民待遇"
 ENG_progressive:0 "进步主义"
 ENG_electronic_indus:0 "发展高新产业"
 ENG_weeken_beaur:0 "削弱事务官"
 ENG_strengh_beauracrat:0 "强化文官制度"
 ENG_strengh_beauracrat_desc:0 "首相总是一变再变，但行政部门里的政务官不会轻易更换，向行政部门和文官政府下方更多权力，可以确保政府总是又专业的官僚来领导，以保证施政效率。"
 ENG_bomber:0 "发展战术攻击机"
 ENG_all_missile:0 "导弹万能论"
 ENG_missile:0 "发展导弹"
 ENG_missile_desc:0 "导弹技术可能是20世纪最重要的军事发明之一，他最早诞生于二战德国的V2火箭，并在50年代的美苏争霸中完善。最早的导弹通过红外线热感应进行制导，通过接收目标反射的热光调整弹道，到了后来出现了电视制导和主动激光制导。导弹的应用相当广泛，它可以用于大型的弹道导弹，也可以用于制导炸弹，或步兵、车载的反坦克或反导导弹，它大大提升了军队的作战效率，但最大的问题就是——他太贵了。"
 ENG_carrier:0 "发展航母舰队"
 ENG_carrier_desc:0 "第二次世界大战的海上战争，航空母舰大放异彩。巨舰大炮的时代已被淘汰，舰载机将主宰未来地球70%的天空！"
 ENG_reduce_military:0 "削减国防开支"
 ENG_close_factories:0 "关闭亏损企业"
 ENG_limited_strike:0 "限制罢工权力"
 ENG_commercial:0 "发展金融业"
 ENG_pro_india:0 "保持南亚影响力"
 ENG_monpaton:0 "蒙巴顿方案"
 ENG_india_united:0 "统一的印度"
 ENG_india_problem:0 "印度问题"
 ENG_united_command:0 "三军联合参谋部"
 ENG_beatles:0 "接见披头士乐队"
 ENG_economic_policy:0 "新耶路撒冷"
 ENG_economic_policy_desc:0 "第二次世界大战的战火，将让英格兰民族在浴火中重生。工党政府在大战的最后一年赢得选举，建立新政府，此时的英国人民最需要的，是尽快从战争的摧残中走出，并获得和平、稳定和温饱的生活。克莱门特·艾德礼首相对此提出了新耶路撒冷为执政口号，承诺在战后的废墟中重建一个发达而繁荣的国家。"
 ENG_US_relation:0 "英美特殊关系"
 ENG_Post_war_revival:0 "战后复兴"
 ENG_Market_regulation:0 "新自由主义"
 ENG_Market_regulation_desc:0 "新自由主义者主张减少政府的行政干预，让市场自由运行从而刺激经济增长。政府的腐败、政治混乱和官僚主义使得他们无法有效管理经济，因此让市场无形的大手来促进经济系统自我调节才是最好的办法。政府干预越少，经济运行越好。"
 ENG_promote_privatization:0 "国企民营化"
 ENG_promote_privatization_desc:0 "我国国有企业在经济体制改革之后开始失去活力，无法应对日益激烈的市场竞争。为了使国企能够应对市场经济带来的冲击，我们将实行国企改革，使企业自主，自负盈亏。"
 ENG_Keynesianism:0 "凯恩斯主义"
 ENG_Keynesianism_desc:0 "凯恩斯主义是二战后英国经济学家凯恩斯提出的经济政策，其主要特点为政府行政干预、国有化、福利制度和通过公共支出刺激需求，从而减少贫富差距，促进社会平等和稳定。在二战后经济萧条、失业严重和社会平等思潮发展的背景下，凯恩斯主义为许多国家所采用。"
 ENG_nationalization:0 "国有化"
 ENG_nationalization_desc:0 "私有企业总是为自己的利益服务，并在无序的自由市场中疯狂膨胀，挤压中小企业，甚至被外国资本收买。我们应该将大企业国有化，将他们和他们的产业纳入政府的控制之下，从而确保企业本身和他们的产业能够服从政府指令，为我们的经济政策服务。"
 ENG_State_monopoly:0 "毕奇报告书"
 ENG_State_monopoly_desc:0 "毕奇报告书是70年代末英国政府推行的关于削减全国铁路网的政策，从而减少在逐渐衰落的铁路运输行业上的花费。"
 ENG_accept_marshall:0 "马歇尔计划"
 ENG_accept_marshall_desc:0 "请求美国政府提供军事、政治和经济援助。"
 ENG_NATO:0 "北大西洋公约"
 ENG_NATO_desc:0 "北大西洋公约组织是在自由世界成立的，目的是保护自由国家不受红色国家的入侵。加入他们，我们将得到独立和自由的保障。"
 ENG_massage_share:0 "情报共享"
 ENG_Cooperative_Operations:0 "联合军事行动"
 ENG_Cooperative_Operations_desc:0 "反对共产主义的斗争正在全世界爆发。我们应该派一些志愿者参加。一方面，我们要学习战斗的经验。另一方面，当我们遇到困难时，美国人也会愿意提供帮助。"
 ENG_welfare_State:0 "战后共识"
 ENG_welfare_State_desc:0 "战后共识是指二战后英国的经济外交政策底盘，即高税收、高福利、国有化的凯恩斯主义路线。英国历代政府，无论工党还是保守党都在战后的数十年间坚持这一路线，直至80年代被新自由主义取代。"
 ENG_education_reform:0 "教育改革"
 ENG_special_relation:0 "英美特殊关系"
 ENG_FRA_treaty:0 "英法合作条约"
 ENG_ECSC:0 "欧洲煤钢共同体"
 ENG_ECSC_desc:0 "法兰西的战后重建需要大量的资源，尤其是煤炭和钢铁。我们的殖民地恐怕无法满足我们的需求，因此我们向欧洲市场寻求合作。我们将与比利时、卢森堡、意大利、西班牙和德国谈判，降低关税，消除贸易壁垒，从而使欧洲各国之间更好地进行重要资源的贸易和市场开放。"
 ENG_WDR_relation:0 "英德关系正常化"
 ENG_defence_community:0 "欧洲防御共同体"
 ENG_Euro:0 "欧洲共同体"
 ENG_Euro_desc:0 "欧洲共同市场日趋成熟，我们不仅要强化欧洲各国在经济上的合作，政治、军事和社会政策也要高度协同，从而实现许多欧洲政治家一直以来都希望建立的欧洲共同体。"
 ENG_New_empire:0 "维持日不落帝国"
 ENG_New_empire_desc:0 "纳粹的入侵确实对我们造成了伤害，但要说大英帝国就此衰退，还是太早了。帝国依然有能力保卫我们的海外领地，尤其是我们的战后重建更加离不开海外领地的支持。保卫我们的遗产，镇压叛乱！Rule!Britania!"
 ENG_Euro_new_order:0 "欧洲新秩序"
 ENG_Eastern_threat:0 "东方威胁"
 ENG_Eastern_threat_desc:0 "随着纳粹的倒台和铁幕的落下，欧洲终究还是要面对自由世界和共产主义世界的新一次对抗。希特勒死了，也就没必要再与魔鬼结盟了。"
 ENG_Against_communist:0 "反对共产主义"
 ENG_against_Union:0 "打击工会"
 ENG_commonwealth:0 "英联邦"
 ENG_military_cooperation:0 "军事合作"
 ENG_1958_treaty:0 "英美共同防御协议"
 ENG_Southeast_asia_autonomy:0 "五国联防"
 ENG_Southeast_asia_autonomy_desc:0 "五国联防即英国、澳大利亚、新西兰、马来西亚和新加坡组成的军事防御共同体，目的在于对抗东南亚不断扩大的共产主义势力。"
 ENG_Africa_autonomy:0 "非洲自治"
 ENG_3ring_diplo:0 "三环外交"
 ENG_3ring_diplo_desc:0 "温斯顿·丘吉尔提出的英国在第二次世界大战后初期的外交战略。其主旨是企图通过英国在与美国、英联邦和联合起来的欧洲这三个环节中的特殊联系，充当三者的联结点和纽带，以维护英国的传统利益和大国地位。"
 ENG_Supporting_colonialism:0 "维持殖民地统治"
 ENG_loyal:0 "忠诚计划"
 ENG_intellegent_cooperation:0 "情报共享"
 ENG_nassau_treaty:0 "拿骚协议"
 ENG_nassau_treaty_desc:0 "是60年代初英美之间签订的核武器共享协议，美国协助英国建立核打击能力，英国则将自己的核武器置于北约一体化指挥系统下。作为协定的一部分，美国向英国出售了北极星潜射核导弹。"
 ENG_Arabs_fedarals:0 "阿拉伯联邦"
 ENG_Arabs_fedarals_desc:0 "阿拉伯联邦是英国在60年代初实行的殖民地自治计划，通过将北阿拉伯（卡塔尔、巴林、阿联酋）和南阿拉伯（南也门）各个保护国合并为两个联邦，实现阿拉伯地区在英联邦治下的独立。"
 ENG_wind_of_change:0 "变革之风"
 ENG_wind_of_change_desc:0 "变革之风是英国首相麦克米伦于1960年于开普敦发表的演说，该讲话承认了非洲风起云涌的独立运动，并承诺给予非洲殖民地自决权。变革之风标志着英帝国在非洲殖民统治的瓦解和新帝国主义时代的落幕。"
 ENG_atalantic_anlliance:0 "大西洋共同体"
 ENG_atalantic_anlliance_desc:0 "大西洋共同体是英美等西方国家主导的政策，支持欧洲“自由国家”与美国的经济和政治联合。"
 ENG_labour_reform:0 "劳动法改革"
 ENG_europe:0 "欧洲关系"
 ENG_puppet:0 "代理人政府"
 ENG_puppet_desc:0 "大英帝国当然不会如此轻易地放弃我们的遗产，我们可以在领地中物色一批政客，把他们变成我们的朋友，然后帮助他们进入政府，以此保持我们对这些独立后的领地的控制。"
 ENG_white_african:0 "支持白人政府"
 ENG_FVEY:0 "东南亚条约联盟"
 ENG_majority_rule:0 "多数统治"
 ENG_majority_rule_desc:0 "随着英国的非洲殖民地陆续独立，英国政府开始在独立前的殖民地推行“多数人口（即黑人）统治”，这既方便伦敦扶持黑人代理人政府，也能去除一些不服从英国管制的白人，如南非布尔人和罗德西亚白人。"
 ENG_Northern:0 "与北欧国家关系"
 ENG_brussele:0 "布鲁塞尔条约"
 ENG_CENTO:0 "中央条约组织"
 ENG_strong_government:0 "强权政府"
 ENG_royal_government:0 "女皇陛下的忠诚政府"
 ENG_salvation_government:0 "救国政府"
 ENG_queen_back:0 "王权归来"
 ENG_queen_back_desc:0 "上帝保佑吾王\n愿之万寿无疆\n天佑吾王！"
 ENG_colonist_cooparation:0 "殖民者的合作"
 ENG_NHS:0 "国民医疗服务体系"
 ENG_NHS_desc:0 "公共医疗产业的发展是影响一国人口结构和劳工质量的重要因素。如何能维护国民健康，也自古以来是一个政权成功与否的重要指标。"
 ENG_Monetary_policy:0 "货币主义"
 ENG_chulchil_plan:0 "丘吉尔计划"
 ENG_chulchil_plan_desc:0 "丘吉尔计划是温斯顿·丘吉尔在二战后提出的一个瓜分德国的计划，其中包括在德国西北部的汉诺威地区成立一个亲英政权。历史上汉诺威王室曾作为英国安妮女王的外甥统治英国，并将这两个地区统合。"
 ENG_Hannover:0 "统合北德意志"
 ENG_Hannover_desc:0 "随着我们在汉诺威地区站稳脚跟，我们将以此为基地，向欧洲腹地扩展我们的影响力。"
 ENG_london_treaty:0 "伦敦条约组织"
 ENG_HongKong:0 "驻守香港"
 ENG_HongKong_desc:0 "香港是我们在远东最重要的领地，无论是中共还是国民党都试图索取这一领土，但我们不会放弃。"
 ENG_Canton:0 "渗透广东"
 ENG_Canton_desc:0 "中国大陆正处于政治动荡当中，华南地区有大量的武装组织与当局对抗"
 ENG_euro_control:0 "欧洲霸权"
 ENG_euro_control_desc:0 "大英帝国从来没有放弃在欧洲大陆上站稳脚跟，从爱德华三世开始直到失去汉诺威，我们都不曾放弃在欧洲大陆拥有我们的一席之地！"
 ENG_war_on_france:0 "对抗法国"
 ENG_france_resistance:0 "支持法国分裂势力"
 ENG_take_netherlands:0 "胁迫低地国家"
 ENG_take_netherlands_desc:0 "我们要扩大我们在欧洲的控制力，荷兰和比利时作为我们的邻国和欧洲重要国家，理应纳入我们的控制。我们将向他们发布最后通牒，要求他们加入我们主导的阵营。"
 ENG_take_SPANISH:0 "胁迫伊比利亚"
 ENG_take_SPANISH_desc:0 "我们要扩大我们在欧洲的控制力，西班牙和葡萄牙作为欧洲重要国家，理应纳入我们的控制。我们将向他们发布最后通牒，要求他们加入我们主导的阵营。"
 ENG_Edward:0 "爱德华归来"
 ENG_cancel_westminst:0 "终结威斯特敏斯特体系"
 ENG_take_ire:0 "夺回爱尔兰"
 ENG_take_ire_desc:0 "爱尔兰人在数十年前通过一场叛乱脱离了大英帝国，但我们怎会放弃这片对英国来说最重要的领地？我们将再次采取行动收复爱尔兰，让爱德华和克伦威尔的旗帜再次飘扬在都柏林城堡！"
 ENG_devolution:0 "权力下放"
 ENG_blue_navy:0 "远洋海军"
 ENG_inflet_easteurope:0 "渗透东欧"
 ENG_electronic:0 "发展电子产业"
 ENG_electronic_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一，1948年ENIAC一条条电路板的运作标志着第三次科技革命的诞生。1960年代，随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。起初计算机只能帮助处理文书工作，但后期计算机有了更多功能，例如制图、传真、模拟和娱乐。计算机不仅可以帮助人们工作，对于80年代的许多国家来说，计算机还是经济腾飞的阶梯，亚洲的日本、韩国、台湾和中国大陆通过承接计算机制造业实现了经济的迅速增长。"
 ENG_right_to_buy:0 "住房计划"
 ENG_nuclear:0 "发展核技术"
 ENG_nuclear_desc:0 "核子裂变释放出来的能量摧毁了广岛和长崎，也将人类带入一个全新的时代。核技术有着巨大的运用价值，它可以制造毁灭性的可怕武器，也可以用来提供无尽的清洁能源，甚至运用到生物化学领域。\n原子能的释放改变了除人类思维方式以外的一切。\n——阿尔伯特·爱因斯坦"
 ENG_nuke_weapons:0 "飓风行动"
 ENG_nuclear_power:0 "发展核电"
 ENG_nuclear_power_desc:0 "核能不仅带来了军事上的可怕武器，也可以运用到民间。核子能发电不仅可以提供巨大的能源，并且相比化石能源污染更少。"
 ENG_anti_colonies:0 "反对白人政府"
 ENG_nuke_submarine:0 "发展核潜艇"
 ENG_nuke_submarine_desc:0 "强大的核动力发动机可以让我们的战略潜艇舰队航行至世界的每一个角落。"
 ENG_nuke_missile:0 "北极星战略导弹"
 ENG_nuke_bomber:0 "战略核轰炸机"
 ENG_royal_airforce:0 "发展皇家空军"
 ENG_royal_navy:0 "发展皇家海军"
 ENG_royal_navy_desc:0 "皇家海军为大英帝国带来了光荣和领土，为我们击败了拿破仑和纳粹的入侵。维护大英帝国的不能没有皇家海军，让现代科技为皇家橡树长出新的果实吧！"
 ENG_Sunningdale:0 "桑宁代尔协议"
 ENG_mounted:0 "强化皇家骑警"
 ENG_Duchronaigh:0 "黑棕部队"
 supress_IRE:0 "镇压爱尔兰共和军"
 supress_IRE_desc:0 "在《盎格鲁-爱尔兰协定》签署四十多年后，爱尔兰佬又一次嫌弃暴动，妄图血洗阿尔斯特的非天主教徒。我们将向北爱尔兰的圣公会和长老会同胞伸出援手，严厉镇压爱尔兰叛乱！"
 ENG_militarist:0 "发展现代军事"
 
