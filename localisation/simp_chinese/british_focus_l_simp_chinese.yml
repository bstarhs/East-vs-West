 ENG_invest_china:0 "投资中国"
 ENG_invest_china_desc:0 "中国大陆在改革开放之后，希望吸引外资投资，我们应该抓住这个机会，获取庞大的中国市场。"
 
 ENG_english_immigrate:0 "鼓励英裔移民"
 
 ENG_develop_pacific:0 "开发太平洋殖民地"
 ENG_develop_pacific_desc:0 "太平洋地区的海岛可以进行一定程度的投资，帮助他们发展渔业、经济作物和旅游业。"
 ENG_pacific_autonomy:0 "太平洋地区自治"
 ENG_pacific_autonomy_desc:0 "随着世界去殖民化浪潮的推进，太平洋地区的海岛开始寻求自治权，为了安抚民族主义情绪，我们可以尝试逐步将自治权下放给他们。"
 
 ENG_develop_indies:0 "开发印度洋殖民地"
 ENG_develop_indies_desc:0 "印度洋地区的海岛可以进行一定程度的投资，帮助他们发展渔业、经济作物和旅游业。"
 ENG_indies_autonomy:0 "印度洋地区自治"
 ENG_indies_autonomy_desc:0 "随着世界去殖民化浪潮的推进，印度洋地区的海岛开始寻求自治权，为了安抚民族主义情绪，我们可以尝试逐步将自治权下放给他们。"
 
