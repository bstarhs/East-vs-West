 egy.300.t:0 "埃及军队占领！"
 
 egy.300.t:0 "宣布与合并！"
 
 egy.310.t:0 "[FROM.GetName]提出与我国合并"
 egy.310.d:0 "尊敬的总统阁下：\n我谨代表[FROM.GetName]政府与人民，向您致以诚挚的问候。\n我国政府对您提出的阿拉伯民族主义，尤其是阿拉伯各国统一，建立一个联邦国家的主张完全认同，和埃及一样，我国也正面临着帝国主义的军事入侵，他们的威胁和军事力量十分强大，我国无法单枪匹马对抗他们，因此，推动阿拉伯国家联合起来，建立一个强大的联邦，对阿拉伯各国来说，都是有必要的。先知穆罕默德说过，一支箭容易被折断，而十只箭则不会被轻易折断，现在，请支持[FROM.GetName]与贵国合并为联邦国家，建立军事、政治和经济的共同体，以实现阿拉伯民族的统一和复兴！\n我们的代表团即将启程前往开拓，洽谈此事。"
 
 egy.311.t:0 "开罗方面接受了合并请求"
 egy.311.d:0 "[EGY.GetName]总统[EGY.GetLeader]在开罗热情接待了[FROM.GetName]的代表团，双方就两国实现合并一事进行洽谈，双方的对话十分顺利，就两国合并后的各项议程达成了共识。"
 
 egy.312.t:0 "开罗方面拒绝了我们的请求"
 
 
 
 egy.350.t:0 "一次外交宴会"
 egy.350.d:0 "开罗王宫的镀金大门豁然洞开，法鲁克一世肥胖的身躯挤进宴会厅，绣金腰带深深勒进绷紧的礼服。侍从刚呈上法国大使带来的松露鹅肝，国王的银叉已戳穿瓷盘。\n贵国的农业……该多种些这种小蘑菇。他咀嚼着满嘴食物对英国公使说话，蛋黄酱顺着下巴滴在绶带上。希腊大使瞠目结舌地看着国王用手抓取整条鲑鱼。侍酒官正要为宾客斟酒，法鲁克突然夺过酒瓶，仰头痛饮。暗红的液体浸透了他雪白的领巾，在拿破仑三世时期的波斯地毯上洇开污渍。\n身旁的仆从小心翼翼地提醒：这是外交礼仪场合......\n礼仪？国王掰开第七个蛋糕，奶油沾满戒指。朕就是礼仪！他突然把吃剩的杏仁饼掷向天花板，惊飞了水晶吊灯上栖息的鹦鹉。羽毛与糖霜纷纷扬扬落下时，意大利领事发现自己的勋章正被国王用来剔牙。\n宴会未过半，外交官们已纷纷告退。法鲁克独自坐在狼藉的餐桌前，用钻石纽扣刮着盘底最后的酱汁，对颤抖的侍从命令道：叫厨房再烤两只羊——刚才那些人都没动刀叉，肯定不合胃口。"
 egy.350.a:0 "一场闹剧。"
