 egy.214.t:0 "与埃及的会谈"
 egy.214.d:0 "总统阁下/n/n埃及共和国的新总统纳赛尔提出了雄心勃勃的阿斯旺大坝建造计划，并为此寻求外国投资。虽然纳赛尔有明显的民族主义倾向，但并非不可交流。我们可以向埃及派出一个代表团磋商，提出条件优厚的贷款方案，承诺为阿斯旺大坝提供巨额资金支持。然而，这项援助并非无条件。我们将明确要求埃及做出两项关键让步：第一，必须与以色列展开实质性和平谈判，显著减少边境军事冲突；第二，承诺加入美国正在积极筹建的“中东防卫组织”，以构建针对苏联的地区集体安全体系。"
 
 egy.215.t:0 "美国与埃及的外交会谈"
 egy.215.d:0 "近日，美国政府与埃及革命指导委员会主席纳赛尔领导的政府，就美国资助埃及修建阿斯旺高坝的关键项目进行了深入而艰难的磋商。这项旨在控制尼罗河洪水、提供巨大电力的超级工程，已成为双方政治与经济外交的核心议题。/n美方提出了一项条件优厚的贷款方案，承诺为阿斯旺大坝提供巨额资金支持。然而，这项援助并非无条件。美国明确要求埃及做出三项关键让步：第一，必须与以色列展开实质性和平谈判，显著减少边境军事冲突；第二，承诺加入美国正在积极筹建的“中东防卫组织”，以构建针对苏联的地区集体安全体系。/n对此，埃及方面展现了灵活而坚定的立场。纳赛尔政府委婉地表示，将埃以直接和谈作为获得援助的前提条件必须慎重考虑，认为这关乎阿拉伯国家整体的民族尊严与利益协调。然而，对于加入“中东防卫组织”的可能性，埃及并未完全关闭大门，而是提出了一个反提议：如果美国希望埃及加入该组织，则必须为此向埃及提供一笔大规模、高质量的军事援助，以实质性增强埃及自身的国防力量。"
 
 egy.216.t:0 "美国与埃及的协商未能达成共识"
 egy.216.d:0 "美国政府与埃及政府就美国拨款援助阿斯旺大坝一事未能达成共识，埃及拒绝美国政府提出的与以色列和谈，以及加入所谓中东防卫组织的要求。"
 
 egy.217.t:0 "美国与埃及签订援助条约"
 
 
 
 egy.220.t:0 "英国军队占领塞得港"
 egy.220.d:0 "英军的主力部队已在海空军的掩护之下，登陆并占领塞得港，塞得港市区沦为一片火海，埃及军队与英军爆发激烈交火！"
 
 egy.221.t:0 "以色列军队深入西奈半岛"
 egy.221.d:0 "在英军对塞得港发起猛攻的同时，以色列军队越过边境线，向埃及发起进攻，迅速攻破埃及军队的方向，进逼阿里什！"
 
 egy.222.t:0 "联合国召开紧急会议讨论苏伊士运河战争！"
 egy.222.d:0 "联合国大会今日召开紧急会议，就英国、法国和以色列三国对埃及发动的军事入侵行动进行激烈辩论。以苏联为首的社会主义阵营，联合众多新独立的亚非第三世界国家，对此次军事行动发起了猛烈抨击。各国代表在发言中一致谴责此次入侵是“赤裸裸的帝国主义与殖民主义侵略”，是逆历史潮流而动的“危险政治冒险”，严重违反了《联合国宪章》与国际法准则。/n在会议进程中，苏联率先提出了一项谴责英、法、以三国侵略行为的议案。由于英国作为安理会常任理事国行使了否决权，该议案未能通过。但紧接着，印度等国代表随即联合发起了第二轮谴责议案，将辩论与外交斗争推向新高潮，展现了国际社会多数成员对此次危机的严正立场。"
 
 egy.223.t:0 "[ROOT.GetName]表态支持埃及抵抗英国入侵！"
 egy.223.d:0 "[ROOT.GetName]驻联合国大使在今天的联合国大会上公开表示，支持埃及抵抗英国和以色列的入侵，谴责英国"
 
 egy.224.t:0 "[ROOT.GetName]宣布不会支持英国的军事行动"
 egy.224.d:0 "作为大英帝国的殖民领，在英国卷入与埃及的全面军事冲突之时，[ROOT.GetName]外交部却发表声明，不会介入苏伊士运河的军事冲突，不会派遣一兵一卒前往埃及参与战争，相反，[ROOT.GetName]呼吁英国政府遵守联合国大会的决议，呼吁尽快实现停火。"
 
 egy.225.t:0 "英国社会对军事行动发生激烈争论"
 egy.225.d:0 "在苏伊士运河战火燃烧的同时，火药味也从埃及蔓延到了英国国内。/n首相安东尼·艾登声称行动是为了保护英国的经济利益和遏制埃及总统纳赛尔的民族主义扩张。而工党强烈反对军事干预，在议会发起激烈辩论，谴责政府未经联合国授权擅自行动，并呼吁停火。工党领袖休伊·盖茨克尔甚至将艾登的政策与1930年代绥靖政策相提并论。/n《每日电讯报》、《每日邮报》支持保守党政府，认为纳赛尔是共产主义的傀儡，强调维护英国利益和对抗纳赛尔的必要性。《曼彻斯特卫报》、《每日镜报》和《泰晤士报》强烈批评政府，认为行动是灾难性的冒险。/n工党左翼、知识分子和大学生组织抗议活动，伦敦爆发反战集会。著名哲学家伯特兰·罗素等公开谴责政府。"
 
 egy.226.t:0 "英镑面临严重浮动"
 egy.226.d:0 "英国对埃及发动的军事行动激怒了国际社会，就连最坚定的盟友——美国，也放弃了对英国的支持。/n在联合国多次要求英军立刻停火无果后，美国宣布对英国进行经济制裁。美国政府在国际市场上大量抛售英镑，导致英镑的国际汇率出现大幅度波动。"
 
 egy.227.t:0 "苏联呼吁强势介入埃及局势"
 egy.227.d:0 "在英国多次忽视国际社会的谴责和联合国下达的停火命令后，坚决支持纳赛尔政府的苏联方面再次呼吁对英国进行更严厉的制裁和惩罚，并表示，如有必要，苏联将在获得联合国授权后，直接派遣武装部队前往埃及，支持埃及作战。苏联领导人甚至表示，不排除使用“特殊武器”的可能。"
 
 
