 egy.173.t:0 "阿斯旺大坝正式宣布竣工"
 egy.173.d:0 "经过近十年的艰难建设，今日，埃及领导人[EGY.GetLeader]在阿斯旺大坝控制中心的剪彩仪式上正式宣布，阿斯旺大坝建设正式完成！[EGY.GetLeader]在演讲中宣布，困扰埃及人民五千年的尼罗河将在现代科技的控制下，成为埃及现代农业的支柱，泛滥的阿赫特季和干旱的施姆季将成为历史名词。"
 
 egy.174.t:0 "就任埃及新政府总统"
 egy.174.d:0 "法老主义"
 
 egy.175.t:0 "埃及爆发革命！"
 egy.175.d:0 "埃及爆发了自由军官组织领导下的军事政变！以贾马尔·纳赛尔为首的军人控制了埃及政权，并宣布解散腐败无能的现政府，成立革命政府。"
 
 egy.176.t:0 "埃及爆发反英示威游行！"
 egy.176.d:0 "埃及多处城市爆发大规模示威游行，反对埃及政府的亲英政策以及英军在埃及，尤其是苏伊士运河地区的占领！"
 
 egy.177.t:0 "埃及总统纳赛尔去世！"
 
 egy.178.t:0 "英国宣布放弃苏伊士运河！"
 
 egy.179.t:0 "联合国要求苏伊士战争各方停火"
 egy.179.d:0 "[FROM.GetName]对英国军事介入苏伊士运河问题的行为非常不满，他们已经在联合国提出决议，要求英军撤出埃及。"
 
