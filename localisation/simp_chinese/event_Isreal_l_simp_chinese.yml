l_simp_chinese:
 isr.1.t:0 "巴勒斯坦与以色列独立"
 isr.1.d:0 "根据联合国的决定，1948年8月，英国正式宣布结束对巴勒斯坦地区的管辖权。以色列和巴勒斯坦这两个分别属于犹太人和阿拉伯人的国家诞生在这片土地上。但这一决定引起了争议——耶路撒冷是犹太人和穆斯林的圣地，最终被移交给了以色列，穆斯林对此极为不满。"
 isr.1.a:0 "至少犹太人不必再流浪了。"
 
 isr.2.t:0 "向以色列开战！"
 isr.2.d:0 "巴勒斯坦决议通过后，巴勒斯坦被分为两部分。犹太人不仅偷走了阿拉伯人的土地，还占领了圣城耶路撒冷！这是不能容忍的！我们必须夺回圣城，捍卫穆斯林的荣誉！"
 isr.2.a:0 "Allahu Akbar!"
 isr.2.b:0 "这与我们无关。"

 isr.3.t:0 "约旦占领耶路撒冷！"
 isr.3.d:0 "经过激烈争夺，约旦军队占领包括耶路撒冷在内的大部分约旦河西岸地区。"

 isr.4.t:0 "我们需要停火！"

 isr.6.t:0 "以色列占领耶路撒冷"
 
 isr.7.t:0 "以色列占领西奈半岛"
 
 isr.8.t:0 "美国提出和平协议"

 isr.9.t:0 "萨达特希望访问以色列"

 isr.10.t:0 "萨达特访问以色列"
 
 isr.11.t:0 "巴解组织的抵抗"
 isr.11.d:0 "巴勒斯坦解放组织在约旦河西岸重新集结了武装力量。"
 isr.11.a:0 "确定。"
 
 isr.12.t:0 "巴解组织的抵抗"
 isr.12.d:0 "巴勒斯坦解放组织在加沙重新集结了武装力量。"
 isr.12.a:0 "确定。"
 
 isr.13.t:0 "巴解组织的发动袭击"
 isr.13.d:0 "巴勒斯坦解放组织重新集结了武装力量，并对驻扎的以色列军队发起袭击。"
 isr.13.a:0 "确定。"
 
 isr.15.t:0 "以色列入侵！"
 isr.15.d:0 "以色列军队突然炮击了西奈半岛上的埃及驻军和戈兰高地上的叙利亚军队。然后庞大的以色列装甲部队越过边界发动了入侵！以色列军队指挥官摩西说，这次行动旨在消除阿拉伯国家对以色列边境安全的威胁。"
 isr.15.a:0 "The Middle East War broke out"
 
 isr.16.t:0 "代尔亚辛村大屠杀！"
 isr.16.d:0 "随着英国撤离巴勒斯坦，该地区以色列人与阿拉伯人的冲突激化。极端犹太组织伊尔贡试图攻占代尔亚辛村，并在这一过程中杀死一百余名村民。这一暴行激怒中东多个阿拉伯国家，阿以冲突有走向全面战争的蔚县。"
 isr.16.a:0 "The Middle East War broke out"
 
 isr.17.t:0 "以色列占领戈兰高地"
 
 isr.18.t:0 "镇压巴解组织的行动"
 isr.18.d:0 "我军对巴解组织的基地和部队进行了搜索与摧毁，取得了很好的战果，一些巴解组织已经被击溃，撤退到山地中，他们很长一段时间都不会再出现了。"
 isr.18.a:0 "Good."
 
 isr.19.t:0 "镇压巴解组织失败！"
 isr.19.d:0 "我们的部队发动了一次搜索行动，袭击了巴解组织，但他们失败了！巴解组织打败了我们的部队，缴获了许多武器！"
 isr.19.a:0 "Bad news."

 isr.20.t:0 "[FROM.GetName]宣布与以色列停火"
 isr.20.d:0 "[FROM.GetName]宣布接受联合国下达的停火命令，与以色列停止交战，双方部队已脱离接触。"

 isr.21.t:0 "苏联老兵参战"
 isr.21.d:0 "[FROM.GetName]宣布停止向以色列的进攻。"

 isr.23.t:0 "[FROM.GetName]宣布承认以色列国"
 isr.23.d:0 "[FROM.GetName]宣布承认以色列国的国家主权并与其建立外交关系。"

 isr.24.t:0 "美国宣布承认以色列国"
 isr.24.d:0 "美国总统[USA.GetLeader]宣布承认以色列国的国家主权并与其建立外交关系。"
 
 isr.25.t:0 "来自欧洲的移民已抵达"
 isr.25.d:0 "一批来自欧洲的移民已抵达特拉维夫港口。"
 
 isr.26.t:0 "以色列国防军成立"
 isr.26.t:0 "以色列政府宣布收编哈加纳、伊尔贡和莱希等民间武装组织，将其改编为正式的以色列国防军。"
 
 isr.30.t:0 "以色列被迫接受停火"
 isr.30.d:0 "在阿拉伯联军的进攻之下，以色列军队不断溃退，最终丢失了特拉维夫。在联合国干预下，以色列政府被迫与阿拉伯国家签订停战条约。阿拉伯国家因为西方国家干涉，勉强允许以色列保留巴勒斯坦西部沿海地区的土地，而其余地区全部被阿拉伯国家占领，此外，阿拉伯国家还强迫以色列签订了一系列条约，其外交和军事被严格限制。"
 
 isr.35.t:0 "以色列颁布《回归》法"
 
 isr.36.t:0 "以色列颁布《耶路撒冷计划》"
 
 isr.40.t:0 "表决联合国181号决议"
 isr.40.d:0 "联合国181号决议即将在联合国大会上进行表决，该决议将决定把巴勒斯坦分割为两个国家——阿拉伯人的巴勒斯坦国和犹太人的以色列国。"
 isr.40.a:0 "支持决议，我们认为让阿拉伯人和犹太人各自建国，是避免全面战争的唯一选择。"
 isr.40.b:0 "反对决议，我们认为让阿拉伯人和犹太人各自建国，意味着双方将爆发长期冲突。"
 
 isr.41.t:0 "联合国正式颁布181号决议"
 isr.41.d:0 "联合国181号决议经过联合国大会投票表决，正式宣布通过！\n该决议将决定把巴勒斯坦分割为两个国家——阿拉伯人的巴勒斯坦国和犹太人的以色列国。"
 
 isr.50.t:0 "动荡的巴勒斯坦托管地"
 isr.50.d:0 "嘭！！！！——\n一声巨响，停在巴勒斯坦托管地，海法英军警察局外的一辆轿车发生剧烈爆炸，轿车被崩上了天，警察局以遭到严重破坏。碎玻璃、碎纸散落一地，伤者在他人搀扶下走出燃烧的警察局。\n截止今天早上，英国方面宣布袭击已造成三人死亡，多人受伤。有理由怀疑，极端的巴勒斯坦犹太人准军事组织伊尔贡制造了这次袭击。\n\n英国政府在第一次世界大战后公布《备忘录》，公开同意在未来的巴勒斯坦建立一个独立的以色列犹太国，然而二战结束后，大量的犹太人逃离欧洲前往巴勒斯坦，这些犹太人与当地的阿拉伯人发生激烈冲突，并建立民兵组织进行袭击活动。英国为了不得罪自己的阿拉伯国家盟友，开始限制犹太人进入巴勒斯坦，这遭到了犹太民兵组织的强烈抗议。英国政府指责这些组织制造了袭击。"
 
 isr.51.t:0 "巴勒斯坦发生大规模暴动！"
 isr.51.d:0 "来自海法的紧急消息！\n驻扎在巴勒斯坦托管地的多个英国驻地遭到袭击！海法、耶路撒冷、特拉维夫、内坦亚和阿卡的多个地区爆发英军与犹太民兵组织爆发了激烈交火，整个巴勒斯坦火光冲天！\n伊尔贡组织的领袖梅拿赫姆·贝京宣布，该组织主导了这次袭击，以作为英国拒绝以色列独立建国的回应！"
 
 isr.52.t:0 "阿卡监狱发生暴动！"
 isr.52.d:0 "来自巴勒斯坦托管地阿卡城的消息！\n关押在犹太人暴动中关押的俘虏的阿卡监狱今早发生暴动和越狱事件，一名囚犯引爆了偷偷带入监狱的手榴弹，随后囚犯向监狱围墙发起猛攻。\n囚犯与狱警爆发了整整一天的战斗，最终有超过两百名囚犯逃离。\n英军在打扫战场后，逮捕了三名囚犯——阿夫沙洛姆·哈维夫、梅尔·纳卡尔和雅科夫·魏斯，他们因支持和协助这次越狱而被判处死刑。"
 
 isr.53.t:0 "伊尔贡杀死英国人质！"
 isr.53.d:0 "犹太人民兵组织伊尔贡绑架了英军中士克利福德·马丁和默文·佩斯，以报复英国当局处死策划阿卡监狱暴动的三名犹太囚犯。"
 
 isr.54.t:0 "联合国宣布介入巴勒斯坦事务"
 isr.54.d:0 "巴勒斯坦托管地，犹太人、阿拉伯人和英国人之间的血腥厮杀以引起国际社会的广泛关注。联合国特派调查团已进驻海法，准备就巴勒斯坦问题进行调查，并推动各方进行谈判。\n疲惫的英国政府似乎以及完全放弃处理巴勒斯坦的麻烦事了，伦敦已决定将这个烫手山芋完全甩给联合国。\n犹太人内部则出现了不同的声音，以犹太事务委员会理事长本·古里安为首的温和派寄希望于联合国支持以色列的建国，而以伊尔贡、莱希等极端的军事组织为代表的右翼完全不信任联合国，他们要求发动一场驱逐所有英国人和阿拉伯人的战争。\n埃及、外约旦和伊拉克则完全反对以色列的建国，他们不希望将伊斯兰教的圣地耶路撒冷交给犹太人，他们警告会采取军事手段干涉以色列问题。"
 
 isr.55.t:0 "181号决议引起强烈抗议！"
 isr.55.d:0 "联合国181号决议宣布巴勒斯坦分治的决定在巴勒斯坦遭到犹太人和所有人的强烈抗议！在英军积极准备撤军的同时，犹太人和阿拉伯人的准军事组织正在摩拳擦掌，积极备战！\n伊尔贡首领贝京强烈谴责联合国的背叛，他们指责西方国家将半个以色列出卖给阿拉伯人，伊尔贡及其盟友将采取一切必要手段，保护以色列的领土完整！\n而巴勒斯坦阿拉伯人领袖，大穆夫提·侯赛因亦谴责联合国的决定，他强调阿拉伯人不会允许以色列的成立，巴勒斯坦阿拉伯人将采取武力。"
 
 isr.56.t:0 "巴勒斯坦难民船遭到拦截"
 isr.56.d:0 "来自海法的报道\n英国军方在巴勒斯坦外海拦截了一艘装满四千名犹太难民的豪华游轮出埃及号，据调查这艘船由犹太民兵组织哈加纳所有，从法国出发，谎称去伊斯坦布尔而偷偷将来自欧洲多地的犹太人送往巴勒斯坦，其中两千余人持有哈加纳提供的虚假哥伦比亚护照，其余人没有任何身份证明。\n尽管犹太事务局表达了强烈抗议，但巴勒斯坦当局还是将这艘船只拦截，并将乘客全部送往海法的难民营。"
 
 isr.57.t:0 "以色列民兵与阿拉伯人爆发交火！"
 isr.57.d:0 "一支犹太人哈加纳民兵组织的车队在古什埃齐翁遭到阿拉伯民兵伏击，38人仅3人逃生……\n犹太民兵组织对阿拉伯人的萨萨阿村进行报复性攻击，60多人遇难……\n以色列共产党员摩西·帕尔斯坦在家中被刺杀，凶手不明……\n英国军队在希伯伦郊外发现三十多具尸体……\n\n以上是本报收集的上月巴勒斯坦情况，很显然，在181号联合国决议公布后，犹太人与阿拉伯人之间的血腥冲突不断恶化，一次全面战争已迫在眉睫。"
 
 isr.58.t:0 "犹太民兵的求援"
 isr.58.d:0 "尊敬的阁下：\n我们怀着沉重而急迫的心情向贵国寻求援助。巴勒斯坦的犹太社区正面临日益严重的生存威胁，阿拉伯武装团体频繁袭击我们的定居点，而英国当局的撤离将使局势进一步恶化。为保护妇孺与家园，我们急需武装自卫的能力。\n在此恳请贵国考虑以下援助方案：\n出售或援助至少两千支步枪及配套弹药，提供轻机枪及维修工具，支援通讯设备与医疗物资。\n这批武器将仅用于防御目的，并由受过军事训练的民兵严格管控。我们承诺所有装备不会用于进攻行动，且接受贵国监督。历史正迎来关键时刻，犹太民族即将重建故土。您的支持不仅将拯救无数生命，更将在新国家的基石上刻下贵国的友谊。请通过加密电报回复至耶路撒冷联络站，我们将安排秘密交接。\n此致 敬礼。     果尔达·梅厄"
 isr.58.a:0 "我们将提供有限的帮助。"
 isr.58.b:0 "夏洛克先生能用一磅肉抵债吗？"
 
 isr.60.t:0 "巴勒斯坦突击队的建立"
 isr.60.d:0 "埃及政府宣布，支持在加沙地区的阿拉伯巴勒斯坦难民，建立准军事组织，帮助他们保护加沙不被以色列入侵。以色列谴责这是一支以跨境袭击以色列为目的的恐怖组织。"
 
 isr.61.t:0 "以色列宣布进行反击性质的组织"
 isr.61.d:0 "以色列军方宣布建立武装突击队，以反击阿拉伯国家支持的巴勒斯坦准军事组织。"
 
 isr.62.t:0 "埃及军队与以色列发生交火！"
 isr.62.d:0 "来自塞得港的消息。埃及与以色列的边防军队在西奈半岛东部的埃以边界上发生激烈冲突！双方激烈交火，互有死伤。\n埃及政府指责以色列军方越境入侵，而以色列军方指责埃及支持的巴勒斯坦准军事组织发动了袭击。"
 
 isr.63.t:0 "内格夫沙漠公路发生武装袭击事件！"
 isr.63.d:0 "以色列25号公路发生一次恐怖袭击！一支由10名巴勒斯坦武装人员组成的小队向两辆民用车辆开火。袭击造成5名以色列平民死亡，1人受伤。\n武装分子首先用机枪扫射第一辆车，车上四名乘客全部遇难。随后，武装分子袭击了第二辆车。第二辆车上的一名乘客跳下车，试图逃脱武装分子的追捕，但同样被武装分子用机枪扫射致死。仅有一人——驾驶第二辆车的美国工程师——成功逃脱了事故。"
 
 isr.64.t:0 "内格夫袭击事件武装分子被捕"
 isr.64.d:0 "在内格夫沙漠公路袭击以色列巴士的武装分子在约旦被逮捕。"
 
 isr.65.t:0 "约旦国王下令释放武装分子"
 isr.65.d:0 "约旦国王下令释放在内格夫沙漠公路袭击以色列巴士的武装分子，以色列政府大为愤怒，他们宣称这表明约旦侵略和边境骚扰政策的延续。"
 
 isr.66.t:0 "以色列突袭约旦！"
 isr.66.d:0 "以色列军队发动了代号为“撒马利亚行动”的反击，以色列国防军袭击了位于泰加特堡的卡尔基利亚警察局。\n经过激烈的战斗，堡垒被炸毁。18名以色列国防军士兵在行动中丧生，68人受伤。约88名约旦人丧生，15人受伤。"
 
 isr.67.t:0 "以色列耶胡德村遭到袭击"
 isr.67.t:0 "巴勒斯坦敢死队对以色列耶胡德村一处平民住宅发动袭击，犹太妇女苏珊娜·金亚斯和她的两个孩子，一个3岁的女孩和一名半岁男孩被杀。\n肇事者的踪迹指向巴勒斯坦村庄兰蒂斯，该村庄当时处于约旦的控制之下，位于基比亚以北约五英里处。\n这次袭击震惊了以色列公众，因为这是第一次在以色列中部发生恐怖袭击，而且受害者是一名妇女和她的孩子，他们在睡梦中被杀害。"
 
 isr.68.t:0 "以色列的残酷反击"
 isr.68.t:0 "以色列国防军士兵发动了代号为“肖沙娜”行动的报复行动，该行动由阿里埃勒·沙龙指挥，以耶胡德袭击中丧生的三岁女孩命名。以色列国防军抵达奇比亚村，投掷手榴弹并向房屋的门窗扫射。然后炸毁了45栋房屋、一所学校和一座清真寺。大约60名平民被杀，其中大部分是妇女和儿童。"
 
 isr.70.t:0 "埃及破获重大颠覆阴谋"
 isr.70.d:0 "埃及政府今日宣布，其情报部门成功侦破并摧毁了一起由以色列策划的、旨在颠覆埃及社会稳定的重大破坏阴谋。据悉，共有12名以色列特工及本地线人在开罗和亚历山大港被逮捕。\n经审讯，被捕者供认，他们奉命在埃及境内针对英、美等外国侨民聚集的影院、邮局等公共场所实施一系列炸弹袭击。其险恶意图在于：将袭击事件嫁祸于埃及本土的民族主义组织，特别是穆斯林兄弟会，以期在国际上制造“埃及政局失控、极端主义泛滥”的假象。阴谋的最终目标，是挑动西方国家特别是英国对埃及实施外交与经济制裁，并为英国延长及强化在苏伊士运河区的军事存在提供借口。\n埃及政府对此表示强烈愤慨，并公开指控时任以色列国防部长的平哈斯·拉冯是这一阴谋的直接策划者。"
 
 isr.71.t:0 "情报和特殊使命局的成立"
 isr.71.d:0 "以色列政府今日正式宣布，将其原中央协调局重组并升格为总理直接领导下的“情报和特殊使命局”，简称“摩萨德”。\n这一重大机构改革旨在整合与强化以色列的情报能力，以应对当时日益严峻的安全挑战。新任命的局长罗文·希洛直接向总理本-古里安负责，其核心使命被明确界定为：在国外开展情报搜集与执行特殊任务，重点对抗巴勒斯坦武装组织的境外渗透与针对以色列目标的破坏活动。此举标志着以色列分散的情报体系有了一个统一、高效且权力高度集中的对外行动核心，预示着其国家安全战略将采取更为主动的姿态。"

 
 isr.75.t:0 "以色列沙弗里尔犹太会堂遭到袭击"
 isr.75.t:0 "以色列沙弗里尔犹太会堂发生一次恐怖袭击！一支由3名巴勒斯坦武装人员组成的袭击者从埃及入境，向农业社区的一座犹太教堂的学习厅开枪扫射，当时里面挤满了儿童和青少年。五名儿童和一名青年工作者遇难。"
