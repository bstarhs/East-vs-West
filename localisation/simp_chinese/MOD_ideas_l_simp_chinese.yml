 VIN_Trinh_ThiNgo_tool:0 "美军袭击越共根据地事件的成功率：§G-25%§W"
 
 ThiefEconomic:0 "盗贼统治"
 ThiefEconomic_desc:0 "随着独裁者建立了对全国的统治，该国的所有经济产业自然也被其纳入囊中。轻工业、重工业、经济作物都被纳入总统阁下的私人公司名下，阁下的家人、亲信、七大姑八大爷也从中分得一杯羹。"
 BannedEconomic:0 "废除经济"
 BannedEconomic_desc:0 "货币是资本主义的谎言，只要不发行货币，废除市场，以物易物，就不会有资本主义。工厂是剥削的象征，把工厂全砸了，就没有剥削了。政府是剥削阶级的工具，把经济部门全部废除了，资本家就死光了（大脑降级中，，，）"
 AncapitalEconomic:0 "无政府自由主义"
 AncapitalEconomic_desc:0 "政府形同虚设，市场掌握一切，财富衡量一切，自由的企业会用他们无形的大手管理整个国家。市场不灭，只是膨胀罢了，我是准备富得流油的。世界是你们的，也是我们的，但终究是市场的，你们企业家就像早晨八九点钟的太阳。"
 CatholicsEconomic:0 "教会管控经济"
 CatholicsEconomic_desc:0 "这个国家的经济权力已经被移交给教会，教会将根据圣经的引导指定经济政策。"
 
 hungarian_revolution_ideas:0 "匈牙利革命"
 hungarian_revolution_ideas_desc:0 "起来，匈牙利人，祖国正在召唤！\n是时候了，现在干，还不算太晚！\n愿意作自由人呢，还是作奴隶？\n你们自己选择吧，就是这个问题！\n——裴多菲·山多尔"
