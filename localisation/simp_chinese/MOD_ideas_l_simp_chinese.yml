 CHI_coast_blocked:0 "海路封锁"
 CHI_coast_blocked_desc:0 "国民党军失去了中国大陆，但还有海军在手中，蒋介石下令对中国大陆的沿海地区进行全面封锁，以阻断中共与其他国家的贸易，并默许军鉴攻击试图接近中国大陆的外国货船。"
