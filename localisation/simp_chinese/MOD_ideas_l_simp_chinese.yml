 Glasnost:0 "开放政策"
 Glasnost_desc:0 "新思维和加速改革正在为苏联带来进一步的政治开放和改革，但也带来了不确定性。"
 Chernobyl:0 "切尔诺贝利"
 Chernobyl_desc:0 "致命的核辐射泄漏几乎摧毁了切尔诺贝利核电站周围的土地，也摧毁了苏联政府的威望。"
 Cominform:0 "共产党和工人情报局"
 Cominform_desc:0 "以莫斯科为核心的将欧洲各国共产党联系起来的情报网，以方便苏联和各国共产党之间的情报收集和交换。"
