 FRA_Etrangere:0 "外籍军团"
 FRA_republique_legacy:0 "共和国革命的遗产"
 FRA_republique_legacy_desc:0 "自1789年以来，法兰西先后经历了十几次流血革命，建立了一个又一个共和国和帝国，最终在1870年第三共和国宪法确立了共和体制，在接下来的五十年中，法兰西共和国已经得到人民的认可，君主主义销声匿迹。"
 FRA_Vieille_Garde:0 "近卫军的荣耀"
 FRA_Vieille_Garde_desc:0 "让我们像一百多年前伟大的拿破仑皇帝和他麾下英勇无畏的近卫军一样征战吧！"
 FRA_napoleon_reback:0 "拿破仑王朝回归"
