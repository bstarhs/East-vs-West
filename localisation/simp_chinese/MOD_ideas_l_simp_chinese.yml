 FRA_immgrate_comeback:0 "移民回流"
 FRA_immgrate_comeback_desc:0 "法国失去海外殖民地后，大量来自前属地的侨民和归化者前往法国谋求新生话。"
 FRA_rightwing_revolt:0 "右翼暴动"
