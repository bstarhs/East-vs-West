 russian_ethnics_problem_desc:0 "苏联解体后，依然有大量的俄罗斯族裔居民在这个国家居住，他们的国籍和社会地位成为政府需要解决的问题。"
 yugoslavia_collape_ideas:0 "南斯拉夫的瓦解"
 yugoslavia_collape_ideas_desc:0 "南斯拉夫的崩溃给前南国家带来了政治混乱、经济崩盘和民族仇恨"
 USSR_collape_ideas:0 "苏联解体的余波"
 USSR_collape_ideas_desc:0 "超级大国的崩溃给前苏联国家带来了政治混乱、经济崩盘和民族仇恨"
 AUS_ger_identity:0 "奥地利-德国身份认同"
 AUS_ger_identity_desc:0 "同样的语言，同样的文化，同属于神圣罗马德国日耳曼族群的历史和近似的意识形态，使得许多奥地利人都曾经认为自己是德意志民族的一部分并促成了德奥合并。然而二战结束后，奥地利人开始重新审视自己的身份认同。"
 AUS_AUSI:0 "苏联的控制"
 AUS_AUSI_desc:0 "苏联军队控制着奥地利东部，他们牢牢控制着该地区的经济并有权对奥地利政府发号施令"
 AUS_occupied:0 "盟军占领奥地利"
 AUS_occupied_desc:0 "奥地利在二战前被德国吞并，二战结束后，她作为德国的一部分被盟军分区占领。"
