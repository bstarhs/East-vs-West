 terreur_ideas:0 "恐怖统治"
 terreur_ideas_ideas:0 "国民公会，以法兰西人民的名义声明，它坚定地意图以恐怖打击指向它的敌人，扩大范围指向它的盟友，而会公正的对待人民。\n——马克西米连·罗伯斯庇尔《六点声明》"
 
 FRA_milice:0 "反布尔什维克志愿兵团"
 FRA_milice_desc:0 "布尔什维克志愿兵团由反对共产主义的右翼分子组成，是致力于对抗赤色威胁的准军事团体。"
 FRA_boubor_debuff:0 "充满争议的波旁王朝"
 FRA_boubor_debuff_desc:0 "波旁王朝的统治者以反动和独裁而臭名昭著，自从查理十世倒台后，波旁家族再没取得过法兰西的王位，因此海梅一世的统治几乎不受法国人认可，更何况他现在是个西班牙人。"
 patria_familia_ideas:0 "上帝 祖国 家庭"
 patria_familia_ideas_desc:0 "忠于全能的上帝，忠于伟大的祖国，忠于自己的家庭，以此促进社会稳定，就是基督教保守主义者所理想的国家。"
