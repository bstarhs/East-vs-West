 McCarthyism_idea:0 "麦卡锡主义"
 McCarthyism_idea_desc:0 "我手里有一份名单，上面列有205名共产党员，国务卿已获悉他们都是共产党员，但他们仍然在国务院工作并参与制定政策……\n今天，我们正处于无神论共产主义与基督信徒之间的一场最后的全面战争之中。现代共产主义的拥护者们选择了这个时机，女士们，先生们，他们已经到了最后关头——他们真的到了最后关头。\n——约瑟夫·麦卡锡"
 
 common_female_right_modifier:0 "女性权益改革取得成功"
 common_female_right_modifier_desc:0 "在政府大力支持下，[FROM.GetName]的女性权益改革取得了巨大的进步，女性有机会走出家庭的束缚，获得投票权、受教育权和被选举权，参与到政治、经济和社会活动中。"
 
