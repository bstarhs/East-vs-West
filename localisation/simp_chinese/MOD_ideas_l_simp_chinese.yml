 CZE_experts:0 "捷克技术专家"
 CZE_experts_desc:0 "捷克专家团队将在电力设备、汽车、机床和航空技术方面为我们提供指导。"
 DDR_experts:0 "民主德国技术专家"
 DDR_experts_desc:0 "民主德国专家团队将在机械制造、光学仪器、化学和电子工业方面为我们提供指导。"
 ROM_experts:0 "罗马尼亚技术专家"
 ROM_experts_desc:0 "罗马尼亚专家团队将在石油开采、农业机械方面为我们提供指导。"
 POL_experts:0 "波兰技术专家"
 POL_experts_desc:0 "罗马尼亚专家团队将在造船、采矿机械、铁路机车方面为我们提供指导。"
 HUN_experts:0 "匈牙利技术专家"
 HUN_experts_desc:0 "匈牙利专家团队将在电器、通讯设备和制药方面为我们提供指导。"
 
 CZE_Benes_order:0 "爱德华·贝奈斯法令"
 CZE_Benes_order_desc:0 "随着第二次世界大战的结束，捷克人民对捷克斯洛伐克境内的德意志人恨之入骨，视他们为叛徒、入侵者和国家分裂的根源。爱德华·贝奈斯总统得到了英美苏三国的支持，决定对德意志人采取最终解决方案：全部驱逐。"
 CZE_unificate_gov:0 "联合政府"
 CZE_unificate_gov_desc:0 "苏联红军对捷克抵抗运动的支持和解放布拉格的成就，让共产主义在捷克斯洛伐克获得了巨大的声望，捷克共产党一举成为第一大党，但至少目前，捷克斯洛伐克依然是议会民主制度国家，因此共产党必须与右翼的民族社会党建立联合政府。"
 CZE_strike_crisis:0 "共产党罢工危机"
 CZE_strike_crisis_desc:0 "1948年的政治危机使得共产党面临失去政权的风险，捷共决定发起声势浩大的罢工运动和武装示威游行，迫使捷克政府就范。"
 
 ETH_lion_defenders:0 "卫国雄狮"
 ETH_lion_defenders_desc:0 "第二次世界大战中的卫国战争，为海尔·塞拉西一世带来了巨大的声望。现在，所罗门王的后裔将带领国家开始新的征程。"
 ETH_atze_army:0 "皇帝的失望"
 ETH_atze_army_desc:0 "军事政变彻底改变了埃塞俄比亚，皇帝对改革势力失去信任，而更加亲近军方和贵族。"
 SAF_goodhope_line:0 "好望角的复兴"
 SAF_goodhope_line_desc:0 "中东地区，尤其是苏伊士运河一带的政治动荡和军事冲突，使得国际航运寻求减少通过苏伊士运河的航路，南非好望角这条一百多年前的国际航路，迎来了复兴。"
 CAN_red_flags:0 "国旗问题"
 CAN_red_flags_desc:0 "带有米字旗的加拿大现国旗再次引起舆论热议，希望采用新国旗的法裔居民和希望保留红船旗的英裔居民争论不止。"
 YUN_resistance_army:0 "缅泰孤军"
 YUN_resistance_army_desc:0 "中国共产党占领中国大陆后，仍有一支忠于国民党的武装，进入缅甸境内，保存力量，等待反攻。"
 BUR_kmt_occupied:0 "缅泰孤军的入侵"
 BUR_kmt_occupied_desc:0 "缅泰孤军占据萨尔温江东岸，对缅甸来说，是一个巨大的威胁。"
 
 ROM_SovRom_company:0 "苏联-罗马尼亚联合公司"
 ROM_SovRom_company_desc:0 "苏联-罗马尼亚联合公司"
 ROM_micheal_under_control:0 "被控制的米哈伊尔"
 ROM_micheal_under_control_desc:0 "自从俄国人进入布加勒斯特，罗马尼亚便建立了一个特殊的政治体制：国家依然是君主立宪制度，年轻的米哈伊尔一世依然是国家元首，但实权掌握在苏联支持下的罗马尼亚共产党和农民党手中。出于稳定战后秩序的需要，共产党没有立刻推翻君主制，而是基于君主立宪制度组阁，但所有罗马尼亚人都清楚，这种制度不会长久。"
 
 VIN_anti_france:0 "抗法救国斗争"
 VIN_anti_france_desc:0 "法國人逃跑，日本投降，保大皇帝遜位，我們的人民已經粉碎了近百年來的殖民枷鎖而建立了獨立的越南……越南享有自由和獨立的權利，而且事實上已經成了一個自由和獨立的國家。越南全民族堅決地用全部精力、生命和財產來維護這個自由、獨立的權利！\n——胡志明"
 VIN_land_reforming:0 "土地改革风波"
 VIN_land_reforming_desc:0 "越南的土地改革将不可避免地动摇精英阶层的利益，包括地主、富农、知识分子和与法国有关系的人。过于激进的改革将打击中上阶层对越共的支持，而放缓改革则无法满足农民的需求和阶级斗争的纲领。越共领导人需要谨慎做出决定。"
 VIN_nhandan_newspaper:0 "人民报事件"
 VIN_nhandan_newspaper_desc:0 "苏联去斯大林化和中国百花齐放运动的影响蔓延至越南，以陈寅、陈丹为代表的知识分子创办《人民报》，公开提出政治自由化，挑战越南共产党的权威。"
 VIN_cultural_movement:0 "新文化运动"
 VIN_cultural_movement_desc:0 "越南共产党在文化和意识形态上发起一系列激进的改革，以消除封建、反动、亲法和亲美的思想，完成社会革命。"
 
 CYP_after_independent:0 "有代价的独立"
 CYP_after_independent_desc:0 "塞浦路斯人通过武装起义，赶跑了英国人，实现了国家的独立，然而，却未能解决岛上希腊人与土耳其人之间的矛盾。双方都希望获得塞浦路斯的主导权，作为妥协，塞浦路斯共和国宪法推举马卡里奥斯三世大主教为礼仪性的总统，而土耳其人则担任总理，毫无疑问，这种妥协无法在根本上解决塞浦路斯问题，这颗定时炸弹总会有爆炸的一天。"
 HK_handover:0 "中英香港问题联合公报"
 HK_handover_desc:0 "让海风吹拂了五千年\n每一滴泪珠仿佛都说出你的尊严\n让海潮伴我来保佑你\n你别忘记我永远不变黄色的脸"
 USA_national_hightway:0 "国家高速公路法案"
 
 MEX_revolucion_legacy:0 "墨西哥革命的遗产"
 MEX_revolucion_legacy_desc:0 "持续数十年的墨西哥革命战争以革命党的胜利告终，拉萨罗·卡德纳斯总统一手创造了基于革命制度党一党执政体制的墨西哥合众国。\n革命制度党巩固了革命成果，稳定了墨西哥政治局势，并通过石油国有化、社会改革和参加第二次世界大战获得了巨大的威望。由此，墨西哥迎来了一个黄金时期，墨西哥人民相信革命制度党能够为墨西哥带来进步和繁荣。"
 MEX_Masacre_de_Tlatelolco:0 "特拉特洛尔科大屠杀"
 MEX_Masacre_de_Tlatelolco_desc:0 "特拉特洛尔科广场的枪声震惊了墨西哥，军警的子弹杀害了示威的学生，也击碎了墨西哥的黄金时代。\n革命制度党没能解决腐败、贫富差距和独裁，反而无情地碾碎了民主运动，民众对革命制度党失去最后的信心，并寻求更激进的政治变革。"
 VEN_Puntofijo_doctrine:0 "Puntofijo协议"
 VEN_Puntofijo_doctrine_desc:0 "Puntofijo协议是委内瑞拉各政治势力，包括军方、民主行动党、基督教民主党和民主联盟等达成的共识，各方将共同致力于维护委内瑞拉的民主制度，合理协调各方矛盾，反对任何形式的独裁和政治暴力。"
 
 
 Marshall:0 "美国援助"
 Marshall_desc:0 "来自美国的援助将支持这个国家的发展。\n§W美国政府支持率：§Y[?THIS.US_gov_aid_opinion]§W\n美国舆论支持率：§Y[?THIS.US_public_aid_opinion]§W "
 
 NegroMovement:0 "黑人民权运动"
 NegroMovement_desc:0 "我们必须认识到，我们所追求的最终目标是一个和平的社会，一个能够凭良心生活的社会。\n——马丁·路德·金\n§W黑人运动激进指数：§Y[?USA.black_radical_var]§W\n白人暴力激进指数：§Y[?USA.white_radical_var]§W"
 NegroMovement_tool:0 "玩家必须在黑人民权运动相关的决议和事件中谨慎选择，确保黑人和白人的激进指数控制在一定范围，否则激进指数高的一方可能发起武装暴动（包括二者同时暴动）"
 
 JAP_jinmu_boom_ideas:0 "神武景气"
 JAP_jinmu_boom_ideas_desc:0 "通过美国援助、战争订单和制造业，日本以令人惊讶的速度从战争中恢复经济，并成为50年代经济增长最快的国家之一。日本取得的经济成就不仅令世界赞叹，也大大振奋了日本人从战争创伤中恢复的信心。日本媒体以日本第一位天皇，神武天皇的名字命名这一经济奇迹。"
 JAP_1960_renaval_plan:0 "国民经济倍增计划"
 JAP_1960_renaval_plan_desc:0 "国民经济倍增计划将通过投资公共设施和社会福利的方式，使得日本的国民生产总值的人均收入在10年内翻一倍。"
