 nasserism_idea:0 "阿拉伯主义崛起"
 nasserism_idea_desc:0 "民族主义席卷从巴格达到卡萨布兰卡的广大地区，阿拉伯人民支持反对帝国主义，实现阿拉伯独立和复兴的社会运动。"
