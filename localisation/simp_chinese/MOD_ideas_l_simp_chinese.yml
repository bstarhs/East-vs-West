 zastava_auto:0 "YUGO汽车"
 toyota:0 "丰田"
 ENG_labour_union:0 "强势的工会"
 mil_design_bureau:0 "米尔设计局"
 NORINCO:0 "中国兵器工业集团"
 changchun:0 "第一汽车制造厂"
 PRC_6th_machine_bureau:0 "第六机械工业部"
 PRC_4th_machine_bureau:0 "第四机械工业部"
 PRC_air_machine_bureau:0 "航空工业部"
 PRC_5th_machine_bureau:0 "第五机械工业部"
 NewDealCoalition:0 "新政联盟"
 NewDealCoalition_desc:0 "新政联盟是由支持罗斯福新政的既得利益者组成的选举联盟，包括银行业与工业巨头、工人阶级、南方白人和农民等。在新政联盟的支持下，民主党主宰了战后直到60年代末的美国政坛。"
 falangist_debuff:0 "西班牙内战的胜利者"
 falangist_debuff_desc:0 "在二战中的中立政策使得西班牙弗朗哥政权成为了少数存续到冷战时代的法西斯政权，这使得弗朗哥同时不受西方国家和社会主义国家的欢迎。"
 yugoslavia_crisis:0 "分裂危机"
 ROM_dacia:0 "达契亚汽车厂"
 PeoplesCommuni:0 "人民公社"
 PeoplesCommuni_desc:0 "人民公社是中国在50-70年代形成的一种基层农业组成形式，通过将小的农业合作社合并为大的公社进行集体化。人民公社起初进行按劳分配，后来改为“大锅饭”，即无偿分享劳动成果。人们认为这是进入共产主义的体现，但大锅饭鼓吹的绝对平均主义进一步恶化了缺粮。"
 PeoplesCommuni_tip:0 "增加一定的粮食生产，但也大大增加消耗需求。"
 Olympic:0 "奥运会"
 Olympic_desc:0 "这个国家已获得国际奥林匹克运动会的主办权并积极筹备，在这一时期，该国的社会和外交活动都将引起国际媒体的广泛关注。奥林匹克运动会，是和平的盛会，任何在奥运会期间发起战争的行为都将遭到国际社会的唾弃。\n\n奥林匹克运动会最重要的不是获胜，而是参与；人生最重要的不是胜利，而是奋斗；关键不在于征服，而在于奋力拼搏。传播这些原则，就是建设一个更强大、更勇敢、更重要的是，更严谨、更慷慨的人性。\n——皮埃尔·德·顾拜旦"
 miner:0 "矿产丰富"
 miner_desc:0 "这个国家有丰富的矿产资源。"
 corrupt:0 "腐败"
 corrupt_desc:0 "严重的腐败、无能和保守使政府效率低下。"
 isolated:0 "不被承认国家"
 isolated_desc:0 "该国不被国际社会承认和接纳。"
 muslim_protest:0 "穆斯林抗议"
 muslim_protest_desc:0 "政府倡导的改革激怒了保守的穆斯林民众，民众坚决抵制政府违背古兰经，试图发起现代化改革的行为，并频繁地发起了罢工、游行和示威。"
 
 welfare_laws:0 "社会福利政策"
 no_welfare:0 "无福利"
 no_welfare_desc:0 "屁民还想从官老爷手里拿到钱？"
 hight_welfare:0 "高福利"
 hight_welfare_desc:0 "政府将承包大部分公民的教育、医疗、养老和其他福利需求。"
 low_welfare:0 "低福利"
 low_welfare_desc:0 "政府至少能保证大部分群众的温饱，不至于饿死"
 mid_welfare:0 "中等福利"
 mid_welfare_desc:0 "政府承包公民最重要的医疗、教育和其他需求。"
 welfare_state:0 "从摇篮到坟墓"
 welfare_state_desc:0 "政府几乎包办了公民从出生到死亡，包括教育医疗就业的全部费用。"
 localism:0 "地方主义"
 localism_desc:0 "地方主义，即地方上的行政官员，优先以本地区的经济利益为主制定政策，并不惜与中央政府产生矛盾。"
 4_modernizations:0 "四个现代化"
 4_modernizations_desc:0 "四个现代化，即工业现代化、农业现代化、国防现代化、科学技术现代化，最早由周恩来提出，现在成为了中国改革开放政策的关键目标。文化大革命导致中国的发展落后了数十年，使中国在经济生产、军事装备等都落后于国际社会，中国的改革派将发展中心集中于提高科技水平上面，使得中国的科学技术，即可以制造出先进的武器保护自己，又可以制造出完善的消费产品，满足人民群众对建设小康社会的需要。"
 CHI_armor_center:0 "联勤"
 Lianqing60:0 "CSF 205厂"
 taiwan_separatism:0 "台独危机"
 taiwan_separatism_desc:0 "国民党政府对台湾异见人士的镇压、逮捕，钳制言论的行为引发台湾社会的强烈不满，独裁统治使一些台湾人从极端的方向寻找出路。台湾独立理论最早为台湾的亲日人士所提出，在试图说服美国人让日本重新治理台湾失败后，他们又主张通过让台湾独立建国来摆脱国民党的统治。"
 taiwan_construction:0 "十大建设"
 taiwan_construction_desc:0 "十大建设是蒋经国总统治理台湾其间的核心政策，由于担忧美国与中共的接触将使得美国放弃保护台湾，蒋经国决心将台湾建立为一个脱离美国依赖，并能够独立发展重工业、钢铁工业、冶金业、造船业和电子产业的亚洲工业强国，使自己有能力对抗中共的军事威胁。"
 white_terror:0 "白色恐怖"
 CHI_white_terror_desc:0 "台湾同胞，昨天我宣布临时戒严，我此刻以十二万分的诚意，告诉最多数的善良百姓，我之所以宣布戒严，完全是为了保护你们。你们千万不要听信奸人的谣言，有点疑惑，有点恐慌，对于守法的百姓，绝不稍加伤害。你们千万放心。\n——陈仪"
 white_ast:0 "白澳政策"
 KEN_african_independent:0 "茅茅运动"
 african_independent:0 "去殖民化"
 portugal_colony:0 "葡萄牙殖民影响"
 portugal_colony_desc:0 "尽管实现独立，但这个国家仍然受到来自里斯本的政治控制。"
 biritish_colony:0 "英国殖民影响"
 biritish_colony_desc:0 "尽管实现独立，但这个国家仍然受到来自伦敦的政治控制。"
 france_colony:0 "法国殖民影响"
 france_colony_desc:0 "尽管实现独立，但这个国家仍然受到来自巴黎的政治控制。"
 EdgarHoover:0 "埃德加·胡佛"
 
 assimilated:0 "同化政策"
 assimilated_desc:0 "所谓的少数民族，终究不是我们的同胞，他们信仰异教，说与我们不同的语言，他们的身份认同也必然与我们不一样，是潜在的叛乱隐患，必须将他们的文化、语言、宗教和生活习惯完全与我们同化。\n§R不承认§W少数民族权利\n允许§Y缓慢地同化少数民族§W\n§R民族政策只能通过国策修改§W"
 geonocide:0 "种族灭绝"
 geonocide_desc:0 "天生万物以养人，人无一物以报天。\n§R不承认§W少数民族权利\n§R可直接消灭少数民族§W\n§R民族政策只能通过国策修改§W"
 apartheid:0 "种族隔离"
 apartheid_desc:0 "一些不被接受的民族就应该呆在贫民窟中，不允许享受一般公民所拥有的权利。\n§R不承认§W少数民族权利\n§Y不允许同化少数民族§W\n§R民族政策只能通过国策修改§W"
 assimilation:0 "多元化"
 assimilation_desc:0 "我国是一个多元民族和多元文化的国家，各民族虽然文化语言不尽相同，但都有平等的地位。\n§G承认§W少数民族权力\n§Y不允许同化少数民族§W\n§R民族政策只能通过国策修改§W"
 harmonious:0 "国族主义"
 harmonious_desc:0 "我国虽然有多种文化和民族，但总体来说是一个大家庭，所有的民族都应该团结在一起，追求同一种价值观。\n§G承认§W少数民族权力\n允许§Y缓慢地同化少数民族§W\n§R民族政策只能通过国策修改§W"
 ethnics_laws:1 "民族政策"
 ##宗教##
 Sikhism:0 "锡克教"
 Sikhism_desc:0 "锡克教于15世纪由那纳克创立,锡克教上师提倡和平、平等和无私奉献的美德,经过他们一代代的努力,锡克教发展了起来。目前锡克教有超过两千万信徒,主要分布在印度的旁遮普地区。锡克教徒相信只有一个上帝,上帝没有任何物质形态,但每个锡克教徒都相信自己可以跟上帝对话,并且在上帝眼中,人人都是平等的。这是一个非常主张人人平等的信仰。\n锡克教徒因对他人慷慨而众所周知,他们宗教的首要信条之一是无论宗教、种族或性别,人人生而平等。不同于其他主流宗教,锡克教支持这一观点:为他人服务的行为比任何形式的仪式更重要。\n真理与和平高于一切,所以锡克教徒也一定会抵制不公正的行为,他们对所有受压迫的人提供支持。他们相信为了获得救赎,每个锡克教徒都必须进行有条理的冥想练习,因为只有通过这样的个人仪式和集中注意力在神上时,才能获得救赎。因此,锡克教徒身上有很多限制,包括他们不能剪头发,不能使用任何让人兴奋的物品,尤其是不能参加任何仪式、迷信和朝圣活动。\n§R官方宗教只能通过国策修改§W"
 Jewism:0 "犹太教"
 Jewism_desc:0 "普遍认为犹太教最早出现在大约3500年前是最早的一神论宗教之一,也是公元前6世纪前后几种巴比伦宗教共同进化的产物。按照拉比教派的说法,当“上帝的选民”从奴役中逃脱出来流浪于沙漠中时,德高望重的上帝在西奈山向摩西透露了他的法典和戒律内容。而且这些都被记录在了律法中(部分内容演变为基督教的《日约全书》);律法是《希伯来圣经》的基础。\n虽然数个世纪以来,拉比们一直对犹太教的核心教义争论不休,但犹太人坚持认为他们是与上帝签下契约的民族,而且上帝最终会派弥赛亚来将他们带回以色列。虽然有很多人自称弥赛亚,但对现代犹太人来说,真正的救世主至今尚未出现。虽然犹太人在历史上一直遭到迫害并散落世界各地,但犹太教却得以保存下来并日渐繁盛。犹太教信众约有1400万人,约占世界人口的0.2%。\n虽然有些固有差异,但犹太教很多方面都非常接近基督教和伊斯兰教,因为他们都被认为是“亚伯拉罕”宗教都来源于亚伯拉罕,此人是艾萨克(以色列人的祖先)和伊斯梅尔(穆罕默德的祖先)的父亲。。\n§R官方宗教只能通过国策修改§W"
 Momorn:0 "摩门教"
 Momorn_desc:0 "摩门教是流行于美国中部的一个基督教新教教派，正式名称为耶稣基督后期圣徒教会，其创始人为“先知”小约翰斯密。摩门教徒认为小约翰·斯密在1820年得到了神启，翻译了一批来自美洲原住民的文献并创作了《摩门经》，并重新翻译了英语圣经。摩门教徒奉《摩门经》和小约翰·斯密版本的《圣经》为典籍，认为上帝授权斯密及其继承人复兴原始耶稣教会的任务，因而自称“耶稣基督后期圣徒”。摩门教与其他基督教不同之处在于，摩门教徒反对原罪论，主张神有三位，以及饱受争议的多妻制度，这是由于摩门教徒在19世纪中叶遭到迫害导致的。此外由于小约翰斯密翻译的《魔门经》来自美洲原住民，因此摩门教徒认为美洲原住民就是圣经中上帝所赐福的民族，而美洲大陆就是上帝的应允之地。。\n§R官方宗教只能通过国策修改§W"
 Chinese_religional:0 "中国传统宗教"
 Chinese_religional_desc:0 "古老的中国传统民间信仰是一个非常复杂的体系，传统的中国宗教是一种多神宗教，这些神明既有象征自然的（北帝玄天上帝、东海龙王、土地爷）、有佛教神明（佛祖释迦牟尼、观世音菩萨、文殊菩萨、弥勒佛）、也有许多被神化的历史人物（关羽、岳飞、诸葛亮、妈祖）。中国的信仰体系可以追溯到4000年前的夏商时期，当时的人们为了向神明求问而进行占卜，太极八卦最早就是用于占卜的符号。公元前4世纪，中国哲学家孔子和老子分别创立了儒家和道家思想，儒家比起宗教更像一种政治意识形态，而道家认为道是一种世间万物都遵从的运行规则，他与占卜文化、祖先信仰融合形成了道教，道教认为人可以通过修行得道成为神明（或者认为一些历史人物就是神明的化身），因此使得许多历史人物被神化和崇拜。而到了5世纪，佛教在中国发展，又对中国宗教进行了影响。。\n§R官方宗教只能通过国策修改§W"
 Om_Shinrikyou:0 "奥姆真理教"
 Om_Shinrikyou_desc:0 "奥姆真理教是90年代出现在日本的一种邪教，由麻原章晃建立，麻原自己创造了一套缝合佛教、基督教和神道教的理论，自称为救世主，并对信徒进行洗脑和虐待。奥姆真理教在90年代进入鼎盛期，麻原章晃图谋推翻日本政府夺取权力，并制造了一系列恐怖袭击事件，例如1995年的东京地铁毒气事件，麻原因此事被逮捕后判处死刑，奥姆真理教也随之消失。"
 Shinto:0 "神道教"
 Shinto_desc:0 "神道教是日本的本土多神宗教，起源于古代日本的万物有灵论，神道教信仰“八百万神”，认为世界上绝大部分事物都可以被视作神明，既有象征太阳的天照大神，也有动物（捕捉老鼠的狐狸被称作稻荷神）、人物（日本天皇皇室被视为天照大神的后裔）甚至物体（付丧神）化作的神。神道教的象征便是日本全国随处可见的神社，日本全国有超过三千万座神社供奉各种不同的神明，包括臭名昭著的靖国神社，供奉旧日本帝国时期的军人。。\n§R官方宗教只能通过国策修改§W"
 Falun:0 "法轮功"
 Falun_desc:0 "法轮功是20世纪80年代在中国出现的一种新兴宗教，由退伍军人、气功学者李洪志建立。李洪志自创了一套基于中国传统医学“气功”的疗法，鼓吹患病者不吃药不就医，通过冥想和净食治疗疾病，这被证明是灾难性的。90年代末，在大量法轮功成员因营养不良死亡后，江泽民政府下令禁止法轮功，法轮功的幸存者逃亡美国，化身成为反对中国共产党的政治团体。"
 Shia:0 "什叶派"
 Shia_desc:0 "什叶派，或称“伊斯马仪”派，是伊斯兰教的一个重要分支。该分支拒绝承认哈里发的权威，而信仰先知穆罕默德的侄子侯赛因为领袖，并奉侯赛因及其十一位继承人为“伊玛目”宗教领袖。什叶派主张《古兰经》的解释权归伊玛目所有，可以根据社会发展情况和现实做出新的解释。。\n§R官方宗教只能通过国策修改§W"
 Secularism:0 "世俗主义"
 Secularism_desc:0 "随着工业革命和世界现代化的发展，宗教的作用和政治地位遭到了质疑，许多国家试图将宗教从政府机构和教育系统中剔除，从而保证国家能够顺利地走向现代化。。\n§R官方宗教只能通过国策修改§W"
 Buddhism:0 "大乘佛教"
 Buddhism_desc:0 "大乘佛教是佛教的一个重要支派，主要流行于中国、韩国和日本等东亚地区。佛教的核心哲学是轮回，人死亡后，灵魂又轮回重新投胎成为另一个人，像车轮一样转动不停。而只有像释迦穆尼佛祖一样修行悟道，成为佛，才能脱离轮回，寻得解脱。佛教建立之初更像是一种哲学，但随着佛教被亚洲封建王朝封为国教，释迦穆尼的形象便被神化，成为一种宗教。。\n§R官方宗教只能通过国策修改§W"
 Hinayana:0 "上座部佛教"
 Hinayana_desc:0 "上座部佛教又称“小乘佛教”，是佛教最最大的派系之一，分布于东南亚和南印度。上座部佛教否认释迦穆尼为“神明”，主张通过思考、探究和修行来达到觉悟成佛，而释迦穆尼则是悟道的导师。上座部佛教的信仰以《巴利三藏》为基础。\n§R官方宗教只能通过国策修改§W"
 Catholicism:0 "天主教"
 Catholicism_desc:0 "天主教是基督教最大最重要的一个教派，该教派奉罗马教宗为最高权威，理由是基督耶稣将象征天国权力的钥匙交给了门徒之一、第一任教宗圣伯多禄。数千年以来教宗领导下的天主教会一直是基督世界的最高权威，并拥有世界上最多的信徒。。\n§R官方宗教只能通过国策修改§W"
 EthiopiaChurch:0 "埃塞俄比亚正教"
 EthiopiaChurch_desc:0 "埃塞俄比亚是非洲最早接受基督教的国家，也是非洲唯一的正教国家。埃塞俄比亚人认为自己是圣经中士巴古国的后裔，他们的君主有所罗门王的血统，公元330年，来自叙利亚的传教士弗鲁门修斯为阿克苏姆国王埃扎纳进行洗礼，从此基督教成为埃塞俄比亚的国教，一直持续到海尔·塞拉西一世时代。埃塞俄比亚正教会教义较保守，规定只有圣洁、守斋满全，且行为端正的人可领圣体。\n§R官方宗教只能通过国策修改§W"
 Orthodox:0 "东正教"
 Orthodox_desc:0 "东正教是基督世界的第二大教派，主要流行于东欧、苏联地区和巴尔干半岛。东正教起源于11世纪君士坦丁牧首与罗马教宗的争执，双方在三位一体、圣餐礼仪和南意大利的影响力问题上争执不下，最终在1054年，双方互相开除教籍。此后以君士坦丁牧首为最高领袖的东正教会便在拜占庭帝国及其势力范围内传播，拜占庭帝国灭亡后，东正教的中心转移到了斯拉夫国家、高加索地区和埃塞俄比亚，俄罗斯帝国便以东正教徒的守护者自居，直到苏联建立。此外希腊、亚美尼亚、格鲁吉亚和非洲等地也有独立的东正教会。\n§R官方宗教只能通过国策修改§W"
 Anglicanism:0 "圣公会"
 Anglicanism_desc:0 "圣公会又称“安立甘宗”或“英国国教”，是英国宗教改革的产物。该基督教宗派源自于16世纪英国国王亨利八世与罗马教宗的对抗，最终导致亨利八世没收了教廷在英国的所有财产，以此建立了以英国君主为最高领袖的基督教派。圣公会同时存在新教和天主教的特征，只是把最高领袖从教宗换成了英国国王。一些不满圣公会中的天主教残余，谋求完全去除宗教领袖权威的下分支被称为“清教徒”。。\n§R官方宗教只能通过国策修改§W"
 Anti_religious:0 "禁止宗教"
 Anti_religious_desc:0 "人类历史上将宗教视为毒瘤，想要完全清除宗教的政治运动大有人在。19世纪，马克思-列宁主义、安娜其主义的出现为国家无神论提供了理论基础。十月革命后的苏维埃政权首先开始了对宗教势力的镇压（尽管实行了不久），冷战时期的多个共产主义政权也对宗教势力进行了各种各样的镇压政策。。\n§R官方宗教只能通过国策修改§W"
 African_religious:0 "非洲原始宗教"
 Sunni:0 "逊尼派"
 Sunni_desc:0 "逊尼派是伊斯兰教最古老最大的教派，也常自认为是伊斯兰教的正统教派。伊斯兰在阿拉伯语的意思是“服从”，其教徒称作“穆斯林”，意为“遵从真主意志的人”。伊斯兰教认为真主是世界上唯一的神明，其意志就是真理，真主曾派遣亚伯拉罕、耶稣等先知向人类传播意志，而穆罕默德是真主的最后一位先知，穆罕默德口授的真主意志便是《古兰经》，遵从《古兰经》是“五功”的一部分，此外此外礼拜、戒斋、天课、朝圣。6世纪阿拉伯帝国进入鼎盛时期，伊斯兰教传播到了东至中国、西至摩洛哥的广大地区，伊斯兰教鼓励教徒追求知识，因此阿拉伯帝国在当时远比欧洲文明许多，此外伊斯兰教认为犹太人、基督徒是《古兰经》里出现过的“有经者”，在中世纪时并不迫害他们，但随着18世纪西方国家崛起，伊斯兰教变得愈发保守、排外，并因有关女性的教义而受到批评。。\n§R官方宗教只能通过国策修改§W"
 Manichaeism:0 "摩尼教"
 Manichaeism_desc:0 "摩尼教是一种古老的诺斯替主义宗教，起源于萨珊王朝时期的波斯，由先知马尼创立并以他命名。摩尼教吸收了基督教、拜火教和佛教的教义，其核心是二宗三际论，即世界由两个本源：光明与黑暗组成，光明象征一切的善与正义，黑暗象征一切的恶与混沌。为了支持光明一派，摩尼教为信徒制定了诸多清规，包括不杀生、不偷盗、不奸淫等。摩尼教在三世纪到七世纪之间蓬勃发展，在其鼎盛时期是世界上最广泛的宗教之一。一些人认为摩尼教是基督教的一个异端分支，但摩尼教是一种独立宗教。。\n§R官方宗教只能通过国策修改§W"
 Bahai:0 "巴哈伊教"
 Bahai_desc:0 "巴哈伊教是一种脱胎于伊斯兰教什叶派的宗教，发源于19实际的波斯。19世纪初，一位名叫巴布的使徒创立了巴哈伊教，他主张所有的宗教的源头都是一样的，所有的宗教和信徒都将统一，而亚伯拉罕、耶稣、穆罕默德乃至释迦穆尼都是这统一宗教的信徒，而自己是最后一个。巴哈伊教主张众生平等，和平主义，支持种族和文化的多元性，主张减少奢侈的宗教礼仪，以简单的祈祷来认知和爱上帝。巴哈伊教很快获得了波斯民众的信仰，而巴布在1844年被杀害则导致了大起义，此后巴哈伊教在波斯和后来的伊朗被禁止至今，但巴哈伊教徒在其他的中东国家开枝散叶。"
 Druid:0 "德鲁伊教"
 Druid_desc:0 "德鲁伊教是古罗马时代分布在西欧的多个铁器文明的传统信仰，包括不列颠群岛的凯尔特人和法国的高卢人，这种信仰以万物有灵论为基础，信奉自然。该宗教的特点是以被称为“德鲁伊”的牧师为核心，他们能够与自然界的神明对话。根据罗马执政官尤利乌斯·凯撒的《高卢战记》记载，德鲁伊在凯尔特人社会中有很高的地位。在5世纪盎格鲁-撒克逊人入侵不列颠之前，德鲁伊信仰都是原住民的主流宗教。而在基督教化后，德鲁伊信仰也给爱尔兰和不列颠人留下了丰富的文化遗产，比如亚瑟王传说、风笛和万圣节。一些凯尔特人的后裔，比如爱尔兰人和布列塔尼人中的民族主义者甚至鼓吹回到德鲁伊信仰当中。"
 ArmaniaChurch:0 "亚美尼亚正教会"
 Lutheranism_desc:0 "亚美尼亚正教会是世界上最早的东正教会，该国也是最早将基督教定位国教的国家。亚美尼亚人认为该国西部的亚拉拉特山便是大洪水后诺亚方舟的靠岸之地，公元前301年，亚美尼亚国王梯里达第三世接受洗礼并皈依基督教。亚美尼亚教会坚持一性论，即基督的人性已完全融入神性。\n§R官方宗教只能通过国策修改§W"
 Lutheranism:0 "路德宗"
 Lutheranism_desc:0 "路德宗又称信义宗，起源于德国宗教家马丁·路德在1529年发起的宗教改革运动。路德宗的原则是“因信称义”，即坚持《圣经》为最高权威，只要信仰耶稣即可得救，否认教宗的权威和各种道德戒律。路德宗作为宗教改革后诞生的最大新教派别，不仅削弱了教宗的权威，推动各种独立教会的发展，还通过打击教权推动了欧洲近代民族主义的诞生。。\n§R官方宗教只能通过国策修改§W"
 Calvinists:0 "加尔文宗"
 Calvinists_desc:0 "加尔文宗又称长老会、归正宗，是瑞士宗教改革家约翰·加尔文创立的新教教派。加尔文主张因信称义，回归《圣经》，选举教会等，认为人的救赎早已由上帝决定，不为人的行为和意愿所移动。此外，加尔文教还否认了天主教对教徒参与经济活动的各种限制，这使得加尔文教在资本主义发展的16-17世纪影响力迅速扩大，并被荷兰和苏格兰定为国教，然而加尔文教对财富的鼓励和对预定论的定义，间接导致了殖民主义和殖民掠夺的发展，此外加尔文教更强调《圣经》的权威，一定程度上比天主教更加狂热。。\n§R官方宗教只能通过国策修改§W"
 Methodists:0 "卫斯理宗"
 Methodists_desc:0 "卫斯理宗是由英国宗教改革家约翰·卫斯理建立的新教教派，卫斯理最早是以反对加尔文宗活动的圣公会人士，脱离圣公会后开始传播自己的教义，包括遵守道德，约束生活等，因此又称循道宗。英国进入工业革命后，宗教仍是上层社会的生活，卫斯理抓住机会，首次向工人阶级传教，亲自在矿场为矿工传教，使得卫斯理宗借助工人阶级的力量迅速扩大。卫斯理教带有一种解放神学的色彩，他们反对战争、殖民主义和种族隔离，并在80年代领导了英国的反对核武器、抵制南非种族隔离等社会运动。。\n§R官方宗教只能通过国策修改§W"
 Jainism:0 "耆那教"
 Jainism_desc:0 "耆那教是一种起源于公元前7-5世纪的印度河流域的宗教，可以追溯到雅利安人进入印度前的古印度文明到吠陀时代。耆那教的哲学核心被称为Shramana，强调自我努力的必要性，以使灵魂走向神圣意识和解放。当代耆那教是一个规模较小但有影响力的宗教少数群体，对印度的伦理、政治和经济领域产生了重大影响。耆那教有着古老的学术传统，是印度宗教社区中识字率最高的。"
 Norse:0 "诺斯信仰"
 Norse_desc:0 "诺斯信仰即北欧信仰，是中古时代居住于北欧斯堪的那维亚地区、冰岛和德国北部的北日耳曼人的多神宗教，起源于北日耳曼人的自然崇拜，并通过刻有卢恩文字的石碑和口头传承下来。北欧信仰世界观的核心是世界树，连接着人界、神界和巨人世界等九个世界，神界被称作“阿嘉德斯”，居住着战神奥丁、雷神索尔等众神。北欧信仰的另一个核心是“众神的黄昏”，即众神之间的战争，战神奥丁为此建立英灵殿，将战争中战死的人类的英魂收入英灵殿，等到众神的黄昏时让他们为神二战。这种崇尚武力的信仰令古维京人在战斗中十分狂热，形成了令人闻风丧胆的北欧海盗。\n十三世纪基督教传入北欧后，北欧信仰逐渐被替代，但他仍然对今天的北欧乃至世界文化产生了影响，例如瓦格纳的歌剧《尼伯龙根之歌》，以及英语中的星期、东南西北等词汇都来自古代北欧众神的名称。"
 Hellenic:0 "古希腊信仰"
 Hellenic_desc:0 "希腊多神教是指在希腊时期和罗马帝国时期，生活在古希腊文化影响下的人们的各种信仰体系。古希腊人的信仰起源于公元前八世纪的迈锡尼、克里特古文明，并在《荷马史诗》的时代逐渐成型，历史上包括罗马人、迦太基人都受到过希腊宗教的影响。希腊宗教的诸神包括众神之王宙斯、智慧女神雅典娜、冥王哈德斯、以及阿波罗、波塞冬等大家耳熟能详的神明，而在罗马，宙斯被称为朱庇特。作为原始印欧宗教的变体，祭祀在希腊宗教中保持着重要的地位，希腊宗教在各种庙宇祭祀中制度化，通过祭祀获取对应的神的祝福，被称为“charis”（互惠恩典）。随着希腊人殖民南意大利，希腊宗教也传入意大利半岛，并成为罗马帝国的官方宗教，罗马式的希腊信仰深受本土的伊特里亚人和密特拉信仰的影响。公园3世纪，随着君士坦丁大帝确认基督教为罗马帝国的国教，古希腊诸神最终落寞，如今的希腊主要信仰东正教。"
 zoroastrian:0 "琐罗亚斯德教"
 zoroastrian_desc:0 "琐罗亚斯德教，又称拜火教或袄教，是起源于波斯的一种古老宗教，名称来源于其创立者琐罗亚斯德，他可能生活在公元前二世纪的米底帝国。琐罗亚斯德教是一种二元宗教，认为世界上的一切由光明和黑暗组成或化身，而光明和黑暗又化为正义与邪恶。琐罗亚斯德教的主神被称为阿胡拉·马兹达，他是正义与光明的化身，教徒们认为火是阿胡拉·马兹达的象征，因为火是那个时代人们唯一能获取的光源，因此琐罗亚斯德教将火焰视为神圣。琐罗亚斯德教是伊斯兰教传入之前波斯的官方宗教，波斯皇帝大流士一世在著名的贝希斯敦铭文中称自己“依照阿胡拉·马兹达的直译成为王”，伊斯兰教传入后，琐罗亚斯德教影响力逐渐减少但并未消失，在今天伊朗中部仍有许多琐罗亚斯德教社群。琐罗亚斯德教有一个充满争议的教义便是圣婚，即鼓吹血统纯正的近亲结婚。"
 egyptian_religion:0 "古埃及信仰"
 egyptian_religion_desc:0 "古埃及宗教是一个复杂的多神信仰和仪式系统，是古埃及社会不可分割的一部分。它集中于埃及人与众神的互动，这些神被认为存在于并控制着自然的力量和元素。古埃及的宗教活动多是为了供养众神并获得众神的庇佑，以埃及法老为中心。虽然法老是人类，但人们相信他是众神的后裔。他充当人民和众神之间的中介，并有义务通过仪式和祭品来维持众神，以便他们能够维持宇宙的秩序，也维护自己的权威，因此古埃及法老们经常大兴土木建造神庙。与许多古代宗教一样，一开始古埃及不同地区信仰不同的神明，被称为“Pesedjet”，但随着时间的推移，神的数量逐渐减少，最后主要有赫利奥波利斯，阿吞、、奥西里斯、伊西斯、塞特等神成为了主流。太阳神拉的崇拜在第五王朝期间获得了至高无上的地位，他的化身荷鲁斯和拉哈拉赫蒂也成为了主流。古埃及宗教的核心是对死亡的概念，古埃及人认为人死后会进入冥界，由阿努比斯称量自己的心脏，如果比罪恶的羽毛轻，就得以进入被称作“阿如”的天堂，古埃及人及其重视死亡的仪式，他们将逝者的遗体制作成木乃伊，并埋葬在尼罗河西侧（西侧是太阳落山的方向）的金字塔中。古埃及宗教在波斯帝国、亚历山大帝国和罗马帝国征服埃及后逐渐式微，并最终被基督教和伊斯兰教取代。"
 Tibetan_Buddhism:0 "藏传佛教"
 Tibetan_Buddhism_desc:0 "藏传佛教是流行于青藏高原和西伯利亚蒙古地区的一种佛教变体，他们由佛教金刚乘与西藏的本地文化结合产生。起源于公元6世纪吐蕃王松赞干布将佛教引入西藏后产生，并在八世纪莲花生大师入藏后完善。在十世纪吐蕃王朝崩溃后，西藏形成了以佛教教派为中心的割据势力，僧侣成为统治阶级，并先后建立了多个政权，其中萨迦派的领袖八思巴成为蒙古忽必烈汗的国师，因而藏传佛教也进入蒙古高原并流行。由于僧侣成为了西藏的统治者，为了维护统治，藏传佛教发展出了许多与佛教本身背道而驰的教义，例如鼓吹等级制度，甚至保留了西藏古老的活人祭祀。目前藏传佛教主流的教派是格鲁派，他们的领袖达赖喇嘛在十五世纪后统治西藏，此外还有噶举派（流行于不丹）等，藏传佛教的宗教领袖被尊称为“活佛”或“仁波切”，他们，他们的继承由“转世”决定。。\n§R官方宗教只能通过国策修改§W"
 Ibadism:0 "伊巴德派"
 Ibadism_desc:0 "伊巴德派是伊斯兰教仅次于逊尼派、什叶派之后的第三大教派，他们认为如果没有合适人选，那么伊斯兰教并不需要哈里发或伊玛目来领导，因此他们既不承认阿布·巴克尔的哈里发后裔，也不承认阿里·侯赛因的伊玛目。目前伊巴德派主要流行于阿曼。"
 Hinduism:0 "印度教"
 Hinduism_desc:0 "印度教又称婆罗门教，是流行于南亚、东南亚地区的古老宗教，也是佛教、耆那教的原型。印度教主要有梵天、毗湿奴、天女、湿婆等神明，其中梵天是最高神。印度教的核心是种姓制度，他将人分为四个阶级——婆罗门、刹帝利、吠舍和首陀罗，其中首陀罗是最低级的奴隶阶级，印度教鼓吹信徒通过修行等宗教活动提升自己，从而争取来世转世成为上等阶级。印度教曾广泛流行于南亚次大陆和东南亚，现在仍然是印度最大的宗教，印度教曾经创造了灿烂的文化，但其种姓制度一直被人们所诟病，佛教和耆那教便是在反对种姓制度的斗争中形成的，如今的印度政府也一直在试图消除种姓制度，但却不成功。。\n§R官方宗教只能通过国策修改§W"
 Polynesian_religion:0 "波利尼西亚信仰"
 Polynesian_religion_desc:0 "在波利尼西亚大三角的原住民中，通常共享许多基本信仰概念，如“马纳”和“塔普”，并具有类似的神话周期。该宗教是多神教，但也信奉万物有灵论；灵魂也存在于非人类和动物、海浪和天空等物体中。在夏威夷，众神被称为“阿图亚”，四位最著名的神“卡哈”，分别是凯恩（创造者）、库（战争）、洛诺（农业）和卡纳罗亚（海洋）。这些神的同源物在整个东波利尼西亚群中具有相似的。“马纳”是一种神圣的、非个人的力量，渗透着整个宇宙。拥有“马纳”就是拥有影响力、权威和效力；在特定情况下执行的权力。这个词的意思很复杂，因为玛纳是波利尼西亚世界观的基本基础。“马纳”是精神能量的一种形式，也是一种治疗力量，可以存在于场所、物体和人中。某些地方被认为拥有强大的法力。塔普/卡普可以被解释为“神圣的”，并扩展为“精神限制”或“隐含禁止”。本质上，它代表了生活方式、性别角色、政治和宗教中普遍存在的法律法规行为准则。卡普制度在夏威夷一直沿用到1819年，当时卡迈哈梅哈二世国王与他的母亲基奥波拉尼和父亲的王后卡阿胡马努通过与宫廷女性共享一顿禁食的象征性行为废除了卡普制度。卡普制度的废除也可视为夏威夷群岛传统宗教的终结。"
 Andes_religion:0 "安第斯原住民信仰"
 Andes_religion_desc:0 "在整个南美洲安第斯山脉的原住民中分布着许多信仰，例如地球母亲Pachamama和创世神Viracocha，大多数宗教都有共同的特征。安第斯信仰在印加扩张之前往往高度本地化，表达族群的祖先起源。印加帝国拓张后，通常接纳甚至吸收当地的神灵，但他们也控制宗教，以增强帝国的凝聚力。被征服的民族必须将印加神纳入当地的宗教社区。印加领导人鼓励崇拜太阳神Inti，并将其主权强加于其他信仰，如Pachamama。当地的宗教信仰以“Huacas”的形式持续存在，这种形式在整个印加帝国都很普遍。Huacas是居住在自然物体中的神化实体，如山脉、巨石、溪流、战场以及任何与过去印加统治者有关的地方。Huacas也可能是无生命的物体，如陶器被认为是承载神灵的容器。部落中的宗教领袖会通过祈祷和供品与Huacas沟通，寻求建议或帮助。安第斯世界观的一个突出主题是宇宙的二元性。神既有积极的一面，也有消极的一面，宇宙中的一切事物都有互补的一面；阳间和阴间。"
 Australian_religion:0 "澳洲原住民信仰"
 Australian_religion_desc:0 "Tjukurpa是Pitjantjatjara土著语中的“梦”一词，是土著澳大利亚人万物有灵论创作叙事中的一个术语，用于个人或群体创作，也可理解为形成性创作和永久性创作的“永恒时间”。它在Yankunytjatjara被称为Wapar。梦可以被视为创造的化身，赋予一切意义。它为土著人民确立了管理人民、土地和一切事物之间关系的规则。“梦”也经常用来指个人或群体的一系列信仰或精神。例如，一个土著澳大利亚人可能会说，他或她做过袋鼠梦、鲨鱼梦、蜂蜜蚂蚁梦，或与他们的“国家”相关的任何梦的组合。在土著人的世界观中，每一个事件都会在土地上留下一个记录。自然界中的一切都是原型生物过去、现在和未来行为的结果，他们的行为正在不断创造世界。虽然欧洲人认为这些文化祖先是神话，但许多土著人相信他们现在和未来的文字存在。特定地方和生物的意义和意义与它们在梦中的起源紧密相连，某些地方具有特定的力量，土著人称之为梦。在这个梦想中，居住着地球的神圣。"
