 PER_reneval_soroastic:0 "拜火教复兴"
 PER_reneval_soroastic_desc:0 "光明之神阿胡拉·马兹达啊，智慧的主赐予他所爱的人类——我的子民——来自真理和力量的快乐礼物。所有人都会团结起来，捍卫你的教诲，捍卫那些铭记你赞美诗的人。让所有行善的人团结起来，共同养育地球母亲。——《阿维斯陀》"
 state_modifier_kanr_broken:0 "损坏的坎儿井"
 state_modifier_kanr_broken_desc:0 "坎儿井因缺少维护而无法使用。"
 state_modifier_kanr:0 "坎儿井"
 state_modifier_kanr_desc:0 "坎儿井是一种起源于伊朗高原，广泛运用于中亚、西亚和北非的古老灌溉系统，发源自公元前六世纪的米底王朝。西亚和中亚的山地地区会形成冰雪融化带来的季节性河流，但淡水会因为蒸发或渗入地下而无法使用。坎儿井是一种复杂的地下沟渠，可以将渗入地下的淡水收集起来使用并灌溉农田。在没有现代化水利系统的地区，坎儿井为当地的民众和耕地提供了珍贵的水资源。"
 PER_latinized_farsi:0 "拉丁化波斯文"
 PER_latinized_farsi_desc:0 "伊朗政府已将波斯文从阿拉伯字母改为拉丁字母，这将大大提高民众的识字水平和社会工作效率。"
 PER_ally_occupied:0 "同盟国的影响"
 PER_ally_occupied_desc:0 "为了防止伊朗倒向纳粹德国，英国与苏联入侵伊朗并控制了该国，即使二战结束，英苏依然牢牢控制着伊朗的政治局势。"
 PER_jabheye_melli_ideas:0 "不稳定的共和国"
 PER_jabheye_melli_ideas_desc:0 "礼萨·巴列维国王逃亡国外，穆罕默德·摩萨台和他的伊朗民族阵线接管政权，成立了不稳定的临时政府。"
 PER_after_coup:0 "伊朗政变的影响"
 PER_after_coup_desc:0 "摩萨台的倒台和英美的政治干涉，给伊朗带来了巨大的政治不稳定。"
 
 FRA_left_union:0 "法国左翼联盟"
 FRA_left_union_desc:0 "法国社会党、法国共产党和国民共和运动组成三党执政联盟。"
 CSA_shounting:0 "南方叛吼"
 CSA_shounting_desc:0 "Hurrah! Hurrah!\nFor Southern rights, hurrah!\nHurrah for the Bonnie Blue Flag that bears a single star."
 KKK_Revolt:0 "白人种族主义暴动"
 Blakcs_Revolution:0 "黑人解放军革命"
 KKK_ideas:0 "白人种族主义复兴"
 jimmClound_ideas:0 "吉姆·克劳法案"
 jimmClound_ideas_desc:0 "虽然美国内战终结了奴隶制，但针对黑人权力的限制依然广泛存在。重建时期南方通过的一系列法案确定了“隔离但平等”原则，黑人和白人所使用的公共设施，就读的学校被分离，不同种族所使用的设施往往质量相差极大，本质上白人与有色人种依然存在严重的社会等级。"
 LeopoldCrisis:0 "国王危机"
 LeopoldCrisis_desc:0 "利奥波德三世在二战中的亲纳粹倾向使其成为比利时的众矢之的，国王的去留成为比利时战后的政治斗争中心"
 korean_christ:0 "韩国基督教会"
 korean_christ_desc:0 "基督教在十九世纪传入韩国并受到知识分子和上层阶级欢迎。在日本统治时期，基督教进步人士主导了独立运动，而当韩国在美国支持下获得独立后，基督教便在韩国社会中获得了巨大的影响力。"
 korean_culture:0 "等级文化"
 korean_culture_desc:0 "新罗王朝的骨品制、朝鲜王朝的两班制和来自中国的儒学思想影响下，韩国人极为注重社会等级制度，每个人都应该做出符合自己身分的行为。"
 rok_parliament:0 "国会议员的权利"
 rok_parliament_desc:0 "韩国的国会议员拥有巨大的政治权力，他们把控社会经济预算和法案的审核并以此谋取利益，即使是军政府时期也如此。"
 kor_industrial_pionners:0 "工业尖兵"
 kor_industrial_pionners_desc:0 "朴正熙总统呼吁所有公民都为国家的工业发展和现代化做出贡献，成为优秀的工业尖兵"
 LeiFengIdeas:0 "学雷锋"
 Dryzhpa_oilpipes:0 "友谊输油管"
 Dryzhpa_oilpipes_desc:0 "苏联通过经互会友谊输油管向东欧输送能源，当然莫斯科有权随时中止输送。"
 PRC_SOV_fleets:0 "中苏联合舰队"
 PRC_SOV_fleets_tool:0 "如果中苏关系恶化，海军发展将停滞\n如果中苏一起对某国开战，苏联将获得解放军海军控制权"
 four_clears:0 "四清运动"
 four_clears_desc:0 "四清即清政治，清经济，清组织，清思想。毛泽东认为，如果要清除经济工作中的腐败行为，必须还要从政治工作入手。"
 three_anti_idea:0 "三反运动"
 three_anti_idea_desc:0 "三反运动即反对贪污、反对浪费和反对官僚主义。毛泽东希望一次整治中共党内可能出现的腐败行为，避免成为新的封建王朝。"
 Dazhai_idea:0 "农业学大寨"
 Dazhai_idea_desc:0 "山西省大寨县通过改造自然环境取得了惊人的粮食产量。毛泽东对此非常赞赏，并希望推广全国。"
 Dazhai_idea_tool:0 "农场建造速度将在短时间内迅速增加，但后续将带来隐患。"
 Products_sattlite:0 "高产放卫星"
 Products_sattlite_desc:0 "“放卫星”是指各个农场对外公布自己的生产目标和产量，这些目标往往是令人惊叹的天文数字，比卫星还要高。"
 Products_sattlite_tool:0 "粮食产量将在短时间内迅速增加，但后续将带来隐患。"
