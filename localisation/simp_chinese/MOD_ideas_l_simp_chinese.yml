 propataria_communie_ideas:0 "无产阶级专政"
 propataria_communie_ideas_desc:0 "人民公社将不再是资产阶级式的国家机器，而是集体领导下的无产阶级国家，人们将以民主形式选举出公社委员会来管理行政事务。"
 students_communie_ideas:0 "学生自治委员会"
