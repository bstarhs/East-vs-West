 FRA_policia_afrique:0 "非洲宪兵"
 FRA_policia_afrique_desc:0 "法国武装力量继续在非洲大地上作战，以保护巴黎在非洲的代理人。"
 FRA_paris_communie_ideas:0 "巴黎公社的遗产"
 FRA_paris_communie_ideas_desc:0 "起来，饥寒交迫的奴隶！\n起来，全世界受苦的人！\n满腔的热血已经沸腾\n要为真理而斗争！\n旧世界打个落花流水\n奴隶们起来，起来！\n不要说我们一无所有\n我们要做天下的主人"
 FRA_culure_revolution:0 "毛泽东思想照耀法兰西"
