 tycoon_ideas_desc:0 "苏联解体后，原苏共官员利用权力霸占了国有资产并建立私人企业，从而形成了庞大的寡头资本。"
 food_note_ideas:0 "票券体制"
 food_note_ideas_desc:0 "中共政府通过票券来控制消费品供给，群众必须持有粮票、布票等才能购买物品。"
 food_limited_ideas:0 "物品配给制"
 food_limited_ideas_desc:0 "政府通过粮票来控制消费品供给，群众必须持有粮票、布票等才能购买物品。"
 reformed_tech_bureaucrat_ideas:0 "专业的技术科研体制"
 reformed_tech_bureaucrat_ideas_desc:0 "我国的科研机构由专业的技术人员组成，让专家而非官僚参与和管理科学研究，控制政治因素对科研的影响，才能让科学发展发挥出最大的能力。"
 reformed_bureaucrat_ideas:0 "改良的官僚体制"
 reformed_bureaucrat_ideas_desc:0 "计划委员会由专业的经济学家和统计学家组成，以确保计划委员会能够最大限度地发挥能力。"
 ogas_4_ideas:0 "自动化互联网计划体制"
 ogas_4_ideas_desc:0 "我国的所有生产单位和生产资料均已接入互联网，并通过超级计算机进行快速运算和管理，我国的社会生产和经济能力在计算机管理下得到极快的发展。"
 ogas_3_ideas:0 "发达互联网计划体制"
 ogas_2_ideas:0 "普及互联网计划体制"
 ogas_2_ideas_desc:0 "我国的许多生产单位一开始普及计算机和互联网，不仅大大提高了生产效率和管理，且大大改善了生产单位之间的配合及计划委员会的管理和计算效率。"
 ogas_1_ideas:0 "基础互联网计划体制"
 ogas_1_ideas_desc:0 "我国的一部分生产单位已开始使用计算机和互联网，并以此改善生产效率、生产计划和生产管理。"
 work_communie_ideas:0 "反怠工委员会"
 work_communie_ideas_desc:0 "反怠工委员会将监督和惩罚没有完成生产计划的工人。"
 food_collect:0 "余量收集制"
