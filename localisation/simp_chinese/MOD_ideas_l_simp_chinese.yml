 MAL_constitution_153:0 "马来亚宪法第153条"
 MAL_constitution_153_desc:0 "马来亚宪法第153条将在保障马来人具有特殊地位的前提下，承认印度人和华人的公民权。在马来亚生活和出生的印度人、华人等外籍族裔，享有公民权和投票权，但另一方面，马来人拥有在经济、政治、就业上的特权，以保障马来人作为国家主体民族的地位。\n我们认为这是一种社会契约论，我们给予华人和印度人生活在马来亚的权力，作为交换，他们需要承认马来亚人是这片土地的主人。东姑·阿都拉曼如此告诉记者。"
 
 INS_Federated_ideas:0 "印度尼西亚联邦"
 INS_Federated_ideas_desc:0 "作为印尼脱离荷兰的妥协方案，印度尼西亚将成立一个联邦国家——支持完全独立的民族主义中央政府仅控制爪哇岛和苏门答腊，而坤甸、苏拉维西、巽他和马鲁古等地则获得巨大的自治权，并由亲荷兰的政府所控制。"
 ISR_armed_organized_ideas:0 "各自为战的准军事组织"
 ISR_armed_organized_ideas_desc:0 "犹太人在对抗英国人和阿拉伯人的过程中，成立了许多庞大的准军事民兵组织——莱希、伊尔贡、哈加纳……他们不愿意接受温和的本·古里安政府的领导。"
 TUR_kemal_legacy_ideas:0 "凯末尔的遗产"
 TUR_kemal_legacy_ideas_desc:0 "共和主义、民粹主义、民族主义、世俗主义、国家主义和改良主义。这是穆斯塔法·凯末尔和他的共和人民党的基本意识形态，也是土耳其共和国的立国根本。"
 Axis_problem_ideas:0 "轴心国问题"
 Axis_problem_ideas_desc:0 "在第二次世界大战期间，[THIS.GetName]被认为是纳粹德国的重要盟友，且没有参与《联合国宪章》的签署，因此，[THIS.GetName]若想重新被国际社会接纳，还有很长的路要走。"
 CUB_mafia_ideas:0 "黑帮的犯罪天堂"
 CUB_mafia_ideas_desc:0 "自从迈尔·兰斯基和查理·卢西亚诺来到古巴，并与巴蒂斯塔总统建立深厚友谊以来，古巴便成为了逃离本土的美国黑手党的犯罪产业天堂。赌场、酒店、私酒、私糖、毒品、卖淫……在古巴政府的大力支持下，美国人的犯罪产业在古巴生根开花，而黑手党们也大手笔地孝敬他们的保护者。"
 RHO_nyasaland_emergency:0 "尼亚萨兰紧急状态"
 RHO_nyasaland_emergency_desc:0 "海斯廷斯·班达与他领导下的尼亚萨兰大会党是罗德西亚与尼亚萨兰联邦最坚定、最激进的反对者，他公开指责联邦压榨偏远地区，尤其是尼亚萨兰的利益。随着大会党反对联邦的政治运动组件走向暴力，罗德西亚当局宣布在尼亚萨兰执行紧急状态，用暴力镇压暴力。"
 
 SOV_4th_plan_idea:0 "第四个五年计划"
 SOV_4th_plan_idea_desc:0 "苏联在第二次世界大战中遭到了严重的破坏，许多工业和耕地被摧毁，大量人口死亡。斯大林下令开展第四个五年计划，要求在五年内恢复到战前水平。"
 khrushchevka_idea:0 "赫鲁晓夫楼"
 khrushchevka_idea_desc:0 "预制板技术的发展恰好迎合了二战结束后，多个国家对快速建立公共住宅的需求，人民不再需要复杂而奢侈的豪华公寓，成本低廉且由政府低价分配的通用公寓才是更合适的选择，这种设计简单、构造简单，施工方便的现代主义公寓楼将在二战后的住宅建设中遍地开花。"
