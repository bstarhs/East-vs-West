 SOV_EURO_commercial_idea_tool:0 "苏联购买该国产出的资源时价格-15%\n该国购买石油时价格-15%"
 SOV_Beria_struggle_idea:0 "根基不稳的贝利亚政权"
 SOV_Beria_struggle_idea_desc:0 "拉夫连季·贝利亚在一次惊险的政治阴谋中夺取了政权，与马林科夫组建了所谓的二人党中央并得到实际的最高统治权，然而，苏联党内和军队都对这位曾经的内务部部长敬而远之，如果缺少足够的支持，贝利亚政权早晚要倒台。贝利亚必须尽快争取党政军的老资历对自己的支持。\n§W贝利亚的威望：§Y[?SOV.Beiria_influence]§W\n贝利亚支持率：§Y[?SOV.Beria_supporting]§W\n威望决定了拉拢党内人物的成功率，提高支持率以消除此状态。"
 SOV_peaceful_coexistence_idea:0 "和平竞争路线"
 SOV_peaceful_coexistence_idea_desc:0 "在新的形势下，尤其是世界核大战的威胁下，通过暴力和战争来推翻资本主义的构想变得成本巨大而不现实，第三次世界大战对我们来说代价是巨大的，基于这一点，我们应该选择一条新的道路来与资本主义和帝国主义国家进行对抗，即和平共处、和平竞争、和平过渡，在不放弃发展武力的前提下，与西方国家通过和平竞争，体现出社会主义制度的优势，来争取西方国家广大人民群众的认可和支持，以和平手段帮助他们建立社会主义制度。"
 
