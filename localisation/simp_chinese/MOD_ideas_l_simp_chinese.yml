 GRE_DEN:0 "希腊公共电力公司"
 Piraeus_Port:0 "比雷埃夫斯航运"
 GRE_OTE:0 "希腊电信"
 bra_oil:0 "巴西石油"
 IMBEL:0 "巴西军用工业公司"
 BRA_vale:0 "淡水河谷矿业"
 SPR_INI:0 "西班牙国家工业研究所"
 polish_catholics:0 "波兰天主教"
 polish_catholics_tool:0 "§R无法§W采用§Y打压宗教§W政策"
 polish_catholics_desc:0 "天主教在波兰有着深厚的群众基础和根深蒂固的影响力，已经成为了波兰民族灵魂的一部分。削弱和打压天主教对波兰人民来说是不可接受的，即使是共产党政府也要让路三分。"
 IMI:0 "以色列国防工业"
 African_police:0 "非洲宪兵"
 African_police_desc:0 "法国政府仍然与非洲前殖民地的各国政府保持着特殊关系，非洲为其提供各种资源和外交支持，而法国则有义务维护他们政权的安全。"
 white_revolution:0 "白色革命"
 white_revolution_desc:0 "伊朗国王里萨·巴列维致力于将伊朗迅速地带入现代化和世俗化，巴列维表示，伊朗的革命，并非西方国家的蓝色革命，也非苏俄的红色革命，伊朗人将在君主制的带领下，通过不流血的手段完成社会和经济的变革，实现白色的革命。。"
 lockbie:0 "洛克比空难风波"
 lockbie_desc:0 "震惊世界的洛克比空难已被证实是利比亚情报机构所为，卡扎菲政权将为此付出巨大的政治代价。"
 Ericsson:0 "爱立信"
 monarch_reballion:0 "保皇党动乱"
 RustBelt_modifiers:0 "锈带"
 Latin_Hacienda:0 "大庄园体制"
 Latin_Hacienda_desc:0 "拉丁美洲的大庄园，可不仅是一种生产单位，而更像一种自给自足的社区。一个庄园的规模一般有一个小镇那么大，庄园内不仅有农场和牧场，也有生活设施和手工作坊，他们可以在几乎完全远离市场的情况下运营。庄园内的绝大多数人都是因为欠债给被迫工作的佃农，而庄园主则通过庄园制度掌握了拉美国家的绝大部份土地和劳动力，并通过垄断经济而成为一个不可忽视的社会阶级，他们干涉政治，支持保守派的政府，抵制工业化和现代化来维持庄园制度。"
 Vietnam_AST:0 "All to the LBJ"
 Vietnam_AST_desc:0 "澳洲政府坚决支持在越南的战争并派遣部队，总理哈罗德·霍尔特提出口号：All to the LBJ"
 SEAT:0 "西亚特汽车公司"
 pushituni_tribal:0 "山区部族"
 pushituni_tribal_desc:0 "兴都库什山脉阻断了各地区之间的联系，使得阿富汗绝大部分地区仍然处于落后的、与世隔绝的部族社会中，阿富汗政府对喀布尔以外的控制微乎其微。"
 AquinoDead:0 "人民力量革命"
 AquinoDead_desc:0 "菲律宾民主派领袖尼诺伊·阿基诺的遇刺彻底激怒了菲律宾人民，整个国家都陷入的民主革命之中。"
 Burmese_civilwar:0 "少数民族战争"
 Burmese_civilwar_desc:0 "缅甸政府违背斌龙协定打击少数民族，致使整个缅甸陷入战火当中。"
 Burmese_civilwar_tool:0 "§Y缅甸少数民族地区的叛乱速度§R增加§W"
 Panglong_Agreement:0 "斌龙协定"
 Panglong_Agreement_desc:0 "斌龙协定是缅甸领导人昂山与各地方少数民族武装签署的协定，协定承诺建立一个缅甸联邦，少数民族不仅可以自治，甚至可有权选择独立。"
 Panglong_Agreement_tool:0 "少数民族地区如若对中央不满，随时可能§Y独立§W。"
 cyprus_quest:0 "塞浦路斯问题"
 cyprus_quest_desc:0 "希腊希望吞并仍处于英国控制下的塞浦路斯，这导致他们与土耳其、英国等国的关系十分紧张。"
 GRE_Paul:0 "保罗二世"
 ConstantineII:0 "康斯坦丁二世"
 HKN_corrupt:0 "无孔不入的腐败"
 HKN_corrupt_desc:0 "贪污腐败在香港已经发展到无孔不入的程度，政府各级官员索取贿赂、警察与黑道串通一气，勒索钱财，甚至消防员救火都要好处费，整座城市都充满着金钱利益的铜臭气。"
 HKN_New_downtown:0 "十年建屋计划"
 HKN_New_downtown_desc:0 "香港的经济发展和人口增长为这座城市带来挑战，港府为此提出了雄心勃勃的建设计划，开发新界一带的土地以扩大城市。"
 HKN_New_downtown_tool:0 "可以通过一系列决议开发新市镇，增加香港地区的建筑槽位。"
 ICAC:0 "廉政公署"
 ICAC_desc:0 "廉政公署的成立标志着香港政府将下定决心铲除腐败，尽管面临挑战和困难。"
 ICAC_tool:0 "香港需要在一系列的事件链中打击腐败，以去除现有的腐败效果。"
 grand_excape:0 "逃港潮"
 grand_excape_desc:0 "中国大陆的政治动荡使许多大陆居民逃亡香港，安置和遣返难民都为港府带来沉重负担。"
 Buble_economic:0 "泡沫经济"
 Buble_economic_desc:0 "广场协议带来的日元升值、不动产投资的兴盛和全体通货紧缩，使得日本的土地价格和财富急剧膨胀，许多日本企业一夜之间成为了暴发户，整个国家沉浸在暴富的梦想中。"
 Buble_economic_tool:0 "泡沫经济一旦破裂将带来§R严重的后果§W"
 focus_naval_manufacturer:0 "[THIS.GetNameDef]海军造船厂"
 focus_electro_manufacturer:0 "[THIS.GetCapitalVictoryPointName]电子公司"
 focus_missile_manufacturer:0 "[THIS.GetName]光学武器研究所"
 focus_infantry_equipment_manufacturer:0 "[THIS.GetName]枪械制造所"
 focus_artillery_manufacturer:0 "[THIS.capital.GetName]装备制造所"
 Harambee_desc:0 "Harambee在斯瓦西里语里意为“团结一致，齐心协力”，是肯尼亚国父乔莫·肯雅塔在国家独立后提出的口号。"
 Shamba:0 "香巴农业"
 Shamba_desc:0 "香巴（Shamba）是东非实行的一种农林业系统。在这些土地上，香蕉，豆类，玉米等作物混合种植，还添加了木材资源，养蜂业，草药，蘑菇，森林水果，牲畜饲料等。由于这种混养，农民获得了更高的收入，食物和就业份额。此外，与单一栽培相比，它更具可持续性。"
 Shamba_tool:0 "农场的维护费更低"
 long_parliament:0 "万年国会"
 long_parliament_desc:0 "万年国会，即1948年根据《中华民国宪法》施行后，选举产生的第一届立法机关——国民大会。在国民党政府逃离大陆前往台湾后，国民大会代表就再没进行过选举，因为蒋介石政府需要这些从大陆来的代表来象征自己对中国大陆的合法权，也通过他们来掌握立法机构。国民党籍国大代表们即使年入古稀，却依然控制着自己的席位。"
 five_years_plant:0 "五年计划"
 grand_purge:0 "清洗"
 grand_purge_desc:0 "军队和政府中仍然有大量成员不愿意对现政权效忠，那就把他们铲除。"
 Appolo_idea:0 "阿波罗计划"
 Appolo_idea_desc:0 "我们决定在这十年间登上月球并实现更多，并非它们轻而易举，而正是因为它们困难重重。因为这个目标将促进我们实现最佳的组织并测试我们顶尖的技术和力量，因为这个挑战我们乐于接受，因为这个挑战我们不愿推迟，因为这个挑战我们志在必得，其他的挑战也是如此。\n——约翰·菲茨杰拉德·肯尼迪"
 Appolo_idea_tool:0 "§Y美国必须在1970年以前实现载人登月，完成了有政治和外交奖励，完不成有惩罚§W"
 suprise_attack_modifier:0 "遭受突然入侵"
 POR_Estado_Novo:0 "新国家体制"
 POR_Estado_Novo_desc:0 "安东尼奥·萨拉查总理在葡萄牙建立起了一套保守的政治制度，国家将天主教教义作为葡萄牙的基本意识形态，通过宗教团结人民，同时建立了跨党派的国家联盟，将议会权力牢牢掌握在萨拉查主义者手中。新国家体制有助于在经历了混乱的政府更迭和世界大战后，建立一个稳定的葡萄牙共和国，但也使得这个国家停滞不前。\n\n葡萄牙诞生于天主教会和宗教的树荫之下，从一开始，它就是国家灵魂的形成要素，也是葡萄牙人民性格的主要特征。\n——安东尼奥·萨拉查"
 factory_671:0 "内蒙古第一机械制造厂"
 PRC_Wuhan_electro:0 "武汉电子元件厂"
 low_education:0 "识字率过低"
 low_education_desc:0 "过大的文盲率严重拖累着这个国家的发展。"
 low_education_tool:0 "将识字率提高到§Y25%§W以上以消除这个负面效果"
 democracy_thai:0 "曼谷之春"
 democracy_thai_desc:0 "军政府的独裁统治摇摇欲坠，泰国的民主势力正在不断兴起。"
 laotian_united:0 "老挝联合政府"
 laotian_united_desc:0 "老挝皇室、军方、文官和共产主义势力组织了一个不稳定的联合政府，以避免内战的爆发。"
 LDP_struggle:0 "三角大福中"
 LDP_struggle_desc:0 "日本自民党内部分为多个派系，以田中角荣为首的田中派和以福田赳夫为首的福田派争夺首相之位，此外大平正芳、三木武夫和中曾根康弘等小派系也寻求崛起。"
 salazardeath:0 "新国家的落幕"
 salazardeath_desc:0 "独裁者安东尼奥·萨拉查已逝去，新国家的统治摇摇欲坠。"
 francodeath:0 "长枪党的落幕"
 francodeath_desc:0 "独裁者弗朗西斯科·弗朗哥已逝去，长枪党的统治摇摇欲坠。"
 economic_trans:0 "经济转型"
 economic_trans_desc:0 "在经历了共产党倒台后的政治转型，该国开始寻求从社会主义过渡到新自由主义的经济转型。"
 tiananmen:0 "六四余波"
 tiananmen_desc:0 "天安门广场上发生的悲剧让中共政府在国际上的地位一落千丈。"
 anti_right:0 "反右运动"
 anti_right_desc:0 "在所谓的百花齐放后，毛泽东掀起了更大的反右运动。毛将在短暂的言论自由时期抨击共产党的知识分子，斥为右派分子的反扑，并呼吁将他们打倒。\n按照毛泽东的说法，百花盛开的花丛中，隐藏着毒草。"
 redguard:0 "红卫兵武斗"
 redguard_desc:0 "不同红卫兵派系之间的矛盾已无法调和，全国各地的红卫兵们正在激烈地交换意见（物理）。"
 oncechild:0 "计划生育"
 good_diplomacy:0 "高外交威望"
 good_diplomacy_desc:0 "这个国家在国际社会很有威望，影响力很有分量。"
 low_diplomacy:0 "低外交威望"
 low_diplomacy_desc:0 "这个国家在国际社会不受欢迎，为各国所唾弃。"
 influence_limit_300:0 "国际影响力上限为§Y300§W"
 AgriculturalCooperatives:0 "农业合作社"
 AgriculturalCooperatives_desc:0 "将土地和农民合并为合作社，社员一起劳动、合作使用土地和生产工具，再根据贡献分享劳动产品。"
 AgriculturalCooperatives_modifier:0 "全国粮食产量增加§Y15%§W"
