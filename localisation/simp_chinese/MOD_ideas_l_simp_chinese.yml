 KOR_upset:0 "不稳定的政权"
 KOR_war_growth:0 "来自日本的补给"
 JAP_war_growth:0 "军需景气"
 PRK_liberate_war:0 "祖国解放战争"
 BRA_developing:0 "五年发展五十年"
 ARG_Peronista:0 "贝隆主义"
 ARG_Death_Peron:0 "艾薇塔的遗产"
 ARG_Death_Peron_desc:0 "贝隆主义政府的威望几乎依靠祖国之母伊娃·贝隆夫人的影响力支持，而伊娃已死，胡安·贝隆的威望也随之受到重创。"
 Death_Mao:0 "毛的遗产"
 Death_Mao_desc:0 "随着毛泽东死亡，中共陷入了内部斗争和不稳定当中。"
 Death_Stalin:0 "斯大林之死"
 Death_Stalin_desc:0 "随着约瑟夫·斯大林死亡，苏联政局陷入了内部斗争和不稳定当中。"
 Baltic_awaken:0 "波罗的海在觉醒"
 GER_punishment:0 "德国的战后惩处"
 GER_punishment_desc:0 "作为纳粹策源地、第二次世界大战发起者，德国在二战结束后遭到惩罚，军事和外交权力被严格限制。"
 UN_troops:0 "联合国授权维和部队"
 UN_troops_desc:0 "联合国授权该国组织维和部队，前往热点战事地区。"
 Gen_after_struggle:0 "内部政治斗争影响"
 PRK_farmine:0 "苦难行军"
 PRK_farmine_desc:0 "苦难行军"
 VAT_holysee:0 "圣伯多禄的继承人"
 VAT_holysee_desc:0 "西门巴约拿，你是有福的！因为这不是属血肉的指示你的，乃是我在天上的父指示的。我还告诉你，你是彼得，我要把我的教会建造在这磐石上；阴间的权柄不能胜过他。我要把天国的钥匙给你，凡你在地上所捆绑的，在天上也要捆绑；凡你在地上所释放的，在天上也要释放。\n——马太福音"
 ITA_salvation:0 "基督救国军"
 ITA_salvation_desc:0 "基督救国军"
 KoreanUN:0 "第83号决议"
 KoreanUN_desc:0 "联合国第83号决议授权美国组织联合国军前往朝鲜半岛，支持韩国抵抗北朝鲜入侵。"
 PRK_juche_idea:0 "主体思想"
 PRK_juche_idea_desc:0 "主体思想是朝鲜领袖金日成提出的政治理念，即人是自己主体，人要掌握自己的命运，而朝鲜民主主义人民共和国也像一个人，他要掌握自己的命运，就要只服从于自己的大脑——朝鲜劳动党的指挥。"
 PRK_seongun_idea:0 "先军政治"
 PRK_seongun_idea_desc:0 "军事被金日成视为朝鲜民主主义人民共和国的立国根基之一，在美帝国主义的武力威胁之下，朝鲜必须将军事建设放在最优先的位置，在国家事务中，一切工作以军事为先、以军事为重，国家财政再困难，也要优先保障国防费用的支出，并重视军人在国家社会中的地位，才能建设军事强国，也有利于争取人民军对劳动党和领袖的忠诚。"
 PRK_chonsanli_idea:0 "青山里模式"
 PRK_chonsanli_idea_desc:0 "青山里集体农场位于平安南道江西郡，伟大的金日成委员长在此视察时，发现这里的农业生产取得了不错的成就，认为这是因为集体农场社员们，充分发扬主体思想精神，下级上级互相帮助，深入群众基层，研究和分析实际情况，最大限度调动下级和人民大众自觉的热诚和创意性，无条件实行革命。金日成同志对此十分满意，并呼吁全国深入学习和贯彻青山里精神。"
 PRK_escaping:0 "脱北者"
 PRK_escaping_desc:0 "朝鲜劳动党的独裁统治和政治清洗，以及不断恶化的生活条件，使得一些北朝鲜人为了生存，被迫冒险跨过边境线，前往南韩或中国东北，即使这可能意味着生命危险。"
 PRK_chonlima_idea:0 "千里马运动"
 PRK_chonlima_idea_desc:0 "朝鲜劳动党制定了雄心勃勃的工业化计划，要让朝鲜尽快从一个落后的农业国，以最快的速度和最大的效率，建设成为一个能够基本满足农业和轻工业品自给自足，脱离外国依赖，并拥有基础重工业的工业化国家。金日成同志为这个七年计划命名为千里马运动，即可以日行千里的骏马。"
 ITA_Peace_treaty:0 "《对意大利和约》"
 ITA_Peace_treaty_desc:0 "意大利与二战盟国签订的一系列合约标志着意大利与各交战国战争状态结束，意大利恢复正常外交与政治运作，但依然对意大利的军事发展和法西斯运动作出一定限制。"
 PRC_construction_spirit:0 "社会主义建设"
 PRC_construction_spirit_desc:0 "朝鲜战争的胜利、土地改革的实行、民主建设的实施，一系列成就使得中国共产党拥有了史无前例的威望，中国人民更加积极地投入到建设当中。"
 Zhdanov_doctrine:0 "日丹诺夫主义"
 Zhdanov_doctrine_desc:0 "苏联文化部长安德烈·日丹诺夫提出名为社会现实主义的文化政策，所有的文化和科学研究都应该为社会主义事业服务，并打击偏离党和领袖主张的艺术家和知识分子。"
 Italian_politic_idea:0 "意大利的政治斗争"
 Italian_politic_idea_desc:0 "意大利的左派和右派激烈地争夺着这个国家的统治权。"
 TIB_Gaxha:0 "噶厦与达赖喇嘛"
 TIB_Gaxha_desc:0 "西藏建立了一种极为特殊的政教合一制度，格鲁派作为西藏藏传佛教的统治教派，其领袖达赖喇嘛扮演了君主的角色，而达赖喇嘛之下，是被称作噶厦（内阁）的政府，由三大教派的僧侣加一名贵族组成。"
 ITA_punishment:0 "意大利的战后惩处"
 ITA_punishment_desc:0 "作为轴心国成员，意大利在二战结束后遭到惩罚，军事和外交权力被严格限制。"
 TIB_slavery:0 "奴隶制"
 TIB_slavery_desc:0 "奴隶制在西藏依然存在，大量的人口以奴隶的身份被僧侣和贵族所拥有，他们如同物品，可以被买卖和杀死。"
 TIB_slavery_tool:0 "福利花费-40%"
 17th_treaty:0 "十七条协议"
 17th_treaty_desc:0 "达赖喇嘛与中共达成《十七条协议》，西藏以自治区身分并入中华人民共和国，而中共允许达赖和他的噶厦继续执政，但这样的联合政府并不稳定。"
 ISR_loose_treaty:0 "《特拉维夫条约》"
 ISR_loose_treaty_desc:0 "阿拉伯国家给战败的以色列施加了严厉的惩罚。"
 Haredi:0 "哈瑞迪人的特权"
 Haredi_desc:0 "哈瑞迪人指正统派犹太教信徒，他们认为自己的信仰和宗教常规是直接传承自摩西，因此必须保证人口中的哈瑞迪人占一定比例，才能保障以色列国的合法性。作为回报，以色列政府允许哈瑞迪人有大量特权，如不服兵役，不交税，不参与工作等。"
 LaVolencia:0 "哥伦比亚内战"
 militarist_politician:0 "军方对政治的深入影响"
 militarist_politician_desc:0 "军队深深地影响着该国的一切政治活动，从政府的产生、运行乃至废黜，以及经济和社会的运转。"
