 CHI_wave_228:0 "二二八余波"
 CHI_wave_228_desc:0 "国民党政府在二·二八事件采取强硬的手段，血腥地镇压了台湾人的暴动，使得国民党在台湾的威望，尚未建立就走向崩溃。台湾人以及对中华民国几乎失去了信心，并决心进行更大规模的武装暴动，为了摆脱国民党，台湾人可以选择与中共接触、与日本接触，或者走向独立。"
 CHI_financial_broken:0 "财政崩溃"
 CHI_financial_broken_desc:0 "金圆券的信用崩塌引发了世界现代史上最严重的通货膨胀，一个鸡蛋的价格要两千万元。国民政府的经济已近乎崩溃。"
 CHI_fertilizer_grains:0 "肥料换谷"
