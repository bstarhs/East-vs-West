 civilian_economy:0 "新自由主义"
 civilian_economy_desc:0 "新自由主义认为应当充分发挥自由市场在经济运作中的主导地位，而政府官僚的过多干预违背经济规律，市场能够指引人们为了争取各自的利益达而进行效率最好的经济活动，通过减税、私有化、货币量化宽松等政策，政府的介入越少，经济运行得越好。型自由主义指导下的政府将行政对经济的影响压到最低，完全由市场和货币支配，因而可以有效地刺激市场和消费，也进而刺激生产，从而达到恢复和振兴经济的目的，但新自由主义也意味着福利制度的降低和不加限制的竞争，从而使得大量中小企业面临巨大的压力二被淘汰破产，失业率激增而失业者缺乏救济而导致社会问题。"
 low_economic_mobilisation:0 "凯恩斯主义"
 low_economic_mobilisation_desc:0 "凯恩斯主义是二战后西方世界的流行经济政策，主张建立大政府，增加政府干预和财政赤字，利用公共建设和公共事业扩大内需，创造市场需求和就业岗位，从而实现经济的发展和复兴。在凯恩斯主义指导下，二战后的欧美各国均出台了一系列政策以提高福利、进行建设并以此刺激经济，例如英国的全民医保体系和美国的“伟大社会”，但这也会导致经济的运行极其依赖政府和公共资源，当政府行政效率低下或出现能源危机时，政府的大规模投入便失去效果，国家将陷入同时面临高赤字、高通胀的危机中。"
 partial_economic_mobilisation:1 "社会主义市场经济"
 partial_economic_mobilisation_desc:1 "即社会主义国家实行市场经济制度，在保证国家掌控的前提下推行有限的自由市场、企业自主乃至投资，虽然绝大部分尝试进行市场化改革的共产主义国家都声称经济改革后企业仍然在国家，或者说人民手中，但实践中市场化将让企业不可避免地走向官僚化或私有化，而经济不可避免地走向市场调控。因此社会主义市场经济是充满争议的，保守的共产主义者指责其为修正主义，而自由主义者指责其仍然保留了官僚制度，是一种国家资本主义。"
 war_economy:1 "计划经济"
 war_economy_desc:0 "计划经济即按照生产计划进行生产的经济，所有的生产部门都将按照政府通过计算获得的计划命令进行生产并分配生产资料。对于二战之后遭受破坏的许多国家来说，计划经济有助于调动全国的力量来支持某一项事业，从而加速战后重建或工业化，但计划经济也意味着完全的政府管控而将市场的影响降到最低，政府的腐败和低效将使得计划经济失去效率，也滋生腐败，而计划经济也将民众的生活用品分配纳入计划中，从而极大地影响力民众的消费品供应。"
 governed_economic:0 "统制经济"
 governed_economic_desc:0 "统制经济即由国家政府部门进行操纵的经济，他不同于计划经济，承认市场和一定的私有制企业，但对经济和市场的控制又远比凯恩斯主义要多，通过行政命令来直接调节市场和经济运行。通常来说，一个强有力的政府会更好地主力经济发展，但这也意味着政府与经济的捆绑从而导致严重的腐败。"
 tot_economic_mobilisation:0 "封闭经济"
 tot_economic_mobilisation_desc:0 "即使到了20世纪后半页，仍有许多国家因为现实或人为因素，处于几乎没有经济生产的状态，没有工厂、市场，甚至没有成型的货币，大部分民众生活在中世纪的状态下，依赖简单的农业、手工业和简单的铜币生活。"
