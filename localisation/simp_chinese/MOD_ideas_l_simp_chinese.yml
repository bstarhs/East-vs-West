 SOV_sputnik_buff:0 "斯普特尼克的升空"
 SOV_sputnik_buff:0 "终有一天，载着人类的宇宙飞船将离开地球，踏上前往遥远行星——遥远世界的旅程。今天，这或许只是一个诱人的幻想，但事实并非如此。苏联发射的首批两颗人造卫星“斯普特尼克”号已经架起了一座连接地球与太空的坚固桥梁，通往星辰大海的道路已经敞开。\n\n——谢尔盖·科罗廖夫"
 SOV_sputnik_punishment:0 "斯普特尼克危机"
 SOV_sputnik_punishment_desc:0 "现在，不知怎的，通过某种新的手段，天空好像都被别国所占据了。\n\n——林登·约翰逊"
 
