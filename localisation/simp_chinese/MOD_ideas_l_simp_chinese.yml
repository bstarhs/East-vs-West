 DDR_Republikflucht_4:0 "难民西逃 - 猖獗"
 DDR_Republikflucht_4_desc:0 "东德政府完全失去对边境的控制！大量人口如潮水般涌向西德！"
 DDR_Republikflucht_3:0 "难民西逃 - 严重"
 DDR_Republikflucht_3_desc:0 "东德政府难以控制边境的人口流动，许多难民离开东部逃亡西德！"
 DDR_Republikflucht_2:0 "难民西逃 - 较多"
 DDR_Republikflucht_2_desc:0 "东德政府勉强控制住边境的人口流动，少量人群突破边境前往西部。"
 DDR_Republikflucht_1:0 "难民西逃 - 轻微"
 DDR_Republikflucht_1_desc:0 "东德政府基本控制住了边境的人口流动，只有少量偶发的逃脱事件。"
 DDR_Republikflucht_tool:0 "提升稳定度、党派支持率、生活消费品供应或封锁措施以阻止人口逃窜，同时西德如果发生低稳定、低支持率或低供应，也会减少东德的人口流出。"
 
 YUG_TO_ideas:0 "国土边防军"
