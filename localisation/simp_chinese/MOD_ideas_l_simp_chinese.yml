 USA_Hippies_ideas:0 "嬉皮士运动"
 USA_Hippies_ideas_desc:0 "长发，墨镜，吉他，大麻，以及“要做爱不要作战”的口号从纽约一直延续到洛杉矶。"
 USA_dodge_draft:0 "逃避兵役"
 USA_dodge_draft_desc:0 "美国年轻人对遥远而血腥的越南战场谈之色变，纷纷想方设法躲避征兵，美国政府只能招到弗雷斯·甘这样的傻瓜派去越南。"
 CUB_casino:0 "哈瓦那大酒店赌场"
 CUB_casino_desc:0 "在美国黑帮和巴蒂斯塔的支持下，哈瓦那大酒店成为了拉丁美洲最大的赌场，富豪们在此一掷千金，而大部分利润进入了总统先生的口袋。"
 CUB_casino_tool:0 "旅游业带来的利润+40%，但这些额外的收入不能转化为政治点数。"
 
 WDR_Hallstein_idea:0 "哈尔斯坦主义"
 WDR_Hallstein_idea_desc:0 "联邦德国不承认民主德国的合法性，并拒绝与任何承认民主德国的国家展开外交关系。"
 
 VietCongRevolt:0 "越南南方解放阵线"
 VietCongRevolt_desc:0 "解放南方！我们共前进！\n消灭美帝！击溃反动敌人！\n山河破碎，民族分裂\n此仇不共戴天！"
 SVN_BuddhismCrisis:0 "佛教危机"
 SVN_BuddhismCrisis_desc:0 "吴廷琰政府对佛教徒的残酷镇压引发了佛教僧侣发起抵抗。"
 SVN_BinhXuyenRevolt:0 "平川派犯罪集团"
 SVN_BinhXuyenRevolt_desc:0 "平川派是盘踞于西贡地区的大型犯罪集团，他们在二战时期利用日本入侵带来的混乱组织了自己的武装力量，并在二战后控制了西贡地区的地下经济，无论是法国人还是保大政府都要让他们三分。"
 SVN_CIDG_idea:0 "平民游击防卫群"
 SVN_CIDG_idea_desc:0 "平民游击防卫群是南越政府在西部高原组织的反游击武装，通过招募忠诚于西贡的少数民族，来对抗越共的少数民族游击队。"
 SVN_MAAG:0 "美国军事援助越南司令部"
 SVN_MAAG_desc:0 "美国将为南越军队提供大量的经济和军事援助以帮助西贡政府对抗共产党叛乱。"
 SVN_Immigration:0 "北方难民"
 
 HCMTrail_modifier:0 "胡志明小径"
 HCMTrail_modifier_desc:0 "该地区是胡志明小径的重要节点。"
 HCMTrail_modifier_tool:0 "美国和南越玩家可以通过发起轰炸、地面行动或将老挝、柬埔寨变成反共国家的方式截断胡志明小径，如果被截断，北越将无法向南越输出意识形态和抵抗度。\n如果老挝、柬埔寨是亲共国家，老挝可以用政治点数恢复胡志明小径节点，否则，北越只能通过军事行动来恢复节点。"
 strategic_valley_modifier:0 "战略村"
 strategic_valley_modifier_desc:0 "南越政府在该地实行战略村计划，将居民全部迁出到军队重重保护和监视下的地区，并将原来的村镇焚毁。"
 agent_orange_modifier:0 "橙剂"
 agent_orange_modifier_desc:0 "美军向该地区大量抛洒橙剂等落叶剂从而成规模地清除森林。至于会对当地居民带来什么后果，那不是华府需要考虑的。"
 
