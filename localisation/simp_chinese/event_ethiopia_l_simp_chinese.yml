l_simp_chinese:
 eth.1.t:0 "埃塞俄比亚颁布新宪法"
 eth.1.d:0 "埃塞俄比亚皇帝海尔·塞拉西一世今日颁布了新的宪法，这是埃塞俄比亚自1931年以来的第二部成文宪法。\n尽管埃塞俄比亚在第二次世界大战中抵抗意大利入侵的战斗，为该国赢得了巨大的影响力，然而，该国的行政机构依然严重地落后于世界，尤其许多政治权力被世袭贵族所掌控。\n海尔·塞拉西希望新的宪法能够推动该国走向改革，并提高埃塞俄比亚的国际影响力。\n新的埃塞俄比亚宪法很大程度上参考了西方国家的政治制度，例如三权分立、扩大议会的权力等，埃塞俄比亚首相也将由议会产生，但皇帝本人依然拥有解散议会、解雇首相的权力。"
 
 eth.2.t:0 "军方的动荡不安"
 eth.2.d:0 "尊敬的陛下：\n我们注意到埃塞俄比亚军队内最近出现了政治和意识形态的不安……许多军人受到了外国政治影响，比如苏联的共产主义、西方的民主主义和阿拉伯民族主义……这些士兵对君主制的不满正在增加！"
 
 eth.3.t:0 "皇家卫队发起政变！"
 eth.3.d:0 "由Mengistu Neway将军率领的皇家卫队发起政变！！"
 
 eth.4.t:0 "埃塞俄比亚发生兵变！"
 eth.4.d:0 "来自亚的斯亚贝巴的突发消息！\n埃塞俄比亚军方今天突然发动军事政变！包括皇家卫队在内的军人闯入首都亚的斯亚贝巴、控制了皇宫、电台和各大交通要道。政变由Mengistu Neway将军率领，他与政变高层一起宣布，以海尔·塞拉西一世为首的反动君主和贵族，阻挠改革，使得埃塞俄比亚在国际社会取得发展的当下依然落后且缺乏民主。Mengistu Neway将军宣布成立革命军事委员会，掌握政权。\n埃塞俄比亚的其他地区依然效忠皇帝海尔·塞拉西，他们正在保守派领袖、参议院院长Aserate Kassa亲王指挥下抵抗叛军并发起反击！"
 
 eth.5.t:0 "埃塞俄比亚兵变被平定！"
 eth.5.d:0 "席卷全国的埃塞俄比亚军事政变被忠于君主的军队平定，经过一番激战，政府军夺回首都亚的斯亚贝巴，叛军不得不撤离。政变领袖Mengistu Neway将军在郊区自杀，埃塞俄比亚政府经过验尸确认。\n皇帝海尔·塞拉西一世从国外返回埃塞俄比亚，政变使得整个国家动荡不安，皇帝宣布授权军方全权负责治安维护，并对任何可能勾结叛军之人展开调查。"
 
 
 
 eth.6.t:0 "埃塞俄比亚发生军事政变"
 eth.6.d:0 "来自亚的斯亚贝巴的突发消息！\n埃塞俄比亚军方今天突然发动军事政变！包括皇家卫队在内的军人闯入首都亚的斯亚贝巴、控制了皇宫、电台和各大交通要道。政变由Mengistu Neway将军率领，他与政变高层一起宣布，以海尔·塞拉西一世为首的反动君主和贵族，阻挠改革，使得埃塞俄比亚在国际社会取得发展的当下依然落后且缺乏民主。Mengistu Neway将军宣布成立革命军事委员会，掌握政权。\n海尔·塞拉西已逃亡外国，埃塞国内依然有许多忠于皇帝的派系，新政府若想巩固政权，恐怕十分困难。"
 
 eth.7.t:0 "宣布承认埃塞俄比亚新政府！"
 eth.7.d:0 "[FROM.GetName]外交部发表声明，外交承认政变产生的埃塞俄比亚新政府！！"
 
 eth.8.t:0 "皇储被俘"
 eth.8.d:0 "政变军将皇储阿斯法·沃森·塔法里拘留在皇宫中，皇储不仅没有强硬地抵抗政变，相反表现出了某种合作态度。"
 
 eth.9.t:0 "阿斯法王储发表声明"
 eth.9.d:0 "埃塞俄比亚政变军宣布，革命委员会获得了皇储阿斯法·沃森·塔法的支持！\n阿斯法·沃森在国家广播电台宣读了一份声明。王储宣称，埃塞俄比亚普通民众的生活三千年来都没有改变，并宣布民众正在失去耐心。他接着将埃塞俄比亚的落后与一些新独立的非洲国家进行了比较，指出埃塞俄比亚正在落后。阿斯法王子进一步强调，新政府得到了他本人和埃塞俄比亚的支持。\n阿斯法的宣读是真诚的还是被迫的，尚有争议。这次广播是埃塞俄比亚领导人首次公开谴责该国长期存在的社会和经济问题。"
 
 eth.10.t:0 "阿斯法王储被监禁！"
 
 eth.11.t:0 "阿贝贝·阿勒盖首相被杀害！"
 eth.11.d:0 "埃塞俄比亚兵变酿成流血冲突，拒绝与政变当局合作的阿贝贝·阿勒盖首相被杀害！\n阿贝贝·阿勒盖是海尔·塞拉西皇帝的远亲，也是第二次世界大战中领导敌后武装的爱国英雄，尽管阿贝贝被任命为首相，明显是一种皇族内阁，但他依然在埃塞俄比亚民间拥有很高声望。\n阿贝贝·阿勒盖的死亡，使得埃塞俄比亚局势进一步恶化。"
 
 eth.12.t:0 "埃塞俄比亚效忠派发起反击！"
 eth.12.d:0 "埃塞俄比亚的其他地区依然效忠皇帝海尔·塞拉西，他们正在保守派领袖、参议院院长Aserate Kassa亲王指挥下抵抗叛军并发起反击！"
 
 eth.13.t:0 "埃塞俄比亚兵变被平定！"
 eth.13.d:0 "席卷全国的埃塞俄比亚军事政变被忠于君主的军队平定，经过一番激战，政府军夺回首都亚的斯亚贝巴，叛军不得不撤离。政变领袖Mengistu Neway将军在郊区自杀，埃塞俄比亚政府经过验尸确认。\n皇帝海尔·塞拉西一世从国外返回埃塞俄比亚，政变使得整个国家动荡不安，皇帝宣布授权军方全权负责治安维护，并对任何可能勾结叛军之人展开调查。"
 
 eth.14.t:0 "埃塞俄比亚革命政权的巩固"
 
 eth.15.t:0 "埃塞俄比亚东正教会呼吁反对叛乱！"
 
 eth.20.t:0 "厄立特里亚问题"
 
 eth.21.t:0 "英国计划厄立特里亚单方面建国"
 
