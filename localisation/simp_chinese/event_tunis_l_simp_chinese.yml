l_simp_chinese:
 tun.1.t:0 "突尼斯民族主义政治家在开罗发表演讲"
 tun.1.d:0 "突尼斯民族主义政治家哈比卜·布尔吉巴在该国埃及发表演讲，呼吁各国关注法国统治下的突尼斯局势。自从1881年《巴尔杜条约》签订以来，突尼斯便沦为了法国的殖民地，在第二次世界大战期间，突尼斯人积极支持盟军和法国的战斗，然而却没有在战后得到应有的回报和尊重，法国不断从突尼斯掠夺矿产资源，大量在法国企业工作的突尼斯人得不到基本的人权，突尼斯的不满情绪日益增长，但法国人却只会使用暴力来镇压。"
 
 tun.2.t:0 "突尼斯宪政党的崛起"
 tun.2.d:0 "突尼斯人的反殖民情绪推动了突尼斯宪政党的兴起，该组织从1925年成立以来一直致力于在突尼斯支持反对法国的民族主义运动。而随着二战后，法国当局在突尼斯的统治愈发倾向于暴力镇压，宪政党也开始走向武装暴动的道路。"
 
 tun.3.t:0 "突尼斯民族主义运动正在兴起"
 tun.3.d:0 "法国对突尼斯的统治已经引发了许多突尼斯人的不满，反对法国统治的游行示威正在突尼斯不断地发生，双方矛盾日益激化。"
 
 tun.4.t:0 "突尼斯爆发骚乱"
 tun.4.d:0 "突尼斯爆发大规模骚乱，民族主义者走上街头游行示威，抗议法国的统治并要求废除《巴尔杜条约》实现独立！"
 
 tun.5.t:0 "突尼斯爆发流血冲突"
 tun.5.d:0 "突尼斯爆发大规模骚乱，民族主义者走上街头游行示威，抗议法国的统治并要求废除《巴尔杜条约》实现独立。法国警察使用暴力手段进行镇压，双方爆发激烈的流血冲突，多人伤亡。"
 
 tun.6.t:0 "突尼斯民族主义政治家与民族主义者接触"
 tun.6.d:0 "突尼斯民族主义政治家哈比卜·布尔吉巴与突尼斯的民族主义者近期频繁会面，似乎民族主义政治家正寻求与民族主义者合作，以将法国人驱逐出突尼斯。"
 
 tun.7.t:0 "突尼斯发生暴动"
 tun.7.d:0 "法国将哈比卜·布尔吉巴流放出突尼斯的行为激怒了突尼斯人民，愤怒的突尼斯群众包围了法国殖民政府机构，要求将民族主义政治家送回突尼斯，并要求法国人滚出他们的国家！"
 
 tun.8.t:0 "突尼斯爆发流血冲突"
 tun.8.d:0 "突尼斯爆发大规模骚乱，民族主义者走上街头游行示威，要求将民族主义政治家哈比卜·布尔吉巴送回突尼斯并立刻驱逐法国势力。法国警察使用暴力手段进行镇压，双方爆发激烈的流血冲突，多人伤亡。"
 
 tun.9.t:0 "关注突尼斯局势"
 tun.9.d:0 "突尼斯发生的反殖民运动引起了全世界关注，我们应当就此事发表一则外交声明，以提高我国的国际影响力。"
 
 tun.10.t:0 "[FROM.GetName]表态呼吁尊重突尼斯人民的政治诉求"
 tun.10.d:0 "[FROM.GetName]政府发表声明，宣布支持突尼斯人民反对法国殖民统治的政治运动，呼吁法国当局尊重突尼斯人民的诉求。"
 
 tun.11.t:0 "布尔吉巴被流放！"
 tun.11.d:0 "来自突尼斯的消息，法国殖民当局今早逮捕了突尼斯民族主义政治家哈比卜·布尔吉巴，并将其带上了前往克里特岛的轮船。法国政府宣称，哈比卜·布尔吉巴暗中支持突尼斯的反法运动，因此决定将其流放。"
 
 tun.14.t:0 "卡萨布兰卡发生炸弹袭击事件"
 
 tun.15.t:0 "Muhammad Zarqtuni在狱中自杀"
 
 tun.16.t:0 "关注突尼斯局势"
 
 tun.17.t:0 "政府宣布支持突尼斯民族解放运动"
 
 tun.18.t:0 "突尼斯代表在联合国发表演讲"
 
 tun.19.t:0 "突尼斯民族主义者的请求得到大多数国家支持"
 
 tun.20.t:0 "哈比卜·布尔吉巴回到突尼斯"
 
 tun.21.t:0 "突尼斯问题的谈判在巴黎举行"
 tun.21.d:0 "在巴黎的历史性谈判桌上，突尼斯的独立命运迎来了决定性的转折点。以哈比卜·布尔吉巴为首的突尼斯政治家代表，与法国政府就废除1881年的《巴尔杜条约》及结束法国对突尼斯的“保护国”地位展开激烈交锋。\n谈判的核心矛盾在于“完全独立”与“特权保留”之间的根本对立。突尼斯方立场坚决，要求彻底废除不平等条约，恢复完整的国家主权。法国则试图在承认突尼斯独立的同时，竭力保留其在战略与经济上的特殊利益，包括在突尼斯驻军、维持经济上的优惠待遇，以及在比赛达等重要港口享有的治外法权。\n会谈充满了拉锯与博弈。这场谈判不仅关乎一纸条约的存废，更是突尼斯结束长达75年殖民历史的最后一战。"
 tun.21.a:0 "我们的外交部门将保持关注"
 tun.21.b:0 "我们要求突尼斯保留法国影响力"
 tun.21.c:0 "我们同意完全离开突尼斯"
 
 tun.22.t:0 "关于突尼斯未来的事务"
 tun.22.d:0 "法国政府希望突尼斯独立后，法方继续在突尼斯保持影响力，同时还要求在突尼斯保留驻军权力。"
 
 tun.23.t:0 "法国提议穆罕默德·穆克里继承王位"
 
 tun.24.t:0 "突尼斯代表拒绝我方提案"
 tun.24.d:0 "突尼斯代表拒绝了我方提案，对方要求法国的影响力完全离开突尼斯。"
 
 tun.25.t:0 "突尼斯谈判不欢而散"
 
 tun.26.t:0 "突尼斯与法国政府正式达成协议"
 tun.26.d:0 "突尼斯代表团与法国政府的谈判宣告结束，法国的强硬立场在国际形势变化及突尼斯人民持续抗争的压力下有所松动。两国将正式废除1881年《巴尔杜条约》，结束突尼斯的保护国地位，成为完全的主权国家，法国军队和政府官员将在不久后撤离突尼斯。"
 
 tun.27.t:0 "突尼斯让步与法国政府正式达成协议"
 tun.27.d:0 "突尼斯代表团与法国政府的谈判宣告结束，两国将修改1881年《巴尔杜条约》，结束突尼斯的保护国地位，但法国依然在突尼斯遗留了影响力，法国军队和政府官员仍将继续驻扎突尼斯一段时间。"
 
 tun.28.t:0 "突尼斯正式独立！"
 tun.28.d:0 "在突尼斯城的迦太基宫，突尼斯民族主义的领袖哈比卜·布尔吉巴，在突尼斯人民的注视下，正式宣布，该国将根据与法国的谈判结果，正式结束保护国地位，成为独立的主权国家！法国军队将在不久后撤离这片统治了五十多年的土地。独立后的突尼斯成为一个君主立宪制国家，突尼斯贝伊，穆罕默德八世成为国王，哈比卜·布尔吉巴就任突尼斯总理。"