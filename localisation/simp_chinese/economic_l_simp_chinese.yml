 ###金融
 buissness_inflation:0 "通货膨胀情况"
 buissness_inflation_desc:0 "通货膨胀即衡量当前市场流通的货币数量、价值与商品价值的对比。这一数值受消费品供应和货币供应影响，消费品供不应求或货币发行过多，会导致通货膨胀的上升。\n通货膨胀情况的恶化会减少财政转化的政治点数数量减少、以及决议和内阁花费的政治点数增加，以及群众的不满，但适当的通膨会增加商品出口利润。"
