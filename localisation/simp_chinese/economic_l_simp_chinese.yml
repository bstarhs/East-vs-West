 buissness_inflation_bad:0 "严重"
 buissness_inflation_crash:0 "崩溃"
 
 buissness_debt:0 "外债"
 buissness_debt_desc:0 "外债是可供你临时使用的财政支出，你可以通过联合国、国际货币基金组织或超级大国借取外债。\n外债使用一段时间后就会连本带利收回，如果无法偿还外债，会导致严重的政治点数、国际影响力、乃至通货膨胀和稳定度惩罚。。你也可以尝试运用政治手段销毁外债。"
