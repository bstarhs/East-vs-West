l_simp_chinese:
 FRA_Algerian_MNA:0 "支持阿尔及利亚亲法势力"
 FRA_Algerian_MNA_desc:0 "阿尔及利亚存在许多从法国统治中受益的既得利益者，包括哈基人、基督徒和中产阶级，我们应该尝试支持这些亲近法国的人士，在阿尔及利亚建立亲近法国的自治政府，让阿尔及利亚人治理阿尔及利亚人，即可以减轻我们的负担，也可以减轻国际社会对我们的指责。"
 FRA_Plan_constantine:0 "君士坦丁工程"
 FRA_Plan_constantine_desc:0 "君士坦丁工程指在阿尔及利亚进行的一系列投资与开发，包括帮助阿尔及利亚建设完善的教育、医疗、基础设施和轻工业系统，以创造就业岗位，赢得阿尔及利亚群众的支持。"
 FRA_Peyrefitte_plan:0 "阿兰·佩雷菲特方案"
 FRA_Peyrefitte_plan_desc:0 "法国外交官阿兰·佩雷菲特提出了一个阿尔及利亚独立的妥协方案：阿尔及利亚的北方将由法国监督下选举并成立的阿尔及利亚新政府，成立一个“对法国友好”的独立国家，并与法国签订一系列条约，确保法国的一系列利益不会在阿尔及利亚独立后受到损失，此外，阿尔及利亚南方的沙漠地区将由法军继续驻扎，以保障法国的核试验和其他军事行动不受影响。"
 FRA_defence_algeria:0 "保卫阿尔及利亚"
 FRA_defence_algeria_desc:0 "阿尔及利亚是法兰西永远不可分割的骨肉和遗产，我们将和所有试图将阿尔及利亚夺走的叛乱势力战斗到底！法兰西万岁！"
 AlgeriaRevolt:0 "阿尔及利亚独立战争已爆发"
 
 FRA_Minitel:0 "发展互联网"
 FRA_Minitel_desc:0 "利用计算机和电话线传播信息的互联网将成为未来科技中最重要的一环，我们必须尽快掌握互联网信息技术，并运用到生产生活上。"
 
 FRA_111111:0 "企业国有化"
 FRA_111111:0 "劳工权益"
 FRA_111111:0 "福利国家典范"
 FRA_BaoDai_desc:0 "我们在印度支那的状况不断恶化，为了应对国际社会的质疑和安抚越南人，我们应该把流亡香港的越南末代皇帝保大请回来，扶持一个傀儡政权。"
 
 FRA_EAEC:0 "欧洲原子能共同体"
 FRA_EAEC_desc:0 "欧洲共同市场日趋成熟，我们不仅要强化欧洲各国在经济上的合作，政治、军事和社会政策也要高度协同，从而实现许多欧洲政治家一直以来都希望建立的欧洲共同体。"
 FRA_EAEC_tool:0 "欧洲煤钢共同体成员国可以获得法国电力公司作为工业企业以增加核能研究速度，每有一个国家使用法国电力，法国都将获得政治点数奖励。"
 
 FRA_students_autonomy:0 "学生自治委员会"
 FRA_students_autonomy_desc:0 "毛泽东说，年轻人是早晨的太阳，应当成为革命的领导力量。学校和教育机构不应该掌握在腐朽低效的官僚系统中，因为行政官僚指挥照本宣科，扼杀年轻人的激情和对进步理念的探索。教育系统而应该由学生、教师民主选举出的委员会来管理，以确保民主制度能在校园内实行，鼓励年轻人在学习文化知识的同时，又能进行更好的革命实践。"
 FRA_radical_socialreform:0 "更激进的社会改革"
 FRA_radical_socialreform_desc:0 "法兰西目前存在许多的封建和资本主义残余，例如封建的教会，落后的文化。我们如果要创造一个新世界，就要砸碎旧世界！"
 FRA_Cooperatives:0 "农业合作社"
 FRA_Cooperatives_desc:0 "农业生产的社会主义改革要从生产关系开始。我们将颁布土地改革法，没收大资本家、大庄园主和富农的多于土地，并成立农业合作社，鼓励农民加入，分享生产资料和生产成果。"
 FRA_rural_communie:0 "农村公社运动"
 FRA_rural_communie_desc:0 "来自中国的人民公社运动为我们提供了宝贵经验。人民公社社员按需分配，集体劳动，有助于调动生产集中化，有效解决农村地区的社会公平和生产积极性问题。"
 FRA_social_system:0 "改进社会管理制度"
 FRA_work_communie:0 "反怠工委员会"
 FRA_work_communie_desc:0 "在新一次五年计划建设的关键时刻，我们不允许有人掉链子。反怠工委员会将监督和惩罚没有完成生产计划的生产单位。"
 FRA_purge:0 "镇压扩大化"
 FRA_purge_desc:0 "一些敌视社会主义法兰西的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。"
 
 FRA_revolution_holland:0 "支持低地革命"
 FRA_revolution_holland_desc:0 "比利时和荷兰的革命群众正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 FRA_revolution_italy:0 "支持意大利革命"
 FRA_revolution_italy_desc:0 "意大利的革命群众正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 FRA_revolution_nordic:0 "支持北欧革命"
 FRA_revolution_nordic_desc:0 "瑞典、丹麦和挪威的革命群众正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 FRA_revolution_ireland:0 "支持爱尔兰革命"
 FRA_revolution_ireland_desc:0 "爱尔兰的革命群众正在与反动势力及英帝国主义进行激烈的斗争，他们需要我们的帮助！"
 FRA_revolution_usa:0 "支持美国左翼革命"
 FRA_revolution_usa_desc:0 "美国的革命群众正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 FRA_revolution_vietnam:0 "支持越南斗争"
 FRA_revolution_vietnam_desc:0 "印度支那的革命势力正在和美帝国主义及其走狗进行激烈的斗争，他们需要我们的帮助！"
 
 FRA_MJCF:0 "青年共产主义者运动"
 FRA_MJCF_desc:0 "青年共产主义者运动是法国共产党的青年翼。"
 FRA_left_army:0 "支持军队中的左翼"
 FRA_left_army_desc:0 "军队中依然存在许多反动势力，我们必须将右翼势力从军队中剔除，并以支持革命，支持社会主义的人士所取代。"
 FRA_political_comisars:0 "设立政治委员"
 FRA_political_comisars_desc:0 "政委是人民军队中政治动员的核心机构，通常包括自成一体的政工组织和文化工作团队。然而并不是每一个政权都能容忍有军队有思想，这既取决于他们有没有足以自圆其说的战略目标，同时也取决于他们的执政理念。很显然我国二者兼备。"
 FRA_armee_pueble:0 "法国人民军"
 FRA_nacional_defence:0 "重建国民自卫军"
 FRA_nacional_defence_desc:0 "现有的法国军队已完全被反革命分子所控制和腐蚀，与其花时间改造反动军队，不如解散现有武装力量，重组国民自卫军，让民众武装起来，保卫社会主义法兰西！\n武装起来，公民们\n组织起你们的队伍！"
 
 FRA_lefts_colonies:0 "支持海外领地的左翼"
 FRA_lefts_colonies_desc:0 "社会主义的法兰西当然不再需要榨取殖民地了，但另一方面，如果我们能在撤离殖民地之前，支持一下当地的左翼势力，邀请他们进入当地政府，可以有效支持国际社会主义运动。"
 FRA_invite_social_party:0 "邀请社会党"
 FRA_invite_social_party_desc:0 "法国共产党并非斯大林式的一党专政体制，我们应该邀请法国社会党中的左翼人士加入我们的政府。"
 FRA_socialism_reform:0 "社会主义改革"
 FRA_socialism_reform_desc:0 "许多落后的文化和生活习惯依然影响着我们的国家，例如男女的不平等和等级制度，如果我国想要成为一个现代国家，就必须将这些落后文化清除。"
 FRA_accept_church_left:0 "接纳教会中的左派"
 FRA_accept_church_left_desc:0 "天主教会并非全是极端反对社会主义的反动分子，也存在许多认可社会主义，支持社会进步的左翼人士，我们应该邀请教会中的左翼人士加入我们的政府。"
 
 FRA_UDCA:0 "支持UDCA联盟"
 FRA_UDCA_desc:0 "UDCA联盟，全称为商户和工匠保卫联盟，由战后最知名的民粹主义政治家皮埃尔·布热德创立。布热得坚决反对战后法国政府所收取的一系列苛捐杂税，认为其破坏了中产阶级、中小企业和农民的利益，因而得到保守主义者的广泛支持。布热德因此积极参与政治活动，希望由此加入法国政府。"
 Poujadistas:0 "UDCA联盟"
 
 FRA_Jeune_Nation:0 "支持青年民族运动"
 FRA_Jeune_Nation_desc:0 "青年民族运动是由极右翼分子皮埃尔·西多斯创立的极右翼社会团体，主张为维希政权翻案，且鼓吹保护法兰西殖民帝国。"
 FRA_Loeuvre_Francaise:0 "法兰西民族行动党"
 FRA_Loeuvre_Francaise_desc:0 "法兰西民族行动党是皮埃尔·西多斯联合让·马里·勒庞建立的一个新的右翼政党，该政党相对青年运动，放弃了激进的暴力活动，转为采取政治斗争路线，但同时也提出了更激进的民族主义、反犹太主义、反马克思主义和反移民的主张。"
 
 FRA_wipe_neoringht:0 "镇压右翼势力"
 FRA_wipe_neoringht_desc:0 "一些想为德国侵略者和他们的纳粹走狗翻案的右翼分子在四处进行破坏活动，执照群众恐慌，让他们进监狱里去宣传他们的法兰西民族主义吧。"
 
 FRA_democratic_monarchism:0 "君主制下的民主宪法"
 FRA_democratic_monarchism_desc:0 "1830年的七月革命使得奥尔良家族登上了法国王位，但先王路易·菲利普没有继承波旁王朝的反动政策，而是尝试了君主立宪改革，有志于打造一个符合法兰西群众需求的君主立宪国家。而当奥尔良家族第二次获得法国王冠时，亨利六世也致力于打造一个民主的、现代化的君主立宪制度，创造一个君主制下的民主国家。"
 FRA_progress_roi:0 "进步主义的君主"
 FRA_progress_roi_desc:0 "亨利六世登上王位，准备建立一个宪政民主的君主立宪法兰西。"
 FRA_new_election:0 "重新举行选举"
 FRA_nacional_revolucion:0 "第二次国家革命"
 FRA_nacional_revolucion_desc:0 "在1940年的失败之后，菲利普·贝当元帅就已经看出，议会制、共和制、多党制云云，只能给法兰西带来失败与灾难。法兰西真正需要的，是强有力的政府，强有力的领袖，以及在天主教和爱国主义的基础上团结起来的国民！国民阵线的旗帜下，团结了让·马利·勒庞先生这样的爱国者，只有让他们成为法兰西的领袖，才能拯救这个国家！"
 
 FRA_algieria_oil:0 "开发阿尔及利亚石油"
 FRA_algieria_oil_desc:0 "阿尔及利亚地区探测出了珍贵的石油和天然气资源。"
 FRA_retreat_algeria:0 "撤离阿尔及利亚"
 FRA_retreat_algeria_desc:0 "高昂的军费，可怕的伤亡数字，国际的制裁和谴责，国内的反战运动……尽管阿尔及利亚对我们是如此重要，但我们已经没有能力再继续殖民地的冒险了。"
 FRA_Etrangere_focus:0 "扩大外籍军团"
 FRA_Etrangere_focus_desc:0 "法国外籍军团是从殖民地征召当地居民组建的武装力量，通过征募当地人口进入军队，可以大大补充法国本土的兵员稀缺，同时从外籍军团退役的士兵也可以成为我们在殖民地的傀儡。"
 FRA_war_sweden:0 "惩戒贝尔纳多特"
 FRA_war_sweden_desc:0 "叛徒让·贝尔纳多特，出卖了拿破仑皇帝以换取瑞典的王座，现在他的子孙还在斯德哥尔摩的王宫里享清福，让我们以陛下的名义向他的后代讨回代价！"
 FRA_algeri_immigrate:0 "向北非移民"
 FRA_algeri_immigrate_desc:0 "我们应当鼓励法国本土白人前往北非，投资、工作、创业、传教并定居，从而在北非建立起属于法国人的资产，在当地留下法兰西的印记。"
 FRA_afrique_immigrate:0 "黑非洲移民"
 FRA_afrique_immigrate_desc:0 "我们应当鼓励法国本土白人前往北非，投资、工作、创业、传教并定居，从而在北非建立起属于法国人的资产，在当地留下法兰西的印记。"
 FRA_expanded_catholic:0 "推广天主教"
 FRA_expanded_catholic_desc:0 "推广天主教，引导海外领地的群众皈依天主，是在当地传播法国价值观，引导群众认同法兰西的重要一步。"
 FRA_develop_algeria:0 "开发阿尔及利亚"
 FRA_develop_algeria_desc:0 "我们希望经济发展可以有效削弱阿尔及利亚人的不满情绪，当他们有稳定的工作和可观的薪水时也就不会再支持叛乱。"
 FRA_retreat_vietnam:0 "撤离印度支那"
 FRA_retreat_vietnam_desc:0 "高昂的军费，可怕的伤亡数字，国际的制裁和谴责，国内的反战运动……尽管印度支那对我们是如此重要，但我们已经没有能力再继续殖民地的冒险了。"
 FRA_anti_bulshvek:0 "反布尔什维克志愿兵团"
 FRA_anti_bulshvek_desc:0 "布尔什维克志愿兵团由反对共产主义的右翼分子组成，是致力于对抗赤色威胁的准军事团体。"
 
 FRA_111111:0 "外交攻势"
 
 FRA_Armee_secrete:0 "支持秘密军事组织"
 FRA_Armee_secrete_desc:0 "法国政府出卖国家海外利益，向叛军妥协的行为不可容忍，一些军人已经团结起来，反对第四共和国。"
 FRA_Consulat:0 "军事执政府"
 FRA_Consulat_desc:0 "法兰西祖国已经处于最危险的时候！在我们的历史上，只有军人能够拯救于法兰西于水火之中！圣女贞德算半个军人，拿破仑将军和戴高乐将军毫无疑问也是军人，而我们也将继承法兰西军人的意志，推翻愚蠢无能的第四共和国，建立一个爱国军人领导下的真正爱国主义政府！Vive le France!"
 
 FRA_militarist_pol:0 "扩大军方权力"
 FRA_militarist_pol_desc:0 "无能的政客还在波旁宫及爱丽舍宫内瓜分利益，让我们把他们赶出去，让军人来掌握政治。"
 FRA_militarist_ecnomic:0 "军事主导经济"
 FRA_militarist_ecnomic_desc:0 "扩大我们的军事力量，需要经济层面的全力支持。我们应当让我们的经济体制抛弃掉没用的奢侈品生产，将重心投入到军工当中。"
 
 FRA_crusade:0 "十字军之王"
 FRA_crusade_desc:0 "让法兰西的孩子们为了天主和基督的荣耀而战。我们将像我们的祖先鲍德温一世和腓力二世一样，向异教徒举起讨伐的长剑！"
 FRA_crusade_on_spain:0 "罗兰之歌"
 FRA_crusade_on_spain_desc:0 "《罗兰之歌》歌颂了法兰西历史上最伟大的骑士罗兰，与伊比利亚异教徒作战的故事，他将激励我们的战士再一次征服伊比利亚！"
 FRA_crusade_on_italy:0 "阿维农遗产"
 FRA_crusade_on_italy_desc:0 "美男子腓力四世国王的铁蹄征服罗马，让教皇俯首称臣，他将激励我们的战士再一次征服意大利！"
 FRA_crusade_on_england:0 "诺曼征服"
 FRA_crusade_on_england_desc:0 "诺曼公爵威廉在黑斯廷斯战役中，将英格兰的伪王斩首，让盎格鲁撒克逊人臣服，他将激励我们的战士再一次征服不列颠！"
 FRA_crusade_on_german:0 "查理曼东征"
 FRA_crusade_on_german_desc:0 "查理大帝率军出征，统一了从比利牛斯到易北河的大半个欧洲，建立伟大的法兰克帝国，他将激励我们的战士再一次征服日耳曼！"
 FRA_crusade_on_russia:0 "向异教东征"
 FRA_crusade_on_russia_desc:0 "邪恶的布尔什维克无神论匪徒将整个东欧的基督徒踩在脚下，让我们前去解救我们的同胞！"
 
 FRA_usa_techs:0 "美国经济援助"
 FRA_usa_techs_desc:0 "我们可以请求美国政府向我们派遣技术顾问，帮助我国科技发展和工业建设。"
 FRA_usa_intel:0 "美国情报援助"
 FRA_usa_intel_desc:0 "我们应当邀请美国情报部门来为我国提供情报援助。虽然这有让我国被美国渗透控制的风险，但利大于弊。"
 FRA_garrison:0 "美国军事援助"
 FRA_garrison_desc:0 "我们可以请求军事政府为我们提供军事援助，包括援助军事装备和军事顾问。"
 
 FRA_develop_light_ship:0 "发展轻型舰艇"
 FRA_develop_light_ship_desc:0 "我们的海军刚刚重建，至少需要一些护卫舰和驱逐舰来保护我们的领海。"
 FRA_develop_medium_ship:0 "发展中型舰艇"
 FRA_develop_medium_ship_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 FRA_develop_naval_equip:0 "发展海军装备"
 FRA_develop_naval_equip_desc:0 "一支强大的海军，不止要拥有战舰的数量，还要发展战舰上的武器和设备，主炮、雷达、近防炮、电子设备、动力设备……"
 
 FRA_develop_sub:0 "发展潜艇"
 FRA_develop_sub_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 FRA_develop_nuke_sub:0 "发展核潜艇"
 FRA_develop_nuke_sub_desc:0 "强大的核动力发动机可以让我们的战略潜艇舰队航行至世界的每一个角落。"
 FRA_develop_sub_missile:0 "发展潜射导弹"
 FRA_develop_sub_missile_desc:0 "核潜艇使得核武器拥有了继陆基、轰炸机之后的第三个发射载体。潜射导弹将允许核潜艇装载核武器并航行至敌人领土附近海域发射，他们的最大优势是不会轻易被敌人发现和击毁，海基核导弹将会是我们的陆基、空基核武器被摧毁后的最后杀手锏。"
 FRA_develop_marines:0 "发展海军陆战队"
 FRA_develop_marines_desc:0 "从诺曼底、地中海沿岸，到遥远的凯尔盖朗岛，围绕岛屿的争夺是保护我国海上主权的关键，一支强大的海军陆战队将让我军拥有保卫海上领土的能力。"
 FRA_develop_landing_ship:0 "发展两栖攻击舰"
 FRA_develop_landing_ship_desc:0 "擅长两栖作战的部队越来越不可或缺。我方海军陆战兵需要拥有专属登陆舰船支持。"
 
 FRA_navbase_brittany:0 "扩大布列塔尼海军基地"
 FRA_navbase_brittany_desc:0 "布列塔尼是法国海军的起源地，我们应当加强在布雷斯特等地的海军基地建设。"
 FRA_navbase_massille:0 "扩大马赛海军基地"
 FRA_navbase_massille_desc:0 "马赛和土伦是我国最重要的海军基地，直面地中海和非洲殖民地，我们应当加强这一地区的海军基地建设，以维护我们对非洲领地的支援。"
 FRA_navbase_basque:0 "扩大西南海军基地"
 FRA_navbase_basque_desc:0 "比斯开湾沿岸有许多优良港湾，应该积极开发这里潜在的海港作为军事用途。"
 
 FRA_navbase_pacifics:0 "扩大太平洋海军基地"
 FRA_navbase_pacifics_desc:0 "为了保护我们在太平洋的核试验基地，我们应当加强在大溪地、新喀里多尼亚等地的海军基地建设。"
 FRA_navbase_indochina:0 "扩大印度支那海军基地"
 FRA_navbase_indochina_desc:0 "为了保护我们在远东的领地和利益，我们应当加强在西贡、西哈努克等地的海军基地建设。"
 
 FRA_navbase_morroco:0 "扩大北非海军基地"
 FRA_navbase_morroco_desc:0 "为了保护我们在北非的领地和利益，我们应当加强在阿尔及尔、摩洛哥、突尼斯等地的海军基地建设。"
 FRA_navbase_djibouti:0 "扩大吉布提海军基地"
 FRA_navbase_djibouti_desc:0 "为了保护我们在红海的领地和利益，我们应当加强在吉布提的海军基地建设。"
 FRA_navbase_dakar:0 "扩大西非海军基地"
 FRA_navbase_dakar_desc:0 "为了保护我们在西非和北大西洋的领地和利益，我们应当加强在达喀尔、象牙海岸等地的海军基地建设。"
 FRA_navbase_cntural_afrique:0 "扩大中非海军基地"
 FRA_navbase_cntural_afrique_desc:0 "为了保护我们在中非的领地和利益，我们应当加强在加蓬、布拉柴维尔等地的海军基地建设。"
 
 FRA_militarist_indus1:0 "军事工业 I"
 FRA_militarist_indus1_desc:0 "二战后国际格局瞬息万变，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 FRA_militarist_indus2:0 "军事工业 II"
 FRA_militarist_indus2_desc:0 "二战后国际格局瞬息万变，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 FRA_militarist_indus3:0 "军事工业 III"
 FRA_militarist_indus3_desc:0 "新时代的武器装备更复杂、多样化且昂贵，唯有进一步扩张我国的军事工业，才能腾出足以敷用的产能奋起直追。"
 FRA_militarist_indus4:0 "军事工业 IV"
 FRA_militarist_indus4_desc:0 "新时代的武器装备更复杂、多样化且昂贵，唯有进一步扩张我国的军事工业，才能腾出足以敷用的产能奋起直追。"
 FRA_develop_armor:0 "发展装甲部队"
 FRA_develop_armor_desc:0 "我们必须从第二次世界大战的耻辱失败中吸取教训，装甲部队是一个强大陆军的基础。"
 FRA_develop_mechanized:0 "发展机械化部队"
 FRA_develop_mechanized_desc:0 "我们必须从第二次世界大战的耻辱失败中吸取教训，机械化部队是一个现代化陆军的基础。"
 FRA_develop_avalion:0 "发展陆军航空兵"
 FRA_develop_artyllery:0 "发展炮兵"
 FRA_develop_artyllery_desc:0 "上帝站在最好的炮兵一边。\n——拿破仑·波拿巴"
 FRA_develop_engeneers:0 "发展陆军工程兵"
 
 FRA_airbase:0 "扩大空军基地"
 FRA_eastern_airbase:0 "扩大东部空军基地"
 FRA_eastern_airbase_desc:0 "东部边界是我们对抗来自东方的入侵的最前沿，我们应当加强在阿尔萨斯、洛林、皮卡第等地的空军基地建设。"
 FRA_notre_airbase:0 "扩大北部空军基地"
 FRA_notre_airbase_desc:0 "我们与英国人的同盟关系并不百分百牢固，应当时刻警惕他们从背后捅一刀，我们应当加强在诺曼底、布列塔尼等地的空军基地建设。"
 FRA_suid_airbase:0 "扩大南部空军基地"
 FRA_suid_airbase_desc:0 "马赛和土伦是我国最重要的海军基地，直面地中海和非洲殖民地，我们应当加强这一地区的空军基地建设，以维护我们对非洲领地的支援。"
 FRA_indochina_airbase:0 "扩大印度支那空军基地"
 FRA_indochina_airbase_desc:0 "为了保护我们在远东的领地和利益，我们应当加强在西贡、西哈努克等地的空军基地建设。"
 FRA_notre_afrique_airbase:0 "扩大北非空军基地"
 FRA_notre_afrique_airbase_desc:0 "为了保护我们在北非的领地和利益，我们应当加强在阿尔及尔、摩洛哥、突尼斯等地的空军基地建设。"
 FRA_vest_afrique_airbase:0 "扩大西非空军基地"
 FRA_vest_afrique_airbase_desc:0 "为了保护我们在西非和北大西洋的领地和利益，我们应当加强在达喀尔、象牙海岸等地的空军基地建设。"
 FRA_centural_afrique_airbase:0 "扩大中非空军基地"
 FRA_centural_afrique_airbase_desc:0 "为了保护我们在中非的领地和利益，我们应当加强在加蓬、布拉柴维尔等地的空军基地建设。"
 
 FRA_develop_jet:0 "发展喷气战斗机"
 FRA_develop_jet_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 FRA_develop_jet2:0 "发展先进战斗机"
 FRA_develop_jet2_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 FRA_develop_transplane:0 "发展运输机"
 FRA_develop_transplane_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 FRA_develop_bomber:0 "发展轰炸机"
 FRA_develop_bomber_desc: "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 FRA_develop_tactical:0 "发展战术核弹"
 
 FRA_develop_strategic:0 "发展战略武器"
 FRA_develop_strategic_desc:0 "德国在二战中发明的V2火箭令我们眼前一亮，这种火箭如果能装载核武器，使其能够更快、更准的发射到地球的另一端，那么战争的历史、人类的历史都将为此改变。"
 
 FRA_Schuman_plan:0 "舒曼计划"
 FRA_Schuman_plan_desc:0 "《凡尔赛条约》的教训警醒我们，对德国实行严酷的战后惩罚是不合理的。外交部长罗伯特·舒曼先生提出了新的方案，有条件允许甚至支持德国人的战后经济重建，以压制德国国内残余的敌对和极端主义势力。"
 
 FRA_red_france:0 "红色法兰西"
 FRA_red_france_desc:0 "残忍的世界大战已经结束，右翼政客和资本主义的保守无能令法国的无产阶级愤怒，法兰西只有走社会主义和马克思列宁主义的道路，才能获得光明的未来！"
 FRA_free_france:0 "自由法兰西"
 FRA_free_france_desc:0 "残忍的世界大战已经结束，邪恶的纳粹政权和他们的维希政府傀儡已被打倒，但法国依然存在来自莫斯科的共产主义威胁，我们将继续与红色势力对抗，以保卫来之不易的自由法兰西！"
 FRA_against_usa:0 "反对美国"
 FRA_against_usa_desc:0 "美帝国主义在二战结束后暴露出他们的真面目，他们反对并试图颠覆欧洲的人民政权，我们也将和他们继续对抗！"
 FRA_accept_communist:0 "接受共产主义"
 FRA_accept_communist_desc:0 "我们应该积极支持法国共产党和其他左派政党，以为工人阶级谋取利益。"
 FRA_socialist:0 "社会主义"
 FRA_socialist_desc:0 "左派的力量不断壮大，共产党和其他社会主义政党已经在议会获得多数，我们将建立一个社会主义左派政府。"
 FRA_pro_soviet:0 "亲近苏联"
 FRA_pro_soviet_desc:0 "伟大的苏维埃社会主义共和国联盟已经成为社会主义国家和第三世界独立国家最坚定的盟友，我们将坚定地和莫斯科的同志们站在一起，对抗帝国主义和殖民主义！"
 FRA_join_WP:0 "加入华约"
 FRA_join_WP_desc:0 "帝国主义国家正不遗余力地寻求颠覆欧洲的社会主义国家，而华沙条约组织将保护我们不被侵犯。"
 FRA_soviet_tech:0 "苏联技术"
 FRA_soviet_tech_desc:0 "我们可以请求苏联政府向我们派遣技术顾问，帮助我国科技发展和工业建设。"
 FRA_com_independent:0 "欧洲社会主义"
 FRA_com_independent_desc:0 "莫斯科把自己看作社会主义阵营的领导人，无视我们的外交独立和自治。如果我们不愿意成为卫星国家，我们就必须寻求新的外交友谊。"
 FRA_east_europe_relation:0 "东欧关系"
 FRA_Gaullisme:0 "戴高乐政府"
 FRA_Gaullisme_desc:0 "第四共和国的混乱令我们的国家前途渺茫，政治无能。让我们邀请尊敬的夏尔·戴高乐将军回到法兰西主张大权吧！"
 FRA_new_east:0 "独立外交"
 FRA_new_east_desc:0 "我们将建立属于自己的外交政策，使法国在世界舞台上有一席之地，而不是跟着美国的道路去走。"
 FRA_china:0 "与北京建交"
 FRA_china_desc:0 "中国共产党已经执政了中国数十年时间，事实证明，他们确实令这个国家变得更好了，并且在未来相当长的时间内，中共政权不会被推翻……我们不能与这占世界上四分之一人口的世界永远断绝关系，是时候向北京伸出橄榄枝了。"
 FRA_4th_international:0 "第四国际"
 FRA_4th_international_desc:0 "第四国际"
 FRA_NATO_leader:0 "成为北约领袖"
 FRA_NATO_leader_desc:0 "随着我们在欧洲的影响力不断增加，许多欧洲国家比起美国，更愿意与我们合作。我们完全可以取代美国，成为北大西洋公约的领袖。"
 FRA_latin_revo:0 "支持拉丁美洲革命"
 FRA_latin_revo_desc:0 "拉丁美洲地区的革命群众正在与帝国主义支持下的独裁军政府和大种植园剥削者进行激烈的斗争，他们需要我们的帮助！"
 FRA_new_cold_war:0 "新冷战"
 FRA_new_cold_war_desc:0 "美国的衰退并不意味着自由世界的失败。法兰西人民将接过西方自由世界的旗帜，继续与邪恶共产主义对抗。"
 FRA_nuke:0 "独立核武器"
 FRA_nuke_desc:0 "原子能的释放改变了一切，谁拥有核武器，谁就能拥有国际地位。美国试图向我们出售他们的核保护伞，换取我们不开发核武器，这种骗局我们不会接受，法兰西必须开发属于自己的核武器。"
 FRA_exit_Nato:0 "退出北约"
 FRA_exit_Nato_desc:0 "北大西洋公约并不是西欧自由国家的庇护伞，而是美国人施加在欧洲大陆身上的枷锁，法国人民不会屈服于华盛顿的遥控，而是追求自主的政治和外交政策。"
 FRA_soviet_relation:0 "与苏联关系"
 FRA_soviet_relation_desc:0 "与苏联的对抗并不有利于我们的利益，我们应该尝试与莫斯科改善关系，以维护欧洲的和平。"
 FRA_new_Constitution:0 "第五共和国"
 FRA_new_Constitution_desc:0 "第四共和国的宪法没有给战后的法兰西带来和平，政党林立，政府更迭频繁，政治混乱。法兰西需要的是一个稳定的政府，从而保证政府的正常工作。"
 FRA_Presidential_right:0 "总统制"
 FRA_Presidential_right_desc:0 "议会制多党政府面对法国现在的各种难题，不仅没有解决方案，反而争权夺利，一个内部混乱的政府是无法解决实际问题的，我们应该重新建立总统制国家，强化法兰西共和国总统的权力。"
 FRA_parliament_right:0 "议会制"
 FRA_parliament_right_desc:0 "督政府和第二帝国的历史为我们留下教训，一个强有力的政府可能走向独裁甚至君主复辟，只有稳定的议会制政府，互相制衡和监督的部门，才能维护法兰西的民主。"
 FRA_Reorganizing_government:0 "政府改革"
 FRA_Reorganizing_government_desc:0 "法兰西即将实行新的政治和经济政策，在此之前，我们需要改革政府，裁减荒废的部门，强化官僚的能力和行政效率。"
 FRA_ecnomic_reform:0 "1969宪法"
 FRA_ecnomic_reform_desc:0 "法兰西第五共和国的政治改革逐步完成，新的宪法将巩固改革成果。"
 FRA_high_welfare:0 "福利国家"
 FRA_high_welfare_desc:0 "福利国家正成为战后西欧多国的共识，利用凯恩斯主义经济学说，提供福利保障，以刺激消费，促进社会平等，拉拢劳工阶层。"
 FRA_Nouveau_Franc:0 "发行新法郎"
 FRA_Nouveau_Franc_desc:0 "发行新的货币有利于稳定市场和经济，刺激消费需求。"
 FRA_ECSC:0 "欧洲煤钢共同体"
 FRA_ECSC_desc:0 "法兰西的战后重建需要大量的资源，尤其是煤炭和钢铁。我们的殖民地恐怕无法满足我们的需求，因此我们向欧洲市场寻求合作。我们将与比利时、卢森堡、意大利、西班牙和德国谈判，降低关税，消除贸易壁垒，从而使欧洲各国之间更好地进行重要资源的贸易和市场开放。"
 FRA_EEC:0 "欧洲经济共同体"
 FRA_EEC_desc:0 "欧洲共同市场日趋成熟，我们不仅要强化欧洲各国在经济上的合作，政治、军事和社会政策也要高度协同，从而实现许多欧洲政治家一直以来都希望建立的欧洲共同体。"
 FRA_EEC_tool:0 "除了矿产和原材料外，欧洲共同体成员国之间进出口工业制品的成本和利润也将优化。"
 FRA_Concorde:0 "协和式客机"
 FRA_Concorde_desc:0 "这架可以以令人惊讶的速度，横跨大西洋的超级客机，不仅能让世界旅客眼前一亮，也将在世界航空史上写下法兰西永久的成就。"
 FRA_against_WGR:0 "对抗西德"
 FRA_against_WGR_desc:0 "西方国家支持的法西斯余孽分子，在德国西部实行威权统治，不得人心，德国的左翼运动风起云涌。让我们来给他们添把火。"
 FRA_against_Spain:0 "对抗西班牙"
 FRA_against_Spain_desc:0 "法西斯打不倒西班牙人民的顽强精神，依然有许多自由战士反抗弗朗哥政权，这次法兰西不会再坐视不管！"
 FRA_war_england:0 "对抗英国"
 FRA_war_england_desc:0 "爱尔兰和约克煤矿的革命群众正在与反动势力及英帝国主义进行激烈的斗争，他们需要我们的帮助！"
 FRA_Output_revolution:0 "输出革命"
 FRA_Output_revolution_desc:0 "英美帝国主义和殖民主义已经遭到全世界热爱和平的革命人民批判，我们将支持世界人民反帝斗争！"
 FRA_spain_revolution:0 "支持西班牙革命"
 FRA_spain_revolution_desc:0 "法西斯打不倒西班牙人民的顽强精神，依然有许多自由战士反抗弗朗哥政权，这次法兰西不会再坐视不管！"
 FRA_Quebec:0 "支持魁北克独立"
 FRA_Quebec_desc:0 "两百年前，英国人从我们手中夺取了法属加拿大，但这里的法裔人口一直没有得到公正对待。让我们支持我们的魁北克同胞争取自由！"
 FRA_exit_Colonialism:0 "退出殖民地"
 FRA_exit_Colonialism_desc:0 "天下没有不散的宴席，我们不得不承认，法兰西殖民帝国的历史即将走向终结。我们将考虑逐步结束我们对各大殖民地的统治。"
 FRA_Francias_Community:0 "法兰西共同体"
 FRA_Francias_Community_desc:0 "殖民体系的结束，不意味着我们与前殖民地地区的经济和政治关系完全中断。自治后的殖民地将并入法兰西共同体，与我们分享他们的资源和市场。"
 FRA_peace_with_soviet:0 "结束冷战"
 FRA_peace_with_soviet_desc:0 "第一次世界大战，第二次世界大战，殖民战争……法兰西已经饱受战火摧残太久了，如果再来一次核战争，也许这个国家就将不复存在。与苏联实现和解，实现欧洲的持久和平，是法兰西和欧洲各国人民共同的愿望。"
 FRA_grand_europe:0 "大欧洲"
 FRA_grand_europe_desc:0 "欧洲的统一是许多法国领袖希望实现而未能实现的理想，查理曼是如此，路易十四是如此，拿破仑亦是如此。欧洲联盟的出现让欧洲的统一看到了曙光，只有一个统一的欧洲，才能为我们的人民带来和平与繁荣。"
 FRA_oilfroduc:0 "发展石油工业"
 FRA_oilfroduc_desc:0 "石油是现代工业的血液，发展石油工业是不可缺少的一步。"
 FRA_Europe_security:0 "欧洲防务共同体"
 FRA_Europe_security_desc:0 "欧洲各国应当进一步加强军事上的合作，以对抗军事威胁。"
 FRA_independent_defence:0 "发展防务"
 FRA_independent_defence_desc:0 "我们必须从1940年的耻辱失败中吸取教训，我们未来的军事发展不能再依赖像马奇诺防线这样的落后技术了。必须发展先进技术，法兰西不仅要有强大的空军和机械化装备，未来还要拥有核武器！"
 FRA_nuclear:0 "原子能委员会"
 FRA_nuclear_desc:0 "国家原子能委员会将集合法国最先进的核物理学家，以加快对核技术的研究与开发，"
 FRA_euros_european:0 "欧洲人的欧洲"
 FRA_euros_european_desc:0 "欧洲事务必须由欧洲人来共同主导，并与来自遥远前殖民地的暴发户国家保持距离。"
 FRA_civil_nuclear:0 "梅斯梅尔计划"
 FRA_civil_nuclear_desc:0 "核能不仅带来了军事上的可怕武器，也可以运用到民间。核子能发电不仅可以提供巨大的能源，并且相比化石能源污染更少。"
 FRA_Gerboise_Bleue:0 "蓝色跳鼠计划"
 FRA_Gerboise_Bleue_desc:0 "核武器将彻底改变法兰西的国际地位，让高卢雄鸡在核爆的轰鸣中觉醒。"
 FRA_pacific_test:0 "太平洋核试验"
 FRA_pacific_test_desc:0 "核武器开发需要寻找一片无人的土地进行核爆试验，随着我们失去在非洲的领地，我们无法再继续在撒哈拉沙漠进行核试验，但我们可以尝试将核试验基地迁到我们在太平洋的岛屿殖民地，那里的远海十分适合进行核试验，当然这可能会引发一些小岛国的不愉快。"
 FRA_GER:0 "爱丽舍条约"
 FRA_GER_desc:0 "德国历史上曾对法国发动数次入侵，带来的巨大的灾难，然而世界局势是变化的，而阻止德国的复兴是不可能的，因此比起与这个搬不走邻居敌对，最好的选择是和解与联合，化敌为友。"
 FRA_ITA:0 "对意大利关系"
 FRA_ITA_desc:0 "我们应该进一步改善与意大利的关系，以推动欧洲的和平，并加强两国之间的贸易往来。"
 FRA_ENG:0 "英法和解"
 FRA_ENG_desc:0 "英国和法国联合起来，共同赢得了两次世界大战，而第三次世界大战的威胁正在加重，这要求我们再一次与英国建立同盟，即使两国存在诸多的矛盾。"
 FRA_Airbus:0 "空中客车"
 FRA_Airbus_desc:0 "英法合资的空中客车公司主要研发战斗机和运输机。"
 FRA_GER_Unit:0 "德法混合旅"
 FRA_GER_Unit_desc:0 "德法混合旅"
 FRA_space:0 "宇宙探索"
 FRA_space_desc:0 "1793年，法国人首次使用热气球飞向高空，向世人展示了法兰西的探索精神和航空城就。现在，太空时代即将来临，法兰西不能落后于人。"
 FRA_Proxy:0 "代理人"
 FRA_Proxy_desc:0 "法兰西当然不会如此轻易地放弃我们的遗产，我们可以在领地中物色一批政客，把他们变成我们的朋友，然后帮助他们进入政府，以此保持我们对这些独立后的领地的控制。"
 FRA_Proxy_tool:0 "允许殖民地在建立傀儡政权后独立"
 FRA_African_Police:0 "非洲宪兵"
 FRA_African_Police_desc:0 "非洲果然不能没有欧洲。独立后的非洲各国政治混乱，局势动荡，叛乱此起彼伏，我们将派遣武装部队前往非洲，帮助当地当局镇压叛乱，保护我们的政治和经济影响力。"
 FRA_keep_clony:0 "保卫殖民地"
 FRA_keep_clony_desc:0 "殖民地叛乱此起彼伏，我们必须武力保护法兰西在世界各地的资产！"
 FRA_colony_self_defence:0 "殖民地自主防卫"
 FRA_colony_self_defence_desc:0 "我们的领地遍布全球，但我们的军队有限，不可能照顾到每一个角落。我们应当允许殖民地组件自己的武装力量。"
 FRA_frenchnized_lagier:0 "北非法国化"
 FRA_frenchnized_lagier_desc:0 "法属北非与众不同，我们在那里有着大量的财产、投资和移民，可以说，北非早已融入法兰西，成为我们的一部分。但那里依然有许多阿拉伯人，讲阿拉伯语，信伊斯兰教。我们需要改变这一地区的文化，传播天主，传授法语，建立该地区对法兰西的认同感。"
 FRA_inflect_latin:0 "宣称拉美旧殖民地"
 FRA_inflect_latin_desc:0 "圭亚那、海地、魁北克、路易斯安那……这些地区都曾是法兰西帝国的一部分。我们将夺回我们的遗产！"
 FRA_diplomacy_latins:0 "改善拉丁美洲关系"
 FRA_me_colonies:0 "宣称中东旧殖民地"
 FRA_me_colonies_desc:0 "叙利亚、黎巴嫩、西奈半岛……这些地区都曾是法兰西帝国的一部分。我们将夺回我们的遗产！"
 FRA_diplomacy_arabs:0 "改善与阿拉伯国家关系"
 FRA_diplomacy_arabs_desc:0 "尽管许多阿拉伯人可能仍记得一战后的殖民统治，但为了珍贵的石油资源和国际影响力，我们还是需要改善与阿拉伯国家的关系。"
 FRA_diplomacy_isr:0 "改善与以色列关系"
 FRA_diplomacy_isr_desc:0 "比起军事实力和政治倾向都不可靠的阿拉伯国家，以色列毫无疑问是我们在中东最合适的盟友，即使犹太游说团不来找我们，我们也应该支持以色列，以保证我们在中东的政治存在。"
 FRA_TGV:0 "TGV铁道项目"
 FRA_TGV_desc:0 "高速铁道的发展大大改善了交通运输的发展，我们需要尽快掌握这项技术。"
 FRA_culture_project:0 "文化项目"
 FRA_culture_project_desc:0 "让全世界每一个人都能为法兰西的文化而折服！让人们惊叹于菲利斯·佛格的奇妙旅程，伤感于冉·阿让的曲折人生，喝彩于三剑客的勇气与坚毅！"
 FRA_tourism:0 "发展旅游业"
 FRA_tourism_desc:0 "我恨这座塔，因为他比我本人更出名！——古斯塔夫·埃菲尔"
 FRA_western_union:0 "西方同盟"
 FRA_western_union_desc:0 "我们亲爱的美国朋友，将我们从德国纳粹的手中解放，而未来，美国也将致力于对抗世界上的共产主义颠覆运动，他们将继续作为我们的重要盟友，与我们一同对抗共产主义的扩张。"
 FRA_new_empire:0 "保卫法兰西的利益"
 FRA_new_empire_desc:0 "法国在第二次世界大战中饱受摧残，只有团结和权威才能让这个新生的国家保持稳定和强大。我们要和共产主义颠覆分子斗争，我们还要和海外的叛乱势力斗争。"
 FRA_monarchism:0 "君主制的归来"
 FRA_monarchism_desc:0 "自从1876年所谓的共和国复辟以来，政治混乱已经给法兰西带来了太多混乱，自以为民主的党派斗争只会争权夺利，一个没有君主、没有天主的法兰西，只能是一盘散沙。路易十四和拿破仑三世的治理，证明了终究只有一位君主才能真正团结起一个国家。人民不能没有法兰西，而法兰西不能没有国王。"
 FRA_puppet:0 "扶植傀儡"
 FRA_ovsersea_provinces:0 "内地延长主义"
 FRA_ovsersea_provinces_desc:0 "法兰西的殖民政策被称作内地延长主义，即通过教育和官僚体制，将殖民地的居民同化，从而维护法国在当地的影响力。"
 FRA_inflect_china:0 "渗透中国内地"
 FRA_inflect_china_desc:0 "法国是十九世纪末在中国拓展势力范围的支持者，但在二战之后，我们在中国的殖民地和租界被收回。现在中国正处于国共内战之中，通过在中国支持代理人，资助反对派武装，从而重新在中国建立我们的势力范围，尤其是阻止中国政府对印度支那独立运动的支持。"
 FRA_inflect_quebec:0 "支持魁北克分离主义"
 FRA_inflect_quebec_desc:0 "两百年前，英国人从我们手中夺取了法属加拿大，但这里的法裔人口一直没有得到公正对待。让我们支持我们的魁北克同胞争取自由！"
 FRA_control_europe:0 "欧洲霸权"
 FRA_control_europe_desc:0 "法兰西从法兰克王朝开始，就一直追求着在欧洲大陆的霸主地位。让我们跟随美男子腓力、弗朗索瓦一世、黎塞留、路易十四和拿破仑的脚步，重新踏上政府欧罗巴的道路！"
 FRA_Rhineland:0 "莱茵兰共和国"
 FRA_Rhineland_desc:0 "将领土扩展到莱茵河天然边界，并控制这里的自然资源，一直都是法兰西的理想，但二战后的国际形势已不允许我们直接吞并这一地区，但作为战后控制德国领土的胜利者，我们可以在这里成立一个傀儡的莱茵兰共和国，就像拿破仑那样。"
 FRA_take_netherlands:0 "向低地国家施压"
 FRA_take_netherlands_desc:0 "我们要扩大我们在欧洲的控制力，荷兰和比利时作为我们的邻国和欧洲重要国家，理应纳入我们的控制。我们将向他们发布最后通牒，要求他们加入我们主导的阵营。"
 FRA_take_spain:0 "向伊比利亚施压"
 FRA_take_spain_desc:0 "我们要扩大我们在欧洲的控制力，西班牙和葡萄牙作为我们的邻国和欧洲重要国家，理应纳入我们的控制。我们将向他们发布最后通牒，要求他们加入我们主导的阵营。"
 FRA_take_italy:0 "向意大利施压"
 FRA_take_italy_desc:0 "我们要扩大我们在欧洲的控制力，意大利作为我们的邻国和欧洲重要国家，理应纳入我们的控制。我们将向他们发布最后通牒，要求他们加入我们主导的阵营。"
 FRA_economics:0 "发展经济"
 FRA_economics_desc:0 "世界大战已经严重损害了我国的基础工业，尤其是消费品制造。我们必须迅速恢复经济生产，以满足人民对消费品的需求。"
 FRA_manufacture1:0 "发展制造业 I"
 FRA_manufacture1_desc:0 "世界大战已经严重损害了我国的基础工业，尤其是消费品制造。我们必须迅速恢复经济生产，以满足人民对消费品的需求。"
 FRA_manufacture2:0 "发展制造业 II"
 FRA_manufacture2_desc:0 "在恢复了基本消费品的供应之后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 FRA_manufacture3:0 "发展制造业 III"
 FRA_manufacture3_desc:0 "在具备较为完善的工业能力后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 FRA_auto_indus:0 "扩大汽车产业"
 FRA_auto_indus_desc:0 "随着全球汽车产量增加和汽车技术的发展，汽车已不再是一种富人专属的奢侈品，而实进入中产阶层，成为一种重要的消费品。我们需要发展汽车工业，不仅是为了满足消费需求，也是为了让国家更快实现汽车国产、加速经济和工业发展。"
 FRA_invest_africa:0 "投资非洲建设"
 FRA_invest_africa_desc:0 "我们必须增加在非洲的投资，在当地建设轻工业、铁路、基础设施和必要的民用设施，这不仅是为了稳定非洲人的民心河信心，也是为了更好的开发这些地区。"
 FRA_iranium:0 "开采铀矿"
 FRA_iranium_desc:0 "我们在非洲的许多领地，如中非、加蓬和尼日尔有丰富的铀矿，这些铀矿将是我国发展核能必备的资源。"
 FRA_gabon_oil:0 "开采加蓬油田"
 FRA_gabon_oil_desc:0 "加蓬地区蕴含丰富的石油资源，我们将帮助加蓬政府开采石油，以获得回报。"
 FRA_zaire:0 "接触扎伊尔"
 FRA_zaire_desc:0 "曾经的比属刚果是非洲大陆最富有、最重要的资源核心，这里有无数的铀矿、金矿、铜矿和钻石矿……现在，比利时人走了，我们必须抢在俄国人之前在这里建立影响力。"
 FRA_guinea_oil:0 "开采几内亚油田"
 FRA_guinea_oil_desc:0 "加蓬地区蕴含丰富的石油资源，我们将帮助加蓬政府开采石油，以获得回报。"
 FRA_africa_army_proxy:0 "非洲军方的影响力"
 FRA_africa_army_proxy_desc:0 "即使非洲独立，法国的影响力依然广泛存在于法国，其中他们的军人就是我们的代理人。这些军人大都在法国接受过学习和训练，如果帮助他们取代无能的文官政府，能够更好的对抗反法势力和共产主义的渗透。"
 FRA_latin_africa:0 "拉丁非洲联邦"
 FRA_latin_africa_desc:0 "如果我们想要维持在非洲的影响力，我们应该将乍得、喀麦隆、乌班吉、加蓬和布拉柴维尔这些殖民地合并为一个联邦国家，从而在非洲复制一个有实力的代理人政权，"
 FRA_africa_railway:0 "中非铁路"
 FRA_anti_communist:0 "反共产主义"
 FRA_anti_communist_desc:0 "共产主义革命正在危害我们的社会秩序和国家利益，向大家宣布我们国家绝不容忍红色分子。"
 FRA_focus_special_forces_modifiers:0 "国家宪兵干预组"
 FRA_GIGN:0 "国家宪兵干预组"
 FRA_GIGN_desc:0 "国家宪兵干预组是由国家宪兵下属的直属武装部队，是宪兵中的精锐部队，他们将直接负责共和国领导人的安全和首都的警备，同时执行反恐作战任务，以捍卫巴黎和国家的核心。\nPour la Patrie, l'Honneur et le Droit"
 FRA_africa_immigrate:0 "接纳北非移民"
 FRA_africa_immigrate_desc:0 "随着国家的经济法不断发展，不断繁荣的社会也开始导致我们的国家开始老龄化，高度的福利制度也使得劳动力成本越来越高，为了解决这个问题，引进劳动力不失为一个合理的方案。那些从第三世界国家来的移民可以接受更低的福利和薪水。"
 FRA_diplomacy_syria:0 "改善与叙利亚关系"
 FRA_diplomacy_syria_desc:0 "以色列建国后展现的极端侵略性，让中东国家，尤其是叙利亚到不安，他们在寻求能在政治、军事和外交上支持他们的国家，俄国人可能会因此趁虚而入，而我们作为叙利亚的前宗主国，很明显应该抢在俄国人之前支持大马士革，以保护我们在中东的影响力。"
 FRA_diplomacy_lebanon:0 "改善与黎巴嫩关系"
 FRA_diplomacy_lebanon_desc:0 "以色列建国后展现的极端侵略性，让中东国家，尤其是黎巴嫩到不安，他们在寻求能在政治、军事和外交上支持他们的国家，俄国人可能会因此趁虚而入，而我们作为黎巴嫩的前宗主国，很明显应该抢在俄国人之前支持贝鲁特，以保护我们在中东的影响力。"
 FRA_brasil:0 "改善与巴西关系"
 FRA_brasil_desc:0 "尽管我们在圭亚那地区与巴西有领土争端，但从长远利益考虑，我们还是应该改善与巴西的关系，以推动两国的贸易往来。"
 FRA_caribbeam:0 "投资加勒比地区"
 FRA_caribbeam_desc:0 "加勒比地区的海岛可以进行一定程度的投资，帮助他们发展渔业、经济作物和旅游业。"
 FRA_guyana:0 "建设圭亚那"
 FRA_guyana_desc:0 "圭亚那曾经一直是我国最贫穷的海外领地，甚至被当作流放地，但航天事业的发展改变了圭亚那的命运。作为最接近赤道的海外领地，没有比圭亚那更适合发展航天基地的地区了。"
 FRA_against_brasil:0 "对抗巴西"
 FRA_pacific_develop:0 "开发太平洋地区"
 FRA_pacific_develop_desc:0 "太平洋地区的海岛可以进行一定程度的投资，帮助他们发展渔业、经济作物和旅游业。"
 FRA_pacific_autonomy:0 "太平洋地区自治"
 FRA_pacific_autonomy_desc:0 "随着世界去殖民化浪潮的推进，太平洋地区的海岛开始寻求自治权，为了安抚民族主义情绪，我们可以尝试逐步将自治权下放给他们。"
 FRA_railway:0 "法国国家铁路"
 FRA_railway_desc:0 "j'aurais dû savoir mentir,Ne laisser que ton sourire\n我知道自己在说谎,只留下你的笑容\nVivre dans mes souvenirs,J'aurais dû laisser l'espoir\n在我的记忆里,我应该留下希望\nAdoucir les au revoir,Ce train qui s'en va\n这列即将出发的列车,只剩我独自一人\nQui part,Qui part\n离开的那个人,离开的那个人"
 FRA_social_reform:0 "社会改革"
 FRA_social_reform_desc:0 "许多落后的文化和生活习惯依然影响着我们的国家，例如男女的不平等和等级制度，如果我国想要成为一个现代国家，就必须将这些落后文化清除。"
 FRA_invets_china:0 "投资中国"
 FRA_invets_china_desc:0 "中国大陆在改革开放之后，希望吸引外资投资，我们应该抓住这个机会，获取庞大的中国市场。"
 FRA_lowlands:0 "发展低地国家关系"
 FRA_lowlands_desc:0 "比利时、荷兰与卢森堡是欧洲重要的邻居，我们应当加强与低地国家的关系，以获得卢森堡的钢铁、比利时的煤炭和荷兰的金融市场。"
 FRA_leon_way:0 "巴黎-里昂高铁"
 FRA_leon_way_desc:0 "明天早晨8点05分到里昂车站，坐去博尔戈尼亚的火车，到莫索特下车，然后你们就一直去到那儿的环球旅馆。\n好极了，只要我们能到那儿去，我们就一定能想办法回到英国。"
 FRA_tunnel:0 "英法海底隧道"
 FRA_tunnel_desc:0 "随着英国和法国等欧洲大陆国家的经贸往来日益增加，航运已无法满足不列颠和欧洲大陆之间人员、车辆与货物的运输，是时候打造一条沟通不列颠与英国的海底隧道了。"
 FRA_navy:0 "发展海军"
 FRA_navy_desc:0 "要保护我们的领海和海外领地，就必须拥有一支先进的现代化海军。"
 FRA_carrier:0 "发展航空母舰"
 FRA_carrier_desc:0 "第二次世界大战的海上战争，航空母舰大放异彩。巨舰大炮的时代已被淘汰，舰载机将主宰未来地球70%的天空！"
 FRA_gaulle_carrier:0 "戴高乐号航空母舰"
 FRA_gaulle_carrier_desc:0 "核动力将让我们的海军走向世界每一个角落。"
 FRA_electronic:0 "发展电子产业"
 FRA_electronic_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一，1948年ENIAC一条条电路板的运作标志着第三次科技革命的诞生。1960年代，随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。起初计算机只能帮助处理文书工作，但后期计算机有了更多功能，例如制图、传真、模拟和娱乐。计算机不仅可以帮助人们工作，对于80年代的许多国家来说，计算机还是经济腾飞的阶梯，亚洲的日本、韩国、台湾和中国大陆通过承接计算机制造业实现了经济的迅速增长。"
 FRA_agriculture:0 "发展农业"
 FRA_agriculture_desc:0 "改善农业生产，不仅需要合理的土地制度，且需要先进的农业技术。水利、农药、化肥、配种和机械化，这些都是农业现代化不可缺少的。"
 FRA_wine:0 "扩大农业经济"
 FRA_wine_desc:0 "勃艮第、香槟、波尔多、卢瓦尔、普罗旺斯……葡萄酒已经成为了法国农业不可或缺的一部分，他们将为我们创造更多的经济附加值。"
 FRA_develop_south:0 "开发南方"
 FRA_develop_south_desc:0 "我国南部的奥克塔尼亚，有许多地区依然是一片农田和森林，应该进行开发，扩大城市和工业区。"
 FRA_sdp:0 "支持社会民主党"
 FRA_sdp_desc:0 "社会民主主义要求政府关注每一个公民的利益，尤其是贫困阶层和弱势群体的利益，而非富有阶层的利益。促进社会平等以调和社会矛盾是社会民主主义的优先政策。"
 FRA_union_republique:0 "支持共和国联盟"
 FRA_union_republique_desc:0 "共和国联盟将继承戴高乐总统的意志，继续坚持法兰西独立自主的道路并保护我们的国家利益。"
 FRA_conservatism_focus:0 "保守主义"
 FRA_conservatism_focus_desc:0 "二战后的世界充斥着各种意识形态，共产主义、社会主义、民主主义、无政府主义……但这些新颖的政治主张真的符合我们的国家吗？也许我们应该回到过去的历史中，寻找正确的答案。如果旧日的思想确实给我们带来了稳定和秩序，那么就沿着旧有的道路前进。"
 FRA_national_front:0 "支持国民阵线"
 FRA_national_front_desc:0 "第四共和国的左派和民主派把国家搞得一团糟，我们在海外利益的丢失证明了民主制度的无能。幸运的是，法兰西也有许多关心祖国利益的政治家。新秩序、国家人民联盟、民族动员等团体也活跃于政坛，他们将会团结起来，共同组建法兰西最大的保守主义政党——国民阵线。"
 FRA_right_wing:0 "扩大右翼影响力"
 FRA_right_wing_desc:0 "一方面我们批判菲利普·贝当和维希政权的投敌行为，但另一方面，这不代表维希政府反对共产主义，反对犹太人和他们的美苏傀儡的政策是错误的。法兰西在二战后依然面临许多困境，这就是证明。我们应当重新考虑是否应该恢复维希政府的一些政策，以对抗布尔什维克和犹太人。"
 FRA_france_first:0 "法兰西至上"
 FRA_france_first_desc:0 "共和国召唤着我们！\n要么得胜，要么牺牲。\n法国人必须为祖国而生\n为了她，法国人必须成仁！"
 FRA_catholics:0 "接触天主教会"
 FRA_catholics_desc:0 "法兰西的人民自古以来就是天主忠实的仆人，圣丹尼的虔诚、圣女贞德的忠勇和圣马丁的善良是法兰西忠于上帝的证明和我们要向子孙后代传播的价值。"
 FRA_Dieu_patria_familia:0 "上帝！祖国！家庭！"
 FRA_social_law:0 "社会道德法案"
 FRA_social_law_desc:0 "我们要把基督耶稣和上帝的信条深深地刻入我们的社会文化，每一个公民都应当虔诚地根据基督的旨意行事。"
 FRA_control_media:0 "控制媒体"
 FRA_racist:0 "神圣法兰西帝国"
 FRA_racist_desc:0 "Le Roy Louis a convoqué\n路易吾王，招兵点将\nTous ses barons et chevaliers\n诸侯骑手，悉数上场\nLe Roy Louis a demandé\n路易吾王，号令嘹亮\nQui veux me suivre où que j'irai?\n谁将随朕，征战远方？"
 FRA_neo_liberaism:0 "新自由主义"
 FRA_neo_liberaism_desc:0 "新自由主义者主张减少政府的行政干预，让市场自由运行从而刺激经济增长。政府的腐败、政治混乱和官僚主义使得他们无法有效管理经济，因此让市场无形的大手来促进经济系统自我调节才是最好的办法。政府干预越少，经济运行越好。"
 FRA_market:0 "增加市场调控"
 FRA_market_desc:0 "既然市场能够比行政机构更好地运营经济，那我们就应该将经济完全交给市场和市场参与者自由运营，一个完全没有行政干涉的经济体制无疑是最健康，最完美的。"
 FRA_Reduce_social_spending:0 "削减社会开支"
 FRA_Reduce_social_spending_desc:0 "退休金和失业补贴把我们国家的年轻人变成一群懒鬼，许多人宁愿躺在家里拿救济金也不愿意出门找工作，严重拖累了正常的社会生产，必须把失业补助等各种无意义的救助金停掉。"
 FRA_privatization:0 "企业私有化"
 FRA_privatization_desc:0 "我国国有企业在经济体制改革之后开始失去活力，无法应对日益激烈的市场竞争。为了使国企能够应对市场经济带来的冲击，我们将实行国企改革，使企业自主，自负盈亏。"
 FRA_social_free:0 "女性权益改革"
 FRA_social_free_desc:0 "给予妇女选举权是实现平等，推动社会现代化的重要里程碑，当妇女掌握选票时，也就掌握了自己的命运。"
 FRA_communie:0 "巴黎公社的遗产"
 FRA_communie_desc:0 "巴黎公社是社会主义革命的第一次伟大实践，工人阶级和无产阶级第一次尝试建立真正属于自己的民主政权，尽管他最后遭到了失败，并被反动势力攻击为无政府主义，但他依然留下了许多宝贵的遗产，包括公社委员会下的民主制度，和无产阶级武装起来自我保卫的武装力量，他们值得我们再一次尝试建立工人委员会管理一座城市，乃至一个国家，并完善它使其与时俱进地存在下去。\n\n工人的巴黎及其公社将永远作为新社会的光辉先驱受人敬仰，它的英烈永远铭记在工人阶级的伟大心坎里。\n-——卡尔·马克思"
 FRA_YUG:0 "接触南斯拉夫"
 FRA_YUG_desc:0 "我们应该改善与南斯拉夫的外交关系，争取两个社会主义国家之间的友好合作，以促进对外经贸发展。"
 FRA_supress:0 "镇压反革命"
 FRA_supress_desc:0 "一些敌视社会主义[FROM.GetName]的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。"
 FRA_stalinism_focus:0 "斯大林模式"
 FRA_stalinism_focus_desc:0 "在斯大林模式的指导下，苏联人民不仅在短短十年内把俄罗斯变成了工业强国，而且还战胜了法西斯。我们要摆脱贫困，进入工业化和现代化，就必须学习苏联人民的先进经验。"
 FRA_nkvd:0 "内务委员会"
 FRA_nkvd_desc:0 "我们要建立专门的机构，调查、监视、逮捕反革命分子和帝国主义间谍。"
 FRA_terror:0 "恐怖统治"
 FRA_terror_desc:0 "恐怖暴力无非是正义的，及时，严厉的，没有弹性的。\n如果人民政府在和平时期的基础是美德，人民政府在革命时期的基础既是美德也是恐怖暴力；美德，没有这些恐怖暴力会导致毁灭的；恐怖暴力，没有这些美德是没有无权力基础的。无权力的无非是快速，严厉和没有弹性的正义;以上 因此它是美德的化身；它本身是欠缺原则，而且不是民主的一般原则的结果，适用于祖国最迫切的需求。\n——马克西米连·罗伯斯庇尔"
 FRA_union_gov:0 "联合政府"
 FRA_collectivization:0 "农业集体化"
 FRA_collectivization_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 FRA_planing:0 "计划经济"
 FRA_planing_desc:0 "要实现快速发展，必须统一现有的一切生产资料，有计划地使用和分配生产生活资料。"
 FRA_5_planing:0 "五年计划"
 FRA_5_planing_desc:0 "我们将开始实行第一个五年计划，以快速建设社会主义经济。"
 FRA_nationalized:0 "工业国有化"
 FRA_nationalized_desc:0 "在从资本主义社会过渡到共产主义社会之前，党和国家将以国有企业的形式管理我国的重要生产资料。"
 FRA_humanity:0 "人道的社会主义"
 FRA_humanity_desc:0 "社会主义不是绝对主义。即使是在人民民主专政的国家，人民不分阶级、不分革命，也应有适当的言论、思想、经济、宗教、政治自由。"
 FRA_worker_communie:0 "工人委员会"
 FRA_worker_communie_desc:0 "中国的工人委员会模式下，工人们以民主形式直接参与工厂的管理和决策，委员会的成员由选举产生，他们不仅参与管理，并且也要参与工作。"
 FRA_workerism:0 "工团主义"
 FRA_maoism:0 "毛主义"
 FRA_maoism_desc:0 "来自中国共产党领袖毛泽东的政策为我们提供了宝贵的经验和理想的学习对象。中国政府所实行的文化革命、工人自治、群众路线和第三世界理论将成为我们走向共产主义的指路明灯。"
 FRA_against_soviet:0 "对抗苏修"
 FRA_europe_revolution:0 "支持欧洲革命"
 FRA_europe_revolution_desc:0 "欧洲许多国家的人民依然处在帝国主义和资本主义的统治之下。马克思主义告诉我们，工人阶级只有解放全世界，才能真正解放自己，如果继续让西欧处于帝国主义统治之下，那么西欧的资产阶级仍然会向我们的社会主义政权反扑。幸运的是，法国人民的伟大胜利，大大振奋了西欧各国的共产党和左派人士，他们将借助这股东风，在欧洲发起社会主义运动，以打败资产阶级夺取政权，而这，自然就需要我国，在政治、经济和外交上予以支持。"
 FRA_pla_paris:0 "解放军在巴黎"
 FRA_pla_paris_desc:0 "让我们热烈欢迎来自中国的同志来到巴黎，知道我们的社会主义文化革命，我们将为中国同志们献上我们创作的《红军与卡门》芭蕾舞剧。"
 FRA_mai68:0 "五月风暴"
 FRA_mai68_desc:0 "来自遥远东方的伟大领袖为法兰西的新一次革命指引方向！"
 FRA_liberate_colonies:0 "解放殖民地"
 FRA_joined:0 "允许外来同志入籍"
 FRA_air_force:0 "发展空军"
 FRA_missile:0 "发展导弹武器"
 FRA_missile_desc:0 "导弹技术可能是20世纪最重要的军事发明之一，他最早诞生于二战德国的V2火箭，并在50年代的美苏争霸中完善。最早的导弹通过红外线热感应进行制导，通过接收目标反射的热光调整弹道，到了后来出现了电视制导和主动激光制导。导弹的应用相当广泛，它可以用于大型的弹道导弹，也可以用于制导炸弹，或步兵、车载的反坦克或反导导弹，它大大提升了军队的作战效率，但最大的问题就是——他太贵了。"
 FRA_Bourbon:0 "国王归来"
 FRA_Bourbon_desc:0 "国王归来"
 FRA_Napoleon:0 "皇帝归来"
 FRA_Napoleon_desc:0 "没有脑子的君主制分子妄图参与大选\n荒诞的保皇党正到处拉票\n君主主义者获得议会席位\n王党领袖宣布获得多数席位\n尊敬的君主主义议员先生们成立新的政府！"
 FRA_Grognards:0 "老近卫军的荣耀"
 FRA_Grognards_desc:0 "拿破仑皇帝陛下麾下的老近卫军战无不胜，所向睥睨，是法兰西军人的典范！"
 FRA_militarism:0 "军国主义"
 FRA_war_uk:0 "特拉法尔加的复仇"
 FRA_war_uk_desc:0 "我们希望拿破仑皇帝的英灵能够看见，我们没有重蹈特拉法尔加的耻辱，战胜了所谓无敌的皇家海军，并登上了不列颠的土地！"
 FRA_war_russia:0 "1812序曲"
 FRA_war_russia_desc:0 "我们希望拿破仑皇帝的英灵能够看见，我们没有重蹈博罗季诺和莫斯科的耻辱，战胜了所谓无敌的苏俄红军，看见了乌拉尔山另一端的亚洲大陆！"
 FRA_space_beurau:0 "欧洲航天局"