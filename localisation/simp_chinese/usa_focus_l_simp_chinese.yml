 us_venona_project:0 "维诺那计划"
 us_operation_clips:0 "回形针行动"
 
 us_support_burma_kmt:0 "援助缅甸的国民党军"
 us_support_burma_kmt_desc:0 "一些拒绝向中共投降的国民党军撤离进入了缅甸境内，我们可以为他们提供援助，以帮助他们向云南发动进攻，从而牵制中共军队。"
 
 us_Operation_Chrome_Dome:0 "铬穹行动"
 us_Operation_Chrome_Dome_tool:0 "减少遭受核打击时战略轰炸机的损失\n当我国遭到核打击后，所有战略轰炸机立刻对敌国发起核攻击。"
 
 us_Congress_for_Cultural_Freedom:0 "世界自由文化大会"
 us_Congress_for_Cultural_Freedom_desc:0 "共产党人对文化自由、艺术自由、思想自由和信仰自由的钳制和压迫，令自由世界所不齿，也成为其共产主义谎言最大的突破口。欧洲许多艺术家、文学家都猛烈抨击共产主义，基于此，我们应该支持他们建立一个组织，通过自由艺术揭穿共产党的乌托邦骗局。"
 
 us_civil_defence_focus:0 "联邦民防委员会"
 us_civil_defence_focus_desc:0 "\n有只乌龟名叫博特，小小博特十分谨慎，危险来临不会慌张，他知道怎么做。"
 us_civil_defence_focus_tool:0 "减少我国遭到核打击时的人口、建筑和稳定度损失"
 us_CONELRAD:0 "紧急公众广播系统"
 us_CONELRAD_desc:0 "一旦遭到攻击，请将你的AM波段收音机调到640或1240以获得官方信息……"
 us_uranium_fever:0 "淘铀热"
 us_atomic_vegas:0 "原子维加斯"
 us_atomic_vegas_desc:0 "内华达州沙漠腾空而起的蘑菇云，吸引了许多对原子弹感兴趣的游客，这是一个开发拉斯维加斯旅游业的好机会。"
 
 
 us_consumer_indus1:0 "投资消费品 I"
 us_consumer_indus2:0 "投资消费品 II"
 us_consumer_indus2_desc:0 "我为大家介绍来自斯蒂庞克的新消息。我们欢迎您到店感受我们这款非常非常漂亮的新车。这款1950款斯蒂庞克的新功能，可以看到，整车的设计不止流线型那么简单，也是工程学的新突破…………"
 us_consumer_indus3:0 "投资消费品 III"
 us_consumer_indus3_desc:0 "我是巴尔的摩的美宝小姐，给您带来最美的旋律，别走开，让我们尽情摇摆。本节目的赞助商为Nap-a-way发胶，针对顽固发质，头发打结瞬间搞定。"
 us_consumer_indus4:0 "投资消费品 IV"
 us_consumer_indus4_desc:0 "啊，德莫里特教友，近来可好？\n我需要复印500份抄写本。\n我来为您介绍这款Xerox 9200复印机……"
 us_consumer_indus5:0 "投资消费品 V"
 
 
 us_consumer_electronic:0 "投资电子消费品"
 us_consumer_electronic_desc:0 "与其比较我们的洗衣机有什么优点，不如比较我们火箭的威力？那不是你想要的吗？\n-理查德·尼克松 1959年7月24日 厨房辩论"
 
 us_annex_alaska_hawaii:0 "吸纳第50州"
 us_annex_alaska_hawaii_desc:0 "我国实际控制阿拉斯加和夏威夷已经快一百年了，但这两个地区却一直没有正式并入美国，获得州的地位，有基于此，我们应该尽快落实阿拉斯加和夏威夷建州的议程，以确立美利坚合众国对这两篇土地的领土主权。"
 
 us_annex_puerto_rico_lariana:0 "吸纳第52州"
 us_annex_puerto_rico_lariana_desc:0 "我国实际控制波多黎各和马里亚纳已经数十年了，但这两个地区却一直没有正式并入美国，获得州的地位，有基于此，我们应该尽快落实波多黎各和马里亚纳建州的议程，以确立美利坚合众国对这两篇土地的领土主权。"
 
 us_puerto_rico_autonomy:0 "波多黎各自治"
 us_puerto_rico_autonomy_desc:0 "我国控制波多黎各已数十年，随着时间推移，波多黎各的蔗糖和咖啡产业为美国带来的利润越来越少，当地的独立运动却愈发壮大。继续统治波多黎各已没有意义，我们将颁布新的《波多黎各与联邦关系法》，推动波多黎各的逐步自治，并最终走向独立。"
 
 us_762mm_focus:0 "推广中威力北约通用步枪弹"
 us_762mm_modifier:0 "7.62mm北约通用弹"
 
 us_deploy_jupiter:0 "在西欧部署战略武器"
 us_deploy_jupiter_desc:0 "核武器的巨大杀伤力和巨大威慑力，使其成为保护我们欧洲盟友的利剑。随着战略弹道导弹投入使用，如果我们在欧洲部署战略武器，将对俄国人形成威慑，使其不敢进犯西欧。"
 
 us_support_kishin_nobusuke:0 "指定新的首相"
 us_support_kishin_nobusuke_desc:0 "日本的政治局势在共产党的破坏下变得混乱，共产主义势力正在利用新建立的日本民主制度谋取权力。我们应该考虑，是否应该暂停在日本进行民主化的改革，重新建立一个强有力的反共产主义政府。"
 us_spuress_cjp:0 "镇压日本共产党"
 us_spuress_cjp_desc:0 "共产主义正利用日本在战争结束后的社会秩序混乱和意识形态真空迅速扩大，让日本面临赤化的威胁。驻日本盟军司令部将采取措施，对日本的共产主义势力采取严厉的镇压。"
 us_youth_officers:0 "提拔年轻官员"
 us_youth_officers_desc:0 "新的时代需要新的人才，我们应该提拔更年轻、更有能力的新一代官员前往华盛顿。"
 us_financial_refrom:0 "财政改革"
 us_financial_refrom_desc:0 "美国是世界上唯一一个发币权不在政府手中的国家，华尔街的大财团控制下的美联储掌握了美元的发行权，没有发币权的政府是没有能力进行更进一步的财政改革的。"
 us_california_field:0 "开发加州油田"
 us_california_field_desc:0 "美国工业产值的快速增长大大增加了能源需求，我们需要进一步扩大对加利福尼亚油田的开发，以满足能源供应。"
 us_texas_field:0 "开发德克萨斯油田"
 us_texas_field_desc:0 "美国工业产值的快速增长大大增加了能源需求，我们需要进一步扩大对德克萨斯油田的开发，以满足能源供应。"
 us_centural_field:0 "开发中部农业"
 us_centural_field_desc:0 "从阿拉巴契亚山脉到大盆地的广袤区域，土壤肥沃地广人稀，密西西比河滋润着这片世界上最适合发展农业的地区。"
 us_develop_autos:0 "投资汽车产业"
 us_develop_autos_desc:0 "亨利·福特先生让美国的汽车产业称霸世界，我们将继续支持和扩大汽车产业。"
 us_develop_elecronic:0 "投资电子产业"
 us_develop_elecronic_desc:0 "小小的晶体管和半导体材料将主宰未来的技术领域，我们必须大力支持电子产业和半导体产业以保障美国在这一领域的领先地位。"
 us_develop_plastic:0 "投资化工产业"
 us_develop_plastic_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 us_develop_steel:0 "投资钢铁产业"
 us_develop_steel_desc:0 "钢铁是工业的基础，从新英格兰蔓延到印第安纳的钢铁工业将支持我们未来的工业建设。"
 
 us_culture:0 "赞助文化产业"
 us_culture_desc:0 "噢，我真高兴我是一个美国人。\n——唐老鸭《元首的面孔》"
 us_nuclear_protect_focus:0 "核保护伞"
 us_nuclear_protect_focus_desc:0 "我们的盟国处于共产主义的核威慑之下，我们应该向盟国提供核保护伞，如果俄国人胆敢使用核武器威胁他们，我们将同样使用核武器予以回应。"
 us_bunker_project:0 "赞助避难所工程"
 us_bunker_project_desc:0 "朋友，你的未来可能没你想象的那么安全，当核弹落下时，你会在哪里呢？你可以预定由避难所科技公司建造的最先进避难所重点位置来保护你和你家人的安全。立刻采取行动，你的家人就可以免受核灾难的恐怖。"
 us_minor_reactor:0 "研发微型核反应堆"
 us_minor_reactor_desc:0 "核反应堆可以为一切设备提供充足且长期供应的能源，但我们不能把一个巨大的反应堆安装在飞机上，但如果我们能够把核反应堆的体积缩小，他们就能被放置在船只、飞机、列车甚至民用交通工具上。"
 us_nuke_canon_focus:0 "研究核子火炮"
 us_nuke_canon_focus_desc:0 "缩小版的战术核弹将摧毁一切敌人。"
 us_nuke_soldiers:0 "发展单兵核武器"
 us_nuke_soldiers_desc:0 "核武器的小型化，将让更简便的原子武器成为可能。未来的战场上，不仅可以有车载核武器、机载核武器，甚至可以有单兵核武器。核武器将以班组为单位普及，我们可以用其制作是用火箭筒发射的微型原子弹……"
 us_blavo_fortress:0 "布拉沃城堡行动"
 us_blavo_fortress_desc:0 "未来的战争毫无疑问将是核武器主导的战争，我们必须加大对核武器的研究，一系列核试验将为我们提供珍贵的参考和研究数据。"
 us_nuclear_submarines_focus:0 "发展核动力潜艇"
 us_nuclear_submarines_focus_desc:0 "如果将核能作为潜艇的驱动力使用，将改变潜艇在军事上的存在。潜艇将变得航程更远、体积变得更巨大，可以搭载更多的武器，甚至核武器前往地球的每一个角落。"
 us_submarines_missiles:0 "发展潜射导弹"
 us_submarines_missiles_desc:0 "核潜艇使得核武器拥有了继陆基、轰炸机之后的第三个发射载体。潜射导弹将允许核潜艇装载核武器并航行至敌人领土附近海域发射，他们的最大优势是不会轻易被敌人发现和击毁，海基核导弹将会是我们的陆基、空基核武器被摧毁后的最后杀手锏。"
 us_controlled_reaction:0 "支持可控核聚变技术"
 us_controlled_reaction_desc:0 "核聚变即将两个核子结合为一个更大的核子，在这过程中释放出来的能量要比核子裂变要大，但这个过程很难进行人为控制，如果能够实现人工可控核聚变，"
 us_nuclear_plane:0 "核动力飞机"
 us_nuclear_plane_desc:0 "如果将核能作为飞机的驱动力使用，将改变飞机的意义。它们的航程将变得更远、体积变得更巨大，可以搭载更多的武器，甚至核武器前往地球的每一个角落。"
 us_project_pluto:0 "核动力导弹"
 us_project_pluto_desc:0 "如果将核能作为飞机的驱动力使用，它们的航程将变得更远、体积变得更巨大，可以搭载更多的爆炸部，甚至核武器前往地球的每一个角落。"
 us_nuke_minerals:0 "中子地雷"
 us_nuke_minerals_desc:0 "中子地雷是一种使用中子辐射杀死敌人的炸弹，辐射可以消灭敌人的有生力量，而不会过大的破坏地区原有的地形和建筑。"
 us_civilian_reactor:0 "民用微型原子能"
 us_civilian_reactor_desc:0 "核能反应堆的体积不断地变小，成本也不断地下降……就像汽车一样，当曾经遥不可及的昂贵科技产品变得触手可及时，他就会流入民用领域，成为商品。核能将进入我们生活的方方面面。"
 us_NuclearAuto:0 "核动力汽车"
 us_NuclearAuto_modifiers:0 "核动力汽车"
 us_NuclearAuto_desc:0 "你能想象吗？家家户户的汽车都选择了微型核反应炉作为动力系统，人们驾驶者核动力的汽车，驶向世界的每一个角落，而不再需要担心汽油的耗尽。"
 us_NuclearAuto_tool:0 "当铀矿满足消耗需求时，汽车的工业税和消费税+20%"
 us_housed_nuclear:0 "家用核能"
 us_housed_nuclear_desc:0 "也许在不久的将来，核能将走进每一户人家，就像壁炉一样成为家家户户不可缺少的设备。一个小小的核能反应炉，就能提供一整个家庭用不完的能源，我们再也不用为高昂的电费而担忧，无尽的核能将彻底改变人类的生活。"
 us_radway:0 "消辐宁"
 us_radway_desc:0 "原子能的扩大也带来了一些负面事件，核燃料的外泄导致辐射污染，我们需要尽快研发一种药物，来缓解辐射对人体和生态的破坏。"
 us_privitate_nuclear:0 "核能商业化"
 us_privitate_nuclear_desc:0 "核能已走进人们的生活，成为生活中不可缺少的一部分。政府将逐步放开对核能的管控，使得核技术、核燃料、核设施都成为可以流通的商品。"
 
 us_strengh_austria:0 "强化奥地利武装力量"
 us_strengh_austria_desc:0 "奥地利正面临着共产主义越来越严重的武力威胁，我们应该加大对奥地利军队的援助。"
 us_german_austria:0 "强化德国武装力量"
 us_german_austria_desc:0 "德国正面临着共产主义越来越严重的武力威胁，我们应该加大对德国军队的援助。"
 us_support_austria_right:0 "支持奥地利右派"
 us_support_austria_right_desc:0 "共产主义正不断侵蚀西欧自由国家，毫无疑问奥地利将成为莫斯科的下一个目标，我们应该支持奥地利的反共产主义势力，与亲莫斯科分子对抗。"
 us_inflective_finland:0 "渗透芬兰"
 us_inflective_finland_desc:0 "共产主义正不断侵蚀西欧自由国家，毫无疑问芬兰将成为莫斯科的下一个目标，我们应该支持芬兰的反共产主义势力，与亲莫斯科分子对抗。"
 
 us_execute_tojo:0 "清算日本战犯"
 us_japan_socialist:0 "拉拢日本社会党"
 us_japan_socialist_desc:0 "日本社会党是战后由民主派政治家组成的大篷车，他们当中即存在亲苏的左派，也存在反共产主义的右派，我们应该支持后者，以对抗日本政坛中的左派分子。"
 us_new_emperor:0 "新天皇"
 us_new_emperor_desc:0 "裕仁也许并不是一位值得我们支持的盟友，他终究是日本军国主义的象征和精神图腾，他和他的支持者并不完全愿意服从我们的安排。终有一天，美国和裕仁之间的关系会破裂。战后的日本出现了许多自称天皇皇位觊觎者，因此，我们也许需要与那些觊觎者建立关系，以等待需要他们的时候。"
 
 us_free_southeast_asia:0 "援助东南亚自由国家"
 us_free_southeast_asia_desc:0 "共产主义叛乱正在东南亚蔓延，我们应该积极支持亚洲自由国家与共产党叛军对抗。"
 us_pro_indonesia:0 "接触印尼政府"
 us_pro_indonesia_desc:0 "东印度群岛已摆脱荷兰人数百年的统治，并建立了印度尼西亚共和国，我们必须尽快与印尼的新政府建立关系，并通过经济和政治影响，使得新政府向自由世界靠拢，以抵抗共产党在东南亚的扩张。"
 us_oppose_indonesia:0 "支持印尼反对派"
 us_oppose_indonesia_desc:0 "印度尼西亚与共产党的联合政府摇摇欲坠，印尼国内许多右翼势力反对共产主义的蔓延，并寻求与自由世界的合作。"
 us_support_dutch:0 "支持荷兰与英国"
 us_support_dutch_desc:0 "共产主义叛乱正在东南亚蔓延，共产主义叛军正在肆虐马来亚和东印度群岛，我们必须帮助英国人和荷兰人将这些叛乱镇压下去。"
 us_seat_union:0 "东南亚防御条约"
 us_seat_union_desc:0 "中共支持下的共产党入侵威胁日益严重，为了避免东南亚的自由国家被颠覆，我们必须组织东南亚各国团结起来，进行军事合作和共同防御，在共产党入侵时进行互相协作。"
 us_inflect_cambodia:0 "渗透柬埔寨"
 us_inflect_cambodia_desc:0 "柬埔寨位于东南亚的关键位置，对介入越南战争有着重要作用，但西哈努克国王却表现得与中共过分亲近。越共正试图建立秘密通道以向越南南方输送武器，我们要掐断这个通道，保证柬埔寨不会被越共利用为交通路线，我们必须影响该国政治局势。"
 
 us_indian_assistance:0 "向印度提供援助"
 us_indian_assistance_desc:0 "印度已摆脱英国人数百年的统治，并建立了新的国家。我们必须尽快与印度的新政府建立关系，并通过经济和政治影响，使得新政府向自由世界靠拢，以抵抗共产党在南亚的扩张。"
 us_pakistan_assistance:0 "向巴基斯坦提供援助"
 us_pakistan_assistance_desc:0 "巴基斯坦已摆脱英国人数百年的统治，并建立了新的国家。我们必须尽快与巴基斯坦的新政府建立关系，并通过经济和政治影响，使得新政府向自由世界靠拢，以抵抗共产党在南亚的扩张。"
 us_indian_ocean:0 "扩大印度洋影响力"
 us_indian_ocean_desc:0 "印度洋作为沟通苏伊士运河、波斯湾和马六甲海峡的海上交通节点，其战略地位关乎全世界的石油供应，我们不能让俄国人在此地区发展势力，从而威胁我们的石油供给。在共产党的影响力蔓延到印度洋以前，我们必须抢先与该地区的国家建立关系。"
 us_gulf_ocean:0 "扩大波斯湾影响力"
 us_gulf_ocean_desc:0 "波斯湾是世界石油的核心，我们必须尽快在波斯湾建立并扩大影响力，在这一地区寻找盟友，以巩固我们对这片石油产区的控制。"
 us_oppose_india:0 "支持印度反对派"
 us_oppose_india_desc:0 "印度政府正不断地向莫斯科靠拢，这是不可接受的！我们必须阻止印度的进一步赤化，为此，我们可以向印度国内的反对派提供帮助，动用舆论和经济攻势，对印度现政府施加压力，如有必要，则支持反对派的夺权。"
 us_pro_tib:0 "支持西藏政府"
 us_pro_tib_desc:0 "中国共产党已击败国民党政府，并将枪口指向西藏。名义上，西藏是中国领土，但实际上，国民党政府对西藏从未实行有效的统治，西藏的实权处于噶厦贵族和僧侣手中，而他们中的许多人不愿意接受中国人的统治，寻求与西方国家接触甚至独立，这给予了我们机会，如果我们公开地与西藏建立关系，或许能吓阻中共使其不敢进犯。"
 us_tib_revolt:0 "支持西藏反对派"
 us_tib_revolt_desc:0 "中国共产党已吞并西藏，并毫不意外地实行残暴的宗教灭绝政策，西藏的僧侣正在反抗共产主义，他们需要我们的支援！"
 
 us_socialist_gov:0 "社会主义政府"
 us_progressive_gov:0 "进步主义联合政府"
 us_weeken_religion:0 "削弱宗教影响力"
 us_secularism_educate:0 "教育世俗化"
 us_abolish_Electoral:0 "废除选举人团制度"
 us_progressive_party:0 "支持进步党"
 us_third_party:0 "支持第三党运动"
 
 us_support_KKK:0 "支持KKK"
 us_support_KKK_desc:0 "他们是普通百姓，他们的朴素就像炉子散发出的热量一样显而易见……很明显，在长长的队伍里，男人们更熟悉的是手推车把手而不是高尔夫球杆，而女人们使用洗衣盆的次数也远比口红多得多。\n但这又如何呢？三K党并非势利眼的俱乐部，而是一种将低人一等者组织成神秘优越者的手段。\n——H·L·门肯"
 us_support_wallance:0 "支持乔治·华莱士"
 us_support_wallance_desc:0 "阿拉巴马州参议员乔治·华莱士先生是坚定的美国价值捍卫者，他对抗共产主义支持下的种族融合，捍卫种族隔离传统，他将是美国保守主义者最好的领袖。\n\n现在隔离，将来隔离，永远隔离。\n——乔治·华莱士"
 us_support_wallance_tool:0 "当白人至上主义支持率达到40%以上，乔治·华莱士和独立党将取代共和党，获得参与1960、1964、1968年总统选举的机会"
 us_neo_nazis:0 "支持新纳粹主义"
 
 USA_DARPA:0 "国防高等研究计划署"
 USA_DARPA_desc:0 "苏俄在航空航天、核武器及火箭技术上取得的优势令我们不安，我们必须加大对科技开发的投资和重视，以尽快在科学技术，尤其是军事技术上追赶苏联。"
 
 Defence_Taiwan:0 "协防台湾"
 Defence_Taiwan_desc:0 "台湾已成为我们对抗亚洲共产主义的第一线，我们必须为台湾提供包括武装部队在内的更多军事支持，以抵抗中共的进攻。"
 us_sigital_war:0 "信息化战争"
 us_sigital_war_desc:0 "计算机的出现改变了现代战争，它不仅广泛运用到人民的生活中，而且也广泛运用到军事上。计算机可以使得复杂的坦克、飞机和军舰操作变得简单，可以帮助计算炮弹的弹道，可以更好地处理甚至获取情报……一支数字化的军队将让我们有能力打一场21世纪的战争。"
 us_mechanized:0 "发展机械化部队"
 us_mechanized_desc:0 "许多在二战时期出现的各种军事发明，在二战后被运用到实战中，例如直升机、导弹、复合装甲、机械化车辆以及合成材料制作的装备等。军事科技是不断发展的，如果我们在军事研究上停滞不前，就随时可能落后。"
 us_weapons:0 "发展单兵武器"
 us_weapons_desc:0 "在创伤弹道学方面，小型或轻型子弹比重型子弹具有优势。……这归根结底是因为子弹在空气中飞行时是稳定的，而不是在水或密度与水大致相同的物体中飞行时稳定的。它们在空中飞行时是稳定的。一旦击中物体，它们就会立即变得不稳定。……例如，.30口径的子弹或许能在人体内保持稳定。……而小型子弹由于质量轻，能更快地感知到不稳定情况并做出反应。……这正是小型子弹在创伤弹道学中优势显著的原因。\n——尤金·斯通纳"
 us_anti_rebrl:0 "反叛乱作战"
 us_anti_rebrl_desc:0 "核武器平衡让国家与国家之间的大规模军事冲突得到克制，于是，共产党开始采取颠覆、叛乱、游击战和煽动来推翻自由世界的民主政府，有鉴于此，反叛乱作战，将成为我们盟国与共产党之间的主要冲突形式。我们必须是我们的军队，和盟国的军队学会如何对抗游击队叛乱。我们要阻止他们在丛林、山地和河流之间的扩张，并摧毁他们的据点。"
 us_air_assult:0 "空中骑兵"
 us_air_assult_desc:0 "直升机的出现改变了战争的形式，尤其是大大改善了清剿叛军作战的条件。一支快速机动的空中骑兵师将借助直升机进行巡逻和警戒，当我们发现疑似游击队据点的地区后，便可以立刻乘机前往进行清剿。"
 us_Asymmetric_warfare:0 "非对称战争"
 us_Asymmetric_warfare_desc:0 "非对称战争，即作战双方实力和作战水平都不对等的战争。共产党的叛军往往人数更少，作战素质更低，武器装备更落后，然而，他们却可以借助神出鬼没的游击战、争取民心的宣传战，来牵制我们，和我们盟友的大批军队，面对非对称战争的常态化，我们需要进一步发展我们的的反游击战术和心理战术。"
 us_army_focus:0 "整顿陆军"
 us_army_focus_desc:0 "苍天之下，我们这支军队的勇气和斗志将决定千百万我们后代的命运……我们自己决定着征服还是灭亡。\n——乔治·华盛顿"
 USA_navy_focus:0 "发展海军"
 USA_navy_focus_desc:0 "海权的历史在很大程度上（尽管并非完全）是国家之间竞争、相互敌对、暴力冲突（通常以战争告终）的叙事。\n——阿尔弗雷德·马汉《海权论》"
 us_atalantic_fleet:0 "扩大北大西洋舰队"
 us_nuclear_sub:0 "发展核潜艇"
 us_nuclear_sub_desc:0 "强大的核动力发动机可以让我们的战略潜艇舰队航行至世界的每一个角落。"
 us_submarines:0 "发展潜艇"
 us_submarines_desc:0 "潜艇在第二次世界大战中爆发出惊人的作用，现在新的战争迫在眉睫，各个大国都将重视潜艇部队的发展，我们不能落后于人。"
 us_zeus_destroyer:0 "宙斯盾驱逐舰"
 us_zeus_destroyer_desc:0 "信息技术将彻底改变海上战争，一支现代化、信息化的舰队，将配备全数字化的舰载战斗系统，包括指挥决策系统、武器控制系统、显示系统、战斗状态诊断与测试系统、战斗训练系统、火控系统、垂直发射系统等组成。"
 us_pacific_fleet:0 "扩大太平洋舰队"
 us_pacific_fleet_desc:0 "我们不能再重蹈珍珠港的覆辙，我们必须扩大太平洋舰队的规模和战斗力，使他不仅可以对抗苏联及中共的战争威胁，且有能力支持我们的亚太自由世界盟友。"
 us_steritegic_weapons:0 "发展战略武器"
 us_steritegic_weapons_desc:0 "我们的技术力量已经超越了我们的精神力量。我们发明了制导飞弹，心灵却失去了方向。\n——马丁·路德·金"
 us_seal_bomber:0 "隐形轰炸机"
 us_seal_bomber_desc:0 "微乎微乎，至于无形。神乎神乎，至于无声，故能为敌之司命。\n——孙子"
 us_missile_focus:0 "发展导弹"
 us_missile_focus_desc:0 "德国在二战中发明的V2火箭令我们眼前一亮，这种火箭如果能装载核武器，使其能够更快、更准的发射到地球的另一端，那么战争的历史、人类的历史都将为此改变。"
 us_cas_focus:0 "发展对地攻击机"
 us_cas_focus_desc:0 "对地攻击机将借助我们的空中优势，对敌人的地面部队，尤其是装甲部队予以毁灭性打击。"
 us_fighter_focus:0 "发展战斗机"
 us_fighter_focus_desc:0 "第二次世界大战令作战飞机大放异彩，而在战争的最后几年，喷气战斗机横空出世。战后，喷气战机毫无疑问将成为空中战争的主导者，他不仅将令战斗机的速度突破极限，强化后的战机也将搭载更先进、更复杂的设备和武器。"
 us_steritegic_bomber:0 "发展战略轰炸机"
 
 us_oil_price:0 "结束油价管制"
 us_oil_price_desc:0 "对石油的价格管制虽然稳定了油价，但却很大程度上限制了石油企业开发油井、扩大石油生产的动力。放开油价，虽然会导致其在短时间内迅速飙升，但从长远来看，利润将刺激石油巨头们扩大石油的生产，只有确保足够的石油储备，提高供给，才能最大限度缓解石油危机。"
 us_close_factories:0 "关停亏损企业"
 us_close_factories_desc:0 "没有市场竞争的企业就如同没有动力的机械，只能按照现有的计划生产产品，而不会去改进产品的质量，不会开发新的技术。市场竞争将刺激企业重视发展自己的产品，使其能够为了追求利润而发展自己。能够得到消费市场青睐的产品将获得成功，而不能获得市场认可的产品和企业将被市场无情淘汰。"
 us_cut_welfare:0 "削减福利"
 us_cut_welfare_desc:0 "退休金和失业补贴把我们国家的年轻人变成一群懒鬼，许多人宁愿躺在家里拿救济金也不愿意出门找工作，严重拖累了正常的社会生产，必须把失业补助等各种无意义的救助金停掉。"
 us_internet:0 "发展互联网"
 us_internet_desc:0 "因特网是首个为人类所创造，却不为人类所理解之物，也是有史以来我们在无政府状态下所进行的最疯狂尝试。\n——埃里克·施密特"
 us_invest_computer:0 "投资计算机"
 us_invest_computer_desc:0 "计算机其实很简单……它只需要一些非常简单的指令——去获取一个数字，把它加到另一个数字上，把结果放在那里，判断它是否大于另一个数字——就能以每秒100万次的速度执行。每秒100万次的执行速度，结果看起来就像魔法一样。\n——埃里克·施密特史蒂夫·乔布斯"
 
 us_free_asia:0 "自由亚洲电台"
 us_free_asia_desc:0 "中国大陆沦亡于中共之手，整个亚洲都将面临共产主义威胁，在共产党统治下的人民需要来自自由世界的指引。自由亚洲电台将向共产党统治区的民众传播自由世界的声音，向他们传播共产党的统治真相，为他们反抗暴政提供指引。"
 us_tourism:0 "赞助旅游产业"
 us_tourism_desc:0 "Start spread the news\nI'm leaving today\nI want to be apart of it New York\nNew York"
 us_support_saf_rho:0 "对白人政权的军事援助"
 us_support_saf_rho_desc:0 "所谓的非洲解放运动，不过是莫斯科支持下的共产主义扩张骗局。那些黑人民族主义叛军，哪个背后没有共产主义政权在支持。而为了对抗共产主义支持下的黑人叛乱，我们就必须与白人结盟。南非、罗德西亚和葡萄牙将成为我们在非洲的坚定盟友。"
 
 us_islam_revolution:0 "支持伊斯兰革命"
 us_islam_revolution_desc:0 "一些中东国家向苏联、向共产主义势力靠近的行为，不仅威胁我们的利益，也遭到了伊斯兰保守人士的反对，这些国家国内许多右翼势力反对共产主义的蔓延，并寻求与西方世界的合作。"
 us_free_iran:0 "支持伊朗自由派"
 us_free_iran_desc:0 "巴列维国王也许并不是一位值得我们支持到底的盟友……他的父亲是被美国人推翻的，他本人有很大的民族主义倾向，他希望建立一个强大的伊朗帝国，这意味着终有一天，美国和巴列维之间的关系会破裂。因此，我们也许需要与伊朗国内那些反对国王的反对派建立关系，以等待需要他们的时候。"
 us_Pahlavi:0 "支持巴列维王朝"
 us_Pahlavi_desc:0 "伊朗毫无疑问是中东最关键、最重要的战略要地，他们的石油、他们的位置和他们的国王，都是美国必须积极争取并牢牢控制的中东利益核心部分。"
 us_Isreal_likud:0 "支持以色列右翼"
 us_Isreal_likud_desc:0 "阿拉伯民族主义者支持下的，针对美国的恐怖主义活动愈发激进和极端，为了对抗这些阿拉伯人，以色列自然将成为我们的关键盟友。"
 us_Isreal_support:0 "以色列经济援助"
 us_Isreal_support_desc:0 "以色列国草创之时，需要大量的经济、物资和技术援助，我们必须尽快与他们建立合作，并通过经济和政治影响，使得以色列向自由世界靠拢，以抵抗共产党在中东的扩张。"
 us_nasserism:0 "支持阿拉伯主义"
 us_nasserism_desc:0 "从埃及开始引爆的阿拉伯民族主义狂潮，对我们来说也许是一个机会，如果我们抢在苏联之前，表达我们对阿拉伯民族主义的支持，就有机会将这些阿拉伯国家拉拢到我们的阵营。"
 us_bathth:0 "支持阿拉伯复兴党"
 us_bathth_desc:0 "从埃及开始引爆的阿拉伯民族主义狂潮，对我们来说也许是一个机会，如果我们抢在苏联之前，表达我们对阿拉伯民族主义的支持，就有机会将这些阿拉伯国家拉拢到我们的阵营。"
 us_egy_muslim:0 "接触穆斯林兄弟会"
 us_egy_muslim_desc:0 "一些中东国家向苏联、向共产主义势力靠近的行为，不仅威胁我们的利益，也遭到了伊斯兰保守人士的反对，这些国家国内许多右翼势力反对共产主义的蔓延，并寻求与西方世界的合作。"
 us_arabs_secularis:0 "支持世俗化政权"
 us_arabs_secularis_desc:0 "极端伊斯兰主义的扩张，从长远来看，对美国更多的是威胁，因此，我们必须在极端伊斯兰主义形成军事力量之前，将他们扼杀在摇篮当中。我们应该加紧与那些相对世俗主义的中东国家进行合作，帮助他们压制激进的伊斯兰思想。"
 us_strike_arabs:0 "反对阿拉伯主义"
 us_strike_arabs_desc:0 "阿拉伯民族主义者自我标榜为反帝国主义和反殖民主义，这意味着他们天然就靠近苏俄和共产主义，指望投钱拉拢阿拉伯民族主义是不可能的，我们的政策应该是将他们打压下去。"
 us_israel_sell:0 "向以色列出售武器"
 us_israel_sell_desc:0 "在阿拉伯民族主义者成为莫斯科的马前卒后，以色列便成为我们在中东最重要的盟友，但以色列的武器装备难以抵挡有苏联支持的阿拉伯国家，我们也必须尽快将以色列武装起来，为其提供先进的武器，以确保他们能在这片土地上生存下去。"
 us_me_monarchs:0 "支持君主制国家"
 us_me_monarchs_desc:0 "阿拉伯民族主义者自我标榜为反帝国主义和反殖民主义，这意味着他们天然就靠近苏俄和共产主义。因此我们需要与君主制的阿拉伯国家建立友好关系，如约旦、伊拉克、沙特阿拉伯和海湾国家，以帮助他们镇压阿拉伯民族主义者。"
 us_medical_reform:0 "扩大医疗改革"
 us_medical_reform_desc:0 "我们已经清楚地认识到，没有经济保障和独立，真正的个人自由就无从谈起。贫困之人并非自由之人。饥饿失业之人正是独裁政权的温床……享有充足医疗保健的权利以及获得和享受良好健康的机会，享有充分保障，免受年老、疾病、意外事故和失业带来的经济恐惧的权利……所有这些权利都意味着安全。这场战争胜利之后，我们必须做好准备，在落实这些权利的基础上，朝着人类幸福和福祉的新目标迈进。\n——富兰克林·罗斯福"
 
 us_expanded_ROC:0 "扩大中华民国军力"
 us_expanded_ROC_desc:0 "中华民国退守台湾后，面临着中共政权极大的军事恐吓和威胁，我们必须尽快为中华民国国军提供足够的、先进的武器装备，以协助他们对抗中共随时可能发动的入侵，以保护这块自由亚洲最关键的领土。"
 us_selled_china:0 "向中国出售高新技术"
 us_selled_china_desc:0 "我们与中共的关系发生了翻天覆地的变化，从意识形态敌人，变成了一同对抗俄国人的盟友。但中共军队目前的武器装备十分落后，恐怕无法对抗可能发生的苏联入侵，因此我们或许可以考虑向中共提供少量军事装备或技术。"
 us_invest_china:0 "投资中国大陆"
 us_invest_china_desc:0 "我们与北京改善关系的政策取得了不错的效果，中国官员对我们的许多技术很感兴趣，包括生产技术、精密机械等。中国人到底和我们是一样的，他们想要的我们都有，要是能卖给他们才好呢。"
 us_europe_rightwing:0 "支持右翼团体"
 us_europe_rightwing_desc:0 "苏俄对欧洲的军事威胁，使我们必须寻找可以共同对抗共产主义的盟友，在这一背景下，我们也许不得不去寻找那些曾经与我们敌对的人——民族主义者、保守主义者、甚至是法西斯主义者。只要他们能够帮助我们抵抗苏联，那么就必须考虑与他们的接触。"
 us_solidarity:0 "支持团结工会"
 us_euro_aid:0 "扩大对欧洲援助"
 us_euro_aid_desc:0 "欧洲复兴，不仅需要经济上的支持，还需要武器和技术以对抗共产主义入侵。"
 us_Scandinavia:0 "接触北欧"
 us_Scandinavia_desc:0 "北欧扼守北极航线，连接苏联本土和大西洋，将成为欧洲争夺的关键点。我们一方面要保护挪威和冰岛两个重要盟友，使其不被苏联颠覆而威胁北大西洋，另一方面则拉拢芬兰和瑞典，并在芬兰问题上作文章，以向欧洲展示苏联的危险性。"
 us_deutsch_union:0 "德意志共同体"
 us_deutsch_union_desc:0 "我们在德国西部占领区扶持一个联邦德国的方案没有成功，英美法占领区分别成立了多个邦国，但这并不意味着失败，这些邦国依然是自由世界阵营的，我们依然可以以共同体或者某种形式，推动他们的内部合作，团结起来对抗共产主义。"
 us_overthrow_france:0 "颠覆法国现政府"
 us_overthrow_france_desc:0 "就像我们和斯大林的关系最终破裂一样，夏尔·戴高乐也和我们决裂了，他已决定彻底退出西方国家的军事合作，并向苏联靠拢，这绝对不可容忍！"
 us_support_bandera:0 "支持苏联境内的叛军"
 us_support_bandera_desc:0 "作为第二次世界大战的胜利者，苏联狮子大开口地吞并了数个东欧国家，他们对乌克兰、白罗斯的统治被巩固，曾经独立自由的爱沙尼亚、拉脱维亚和立陶宛也沦入共匪魔抓。罗斯福总统为了拉拢苏联对抗纳粹，默许了这一行径，但现在情况有变，俄国人不满足于对东欧的统治，还试图将魔爪伸向西欧，因此我们需要联络并支持那些还在抵抗的民族主义团体，让他们破坏苏联的后方，以减少苏联在西欧施加的压力。"
 us_support_bandera_tool:0 "允许通过情报机构，支持东欧地区（包括苏联境内）的武装反政府团体。"
 
 
 us_dixemocratic:0 "支持迪克西民主党"
 us_dixemocratic_tool:0 "当白人至上主义支持率达到40%以上，迪克西民主党将取代民主党，获得参与1952、1956、1960年总统选举的机会"
 us_remove_asian:0 "清除亚裔"
 us_remove_asian_desc:0 "任何去过远东的人都知道，亚洲血统与欧洲或美洲血统的混血，十有八九都会产生极其不幸的结果。在东方，有成千上万所谓的欧亚混血儿——男女老少，他们拥有部分亚洲血统，部分欧洲或美洲血统。这些欧亚混血儿普遍受到歧视和鄙视，无论是居住在那里的欧洲人和美国人，还是居住在那里的纯亚洲人，都对他们抱有偏见和鄙夷。\n——富兰克林·罗斯福"
 us_remove_mexican:0 "清除墨西哥裔"
 us_LGBT:0 "LGBT问题"
 us_LGBTT_desc:0 "随着嬉皮士运动带来性解放和完全颠覆宗教的性观念，曾被认为是怪胎的变性者和同性恋群体，也开始自称为性少数群体，要求得到政治权利。在选票面前，一些标榜进步主义的政党无论愿不愿意，也不得不与他们进行接触。"
 us_youth_vote:0 "降低投票年龄"
 us_nature_protech:0 "环境保护法案"
 us_nature_protech_desc:0 "《寂静的春天》让环境破坏和保护成为了政治议题，当被污染的水源、河流、海洋，死亡并消失的物种、开发殆尽的森林和被二氧化硫侵蚀的天空成为报纸和电视新闻上的热议话题时，公众对环保政策和污染控制的关注便不断提高。有的政府积极支持环保议题，希望以此争取进步主义者的支持。\n森林需要多年才能成熟；因此，若要为了国家的福祉而维护森林，就必须着眼长远。森林是这片土地的肺，净化空气，滋养人民。\n——富兰克林·罗斯福"
 us_free_social:0 "社会进步"
 us_free_social_desc:0 "我们必须一丝不苟地捍卫所有公民的公民权利和公民自由，无论其背景如何。我们必须牢记，任何压迫、任何不公正、任何仇恨，都是旨在破坏我们文明的楔子。\n——富兰克林·罗斯福"
 
 us_invest_afruca:0 "投资非洲建设"
 us_invest_afruca_desc:0 "非洲已摆脱欧洲人数百年的统治，并建立了数个新生的国家，我们必须尽快与非洲各国的新政府建立关系，并通过经济和政治影响，使得新政府向自由世界靠拢，以抵抗共产党在东南亚的扩张。"
 us_infected_WEST_africa:0 "渗透西非"
 us_infected_WEST_africa_desc:0 "法国人的撤离使得撒哈拉沙漠陷入真空状态，为了不让共产主义势力趁虚而入在这里建立影响力，我们必须抢占先机。"
 us_infected_magreb:0 "渗透北非"
 us_infected_magreb_desc:0 "法国人的撤离使得北非陷入真空状态，为了不让共产主义势力趁虚而入在这里建立影响力，我们必须抢占先机。"
 us_infected_congo:0 "渗透中非"
 us_infected_congo_desc:0 "刚果是非洲大陆最富有、最重要的资源核心，这里有无数的铀矿、金矿、铜矿和钻石矿……现在，比利时人走了，我们必须抢在俄国人之前在这里建立影响力。"
 us_infected_africa_horn:0 "渗透非洲之角"
 us_infected_africa_horn_desc:0 "古老的东非高原具有关键的战略意义，他们扼住红海的咽喉，并面向印度洋的石油运输航线，我们需要尽快和埃塞俄比亚的皇帝建立友好关系，使其不被苏联支持下的势力颠覆。"
 us_infected_east_africa:0 "渗透东非"
 us_infected_east_africa_desc:0 "英国人的撤离使得东非陷入真空状态，为了不让共产主义势力趁虚而入在这里建立影响力，我们必须抢占先机。"
 us_african_military_support:0 "军事支持非洲"
 us_african_military_support_desc:0 "苏联人支持下的共产主义叛乱已经在非洲四处点燃，我们必须尽快为我们在非洲的盟友提供军事援助，帮助他们镇压叛乱。"
 
 us_african_puppet:0 "扶持代理人"
 us_african_puppet_desc:0 "共产主义正在非洲蔓延，我们需要阻止苏联势力在非洲的颠覆和扩张，而非洲的自由国家需要有人帮助他们强化武装力量以对抗叛乱。"
 us_france_coop:0 "与法国的合作"
 us_france_coop_desc:0 "所谓的非洲民族解放运动，不过是莫斯科支持下的共产主义扩张骗局，我们必须帮助法国人人将这些叛乱镇压下去。"
 us_replace_france:0 "顶替法国"
 us_replace_france_desc:0 "法国人没有能力镇压非洲风起云涌的共产主义叛乱，他们也无法再获得非洲本土精英阶级的认可，我们将取而代之，接过保卫非洲的任务。"
 us_anti_colonism:0 "支持去殖民化"
 us_anti_colonism_desc:0 "欧洲对非欧洲数百年的统治，毫无疑问已经无法再延续，于其投入无数的资源帮助欧洲盟友去进行无意义的殖民地战争，不如主动提出对去殖民运动的支持。尽管这可能使得我们与欧洲盟友产生矛盾，但由此来争取非洲国家的支持与合作，避免共产主义抢占先机，是非常重要的。"
 us_support_portugal:0 "支持葡萄牙"
 us_support_portugal_desc:0 "葡萄牙是北约的坚定盟友，也是非洲最积极、最有力的反共产主义前线，他们正在安哥拉和莫桑比克为对抗共产主义叛乱浴血奋战，并需要我们的帮助。"
 us_support_white:0 "支持白人政府"
 us_support_white_desc:0 "所谓的非洲解放运动，不过是莫斯科支持下的共产主义扩张骗局。那些黑人民族主义叛军，哪个背后没有共产主义政权在支持。而为了对抗共产主义支持下的黑人叛乱，我们就必须与白人结盟。南非、罗德西亚和葡萄牙将成为我们在非洲的坚定盟友。"
 us_support_colonism:0 "维护殖民体系"
 us_support_colonism_desc:0 "美国完全没有必要和道义，去援助那些所谓的民族解放运动，这些民族主义者在独立后只会毫不犹豫地投向莫斯科……事实上，我们更应该帮助我们的欧洲盟友保护他们在非洲大陆的遗产，在非洲的军事合作，既可以阻止共产主义在非洲的蔓延，也可以强化我们与欧洲盟友的关系。反之，如果我们的盟友失去在非洲的领地，那他们在欧洲本土的安全野将受到动摇。"
 
 us_into_africa:0 "介入非洲"
 us_into_africa_desc:0 "曾经的黑暗大陆正在迎来新生，白人统治下的非洲正在尝试寻求民族自决。这片土地有数不尽的资源，以及巨大的政治意义。"
 us_invest_latins:0 "投资拉丁美洲建设"
 us_invest_latins_desc:0 "拉丁美洲作为美国的传统投资市场，在共产主义蔓延西半球的威胁下，投资有了更重要的政治意义。我们需要继续通过强化在拉美的经济影响力，以保障我们的政治影响。"
 us_ant_mexico:0 "威慑墨西哥"
 us_ant_mexico_desc:0 "墨西哥革命制度党是一个带有民粹主义和民族主义色彩的政党，自从其上台以来，就不断地煽动民粹主义，这与共产主义实际上别无二致，都危害我们的拉美利益，且有接近莫斯科的危险……"
 us_mex_rip:0 "接近墨西哥革命制度党"
 us_mex_rip_desc:0 "墨西哥革命制度党已经统治墨西哥近数十年，这个带有民粹主义和民族主义色彩的政党已经在墨西哥建立了牢固的统治。虽然革命制度党似乎看起来不利于美国在墨西哥施加影响力，但另一方面，其党内存在一定的右翼人士，也不会允许共产主义者在墨西哥施加影响力。基于这一点，我们也许可以尝试与墨西哥政府进行接触，只要他们坚决反对共产主义，那么我们不会介意在墨西哥市场损失一些投资，相反，可以继续为墨西哥提供经济援助。"
 us_mexico_democratic:0 "接近墨西哥民主势力"
 us_mexico:0 "墨西哥关系"
 us_mexico_desc:0 "墨西哥作为我们除了加拿大以外的唯一一个陆上邻国，谨慎处理与墨西哥的关系是十分重要的，尤其是在共产主义逐渐向拉美渗透，而民粹主义又在墨西哥有广泛影响力的背景下。"
 us_canada:0 "交好加拿大"
 us_canada_desc:0 "加拿大作为我国的传统盟友，依然需要在新的全球对抗中加强军事合作。尤其是俄国的潜艇出没于北大西洋，导弹火箭可能绕过北半球入侵北美的情况下，双方在防空和情报领域的合作更需要更加紧密。"
 us_NAFTA:0 "北美自由贸易区"
 us_NAFTA_desc:0 "美国、加拿大和墨西哥三国之间是重要的商业伙伴关系，为了促进北美洲三国之间的贸易往来，应该推动自贸区计划，消灭关税壁垒。"
 us_missle_defence:0 "国家导弹防御系统"
 us_missle_defence_desc:0 "冷战局势日益紧张，我们必须考虑在全面核战争爆发后，如何尽可能地防御俄国人的导弹落在我们头上。国家导弹防御系统将建立一套从预警、警报、反导和避难的一系列机制，通过卫星警报和反导导弹系统，将来袭的核武器击毁。"
 us_super_radar:0 "超级雷达"
 us_super_radar_desc:0 "美国与苏联的核武器，不管是技术还是数量都在急剧膨胀，不断增加的核武器防御压力是我们需要更先进的雷达技术。"
 us_latin_democratic:0 "支持民主派"
 us_latin_democratic_desc:0 "拉丁美洲考迪罗的独裁、残暴和腐败行径令人触目惊心，他们的反人类统治将人民逼上绝路，这样只会让更多的群众投向共产主义叛乱分子，因此我们必须向这些独裁者发出警告，如果他们还想和美国进行合作，就必须对自己的残暴罪行作出收敛。"
 us_operation_eagle:0 "秃鹰行动"
 us_operation_eagle_desc:0 "拉丁美洲多地爆发了共产主义叛乱，我们不仅需要为我们的拉美盟友提供军事和经济援助，还需要给予情报援助，帮助拉美国家建立起一个完善的反叛乱情报机制。"
 
 us_limited_dictators:0 "对独裁者的警告"
 us_limited_dictators_desc:0 "拉丁美洲考迪罗的独裁、残暴和腐败行径令人触目惊心，他们的反人类统治将人民逼上绝路，这样只会让更多的群众投向共产主义叛乱分子，因此我们必须向这些独裁者发出警告，如果他们还想和美国进行合作，就必须对自己的残暴罪行作出收敛。"
 
 Trumanism:0 "杜鲁门主义"
 Trumanism_desc:0 "面对着苏联势力对欧洲的渗透，杜鲁门总统提出的他的应对措施，从而开启了冷战的序幕。"
 Middle_East_policy:0 "艾森豪威尔主义"
 Middle_East_policy_desc:0 "在纳赛尔、卡西姆等民族主义势力在阿拉伯国家中崛起后，苏联得到了干涉中东地区的机会，而我们也需要尽快介入中东了。"
 Social_reform:0 "国内政策"
 Social_reform_desc:0 "二战时期的军事投资带来了经济繁荣，中产阶级迅速增加，他们带来了新的政治主张和新的思想，包括政治体制的革新和对民权改革的诉求。"
 Taft_Hartley_Act:0 "塔夫特-哈特利法案"
 Taft_Hartley_Act_desc:0 "塔夫特-哈特利法案是二战之后美国颁布的限制工会权力的法案。"
 Against_punishment:0 "打击种族主义暴力"
 Against_punishment_desc:0 "尽管黑人在二战中做出了巨大贡献，但针对黑人的仇恨依然蔓延，美国南方屡次发生针对黑人的仇杀，这种种族主义暴行已经对我国的稳定带来危害，一定要严惩。"
 USA_abolish_segregation:0 "初步废除种族隔离"
 USA_improve_law_fair:0 "推动司法公正"
 Keynesian:0 "凯恩斯主义"
 Keynesian_desc:0 "凯恩斯主义是二战后西方世界的流行经济政策，主张建立大政府，增加政府干预和财政赤字，利用公共建设和公共事业扩大内需，创造市场需求和就业岗位，从而实现经济的发展和复兴。"
 Libertarianism:0 "新自由主义"
 Libertarianism_desc:0 "新自由主义认为应当充分发挥自由市场在经济运作中的主导地位，而政府官僚的过多干预违背经济规律，市场能够指引人们为了争取各自的利益达而进行效率最好的经济活动，通过减税、私有化等政策，政府的介入越少，经济运行得越好。"
 Exploring_space:0 "太空探索"
 Exploring_space_desc:0 "第二次世界大战带来了巨大的科技进步，火箭技术的发展使得人类进入太空成为可能。我们毫无疑问要支持太空计划，这既是证明我国制度的先进，也是为了军事上的优势。"
 asia_policy:0 "亚洲政策"
 asia_policy_desc:0 "日本帝国的入侵摧毁了亚洲，也为战后亚洲带来了新的秩序。我们与蒋介石政府和大韩民国政府建立了坚定的盟友关系，但他们面临着共产主义的威胁。我们英国与荷兰盟友在东南亚的领地也面临着共产主义游击队的破坏，我们必须尽快介入，保护自由世界在亚洲的存在。"
 South_Asia:0 "南亚政策"
 South_Asia_desc:0 "英国离开印度后，在这里留下了不稳定的国际秩序。印度共和国与巴基斯坦之间的冲突不断，尼泊尔、锡金和不丹夹杂在中国和印度之间，亚洲的中心阿富汗也面临着俄国人的渗透。这是我们介入南亚局势的最好时机。"
 pro_India:0 "亲近印度"
 pro_India_desc:0 "印度是一个有着巨大潜力的大国，拥有辽阔的土地和庞大的人口，曾经大英帝国的明珠实现独立后，正寻求快速发展和大国地位，而我们可以提供这个帮助。"
 USA_traditional:0 "坚持美国传统"
 USA_traditional_desc:0 "就如同摩西出埃及一样，当五月花号的基督徒抵达新世界时，就意味着美国人成为了上帝的选民。基督教和自由民主的价值观就是我们的血液，而在面临反基督、极权主义的共产主义威胁时，就更意味着我们的公民需要坚持我们的价值观。"
 USA_social_control:0 "稳定社会"
 USA_social_control_desc:0 "共产主义在二战后继续蔓延，已渗透到我国内部。学生、工人乃至政客都开始接触左派思想，我们需要警惕。"
 USA_anti_racist:0 "保障黑人选举权"
 USA_anti_racist_desc:0 "反对种族主义和种族隔离的民权运动正在迅速崛起，作为自由世界的领袖，我们所要做的是顺从时代潮流，结束种族主义的历史，让广大黑人群众获得他们应得的完整公民权。"
 USA_minor_ethnics:0 "改善少数族裔地位"
 USA_minor_ethnics_desc:0 "随着黑人民权运动蓬勃发展，亚裔、拉丁裔等族裔的公民权利也受到广泛关注。"
 USA_nativs:0 "改善原住民地位"
 USA_nativs_desc:0 "随着民权运动不断发展，这片土地真正的主人——印第安原住民也开始寻求完整和平等的公民权。"
 USA_Evangelical:0 "扩大基督教会影响力"
 USA_Evangelical_desc:0 "基督教的价值观和上帝的信徒塑造了美国人的价值观，为了维护社会稳定，应该让基督教会在社会中发挥更多作用。"
 USA_anti_hippies:0 "镇压嬉皮士"
 USA_anti_hippies_desc:0 "嬉皮士都是一群讨厌的流氓败类和社会危险分子，他们吸毒、淫乱，且支持包括共产主义在内的危险政治运动，必须要对他们进行严厉打击。"
 USA_pure_states:0 "纯净的国度"
 USA_pure_states_desc:0 "谁不喜欢生活在一个完美的美利坚合众国中？社会稳定而繁荣，人人自由而平等，所有公民各司其职，而没有共产主义、极权主义和异教徒的威胁。"
 Penetration_Nepal:0 "渗透尼泊尔"
 Penetration_Nepal_desc:0 "高耸的喜马拉雅山下的尼泊尔王国正发生政治动荡，尼泊尔过大党寻求进行民主改革并与国王对抗，印度和中共也在尝试对该国进行渗透。"
 Penetration_Tibet:0 "渗透西藏"
 Penetration_Tibet_desc:0 "在中共控制西藏后，仍有一些不服从的藏民寻求抵抗，我们可以为其提供支持，从而给中共政府制造麻烦。"
 Pro_Pakistan:0 "亲近巴基斯坦"
 Pro_Pakistan_desc:0 "由前印度的穆斯林地区组成的新国家，巴基斯坦伊斯兰共和国正寻求盟友，他们向东对抗亲苏的印度，向西影响中东，向南扼守波斯湾，向北接近阿富汗和苏联中亚地区，是极其重要的战略位置。"
 Penetration_Afghanistan:0 "渗透阿富汗"
 Penetration_Afghanistan_desc:0 "位于亚洲中心的阿富汗一直都是必争之地，对于苏联来说，这是通往印度洋和波斯湾的关键地带，而对我们来说，这是一个可以渗透进入中亚地区的据点。"
 Penetration_Central_Asia:0 "渗透中亚"
 Penetration_Central_Asia_desc:0 "中亚地区在苏联内战中被苏维埃政权吞并，但这里的穆斯林人口并不完全服从，现在这里被苏联建设成为航天和工业中心，意味着我们可以尝试对这里进行渗透。"
 Penetration_Sinkiang:0 "渗透新疆"
 Penetration_Sinkiang_desc:0 "新疆省的维吾尔族民族主义者正寻求独立，他们不愿意接受中国汉人的统治，对该地区的渗透不仅可以破坏中共在此的核设施，也可以借此渗透进入苏联腹地。"
 Southeast_Asia:0 "多米诺理论"
 Southeast_Asia_desc:0 "多米诺骨牌理论是美国总统艾森豪威尔提出的关于东南亚局势的观点，在中国大陆被中共控制后，共产主义将进入越南，随后是老挝、柬埔寨、泰国和马来西亚，像多米诺骨牌一样一个接一个倒下。如果想要保护整个东南亚不被赤化，就必须避免第一个骨牌的倒下。"
 Penetration_Indonesia:0 "渗透印尼"
 Penetration_Indonesia_desc:0 "印尼不仅是东南亚最大的国家，并且有重要的石油资源，目前该国正同时处于共产主义和伊斯兰势力崛起的威胁中，我们可以与他们的反共产主义势力接触。"
 Negotiating_with_black:0 "与黑人对话"
 Negotiating_with_black_desc:0 "20世纪50、60年代，是美国社会动荡、社会运动此起彼伏的年代，其中规模最大的，便是黑人追求民主和权利的运动。现如今暴力镇压黑人已不在可能，谈判和对话才是首选。"
 Civil_rights_equality:0 "民权法案"
 Civil_rights_equality_desc:0 "种族主义即将被扫入垃圾堆，一项新的法案将以国家法律形式彻底废除种族隔离、保障种族平等。"
 Contact_Thailand:0 "接触泰国"
 Contact_Thailand_desc:0 "泰国是东南亚战略地位最重要的国家之一，该国如今处于军政府统治之下，当局致力于对抗民主派和左派的威胁，这正是我们进行接触的好时机。"
 US_Thai_Agreement:0 "美泰条约"
 US_Thai_Agreement_desc:0 "共产主义游击队在东南亚的威胁进一步加大，为了对抗印度支那、泰国和缅甸的共产叛军，我们将在泰国建造可供美军使用的基地，作为回报，我们将为泰国提供援助和投资。"
 White_first:0 "强化种族隔离制度"
 White_first_desc:0 "在共产主义威胁下，对黑人让步只会助长各种敌对意识形态的扩张，最好的办法就是让黑人回到他们该待的地方。"
 USA_strike_civil_right:0 "压制民权运动"
 USA_strike_civil_right_tool:0 "每次在事件或决议中，对黑人运动的镇压，都能获得白人至上主义支持率和政治点数，减少对稳定度的惩罚"
 Restrict_immigration:0 "拒绝移民"
 USA_expanded_soiutern_politicians:0 "支持南方政治家"
 USA_expanded_soiutern_politicians_desc:0 "像斯特罗姆、乔治·华莱士这样的南方政治家，正在与黑人暴力运动及其背后的共产主义煽动者作斗争，我们应该帮助他们进行政治活动，获得更多的支持，以保护我们国家的传统价值观，捍卫白人利益和南方州权。"
 USA_CSA_history:0 "联盟国万岁！"
 USA_CSA_history_desc:0 "来自南方的兄弟们已经取得了华盛顿的最高领导权，然而依然有一些洋基佬，还在试图反对我们的种族隔离政策，并打出一百多年前老亚伯拉罕留下的口号……因此，要根治这个问题，就必须从宪法开始根治这个国家。废除宪法中不利于我们的条款，将种族隔离和州权纳入到宪法当中，将国家政权牢牢掌握在迪克西人的手里……最好，直接宣布，内战中联邦违法入侵，南方才是正义的一方！"
 Anti_negro:0 "打击黑人"
 Anti_negro_desc:0 "黑鬼们在发现政治运动无法争取到他们想要的东西后，就开始煽动暴力动乱，给他们点颜色瞧瞧。"
 Infiltrate_Burman:0 "接触缅甸"
 Infiltrate_Burman_desc:0 "缅甸政府尝试与少数民族和共产主义者联合的政策失败了，大量的叛乱武装正威胁着这个国家，这也是我们拉拢缅甸的绝佳机会。"
 Interfering_Vietnam:0 "渗透越南"
 Interfering_Vietnam_desc:0 "越南正处于和共产主义对抗的战争中，这将是一场决定东南亚未来的战争，我们必须尽早介入，将共产党的势力扼杀在越南的丛林里。"
 pro_SVN:0 "亲近西贡"
 pro_SVN_desc:0 "越南共和国政府正致力于消灭共产党叛乱，我们将会是他们不可缺少的盟友，反过来他们对我们也是。"
 pro_VIN:0 "亲近河内"
 pro_VIN_desc:0 "早在二战末期，美国情报机构就已经与胡志明领导下的越盟有所往来，合作对抗日本人，而现在越南南部被法国控制，如果想要渗透进入中南半岛，与越盟合作并不是不可能的，尽管他们是共产主义。"
 Enter_SouthChina:0 "介入南海局势"
 Enter_SouthChina_desc:0 "南中国海岛屿争端十分复杂，中国大陆为此与越南、菲律宾等国关系恶劣，这无疑是一个极好的外交切入点，利用南海问题拉拢东南亚各国，形成对中国的包围网。"
 Free_World:0 "援助自由世界"
 Free_World_desc:0 "我们有责任支持世界上所有处于共产主义威胁下的国家，我们可以给他们任何需要的东西，无论是钱，还是枪。"
 VOA:0 "美国之音"
 VOA_desc:0 "在对抗共产主义的意识形态战争中，有时候思想和语言要比枪炮更加有力。"
 Penetration_Laos:0 "接触老挝"
 Penetration_Laos_desc:0 "老挝和柬埔寨同样是东南亚战略中的重要一环，他们都面临着共产主义威胁，并在外交上举棋不定，我们可以试着拉拢他们，或者扶植我们的代理人。"
 McCarthyism_focus:0 "麦卡锡主义"
 McCarthyism_focus_desc:0 "共产主义正在以惊人的速度渗透我国，大量的政府工作人员成为为共产党服务的间谍。根据麦卡锡参议员的建议，我们需要采取行动，将这些叛国的政府官员查出来并严厉惩处。"
 USA_hollywood_purge:0 "好莱坞共党调查"
 USA_hollywood_purge_desc:0 "我这里有一份名单，里面记录了一百多名为好莱坞的影视公司工作的人，他们有导演、编剧和著名的演员，而他们无一例外都与共产党发生过不清不楚的关系……"
 USA_anti_commie_group:0 "支持反共社会团体"
 USA_anti_commie_group_desc:0 "支持反共社会团体"
 USA_spread_fear:0 "散布阴谋论"
 USA_spread_fear_desc:0 "曼德拉，你见过共产党喝水吗……这就是我想说的，水，作为人类，你我都需要新鲜纯净的水……曼德拉，你有没有想过我为什么只喝蒸馏水，雨水，或纯度的谷物酒精？你听过氟化吗？饮用水氟化……你知道那是什么吗？你知不知道，饮水氟化，是我们面临的最恐怖的、最危险的共产主义阴谋？"
 CIA:0 "建立中情局"
 CIA_desc:0 "战争的胜利，离不开准确而快速的情报网络。在第二次世界大战中，美国陆海军分别建立了独立的情报机构，并取得了一定的成就。二战结束后，冷战的爆发让情报战变得无比重要，促成了美国中央情报局的诞生。"
 White_terror:0 "镇压左派"
 USA_PRISM:0 "棱镜计划"
 USA_socialist:0 "左派路线"
 USA_workers:0 "改善工人待遇"
 USA_union:0 "独立工会"
 USA_anti_tolas:0 "打击垄断托拉斯"
 USA_reform:0 "改革社会政策"
 USA_ban_gun:0 "枪支管制"
 USA_ban_leaf:0 "药品管制"
 USA_free_CHINA:0 "支持中国民主派"
 USA_free_CHINA_desc:0 "中国共产党的乌托邦理想随着大饥荒和文化大革命带来的混乱彻底破碎，中国大陆开始出现抵抗力量，我们将为他们退供帮助。"
 USA_support_ROC:0 "对中华民国的经济支持"
 USA_support_ROC_desc:0 "国民党政府需要经济支援以对抗中共，我们将为他们提供经济上的支持，使他们有能力优先稳定台湾的社会局势。"
 PRK_democracy:0 "支持朝鲜民主派"
 PRK_democracy_desc:0 "北朝鲜在金日成的独裁统治下动荡不安，一些反对金日成的势力正在形成，我们可以为他们提供帮助。"
 KOR_nego:0 "推动南北和谈"
 KOR_nego_desc:0 "准确的说，一场爆发于朝鲜半岛的亚洲全面战争并不符合我们的利益，既然金日成似乎有意与我们谈判，那我们应当进行考虑，释放善意。"
 USA_JSDF:0 "组建日本自卫队"
 USA_JSDF_desc:0 "政策是会改变的，尽管我们在二战中为了打败日本帝国付出了巨大的代价，但在新的共产主义威胁下，我们不得不化敌为友。为了避免共产党夺取日本的政权，我们需要将日本再次武装起来，组织一支新的军队。"
 USA_dubl4_plan:0 "双子座计划"
 USA_dubl4_plan_tool:0 "发射航天器后有一定几率退还一定航天点数"
 USA_DepartmentDefence:0 "国防部改革"
 USA_DepartmentDefence_desc:0 "直到第二次世界大战时期，美国陆海军仍然是独立运作的，缺少一个统一的指挥机构。富兰克林·罗斯福总统生前的愿望之一，就是成立美国国防部，统筹指挥美国武装力量。"
 Social_Welfare:0 "社会福利"
 Social_Welfare_desc:0 "政府存在的意义就是为人民提供衣食无忧的生活，将福利制度从摇篮推行到坟墓，一个能让公民从出生到死亡都没有经济困难的国家是完美的现代国家，也能为政府提供绝对优势的支持。"
 USA_Airforce:0 "成立空军"
 USA_Airforce_desc:0 "直到第二次世界大战时期，美国的空中武装力量仍然分别归属于陆军航空兵和海军航空兵，没有独立空军。二战结束后，美国国防部开始筹划独立空军。"
 political_reform:0 "政治体制改革"
 Contact_CCP:0 "接触中共"
 Contact_CCP_desc:0 "没有永远的敌人，只有利益驱使外交。随着中共政府与苏联矛盾激化，到了兵戈相见的程度，无论是华盛顿还是北京都不得不考虑双方合作的可能了。"
 PRC_Arms_Sales:0 "向中共出售武器"
 PRC_Arms_Sales_desc:0 "中美关系不断改善，为了对抗苏联威胁，双方开始寻求军事上的合作。中国人民解放军的武器相对落后，中国政府寻求升级解放军的武器装备，而我们可以提供帮助。"
 PRC_USA_alliance:0 "中美同盟"
 PRC_USA_alliance_desc:0 "苏联威胁不断增加，国际局势日益严峻，中美之间的合作需要升级为完全的军事同盟。"
 TW_relation_law:0 "与台湾关系法"
 TW_relation_law_desc:0 "虽然我国承认了中华人民共和国的合法性以及其在中国大陆的统治，但这不意味着我们完全放弃了在台湾的中华民国。在美国与台湾中断外交关系后，我们仍然需要以其他方式与台北保持往来，不仅是经济上的。"
 one_China:0 "一个中国"
 one_China_desc:0 "随着华盛顿与北京建立了完全的盟友关系，留在台湾的中华民国政府已经失去价值，我们将按照北京的要求，逐渐减少与台湾的往来。"
 Eliminate_unemployment:0 "全美高速公路"
 Eliminate_unemployment_desc:0 "随着二战结束，美国将在50年代迎来经济的快速发展，而发展是离不开基础设施的。"
 New_frontier:0 "新边疆"
 New_frontier_desc:0 "年轻的约翰·肯尼迪踌躇满志，他的政府计划给美国带来一场全面的变革，包括社会改革和经济改革，从而实现美国人心目中的伟大社会。"
 pro_Chiang_Kai_shek:0 "亲近蒋介石"
 pro_Chiang_Kai_shek_desc:0 "蒋介石先生和他的国民党政府在二次大战中和我们的合作非常愉快，现在新的共产主义威胁来临，我们将继续支持蒋介石政府。"
 Taiwan_Agreement:0 "中美共同防御条约"
 Taiwan_Agreement_desc:0 "中国共产党的武力扩张已经对亚洲产生威胁，我们将为国民党政府提供更多军事和外交支持，以供他们抵抗中共。"
 Instigating_Taiwan_independence:0 "支持台湾独立"
 Instigating_Taiwan_independence_desc:0 "国民党政府腐败无能，既不能与中共对抗，也无法维护自己对台湾的统治，也许我们应该考虑在台湾选择新的代理人。"
 Increase_intervention:0 "加大对外干涉"
 Increase_intervention_desc:0 "共产主义正在全球蔓延，面对武装叛乱，如果仅仅是为我们的盟友提供经济援助是远远不够的，他们需要更多的军事装备，乃至军事支援。"
 Nanking_Agreement:0 "中美协议"
 Nanking_Agreement_desc:0 "国民党政府镇压共产党叛乱的军事行动取得初步成功，但他们还需要更多的政治、经济和外交支持。"
 China_Soviet_Conflit:0 "制造中苏争端"
 China_Soviet_Conflit_desc:0 "苏联与中国政府在乌苏里江边境上爆发冲突，我们可以介入并激化两国之间的矛盾，从而创造我们与中国政府进一步交涉的机会。"
 Relieve_Sino_Soviet_relations:0 "改善中苏关系"
 Relieve_Sino_Soviet_relations_desc:0 "国民党政府与苏联的冲突进一步恶化，很有可能会导致世界大战在亚洲的爆发，这并不符合我们的利益，我们应该开展外交周旋，缓和两国的矛盾。"
 ROK:0 "支持大韩民国"
 ROK_desc:0 "韩国已经被从日本的统治下解放出来，但又被南北分区占领。我们应当支持韩国的民主人士，尤其是反共人士，在南方成立新的政府，以对抗共产主义的渗透。"
 Invade_north_Korea:0 "控制朝鲜半岛"
 Invade_north_Korea_desc:0 "朝鲜半岛北部的共产主义政府对南韩乃至日本造成了巨大威胁，最好的防御就是主动进攻，消灭金日成政府。"
 Dodge_plan:0 "支持日本经济复苏"
 Dodge_plan_desc:0 "日本的经济和工业在二战后被完全摧毁，社会动荡和贫困给了共产主义滋生的土壤，我们将拟定一系列计划，支持日本的战后重建，稳定社会局势，也有利于改善美国在日本的威望。"
 Support_Japanese_rightwing:0 "支持日本右翼"
 Support_Japanese_rightwing_desc:0 "敌人的敌人就是朋友，而没有永远的敌人，只有永远的利益。如果要抵抗共产主义在日本的扩张，恐怕最有用的盟友，就是日本帝国时代的政客。"
 free_market:0 "自由市场"
 free_market_desc:0 "市场是一个无形的大手，拥有调控经济的能力，他所能发挥的效果，比政府官僚更有效率，且不会腐败。"
 Japan_US_Security:0 "日美安保条约"
 Japan_US_Security_desc:0 "亚洲局势进一步恶化，无论是苏联、中共还是北朝鲜，还是日本国内的共产主义政治势力，都已经威胁到了我们在日本的存在，我们绝不能丢掉这一重要盟友，必须用军事手段进行保护。"
 Democracy_Japan:0 "日本民主化"
 Democracy_Japan_desc:0 "共产主义正在日本迅速扩张，我们需要尽快扶植代理人来和他们对抗。"
 Marshall_Plan:0 "马歇尔计划"
 Marshall_Plan_desc:0 "欧洲的经济和工业在二战后被完全摧毁，社会动荡和贫困给了共产主义滋生的土壤，我们将拟定一系列计划，支持欧洲的战后重建，稳定社会局势，也有利于改善美国在欧洲的威望。"
 Pro_Britain:0 "英美特殊关系"
 Pro_Britain_desc:0 "英美两国之间存在着不可分割的特殊关系，共同的语言、民族、文化、信仰以及两次世界大战期间的并肩作战让我们结下了深厚的友谊，接下来，我们也将共同应对共产主义威胁。"
 Colonial_guard:0 "殖民后卫"
 Colonial_guard_desc:0 "反殖民运动正在非洲迅速开展，这些非洲叛乱武装带有鲜明的共产主义色彩，如果要控制共产主义和苏联在非洲的扩张，那我们就需要和统治这里的拜仁政府建立合作。"
 Pro_France:0 "接触法国"
 Pro_France_desc:0 "法国自从美国诞生的时候，就是我们的重要盟友，而第二次世界大战中的并肩作战让友谊更加深厚，接下来，我们也将共同应对共产主义威胁。"
 USA_NATO_focus:0 "北大西洋公约组织"
 USA_NATO_focus_desc:0 "苏联在欧洲扩大共产主义影响力的威胁进一步加强，我们必须将欧洲的所有自由国家团结起来，共同对抗来自莫斯科的武力威胁。"
 Pro_Turkey:0 "接触土耳其"
 Pro_Turkey_desc:0 "土耳其正面临苏联的军事威胁，两国在土耳其海峡通过问题上矛盾不断，我们应该介入此事，从而遏制苏联在东地中海地区的军事扩张。"
 Western_European_Defense:0 "返德者演习"
 Western_European_Defense_desc:0 "苏联对西欧，尤其是对德国的威胁正在逐步增大，一旦战事爆发，我们在德国部署的军队可能无法拖延苏军多长时间。返德者计划将会把部分部署在本土的部队列入返德者的编制当中，一旦欧洲战事爆发，隶属于返德者的部队将会以最快的速度部署到欧洲加入战局。"
 REFORGER_modifiers:0 "返德者"
 REFORGER_modifiers_tip:0 "增加陆军单位跨海运输的速度，如果苏联入侵西欧，可以更快抽调部队进行增援。"
 operation_gladid:0 "短剑行动"
 operation_gladid_tip:0 "在北约盟国被苏联占领后，通过决议增加其领土上的抵抗度。"
 Deploying_Pershing_missiles:0 "部署潘兴导弹"
 Deploying_Pershing_missiles_desc:0 "新的中远程弹道导弹已经投入实战，将其部署在西欧，能对苏联造成更大的威慑。"
 Deploying_Pershing_missiles_tip:0 "计算核弹发射范围时算入北约成员国的导弹基地"
 Explorer_I:0 "探索者一号"
 Explorer_I_desc:0 "“人造卫星”指研究和开发各种人造轨道天体的学科，曾经，将人类的造物发射进入太空，仅仅只是科幻小说中的幻想，而如今，火箭技术的成熟使其成为可能。谁能率先将人造卫星送入稳定的地球轨道，谁就将以太空先驱的地位永载史册。"
 Cooperation_with_Soviet:0 "国际合作"
 GIUK_desc:0 "GIUK是指不列颠、格陵兰和冰岛之间的海域，这里是苏联潜艇进入大西洋的必经之地，因此也成为北约的战略要地。"
 Apollo_plan:0 "阿波罗计划"
 Apollo_plan_desc:0 "为什么选择登月作为我们的目标？那他们也许会问为什么我们要登上最高的山峰？为什么要在35年前飞越大西洋？为什么赖斯大学要与德克萨斯大学竞赛？我们决定登月。　我们决定在这十年间登上月球，并实现更多梦想，并非它们轻而易举，而是它们困难重重。因为这个目标将促进我们实现最佳的组织并测出我们最佳的能力，因为这个挑战我们乐于接受，因为这个挑战我们不愿推迟，因为这个挑战我们志在必得，其他的挑战也是如此。——约翰·菲茨杰拉德·肯尼迪"
 USA_manned_space:0 "水星计划"
 USA_manned_space_desc:0 "当地球上的所有土地都被开发后，人类的目光便投向太空。二战刺激科学技术高速发展，火箭的出现使得人们有了将人类送入太空航行的机会，我们必须抢在苏联之前完成这一目标，从而向世人展示，自由世界的科技发展强于极权主义。"
 usa_nasa:0 "美国宇航局"
 usa_nasa_desc:0 "航空航天工程是复杂而重要的的关键项目，应该为此成立一个专门机构，组织专门的科学家和工程师，由政府拨款，开展航天工作。"
 Space_station:0 "太空站"
 Space_station_desc:0 "人类远征太空的重要一步，就是建造在宇宙中的落脚点。建造空间站，使其成为人类在太空的基地，宇航员可以在此休息、补给、从事研究活动，甚至长期居住。"
 US_fucus_WGR:0 "组织德国新政府"
 US_fucus_WGR_desc:0 "其实我们都很清楚，我们与苏联不可能永远是盟友，而对德国问题的处理，将会是苏联与西方国家矛盾的第一个开始……苏联已经在其占领的东欧地区建立了多个共产主义政权，并且在德国东部也开始尝试施行共产主义政策，毫无疑问，莫斯科对德国西部亦有野心，而德国西部处于英、法、美三国管制之下，如果要抵抗共产主义对西部的渗透，就需要将三个占领区合并为一起，建立一个统一的德国西部政府……首先，我们需要将三个战略在经济上进行一体化，比如发行新的通用马克。"
 US_fucus_Bundeswehr:0 "德国再武装化"
 US_fucus_Bundeswehr_desc:0 "政策是会改变的，尽管我们在二战中为了打败纳粹德国付出了巨大的代价，但在新的共产主义威胁下，我们不得不化敌为友。为了对抗苏联的军事威胁，我们需要将德国再次武装起来，组织一支新的军队。"
 Penetrating_Eastern_Europe:0 "渗透东欧"
 Penetrating_Eastern_Europe_desc:0 "共产党独裁统治下，东欧人民的生活水深火热，苦不堪言，血腥的大清洗和崩溃的经济，令社会动荡不安，政治混乱，暴动层出不穷，已经出现了许多有组织的民主反抗团体，我们将为他们提供援助，将这个残暴的共产党政权送入坟墓。"
 Color_revolution:0 "颜色革命"
 Color_revolution_desc:0 "东欧各国的共产党政权已经开始动摇，几乎完全失去民心，现在只需要最后的一根稻草，当人们走上街头，呼喊着要自由，要人权的口号，便可将其压垮。"
 NATO_East_Expansion:0 "北约东扩"
 NATO_East_Expansion_desc:0 "尽管东欧共产党政权已经崩溃，但这些新建立的民主政权却依然担忧莫斯科的武装入侵会卷土重来。西方自由国家将为他们提供庇护，以保卫欧洲的民主阵营不会受到破坏。"
 Pro_Greece:0 "接触希腊"
 Pro_Greece_desc:0 "希腊扼守苏俄黑海舰队的出入口，又近抵巴尔干半岛，是东地中海和东南欧的战略要地，希腊共产党正试图掀起叛乱，我们需要尽快为希腊提供支援，以防共产党夺取该地。"
 Infiltration_Yugoslavia:0 "渗透南斯拉夫"
 Infiltration_Yugoslavia_desc:0 "南斯拉夫尽管建立了共产党政权，但南斯拉夫总统约瑟普·铁托，似乎并不愿意成为莫斯科的傀儡，他与斯大林的关系持续恶化，并寻求与我们的友谊……这是个可以从内部攻破苏俄阵营的机会，不要错过。"
 New_Oriental_Policy:0 "缓和"
 New_Oriental_Policy_desc:0 "与苏俄爆发全面战争是绝对不可取的，比起核战争，还是应该尝试通过外交手段进行缓和，减少军事冲突。"
 Push_Berlin_Wall:0 "推倒这堵墙！"
 Push_Berlin_Wall_desc:0 "如果你为欧洲寻求和平，请你来到这里，打开这座门，推倒这堵墙。"
 Pro_Isreal:0 "亲近以色列"
 Pro_Isreal_desc:0 "比起军事实力和政治倾向都不可靠的阿拉伯国家，以色列毫无疑问是我们在中东最合适的盟友，即使犹太游说团不来找我们，我们也应该支持以色列，以保证我们在中东的政治存在。"
 David_Camp_Agreement:0 "戴维营协议"
 David_Camp_Agreement_desc:0 "以色列和阿拉伯国家之间的多次战争为中东带来了严重的破坏，现在双方政界都出现了呼吁和平谈判的声音，这是美国介入的一次机会，促成双方谈判有利于扩大我们在中东的影响力。"
 Pro_Arabia:0 "亲近阿拉伯国家"
 Pro_Arabia_desc:0 "与阿拉伯国家建立关系应当是我国中东政策的重要内容，无论是为了影响力还是石油。"
 Pro_Egypt:0 "亲近埃及"
 Pro_Egypt_desc:0 "古老的埃及曾经扼守亚洲与非洲之间的互通要道，如今又是控制着苏伊士运河的关键节点，战略意义不言而喻。埃及新政府寻求脱离殖民主义控制，并为此寻找盟友，我们必须抢在苏联人之前与其建立友好的关系。"
 Pro_Saudi:0 "亲近沙特"
 Pro_Saudi_desc:0 "沙特家族领导下的沙特阿拉伯王国拥有世界上最庞大的油田，是中东地缘政治的核心。在二战中，我们已经与沙特国王陛下建立了良好关系，现在我们也将继续与沙特阿拉伯合作，对抗在中东扩散的阿拉伯民族主义和共产主义。"
 Pro_Iraq:0 "亲近伊拉克"
 Pro_Iraq_desc:0 "古老的两河流域，如今是中东石油资源的主人。应当尽快与伊拉克建立关系，并输出经济和政治影响力，不能让其落入俄国人和阿拉伯民族主义者手中。"
 Pro_Iran:0 "亲近伊朗"
 Pro_Iran_desc:0 "伊朗是中东地缘政治的核心之一，他扼守着波斯湾的石油，面对着伊拉克、阿富汗和苏联的南部领土，地理位置极为重要。而苏联对伊朗的入侵早在二战前就开始了，俄国人支持阿塞拜疆和人民党试图推翻巴列维国王，在伊朗建立共产主义政权，以此夺取波斯湾。伊朗的赤化将会使得整个中东面临威胁，因此，介入伊朗局势是中东政策的关键一环。"
 Latin_Ameria:0 "睦邻政策"
 Latin_Ameria_desc:0 "睦邻政策是美国总统富兰克林·罗斯福于1933年提出的针对拉丁美洲的外交政策，即在不干涉拉美各国内政的前提下，保证他们不亲近轴心国和共产主义，而二战爆发后，美国的“睦邻政策”改为保证拉美各国加入盟军。阿根廷因亲德在二战中保持中立，进而遭到美国制裁。二战之后，睦邻政策和门罗主义成为美国拉美政策的两大核心。"
 Pro_Company:0 "支持联合果品公司"
 Pro_Company_desc:0 "在中美洲地峡，联合果品公司的影响力，可能远比当地政府的影响力要大，他们牢牢控制着中美洲各国的经济、社会和政治体系，是我们在中美洲建立稳固控制，以对抗共产主义渗透的先锋。"
 Focus_Pro_Company_text:0 "可以通过决议对拉美亲美国家提供武器等支持。"
 Focus_PHI_armssell_text:0 "可以通过决议对菲律宾提供武器等支持。"
 Focus_MAL_armssell_text:0 "可以通过决议对马来西亚提供武器等支持。"
 Focus_SIA_armssell_text:0 "可以通过决议对泰国提供武器等支持。"
 Focus_SVN_armssell_text:0 "可以通过决议对南越提供武器等支持。"
 Focus_LAO_armssell_text:0 "可以通过决议对老挝和柬埔寨提供武器等支持。"
 Focus_CHI_armssell_text:0 "可以通过决议对中华民国提供武器等支持。"
 Focus_KOR_armssell_text:0 "可以通过决议对大韩民国提供武器等支持。"
 Focus_JAP_armssell_text:0 "可以通过决议对日本提供武器等支持。"
 Focus_JAP_armssell_text:0 "可以通过决议对日本提供武器等支持。"
 Focus_west_euro_armssell_text:0 "可以通过决议对西欧国家提供武器等支持。"
 Focus_IND_armssell_text:0 "可以通过决议对印度提供武器等支持。"
 Focus_PAK_armssell_text:0 "可以通过决议对印度提供武器等支持。"
 Focus_EGY_armssell_text:0 "可以通过决议对埃及提供武器等支持。"
 Focus_ISR_armssell_text:0 "可以通过决议对以色列提供武器等支持。"
 Focus_SAU_armssell_text:0 "可以通过决议对沙特提供武器等支持。"
 Focus_JAP_armssell_text:0 "可以通过决议对日本提供武器等支持。"
 Focus_JAP_armssell_text:0 "可以通过决议对日本提供武器等支持。"
 Focus_JAP_armssell_text:0 "可以通过决议对日本提供武器等支持。"
 Focus_JAP_armssell_text:0 "可以通过决议对日本提供武器等支持。"
 APLA:0 "美洲进步同盟"
 APLA_desc:0 "贫穷与腐败将成为共产主义扩张的铺路石，拉丁美洲许多国家正处于欠发达的社会当中，为了避免共产主义向西半球发展，美洲进步同盟将成为美国政府向美洲国家提供经济援助的重要渠道，帮助美洲国家摆脱贫穷与落后，在民主制度下建立繁荣的国家。"
 Pro_dictators:0 "支持独裁军政府"
 Pro_dictators_desc:0 "富兰克林·德拉诺·罗斯福曾评价尼加拉瓜独裁者索摩查：他是一个混蛋，但是是我们的混蛋。为了维护美国在拉丁美洲的势力范围，右翼的军事独裁政府是最重要的“合作者”。"
 return_cannal:0 "归还巴拿马运河"
 return_cannal_desc:0 "我们自1902年起，就控制着巴拿马运河，将这个沟通两大洋的咽喉掌握在手中，而巴拿马人试图夺回运河的尝试从未挺过，这个问题已经发展为我们与拉丁美洲国家之间的政治障碍，是时候妥善处理了。"
 Reduce_ntervention:0 "税务改革"
 Reduce_ntervention_desc:0 "政府向企业收取高额的税收，以此来补贴福利政策，使得企业失去了发展的活力和市场竞争力，应当调整税收，为有发展能力的企业提供减税降税，以鼓励他们扩大生产。"
 USA_Hight_tech_economic:0 "发展高新技术"
 USA_Hight_tech_economic_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一。随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。\n\n在我看来，电脑是我们迄今为止发明的最了不起的工具。它就像我们大脑的自行车。\n——史蒂夫·乔布斯"
 USA_SIA_Association:0 "支持半导体产业"
 USA_SIA_Association_desc:0 "半导体是一种可以使得电流朝单方向流动的材料，利用半导体，我们可以将庞大的二极管体积缩小到纳米级别，以制造集成电路，这将是二十世纪最伟大的技术之一。"
 USA_Environmentalism:0 "环保政策"
 USA_Environmentalism_desc:0 "《寂静的春天》让环境破坏和保护成为了政治议题，当被污染的水源、河流、海洋，死亡并消失的物种、开发殆尽的森林和被二氧化硫侵蚀的天空成为报纸和电视新闻上的热议话题时，公众对环保政策和污染控制的关注便不断提高。有的政府积极支持环保议题，希望以此争取进步主义者的支持。"
 USA_Renewable_Energy:0 "可再生能源"
 USA_Renewable_Energy_desc:0 "随着人类的能源消耗不断提高，一个不得不面对的问题摆在我们面前——我们的化石能源还能使用多久？以及，在化石能源耗尽之前，使用煤炭和石油造成的污染会对我们的生态造成多么可怕的破坏。为了解决这一问题，可再生能源成为一个新的技术主题，各国都在关注和投资低污染、可再生的新型能源的开发，例如风力、水力、太阳能和氢能。谁能掌握新能源的关键技术，谁就将掌握21世纪的未来发展的主动权。"议题，当被污染的水源、河流、海洋，死亡并消失的物种、开发殆尽的森林和被二氧化硫侵蚀的天空成为报纸和电视新闻上的热议话题时，公众对环保政策和污染控制的关注便不断提高。有的政府积极支持环保议题，希望以此争取进步主义者的支持。"
 USA_Renewable_Energy_tool:0 "每研究完成一项新能源相关的科技，都将获得政治点数和国际影响力。"
 Stanford:0 "斯坦福工业园区"
 Stanford_desc:0 "斯坦福工业园区位于加利福尼亚旧金山和奥克兰地区，这里围绕斯坦福大学建立，有许多接受高等教育技术人才，附近的硅谷地区生产电子芯片所需的硅材，是吸引高新技术企业投资的理想地带。"
 Great_society:0 "伟大社会"
 Great_society_desc:0 "凭借你们的勇气、同情心和愿望，我们将建设一个伟大的社会。在这个社会里，没有孩子会挨饿，没有孩子会失学……我们将汇集全世界最优秀的思想和最广泛的知识来寻找这些问题的答案。我打算成立工作组，筹备一系列会议和研讨会，主题涵盖城市、自然美景、教育质量以及其他新兴挑战。通过这些研究，我们将开始制定迈向伟大社会的路线。\n——林登·约翰逊"
 worker_polocy:0 "提高工人地位"
 us_iran_oi_companies:0 "美伊石油公司"
 us_iran_oi_companies_desc:0 "伊朗的油田是我们中东利益的核心所在，通过成立合资公司，我们将进一步控制伊朗的油田。"
 Middle_east_exist:0 "卡特主义"
 Middle_east_exist_desc:0 "卡特主义是美国总统詹姆斯·厄尔·卡特于1980年1月23日的国情咨文中所提出的外交政策，内容是美国将在有必要时对波斯湾地区使用武力以保护其国家利益，作为对苏联入侵阿富汗并试图将势力范围扩展到海湾地区的回应。该政策提出后，美国建立了“快速部署联合任务部队”（后来改称中央司令部）以作为美军在波斯湾和印度洋地区兵力的指挥机构，并主导了后来的沙漠风暴行动。"
 SDI:0 "战略武器防御计划"
 Penetration_Malay:0 "保护马来亚"
 Penetration_Malay_desc:0 "马来亚半岛扼守马六甲海峡，是欧亚大陆最为重要的海运生命线没有之一，全球超过70的海上石油运输经过这里，而现在马来亚正面临共产党叛乱威胁，我国必须予以介入。"
 Counter_insurgency:0 "特种战争"
 Counter_insurgency_desc:0 "东南亚地区的低烈度反叛乱战争尚未需要美国和盟国进行直接的军事介入，因此尚不需要直接派遣大量武装部队进入该地区与共产党武装直接交火。特种战争指代在不需要美军直接参与作战的情况下，为东南亚的反共产主义政府提供军事顾问和装备，以间接地打击共产主义在东南亚的扩张。"
 Free_World:0 "支持自由世界"
 Free_World_desc:0 "美国将为全世界反对共产主义侵略和奴役的人民提供力所能及的帮助。我们帮助尚未受到共产主义统治的国家提供军事支持，帮助他们抵抗侵略，同时为已经沦入魔掌的人民提供支援，帮助他们反抗暴政。"
 Reaganomics:0 "里根经济学"
 Reaganomics_desc:0 "美国共和党总统候选人罗纳德·里根根据70年代末美国面临的一系列经济问题，采用了芝加哥学派带有新自由主义色彩的货币政策理论，即通过大规模的私有化和减税，来刺激经济的增长。"
 Rollback:0 "回滚"
 Rollback_desc:0 "里根政府上台以后，对苏联阵营展开了全面反击，称之为“Rollback”，美国不仅将全面抵抗苏联在世界各处的势力扩张，还要渗透进华约阵营内。"
 Education_act:0 "教育改革"
 Education_act_desc:0 "作为一名佃农之子，我深知教育是摆脱贫困的唯一途径。作为一名曾经的教师——并且，我希望将来也能成为一名教师——我对这项法律将为我们所有年轻人带来的意义寄予厚望。作为美国总统，我深信，在我签署过或将来会签署的任何法律中，没有哪一项比这项法律对美国的未来更为重要。\n——林登·约翰逊"
 SunBelt:0 "发展太阳带"
 War_on_poverty:0 "向贫困宣战"
 War_on_poverty_desc:0 "自人类生活在这片土地上以来，贫困一直是人类的诅咒。在各个时代、各个大陆，人们都在寻求摆脱贫困的压迫。今天，在人类历史上，一个伟大的国家第一次能够并且愿意致力于消除其人民中的贫困。\n——林登·约翰逊"
 Relief_bill:0 "救济法案"
 Relief_bill_desc:0 "我大学毕业后的第一份工作是在德克萨斯州科图拉的一所墨西哥裔美国人小学当老师。他们中很少有人会说英语，而我的西班牙语也说得不太好。我的学生很穷，他们经常饿着肚子来上课，连早饭都没吃。即使在年幼的时候，他们也体会到了偏见的痛苦。他们似乎永远不明白为什么人们不喜欢他们，但他们知道原因，因为我从他们的眼神中看到了这一点。\n——林登·约翰逊"
 ROK_democracy:0 "支持韩国民主派"
 ROK_democracy_desc:0 "韩国军政府独裁残暴，已经引起了韩国人民的不满，而且他们似乎并不愿意与我们开展全面合作，也许换一个更好的韩国政府，更有利于我们的亚洲战略。"
 ROK_military:0 "支持韩国右翼军人"
 ROK_military_desc:0 "韩国正在陷入混乱，民主派和伪装成民主派的共产党正在让秩序进一步变得混乱不堪。于其让韩国因为民主制度而彻底崩溃，不如支持韩国军人的右翼，协助他们建立一个能够稳定局面的政府。"
 keep_philippines:0 "维护菲律宾"
 keep_philippines_desc:0 "菲律宾是美国在亚洲的第一块领土，也是我们在亚洲最重要的盟友和根据地。二战告诉了我们，失去菲律宾的后果将是灾难性的，我们不能像丢给日本人一样，再把菲律宾丢给共产党。"
 Guam_doctrine:0 "关岛主义"
 Guam_doctrine_desc:0 "是美国政府在越南战争陷入泥潭后提出的收缩政策，即美军将尽量避免直接军事介入亚太地区的冲突，而是帮助亚太盟国强化军事力量，进行自我保护。"
 Focus_guam_text:0 "增加对亚洲国家的军事援助数量效果\n盟国使用美国顾问的加成效果加倍"
 new_peace:0 "新和平"
 Island_chain:0 "岛链"
 Island_chain_desc:0 "中国共产党在亚洲的军事扩张令人担忧，尤其是其海上军力的扩大，将会对整个亚太造成威胁，因此我们必须强化我们在东亚的军事存在，在日本、南韩、台湾和菲律宾增加军事设施以围堵中共海军。"
 Goldwater_Act:0 "戈德华特—尼科尔斯法案"
 USA_Nuclear:0 "发展核技术"
 USA_Nuclear_desc:0 "被释放的原子能已经改变了一切，除了我们的思维模式，因此我们正在滑向空前的灾难。\n——阿尔伯特·爱因斯坦"
 USA_Atom_Peace:0 "和平原子能"
 USA_Atom_Peace_desc:0 "Atomic for peace是美国总统艾森豪威尔提出的核能利用政策，在全世界都处在核威慑的背景下，艾森豪政府提出和平利用原子能，将其运用于核能发电、制造核动力船只等。在这一政策指导下，美国的核技术在50年代末迅速发展，核电站开始兴建，核动力运输船被制造，还出现了利用辐射能进行医疗或改造农业的计划，美国也曾计划与友邦提供核技术。"
 USA_OperationPlowshare:0 "犁铧行动"
 USA_OperationPlowshare_desc:0 "犁铧计划是美国政府在50-60年代以和平利用为目的进行的一系列核试验，其内容包括测试核爆在开山开荒、建造运河或港口中的作用。"
 USA_super_carrier:0 "超级航母"
 USA_super_carrier_desc:0 "世界上首个被记者称为“超级航空母舰”的船只是英国1938年完工的皇家方舟号,该航母长685英尺,可搭载72架飞机(但在1941年皇家方舟号被鱼雷击沉时,这点反而成为累赘)。随后,1943年,美国人把拥有4.5万吨排水量的中途岛级航空母舰称为“超级航空母舰;美国共完工3艘该类航空母舰。但是真正意义上的超级航空母舰是冷战期间美苏两国建造的核动力航母。美国的尼米兹级航空母舰每20至25年更换一次燃料棒,几乎相当于漂浮在海上的城市,它由两个核反应炉驱动,承载逾5000名船员及机组人员,搭载85至90架飞机和直升飞机,其排水量达10万到10.4万吨。而这还不包括船上搭载的导弹。"