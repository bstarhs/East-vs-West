 us_desteny:0 "昭昭天命"
 us_desteny_desc:0 "……而该主张乃据吾等天定命运之义，尽取并支配神赐之洲以大行托付于我之自由权利与联邦自治。\n——约翰·奥沙利文《兼并》"
 
 
