 ire.1.t:0 "议会选举"
 ire.12.t:0 "布莱顿酒店爆炸袭击！"
 ire.12.d:0 "昨天，布莱顿酒店发生的爆炸震惊了整个英格兰。一枚炸弹炸毁了一半的旅馆。几位住在酒店的保守党内阁部长丧生，包括英国首相玛格丽特·撒切尔。外交部长理查德·杰弗里·豪接任总理职务。爱尔兰共和军声称发动这次袭击是为了报复撒切尔内阁对北爱尔兰的强硬立场。"
 ire.13.t:0 "布莱顿酒店爆炸袭击！"
 ire.13.d:0 "昨天，布莱顿酒店发生的爆炸震惊了整个英格兰。一枚炸弹炸毁了一半的旅馆。几位住在酒店的保守党内阁部长丧生，但英国首相玛格丽特·撒切尔幸免于难。爱尔兰共和军声称发动这次袭击是为了报复撒切尔内阁对北爱尔兰的强硬立场。"


