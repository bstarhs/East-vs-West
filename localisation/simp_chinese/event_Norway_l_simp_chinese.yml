 nor.20.t:0 "苏联向我们提出友好条约"
 nor.20.d:0 "苏联向我们提出签订友好条约，希望我们宣布中立地位，不加入美国主导下的西方同盟，作为交换，苏联将尊重我们的中立地位和领土完整。"

 nor.21.t:0 "苏联-挪威友好和平条约"
 nor.21.d:0 "在苏联倡导下，挪威政府与莫斯科签订了友好和平条约，作为条约的一部分，挪威将不加入任何形式的军事同盟组织，成为永久中立国。"

 nor.22.t:0 "挪威拒绝苏联提出的条约"
 nor.22.d:0 "挪威政府拒绝了苏联提出的所谓友好和平条约，该条约要求挪威成为永久中立国。显然挪威政府已决定加入西方国家主导的军事同盟。"

 nor.30.t:0 "挪威国王哈康七世去世"
 nor.30.d:0 "挪威国王哈康七世在奥斯陆因病去世，享年85岁。哈康七世原名为卡尔王子，是丹麦国王腓特烈八十的次子，1903年，挪威脱离瑞典独立，卡尔王子被挪威议会推举为挪威国王，并改名为哈康七世。在第二次世界大战中，哈康七世流亡英国并利用自己的影响力领导流亡政府，为这个古老而又年轻的王国战斗。挪威政府将为哈康七世举办国葬，奥拉夫五世将继任为新国王。"