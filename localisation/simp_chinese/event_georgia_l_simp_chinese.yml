l_simp_chinese:
 geo.1.t:0 "新的格鲁吉亚最高苏维埃成立。"
 geo.1.d:0 "随着苏联政府开始实行新联盟条约，各个苏维埃共和国开始建立自己的政府和议会。格鲁吉亚苏维埃共和国宣布成立新的最高苏维埃，并举行多党派选举。"
 geo.1.a:0 "令人不安。"
 
 geo.2.t:0 "阿布哈兹共和国要求独立"
 geo.2.d:0 "位于格鲁吉亚西北部的阿布哈兹苏维埃共和国爆发了冲突，当地人要求脱离格鲁吉亚实现独立。苏联政府实行的Glasnost政策使得各地爆发了严重的民族主义浪潮，包括阿布哈兹共和国，为此格鲁吉亚人和阿布哈兹人发生了严重冲突。"
 geo.2.a:0 "令人不安。"
 
 geo.3.t:0 "第比利斯爆发示威游行"
 geo.3.d:0 "格鲁吉亚共和国首都第比利斯爆发了大规模示威游行，大量示威者聚集在Rustaveli大道，他们谴责莫斯科政府在实行新联盟条约后，支持阿布哈兹地区从格鲁吉亚分裂，要求制裁阿布哈兹分离主义者，并从苏联获得更大的自治权力。我们的安全部门认为这是一场受到民族主义挑拨的事件，我们应该如何应对？"
 geo.3.a:0 "令人不安。"
 
 geo.4.t:0 "格鲁吉亚爆发流血冲突"
 geo.4.d:0 "消息来自第比利斯。苏联控制下的格鲁吉亚共和国爆发了一场示威游行并遭到镇压，示威者反对阿布哈兹的分离主义并要求格鲁吉亚获得更大的自治权。苏联军队武力驱逐了示威者，并导致十余人死亡。"
 geo.4.a:0 "令人不安。"
 
 geo.5.t:0 "格鲁吉亚宣布独立"
 geo.5.d:0 "在苏联逐步瓦解后，格鲁吉亚、斯大林的故乡，成为下一个脱离苏联的共和国。格鲁吉亚最高苏维埃议会宣布进行投票，决定脱离苏联，修改国名为格鲁吉亚共和国，并采用新的国旗。"
 geo.5.a:0 "令人不安。"
 
 geo.6.t:0 "格鲁吉亚议会选举"
 geo.6.d:0 "随着格鲁吉亚宣布独立，新的政府激将组建。著名的民族主义政治家甘萨胡季亚和前苏联政府官员谢尔瓦德纳泽将竞选格鲁吉亚第一任总统。"
 geo.6.a:0 "令人不安。"
 
 geo.7.t:0 "格鲁吉亚的新政府"
 geo.7.d:0 "格鲁吉亚的第一次总统选举结束，[EGY.GetLeader]赢得选举，将作为格鲁吉亚第一任总统组建政府。"
 geo.7.a:0 "令人不安。"
 
 geo.8.t:0 "阿布哈兹爆发动乱！"
 geo.8.d:0 "阿布哈兹地区爆发武装叛乱！支持阿布哈兹独立的武装分子袭击并占据了多个据点！"
 geo.8.a:0 "令人不安。"
 
 geo.9.t:0 "阿布哈兹战争！"
 geo.9.d:0 "高加索山的阿布哈兹地区爆发了一场以脱离格鲁吉亚独立为目的的武装冲突，目前阿布哈兹叛军已经与格鲁吉亚军队爆发激烈交火！"
 
 geo.10.t:0 "格鲁吉亚撤离阿布哈兹！"
 geo.10.d:0 "经过交战，格鲁吉亚镇压阿布哈兹暴动的军事行动以失败告终，被迫撤离，阿布哈兹武装分子占据了包括首府苏呼米在内的大部分领土，并宣布准备成立新的国家。"
 
 geo.11.t:0 "格鲁吉亚占领苏呼米！"
 geo.11.d:0 "经过交战，格鲁吉亚军队成功击退阿布哈兹叛军，并占领了阿布哈兹的首府苏呼米，残余的叛军被迫撤往山区或俄罗斯境内。"
 
 geo.12.t:0 "军事政变！"
 geo.12.d:0 "随着总统与反对派政治势力的矛盾愈发恶化，一场军事政变迫在眉睫。反对派开始组织武装力量进入第比利斯，要求总统下台。"
 
 geo.13.t:0 "格鲁吉亚爆发政变！"
 geo.13.d:0 "格鲁吉亚总统甘萨胡季亚与反对派的矛盾激化，反对派组织武装力量包围了首都，迫使总统交出权力。甘萨胡季亚被迫宣布辞职并流亡，谢尔瓦德纳泽被邀请就任临时总统。"
 
 geo.14.t:0 "格鲁吉亚爆发内战！"
 geo.14.d:0 "格鲁吉亚总统甘萨胡季亚与反对派的矛盾激化，反对派组织武装力量包围了首都，迫使总统交出权力。甘萨胡季亚拒绝辞职，并纠集忠于自己的力量进行抵抗，战争迅速蔓延至格鲁吉亚全国！"
 
 geo.15.t:0 "甘萨胡季亚回到格鲁吉亚！"
 geo.15.d:0 "被推翻的格鲁吉亚前总统甘萨胡季亚率领忠于自己的部下回到了格鲁吉亚西部，并准备发起一场新的战争以夺回权力。"
 
 geo.16.t:0 "格鲁吉亚爆发内战！"
 geo.16.d:0 "支持甘萨胡季亚的武装叛军对格鲁吉亚政府宣战！"
 
 geo.17.t:0 "格鲁吉亚动乱结束"
 geo.17.d:0 "支持甘萨胡季亚的武装叛军在格鲁吉亚政府镇压下瓦解，甘萨胡季亚本人离奇死亡。"
 
 
 geo.30.t:0 "格鲁吉亚爆发游行示威"
 geo.30.d:0 "去斯大林的风波进一步扩大……在几天前的讲话中，尼基塔·赫鲁晓夫不仅再一次严厉批评斯大林，甚至对斯大林的家乡——格鲁吉亚进行了抨击，讥讽格鲁吉亚人将斯大林视作帝王一样崇拜……这导致了严重的后果，格鲁吉亚的第比利斯、戈里、鲁斯塔维和库伊塔西等地区，群众聚集起来在公共场合发起示威，散发传单，指责赫鲁晓夫严重地伤害了格鲁吉亚人，要求赫鲁晓夫道歉，并停止过度的去斯大林化运动。"
 
 geo.31.t:0 "格鲁吉亚的游行示威进一步扩大"
 geo.31.d:0 "赫鲁晓夫侮辱格鲁吉亚人的事件继续发酵。发生在格鲁吉亚的示威游行和抗议活动不断扩大。在斯大林的家乡戈里，人们冒着违反法律的风险为元帅重新建造了一座简易的雕像。在格鲁吉亚首府第比利斯，大学生开始罢课，大街上的汽车鸣笛为示威者助威。大量的斯大林支持者聚集在鲁斯塔维里大街、列宁广场和市政厅，要求莫斯科停止对格鲁吉亚人和斯大林的攻击。"
 
 geo.32.t:0 "格鲁吉亚示威者要求为斯大林恢复名誉"
 geo.32.d:0 "越来越多的示威者包围了第比利斯市政厅，官员不得不出面与示威者谈话。示威者代表要求立刻停止对斯大林的侮辱、抹黑和攻击，为伟大的领袖恢复名誉。"
 
 geo.33.t:0 "莫斯科政府同意了示威者的部分请求"
 geo.33.d:0 "莫斯科发布声明，苏共中央政治局经过考虑，决定同意格鲁吉亚示威者的请求。赫鲁晓夫在昨天的苏共会议上作了自我批评，承认自己作出了过于极端的发言。此外，苏联政府决定暂停对斯大林进行严厉批判的活动，还未拆除的斯大林雕像将被保留，以及取消斯大林格勒的更名。"
 
 geo.34.t:0 "第比利斯的示威者举行纪念斯大林活动"
 geo.34.d:0 "斯大林逝世三周年的日子即将来临，为了表示对伟大领袖的支持和苏联当局去斯大林政策的不满，格鲁吉亚的示威者在各地举行了纪念斯大林的活动，戈里四处悬挂起斯大林的画像，第比利斯也建立起了斯大林雕像，人们举起斯大林的肖像游行在鲁斯塔维里大街。"
 
 geo.35.t:0 "格鲁吉亚示威者邀请朱德元帅参加纪念斯大林"
 geo.35.d:0 "朱德同志正在苏联访问，在格鲁吉亚逗留时，巧合地遇到对赫鲁晓夫不满，依然支持斯大林的格鲁吉亚群众发起游行活动，纪念斯大林。格鲁吉亚群众代表来到朱德同志下榻的宾馆，邀请朱德参加他们的活动，以表达对捍卫斯大林同志名誉的支持。"
 
 geo.36.t:0 "朱德元帅访问格鲁吉亚的斯大林雕像"
 geo.36.d:0 "应格鲁吉亚示威者的邀请，正在第比利斯访问的中国共产党元帅朱德参加了在列宁广场举办的纪念斯大林的活动，并向示威者临时设立起来的斯大林雕像献花。面对记者的采访，朱德表示，斯大林同志是国际共产主义革命运动的伟大领袖和指导者，世界各国各族人民都将牢记斯大林同志的贡献。朱德的这一举动被认为是代表中共表达对格鲁吉亚示威者的同情和对赫鲁晓夫去斯大林政策的批评。"
 
 geo.37.t:0 "示威者要求苏共中央总辞职！"
 geo.37.d:0 "愤怒的格鲁吉亚示威者包围了第比利斯市政厅和列宁广场，要求推动去斯大林话的苏共高层立刻辞职！"
 
 geo.38.t:0 "布尔加宁与米高扬被迫辞职"
 geo.38.d:0 "面对格鲁吉亚示威者施加的压力，为了平息事端，米哈伊尔·布尔加宁和米高扬被迫在昨天举行的苏共中央会议上做出自我批评，并在保留党籍的情况下，辞去苏共中央委员的职务以暂避风头。"
 
 geo.39.t:0 "示威者要求恢复瓦西里·斯大林的名誉"
 geo.39.d:0 "在今天的集会中，示威者再一次提出了新的要求——在去斯大林化政策开展后，斯大林的长子瓦西里·约瑟夫维奇·斯大林不仅被剥夺了所有政治职位和名誉，甚至被打为反党分子遭到软禁。苏联政府如此对待身为二战英雄的斯大林之子，格鲁吉亚人民感到十分愤慨，他们要求立刻释放瓦西里，并回复他的名誉。"
 
 geo.40.t:0 "瓦西里·斯大林被释放"
 geo.40.d:0 "在格鲁吉亚示威者的压力下，被软禁的斯大林长子，瓦西里·斯大林被释放，同时苏联政治局宣布，恢复瓦西里被剥夺的苏联英雄称号，并承认他在第二次世界大战中英勇战斗作出的贡献。"
 
 geo.41.t:0 "格鲁吉亚的示威游行逐渐平息"
 geo.41.d:0 "随着苏联政府对格鲁吉亚的示威者不断让步，格鲁吉亚人的怒火也逐渐消散。最近几天，第比利斯街头的人群逐渐散去，示威活动逐渐平息，警察也开始解除对街道的封锁。格鲁吉亚示威给去斯大林运动踩下了刹车，布尔加宁和米高扬恢复工作后，越权跨过赫鲁晓夫，宣布中止批判斯大林的一系列活动。"
 
 geo.42.t:0 "格鲁吉亚开始出现分离主义分子"
 geo.42.d:0 "格鲁吉亚爆发的示威游行出现了需要高度警惕的情况！一些示威者开始高喊要求格鲁吉亚脱离苏联的口号，一些居心不良分子在派发反苏反俄传单，第比利斯的街头出现了旧格鲁吉亚共和国的三色国旗，甚至响起了旧共和国的国歌！这表明示威游行正在朝反苏活动发展，我们必须采取严厉的手段！"
 
 geo.43.t:0 "格鲁吉亚宣布宵禁！"
 geo.43.d:0 "苏联政府正式发表声明，格鲁吉亚爆发的政治运动，是一场受到帝国主义挑拨与支持的反苏反革命暴动！莫斯科已宣布格鲁吉亚全境戒严，武装部队已前往格鲁吉亚维持秩序。"
 
 geo.44.t:0 "第比利斯爆发流血冲突！"
 geo.44.d:0 "来自格鲁吉亚的紧急消息！苏联进入第比利斯后，与市民爆发了激烈的冲突！市民暴力抵抗苏联军队，而军方下令开火！数十名示威者在暴力冲突中伤亡，苏联政府血腥镇压了格鲁吉亚示威活动！"
 
 geo.45.t:0 "关注格鲁吉亚局势"
 
 geo.30.t:0 "格鲁吉亚爆发游行示威"