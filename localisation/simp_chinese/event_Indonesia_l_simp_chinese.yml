 ind.100.t:0 "万隆会议召开"

 ind.101.t:0 "[FROM.GetName]宣布参加万隆会议"
 ind.101.d:0 "[FROM.GetName]宣布，他们将派出代表团参与在印度尼西亚举办的亚非国际会议，以支持亚非拉各国反对殖民主义的民族解放斗争。"

 ind.102.t:0 "中华人民共和国宣布参加万隆会议"

 ind.103.t:0 "中国拒绝参加万隆会议"
 
 ind.104.t:0 "万隆会议的邀请"
 ind.104.d:0 "印度尼西亚总统[INS.GetLeader]邀请我国派遣代表团前往该国城市万隆，举行会议，讨论和支持国际反帝反殖民运动。"
 
 ind.105.t:0 "我们在万隆会议上的谈话"
 
 ind.106.t:0 "[FROM.GetName]在万隆会议上发表演讲"
 ind.106.d:0 "[FROM.GetName]的代表团在万隆会议上发表演讲宣称，第三世界国家不仅要面对帝国主义和殖民主义威胁，还要对抗共产主义威胁，并指责苏联和他的共产主义傀儡鬼正在世界各地支持共产党颠覆活动，呼吁第三世界团结起来对抗共产主义。"
 
 ind.107.t:0 "[FROM.GetName]在万隆会议上发表演讲"
 ind.107.d:0 "[FROM.GetName]的代表团在万隆会议上发表演讲宣称，第三世界国家应当抛弃意识形态带来的分歧，团结起来，合作对抗帝国主义。"
 
 ind.108.t:0 "我们在万隆会议的讲话"
 
 ind.109.t:0 "中国代表激烈抨击外交攻击"
 
 ind.110.t:0 "中国代表提出求同存异"
 
 ind.111.t:0 "尼赫鲁对菲律宾代表的评价"
 ind.111.d:0 "印度总理尼赫鲁对今日万隆会议上，以菲律宾代表为首的某些国家抨击苏联和社会主义阵营，制造矛盾的行为非常不满，面对记者提问，尼赫鲁评价道：菲律宾不就是美国老鹰尾巴上的一根毛嘛，还想当起亚洲雄鸡的鸡头来了？"
 
 ind.112.t:0 "万隆会议闭幕。"
