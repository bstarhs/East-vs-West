l_simp_chinese:
 ind.1.t:0 "荷兰向印尼发起军事行动！"
 ind.1.d:0 "荷兰殖民当局今日凌晨突然撕毁与印尼临时政府签订的停火协议，向爪哇岛和苏门答腊岛多个城市发动全面进攻。荷军装甲部队在飞机掩护下突破停火线，战火重燃令东南亚局势骤然紧张。\n本社记者在万隆目睹，荷军坦克碾过插有印尼红白旗的检查站，殖民军士兵用印尼语广播"恢复秩序"的通告。印尼游击队以燃烧路障和狙击战术还击，市中心邮局在交火中燃起大火。\n印尼临时政府发表紧急声明，谴责这是"殖民主义的最后疯狂"，呼吁联合国安理会立即介入。荷兰海牙方面则宣称行动是为"保护侨民安全"，但拒绝解释为何选择在停火监督小组轮换间隙发动进攻。\n国际红十字会证实，已有至少2000平民在首日冲突中流离失所。随着荷军舰队逼近三宝垄港，这场被称作"第一次警察行动"的殖民战争正全面升级。"
 ind.1.a:0 "消灭叛乱分子！"
 ind.1.b:0 "我们对印尼是统治很稳定，不需要战争。"

 ind.2.t:0 "海牙和平会议"
 ind.2.d:0 "对东印度群岛的战争已经引起了国内和国际舆论的声讨，联合国呼吁荷兰及印尼当局在海牙举行会谈，希望为印度尼西亚带来一个和平的未来。"

 ind.3.t:0 "独立印度尼西亚的领导人"
 ind.3.d:0 "印度尼西亚已经获得了自由，但国家领导人的问题还未尘埃落定。有人支持苏加诺继续担任总统，但也有人认为，随着印尼共势力的壮大，反共的穆罕默德·哈达更能对付他们。"
 ind.3.a:0 "不需要，苏加诺会领导我们的国家。"
 ind.3.b:0 "穆罕默德·哈达将会领导我们对付赤色分子。"

 ind.7.t:0 "日渐壮大的共产党势力"

 ind.8.t:0 "马古鲁群岛分离主义势力壮大！"

 ind.9.t:0 "穆斯林保守势力崛起"

 ind.15.t:0 "政变发生！"
 ind.15.d:0 "一支来自雅加达空军基地的士兵袭击了总统府！他们宣称共产党正在渗透我们的国家，威胁苏加诺总统，要求政府立即采取反共政策！"
 ind.15.a:0 "不需要，苏加诺会领导我们的国家。"

 ind.16.t:0 "穆斯林要求建立伊斯兰国家"

 ind.17.t:0 "西巴布亚宣布独立"
 ind.17.d:0 "在经历了荷兰人数百年的统治后，西巴布亚宣布独立建国，但印度尼西亚将西巴布亚视作其领土的一部分，因此这可能会导致新的地区不稳定因素出现。"

 ind.18.t:0 "西巴布亚宣布独立"
 ind.18.d:0 "在荷兰人的操作下，西巴布亚地区宣布独立并建立了政府，但我们的民族主义者认为，该地区应当被并入我国领土，现在我们必须做出决定，是采取军事行动将西巴布亚收入囊中，还是让其宣告独立。"

 ind.19.t:0 "印尼入侵西巴布亚！"
 ind.19.d:0 "再西巴布亚宣布独立后不久，印度尼西亚政府立刻宣布该地区的独立建国为非法，他们应该作为印度尼西亚共和国的一部分回到雅加达的统治之下。印尼军队已经开始行动，一场战争已不可避免。"

 ind.20.t:0 "帝汶宣布独立"
 ind.20.d:0 "在经历了葡萄牙人数百年的统治后，帝汶宣布独立建国，但印度尼西亚将帝汶视作其领土的一部分，因此这可能会导致新的地区不稳定因素出现。"

 ind.21.t:0 "帝汶宣布独立"
 ind.21.d:0 "在葡萄牙人的操作下，东帝汶地区宣布独立并建立了政府，但我们的民族主义者认为，该地区应当被并入我国领土，现在我们必须做出决定，是采取军事行动将东帝汶收入囊中，还是让其宣告独立。"

 ind.22.t:0 "印尼入侵帝汶！"
 ind.22.d:0 "再帝汶宣布独立后不久，印度尼西亚政府立刻宣布该地区的独立建国为非法，他们应该作为印度尼西亚共和国的一部分回到雅加达的统治之下。印尼军队已经开始行动，一场战争已不可避免。"

 ind.23.t:0 "[ROOT.GetName]谴责印尼对东帝汶的入侵！"
 ind.23.d:0 "[ROOT.GetName]政府强烈谴责印度尼西亚对东帝汶的侵略，并呼吁印尼立刻撤军！"

 ind.24.t:0 "[ROOT.GetName]承认印尼队东帝汶的占领"

 ind.30.t:0 "荷兰宣布警卫战争结束"
 ind.30.d:0 "随着荷兰军队占领东印度群岛的大部分地区，印度尼西亚共和国临时政府瓦解，印尼共和派被迫转入地下斗争。荷兰军队宣布他们已经收回了东印度群岛的领土，但小规模的抵抗斗争依然在继续。"

 ind.31.t:0 "[ROOT.GetName]成立"
 ind.31.d:0 "[ROOT.GetName]宣告成立，这是一个荷兰控制下的傀儡政权。"

 ind.32.t:0 "联合国就印尼停火问题举行投票！"
 ind.32.d:0 "荷兰在印尼的军事行动引起了国际社会的关注，联合国强烈谴责荷兰镇压殖民地运动的行为，并决定就印尼局势和停火谈判进行投票表决。"

 ind.33.t:0 "印尼停火投票通过！"
 ind.33.d:0 "经过表决，印尼战事的停火决议得到通过，联合国正式要求荷兰宣布印尼地区停火并开始谈判。"

 ind.34.t:0 "印尼停火投票未通过！"
 ind.34.d:0 "经过表决，印尼战事的停火决议未能获得多数通过。"

 ind.35.t:0 "荷兰政府接受停火协议！"
 ind.35.d:0 "荷兰政府宣布，接受联合国提出的在印度尼西亚进行停火的决议。"

 ind.36.t:0 "荷兰与印尼签署《伦维尔协议》"

 ind.37.t:0 "荷兰政府拒绝停火协议！"
 ind.37.d:0 "荷兰政府宣布，他们拒绝联合国提出的在印度尼西亚进行停火的决议。荷兰政府表示，他们在东印度群岛已经经营了数百年，对该地区的大部分资产享有主权，他们将继续采取军事行动予以保护。"

 ind.38.t:0 "军事政变！"
 ind.38.d:0 "突发情况！一批武装部队突然袭击了雅加达、日惹等重要城市，试图夺取政权！他们中的大部分人都曾是独立战争时期为荷兰服务的前军人！"

 ind.39.t:0 "印尼爆发军事政变！"
 ind.39.d:0 "一批武装部队突然袭击了雅加达、日惹等重要城市，试图夺取政权！他们中的大部分人都曾是独立战争时期为荷兰服务的前军人。印尼政府迅速采取措施，镇压了叛乱。"

 ind.40.t:0 "印度尼西亚联邦临时政府成立！"
 ind.40.d:0 "一批武装部队突然袭击了雅加达、日惹等重要城市，试图夺取政权！他们中的大部分人都曾是独立战争时期为荷兰服务的前军人。叛军很快夺取了政权，并宣布成立印度尼西亚联邦临时政府，以坤甸苏丹哈米德二世为临时国家元首。"

 ind.41.t:0 "印尼内战的爆发！"

 ind.42.t:0 "坤甸的自治地位被取消！"
 ind.42.d:0 "在亲荷兰政变被瓦解后，坤甸苏丹哈米德二世被软禁，其被剥夺苏丹地位，坤甸苏丹国也被取消自治地位，并入印度尼西亚中央政府控制之下。"

