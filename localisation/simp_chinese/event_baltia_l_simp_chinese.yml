l_simp_chinese:
 lle.1.t:0 "立陶宛爆发暴动！"
 lle.1.d:0 "随着动荡与不安席卷全国，立陶宛也爆发了要求独立的武装暴动！暴动者掠夺军火，占据了维尔纽斯和考纳斯的政府要地，并对我们的驻军展开攻击！"
 
 lle.2.t:0 "拉脱维亚爆发暴动！"
 lle.2.d:0 "随着动荡与不安席卷全国，拉脱维亚也爆发了要求独立的武装暴动！暴动者掠夺军火，占据了里加的政府要地，并对我们的驻军展开攻击！"
 
 lle.3.t:0 "爱沙尼亚爆发暴动！"
 lle.3.d:0 "随着动荡与不安席卷全国，爱沙尼亚也爆发了要求独立的武装暴动！暴动者掠夺军火，占据了塔林的政府要地，并对我们的驻军展开攻击！"
 
 lle.4.t:0 "The Baltic way movemnt"
 lle.4.d:0 "An unprecedented demonstration broke out in the Baltic region under Soviet rule. In order to commemorate the 50th anniversary of the Soviet Union's annexation of the three Baltic countries, the people of Lithuania, Latvia, and Estonia launched a large-scale movement, forming a team spanning thousands of kilometers."
 
 lle.5.t:0 "波罗的海爆发暴动！"
 lle.5.d:0 "随着动荡与不安席卷全国，波罗的海也爆发了要求独立的暴动！示威者占据了维尔纽斯和考纳斯的政府要地和广播电台，并同我们的驻军对峙，波罗的海三国的最高苏维埃也决定就独立展开投票。"
 
 lle.6.t:0 "波罗的海独立战争爆发！"
 lle.6.d:0 "随着苏联军队进入维尔纽斯，并与武装的示威者激烈交火，全面的波罗的海独立战争爆发！立陶宛、拉脱维亚和爱沙尼亚的独立主义者发起暴动，组织武装部队，抵抗苏联军队。"
 
 lle.7.t:0 "苏联军队撤离波罗的海！"
 lle.7.d:0 "在与波罗的海的民族主义者对峙之后，莫斯科迫于政治压力，不得不撤离在波罗的海的全部军队，同时波罗的海的所有政府机构也都脱离莫斯科控制。至此，立陶宛、拉脱维亚和爱沙尼亚摆脱长达四十多年的苏联统治，取得事实上的独立。"