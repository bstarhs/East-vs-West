l_simp_chinese:
 europe.1.t:0 "Change of Goverment"
 europe.1.d:0 "在经历了日本殖民者残暴的法西斯统治后，韩国人民终于迎来了自由。大韩民国政府领导人李承晚在汉城宣布了大韩民国在美国占领区正式建立，标志着韩半岛的新时期来临了。半岛北方，仍然处于苏联的控制下。"
 europe.1.a:0 "大韩独立万岁！"
 
 europe.2.t:0 "红色旅暴动！"
 europe.2.d:0 "一些不明身份的人拿着枪和手榴弹袭击了警察车队。他们突然开枪，杀死了司机，并绑架了人质。国防部长宣布这是一次恐怖袭击，一个叫“红色旅”的组织宣布发动这次袭击，以摧毁帝国主义、资本主义和美国傀儡。"
 europe.2.a:0 "How Terror！"