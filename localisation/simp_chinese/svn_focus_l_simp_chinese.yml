l_simp_chinese:
 SVN_land_to_tillers:0 "耕者有其田"
 SVN_land_to_tillers:0 "镇压和好教"
 SVN_land_to_tillers:0 "废除1956年选举"
 
 SVN_thanh_nu_cong_hoa:0 "共和青年运动"
 SVN_female_reform:0 "妇女改革"
 SVN_female_reform_desc:0 "数千年以来，封建陋习给我们广大妇女同胞带来了沉重的苦难，解放妇女，不仅是社会主义国家实现民主和平等的要求，而且是解放生产力，鼓励妇女参与工作的重要一步。"
 SVN_lien_doi_phu_nu:0 "越南妇女团结运动"
 
 SVN_Phu_Tinh_Bao:0 "越南中央情报局"
 SVN_Phu_Tinh_Bao_desc:0 "一些红色分子和反政府武装正在转向地下秘密活动。为了铲除他们，我们需要成立一个专门的部门来调查、监督、逮捕和消灭他们。"
 
 SVN_supress_binh_xuyen:0 "镇压平川派"
 SVN_hold_situation:0 "稳定局势"
 SVN_hold_situation_desc:0 "二战结束后的越南处于一片混乱之中，越共分子占领农村发起叛乱，法国殖民者再次派出武装部队夺取越南南方，民间的反法、反共等各种示威游行政治活动层出不穷，我们应该先将社会秩序稳定下来，并建立一个能运转的政府，以进行下一步行动。"
 SVN_keep_france_relation:0 "保持与法国关系"
 SVN_keep_france_relation_desc:0 "自从1881年不平等的《顺化条约》签订以来，越南已经被法国统治了六十多年，越南人民的反殖民独立情绪很高涨……然而，时代发生了变化，比起法国人，共产主义分子的威胁更大更可怕，中共和俄国支持的共产党叛军正在越南北方肆虐，破坏越南的传统、社会和生活方式，共产共妻，我们应该考虑，放缓越南的独立进程，优先考虑争取法国人支持我们对抗共产主义。"
 SVN_keep_laos_relation:0 "改善与老挝关系"
 SVN_keep_laos_relation_desc:0 "我们应该争取与老挝改善关系，合作对抗共产党威胁。"
 SVN_keep_kam_relation:0 "改善与柬埔寨关系"
 SVN_keep_kam_relation_desc:0 "我们应该争取与柬埔寨改善关系，合作对抗共产党威胁，尽管两国在领土问题上有很大矛盾。"
 SVN_france_alliance:0 "巩固法兰西联盟"
 SVN_france_alliance_desc:0 "越南、老挝和柬埔寨应该在法兰西联盟的框架下团结起来，一同对抗共产主义威胁。"
 SVN_french_military_assis:0 "法国的军事支援"
 SVN_french_military_assis_desc:0 "我们可以请求法国政府为我们提供军事援助，包括援助军事装备和军事顾问。"
 SVN_french_economic_assis:0 "法国的经济支援"
 SVN_french_economic_assis_desc:0 "我们可以请求法国政府向我们派遣技术顾问，帮助我国科技发展和工业建设。"
 SVN_french_christian:0 "扩大基督教影响力"
 SVN_french_christian_desc:0 "越南是东南亚最早接受天主教的地区之一，法国殖民统治时期，将天主教推广到了越南的社会上层，因此如果要争取这些社会精英的支持，我们需要对天主教会释放出和善的态度。"
 SVN_annex_tonkin:0 "合并交趾地区"
 SVN_annex_tonkin_desc:0 "法国人将越南分成了三部分，由法属印度支那统治的南方和法属东京统治的北部交趾地区，我们需要说服法国人把北方地区并入西贡政府的统治，以实现南北越南统一。"
 SVN_christian_refugee:0 "吸引天主教难民"
 SVN_christian_refugee_desc:0 "天主教自十八世纪传入越南以来，尤其是法国殖民统治时期，就在越南发展出了较大的影响力，有数十万信众，在这个遥远的东方国家建立了庞大的群众基础。越南共产党通知北方之后，许多不堪受共产主义暴政的教友希望逃离北方，前往南方投奔自由。我们应该帮助他们逃亡南方，即可以破坏北方共产党政府的统治基础，揭露共产党暴政真面目，也可以将天主教徒中的中产阶级、企业家和技术人员吸引到南方，为西贡政府工作。"
 SVN_hoi_yen_district:0 "海燕自卫队"
 
 SVN_clear_french:0 "铲除法国影响力"
 SVN_clear_french_desc:0 "自从1881年不平等的《顺化条约》签订以来，越南已经被法国统治了六十多年，越南人民的反殖民独立情绪很高涨……但是经历第二次世界大战的冲击，法国人对印度支那的控制大大削弱，趁着法国人内忧外患，现在是把殖民者赶出越南的最佳时候！独立越南万岁！"
 SVN_relation_roc:0 "交好中华民国"
 SVN_relation_roc_desc:0 "我们应该争取与中国国民党政府改善关系，以共同对抗共产党和法国人，保卫自由亚洲。"
 SVN_asia_free_alliance:0 "亚洲人民反共同盟"
 SVN_asia_free_alliance_desc:0 "我们应该与亚洲所有自由国家团结起来，进行军事和经济上的合作，对抗共产党的威胁。"
 SVN_relation_kor:0 "交好南韩"
 SVN_relation_kor_desc:0 "我们应该争取与大韩民国政府改善关系，以共同对抗共产党，保卫自由亚洲。"
 SVN_relation_thailand:0 "交好泰国"
 SVN_relation_thailand_desc:0 "我们应该争取与泰国政府改善关系，以共同对抗共产党，保卫自由亚洲，尽管两国有很深的历史矛盾。"
 SVN_seat:0 "东南亚条约组织"
 SVN_seat_desc:0 "东南亚各个自由国家将开展进一步的军事合作。"
 SVN_relation_jap:0 "交好日本"
 SVN_relation_jap_desc:0 "我们应该争取与日本政府改善关系，以共同对抗共产党，保卫自由亚洲。"
 SVN_relation_laos:0 "交好老挝皇室政府"
 SVN_relation_laos_desc:0 "我们应该争取与老挝政府改善关系，以共同对抗共产党，保卫自由亚洲。"
 SVN_inflect_laos:0 "渗透老挝"
 SVN_inflect_laos_desc:0 "老挝政府内的亲共分子越来越多，影响力越来越大，如果老挝落入共产党手中，将对整个东南亚带来严重赤化威胁，因此我们也要资助老挝政府内的右翼势力，支持他们对抗共产党。"
 SVN_inflect_cam:0 "渗透柬埔寨"
 SVN_inflect_cam_desc:0 "柬埔寨政府内的亲共分子越来越多，影响力越来越大，如果柬埔寨落入共产党手中，将对整个东南亚带来严重赤化威胁，因此我们也要资助柬埔寨政府内的右翼势力，支持他们对抗共产党。"
 SVN_relation_cam:0 "交好柬埔寨"
 SVN_relation_cam_desc:0 "我们应该争取与柬埔寨政府改善关系，以共同对抗共产党，保卫自由亚洲。"
 SVN_relation_guangxi:0 "交好广西军阀"
 SVN_relation_guangxi_desc:0 "南京政府对广西省的控制十分脆弱，广西当地的政府计划自立门户，我们应当争取他们的支持，合作对抗越南北部的共产主义叛军。"
 
 SVN_baodai_back:0 "支持保大执政"
 SVN_baodai_back_desc:0 "阮氏王朝统治了越南一百多年，最后一位皇帝，保大帝阮福典在二战后被迫流亡，现在越南局势一片混乱，各种政治势力争权夺利，也许我们应当将保大帝请回越南，主持大局，以稳定局势。"
 SVN_nguyen_dynasty:0 "保大皇帝的回归"
 SVN_nguyen_dynasty_desc:0 "共和制度不适合越南，为了民族的生存、政治的稳定和国家的存续，我们应当让阮氏王朝继续领导越南人民。"
 SVN_empire:0 "大南帝国"
 SVN_empire_desc:0 "越南在阮氏君主的领导下重归和平与稳定，现在是时候让我们的国家回到一百多年前，嘉隆皇帝和明命皇帝统治时代的疆土！"
 SVN_emperor_rules:0 "二元君主制"
 SVN_emperor_rules_desc:0 "我国还不具备过渡到完全的君主立宪民主制度的条件，皇帝必须保留一定的权力，包括解散议会和任命首相，以确保政府的稳定。"
 SVN_monarch_constitue:0 "君主立宪制"
 SVN_monarch_constitue_desc:0 "随着国家的现代化进程取得成功，政治现代化也将提上议程。君主至高无上的地位应当走入历史了，我们即将实行立宪制改革，扩大议会和内阁的权力。"
 SVN_royal_cabinet:0 "皇族内阁"
 SVN_confusious:0 "推崇儒家思想"
 SVN_confusious_desc:0 "君为臣纲，父为子纲，夫为妻纲，忠孝、仁义、君君臣臣，父父子子……"
 SVN_buddha:0 "推崇佛教"
 SVN_buddha_desc:0 "推崇佛教"
 SVN_parliament_power:0 "扩大议会权力"
 SVN_monarchist_law:0 "冒犯君主法"
 SVN_monarchist_law_desc:0 "以下犯上，当杀无赦。"
 SVN_hue_capital:0 "还都顺化"
 SVN_hue_capital_desc:0 "顺化古城，为阮氏家族龙兴之地，后法国殖民时代，强制将越南的政治中心迁到西贡，现阮氏复兴，当还与旧都。"
 
 SVN_hoahao_focus:0 "交好和好教"
 SVN_hoahao_focus_desc:0 "和好教是流行于越南的新兴宗教，它由越南医师黄富楚基于佛教创立，主张节俭和重视农业，在越南中部的底层人民很有影响力。"
 SVN_buddha_focus:0 "交好佛教"
 SVN_buddha_focus_desc:0 "佛教在越南很有影响力，尤其是底层群众，提高佛教团体的地位有利于我们争取民众的支持。"
 SVN_chatolics_support:0 "支持天主教"
 SVN_chatolics_support_desc:0 "作为法国曾经的殖民地，天主教在越南南方很有影响力，尤其是中产和精英阶层，提高佛教团体的地位有利于我们争取民众的支持。"
 
 SVN_crownland:0 "建立皇朝疆土"
 SVN_crownland_desc:0 "皇朝疆土的字面意思是皇帝的直属土地，法国当局将其控制的越南少数民族地区划给阮朝君主以试图缓解少数民族的不满。"
 SVN_taygngyuen_autonomy:0 "山地民族自治权"
 SVN_taygngyuen_autonomy_desc:0 "越南西部的高原地区存在许多的少数民族，例如占族人和高棉人，他们一直在追求拜托越南中央政府的控制获得独立。"
 
 SVN_quocdandang:0 "支持越南国民党"
 SVN_quocdandang_desc:0 "越南国民党是越南最早的反法独立团体之一，模仿中国国民党成立并积极参与了独立运动。越南国民党与胡志明的同盟在二战结束后破裂，大部分人向南前往西贡。"
 SVN_democratic_election:0 "推动民主选举"
 SVN_democratic_election_desc:0 "大选将给予越南人民第一次真正选举出一个民选、民有、民享的政府的权力。"
 SVN_free_democratic:0 "自由与民主"
 SVN_free_democratic_desc:0 "自由世界在世界大战中的胜利证明了独裁者压迫人民的制度已被人类所抛弃。建立民选的、以人为本的、以人为本的政府，保障人民的自由、民主和监督，保障人民选择政府的权利不受侵犯，是未来世界的主流。"
 SVN_free_constitution:0 "颁布新宪法"
 
 SVN_militarist_gov:0 "军事政府"
 SVN_militarist_gov_desc:0 "所谓政党民主，无非是愚蠢贪婪的政客在议会里结成派系，为自己的利益斗争，使我们的政府腐败无能。而红色分子正试图获得工农的支持，威胁我国的安全。现在唯一的出路就是推翻腐败的政治，建立强大的军事政权，让唯一能够保护国家利益的军队掌控国家。"
 
 SVN_republic:0 "越南共和国"
 SVN_republic_desc:0 "法国人离开了越南，留下了一个畸形的越南国。末代皇帝保大担任没有实权的国家元首，共产党占据了北方领土，西贡被各种军阀、财阀和犯罪集团控制，这样的一个越南怎么能算自由解放的越南呢？必须尽快对政治体制进行全面改变，建立一个中央政府控制下，团结而稳定的越南共和国！\n公民们！国家即将得解放！\n同心共牺牲，何须惜身膛！\n为将来国民，共冲进硝烟\n让江山永固，安定又富康！"
 SVN_president_ngo:0 "吴廷琰总统"
 SVN_president_ngo_desc:0 "我们，非共产主义者，今天必须领导的斗争，首先是反对混乱、无纪律、自私的斗争，是为了一个珍视自由的越南的荣誉，是为了数百万遭受战争苦难的同胞的安全和福祉，是为了同一种族的人之间的兄弟情谊，也就是所谓的祖国。\n——吴廷琰"
 SVN_can_lao_party:0 "勤劳为民党"
 SVN_can_lao_party_desc:0 "共产党用政治渗透越南，我们需要用政治与之对抗。吴廷琰总统提出了“勤劳、革命、人格”的口号，并基于这一口号成立了勤劳党，从而实现一党治国，将混乱的越南意识形态统一起来，建立政治上对抗共产主义和其他政治对手的基础。"
 SVN_social_theory_law:0 "社会道德法"
 SVN_social_theory_law_desc:0 "作为保守的天主教徒，吴廷琰总统希望将越南社会改造成忠于天主教价值观的社会，用天主教的意识形态团结越南的社会精英和中产阶级，同时以此争取西方世界的支持。吴总统相信，忠于上帝、祖国、家庭的口号在亚洲同样适用。"
 SVN_ngo_family:0 "吴氏家族的统治"
 SVN_ngo_family_desc:0 "吴廷琰总统取得了越南共和国的最高统治权，并希望他的四个弟弟和弟妹也在政府高层中贡献力量。"
 
 SVN_supress_buddhism:0 "镇压佛教"
 SVN_supress_commie:0 "镇压共产党"
 SVN_supress_commie_desc:0 "共产党是中共与苏俄入侵东南亚的傀儡，他们虚假的承诺会欺骗人民，把我们的国家和民族带入无尽的深渊！反共产主义以及成为自由越南的第一要务！必须对他们进行严厉的镇压！"
 SVN_freeway:0 "自由之路行动"
 SVN_freeway_desc:0 "自由之路行动"
 SVN_technical_refugee:0 "吸引技术移民"
 SVN_supress_corropt:0 "打击贪污腐败"
 SVN_supress_corropt_desc:0 "腐败分子窃取国家财产，浪费国家资金，破坏社会稳定、经济发展和群众对政府的信任，必须严厉惩处。"
 SVN_supress_militarist:0 "限制军人权力"
 
 SVN_economic:0 "推动经济建设"
 SVN_economic_desc:0 "亚洲人民渴望减少巨大的技术落后。他们呼吁迅速和立即的经济发展，这是民主政治独立的唯一坚实基础。\n——吴廷琰"
 SVN_rural_construct:0 "农村建设"
 SVN_social_reform:0 "社会改革"
 SVN_social_reform_desc:0 "许多落后的文化和生活习惯依然影响着我们的国家，例如男女的不平等和等级制度，如果我国想要成为一个现代国家，就必须将这些落后文化清除。"
 SVN_dong:0 "发行越南盾"
 SVN_dong_desc:0 "经历了战争的越南经济十分混乱，法国人留下的印度支那法郎虽然流通，但依然有许多地区还处在以物易物的原始状态下，政府需要尽快发行自己的货币并使其推广，才能有效建立起政府对经济的管理。"
 SVN_infrastruct:0 "修建基础设施"
 SVN_electro_construct:0 "修建电力设施"
 SVN_civil_indus_1:0 "发展民用工业 I"
 PER_civil_indus_1_desc:0 "在具备初步工业能力后，我们需要满足我们人民对生活消费品的需求。从纺织、食品、木制品和锅碗瓢盆开始。"
 SVN_civil_indus_2:0 "发展民用工业 II"
 PER_civil_indus_2_desc:0 "在具备进一步工业能力后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 SVN_civil_indus_3:0 "发展民用工业 III"
 PER_civil_indus_3_desc:0 "在具备较为完善的工业能力后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 SVN_landreform:0 "土地改革"
 SVN_landreform_desc:0 "在农业社会工业化的过程中，在旧时代等同于权力、地位和财富的土地必须被彻底地流动起来。无论是以商品化改革的形式，还是以公有化改革的形式，一切以土地为核心的旧社会阶层都要被新的商品经济完全地消灭，其财产成为投资的资本，农民人口成为工人预备队。如此是为土地改革的最终目的。"
 SVN_agriculture:0 "发展农业"
 SVN_agriculture_desc:0 "改善农业生产，不仅需要合理的土地制度，且需要先进的农业技术。水利、农药、化肥、配种和机械化，这些都是农业现代化不可缺少的。"
 SVN_refugee_settlement:0 "难民再安置计划"
 SVN_refugee_settlement_desc:0 "大量从北方逃亡而来的同胞需要安置，需要住房、就业和产业，我们可以将他们安置到内陆地区的未开发土地，由政府提供资金和设备，帮助他们开发内陆地区。"
 SVN_dinh_dien:0 "营田计划"
 SVN_dinh_dien_desc:0 "我们将难民安置到内陆地区进行开发的政策取得了初步成功，营田计划将进一步完善相关政策，正式授予这些居民在已开发地区的地产、户籍和企业许可证，引导他们发展更进一步的农业和轻工业产业。"
 SVN_dinh_dien_tool:0 "提高难民再安置计划的成功率"
 SVN_plastic:0 "发展化工业"
 SVN_plastic_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 SVN_steel:0 "发展炼钢业"
 SVN_steel_desc:0 "以质量计算,铁是地球上最常见的元素,它加热后有很好的延展性…并且非常有用。铁始于公元前3500年左右,在埃及的盖尔扎赫被发掘出来铁对早期文明所需的各式东西都非常有用:如,蒸煮罐、小五金、工具,以及用来刺伤他人的尖锐武器。"
 SVN_electronic:0 "发展电子业"
 SVN_electronic_desc:0 "电子产业是20世纪后半叶最重要的高新技术产业，小小的晶体管不仅可以制造出先进的电子产品，也是走向发达国家的门槛。"
 SVN_high_tech:0 "发展高新产业"
 SVN_high_tech_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一。随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。"
 SVN_plantation:0 "投资经济作物 I"
 SVN_plantation_desc:0 "越南的气候温热潮湿，领土多山地，十分适合开垦并发展经济作物种植，在以前，越南就以水果种植业闻名，近代法国人又引入了咖啡和橡胶种植。如果能够进一步投资和发展经济作物种植业，可以给我国带来丰富的附加值产业。"
 SVN_plantation_rubber:0 "扩大橡胶种植"
 SVN_plantation_rubber_desc:0 "越南的自然气候十分适合种植橡胶，如果我们扩大橡胶的生产，不仅可以自给自足，还可以出口创汇。"
 SVN_plantation2:0 "投资经济作物 II"
 SVN_plantation2r_desc:0 "我们可以进一步扩大我们的经济作物产业，改良土地政策和种植技术，引进水利、农药、化肥、配种和机械化，以扩大产量和质量，在国际市场上取得优势。"
 SVN_plantation3:0 "投资经济作物 III"
 
 SVN_foreign_invest:0 "吸引国外投资者"
 SVN_foreign_invest_desc:0 "内战宣告结束，随着越南的社会稳定、经济得到发展以及外交地位的加强，一些外国投资者希望进入我国市场投资。"
 SVN_saigon_port:0 "建设西贡港"
 SVN_saigon_port_desc:0 "西贡位于湄公河出海口，无论是内河航运还是对外海运，都十分适合建设为重要的海运港口。"
 SVN_danang_port:0 "建设岘港"
 SVN_danang_port_desc:0 "岘港位于越南正中央，一个位置优越的海岸地区，十分适合建设为重要的海运港口。"
 SVN_Commercial_Import_Program:0 "商品进口计划"
 SVN_Commercial_Import_Program_desc:0 "商品进口计划是越南政府与美国政府达成的一项贸易协定。将美元注入南越政府国库。选定的商人可以获得进口许可证，允许他们以远低于市场价的汇率用南越货币购买美元。进口商随后用美元购买美国商品，而西贡政府则将商人支付的南越货币保留下来，用于资助军队和公共服务。该机制的目的是通过实物商品以间接的方式向经济注入大量资金，从而避免通货膨胀。"
 SVN_bienhoa:0 "边和工业区"
 SVN_bienhoa_desc:0 "边和贴近西贡，有优质的工业基础、外贸港口和人力资源，如果在这里设置经济特区，可以通过吸引南朝鲜投资，发展出口加工制造业，为未来的经济发展赚取第一桶金。"
 SVN_education:0 "发展教育"
 SVN_education_desc:0 "二战前发展的教育产业已经日渐不能满足我国经济和社会对产业人才的需求，我们必须用行政手段加紧在全国范围内普及公立的、国际化的科教体系。"
 SVN_medic:0 "发展医疗"
 SVN_medic_desc:0 "公共医疗产业的发展是影响一国人口结构和劳工质量的重要因素。如何能维护国民健康，也自古以来是一个政权成功与否的重要指标。"
 SVN_infra:0 "建设公路"
 SVN_infra_desc:0 "完善的基础设施是沟通全国各地，发展经济并建立稳固政权的前提。"
 
 
 SVN_quocquan:0 "越南国军"
 SVN_quocquan_desc:0 "新生的越南需要一支强大的武装部队来保护自己，对抗共产党和其他入侵者的威胁。"
 
 SVN_supress_minor:0 "镇压山地民族"
 SVN_supress_minor_desc:0 "自从越南的领土扩大到湄公河出海口，这里的少数民族，例如占族人和高棉人，他们的暴动就一直没有停过，必须对他们出重拳！"
 SVN_strategic_vally:0 "设置战略村"
 SVN_strategic_vally_desc:0 "共产党一直在渗透农村地区，试图煽动叛乱，为了切断越共与农村居民的联系，我们必须将所有居民强制迁移到国军控制和保护下的村庄中，并在政府监视下工作和生活，避免他们与越共分子接触。"
 SVN_emergency:0 "戒严令"
 SVN_emergency_desc:0 "国家已遭到共产主义分子的渗透和入侵，全国都处于极度危险的状态，我们需要发布全国戒严令，在全国范围内建立军事管制，并授权军警对抗共产主义渗透和破坏活动的一切权力。国家危亡，只有强硬的铁腕才能挽救我们的国家。"
 
 SVN_american_assistance:0 "请求美国援助"
 SVN_american_assistance_desc:0 "通过西方工业国家提供的援助来维护自由民主的努力发挥了至关重要的作用。为了人类的荣誉，美国为此做出了最重要的贡献\n——吴廷琰"
 
 SVN_militarist_indus_1:0 "发展军用工业 I"
 SVN_militarist_indus_1_desc:0 "现有军工规模已经不能满足国防方面的基本需求。"
 SVN_militarist_indus_2:0 "发展军用工业 II"
 SVN_militarist_indus_2_desc:0 "二战后国际格局瞬息万变，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 SVN_militarist_indus_3:0 "发展军用工业 III"
 SVN_militarist_indus_3_desc:0 "新时代的武器装备更复杂、多样化且昂贵，唯有进一步扩张我国的军工复能力，才能腾出足以敷用的产能奋起直追。"
 
 SVN_police:0 "国家警察"
 SVN_police_desc:0 "越南共和国建立之初，首要任务便是稳定秩序，我们需要完善的治安警察队伍来维护社会稳定，帮助重建秩序，打击犯罪，清剿破坏法律和人民利益的犯罪集团，并镇压试图破坏新政权的犯罪集团和越共分子。"
 
 SVN_nacy:0 "建立海军"
 SVN_nacy_desc:0 "越南是一个具有海洋传统的国家，面对着浩瀚的东海，我们需要一支强大的海军保护我们的海洋遗产。"
 SVN_expand_navalbase:0 "扩大军港"
 SVN_expand_navalbase_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 SVN_marines:0 "海军陆战队"
 SVN_marines_desc:0 "擅长两栖作战的部队越来越不可或缺。我方海军陆战兵现在已接受相关训练并拥有专属登陆舰船支持。"
 SVN_coast_defence:0 "海岸防御"
 SVN_coast_defence_desc:0 "我们需要加强海上军事设施以对抗可能来自海上的入侵。"
 SVN_saigon_base:0 "扩大西贡基地"
 SVN_saigon_base_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 SVN_hoian_base:0 "扩大会安基地"
 SVN_hoian_base_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 SVN_buy_ship:0 "购买军舰"
 SVN_buy_ship_desc:0 "我们目前还没有建造舰船的能力，但我们可以向其他国家购买退役的舰艇。"
 SVN_light_ships:0 "发展轻型舰艇"
 SVN_light_ships_desc:0 "我们的海军刚刚起步，至少需要一些护卫舰和驱逐舰来保护我们的领海。"
 SVN_medium_ships:0 "发展中型舰艇"
 SVN_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 SVN_buy_submarines:0 "购买潜艇"
 SVN_buy_submarines_desc:0 "我们目前还没有建造潜艇的能力，但我们可以向其他国家购买退役的潜艇。"
 SVN_submarines:0 "发展潜艇"
 SVN_submarines_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 SVN_take_northisland:0 "夺取黄沙群岛"
 SVN_take_northisland_desc:0 "黄沙群岛一直是越南的海上领土和重要的海洋遗产，但中国军队占据了他，现在我们将夺回我们的岛屿！"
 SVN_take_southisland:0 "夺取长沙群岛"
 SVN_take_southisland_desc:0 "长沙群岛一直是越南的海上领土和重要的海洋遗产，但中国军队占据了他，现在我们将夺回我们的岛屿！"
 SVN_defence_island:0 "巩固群岛防御"
 SVN_defence_island_desc:0 "我们需要尽快在南海群岛上建立军事设施以保护他们！"
 
 SVN_airforce:0 "建立空军"
 SVN_airforce_desc:0 "空军在1912年的意大利-土耳其战争后被世界各国视作陆海之后的第三大军种，战斗机和轰炸机咆哮着称霸了两次世界大战期间的天空。二战向世界各国展示了空中武装的作用和重要性，他们可以作战、可以运输、可以侦察，可以破坏敌人后方……总之，一支合格的空军是一支现代军队必不可少的，至少我们要保证我们头上的飞机不是敌人的。"
 SVN_avalions:0 "陆军航空兵"
 SVN_helicop:0 "空中机动"
 SVN_buy_planes:0 "购买战斗机"
 SVN_buy_planes_desc:0 "我们目前没有自行生产战斗机的能力，但我们可以向友好国家购买现成的战斗机来建立我们的空军。"
 SVN_research_fighters:0 "研制战斗机"
 SVN_airbase:0 "扩大空军基地"
 SVN_develop_jet1:0 "发展战斗机"
 SVN_develop_jet1_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 SVN_develop_jet2:0 "发展现代战斗机"
 SVN_develop_jet2_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 SVN_develop_transport:0 "发展运输机"
 SVN_develop_transport_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 SVN_develop_bomber:0 "发展轰炸机"
 SVN_develop_bomber_desc: "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 
 SVN_ROK_forces:0 "邀请韩国派兵"
 SVN_ROK_forces_desc:0 "对抗越南共产党及其中共支持者侵略的战争，是保卫亚洲自由国家最关键的一场战争，我们希望得到我们的盟国大韩民国的支持，邀请他们派出武装部队协助我们对抗越共叛军。"
 SVN_ROc_forces:0 "邀请中华民国派兵"
 SVN_ROc_forces_desc:0 "对抗越南共产党及其中共支持者侵略的战争，是保卫亚洲自由国家最关键的一场战争，我们希望得到我们的盟国中华民国的支持，邀请他们派出武装部队协助我们对抗越共叛军。"
 SVN_PHI_forces:0 "邀请菲律宾派兵"
 SVN_PHI_forces_desc:0 "对抗越南共产党及其中共支持者侵略的战争，是保卫亚洲自由国家最关键的一场战争，我们希望得到我们的盟国菲律宾的支持，邀请他们派出武装部队协助我们对抗越共叛军。"
 SVN_AST_forces:0 "邀请澳洲派兵"
 SVN_AST_forces_desc:0 "对抗越南共产党及其中共支持者侵略的战争，是保卫亚洲自由国家最关键的一场战争，我们希望得到我们的盟国澳大利亚和新西兰的支持，邀请他们派出武装部队协助我们对抗越共叛军。"
 SVN_american_opinion:0 "美国游说团"
 SVN_american_opinion_desc:0 "美国政府内的一些官员对是否支持越南对抗共产主义持质疑态度，我们应该派出一个代表团前往华盛顿，说服或收买他们的政治家、传媒和其他社会影响力人士，让他们帮助我们向美国社会各界宣传，帮助越南对抗共产主义，对于美国的前途和利益是极为重要的。"
 
 SVN_bietdong:0 "别动军"
 SVN_bietdong_desc:0 "别动军是越南共和国国军的精锐，作为快速反应部队，别动军将借助他们强大的作战能力和先进的快速机动部署能力，支援陆军部队对抗越共的袭击和破坏活动。"
 SVN_militarist_assis:0 "邀请军事顾问团"
 SVN_militarist_assis_desc:0 "我们可以请求美国政府为我们提供军事援助，包括援助军事装备和军事顾问。"
 SVN_CIDG:0 "平民游击防卫群"
 SVN_ne_village:0 "新生村"
 SVN_political_works:0 "政战工作"
 SVN_political_works_desc:0 "政治工作将在对抗共产主义渗透和破坏的过程中起到重要作用，我们需要让国军将士清楚地了解反共战争的政治意义，理解自己为何而战，并动员群众支持国军，实现军民一体，发挥出强大的战斗力。"
 SVN_militarist_commitee:0 "头顿宪章"
 SVN_broken_trail:0 "掐断胡志明小道"
 SVN_medias:0 "发展传媒"
 SVN_popular_support:0 "军民一体"
 SVN_popular_support_desc:0 "军爱民，民敬军，越南的反共自由事业离不开公民对国军的支持，我们必须将反共、爱国、拥军的口号融入到广泛的教育、政治和社会宣传当中去，动员所有爱国的越南人尽力而为地投入到反共救国事业当中。"
 
 SVN_armor:0 "建设装甲部队"
 SVN_armor_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 SVN_mechanized:0 "建设机械化部队"
 SVN_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 SVN_airdrop:0 "建设空降兵"
 SVN_airdrop_desc:0 "飞机航程和载荷的发展开辟了许多可能性。运输机可以在敌人战线的大后方投下一整个师的部队，在那里他们可以造成严重破坏。"
 SVN_local_army:0 "地方军和义军"
 SVN_train_bureau:0 "军训总局"
 
 SVN_simpilized_tuunam:0 "简化喃字"
 SVN_simpilized_tuunam_desc:0 "作为中国曾经的附庸国，越南长期受到中国文化的影响，我们不仅尊崇儒学，设立和中国一样的行政体系，我们的文字——喃字也改良自中国汉字。但是汉字的体系十分复杂，对于识字率较低的越南来说，不方便使用，我们可以模仿中国政府，将喃字简化，使其利于书写，同时又不会彻底断绝现代越南与古代越南的文化传承。"
 SVN_tuu_quocngu:0 "推广国语字"
 SVN_tuu_quocngu_tuunam_desc:0 "作为中国曾经的附庸国，越南长期受到中国文化的影响，我们不仅尊崇儒学，设立和中国一样的行政体系，我们的文字——喃字也改良自中国汉字。但是汉字的体系十分复杂，对于识字率较低的越南来说，不方便使用。葡萄牙传教士发明了拉丁化的越南文字，并被法国人推广使用，为了进一步改善识字率，同时断绝与中国在文化上的联系以巩固越南人的民族认同。"

 
 SVN_suport_cambodia_rightwing:0 "支持柬埔寨右翼"
 SVN_suport_cambodia_rightwing_desc:0 "柬埔寨遭到了共产势力的渗透，柬埔寨现政府与共产党勾结，为越共的地下活动提供协助，这是我们绝对不能容忍的！我们也要开始支持柬埔寨国内的反共势力，协助他们对抗共产主义，并在必要时候协助他们夺取柬埔寨政权，建立一个亲西贡的反共政府。"
 SVN_suport_laos_rightwing:0 "支持老挝右翼"
 SVN_suport_laos_rightwing_desc:0 "老挝遭到了共产势力的渗透，老挝现政府与共产党勾结，为越共的地下活动提供协助，这是我们绝对不能容忍的！我们也要开始支持老挝国内的反共势力，协助他们对抗共产主义，并在必要时候协助他们夺取老挝政权，建立一个亲西贡的反共政府。"
 SVN_develop_minor:0 "少数民族发展部"
 SVN_minor_autonomy:0 "允许高地民族自治"

 SVN_train_bureau:0 "剿共战争胜利"
 SVN_train_bureau:0 "稳定南部局势"
 SVN_train_bureau:0 "突破17度线"
 SVN_train_bureau:0 "支持北方的反共武装"
 SVN_train_bureau:0 "争取国际社会认同"
 SVN_train_bureau:0 "尝试改善与中共关系"
 SVN_train_bureau:0 "结束与美国的合作"
 
 SVN_train_bureau:0 "攻击柬埔寨和老挝边境"
 SVN_train_bureau:0 "河山统一"
 SVN_train_bureau:0 "煽动北方少数民族暴动"
 SVN_train_bureau:0 "煽动北方宗教势力暴动"
 SVN_train_bureau:0 "镇压共军残余"
