 KOR_1231:0 "军事工业"
 KOR_1956_constitution:0 "三次连任宪法"
 KOR_neo_liberalism:0 "新自由主义"
 KOR_important:0 "进口替代"
 KOR_democrat_election:0 "民主化选举"
 
 
 KOR_develop_hamgyeong:0 "发展咸静道"
 KOR_develop_hamgyeong_desc:0 "北方的咸静道地区适合开采矿业，应尽快开发此地区，以增加大韩民国对该地区经济的控制并增强当地民众对我方政府的信心。"
 KOR_develop_pyeongan:0 "发展平安道"
 KOR_develop_pyeongan_desc:0 "北方的平安道地区适合发展制造业，应尽快开发此地区，以增加大韩民国对该地区经济的控制并增强当地民众对我方政府的信心。"
 KOR_develop_hwanghae:0 "发展黄海道"
 KOR_develop_hwanghae_desc:0 "北方的黄海道地区适合发展农业，应尽快开发此地区，以增加大韩民国对该地区经济的控制并增强当地民众对我方政府的信心。"
 KOR_develop_coals:0 "开发北方煤矿"
 KOR_develop_coals_desc:0 "北韩许多地区拥有丰富的煤矿资源，应大力进行开发以弥补南方在化石能源上的不足。"
 KOR_northern_gov:0 "设立北五道政府"
 KOR_northern_gov_desc:0 "北韩大部分地区已处于我军控制下，我们需要尽快建立北方各地区的政府机关，以维护秩序和管理人口。"
 KOR_anti_commies:0 "镇压共产叛军"
 KOR_anti_commies_desc:0 "北韩许多地区仍有忠于共产党的叛乱分子，我们需要尽快采取军事和政治行动，进行严厉的镇压。"
 KOR_supress_commies:0 "清算共产党分子"
 KOR_supress_commies_desc:0 "韩半岛北方多年来处于共产党分子统治之下，这些曾经占有统治地位的共产党官员，如今成为了我们的俘虏。我们将依法审判他们，拆穿共产主义者的谎言，也建立起大韩民国的威望。"
 KOR_unification:0 "大韩一统"
 KOR_unification_desc:0 "无穷花  三千里  华丽江山"
 KOR_minjudang:0 "民主党政府"
 KOR_minjudang_desc:0 "五十年抗日运动和无数义士的鲜血换来的大韩民国，不能被新的暴君夺走。未来的大韩民国将实施民主制度，保障每一个韩国人的自由、平等与人权。"
 KOR_expanded_parliament:0 "扩大国会的权力"
 KOR_kimkoo:0 "金九政府"
 KOR_kimkoo_desc:0 "金九先生领导大韩独立运动数十载，无论是能力还是名望，都没人比他更适合担任大韩民国的第一位领袖。"
 KOR_great_alliance:0 "大联合政府"
 KOR_remove_militarist:0 "清算军事独裁"
 KOR_remove_militarist_desc:0 "我国多年来处于军政府统治之下，这些曾经占有统治地位的军事独裁者，如今成为了我们的囚徒。我们将依法审判他们，拆穿独裁者的谎言，也建立起民主制度的威望。"
 KOR_relation_kmt:0 "与中华民国的军事合作"
 KOR_relation_kmt_desc:0 "与中华民国的军事合作、交流和学习有利于促进双方的军事技术发展。"
 KOR_relation_roc:0 "交好中华民国"
 KOR_relation_roc_desc:0 "韩国人曾经和中国人合作对抗日本侵略，现在我们也将再一次团结起来，对抗共产党的侵略。"
 KOR_relation_france:0 "与法国的往来"
 KOR_relation_france_desc:0 "我们应该与法国改善关系，以获得一个世界大国的支持，并购买和学习更多技术。"
 KOR_relation_wdr:0 "与德国的往来"
 KOR_relation_wdr_desc:0 "我们应该与德国改善关系，以共同对抗共产主义，并购买和学习更多技术。"
 KOR_europe_relation:0 "欧洲外交"
 KOR_europe_relation_desc:0 "我们应该与欧洲国家的关系，并购买和学习更多技术。"
 KOR_pro_israel:0 "购买以色列技术"
 KOR_pro_israel_desc:0 "以色列拥有许多先进的技术，我们应该进行购买，并运用到工业和军事上。"
 KOR_pro_arab:0 "购买阿拉伯石油"
 KOR_remove_japan:0 "铲除日本遗产"
 KOR_labour_law:0 "劳动基准法"
 KOR_nambok_decration:0 "南北联合声明"
 KOR_nambok_decration_desc:0 "南北谈判取得初步成功，我们将一同发布一项联合声明，向世界宣布半岛局势已开始走向和平。"
 KOR_ilhae:0 "日海集团"
 KOR_ilhae_desc:0 "日海集团是韩国总统全斗焕名下的一个企业集团，也是韩国最大的军方控制企业。通过日海集团的垄断地位，全斗焕和部下获得大量财富，并用于笼络军队。"
 KOR_jail:0 "保安司西冰库"
 KOR_jail_desc:0 "保安司令部的监狱将让每一个威胁政权稳定的危险分子尝到铁拳！"
 KOR_samcheong:0 "三清教育"
 KOR_samcheong_desc:0 "大韩民国的社会动荡，主要是由于社会上存在大量的地痞流氓、无赖和黑道分子，我们将采取行动扫清这些败类，并成立三清教育队，专门矫正这些人。"
 KOR_5_republic:0 "第五共和国"
 KOR_5_republic_desc:0 "国家处于动荡之中，而各大党派只会争权独立，只有军人是单纯的，都是为国家尽忠而生。新的宪法将赋予军政府更大的政治权力，也将让大韩民国走入第五共和国时代。"
 KOR_new_parliament:0 "统一主体国民会议"
 
 KOR_social_welfare:0 "社会保障"
 KOR_social_welfare_desc:0 "政府存在的意义就是为人民提供衣食无忧的生活，将福利制度从摇篮推行到坟墓，一个能让公民从出生到死亡都没有经济困难的国家是完美的现代国家，也能为政府提供绝对优势的支持。"
 KOR_female_rights:0 "妇女权益"
 KOR_female_rights_desc:0 "给予妇女选举权是实现平等，推动社会现代化的重要里程碑，当妇女掌握选票时，也就掌握了自己的命运。"
 KOR_accept_union:0 "接纳工会"
 KOR_accept_union_desc:0 "工业化带来了工人群体的扩大，工人正成为一支强大的政治力量，要求更高的薪资、完善的福利制度和八小时工作制。与其让失望的工人投向共产党，不如主动满足其需求以争取工人的选票。"
 KOR_strike_union:0 "打击工会"
 KOR_strike_union_desc:0 "受共产主义影响的工会分子鼓吹盲目的高薪、低工时和各种乱七八糟的福利制度，反对我们实行的各项经济刺激，拖累经济转型政策的推动，如果他们不愿意为国家的经济发展做出一些经济上的牺牲，那就让他们做出肉体上的牺牲。"
 KOR_more_work:0 "加强劳动"
 KOR_more_work_desc:0 "现在是大韩民国和韩民族摆脱落后，走向繁荣的关键时刻，我们要求每一个韩国工人都无限地风险自己的力量、汗水，参与到生产建设当中，不允许所谓的工人权益影响我们的发展计划。"
 KOR_SKY:0 "Sky学校"
 KOR_SKY_desc:0 "SKY即首尔大学、高丽大学和延世大学，是大韩民国最高学府。"
 KOR_education:0 "发展教育"
 KOR_education_desc:0 "完善教育体制，让每一个孩童都能进入学校，是建设现代化国家最关键的第一步。"
 KOR_unlocked:0 "解除戒严"
 KOR_strike_students:0 "镇压学生运动"
 KOR_strike_students_desc:0 "年轻热血的青年人总是容易被煽动，被一些虚伪的口号变成破坏社会稳定的危险分子，政府要加强对学生活动的监视和控制，并在必要时采取手段。"
 KOR_elections:0 "恢复公开选举"
 KOR_rhee_rule:0 "终身总统"
 KOR_jayudang:0 "自由党独裁"
 KOR_confusious:0 "提倡儒学"
 KOR_confusious_desc:0 "来自中国的古老哲学，在韩国也有着深入的影响。君君臣臣、父父子子，只有宣扬忠君爱国，才能维护国家的稳定。"
 KOR_output_workers:0 "输出劳动力"
 KOR_militarist_first:0 "军事优先政策"
 KOR_hyeongmu:0 "玄武计划"
 KOR_baek_missile:0 "白熊导弹"
 KOR_baek_missile_desc:0 "导弹技术可能是20世纪最重要的军事发明之一，他最早诞生于二战德国的V2火箭，并在50年代的美苏争霸中完善。最早的导弹通过红外线热感应进行制导，通过接收目标反射的热光调整弹道，到了后来出现了电视制导和主动激光制导。导弹的应用相当广泛，它可以用于大型的弹道导弹，也可以用于制导炸弹，或步兵、车载的反坦克或反导导弹，它大大提升了军队的作战效率，但最大的问题就是——他太贵了。"
 KOR_officers:0 "公务员改革"
 KOR_cunrrency_reform:0 "货币改革"
 KOR_industry_pioneers:0 "工业尖兵"
 KOR_industry_pioneers_desc:0 "大韩民国如今仍是世界上最落后的国家之一，我们的经济处于初步阶段，日本人留下的工业远远无法满足我们的发展需求，军事工业几乎不存在。这样的大韩民国是无法保护自己的，为了成为一个能够对抗共产主义的强国，韩国必须立刻开始发展工业，并不惜一切代价达成这个目标！"
 KOR_prc_relation:0 "中韩建交"
 KOR_prc_relation_desc:0 "中国共产党政权已经不可能被推翻，我们不可能与这个与我们一同存在了数千年的邻国永远老死不相往来。与中华人民共和国建立外交关系要提上日程。"
 KOR_develop_fighter:0 "发展空军战机"
 KOR_nuclear:0 "发展核能"
 KOR_nuclear_desc:0 "核子裂变释放出来的能量摧毁了广岛和长崎，也将人类带入一个全新的时代。核技术有着巨大的运用价值，它可以制造毁灭性的可怕武器，也可以用来提供无尽的清洁能源，甚至运用到生物化学领域。\n原子能的释放改变了除人类思维方式以外的一切。\n——阿尔伯特·爱因斯坦"
 KOR_wipe_culture:0 "清除社会不良文化"
 KOR_mineral:0 "开发矿业"
 KOR_mineral_desc:0 "铁、铜、铝、煤都是现代工业不可缺少的基础，我们应该发展矿业规模和技术，勘探新的矿床，引进先进设备，以扩大矿产资源产出，不仅可以供应本国工业消耗，还可以出口外国。"
 KOR_limited_senators:0 "限制议员特权"
 KOR_limited_senators_desc:0 "国会议员过大的政治和法律权利，使其成为腐败的土壤，应该将限制国会议员权力作为我们打击腐败的第一步。"
 KOR_jeju_tourism:0 "济州岛旅游业"
 KOR_develop_jeonla:0 "开发湖南地区"
 KOR_develop_jeonla_desc:0 "湖南地区拥有韩国最大的盆地，也是汉城以外的第二大人口聚集地，适合进行农业和制造业的投资建设，应进行投资开发。"
 KOR_remove_capital:0 "迁都计划"
 KOR_develop_gyeongsang:0 "开发岭南地区"
 KOR_develop_gyeongsang_desc:0 "岭南地区拥有丰富的矿产资源和工业基础，并勘探出了可能存在的油田，应进行投资开发。"
 KOR_korean_immigrate:0 "朝鲜族移民回归"
 KOR_korean_immigrate_desc:0 "在日帝统治时期，许多韩人为了逃离暴政而前往海外生活。现在韩国光复，应当邀请这些移民回到韩国，支持祖国的发展建设。"
 KOR_soviet_rebels:0 "支持苏联朝鲜族武装"
 KOR_soviet_rebels_desc:0 "韩半岛已光复统一，但反共产主义的圣战还未结束，自由世界将向共产俄罗斯政权发动总攻。俄罗斯境内有许多日帝时期移民过去的朝鲜族，我们要支持他们发动反叛！"
 KOR_manchuria:0 "支持满洲反共武装"
 KOR_manchuria_desc:0 "中国满洲境内有许多日帝时期移民过去的朝鲜族和满族，我们要支持他们发动反叛！"
 KOR_strike_ccp:0 "对抗中共"
 KOR_strike_ccp_desc:0 "韩半岛已光复统一，但反共产主义的圣战还未结束，自由世界将向共产中国政权发动总攻。"
 KOR_dokdo:0 "守护独岛"
 KOR_dokdo_desc:0 "独岛是大韩民国毫无争议的领土，但日本却对他有野心，我们要加强我国海军对独岛的控制和保护。"
 KOR_ryukyu:0 "支持琉球独立"
 KOR_ryukyu_desc:0 "琉球自古以来都是一个独立国家，但日本却将其吞并，我们要支持琉球独立，反对其回归日本，以避免日本再次获得一个可以威慑黄海的基地。"
 KOR_anti_japan:0 "对日本的行动"
 KOR_anti_japan_desc:0 "日本与韩国的矛盾可以从七世纪开始算起，一千多年来，日本屡次入侵我国，现在又再一次出现了军国主义复兴的征兆。我们应该给日本政府制造一些麻烦，以避免他们再一次发展成为一个影响东亚稳定的定时炸弹。"
 KOR_defence_group:0 "国民防卫团"
 KOR_defence_group_desc:0 "北韩共产军大举入侵！我们急需将所有男性动员起来，保卫国家！"
 KOR_bodo_union:0 "保导联盟"
 KOR_bodo_union_desc:0 "共产主义分子对我国的渗透十分令人担忧，我们应当成立一个组织和机构，来收容这些共产主义同情者，并对他们进行再教育。"
 KOR_tongilgyeo:0 "接触统一教"
 KOR_tongilgyeo_desc:0 "统一教是在南的北韩人文鲜明创立的新兴宗教，尽管这个宗教主要在日本发展，但却意外的与北韩首脑金日成建立了友谊。文鲜明十分乐意在南北和谈中充当中间人，条件是南韩政府要支持他这个宗教的发展。"
 KOR_high_emergency:0 "非常戒严令"
 KOR_high_emergency_desc:0 "大韩民国处于政治动荡的边缘，必须采取更严厉的戒严、宵禁和维稳政策，打击动乱分子，维护政府执政和社会稳定。"
 KOR_home_plan:0 "家庭计划"
 KOR_home_plan_desc:0 "我国的人口不断增长，已经远远超过了我们的土地和经济能承受的范围，我们必须控制人口增长。"
 KOR_develop_missile:0 "发展导弹"
 KOR_develop_missile_desc:0 "导弹技术是划时代的发明，它将彻底改变现代战争，如果我国要建设一个现代化的军队，必须发展导弹技术。"
 KOR_militarist_industry_1:0 "军事工业 I"
 KOR_militarist_industry_1_desc:0 "共产党侵略威胁长期存在，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 KOR_militarist_industry_2:0 "军事工业 II"
 KOR_militarist_industry_2_desc:0 "在实现轻武器的国产后，我们需要进一步扩张我国的军工产能，实现装甲车辆和飞机的国产化，以保证先进武器装备的自给率。"
 KOR_militarist_industry_3:0 "军事工业 III"
 KOR_militarist_industry_3_desc:0 "新时代的武器装备更复杂、多样化且昂贵，唯有进一步扩张我国的军工复合体，才能腾出足以敷用的产能奋起直追。"
 KOR_civic_industry_3:0 "民用工业 III"
 KOR_civic_industry_3_desc:0 "在具备较为完善的工业能力后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 KOR_civic_industry_2:0 "民用工业 II"
 KOR_civic_industry_2_desc:0 "在具备进一步工业能力后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 KOR_civic_industry_1:0 "民用工业 I"
 KOR_civic_industry_1_desc:0 "在具备初步工业能力后，我们需要满足我们人民对生活消费品的需求。从纺织、食品、木制品和锅碗瓢盆开始。"
 KOR_samsung_electronic:0 "三星电子"
 KOR_samsung:0 "三星公司"
 KOR_daewoo:0 "大宇公司"
 KOR_oil_produc:0 "发展石油工业"
 KOR_oil_produc_desc:0 "石油是现代工业的血液，如果我们要成为工业国家，发展石油工业是不可缺少的一步。"
 KOR_oil_refinery:0 "发展化工产业"
 KOR_oil_refinery_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 
 
 KOR_homeland_defenders:0 "乡土防卫队"
 KOR_homeland_defenders_desc:0 "乡土防卫队是我国最大的民兵组织，所有成年男性都必须参与其中，平时训练，战时拿起武器。"
 KOR_free_asia:0 "亚洲民主的防波堤"
 KOR_free_asia_desc:0 "在共产党占据整个中国大陆后，台湾、韩国和越南便成为了自由亚洲国家对抗共产党入侵的最前线，亚洲国家必须联合起来，建立一道强硬的防波堤，对抗邪恶的共产主义洪水。"
 KOR_invest_sea:0 "投资东南亚"
 KOR_invest_sea_desc:0 "我们需要尽快与东南亚国家改善关系，扩大外交支持，开展经济往来，投资获利，也合作对抗共产主义。"
 KOR_invest_me:0 "投资中东"
 KOR_invest_me_desc:0 "我们需要尽快与中东国家改善关系，扩大外交支持，并开展经济往来，投资获利，也合作对抗共产主义。"
 KOR_invest_africa:0 "投资非洲"
 KOR_invest_africa_desc:0 "我们需要尽快与非洲国家改善关系，扩大外交支持，并开展经济往来，投资获利，也合作对抗共产主义。"
 KOR_pro_usa:0 "我们最重要的盟友"
 KOR_pro_usa_desc:0 "美国政府致力于对抗世界上的共产主义颠覆运动，他们将成为我们的重要盟友。"
 KOR_us_aid:0 "美国援助"
 KOR_us_aid_desc:0 "请求美国政府提供军事、政治和经济援助。"
 KOR_usa_techs:0 "美国技术援助"
 KOR_usa_techs_desc:0 "我们可以请求美国政府向我们派遣技术顾问，帮助我国科技发展和工业建设。"
 KOR_usa_intel:0 "美国情报援助"
 KOR_usa_intel_desc:0 "我们应当邀请美国情报部门来为我国提供情报援助。虽然这有让我国被美国渗透控制的风险，但利大于弊。"
 KOR_garrison:0 "美国军事援助"
 KOR_garrison_desc:0 "我们可以请求美国政府为我们提供军事援助，包括援助军事装备和军事顾问。
 KOR_more_garrison:0 "增加美军部署"
 KOR_more_garrison_desc:0 "我们可以请求美国政府为我们提供军事援助，包括援助军事装备和军事顾问。
 
 KOR_diplomatic_focus:0 "外交事务"


 KOR_Security_law:0 "国家安全法"
 KOR_Security_law_desc:0 "受到平壤傀儡支持的共产党人、无政府主义者和无知的学生正在煽动政治混乱，企图在我国推动革命和颠覆运动。我们的警察机构将被派去监视、警告和逮捕这些嫌疑犯。"
 KOR_Rhee_gov:0 "李承晚政府"
 KOR_Rhee_gov_desc:0 "李承晚先生是大韩民国临时政府的重要领导人之一，在北方共产党的威胁下，一名强硬、铁腕的反共产主义的领导人才是我们所需要的。"
 KOR_Yi_Cho_agreetment:0 "李赵密约和内阁制"
 KOR_Yi_Cho_agreetment_desc:0 "李承晚的副手李起鹏，曾尝试与民主党领袖赵炳玉进行秘密谈判，双方计划将韩国政体改为内阁制，李起鹏将支持赵炳玉参选总理并向其让权，作为回报，民主党将支持李起鹏参选总统接替李承晚。"
 KOR_NewGovernment:0 "成立新政府"
 KOR_NewGovernment_desc:0 "大韩民族已经从日本的殖民统治下获得独立，现在我们要尽快建立一个政府。"
 KOR_AntiCommunist:0 "反共产主义"
 KOR_AntiCommunist_desc:0 "苏俄支持下的共产主义侵略，正威胁着每一个自由亚洲国家的安全。我们北方的领土被共产党占据，且他们也在不断向南方渗透，我们必须保持警惕和强硬的态度。"
 KOR_NorthInvation:0 "讨伐北傀"
 KOR_NorthInvation_desc:0 "平壤共产党政府覆灭的时刻到来了！大韩民国国军将一举消灭金日成，光伏北韩，统一国家！大韩民国万岁！"
 KOR_Rhee_Line:0 "李承晚线"
 KOR_Rhee_Line_desc:0 "李承晚线是韩国总统李承晚划定的韩国海上边境线，其范围包括韩国周围的大片领海以及独岛等与日本的争议岛屿。该边境线的划定一定程度上提高了李承晚的威望，但危害了与日本、中国的关系。"
 KOR_Military_goverment:0 "军人政府"
 KOR_Military_goverment_desc:0 "各种不同政治主张的党派在议会里为了各自的利益撕扯，但军队与他们不同，军队能够团结一致，同一目标，代表社会进步阶层，做事果断果敢，且真正为了国家而努力。"
 KOR_Jap_relation:0 "韩日建交"
 KOR_Jap_relation_desc:0 "韩国人民依然记恨着日本入侵带来的毁灭和苦难，想要和他们重新交朋友还是很困难，但在共产党的威胁面前，我们还是需要尽可能争取两国关系的缓和，以促使自由亚洲团结起来。"
 KOR_japan_alliance:0 "日韩共同防御"
 KOR_japan_techs:0 "日韩技术合作"
 KOR_japan_techs_desc:0 "无论两国民间舆论如何看待，但至少南韩政府官方已经接受了与我们恢复正常关系，接下来我们将尝试促进两国在经济、军事和科学技术上的进一步合作。"
 KOR_japan_immigrate:0 "在日韩人归国"
 KOR_angainst_spies:0 "反渗透"
 KOR_Ulsin_constitution:0 "维新宪法"
 KOR_Ulsin_constitution_desc:0 "维新宪法指韩国的1972年宪法。为了实现无限期连任，朴正熙在该年宣布全国进入紧急状态，解散国会并由“主体国民统一会议”选举总统。朴正熙由此成为实际上的终身总统。"
 KOR_KCIA:0 "中央情报院"
 KOR_KCIA_desc:0 "一些红色分子和反政府武装正在转向地下秘密活动。为了铲除他们，我们需要成立一个专门的部门来调查、监督、逮捕和消灭他们。"
 KOR_Vietnam:0 "介入越战"
 KOR_Vietnam_desc:0 "反对共产主义的斗争正在越南进行。我们应该派一些部队参加。一方面，我们要学习战斗的经验。另一方面，当我们遇到困难时，美国人也会愿意提供帮助。"
 KOR_Nationalism:0 "大韩民族的复兴"
 KOR_Nationalism_desc:0 "朴正熙统治期间，为了提高韩国的民族主义情绪并师韩国人积极地投入到发展当中，政府向韩国人灌输民族主义情绪，鼓励他们为了振兴具有五千年历史的大韩民族而成为经济奇迹的一个齿轮。"
 KOR_Seoul_spring:0 "汉城之春"
 KOR_Seoul_spring_desc:0 "独裁者死于耻辱中，决定韩国未来命运的关键时刻已经来临……"
 KOR_629deceration:0 "6·29宣言"
 KOR_629deceration_desc:0 "6·29宣言是1988年，在民主运动席卷韩国的背景下，全斗焕亲信、总统候选人卢泰愚发布的宣言。该宣言承诺举行公平的大选，并推进韩国的民主化，其标志着军政府对韩国统治的终结。"
 KOR_3Spolicy:0 "3S政策"
 KOR_3Spolicy_desc:0 "3S，即Sport、Screen和Sex，是全斗焕政府统治时期，为了平息社会运动，而放松对娱乐产品和影视的审查，用面包和马戏来遮挡社会矛盾。"
 KOR_remove_pro_japan:0 "清算亲日派"
 KOR_remove_chebal:0 "整治财阀"
 KOR_economic:0 "经济建设"
 KOR_economic_desc:0 "新生的国家需要发展，人民需要衣食住行，满足人民群众对生活必需品的需求，是我们建设国家的第一步。"
 KOR_land_reform:0 "土地改革"
 KOR_land_reform_desc:0 "韩半岛的可耕种土地本就不多，大部分还被封建地主和大企业所占领，我们将进行土地改革，限制地主所拥有的土地数量，从而使得土地可以作为商品，出售给农民、企业或国家。"
 KOR_agriculture_develop:0 "农业发展计划"
 KOR_agriculture_develop_desc:0 "韩半岛以山地为主，意味着我国不适合粗放式的农业政策，应当重点发展农业科技，提高单位产量。"
 KOR_semaul:0 "新村运动"
 KOR_semaul_desc:0 "新村运动是韩国政府于1961年发起的乡村改革运动，主要内容是在农村进行基础设施建设，改善农村人口生活环境，从而结束韩国的落后面貌并推进城市化。"
 KOR_gyeongbu_hightway:0 "京釜高速"
 KOR_economic_plan:0 "经济发展计划"
 KOR_pro_chebal:0 "支持财阀"
 KOR_electronic:0 "电子工业"
 KOR_electronic_desc:0 "电子产业是20世纪后半叶最重要的高新技术产业，小小的晶体管不仅可以制造出先进的电子产品，也是走向发达国家的门槛。"
 KOR_steel_making:0 "浦项钢铁公司"
 KOR_uilsan_dock:0 "蔚山造船厂"
 KOR_Army:0 "大韩民国国军"
 KOR_Japanese_officers:0 "招募日军旧军官"
 KOR_Japanese_officers_desc:0 "在日帝统治时期，有许多朝鲜人被征召进入日本军队，如果要重建军队，就必须将这些旧日本军军人特赦，并邀请他们成为国军的高层。是的，他们当中许多人可能依然忠诚于军国主义，但比起在北傀入侵时束手无策，这风险是值得的。"
 KOR_nuke:0 "核武器"
 
 
 KOR_NorthNegosiation:0 "与北方交涉"
 KOR_United:0 "和平统一"
 KOR_Northern_Policy:0 "新北方政策"
 KOR_edited_reaty:0 "修改韩美条约"
 KOR_end_alliance:0 "结束韩美同盟"
 KOR_neutry:0 "半岛中立化"
 KOR_families_meeting:0 "离散家属会面"
 KOR_north_economic_cooperation:0 "南北经济合作"
 KOR_north_secret_cooperation:0 "南北秘密军事合作"
 
 
 KOR_buy_weapons:0 "购买外国武器"
 KOR_buy_weapons_desc:0 "我国的军事工业目前还很落后，没有自己生产军火的能力，但我们可以向其他国家购买退役的武器。"
 KOR_armors:0 "发展装甲部队"
 KOR_armors_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 KOR_mechanized:0 "发展机械化部队"
 KOR_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 KOR_develop_weapons:0 "成立装备发展部"
 KOR_develop_weapons_desc:0 "从步兵的头盔和背心，再到坦克上的火控系统和动力系统，先进的作战装备往往主导着战场。"
 
 KOR_buy_plane:0 "购买战斗机"
 KOR_buy_plane_desc:0 "我们目前没有自行生产战斗机的能力，但我们可以向友好国家购买现成的战斗机来建立我们的空军。"
 KOR_transfer:0 "发展运输机"
 KOR_transfer_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 KOR_jet_2:0 "发展二代战斗机"
 KOR_jet_2_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 KOR_airforce:0 "建立空军"
 KOR_kongsu:0 "建立空输部队"
 KOR_kongsu_desc:0 "飞机航程和载荷的发展开辟了许多可能性。运输机可以在敌人战线的大后方投下一整个师的部队，在那里他们可以造成严重破坏。"
 KOR_air_base:0 "扩大空军基地 I"
 KOR_air_base_desc:0 "我们需要机场和基础设施来承载我们的空军。"
 KOR_air_base2:0 "扩大空军基地 II"
 KOR_air_base2_desc:0 "我们需要机场和基础设施来承载我们的空军。"
 KOR_bomber_focus:0 "发展轰炸机"
 KOR_bomber_focus_desc: "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 
 KOR_ROKASWC:0 "陆军特战司令部"
 KOR_ROKASWC_desc:0 "北傀不断派出特种部队，对我国进行防不胜防的袭击和破坏，我们也需要一支精英部队，以进行反恐怖、反破坏作战。"
 
 KOR_navy:0 "建立海军"
 KOR_navy_desc:0 "閑山島，明月夜， 獨坐孤峰望水時， 手中長劍舞翩翩， 愁緒萬千心底起， 不知何處笛聲傳。\n——李舜臣"
 KOR_marines:0 "建立海兵队"
 KOR_marines_desc:0 "擅长两栖作战的部队越来越不可或缺。临时拼凑的手段、装备已经成为历史，我方海军陆战兵现在已接受相关训练并拥有专属登陆舰船支持。"
 KOR_develop_submarines:0 "发展潜艇"
 PKOR_develop_submarines_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 KOR_medium_ships:0 "发展中型舰艇"
 KOR_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 KOR_modernized_ships:0 "发展现代舰艇"
 KOR_modernized_ships_desc:0 "我们的海军已经成长壮大，我们需要发展可以数字化、信息化的战舰设备来强化作战能力。"
 KOR_light_ships:0 "发展轻型舰艇"
 KOR_light_ships_desc:0 "我们的海军刚刚起步，至少需要一些护卫舰和驱逐舰来保护我们的领海。"
 KOR_naval_base:0 "发展海军基地 I"
 KOR_naval_base_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 KOR_naval_base2:0 "发展海军基地 II"
 KOR_naval_base2_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 KOR_buy_ship:0 "购买水面舰艇"
 KOR_buy_ship_desc:0 "我们目前还没有建造舰船的能力，但我们可以向其他国家购买退役的舰艇。"
 KOR_buy_submarines:0 "购买潜艇"
 KOR_buy_submarines_desc:0 "我们目前还没有建造潜艇的能力，但我们可以向其他国家购买退役的潜艇。"
 
 KOR_christian:0 "支持基督教会"
 KOR_christian_desc:0 "基督教在十九世纪传入韩国并受到知识分子和上层阶级欢迎。在日本统治时期，基督教进步人士主导了独立运动，而当韩国在美国支持下获得独立后，基督教便在韩国社会中获得了巨大的影响力。"
 KOR_youth_group:0 "大韩青年团"
 KOR_youth_group_desc:0 "我们要将大韩民族的年青人动员起来，投入到反共运动当中，避免共产思想荼毒韩民族的未来。"
 KOR_De_Hanja:0 "去汉字化"
 KOR_contact_royal:0 "支持李氏朝鲜王室"
 KOR_empire:0 "大韩帝国"
 KOR_PRC_Policy:0 "与北京建立关系"
 KOR_Aplok:0 "鸭绿江以北"
 KOR_culture_policy:0 "支持文化产业"
 KOR_tourism_focus:0 "支持旅游业"
 KOR_tourism_focus_desc:0 "持竹杖、着斗笠、放浪三千里\n白云飘飘，群山之巅，来客为何人？\n\n——《流浪诗人金斗笠》"
 KOR_space:0 "太空探索"
 KOR_clear_politic:0 "肃清政治"
 KOR_against_corrupt:0 "反对腐败"