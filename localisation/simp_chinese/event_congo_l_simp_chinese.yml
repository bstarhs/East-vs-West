l_simp_chinese:
 cog.1.t:0 "刚果民族运动党成立"
 cog.1.d:0 "由刚果政治家帕特里斯·卢蒙巴领导下的刚果民主主义者成立了刚果民族运动党，并向比利时殖民者正式提出了独立的要求。"
 
 cog.2.t:0 "比属刚果独立！"
 cog.2.d:0 "来自莱奥波尔德维尔的消息。比利时在非洲最大的殖民地刚果宣布独立。自1884年以来，这片土地经历了人类历史上最可怕的统治。比利时国王利奥波德二世发现了独裁者和奴隶制度，导致300万刚果人死亡。刚果新总理帕特里斯·卢蒙巴表示，刚果人将铭记昨天的黑暗，并将他们的国家团结起来走向自由。比利时人显然不喜欢他的演讲。"
 
 cog.3.t:0 "来自刚果的消息"
 cog.3.d:0 "刚果总理帕特里斯·卢蒙巴要求我们的官员离开他的国家。还有3万在刚果军队和政府中服役的比利时人也必须全部撤离。"
 cog.3.a:0 "我们不能失去刚果！"
 cog.3.b:0 "殖民时代已经结束了"
 
 cog.4.t:0 "比利时人撤离刚果"
 cog.4.d:0 "应刚果政府的要求，所有的比利时军官离开刚果，这标志着比利时的殖民统治在刚果结束。这一决定受到比利时强硬派和美国政府的谴责，因为它将导致更多的民族主义在非洲崛起，甚至是共产主义。"
 cog.4.b:0 "The colonial era is over."
 
 cog.5.t:0 "比利时拒绝撤离刚果"
 
 cog.6.t:0 "刚果暴动！"
 cog.6.d:0 "利奥波尔德维尔发生了暴力事件！刚果军队的士兵对比利时军官感到愤怒，因为他们拒绝离开这个国家。刚果士兵试图向比利时指挥官抗议，但遭到侮辱。然后士兵们向比利时人开枪。比利时政府谴责这一暴力行为，并宣布他们将以武力保护其在刚果的公民。"
 cog.6.b:0 "Terrible."
 
 cog.7.t:0 "加丹加动乱！"
 cog.7.d:0 "刚果南部加丹加省宣布独立！现在这个国家由刚果亲比利时的军阀莫伊丝·卡彭达·冲伯统治。冲伯是联邦主义者，也是卢蒙巴的政治对手，他试图在比利时的协助下建立刚果联邦政府。"
 cog.7.b:0 "Terrible."
 
 cog.8.t:0 "右翼军人的不满"
 cog.8.d:0 "我们驱逐比利时和法国经济渗透的行为引发了许多军人的不满，这些军官很多都曾在比利时或法国军队服役，他们的训练、武器和军饷很大程度依赖比利时和法国的资助，他们警告，欧洲人的离开将会导致刚果军方的利益严重受损。"
 
 
 cog.10.t:0 "警惕刚果的亲苏政权"
 cog.10.d:0 "刚果独立后，刚果总理卢蒙巴有严重的亲共倾向，此人不仅积极与苏联和中共改善关系，甚至试图支持非洲其他地区的反殖民运动，这是一个危险的人物，毫无疑问他是俄国人赤化非洲的先锋，我们必须对其施加压力。"
 
 cog.11.t:0 "刚果右翼军人与我们接触"
 cog.11.d:0 "刚果总理卢蒙巴无法妥善处理他和军方的关系，刚果军队内的右翼军人寻求我们的帮助，以推翻卢蒙巴。"
 
 cog.12.t:0 "刚果发生政局动荡"
 cog.12.d:0 "刚果发生严重的政治动荡，右翼军人、地方军阀、矿业公司和其他仍然受比利时影响的政治势力反对卢蒙巴的政策，利奥波德维尔街头爆发了大规模游行示威，要求卢蒙巴下台。"
 
 cog.13.t:0 "联合国就刚果问题展开讨论"
 cog.13.d:0 "刚果爆发的军事冲突引起了国际社会的广泛关注，刚果总理帕特里斯·卢蒙巴请求联合国协助刚果政府镇压叛乱，联合国安理会将在今天的联大会议上就此事进行表决。"
 
 cog.14.t:0 "刚果维和任务决议通过！"
 cog.14.d:0 "联合国正式通过了派遣维和部队前往刚果执行维和任务的决议！"
 
 cog.15.t:0 "刚果维和任务决议未能通过"
 
 cog.16.t:0 "赫鲁晓夫就刚果问题发表讲话"
 cog.16.d:0 "苏联领导人尼基塔·赫鲁晓夫在今天的联合国大会上，就刚果问题与西方国家争锋相对。\n可敬的代表先生们，我抗议对在座的各国代表采取的不平等态度。当刚果代表先生代表自己国家发言时，为什么大会主席要阻止他？\n先生们！主席先生！我们不是靠上帝的恩赐，也不是靠你们的恩赐。而靠伟大的苏联人民和为争取独立而斗争的所有人民的力量与理智。而生存在世界上。\n你们扼杀不了人民的声音，你们扼杀不了真理的声音！现在是埋葬殖民主义的时候了，打倒殖民主义奴隶制度！我们终将把它埋葬，埋的越快越好，越深越好。"
 
 cog.17.t:0 "向刚果派兵的决议"
 cog.17.d:0 "刚果危机引发国际社会关注，联合国已正式宣布向刚果派遣维和部队，并邀请我国派遣部队参与维和部队。"
 cog17_tool:0 "如果你接下了这个任务，你必须向刚果派遣志愿军以协助刚果政府镇压加丹加和南开赛的叛军，否则将遭受严重的外交和政治惩罚。"
 
 cog.18.t:0 "[FROM.GetName]宣布向刚果派遣维和部队"
 cog.18.d:0 "[FROM.GetName]政府发表声明，该国将根据联合国决议，派遣武装部队赴刚果执行维和任务。"
 
 cog.19.t:0 "刚果爆发流血政变！"
 
 cog.20.t:0 "帕特里斯·卢蒙巴被杀害！"
 
 cog.21.t:0 "帕特里斯·卢蒙巴逃亡刚果东北部"
 
 cog.22.t:0 "刚果民主运动需要我们的支持！"
 
 cog.23.t:0 "刚果人民解放军成立！"
 
 cog.24.t:0 "刚果内战爆发！"
 
 cog.25.t:0 "蒙博托将军夺取刚果政权！"
 
 cog.26.t:0 "哈马舍尔德的专机被击落"
 
 cog.27.t:0 "刚果部队攻占南开赛"
 
 cog.28.t:0 "刚果部队攻占南伊丽莎白维尔"
 
 cog.29.t:0 "联合国刚果维和行动结束"
 
 cog.30.t:0 "加丹加叛军逼近利奥波德维尔"
 
 cog.31.t:0 "刚果和平协定签署"
 
 cog.32.t:0 "联合国刚果维和行动宣告失败！"
 
 cog.34.t:0 "我们的矿产资源仍被比利时控制"
 
 cog.35.t:0 "刚果宣布将加丹加省矿业国有化！"
 
 cog.36.t:0 "比利时联合矿业公司解散"
 
 cog.37.t:0 "雇佣兵齐格弗里德·穆勒来到刚果"
 
 cog.38.t:0 "爱尔兰维和部队与加丹加叛军发生激烈交火"
 
 cog.40.t:0 "雇佣兵齐格弗里德·穆勒来到加丹加"
 cog.40.d:0 "致中情局特别行动处自荐信\n\n尊敬的先生：\n获悉贵方在刚果的特别行动，我愿提供专业军事服务。曾任德国国防军少尉，精通突袭作战与指挥。在东部战役中获得铁十字勋章，擅长沙漠与丛林环境下的小队敌后渗透。\n特殊技能包括：\n法语战地审讯\n苏制武器系统教学（在东部战线缴获使用经验）\n雇佣兵团队整训（刚完成肯尼亚茅茅运动清剿合约）\n附呈曼施坦因将军签名的战术笔记影本，其中包含我标注的反叛乱作战要诀。可随时携带个人装备赴约翰内斯堡报到，包括保养完好的MG42机枪与全套热带作战服\n期待为自由世界在非洲的战略利益效力。\n\n您忠诚的\n西格弗里德·穆勒"
 
 cog.41.t:0 "加丹加叛乱已被镇压"
 
 
 
 
 cog.100.t:0 "刚果反殖民运动的兴起"
 cog.100.d:0 "随着非洲去殖民化的进程不断发展，比利时殖民地刚果-利奥波德维尔也出现了反对殖民主义的声音。利奥波德维尔街头出现了黑人的示威游行活动，要求比利时当局改善对黑人的不公平待遇。"
 
 cog.101.t:0 "巴刚果联盟的成立"
 cog.101.d:0 "一个名叫巴刚果联盟的政党在比属刚果的首府利奥波德维尔成立，这是比利时统治下的刚果第一个黑人政党，由当地的黑人中产阶级组成。二战结束后，为了恢复刚果殖民地的经济生产，比利时被迫同意了黑人进入政府和社会机构工作，使得刚果形成了一个规模较大的黑人中产阶级阶层，然而黑人依然没有基本的政治权利，在法律和社会上受到歧视。巴刚果联盟虽然可能受到非洲去殖民化风潮影响，但目前他们尚未提出激进的分离主义纲领。"
 
 cog.102.t:0 "比属刚果的社会各界发表联合声明"
 cog.102.d:0 "比属刚果首府利奥波德维尔，黑人民族主义政治家齐聚一堂，正式要求比利时政府对刚果的社会和政治进行改革，包括改善黑人的待遇，给予黑人政治地位，并尽快推动刚果实现自治，并进行黑人能够参与的政治选举。"
 
 cog.103.t:0 "刚果发生游行示威和罢工运动"
 cog.103.d:0 "比属刚果多地发生黑人阻止的示威游行和罢工，示威者要求比利时政府尽快在刚果推动政治改革。"
 
 cog.104.t:0 "比利时宣布刚果自治"
 cog.104.d:0 "在非洲去殖民化的浪潮下，比利时政府在刚果群众的压力下，正式宣布，比属刚果正式实行自治，刚果将在不久后进行选举，以产生一个新的自治政府。"
 
 cog.105.t:0 "刚果民族运动召开会议"
 cog.105.d:0 "比属刚果的民族主义运动开始朝着更加激进的方向发展。在昨天举行的刚果民族运动党大会上，以帕特里斯·卢蒙巴为首的一部分人认为，在比利时的管制下寻求简单的自治，是不可能获得真正的自由和民主的，刚果必须追求彻底脱离比利时，实现彻底的独立，建立真正的主权国家。"
 
 cog.106.t:0 "帕特里斯·卢蒙巴被捕"
 cog.106.d:0 "来自利奥波德维尔的紧急消息！刚果民族运动党领袖帕特里斯·卢蒙巴被捕！比利时殖民当局指控卢蒙巴支持叛乱运动！"
 
 cog.107.t:0 "关注刚果局势"
 
 cog.108.t:0 "刚果反殖民运动的兴起"
 
 cog.110.t:0 "刚果民族运动党赢得大选"
 cog.110.d:0 "刚果民族运动党在比属刚果自治后进行的首次大选中获胜，帕特里斯·卢蒙巴就任刚果第一任总理。"
 
 
