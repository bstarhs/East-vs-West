l_simp_chinese:
 fighter:0 "战斗机"
 AIR_TITLE_attacker:0 "攻击机"
 fighter_equipment_desc:0 "战斗机快速灵活，可以做很多工作。从争夺空中优势，保护你的轰炸机和拦截敌人的轰炸机。"
 cv_fighter:0 "战斗机"
 cv_fighter_equipment_desc:0 "战斗机快速灵活，可以做很多工作。从争夺空中优势，保护你的轰炸机和拦截敌人的轰炸机。"
 jet_fighter:0 "战斗机"
 jet_fighter_equipment:0 "战斗机"
 jet_fighter_equipment_desc:0 "战斗机快速灵活，可以做很多工作。从争夺空中优势，保护你的轰炸机和拦截敌人的轰炸机。"
 cas:1 "攻击机"
 CAS_equipment_desc:0 "攻击机可以对敌人的地面部队和设施进行攻击，以配合我方地面部队的进攻。"
 cv_cas:2 "攻击机 (Carrier)"
 cv_CAS_equipment_desc:0 "攻击机可以对敌人的地面部队和设施进行攻击，以配合我方地面部队的进攻。"
 nav_bomber:0 "反潜机"
 nav_bomber_equipment_desc:0 "反潜机可以在更广阔的海上范围内对敌人的舰队进行搜索和打击，包括对敌人潜艇部队的侦测和攻击。"
 cv_nav_bomber:1 "反潜机 "
 cv_nav_bomber_equipment_desc:0 "反潜机可以在更广阔的海上范围内对敌人的舰队进行搜索和打击，包括对敌人潜艇部队的侦测和攻击。"
 tac_bomber:0 "战术轰炸机"
 tac_bomber_equipment_desc:0 "战术轰炸机s are smaller fast bombers that can help out ground troops and bomb enemy buildings."
 jet_tac_bomber:2 "战术轰炸机"
 jet_tac_bomber_equipment:2 "战术轰炸机"
 jet_tac_bomber_equipment_desc:0 "战术轰炸机s are smaller fast bombers that can help out ground troops and bomb enemy buildings."
 heavy_fighter:0 "电战机"
 heavy_fighter_equipment_desc:0 "电战机s have long range and powerful weapons. They are good both for protecting bombers at range and intercept enemy bombers. Their lower agility however means that they will struggle against regular fighters."
 strat_bomber:0 "战略轰炸机"
 strat_bomber_equipment_desc:0 "战略轰炸机s attack enemy buildings and infrastructure, starving them of precious industry."
 jet_strat_bomber:2 "战略轰炸机"
 jet_strat_bomber_equipment:2 "战略轰炸机"
 jet_strat_bomber_equipment_desc:0 "战略轰炸机s attack enemy buildings and infrastructure, starving them of precious industry."
 transport_plane:0 "运输机"
 transport_plane_equipment_desc:0 "Delivers paratroopers to their destination."
 guided_missile:0 "火箭"
 fighter_equipment:0 "战斗机"
 cv_fighter_equipment:0 "舰载战斗机"
 strat_bomber_equipment:0 "战略轰炸机"
 rocket_interceptor_equipment:0 "火箭 Interceptor"
 rocket_interceptor_equipment_desc:0 "Short range interceptor powered by a chemical rocket engine."
 suicide_craft_equipment:0 "Suicide Craft"
 suicide_craft_equipment_desc:0 "Short range manned bomb powered by a chemical rocket engine."
 fighter_equipment_0:0 "WWII 战斗机"
 fighter_equipment_0_short:0 "战斗机"
 fighter_equipment_0_desc:0 "WWII 时期的单引擎螺旋桨战斗机。"
 fighter_equipment_1:0 "战斗机 I"
 fighter_equipment_1_short:0 "战斗机 I"
 fighter_equipment_1_desc:0 "WWII 末期出现的喷气式引擎得到广泛使用，战后各国都将研发喷气式战斗机。"
 fighter_equipment_2:0 "战斗机 II"
 fighter_equipment_2_short:0 "战斗机 II"
 fighter_equipment_2_desc:0 "喷气式战斗机将得到改进，使用更为先进的喷气式引擎核机体设计。"
 fighter_equipment_3:0 "战斗机 III"
 fighter_equipment_3_short:0 "战斗机 III"
 fighter_equipment_3_desc:0 "空空导弹核空地导弹的使用将让战斗机拥有更强的战斗力。"
 fighter_equipment_4:0 "战斗机 IV"
 fighter_equipment_4_short:0 "战斗机 IV"
 fighter_equipment_4_desc:0 "空空导弹核空地导弹的使用将让战斗机拥有更强的战斗力。"
 heavy_fighter_equipment:0 "电战机"
 heavy_fighter_equipment_1:0 "电战机 I"
 heavy_fighter_equipment_1_short:0 "电战机 I"
 heavy_fighter_equipment_1_desc:0 "Our bomber force needs escort protection from enemy fighters all the way to their targets and back. In order to provide this escort, we must design fighter aircraft with bomber range. Out of necessity these aircraft are larger, slower and less agile than light fighters, though they can carry significant armament."
 heavy_fighter_equipment_2:0 "电战机 II"
 heavy_fighter_equipment_2_short:0 "电战机 II"
 heavy_fighter_equipment_2_desc:0 "The war has taught us that our heavy fighter design is vulnerable to more nimble fighters, but quite good at the interception of enemy bombers due to heavy armament. This next design will focus on increased attack capability against enemy aircraft and even ground targets. Its speed and range will be improved as well."
 heavy_fighter_equipment_3:0 "电战机 III"
 heavy_fighter_equipment_3_short:0 "电战机 III"
 heavy_fighter_equipment_3_desc:0 "Though our heavy fighter force has shown adeptness in various roles, we must consider a new design that will enhance its ability relative to enemy fighters, as well as allow it to continue intercepting increasingly faster and better defended enemy bombers."
 strat_bomber_equipment_1:0 "战略轰炸机 I"
 strat_bomber_equipment_1_short:0 "战略轰炸机 I"
 strat_bomber_equipment_1_desc:0 "WWII 中，战略轰炸机展示出了强大的威力和攻击敌人后方城市、生产和经济命脉的重要性，战略轰炸将成为必不可少的战争能力。"
 strat_bomber_equipment_2:0 "战略轰炸机 II"
 strat_bomber_equipment_2_short:0 "战略轰炸机 II"
 strat_bomber_equipment_2_desc:0 "核武器的广泛使用是我们必须准备成为下一个核国家，而光有核武器是不够的，必须要让我们的轰炸机拥有投送核弹的能力。"
 strat_bomber_equipment_3:0 "战略轰炸机 III"
 strat_bomber_equipment_3_short:0 "战略轰炸机 III"
 strat_bomber_equipment_3_desc:0 "如果我们要成为核大国，我们还必须大大增加我们战略轰炸机的航程，使其具备洲际核打击能力。"
 jet_strat_bomber_equipment_1:0 "战略轰炸机 I"
 jet_strat_bomber_equipment_1_short:0 "战略轰炸机 I"
 jet_strat_bomber_equipment_1_desc:0 "如果我们要成为核大国，我们还必须大大增加我们战略轰炸机的航程，使其具备洲际核打击能力。"
 tac_bomber_equipment:0 "战术轰炸机"
 tac_bomber_equipment_0:0 "二战轰炸机"
 tac_bomber_equipment_0_short:0 "轰炸机"
 tac_bomber_equipment_0_desc:0 "It is widely believed that the next war will be won entirely by bombing the enemy to extinction. It is imperative that we begin designing our own bomber plane that is capable of carrying heavy payloads at adequate speed."
 tac_bomber_equipment_1:0 "战术轰炸机 I"
 tac_bomber_equipment_1_short:0 "Tac 轰炸机 I"
 tac_bomber_equipment_1_desc:0 "Medium bombers need to be versatile and fast, capable of fulfilling a range of roles. A twin-engined design, remaining relatively light, can continue to be of use for many years to come."
 tac_bomber_equipment_2:0 "战术轰炸机 II"
 tac_bomber_equipment_2_short:0 "Tac 轰炸机 II"
 tac_bomber_equipment_2_desc:0 "Heavier designs of tactical bombers can extend range, payload and speed while maintaining the planes' capacity to perform a wide variety of missions."
 tac_bomber_equipment_3:0 "战术轰炸机 III"
 tac_bomber_equipment_3_short:0 "Tac 轰炸机 III"
 tac_bomber_equipment_3_desc:0 "Taking a page from the advancements in fighter planes, unconventional materials and shapes can make new designs some of the fastest and best performing twin-engine planes ever built."
 guided_missile:0 "战术导弹"
 guided_ICBM:0 "战略彈道导弹"
 stealth_bomber_equipment:0 "隐形战斗机"
 stealth_bomber_equipment_short:0 "隐形战斗机"
 stealth_bomber_equipment_desc:0 "如果我们要成为核大国，我们还必须大大增加我们战略轰炸机的航程，使其具备洲际核打击能力。"
 
 transport_plane_equipment:0 "运输机 Plane"
 transport_plane_equipment_1:0 "运输机 Plane I"
 transport_plane_equipment_1_short:0 "运输机"
 transport_plane_equipment_1_desc:0 "§LPlanes used to transport troops on paradrop missions.§!"
 
 nav_bomber_equipment:0 "反潜机"
 cv_nav_bomber_equipment:0 "CV 反潜机"
 nav_bomber_equipment_1:0 "反潜机 I"
 nav_bomber_equipment_1_short:0 "反潜机 I"
 nav_bomber_equipment_1_desc:0 "Naval aviation will be vital in the coming decade to confront new developments in naval warfare, such as the increased importance of submarines. Seaplanes with capacity to work as dive bombers and recon vehicles will be of use."
 nav_bomber_equipment_2:0 "反潜机 II"
 nav_bomber_equipment_2_short:0 "反潜机 II"
 nav_bomber_equipment_2_desc:0 "New engine technology and aerodynamically refined designs will boost the speed and diving attack capability of naval planes significantly."
 nav_bomber_equipment_3:0 "反潜机 III"
 nav_bomber_equipment_3_short:0 "反潜机 III"
 nav_bomber_equipment_3_desc:0 "All-metal designs and powerful airbrakes allow for more complex naval aeronautics. The planes of the future will demand a larger crew to operate these advanced systems, however."
 
 CAS_equipment:0 "攻击机"
 cv_CAS_equipment:0 "反潜机"
 CAS_equipment_1:0 "攻击机 I"
 CAS_equipment_1_short:0 "攻击机 I"
 CAS_equipment_1_desc:0 "我们需要一种能够精确攻击地面的飞机。与我们的大型飞机相比，这些飞机的有效载荷较小，但它们能够通过扫射和俯冲轰炸来攻击和摧毁小目标。"
 CAS_equipment_2:0 "攻击机 II"
 CAS_equipment_2_short:0 "攻击机 II"
 CAS_equipment_2_desc:0 "Early war experiences have shown that increased speed, armor and maneuverability are necessary for CAS aircraft survivability against enemy fighters and ground fire. This next generation of ground attack aircraft will also utilize larger bombs, cannons and machineguns to inflict greater damage to their targets."
 CAS_equipment_3:0 "攻击机 III"
 CAS_equipment_3_short:0 "攻击机 III"
 CAS_equipment_3_desc:0 "The ever increasing capability of target AA and enemy interceptors require further evolution of our CAS aircraft. The new design incorporates increased engine power, airframe improvements for increased diving capability and protection, as well as even greater payloads."
 CAS_equipment_4:0 "攻击机 IV"
 CAS_equipment_4_short:0 "攻击机 IV"
 CAS_equipment_5:0 "攻击机 V"
 CAS_equipment_5_short:0 "攻击机 V"
 jet_fighter_equipment_1:0 "战斗机 I"
 jet_fighter_equipment_1_short:0 "战斗机 I"
 jet_fighter_equipment_1_desc:0 "Previous increases in speed pale in comparison to the introduction of the first jet fighters. While we have yet to learn how to best construct planes for these engines, regular fighter planes cannot compete."
 jet_fighter_equipment_2:0 "战斗机 II"
 jet_fighter_equipment_2_short:0 "战斗机 II"
 jet_fighter_equipment_2_desc:0 "New swept wing designs and lighter material choices will allow us to extend the range and speed of the revolutionary jet fighters even further."
 jet_tac_bomber_equipment_1:0 "战术轰炸机 I"
 jet_tac_bomber_equipment_1_short:0 "Tac 轰炸机 I"
 jet_tac_bomber_equipment_1_desc:0 "The advent of jet fighters necessitates bombers that can outrun or at least match their speed. First-generation medium bombers and bomber-fighters equipped with jet engines will fill this role."
 jet_tac_bomber_equipment_2:0 "战术轰炸机 II"
 jet_tac_bomber_equipment_2_short:0 "战术轰炸机 II"
 jet_tac_bomber_equipment_2_desc:0 "Not content with speed, future jet bombers will set altitude and range records, delivering payloads and performing reconnaissance on intercontinental missions."
 cv_nav_bomber_equipment_1:0 "舰载巡航导弹 I"
 cv_nav_bomber_equipment_1_short:0 "舰载轰炸机 I"
 cv_nav_bomber_equipment_1_desc:0 "An early naval bomber modified to launch from and land on aircraft carriers."
 cv_nav_bomber_equipment_2:0 "舰载巡航导弹 II"
 cv_nav_bomber_equipment_2_short:0 "舰载轰炸机 II"
 cv_nav_bomber_equipment_2_desc:0 "An improved naval bomber modified to launch from and land on aircraft carriers."
 cv_nav_bomber_equipment_3:0 "舰载巡航导弹 III"
 cv_nav_bomber_equipment_3_short:0 "舰载轰炸机 III"
 cv_nav_bomber_equipment_3_desc:0 "An advanced naval bomber modified to launch from and land on aircraft carriers."
 cv_CAS_equipment_1:0 "反潜机 I"
 cv_CAS_equipment_1_short:0 "反潜机 I"
 cv_CAS_equipment_1_desc:0 "An early close air support plane modified to launch from and land on aircraft carriers."
 cv_CAS_equipment_2:0 "反潜机 II"
 cv_CAS_equipment_2_short:0 "反潜机 II"
 cv_CAS_equipment_2_desc:0 "An improved close air support plane modified to launch from and land on aircraft carriers."
 cv_CAS_equipment_3:0 "反潜机 III"
 cv_CAS_equipment_3_short:0 "反潜机 III"
 cv_CAS_equipment_3_desc:0 "An advanced close air support plane modified to launch from and land on aircraft carriers."
 cv_fighter_equipment_0:0 "舰载战斗机"
 cv_fighter_equipment_0_short:0 "舰载战斗机"
 cv_fighter_equipment_0_desc:0 "舰载战斗机允许将战斗机部署到航空母舰上起飞作战。"
 cv_fighter_equipment_1:0 "舰载战斗机 I"
 cv_fighter_equipment_1_short:0 "舰载战斗机 I"
 cv_fighter_equipment_1_desc:0 "舰载战斗机允许将战斗机部署到航空母舰上起飞作战。"
 cv_fighter_equipment_2:0 "舰载战斗机 II"
 cv_fighter_equipment_2_short:0 "舰载战斗机 II"
 cv_fighter_equipment_2_desc:0 "舰载战斗机允许将战斗机部署到航空母舰上起飞作战。"
 cv_fighter_equipment_3:0 "舰载战斗机 III"
 cv_fighter_equipment_3_short:0 "舰载战斗机 III"
 cv_fighter_equipment_3_desc:0 "舰载战斗机允许将战斗机部署到航空母舰上起飞作战。"
 rocket_interceptor_equipment_1:0 "火箭 Interceptor I"
 rocket_interceptor_equipment_1_desc:0 "Short range experimental interceptor powered by an unreliable chemical rocket engine."
 rocket_interceptor_equipment_1_short:0 "火箭 Interceptor I"
 rocket_interceptor_equipment_2:0 "火箭 Interceptor II"
 rocket_interceptor_equipment_2_desc:0 "Short range interceptor powered by a slightly more reliable chemical rocket engine."
 rocket_interceptor_equipment_2_short:0 "火箭 Interceptor II"
 rocket_interceptor_equipment_3:0 "火箭 Interceptor III"
 rocket_interceptor_equipment_3_desc:0 "We have finally worked out most of the problems with the rocket engines and the 火箭 Interceptor is now a solid close range defender of facilities."
 rocket_interceptor_equipment_3_short:0 "火箭 Interceptor III"
 scout_plane:0 "侦察机"
 scout_plane_equipment_desc:0 "一种专门为照片侦察而开发的飞机。主要依靠速度和隐身来生存，在任何单挑中都会失败。"
 scout_plane_equipment:0 "侦察机"
 scout_plane_equipment_1:0 "侦察机 I"
 scout_plane_equipment_1_desc:0 "收集敌军动向情报和提供敌方海军部署报告是飞机自第一次在大战中部署以来的最初任务，现在仍然是一项重要任务。"
 scout_plane_equipment_2:0 "侦察机 II"
 scout_plane_equipment_2_desc:0 "科技的发展为侦察机带来了全新的升级，彩色照片、超音速飞行、超高空飞行和隐形技术都将大大加强侦察机的功能。"
 
