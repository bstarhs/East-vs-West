 INS_water_construct:0 "修建供水设施"
 INS_water_construct_desc:0 "伊朗60%以上的土地都极为干旱，随着我国农业的发展，古老的坎儿井已不足以满足灌溉需要，我们需要现代化的水利系统来支持农业生产。"
 INS_nature_protect:0 "保护自然资源"
 INS_nature_protect_desc:0 "我们需要立法保护森林与河流，它们才能保护我们珍贵的水资源。"
 
 INS_buy_plane:0 "购买战斗机"
 INS_buy_plane_desc:0 "我们目前没有自行生产战斗机的能力，但我们可以向友好国家购买现成的战斗机来建立我们的空军。"
 INS_jet_1:0 "发展喷气机"
 INS_jet_1_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 INS_jet_2:0 "发展二代战斗机"
 INS_jet_2_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 INS_bomber:0 "发展轰炸机"
 INS_bomber_desc: "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 INS_transfer:0 "发展运输机"
 INS_transfer_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 INS_anti_air:0 "发展防空设备"
 INS_airbase_1:0 "扩大空军基地 I"
 INS_airbase_1_desc:0 "我们需要机场和基础设施来承载我们的空军。"
 INS_airbase_2:0 "扩大空军基地 II"
 INS_airbase_2_desc:0 "我国的空军力量不断壮大，对空军设施的要求也越来越高。"
 
 INS_light_ships:0 "发展轻型舰艇"
 INS_light_ships_desc:0 "我们的海军刚刚起步，至少需要一些护卫舰和驱逐舰来保护我们的领海。"
 INS_medium_ships:0 "发展中型舰艇"
 INS_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 INS_heavy_ships:0 "发展大型舰艇"
 INS_heavy_ships_desc:0 "我们的海军已经成长壮大，我们需要发展可以搭载更多设备和飞机的大型舰艇来强化作战能力。"
 INS_buy_ship:0 "购买水面舰艇"
 INS_buy_ship_desc:0 "我们目前还没有建造舰船的能力，但我们可以向其他国家购买退役的舰艇。"
 INS_buy_submarines:0 "购买潜艇"
 INS_buy_submarines_desc:0 "我们目前还没有建造潜艇的能力，但我们可以向其他国家购买退役的潜艇。"
 INS_submarines:0 "发展潜艇"
 INS_submarines_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 INS_naval_base_hormuz:0 "霍尔木兹海军基地"
 INS_naval_base_hormuz_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 INS_naval_base_khozestan:0 "胡齐斯坦海军基地"
 INS_naval_base_khozestan_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 INS_naval_base_north:0 "里海海军基地"
 INS_naval_base_north_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 INS_marines_focus:0 "发展两栖部队"
 INS_marines_focus_desc:0 "擅长两栖作战的部队越来越不可或缺。临时拼凑的手段、装备已经成为历史，我方海军陆战兵现在已接受相关训练并拥有专属登陆舰船支持。"
 INS_minor_submarines:0 "微型潜艇"
 
 INS_buy_weapons:0 "购买外国武器"
 INS_buy_weapons_desc:0 "我国的军事工业目前还很落后，没有自己生产军火的能力，但我们可以向其他国家购买退役的武器。"
 INS_armors:0 "发展装甲部队"
 INS_armors_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 INS_mechanized:0 "发展机械化部队"
 INS_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 INS_airborn:0 "发展空降部队"
 INS_airborn_desc:0 "飞机航程和载荷的发展开辟了许多可能性。运输机可以在敌人战线的大后方投下一整个师的部队，在那里他们可以造成严重破坏。"
 INS_military_system:0 "完善军事体制"
 INS_military_system_desc:0 "通过设立完善的军事体制、军官制度、指挥系统和军事学院，我们才能把落后的民兵组织建设成为一支有战斗力的职业军队。"
 INS_develop_weapons:0 "成立装备发展部"
 INS_develop_weapons_desc:0 "从步兵的头盔和背心，再到坦克上的火控系统和动力系统，先进的作战装备往往主导着战场。"
 
 INS_usa_intel:0 "西方情报援助"
 INS_usa_intel_desc:0 "我们应当邀请美国情报部门来为我国提供情报援助。虽然这有让我国被美国渗透控制的风险，但利大于弊。"
 INS_cooperate:0 "西方军事援助"
 INS_cooperate_desc:0 "我们可以请求军事政府为我们提供军事援助，包括援助军事装备和军事顾问。"
 
 INS_Pro_Soviet:0 "亲近社会主义阵营"
 INS_Pro_Soviet_desc:0 "我们都是社会主义国家，并紧密地团结在一起。在莫斯科会议期间，我们制定了一个统一的纲领。在该统一纲领的基础上我们工作得比较轻松。"
 INS_Communist:0 "社会主义之路"
 INS_Communist_desc:0 "落后的封建时代已经过去，我们人民将迎来更加先进、民主的社会制度。社会主义有利于生产力的发展，实现社会平等和民主进步。"
 INS_people_republic:0 "民主共和国"
 INS_people_republic_desc:0 "落后的封建时代已经过去，我们人民将迎来更加先进、民主的社会制度。社会主义有利于生产力的发展，实现社会平等和民主进步。"
 
 INS_soviet_mode:0 "苏联模式"
 INS_soviet_mode_desc:0 "在斯大林模式的指导下，苏联人民不仅在短短十年内把俄罗斯变成了工业强国，而且还战胜了法西斯。我们要摆脱贫困，进入工业化和现代化，就必须学习苏联人民的先进经验。"
 INS_supress:0 "镇压反革命"
 INS_supress_desc:0 "一些敌视社会主义新伊朗的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。"
 INS_collective:0 "农业集体化"
 INS_collective_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 INS_anti_muslim:0 "镇压宗教"
 INS_nkvd:0 "内务委员会"
 INS_nkvd_desc:0 "我们要建立专门的机构，调查、监视、逮捕反革命分子和帝国主义间谍。"
 INS_pioneers:0 "少年先锋队"
 INS_pioneers_desc:0 "少年先锋队是共产主义事业的接班人，培养少先队就是培养党和社会主义的未来。"
 INS_worship:0 "党的权威"
 INS_worship_desc:0 "我国当前政党众多，但大都代表着资本家、政治投机者甚至敌对分子的利益。我们要建设一个无产阶级所有、代表劳动人民的人民民主国家，共产党就必须领导一切。"
 INS_people_army:0 "人民军队"
 INS_nationalized:0 "企业国有化"
 INS_plan:0 "五年计划"
 INS_plan_desc:0 "我们将开始实行第一个五年计划，以快速改善我国的落后局面。"
 
 INS_output_revolution:0 "输出革命"
 INS_output_revolution_desc:0 "英美帝国主义和殖民主义已经遭到全世界热爱和平的革命人民批判，我们将支持世界人民反帝斗争！"
 INS_arabs_revolution:0 "支持阿拉伯革命"
 INS_arabs_revolution_desc:0 "阿拉伯伊斯兰教反动势力、君主专制反动朝廷和军事独裁当局统治黑暗，左派势力已经掀起了革命斗争，我们应当支持他们！"
 INS_pak_revolution:0 "支持巴基斯坦和阿富汗革命"
 INS_pak_revolution_desc:0 "巴基斯坦和阿富汗的伊斯兰教反动势力、君主专制反动朝廷和军事独裁当局统治黑暗，左派势力已经掀起了革命斗争，我们应当支持他们！"
 INS_hind_revolution:0 "支持印度革命"
 INS_hind_revolution_desc:0 "印度左派势力在山地和森林之间发起游击战争，反抗国大党的独裁政权，我们应当支持他们！"
 INS_turk_revolution:0 "支持土耳其革命"
 INS_turk_revolution_desc:0 "土耳其左派势力在山地和森林之间发起游击战争，反抗共和人民党和军事政府的独裁政权，我们应当支持他们！"
 INS_israeli_revolution:0 "支持以色列革命"
 INS_israeli_revolution_desc:0 "以色列共产党正在与锡安主义当局进行不懈斗争，我们应当支持他们！"
 
