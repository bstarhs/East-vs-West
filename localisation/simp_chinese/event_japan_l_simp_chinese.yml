 jap.14.t:0 "鸠山一郎提议修改宪法" 
 jap.14.d:0 ""
 jap.14.a:0 ""
 
 jap.15.t:0 "浅沼稻次郎访问中国"
 jap.15.d:0 "为了寻找未来日本的出路，日本社会党委员长浅沼稻次郎前往北京，访问了当时还未同日本建交的中华人民共和国，并与毛泽东会面。"
 jap.15.a:0 ""
 
 jap.16.t:0 "日本希望与我国进行外交对话"
 jap.16.d:0 "日本希望派出外交代表团访问莫斯科，就两国外交关系正常化一事进行谈判。"
 jap.16.a:0 ""
 
 jap.17.t:0 "日本首相鸠山一郎辞职"
 jap.17.d:0 "日本首相兼自民党总裁鸠山一郎表示，自己经过考虑，决定从政界引退，其领导下的内阁将在不久后进行总辞。自由民主党将举行总裁选举，以决定下一任总裁和首相的人选。"
 jap.17.a:0 ""
 jap.17.b:0 ""
 jap.17.c:0 "持续关注"
 
 jap.18.t:0 "石桥湛山辞职"
 jap.18.d:0 "石桥湛山先生表示，自己因身体不适，已决定因病辞职。自由民主党将举行总裁选举，以决定下一任总裁和首相的人选。"
 jap.18.a:0 ""
 jap.18.b:0 ""
 
 jap.19.t:0 "日本自卫队成立"
 jap.19.d:0 "来自东京的消息，一支大约五万人的武装部队，今天在东京正式举行的成立仪式，日本自卫队宣告诞生，内阁总理大臣[JAP.GetLeader]向防卫厅总监林敬三颁发了象征指挥权的权杖和军衔，这意味着日本的再武装化已成为既成事实。这毫无疑问将成为亚洲的头条新闻，中共和苏联政府高度警惕这只新成立的武装部队，日本左翼势力也表达了强烈的反对，而美国则表达了祝贺，并希望自卫队成为保护自由亚洲的一支不可缺少的力量。"
 jap.19.a:0 ""
 
 jap.20.t:0 "修改宪法"
 jap.20.d:0 ""
 jap.20.a:0 ""
 
 jap.21.t:0 "新《日美安保条约》的公布"
 jap.21.d:0 "在巨大的争议声之下，日本首相[JAP.GetLeader]执意续订和扩大与美国签订的《日美安保条约》，目前条约的草案已在华盛顿的新闻发布会中公布。\n根据该条约，占领日本的盟军之一的美军改为“驻日美军”，继续驻扎在日本。"
 jap.21.a:0 ""
 
 jap.22.t:0 "反安保条约运动全面爆发！"
 jap.22.d:0 "岸信介内阁与美国共同公布的《日美安保条约》修订内容引发全国性政治地震。尽管新条约删除了旧版中美军可镇压日本内乱的条款，并明确规定了事前协商机制，但仍遭遇左右两翼罕见的联合反对。\n左翼进步人士在日比谷公园集会，高举"不让日本成为亚洲兵工厂"的标语。与此同时，右翼团体则在国会南门抗议，民族主义者怒吼"冲绳仍是美国殖民地"，要求彻底摆脱从属地位。\n来自全国134所大学的5.7万学生包围国会议事堂，人群延绵至霞关街区。示威者用绳索拖拽象征"日美同盟"的纸糊巨人，高呼"捍卫和平宪法"。警方出动高压水枪试图驱散人群，但学生团体手挽手组成人墙。"
 jap.22.a:0 ""
 jap.22.b:0 ""
 
 jap.23.t:0 "桦美智子事件"
 jap.23.d:0 "轰轰烈烈的日本安保条约运动出现第一名死者!东京大学女大学生桦美智子在与警察的冲突中意外死亡!尽管警方坚称美智子是自己摔倒受伤不治身亡的，但在愤怒的群众看来，美智子无疑死于警察殴打。美智子的死亡更加点燃了示威者的怒火。"
 jap.23.a:0 ""
 
 jap.24.t:0 "《日美安保条约》的修改问题"
 jap.24.d:0 "修改《日美安保条约》的问题引起日本社会舆论关注，许多日本民众和各在野党担心，《条约》的修改将使得日本卷入美国与苏联的世界大战当中。\n日本的右翼保守派则不满国家主权被美国控制，要求彻底摆脱条约和美日同盟。因此，即使修订后的条约明显优于原条约，日本左右派都团结起来，反对条约。"
 
 jap.25.t:0 "《安保条约》表决之日"
 jap.25.d:0 "新《日美安保条约》将在今天正式递交日本国会进行表决。强烈反对《条约》的日本社会党虽然没有控制国会多数席位，但他们通过辩论、质询的方式，拖延时间，试图使得法案无法在一个月内通过而自动作废。"
 
 jap.26.t:0 "日本国会发生暴力事件！"
 jap.26.d:0 "在《日美安保条约》即将因为没有及时通过而作废时，岸信介首相和清濑一郎议长突然宣布，将国会议案审议时间，强行延长五十天！这引起了社会党等国会议员的强烈不满，国会议事厅内爆发激烈的肢体冲突。议长叫来警察将反对议案的议员强行驱逐，只留下的自民党议员，随后，安保条约的议案在反对党不在场的情况下，被口头宣布获得通过！此事立刻引起日本民众更为激烈的愤怒，国会大楼外的示威游行进一步扩大。"
 
 jap.27.t:0 "美国驻日大使遭示威者包围！"
 jap.27.d:0 "艾森豪威尔的新闻秘书詹姆斯·哈格提抵达东京羽田机场，为即将到来的访日行程做提前准备，时任美国驻日本大使道格拉斯·麦克阿瑟二世到机场接待，两人乘坐黑色轿车离开。他们故意开车经过抗议者的聚集地，希望借汽车被抗议者包围来激励日本政府更加严厉地镇压抗议活动。\n果然，示威者很快便察觉到那是驻日大使的专车，于是开始包围着汽车。然而，他的行为适得其反，情况开始失控。有人开始砸碎车窗和尾灯，示威者爬到车顶，高呼反美口号及唱抗议歌曲，事件持续近一个多小时，两人被重重包围无法脱身。最终美国海军陆战队派出军用直升机，在人群的包围中接走麦克阿瑟及哈格提，这影像被世界各地的新闻广泛传播。"
 
 jap.28.t:0 "《日美安保条约》正式生效！"
 jap.28.d:0 "条约自动生效的前一天。数十万的抗议者包围了国会，希望能在最后一刻以某种方式阻止该条约。抗议者一直留在原地，直到午夜后条约自动生效。"
 
 
