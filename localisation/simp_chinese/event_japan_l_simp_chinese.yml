 jap.42.t:0 "神武景气"
 jap.42.d:0 "日本经济迎来战后全面复苏，本年度GDP增长率突破10%，创下历史新高，标志着"神武景气"时代的到来。随着朝鲜战争特需的刺激和产业政策调整，日本制造业正以惊人速度发展。\n统计数据显示，钢铁产量较1950年增长3倍，造船业订单量跃居世界第一，半导体、家电等新兴产业开始崭露头角。东京、大阪等工业带灯火通明，生产线24小时运转。\n在横滨港，满载缝纫机、收音机的货轮正驶向欧美市场。三菱、日立等企业研发中心里，工程师们正在完善晶体管技术。百货公司橱窗里，国产电饭煲和电视机引发抢购热潮。\n内阁官房长官表示，"神武景气"证明日本已完全走出战败阴影。随着国民收入倍增计划的实施，这个东亚岛国正向着经济大国的目标稳步迈进。"
 jap.42.a:0 "啊 北国的春天已来临。"
 
 jap.43.t:0 "岸信介下台"
