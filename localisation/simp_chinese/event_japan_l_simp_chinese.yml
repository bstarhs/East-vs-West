 jap.68.t:0 "田中角荣辞职" 
 jap.68.d:0 "由于石油危机的爆发，田中角荣内阁的日本列岛改造论计划宣布失败，而他们也无法应对不断恶化的通货膨胀。田中最终选择辞职，[JAP.GetLeader]成为新的内阁总理大臣。"
