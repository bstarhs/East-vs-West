 jap.270.t:0 "日本镇压学生运动"
 jap.270.d:0 "来自东京的突发消息!在日本首相岸信介的命令下，日本自卫队的数支部队驶入东京。日本当局宣布戒严，随后，自卫队开始采取武力镇压反对运动。示威者向自卫队投掷石头，燃烧瓶和自制武器进行抵抗，大半个东京已经沦为战场!"
 jap.270.a:0 ""
 
 jap.271.t:0 "日本内战爆发"
 jap.271.d:0 "岸信介政府镇压左翼运动的行为最终引发了战争！全日本各地的左派势力蜂拥而起，闯入军械库抢夺武器发起暴动，并占领了许多地区的政府部门，日本内战全面爆发！"
 jap.271.a:0 ""
 
 jap.278.t:0 "日本戒严政府成立"
 jap.278.d:0 "日本东京的示威游行遭到残酷镇压，数百名示威者遭到自卫队开枪射杀。在基本控制住局势后，岸信介宣布全国进入紧急状态，国会解散，东京戒严，大量反对派政治家被逮捕。"
