l_simp_chinese:
 jap.1.t:0 "旧金山和约"
 jap.1.d:0 "美国与日本代表在旧金山签订了《对日和平条约》此条约宣告日美战争的正式结束，以及对日本军事占领的正式结束。但另一方面，条约宣布承认日本现政权，引起了苏联、中共以及日本国内左派势力的不满。"
 jap.1.a:0 ""
 
 jap.2.t:0 "东京审判结束"
 jap.2.d:0 "经过长达两年的审判，远东国际军事法庭宣布，针对东条英机、土肥原贤二、板垣征四郎等14名日本A级战犯的审判宣告结束。大部分甲级战犯被宣判死刑。"
 jap.2.a:0 ""
 
 jap.3.t:0 "战犯被释放"
 jap.3.d:0 ""
 jap.3.a:0 ""
 
 jap.4.t:0 "日本国宪法"
 jap.4.d:0 "日本天皇裕仁签署颁布了新的《日本国宪法》，该宪法宣布日本将实行民主的君主立宪制度，保障人权，最重要的是，彻底放弃该国的战争权和军队武装。"
 jap.4.a:0 "相信能够推进日本民主化"
 
 jap.5.t:0 "1947年议会选举"
 jap.5.d:0 "日本迎来《日本国宪法》颁布后的首次议会选举，这是日本在战后民主化进程中民众首次真正行使普选权利。由吉田茂等保守派领导下的自由党，与片山哲领导下的日本社会党展开激烈角逐。\n选举不仅关乎政权归属，更将检验日本能否真正告别军国主义、确立政党政治与和平发展的新体制。选民在寒风中排队投票的场景，成为这个国家走向民主的生动写照。"
 jap.5.a:0 ""
 jap.5.b:0 ""
 
 jap.6.t:0 "片山哲内阁辞职"
 jap.6.d:0 "片山哲内阁成立之后诸事不顺，来自党内、党外和美国的一系列压力使他们难以执行政策，片山首相宣布辞职，由日本自由党的芦田均接任首相。"
 jap.6.a:0 ""
 
 jap.7.t:0 "造船工业丑闻"
 jap.7.d:0 "来自东京的消息，日本媒体曝光了一则涉及日本政府高层内部的巨大贿赂丑闻。日本造船业界为了争取政府在税收和政策上的优待，向首相吉田茂的亲信、自由党干事长佐藤荣作行贿2000万日元。事件曝光后，自由党政府试图保住佐藤，引发了以社会党为首的在野党，和自由党内部反吉田派系的极大不满。自由党另一领袖鸠山一郎自称要脱离自由党，并另组新党，吉田内阁摇摇欲坠。"
 jap.7.a:0 ""
 
 jap.8.t:0 "吉田茂辞职"
 jap.8.d:0 "在造船业行贿事件带来的巨大压力下，吉田茂首相被迫辞职，第二次吉田内阁宣布倒台，自由党将召开内部会议，选举出新任的自由党总裁兼日本首相。"
 jap.8.a:0 ""
 
 jap.9.t:0 "治安维持法"
 jap.9.d:0 "美国控制下的日本占领司令部公布了《治安维持法》，以强硬手段镇压日益壮大的日本共产党和其他左翼势力。"
 jap.9.a:0 ""
 
 jap.10.t:0 "昭和电工丑闻"
 jap.10.d:0 "日本媒体曝光了政府的一项丑闻，昭和电工公司为了获得来自日本政府的贷款，向多名官员行贿近7000万日元，以芦田均为首相的社会党、民主党、国民协同党三党联合内阁被迫辞职，吉田茂领导下的民主自由党作为最大在野党上台执政。"
 jap.10.a:0 ""
 
 jap.11.t:0 "自由民主党成立"
 jap.11.d:0 "随着以日本社会党为首的日本左派不断壮大，保守派和右派势力意识到了联合起来的重要性。在吉田茂、岸信介和绪方竹虎等右派政客的支持下，日本自由党与日本民主党宣布合并为自由民主党，这将成为未来日本政坛上最大的保守派政党。"
 jap.11.a:0 ""
 
 
 
 
