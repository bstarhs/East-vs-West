 jap.71.t:0 "1978总裁选举"
 jap.71.d:0 "自民党总裁选举即将开始。根据现任首相福田赳夫先前与自民党月曜派领袖大平正芳的协议，在福田完成第一届首相任期后，大平将接任党首。然而到了诺言实现的的一天，福田却犹豫了。"
 jap.71.a:0 "福田应该继续担任党首和内阁总理。"
 jap.71.b:0 "党首之位应该交给大平。"

