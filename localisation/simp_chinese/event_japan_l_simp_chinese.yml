 jap.61.t:0 "《中日联合声明》"
 jap.61.d:0 "在中日外交官完成谈判之后，中华人民共和国与日本正式发布了联合声明，宣布日本断绝与中华民国的外交关系，正式与中华人民共和国建交。日本政府就过去的战争罪行向中国道歉，而中国则为了两国关系放弃战争赔偿。\n中华民国当局对此事显然大为光火，但他们仍然拒绝就此事发表评论。"
