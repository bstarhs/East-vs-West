 jap.55.t:0 "佐藤荣作辞职"
 jap.55.d:0 "尼克松总统访华的消息震惊了全世界。佐藤首相意识到他以前对中国的敌对政策是一个重大错误。他写信给中国总理周恩来，希望推动中日建交，但中国政府认为佐藤是骗子，拒绝了。佐藤在自民党的声望下降，最后被迫辞职。自民党其他高层开始角逐新总统，显然中日复交已成为角逐的重要内容。"
