 jap.300.t:0 "熊本县水俣市发生不明原因水污染事件"
 jap.300.d:0 "近日，日本熊本县水俣市渔民向媒体披露，当地水域正发生一场令人触目惊心的生态灾难。水俣湾海面突然出现大规模鱼群离奇死亡现象，无数鱼尸随着潮水漂浮聚集，空气中弥漫着浓烈的腐臭味，令沿岸居民头晕恶心。\n更为诡异的是，当地大量猫狗等家养动物也相继出现原因不明的中毒症状，并陆续死亡。这系列异常现象已引发居民对生活环境安全的深切担忧。目前尚无人能明确解释这场突发灾变的根源，当地渔业已遭受严重打击。有关方面正对水质及生物样本进行紧急检测，试图揭开这起生态谜团背后的真相。"
 
 jap.301.t:0 "水俣市爆发大规模居民汞中毒事件"
 jap.301.d:0 "水俣市在大量的鱼类因不明污染而死亡后，本月首次接报居民中毒死亡。来自入江村的小女孩田中静子成为第一位患病者，出现了关节变形、浑身抽搐的症状，被送至窒素株式会社附属医院，但病况急速恶化，一个月后双眼失明，全身痉挛，不久后死亡。死者的两岁妹妹田中实子也罹患相同的病症，不久又发现许多村民都有类似问题，且患者多为渔民家庭出身。\n医师细川一认为事态严重，向官方提出正式报告，并将这种怪病称为“水俣奇病”。日本学者在1956年8月发现水俣湾的海水中有污染物质，因此研究人员调查的矛头指向窒素株式会社。"
 
 jap.302.t:0 "水俣汞中毒事件被证实为工厂排放所致"
 
 jap.303.t:0 "水俣市民与新日本窒素公司爆发冲突"
 jap.303.d:0 "水俣市的污染危机持续恶化并酿成惨剧。近日已有多名当地居民在出现手足麻痹、言语障碍等严重神经症状后，送医不治身亡。不断攀升的死亡数字，将这座沿海小镇推入公共卫生灾难的深渊。\n经媒体深入调查与医疗机构追踪曝光，这场持续数年的生态与健康危机的源头，终于指向位于水俣湾沿岸的“新日本氮肥公司”旗下化肥工厂。据信，该工厂在生产过程中长期大量排放含汞废水，这些剧毒物质在海水和鱼贝类体内富集，最终通过食物链导致居民罹患怪病——“水俣病”。\n消息传开，群情激愤。大批受害居民与死者家属自发聚集，包围了这家被视为“死亡源头”的工厂，要求工厂立即停止排污并承担责任。现场气氛紧张，民众与工厂安保人员形成对峙，冲突一触即发。一场由工业污染引发的生存抗争，正迫使日本社会直面经济高速增长背后的沉重代价。"
 
 
 
