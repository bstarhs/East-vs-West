 jap.86.t:0 "浅沼稻次郎遇刺" 
 jap.86.d:0 "来自东京的突发消息！日本社会党领袖浅沼稻次郎在参加竞选活动时，遭到右翼分子刺杀！\n浅沼稻次郎在日本东京日比谷公会堂参加自民、社会、民社三党党首选前演讲会。下午3时，浅沼稻次郎上台准备发表主题为“拥护议会制度”的演讲。此时会场中的右翼成员开始爆发不满，会场嘈杂一片。随后会场中爆发掌声并突然安静下来，浅沼亦趁此机会开始发表批判自民党选举政策的演说。\n3时5分左右，当浅沼说道“选举的时候就故意不提国民讨厌的政策，一旦占领了多数就……”时，17岁的大日本爱国党党员山口二矢忽然冲上讲台，用刀刃长约33公分的日本刀刺入浅沼稻次郎的胸部两次，第一次便刺穿其主动脉使其几乎当场毙命。\n浅沼于3时40分在日比谷医院正式确认死亡。整个行凶过程的声响通过广播传到全国，而NHK综合频道亦于3时21分中断棒球比赛的直播来播送此事件的录像带而使此事被数百万观看直播的电视观众所目睹。山口则被当场擒获。"
 jap.86.a:0 ""

 jap.90.t:0 "成田机场建设遭到阻挠" 
 jap.90.d:0 ""
 jap.90.a:0 ""

 jap.91.t:0 "成田机场建设工地爆发激烈冲突！" 
 jap.91.d:0 "日本东京郊外的三里冢地区，日本警察机动队与由当地居民和左翼团体组成的“三里塚芝山連合空港反対同盟”爆发了激烈的流血冲突。自从日本政府为了建设成田机场，不顾机场给附近居民带来的危害而强制实行，甚至没收当都居民土地以来，得到左翼团体支持的反对组织便在机场周围进行了长期的阻挠。今日，日本政府决定派出警察强制驱逐反对派，反对派遂在机场工地周围建立简单建筑进行对抗。经过激烈冲突，警察驱散了反对派，但造成了三人死亡，超过七百人被捕，这是二战后造成最严重后果的群众运动。零散的反对运动仍然存在，反对派表示会和政府带来的不公斗争到底。"
 jap.91.a:0 ""

 jap.92.t:0 "成田机场建设工地爆发激烈冲突！" 
 jap.92.d:0 "“三里塚芝山連合空港反対同盟”再次在成田机场一带与警察爆发激烈冲突。"
 jap.92.a:0 ""

 jap.94.t:0 "日本东京爆发兵变！" 
 jap.94.d:0 "来自东京的图发消息！驻扎在日本东京的日本自卫队突然闯入市区，控制了日本的政治中心霞关地区，挟持了大量政府高官，并宣布发起新一轮的“维新”。这些兵变自卫队的头目是三岛由纪夫，一个鼓吹复兴武士道和日本帝国的极右翼文学家，他通过自己在自卫队内的熟人潜入基地并煽动了叛乱。"
 jap.94.a:0 "疯子！"

 jap.95.t:0 "泡沫经济破裂" 

 jap.96.t:0 "日本东京发生投毒抢劫事件" 
 jap.96.d:0 "昨日下午3时许，一名身着厚生省防疫制服的中年男子闯入东京帝国银行椎名町支店，宣称附近爆发痢疾需紧急服药预防。在16名银行职员饮下其提供的"防疫药水"后，该男子趁众人昏迷之际劫掠现金支票共计18万日元，随后消失于暮色中。\n警方赶到时发现12人当场死亡，4人送医后不治。幸存者昏迷前描述，嫌犯操标准东京口音，携带印有假公文的皮革包。此案发生在盟军总司令部（GHQ）管制敏感期，驻日美军宪兵已介入调查。警视厅特别搜查本部发现，作案手法与1947年3月发生的类似未遂案件高度吻合。\n《朝日新闻》头版刊登社论质问："这是否证明旧军国主义毒药研究仍在暗中流传？"民间传言指向三种可能：原731部队成员流窜作案、极左翼团体恐怖活动，甚至GHQ情报部门暗中操纵。而麦克阿瑟司令部仅发表"深感遗憾"的简短声明。"
 jap.96.a:0 ""

 jap.101.t:0 "日本帝国的重建" 

 jap.102.t:0 "日本社会党内阁成立" 
 jap.102.d:0 "日本议会迎来国会改选，在战后日本左翼运动崛起的背景下，偏左的日本社会党借助工人阶级支持成为国会第一大党，片山哲出任日本首相。"
 jap.102.a:0 ""
 
 jap.103.t:0 "泡沫经济开始" 
 jap.103.d:0 "日本议会迎来国会改选，在战后日本左翼运动崛起的背景下，偏左的日本社会党借助工人阶级支持成为国会第一大党，片山哲出任日本首相。"
 jap.102.a:0 ""
 
 jap.104.t:0 "美国政府代表与日本右翼政客接触" 
 
 jap.105.t:0 "美国政府代表与日本社会党右派接触" 
 
 jap.106.t:0 "美国政府代表与熊泽宽道接触" 
 jap.106.d:0 "美国的日本占领政府今日与一名叫熊泽宽道的日本政治家见面，熊泽自称日本南朝皇室的后裔，他的家族在公元14世纪被夺取了天皇王位，熊泽宽道因此自称日本真正的合法天皇。二战结束后，裕仁天皇的威望受到重大打击，熊泽因此开始参与政治活动，要求美国政府逮捕并审判裕仁，同时支持自己成为新的天皇。" 
 
 jap.107.t:0 "美国政府提出重新武装日本" 
 
 jap.108.t:0 "美国政府提出日本经济恢复计划" 
 
 jap.110.t:0 "铁道工人发起总罢工" 
 jap.110.d:0 "铁道工人在东京等地发起罢工示威游行，要求改善工人待遇。" 
 
 jap.111.t:0 "日本政府宣布增加铁道工人福利" 
 jap.111.d:0 "在罢工和示威游行压力下，日本政府同意了铁路工人有关改善待遇和政治权利的一系列要求。" 
 
 jap.112.t:0 "日本警察驱散工人罢工" 
 jap.112.d:0 "日本警察暴力驱散了进行示威游行要求改善待遇的铁路工人，双方爆发激烈的冲突。" 
 
 jap.113.t:0 "日本政府颁布《反托拉斯法》" 
 jap.113.d:0 "日本政府在美国要求下，颁布了《反托拉斯法》，对三菱、三井等大财阀进行了拆解。" 
 
 jap.114.t:0 "日本政府颁布《教育基本法》" 
 jap.114.d:0 "日本政府颁布《教育基本法》，对教育系统进行全面改革，除了保障所有公民平等的义务教育权力，也以此清除了教育系统中的军国主义和共产主义分子。" 
 
 jap.115.t:0 "日本政府颁布《国家公务员法》" 
 jap.115.d:0 "日本政府颁布《国家公务员法》，宣布禁止公务员参与政治活动，并将有军国主义和共产主义倾向的公务员开除。" 
 
 jap.116.t:0 "日本国有铁道大规模裁员" 
 jap.116.d:0 "由于经营不善和财政告急，日本国有铁道不得不宣布裁撤大量员工。" 
 
 jap.117.t:0 "日本官员下山定则离奇死亡" 
 jap.117.d:0 "日本铁道部门官员下山定则在离奇失踪数日后，其尸体在铁路旁被发现，法医认为其死于火车碾压。下山定则之死引起了日本社会的高度关注和讨论，因为下山前不久拒绝了政府有关铁路部门裁员的要求。右派和左派都认为其死于另一方的报复。" 
 
 jap.118.t:0 "日本东京发生列车出轨事故" 
 jap.118.d:0 "一通列车行驶至日本东京多摩的三鹰町时，划出轨道冲向居民区，造成严重伤亡。日本政府内的右翼势力认为其是共产主义者故意破坏所致。" 
 
 jap.119.t:0 "日本政府逮捕多名左翼人士" 
 jap.119.d:0 "日本警察暴力驱散了反对右翼政府，要求改善工人待遇的示威游行，多名示威者受伤或被捕。" 
 
 jap.120.t:0 "日本福岛发生列车侧翻事故" 
 jap.120.d:0 "一通列车行驶至日本东京福岛县松川市时侧翻，造成严重伤亡。日本政府内的右翼势力认为其是共产主义者故意破坏所致。" 
 
 jap.121.t:0 "日本津轻海峡发生沉船事故" 
 
 jap.122.t:0 "日本渔船第五福龙丸号遭辐射袭击" 
 jap.122.d:0 "来自东京的消息，一艘名为第五福龙丸号的日本渔船，在太平洋进行捕鱼作业时，遭到来源不明的热辐射袭击，船员遭受热辐射后出现了不良症状，当船只艰难支撑到返回日本时，大部分船员已奄奄一息，日本政府进行了紧急救助，并将渔船回收。" 
 
 jap.123.t:0 "第五福龙丸号渔民死亡" 
 jap.123.d:0 "第五福龙丸号的无线电通讯员久保山爱吉死于肝功能失常，其余船员也符合热辐射影响的特征。第五福龙丸号引起日本社会各界广泛关注，许多日本人认为，船员是收到了美国在太平洋进行的核试验导致的核污染影响。" 
 
 jap.124.t:0 "第五福龙丸号事件引起媒体广泛关注" 
 jap.124.d:0 "第五福龙丸号船员死于辐射的事件引起世界各国媒体的关注，毫无疑问，这艘渔船的船员是第二次世界大战结束后，又一批的核武器受害者。许多本就反对核武器发展的社会团体群情激愤，强烈批评核武器的无序扩张，呼吁世界各国反对核武器的开发和制造。" 
 
 jap.125.t:0 "日本金阁寺发生纵火事件" 
 jap.125.d:0 "日本京都古寺金阁寺今日凌晨发生火灾，这座有五百年历史的古寺尽管经过消防员尽力灭火，但还是被彻底烧毁，室町幕府的第三代将军足利义满的木像，观音菩萨像和如来佛祖像以及众多古本佛经被焚毁。\n警方发现寺院内的僧人林承贤在寺院失火后失踪，目前案件正在调查。" 
 
 
 jap.140.t:0 "日本与苏联进行外交接触" 
 jap.140.d:0 "日本外交代表团近日抵达苏联首都莫斯科，与苏联政府进行会谈，双方将就两国停止战争状态，重建外交关系，以及滞留西伯利亚的战俘问题进行对话。" 
 
 jap.141.t:0 "千岛群岛问题" 
 jap.141.d:0 "日苏外交谈判中，千岛群岛的领土争端成为双方激烈的争端。" 
 
 jap.142.t:0 "日本决定暂时搁置千岛群岛领土争议" 
 jap.142.d:0 "日本代表团宣布，日方决定暂时搁置千岛群岛领土争议，不要求立刻决定该地区的领土归属，以换取两国恢复外交关系。" 
 
 jap.143.t:0 "日本要求解决千岛群岛问题" 
 
 jap.144.t:0 "苏联拒绝谈论千岛群岛问题" 
 
 jap.145.t:0 "日苏谈判不欢而散" 
 
 jap.146.t:0 "苏联同意归还千岛群岛" 
 
 jap.147.t:0 "日本与苏联外交对话结束" 
 jap.147.d:0 "日本与苏联的外交谈判以顺利的结果宣告结束，两国已在领土问题、战俘问题等各种外交问题上达成协议。" 
 
 jap.148.t:0 "《日苏共同宣言》发布"
 jap.148.d:0 "苏联与日本外交部共同发布了《日苏共同宣言》，正式宣布苏维埃共和国联盟与日本国之间的交战状态结束，两国重新建立外交关系，并将会在不久之后重新开启经济和民间交往。"
 
 jap.150.t:0 "日本申请获得联合国席位" 
 jap.150.d:0 "在今天的联合国大会上，日本代表正式向联大提出了该国加入联合国，并获得联合国席位的请求，很显然此事在联大会议上引起了争论。作为第二次世界大战太平洋战争的发起者，日本以侵略者的身份入侵亚洲多国，并导致了惨重的灾难，而联合国正是为了对抗日本和德国轴心而建立的。如今日本希望重返联合国，自然引起了许多国家的争论。" 
 jap.150.a:0 "战争已经结束，日本应享有其作为主权国家的权力。（赞成票）" 
 jap.150.b:0 "他妈的，小日本战犯还想上桌吃饭？（反对票）" 
 
 jap.151.t:0 "日本加入联合国的决议通过" 
 jap.151.d:0 "日本恢复联合国席位的决议最终得到多数国家支持并表决通过，这似乎意味着国际社会已重新接纳这个国家。" 
 
 jap.152.t:0 "日本加入联合国的决议未能通过" 
 jap.152.d:0 "日本恢复联合国席位的决议最终未能得到多数国家支持而没有通过，很显然日本如要重新回到国际社会，还有很长的路要走。" 
 
 jap.155.t:0 "日本共产党在众议院大选中获得席位" 
 
 jap.156.t:0 "日本政府禁止公务员参与政治活动" 
 
 jap.157.t:0 "共产党和工人情报局就日本局势发表声明" 
 jap.157.d:0 "共产党和工人情报局近日发表声明，认为日本共产党放弃武装革命，选择走议会斗争路线的决策是危险的，放弃武装的日本共产党随时有被镇压的危险。" 
 
 jap.158.t:0 "德田球一发表《对于〈关于日本的形势〉之所感》" 
 jap.158.d:0 "日本共产党领袖德田球一针对数日前共产党和工人情报局的批评发表回复，认为和平革命的议会斗争路线符合日本国情。德田认为日本封建势力根深蒂固，群众政治参与积极性不高，武装革命在日本没有土壤。" 
 
 jap.159.t:0 "日本共产党的内部矛盾恶化" 
 jap.159.d:0 "共产党和工人情报局对日本共产党的批评在日共内部引发了激烈的争论，德田球一主张继续和平革命的议会斗争路线，而宫本显治等则主张支持苏联的武装革命斗争。" 
 
 jap.160.t:0 "美国官员视察新泻大学" 
 jap.160.d:0 "美国驻日本的外交官Walter Crosby Eells在访问新泻大学时发表言论，呼吁将共产主义分子从教育系统中剔除出去。" 
 
 jap.161.t:0 "麦克阿瑟抨击日本共产党" 
 jap.161.d:0 "日本占领军政府总司令麦克阿瑟近期再一次讲话中，措辞强烈地抨击日本共产党，指责日共在日本支持暴力运动，破坏日本社会秩序，并为中共和北朝鲜入侵亚洲自由国家提供支持。" 
 
 jap.162.t:0 "中国共产党发布《中日公报》" 
 
 jap.163.t:0 "皇居御苑发生大规模示威游行" 
 jap.163.d:0 "日本皇宫外的广场发生大规模示威游行，支持日本共产党的左派群众和工人数万人在广场上聚集，反对美国占领当局镇压共产主义势力。" 
 
 jap.164.t:0 "日本警察与示威者爆发冲突" 
 jap.164.d:0 "日本警察皇宫外支持日本共产党的示威者爆发大规模冲突，多人受伤。" 
 
 jap.165.t:0 "日本共产党领导人流亡中国大陆" 
 jap.165.d:0 "随着日本共产党遭到日本政府的镇压，德田球一、伊藤律等日本共产党领导人几日前秘密乘坐船只前往中国大陆。" 
 
 jap.166.t:0 "日本共产党第四次大会在北京召开" 
 jap.166.d:0 "流亡中国的日本共产党领导人在北京召开了日共第四次大会，正式决定放弃和平斗争路线，宣布进行武装斗争。" 
 
 
 jap.167.t:0 "中核自卫队成立" 
 
 jap.168.t:0 "日本保安厅成立" 
 
 jap.169.t:0 "日本东京爆发大规模骚乱" 
 
 jap.170.t:0 "日本共产党第六次大会召开"
 jap.170.d:0 "日本共产党第六次代表大会在东京召开，正式宣布放弃武装斗争政策，决定走议会斗争路线。"
 
 jap.171.t:0 "美国向我们施加压力" 
 
 jap.172.t:0 "日本政府不愿意镇压共产党！" 
 
 jap.173.t:0 "日本共产党进入内阁" 
 
 jap.174.t:0 "日本首相被解职！" 
 jap.174.d:0 "美国占领当局今日宣布，强制解除日本首相的职务，理由是他故意放纵和支持共产主义暴动，此事震惊了日本社会各界，尤其是众议院的议员们，他们指责美国粗暴干涉日本内政，破坏了战后日本艰难建立起来的民主制度！" 
 
 
 
 jap.175.t:0 "岸信介被任命为日本首相！" 
 jap.175.d:0 "麦克阿瑟宣布，美国占领军已决定越过日本众议院选举，直接任命岸信介为新任的日本首相。今天早上，在美军士兵的保护下，岸信介躲过民主人士的重重包围，抵达日本国会宣誓就职，台下的各党派议员纷纷离场表示抗议，但岸信介并不在乎，他发表措辞强烈的讲话，要求消灭日本境内的赤色威胁！" 
 
 jap.176.t:0 "日本爆发大规模抗议！" 
 
 jap.177.t:0 "日本众议院议员抗议新政府！" 
 
 jap.178.t:0 "日本民主联合阵线成立！" 
 
 jap.179.t:0 "日本多地出现武装暴动！" 
 
 jap.180.t:0 "日本民主派武装起义全面爆发！" 
 
 jap.181.t:0 "南韩沦亡引起日本的恐慌" 
 
 jap.182.t:0 "大量朝鲜难民进入日本" 
 
 
 
 jap.199.t:0 "熊泽宽道致信美国政府" 
 jap.199.d:0 "一名叫熊泽宽道的日本政治家致信美国政府，他自称日本南朝皇室的后裔，他的家族在14世纪被夺走了皇位，希望美国政府帮助他驱逐战犯裕仁并夺回皇位。" 
 
 jap.200.t:0 "日本政府代表与熊泽宽道接触" 
 jap.200.d:0 "日本一些内阁官员今日与一名叫熊泽宽道的日本政治家见面，熊泽自称日本南朝皇室的后裔，他的家族在公元14世纪被夺取了天皇王位，熊泽宽道因此自称日本真正的合法天皇。二战结束后，裕仁天皇的威望受到重大打击，熊泽因此开始参与政治活动，要求美国政府逮捕并审判裕仁，同时支持自己成为新的天皇。随着日本民主化进程推动以及民主派政治家掌握日本政权，充满争议的裕仁天皇被新的政治势力所抛弃，日本政府似乎真的打算支持这位身份并没有得到完全核实的南朝天皇。" 
 
 
 jap.210.t:0 "一名日本女性在马里亚纳群岛向美军求救" 
 jap.210.d:0 "一名日本女性在马里亚纳群岛向美军求救" 
 
 jap.211.t:0 "安纳塔汉岛上的日本女性抵达东京" 
 jap.211.d:0 "安纳塔汉岛上的日本女性抵达东京" 
 
 jap.212.t:0 "安纳塔汉岛的比嘉和子接受记者采访" 
 
 jap.213.t:0 "安纳塔汉岛上的日本士兵宣布投降" 
 jap.213.d:0 "安纳塔汉岛上的日本士兵宣布投降" 
 
 jap.214.t:0 "岸信介就任日本首相！" 
 jap.214.d:0 "在石桥湛山首相因病辞职后，岸信介得到自民党多数支持，就任日本下一任首相！此事引起了日本社会的广泛关注，以及日本左翼民主势力的担忧。岸信介是臭名昭著的满洲国工业部长，曾被认为是甲级战犯，并在战后展示出极端的亲美反共立场。" 
 
 
 
 
 jap.220.t:0 "日本政府致信[ROOT.GetName]" 
 jap.220.d:0 "阁下：\n\n我谨代表日本国政府向贵国领导人致信，随着世界大战宣告结束，《旧金山和约》的签订，标志着日本即将重新回归国际社会，我们希望改善与邻国的关系，以期促进东亚的和平。\n我们深知，日本军队在第二次世界大战期间，对贵国造成了严重的政治、经济损失，我们对此深表遗憾，因此，我们希望通过外交途径解决历史遗留问题，将过去的困难解决，以推动两国能携手共建一个更好的未来。" 
 
 jap.221.t:0 "[FROM.GetName]致信东京" 
 jap.221.d:0 "首相阁下：\n\n我国完全不接受贵国提出的所谓友好协议，日本对我国的入侵造成了无法弥补的灾难性破坏，上一代、这一代和下一代的[FROM.GetName]公民都不可能将其遗忘。我们建议贵国等下一个合适的时机再作讨论。" 
 
 jap.222.t:0 "[FROM.GetName]致信东京" 
 jap.222.d:0 "首相阁下：\n\n我国部分同意贵国提出了修复两国关系的主张，但日本对我国的入侵造成了无法弥补的灾难性破坏，因此我国政府希望日本能够对[FROM.GetName]进行赔偿，以促使我国从第二次世界大战的破坏中恢复。" 
 
 jap.223.t:0 "日本政府复函：" 
 jap.223.d:0 "阁下：\n\n我国同意对贵国进行经济赔偿，作为我们对世界大战中贵国惨遭蹂躏一事的谢罪。我们将向贵国提供一笔资金，此外还有一些工业设备，以表示我国对修复两国关系的诚意。" 
 
 jap.224.t:0 "日本政府复函：" 
 jap.224.d:0 "阁下：\n\n我国很遗憾地无法接受贵国进行经济赔偿，两国关系正常化一事，或许需要等下一个合适的时机再作讨论。" 
 
 jap.225.t:0 "[FROM.GetName]恢复与日本外交关系" 
 jap.225.d:0 "[FROM.GetName]外交部宣布，该国政府已决定与日本恢复因第二次世界大战断绝的外交关系。" 
 
 jap.230.t:0 "来自菲律宾的铁矿贸易" 
 jap.230.d:0 "随着我国与菲律宾的关系得到改善，我们将推动两国在铁矿进出口上的贸易往来，以提高我国的钢铁产量。" 
 jap.230.a:0 "进口铁矿的花费将减少" 
 
 jap.231.t:0 "来自马来西亚的铁矿贸易" 
 jap.231.d:0 "随着我国与马来西亚的关系得到改善，我们将推动两国在铁矿进出口上的贸易往来，以提高我国的钢铁产量。" 
 jap.231.a:0 "进口铁矿的花费将减少" 
 
 jap.232.t:0 "来自印度尼西亚的石油贸易" 
 jap.232.d:0 "随着我国与印度尼西亚的关系得到改善，我们将推动两国在石油进出口上的贸易往来，以提高我国的能源产量。" 
 jap.232.a:0 "进口石油的花费将减少" 
 
 
 jap.235.t:0 "日本早川公司发售日本第一款商用电视机" 
 jap.235.d:0 "日本的早川公司发售了日本第一款商用电视机，这款售价便宜且质量耐用的电视机很快得到日本民众的欢迎，这意味着电子产品进入日本民间市场，电视等家用电器将不再是昂贵的奢侈品。" 
 
 jap.236.t:0 "日本东芝公司研发第一款电饭煲" 
 jap.236.d:0 "日本的东京芝浦电气公司研发了第一款电饭煲，这款新发明可以通过电热锅，将生米蒸煮成为米饭。崭新的电饭煲很快在日本市场流行开来，在日本发起了新一轮烹饪技术革命。" 
 
 jap.237.t:0 "第一款便携式晶体管收音机诞生" 
 jap.237.d:0 "日本的东京通信工业推出全球首批便携式晶体管收音机TR-55和TR-63。TR-63凭借小巧体积和低功耗迅速在日本畅销，并已计划进入美国市场。" 
 
 jap.238.t:0 "丰田皇冠诞生" 
 jap.238.d:0 "日本丰田汽车公司推出了全新的丰田皇冠S10私家轿车。他不仅是日本第一款完全自主设计的乘用车，标志着日本汽车工业从模仿走向创新，而且拥有优秀的独立悬挂和动力系统，被认为是日本战后经济重新崛起的象征。" 
 
 jap.241.t:0 "东京电视塔启动动土仪式" 
 jap.241.d:0 "为了满足日本民众对不断扩大到广播电视信号发射的需求，日本将在东京都港区修建一座巨大的电视发射塔。东京电视塔的动工仪式今日举行，由建筑师内藤多仲设计的仿照埃菲尔铁塔的设计被采用。" 
 
 jap.242.t:0 "东京电视塔一期工程竣工" 
 jap.242.d:0 "东京电视塔的基础主体结构已宣告建设完毕。" 
 
 jap.243.t:0 "东京电视塔二期工程动工" 
 jap.243.d:0 "东京电视塔的二期建造工程今日开始，下一阶段的建造将完成电视塔的内部装饰和电视信号设备的安装。" 
 
 jap.244.t:0 "东京电视塔宣告竣工" 
 jap.244.d:0 "历经一年半的紧张施工，高达333米的东京电视塔今日正式宣告竣工，这座超越埃菲尔铁塔的橙白相间钢结构建筑，立即成为日本战后经济复兴的标志性象征。\n作为亚洲第一高塔，其4根支柱撑起的观景台可同时容纳400人，天气晴朗时可远眺富士山。250吨特殊涂装材料使其能抵御台风和地震，塔身安装的164盏照明灯将东京夜空点缀得璀璨夺目。[JAP.GetLeader]首相在竣工仪式上表示："这证明日本已从战败阴影中站起。"\n建设过程中动用了超过10万名工人，使用钢材约4000吨。塔基处特别保留了一处弹痕累累的旧墙壁，与崭新塔身形成鲜明对比。入夜后，六本木一带挤满仰望塔顶的市民.\n随着电视塔开始试播节目，日本正式迈入全民电视时代。这个兼具实用功能与精神象征的建筑，将见证东京1964年奥运会的到来。" 
 
 jap.250.t:0 "日本社会党的分裂" 
 jap.250.d:0 "在对待签订旧金山和约与日美安保条约的问题上，日本社会党内部产生了对立：党内左派反对签订，而右派赞成签订这两部条约。\n社会党的内部矛盾，使其分裂成以片山哲、西尾末广为首的社会党右派，和以铃木茂三郎为首的社会党左派。" 
 
 jap.251.t:0 "浅沼稻次郎的崛起" 
 jap.251.d:0 "日本社会党领袖浅沼稻次郎在日本战后风起云涌的政治运动中崛起，他因强有力的演讲气场，被称为火车人。\n浅沼主张接受《旧金山条约》，但反对安保条约，呼吁社会党的再统一以反对保守势。此外，浅沼还主张改善与中共政权的关系。" 
 
 jap.252.t:0 "社会党的再统一" 
 jap.252.d:0 "社会党左派逐渐在社会党内部占据上风，右派经过深思熟虑，放出橄榄枝。在保守党派并不统一的政治局面下，两派利益趋于一致。\n社会党举行统一大会，左翼铃木茂三郎被任命为党主席，右翼浅沼稻次郎被任命为干事长。" 
 jap252:0 "社会党统一" 
 
 
 jap.253.t:0 "社会党右翼的崛起" 
 jap.253.d:0 "随着社会党的内部分裂愈发严重，越来越多的社会党成员开始倾向反共产主义和亲美的右翼立场。支持这一立场的西尾末广、河上仗太郎等社会党领袖开始获得主导地位。" 
 
 jap.254.t:0 "社会党右翼赢得议会选举！" 
 jap.254.d:0 "日本国会大选结果出炉！自由党与民主党的联盟在大选中铩羽而归，丢失大量席位并失去绝对多数，社会党右翼则赢得多数选票，获得组阁权。" 
 
 
 jap.258.t:0 "洪进山在日本叛逃" 
 jap.258.d:0 "中华民国台湾省籍警官洪进山被中华民国警政当局保送到日本警察大学学习，完成课程后洪进山拒回台湾，而在日本华人陈焜旺的协助下，乘船前往中国大陆。" 
 
 
