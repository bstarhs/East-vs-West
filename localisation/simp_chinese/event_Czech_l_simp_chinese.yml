l_simp_chinese:
 cze.1.t:0 "捷克斯洛伐克问题"
 cze.1.d:0 "在这一次的共产党和工人党情报局会议上，捷克斯洛伐克的问题尤其值得关注。在法国和意大利的共产党先后在大选中落败之后，我们必须意识到，通过议会道路来帮助工人阶级夺取政权是行不通的。捷克共产党虽然已经在捷克人民中获得了积极的支持，但捷克斯洛伐克共和国依然是行的是资本主义代议制，共产党依然有可能在下一次选举中失去政权。日夫科夫同志认为，应当指示捷克共产党在下一次行动前采取行动，武装夺取政权。"
 
 
 cze.2.t:0 "关注捷克政治局势"
 cze.2.d:0 "阁下：\n捷克斯洛伐克政治状况值得我们高度关注，捷克共产党的势力正在增长，如果捷克斯洛伐克沦入共产主义手中，那么将是有一个国家成为莫斯科的傀儡，这不仅使得苏联对西欧的威胁进一步加大，且会激励西欧其他国家的共产党夺取政权。因此我们应当对捷克斯洛伐克的反共产主义势力进行力所能及的援助，为其提供经费以在选举中击败共产党，或派遣情报人员，尝试干涉这次选举。"
 
 
 cze.3.t:0 "捷克斯洛伐克爆发政治危机！"
 cze.3.d:0 "来自布拉格的消息！捷克共产党与非共产主义党派之间的矛盾，在多年对抗中终于爆发！控制内政部的捷共部长Vaclav Nosek下令解除几名非共产主义的警官的职位，引起民主党派的强烈不满！民主党派指责共产党正试图夺取权力，而共产党指责民主党派勾结西方帝国主义，双方剑拔弩张！"
 
 cze.4.t:0 "7名部长要求辞职"
 cze.4.d:0 "捷克的政治动荡进一步升温！7名非共产主义的内阁部长公开宣布辞职，以迫使爱德华·贝奈斯总统宣布内阁倒台并举行大选。非共产主义党派希望通过大选争取民众支持，以建立一个没有共产党的内阁，而捷克共产党针锋相对，开始动员民众进行宣传和罢工。捷共宣传完全有信心在大选中取得压倒性胜利，并暗示不惜以武装夺取相威胁。"
 
 cze.5.t:0 "捷克总统宣布接受内阁辞职"
 cze.5.d:0 "爱德华·贝奈斯总统宣布，他将接受七名非共产主义内阁部长的辞职，但他没有按照捷克共产党的要求以共产党部长取而代之，而是依据宪法，进行大选。"
 
 cze.6.t:0 "捷克斯洛伐克举行大选"
 cze.6.d:0 "明日举行的国民议会大选将决定捷克斯洛伐克的历史走向。捷克共产党将与民族社会党展开最终角逐，街头布满"东西方道路抉择"的竞选标语。\n反共产主义政党联盟的领袖Jozef Lettrich呼吁民众抵制共产党的宣传，希望能够保住来之不易的捷克斯洛伐克的民主与自由，而非像十年前一样将他出卖给侵略者。而捷共领袖克莱门特·哥特瓦尔德则呼吁捷克的工人阶级团结起来夺取政权，建立社会主义的，而非亲西方的捷克斯洛伐克。在两党进行激烈的宣传战的同时，双方也在进行武装动员，隶属于共产党和右翼团体的民兵正在收集武器，局势持续紧张。"
 
 cze.7.t:0 "捷克共产党赢得选举"
 cze.7.d:0 "经过激烈的角逐，捷克共产党最终赢得了选举，成为议会的多数党派。捷共总书记帕克莱门特·哥特瓦尔德蒂成为捷克斯洛伐克的总理。他宣布成立一个社会主义的政府，并将领导捷克斯洛伐克走社会主义路线。"
 
 cze.8.t:0 "捷克民主党赢得选举"
 
 cze.9.t:0 "捷克总统宣布进行内阁重组"
 cze.9.d:0 "爱德华·贝奈斯总统宣布，他将接受七名非共产主义内阁部长的辞职。在捷共武装叛乱和苏联武力干涉的威胁下，贝奈斯最终决定接受捷共提出的条件，以共产党和社会党官员取代了七名辞职的部长，建立了一个完全由共产主义者控制的内阁。"
 
 cze.10.t:0 "捷克斯洛伐克的新宪法！"
 cze.10.d:0 "在今天布拉格召开的捷克斯洛伐克共和国国民大会上，捷克政府正式宣布颁布由捷克共产党起草的新宪法，正式宣布，捷克斯洛伐克将走马克思列宁主义和社会主义道路，政府已事实上处于共产主义的控制之下。"
 cze.10.a:0 "共产主义的势力在不断扩张"
 
 cze.11.t:0 "捷克政变引起欧洲不安"
 cze.11.d:0 "捷克斯洛伐克共产党的夺权，引起欧洲多国的广泛关注，这意味着苏联支持下的共产党正在试图扩张势力，一个接一个地向西欧渗透并建立统治。英国和美国对苏联支持下的共产党扩张大为不安。"
 
 
 
 
 
 
 
 cze.12.t:0 "1968年捷克斯洛伐克共产党会议"
 cze.12.d:0 "捷克斯洛伐克共产党即将召开新一届会议。改革派领袖亚历山大·杜布切克抨击该党领导人安东宁·诺沃特尼在政治和经济改革方面的无能以及对斯洛伐克人的偏见，并要求他辞职。杜布切克的主张得到多数人的支持。我们如何看待这个问题？"
 cze.12.a:0 "杜布切克同志应该接替诺沃特尼的工作。"
 cze.12.b:0 "诺沃特尼同志没有做错什么，他将继续担任领导职务。"
 
 cze.13.t:0 "布拉格之春"
 cze.13.d:0 "亚历山大·杜布切克当选了捷克共产党新领导人，并宣布了他的新政策。捷克斯洛伐克需要一个新的社会主义政治制度，一个民主的、饥饿的社会主义者。政治改革已经准备就绪。"
 cze.13.a:0 "A warm spring."
 
 cze.14.t:0 "捷克试图进行自由主义改革"
 cze.14.d:0 "捷克共产党的新领导人杜布切克试图进行以自由主义和亲西方为特征的政治改革。我们的情报人员警告说，如果改革继续下去，亲西方派系可能会在捷克获得权力。"
 cze.14.a:0 "改革必须停止"
 cze.14.b:0 "任其自行处理"
 
 cze.15.t:0 "来自莫斯科的警告"
 cze.15.d:0 "克里姆林宫对我们的政治改革感到不满，因为这将给西方影响我们的机会。苏联领导人警告说，他们有权阻止亲西方派系的言论。"
 cze.15.a:0 "他们无法阻止我们！"
 cze.15.b:0 "我们不得不放弃"
 
 cze.16.t:0 "布拉格拒绝了我们！"
 cze.16.d:0 "捷克斯洛伐克领导人拒绝我们的警告，他们坚持错误的自由主义道路！我们不能让他们成为资本主义入侵社会主义的大门！"
 cze.16.a:0 "他们会付出代价！"
 
 cze.18.t:0 "捷克内战！"
 
 cze.19.t:0 "胡萨克上台"
 
 cze.20.t:0 "华约入侵捷克斯洛伐克！"
 cze.20.d:0 "由苏联领导的华约大军今天上午进入捷克斯洛伐克。空降兵进攻并控制布拉格机场，随后数千辆坦克入侵捷克领土。苏联领导人表示，此举是为了阻止亚历山大·杜布切克的自由主义改革，因为这将导致捷克斯洛伐克的资本化。捷克政府没有选择抵抗，但布拉格市民试图攻击苏联军队。"
 cze.20.a:0 "They will pay for it!"
 
 cze.22.t:0 "宇宙塑料人乐队"
 
 cze.23.t:0 "知识分子发表《七七宪章》"
 
 cze.26.t:0 "游行示威爆发！"
 
 cze.26.t:0 "捷克斯洛伐克共产党下台！"
 cze.26.d:0 "在巨大的民意压力下，统治捷克斯洛伐克将近50年的捷克斯洛伐克共产党终于宣布进行政治改革，举行全国大选。瓦茨拉夫·哈维尔领导下的公民论坛击败共产党赢得选举，捷克斯洛伐克的民主化宣布胜利。"
 
 cze.40.t:0 "来自苏南冲突的政治影响"
 cze.40.d:0 "随着苏联与南斯拉夫关系的不断恶化，两国之间的政治斗争不可避免地对我国产生了影响。当年内不同派系纷纷在这一问题上进行站队，以安东宁·诺沃提尼为首的亲苏派坚定的站在莫斯科一边，而以鲁道夫·斯兰斯基为首的民族派则主张中立。"
 cze.40.a:0 "坚定支持斯大林同志，反对铁托主义！"
 cze.40.b:0 "反对莫斯科干涉我党的路线，保持中立。"
 
 cze.41.t:0 "捷克斯洛伐克宣布清洗铁托分子"
 cze.41.d:0 "苏联与南斯拉夫的政治斗争蔓延到了捷克斯洛伐克。捷克斯洛伐克共产党宣布坚定支持斯大林同志在社会主义阵营中的领袖地位，批判铁托的亲西方行为，并连带清洗了鲁道夫·斯兰斯基等在这一问题上态度不坚决的党员。"
 
 cze.42.t:0 "捷克斯洛伐克宣布在苏南冲突中保持中立"
 cze.42.d:0 "苏联与南斯拉夫的政治斗争蔓延到了捷克斯洛伐克。经过激烈的政治斗争，同情铁托一派的党员取得优势，在他们的压力下，党中央被迫做了自我批评，捷克斯洛伐克共产党亦宣布在苏南问题中保持中立。"
 
 
 cze.43.t:0 "鲁道夫·斯兰斯基被捕！"
 cze.43.d:0 "捷克斯洛伐克共产党的二号人物，鲁道夫·斯兰斯基今日突然遭到逮捕！斯兰斯基及其同伙被指控犯下反党反社会主义、勾结铁托和犹太复国主义政权，而被国家安全局关押。捷克共产党官方宣布，鲁道夫·斯兰斯基试图在帝国主义间谍的支持下，发动政变颠覆社会主义制度。"
 
 cze.44.t:0 "鲁道夫·斯兰斯基被终身监禁！"
 cze.44.d:0 "捷克斯洛伐克最高法院宣布，鲁道夫·斯兰斯基及其同党试图发动法西斯政变颠覆社会主义，应被判处死刑，但鉴于斯兰斯基曾经的贡献，决定酌情改为终身监禁。"
 
 cze.45.t:0 "鲁道夫·斯兰斯基被判处死刑！"
 cze.45.d:0 "捷克斯洛伐克最高法院宣布，鲁道夫·斯兰斯基及其同党勾结法西斯主义、帝国主义和犹太复国主义，试图发动法西斯政变颠覆社会主义政权，应被判处死刑。斯兰斯基被押往潘克拉茨监狱处以绞刑。对斯兰斯季的处刑引发多国关注，舆论认为在斯大林主义的影响下，捷克共产党的政治大清洗将会继续扩大。"
 
 cze.46.t:0 "被捕！"
 
 cze.47.t:0 "扬·马萨里克坠楼而亡！"
 cze.47.d:0 "捷克斯洛伐克外交部长扬·马萨里克，今日在外交部所在的切尔宁宫窗外离奇坠亡，捷克警察迅速封锁了现场。官方宣称马萨里克因疾病困扰选择结束自己的生命，但西方国家普遍认为，马萨里克因不愿意接受共产党统治而自我了断，抑或是被共产党政府的秘密警察推出窗外谋杀。"
 
 
 cze.53.t:0 "捷克电影《反对一切》上映"
 cze.53.d:0 "由捷克共产党自持拍摄，Otakar Vavlar指导的史诗战争电影，胡斯战争三部曲的最后一部《反对一切》在捷克上映，这部以捷克胡斯宗教改革运动为背景的电影迎来了最关键的剧情——胡斯起义战争。影片将展现捷克民族英雄扬·杰士卡领导胡斯派起义军与神圣罗马帝国军队激战的故事。\n至此，胡斯战争三部曲电影创作告终，这个宏大的电影史诗拍摄工程，由捷克共产党政府的文化部长Zdeněk Nejedlý主导和支持。Zdeněk Nejedlý本身是一位优秀的捷克文学家，他对胡斯战争相关历史的研究有不可磨灭的贡献，然而，此人也主导了捷克共产党政府对捷克文艺界的清洗，以确保捷克文艺服从党的领导和社会现实主义。"
 cze.53.a:0 "命运眷顾勇敢之人！"
 
 
 cze.55.t:0 "爱德华·贝奈斯去世"
 cze.55.d:0 "来自布拉格的消息，捷克斯洛伐克总统爱德华·贝奈斯在捷克布约维采市去世，享年64岁。爱德华·贝奈斯自奥匈帝国时期，便追随捷克斯洛伐克国父托马斯·马萨里克从事捷克独立运动，二人与斯洛伐克领袖米兰·什特凡尼克并成为捷克斯洛伐克的开国三元勋，并在马萨里克去世后成为捷克斯洛伐克总统，然而他却见证了纳粹德国的入侵与第二次世界大战对捷克和斯洛伐克人民的蹂躏，并在战争结束后，因共产党的壮大失去权力。\n政府为爱德华·贝奈斯举行了葬礼，并埋葬在当地的公墓中。"
 
 
 cze.60.t:0 "克莱门特·哥特瓦尔德去世"
 cze.60.d:0 "来自布拉格的消息，捷克斯洛伐克总统、捷克共产党最高领导人克莱门特·哥特瓦尔德，因心脏病去世，终年56岁。捷克斯洛伐克政府模仿列宁、斯大林，将他的遗体进行防腐处理，置于布拉格的国家纪念碑供民众永久瞻仰。"
 
 cze.61.t:0 "下一任总书记"
 
 cze.62.t:0 "捷克领导人选举"
 cze.62.d:0 "在克莱门特·哥特瓦尔德去世后，捷克斯洛伐克共产党举行党大会，[CZE.GetLeader]当选新一届捷克共产党主席。"
 
 
 
 cze.70.t:0 "比尔森发生反对通货膨胀的示威游行"
 
 cze.71.t:0 "比尔森爆发游行示威！"
 
 cze.72.t:0 "捷克多地爆发大规模游行示威！"
 cze.72.d:0 "捷克斯洛伐克多地爆发大规模游行示威，抗议政府最近推行的货币改革，使得工人收入大幅度缩水。抗议从比尔森开始，逐渐蔓延至捷克的其他地区。"
 
 cze.73.t:0 "捷克的工人罢工遭到镇压！"
 
 cze.74.t:0 "捷克政府宣布停止集体化改革"
 
 
 cze.80.t:0 "米拉达·霍拉科娃被捕！"
 cze.80.d:0 "捷克知名女政治家、曾经反抗纳粹入侵的米拉达·霍拉科娃因被指控叛国和勾结帝国主义被捕！捷克共产党当局指控霍拉科娃试图在英国间谍支持下发动政变推翻社会主义制度。"
 
 cze.81.t:0 "米拉达·霍拉科娃引起欧洲多国关注"
 
 cze.82.t:0 "米拉达·霍拉科娃的最后审判"
 
 cze.83.t:0 "米拉达·霍拉科娃被判处死刑！"
 cze.83.d:0 "捷克斯洛伐克最高法院宣布，米拉达·霍拉科娃及其同党勾结法西斯主义、帝国主义和犹太复国主义，试图发动法西斯政变颠覆社会主义政权，应被判处死刑。米拉达·霍拉科娃被押往潘克拉茨监狱处以绞刑。对霍拉科娃的处刑引发多国关注，舆论认为在斯大林主义的影响下，捷克共产党的政治大清洗将会继续扩大。\n\n“我输掉了这场战斗，但我带着荣誉离开。我热爱这个国家，我热爱这个民族，我为他们的福祉而奋斗。我毫无怨恨地离开。我祝愿你们，我祝愿你们……”"
 
 cze.84.t:0 "米拉达·霍拉科娃被判终身监禁"
 cze.84.d:0 "捷克斯洛伐克最高法院宣布，米拉达·霍拉科娃及其同党试图发动法西斯政变颠覆社会主义，应被判处死刑，但鉴于霍拉科娃曾经的贡献，决定酌情改为终身监禁。"
 
 cze.85.t:0 "赫利多尔·皮卡被捕！"
 
 cze.86.t:0 "捷克共产党对军方发动清洗！"