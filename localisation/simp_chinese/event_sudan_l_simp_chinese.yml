 sud.60.t:0 "苏丹共和国独立建国！"
 sud.60.d:0 "非洲大陆面积最大的国家——苏丹，正式宣告结束长达半个多世纪的英埃共管，成为完全独立的苏丹共和国。在首都喀土穆举行的庄严仪式上，英国与埃及代表共同降下了联合统治的旗帜，象征着殖民时代的终结。众多非洲及阿拉伯国家代表出席观礼，见证了这一历史性时刻。/n然而，独立庆典的欢呼声并未完全掩盖国内的深刻裂痕。新生共和国正面临严峻的内部挑战：以穆斯林为主的北方政府与南部以黑人基督徒和泛灵教徒为主的地区之间，在政治权力、宗教信仰及资源分配上存在长期而尖锐的矛盾。政府军与南部各部落武装力量关系持续紧张，零星冲突时有发生，大规模武装对抗的阴影笼罩着这个年轻的国家。联合国及国际社会在祝贺苏丹独立的同时，对其未来走向表达了深切的忧虑。"