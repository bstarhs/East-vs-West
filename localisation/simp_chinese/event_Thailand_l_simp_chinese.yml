l_simp_chinese:
 
 sia.1.t:0 "Soldiers launched a coup in Thailand!"
 sia.1.d:0 "第二次世界大战后，自由泰国领导的政府统治着泰国，但他们的腐败和效率低下引起了军方的不满。平春旺、鲍希农和沙立·他那勒领导的军队发动政变，迫使当时的总理下台，支持宽·阿帕旺少校担任总理，并建立了初步的军事政权。"
 sia.1.b:0 "Confirm."
 
 sia.2.t:0 "阿派旺总理的新宪法"
 sia.2.d:0 "随着宽·阿派旺总理的执政，他与军队之间的隔阂越来越深。有消息指出阿派旺总理正在试图说服国会通过一项新宪法，以限制军队的权利。"
 sia.2.a:0 "这将使泰国的政治更加美好。"
 sia.2.b:0 "他不能这么做！"
 
 sia.3.t:0 "泰国军人发动政变"
 sia.3.d:0 "阿派旺总理推行的新宪法再一次引起军队不满，将军们再一次使用武力逼迫阿派旺下台。曾经的总理，在二战期间让泰国加入日本一方的銮披汶·颂堪元帅再一次在军方拥护下成为了泰国总理。"
 sia.3.a:0 "Confirm."
 
 sia.4.t:0 "海军发动叛乱！"#1951#
 sia.4.d:0 "由于不满颂堪总理提升陆军军官职位的政策，一支海军陆战队向曼谷进发，在激烈的巷战之后绑架了颂堪总理！他们要求让海军元帅比里·帕侬荣成为新的领导人。"
 sia.4.a:0 "我们只能屈服。"
 sia.4.b:0 "立即镇压叛乱！"
 
 sia.5.t:0 "颂堪总理被杀害！"
 sia.5.d:0 "泰国陆军向叛乱的海军队员发起进攻并与其爆发激战，海军很快溃退，但是他们却在溃散前开枪杀死了颂堪。事后，军政府为颂堪举行了隆重的葬礼，他侬·吉滴卡宗被推举为新总理。"
 sia.5.a:0 "确定。"
 
 sia.6.t:0 "颂堪总理被解救"
 sia.6.d:0 "泰国陆军向叛乱的海军队员发起进攻并与其爆发激战，海军很快溃退，颂堪在陆军士兵保护下被解救出来。"
 sia.6.a:0 "多事之秋。"
 
 sia.7.t:0 "军事政变"
 sia.7.d:0 "銮披汶·颂堪领导的政府变得愈发腐败，在1957年的议会选举中公然操纵选举以保持掌权执政。公众的愤怒和学生抗议活动此起彼伏，国王也对此不满。以沙立·他那叻为首的军事首脑决定发动政变，推翻颂堪，成立新的军政府。"
 sia.7.a:0 "确定。"#儒塞利诺·库比契克成为民主党派领导人
 sia.7.b:0 "确定。"#胡亚雷斯·塔沃拉成为民主党派领导人
 
 sia.8.t:0 "泰国军事政变"
 sia.8.d:0 "銮披汶·颂堪领导的泰国政府变得愈发腐败，在1957年的议会选举中公然操纵选举以保持掌权执政。公众的愤怒和学生抗议活动此起彼伏，国王也对此不满。以沙立·他那叻为首的军事首脑发动政变，推翻颂堪，成立新的军政府。"
 sia.8.a:0 "我们应当大力支持！"
 
