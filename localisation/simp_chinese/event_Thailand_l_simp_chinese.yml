 sia.30.t:0 "泰国发生军事政变！"
 sia.30.d:0 "第二次世界大战后，自由泰国领导的政府统治着泰国，但他们的腐败和效率低下引起了军方的不满。平春旺、鲍希农和沙立·他那勒领导的军队发动政变，迫使当时的总理下台，支持宽·阿帕旺少校担任总理，并建立了初步的军事政权。"
 sia.30.b:0 "Confirm."
 
 sia.32.t:0 "军事政变！"
 sia.32.d:0 "一群泰国皇家陆军士兵突然占领了皇宫和广播电台，并要求总理銮披汶·颂堪下台，他们是流亡国外的民主党人士比里·帕侬荣的支持者。"
 sia.32.b:0 "Confirm."
 
 sia.33.t:0 "泰国政权更迭！"
 sia.33.d:0 "泰国发生了军事政变！一群士兵突然袭击并占领了皇宫个广播电台，要求总理銮披汶·颂堪下台，这次政变得到了军方和国王的支持，颂堪被迫辞职，外交官Direk Jayanama临时接任总理。"
 
 sia.34.t:0 "泰国军事政变！"
 sia.34.d:0 "泰国发生了军事政变！一群士兵突然袭击并占领了皇宫个广播电台，要求总理銮披汶·颂堪下台，泰国军方采取行动镇压了政变，叛乱士兵被迫撤离。"
 
 sia.35.t:0 "比里·帕侬荣当选泰国首相"
 
 sia.36.t:0 "比里·帕侬荣当选泰国首相"
 sia.36.d:0 "泰国政府被迫向发动政变的海军屈服，总理颂堪宣布辞职，比里·帕侬荣被任命为临时首相。"