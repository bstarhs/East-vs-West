 USelection.1.t:0 "美国大选结束"
 USelection.1.d:0 "经过激烈的角逐，哈里·S·杜鲁门击败托马斯·杜威获得胜利，得以连任总统。"
 
 USelection.2.t:0 "美国大选结束"
 USelection.2.d:0 "经过激烈的角逐，托马斯·杜威击败哈里·S·杜鲁门获得胜利，当选美国总统。杜威的胜利标志着共和党时隔20年再次夺回美国政权，同时，作为一名带有民粹主义倾向的领袖，杜威可能更加积极地干涉共产主义在全球的影响力。"
 
 USelection.4.t:0 "John Fitzgerald Kennedy当选美国总统"
 USelection.4.d:0 "经过激烈的角逐，年轻的John Fitzgerald Kennedy击败Milhouse Nixon，成功当选美国总统入主白宫。"
 
 
 USelection.1952.t:0 "1952年美国大选即将开始"
 USelection.1952.d:0 "1952年总统选举将在今年的11月开始投票。"
 
 USelection.19521.t:0 "共和党大会"
 
 USelection.19522.t:0 "德怀特·艾森豪威尔成为共和党总统候选人"
 USelection.19522.d:0 "二战英雄德怀特·艾森豪威尔在共和党的总投候选人提名大会上大获全胜，他将代表共和党参加美国总统大选。"
 
 USelection.19523.t:0 "罗伯特·塔夫脱成为共和党总统候选人"
 USelection.19523.d:0 "尽管得到了共和党和许多民众的大力支持，但德怀特·艾森豪威尔依然决定，不参加美国总统选举，俄亥俄州联邦参议员罗伯特·A·塔夫脱宣布，将作为共和党总统候选人参与选举。"
 
 USelection.19524.t:0 "民主党大会"
 
 USelection.19525.t:0 "爱斯特·凯弗维尔成为民主党总统候选人"
 USelection.19525.d:0 "田纳西州联邦参议员爱斯特·凯弗维尔在民主党的总投候选人提名大会上取得胜利，他将代表共和党参加美国总统大选。"
 
 USelection.19526.t:0 "阿德莱·史蒂文森成为民主党总统候选人"
 USelection.19526.d:0 "伊利诺伊州州长阿德莱·史蒂文森在民主党的总投候选人提名大会上取得胜利，他将代表共和党参加美国总统大选。"
 
 USelection.19527.t:0 "1952年美国大选开始投票"
 
 USelection.19528.t:0 "阿德莱·史蒂文森当选美国总统！"
 USelection.19528.d:0 "民主党候选人，伊利诺伊州州长阿德莱·史蒂文森赢得美国总统大选，当选美国总统！"
 
 USelection.19529.t:0 "德怀特·艾森豪威尔当选美国总统！"
 USelection.19529.d:0 "共和党总统候选人、二战盟军最高指挥官德怀特·戴维·艾森豪威尔以压倒性优势击败民主党对手，当选美国第34任总统。这场胜利不仅是一次政党轮替，更被广泛解读为美国民众在冷战加剧的关键时刻，对国家安全与外交方向做出的明确选择。\n艾森豪威尔凭借其无与伦比的军事声望与稳健的个人形象，成功塑造了自己作为“国家安全最佳守护者”的形象。在竞选中，他强烈批评民主党政府对共产主义“遏制不力”，并承诺将以更坚定的姿态应对苏联挑战，同时审慎处理旷日持久的朝鲜战争。他的当选，意味着美国外交与国防政策将在“大规模报复战略”等新理念下进行重大调整，旨在以清晰的威慑来确保安全。其胜利也标志着“军人政治家”在美国冷战领导层中的崛起，预示着一个更注重军事优势与全球联盟战略的时代的到来。"
 
 ######
 USelection.19560.t:0 "1956年美国大选即将开始"
 USelection.19560.d:0 "1956年总统选举将在今年的10月开始投票。《纽约时报》的编辑部灯火通明。编辑们争论着该用"稳健"还是"保守"来形容过去四年的经济政策，油墨味混着咖啡的苦涩在排字车间弥漫。\n电视评论员对着镜头列举朝鲜停战后的阵亡数字，导播突然切换成底特律汽车工厂的全景——流水线上崭新的雪佛兰正鱼贯而出。华尔街的分析师们捏着最新民调，注意到农场主们对农产品补贴的满意度，恰好和中西部铁锈带失业率成反比。\n最热闹的当属芝加哥某间酒吧。退伍军人举着啤酒杯争论不休，杯壁上的水珠滚落到摊开的报纸上，正好晕开了头版那张总统打高尔夫的照片。窗外，竞选巴士呼啸而过，车身上"请IKE再续四年"的标语在霓虹灯下忽明忽暗。"
 
 USelection.19561.t:0 "德怀特·艾森豪威尔突发心脏病！"
 USelection.19561.d:0 "美国总统德怀特·艾森豪威尔突发心脏病，现已被紧急送往医院进行治疗！白宫对外表示总统目前已脱离生命危险，但美国舆论和媒体却已经开始争论，艾森豪威尔是否会因此退出1956年的总统选举。"
 
 USelection.19562.t:0 "艾森豪威尔决定退出美国总统选举"
 USelection.19562.d:0 "在身体恢复健康后，艾森豪威尔发表讲话，遗憾地表示，因为健康原因，他已无法领导美国人民，将退出1956年的总统选举。"
 
 USelection.19563.t:0 "德怀特·艾森豪威尔宣布谋求连任"
 USelection.19563.d:0 "在美国民众对德怀特·艾森豪威尔心脏病发一事关注和担忧一段时间后，熟悉的脸庞再次出现在白宫。\n新闻发布厅里，闪光灯照亮了艾森豪威尔总统病后初愈的脸。有记者注意到，总统的手在翻页时微微发抖，但声音依然如诺曼底登陆时那般坚定。当被问及心脏问题时，他笑着拍了拍胸前的口袋——那里装着硝酸甘油片，和折叠好的二战胜利公报。\n\n来自华盛顿的消息。艾森豪威尔总统宣布自己的病情已有好转，他将参加今年的美国总统大选以谋求连任。"
 
 USelection.19564.t:0 "理查德·尼克松正式确认为共和党候选人"
 USelection.19564.d:0 "白宫医生办公室的灯亮了一整夜。心电图机吐出的纸条上，锯齿状的波峰越来越平缓，像科罗拉多山脉逐渐低矮的轮廓。\n共和党大佬们已经攥着备用候选人名单匆匆赶来，在重症监护室，曾经威风凛凛的艾森豪威尔总统已没有了往日的热情，他摆手示意各位，推荐一位年轻人代替他完成未完的总统任期。\n尼克松接到电话时，剃须膏还留在下巴。他沉默一会，对着浴室的镜子，开始练习起竞选演讲。窗外，WE LIKE IKE的传单被扔进垃圾桶，数百万份NIXON NOW的传单被紧急加印。\n\n来自华盛顿的消息，艾森豪威尔总统因心脏病请未有好转，遗憾地宣布放弃连任，共和党将推举年轻的副总统理查德·米尔豪斯·尼克松作为共和党候选人参加大选。"
 
 USelection.19565.t:0 "阿德莱·史蒂文森成为民主党总统候选人"
 USelection.19565.d:0 "伊利诺伊州州长阿德莱·史蒂文森在民主党的总投候选人提名大会上取得胜利，他将代表共和党参加美国总统大选。"
 
 USelection.19566.t:0 "1956年美国大选开始投票"
 
 USelection.19567.t:0 "阿德莱·史蒂文森当选美国总统！"
 USelection.19567.d:0 "民主党候选人，伊利诺伊州州长阿德莱·史蒂文森击败谋求连任的共和党政府赢得美国总统大选，当选美国总统！"
 
 USelection.19568.t:0 "德怀特·艾森豪威尔连任美国总统！"
 USelection.19568.d:0 "华盛顿特区，寒风卷着彩带在国会山台阶上飞舞。新当选的总统站在大理石廊柱下，向欢呼的人群挥手致意。他军装式大衣的翻领上还别着昨夜的竞选徽章，在阳光下闪着IKE的字样。一位老兵挤到最前排，颤抖着行了个军礼。总统点头回礼时，注意到对方空荡的右袖管。\n盛大的庆祝活动落下帷幕，而暮色降临时，白宫西翼的灯光依然明亮。椭圆办公室的烟灰缸里堆满雪茄烟蒂，来自韩国的战报还摊在桌上。窗台上，第一夫人悄悄放下的降压药片，在月光下泛着珍珠色的微光。\n远处，庆祝连任的焰火照亮波托马克河。而总统正俯身调整地球仪的角度，手指在朝鲜半岛的位置停留片刻，又缓缓转向正在升起铁幕的欧洲。"
 
 USelection.19569.t:0 "理查德·尼克松当选美国总统！"
 USelection.19569.d:0 "共和党候选人，理查德·米尔豪斯·尼克松赢得美国总统大选，当选美国总统！"
 
 ######
 USelection.19600.t:0 "1960年民主党总统候选人初选"
 USelection.19600.d:0 "1960年总统选举即将开始，民主党内部将开始激烈竞争。马萨诸塞州参议员约翰·菲茨杰拉德肯尼迪，将对阵明尼苏达州参议员休伯特·汉弗莱。约翰·肯尼迪宣布参选总统时，令很多民主党内部人士感到惊讶，他年仅四十多岁，被很多人认为不够成熟，然而，他在对抗苏联和共产主义的议题上表现得十分积极，总是能提出许多一阵见血的观点，因此他迅速受到了民主党少壮派的追捧。"
 
 USelection.19601.t:0 "约翰·肯尼迪击败休伯特·汉弗莱"
 USelection.19601.d:0 "约翰·肯尼迪在民主党内的初选中大获全胜，击败休伯特·汉弗莱，成为民主党的总统候选人的有力竞争者。肯尼迪的下一步是冲击民主党全国大会，与更成熟老练的民主党参议院领袖林登·约翰逊竞争。"
 
 USelection.19602.t:0 "民主党洛杉矶全国大会"
 USelection.19602.t:0 "民主党全国大会在洛杉矶举行，约翰·肯尼迪将与林登·约翰逊竞争民主党总统候选人的资格。"
 
 USelection.19603.t:0 "约翰·肯尼迪正式获得总统候选人资格"
 USelection.19603.d:0 "约翰·肯尼迪在民主党的总投候选人提名大会上击败林登·约翰逊取得胜利，他将代表民主党参加美国总统大选。这将是首位出生在20世纪的美国民主党总统候选人，也象征着更激进的年轻一代将参与美国政治。约翰·肯尼迪还邀请约翰逊作为他的副总统参与竞选。"
 
 USelection.19604.t:0 "林登·约翰逊获得总统候选人资格"
 USelection.19604.d:0 "林登·约翰逊在民主党的总投候选人提名大会上击败约翰·肯尼迪取得胜利，他将代表民主党参加美国总统大选。约翰逊还邀请肯尼迪作为他的副总统参与竞选。"
 
 USelection.19605.t:0 "1960年美国大选即将开始"
 USelection.19605.d:0 "在陪伴德怀特·艾森豪威尔走过八年后，美国人民将迎来又一次的美国大选：艾森豪威尔的副总统米尔豪斯·尼克松毫无疑问将出任共和党的总统候选人，而他的对手则是更年轻的马萨诸塞州民主党参议员——约翰·菲茨杰拉德·肯尼迪。\n选战还没正式开始，各国媒体就已经开始对两名候选人优势劣势的激烈讨论。两人都是美国首位出生在20世纪的总统候选人，但肯尼迪更年轻，更希望在美苏的对抗中采取主动。尼克松更稳重更有经验，希望延续艾森豪时代的社会稳定和发展。"
 
 USelection.19606.t:0 "1960年美国大选即将开始"
 USelection.19606.d:0 "在陪伴德怀特·艾森豪威尔走过八年后，美国人民将迎来又一次的美国大选：艾森豪威尔的副总统米尔豪斯·尼克松毫无疑问将出任共和党的总统候选人，而他的对手则是更老练的民主党参议院领袖林登·贝恩斯·约翰逊。\n选战还没正式开始，各国媒体就已经开始对两名候选人优势劣势的激烈讨论。约翰逊希望在美苏的对抗中采取主动。尼克松更稳重更有经验，希望延续艾森豪时代的社会稳定和发展。"
 
 USelection.19607.t:0 "尼克松与肯尼迪开展竞选活动"
 USelection.19607.d:0 "美国总统大选进入最后冲刺阶段，共和党候选人尼克松与民主党候选人肯尼迪正展开全国地毯式竞选。尽管膝伤未愈，尼克松近日连续走访俄亥俄、伊利诺伊等工业州，在退伍军人协会和工厂门口与选民握手，强调"经验与实力"的竞选主题。\n肯尼迪夫妇则打出"新世代"牌，在加州大学广场吸引数万青年欢呼。杰奎琳用流利西班牙语向拉丁裔选民拉票，成为选战亮点。更冒险的是，肯尼迪团队深入种族矛盾尖锐的阿拉巴马州，在黑人教堂承诺推动民权立法，现场民众冲破种族隔离线与其握手。\n南方民主党人警告"肯尼迪正在玩火"，而共和党内部担忧候选人健康问题。随着选举日临近，双方均在关键州投入最后兵力，这场史上最胶着的大选或将取决于不到1%的摇摆选民。"
 
 USelection.19608.t:0 "肯尼迪呼吁释放马丁·路德·金"
 USelection.19608.d:0 "约翰·肯尼迪竞选办公室对媒体宣布，肯尼迪已致信南卡罗莱纳州政府，呼吁州政府尽快释放前不久因参加静坐抵制活动而被捕的活动家马丁·路德·金，这一行为引起了各路媒体和民权运动团体的关注。很明显，肯尼迪释放出明确的信号以示他将支持黑人民权运动反对种族隔离，民调显示肯尼迪将获得不少黑人的选票支持，但将可能失去南方州的支持。"
 
 USelection.19609.t:0 "南方州推举哈里·F·伯德参与大选！"
 USelection.19609.d:0 "在民主党与共和党激烈争夺总统大位之时，一个意想不到的第三竞争者以黑马杀出。弗吉尼亚州参议员、坚决的种族隔离制度支持者哈里·F·伯德，在南方各种族隔离支持团体的推举下，宣布参与今年的美国总统大选！南方白人无法接受民主党和共和党推动黑人民权改革的行为，决定跳出两党制度，推举独立候选人争夺总统宝座，以对抗不断发展的黑人民权运动。"
 
 USelection.196010.t:0 "美国历史上首次总统选举电视辩论"
 
 USelection.196011.t:0 "总统大选投票今日开始"
 
 USelection.196012.t:0 "约翰·肯尼迪当选美国总统！"
 USelection.196012.d:0 "来自华盛顿的消息！经过紧张的计票程序，民主党候选人约翰·菲茨杰拉德·肯尼迪被正式宣布当选为美国总统！\n作为第一位出生在20世纪的美国总统，约翰·肯尼迪以年轻但有经验，更能接受改革的形象，最终赢得了美国选民的选票。现总统德怀特·艾森豪威尔和竞争对手、共和党候选人理查德·尼克松为肯尼迪送上了祝贺。\n肯尼迪与夫人杰奎琳在波士顿的民主党大会上接受了支持者的热情欢呼，并将在明年1月正式举行就职仪式。\n\n不要问国家可以为你做什么，要问自己可以为国家做什么。不要问美国能为你做什么，而要问我们能为全世界的自由做什么。"
 
 USelection.196013.t:0 "理查德·尼克松当选美国总统！"
 USelection.196013.d:0 "共和党候选人，理查德·米尔豪斯·尼克松赢得美国总统大选，当选美国总统！"
 
 USelection.196014.t:0 "哈里·F·伯德赢得美国总统大选，当选美国总统！"
 USelection.196014.d:0 "昨日大选爆出震惊世界的结果——弗吉尼亚州种族隔离主义参议员哈里·博尔德以微弱优势赢得总统宝座。这位曾公开宣称" segregation forever"的候选人获胜后立即宣布将推动《种族隔离法》，引发全国性政治海啸。\n落败的尼克松与肯尼迪发表联合声明，指责"选举制度遭受恶意操纵"，拒绝承认投票结果。声明强调："我们不会让白宫沦为种族主义的堡垒。"已有17州州长表示将抵制总统令。\n博尔德支持者在南方各州举行狂欢游行，三K党成员在亚拉巴马州议会前公开焚烧民权书籍。而北方城市则爆发大规模抗议，波士顿港口的工人拒绝卸载南方棉花。国会大厦今夜灯火通明，两党议员紧急商讨援引宪法第25条的可能性。"