 basic_medium_td:0 "高爆弹"
 basic_medium_art:0 "复合装甲"
 basic_medium_art_desc:0 "复合装甲是指在两块钢板中添加陶瓷等耐高温材料的多层装甲，用以对抗穿甲弹射出的高温。"
 basic_medium_spaa:0 "柴油发动机"
 basic_medium_spaa_desc:0 "柴油燃料相比汽油，体积更小更不容易殉爆，使坦克可以一次性携带更多燃料。"
 
 improved_medium_td:0 "贫铀弹"
 autoloader:0 "自动装弹机"
 improved_medium_art:0 "反应装甲"
 improved_medium_art_desc:0 "反应装甲是指坦克外部安装的爆炸装置，在被炮弹击中时，反应装甲会爆炸以抵消穿甲弹射出的高温脉冲。"
 improved_medium_spaa:0 "光学测距仪"
 SOV_improved_medium_spaa:0 "TPD-K1瞄准仪"
 improved_medium_spaa_desc:0 "通过光学测距仪，坦克炮手可以更好地测量敌方坦克的位置并计算出炮弹的发射方向。"
 gas_engine:0 "燃气发动机"
 
 tank_missile:0 "车载反坦克导弹"
 tank_missile:0 "车载防空导弹"
