 NAVAL_TITLE_MINES:0 "水雷战"
 basic_naval_mines:0 "触发式水雷"
 basic_naval_mines_desc:0 "一个原理简单的漂浮的炸弹，被锚定在海底，当有船只接触水雷时就会爆炸。"
 improved_naval_mines:0 "磁性水雷"
 improved_naval_mines_desc:0 "这个装有复杂引信的水雷一旦侦测到路过船只造成的磁场变化，就会爆炸。"
 advanced_naval_mines:0 "声学水雷"
 advanced_naval_mines_desc:0 "这种类型的水雷在其接收器探测到附近船舰的各式噪音时将会引爆。"
 modern_naval_mines:0 "压力水雷"
 modern_naval_mines_desc:0 "这种高度先进的水雷能探测到附近船只移动造成的微小水压变化。"
 degaussing:0 "消磁"
 degaussing_desc:0 "通过安装大功率的电磁线圈，可以大大减少船只的磁性特征，使其较不易遭受磁性水雷的攻击。"
 submarine_mine_laying:0 "布雷潜艇"
 submarine_mine_laying_desc:0 "通过安装特殊设备来装载并部署水雷，一艘专门设计的潜艇可以在水下，并在大多数情况下未被发现的时候部署水雷。"
 improved_submarine_mine_laying:0 "鱼雷管布雷"
 improved_submarine_mine_laying_desc:0 "重新设计水雷来使它们可以被安置在鱼雷管中，并允许任何型号的潜艇拥有布雷能力，尽管这会减少潜艇所能携带的鱼雷数量。"
 airdrop_mines:0 "空中布雷"
 airdrop_mines_desc:0 "通过将小型降落伞装在水雷上，飞行员可以安全地从飞机上丢下它们，这可以快速而有效地创造一块海中雷区。"
 airsweep_mines:0 "空中扫雷"
 airsweep_mines_desc:0 "飞机可以配备特殊设备，以侦测并安全地从空中引爆水雷。"
 naval_mines:0 "水雷战技术"
 NAVAL_TITLE_ARMAMENT:0 "军备"
 NAVAL_TITLE_DAMAGE_CONTROL:0 "损害控制"
 NAVAL_TITLE_FIRE_CONTROL:0 "射控系统"
 
 early_ship_hull_carrier:0 "二战航母船体"
 early_ship_hull_carrier_short:0 "二战航母船体"
 early_ship_hull_carrier_desc:0 "允许使用老旧的船体来改造成航母的低成本实验，以获得建造并运营航母的相关经验，这种船只的能力比专业的航母要低不少，但建造速度要快得多。"
 
 early_ship_hull_cruiser: "二战中型舰船体"
 basic_ship_hull_cruiser: "1950中型舰船体"
 improved_ship_hull_cruiser: "1965中型舰船体"
 advanced_ship_hull_cruiser: "1980中型舰船体"
 
 cruiser_submarines:0 "巡洋潜艇船体"
 coastal_defense_ships:0 "岸防舰船体"
 basic_ship_hull_heavy:0 "二战重型战舰船体"
 basic_ship_hull_heavy_short:0 "二战重型战舰船体"
 basic_fire_control_system:0 "计算机射控系统"
 basic_fire_control_system_desc:0 "通过输入目标的航行速度以及距离，一台机械计算器可以准确地预测下一次火力齐射就绪时目标的准确位置。"
 improved_fire_control_system:0 "光学射控系统"
 improved_fire_control_system_desc:0 "通过激光和红外测距仪，射控系统可以更快获取敌舰位置、距离和航速，从而加快射控计算效率"
 advanced_fire_control_system:0 "信息化控系统"
 advanced_fire_control_system_desc:0 "计算机技术的发展可以让射控系统更加自动化和精确化。"
 sonar:0 "被动声呐"
 sonar_desc:1 "一组基本的声呐可以通过探测水下目标制造出的噪音来追踪它。\n\n在§Y轻型船舰§!和§Y巡洋舰§!的§Y电子设备槽位§!上安装此模块将有助于探测敌方§Y潜艇§!。"
 improved_sonar:0 "主动式声呐"
 improved_sonar_desc:1 "使用可以调节的声波，该系统可以精确测量到水下目标的方位与距离。\n\n在§Y轻型船舰§!和§Y巡洋舰§!的§Y电子设备槽位§!上安装此模块将有助于探测敌方§Y潜艇§!。"
 smoke_generator:0 "烟雾发生器"
 smoke_generator_desc:0 "对轻中型船舰的引擎和烟囱进行一些小改造，使它们能够制造大量能遮蔽敌人视野的烟雾。"
 
 basic_depth_charges:0 "基础深水炸弹"
 basic_depth_charges_desc:1 "带有压敏触发器的简单易爆容器在到达预设的深度时会爆炸。\n\n在§Y轻型船舰§!和§Y巡洋舰§!上安装此模块将有助于攻击敌方§Y潜艇§!。"
 improved_depth_charges:0 "深水炸弹投掷器"
 improved_depth_charges_desc:1 "一种设计简单的机械装置，可以将深水炸弹投掷到与舰船有一定距离的情况下引爆。这意味着驱逐舰不需要直接从目标上方开过才能击中它。\n\n在§Y轻型船舰§!和§Y巡洋舰§!上安装此模块将有助于攻击敌方§Y潜艇§!。"
 advanced_depth_charges:0 "刺猬深弹投射器"
 advanced_depth_charges_desc:1 "驱逐舰甲板上的迫击炮可以通过发射炸药制造震波，使得舰船在整个交战过程中可以通过声呐接收回波来掌握敌方潜艇的位置，此举能大大提高其准确性。\n\n在§Y轻型船舰§!和§Y巡洋舰§!上安装此模块将有助于攻击敌方§Y潜艇§!。"
 modern_depth_charges:0 "改进型深水炸弹投掷器"
 modern_depth_charges_desc:1 "更多的推进药能从一个相当远的距离将深弹投射到大部分潜艇所在的特定深度。\n\n在§Y轻型船舰§!和§Y巡洋舰§!上安装此模块将有助于攻击敌方§Y潜艇§!。"
 
 improved_airplane_launcher:0 "直升机平台"
 improved_airplane_launcher_desc:1 "改进的弹射机构允许更大更重更强的飞机从此处弹射出去，这将能增大我方大侦查范围。\n\n在§Y巡洋舰§!和§Y重型船舰§!或特化的§Y潜艇§!上安装此模块将有助于探查敌舰。"
 
 basic_cruiser_armor_scheme:0 "基础巡洋舰装甲设计方案"
 basic_cruiser_armor_scheme_desc:1 "这种装甲设计方案仿照了主力舰上分离舷侧和甲板的装甲的做法，并能提供一定程度上对弹片与小口径火炮的防御。\n\n在§Y巡洋舰§!上安装这个模块可以提高它们§Y抵御敌人伤害§!的能力，但也会§R降低§!它们的§Y速度§!。"
 improved_cruiser_armor_scheme:0 "巡洋舰舷侧倾斜装甲设计方案"
 improved_cruiser_armor_scheme_desc:1 "将水线装甲依照一定的角度摆放，能够使得与之前相同重量与厚度的装甲更难被穿透。\n\n在§Y巡洋舰§!上安装这个模块可以提高它们§Y抵御敌人伤害§!的能力，但也会§R降低§!它们的§Y速度§!。"
 advanced_cruiser_armor_scheme:0 "巡洋舰重点防护装甲方案"
 advanced_cruiser_armor_scheme_desc:1 "该方案只注重保护船舶上最重要的部分，而忽略了不重要的部分。\n\n在§Y巡洋舰§!上安装这个模块可以提高它们§Y抵御敌人伤害§!的能力，但也会§R降低§!它们的§Y速度§!。"
 basic_heavy_armor_scheme:0 "倾斜舷侧装甲设计方案"
 basic_heavy_armor_scheme_desc:1 "将水线装甲依照一定的角度摆放，能够使得与之前相同重量与厚度的装甲更难被穿透。\n\n在§Y重型舰艇§!上安装这个模块可以提高他们§Y抵御敌人伤害§!的能力。§Y战列舰§!和§Y战列巡洋舰§!由它们不同的§Y装甲方案§!来决定。"
 improved_heavy_armor_scheme:0 "重点防护装甲方案"
 improved_heavy_armor_scheme_desc:1 "该方案只注重保护船舶上最重要的部分，而忽略了不重要的部分。\n\n在§Y重型舰艇§!上安装这个模块可以提高他们§Y抵御敌人伤害§!的能力。§Y战列舰§!和§Y战列巡洋舰§!由它们不同的§Y装甲方案§!来决定。"
 
 basic_torpedo:0 "基础鱼雷"
 basic_torpedo_desc:1 "一种拥有自推进能力并携带爆炸弹头，按预先确定的路线运行，直到击中水线以下的目标。\n\n在§Y轻型舰艇§!或§Y巡洋舰§!安装这个模块可以对敌方§Y主力舰§!造成重大损害。"
 magnetic_detonator:0 "磁性鱼雷"
 magnetic_detonator_desc:0 "一种新的鱼雷能够在其从目标船只的下方经过时探测到地球磁场的偏转并从正下方击中目标。而一次正中船底的爆炸在大多数情况下会导致对方的龙骨断裂，并迅速沉没。"
 homing_torpedo:0 "自主制导鱼雷"
 homing_torpedo_desc:0 "通过装备一个辅助探测器，鱼雷将会自己瞄准其正前方最大的噪声源——通常情况下，这会是目标。"
 electric_torpedo:0 "电动鱼雷"
 electric_torpedo_desc:0 "不同于会留下一长串容易被观测到的气泡轨迹的旧型号鱼雷，一枚带有电动引擎的鱼雷在击中目标前几乎是不可见的。这也意味着对方无法通过追踪鱼雷轨迹找到发射它的潜艇。"
 improved_ship_torpedo_launcher:0 "改进舰载鱼雷发射器"
 improved_ship_torpedo_launcher_desc:1 "更强大的马达使得鱼雷发射器可以安装更多发射管，并更快指向目标。\n\n在§Y轻型舰艇§!或§Y巡洋舰§!安装这个模块可以对敌方§Y主力舰§!造成重大损害。"
 advanced_ship_torpedo_launcher:0 "先进舰载鱼雷发射器"
 advanced_ship_torpedo_launcher_desc:1 "更大口径的鱼雷管可以发射携带更重弹头的大型鱼雷。\n\n在§Y轻型舰艇§!或§Y巡洋舰§!安装这个模块可以对敌方§Y主力舰§!造成重大损害。"
 modern_ship_torpedo_launcher:0 "现代舰载鱼雷发射器"
 modern_ship_torpedo_launcher_desc:1 "强大的压缩气流能使重型鱼雷以更快的速度发射。\n\n在§Y轻型舰艇§!或§Y巡洋舰§!上安装这个模块可以对敌方§Y主力舰§!造成重大损害。"
 basic_submarine_snorkel:0 "基础潜艇通气管"
 basic_submarine_snorkel_desc:1 "一根从发动机舱到控制塔的简易通气管。展开后可让潜艇在水下运转其发动机并给发动机充电。\n\n在§Y潜艇§!上安装这个模块会降低它们的§Y可见度§!，使它们更难被探测到。"
 improved_submarine_snorkel:0 "改良型潜艇通气管"
 improved_submarine_snorkel_desc:1 "一项改良设计可以防止任何水被吸进发动机，同时也减少了通气管头的雷达回波。\n\n在§Y潜艇§!上安装这个模块会降低它们的§Y可见度§!，使它们更难被探测到。"
 
 basic_battery:0 "海军舰炮"
 basic_battery_desc:0 "海军火炮瞄准机制的基础设计。"
 basic_light_battery:0 "二战高射炮"
 basic_light_battery_desc:1 "为小口径火炮配备的开放式动力炮座，用于小型舰船。"
 improved_light_battery:0 "近防炮"
 improved_light_battery_desc:1 "为小口径火炮配备的封闭式动力炮座，可以保护乘员免受恶劣天气和炮弹碎片的伤害。"
 advanced_light_battery:0 "先进近防炮"
 advanced_light_battery_desc:1 "一种先进的双联装炮座，可以在装甲防护下提供更多的火力。"
 basic_light_shell:0 "小口径半穿甲弹"
 basic_light_shell_desc:0 "这种炮弹在穿甲性能和爆炸威力间取得了平衡，可以显著地在贯穿轻型舰船后带来更多伤害。"
 improved_light_shell:0 "小口径穿甲弹"
 improved_light_shell_desc:0 "一种适合驱逐舰和其他轻型舰船的小口径穿甲弹，使之有了对抗装甲目标的机会。"
 basic_medium_battery:0 "基础主炮"
 basic_medium_battery_desc:1 "拥有两门或三门联装中等口径火炮的动力炮塔，用于巡洋舰上"
 improved_medium_battery:0 "电子化主炮"
 improved_medium_battery_desc:1 "改良的炮塔布局加快了装填，同时更好的装甲提升了生存性。"
 advanced_medium_battery:0 "信息化主炮"
 advanced_medium_battery_desc:1 "通过集成动力装填和远程动力控制，现代巡洋舰可以到达前所未有的射速与精度。"
 basic_medium_shell:0 "中口径被帽穿甲弹"
 basic_medium_shell_desc:0 "增加了风帽后，炮弹在拥有更好的气动外形的情况下依旧可以保持它们的穿甲能力。"
 improved_medium_shell:0 "中口径半穿甲弹"
 improved_medium_shell_desc:0 "这种炮弹在穿甲性能和爆炸威力间取得了平衡，可以显著地在贯穿轻型舰船后带来更多伤害。"
 
 basic_heavy_battery:0 "反舰导弹"
 basic_heavy_battery_desc:1 "舰载机在二战中将巨舰大炮扫入历史的垃圾堆，而反舰导弹的出现则彻底改变了现代海战。舰载导弹可以在数千里外发射和袭击敌军舰船，并通过制导系统锁定目标。"
 improved_heavy_battery:0 "光学反舰导弹"
 improved_heavy_battery_desc:1 "光学制导系统是通过红外线、激光等，寻找目标位置与动向，从而更好锁定目标。"
 advanced_heavy_battery:0 "主动制导反舰导弹"
 advanced_heavy_battery_desc:1 "通过计算机和雷达装置，导弹可以自动接收反射回来的雷达信号，从而锁定目标，减少手动操作。"
 
 basic_secondary_battery:0 "舰载防空导弹"
 basic_secondary_battery_desc:1 "这些开放式地放置于船侧的小型火炮，给予了舰船一定程度上抵御更小舰船的能力，但是射界有限"
 improved_secondary_battery:0 "光学引导防空导弹"
 improved_secondary_battery_desc:1 "光学制导系统是通过红外线、激光等，寻找目标位置与动向，从而更好锁定目标。"
 dp_secondary_battery:0 "主动制导防空导弹"
 dp_secondary_battery_desc:1 "通过计算机和雷达装置，导弹可以自动接收反射回来的雷达信号，从而锁定目标，减少手动操作。"
 
 
 damage_control_1:0 "消防演练"
 damage_control_1_desc:0 "从船长到普通水手，每一位船员都必须帮助控制和扑灭船上的火灾。"
 damage_control_2:0 "分散的消防管道"
 damage_control_2_desc:0 "通过分散船上的主要给水管线，一击致使船只完全丧失消防能力的几率大大降低。"
 damage_control_3:0 "柴油动力应急泵"
 damage_control_3_desc:0 "因为有通常依靠主发动机供电的重型泵，所以对引擎室的单次且相当轻微的攻击，就可能使船舶无法维持漂浮状态。"
 
 fire_control_methods_1:0 "早期弹道雷达"
 fire_control_methods_1_desc:0 "为了击中目标，第一步要每次跨越目标同时射几炮，直至炮击集中到目标的两侧。"
 fire_control_methods_2:0 "电子火控雷达"
 fire_control_methods_2_desc:0 "不对目标进行火力覆盖以免失去观测敌军舰船受打击情况的机会，而是有意的将炮弹落在离目标较近的地方，并测量着弹点与目标之间的距离以计算射击参数。"
 fire_control_methods_3:0 "计算机火控雷达"
 fire_control_methods_3_desc:0 "在炮弹中添加少量的颜料，当我们用这些带有颜料的炮弹向敌舰开火时，着弹点附近将变得更加显眼，这将允许多艘舰船与同一目标交战而不会因彼此的炮击弄混。"
 fuel_silos:0 "燃料储存"
 fuel_silos_desc:0 "大量储存燃油需要一套复杂的容器、管道和阀门以确保其既安全又方便使用。"
 
 basic_ship_hull_cruiser:0 "二战巡洋舰船体"
 depth_charges_advice_tt:0 "\n在§Y轻型舰艇§!和§Y巡洋舰§!上安装一个§Y深水炸弹§!模块将有助于攻击敌方的§Y潜艇§!。"
 sonar_advice_tt:0 "\n在§Y轻型舰艇§!和§Y巡洋舰§!上安装一个§Y声呐§!模块将有助于探测敌方的§Y潜艇§!。"
 airplane_launcher_advice_tt:0 "\n在§Y巡洋舰§!和§Y重型舰艇§!，或特种§Y潜艇§!上安装一个§Y弹射器§!模块将有助于提高他们探测敌舰的能力。"
 cruiser_armor_advice_tt:0 "\n在§Y巡洋舰§!上安装一个更好的§Y装甲§!模块将有助于提高他们抵御伤害的能力。"
 heavy_armor_advice_tt:0 "\n在§Y重型舰船§!上安装一个更好的§Y装甲§!模块将有助于提高他们抵御伤害的能力。§Y战列舰§§!和§Y战列巡洋舰§!由它们不同的§Y装甲方案§!来决定，一般来说，战列巡洋舰的装甲较差。"
 torpedo_advice_tt:0 "\n在§Y轻型舰艇§!或§Y巡洋舰§!上安装§Y鱼雷发射器§!可以对敌方§Y战列线§!中的§Y主力舰§!造成重大损害，如果他们能击溃敌方§Y屏卫编队§!的话。"
 snorkel_advice_tt:0 "\n在§Y潜艇§!上安装§Y通气管§!可以极大地降低它们的§Y可见度§!，从而使它们更难被敌舰探测并攻击。"
 light_battery_advice_tt:0 "\n\n在§Y轻型舰艇§!和§Y巡洋舰§!上安装§Y高射炮§!模块会增加他们的§Y轻型火炮攻击§!，这有助于摧毁敌方的§Y屏卫舰§!。§Y高射炮§!通常在对付装甲舰艇如§Y巡洋舰§!和§Y重型舰艇§!时表现不佳。"
 medium_battery_advice_tt:0 "\n\n在§Y巡洋舰§!上安装§Y轻主炮§!或§Y主炮§!模块会增加它们的§Y轻型火炮攻击§!或§Y重型火炮攻击§!，使它们能够与敌方§Y屏卫舰§!或§Y主力舰§!交战。安装任何§Y主炮§!的船只将被指派为§Y重巡洋舰§!，而只安装§Y轻主炮§!的船只将被指派为§Y轻巡洋舰§!。"
 heavy_battery_advice_tt:0 "\n\n安装§Y反舰导弹§!模块会增加一艘§Y重型舰艇§!的§Y重型火炮攻击§!，允许它与敌方的§Y主力舰§!交战并将其摧毁，§Y反舰导弹§!通常在对付小型船只如§Y轻型舰艇§!和§Y轻巡洋舰§!时表现不佳。"
 secondary_battery_advice_tt:0 "\n一个§Y防空导弹§!允许§Y巡洋舰§!和§Y重型舰艇§!在对另一目标造成伤害的同时，将敌方的§Y屏卫舰§!为次要目标进行攻击。"

 #陆军战术#
 basic_militia:0 "民兵"
 basic_militia_desc:0 "在拥有可以建立常备军的能力之前，当面临外敌入侵，国家就必须征召没有经过训练的平民，拿起武器，投入到保家卫国的战斗当中。"
 morale_1:0 "士气训练 I"
 morale_1_desc:0 "战争最考验的不是一支军队的武器装备、训练有素，而是军队是否有能够面对敌人作战的勇气和毅力。"
 morale_2:0 "士气训练 II"
 morale_3:0 "士气训练 III"
 infantry_training:0 "作战训练"
 infantry_training_desc:0 "培养一支军队，从培养士兵最基础的作战能力，作战素质和经验开始，一支有战斗力的军队，至少要先学会面对敌袭击要躲避，面对炸弹要卧倒，移动过程中要掩护和寻找安全通道，作战时什么位置可以作为掩体。"
 military_instructor:0 "军事教官"
 military_instructor_desc:0 "成熟的军事教育体系是培养现代化军队的重要前提，培养优秀的士兵需要实战经验，也需要耐心指导的长官。"
 guerrilla_doctrine:0 "游击战"
 guerrilla_doctrine_desc:0 "通常,游击战需要某种形式的“战斗和逃跑”策略,即凭借一支轻武装、高机动的作战单位攻击敌人较大单位然后再立即撤退。利用伪装、隐蔽、潜行和伏击等优势,游击队旨在通过消耗敌人的弹药和有生力量来使其丧失优势,同时打击其行动意志。但游击队的重点仍然是避免正面战争,因为那样会给游击队带来灭顶之灾。"
 military_office:0 "军官体系"
 military_office_desc:0 "从数万人的集团军群到几个人组成的班组，从肩膀带花的将军到新晋入伍的列兵，都是一个完整军事体系的一部分。我们需要完善我军军衔、军阶和组织形式，才能拥有现代化的军事指挥系统。"
 infantry_training_2:0 "射击训练"
 infantry_training_2_desc:0 "如果不想被印第安纳·琼斯博士一枪撂倒，拥有精准的枪法很重要。"
 infantry_training_3:0 "耐力训练"
 infantry_training_3_desc:0 "毫无疑问，军人需要强壮的身体，一个合格的士兵不仅要学会俯卧撑、拉双杠这种简单的训练动作，还要拥有负重快速跑数公里的能力。"
 interspersed_battle:0 "步兵进攻战术"
 interspersed_battle_desc:0 "士兵应当知道，要攻击并夺取一个地点，不是扛着枪向牛一样冲锋，而是巧用步兵战术，佯攻、交替掩护射击、步坦协同、交替前进……"
 delay:0 "战术撤退"
 delay_desc:0 "即使无法取胜，在战斗中以埋伏和迟滞战术拖延敌军对我方也是有利的。"
 battle_trench:0 "战壕战"
 battle_trench_desc:0 "战壕是现代战争中最基本的防卫战术，尽管是最落后的战术，但如果面对装备落后的敌军，不失为一种有效的战术。"
 street_fight:0 "城市作战"
 street_fight_desc:0 "巷战和室内作战是最考验单兵作战能力的战斗。"
 secret_transport:0 "秘密运输通道"
 secret_transport_desc:0 "秘密的地下运输通道可以将人员、物资和情报在各个游击根据地之间传播。"
 propaganda_war:0 "宣传战"
 propaganda_war_desc:0 "让我们的同胞知道我们为何而战，让我们的同胞直到我们为何终将胜利。让我们的敌人直到他们的流血毫无意义，且终将耻辱地失败。"
 people_warfare:0 "人民战争"
 people_warfare_desc:0 "“革命战争是人民的战争，只有动员群众才能发动战争，只有依靠群众才能进行战争，”——毛泽东"
 guerrilla_destroy:0 "破坏活动"
 guerrilla_destroy_desc:0 "爆破、刺杀和散发传单，可以让敌人烦恼不堪，方寸大乱。"
 tunnel_warfare:0 "地道战"
 tunnel_warfare_desc:0 "地道作战最早出现于南北战争，通过挖掘地道可以为小股部队提供移动、隐藏和补给空间，从而提高部队在该地区的生存能力，越南战争中的越共和抗日战争时期的中共游击队都使用了地道作战。"
 motorize_doctrine:0 "机械化部队学说"
 motorize_doctrine_desc:0 "机械化车辆达成的步兵，是现代化战争开始的标志，装甲车辆不仅大大增加了步兵的机动性，而且可以为步兵提供防护，搭乘额外的武器支援步兵作战。"
 motorized_transport:0 "机动运输"
 motorized_transport_desc:0 "卡车将搭载士兵穿越山地与河流，快速前往战区。"
 motorized_infantry:0 "机械化步兵学说"
 motorized_infantry_desc:0 "随着汽油发动机出现在战场,以及坦克和卡车的迅速出动,仅靠双腿行走的步兵很难齐步并进。一战结束后到二战开始前,各国都在研究如何解决这一问题。德国人希望步兵能与装甲车一同出动,因此设计了第一辆半履带车,用来输送步兵和物资,速度也能跟得上坦克。这种装甲车,有的配备了履带式大炮和高射炮,有的还拥有独立战斗群,能独自应对敌方任何武器装备。德国在这方面取得了巨大成功,以致于所有参战者都开始竞相模仿。"
 motorized_cooperation:0 "步战车协同"
 motorized_cooperation_desc:0 "坦克、步兵和支援单位在组织良好的团队中协同作战能发挥出比各自为战高得多的战斗效率，步兵可以在城市等复杂地形为装甲部队提供掩护和辅助攻击。"
 armor_doctrine:0 "装甲部队学说"
 armor_doctrine_desc:0 "人们在一战中第一次使用“坦克”就起了很多作用,在二战中,坦克性能变得更加完美。它本质上是一个装甲自行驱动的(靠履带行走)整装式装甲车。坦克这个概念已经存在很长时间了,但铁丝网、机枪、大炮和堑壕这些将想法变为现实的东西主宰了一战,使之陷入僵局。坦克的第一次出现并不讨人喜欢,它只在最后盟军的胜利中被用来支援步兵。如今,坦克是各国军队的支柱,或至少大到足以举足轻重。"
 vehicle_artillery:0 "卡车牵引火炮"
 vehicle_artillery_desc:0 "卡车将搭载炮兵穿越山地与河流，快速前往战区。"
 motorized_HQ:0 "移动指挥部"
 motorized_HQ_desc:0 "卡车将搭载指挥部穿越山地与河流，快速穿越战区。"
 armor_assult:0 "装甲突击"
 armor_assult_desc:0 "无论在未来的什么战争中，装甲部队都将起到重要的作用。——埃尔文·隆美尔"
 armor_group:0 "大纵深作战"
 armor_group_desc:0 "大纵深作战是苏联集团针对北约防御实行的进攻战略，将部队分为数个总队，以装甲部队为先锋发起进攻，在撕破敌人防线后由机械化部队作为后续纵队巩固战果。"
 air_assult:0 "空中机动"
 air_assult_desc:0 "直升机的出现给予了作战部队更大的机动性，空中突击部队将搭乘直升机，快速地抵达战场支援，或给予敌人意想不到的攻击。"
 command_cooperation:0 "指挥配合"
 command_cooperation_desc:0 "战斗指挥官不是只需要指挥手下部队作战单打独斗就可以了，各个部队的指挥官之间还需要互相配合，互相支援，互相分享情报。"
 armor_trench:0 "坦克防御战"
 armor_trench_desc:0 "装甲部队也可以运用在防御作战上。"
 depth_defense:0 "纵深防御"
 Airland_Battle:0 "空地一体战"
 supress_war:0 "治安战"
 supress_war_desc:0 "低烈度的叛乱对我军的作战能力提出了新的要求，面对爆炸、暗杀等恐怖主义活动，我们的士兵要有快速反应的能力和防卫能力。"
 search_destroy:0 "搜索与歼灭"
 search_destroy_desc:0 "搜索与歼灭是美军在越南针对游击战提出的战术，"
 Strategic_Hamlet:0 "战略村"
 Strategic_Hamlet_desc:0 "战略村是南越政府针对越共的游击活动实行的一项政策，在游击队的活动地区实行无人区制度，将村民全部迁移到防守严密的战略村，使其隔绝与游击队的往来。"
 military_college:0 "军事学院"
 military_college_desc:0 "如果一个国家想要拥有一支专业的军队,那么它就需要专业人员来领导。军事学院是一所专门学习兵法的高等教育学校,用于培训军官。第一所军事学院成立于18世纪初的欧洲,目的是在技术层面的军队分支下培训军官,比如工兵和炮兵。"
 intelligence_analysis:0 "军事情报分析"
 mine_region:0 "雷区布置"
 mine_clear:0 "扫雷"
 mine_bomb:0 "地雷"
 artilelery_doctrine:0 "炮兵部队"
 artilelery_doctrine_desc:0 "自从古斯塔夫·阿道夫引入野战加农炮以来,这种大炮取得了很大进展,进化成了各种类型各种大小的野战炮。实际上,任何能投掷或引爆岩石或炸药包的机械装置都是“大炮”,但这个术语通常指带有膛线来提高精准度的大型后装式大炮。1897年,法国人制造出了75型大炮,这可能是历史上最普遍的大炮。此后,枪炮也变得更大、更可靠、更精准、更致命,将军们对此倍感欣慰。"
 forward_observers:0 "炮兵测绘"
 forward_observers_desc:0 "前线观测员能直接掌握炮兵火力的打击效果，并回报后方的炮兵单位以修正火力。"
 superior_firepower:0 "优势火力"
 superior_firepower_desc:0 "优势火力学说重视以倾泻炮火而非投入士兵来制敌。人命关天，但子弹价廉。\n\n"
 overwhelming_firepower:0 "火力覆盖"
 overwhelming_firepower_desc:0 "将所有支援单位的火力集中在一点上能够有效地击溃敌方防御，或压制敌方进攻。"
 indirect_fire_support:0 "间接火力支援"
 infan_gun_coor:0 "步炮协同"
 mass_assault:0 "人海突击"
 mass_assault_desc:0 "“完美无缺”的武器被高估了，海量“可堪一用”的武器才能将我军导向胜利！"
 
 ##海军###
 basic_fleet:0 "早期舰队"
 coast_guard:0 "海岸巡逻队"
 battle_fleet:0 "战斗编队"
 battle_fleet_desc:0 "战斗前线高耸的战列舰互相进行猛烈轰击,它们将彼此炸成碎片,如此激烈的战斗画面让人毛骨悚然…这样的场景同历史电影表现出的完全不同。舰艇编队使用的弓形阵型法早在1555年之前就被设计出来了,当时的葡萄牙作家费尔南·迪·奥利维拉将该方法推荐为理想的战斗编队法。与其他队形相比,这种编队里的每艘船都能向对手展开猛烈抨击,而不用担心伤及友军船只,因为所有船只要么相互平行,要么与敌军船只方向相反。一战期间,战舰和大国巡洋舰依然采用战列阵线。"
 destroyer_fleet:0 "驱逐舰编队"
 destroyer_fleet_desc:0 "驱逐舰起源于19世纪晚期,目的是让那些讨厌的鱼雷艇远离无畏舰,它在1904年的日俄战争中第一次参加战斗,已为各国海军完成了许多任务:巡逻、护航、防空反潜。一战期间,驱逐舰负责掩护友军船只、攻击敌军船只,在对付悄悄接近商船队的潜艇方面特别管用。二战时期,驱逐舰速度变得更快且更加灵活,它能为远程任务携带足够的弹药和物资;它们是两大洋上敌对海军的主力。自那以后,20世纪60年代的导弹驱逐舰也开始被世界各国海军使用。"
 ships_supply:0 "船只补给"
 ships_supply_desc:0 "在使用煤炭、燃油和柴油的时代,船舶在战时会耗费大量燃料和弹药。供应船一一英国皇家海军称之为母舰一一解决了战舰需要不断往返港口进行补给的问题。这些供应船在功效上相当于移动维修基地,能够补给和修理这些进行卑鄙勾当的船只。通常,这类供应船主要服务于某一特定类型的船只,比如英国在战争中使用的驱逐舰供应船。几乎所有拥有较大载重能力的船舶都可以被用作供应船…而人们也确实这样做了。实际上,二战期间,德国人就使用改良过的XⅣ级潜艇(绰号“奶牛”)为海上的U型潜水艇补给燃料、机油、鱼雷和食物。"
 fleet_supply:0 "船际勤务"
 fleet_supply_desc:0 "虽然辅助船的战斗能力(通常是防御)比较有限,但正是有了辅助船,战舰才能够以最高效的方式运作。如果没有辅助船,大洋海军不可能高效、成功地战斗,甚至都不能一直留在水面上。18世纪、19世纪欧洲海军在海洋上四处探险时,这些军舰需要辅助船补充物资、海上维修、守护散落在世界各地的海军基地。进入蒸汽时代后,矿工、以及后来的加油工,让驱逐舰和战舰中的锅炉一直燃烧,保证这些军舰的正常运行。随着海军越来越多样化,辅助船也是如此;现代美国海军就列举了大约86种辅助船(其中不包括修船坞)"
 fleet_command:0 "舰队指挥"
 naval_construction:0 "海军基建"
 naval_college:0 "海军学院"
 naval_college_desc:0 "海军学院将为我国培养海军军事人才，壮大我国的海军队伍和出色的军官体系。\n在海军学校，高年级学生说听不见就是听不见！"
 naval_base:0 "海军基地（海军学说）"
 carrier_battlegroups:0 "航母战斗群"
 carrier_battlegroups_desc:0 "航母能在舰炮射程外打击敌方并提供空中的侦查眼让我方不至于遭偷袭。航母集群将是股不可忽视的力量。"
 naval_recruit:0 "海军后勤"
 naval_weapon:0 "海军武器"
 TEXT_NAVAL_WEAPON_ALLOW:0 "解锁使用海军制造商"
 naval_missile:0 "舰载导弹"
 naval_missile_desc:0 "巡洋舰”一词最早出现在17世纪中叶,当时指的是舰队中可以独自作战的战船——这种战船要足够快,遇到配备更强火力的敌船,才能逃跑,同时,还需足够大,这样才能轰击更小的船只。在接下来的几百年间,破交舰通常能起到这样的作用,偶尔还被用于舰队战斗中掩护其主体。因此,他们在海事中的作用并不明显…直到远程导弹出现。虽然冷战期间,很多国家都花费资金设计建造导弹巡洋舰,但只有美国和苏联的导弹巡洋舰获得了成功，带有舰对舰导弹、舰对空导弹、反潜导弹,其装备搭配多到惊人,因此,该巡洋舰几乎可以消灭任何敌人。"
 grand_naval_gun:0 "巨舰大炮"
 naval_helicopter:0 "舰载直升机"
 carrier_fleet:0 "海军航空兵"
 carrier_fleet_desc:0 "气球和飞机执行军事行动时,侦查是它们的首要任务,在广阔空间和开阔海洋中,这项任务尤其重要。对偷偷摸摸陷入射程内的敌舰而言,侦查会让其局促不安。海军侦察飞机在一战中首次出现,通常是从水上飞机母舰,或某些炮塔上有短射程飞行甲板的战舰中发射出的单座飞行器(不幸的是,这些飞行器无法着陆,因此飞行员不得不把他们的飞机开进船只旁边的水域里,并等待获救)。战争期间,人们开始寻找更好的解决方案,因此产生了起飞弹射器和降落阻拦装置,同时还出现了真正的航母,每种都因拥有远程侦察飞机而备受赞誉。"
 naval_radar:0 "海军雷达"
 naval_endurance:0 "续航能力"
 damage_control:0 "损管"
 adv_damage_control:0 "强化损管"
 massed_strikes:0 "舰载机突袭"
 escort_carriers:0 "护航编队"
 escort_carriers_desc:0 "海军护航舰至少自12世纪起就已存在,当时军舰的各个级别发展成为各自不同的种类,在任务中扮演不同的协同作战角色。在殖民时代,西班牙人和葡萄牙人派出军事护卫与他们缓慢的宝船一起抵御海盗和私掠船。拿破仑战争中,英国试图拦截法国粮食船队,护航队战术在此起到了显著作用;护航队席卷了多次战斗一一韦桑岛战役、多格滩战役和六月一日海战。一战期间,护航纬由英国海军部制定,用来对付德国潜艇的威胁,随后,该策略继续用于大西洋更加致命的战斗之中。"
 submarine_fleet:0 "潜艇编队"
 silence_act:0 "静默行动"
 silence_acte_desc:0 "一旦水面舰艇一一尤其是驱逐舰、轻巡洋舰和护卫舰一一获得声纳,对潜艇组而言,事情会变得复杂起来。声纳在一战后期获得发展,由于出现的太晚,因此无法用来抗拒∪型潜水艇的“蹂躏”。但由于人们非同寻常的先见之明,到了二战时,很多更小的护卫舰已开始使用无源声纳,并根据潜伏潜艇的声音来辨别其深度,随后,他们能释放深水炸弹将其消灭。还击所有潜艇响声的唯一方法是进行“无声运行”,可以消除所有不必要的声音。发动机的声音没了,通风设备的声音达到最低限度,全体船员寂静无声…通常默默祈祷上面的敌人在对他们毫无觉察的情况下经过他们。"
 unrestricted_submarine_warfare:0 "无限制潜艇战"
 unrestricted_submarine_warfare_desc:0 "让我方的潜艇击沉所有船只，无论民用与否，也无需事先警告。尽管有些人认为这违反战争的法则，但是并不能否认它的有效性。"
 wolfpacks:0 "狼群战术"
 wolfpacks_desc:0 "我方潜艇组成狼群作战，协同大幅提高。一旦发现敌舰，潜艇将静候整个狼群到来并静静选择我方拥有压倒性优势时才发起攻击。"
 oversea_base:0 "海外基地"
 blue_water_navy:0 "蓝水海军"
 integrated_convoy_defence:0 "综合运输船队防卫"
 integrated_convoy_defence_desc:0 "改善海空协同能让我方在敌舰接近运输队之前就对其实施远距打击。这将大幅提高海运效率。"
 naval_computer:0 "电子化操作"
 naval_fire_control:0 "舰炮火控系统"
 naval_EW:0 "电子对抗"
 adv_dock:0 "先进船坞"
 naval_dock:0 "船坞"
 naval_dock_desc:0 "随着钢铁船只的建造,加之借助巨大的干船坞来建造最大的远洋船只,造船厂变得比以往更像工厂…但它耗时不止一天。在贝尔法斯特庞大的哈兰德沃尔夫造船厂,皇家邮船泰坦尼克号于1909年3月开始建造,但直至1911年5月才下水,之后又过了近一年才完成建造并开始其命途多舛的处女航。"
 
 ##空军###
 army_aviation:0 "陆军航空兵"
 army_aviation_desc:0 "很多中小国家不需要大规模的独立空军，配合陆军进行对地攻击和防空的小规模空军已足以。"
 independet_airforce:0 "独立空军"
 independet_airforce_desc:0 "随着我国军力的扩大，附庸于陆军的航空部队已不足以保护我们的领空，建立一支由独立参谋部指挥的独立空军，才能够保护我们的头顶。"
 airforce_college:0 "空军学院"
 airforce_college_desc:0 "培养一个优秀的飞机驾驶员需要投入许多资源。"
 airforce_train:0 "战斗训练"
 airforce_train_desc:0 "战斗训练"
 formation_flying:0 "编队战斗"
 formation_flying_desc:0 "在一战期间,早期轰炸机一般单个或是三三两两地执行任务;所以它们采用的编队形式其实没什么影响。但部队轰炸目标地点有所重合也是有益的。到了二战时期,大量轰炸机一同执行空袭任务时,情况就不一样了;合理编队能够抵御敌军战斗机的攻击、集中轰炸目标,也能阻止己方轰炸机相撞。美国陆军航空队在被占领的欧洲执行白日任务时,遭受的损失数量惊人,于是柯蒂斯勒迈上校于1942年8月想出了方阵形式的编队。到了1942年12月,仍然会有大量伤亡,但数量已大幅下降。很快,英美两国执行轰炸机任务时,都釆用了“标枪向下”的方阵形式编队。"
 dive_bombing:0 "投弹训练"
 direct_ground_support:0 "对地攻击训练"
 direct_ground_support_desc:0 "通过紧密协同攻击机飞行员和地面观察员，空中火力将被准确引导以为地面部队提供最佳协助。"
 bomber_force:0 "轰炸机部队"
 bomber_force_desc:0 "轰炸机在1913年首次登台亮相。一战结束时,用作战术(战场)和战略(市区)的轰炸机在前线随处可见。这些笨拙的双翼飞机在两次世界大战期间逐渐被能跨越海洋的远程单翼机取代,单翼机速度更快、全副武装且非常坚固。如今双方都能参与“恐怖轰炸”,把平民置于战争的中心,比如德国对伦敦的“大轰炸”,或美国对日本城市的大轰炸。当两架轰炸机的机组人员投掷原子弹时,所有切达到顶峰。"
 air_defence:0 "拦截作战"
 air_defence_desc:0 "一战后期,远程轰炸变得更加可怕而频繁。为此一些设计师开始制造某种战斗机来专门对付轰炸机,这些战斗机被称为拦截机。战争中,各方都想对敌方领土内的目标进行轰炸,因而促使人们开始制造拦截机。拦截机的设计有两个特点轻量级和高机动性,以便能够在恶劣天气和晚上对轰炸机和重型远程战斗机进行拦截。"
 forward_interception:0 "紧急升空作战"
 ground_service:0 "地勤训练"
 ground_service_desc:0 "飞机是既复杂又脆弱的机器,尤其是当他们被射击时。在第一次世界大战中,每一个空军基地都设有维修、保养、武装和服务飞机的地勤人员。当然事实上,地勤人员和他们那些必不可少的设施也成为了敌人的首要攻击目标,扫射和轰炸经常光顾机场。随着战机变得更为精密复杂,地勤人员现在也需要花费数月时间接受专门培训。"
 air_base_radar:0 "空军雷达"
 air_base_radar_desc:0 "空军雷达"
 home_defence:0 "雷达配合作战"
 fighter_ace_initiative:0 "精英飞行员"
 air_recon:0 "空中侦察"
 precision_bombing:0 "精准轰炸"
 battlefield_destruction:0 "战术轰炸"
 logistical_bombing:0 "后勤破坏"
 dogfighting_experience:0 "缠斗经验"
 dogfighting_experience_desc:0 "起初,军事航空平淡无奇,多数用于侦察、炮击定位,以及偶尔对步兵进行轰炸;甚至在一战的头几个月里,情况也是如此。后来,几个飞行员开始使用手枪向敌方飞行员射击。在这种情况广为人知之前,飞机就已配备了机枪(在福克解决了子弹如何射过高速旋转的螺旋桨旋叶的问题之后),空中缠斗由此开始。热衷冒险的飞行员发明了各种空战机动—一如殷麦曼翻转和低势回旋一一以使自己在战斗中取得优势。在空中格斗中取胜一一与骑土比武不同,它更多是恐惧和火焰的结合一一并迅速成为了一个科技和技术问题。"
 air_superiority:0 "制空权保证"
 air_land_battle:0 "空地一体战"
 helicoptor_recon:0 "直升机巡逻"
 air_transport:0 "空中运输"
 supercruise:0 "超音速巡航"
 bomber_cruise:0 "轰炸机巡航"
 
 
 stealth_bomber:0 "隐形轰炸机"
 stealth_bomber_desc:0 "雷达被认为是飞机的克星，但随着隐形技术的发展，飞机将得到更大的保护。通过可以吸收雷达波的涂料及可以散射雷达波的形状设计，飞机可以在雷达扫描中隐藏自己。"
 out_eye:0 "超视距作战"
 out_eye_desc:0 "战斗机飞行速度的提高和导弹技术的发展，标志着战斗机对决将不在飞行员的可视范围内发生，飞机雷达和导弹将可以发现并攻击数公里乃至数十公里外的敌机，要在这样的远距离战斗中取胜，对战斗机的性能，尤其是航电系统、电战系统都有巨大的要求。"
 clound_bomb:0 "云爆弹"
 clound_bomb_desc:0 "如果一大包面粉不慎发生泄露并接触火源，其引发的粉尘爆炸足以摧毁一家面粉厂。利用这种原理制造的炸弹，即向空气中抛洒大量易燃粉尘和易挥发的汽油，其引发的爆炸是极其可怕的。"
 plane_auto_pilot:0 "自动驾驶"
 plane_auto_pilot_desc:0 "电子导航系统的发展大大减少了飞行员的驾驶步骤，驾驶员只需要提前在航电系统中输入坐标，飞机就能在无人操控之下向目标地点前进。"
 Cluster:0 "集束炸弹"
 Cluster_desc:0 "集束炸弹又称子母弹，即一个大的单壳内包裹数十个乃至数百个小炸弹，如果其在空中分裂，覆盖的爆炸范围可以达到数十平方公里，这被认为是一种极不人道的武器。"
 fighter_metal:0 "改良飞机材料"
 fighter_metal_desc:0 "飞机速度越来越快，搭载武器越来越多，航电系统越来越复杂，对飞机材料的要求便越来越高。传统的铝合金已经不足以满足现代战斗机了，为了不让飞机在空中崩裂，像钛铝合金这样的新材料便诞生了。"
 modern_fighter_computer:0 "现代战机航电系统"
 modern_fighter_computer_desc:0 "万能的计算机也被运用到了战斗机上，复杂的航电系统可以帮助驾驶员处理各项飞行数据，简化复杂的操作，并协助火控系统锁定敌机，规避敌袭。"
 air_guide:0 "空中导航"
 air_guide_desc:0 "空中导航系统实际上早在二战末期就已出现，而电子导航系统的出现将其完善。战斗机可以通过预先设定坐标，飞往指定位置，避免迷失方向。"
 fighter_electro:0 "早期战机航电系统"
 fighter_electro_desc:0 "飞机上的电子系统可以帮助飞行员更好地操作飞机，并在仪表盘上显示飞机的状态和方位。"
 rocket_engines:0 "喷气发动机"
 rocket_engines_desc:0 "涡轮喷气发动机能通过燃气涡轮机压缩空气，并通过燃料使之燃烧，燃气通过燃烧室进入涡轮机推动旋转，最后燃气经过喷管喷出，以反作用力提供动力。这种发动机拥有15比1的推力重量比。涡轮喷气发动机通常用于战斗机和轰炸机，全面提升它们的性能。"
 land_guidance:0 "陆地协助制导"
 land_guidance_desc:0 "在导弹制导技术尚不发达时，遇到复杂的战场情况，战斗机可以借助地面部队的帮助进行制导。地面部队会使用激光传感器照射敌方目标，帮助导弹进行锁定。"
 supersonic_engine:0 "超音速引擎"
 supersonic_engine_desc:0 "超音速是指超过环境中音速的速度。在海平面高度，气温摄氏20 °C（68 °F）空气中，音速大约是343米／秒。20世纪50年代末至60年代，随着喷气式引擎技术的快速发展，各国都开始开发能够超音速飞行的战斗机。"
 air_gun:0 "机炮"
 air_gun_desc:0 "二战时期，战斗机主要装备航炮或者机枪，上世纪50年代，各国开始升级改进飞机所装在的航炮，提高射速和精准度。"
 USA_air_gun:0 "M61火神式机炮"
 stealth_aircraft:0 "隐形"
 stealth_aircraft_desc:0 "雷达通过反射电磁波来检测和跟踪目标。如果一个目标不能反射，或是反射的电磁波无法被雷达捕获，该目标就不会被雷达发现。\n隐形技术就是为了实现这个效果。\n飞机如果能通过特殊的外型设计来降低雷达反射，并采用雷达波吸收材料的话，\n就会真正地在雷达上“隐形”了。"
 air_chaff:0 "干扰箔"
 air_chaff_desc:0 "干扰箔是一种对抗早期红外制导的防空导弹的手段，飞机通过抛洒铝箔片来干扰导弹的红外传感器，使其无法锁定目标。"
 countermeasure_flare:0 "热诱弹"
 countermeasure_flare_desc:0 "飞机可以通过抛射热诱弹，发出高温射线，来引诱借助红外线等热感应系统锁定目标的防空导弹，从而保护飞机的安全。"
 napalm:0 "凝固汽油弹"
 napalm_desc:0 "凝固汽油弹可以将整片地区陷入熊熊火海之中，摧毁范围内的建筑和人员，无论是作为战略轰炸还是战术支援都极为有用，前提是让你的地面部队远离目标地区。"
 fighter_firecontrol:0 "计算机火控系统"
 fighter_firecontrol_desc:0 "计算机可以帮助飞行员计算各种复杂的数据，辅助战斗，也能帮助导弹计算弹道，从而加强战斗机的战斗力。"
 
 halicopter_machinegun:0 "机载机枪"
 halicopter_machinegun_desc:0 "早期的直升机没有武器，因此人们可以通过在直升机上搭载机枪进行射击"
 halicopter_rocket_net:0 "火箭弹发射槽"
 turboshaft:0 "涡轴引擎"
 halicopter_at_missile:0 "直升机载反坦克导弹"
 
 infantry_weapons2:0 "手榴弹"
 infantry_weapons2_desc:0 "手榴弹是步兵使用的一种炸弹，通过投掷出去后爆炸产生的破片杀伤敌人。"
 improved_infantry_weapons_2:0 "烟雾弹与闪光弹"
 improved_infantry_weapons_2_desc:0 "为步兵配备烟雾弹与闪光弹，可以使步兵更好的在复杂地形，比如室内作战中掩护自己，迷惑敌人。"
 advanced_infantry_weapons2:0 "枪榴弹发射器"
 advanced_infantry_weapons2_desc:0 "安装在步枪上的榴弹发射器，使榴弹和其他特殊炸弹能够拥有更远的射程。"
 night_vision:0 "红外夜视仪"
 night_vision_desc:0 "仪器向外发射红外光束，照射目标，并将目标反射的红外图像转化成为可见光图像，从而进行夜间观察。"
 night_vision2:0 "全息瞄准镜"
 infantry_at:0 "步兵反坦克武器 I"
 infantry_at_desc:0 "给我方步兵单位装备反坦克步枪能让他们对抗轻型装甲车辆的同时也保证不丧失机动力。"
 infantry_at2:0 "步兵反坦克武器 II"
 infantry_at2_desc:0 "为使步兵有效对抗更重型的装甲车辆，必须制造更小型轻量化的空心装药武器。"
 
 paratroopers:0 "伞兵 I"
 paratroopers_desc:0 "将空降部队引入陆军后，我方能强行打开突破口并在过去无法进入的地区部署关键点部队，这带来新的战术机遇。"
 paratroopers2:0 "伞兵 II"
 paratroopers2_desc:0 "寥寥数名空降兵组成的小型行动组到大型空降师的转变为大规模空降行动铺平了道路。曾让人耳目一新的空降部队现已在战场上数见不鲜。"
 paratroopers3:0 "伞兵 III"
 paratroopers3_desc:0 "学习根据天气变化来调整空降行动、将诸如伞兵靴之类的必须装备标准化以及更长期的特别训练将使危险的空降任务中的混乱与风险降到最低点。"
 marines:0 "海军陆战队 I"
 marines_desc:0 "擅长两栖作战的部队越来越不可或缺。临时拼凑的手段、装备已经成为历史，我方海军陆战兵现在已接受相关训练并拥有专属登陆舰船支持。"
 marines2:0 "海军陆战队 II"
 marines2_desc:0 "两栖作战需要持续不断的创新。改良的后勤保障和移动式临时港口让我方海军陆战队能在过去不可能的情况下进行登陆。"
 marines3:0 "海军陆战队 III"
 marines3_desc:0 "海军陆战队无须单纯专精于两栖登陆。在未来，我方海军陆战队将成为最有组织纪律的特种部队。"
 tech_mountaineers:0 "山地步兵 I"
 tech_mountaineers_desc:0 "在山脉上战斗会使部队暴露在许多致命风险下，然而有时这无可避免。士兵将接受山地特种训练以将风险最小化。"
 tech_mountaineers2:0 "山地步兵 II"
 tech_mountaineers2_desc:0 "我方部队接受训练后不仅能保存自己，甚至能灵活利用山脉地形创造优势。利用轻量型装备与骡马运输，山地部队在山脉地形中将有比其他步兵更优秀的机动性。"
 tech_mountaineers3:0 "山地步兵 III"
 tech_mountaineers3_desc:0 "在高海拔低气温的艰苦山地环境执行任务，我军山地部队必须接受非比寻常的训练并拥有坚定纪律。"
 tech_special_forces:0 "特种部队"
 tech_special_forces_desc:0 "非传统的战斗需要专业的培训。我们需要确保我们的部队能够做好准备并够适应严酷的环境。"
 advanced_special_forces:0 "先进特种部队训练"
 advanced_special_forces_desc:0 "通过大量的训练，我们可以确保我们的特种部队能够表现地超越常人。"
 improved_special_forces:1 "扩大特种部队项目"
 improved_special_forces_desc:1 "特种部队能够执行普通士兵无法完成的任务。我们需要扩大训练计划，让更多的士兵能够合格。"
 extreme_environment_training:0 "极端环境训练"
 extreme_environment_training_desc:0 "我们需要能够在最恶劣的环境下进行战斗。通过合适的训练和装备，我们的部队将能够在最极端的条件下进行战斗。"
 survival_training:0 "生存训练"
 survival_training_desc:0 "我们的特种部队经常会在敌后作战并且补给短缺。我们需要训练他们忍受恶劣的天气并用有限的物资战斗。"
 elite_forces:0 "精锐部队"
 elite_forces_desc:0 "只有万里挑一的人才能加入特种部队。通过训练的士兵将会比其他任何人更强壮，更快，并参与更艰苦的战斗。"
 jungle_warfare:0 "丛林作战"
 jungle_warfare_desc:0 "让我们的士兵能在丛林更有效率的训练。"
 HUN_light_infantry_tech:0 "轻型步兵师学说"
 HUN_light_infantry_tech_desc:0 "减少我们步兵师的支援装备以使他们更加灵活，这样可以在如城市或者要塞这种受限制的地型上的战斗中取得优势。"
 
 
 tech_recon:0 "侦察连"
 tech_recon_desc:0 "为部队配备侦察连可以为部队提供侦察能力，使部队可以在战斗中更好地采用战术。侦察连还能为部队提供额外的突破和主动性。"
 tech_recon2:0 "机动侦察连"
 tech_recon2_desc:0 "为后勤连提供摩托化和机械化装备，使其获得更高的机动性。"
 tech_recon3:0 "空中侦察连"
 tech_recon3_desc:0 "为通信连提供直升机作为机动载具，使其获得更高的机动性和空中视野，但是制空权会影响其作战和支援效能。"
 tech_recon4:0 "电子侦察连
 tech_recon4_desc:0 "结合了谍报，游击行动与别动队训练的深度侦查作战行动将有助于我方的战术抉择并让我方能随机应变调整决策。"
 tech_engineers:0 "工兵连"
 tech_engineers_desc:0 "构筑工事及清理障碍的能力使工兵在战场上至关重要。让工兵扮演全能的战场角色将使我方能在各种各样需要他们的环境中部署他们。\n工兵连可以减少单位在复杂地形的惩罚，增加防御部署速度和进攻堡垒时的加成。"
 tech_engineers2:0 "工程车"
 tech_engineers2_desc:0 "为工兵连提供摩托化和机械化装备，使其获得更高的机动性和工作效率。"
 tech_engineers3:0 "工兵连 III"
 tech_engineers3_desc:0 "军事工程项目的规模正逐步扩大。先进的基础设施支援将使过去因需求大量补给而无法在战场上实行的作业变为现实。"
 tech_engineers4:0 "架桥装备"
 tech_engineers4_desc:0 "借助工程机械和架桥设备，工兵可以迅速在河流上搭建浮桥，供部队前进。"
 hospital_tech:0 "野战医院"
 logistics_tech:0 "后勤连"
 recon_tech:0 "侦察连"
 tech_field_hospital:0 "野战医院 I"
 tech_field_hospital_desc:0 "“伤亡者”并不应完全指代“烈士”。确保这点的第一步是对撤到后方的伤员进行第一时间急救。"
 tech_field_hospital2:0 "机动医疗营"
 tech_field_hospital2_desc:0 "通过设立战地医院并将医疗救助拓展至急需处，众多无谓的阵亡与永久伤残将得以避免。"
 tech_field_hospital3:0 "空中机动医疗营"
 tech_field_hospital3_desc:0 "外科手术是战场最常见的急救措施之一。手术器械和工具必须足够贴近前线，亦应保证随军医疗单位中有熟练的外科医师。\n直升机运输的支援单位拥有更高的机动性，更小的地形惩罚和运作效率，但也意味着较低的战斗力和高成本。"
 tech_field_hospital4:0 "野战医院 IV"
 tech_field_hospital4_desc:0 "尽管战场医疗已获得诸多改进和长足进步，但仍未建立好理论体系。活用积累下的经验，我方能更清楚地诠释这些单位的职责，并将各类创新手段变成固定程序。"
 tech_logistics_company:0 "后勤连"
 tech_logistics_company_desc:0 "后勤连可以强化部队的后勤补给能力，加快其装备补充速度。"
 tech_logistics_company2:0 "机动后勤连"
 tech_logistics_company2_desc:0 "为后勤连提供摩托化和机械化装备，使其获得更高的机动性和补给效率。"
 tech_logistics_company3:0 "空中运输连"
 tech_logistics_company3_desc:0 "为通信连提供直升机作为机动载具，使其获得更高的机动性，但是制空权会影响其作战和支援效能。\n直升机运输的支援单位拥有更高的机动性，更小的地形惩罚和运作效率，但也意味着较低的战斗力和高成本。"
 tech_logistics_company4:0 "后勤连 IV"
 tech_logistics_company4_desc:0 "对补给进行标准化分类将使混乱最小化并使规划过程更高效。"
 tech_military_police:0 "宪兵队 I"
 tech_military_police_desc:0 "一般士兵也许可以短暂管理占领区，但他们首要且最重要的角色是战士。将宪兵整合入我军将保证我方有余力应对抵抗势力并针对破坏行动展开调查。"
 tech_military_police2:0 "宪兵队 II"
 tech_military_police2_desc:0 "通过在占领区履行诸如交通管理和维持公共秩序类的一般警察职责，我方宪兵将使滋生反抗军运动的混乱与无序最小化。"
 tech_military_police3:0 "宪兵队 III"
 tech_military_police3_desc:0 "通过与占领前发展的线人、建立的当地间谍网进行合作，我方宪兵能在抵抗势力可能产生的区域先行作好准备。"
 tech_military_police4:0 "宪兵队 IV"
 tech_military_police4_desc:0 "对妥善维持占领区治安来说，回归常态与拔除反抗同等重要。我方宪兵必须保证这个过程尽早展开以确保军民安全。"
 tech_signal_company:0 "通信连"
 tech_signal_company_desc:0 "建立并维持战场通讯永远需要专业技能。新型通讯、侦测技术在一战中出现了，这个领域在未来还有新的可能性。\n编制了通信连的部队可以增加作战主动性，使部队抵达战场后更快投入战斗，且通信连提供额外的组织度加成。"
 tech_signal_company2:0 "机动通信连"
 tech_signal_company2_desc:0 "为通信连提供摩托化和机械化装备，使其获得更高的机动性。"
 tech_signal_company3:0 "装甲指挥连"
 tech_signal_company3_desc:0 "在装甲车辆上安装通讯设备，使指挥官可以在装甲车内进行指挥。这不仅给予了指挥单位更好的机动性，也提供了三防防护性能。"
 tech_signal_company4:0 "空中通信连"
 tech_signal_company4_desc:0 "我方通讯技术兵们在运用通讯装备上有着无可比拟的实地经验。让他们参与新型通讯科技的研究将活用他们的技能。\n直升机运输的支援单位拥有更高的机动性，更小的地形惩罚和运作效率，但也意味着较低的战斗力和高成本。"
 tech_maintenance_company:0 "维修连 I"
 tech_maintenance_company_desc:0 "维护、修理及检修对于保持装备安全可靠以供使用至关重要。派专门的连队负责将保证此方面得到合适的关注。"
 tech_maintenance_company2:0 "维修连 II"
 tech_maintenance_company2_desc:0 "例行维护程序将降低装备故障的风险并警示士兵在装备损坏前就更换。"
 tech_maintenance_company3:0 "维修连 III"
 tech_maintenance_company3_desc:0 "确保士兵在战场上总有基本素材进行常规修理可以避免装备在已知损坏的情况下被持续使用。"
 tech_maintenance_company4:0 "维修连 IV"
 tech_maintenance_company4_desc:0 "一战中的主动冗余设计经验可以更新运用到更现代化的装备上以降低维护难度。"
 motorised_infantry:0 "摩托化步兵"
 motorised_infantry_desc:0 "通过更多运用机动车辆进行战场步兵运输，步兵单位原本低下的机动力得到大幅提高，这使更快速的反应与新型战略变成现实。"
 gas_peaons_1:0 "氯气"
 gas_peaons_1_desc:0 "在第一次世界大战中，德意志帝国首次将氯气作为一种毒气使用，从而打开了人类现代战争中最黑暗的一幕。"
 gas_peaons_2:0 "芥子气"
 gas_peaons_2_desc:0 "二氯二乙硫醚，是一种重要的糜烂性毒剂，因味道与芥末相似而得名。"
 
 
 basic_machine_tools:0 "基础机床"
 basic_machine_tools_desc:0 "机床是进行工业生产的机械，也是工业生产的基础。工人借助机床将原材料加工为产品。从最早的纺纱机、织布机，再到车床、锯床，工业机械的大规模使用标志着工业化的开始。"
 machine_tools_tip:0 "民用消费品产量:§G+25%§W"
 assembly_line:0 "装配线"
 assembly_line_desc:0 "装配线是工业生产的一种形式，即将工作任务分配到各个单位，使每个单位只需要进行一种工作或生产一种配件产品，最后完成组装。装配线最早由美国福特汽车公司实践，大大提高了产量，也使大规模生产成为可能，是工业史上的里程碑。"
 improved_machine_tools:0 "机械机床"
 improved_machine_tools_desc:0 "动力和机器设备将大大提高机床的工作效率。"
 advanced_machine_tools:0 "电子管机床"
 advanced_machine_tools_tip:0 "民用消费品产量:§G+25%§W\n§Y民用工厂§W将开始§R计算电力消耗§W"
 advanced_machine_tools_desc:0 "电子管和打孔命令卡被首次运用于机械制造后，便诞生了数控机床的概念。采用穿孔纸带作为存储介质，将机床动作的指令输入专用的数控装置，通过伺服驱动机构控制机床加工，由此首次将“数字指令”与“机械加工”直接联系起来，实现了复杂曲面零件加工的自动化，为后续所有计算机辅助制造奠定了基础。"
 assembly_line_production:0 "晶体管数控机床"
 assembly_line_production_desc:0 "随着晶体管和集成电路的出现，数控系统的可靠性提高、体积和成本有所下降，并可应用于大型企业的复杂零件加工。"
 computer_machine_tools_desc:0 "计算机数控机床"
 computer_machine_tools_desc_desc:0 "随着微处理器在70年代的出现，数控系统进入了计算机数控时代。系统核心从小规模集成电路变为通用的微型计算机。部分控制功能通过软件实现，灵活性大增，同时配备了CRT显示器，可显示程序、刀具路径和坐标信息，操作和调试大为方便。基于通用微处理器的CNC系统成本显著降低，开始向中型企业扩散。"
 digital_machine_tools_desc:0 "信息化数控机床"
 digital_machine_tools_desc_desc:0 "基于个人计算机系统的设计软件和数控系统开始出现，价格大幅降低，功能日益强大，使得中小企业也能用上先进的数字化工具。个人计算机架构的开放性打破了专用系统的垄断，加速了技术创新和普及。"
 modern_machine_tools_desc:0 "现代化数控机床"
 modern_machine_tools_desc_desc:0 "全球化加速。制造业的核心议题是如何在全球范围内优化资源配置、降低成本并提高质量。电主轴、直线电机、高速数控系统等技术的成熟，使机床进入高速高精时代。"
 
 
 CAD_machine_tools:0 "计算机辅助设计"
 CAD_machine_tools_desc:0 "计算机技术迅速发展，一些应用程式可用于支持产品的设计，并将设计信息载入到数控机床当中。早期的CAD系统运行在昂贵的大型计算机上，主要用于二维绘图和线框建模。"
 FMS_machine_tools:0 "柔性制造系统"
 FMS_machine_tools_desc:0 "为应对多品种、小批量生产的需求，英国学者首次提出了柔性制造系统的概念，即由一组数控机床、自动化物流系统和计算机控制系统组成，能够同时加工多种不同的零件，快速响应市场变化，实现了自动化与柔性化的统一。"
 CIM_machine_tools:0 "计算机联网制造"
 CIM_machine_tools_desc:0 "互联网的诞生进一步扩大了制造业的发展前景。通过计算机网络和数据库技术，将企业经营、产品设计、加工制造和管理信息等所有环节集成一个整体，由联网计算机负责管理车间的生产调度、物料跟踪、设备效率和质量管理，填补了计划与执行之间的信息鸿沟。从单机自动化，到产线自动化，再到整个企业的信息集成，最终迈向全球网络化协作。"
 robot_arms:0 "机械臂"
 robot_arms_desc:0 "通过计算机控制的机械臂，可以更快提高流水线生产的效率。"
 flexible_line:0 "3D打印"
 flexible_line_desc:0 "不要认为3D打印是21世纪才出现的东西，早在20世纪60年代，就已经有科学家研究，通过将计算机指令输入高度精密的数控机床，在现有的材料上制造出指定形状的材料了。"
 
 
 
 auto_industry:0 "民用车工业"
 auto_industry_desc:0 "随着全球汽车产量增加和汽车技术的发展，汽车已不再是一种富人专属的奢侈品，而实进入中产阶层，成为一种重要的消费品。"
 
 streamlined_line:0 "理工学院"
 streamlined_line_desc:0 "理工学院"
 improved_equipment_conversion:0 "改良装备改造"
 advanced_equipment_conversion:0 "先进装备改造"
 
 concentrated_industry:0 "炼铜工业"
 concentrated_industry_tool:0 "可以开始生产铜"
 concentrated_industry_desc:0 "铜在高热情况下可延展,且具有导电性,从至少公元前8000年开始(因此命名为铜器时代),它已被人类使用了几千年。铜主要被用在合金上面,比如青铜、黄铜和白铜,所有这些都更加耐用和坚韧,因此,铜非常适合用来制作护甲和剑这类物品。铜本身也具有一些有用的特性,毕竟人们需要在饮食中摄入微量的铜,以此来预防会使身体衰弱的疾病。"
 concentrated_industry2:0 "硫酸铜"
 concentrated_industry2_desc:0 "通过硫酸溶液将铜矿石中的铜分解出来，获得硫酸铜，再通过化学方式将铜还原。"
 concentrated_industry2_tool:0 "可以通过决议§Y提升省份等级以获得更多建筑槽§W"
 concentrated_industry3:0 "铜电解"
 concentrated_industry3_desc:0 "通过电解铜来将铜和杂质分离，获得纯度更高的铜。"
 concentrated_industry4:0 "传统高炉炼铁"
 concentrated_industry4_desc:0 "高炉炼铁是最基本的工业炼铁法，通过将氧化铁矿石和煤渣送入高炉进行氧化反应还原获得铁，但这种方式投入很高，污染严重。"
 concentrated_industry5:0 "工业高炉炼铁"
 concentrated_industry5_desc:0 "高炉炼铁是最基本的工业炼铁法，通过将氧化铁矿石和煤渣送入高炉进行氧化反应还原获得铁，但这种方式投入很高，污染严重。"
 electrolytic_aluminum:0 "电解铝"
 electrolytic_aluminum_desc:0 "铝是现代工业不可缺少的金属材料之一，曾经的铝生产成本极高，极为昂贵，但现代有了电解铝技术，我们可以轻松地将铝土矿制备成氧化铝。。"
 steel_making_tech:0 "炼钢"
 steel_making_tech_desc:0 "炼钢是将生铁炼制成钢材的重要步骤，通过将铁矿石和煤炭放入高炉，煤炭与铁矿石发生氧化反应还原成生铁水，最后根据需要在生铁水中加入碳元素，进行轧钢，最后形成钢材。钢是现代工业中最重要的合金材料，而炼钢技术则是工业国家不可或缺的技术。"
 coal_collection:0 "煤灰收集"
 coal_collection_desc:0 "在金属冶炼和发电的过程中，许多没有被完全燃烧的煤炭煤灰被排放到大气中，不仅造成了浪费，也严重污染环境，我们可以将煤灰进行收集，拣选还能燃烧的煤灰进行二次利用。"
 aluminum_tech:0 "铝合金"
 aluminum_tech_desc:0 "通过在铝中加入各种金属元素，可以获得有不同用处的铝合金，改变其质量、韧性、导电性和抗氧化性，得到我们想要的金属材料。"
 electric_arc_furnace:0 "电弧炉炼铁"
 electric_arc_furnace_desc:0 "利用电极电弧产生的高温熔炼矿石和金属的电炉。气体放电形成电弧时能量很集中，弧区温度在3000℃以上。对于熔炼金属，电弧炉比其他炼钢炉工艺灵活性大，能有效地除去硫、磷等杂质，炉温容易控制，设备占地面积小，适于优质合金钢的熔炼。"
 electric_arc_furnace_steel:0 "电气化炼钢"
 electric_arc_furnace_steel_desc:0 "通过电子操作系统来控制电弧炉、高炉和浇铸设备以提高炼钢厂的工作效率。"
 
 steel_makes_tech_1:0 "平炉炼钢"
 steel_makes_tech_1_desc:0 "平炉炼钢是现代工业炼钢的主要技术，平炉炼钢以废钢和生铁为原料，使用煤气或重油作为燃料，通过火焰的辐射热在熔池内进行精炼。其优点是工艺成熟、操作稳定、对原料适应性强（可使用大量废钢）。其致命缺点是冶炼时间长、能耗高、生产效率低。"
 steel_makes_tech_2:0 "氧气顶吹转炉"
 steel_makes_tech_2_desc:0 "氧气顶吹转炉是50年代炼钢技术的重大革新，它采用高纯度氧气从顶部垂直吹入铁水，快速去除碳、硅、磷等杂质。对比平炉炼钢，氧气转炉速度更快、无需外部燃料，依靠铁水本身的物理热和化学反应热，且钢水中氮、氢等有害气体含量低，大大改进了炼钢产出的产量和质量。"
 steel_makes_tech_3:0 "成熟氧气转炉"
 steel_makes_tech_3_desc:0 "氧气转炉借助消耗低、质量高的特点快速发展，大规模兴建LD式氧气转炉车间并使其取代平炉车间，已经成为许多钢铁产量大国的重要投资政策。"
 steel_makes_tech_4:0 "复合吹炼技术"
 steel_makes_tech_4_desc:0 "复合吹炼技术，即在转炉的底部吹入惰性气体搅拌，使冶炼反应更接近平衡，进一步提高了钢水质量和金属收得率。"
 
 steel_build_tech_1:0 "早期连续铸造"
 steel_build_tech_1_desc:0 "连续铸造是现代钢铁工业的一个关键性突破，连铸技术能将液态钢水直接凝固成所需断面的坯料，省去了铸锭和初轧工序，从而大大提升了生产效率，减少了成本。"
 steel_build_tech_2:0 "成熟连续铸造"
 steel_build_tech_2_desc:0 "在1960年代，连铸技术完成了从试验向工业化的跨越，实现了提高成材率10%以上、大大节省了能耗。尽管普及率还不高，但其巨大的经济效益已经显现，为后续的大爆发奠定了基础。"
 steel_build_tech_3:0 "短流程连铸"
 steel_build_tech_3_desc:0 "石油危机使得连铸的节能优势变得无比重要。各国钢铁企业开始大规模投资建设连铸机。连铸技术的发展，使得钢铁生产从炼钢—铸锭—初轧—精轧的长流程，向炼钢—连铸—精轧的紧凑式短流程演变，这是生产流程的一次根本性革命。"
 steel_build_tech_4:0 "紧凑流程连铸"
 steel_build_tech_4_desc:0 "在工业发达国家，连铸比继续大幅提高。连铸比普遍达到80%-90%以上，接近完全取代模铸。连铸机的性能、效率和可浇铸的钢种也不断扩大，以废钢为原料、电炉炼钢、连铸连轧的紧凑型钢厂成为钢铁工业的新主力。"
 
 steel_build_tech_tool:0 "钢铁厂的§Y铁矿石§W消耗：§G-15%§W"
 
 dispersed_industry_category:0 "农业"
 agriculture:0 "农业"
 agriculture_reward_tech:0 "农场的粮食产出§Y+0.5§W当前为[?agriculture_tech_reward]"
 dispersed_industry:0 "传统农业"
 dispersed_industry_desc:0 "民以食为天。人类在数千年的历史中学会的种植农作物和畜养牲畜，以从动植物中获得食物，为了提高产量和集中发展农业，农民们通过最早的刀耕火种，再到后来的开垦、灌溉、施肥等手段改善土地进行耕作，从而形成了农场。"
 dispersed_industry2:0 "化肥"
 dispersed_industry2_tool:0 "农场产生磷酸盐需求，当磷酸盐满足需求时，农场的食品产量翻倍。"
 dispersed_industry2_desc:0 "十九世纪，化学技术的发展促成了肥料、农药的诞生，通过人工生产的复合肥和杀虫剂，改善土壤肥力，去除病虫害，使粮食产量大增。但肥料和农药的过度使用会导致土壤盐碱化。"
 can_foods:0 "食品加工"
 can_foods_tech:0 "可以通过消耗民用工厂生产粮食"
 can_foods_desc:0 "十九世纪，化学技术的发展促成了肥料、农药的诞生，通过人工生产的复合肥和杀虫剂，改善土壤肥力，去除病虫害，使粮食产量大增。但肥料和农药的过度使用会导致土壤盐碱化。"
 dispersed_industry3:0 "温室"
 dispersed_industry3_desc:0 "温室是一种可以改善植物水土和光照条件的设施，大多由玻璃或透明塑料膜制造而成。通过玻璃或塑料膜，可以增强阳光对植物的光照作用，也可以控制水分增发。\n"
 dispersed_industry4:0 "农业机械化"
 dispersed_industry4_desc:0 "拖拉机、收割机、播种机、脱壳机和各种农业机械标志着农业机械化的到来，不仅大大改善了农业生产效率，减少成本，并使大规模的农业基地成为可能。使农业进入机械化时代是一个国家农业现代化的基本。"
 frozen_food:0 "食品保鲜"
 frozen_food_desc:0 "冷冻保鲜是现代农业史上革命性的技术，它不仅可以使食品保存更久，并且可以通过载有冷冻装置的车辆和船只，使谷物、肉类和食品被运输到更远的地方。"
 frozen_tips:0 "所有省份-2食品需求"
 dispersed_industry5:0 "滴灌"
 dispersed_industry5_desc:0 "滴灌是一种适用于荒漠等缺水地区的灌溉模式，通过管道直接连接至作物根部，提供水分和养分，从而实现以最少的用水量完成灌溉，尽可能地节约水资源。"
 agriculture_modernized:0 "数字化农业"
 agriculture_modernized_desc:0 "计算机和互联网的发展使农业生产设备可以通过计算机操作，不仅大大节省了人工成本，且计算机会根据气候、土壤等数据更好地安排耕作任务。"
 agriculture_hybird_rice:0 "杂交水稻"
 agriculture_hybird_rice_desc:0 "杂交水稻是通过将不同品种水稻进行杂交培育，从而提高其产量的水稻作物。水稻生长在亚热带地区，是中国、印度、日本等亚洲人口大国的主食。杂交水稻的出现大大提高了中国等国家的粮食产量，被视为绿色革命的重要科技成就。"
 digital_agriculture:0 "信息化农业"
 digital_agriculture_desc:0 "计算机和数据系统的出现也让农业获得了迅速的发展，通过计算机，农场可以更好的观测农作物、牲畜和鱼苗的生长状态，并通过电脑简便地操作农场里的设备。"
 husbandry_tech:0 "畜牧业现代化"
 husbandry_feed:0 "牲畜饲料"
 husbandry_feed_desc:0 "食物决定了人的成长和健康，对动物也是如此。通过现代化的手段生产符合牲畜需求的饲料，可以让它们长得健康强壮，生产质量更好的肉类和农副产品。"
 animal_doc:0 "兽医"
 fishing_net:0 "拖网渔船"
 fishing_net_desc:0 "拖网渔船是现代渔业最主要的捕鱼手段之一，渔船会拖着一张大网在海洋中航行，捕获所过之处的所有鱼类。虽然拖网渔船大大增加了渔业效率，但对海洋生态的破坏极大，20世纪末期，呼吁减少拖网使用的呼吁越来越大。"
 
 excavation_tech:0 "矿业开采"
 excavation1:0 "传统矿业开采"
 excavation1_desc:0 "矿车、铁镐、头盔和劳动的矿工，这就是矿业的起源。"
 excavation2:0 "工业化开采"
 excavation2_desc:0 "以蒸汽或燃油为动力的钻机使得矿业从此摆脱人工，进入机械化开采的时代。"
 excavation3:0 "电气化开采"
 excavation3_desc:0 "电力驱动的各种现代化设备将使得矿业开采效率更进一步。"
 excavation4:0 "信息化矿业开采"
 excavation4_desc:0 "计算机的出现使得人们可以更加方便地操作各种设备，我国矿业由此进入现代化。"
 excavation5:0 "矿业地质学"
 excavation5_desc:0 "新技术可以帮助我们更有效地收集资源。我们不再在开采时污染资源，从而提高了产量。"
 
 hight_rub:0 "材料学"
 synth_oil_experiments:0 "化学工业"
 synth_oil_experiments_desc:0 "进入20世纪后，随着石油工业和化学技术的迅速发展，以塑料、人工橡胶为代表的高分子材料得到进一步运用。石油炼制过程中产生的聚乙烯、丁二烯和己烷等产物可以通过加工制成人工塑料和合成橡胶，代替天然的树脂和橡胶。"
 early_refining:0 "早期精炼"
 early_refining_desc:0 "原油可被精炼为对现代战争至关重要的数种材料与物质。在精炼技术上保持领先对构筑现代工业是必要的。"
 polymer:0 "聚合物材料"
 polymer_desc:0 "合成或半合成的有机聚合物(通常)来源于高分子物质的石油化工产品,这些产品非常耐用、有延展性并且很轻,在现代文明里无处不在。塑料有多种形式,有的较硬,有的更柔韧,有的具有更好或更差的耐热性。塑料可被模压、压制、或挤压成几乎任何想要的形状。如今在生活中随处都能见到塑料,它的使用范围覆盖了各个方面,从汽车保险杠到假肢、从产品包装到现代家具、从家庭娱乐到最新武器。"
 polymer_tool:0 "允许通过决议建立材料学研究所，从而加快超导材料、纳米材料等技术的研究"
 superconductivity:0 "超导材料"
 superconductivity_desc:0 "超导材料是一种可以在极其低温的环境下，可以把电阻降到极低的材料，使得电流可以在没有电阻损耗的环境下传导。超导材料一开始被运用于创造强磁场，例如核磁共振等仪器都利用了超导材料，后来人们发现超导材料所创造的强力磁场可以让金属悬浮（迈斯纳效应），这便使得以往只在科幻作品中出现的悬浮交通工具成为了现实。"
 superconductivity_tool:0 "首先完成研究者+150国际影响力+200政治点数\n所有类型的发电厂+1发电量"
 
 oil_processing:0 "石油开采"
 oil_processing_desc:0 "合成蒸馏和精炼石油产品的工厂网络是确保我国燃料供应的下一个步骤。"
 improved_oil_processing:0 "注水驱油"
 improved_oil_processing_desc:0 "注水驱油是一种早期的石油开采技术，通过高压输水管道向石油层注入大量的水，从而将石油从另一头的出油管道挤出去，这种开采方式对地质破坏十分严重。。"
 advanced_oil_processing:0 "化学驱油"
 advanced_oil_processing_desc:0 "像聚丙烯酰胺这样的物质可以增加石油的活性，以增加驱油的效果。"
 modern_oil_processing:0 "化学活性剂"
 modern_oil_processing_desc:0 "氮气、二氧化碳和轻油可以作为活性剂，减少原油的黏性，使其更容易被开采，但这种化学手段不仅会导致地质环境遭到严重破坏，且会增加一定的成本。"
 
 rubber_processing:0 "人工橡胶"
 rubber_processing_desc:1 "一旦化学掌控了文明,科学家便开始寻找改进天然动植物产品的方法。首先,约瑟夫·斯万在19世纪80年代早期发现了合成纤维;他用树皮做成纤维,把其作为电灯泡能持久使用的灯丝,如果作为纺织品使用,效果会更好。法国人希莱尔·夏尔多内发明了人造丝,在1889年巴黎展览会上进行展出时广受好评。5年后,3名英国化学家发明了一种合成材料叫做“纤维胶”,1924年更名为“人造丝”。随后,在杜邦化学公司上班的华莱士卡罗瑟斯发明了尼龙。1941年英国发明了涤纶,这是第种聚酯纤维,也是战争成就的一部分。"
 improved_rubber_processing:0 "聚乙烯"
 improved_rubber_processing_desc:1 "聚乙烯是人类最早制造的人造橡胶之一，它可以被广泛用于制造包括水箱、水瓶、枪支配件和布料在内的绝大部分生活用品。"
 vulcanization:0 "硫化"
 vulcanization_desc:1 "聚合物中的某些元素可以和硫发生反应，产生的硫化物可以提高塑胶的防腐蚀性。"
 vulcanization_tool:0 "橡胶的总消耗减少20%"
 modern_rubber_processing:0 "苯胺"
 modern_rubber_processing_desc:1 "苯胺是一种重要的化学原料，在制造橡胶、染料和药物中具有重要用处。"
 
 rubber_product_techs_1:0 "烯烃聚合催化剂"
 rubber_product_techs_1_desc:0 "烯烃聚合催化剂由，是战后化工技术最重大的突破。由卡尔·齐格勒和居里奥·纳塔发明分别发明的用于烯烃聚合的催化剂，使得在温和条件下生产高密度聚乙烯（HDPE）和聚丙烯（PP）成为可能。HDPE比LDPE更坚硬、强度更高，PP则具有优异的耐热性和机械性能。这两种材料在1950年代后期迅速实现工业化，开启了聚烯烃塑料的时代。"
 rubber_product_techs_2:0 "高密度聚丙烯"
 rubber_product_techs_2_desc:0 "齐格勒-纳塔催化剂技术在全球范围内迅速普及和优化。聚丙烯由于其优异的综合性能（密度低、耐热、刚性好），成为增长最快的通用塑胶材料，也使得塑料作为一种廉价、多功能的材料，开始大规模进入普通家庭。"
 rubber_product_techs_3:0 "轻量化塑料"
 rubber_product_techs_3_desc:0 "石油危机导致石化原料成本飙升，这迫使产业界从追求规模扩张转向提升效率和开发高性能产品。了替代金属等传统材料，特别是在汽车等轻量化需求的行业，一系列高性能塑料得到大力发展。聚碳酸酯、聚甲醛、改性聚苯醚等材料被广泛使用。"
 rubber_product_techs_4:0 "早期茂金属催化剂"
 rubber_product_techs_4_desc:0 "茂金属是一种单位点催化剂，与齐格勒-纳塔催化剂的多活性中心不同，它能产生分子量分布极窄、结构非常规整的聚合物。它的出现预示着未来能生产出性能极其优异的聚烯烃，如具有高透明、高强度的LLDPE薄膜，高抗冲的聚丙烯等。"
 rubber_product_techs_5:0 "成熟茂金属催化剂"
 rubber_product_techs_5_desc:0 "经过80年代的研发，茂金属催化剂开始大规模工业化应用，主要生产高性能聚乙烯（mPE）和聚丙烯（mPP）。这些材料在薄膜包装等领域表现出远超传统材料的性能。"
 
 rubber_build_techs_1:0 "高压聚合技术"
 rubber_build_techs_1_desc:0 "是1930年代发明的技术，在1950年代得到大规模应用，主要用于低密度聚乙烯（LDPE），并用于电线绝缘、薄膜和包装。"
 rubber_build_techs_2:0 "螺杆式注塑成型机"
 rubber_build_techs_2_desc:0 "随着塑料部件在工业和消费品中的广泛应用，螺杆式注塑机取代了柱塞式，实现了更高效、更均匀的塑化，能够生产更大、更复杂的部件。挤出和吹塑技术同样飞速发展。"
 rubber_build_techs_3:0 "电气化塑胶生产"
 rubber_build_techs_3_desc:0 "电气化的生产车间，有利于工厂借助计算机系统，以更少的人力资源和管理成本，同时操作多台设备和多个车间进行生产工作。"
 rubber_build_techs_4:0 "双向拉伸吹塑技术"
 rubber_build_techs_4_desc:0 "双向拉伸吹塑技术被广泛应用于生产PET瓶，使其具有优异的透明度、气体阻隔性（防止二氧化碳泄漏）、强度和轻质性，使PET成为增长最快的塑料之一。"
 rubber_build_techs_5:0 "数字化塑胶生产"
 rubber_build_techs_5_desc:0 "数字化的生产车间，有利于工厂借助计算机系统，以更少的人力资源和管理成本，同时操作多台设备和多个车间进行生产工作。"
 rubber_build_techs_tool:0 "化工厂的§Y原油§W消耗：§G-15%§W"
 
 construction1:0 "传统建筑技术"
 construction1_desc:0 "工人们在炎炎烈日下，用砖、木材和建议混凝土建造出一座又一座楼房。"
 construction2:0 "钢筋混凝土"
 construction2_desc:0 "将沙石、石灰或石膏进行一定比例混合可以获得混凝土，搭配钢材进行加固，这是现代世界最重要的建筑材料"
 construction3:0 "机械化建造"
 construction3_desc:0 "有了铲车、挖掘机和水泥搅拌机等各种机械，建筑的效率大大提高了。"
 construction4:0 "摩天大楼"
 construction4_desc:0 "一座座高耸入云的大楼和起重机，象征着我国迈向发达的现代社会"
 construction5:0 "耐火砖"
 construction5_desc:0 "以硅或氧化铝为材料制作的耐火砖可以提高建筑的质量。"
 
 autos_equipment:0 "民用汽车"
 autos_equipment_0:0 "二战时期轿车"
 autos_equipment_0_desc:0 "自从1930年代，美国福特公司成功量产私家轿车，使其进入民间成为商品以来，为民众提供廉价、耐用且美观的轿车，便成为许多国家和政府的主要经济目标，既可以满足人民的消费需求，争取中产阶级的支持，又可以作为本国工业和经济实力的体现。"
 autos_equipment_1:0 "50年代私家车"
 autos_equipment_1_desc:0 "第二次世界大战后的世界各国都将汽车产业作为重要的发展方向，尤其是对于受到战争破坏的国家来说，汽车即可以用于恢复生产，又可以带动上游产业，还可以稳定民心。而在大洋彼岸的美国，社会进入消费主义黄金时代，汽车成为身份和风格的象征。\n美国汽车产业在这一时期首次采用自动变速箱，并利用夸张的火箭尾翼、大量的镀铬装饰、电动车窗、空调来吸引消费者，而欧洲专注于经济型小车，包括首次在量产车上采用机械式燃油喷射系统，性能卓越。"
 autos_equipment_2:0 "70年代私家车"
 autos_equipment_2_desc:0 "70年代同时处于石油危机和汽车消费繁荣的背景下，许多汽车企业开始发展更多创新的汽车设计。前置前驱发动机和水冷发动机开始普及，大排放的肌肉车让路于低能耗的经济型私家车，各种电子设备开始被运用到汽车当中，为乘客提供更舒适的体验。"
 autos_equipment_3:0 "80年代私家车"
 autos_equipment_3_desc:0 "电子设备和更现代化的外观开始被广泛运用到商用车设计当中，电子技术的发展使得汽车能够使用更高效的发动机、变速箱和油箱等。部分汽车已开始抛弃方形车头，而开始向更现代化的流线型设计发展。"
 
 basic_train:0 "铁路建设"
 basic_train_desc:0 "飞驰的火车、铺设全国的铁路网、列车上运输的矿产、军火和乘客，是我们的国家进入工业化的象征。"
 gasoline_train:0 "燃气机车组"
 gasoline_train_desc:0 "以煤矿为燃料的蒸汽机车已经是老古董了，以柴油或汽油为燃料的列车将以更少的能源需求带来更高的运输效率。"
 electro_train:0 "电力动车组 I"
 electro_train_desc:0 "电力技术将把铁路运输带入一个新时代，电气化的动车组速度不仅远远超过燃汽机车，并且更加安全与节约能源。"
 electro_train_2:0 "电力动车组 II"
 electro_train_2_desc:0 "电力技术将把铁路运输带入一个新时代，电气化的动车组速度不仅远远超过燃汽机车，并且更加安全与节约能源。"
 railway_control:0 "铁道管理系统"
 electro_train_desc:0 "铁道的管理和运营可谓是交通系统最复杂的一个工序之一，我们要确保每一班列车都根据规定在轨道上行驶而不出现意外。"
 
 power_generation1:0 "火力发电"
 add_1_plantpower_desc:0 "所有火力发电站+1发电量"
 power_generation2:0 "燃油发电"
 power_generation2_desc:0 "可以通过通过决议将发电站从消耗梅改为消耗燃油。"
 sun_plant:0 "太阳能发电"
 sun_plant_desc:0 "太阳能电场是一种利用大量太阳能电池阵列,将太阳的能量转化为消费者所用电力的电厂。每组阵列均由太阳能面板组成,并有多种安装方式。有的阵列可根据太阳移动轨迹进行转动,而一些则是固定的(虽然每年都会根据太阳与地球角度的变化进行调整)。每种阵列的安装方式都有各自的考虑,像是能源输出、成本和有效运行的空间。"
 wind_plant:0 "风力发电"
 wind_plant_desc:0 "为了保障运行效果,这类发电厂一般都会修建在能持续提供风力的区域,人们通常都会将地址选在丘陵与山脉地区中。当风力将涡轮机的叶片带动起来后,与其相连的联动轴将开始发挥发电机的效用,进而产生电力。尽管修建这类发电厂需要特殊的条件,但这项新兴的清洁能源生产技术近年来不断受到人们的欢迎。"
 power_generation3:0 "改进蒸汽轮机"
 power_generation3_desc:0 "通过改良蒸汽轮机和锅炉的密封、增加设备的耐热性，使用飞轮进行储能，可以有效提高发电机的工作效率。"
 cooling_tower:0 "蒸汽冷却塔"
 cooling_tower_desc:0 "高压蒸汽在通过发电涡轮之后，一般会直接排到大气中，但借助冷却塔，我们可以收集这些蒸汽并凝结成水，重新输入锅炉中，循环利用，减少浪费。"
 cooling_tower_tool:0 "发电厂的维护费用-20%"
 power_cable:0 "改进输电设备"
 power_cable_desc:0 "利用复合材料或高分子材料绝缘体制造的电缆将大大改善输电设备的寿命和效率。"
 power_cable_tool:0 "所有地区电力需求-20%"
 
 medical1:0 "基础卫生医疗"
 medical1_desc:0 "干净的水供应和下水道设施对文明的崛起至关重要,因为没有这些东西,人们更容易受疾病和死亡困扰,特别是当大家在城市中心挤在一起时。在约公元前2500年印度河流域的哈拉帕定居点摩亨朱-达罗和拉基加里遗迹里发现了城市下水道的最早痕迹。在那里,成群的家庭从口公共井里打水,并将污水(以及污水里的东西)倒进沿街的阴沟里。"
 medical2:0 "制药学"
 medical2_desc:0 "现代化的药物将帮助我们对抗疾病。"
 medical3:0 "抗生素"
 medical3_desc:0 "抗生素，又称盘尼西林，是20世纪最伟大的医学发明，它可以抑制细菌感染和病菌对身体的破坏，既可以用于平民医疗，也可以用于战争创伤。"
 medical4:0 "疫苗"
 medical4_desc:0 "利用人在患病后产生的抗体，制造疫苗对抗传染病。在20世纪，疫苗的普及消灭了天花等曾经杀死上千万人的瘟疫。"
 medical5:0 "外科手术"
 medical5_desc:0 "外科手术既可以帮助我们的人民对抗疑难杂症，也可以拯救受伤的士兵。"
 medical6:0 "高级医疗设施"
 medical6_desc:0 "在20世纪后半叶，科学的迅速发展促成了X光、超声波和CT在医学上的运用。"
 cell_tech:0 "细胞科学"
 cell_tech_desc:0 "细胞是所有生物的最基本组成部分，这些由氨基酸等元素组成的细胞构成了一切动植物和细菌。20世纪随着医学的发展，科学家们开始了对细胞的研究，并寻找治疗疑难杂症、增加农作物产量的手段。"
 cell_tech_tip:0 "所有城市、城镇地区+20%医疗产出\n需要完成“建立医学院”决议以加速研究"
 DNA_tech:0 "基因工程"
 DNA_tech_desc:0 "基因（DNA）即脱氧核糖核酸，是生物中一种可以决定生物生长发育和运作方式的蛋白质单元，他决定了一个人及其后代的样貌、体质甚至是性格，是动植物最基本的设计蓝图。20世纪中后期，对DNA的研究标志着遗传学的诞生，科学家们可以通过DNA研究生物的性质，比如通过检测DNA寻找杀人犯，或者是对其修改从而制造出人类想要的生物，例如转基因农作物，甚至是具有超强体质的人类，但后者充满道德争议。"
 DNA_tech_tip:0 "所有城市、城镇地区+30%医疗产出\n需要完成“建立医学院”决议以加速研究"
 
 electronic_mechanical_engineering:0 "电子机械工程"
 electronic_mechanical_engineering_desc:0 "复杂的电子机械科学，也是从最简单的电池、电线和灯泡组成的电路开始的。"
 radio:0 "无线电"
 radio_desc:0 "无线电可以使电子信号传播到数公里远的地方，方便民间通讯，也方便战场指挥。"
 radio_detection:0 "无线广播"
 radio_detection_desc:0 "无线广播电台已经是当今世界上最重要的传媒手段之一，他可以为人民传播信息，提高娱乐，也可以成为政府充当喉舌。"
 laser_weapon:0 "制导武器"
 laser_weapon_desc:0 "20世纪50年代初，电子技术的发展，热感应设备和激光的发明，标志着制导导弹的诞生。导弹可以通过复杂的传感器系统，捕捉并锁定光源，然后根据光源调整自己的方向或接受电子遥控手动调整方向，从而击中目标。导弹的诞生大大改变了现代战争。"
 infraed_homing:0 "乘波制导"
 infraed_homing_desc:0 "乘波是指通过发射激光、雷达波等光束指示目标，导弹通过捕捉反射回来的光束修正方向，以实现半自动制导。"
 television_guidance:0 "电视制导"
 television_guidance_desc:0 "通过在导弹上安装针孔摄像头，将画面传播到载具上，从而手动操作导弹，精准度比导弹自己依靠传感器制导效果要好得多，但成本也更加昂贵。"
 
 active_radar_homing:0 "主动雷达制导"
 semi_active_radar_homing:0 "半主动雷达制导"
 lines_homing:0 "线控制导"
 
 weader_radar:0 "气象雷达"
 weader_radar_desc:0 "通过雷达探测云团的动向和气温变化，气象专家将可以预测气象变化和天气情况。"
 SAR_radar:0 "合成孔径雷达"
 SAR_radar_desc:0 "合成孔径雷达使用微波进行探测，这大大增加了雷达探测的范围和精度，也使得人造卫星搭载雷达成为可能。"
 radar_station:0 "大型雷达站"
 radar_station_desc:0 "雷达越来越先进，其体积和所需要的电力也越大，这需要建设一个专门的雷达站来运行。"
 HTTP:0 "超文本传输协议"
 HTTP_desc:0 "超文本传输协议允许计算机用户通过互联网获取除了文字以外的图片、音乐乃至影像资料，而通过协议将这些信息排版之后，就有了我们看到的网页浏览。"
 single_chip:0 "单芯片处理器"
 single_chip_desc:0 "半导体技术的迅速发展，让计算机的处理器不再臃肿庞大，只需要在一枚微小的芯片上安装纳米级别的集成电路，就能完成大量的运算。"
 floppy:0 "软盘"
 floppy_desc:0 "是一种可以通过磁质来进行存储的介质，比起磁带，他们拥有更小的体积，更方便运输和存储，也更方便计算机使用。"
 electronic_invade:0 "网络入侵"
 labtab:0 "手提电脑"
 labtab_desc:0 "便携式电脑自从计算机出现以后就是科学家们研究的方向，随着计算机技术日益成熟，电脑的体积和元件越来越小，将电脑打包成一个可携带的微型计算机已成为可能。"
 ADSL:0 "调解器"
 ADSL_desc:0 "ADSL调解器可以把电话信号转变为计算机可以使用的数据信号，从而使得民众可以使用电话进行宽带连接，是伟大的互联网走进民众生活的第一步。"
 Optical:0 "光纤"
 Optical_desc:0 "光纤是一种由玻璃或塑料制成的纤维，利用光在这些纤维中以全内反射原理传输的光传导工具。由于信息在光导纤维的传输损失比电在电线传导的损耗低得多，更因为主要生产原料是硅，蕴藏量极大，较易开采，所以价格很便宜，促使光纤被用作长距离的信息传递介质。"
 net_cable:0 "改良通讯线路"
 net_cable_desc:0 "随着电子产品和大众传媒的普及，对通讯线路的需求也越来越高，工程师们开始寻找让电视线和电话线更加耐用，更加安全，传播得更远的方法。"
 net_base:0 "通讯基站"
 net_base_desc:0 "无线电视和无线电话的普及，要求政府建造更多的无线通讯基站，以为用户的设备提供无线网络。通讯基站的建造难点在于如何让无限讯号传播得更远，受到的信号影响更少，以及让那些觉得电离辐射会影响自己健康的老家伙闭嘴。"
 SSdisk:0 "固定磁盘"
 colored_television:0 "彩色电视"
 colored_television_desc:0 "要是能捕捉到大自然的真实色彩就好了。一想到它，我就发疯了。——安德鲁·魏斯，美国新写实主义画家"
 advanced_laund:0 "高级家用电器"
 advanced_laund_desc:0 "试试最新款的空调和冰箱！它能让你在七月的夏季享受最美味的冰棒和最凉爽的家！"
 medium_laund:0 "中级家用电器"
 medium_laund_desc:0 "把繁重的家务交给最新的洗衣机、洗碗机和吸尘器！这样你就有时间坐在彩色电视前观看精彩的节目！"
 minor_storage_tape:0 "微型磁带"
 minor_storage_tape_desc:0 "磁带是目前最重要的电子产品数据载体，但他的体积太庞大了，缩小磁带使其可以被更小的电子设备使用十分重要。"
 storage_tape:0 "磁带"
 storage_tape_desc:0 "电子技术的发展使得我们需要更方便，能够记录更多数据的载体。沾满磁粉的磁带可以通过磁头读取并记录信息，也比一次性打孔卡更环保。"
 minor_vaccum_tube:0 "微型真空管"
 minor_vaccum_tube_desc:0 "虽然真空管比晶体管更稳定，更耐用，但其庞大的体积依然是硬伤，我们需要寻求将真空管尽量缩小的技术。"
 component:0 "电子元件"
 component_desc:0 "电线、电阻、电容、电池……小小的电子元件构成了复杂而庞大的电子设备。"
 CRT:0 "阴极射线管"
 CRT_desc:0 "在我们观看电视节目时，玻璃屏幕背后的阴极射线管就是构成整个机器的核心。阴极射线管将光束投射到玻璃屏幕上，照射玻璃上的磷而发光，并通过改变光束强度而改变黑白，由此使得电视机产生画面。"
 transistor:0 "晶体管"
 transistor_desc:0 "晶体管是借助半导体材料工作的电子管，相较真空管，他的体积极为微小，通过先进的制造技术甚至可以达到纳米级别。半导体晶体管的出现使得电子芯片的规模大大缩小，从而促进了微型计算机的诞生。"
 vaccum_tube:0 "真空管"
 vaccum_tube_desc:0 "真空管是一种在电路中控制电子流动的电子元件。参与工作的电极被封装在一个真空的容器内，但有时也会有充气管。在半导体技术不发达的年代，真空管是绝大部分电子设备都会需要用到的设备，它的作用就象齿轮，可以调节电流、电压和开关。"
 early_computer:0 "早期计算机"
 early_computer_desc:0 "早在19世纪，科学家们就已经在研究一种可以帮助人们进行复杂计算的机器，二战时期来自战争的需求加速了计算机的开发。二战后，随着电子技术的迅速发展，电子计算机成为可能，通过将两条电路连接到一个晶体管，再接出一个输出路，构成一个计算单元，当数万个这样的计算单元拼接起来时，就可以进行二进制计算。"
 USA_early_computer:0 "ENIAC"
 PRC_early_computer:0 "103型计算机"
 SOV_early_computer:0 "BESM"
 SWE_early_computer:0 "BARK"
 medium_computer:0 "中型计算机"
 medium_computer_desc:0 "早期的电子计算机体积十分庞大，由数个柜子组成。随着半导体晶体管的诞生，我们不再需要巨大的计算机设备，我们可以将其简化，制造出一个柜子大小的中型计算机，使其更容易在民间普及。"
 USA_medium_computer:0 "IBM 1401"
 SOV_medium_computer:0 "Strela"
 Semiconductor:0 "半导体"
 Semiconductor_desc:0 "半导体材料是电子科技进入现代化的象征，这种材料主要为硅，他的导电能力介于导体和绝缘体之间，通过人为改变半导体的导电性，它可以起到晶体管控制电流的作用，从而制造出极其微小的芯片。"
 integrated_circuit:0 "集成电路"
 integrated_circuit_desc:0 "集成电路是一种可以将电路设计微型化的技术，通过将半导体材料打造成薄膜，然后根据电路设计进行切割打印，最后将其印制在芯片底板上，从而使得芯片可以通过这种微小的电路系统进行工作。集成电路的出现大大减小了处理器等计算机部件的体积，从而使微型计算机和小型家用电器的出现成为可能。"
 micro_computer:0 "微型计算机"
 micro_computer_desc:0 "集成电路和微型处理器的出现使得微型计算机的诞生成为可能。"
 USA_micro_computer:0 "Altair 8800"
 PRC_micro_computer:0 "	DJS-051A 微机"
 SOV_micro_computer:0 "MIR"
 GUI_computer:0 "图形处理界面"
 USA_GUI_computer:0 "Xerox Alto"
 personal_computer:0 "个人计算机"
 personal_computer_desc:0 "微型计算机的普及将使计算机终于可以进入个人家庭或经济企业使用。"
 USA_personal_computer:0 "Apple II"
 SOV_personal_computer:0 "Agat"
 FRA_personal_computer:0 "Minitel"
 YUG_personal_computer:0 "TIM-001"
 advanced_computer:0 "现代计算机"
 USA_advanced_computer:0 "Macintosh"
 basic_language:0 "语言命令"
 basic_language_desc:0 "早期的大型计算机需要进行内容庞大的计算，为了更简便的输入数据和命令，人们在60年代开始使用穿孔卡，通过卡片上穿孔的数量和位置来形成数据，然后将卡片插入计算机，使计算机可以通过卡片读出数据。在阿波罗计划中，为航天工程提供计算的计算机至少使用了数万张穿孔卡。"
 USA_basic_language:0 "BASIC"
 SOV_basic_language:0 "ALGOL"
 laundry:0 "家用电器"
 laundry_desc:0 "家用电器是现代电子技术革命的产物。从洗衣机、电冰箱再到微波炉，这些电气装置大大方便了人们的生活。家用电器早在20世纪30年代就已经出现，但二战之后的50年代才开始大量普及。"
 cable_television:0 "有线电视"
 cable_television_tip:0 "允许使用建立国家电视台和开办电视新闻决议"
 cable_television_desc:0 "早在二战前，电视就已经进入寻常百姓家中。战后英美等国放宽了电视机制造限制，彩色电视也被发明，电视普及率大大提高，逐渐取代电台广播成为日常生活的一部分。1954年，美国NBC电视台开始播放彩色电视节目。1956年，日本东芝公司推出最早的商业磁带录像设备。60年代，各国开始普及彩色电视广播标准，80年代，液晶电视出现。电视的普及不仅为人们带来娱乐，还是政治宣传的阵地。"
 telegraph:0 "通信工程"
 telegraph_desc:0 "二战后电话机的普及，使得通信工程成为一个重要的科学技术和市政建设项目，通过电缆或无线电将个个城市连接起来，让信息得以在个个城市快速传播，对军事，政治和经济都是有着巨大意义的。"
 game:0 "电子游戏"
 game_tip:0 "增加电子产品出口利润"
 game_desc:0 "电子游戏出现于1950年代，公认最早的电子游戏是1958年诞生的双人网球。60年代，电子游戏开始发展成型，1975年，美国雅达利公司推出了最早的家用游戏机，1977年又推出了划时代的Atari 2600游戏机，从此电子游戏得以在民间普及开来，到了80年代，电子游戏已经成为全世界风靡的娱乐活动，日本任天堂于1985年推出了第一台便携式游戏机Game boy，苏联也在同时期仿制了一些街机游戏机。"
 internet:0 "互联网"
 FRA_internet:0 "Mintel"
 internet_desc:0 "最早的互联网指的是计算机网络，即通过通讯技术将各个计算机连接起来，从而使各个计算机的使用者能够快速分享信息。现有的计算机网络起源于1960年代，美国军方通过阿帕网建立计算机网络，从而实现军事信息的快速传递。计算机网络在1970年代进入民间，并在1989年诞生了万维网。\n苏联也曾在1950年代末研发计算机网络，但因各种原因没有成功（详见OGAS词条）。"
 civic_internet:0 "万维网"
 civic_internet_desc:0 "互联网的诞生被认为是20世纪，甚至人类历史上最伟大的创造，他真正地标志着新时代的来临。80年代末，随着个人计算机普及，对信息传输服务的需求也越来越大。1989年，英国计算机学家Tim Berners-Lee创造了世界上第一个可以在线获取和编辑文本内容的信息库，并创造了配套的网页浏览器，由此标志着万维网的诞生。1991年1月，随着浏览器进入民用，万维网的时代正式来临。"
 sub_cable:0 "海底电缆"
 sub_cable_desc:0 "海底电缆可以将通讯光缆铺设在海底，从而使得讯息得以跨越大洋大洲传播。"
 cellular_network:0 "蜂窝网络"
 cellular_network_desc:0 "随着无线设备越来越普及，拥护遍布城市乃至农村，如何安排无线信号基站的位置成为难题。蜂窝网络即将无线基站服务范围以六角形蜂窝状划分，每个基站服务一个六角形区域。"
 mobilized_telephone:0 "移动电话"
 mobilized_telephone_desc:0 "移动电话即不需要连接信号线便可以进行通讯的电话。最早的移动电话出现在50年代的苏联，但由于其体积庞大而无法普及。1980年代摩托罗拉公司研发的Motorola DynaTAC是第一台商用移动电话，打开了通讯工具的新时代。"
 USA_mobilized_telephone:0 "Motorola Dyna TAC"
 AI_tech:0 "人工智能"
 AI_tech_desc:0 "从古希腊开始，人们就试着创造一个可以模仿人类行为并与人类交互的机械装置，20世纪50年代，计算机产业的发展使这一计划成为可能，人们开始对计算机输入逻辑语言，供其学习并模仿。1951年，曼彻斯特大学创造了一套计算机使用的西洋跳棋程序。80年代，日本开发出了第一款实用的人工智能程序，它可以根据现有的信息，分析出对象所患疾病。进入90年代，人工智能随着计算机的需求迅速发展，到了千禧年前，科学家已创造出如电影中那样，可根据已有程序和命令服务人类的AI机器人。\n有关人工智能，英国计算机学家艾伦·图灵曾提出一个著名的“图灵测试”，即一个人类与一个计算机对话，如果人类无法辨认出对方其实是计算机，那么后者就是成功的人工智能。"
 AI_Robot:0 "智能机器人"
 AI_Robot_desc:0 "在古希腊和三国时期的中国，人类都曾尝试制造机械构成的人或动物，来完成一些困难的工作。1920年，捷克文学家卡雷尔·恰佩克创作小说《罗索姆的万能佣人》，男主角制造了一台称作“罗伯特”的机械工人，Robot由此成为机器人的代名词。二战后，电子技术、信息技术和计算机技术的出现，使机器人进入人类的生产生活。1954年，美国制造出第一台工业机器人Unimate，1972年，日本早稻田大学制造出第一台人形机器人WABOT-1。1984年，WABOT-2问世，其能够根据乐谱并演奏风琴。\n虽然科幻作品中的可以自行活动、思考并与人类互动的智能机器人要到21世纪才问世，但在20世纪，人类就已经思考智能机器人的可能性并将其放入科幻文化作品。美国文学家艾萨克·阿西莫夫的作品《我-机器人》探讨了机器人的道德问题、机器人背叛人类的可能性和著名的机器人三大定律，而苏联在1935年的电影《感觉消失》中，探讨了机器人取代人类劳动和为劳动而生的机器人被当局用于镇压劳动者的可能。"
 
 decimetric_radar:0 "雷达"
 decimetric_radarr_desc:0 "雷达在第二次世界大战中大显神威，令敌人无所遁形。"
 improved_decimetric_radar:0 "相控雷达"
 improved_decimetric_radar_desc:0 "相位雷达又称阵列雷达，是一种将传感器排列在平面上的雷达，通过改变传感器的频率来调整波束发射方向，从而使雷达自身不需要调整方向便可扫描到更大范围和距离。相位雷达被普遍运用于战斗机和军舰扫描，也可用于扫描空中导弹。"
 centimetric_radar:0 "OTH天波雷达"
 improved_centimetric_radar:0 "导弹预警雷达"
 computer_consol:0 "电子操作台"
 computer_consol_desc:0 "电子化的机床大大提高了生产效率，复杂的机械操作现在只需要一个按钮就能进行。"
 mechanized_industry:0 "机械化生产"
 mechanized_industry_desc:0 "工厂里一排排的电子机床带来了电气化的流水线，工人们可以借助电子设备更高效地完成各种机械操作，同时人工操作导致的失误也减少。"
 computer_industry:0 "信息化生产管理"
 computer_industry_desc:0 "计算机的出现让工业生产迈向新时代，计算机将所有生产设备连接在一起，工人们可以通过电子设备同时操作多台机器，获取并记录生产状况信息，降低人工操作失误，当整座工厂的运行都处于计算机管理下时，我们可以宣布工厂已经进入了信息化。"
 electronic_mechanical_engineering:0 "电子机械工程"
 OGAS_desc:0 "OGAS，意为“自动化”，是苏联科学家格卢什科夫于1970年代提出的一个计算机控制下的智能经济体制设想。在OGAS计划下，苏联全国的经济数据都将被收集录入计算机中，然后通过计算机制定生产发展规划。格卢什科夫主张由智能、不需要休息、也不会贪污腐败的计算机来取代苏联的官僚体制，从而改善计划经济制度，实现共产主义，但这一方案最终也在苏联官僚阻挠下失败。"
 
 
 add_space_power_30:0 "航天能力+30"
 
 space_research:0 "航天工程"
 space_research_desc:0 "地球是人类的摇篮，但人类不能永远生活在摇篮里。"
 rocket_vehicle:0 "运载火箭"
 rocket_vehicle_desc:0 "德国在第二次世界大战中留下的火箭武器，经过改造就能成为太空探索的先驱。通过运载火箭，我们可以将卫星，甚至人送往太空。"
 tech_Satellite:0 "人造卫星"
 tech_Satellite_desc:0 "借助运载火箭向太空发射人造航天器，是人类进入太空豆第一步。"
 communie_Satellite:0 "通讯卫星"
 communie_Satellite_desc:0 "人造卫星环绕地球飞行，覆盖面广，如果在上面安装通讯装置，就可以有效地向全球传播我们的讯息。"
 rocket_engine:0 "改进发动机"
 rocket_engine_desc:0 "为了冲出地球，航天器需要巨大的升力，才能把巨大的运载火箭推离地球进入轨道。传统的液体燃料喷气引擎已经不能满足这个目标，必须研究更加先进的固体燃料推进器。"
 tech_spacemanned:0 "载人航天工程"
 tech_spacemanned_desc:0 "\n地球是人类的摇篮,但是人类不能永远生活在摇篮里。\n——康斯坦丁·齐奥尔科夫斯基"
 astronaut_uniform:0 "改进宇航服"
 astronaut_uniform_desc:0 "为了让我们的宇航员能够以更安全的状态在外太空活动，我们需要改进宇航服的各项指标。"
 adv_cockpit:0 "改进驾驶舱"
 adv_cockpit_desc:0 "利用计算机改造驾驶舱，使宇航员能够更方便地操作飞行器。"
 land_center:0 "发射中心"
 land_center_desc:0 "航天工程不仅在于发展航天器，地面控制中心也要跟上。改进地面的通讯设备、控制设备，更多的使用计算机进行控制。"
 command_center:0 "地面控制中心"
 solar_power:0 "太阳能电池板"
 solar_power_desc:0 "太阳能电池的使用，使航天器可以借助太阳获得能源，延长航天器的寿命，也让太空站的建造成为可能。"
 capsule_recover:0 "座舱回收"
 moon_landing:0 "登月"
 moon_landing_desc:0 "人类远征太空的理想已经成功迈出第一步，下一步我们要实现对太阳系的探索，第一个目标便是我们的邻居——月球。"
 modularization:0 "模块化"
 modularization_desc:0 "先制造太空飞船的不同部件，然后再进行拼装，大大减少建造太空船的成本，也能运用于未来大型空间站的建造。"
 space_station:0 "太空站"
 space_station_desc:0 "人类远征太空的重要一步，就是建造在宇宙中的落脚点。建造空间站，使其成为人类在太空的基地，宇航员可以在此休息、补给、从事研究活动，甚至长期居住。"
 space_live:0 "太空生活"
 space_live_desc:0 "要想在太空中长期居住，就要为宇航员们提供足够的生活资料。服装、食品、药品等事务都要特别提供。"
 lunar_rover:0 "月球车"
 lunar_rover_desc:0 "在人类前往火星等星球探索之前，我们需要先派出一些机器代替我们前去勘探，收集所需要的信息。"
 space_shuttle:0 "航天飞机"
 space_shuttle_desc:0 "随着大型空间站的建造完成，使用运载火箭进行补给显得十分不经济。我们需要一种更先进、高效的航天器，能够更节约、方便地完成向太空站输送补给的任务，并且可以返回地面多次使用。"
 reconnaissance_satellite:0 "军事侦察卫星"
 reconnaissance_satellite_desc:0 "人造卫星的广阔视野将为我们提供更加多的侦察情报。"
 space_research:0 "航天技术"
 
 anti_gravity:0 "反重力系统"
 radio_telescope:0 "射电望远镜"
 space_telescope:0 "太空望远镜"
 probe:0 "探测器"
 
 
 
 add_space_power_100:0 "+100航天能力"
 add_max_space_power_50:0 "+50航天能力上限"
 
 INFANTRY_NUKES_WEAPONS:0 "核武器"
 nuke_techs:0 "核武器技术"
 
 atomic_research:0 "原子能研究 "
 atomic_research_desc:0 "根据阿尔伯特·爱因斯坦的广义相对论，即使是质量微小的事物，其蕴含的能量也是极为庞大的（即著名的E=mc²），如果2磅的物质全部转化为能量的话，则会释放出相当于2200万吨TNT的能量，以及热核辐射。20世纪30年代，各国科学家开始寻求借助原子核裂变来获取这种能量，从而打开了核能这一潘多拉魔盒。\n注意：原子能科技树的研究需要事先进行核试验以加快研究速度！"
 nucelar_fusion:0 "核裂变 "
 nucelar_fusion_desc:0 "20世纪20年代，科学家们发现铀元素是一种极其不稳定的元素，铀原子在受到中子轰击时会释放出更多的中子，并继续轰击其他的铀原子，形成链式反应，从而释放出巨大的能量。随着第二次世界大战爆发，各国都开始加速，对原子能的研究。1939年，纳粹德国首先成功地将原子核进行了分裂，并在挪威建造了最早用于从重水中提取氘（俗称重水）的设施。美国当局得知后快速跟进，并在1945年完成了最早的核武器的制造，而在这一过程中科学家对原子能的研究进一步深入，人们开始探讨将原子能用于其他方面的可能。"
 nukes:0 "原子弹"
 nukes_desc:0 "1945年，借助对原子能的研究，美国成功研究出了世界上最早的核武器，当巨大的蘑菇云在广岛和长崎升起时，标志着原子时代的到来。原子能带给人类最大的“礼物”便是核武器，原子能释放出来的能量能够轻易摧毁一个城市，而当超级大国拥有数百枚核武器储备时，摧毁人类文明几乎没有难度。这就是为什么一个想要在国际舞台上有话语权的国家必须要有核武器。\n注意：原子能科技树的研究需要铀矿，铀矿不足将减缓研究速度！"
 nucelarfusion:0 "核聚变 "
 nucelarfusion_desc:0 "在原子能时代来临后，各国的核科学家开始寻求更进一步发挥出原子能的潜力。氘（俗称重水）、氚是两种氢的同位素液体，由一个质子、一个中子和一个电子组成，通过人工的高能加速器，使粒子轰击氘、氚原子，即可产生核聚变反应，即使得两种元素的原子聚合，并在这一过程中释放出更为可怕的能量。氘、氚元素进行核聚变从而释放能量的技术在二战结束不久后便被各个大国争相研究，以寻求威力更大的核武器的诞生。"
 thermonuclear:0 "氢弹"
 thermonuclear_desc:0 "氢弹主要利用氢的同位素（氘、氚）的核聚变反应所释放的能量来进行杀伤破坏，他比原子弹拥有更大的破坏力。\n注意：原子能科技树的研究需要铀矿，铀矿不足将减缓研究速度！"
 neutron_bomb:0 "中子弹"
 neutron_bomb_desc:0 "中子弹是一种以高能中子辐射为主要杀伤力的低质量战术氢弹，目的是杀伤敌方人员，对建筑物和设施破坏相对较少，主要作为战术核武器使用。\n注意：原子能科技树的研究需要铀矿，铀矿不足将减缓研究速度！"
 dirty_bomb:0 "脏弹"
 INFANTRY_STRAIT:0 "核战略"
 deterrence:0 "核威慑"
 deterrence_desc:0 "在大国博弈中，核武器的主要功能并不是在战场上使用，而是作为一种威慑存在，拥有核武器便意味着拥有话语权，既可以避免大国讹诈，也可以用来讹诈他人。"
 nuke_banlance:0 "核平衡"
 disarmament:0 "核裁军"
 disarmament_desc:0 "随着国际社会对核战争的抵制呼声越来越大，拥有大量核武器反而成为不受欢迎的目标。部分削减拥有的核武器数量可以一定程度上改善自身形象。"
 Mutual_Assured_Destruction:0 "保证相互毁灭"
 Mutual_Assured_Destruction_desc:0 "在核大国博弈的高峰时刻，只有能够保证使用核武器互相毁灭，才能有效避免真正的核战争爆发。"
 second_strike:0 "二次打击"
 second_strike_desc:0 "借助核潜艇和坚固的地下发射设施，确保我方的核武基地不会在敌人的一次核打击中被全部歼灭，保证我方在核打击之后仍有反击的能力。"
 INFANTRY_NCPLANT_WEAPONS:0 "原子能发电\n注意：原子能科技树的研究需要铀矿，铀矿不足将减缓研究速度！"
 nuclear_plant_1:0 "核能发电"
 nuclear_plant_1_desc:0 "核裂变产生的巨大能量，使得科学家开始研究其作为能源的可行性。通过将放射性物质制作成核燃料，放入水中发热产生蒸汽，就能驱动涡轮发电。核能发电比化石燃料成本更低，发电量更高，环境污染更小，人们相信这是原子能带给人类的又一个礼物。"
 nuclear_plant_2:0 "沸水反应堆"
 breeder_reactor:0 "快中子增殖反应"
 controlled_fusion:0 "可控核反应堆"
 minor_reactors_tech:0 "小型化核反应堆 I"
 minor_reactors_tech2:0 "小型化核反应堆 II"
 civilian_reactors_tech:0 "民用核反应堆"
 nuclear_plant_2_desc:0 "随着核能发电逐渐成为许多国家的重点项目，有关运营和维护核电站的技术也在发展。通过计算机，可以更好操作核电站的日常事务，此外，核燃料燃尽后的核废料处理问题也摆在了各国政府面前。"
 nuclear_plant_3:0 "压水反应堆"
 INFANTRY_SHELTER:0 "避难所"
 duck_cover:0 "躲避与掩护"
 duck_cover_desc:0 "50年代至70年代初，核战争的威胁笼罩着全人类，在加速进行核军备竞赛的同时，各国也在研究躲避核爆炸的可能性。一些国家开始按照二战时期躲避空袭的经验，对民众进行宣传，教导他们如何在核爆炸中保持冷静、卧倒在地并寻找掩护，但真正了解核爆的人都知道，几乎没人能在核爆中幸存。"
 shelter_1:0 "防空避难所"
 shelter_2:0 "核避难所"
 shelter_3:0 "长期避难所"
 add_buke_threat_tip:0 "增加核武器产生的核威慑"
 add_buke_reload_tip:0 "增加发射单位恢复工作的冷却速度"
 advanced_nuclear:0 "先进核能"
 
 helmet:0 "钢盔"
 helmet_desc:0 "钢盔是改变了现代战争的发明，他保护士兵的头部不受弹片杀伤，在第一次世界大战之后被广泛使用。"
 pattern:0 "迷彩服"
 pattern_desc:0 "迷彩服可以让士兵更好地借助地形隐藏自己，提高生存能力。在第二次世界大战中，迷彩服只有狙击手或伞兵等特殊部队使用，二战之后，各国开始研制迷彩服供部队作为制式服装。"
 gasmask:0 "防毒面具"
 gasmask_desc:0 "化学武器在一战中的大规模使用促成了军用防毒面具的使用，他将保护士兵避免吸入毒气，以提高生还几率。"
 NBCsuit:0 "三防装备"
 NBCsuit_desc:0 "随着核战争威胁加剧，化学武器、生物武器和战术核武器等大规模杀伤性武器对部队的威胁加剧，我们需要研制更先进的防化服、防毒面具和药品，加强士兵在特殊环境下的生存能力。"
 vest:0 "防弹背心"
 vest_desc:0 "随着军事技术进步，单兵装备越来越先进，用帆布和尼龙制成的背带式装具无法再满足士兵的携行需求。战术背心不仅可以满足士兵的需要，并且可以安装防弹插片提供保护。"
 
 rocket_interceptor:0 "喷气式截击机"
 rocket_interceptor_desc:0 "参考了滑翔机设计的喷气式截击机能在短时间内以超越任何其他飞行器的速度飞行。虽然冒着急剧燃料消耗的风险，其起飞拦截之迅捷将出乎任何敌机意料。"
 rocket_interceptor_2:0 "喷气式截击机 II型"
 rocket_interceptor_2_desc:0 "虽然仍被认为操作风险巨大，喷气式战机现已由自动驾驶辅助并由其他飞机牵引以在燃料有限的限制下将极速优势发挥至极致。"
 rocket_interceptor_3:0 "喷气式截击机 III型"
 rocket_interceptor_3_desc:0 "崭新的降落技术及更安全的燃料系统大幅提高喷气式截击机成功执行任务及生还的几率，并将这些尖端载具从前还停留在理论上的潜力发挥了出来。"
 interwar_artillery:0 "烟雾弹"
 interwar_artillery_desc:0 "通过火炮发射烟雾弹可以阻碍地方部队的视野，掩护我方进攻或转移。"
 artillery1:0 "火炮 I型"
 artillery1_desc:0 "使用更新型的材料与机械装置后，一战遗留的榴弹炮与野战炮可扩膛并升级以适应当前的战争。"
 artillery2:0 "炮侦雷达"
 SOV_artillery2:0 "Zoopark-1"
 artillery2_desc:0 "升级旧火炮必有其极限。设计急需的新式火炮时，利用好新型的液压反冲装置与长炮管。"
 artillery3:0 "激光测距仪"
 artillery3_desc:0 "随着火炮变得越来越强大,并能击中越来越远的目标因此需要找到如何能更精准、更快速计算弹道轨迹和弹着点的方法。过去那种睁开眼睛、随手一指猜测弹着点的时代已成为过去。应运而生的视距测距仪…在尤里乌斯·凯撒曾于《高卢战记》中提过的罗马十二面体测距仪基础上进行了改进。事实上,视距测距这种方法使用专门改造过的望远镜,可以快速计算距离,其原理是“相似三角形对应边成比例”,这在计算某个遥远事物可能是一堵墙,也可能是一艘正在航行中的船只一一距离的时候非常方便。事实上,到了19世纪中叶,所有沿海要塞都使用了视距测距仪。"
 artillery4:0 "火炮 IV型"
 artillery4_desc:0 "发展可拆卸运输的轻量化火炮可以将火炮支援延伸到过去无可企及的地方。"
 artillery5:0 "火控系统"
 artillery5_desc:0 "更方便携带的微型计算机将被运用于炮兵测绘，通过光学系统获取敌方目标位置和距离并输入到计算机中，就可以立刻获得火炮的校准数据。"
 mountain_gun:0 "山炮"
 mountain_gun_desc:0 "为适应印度北部的山地而设计的一种可以拆解放到驴背上移动到需要的地方的火炮。"
 rocket_artillery2:0 "火箭炮升级 I"
 rocket_artillery2_desc:0 "发射复数火箭弹的自行火炮可以快速制造大规模杀伤的同时保持机动以回避反击火力。"
 rocket_artillery3:0 "火箭炮升级 II"
 rocket_artillery3_desc:0 "牺牲一定射程后，更重型的火箭就能装载在更重型的载具上。透过小组行动，这些火炮单位可以合作一致进行快速的弹药装填与地点转移。"
 rocket_artillery4:0 "火箭炮 III型"
 rocket_artillery4_desc:0 "自旋稳定火箭将提高火箭炮射程。"
 antiair:0 "二战防空炮"
 antiair1:0 "探照灯"
 antiair1_desc:0 "附带更快速的装填装置后，使用大型弹药的防空炮就能保证必要的射速。"
 antiair2:0 "防空炮 1950"
 antiair2_desc:0 "防空炮需要更大型的弹药与更长的炮管以攻击高空飞行器。"
 antiair3:0 "曳光弹"
 antiair3_desc:0 "曳光弹是子弹底部带有发光药剂的炮弹，在发射时，被点燃的药剂会发出巨大光亮，照亮夜空，并留下一条长长的拖尾。炮手可以根据曳光弹的痕迹观测炮弹飞行轨道，校准弹道。曳光弹也可以作为照明弹或信号弹使用。"
 antiair4:0 "火控系统"
 SOV_antiair4:0 "RPK-2对空雷达"
 antiair4_desc:0 "结合现代化的雷达、计算机及自动装填系统将成为防空炮对高速飞行器进行及时应对的关键。"
 antiair5:0 "防空炮 1970"
 antiair5_desc:0 "地空导弹将是未来防空战斗的走向。设计地空导弹的机动平台是我们的下一步任务。"
 antitank1:0 "反坦克炮升级"
 antitank1_desc:0 "高效反坦武器的重要性在一战中确立。引入新一代反坦武器应对新型坦克是必要的。"
 antitank2:0 "反坦克炮 II型"
 antitank2_desc:0 "目前为止大多数反坦克炮属于轻型。为了对抗拥有倾斜装甲且以往更重型的坦克便需要更大型的反坦克炮。"
 antitank3:0 "改良反坦克炮升级 I"
 antitank3_desc:0 "使用空心装药的破甲弹（HEAT）可被用于反坦克炮以弥补不足的炮口初速。"
 antitank4:0 "改良反坦克炮升级 II"
 antitank4_desc:0 "使用脱壳穿甲弹（APDS）的新型多用途反坦克炮可以穿透几乎所有战车的装甲。"
 antitank5:0 "反坦克炮 V型"
 antitank5_desc:0 "结合多种新型弹药技术及高初速火炮，我军已准备好应对敌方新开发的任何装甲单位。"
