 convoy_defense_tree:0 "运输护航学说"
 convoy_defense_tree_desc:0 "海军护航舰至少自12世纪起就已存在,当时军舰的各个级别发展成为各自不同的种类,在任务中扮演不同的协同作战角色。在殖民时代,西班牙人和葡萄牙人派出军事护卫与他们缓慢的宝船一起抵御海盗和私掠船。拿破仑战争中,英国试图拦截法国粮食船队,护航队战术在此起到了显著作用;护航队席卷了多次战斗一一韦桑岛战役、多格滩战役和六月一日海战。一战期间,护航制由英国海军部制定,用来对付德国潜艇的威胁,随后,该策略继续用于大西洋更加致命的战斗之中。"
