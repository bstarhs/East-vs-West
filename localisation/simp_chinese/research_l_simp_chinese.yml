 spies_tech:0 "情报技术"
 fake_identity:0 "伪装身份"
 puppet_organization:0 "傀儡组织"
 puppet_organization_desc:0 "我们的情报人员可以在目标国家以经济或文化成立一些组织，并吸引当地人加入，从而成为一个可供利用的活动平台。组织里的人员可以为我们收集情报，进行活动，或作为发展下线的目标。"
 assassination:0 "刺杀技巧"
 intellegence_share:0 "情报共享"
 intellegence_share_desc:0 "有时候我们手中的情报可以作为一种筹码，向他人分享。与盟友共享情报可以加强双方合作，获取双方获得的信息，我们甚至可以向对手分享情报，以换取我们想要的东西。"
 communicate_tool:0 "通讯工具"
 code_tech:0 "密码学"
 code_tech_desc:0 "密码学是情报工作的重要部分，加密的信息往往难以破解其中的重要内容。我们的情报部门要学会加密我们传递的信息，也要学会破获敌人的密码。"
 update_code:0 "改良密码"
 update_code_desc:0 "保密就是保打赢。通过加密密码传播信息，敌人即使截获了我们的通讯，也无法从中获取信息。"
 electro_communicate_tool:0 "信息化通讯"
 electro_communicate_tool_desc:0 "信息技术的发展使通讯工具变得更小巧简便，间谍可以将电台和无线电话藏在小巧而不引人注意的包裹中。"
 eavesdropper:0 "窃听器"
 eavesdropper_desc:0 "不要抖机灵！不要耍个性！不要觉得找不到你！"
 supervisory:0 "监控"
 action_planned:0 "行动策划"
 action_planned_desc:0 "间谍行动往往说起来容易做起来难，无论是调查跟踪、刺杀目标还是执行作战行动，都需要提前做好充分的计划和研究。"
 secret_base:0 "秘密基地"
 base_moveing:0 "基地转移"
 minor_camera:0 "微型照相机"
 silence_pistol:0 "改良武器"
 silence_pistol_desc:0 "一个按下按钮就能射出针刺的打火机，一把可以伸出匕首的雨伞，或者可以暗中下毒的茶壶，可以裹住无声手枪的手套……间谍研发这些武器可不是为了好看，而是使其能够更加隐蔽地完成任务而不被发现。"
 special_unit:0 "特勤部队"
 action_train:0 "作战训练"
 special_unit_train:0 "特战队"
 interrogate:0 "审讯"
 interrogate_desc:0 "中国有句古话，识时务者为俊杰，眼下的各种刑具，想必一定能撬开阁下的嘴。"
 veritaserum:0 "吐真剂"
 will_power:0 "意志锻炼"
 will_power_desc:0 "间谍被怀疑、问询，被逮捕后遭受拷问，都是家常便饭，一个忠诚的间谍必须承受敌人疯狂的折磨，也不能透露半点信息，即使失去生命，也要忠于祖国。"
 bribe:0 "贿赂"
 bribe_desc:0 "谁说忠诚不能被购买呢？尤其是一些人手里急缺钱，而又有我们想要的东西的时候。"
 duble_agences:0 "双面间谍"
 duble_agences_desc:0 "忠诚是情报人员的原则，但背叛也屡见不鲜。一些有意投靠我方的敌对情报人员，我们可以与其接触，并让其在保持现有身份的前提下，继续为我们服务。"
 nuke_spies:0 "核间谍"
 nuke_spies_desc:0 "核武器强大而又象征着国际地位，许多国家都在发展核科技上跃跃欲试，但刺探敌人的核技术，不是普通间谍能够完成的，他不仅要有高超的渗透、潜伏和情报技巧，而且还要有丰富的和物理学知识。"
 destroy_action:0 "设施破坏"
 social_skiil:0 "社交话术"
 social_skiil_desc:0 "谈吐风趣，行事圆滑，善于社交是一个情报人员应有的素质，他们可以更好的与来自世界各国不同的情报人员交往，并获取有用的信息。"
 diplomatic_action:0 "外交工作"
 diplomatic_action_desc:0 "情报人员不仅可以进行情报工作，还可以作为外交官，合法地驻扎在外国，作为我国与该国进行外交活动的枢纽。"
