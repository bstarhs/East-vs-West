 Brazilian_introduce:0 "巴西人包括所有讲葡萄牙语的外来巴西地区居民，包括葡萄牙裔的白人和非洲裔，主要信仰天主教。"
 Bulgarian_introduce:0 "保加利亚人最早是中世纪迁移到巴尔干半岛的游牧民族，但今天已经斯拉夫化。主要讲斯拉夫化的保加利亚语，信仰东正教。"
 Burmese_introduce:0 "缅人是缅甸的主体民族，他们在公元6世纪从西藏迁移至此，讲汉藏语系的缅语，主要信仰上座部佛教。"
 Calidonian_introduce:0 "新咯里多尼亚的原住民属于美拉尼西亚民族。"
 Californian_introduce:0 "加利福尼亚的居民主要包括美国白人，也包括墨西哥裔和华裔。"
 Canadian_introduce:0 "英裔加拿大人即讲英语的加拿大白人居民，包括英裔和爱尔兰裔，主要信仰基督新教。"
 Canton_introduce:0 "广东人是位于中国南方广东省、广西省和香港、澳门的汉人分支，主要讲汉语分支粤语，信仰佛教、道教等，他们也在19-20世纪广泛地移民到了加利福尼亚、温哥华和新西兰。"
 Castile_introduce:0 "卡斯蒂利亚王国是西班牙的前身，因此卡斯蒂利亚人也是西班牙的主体民族，他们所使用的卡斯蒂利亚语也就是西班牙语，主要信奉天主教。"
 Catalan_introduce:0 "加泰罗尼亚是位于伊比利亚东北部的地区，当地居民主要使用加泰罗尼亚语，信仰天主教。"
 Chechinia_introduce:0 "车臣人是位于高加索山北部的达吉斯坦民族，主要讲印欧语系车臣语，信仰伊斯兰教。"
 Chilenos_introduce:0 "安第斯地区包括南美洲的厄瓜多尔、秘鲁和智利，这里的居民主要有西班牙裔的移民，或他们与原住民的混血，信仰天主教。"
 Chokwe_introduce:0 "乔奎人是分布于非洲的津巴布韦和莫桑比克一带的居民。"
 Colombian_introduce:0 "今天的哥伦比亚、巴拿马、委内瑞拉和厄瓜多尔历史上都是大哥伦比亚共和国的一部分，这里的居民主要为西班牙裔白人，或他们与原住民的混血，主要讲西班牙裔，信仰天主教。"
 Czech_introduce:0 "捷克人是生活在中欧地区的西斯拉夫民族，主要讲西斯拉夫语族的捷克语，信仰天主教。"
 Dennish_introduce:0 "丹麦人是生活在日德兰半岛的北日耳曼民族，主要讲北日耳曼语族的丹麦语，信仰天主教。"
 Deutscher_introduce:0 "北德意志人包括从波美拉尼亚到莱茵河的广大德意志地区，主要讲日耳曼语系的德语，信仰天主教或基督教路德宗。"
 Dutch_introduce:0 "荷兰人，或尼德兰人是位于尼德兰低地地区的北日耳曼民族，主要讲日耳曼语系的荷兰语，信仰基督教加尔文宗。"
 English_introduce:0 "英格兰人是中世纪从欧洲迁徙到不列颠的盎格鲁-撒克逊人的后裔，是大不列颠联合王国的主体民族，主要讲日耳曼语系的英语，信仰以圣公会为主的基督新教。"
 Finnish_introduce:0 "芬兰人自称索米人，是位于斯卡的那维亚东部的古老民族，但他们不属于北欧其他国家的日耳曼人，他们的语言属于乌戈尔语族，主要信仰基督教路德宗。"
 Flanders_introduce:0 "佛兰德斯地区即比利时北部的低地地区，这一地区使用由荷兰语演变而来的佛兰德斯语，主要信仰天主教。"
 French_introduce:0 "法兰西人是位于欧洲西部的拉丁化的日耳曼民族，主要使用拉丁罗曼语系的法语，信仰天主教。"
 Gerogians_introduce:0 "格鲁吉亚人又叫萨卡特维洛人，是位于高加索地区西部的民族，主要使用印欧语系的格鲁吉亚语，信仰东正教。"
 Azerbaijan_introduce:0 "阿塞拜疆人是位于高加索地区东部的突厥化波斯人，主要使用突厥语系的阿塞拜疆语，信仰伊斯兰教。"
 Greeks_introduce:0 "希腊人是欧洲最古老的文明种族，居住于巴尔干半岛南部，主要使用印欧语系的希腊语，信仰希腊东正教。"
 EastRoman_introduce:0 "希腊人是欧洲最古老的文明种族，居住于巴尔干半岛南部，主要使用印欧语系的希腊语，信仰希腊东正教。"
 Guarani_introduce:0 "瓜拉尼人是分布于巴拉圭河和拉普拉塔河流域的原住民，是巴拉圭的主要民族。"
 Han_introduce:0 "汉族是中国的主体民族，也是世界上人数最多，分布最广的民族和最古老的文明之一，建立了亚洲最大的文明并影响了周边国家，主要讲汉语及其各种方言，多信仰佛教、道教等宗教。"
 Hawaii_introduce:0 "夏威夷群岛的原住民属于波利尼西亚文化，使用波利尼西亚语族的夏威夷语。"
 Hindustan_introduce:0 "印度斯坦指从德里到孟加拉的，以恒河流域为主的广大印度北部地区，是印度文明的发源地，这里的居民主要属于印欧民族，讲印欧语系的印地语，信仰印度教、锡克教、者那教和佛教等。"
 Hungarian_introduce:0 "匈牙利人的祖先马扎尔人是来自亚洲的游牧民族，他们在10世纪来到潘诺尼亚平原并欧洲化。匈牙利人使用带有明显乌戈尔语系特点的马扎尔语，主要信仰天主教。"
 Irish_introduce:0 "爱尔兰人是来自爱尔兰岛的凯尔特民族，并在19世纪向其他英语国家移民。由于经过了英格兰漫长的统治，爱尔兰人已经以英语为主，盖尔语成为濒危语言。爱人懒人主要信仰天主教。"
 Israeli_introduce:0 "以色列人即近代追随犹太复国主义来到巴勒斯坦的欧洲犹太人，他们相信犹太人在数千年前就已经在巴勒斯坦定居，但反对锡安主义者认为欧洲犹太人不是真正的以色列人。以色列人主要使用希伯来语，信仰犹太教。"
 Italian_introduce:0 "北意大利即罗马以北的意大利地区，这里的居民主要是古罗马拉丁人与日耳曼伦巴底人的后裔，主要信仰天主教，通用意大利语，但各地有不同的方言。"
 Japanese_introduce:0 "日本人是分布于亚洲日本列岛的民族，他们可能属于南岛民族，但是语言文化深受中国影响。日本人主要信仰佛教和神道教。"
 Khazakhs_introduce:0 "“哈萨克”意为“脱离”或“自由”，他们由16世纪脱离乌兹别克汗国的突厥部落演变而来，哈萨克人主要讲东突厥语系的哈萨克语，信仰伊斯兰教。"
 Khmer_introduce:0 "高棉人是位于东南亚的一个民族，分布于柬埔寨和越南南部的湄公河流域，历史上曾经建立了伟大的高棉文明。高棉人讲汉藏语系的高棉语，信仰上座部佛教。"
 Korean_introduce:0 "朝鲜人，或称高丽或韩民族，是分布于亚洲朝鲜半岛的民族，由中国东北的游牧民族进入朝鲜后和半岛本土的三韩部落的后裔组成，讲带有蒙古语系特点的朝鲜语，主要信仰佛教，基督教也有一定影响力。"
 Amharic_introduce:0 "阿姆哈拉人是埃塞俄比亚的主体民族，讲闪语系阿姆哈拉语，主要信仰埃塞俄比亚正教。"
 
