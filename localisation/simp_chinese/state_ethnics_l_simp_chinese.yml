 ETHNIC_AFRIKAANERS_INFO:0 "§Y阿非利卡人§W"
 afrikaans_introduce:0 "阿非利卡人又叫布尔人，是讲荷兰语的南非荷兰移民后裔，主要信仰加尔文教。"
 ETHNIC_ABROGINAL_INFO:0 "§Y澳洲原住民§W "
 abroginal_introduce:0 "澳洲原住民包括金伯利人、群岛人等。"
 ETHNIC_ALBANIAN_INFO:0 "§Y阿尔巴尼亚人§W "
 alabanian_introduce:0 "阿尔巴尼亚人是古巴尔干半岛伊利里亚民族的后裔，他们使用独特的阿尔巴尼亚语，主要信仰伊斯兰教。"
 ETHNIC_AINU_INFO:0 "§Y阿依努人§W"
 ainu_introduce:0 "阿伊努人是讲阿伊努语的鄂霍茨克民族，是日本北部和萨哈林岛的原住民。"
 ETHNIC_AMAZIGHS_INFO:0 "§Y阿马齐格人§W"
 Amazigh_introduce:0 "阿玛齐格人又叫柏柏尔人，是讲阿玛齐格语族的北非地区游牧部落原住民族，主要信仰伊斯兰教。"
 ETHNIC_AMHARIC_INFO:0 "§Y阿姆哈拉人§W"
 Amharic_introduce:0 "阿姆哈拉人是埃塞俄比亚的主体民族，他们认为自己是示巴古国的后裔，讲闪语系阿姆哈拉语，主要信仰埃塞俄比亚正教。"
 ETHNIC_ARABS_INFO:0 "§Y阿拉伯人§W"
 Arabs_introduce:0 "阿拉伯人是起源于阿拉伯半岛，现在广泛分布在中东和北非地区的民族，也是伊斯兰教的创造者，是阿拉伯国家的主体民族，讲闪语系阿拉伯语，主要信仰伊斯兰教。"
 ETHNIC_ARGENTINA_INFO:0 "§Y拉普拉塔人§W"
 Argentina_introduce:0 "拉普拉塔地区包括阿根廷、巴拉圭和乌拉圭的居民，主要由西班牙裔，以及少数的意大利和德意志移民组成，主要讲西班牙语，信仰天主教。"
 ETHNIC_ARMENIAN_INFO:0 "§Y亚美尼亚人§W"
 Armenian_introduce:0 "亚美尼亚的是位于高加索山南部和小亚细亚东部的古老民族，主要讲印欧语系亚美尼亚语，信仰亚美尼亚正教。"
 ETHNIC_ASHANTI_INFO:0 "§Y阿散蒂人§W"
 Ashanti_introduce:0 "阿散蒂人是位于西非海岸的民族，主要讲班图语。"
 ETHNIC_ASSAMESE_INFO:0 "§Y阿萨姆人§W"
 Assamese_introduce:0 "阿萨姆人是位于印度东北部的民族，主要讲汉藏语系的阿萨姆语，信仰佛教或基督教。"
 ETHNIC_AUSTRALIAN_INFO:0 "§Y澳大利亚人§W"
 Australian_introduce:0 "广义上澳大利亚人包括大洋洲澳大利亚和新西兰的白人居民，主要由英裔或爱尔兰裔移民，通用英语，信奉基督新教。"
 ETHNIC_AUSTRIAN_INFO:0 "§Y奥地利人§W"
 Austrian_introduce:0 "奥地利是德意志人的一支，但一战后的政治原因使他们宣布自己是独立民族。奥地利人主要讲南德语，信仰基督教的路德宗或天主教。"
 ETHNIC_AYMARA_INFO:0 "§Y艾马拉人§W"
 Aymara_introduce:0 "艾马拉人是分布在安第斯山中部玻利维亚一带的原住民，主要讲艾马拉语。"
 ETHNIC_BAKONGO_INFO:0 "§Y巴刚果人§W"
 Bakongo_introduce:0 "巴刚果人是分布在刚果河中下游的民族，主要讲班图语系刚果语。"
 ETHNIC_BAMBARA_INFO:0 "§Y班巴拉人§W"
 Bambara_introduce:0 "班巴拉人是位于非洲西部尼日尔河流域的民族，也是历史上马里帝国的建立者，主要讲班巴拉语。"
 ETHNIC_BANGLADESH_INFO:0 "§Y孟加拉人§W"
 Bangladesh_introduce:0 "孟加拉人是分布于印度次大陆东部恒河下游的民族，主要讲印欧语系的孟加拉语，信奉伊斯兰教。"
 ETHNIC_BAVARIAN_INFO:0 "§Y巴伐利亚人§W"
 ETHNIC_BASQUE_INFO:0 "§Y巴斯克人§W"
 Basque_introduce:0 "巴斯克人是生活在比斯开湾东部沿岸的古老民族，他们使用的巴斯克语是一种完全独立的语言，主要信仰天主教。"
 ETHNIC_BELARUS_INFO:0 "§Y白罗斯人§W"
 Belarus_introduce:0 "白罗斯人是讲白罗斯语的东斯拉夫民族，主要信仰东正教。"
 ETHNIC_BHUTAN_INFO:0 "§Y不丹人§W"
 Bhutan_introduce:0 "不丹位于喜马拉雅山南部的藏族分支，他们在17世纪脱离西藏后发展出独立文化，主要讲藏语族宗卡语，信仰藏传佛教噶举派。"
 ETHNIC_BOSNIAK_INFO:0 "§Y波斯尼亚人§W"
 Bosniak_introduce:0 "波斯尼亚人是奥斯曼帝国统治时期改宗伊斯兰教的突厥化南斯拉夫人，主要讲南斯拉夫语族的波斯尼亚语，信仰伊斯兰教。"
