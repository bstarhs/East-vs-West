l_simp_chinese:
 
 roc.1.t:0 "蒋介石当选中华民国总统"
 
 roc.1.t:0 "蒋介石当选中华民国总统"
 
 roc.4.t:0 "国民党军队撤往缅甸"
 roc.4.d:0 "在中共军队基本占领云南省全境后，残存的国民党军队向南进入缅甸境内，占领了萨尔温江一带没有人烟的密林当中。"
 
 roc.5.t:0 "反共救国军向云南发起攻击！"
 roc.5.d:0 "盘踞于缅甸禅邦的国民党残军，今日越过中缅边境，向中共控制下的云南地区发起进攻！"
 
 roc.6.t:0 "反共救国军撤退"
 roc.6.d:0 "经过激烈的交战，侵犯云南边境的国民党反共救国军被解放军击退，一些潜伏进云南境内的亲国民党武装也被解放军肃清。"
 roc.6.a:0 "一次紧张的作战。"
 
 roc.7.t:0 "反共救国军攻入云南境内！"
 roc.7.t:0 "反共救国军经过激烈交战，成功击退驻守中缅边境的中共军队，并攻入沧源、耿马、澜沧、双江等地，将当地的中共军政机构摧毁，破坏生产设施后撤回缅甸。"
 
 roc.8.t:0 "蒋介石加入共产党"
 roc.8.d:0 "在经过与中共党员的交谈以后，国民党领导人蒋介石终于幡然醒悟，深刻地意识到了自己发动内战的错误。蒋决定痛改前非，加入中国共产党，将中华民国改造成一个社会主义国家。为了表示与过去彻底决裂，他改名为“常凯申”。"
 
 roc.10.t:0 "蒋介石恢复权力"
 roc.10.d:0 "中华民国政府再一次更迭，蒋介石宣布恢复权力，复行视事，再次就任中华民国总统。"
 
 roc.12.t:0 "中国人民解放军占领中国大陆"
 roc.12.d:0 "在南京陷落后，中华民国总统蒋介石先后逃亡重庆、昆明、广州，最后在台湾台北落脚。中国大陆的战局已经非常明显，除了部分沿海岛屿，中共领导的中国人民解放军已经控制了大陆的绝大部分地区。蒋介石看起来非常失落，但他仍然相信，如果以台湾作为最后的基地，反攻大陆有朝一日一定能实现。/n随着中共军队占领广州、昆明和迪化，整个大陆都已经落入中国共产党的统治中。毛泽东已经在北京宣布成立中华人民共和国，现在，如何治理好这个新国家，并清除残余的国民党势力，成为其需要考虑的问题。"
 
 roc.13.t:0 "金门炮战"
 roc.13.d:0 "随着金门岛上响起隆隆炮声，中共军队向岛上的国民党守军发起炮击，宣告着解放军对金门的进攻正式打响！"
 
 roc.15.t:0 "台湾发生市民动乱"
 
 roc.16.t:0 "台湾省政府总辞职"
 roc.16.d:0 "中华民国管制下的台湾发生了警民冲突，一商贩被警察打死后引发群众暴动。中华民国政府迅速介入，派遣调查团前往台北平息怒火。南京方面最终决定将责任归咎于陈仪领导下的台湾省政府，迫使陈仪等辞职、组织新省府、释放政治犯，并作出一系列承诺后才平息民怨。"
 
 roc.17.t:0 "中国军队在台湾镇压暴动"
 roc.17.d:0 "中华民国管制下的台湾发生了警民冲突，一商贩被警察打死后引发群众暴动。中华民国政府迅速介入，派遣军队前往台湾进行了暴力镇压，军队的无差别攻击导致的严重的伤亡，大量台湾政界人士被捕。"
 
 roc.20.t:0 "中华民国颁布《整肃匪谍条例》"
 roc.20.d:0 "为了对抗台湾日益严重的中共势力渗透，中华民国颁布《整肃匪谍条例》，鼓励群众举报任何与中国共产党有关的人士。"
 roc.20.a:0 "台湾的局势变得复杂了。"
 
 roc.21.t:0 "台湾警备司令部成立"
 roc.21.d:0 "在二二八事件后，台湾民间对中国国民党政权的抵制愈发严重，政府为此成立台湾警备司令部，以动用军警镇压。"
 
 roc.22.t:0 "台湾南投暴动"
 roc.22.d:0 "二二八事件的镇压行为导致了台湾群众的大规模暴动，南投县爆发名为二七部队的群众暴动，其领导人有中国共产党支持。"
 
 roc.23.t:0 "二七部队大起义"
 roc.23.d:0 "台湾共产党领导的二七部队迅速扩张，在击溃了国民党的镇压部队后，开始进攻高雄、台南等城市。谢雪红宣布成立台湾人民解放军，与中国共产党配合，对抗统治台湾的中国国民党政权。"
 
 roc.24.t:0 "国民党军队在台南清乡"
 roc.24.d:0 "二二八事件导致的暴动在中国国民党军队暴力镇压下逐渐减少。"
 
 roc.26.t:0 "台湾省特别政府成立"
 roc.26.d:0 "二二八事件后，中国国民党政府在台湾的声望遭到重创，蒋介石被迫解散台湾省政府，并任命陈诚前往台湾组建新的特别政府。陈诚抵达台湾后成功地稳定了局势，得到了大部分台湾群众的认可，而这也使得陈诚在台湾获得了巨大的自治权力。"
 
 roc.27.t:0 "中华民国政府迁往广州"
 roc.27.d:0 "随着南京被中国共产党占领，中华民国政府的一系列军政机构向南迁徙，前往南部城市广州。"
 
 roc.28.t:0 "中华民国政府迁往台北"
 roc.28.d:0 "随着中国国民党军队在中国大陆全面崩溃，广州、重庆等城市告急，国民党政府的政府机关和残余军队纷纷向台湾撤离。"
 
 roc.30.t:0 "蒋介石去世"
 roc.30.a:0 "蒋经国！"
 roc.30.b:0 "蒋纬国！"
 
 roc.40.t:0 "《中美共同防御条约》签署！"
 roc.40.d:0 "美国政府宣布，美国已和中华民国签署了新的《中美共同防御条约》，美国将向中华民国提供更多的军事和经济援助，以帮助自由中国对抗共产党的颠覆和入侵。"
 
 roc.41.t:0 "美国宣布派遣部队进入中国"
 
 roc.42.t:0 "中共军队开始进攻金门"
 roc.42.d:0 "随着金门岛上响起隆隆炮声，中共军队向岛上的国民党守军发起炮击，宣告着解放军对金门的进攻正式打响！"
 
 roc.43.t:0 "中共进攻金门受挫"
 roc.43.d:0 "尽管进行了猛攻，但中共军队仍然未能在金门岛滩头上建立阵地，最终被迫撤离，解放军对金门的进攻宣告失败。"
 
 roc.44.t:0 "中共攻占金门"
 roc.44.d:0 "随着中共军队攻上金门岛和大胆岛，并在岛上升起五星旗，中共军队宣布，完全占领金门，岛上国民党守军被迫投降。至此，中华民国失去的大陆沿海的所有岛屿，只剩下了台湾和澎湖。"
 
 
 
 roc.55.t:0 "美国宣布协防台湾"
 roc.55.d:0 "美国国务院已通过台湾决议案，宣布派遣舰队前往台湾沿海和中国沿海地区，以阻止中国共产党部队的海上威胁。"
 
 roc.50.t:0 "外省人肃清令"
 roc.50.d:0 "台湾共和国新总统郑南榕在台北发布电视讲话，宣布台湾建国之后的第一个任务就是肃清在台湾人头上作威作福已久的中国人，以复二二八、清乡之仇。随着戒严令发布，已经完全由台湾本土人掌控的台湾国防军开始抓捕前中国国民党成员，根据前方记者发回来的消息，已经有超过五千名国民党成员及其家属被军方逮捕，台湾的街道上时不时传来枪声。根据郑南榕政府的计划，台湾共和国将在2年内灭绝岛上的“唐山仔”"

 roc.51.t:0 "美国希望支持台湾民主运动"
 roc.51.d:0 "美国总统[USA.GetLeader]最近在一次讲话中，指责中华民国现政府过于独裁和暴力，敦促中华民国政府停止侵犯人权，尽快走向民主改革，并表示了对台湾独立运动的关注。"

 roc.52.t:0 "美国宣布尊重一个中国"
 roc.52.d:0 "美国总统[USA.GetLeader]最近在一次讲话中宣布，作为改善与中华人民共和国关系的一部分，美国将承认北京的一个中国政策，这或许意味着，美国已经放弃了对台湾的中华民国政府的保护。"
 
 roc.60.t:0 "中华民国不再承认[MON.GetName]"
 roc.60.d:0 "中华民国政府发表声明，由于苏联对中国共产党的支持和对中华民国的打压，该国将不再承认1947年经过公投脱离中国并独立的[MON.GetName]的合法性。中华民国政府宣布，1947年的蒙古公投受到了苏联的干涉，因此蒙古独立不符合国际法，中华民国依然拥有外蒙古和唐努乌梁海的主权。"
 
 
 

 roc.61.t:0 "中美大使级会谈在维也纳召开"
 roc.61.d:0 "中国共产党统治下的中华人民共和国政府和美国政府双方代表在维也纳展开大使级会谈，双方将讨论关于台湾、朝鲜、越南以及两国外交等各种问题。很显然，这次会谈充满了火药味，双方在谈判桌上争锋相对，尤其是针对台湾问题爆发了激烈的交锋。"

 roc.62.t:0 "中共要求我们撤离台湾"
 roc.62.d:0 "中共政府要求我们放弃对台湾国民党政府的支持和保护，并撤出驻扎在台湾周边的所有武装力量。"

 roc.63.t:0 "美国宣布减少在台湾的军事部署"
 roc.63.d:0 "中共与美国在维也纳的会谈以美国让步告终，美国宣布他们将逐步撤出在台湾部署的武装力量，并不再支持蒋介石政府的反攻大陆计划。台北方面强烈谴责美国出卖自由世界盟友的行为，斥责美国将自由亚洲置于共产威胁之下，亚洲其他的美国盟国也表达了不满。"

 roc.64.t:0 "美国拒绝撤离台湾"
 roc.64.d:0 "美国在维也纳会谈上表达了强硬的态度，宣称美军绝对不会撤离台湾，美国将继续支持亚洲自由国家对抗共产入侵，中共方面亦予以僵硬回复，表示中共军队将采取包括武力在内的手段解放台湾。"

 roc.65.t:0 "中共军队向金门发起新一轮炮击！！！"
 roc.65.d:0 "随着金门岛上响起隆隆炮声，中共军队向岛上的国民党守军发起炮击，宣告着解放军对金门的进攻正式打响！"

 roc.66.t:0 "金门国民党守军受到严重削弱"
 roc.66.d:0 "在中共军队的猛烈炮击之下，驻扎金门岛的中华民国部队遭受严重破坏，部队人员伤亡惨重，设备和武器损毁，通讯和补给亦遭到切断，岛上国军几乎已经失去反击能力。"

 roc.67.t:0 "中共对金门炮击未达到预期效果"
 roc.67.d:0 "中共军队对金门岛进行的炮击没有达到预期的效果，中华民国国军进行了有效的躲避与抵抗，人员和设备损失较少，同时展开了反击，组织炮兵对厦门方向进行炮击。"

 roc.68.t:0 "美国空军进驻台湾"
 roc.68.d:0 "在国共双方进行激烈对抗的同时，美国空军派遣数个战斗机、侦察机乃至轰炸机机群抵达台湾，协助中华民国国军对抗中共进攻。美军的到来有效的振奋了台湾军民的士气，增加了国军对共军的威慑，但同时也大大增加了远东局势的紧张。"

 roc.69.t:0 "苏联声援中共政府对金门的行动"
 roc.69.d:0 "苏联政府发表声明，支持中共军队在台湾海峡采取的军事行动，指责美国介入台海局势加剧地区紧张，并表示愿意为解放军提供一定的经济支持。"

 roc.70.t:0 "中共宣布暂停对金门的炮击"
 roc.70.d:0 "中共政府发表声明，共军对金门岛的炮击已达成其政治目的，遂决定暂停对金门的大范围炮击行动。"

 roc.71.t:0 "对台湾采取行动的时机"
 roc.72.d:0 "美帝国主义入侵黎巴嫩的行动吸引了全世界的关注，现在美国政府将注意力全部集中到了中东，如果我们趁这一时机发起对台湾的军事行动，可以达到出其不意的效果。"

 roc.72.t:0 "台湾需要船只支持"
 roc.72.d:0 "金门岛上的台湾军队正在与中共进行激烈对抗！台湾需要我们提供船只以为岛上的部队提供支援！"

 roc.73.t:0 "美国向我军提供船只"
 roc.73.d:0 "美方向我军提供的运输船已抵达，即将奔赴金门进行运输行动。"

 roc.74.t:0 "台湾需要武器支持"
 roc.74.d:0 "金门岛上的台湾军队正在与中共进行激烈对抗！台湾需要我们提供军火以为岛上的部队提供支援！"

 roc.75.t:0 "美国向我军提供自行火炮等武器"
 roc.75.d:0 "美方向我军提供的军火已抵达，即将运往金门提供给前线将士。"

 roc.76.t:0 "表态支持中华民国抵抗共军入侵！"
 roc.76.d:0 "[FROM.GetName]政府发表声明，支持自由中国对抗苏联支持下的共产中国入侵，呼吁世界各国支持中华民国，共同保卫自由世界！"

 roc.77.t:0 "表态支持人民解放军解放台湾！"
 roc.77.d:0 "[FROM.GetName]政府发表声明，支持中华人民共和国政府在台湾海峡的军事行动，反对美帝国主义介入和干涉亚洲局势！"

 roc.78.t:0 "台海上空发生激烈空战！"
 roc.78.d:0 "发生在台湾海峡的军事冲突蔓延到空中，在苏联和支持下，中共军队与国民党军队的空军力量发生激烈交战，目前中共军队获得了一定优势。据报道，中共战机在作战中意外获得一枚未被引爆的红外制导对空导弹，目前该导弹已被秘密转移。"

 roc.79.t:0 "关注台湾海峡军事冲突！"
 roc.79.d:0 "中共军队与国民党军队在台湾海峡爆发的激烈冲突引起了全世界的关注！外交部门建议我国政府发表声明，以在国际上显示我们的声音！"
 
 
 
 
 roc.80.t:0 "我军对浙江沿海的渗透取得成功"
 roc.80.d:0 "我国军在美国装甲车辆协助下，成功进入浙江沿海的舟山群岛、大陈岛、一江山岛等地，并收集当地情报，派发反共传单，同时对当地军用设施进行了破坏。"
 
 roc.81.t:0 "我军对浙江沿海的渗透失利"
 roc.81.d:0 "我军试图登录并渗透浙江沿海岛屿的行动遭到失败，共军发现了我军部队并进行阻击，我军被迫撤离。"
 
 roc.82.t:0 "我军对福建沿海的渗透取得成功"
 roc.82.d:0 "我国军在美国装甲车辆协助下，成功进入福建沿海的南日岛、湄洲岛、东山岛、渔山列岛等地，并收集当地情报，派发反共传单，同时对当地军用设施进行了破坏。"
 
 roc.83.t:0 "中华民国对福建沿海的渗透失利"
 roc.83.d:0 "中华民国军队试图登录并渗透福建沿海岛屿的行动遭到失败，中共军队发现了对方部队并进行阻击，国军被迫撤离。"
 
 roc.84.t:0 "我军对广东沿海的渗透取得成功"
 roc.84.d:0 "我国军在美国装甲车辆协助下，成功进入广东沿海的万山群岛、南澳岛、三门岛等地，并收集当地情报，派发反共传单，同时对当地军用设施进行了破坏。"
 
 roc.85.t:0 "中华民国对广东沿海的渗透失利"
 roc.85.d:0 "中华民国军队试图登录并渗透广东沿海岛屿的行动遭到失败，中共军队发现了对方部队并进行阻击，国军被迫撤离。"
 
 roc.86.t:0 "中共军队对浙江沿海发动进攻！"
 roc.86.d:0 "中国共产党军队已向国民党控制下的舟山群岛、大陈岛、一江山岛等岛屿发起攻击！"
 
 roc.87.t:0 "中共军队进攻浙江沿海失利"
 roc.87.d:0 "中共军队向浙江沿海岛屿发起的进攻以失败告终，在遭受严重损失后被迫撤离。"
 
 roc.88.t:0 "中共军队攻占浙江沿海岛屿！"
 roc.88.d:0 "中国共产党，经过激烈战斗，成功夺取国民党控制下的舟山群岛、大陈岛、一江山岛等岛屿。国民党军队在遭受严重损失后被迫撤离，中共对台湾的威胁正在增加。"
 
 roc.89.t:0 "美国向我们提供特种作战指导"
 roc.89.d:0 "美国以西方公司之名义向我国提供援助，大量两栖装备和作战教官不日将抵达台湾。"
 
 roc.90.t:0 "中华民国军队向福建沿海发起攻击"
 roc.90.d:0 "中华民国国军已在福建沿海地区登陆，向中共控制下的地区发起攻击！"
 
 roc.91.t:0 "中华民国军队向浙江沿海发起攻击"
 roc.91.d:0 "中华民国国军已在福建沿海地区登陆，向中共控制下的地区发起攻击！"
 
 roc.92.t:0 "中华民国军队从浙江沿海撤离"
 roc.92.d:0 "中华民国军队宣布，为了保存实力，国军以从浙江沿海的舟山群岛、大陈岛、一江山岛等岛屿撤离。"
 
 roc.93.t:0 "中华民国军队从金门岛撤离"
 roc.93.d:0 "中华民国军队宣布，为了保存实力，国军以从福建沿海的金门岛、大担岛等岛屿撤离。"
 
 
 
 
 roc.99.t:0 "台湾共和国临时政府的终结"
 
 roc.100.t:0 "中国战俘抵达台湾"
 roc.100.d:0 "从朝鲜战场上被俘的中国战俘，在美国政府和国际组织协调下，被送往台湾。台湾中华民国政府宣布，这些战俘是从中共统治下逃脱的自由者，并宣布定战俘来到台湾的日期为自由日。"
 
 roc.110.t:0 "台湾共和国临时政府成立"
 roc.110.d:0 "以廖文毅、吴振南、陈万福为首的台湾分离主义者在日本东京成立了“台湾共和国”临时政府，以及台湾民主独立党，以廖文毅为大总统。廖是统治台湾的中华民国政府进行戒严后，逃离台湾的反对国民党统治的政治家。"
 
 
 
 roc.111.t:0 "美帝国主义介入台湾局势！"
 roc.111.d:0 "美帝国主义向台湾派遣武装部队，悍然介入中国内政，阻挠我国解放台湾！现在中华人民共和国已正式建立，我国可通过苏联，向联合国安理会表达抗议，反对美帝国主义武装介入台湾局势！"
 
 roc.112.t:0 "中共政权指责美国武装入侵台湾"
 roc.112.d:0 "随着美军巡弋台湾海峡，并对台湾的国民党政权提供直接的军事援助，激怒了中国共产党政府。中共通过苏联驻联合国大使，向联合国提出所谓抗议美国武装入侵台湾案，要求谴责美国武装接入国共内战，并要求美国撤出在台湾的所有武装部队，停止对国民党军的所有支持。"
 
 roc.113.t:0 "联合国大会讨论中共提出的台湾议案"
 roc.113.d:0 "在苏联支持下，中共提出的所谓美国侵略台湾案被移交联合国讨论，中共代表伍修权出席联合国大会进行发言，这是中共代表首次出席联合国会议，中共与国民党的代表进行了针锋相对的辩论。在唇枪舌剑后，作为非常任理事国的印度代表提议暂时休会，来日再做最终表决。"
 roc113tool:0 "中华人民共和国与中华民国玩家需在接下来一个月内进行外交活动，争取美国、苏联、英国、法国、南斯拉夫、印度、挪威和埃及的支持。"
 
 roc.114.t:0 "联合国就第87号决议进行最后表决"
 roc.114.d:0 "联合国就提出的所谓美国侵略台湾案进行最后表决。"
 
 roc.115.t:0 "联合国第87号决议获得通过"
 roc.115.d:0 "联合国第87号决议最终获得多数支持通过，安理会宣布，根据决议，美国派遣武装部队进入台湾及台湾海峡的行为，介入了中国共产党与国民党之间的内战，使局势有恶化之可能。安理会要求美国尽快撤出在台湾的所有武装部队，停止对国民党军的所有支持，以避免远东局势的恶化。"
 
 roc.116.t:0 "联合国第87号决议被否决"
 roc.116.d:0 "联合国第87号决议最终未能获得多数支持，安理会认为，美国对其国民党盟友的军事支援，符合国际法及国际社会的普遍共识，故中共提出的所谓美国武装入侵台湾、干涉国共内战之决议不能通过。"
 
 
 roc.117.t:0 "美国宣布暂停对中华民国的援助"
 
 roc.118.t:0 "美国拒绝撤离对中华民国的援助"
 
 
 
 roc.120.t:0 "台湾发生美军射杀军官事件！"
 roc.120.d:0 "来自台北的消息！中华民国陆军军官刘自然，在驻台美军军人罗伯特·雷诺的住所外遭枪击身亡。此案震惊台湾社会各界。由于驻台美军军人享有外交豁免权，因此雷诺交由驻台美军军事法庭审判。愤怒的示威者包围了美国驻台北大使馆抗议，要求严惩凶手。"
 
 roc.121.t:0 "罗伯特·雷诺被无罪释放！"
 roc.121.d:0 "美国军人罗伯特·雷诺射杀台湾军官一事得到毫不意外的结果，美国军事法庭宣布雷诺误杀罪不成立并释放。此消息令台湾一片哗然，愤怒的示威者包围了美国驻台北大使馆抗议，要求严惩凶手。"
 
 roc.122.t:0 "台湾示威者冲入美国大使馆"
 roc.122.d:0 "围绕美国驻台北大使馆的示威游行演变成暴力冲突，示威者翻墙冲入美国大使馆内，撕毁美国国旗、打砸破坏并纵火，造成多人受伤。在经过几个小时的混乱后，宪兵才匆匆赶到维持秩序并逮捕示威者。"
 
 roc.123.t:0 "台湾反美游行被镇压"
 roc.123.d:0 "围绕美国驻台北大使馆的示威游行惊动总统府，台湾戒严司令部宣布采取手段镇压暴动，宪兵前往美国大使馆维持秩序，并逮捕了一百多名示威者。"
 
 
 
 roc.125.t:0 "东沙岛热带性低气压奔向台湾"
 roc.125.d:0 "东沙岛附近海面形成一热带低气压，并朝东北向方向移动，逐渐接近台湾，有可能进一步发展成轻度台风。"
 
 
 roc.126.t:0 "热带气压携暴雨逼近台湾！"
 roc.126.d:0 "台湾省气象局致信蒋总统：\n热带低压逐渐逼近我省花莲、苗栗等地，周边地区受这一现象影响，多地出现极不稳定的极端天气现象，多地观测到远超正常降雨量的大暴雨。我局认为这是一场史无前例的水灾洪灾之前兆，望省府各部门做好应对大灾之各项准备。"
 roc.126.a:0 "消息已知，会做安排。"
 
 roc.127.t:0 "台灣爆发重大水灾！"
 roc.127.d:0 "台湾中南地区，由暴雨引发了山洪所造成的严重灾害，受灾区域广达13个县市。洪水席卷而来，所到之处，田地房舍全被淹没，市镇乡村也成为一片汪洋，灾情之惨于此可见。\n受灾地区，以彰化县最为惨重。市区和乡村水深多在十尺以上，积水退后，满目疮痍，纵贯线铁轨像寸断的柔肠，枕木流失，陆基塌陷，机车客车也都东倒西歪，最大的大肚溪铁桥也被洪水冲断，公路路基和桥梁也大多冲毁。省县乡道，有一万三千公里不能通车。\n受灾的农田面积广达三万五千公顷，从电线杆上挂着的稻草，可以看出洪水泛滥时的高度。"
 
 roc.128.t:0 "关于台湾特大洪灾灾情及赈灾请求的紧急报告"
 roc.128.d:0 "蒋总统敬收：\n台湾特大洪灾对台湾造成了前所未有的破坏。受灾的农田面积广达三万五千公顷，死亡人数已超过六百余人。\n鉴于灾情严峻，恳请政府立即拨付紧急赈灾资金，用于以下方面：一是修复决堤的海防工程，防止二次灾害；二是搭建临时安置所，保障灾民基本生活；三是提供医疗援助，控制疫情蔓延；四是补偿农民损失，稳定粮食供应。此外，建议向国际社会求援，尤其是防洪技术及物资支持。"
 
 
 roc.129.t:0 "关于对台湾洪灾援助的报告"
 roc.129.d:0 "台湾特大洪灾已对台湾造成灾难性打击，彰化县等关键农业区被毁，基础设施瘫痪，民众流离失所。这场危机为我们提供了重要战略机遇。台湾作为亚太的十字路口，其稳定直接影响自由亚洲对抗共产主义,建议立即启动救援行动."
 
 roc.130.t:0 "[FROM.GetName]宣布为台湾提供援助"
 roc.130.d:0 "[FROM.GetName]外交部发表声明，大洪灾对台湾造成的严重破坏、人员伤亡和财产损失令人震惊。该国政府对遇难者表示诚挚的哀悼，同时，[FROM.GetName]将为台湾提供一笔人道主义经济援助，帮助受灾民众早日渡过难关。"
 
 
 
 roc.140.t:0 "陈仪被解除职务"
 roc.140.d:0 "随着台湾的社会局势愈发恶化，被台湾群众斥为罪魁祸首的台湾行政长官陈仪被迫宣布引咎辞职以避风头。"
 
 roc.141.t:0 "陈仪被指控通共投敌被捕"
 roc.141.d:0 "来自杭州消息。浙江省政府主席陈仪，因涉嫌私通中共，图谋和谈及浙江自立，被国民党保密局下令解除职务，其本人和家眷被羁押并送往上海待审。"
 
 roc.142.t:0 "陈仪被处决"
 roc.142.d:0 "国民党军事法庭宣布，原台湾行政长官、浙江省府主席陈仪私通共匪罪名成立，经军法判处其死刑。陈仪承认所有罪行，并自称自己是为避免浙江一千万百姓流血而死。陈仪已押往刑场执行枪决。"
 
 
 roc.145.t:0 "谋议台湾独立案之最终审判"
 roc.145.d:0 "审判长达一年的谋议台湾独立案，即将迎来终审。许丙、林熊祥、简朗山、徐坤泉、辜振甫等台湾士绅，涉嫌在抗战胜利时，纠结滞台日人，向时任日占台湾总督安藤利吉情愿宣布台湾独立。以上涉案嫌犯于去年年初被捕提审，不日将作出最终裁决。"
 
 roc.146.t:0 "谋议台湾独立案之最终审判"
 roc.146.d:0 "审判长达一年的谋议台湾独立案，今日迎来终审。许丙、林熊祥、简朗山、徐坤泉、辜振甫等台湾士绅，涉嫌在抗战胜利时，纠结滞台日人，向时任日占台湾总督安藤利吉情愿宣布台湾独立。以上涉案嫌犯于去年年初被捕提审，今日作出最终裁决。许丙、林熊祥各判处1年10个月有期徒刑，简朗山、徐坤泉各判处1年有期徒刑，辜振甫则被判处2年6个月有期徒刑，但允许保外就医。"
 
 roc.147.t:0 "谋议台湾独立案之最终审判"
 roc.147.d:0 "审判长达一年的谋议台湾独立案，今日迎来终审。许丙、林熊祥、简朗山、徐坤泉、辜振甫等台湾士绅，涉嫌在抗战胜利时，纠结滞台日人，向时任日占台湾总督安藤利吉情愿宣布台湾独立。以上涉案嫌犯于去年年初被捕提审，今日作出最终裁决。许丙、林熊祥各判处死刑，简朗山、徐坤泉、辜振甫等被判终身监禁。"
 
 roc.150.t:0 "中华民国颁布《耕地三七五減租條例》"
 roc.150.d:0 "国民党政府在今日正式通过行政院和立法院通过《耕地三七五減租條例》，标志着中华民国拖延多年的土地改革政策迈出重要一步。\n土地改革首先以降低地租为开始，條例規定，租期一律改為六年，在租期中非因法定事故，地主不得終止租約，以保障佃農權利。提高生產意願並改善生活。"
 
 roc.151.t:0 "新台币正式发行"
 roc.151.d:0 "中华民国政府正式宣布，随着原先的法币和金圆券已彻底崩溃，当局将正式发布新的货币。原先在台湾单独使用的台币，将成为中华民国自由地区的统一货币，命名为新台币。由行政院授权委托台湾银行发行，以四万圆换一圆之比例改换发流通新式货币。经财政部长严家淦建议，新台币与黄金价格挂钩，并准计自由换汇，以保障新台币的稳定和信任。"
 
 
 roc.155.t:0 "国民党保密局破获中共地下报刊"
 roc.155.d:0 "台北消息。中华民国保密局收到举报，台湾大学法学院教师宿舍内出现有共匪宣传报刊。军警人员前往调查后，查获多本所谓《光明报》杂志，内容包括对中国国民党、中华民国政府及蒋介石本人的恶意攻击，以及对国军战争前线失利的报道。台北市警察局立刻逮捕林荣勋、詹昭光、王明德的多名涉案人员，并表示，本次查获的共匪宣传报刊数量之庞大，令人意外，认定本案背后，必有成规模的共匪在台秘密团体暗中活动，将扩大调查，予以剿灭。"
 
 roc.156.t:0 "中共在台地下团体破获"
 roc.156.t:0 "中华民国保密局与台北市警察局宣布，经《光明报》一案进行深入调查后，中共在台湾最大的情报与颠覆团体，所谓中国共产党台湾省工作委员会在基隆中学的据点已被破获，基隆中学校长钟浩东叛国通共，勾结共匪成立该组织，已被逮捕送审，其余的团体骨干如吕赫若、蓝明谷、林英杰等同期被捕。"
 
 
 roc.157.t:0 "台北多地发生学生骚乱"
 roc.157.d:0 "台湾师范大学和国立台湾大学爆发大规模学生运动，抗议军警在前不久以交通肇事为由，非法拘捕和当众殴打两名学生。愤怒的学生包围了台北市警察局，要求释放学生并公开道歉。"
 
 roc.158.t:0 "台北学运持续扩大"
 roc.158.d:0 "大规模的学生民主运动继续在台湾发酵。台大法学院由叶城松主持举办营火晚会，晚会中学生队伍演唱《你是灯塔》、《团结就是力量》等亲共歌曲，会后并拟以反饥饿反迫害为主轴举行全省学生大会。国民政府当局高度关切，认定校园受到中国共产党的统战与渗透。"
 
 roc.159.t:0 "国民党军警暴力镇压台北学生运动"
 roc.159.d:0 "来自台北消息。台湾省警备总司令部宣布，周慎源、郑鸿溪、庄辉彰、方启明、赵制阳、朱商彝六名台湾学运领袖涉嫌勾结共党，制造动乱，下令拘捕。军警进入台湾大学和师范大学时，遭到学生抵抗，最后军警不顾台大校长傅斯年抗议，使用暴力冲入学校，打伤多人后拘捕多名学生。台湾省政府命令师范学院停课，所有学生一律重新登记，师院共36位学生遭到除名"
 
 roc.160.t:0 "林献堂离开台湾"
 roc.160.t:0 "台北消息，台湾著名政治家林献堂被确认，已于今日离开台湾，前往日本。林献堂是日本占领时期的台湾著名社会活动家，曾为了从日本政府手中争取台湾的民主权利展开斗争，二战结束后，林献堂受邀参加中华民国成立的台湾新政府，然而，国民党政府在二二八事件后，对台湾展开血腥镇压的行为，令林献堂大失所望，因而离开台湾。"
 
 roc.161.t:0 "中国游说团的愤怒"
 roc.161.t:0 "随着南京和上海的沦陷，中国共产党控制整个中国大陆似乎已经不可避免，而在遥远的华盛顿特区，中华民国外交官和反共产主义的参议员们，对美国政府发出了愤怒的质问。参议员们怒斥美国政府抛弃了亚洲最重要的自由盟友，他们在第二次世界大战中并肩作战的自由中国，最终沦入另一个极权主义势力的手中。"
 
 
 roc.162.t:0 "中共军队向浙江外岛发起攻击"
 roc.162.d:0 "中共军队向浙江外海的舟山群岛、登步岛、台山列岛和一江山岛等地发起攻击！"
 
 roc.163.t:0 "中共军队进攻舟山群岛失利"
 roc.163.d:0 "尽管进行了猛攻，但中共军队仍然未能在登步岛、一江山岛等岛屿滩头上建立阵地，最终被迫撤离，解放军对舟山群岛的进攻宣告失败。"
 
 roc.164.t:0 "中共军队攻占舟山群岛"
 roc.164.d:0 "随着中共军队攻上登步岛、一江山岛等岛屿，并在岛上升起五星旗，中共军队宣布，完全占领登步岛、一江山岛、台山列岛等浙江外海岛屿，岛上国民党守军被迫投降。至此，中华民国失去的浙江沿海的所有岛屿。"
 
 roc.165.t:0 "《自由中国》杂志在台湾复刊"
 roc.165.d:0 "由雷震、胡适等自由派中国知识分子创立的《自由中国》杂志，在因国共内战停刊多月后，于台北复刊。《自由中国》创办人雷震与蒋介石关系亲密，为了对抗来势汹汹的中国左翼思潮，为国民党政府反共抗俄的正当性呐喊助威，雷震与其他亲国民党的社会人士一起创办《自由中国》杂志，与亲共势力进行论战。"
 
 
 
 roc.170.t:0 "公安机关在东部沿海发现反动宣传刊物！"
 roc.170.t:0 "福建、浙江、潮汕等多个沿海地区的公安机关发现，一些当地居民在山野间拾获大量来源不明的国民党反动宣传刊物和传单，我们认为极有可能是台湾的国民党反动派当局，通过气球等飘浮物送进大陆的。"
 
 roc.171.t:0 "国民党军开始对大陆进行心战广播"
 roc.171.d:0 "中华民国国防部宣布，由国防部政战工作室运营的复兴广播电台正式对大陆进行广播，以向中共统治下的大陆群众进行宣传工作。广播以国语、闽南语、粤语和上海话进行播报，通过介绍台湾地区在中国国民党治理下的经济发展和社会和谐，并揭露中共统治黑暗真相的方式，动员大陆群众反对共产党，为光复大陆作准备工作。"
 
 roc.172.t:0 "金门开始对福建沿海进行军事广播宣传"
 roc.172.d:0 "中华民国国防部宣布，国民党军在金门马山设立了一座播音站，并安装了高大的扩音器序列，以向厦门地区进行心战宣传喊话。"
 
 roc.173.t:0 "心战广播效果事件"
 
 roc.174.t:0 "蒋中正巡视金门"
 roc.174.d:0 "中华民国总统蒋中正今日巡视金门岛，视察防务工作。蒋中正与金门国军守军军人会面，并高度赞扬了国军士兵在宁古头等战役中的出色表现。临别前，蒋中正为金门驻军题词——毋忘在莒，以激励将士。"
 
 roc.175.t:0 "来自台湾的武器装备运抵缅甸"
 roc.175.d:0 "来自台湾的武器装备，已通过泰国国境，运抵缅甸境内，由反共救国军控制的猛撒地区。"
 
 roc.176.t:0 "台北方面要求我们采取军事行动"
 
 roc.177.t:0 "反共救国军拒绝发起攻击"
 
 roc.178.t:0 "美国开始向缅甸国民党残军提供援助"
 roc.178.d:0 "美国通过泰国，向驻扎缅甸的国民党残部提供了一批援助，同时表示，未来会继续向台湾的国民党政府提供援助，并将其通过台湾支援到缅甸。"
 
 roc.179.t:0 "云南群众逃离中共统治进入缅甸"
 roc.179.d:0 "随着中共统治下的云南地区社会愈发动荡，一些云南地区的民众不堪共匪蹂躏，冒险跨越中缅边境，进入缅甸境内，寻求驻扎在禅邦的反共救国军的庇护。一些仍忠诚于三民主义的反共义士就地拿起武器，加入反共救国军的行列。"
 
 
 roc.180.t:0 "广东群众逃离中共进入香港"
 roc.180.d:0 "来自香港消息，在中共政权发动所谓的反右运动后，大量广东民众为了躲避政治迫害，纷纷逃亡香港。许多知识分子和被认为是右派的人士，冒死翻过中港边境的铁丝网，或直接跳入深圳湾和大鹏湾，渡海逃亡进入香港境内。香港居民发动群众为这些逃亡者提供帮助，而港英当局则将这些逃亡者收监进难民营当中。"
 
 roc.181.t:0 "广东群众逃离中共进入香港"
 roc.181.d:0 "来自香港消息，在中共政权发动所谓的反右倾运动后，大量广东民众为了躲避政治迫害，纷纷逃亡香港。许多知识分子和被认为是右派的人士，冒死翻过中港边境的铁丝网，或直接跳入深圳湾和大鹏湾，渡海逃亡进入香港境内。香港居民发动群众为这些逃亡者提供帮助，而港英当局则将这些逃亡者收监进难民营当中。"
 
 roc.182.t:0 "广东群众逃离中共进入香港"
 roc.182.d:0 "来自香港消息，在中共政权发动所谓的文化大革命后，大量广东民众为了躲避政治迫害，纷纷逃亡香港。许多知识分子和被认为是右派的人士，冒死翻过中港边境的铁丝网，或直接跳入深圳湾和大鹏湾，渡海逃亡进入香港境内。香港居民发动群众为这些逃亡者提供帮助，而港英当局则将这些逃亡者收监进难民营当中。"
 
 roc.183.t:0 "广东灾民逃离中共进入香港"
 roc.183.d:0 "来自香港消息，在中共政权发动所谓的大跃进运动后，粮食大量减产，四处都是因饥饿而死的人，民不聊生。大量广东民众为了躲避饥荒，纷纷逃亡香港，冒死翻过中港边境的铁丝网，或直接跳入深圳湾和大鹏湾，渡海逃亡进入香港境内。香港居民发动群众为这些逃亡者提供帮助，而港英当局则将这些逃亡者收监进难民营当中。"
 
 roc.184.t:0 "台湾为逃亡香港的难民提供帮助"
 roc.184.d:0 "位于台湾的中华灾胞救助总会宣布，中华民国政府和群众将筹款为逃亡香港的大陆群众提供援助，总会向台湾群众募集资金汇往香港，为难民提供食品、衣物和药物，协助其在香港度过难关，并派出律师说服港英当局释放部分被羁押的难民，并尝试接济一些难民前往台湾。"
 
 
 roc.190.t:0 "中华民国正式公布公地放领政策"
 roc.190.d:0 "中华民国内政部正式宣布，作为土地改革政策的一部分，将正式推行公地放领政策。根据中华民国宪法，国家对于土地之分配与整理，应以扶植自耕农及自行使用土地人为原则，政府将允许符合条件的农民，领取公共土地并开垦为耕地，并在分期支付完地租后，获得土地产权。"
 
 roc.191.t:0 "麦克阿瑟将军访问台湾"
 roc.191.d:0 "麦克阿瑟将军今晨抵达中华民国首都台北，与蒋中正、蒋经国等举行会谈，商讨在朝鲜半岛爆发军事冲突的情况下，中共的军事动向及其应对策略。"
 
 roc.192.t:0 "中华民国呼吁共军士兵拒绝前往朝鲜"
 roc.192.d:0 "在中共向朝鲜半岛派兵的威胁下，中华民国总统蒋中正，通过电台，向中共军队发出呼吁。蒋中正宣称中共士兵遭到了共产党的欺骗与蒙蔽，被迫远离故乡参加这次为共产主义侵略发起的战争，呼吁中共军人及时醒悟，及时停止不必要的流血牺牲，认清共产党的丑恶面目，反戈而起，推翻共匪暴政。"
 
 roc.193.t:0 "中共台湾委员会被彻底瓦解"
 roc.193.d:0 "中华民国政府宣布，经过严厉地侦察和打击，潜藏在台湾社会地下的，由中共暗中支持的多个共产主义社会团体已被消灭，团体成员和骨干分子已被依法惩处，中共煽动颠覆中华民国政府的阴谋已遭到失败。中华民国政府宣布，为了对抗中共的意识形态和思想文化渗透，在未来相当长的时间内，台湾司法和军警系统仍将继续执行反对共谍渗透的相关法律，以保护三民主义和自由中国的最后火种。"
 
 roc.194.t:0 "中华青年反共救国团成立"
 roc.194.d:0 "中国国民党宣布，曾被裁撤的国民党青年组织，中华反共救国团今天正式恢复成立。救国团的指责，在于培养中国青年的三民主义政治意识和反共产主义意识，以对抗中共的思想渗透。蒋中正提出，近半世纪的中国民族革命史，就是一部青年救国运动史。时代考验青年，青年创造时代，增进其智能，锻炼其体魄，训练其工作技术，加强其革命信念。"
 
 roc.195.t:0 "中华民国颁布耕者有其田条例"
 roc.195.d:0 "中华民国内政部正式宣布，作为土地改革政策的一部分，将正式颁布耕者有其田条例。政府实行土地征收和重新分配的措施。大规模的农地从地主手中征收，并分配给农民耕种。目的是为了缩小土地所有权的不平均，让农民拥有自己的土地，从而提高他们的经济地位和生活条件。该政策还包括了农地所有权的确认和登记，确保农民合法拥有他们耕作的土地。"
 
 roc.196.t:0 "中华民国宣布实行肥料换谷政策"
 roc.196.d:0 "中华民国农业部正式宣布，当局正式开始实行肥料换谷政策，政府将垄断化肥供应，要求农民如果要购买肥料，必须要通过谷物向政府交换。中华民国政府希望借此来控制粮食价格。"
 
 roc.197.t:0 "台湾学者傅炜亮被捕"
 
 roc.198.t:0 "国军退除役官兵辅导委员会成立"
 roc.198.d:0 "中华民国政府宣布，为解决国军官兵退役退伍后的就业和福利待遇问题，今特成立国军退除役官兵辅导委员会，以专项解决国军退役军人福祉事务，同时成立荣民工程总公司，招募退伍军人入职就业，组织参与重大国营建设项目。"
 
 roc.199.t:0 "国民党军组织大陈岛居民撤往台湾"
 roc.199.d:0 "随着中共军队对国民党军控制下的浙江沿海群岛威胁越来越大，国军经过慎重考虑，最终作出决定：实行金刚计划，逐步撤离国军驻守在大陈岛等地的部队和居民。\n金刚计划在美国支持下的西方公司协助下进行，中华民国海军出动军舰，前往大陈岛外围进行掩护，登陆船只搭载近两万名国军士兵，和一万七千名大陈岛居民离开岛屿，撤往台湾。"
 
 roc.200.t:0 "中国大陆灾胞救济总会成立"
 roc.200.d:0 "中华民国政府宣布，在共产党的残暴统治下，大量大陆民众纷纷逃离，前往台湾和香港。为了为这些难民提供帮助，救济总会将动员港台两地社会各界人力物力财力，救助灾民，协助大陆同胞投奔自由。"
 
 roc.201.t:0 "土耳其总统门德列斯访台"
 roc.201.d:0 "土耳其总统阿德南·门德列斯今日早晨抵达中华民国首都台北松山机场，与蒋中正总统见面，成为中华民国迁台后，守卫访问台湾的西方国家领导人。\n门德列斯与蒋中正在台北总统府举行会谈，蒋中正高度赞扬了土耳其军队在朝鲜战争中，为抗击共产主义侵略，保卫自由亚洲做出的贡献，而门德列斯则呼吁土耳其与自由中国应加强在对抗苏俄共产主义威胁中的合作。"
 
 roc.202.t:0 "绿岛新生训练处设立"
 roc.202.d:0 "致总统府\n位于台东县绿岛乡将军岩的新监区已于本月竣工。该设施完全按照您"永久性解决思想污染源"的指示设计：\n地下三层结构可容纳500名特殊囚犯，混凝土墙体掺入火山灰实现完全隔音\n审讯室配备西德制造的神经电击设备与美式低温拘束装置\n\n本月已接收首批132名囚犯，主要是教师工会领袖与大学生自治会成员。根据您的特别指令，第5囚室专门关押那些背弃党国、背弃三民主义，勾结共匪，出卖军事情报的叛国逆贼。\n台湾省保安司令部 致函"
 
 
 
 
 roc.210.t:0 "苏联油轮接近上海"
 roc.210.d:0 "致总统府\n我海军发现一支苏俄邮轮正在接近共匪控制下的上海海域，该邮轮可能试图穿越我军封锁，为共匪控制区提供石油资源。我们的战舰正在监视这支邮轮，并准备进行拦截和捕获。"
 
 roc.211.t:0 "苏联邮轮遭不明身份军舰劫持！"
 roc.211.d:0 "苏联万吨级货轮陶普斯号今日在菲律宾巴林塘海峡遭武装劫持。该船从苏联驶往中国上海途中，被三艘未悬挂国旗的军舰包围，80名武装人员登船控制驾驶舱，目前船只已被押往未知方向。\n"
 
 roc.212.t:0 "陶普斯号被证实遭国民党海军劫持！"
 roc.212.d:0 "苏联外交部发表紧急声明，数日前遭到劫持的陶普斯号货轮，确认被中华民国海军所攻击并挟持，侥幸逃亡的船员描述：登船者穿着美式作战服，却佩戴青天白日徽章。\n苏联外交部指控台湾国民党当局实施“海盗行为”，并出示无线电监听记录显示劫持者使用闽南语通讯。莫斯科警告将采取“一切必要措施”，太平洋舰队已派出侦察机群搜索相关海域。马尼拉港务局证实，劫持发生时附近有关岛美军演习舰队。美国国务院否认参与事件，但承认密切关注台湾海峡航行安全。"
 
 roc.213.t:0 "苏联要求国民党政府立刻释放被劫持船员"
 roc.213.d:0 "在今天的联合国安理会紧急会议上，苏联代表团正式宣布，强烈谴责台湾国民党政府劫持民用货船的行为。苏联代表展示了多张由情报部门提供的照片，证实陶普斯号已被控制在高雄港，八十多名船员生死不明。苏联在安理会会议上，正式要求台湾方面释放船员，归还船只。"
 
 roc.214.t:0 "国民党政府宣布释放船员"
 roc.214.d:0 "中华民国外交部宣布，中华民国政府基于人权和人道主义精神，将在不久后释放被关押的陶普斯号货轮所有船员，同时强调，中华民国对中国大陆的海上封锁政策没有结束。"
 
 roc.215.t:0 "获释苏联船员抵达巴黎"
 
 roc.216.t:0 "国民党政府拒绝释放船员"
 
 roc.217.t:0 "联合国安理会讨论苏联船员劫持案件"
 
 roc.218.t:0 "美国支持我国扣留苏俄船员"
 
 roc.219.t:0 "国民党政府依然坚持羁押苏联船员"
 
 roc.220.t:0 "美国建议进行俘虏互换"
 
 roc.221.t:0 "国民党政府提议继续俘虏互换"
 
 roc.222.t:0 "中共政府接受进行俘虏互换"
 
 roc.223.t:0 "中共政府拒绝进行俘虏呼唤"
 
 roc.224.t:0 "美国要求我国释放扣押的所有俘虏"
 
 roc.225.t:0 "获释苏联船员抵达香港"
 
 
 roc.230.t:0 "中日合约之议论"
 roc.230.d:0 "日本外交代表团近日抵达台湾，与中华民国政府进行会谈，双方将就两国停止战争状态，重建外交关系，以及台湾主权归属问题进行对话。" 
 
 roc.231.t:0 "台湾问题之争议"
 roc.231.d:0 "中日外交谈判中，台湾的领土归属成为双方激烈的争端焦点。日方坚持台湾岛在二战前便属于日本领土，不属于《波茨坦公告》中所规定的战时侵占地区，拒绝放弃对中华民国控制下的台湾岛的主权声索，而中华民国认为，台湾岛系在甲午战争，即第一次中日战争中所侵占之领土，《马关条约》不具有合法性，应根据《波茨坦公告》，日本放弃台湾的所有主权。" 
 
 roc.232.t:0 "日本拒绝承认台湾主权在于中国"
 roc.232.d:0 "日方坚持台湾岛在二战前便属于日本领土，不属于《波茨坦公告》中所规定的战时侵占地区，拒绝放弃对中华民国控制下的台湾岛的主权声索。"
 
 roc.233.t:0 "中日和约缔结破产"
 roc.233.d:0 "由于双方在台湾问题上的争执，中日和约缔结的谈判不欢而散。"
 
 roc.234.t:0 "中日合约正式缔结"
 roc.234.d:0 "日本与苏联的外交谈判以顺利的结果宣告结束，两国已在领土问题、战俘问题等各种外交问题上达成协议。日本正式承认台湾属于《波茨坦公告》中定义的第一次中日战争中所侵占之领土，日本放弃台湾的所有主权。而中华民国承认日本的国家地位正常化，不再反对日本恢复联合国席位。"
 
 
 roc.240.t:0 "台湾爆发军事政变！"
 roc.240.d:0 "台湾爆发军事政变！装甲兵少将郭廷亮带领军队向台北进军，试图夺权！"
 
 roc.241.t:0 "兵变部队控制台北！"
 roc.241.d:0 "经过激烈交战，郭廷亮率领的部队控制了台北，大部分对蒋介石不满许久的军人都加入了政变部队，部分宪兵部队还在抵抗。蒋介石已连夜逃亡阳明山，宋美龄、严家淦、蒋经国等被软禁在寓所。"
 
 roc.242.t:0 "台湾军事政变被镇压"
 roc.242.d:0 "郭廷亮衰落的兵变部队被镇压，郭廷亮被俘。"
 
 roc.243.t:0 "台湾革命国民政府成立！"
 roc.243.d:0 "随着政变部队先后控制了总统府、行政院、立法院和国防部，郭廷亮宣布正式成立台湾革命军政府，中止宪法，罢黜蒋介石的总统职务，自命为中华民国军事委员会委员长，暂管职权。"
 
 roc.244.t:0 "孙立人被推举为军政府临时主席"
 roc.244.d:0 "台湾军政府成立后，由于自身不能服众，郭廷亮决定邀请孙立人将军出山，拥立他为郡政府主席。"
 
 roc.245.t:0 "美国承认台湾革命政府的成立"
 
 roc.246.t:0 "美国拒绝承认台湾兵变政府"
 
