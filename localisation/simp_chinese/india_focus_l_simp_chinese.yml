 India_HInusim_educate:0 "印度教教育体系"
 India_HInusim_educate_desc:0 "我们要把印度教的信条深深地刻入我们的社会文化，从小学教育开始，婆罗门、梵天、毗湿奴、湿婆、哈努曼……每一个公民都应当熟记他们的故事，并虔诚地根据神的旨意行事。"
