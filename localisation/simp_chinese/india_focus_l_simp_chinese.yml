 India_annex_rajas:0 "吞并土邦"
 India_Constitution:0 "共和国宪法"
 India_NCP:0 "国民大会党专政"
 India_Socialist:0 "印度式社会主义"
 India_Secularism:0 "世俗共和国"
 India_new_parties:0 "新的势力"
 India_support_hinduism:0 "支持印度教民族主义"
 India_RSS:0 "赞助国民服务志愿团"
 India_support_sikhs:0 "支持锡克教"
 India_support_sikhs_desc:0 "锡克教和锡克帝国在印度近代史上有着辉煌的历史。他们以尚武而闻名，建立了强大的锡克帝国，如果我们能够适当地支持和保护锡克教，并征召他们进入军队，有利于我们建立一支强大的军队。"
 India_diplomatic:0 "外交政策"
 India_diplomatic_desc:0 "我国必须尽快开展外交事务，争取世界各国政府对新生的印度共和国的认可和支持。"
 India_pro_socialism:0 "亲社会主义"
 India_pro_socialism_desc:0 "自从苏联成立以来，社会主义阵营就秉持着支持全球民族解放运动，打击帝国主义的外交策略。这与我们政权的国际利益不谋而合。"
 India_pro_soviet:0 "亲近苏联"
 India_pro_soviet_desc:0 "伟大的苏维埃社会主义共和国联盟已经成为社会主义国家和第三世界独立国家最坚定的盟友，我们将坚定地和莫斯科的同志们站在一起，对抗帝国主义和殖民主义！"
 
 India_sov_aid:0 "苏联经济援助"
 India_sov_aid_desc:0 "我们可以请求苏联政府为我们提供资金支持。"
 India_sov_techs:0 "苏联技术援助"
 India_sov_techs_desc:0 "我们可以请求苏联政府向我们派遣技术顾问，帮助我国科技发展和工业建设。"
 India_sov_arms:0 "苏联军事援助"
 India_sov_arms_desc:0 "我们可以请求苏联政府为我们提供军事援助，包括援助军事装备和军事顾问。"
 India_sov_mir:0 "参与和平号工程"
 
 India_comecon:0 "经济互助委员会"
 India_comecon_desc:0 "社会主义阵营的全球经济秩序建立在“产业互助”原则上。简而言之就是社会主义阵营以无偿或低偿援建、援助的形式投资盟国的工业发展，以此增加盟国的消费力和无产阶级人口并签订各种联盟条约。"
 India_third_world:0 "第三世界"
 India_third_world_desc:0 "随着殖民体系的瓦解，亚非许多国家独立建立了新的国家。我们必须尽快与这些国家建立良好关系。"
 India_non_aliged:0 "不结盟运动"
 India_non_aliged_desc:0 "美国和苏联正在努力将世界各国纳入其势力范围，这将扩大意识形态冲突，加剧战争威胁。我们呼吁不结盟运动和建立一个全球组织，抵制与强国结盟。"
 India_pro_china:0 "与中国关系"
 India_pro_china_desc:0 "中国和印度一样都是伟大的文明古国，我们曾经一同创立伟大的文明，也曾一同遭受殖民主义入侵的苦难，而未来我们将携手创立一个和平而繁荣的亚洲。"
 India_grand_india:0 "大印度主义"
 India_grand_india_desc:0 "印度若要成为一个世界性的大国，就必须保持在南亚的领导地位和政治影响力，一个符合印度利益的南亚格局，既可以扩大印度的外交和政治地位，也可以组织潜在的对手渗透进我们的周边国家。"
 India_kashmir:0 "收复克什米尔"
 India_kashmir_desc:0 "巴基斯坦不愿意根据《蒙巴顿协定》，承认我们对克什米尔的主权，那么我们也将还以颜色。"
 India_bangladesh:0 "肢解孟加拉"
 India_bangladesh_desc:0 "巴基斯坦不可能维持他们对遥远的东孟加拉地区的统治，因此我们将为这个畸形的双头怪兽进行治疗。"
 India_against_pakistan:0 "对抗巴基斯坦"
 India_against_pakistan_desc:0 "从《蒙巴顿方案》将印度分割为印度教国家和穆斯林国家起，二者之间就注定了长期对抗下去。"
 India_annex_bangladesh:0 "吞并孟加拉"
 India_annex_bangladesh_desc:0 "孟加拉已经脱离巴基斯坦，但该国以穆斯林为主的人口，注定了我们与孟加拉之间无法发展出友好关系，我们将采取行动，控制孟加拉，最好把他们变成我们的一个邦！"
 India_tibet:0 "渗透西藏"
 India_tibet_desc:0 "西藏自从清帝国灭亡之后就已经处于实际上的独立状态，但中国国民党和中国共产党政府都试图重新建立对他的控制，这毫无疑问是有害于印度的利益的。我们将尝试争取西藏政府和社会对印度的支持。"
 India_himalaya:0 "控制喜马拉雅"
 India_himalaya_desc:0 "伟大的世界屋脊喜马拉雅山，是拉克希米吉祥天女的故乡，是恒河和亚穆纳母亲河的源头，我们必须将这片地区牢牢控制在印度人的手里。"
 India_sri_lanka:0 "渗透斯里兰卡"
 India_sri_lanka_desc:0 "罗摩神曾在哈努曼协助下政府楞伽国，也就是今天的锡兰岛。今天的我们也将采取政治经济手段，扩大我们对斯里兰卡的政治影响力，以将他纳入我们的势力范围。"
 India_ban_caste:0 "废除种姓制度"
 India_ban_caste_desc:0 "平等和法制将成为现代印度的社会基础，古老、落后且野蛮的种姓制度，是时候彻底走入历史了！"
 India_female_right:0 "女性权益"
 India_female_right_desc:0 "印度女性的社会地位低下而糟糕，世界罕见。现代教育、政治权利和法制与她们无缘，无数印度女性遭到家庭暴力、被家庭视为累赘和负担，甚至面临荣誉谋杀和殉葬的威胁。这不是一个现代国家应有的样子，印度的现代化和社会发展，将从拯救女性开始！"
 India_economic:0 "发展经济"
 India_economic_desc:0 "英国人自称为印度带来了文明，带实际上他们走后留下的工厂和设施，完全不够养活数亿的印度人口，我们必须重新规划一条适合印度的经济发展道路，以尽快让我们国家走上现代化的道路。"
 India_5_plant:0 "五年计划"
 India_pass_economic:0 "经济执照"
 India_industry:0 "工业化"
 India_industry_desc:0 "重工业是提供生产资料的工业，我们需要先发展重工业，进入工业化，才能发展其他产业。"
 India_tata:0 "塔塔汽车"
 India_tata_desc:0 "随着全球汽车产量增加和汽车技术的发展，汽车已不再是一种富人专属的奢侈品，而实进入中产阶层，成为一种重要的消费品。我国的汽车依然高度依赖进口，因此我们需要发展汽车工业，不仅是为了满足消费需求，也是为了让国家更快实现汽车国产、加速经济和工业发展。"
 India_agriculture:0 "发展农业"
 India_agriculture_desc:0 "改善农业生产，不仅需要合理的土地制度，且需要先进的农业技术。水利、农药、化肥、配种和机械化，这些都是农业现代化不可缺少的。"
 India_green_revolution:0 "绿色革命"
 India_education:0 "教育改革"
 India_education_desc:0 "二战前发展的教育产业已经日渐不能满足我国经济和社会对产业人才的需求，我们必须用行政手段加紧在全国范围内普及公立的、国际化的科教体系。"
 India_IIT:0 "印度理工学院"
 India_IIT_desc:0 "印度理工学院将成为世界上一流的理工高等学院，为印度和世界培养技术人才。"
 India_military_industry:0 "军工业"
 India_space_project:0 "太空计划"
 India_space_project_desc:0 "古印度曾经在天文学上取得成就，而今天的印度也不应在太空探索上落后于人。"
 India_buddha:0 "微笑的佛陀"
 India_buddha_desc:0 "漫天奇光异彩，有如圣灵逞威，只有一千个太阳，才能与其争辉。我是死神，我是世界的毁灭者。——《罗摩衍那》"
 India_navy:0 "发展海军"
 India_Gandhi:0 "尼赫鲁-甘地家族"
 India_Gandhi_desc:0 "从莫提拉尔·尼赫鲁，再到贾瓦哈拉尔·尼赫鲁，尼赫鲁家族一直是印度政坛最具影响力的政治家族，尤其是当贾瓦哈拉尔先生年事已高，而国大党内又未能选出一个在能力、威望和地位上足以接掌大权的元老作为其接班人时，选择贾瓦哈拉尔的女儿——英迪拉·甘地为下一任印度总理，便成为一个无论在党内还是民间都十分受欢迎的决定。"
 India_remove_syndicat:0 "排斥元老"
 India_remove_syndicat_desc:0 "英迪拉·甘地的总理仕途，一直遭到国大党内以莫拉尔吉·德赛为首的元老的反对和阻挠，这些元老自认为追随圣雄甘地和贾瓦哈拉尔·尼赫鲁参与印度独立运动，理应在独立之后分得蛋糕，完全不愿意把权力分给年轻一代的政治家，我们需要采取手段，让这些已是古稀之年的老人回到他们该去的地方。"
 India_tibet_force:0 "特别边境部队"
 India_tibet_force_desc:0 "中国政府控制西藏后，有许多不服从的藏民逃入印度境内。我们应该把他们招募并组织起来，发放武器，予以军事训练，以组织一支可以在未来派上用场的部队。"
 India_emergency_law:0 "紧急状态法"
 India_emergency_law_desc:0 "总理与党内外反对派的矛盾已激化到不采用特殊手段就无法处理的程度，总理要求进入紧急状态，以在法理上，获得使用军警逮捕并打压反对派的合法性。"
 India_Hereditary:0 "巩固世袭制"
 India_Hereditary_desc:0 "贾瓦哈拉尔·尼赫鲁是否希望建立尼赫鲁家族的世袭执政，史学有所争议，但英迪拉·甘地希望将总理职位传给自己的儿子，是人尽皆知的事实。英迪拉一直培养桑贾伊·甘地和拉吉夫·甘地兄弟参与政治，希望他们成为尼赫鲁家族的第三代印度总理。"
 India_strike_oppose:0 "打击反对党"
 India_strike_oppose_desc:0 "我们将采取更强硬的手段来打击党内外的反对派，以确保印度总理的意志能够得到实行。"
 India_secret_police:0 "秘密警察与镇压"
 India_common_leader:0 "集体领导"
 India_common_leader_desc:0 "印度国民大会党不应该是贾瓦哈拉尔·尼赫鲁及其派系一人独大的政党，跟随圣雄甘地一同致力于独立运动的元老们，应该获得应有的政治地位。"
 India_democratic:0 "多党制改革"
 India_BJP:0 "人民党政府"
 India_BJP_desc:0 "独裁而腐败的国民大会党已不再适合领导印度，人民党将领导印度人民走向民主和繁荣。"
 India_Rama_temple:0 "重建罗摩寺"
 India_pro_ENG:0 "亲近英国"
 India_ENG_aid:0 "英国经济支持"
 India_ENG_support:0 "英国军事支持"
 India_Hindi_langue:0 "推广印地语"
 India_Hindi_langue_desc:0 "我们今天所使用的印地语，或者叫印度斯坦语，曾经只是德里地区一种受波斯语影响的方言，但随着德里苏丹国、莫卧儿帝国和英国人的推广，他成为了从旁遮普到摩揭陀整个北印度的通用语言，为了强化印度共和国的国家凝聚力和加强对南印度达罗毗荼地区的影响力，我们需要将印地语定为我们的官方语言。"
 India_more_school:0 "扩大教育设施"
 India_dialect:0 "接纳地方语言"
 India_military_2:0 "发展军工业 I"
 India_military_2_desc:0 "二战后国际格局瞬息万变，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 India_military_3:0 "发展军工业 II"
 India_military_3_desc:0 "新时代的武器装备更复杂、多样化且昂贵，唯有进一步扩张我国的军工复合体，才能腾出足以敷用的产能奋起直追。"
 India_manufacture1:0 "发展制造业 I"
 India_manufacture1_desc:0 "在具备初步工业能力后，我们需要满足我们人民对生活消费品的需求。从纺织、食品、木制品和锅碗瓢盆开始。"
 India_manufacture2:0 "发展制造业 II"
 India_manufacture2_desc:0 "在具备进一步工业能力后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 India_manufacture3:0 "发展制造业 III"
 India_manufacture3_desc:0 "在具备较为完善的工业能力后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 India_develop_gujarat:0 "开发古吉拉特"
 India_develop_gujarat_desc:0 "古吉拉特不仅拥有天然良港，且周边海域石油资源可观，是发展制造业、石化工业和出口加工的理想地区。"
 India_develop_culcut:0 "开发西孟加拉"
 India_develop_culcut_desc:0 "作为印度最早得到西方殖民者开发的地区，以加尔各答为核心的地区有值得投资的工业基础。"
 India_develop_mumbai:0 "开发马哈拉施特拉邦"
 India_develop_mumbai_desc:0 "马哈拉施特拉以曾经的亚洲最繁荣城市孟买为中心，是投资金融、航运和商贸的重要地区。"
 India_develop_tamilnad:0 "开发泰米尔纳德"
 India_develop_tamilnad_desc:0 "早在一千多年前，统治泰米尔地区的朱罗王朝就把该地区打造成的印度洋最重要的贸易中心，今天的泰米尔邦在发展制造和航运上，依然有重要价值。"
 India_infrasctructure:0 "发展基础设施"
 India_infrasctructure_desc:0 "阿育王的印度大道在千年后将得到重建和扩大。"
