 India_minor_contrl:0 "同化政策"
 India_minor_contrl_desc:0 "南部的泰米尔人、泰卢固人和马拉塔人，不仅宗教上极端保守，且社会和政治上排斥国大党的现代化和世俗化政策，是国家发展的累赘和潜在的叛乱隐患，必须对他们进行密切的监视和严厉的控制。"
