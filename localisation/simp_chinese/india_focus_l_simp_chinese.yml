 India_delhi_culcuta_desc:0 "通过铁路来将孟加拉地区与首都连接起来，以发展经济，强化中央集权。"
 India_delhi_mumbai:0 "德里-孟买干线"
 India_delhi_mumbai_desc:0 "通过铁路来将马哈拉施特拉地区与首都连接起来，以发展经济，强化中央集权。"
 India_delhi_tamil:0 "德里-泰米尔纳德干线"
