 India_chemistry:0 "发展石化工业"
 India_chemistry_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 India_oil_produc:0 "开发石油资源"
 India_oil_produc_desc:0 "石油是现代工业的血液，如果我们要成为工业国家，发展石油工业是不可缺少的一步。"
 India_neo_liberal:0 "经济自由化"
 India_neo_liberal_desc:0 "新自由主义者主张减少政府的行政干预，让市场自由运行从而刺激经济增长。政府的腐败、政治混乱和官僚主义使得他们无法有效管理经济，因此让市场无形的大手来促进经济系统自我调节才是最好的办法。政府干预越少，经济运行越好。"
 India_enterprise:0 "企业民营化"
 India_enterprise_desc:0 "我国国有企业在经济体制改革之后开始失去活力，无法应对日益激烈的市场竞争。为了使国企能够应对市场经济带来的冲击，我们将实行国企改革，使企业自主，自负盈亏。"
 India_strike_corrupt:0 "打击腐败"
 India_strike_corrupt_desc:0 "打击腐败窃取国家财产，浪费国家资金，破坏社会稳定、经济发展和群众对政府的心热，必须严厉惩处。"
 India_market:0 "扩大市场经济"
 India_market_desc:0 "既然市场能够比行政机构更好地运营经济，那我们就应该将经济完全交给市场和市场参与者自由运营，一个完全没有行政干涉的经济体制无疑是最健康，最完美的。"
 India_invets:0 "吸引外国投资"
 India_invets_desc:0 "随着我国的社会稳定、经济得到发展以及外交地位的加强，一些外国投资者希望进入我国市场投资。"
