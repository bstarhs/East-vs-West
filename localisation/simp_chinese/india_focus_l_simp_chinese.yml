 IND_plan:0 "五年计划"
 IND_plan_desc:0 "我们将开始实行第一个五年计划，以快速改善我国的落后局面。"
 IND_people_army:0 "人民军队"
 IND_pioneers:0 "少年先锋队"
 IND_pioneers_desc:0 "少年先锋队是共产主义事业的接班人，培养少先队就是培养党和社会主义的未来。"
 IND_worship:0 "党的权威"
 IND_worship_desc:0 "我国当前政党众多，但大都代表着资本家、政治投机者甚至敌对分子的利益。我们要建设一个无产阶级所有、代表劳动人民的人民民主国家，共产党就必须领导一切。"
 IND_nkvd:0 "内务委员会"
 IND_nkvd_desc:0 "我们要建立专门的机构，调查、监视、逮捕反革命分子和帝国主义间谍。"
 IND_isr_com_revolution:0 "支持西藏革命"
 IND_iran_com_revolution:0 "支持巴基斯坦革命"
 IND_african_com_revolution:0 "支持伊朗和阿富汗革命"
 IND_arabs_com_revolution:0 "支持东南亚革命"
 IND_arabs_com_revolution:0 "支持印度洋地区革命"
 IND_expode_revolution:0 "输出革命"
 IND_nationalized:0 "企业国有化"
 IND_anti_muslim:0 "镇压宗教"
 IND_anti_muslim_desc:0 "宗教是精神的鸦片，他们除了代表封建阶级压迫人民一无是处，只有镇压宗教，才能推动人民接受社会主义意识形态。"
 IND_supress:0 "镇压反革命"
 IND_supress_desc:0 "一些敌视社会主义[FROM.GetName]的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。"
 IND_collective:0 "农业集体化"
 IND_collective_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 IND_soviet_mode:0 "苏联模式"
 IND_soviet_mode_desc:0 "在斯大林模式的指导下，苏联人民不仅在短短十年内把俄罗斯变成了工业强国，而且还战胜了法西斯。我们要摆脱贫困，进入工业化和现代化，就必须学习苏联人民的先进经验。"
 IND_people_republic:0 "人民共和国"
 IND_people_republic_desc:0 "落后的封建时代已经过去，我们人民将迎来更加先进、民主的社会制度。社会主义有利于生产力的发展，实现社会平等和民主进步。"
 IND_people_republic:0 "毛主义路线"
 IND_people_republic:0 "文化大革命"
