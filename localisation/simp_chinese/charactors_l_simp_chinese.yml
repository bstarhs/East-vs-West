 CUB_Earl_Edward_Smith:0 "Earl Edward Smith"
 Earl_Edward_Smith_desc:0 "Earl Edward Smith是美国驻古巴大使，他在古巴生活多年，大力呼吁美国政府支援古巴镇压叛军。"
 CUB_Mariano_Faget_Diaz:0 "Mariano Faget Diaz"
 Mariano_Faget_Diaz_desc:0 "Mariano Faget Diaz是臭名昭著的古巴“反共产主义情报局”的局长。"
 CUB_Rolando_Masferrer:0 "Rolando Masferrer"
 Rolando_Masferrer_desc:0 "Rolando Masferrer早年曾经参与过反对富尔亨吉奥·巴蒂斯塔的斗争，但因为路线不同，与菲德尔·卡斯特罗反目，最后背叛革命，成为巴蒂斯塔的爪牙。Rolando Masferrer在巴蒂斯塔支持下，成立了残暴的准军事组织“老虎队”，帮助当局打击和镇压反对者。"
 CUB_Meyer_Lansky:0 "Meyer Lansky"
 Meyer_Lansky_desc:0 "Meyer Lansky是来自美国的黑手党头目，从20世纪30年代开始，他便主导了美国黑手党在古巴的赌场投资和运作。"
 CUB_Martin_Diaz_Tamayo:0 "Martin Diaz Tamayo"
 Martin_Diaz_Tamayo_desc:0 "Martin Diaz Tamayo是古巴的治安局官员，负责哈瓦那地区的治安防御。"
 CUB_Eulogio_Cantillo:0 "Eulogio Cantillo"
 Eulogio_Cantillo_desc:0 "Eulogio Cantillo是巴蒂斯塔最得力的助手，负责古巴军方对七·二六运动的镇压，并被外界视为巴蒂斯塔的接班人。"
 
