 indra_gandhi:0 "Indra Gandhi"
 indra_gandhi_desc:0 "英迪拉 Gandhi是尼赫鲁之女，在前半生支持父亲的政治磨练中拥有不输男性的能力。"
 morarji_desai:0 "Morarji Desai"
 morarji_desai_desc:0 "莫拉尔吉 德赛是国大党的元老，被视为保守派的代表人物。"
 sanjay_gandhi:0 "Sanjay Gandhi"
 sanjay_gandhi_desc:0 "桑贾伊 Gandhi是英迪拉 Gandhi的次子，被母亲是为接班人大力培养，但其本身的能力十分欠缺。"
 matsushita_kounosuke:0 "Matsushita Kounosuke"
 matsushita_kounosuke_desc:0 "松下幸之助是松下电器的创始人，被视为战后日本最重要的企业家之一。"
 ito_seigi:0 "Ito Seigi"
 ohira_masayoshi:0 "Ohira Masayoshi"
 ohira_masayoshi_desc:0 "大平正芳是自民党大平派的领袖，也是一名出色的外交家。"
 hirose_ichiro:0 "Hirose Ichiro"
 hirose_ichiro_desc:0 "清濑一郎是一名保守右翼政治家，曾作为律师为远东国际法庭的甲级战犯辩护，战后成立“进步党”继续鼓吹右翼政治路线。"
 ikeda_taisaku:0 "Ikeda Taisaku"
 ikeda_taisaku_desc:0 "池田大作是日本禅宗宗教界人士、创价协会会长。其领导公明党推动日本与周边国家的和谐共处。"
 suzuki_mosaburo:0 "Suzuki Mosaburo"
 inejiro_asunama:0 "Inejiro Asanuma"
 inejiro_asunama_desc:0 "浅沼稻次郎是旧日本官僚，但战后跳转阵营加入日本社会党。受中国革命影响，浅沼主张日本走社会主义道路。"
 okamura_yasuji:0 "Okamura Yasuji"
 okamura_yasuji_desc:0 "岗村宁次是二战期间的侵华日军总司令，战后逃脱战犯审判，并为日本政府和蒋介石政府提供军事顾问。"
 Hayashi_Keizo:0 "Hayashi Keizo"
 Kim_JaeGyu:0 "Kim Jae-Gyu"
 Kim_JaeGyu_desc:0 "金载桂在70年代担任韩国国家情报院部长。"
