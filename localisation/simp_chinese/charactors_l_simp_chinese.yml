 Peak_SeonYeob:0 "Peak Seon-Yeob"
 Yi_ByongCheol:0 "Yi Byong-Cheol"
 Yi_ByongCheol_desc:0 "李秉喆是三星创始人，被视为韩国最优秀的企业家。"
 Heo_SamSu:0 "Heo Sam-Su"
 PRC_Li_Peng:0 "Li Peng"
 PRC_Li_Peng_desc:0 "李鹏曾担任中国水路部门部长，并在80年代中后期成为国务院总理。"
 PRC_Jiang_ZeMin:0 "Jiang Ze-Min"
 PRC_Jiang_ZeMin_desc:0 "江泽民是电子工业专家出身，曾担任电子工业部长和上海市市长，他同时也对西方有充足的了解。"
 PRC_ChenYun:0 "Chen Yun"
 PRC_ChenYun_desc:0 "陈云是改革开放时期中共元老之一，属于支持国有经济的保守派。"
 PRC_Xi_ZhongXun:0 "Xi Zhong-xun"
 PRC_Xi_ZhongXun_desc:0 "习仲勋在70年代末期担任广东省第一书记，主导了深圳的对外开放和特区建设。/n 他的儿子习近平后来成为中共中央总书记。"
