l_simp_chinese:
 DDR_11:0 "关闭两德边界"
 DDR_11:0 "寄生虫行动"
 
 DDR_semidoc_tech:0 "发展半导体"
 DDR_semidoc_tech_desc:0 "神奇的半导体材料可以制作出三极管的效果，但他的大小却可以细致到纳米级，掌握半导体可以大大缩小我们电子设备的体积，这在电子科技不断发展和应用的未来是至关重要的。"
 DDR_computer_tehcs:0 "发展计算机产业"
 DDR_computer_tehcs_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一。随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。"
 DDR_electronic_consumer:0 "发展消费电子产品"
 DDR_electronic_consumer_desc:0 "时代在发展，电子信息技术将成为未来社会最重要、不可或缺的一部分，无论是发展军事、工业、民生还是太空探索都离不开信息技术，在这一领域领先，就代表在走向未来的道路上领先。"
 
 DDR_nuclear_techs:0 "开发核技术"
 DDR_nuclear_techs_desc:0 "核子裂变释放出来的能量摧毁了广岛和长崎，也将人类带入一个全新的时代。核技术有着巨大的运用价值，它可以制造毁灭性的可怕武器，也可以用来提供无尽的清洁能源，甚至运用到生物化学领域。\n原子能的释放改变了除人类思维方式以外的一切。\n——阿尔伯特·爱因斯坦"
 
 DDR_banned_stasi:0 "废除史塔西"
 DDR_banned_stasi_desc:0 "国家用高压来控制人们的历史已经结束，国家安全局作为使用暴力镇压不同政见者的暴力机关，应当随着国家的民主化走入历史了。"
 DDR_wir_sind_das_volks:0 "我们是人民！"
 DDR_wir_sind_das_volks_desc:0 "德意志民主共和国的最高统治权，不应该集忠于共产党的手中，不应该被掌握在蜗居于潘科的独裁者和官僚手中，他应该归还给人民，将选择自己命运的权力归还给人民，将言论自由和思想自由归还给人民！\n我们不是流氓——我们是人民！"
 DDR_einigkeit_wdr:0 "再见！列宁！"
 DDR_einigkeit_wdr_desc:0 "Einigkeit und Recht und Freiheit\nFür das Deutsche Vaterland!"
 
 DDR_trade_prc:0 "与中华人民共和国的贸易"
 DDR_trade_prc_desc:0 "中国人民已经摆脱国民党的腐败统治，正在重建国家。他们需要大量的技术人员和重型机器，而我们则需要许多中国生产的矿物资源。"
 
 DDR_revolution_aouthasia:0 "支持东南亚革命"
 DDR_revolution_aouthasia_desc:0 "从菲律宾的群岛、马来亚的丛林，到中南半岛的山地丘陵，到处都是反对帝国主义、封建主义腐朽统治的革命武装，中国人民已经取得了革命战争的胜利，现在是时候支持亚洲人民的伟大斗争了。"
 DDR_revolution_africa:0 "支持非洲革命"
 DDR_revolution_africa_desc:0 "广大非洲大地上，反帝反殖民运动风起云涌，非洲人民正在抵抗帝国主义殖民者的残暴统治，他们需要我们的帮助。"
 DDR_revolution_latins:0 "支持拉丁美洲革命"
 DDR_revolution_latins_desc:0 "拉丁美洲地区的革命群众正在与帝国主义支持下的独裁军政府和大种植园剥削者进行激烈的斗争，他们需要我们的帮助！"
 
 DDR_western_techs:0 "购买西方技术"
 DDR_western_trade:0 "与西方的贸易"
 DDR_western_trade_desc:0 "随着苏联的社会稳定、经济得到发展以及外交地位的加强，一些外国投资者希望进入我国市场投资。"
 
 DDR_fkk_bereich:0 "天体裸体浴场"
 DDR_fkk_bereich_desc:0 "天体主义是起源于19世纪早期的社会学说，认为服饰穿着和视裸体为不道德的基督教价值观束缚了人的本性，人应当回归裸体生活，以实现去除社会身份，人人平等，由此在20世纪初的德国出现了一种所谓的天体主义裸体浴场，人们在海滩边脱掉全部衣服裸体活动。\n天体浴场在纳粹德国早期遭到了禁止，但后来，纳粹高层认为裸体可以有效展示雅利安人的强壮体制，又开放了天体浴场。二战结束后，少部分天体浴场在东德被秘密保留，后来，统一社会党的部分高层主张少量保留天体浴场，即可以满足东德人民的生活活动，又可以与价值观保守的西方国家进行对比。"
 
 DDR_close_seaborder:0 "关闭海上边界"
 DDR_close_seaborder_desc:0 "在我们封锁路上边境后，一些叛逃共和国者依然试图冒险走水路逃亡西德、丹麦和瑞典，我们需要加强我们的海警队伍，强化对海上边界的封锁。"
 DDR_banned_passport:0 "请出示证件"
 DDR_banned_passport_desc:0 "从即日起，任何未经允许出入德意志民主共和国的行为都将被判处死刑。如要办理出入境许可，请在每年的2月30日不早于19时的白天前往柏林史塔西办事处……"
 DDR_total_media_banned:0 "通讯中断"
 DDR_total_media_banned_desc:0 "所有市民必须在今天晚上8时之前上缴一切拥有通讯功能的电子器材，新德意志电台将是您唯一可以使用的电子通讯……如若发现私藏电子通讯装置，将会有严厉惩罚……"
 DDR_beholder:0 "旁观者"
 DDR_beholder_desc:0 "亲爱的卡尔·斯坦\n我们很高兴的通知你，你已被任命为克鲁什维奇6街区D级公寓的房东。\n你必须到达公寓并开始工作，我们已经给你和家人分配了一处位于一楼的住所。\n在体检的过程中，我们已将实验性药剂注入你的身体内，他能抑制你的睡眠需求，这样你就有更多时间服务祖国了。\n欢迎加入精英官阶\n分配部"
 
 DDR_kinderbahn:0 "儿童铁路"
 DDR_advisors:0 "提供顾问"
 DDR_DSF:0 "德苏友谊协会"
 DDR_DSF_desc:0 "苏联人民是打倒法西斯的解放者，是打败纳粹，解放德国的伟大革命先驱，我们必须坚定不移地与苏俄人民站在一起，维护社会主义大家庭，抵抗帝国主义的渗透。\n\n德苏友谊协会将致力于在德国人民中推动两国人民的文化、政治和经济交流，举办两国学生之间的联欢活动，促进两国人民之间的互相了解和团结一致。"
 DDR_DSF_tool:0 "增加从苏联处获得的援助数量，如果苏联由AI控制，对方同意给予援助的倾向增加。"
 DDR_FDGB:0 "自由德国工会联合会"
 DDR_FDGB_desc:0 "作为无产阶级的先锋队、工人阶级的领导者，党必须将广大工人阶级纳入到党领导的工会系统当中，为工人解决生活问题，才能得到工人阶级的拥护。"
 DDR_Kampfschwimmer:0 "蛙人"
 DDR_Wachregiment:0 "捷尔任斯基警卫团"
 DDR_Wachregiment_desc:0 "捷尔任斯基警卫团是由国家安全局下属的直属武装部队，是德意志民主共和国的精锐部队，他们将直接负责共和国领导人的安全和首都的警备，同时执行反恐作战任务，以捍卫党和国家的核心。"
 DDR_Reserveschutzen:0 "动员预备役"
 DDR_Reserveschutzen_desc:0 "欧洲局势愈发紧张，我们与西方国家的军事冲突随时可能爆发，我们需要尽快将预备役动员起来，随时准备投入作战。"
 DDR_Luftsturmregiment:0 "第40空降突击营"
 DDR_Luftsturmregiment_desc:0 "第40空降突击营是国家人民军的精锐部队，作为快速反应部队，他们不仅可以执行高难度的反恐维稳工作，并且可在军事冲突爆发后，快速空降到敌人后方，执行破坏任务，"
 DDR_panzerjager:0 "发展反装甲武器"
 DDR_panzerjager_desc:0 "西德傀儡军以其装甲部队为优势，我们也需要研发更强大的反坦克武器以作对抗。"
 
 DDR_shipping:0 "发展造船"
 DDR_shipping_desc:0 "我们与外国之间的贸易量不断扩大，需要更多的远洋船只来支持海上贸易，我们需要发展造船业，实现大型船只的自给自足。"
 DDR_mineral:0 "发展矿业"
 DDR_mineral_desc:0 "我们需要图灵根地区的煤炭和金属矿产的开采，使其足以供应我们的生产需求。"
 
 DDR_rote_purssia:0 "红色普鲁士"
 DDR_spartak_union:0 "第二斯巴达克同盟"
 DDR_claime_alsace:0 "索取阿尔萨斯-洛林"
 DDR_austria_revo:0 "支持奥地利革命"
 DDR_annex_aus:0 "第二次德奥合并"
 
 
 DDR_war_wdr:0 "解放德意志！"
 DDR_war_wdr_desc:0 "邪恶、虚伪、无耻的西部政府勾结美帝国主义，残害进步人士，分裂国家，必须被消灭，我们将发起伟大的祖国统一战争，让德意志祖国重新归为一统！"
 DDR_einigkeit:0 "德意志祖国的统一"
 DDR_einigkeit_desc:0 "占据祖国西部的帝国主义傀儡和法西斯残余已被彻底消灭，今天，我们宣布，德意志祖国再一次实现了社会主义统一！"
 DDR_supress_wdr:0 "镇压抵抗分子"
 DDR_supress_wdr_desc:0 "一些仇视社会主义统一德国的帝国主义和纳粹余孽仍在负隅顽抗，我们将进行严厉的镇压！"
 DDR_wdr_goc:0 "建立临时政府"
 DDR_wdr_goc_desc:0 "必须尽快建立起新的行政、司法和执法机关以维持我们对德国西部的控制。"
 DDR_manage_wdr:0 "西德资产临时委员会"
 DDR_manage_wdr_desc:0 "强硬没收德国西部的大企业和资本并不现实，我们应该成立一个委员会，进行缓慢但稳定的方式，逐步实现对西德经济的控制。"
 DDR_nationlized_wdr:0 "西德资产国有化"
 DDR_nationlized_wdr_desc:0 "我们将实行强硬的国有化改革，将德国西部的大企业、大资本和大财团瓦解，并将其并入社会主义德国的公有制体制之下。"
 
 DDR_poland_puppet:0 "扶持波兰代理人"
 DDR_poland_puppet_desc:0 "莫斯科对东欧国家推行霸权主义，引起各国进步人士不满。波兰也有许多人抵触莫斯科的控制，希望发展独立自主的外交政策，我们应该对他们提供支持，扩大我们的影响力并削弱苏联对东欧的渗透。"
 DDR_czech_puppet:0 "扶持捷克代理人"
 DDR_czech_puppet_desc:0 "莫斯科对东欧国家推行霸权主义，引起各国进步人士不满。捷克也有许多人抵触莫斯科的控制，希望发展独立自主的外交政策，我们应该对他们提供支持，扩大我们的影响力并削弱苏联对东欧的渗透。"
 DDR_hungary_puppet:0 "扶持匈牙利代理人"
 DDR_hungary_puppet_desc:0 "莫斯科对东欧国家推行霸权主义，引起各国进步人士不满。匈牙利也有许多人抵触莫斯科的控制，希望发展独立自主的外交政策，我们应该对他们提供支持，扩大我们的影响力并削弱苏联对东欧的渗透。"
 
 DDR_bonn_office:0 "驻波恩办事处"
 DDR_bonn_office_desc:0 "我们将在波恩设立办事处，作为我们驻西部的总代表，处理两德之间外交、经济和政治问题。"
 DDR_civic_relation:0 "开展民间往来"
 DDR_civic_relation_desc:0 "两德之间关系的解冻，意味着双方老死不相往来的历史宣告结束，我们将向公民颁发通行证，允许双方之间有限的民间经济和贸易交往。"
 DDR_west_trade:0 "开展两德经贸活动"
 DDR_west_trade_desc:0 "我们将进一步扩大两德之间的经济和贸易往来。"
 DDR_abandon_block:0 "解禁边境封锁"
 DDR_abandon_block_desc:0 "德国东西之间的民间文化和贸易往来正在蓬勃发展，我们应当考虑逐步放开民间的私人旅行和探亲签证发放，让更多民众更方便的前往边境的另一边。"
 
 DDR_tourism_focus:0 "发展旅游业"
 DDR_tourism_focus_desc:0 "民主德国已不再是封闭的国家，许多西方世界的游客想要来我国，对这个共产主义国家一探究竟。"
 DDR_anti_strike_committee:0 "反怠工委员会"
 DDR_anti_strike_committee_desc:0 "在新一次五年计划建设的关键时刻，我们不允许有人掉链子。反怠工委员会将监督和惩罚没有完成生产计划的生产单位。"
 
 DDR_internet:0 "支持互联网"
 DDR_internet_desc:0 "通过电话信号将计算机连接起来，从而实现信息共享，并通过一架计算机控制和操作整个工厂，乃至整座城市的生产工作……总之，伟大的计算机互联网将让经济生产和社会生活走进新的时代，并改变人类的历史。"
 DDR_develop_electronic:0 "发展电子产业"
 DDR_develop_electronic_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一，1948年ENIAC一条条电路板的运作标志着第三次科技革命的诞生。1960年代，随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。起初计算机只能帮助处理文书工作，但后期计算机有了更多功能，例如制图、传真、模拟和娱乐。计算机不仅可以帮助人们工作，对于80年代的许多国家来说，计算机还是经济腾飞的阶梯，亚洲的日本、韩国、台湾和中国大陆通过承接计算机制造业实现了经济的迅速增长。"
 DDR_nuclear_power:0 "发展核能"
 DDR_nuclear_power_desc:0 "核子裂变释放出来的能量摧毁了广岛和长崎，也将人类带入一个全新的时代。核技术有着巨大的运用价值，它可以制造毁灭性的可怕武器，也可以用来提供无尽的清洁能源，甚至运用到生物化学领域。\n原子能的释放改变了除人类思维方式以外的一切。\n——阿尔伯特·爱因斯坦"
 DDR_space_focus:0 "参与太空探索"
 DDR_steel_making:0 "发展炼钢"
 DDR_steel_making_desc:0 "以质量计算,铁是地球上最常见的元素,它加热后有很好的延展性…并且非常有用。铁始于公元前3500年左右,在埃及的盖尔扎赫被发掘出来铁对早期文明所需的各式东西都非常有用:如,蒸煮罐、小五金、工具,以及用来刺伤他人的尖锐武器。"
 DDR_Trabant_focus:0 "卫星牌汽车"
 DDR_Trabant_focus_desc:0 "随着全球汽车产量增加和汽车技术的发展，汽车已不再是一种富人专属的奢侈品，而实进入中产阶层，成为一种重要的消费品。我国的汽车依然高度依赖进口，因此我们需要发展汽车工业，不仅是为了满足消费需求，也是为了让国家更快实现汽车国产、加速经济和工业发展。"
 DDR_agriculture:0 "发展农业"
 DDR_agriculture_desc:0 "第二次世界大战几乎摧毁了我国的大量耕地，全国各地粮食告急，我们需要尽快恢复农业生产。"
 DDR_agriculture_mechanized:0 "农业机械化"
 DDR_agriculture_mechanized_desc:0 "改善农业生产，不仅需要合理的土地制度，且需要现金的农业技术。水利、农药、化肥、配种和机械化，这些都是农业现代化不可缺少的。"
 DDR_product_mechanized:0 "生产机械化"
 DDR_product_mechanized_desc:0 "我们需要尽快革新生产技术，推动电气化、信息化的生产设备和现代化的生产管理制度在我国得到推广，从而改善我们的生产效率。"
 DDR_product_automatic:0 "生产自动化"
 DDR_product_automatic_desc:0 "计算机的诞生和普及大大改变了现代生产技术的面貌，它可以让我们以更简单的方式管理和控制一整个生产系统。"
 DDR_plastic:0 "发展化工业"
 DDR_plastic_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 DDR_refinery:0 "发展炼油业"
 DDR_refinery_desc:0 "石油是现代工业的血液，如果我们要成为工业国家，发展石油工业是不可缺少的一步。"
 DDR_manufacture_1:0 "发展制造业 I"
 DDR_manufacture_1_desc:0 "世界大战已经严重损害了我国的基础工业，尤其是消费品制造。我们必须迅速恢复经济生产，以满足人民对消费品的需求。"
 DDR_manufacture_2:0 "发展制造业 II"
 DDR_manufacture_2_desc:0 "在具备进一步工业能力后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 DDR_manufacture_3:0 "发展制造业 III"
 DDR_manufacture_3_desc:0 "在具备较为完善的工业能力后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 DDR_manufacture_4:0 "发展制造业 IV"
 DDR_manufacture_4_desc:0 "在具备较为完善的工业能力后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 DDR_support_red_brigade:0 "支持意大利红军旅"
 DDR_support_red_brigade_desc:0 "意大利的革命群众正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 DDR_support_spanish_revo:0 "支持西班牙革命者"
 DDR_support_spanish_revo_desc:0 "法西斯打不倒西班牙人民的顽强精神，依然有许多自由战士反抗弗朗哥政权，这次我们不会再坐视不管！"
 DDR_support_IRA:0 "支持爱尔兰共和军"
 DDR_support_IRA_desc:0 "爱尔兰的革命群众正在与反动势力及英帝国主义进行激烈的斗争，他们需要我们的帮助！"
 
 DDR_Kasernierte_Volkspolizei:0 "驻营警察"
 DDR_Kasernierte_Volkspolizei_desc:0 "在苏联允许我们正式成立武装部队之前，驻营警察作为简单的准军事组织，将承担国防任务。"
 DDR_equipment_research:0 "尝试自研武器"
 DDR_equipment_research_desc:0 "我们不能一直依靠苏联为我们提供武器，这将使得我们失去国防自主权并依赖苏联，我们将尝试自主研发武器。"
 
 DDR_Bausoldat:0 "Bausoldat建设军"
 DDR_Bausoldat_desc:0 "一些思想上出现偏差的公民，不愿意进入人民军服役，他们的借口是宗教信徒不能杀人。那好，我们将建立一支准军事组织，征召所谓的拒服兵役者加入，主要从事建筑和工程任务。"
 
 DDR_airfroce:0 "发展空军"
 DDR_airfrocedesc:0 "我们生来，为征服辽阔天空\n我们故事，由后代来传颂\n人类智慧给我钢铁手臂翅膀\n喷火马达是我强劲心脏\n那就更高，更高，要更高！\n拉起我们心爱的飞机\n每一丝螺旋桨的呼吸\n保卫四方国境线安宁"
 DDR_buy_plane:0 "购买战斗机"
 DDR_buy_plane_desc:0 "我们目前没有自行生产战斗机的能力，但我们可以向友好国家购买现成的战斗机来建立我们的空军。"
 DDR_jet_1:0 "发展喷气机"
 DDR_jet_1_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 DDR_jet_2:0 "发展现代战斗机"
 DDR_jet_2_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 DDR_transfer:0 "发展运输机"
 DDR_transfer_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 DDR_bomber:0 "发展轰炸机"
 DDR_bomber_desc: "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 DDR_anti_air:0 "发展防空设备"
 DDR_airbase_brandenbourg:0 "勃兰登堡空军基地"
 DDR_airbase_brandenbourg_desc:0 "我们需要机场和基础设施来承载我们的空军。"
 DDR_airbase_rostock:0 "罗斯托克空军基地"
 DDR_airbase_rostock_desc:0 "我们需要机场和基础设施来承载我们的空军。"
 DDR_airbase_anhalt:0 "安哈尔特空军基地"
 DDR_airbase_anhalt_desc:0 "我们需要机场和基础设施来承载我们的空军。"
 DDR_airbase_turingen:0 "图灵根空军基地"
 DDR_airbase_turingen_desc:0 "我们需要机场和基础设施来承载我们的空军。"
 
 DDR_VolkspolizeiSee:0 "海上警察"
 DDDR_VolkspolizeiSee_desc:0 "在苏联允许我们正式成立武装部队之前，海上警察作为简单的准军事组织，将承担海防任务。"
 
 DDR_buy_ship:0 "购买水面舰艇"
 DDR_buy_ship_desc:0 "我们目前还没有建造舰船的能力，但我们可以向其他国家购买退役的舰艇。"
 DDR_light_ships:0 "发展轻型舰艇"
 DDR_light_ships_desc:0 "我们的海军刚刚起步，至少需要一些护卫舰和驱逐舰来保护我们的领海。"
 DDR_medium_ships:0 "发展中型舰艇"
 DDR_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 DDR_heavy_ships:0 "发展大型舰艇"
 DDR_heavy_ships_desc:0 "我们的海军已经成长壮大，我们需要发展可以搭载更多设备和飞机的大型舰艇来强化作战能力。"
 DDR_buy_submarines:0 "购买潜艇"
 DDR_buy_submarines_desc:0 "我们目前还没有建造潜艇的能力，但我们可以向其他国家购买退役的潜艇。"
 DDR_submarines:0 "发展潜艇"
 DDR_submarines_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 DDR_naval_base_rostock:0 "罗斯托克海军基地"
 DDR_naval_base_rostock_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 DDR_marines_focus:0 "发展两栖部队"
 DDR_marines_focus_desc:0 "擅长两栖作战的部队越来越不可或缺。临时拼凑的手段、装备已经成为历史，我方海军陆战兵现在已接受相关训练并拥有专属登陆舰船支持。"
 
 DDR_buy_weapons:0 "购买外国武器"
 DDR_buy_weapons_desc:0 "我国的军事工业目前还很落后，没有自己生产军火的能力，但我们可以向其他国家购买退役的武器。"
 DDR_military_industry_2:0 "军事工业 II"
 DDR_military_industry_2_desc:0 "二战后国际格局瞬息万变，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 DDR_military_industry_3:0 "军事工业 III"
 DDR_military_industry_3_desc:0 "新时代的武器装备更复杂、多样化且昂贵，唯有进一步扩张我国的军事工业，才能腾出足以敷用的产能奋起直追。"
 DDR_armors:0 "发展装甲部队"
 DDR_armors_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 DDR_mechanized:0 "发展机械化部队"
 DDR_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 DDR_airborn:0 "发展空降部队"
 DDR_airborn_desc:0 "飞机航程和载荷的发展开辟了许多可能性。运输机可以在敌人战线的大后方投下一整个师的部队，在那里他们可以造成严重破坏。"
 DDR_develop_weapons:0 "成立装备发展部"
 DDR_develop_weapons_desc:0 "从步兵的头盔和背心，再到坦克上的火控系统和动力系统，先进的作战装备往往主导着战场。"
 
 DDR_sov_intel:0 "苏联情报援助"
 DDR_sov_intel_desc:0 "我们应当邀请苏联情报部门来为我国提供情报援助。"
 DDR_cooperate:0 "苏联军事援助"
 DDR_cooperate_desc:0 "我们可以请求苏联政府为我们提供军事援助，包括援助军事装备和军事顾问。"
 
 DDR_expanded_soldiers:0 "扩大征兵"
 DDR_expanded_soldiers_desc:0 "现在是国家军力扩大的关键时期，我们要求每个成年男子都为国家献出力量。"
 
 DDR_wdr_revolt:0 "鼓动西德内讧"
 DDR_wdr_revolt_desc:0 "西部的革命群众正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 DDR_supress_religion:0 "镇压宗教"
 DDR_supress_religion_desc:0 "宗教是精神的鸦片，他们除了代表封建阶级压迫人民一无是处，只有镇压宗教，才能推动人民接受社会主义意识形态。"
 DDR_soviet_mode:0 "斯大林模式"
 DDR_soviet_mode_desc:0 "在斯大林模式的指导下，苏联人民不仅在短短十年内把俄罗斯变成了工业强国，而且还战胜了法西斯。我们要摆脱贫困，进入工业化和现代化，就必须学习苏联人民的先进经验。"
 DDR_collective:0 "农业集体化"
 DDR_collective_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 DDR_plan:0 "五年计划"
 DDR_plan_desc:0 "我们将开始实行第一个五年计划，以快速改善我国的落后局面。"
 DDR_nkvd:0 "内务委员会"
 DDR_nkvd_desc:0 "我们要建立专门的机构，调查、监视、逮捕反革命分子和帝国主义间谍。"
 
 DDR_deutsch_federate:0 "加入德意志共同体"
 DDR_east_euro_tech:0 "引进东欧国家技术"
 DDR_talk_ROMANIA:0 "与罗马尼亚接触"
 DDR_talk_ROMANIA_desc:0 "我们应该改善与罗马尼亚的外交关系，争取两个社会主义国家之间的友好合作，以缓解国防压力，促进对外经贸发展。"
 DDR_talk_france:0 "与法国接触"
 DDR_talk_france_desc:0 "法国的戴高乐政府正尝试改善与东欧社会主义国家的关系，我们也应该抛出橄榄枝，打开我国的外交突破口，以摆脱苏联的影响。"
 DDR_talk_sweden:0 "与瑞典接触"
 DDDR_talk_sweden_desc:0 "瑞典的社社民党政府正尝试改善与东欧社会主义国家的关系，我们也应该抛出橄榄枝，打开我国的外交突破口，以摆脱苏联的影响。"
 DDR_zwei_nazaion:0 "两民族论"
 DDR_zwei_nazaion_desc:0 "波恩当局只有完全承认德意志民主共和国的主权，二者才有共存的可能性。"
 
 DDR_closed:0 "欧洲黑洞"
 DDR_closed_desc:0 "世界各国都无法接收到来自东柏林的一切可靠情报……只能隐约听见人群对革命领袖的欢呼和赞美……"
 DDR_worship:0 "领袖崇拜"
 DDR_worship_desc:0 "我们伟大的领袖[From.GetLeader] 在推翻帝国主义侵略、推翻反动政权、建立社会主义新国家的历史上，取得了举世瞩目的成就。只有把他尊为我国最伟大的领袖，听从他的一切指示，我们才能建设和保卫祖国！"
 
 DDR_talk_church:0 "与教会接触"
 DDR_talk_church_desc:0 "斯大林式的极端反宗教政策已不再合适，我们将逐步放开对基督教会的限制，允许人民进行宗教活动，以争取宗教信众的支持和国际形象的改善。"
 DDR_election:0 "准备选举"
 DDR_election_desc:0 "随着德意志民主共和国的政治民主化即将完成，统一社会党将结束他们的历史使命，将国家政府通过选举移交给新的民主政党。"
 DDR_CDU:0 "支持基民盟"
 DDR_CDU_desc:0 "我们将大力支持偏保守的基督教民主联盟赢得选举，以彻底消除共产主义的影响。"
 DDR_SDP:0 "支持社民党"
 DDR_SDP_desc:0 "我们将大力支持偏左的社会民主党赢得选举，以兼顾民主化和社会稳定的平衡。"
 DDR_devide_party:0 "改革重组"
 DDR_devide_party_desc:0 "统一社会党已不再适合执政民主德国，民主化改革的最后一步，是削弱党对国家政治、军事和经济的高度控制，并允许反对党的组件，以实现向政治多元化的过度。"
 DDR_allow_media:0 "允许民间传媒"
 DDR_allow_media_desc:0 "我国的媒体都处于政府控制之下，这种不透明的传媒机制已成为官僚的工具，也不利于我们的民主改革。我们应当开发媒体管制，允许民间媒体创办并鼓励他们监督政府。"
 DDR_allow_foreign_media:0 "允许外来文化"
 DDR_allow_foreign_media_desc:0 "政治和经济的开放必须以社会的开放为前提，社会的开放必须以文化的开放为前提。无论乌布利希同志多不赞成，现在他都必须在广播里听那些Ja Ja Ja的西方音乐了。"
 DDR_release_speech:0 "言论解禁"
 DDR_release_speech_desc:0 "我国的媒体都处于政府控制之下，这种不透明的传媒机制已成为官僚的工具，也不利于我们的民主改革。我们应当开发媒体管制，允许民间媒体创办并鼓励他们监督政府。"
 DDR_culture_reform:0 "文化的开放"
 DDR_democrat_socialism:0 "民主的社会主义"
 DDR_democrat_socialism_desc:0 "我们知道，我们的国家并不完美，但是我们的信仰也鼓舞着世界各地的人们。社会主义不是自我封闭，社会主义是走向他人，与他人共存。我们不仅梦想能有更美好的世界，更要实现这一梦想。"
 DDR_political_reform:0 "政治改革的尝试"
 DDR_political_reform_desc:0 "我们已经按照列宁和斯大林的模式统治了这个国家数十年，但现在，随着政治、经济和社会的危机不断恶化，我们是时候考虑做出改变了。"
 
 DDR_privatnized:0 "企业改革"
 DDR_privatnized_desc:0 "我国国有企业在经济体制改革之后开始失去活力，无法应对日益激烈的市场竞争。为了使国企能够应对市场经济带来的冲击，我们将实行国企改革，使企业自主，自负盈亏。"
 DDR_foreign_invest:0 "吸引外国投资"
 DDR_foreign_invest_desc:0 "随着民主德国的社会稳定、市场经济得到发展以及外交地位的加强，一些外国投资者希望进入我国市场投资。"
 DDR_market_economic:0 "尝试市场经济"
 DDR_market_economic_desc:0 "在经济改革开启后，是否坚持马克思列宁主义政策反对私有制经济，也成为一个值得探讨的话题。我国有许多实际上处于停摆状态的企业，与其继续给这些企业提供资金维持运作，不如把他们交给私人承担。"
 
 DDR_private_companies:0 "允许混合经济"
 DDR_private_companies_desc:0 "为了刺激经济发展，增加市场经济的活力，我们将放松对企业形式的严格限制，允许小规模的公私合营或股份制企业出现。"
 DDR_economic_department_reform:0 "改革经济部门"
 DDR_economic_department_reform_desc:0 "政府应该放松监管，把自由贸易作为市场经济的长期政策，以促进经济增长，形成有效的竞争机制。"
 DDR_agriculture_reform:0 "农业体制改革"
 DDR_agriculture_reform_desc:0 "政府将进一步削弱计划经济的影响力，减少对集体农庄直接下达的生产计划，改为生产指标，当农庄生产的产品超过指标时，多余的产品可以投入市场获得利润，农庄将获得在生产和利润分配上更大的自主权。"
 DDR_custom_develop:0 "投资消费品"
 DDR_custom_develop_desc:0 "我们必须扩大消费品的投资和生产，以满足人民对生活消费品的需求。"
 DDR_production_committees:0 "生产委员会"
 DDR_production_committees_desc:0 "工人们参与生产委员会，以民主形式直接参与工厂的管理和决策，委员会的成员由选举产生，他们不仅参与管理，并且也要参与工作。"
 DDR_salaries:0 "利润激励政策"
 DDR_salaries_desc:0 "随着斯大林式的计划经济被认为不再合理，人们开始探索新的经济体制。乌克兰经济学家埃弗赛·利别尔曼认为，应该将经济体制的中心从政府、计划委员会转移到企业上，并允许企业追求利润和销售作为企业发展的指标，如果企业达到指标，政府就应该给予奖金，使国家和企业之间的关系建立在利润分配之上，鼓励企业接受计划，挖掘生产潜力。"
 
 DDR_high_techs:0 "投资高新技术"
 DDR_high_techs_desc:0 "我们需要进一步投资发展电子、化工和制造技术，不仅有利于提高消费品的产量和质量，也有利于确保我国不会再日新月异的科技发展中落后于西方国家。"
 DDR_technolocrat:0 "技术官僚部门"
 DDR_technolocrat_desc:0 "科学研究应当让科研人员专门负责，而不应该受到官僚主义的影响。我们需要打造一个由专业的科技人员组成的科研机构，使他们能够最大限度地投入到科学工作当中。"
 DDR_develop_ost_berlin:0 "东柏林建设"
 DDR_develop_ost_berlin_desc:0 "作为民主德国的首都，我们需要把东柏林打造成社会主义世界最繁荣，最发达的城市，使其可以跟资本主义世界吹捧的西柏林所媲美。"
 DDR_develop_Mecklenburg:0 "梅克伦堡建设"
 DDR_develop_Mecklenburg_desc:0 "梅克伦堡-波美拉尼亚地区是民主德国重要的海岸地区，我们需要重点发展该地区的造船和航运业。"
 DDR_develop_Saxon:0 "萨克森建设"
 DDR_develop_Saxon_desc:0 "萨克森地区一直是德国重要的工业基地，我们需要重点发展该地区的制造和化工产业。"
 
 DDR_wall_streng:0 "更严格的边境管理"
 DDR_wall_streng_desc:0 "无论从道德立场还是从整个德意志民族的利益来说，离开东德都是在政治和道德上的落后和堕落。不管他们是否知道，实际上他们被西德的反动势力和军国主义所引诱。……全德国的工人们要求惩罚那些离开德意志民主共和国——这一争取和平的坚强堡垒，而为德国人民的死敌——帝国主义和军国主义服务的人。"
 DDR_border_streng:0 "强化边界隔离"
 DDR_border_streng_desc:0 "通过扩大边防机构，升级监视和隔离设施，我们将进一步遏止叛逃者。"
 
 DDR_SED_streng:0 "党政改组"
 DDR_SED_streng_desc:0 "我们需要进一步强化统一社会党的团结与统一，消除共产党、社会党双方之间的隔阂与拍戏对立，加强集权，实现全党上下的路线一致和领导集体一致。"
 DDR_inflect_west:0 "渗透西方"
 DDR_inflect_west_desc:0 "西欧各国的左翼进步群众正积极地反对被帝国主义和保守主义者控制的腐败政府，我们可以为他们提供支持。"
 DDR_clear_nazis:0 "消除军国主义残余"
 DDR_clear_nazis_desc:0 "伟大的反法西斯反纳粹战争以世界人民的胜利结束，为了避免纳粹分子死而复生，我们必须在政治上、文化上和经济上消灭纳粹政权的残余影响。"
 DDR_urbanized:0 "推动城市化"
 DDR_urbanized_desc:0 "第二次世界大战摧毁了我国城市中的许多建筑和设施，包括医院、学校、道路和住房，我们需要尽快进行重建。"
 DDR_NeurMarks:0 "发行东德马克"
 DDR_NeurMarks_desc:0 "第二次世界大战摧毁了我国的经济和金融体系，新的民主德国政府需要尽快发行属于自己的货币，以稳定市场和社会秩序，并建立起党和政府对经济的管理。"
 DDR_Intershop:0 "特供商品"
 DDR_Intershop_desc:0 "我们目前的生产水平，无法满足人民对消费品和奢侈品的需求，因此我们不得不解禁进口措施，允许特定人士，通过特定渠道，购买来自西方的进口商品。"
 
 DDR_Democratic_Republic:0 "从废墟中崛起"
 DDR_Democratic_Republic_desc:0 "Auferstanden aus Ruinen\nund der Zukunft zugewandt\nLass uns Dir zum Guten dienen\nDeutschland einig Vaterland!"
 DDR_Proletarian_dictatorship:0 "无产阶级专政"
 DDR_Proletarian_dictatorship_desc:0 "我国当前政党众多，但社民党、自由党、基民盟……大都代表着资本家、政治投机者甚至敌对分子的利益。我们要建设一个无产阶级所有、代表劳动人民的人民民主国家，共产党就必须领导一切。"
 DDR_Pionierorganisation_Thalmann:0 "恩斯特·台尔曼先锋组织"
 DDR_Pionierorganisation_Thalmann_desc:0 "少先队员，快准备好\n让年轻的心闪耀\n少先队员快准备好\n如恩斯特·台尔曼一样勇敢！"
 DDR_SED:0 "统一社会党"
 DDR_SED_desc:0 "德国现在有许多党派存在，如德国共产党、德国社会民主党等，党派太多不利于我们建立一个强有力的政府，因此我们需要把各大党派合并为一个大党，即德国统一社会党。"
 DDR_Berlin_wall:0 "反法西斯防卫墙"
 DDR_Berlin_wall_desc:0 "大量的人口向西柏林涌入，导致我们流失了大量劳动力和技术人才，我们必须结束这一状况。一堵围墙将会包围整个西柏林，并阻拦叛逃者。"
 DDR_Volkseigener_Betrieb:0 "人民企业"
 DDR_Volkseigener_Betrieb_desc:0 "在从资本主义社会过渡到共产主义社会之前，党和国家将以国有企业的形式管理我国的重要生产资料。"
 DDR_Collective_farm:0 "农业合作社"
 DDR_Collective_farm_desc:0 "合作社可以将分散的农户合并起来，在保留私人财产的情况下分享劳动工具。"
 DDR_Transformation_capitalism:0 "资本主义改造XXXX"
 DDR_Transformation_capitalism_desc:0 "斯大林式的强硬国有化制度不适合我国，我国将与愿意拥护社会主义制度的资本家进行谈判与合作，以公私合营、和平赎买的形式实现对大资本、大财团的控制。"
 DDR_new_economy:0 "新经济体系"
 DDR_new_economy_desc:0 "斯大林模式的经济体制已不再适合民主德国，我们将探索新的模式，并尝试引入利润激励、企业自主、市场经济和对消费品的投资。"
 DDR_Grenztruppen:0 "边防军"
 DDR_Grenztruppen_desc:0 "边防军作为国家人民军第四大军种，将担负起保卫国家边境，尤其是对抗叛逃行为的职责。"
 DDR_Stasi:0 "国家安全局"
 DDR_Stasi_desc:0 "我们是党的剑与盾。"
 DDR_output_production:0 "出口工业"
 DDR_output_production_desc:0 "我们将发展一批可以用于出口创汇的消费品制造，以改善经济状况。"
 DDR_economic:0 "经济重建"
 DDR_economic_desc:0 "世界大战已经严重损害了我国的基础工业，尤其是消费品制造。我们必须迅速恢复经济生产，以满足人民对消费品的需求。"
 DDR_Deutsche_Reichsbahn:0 "国营铁路"
 DDR_Deutsche_Reichsbahn_desc:0 "国有化后的德国铁路将得到进一步的发展。"
 DDR_Sozialistischer_Realismus:0 "社会主义现实主义"
 DDR_Sozialistischer_Realismus_desc:0 "由工人阶级创造出的社会主义进步艺术，将取代落后腐朽的封建宗教艺术和资本主义艺术。"
 DDR_Volkskammer:0 "统一人民议会"
 DDR_Volkskammer_desc:0 "新选举出的统一人民议会将成为民主德国的最高权力机关，当然其议员由拥护社会主义的人士出任。"
 DDR_Woman_right:0 "妇女权益"
 DDR_Woman_right_desc:0 "给予妇女选举权是实现平等，推动社会现代化的重要里程碑，当妇女掌握选票时，也就掌握了自己的命运。"
 DDR_KdA:0 "工人阶级战斗队"
 DDR_KdA_desc:0 "在民主德国有能力组建一支正式的国家武装力量之前，被武装起来的工人民兵将组织工人阶级战斗队，平时参与生产工作，周末参与军事训练，战时编入预备役，以捍卫社会主义新德国。"
 DDR_Volksarmee:0 "国家人民军"
 DDR_Volksarmee_desc:0 "国家人民军将捍卫社会主义的民主共和国，与一切帝国主义敌人进行对抗！"
 DDR_Volksmarine:0 "人民海军"
 DDR_Volksmarine_desc:0 "国家人民军将捍卫社会主义的民主共和国，守护我们的海上疆域！"
 DDR_FDJ:0 "自由德国青年团"
 DDR_FDJ_desc:0 "党领导下的自由德国青年团，将带领德国青年接受社会主义教育，为接班社会主义建设事业而学习和奋斗！"
 DDR_Plattenbau:0 "Plattenbau公寓"
 DDR_Plattenbau_desc:0 "Plattenbau是指东德政府修建的大量公共住宅，为了更好的改善人民生活水平，我们必须修建大量的住宅楼以应对不断增长的人口和城市化。"
 DDR_Schiessbefehl:0 "开枪射击令"
 DDR_Schiessbefehl_desc:0 "开枪射击令将允许边防部队，在三次警告无效后，向非法越境者开枪射击，一切后果由越境者承担。"
 DDR_diplomatic:0 "外交政策"
 DDR_diplomatic_desc:0 "新朝鲜需要尽快与国际社会进行接触，争取世界各国对我国合法性的认可，避免他们倒向南朝鲜。"
 DDR_support_asia:0 "支持第三世界"
 DDR_support_asia_desc:0 "随着殖民体系的瓦解，亚非许多国家独立建立了新的国家。我们必须尽快与这些国家建立良好关系。"
 DDR_support_decolonized:0 "支持去殖民化运动"
 DDR_support_decolonized_desc:0 "亚非拉人民反对殖民者，争取民族独立，我们应该支持他们。"
 DDR_ESS:0 "社会主义经济体系"
 DDR_ESS_desc:0 "在新的经济规划中，政府将加大对消费品和高新技术的投入，以改善民众的生活水平，并促进生产技术和效率的发展。"
 DDR_pro_soviet:0 "坚定的苏联盟友"
 DDR_pro_soviet_desc:0 "伟大的苏维埃社会主义共和国联盟已经成为社会主义国家和第三世界独立国家最坚定的盟友，我们将坚定地和莫斯科的同志们站在一起，对抗帝国主义和新纳粹主义！"
 DDR_comecon:0 "经济互助委员会"
 DDR_comecon_desc:0 "社会主义阵营的全球经济秩序建立在“产业互助”原则上。简而言之就是社会主义阵营以无偿或低偿援建、援助的形式投资盟国的工业发展，以此增加盟国的消费力和无产阶级人口并签订各种联盟条约。"
 DDR_Soviet_group:0 "苏联驻德集群"
 DDR_Soviet_group_desc:0 "与苏联军队的进一步合作将强化我们对抗西方帝国主义威胁的能力。"
 DDR_independence:0 "独立的红色"
 DDR_independence_desc:0 "莫斯科把自己看作社会主义阵营的领导人，无视我们的外交独立和自治。如果我们不愿意成为卫星国家，我们就必须寻求新的外交友谊。"
 DDR_west_relation:0 "改善与西德的关系"
 DDR_ban_west:0 "德国的唯一代表"
 DDR_west:0 "与西方国家接触"
 DDR_west_30_desc:0 "自我封闭不是社会主义。我们应该允许外国，甚至资本主义国家的资金、技术和先进经验前来投资，进口国内产品，吸收他们的先进经验，优化自己，而不破坏我们的基本经济制度。"
 DDR_political_refrom:0 "政治改革的尝试"
 DDR_political_refrom_desc:0 "虽然党作为社会主义国家的建设者作出了巨大贡献，但要进一步实现国家的现代化、民主化和进步，必须打破一党专政，实现多元化。"
 DDR_political_democratic:0 "政治民主化"
 DDR_political_democratic_desc:0 "政治民主化"
 DDR_yugoslava:0 "接触南斯拉夫"
 DDR_yugoslava_desc:0 "我们应该改善与南斯拉夫的外交关系，争取两个社会主义国家之间的友好合作，以促进对外经贸发展。"
 DDR_exist_warsaw:0 "退出华约"
 DDR_exist_warsaw_desc:0 "华沙条约并不是社会主义国家的庇护伞，而是俄国人施加在欧洲大陆身上的枷锁，德国人民不会屈服于华盛顿的遥控，而是追求自主的政治和外交政策。"
 DDR_support_arabs:0 "支持阿拉伯国家"
 DDR_support_arabs_desc:0 "随着苏伊士运河战争结束，阿拉伯民族主义在阿拉伯各国蓬勃发展，以纳赛尔主义、阿拉伯复兴革命党为代表的阿拉伯革命势力不仅具有社会主义进步性质，而且积极与西方势力作斗争，他们将会是我们重要的盟友。"
 DDR_Volkspolizei:0 "人民警察"
 DDR_Volkspolizei_desc:0 "民主共和国建立之初，首要任务便是稳定秩序，我们需要完善的治安警察队伍来维护社会稳定，帮助重建秩序，打击犯罪，清剿破坏法律和人民利益的犯罪集团，并镇压试图破坏新政权的法西斯残余分子。"
 DDR_take_westberlin:0 "索取西柏林"
 DDR_take_westberlin_desc:0 "西方国家非法占据了西柏林，在我们的首都旁安置了一个资本主义的窗口，来展示他们所谓自由的糜烂生活，这令我们无法接受。我们必须向西方国家严正地提出归还西柏林的要求。"
 DDR_black_radio:0 "黑频道"
 DDR_black_radio_desc:0 "地下广播频道可以向西德发送广播信号，向西德人民揭露波恩政府的虚伪。"
 DDR_military_industry:0 "军事工业"
 DDR_military_industry_desc:0 "从制造简单的军服、步枪、子弹和炸弹开始。"
 DDR_PCK_Raffinerie:0 "PCK炼油厂"
 DDR_PCK_Raffinerie_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 DDR_take_prussia:0 "索取普鲁士领土"
 DDR_take_prussia_desc:0 "俄国人对东普鲁士的瓜分是对德国人民的出卖和背叛，我们将重新夺回这些领土。"
 DDR_strength_border:0 "强化边界"
 DDR_monitor:0 "监控与监视"
 DDR_monitor_desc:0 "一些敌视社会主义[FROM.GetName]的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。在全国范围内扩大狙击反动势力的监视网，消灭任何涉嫌支持反革命、反社会主义的敌对分子。"
 DDR_open_border:0 "部分开放边界"