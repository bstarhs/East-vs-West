 Olympic.1948.t:0 "1948年伦敦奥运会"
 Olympic.1948.d:0 "第十四届奥林匹克运动会今日在伦敦温布利体育场盛大开幕，这是人类经历世界大战浩劫后首次重启的奥运盛会。尽管看台残破、运动员宿舍简陋，但六万观众山呼海啸般的欢呼，宣告着和平精神的回归。\n59个国家代表团在《英雄生涯》乐曲中入场，德国、日本因战争责任被禁赛，苏联则选择缺席。最动人的时刻是英国田径选手手持火炬跑进场内——那火焰采自希腊奥林匹亚，途经战火蹂躏的欧洲各国首都。当和平鸽从布满弹痕的看台飞起时，不少观众掩面而泣。\n正如奥委会主席所言："我们带来的不是奢华，而是希望。"在伦敦残垣断壁的背景下，这场体育盛会正为破碎的世界缝合第一道伤口。"
 
 Olympic.1949.t:0 "1948年瑞士圣莫里茨冬奥会"
 Olympic.1949.d:0 "在阿尔卑斯山灿烂的阳光下，第五届冬季奥林匹克运动会今日于圣莫里茨隆重开幕。这是二战终结后首次举办的冬季体育盛会，来自28个国家的代表团在雪山环绕的赛场上，共同书写战后和解的新篇章。\n开幕式上最引人注目的是三个首次亮相的冬奥代表团：刚摆脱殖民统治的冰岛、获得独立的韩国与黎巴嫩运动员，他们身着崭新队服，在《奥林匹克颂》中昂首入场。而因战争责任被禁赛的德国、日本代表团席位空空如也，成为对侵略者的无声审判。\n国际奥委会主席表示："这些在雪地上划出的轨迹，正是人类走出战争阴霾的路径。"当圣火在海拔1856米的雪山之巅燃烧时，历经沧桑的欧洲大陆终于看到了和平的曙光。"
 
