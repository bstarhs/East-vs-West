 saf.36.t:0 "南非颁布《通行证法案》"
 saf.36.d:0 "南非政府颁布《通行证法案》，旨在隔离人口、管理城市化以及分配移民劳工。\n该法严格限制了黑人公民的活动，而其他人也要求他们在家乡或指定区域外携带通行证。此外，该法案也给予了南非警察以缺失证件为由，任意逮捕异见人士的权力。"
 
 saf.37.t:0 "《通行证法案》引发强烈不满！"
 saf.37.d:0 "《通行证法案》引发南非有色人种的强烈不满，因为这意味着警察获得了随意逮捕并迫害任何人的权力。\n非洲人国民大会决定发动一系列反对《通行证法》的政治运动。"
 
 saf.38.t:0 "沙佩维尔爆发大规模暴动！"
 saf.38.d:0 "一群人数介于5,000至10,000人之间的群体于沙佩维尔当地的一处警察局前方集合，这些群众借由透过其未携带通行证的违法行为向警方自首，来表达对《通行证法》的抗议。警方对此次示威并非毫无准备，其于前一晚已将小部分更激进的群体驱逐离开。\n除了参与示威的人士之外，不少民众亦到场表态对该活动诉求的支持。尽管如此，亦有证据显示，泛非主义者大会亦透过威吓手段促使民众前来，这些手段包括切断联络沙佩维尔的电话线，透过分发小册子促使民众于游行当日不去工作，以及恐吓公车司机和其他运输驾驶员。\n参与游行的民众人数来到了20,000人，局面也逐渐失去控制。"
 
 saf.39.t:0 "南非警察向示威者开枪射击！"
 saf.39.d:0 "今日下午，南非沙佩维尔镇发生震惊世界的血腥事件。数千名黑人群众和平抵制《通行证法》的示威游行遭警方暴力镇压，现场至少造成多人死亡可能有过百人受伤，死者中包含多名妇女儿童。\n5000余名示威者聚集警察局外焚烧通行证。警方先施放催泪弹，但因风力影响收效甚微。下午1时15分，当警方试图逮捕一名示威者时，与保护该男子的群众发生推搡。混乱中，部分示威者向警局投掷石块，警方随即使用警棍进行驱散。\n下午1时25分，在未发出明确警告的情况下，150名警察突然使用步枪向人群扫射。目击者称：他们像打猎一样射击奔跑的民众。现场发现多数遇难者背部中弹，部分尸体堆积在铁丝网障碍物前。救护车被军方阻拦两小时后才获准进入。\n联合国秘书长紧急召开安理会会议，南非政府宣布在全国126个行政区实施戒严，非国大领袖表示：沙佩维尔的鲜血将浇灭最后一丝和平改革的希望。"
 
 saf.40.t:0 "沙佩维尔事件震惊世界！"
 saf.40.d:0 "南非警察在沙佩维尔射杀示威者的行为，导致了69人死亡，其中包含8名妇女和10名儿童。联合国安理会今日召开会议，南非政府遭到国际社会的强烈谴责。部分国家，尤其是新独立的非洲国家呼吁进行投票表决，谴责南非政府并予以制裁。"