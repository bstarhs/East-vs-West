 saf.11.t:0 "南非选举即将开始！"
 saf.11.d:0 "南非议会选举即将开始，扬·史末茨领导的统一党对阵丹尼尔·弗朗索瓦·马兰领导的联合国民党。观察认为联合国民党有可能赢得巨大优势，因为该党关注南非白人阶级的经济问题，且大力支持进行种族隔离，尔统一党却因为亲英、亲共和二战时期的错误决策为人诟病"
 
