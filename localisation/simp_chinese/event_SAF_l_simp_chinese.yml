 saf.13.t:0 "南非政府颁布《禁止跨族婚姻法》"
 
 saf.20.t:0 "南非总理约翰内斯·斯特里敦病逝！"
 saf.20.d:0 "南非总理约翰内斯·斯特里敦因突发心脏病，在比勒陀利亚去世。南非国民党推举亨德里克·维沃尔德接任。亨德里克·维沃尔德将继续斯特里敦的种族隔离政策，同时南非政府依然反对英国去殖民化的决定，强调如果英国不能保证白人在非洲，尤其是在南方的利益，南非将考虑更激进的政策。"
 
 
 saf.23.t:0 "南非颁布《隔离设施法》"
 saf.23.d:0 "南非国民党政府正式通过了《隔离设施法》，将种族隔离制度推向一个更加系统化与日常生活化的残酷新阶段。该法案的核心是彻底禁止不同种族人群混用任何公共服务设施。它不仅在法律上允许地方政府为公共厕所、候车室、公园长椅、公共汽车、医院、学校和大学等所有场所打上种族专属标签，更将违反者置于被拘留的法律风险之下。一时间，从城市公园到乡村车站，“白人专用”的布告板随处可见，有色人种最基本的日常生活权利被公然剥夺与羞辱，社会被一道无形的墙彻底割裂。\n此法一出，立即在国际社会引发强烈震动与普遍谴责。伦敦方面对南非当局这种“倒行逆施”的行径予以猛烈抨击，认为其严重违背了基本人权与文明准则。然而，南非国内的右翼势力对此不以为然。以《公民报》为代表的保守派报纸尖刻地讽刺英国“在非洲没几年了”，无权对南非的内政指手画脚，并宣称这是为了维护白人文明与种族纯洁所必需的“内部事务”。\n这场由一部法律引发的国际风波，清晰地展现了南非政府在国际孤立中继续深化种族隔离的顽固决心，同时也预"
 
 saf.24.t:0 "南非颁布《班图人教育法》"1953
 saf.24.d:0 "南非政府正式颁布了《班图人教育法开始实施教育上的隔离，该法令为非裔学生单独设立了一个的教育系统，意欲把黑人培养成工薪阶层。"1953
 
 saf.25.t:0 "南非颁布《代表分离法案》"
 saf.25.d:0 "南非政府正式颁布了《代表分离法案》，宣布将有色人种单独列出选举人名单。"
 
 saf.26.t:0 "南非颁布《班图人城市区域法》"
 saf.26.d:0 "南非政府正式颁布了《班图人城市区域法》，有色人种在城市地区的定居和就业将予以更加严格的限制。"
 
 
