l_simp_chinese:
 space_title:0 "§Y太空探索§W\n查看航天发射计划，发射航天器以在太空探索中进行竞争并获得回报。"
 space_desc:0 "查看航天发射计划。"
 TEXT_ALLOW_LAUNCH_VEHICAL:0 "这项技术允许你发射运载火箭。"
 SPACE_launch_vehicle:0 "发射运载火箭"
 SPACE_launch_vehicle_DESC:0 "发射并测试运载火箭。"
 SPACE_Satellite:0 "发射人造卫星。"
 SPACE_Satellite_DESC:0 "发射一颗人造卫星。\n 你需要先发射运载火箭，以及累计200点航天点数"
 SPACE_space_dog:0 "太空狗"
 SPACE_space_dog_DESC:0 "将猫狗等动物放入太空舱并送入近地轨道。\n 你需要先发射人造卫星"
 SPACE_manned_space:0 "载人航天"
 SPACE_manned_space_DESC:0 "将运载火箭搭载宇航员并送入近地轨道飞行。\n 你需要先发射太空狗"
 SPACE_signal_Satellite:0 "通讯卫星"
 SPACE_signal_Satellite_DESC:0 "发射一颗通讯卫星，电子信号可以借助太空传播。\n 你需要先发射人造卫星"
 SPACE_spy_satellite:0 "间谍卫星"
 SPACE_spy_satellite_DESC:0 "发射一颗间谍卫星，以提高部队侦察能力和间谍刺探情报效果。\n 你需要先发射人造卫星"
 SPACE_spy_satellite_work:0 "间谍卫星§Y正在工作§W\n预计还有§Y[?spy_satellite_date]§W个月的使用寿命"
 SPACE_moon_landing:0 "登月"
 SPACE_moon_landing_DESC:0 "将载人飞船向月亮发射，在月亮上留下我们的旗帜。\n花费§Y320§W航天能力\n 你需要先发射载人航天和通讯卫星"
 SPACE_space_station:0 "太空站"
 SPACE_space_station_DESC:0 "建造一座空间站，使宇航员可以在太空中长期补给和进行任务。\n 你需要先发射载人航天，并研究太空站科技"
 SPACE_space_station_working:0 "太空站正在工作，它可以每月为您带来30点航天点数"
 SPACE_Space_Shuttle:0 "航天飞船"
 SPACE_Space_Shuttle_DESC:0 "研究并发射可回收的航天飞机，为太空站补充食物、人员和零部件。\n 你需要先发射太空站"
 SPACE_Space_Telescope:0 "太空望远镜"
 SPACE_Space_Telescope_DESC:0 "将运载火箭搭载宇航员并送入近地轨道飞行。"
 
 SPACE_moon_space_probe:0 "月球探测器"
 SPACE_moon_space_probe_DESC:0 "向月球发射一个探测卫星，探测卫星会绕月球环绕一段时间并进行探索。卫星存在时间有一定几率获得发现事件，可以提高你的国际影响力和太空探索能力。探测卫星是有时间限制的，到期后需要重新发射。\n 你需要先发射人造卫星"
 
 space_power:0 "综合航天能力: §Y[?space_power]§W,上限为§Y[?max_space_power]§W\n目前消耗§Y[?space_power_costed]§W政治点数每月添加§Y[?pp_add_space_power]§W综合航天能力，上限为§Y[?max_pp_add_sp]"
 space_power_title:0 "综合航天能力"
 space_power_DESC:0 "综合航天能力代表着你国在太空探索上的效果，数值越高，你发射航天器的成功率越高，训练宇航员的速度越快。"
 astronaut:0 "现有航天员: [?astronaut]"
 astronaut_title:0 "航天员数量"
 astronaut_DESC:0 "你现在拥有[?astronaut]位航天员，派遣越多航天员参与航天计划，所获得的国际威望回报越大。但请注意，航天计划失败将导致航天员死亡。"
 space_success:0 "你已完成该项目"
 space_race_lead_modifiers:0 "太空竞赛保持领先"
 SOV_Satellite_space:0 "苏联已发射人造卫星"
 USA_Satellite_space:0 "美国已发射人造卫星"
 SOV_manned_space:0 "苏联已完成载人航天飞行"
