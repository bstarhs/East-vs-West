 SPACE_extravehicular_activity:0 "舱外活动"
 SPACE_extravehicular_activity_desc:0 "发射载人宇宙飞行器，并让宇航员身着宇航服离开太空舱走向宇宙。"
 SPACE_sub_orbital_spaceflight:0 "亚轨道飞行器"
 SPACE_sub_orbital_spaceflight_desc:0 "发射载人的喷气式飞机，并使其能在接近大气层的高度进行可控飞行。"
 SPACE_orbit_fleight:0 "绕地轨道飞行"
 SPACE_orbit_fleight_desc:0 "发射载人宇宙飞行器，并使其在大气层外绕地球飞行。"
 SPACE_moon_testing:0 "绕月轨道飞行"
 SPACE_moon_testing_desc:0 "发射载人宇宙飞行器，并使其环绕月球飞行，从而收集月球周边的飞行数据，为载人登月做准备。"
 
