 space_action_succes_gain_title:0 "太空任务成功率加成: §Y[?space_succes_gain]§W"
 space_action_succes_gain_desc:0 "通过研究科技以增加太空任务的成功率"
 space_points_growth_desc:0 "美国已完成登月任务"
 space_robe_times_title:0 "航天器默认运行时间: §Y[?space_robe_times]§W"
 space_robe_times_desc:0 "人造卫星和太空探测器的运行时间，事件结束后探测器将失效"
 space_next_times_title:0 "下一次航天任务间隔: §Y[?space_next_times]§W"
 space_next_times_desc:0 "航天中心每完成一次任务后都要一定时间进行休整，才能进行下一次任务"
 
