 space_mars:0 "火星探索"
 space_mars_DESC:0 "向火星发射一个探测卫星，探测卫星会绕火星环绕一段时间并进行探索。卫星存在时间有一定几率获得发现，可以提高你的国际影响力和太空探索能力。探测卫星是有时间限制的，到期后需要重新发射。\n 你需要先完成载人航天"
