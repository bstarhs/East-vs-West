 WDR_plastic_produc:0 "化工产业"
 WDR_steelmaking:0 "钢铁工业"
 WDR_Autogerechte_Stadt:0 "汽车友好型城市"
 
 WDR_Schnez_troop:0 "支持史内资部队"
 WDR_Petersberg_Agreement:0 "彼得斯堡协定"
 WDR_blanc_office:0 "布兰克办公室"
 WDR_uniformed_citizen:0 "穿军装的公民"
 WDR_uniformed_citizen_desc:0 "为了避免军队中的军国主义者再次推翻民主政府，建立军事统治，军队和军人的权力必须受到严格限制。德国国防军是一群穿着军装的公民，公民就必须忠诚并遵守德国的法律。"
 WDR_born_treaty:0 "波恩条约"
 WDR_relation_roc:0 "亲近中华民国"
 WDR_relation_roc_desc:0 "德国和中国都遭到了的苏联支持的共产党政权的占领和分裂，因此我们应当像二十年前一样，再一次和中国国民党政府加强关系，既表达了我们反对共产党的决心，也获得了一个重要的亚洲盟友。"
 WDR_euro_space:0 "欧洲航天局"
 WDR_euro_space_desc:0 "纳粹给德国留下了不少航天技术遗产，欧洲各国都想分一杯羹，也许我们可以开出条件，以参与到欧洲的航空探索事业当中。"
 WDR_space_explore:0 "太空探索"
 WDR_space_explore_desc:0 "世界各国都在发展航空技术，力求在太空事业中作出自己的成就，德国不能落后于人。许多纳粹时期的科学家还留在德国，我们应当完成我们未竞的事业。"
 WDR_nuke_plan:0 "核武器计划"
 WDR_nuke_plan_desc:0 "当齐格弗里德的剑刺穿巨龙法夫纳的心脏，莱茵的黄金便注定带来诸神的黄昏……\n——《尼伯龙根之歌》"
 WDR_oversea:0 "海外派遣"
 WDR_oversea_desc:0 "欧洲短时间内爆发苏联与北约之间全面战争的可能性不太高，但国防军需要实战来积累经验，以及提高外交威望。第三世界国家现在正爆发许多局部冲突，联合国呼吁各国派遣维和部队协助维持秩序，这对我们来说是一个机会。"
 WDR_relation_latin:0 "打开拉美市场"
 WDR_relation_latin_desc:0 "战后世界平等外交、民族解放的格局下，即使是持门罗主义的美国也无法完全封锁拉丁美洲各国的外交渠道，垄断其市场份额。我们可以趁此机会和拉丁美洲各国开展政治和经济上的合作。"
 WDR_israeli_coop:0 "与以色列合作"
 WDR_israeli_coop_desc:0 "无论以色列民间舆论如何看待，但至少以色列政府官方已经接受了与我们恢复正常关系，接下来我们将尝试促进两国在经济、军事和科学技术上的进一步合作，我们有武器，以色列有科技，反正爱因斯坦已经死了很多年了。"
 WDR_PRC_market:0 "打开中国市场"
 WDR_PRC_market_desc:0 "我们与北京改善关系的政策取得了不错的效果，中国官员对我们的许多技术很感兴趣，包括生产技术、精密机械等，尤其喜欢大众推出的桑塔纳旅行车，不要错过这个让德国汽车占领中国市场的大好机会。"
 WDR_relation_PRC:0 "与北京建交"
 WDR_relation_PRC_desc:0 "中国共产党政权已经不可能被推翻，我们不可能与这个占世界上五分之一人口的国家永远老死不相往来，既然德国已经放弃了哈尔斯坦主义，那么，与中华人民共和国建立外交关系就要提上日程。"
 WDR_east_euro_market:0 "打开东欧市场"
 WDR_east_euro_market_desc:0 "我们对东欧国家改善关系的政策取得了成功，东欧民族对德国的商品不再显得特别抗拒，因此我们需要抓住机会扩大德国商品在东欧的市场优势。"
 WDR_relation_east_euro:0 "赔偿东欧国家"
 WDR_relation_east_euro_desc:0 "尽管新东方政策促使我们在改善对东欧共产主义国家上取得了进步，但纳粹入侵的受害国们更希望我们补偿他们需要的东西，例如技术和经济援助。"
 WDR_relation_isr:0 "赔偿以色列"
 WDR_relation_isr_desc:0 "我想我们已经不需要过多介绍，纳粹对犹太人所犯下的可怕罪行。比起没有意义的口头道歉，犹太人更希望我们做出实际行动，帮助他们在应许之地重建家园。"
 WDR_relation_african:0 "改善非洲国家关系"
 WDR_relation_african_desc:0 "去殖民化风潮席卷全球，许多非洲国家脱离殖民独立，我们应该尽快和他们改善关系，扩大德国产品市场、争取外交支持。"
 WDR_relation_arabs:0 "改善阿拉伯国家关系"
 WDR_relation_african_desc:0 "尽管许多阿拉伯人可能仍记得殖民统治，但为了珍贵的石油资源和国际影响力，我们还是需要改善与阿拉伯国家的关系。"
 WDR_relation_kor:0 "与南韩的合作"
 WDR_relation_kor_desc:0 "德国和韩国都遭到了的苏联支持的共产党政权的占领和分裂，因此我们应当和南韩政府加强关系，既表达了我们反对共产党的决心，也获得了一个重要的亚洲盟友。"
 WDR_relation_jap:0 "与日本的合作"
 WDR_relation_jap_desc:0 "德国和日本需要第二次应对苏联的威胁。"
 WDR_lefwing_euro:0 "与欧洲左派的联合"
 WDR_lefwing_euro_desc:0 "一个孤立的左派德国政府，很容易会遭到英美帝国主义和苏联修正主义的绞杀，我们需要尽快与欧洲各国左翼党派实现联合，从而获得强大的支持。全世界无产者，联合起来！"
 WDR_expel_american:0 "驱逐美国驻军"
 WDR_expel_american_desc:0 "德意志绝不会成为美国爆发户的傀儡！我们要求美国驻军全部撤离，以表明德国是一个独立的主权国家！"
 WDR_exist_NATO:0 "退出北约"
 WDR_exist_NATO_desc:0 "北大西洋公约并不是西欧自由国家的庇护伞，而是美国人施加在欧洲大陆身上的枷锁，德国人民不会屈服于华盛顿的遥控，而是追求自主的政治和外交政策。"
 WDR_ended_america:0 "与美国结束关系"
 WDR_ended_america_desc:0 "美国以反共和镇压纳粹为借口，在德国的身上套上层层枷锁，限制我们的军力，侵犯我们的主权，德意志不会屈服，我们将再一次撕毁《凡尔赛条约》！"
 WDR_communism_united_gov:0 "左翼联合政府"
 WDR_communism_united_gov_desc:0 "罗莎·卢森堡已经对列宁和斯大林式的一党专政的独裁本质作出了批评和揭露，真正的社会主义国家不应该实行一党独裁。新的社会主义德国政府应当建立在各大左翼进步党派的联合之上。"
 WDR_old_armies:0 "邀请旧军人"
 WDR_old_armies_desc:0 "尽管极不情愿，但我们需要面对现实。德国不存在没有参与过二战的职业军人，如果要重建军队，就必须将这些旧国防军军人特赦，并邀请他们成为新国防军的高层。是的，他们当中许多人可能依然忠诚于纳粹，但比起在苏联入侵时束手无策，这风险是值得的。"
 WDR_expanded_mineral:0 "扩大矿业"
 WDR_expanded_mineral_desc:0 "我们需要扩大莱茵河地区的煤炭和金属矿产的开采，使其足以供应我们的生产需求。"
 WDR_NATO:0 "北大西洋公约"
 WDR_NATO_desc:0 "法国担心德国复兴，并因此极力推行肢解德国的政策，但这种担忧似乎完全是杞人忧天。1945年后，德国在军事、经济和政治上都已衰败，在我看来，这足以保证德国无法再次威胁法国。在未来的欧洲合众国中，我看到了欧洲乃至德国的巨大希望。我们必须努力提醒法国、荷兰、比利时和其他欧洲国家，它们和我们一样，都位于西欧，它们现在是、将来也永远是我们的邻国，它们对我们施加的任何暴力最终都会导致麻烦，如果仅仅依靠武力，欧洲就不可能建立持久的和平。\n——康拉德·阿登纳"
 WDR_NATO_nuclear_share:0 "北约核共享方案"
 WDR_NATO_nuclear_share_desc:0 "在苏联庞大的核武器威胁下，单凭英法两国的核武储备和美国少量部署，是无法对抗苏联核武库的。德国应当尝试与英美法谈判，获得少量战术核武器以能够独立对抗，当然他们会有很大顾忌。"
 WDR_earth_pro:0 "环保议题"
 WDR_earth_pro_desc:0 "《寂静的春天》让环境破坏和保护成为了政治议题，当被污染的水源、河流、海洋，死亡并消失的物种、开发殆尽的森林和被二氧化硫侵蚀的天空成为报纸和电视新闻上的热议话题时，公众对环保政策和污染控制的关注便不断提高。有的政府积极支持环保议题，希望以此争取进步主义者的支持。"
 WDR_clear_energy:0 "鼓励清洁能源"
 WDR_clear_energy_desc:0 "轰隆隆冒出黑烟的化石能源已经成为落后的象征，很快就会被淘汰，低污染的核能、风能、水电和太阳能将成为未来的主流能源。"
 WDR_G7:0 "七大工业国集团峰会"
 WDR_G7_desc:0 "石油危机和货币危机，对美、英、法、德、日等制造业大国带来了多次严重的经济衰退，为了更好的应对危机，制造业大国之间需要更多的互相协调与合作，因此定期组织工业大国首脑进行峰会很有必要。"
 WDR_tax_reform:0 "税法改革"
 WDR_tax_reform_desc:0 "政府向企业收取高额的税收，以此来补贴福利政策，使得企业失去了发展的活力和市场竞争力，应当调整税收，为有发展能力的企业提供减税降税，以鼓励他们扩大生产。"
 WDR_LGBT:0 "LGBT问题"
 WDR_LGBT_desc:0 "随着嬉皮士运动带来性解放和完全颠覆宗教的性观念，曾被认为是怪胎的变性者和同性恋群体，也开始自称为性少数群体，要求得到政治权利。在选票面前，一些标榜进步主义的政党无论愿不愿意，也不得不与他们进行接触。"
 WDR_female:0 "支持女性权益"
 WDR_female_desc:0 "无产阶级妇女若不为平等而斗争，将永远无法挣脱双重的枷锁：资本与性别。\n——克拉拉·蔡特金"
 WDR_social_reform:0 "社会改革"
 WDR_social_reform_desc:0 "人人生而平等，消灭社会歧视，普及人权和法制，令我国的每一个公民都有尊严的活着，才能打造一个伟大的自由国家。"
 WDR_support_rightwing:0 "支持欧洲新右翼"
 WDR_support_rightwing_desc:0 "一个孤立的德国民族主义政府，很容易会遭到英美犹太人和苏联共产党的绞杀，我们需要尽快与欧洲各国右翼党派实现联合，从而获得强大的支持。全世界反动派，联合起来！"
 WDR_expanded_armed:0 "扩大武装"
 WDR_expanded_armed_desc:0 "我们需要大炮与黄油。"
 WDR_pure_nation:0 "纯净的民族"
 WDR_pure_nation_desc:0 "纯净的民族"
 WDR_invade_sov:0 "巴巴罗萨"
 WDR_invade_sov_desc:0 "我们不是第一次，也不是最后一次与俄国人决一死战，这一次我们必将胜利！"
 WDR_invade_brit:0 "海狮计划"
 WDR_invade_brit_desc:0 "我们不是第一次，也不是最后一次与英国人决一死战，这一次我们必将胜利！"
 WDR_junger_group:0 "青年团"
 WDR_junger_group_desc:0 "国家机器的运作离不开人，尤其是这些崭新的······青年。"
 WDR_nazis_rule:0 "纳粹党的权威"
 WDR_french_nuclear:0 "与法国的核能合作"
 WDR_french_nuclear_desc:0 "随着我们与法国的关系改善，我们可以向法国人购买一些先进的技术，例如核能发电。"
 WDR_FDP:0 "支持自由民主党"
 WDR_carrier:0 "发展航空母舰"
 WDR_carrier_desc:0 "第二次世界大战的海上战争，航空母舰大放异彩。巨舰大炮的时代已被淘汰，舰载机将主宰未来地球70%的天空！"
 WDR_cruiser:0 "发展轻型战舰"
 WDR_cruiser_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 WDR_submarine:0 "发展潜艇舰队"
 WDR_submarine_desc:0 "卡尔·邓尼茨元帅与世长辞，但他的遗产将回归。"
 WDR_expanded_baval:0 "扩大军港"
 WDR_expanded_baval_desc:0 "我国的海军力量不断壮大，对海军设施的要求也越来越高。"
 WDR_anti_missile:0 "建设反导系统"
 WDR_anti_missile_desc:0 "俄国人的核导弹威胁着我们，我们需要建立更大、更完善和高效的战略武器防御系统，让我们的部队和民众更好地规避战略武器的攻击。"
 WDR_missile_focus:0 "发展导弹技术"
 WDR_missile_focus_desc:0 "导弹技术可能是20世纪最重要的军事发明之一，他最早诞生于二战德国的V2火箭，并在50年代的美苏争霸中完善。最早的导弹通过红外线热感应进行制导，通过接收目标反射的热光调整弹道，到了后来出现了电视制导和主动激光制导。导弹的应用相当广泛，它可以用于大型的弹道导弹，也可以用于制导炸弹，或步兵、车载的反坦克或反导导弹，它大大提升了军队的作战效率，但最大的问题就是——他太贵了。"
 WDR_fighter_focus:0 "发展战斗机"
 WDR_fighter_focus_desc:0 "纳粹德国是世界上第一个开发出喷气式战斗机的国家，现在我们要重建我们在空军中的领先地位。"
 WDR_anti_spy:0 "强化反间谍能力"
 WDR_mines_bomb:0 "中子弹地雷"
 WDR_defence_berlin:0 "加强西柏林驻防"
 WDR_Berlinale:0 "柏林电影节"
 WDR_military_weapons:0 "发展步兵武器"
 WDR_military_weapons_desc:0 "纳粹德国是世界上第一个开发出突击步枪的国家，现在我们要重建我们在枪械武器中的领先地位。"
 WDR_military_armor:0 "发展装甲车辆"
 WDR_military_armor_desc:0 "Achtung!Panzer!"
 WDR_military_Industry3:0 "军事工业 III"
 WDR_military_Industry3_desc:0 "对德国的一系列军备限制已经被打破，我们将再一次重建强大的军事工业体系！"
 WDR_military_Industry2:0 "军事工业 II"
 WDR_military_Industry2_desc:0 "我国的军事工业正在重建和复兴，我们将进一步发展军工，使我国拥有自主生产装甲车辆和战斗机的能力。"
 WDR_military_Industry:0 "军事工业 I"
 WDR_military_Industry_desc:0 "英美摧毁了德国曾经发达的军事工业，但现在我们必须尽快将他重建起来，以支持国防军的重建。先从能够自主生产基本的枪支弹药开始。"
 WDR_claime_poland:0 "宣称前东部领土"
 WDR_claime_poland_desc:0 "俄国人把德意志的土地当成蛋糕一样分割，我们的东普鲁士、波美拉尼亚和西里西亚被俄国人和波兰人抢占吞并，而德国共产党耻辱地接受了这一非法侵占！而我方不承认这一结果，我们要求俄国人把吃进去的吐出来！"
 WDR_former_DDR_leaders:0 "接纳前东德官员"
 WDR_former_DDR_leaders_desc:0 "政治报复总是伴随着仇恨与反抗，而宽容和对话才能带来一个稳定与和平的新德国。我们不应该强硬地清算德国共产党，而是尝试接纳他们，甚至应该允许不分不反对统一、没有刑事罪行的前东德官员，继续留在他们的职位上。"
 WDR_economic_stabiliry:0 "稳定东部经济"
 WDR_economic_stabiliry_desc:0 "经济萧条的东部与发达的西部有着巨大的差异，大量的西德商品和人口涌入东德，肯定会对当地产业造成毁灭性的破坏，因此我们应该制定一些法律，限制西德的商品和其他产业涌入东德，使得东部可以稳定地过渡到市场经济当中。"
 WDR_accept_ostalieg:0 "接受东德情怀"
 WDR_accept_ostalieg_desc:0 "共产党统治东部数十年，已经有无数民众将共产主义的生活方式视作自己人生的一部分，与其强硬地改变，不如顺其自然，不要打扰困在房间中的老妇人。"
 WDR_taken_eastern_economic:0 "收割东德"
 WDR_taken_eastern_economic_desc:0 "东部现在是我们的了，当地的工业、产业、技术和市场都将属于来自西部的大企业瓜分，至于当地的失业率和经济状况，不是我们要关心的。"
 WDR_remove_communism:0 "清算共产主义"
 WDR_remove_communism_desc:0 "东德的共产党政府和喽啰必须为他们分裂国家，出卖德国，勾结苏联，镇压同胞的罪行付出代价，每一个共产党分子都将在审判庭上等待自己耻辱的结局！"
 WDR_einigkeit:0 "统一"
 WDR_einigkeit_desc:0 "Einigkeit und Recht und Freiheit\nFür das Deutsche Vaterland!\nDanach lasst uns alle streben\nBrüderlich mit Herz und Hand!"
 WDR_pankov_railway:0 "通往潘科的列车"
 WDR_pankov_railway_desc:0 "音乐拥有强大的力量，在年轻人中传播自由理念。居住在潘科的东部共产党领导人们越是害怕他，我们越是要支持流行音乐进入东德。"
 WDR_support_escape:0 "帮助东部难民"
 WDR_support_eastern_revolt:0 "支持东部抵抗运动"
 WDR_Schengener:0 "申根条约"
 WDR_Schengener_desc:0 "随着西欧经济恢复并迅速发展，社会趋于稳定，欧洲国家之间的跨国旅行广受各国群众欢迎，但复杂的签证问题成为许多民众的难题。既然欧洲经济一体化和货币一体化已开始推行，那应当尝试取消签证限制，让欧洲各国更进一步地融为一体。"
 WDR_fra_battalion:0 "德法联合旅"
 WDR_ITA_relation:0 "改善与意大利关系"
 WDR_ITA_relation_desc:0 "墨索里尼已死，新的意大利政府依然记恨着纳粹入侵带来的毁灭，想要和他们重新交朋友还是很困难，但在共产党的威胁面前，我们还是需要尽可能争取他们的谅解以促使欧洲团结起来。"
 WDR_SWE_relation:0 "改善与北欧国家关系"
 WDR_SWE_relation_desc:0 "丹麦和挪威依然记恨着纳粹入侵带来的毁灭，想要和他们重新交朋友还是很困难，但在俄国人的威胁面前，我们还是需要尽可能争取他们的谅解以促使欧洲团结起来。"
 WDR_HOL_relation:0 "改善与低地国家关系"
 WDR_HOL_relation_desc:0 "荷兰、比利时和卢森堡依然记恨着纳粹入侵带来的毁灭，想要和他们重新交朋友还是很困难，但在俄国人的威胁面前，我们还是需要尽可能争取他们的谅解以促使欧洲团结起来。"
 WDR_ENG_relation:0 "改善与英国关系"
 WDR_ENG_relation_desc:0 "英国人依然记恨着纳粹入侵带来的毁灭，想要和他们重新交朋友还是很困难，但在俄国人的威胁面前，我们还是需要尽可能争取他们的谅解以促使欧洲团结起来。"
 WDR_progressive:0 "进步主义"
 WDR_progressive_desc:0 "战后世界的社会意识形态急速发展，环保主义、女权运动和性解放都在快速发展，我国政府需要及时地推行相应的政策来面对这些新的挑战。"
 WDR_Unionsparteien:0 "基民盟-基社盟联盟"
 WDR_Godesberger_Programm:0 "哥德斯堡纲领"
 WDR_immigrate:0 "外来移民"
 WDR_immigrate_desc:0 "随着国家的经济法不断发展，不断繁荣的社会也开始导致我们的国家开始老龄化，高度的福利制度也使得劳动力成本越来越高，为了解决这个问题，引进劳动力不失为一个合理的方案。那些从第三世界国家来的移民可以接受更低的福利和薪水。"
 WDR_foreign_labour:0 "吸引外国劳工"
 WDR_finnance_focus:0 "发展金融业"
 WDR_finnance_focus_desc:0 "制造业已经不再适合我国的发展需求，高投入低汇报的低端制造业将流入第三世界国家，而发达国家将拥抱第三产业。金融、证券、信贷、期货、保险、股市和服务业将以更低的投入提供更高的税收。"
 WDR_tourism_focus:0 "发展旅游业"
 WDR_basic_construction:0 "基础设施建设"
 WDR_basic_construction_desc:0 "完善的基础设施是沟通全国各地，发展经济并建立稳固政权的前提。"
 WDR_infrastruct:0 "铁路建设"
 WDR_vaterland:0 "上帝 祖国 家庭"
 WDR_vaterland_desc:0 "我们要把基督耶稣和上帝的信条深深地刻入我们的社会文化，每一个公民都应当虔诚地根据基督的旨意行事。"
 WDR_luther:0 "支持路德宗"
 WDR_luther_desc:0 "路德的宗教改革是德意志精神的第一次觉醒，他让我们意识到：我们是一个民族！\n——恩斯特·莫里茨·阿恩特"
 WDR_catholic:0 "支持天主教"
 WDR_catholic_desc:0 "德意志的人民自古以来就是天主忠实的仆人，耶稣向圣彼得的继承者授予天空、大帝与海洋，并领导我们与天父同在，是我们民族忠于上帝的证明和我们要向子孙后代传播的价值。"
 WDR_church:0 "接触教会"
 WDR_security:0 "教育世俗化"
 WDR_security_desc:0 "二战前发展的教育产业已经日渐不能满足我国经济和社会对产业人才的需求，我们必须用行政手段加紧在全国范围内普及公立的、国际化的科教体系。"
 WDR_strike_union:0 "打击工会"
 WDR_strike_union_desc:0 "受共产主义影响的工会分子鼓吹盲目的高薪、低工时和各种乱七八糟的福利制度，反对我们实行的各项经济刺激，拖累经济转型政策的推动，如果他们不愿意为国家的经济发展做出一些经济上的牺牲，那就让他们做出肉体上的牺牲。"
 WDR_rightwing:0 "支持右翼团体"
 WDR_market:0 "扩大市场经济"
 WDR_market_desc:0 "既然市场能够比行政机构更好地运营经济，那我们就应该将经济完全交给市场和市场参与者自由运营，一个完全没有行政干涉的经济体制无疑是最健康，最完美的。"
 WDR_cut_welfare:0 "削减福利"
 WDR_cut_welfare_desc:0 "退休金和失业补贴把我们国家的年轻人变成一群懒鬼，许多人宁愿躺在家里拿救济金也不愿意出门找工作，严重拖累了正常的社会生产，必须把失业补助等各种无意义的救助金停掉。"
 WDR_privetave:0 "企业私有化"
 WDR_privetave_desc:0 "我国国有企业在经济体制改革之后开始失去活力，无法应对日益激烈的市场竞争。为了使国企能够应对市场经济带来的冲击，我们将实行国企改革，使企业自主，自负盈亏。"
 WDR_neo_liberal:0 "新自由主义"
 WDR_neo_liberal_desc:0 "新自由主义者主张减少政府的行政干预，让市场自由运行从而刺激经济增长。政府的腐败、政治混乱和官僚主义使得他们无法有效管理经济，因此让市场无形的大手来促进经济系统自我调节才是最好的办法。政府干预越少，经济运行越好。"
 WDR_nationalized:0 "企业国有化"
 WDR_nationalized_desc:0 "私有企业总是为自己的利益服务，并在无序的自由市场中疯狂膨胀，挤压中小企业，甚至被外国资本收买。我们应该将大企业国有化，将他们和他们的产业纳入政府的控制之下，从而确保企业本身和他们的产业能够服从政府指令，为我们的经济政策服务。"
 WDR_medic:0 "发展医疗设施"
 WDR_medic_desc:0 "公共医疗产业的发展是影响一国人口结构和劳工质量的重要因素。如何能维护国民健康，也自古以来是一个政权成功与否的重要指标。"
 WDR_anti_colonies:0 "支持反殖民运动"
 WDR_anti_colonies_desc:0 "亚非拉人民反对殖民者，争取民族独立，我们应该支持他们。"
 WDR_allow_communism:0 "共产党合法化"
 WDR_allow_labour:0 "允许工会"
 WDR_allow_labour_desc:0 "工业化带来了工人群体的扩大，工人正成为一支强大的政治力量，要求更高的薪资、完善的福利制度和八小时工作制。与其让失望的工人投向共产党，不如主动满足其需求以争取工人的选票。"
 WDR_left_way:0 "尝试左派路线"
 WDR_anti_communis:0 "反共产主义"
 WDR_anti_communis_desc:0 "俄国人霸占我们的东部领土，还对整个德意志虎视眈眈，共产主义革命正在危害我们的社会秩序和国家利益，向大家宣布我们国家绝不容忍红色分子。"
 WDR_volkswagen_auto:0 "重建大众汽车产业"
 WDR_volkswagen_auto_desc:0 "第三帝国时期，我国的汽车产业就已经非常发达。我们需要重建汽车工业，不仅是为了满足消费需求，也是为了让国家更快实现汽车国产、加速经济和工业发展。"
 WDR_bavaria_auto:0 "巴伐利亚汽车工业"
 WDR_bavaria_auto_desc:0 "巴伐利亚是我国最大的汽车产业中心，宝马、大众、奔驰和梅赛德斯的工厂都在这里。我国的汽车产业正逐步发展，为我们带来了许多利润，接下来我们需要进一步扩大汽车的技术和质量优势，保证市场地位，扩大技术投入和产品出口，使其成为我们的支柱产业之一。"
 WDR_mass_melmel:0 "从马斯河到默默尔"
 WDR_kaiserreich:0 "凯撒治下的和平"
 WDR_TNO:0 "欧洲新秩序"
 WDR_euro_relation:0 "改善欧洲国家关系"
 WDR_manufacture_3:0 "发展制造业 III"
 WDR_manufacture_3_desc:0 "在具备较为完善的工业能力后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 WDR_manufacture_2:0 "发展制造业 II"
 WDR_manufacture_2_desc:0 "在恢复了基本消费品的供应之后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 WDR_manufacture_1:0 "发展制造业 I"
 WDR_manufacture_1_desc:0 "世界大战已经严重损害了我国的基础工业，尤其是消费品制造。我们必须迅速恢复经济生产，以满足人民对消费品的需求。"
 WDR_economic:0 "重振经济"
 WDR_constitution:0 "联邦宪法"
 WDR_Hallstein:0 "哈尔斯坦主义"
 WDR_Hallstein_desc:0 "哈尔斯坦主义由西德外长沃斯特·哈尔斯特提出，主张联邦德国政府代表整个德国，不承认民主德国的合法性，也不与同民主德国建交的东方阵营成员建立外交关系。"
 WDR_Neo_Ost:0 "新东方"
 WDR_Neo_Ost_desc:0 "新东方政策最早由德国经济部长埃贡·哈尔提出，主张建立与东德、苏联等东方阵营成员国的关系正常化。"
 WDR_currency_reform:0 "货币与税收改革"
 WDR_Soziale_Marktwirtschaft:0 "社会市场经济"
 WDR_Soziale_Marktwirtschaft_desc:0 "社会市场经济是战后德国弗莱堡经济学派提出的经济政策，该学派主张，为德国战后的经济复兴和莱茵河奇迹奠定了基础。"
 WDR_Export-oriented_economy:0 "出口导向经济"
 WDR_Industry:0 "重振工业"
 WDR_Rhineland_Industry:0 "重振莱茵兰工业区"
 WDR_ECSC:0 "欧洲煤钢共同体"
 WDR_constitution:0 "基本法"
 WDR_constitution_desc:0 "德意志帝国已不复存在，新的德意志联邦共和国需要新的宪法，以确认我们的民主政治体制。"
 WDR_Bundes_polizeit:0 "联邦警察"
 WDR_Bundeswehr:0 "联邦国防军"
 WDR_Bundeswehr_desc:0 "尽管雅尔塔协定规定了德国在战败后不得在拥有武装，但在共产主义威胁之下，为了保护德国西部，一支新的德国国防军的建立终将成为必然。"
 WDR_Bundeswehr_trigger_tool:0 "获得至少8个国家对重建军备的支持"
 Bundeswehr_flag:0 "德国再武装化"
 WDR_Luftwaffe:0 "国防军空军"
 WDR_Luftwaffe_desc:0 "随着喷气式飞机的诞生，世界各国的空军都在飞速发展，我们也必须尽快跟上时代。"
 WDR_Military_company:0 "重振军工企业"
 WDR_border_defence:0 "强化边境防御"
 WDR_Euro_common_defence:0 "欧洲共同防御条约"
 WDR_diplomatic:0 "外交事务"
 WDR_diplomatic_desc:0 "联邦德国的外交任务十分紧迫，我们必须和东德争夺国际社会的认可和支持。"
 WDR_FRA_relation:0 "爱丽舍条约"
 WDR_FRA_relation_desc:0 "随着法国逐渐远离北约和西德对修复欧洲各国关系的追求，法国和德国两个宿敌最终走到了一起。《爱丽舍条约》的签订标志着法德和解的实现。"
 WDR_EURO:0 "欧洲共同体"
 WDR_EURO_desc:0 "欧洲一体化不应僵化，而应尽可能灵活。它不应成为欧洲各国人民的束缚，而应成为他们共同的支柱，成为他们各自健康、个性化发展的共同支撑。\n——康拉德·阿登纳"
 WDR_Atlanticism:0 "大西洋主义"
 WDR_Atlanticism_desc:0 "大西洋主义是指西欧国家亲近美国及北约集团的外交政策，而与之对应的则是亲欧洲主义。"
 WDR_USA_aid:0 "美国援助"
 WDR_USA_aid_desc:0 "我认为马歇尔计划的重要意义在于，这可能是历史上第一次，一个战胜国向战败国伸出了援助之手，帮助战败国再次崛起。\n——康拉德·阿登纳"
 WDR_BDF:0 "宪法保卫局"
 WDR_Ost_radio:0 "黑色电台"
 WDR_Ost_radio_desc:0 "通过秘密电台，我们可以向东部的群众传播来自自由世界的信息，鼓励他们抵抗和投奔自由。"
 WDR_leader_summit:0 "领导人会面"
 WDR_leader_summit_desc:0 "东西德的关系趋近缓和，我们认为可以选择机会，安排双方领袖会面，洽谈和平。"
 WDR_berlin_treaty:0 "柏林四国条约"
 WDR_border9:0 "第九边防大队"
 WDR_border9_desc:0 "随着国际恐怖主义的活动越加频繁，我们需要一支专业而强悍的特种部队，解决人质挟持等恐怖活动。"
 WDR_law_130:0 "刑法第86条"
 WDR_law_130_desc:0 "德国刑法第86条第一款规定了“禁止使用含有违宪内容的标志”，虽未指明是哪种标志，但往往被认为是共产主义或新纳粹主义。在刑法86条的支持下，西德政府先后取缔了德国共产党和新纳粹主义的德国社会帝国党。"
 WDR_nuclear:0 "发展核能源"
 WDR_nuclear_desc:0 "核能源是本世纪最伟大的发明之一，其维护成本低，发电效率高。在鲁尔区的煤炭枯竭之后，核能将成为德国重要的能源来源。"
 WDR_welfare_state:0 "福利国家"
 WDR_welfare_state_desc:0 "福利国家正成为战后西欧多国的共识，利用凯恩斯主义经济学说，提供福利保障，以刺激消费，促进社会平等，拉拢劳工阶层。"
 WDR_economic:0 "重振经济"
 WDR_break_effect:0 "摆脱战败国影响"
 WDR_remove_allie:0 "排斥英美影响力"
 WDR_nationalist:0 "民族主义崛起"
 WDR_nationalist_desc:0 "英美等国虽然在军事上击败了我们，但德意志民族的精神不会屈服！"
 WDR_Afd:0 "德国的选择"
 WDR_NeoNazis:0 "国家社会主义的回归"
 WDR_NeoNazis_desc:0 "伟大的德意志民族和伟大的德意志帝国回来了！Sieg Heil!"
 WDR_Reich:0 "霍亨索伦的回归"
 WDR_kaiser:0 "凯撒万岁"
 WDR_Reich_parliament:0 "帝国宪法"
 WDR_HIGHT_tech:0 "发展高新技术"
 WDR_HIGHT_tech_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一。随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。"
 WDR_electronic:0 "发展电子产业"
 WDR_electronic_desc:0 "电子产业是20世纪后半叶最重要的高新技术产业，小小的晶体管不仅可以制造出先进的电子产品，也是走向发达国家的门槛。"
 WDR_willhiem_port:0 "建设港口"
 WDR_willhiem_port_desc:0 "港口对我们发展对外贸易和海军建设十分重要。"
 WDR_naval:0 "建立海军"
 WDR_secondtimes:0 "第二次复仇"
 WDR_grand_deutsch:0 "统一德意志"
 WDR_AIR_company:0 "欧洲联合军备公司"
 WDR_anti_east:0 "对东方强硬政策"
 WDR_anti_east_desc:0 "联邦德国经过经济复苏，已获得强大的实力，而苏东共产主义日渐腐朽。向东方祈求和平是愚蠢的，我们需要向共产党摆出强硬的姿态！"
 WDR_EU:0 "欧洲联盟"
 WDR_EU_desc:0 "欧洲联盟的出现让欧洲的统一看到了曙光，只有一个统一的欧洲，才能为我们的人民带来和平与繁荣。"
 WDR_third_world:0 "亲近第三世界"
 WDR_third_world_desc:0 "随着殖民体系的瓦解，亚非许多国家独立建立了新的国家。我们必须尽快与这些国家建立良好关系。"
 WDR_CDU:0 "支持基督教民主同盟"
 WDR_SDP:0 "支持社会民主党"
 WDR_pershing:0 "部署中程弹道导弹"
 power_general_fuel:0 "火力发电消耗"