l_simp_chinese:
 
 cub.2.t:0 "古巴革命军进入哈瓦那！"
 cub.2.d:0 "今日凌晨，菲德尔·卡斯特罗领导的七二六运动革命军与其盟友革命指导委员会的部队胜利进入哈瓦那。在革命军逼近首都的最后时刻，独裁者巴蒂斯塔仓皇乘机逃离古巴，持续多年的古巴革命取得最终胜利。\n革命军先头部队在几乎没有遭遇抵抗的情况下控制了总统府、军事总部等要害部门。哈瓦那市民涌上街头，欢呼雀跃，高呼"自由"口号。美国驻古巴大使馆降下半旗，白宫表示将"密切关注局势发展"。\n卡斯特罗通过广播向全国发表讲话，宣布革命胜利，承诺将尽快组建新政府。革命军同时公布了首批将被审判的巴蒂斯塔政权高官名单。\n随着哈瓦那街头巴蒂斯塔画像被推倒，古巴历史翻开了新的一页。"
 cub.2.a:0 "自由古巴万岁！"
 cub.2.b:0 "共匪打到西半球了！"
 cub.2.c:0 "立刻与哈瓦那断绝一切关系！"
 cub.2.d:0 "尝试和这个年轻人接触……"
 
 cub.3.t:0 "古巴革命军在东南部登陆！"
 cub.3.d:0 "以菲德尔·卡斯特罗、切·格瓦拉为首的古巴革命军，乘坐邮轮“格拉玛”号在古巴东南岸登陆。尽管遭到了当地驻军的阻击，但登陆的革命军依然冲破封锁，进入了古巴南部的马埃斯特拉山地。革命军将在这里建立根据地，养精蓄锐，准备发起推翻巴蒂斯塔政府的革命。"
 cub.3.a:0 "自由古巴万岁！"
 
 cub.4.t:0 "古巴革命军进入哈瓦那！"
 cub.4.d:0 "菲德尔·卡斯特罗领导的革命军已进入哈瓦那！巴蒂斯塔已仓皇逃窜！"
 cub.4.a:0 "自由古巴万岁！"
 
 
 
 
 cub.5.t:0 "来自古巴的求助"
 cub.5.d:0 "美帝国主义对古巴发动的猪湾入侵震惊了全世界。面对美帝国主义侵略威胁，古巴领导人菲德尔·卡斯特罗请求我们的支援。我们的军事顾问认为，必须在古巴部署一定数量的弹道导弹，才能形成对美国本土的威胁，这也是为了实现美国在土耳其部署导弹的平衡。"
 cub.5.a:0 "自由古巴万岁！"
 
 cub.6.t:0 "来自苏联的支持"
 cub.6.d:0 "莫斯科同意了我们的请求，他们将秘密向我国运送弹道导弹，已形成对美国的威慑。"
 cub.6.a:0 "自由古巴万岁！"
 
 cub.10.t:0 "古巴出现苏联导弹基地！"
 cub.10.d:0 "我们派往古巴的U2侦察机发现重要情报！苏联正在向古巴秘密运送大量弹道导弹，并已经建立好了发射基地。根据我们军事部门的估计，这些导弹将覆盖美国东海岸的每一座城市！\n该情报将在联合国大会上被公布，看看俄国人对此作何反应。"
 cub.10.a:0 "自由古巴万岁！"
 
 cub.11.t:0 "美国宣布封锁古巴！"
 cub.11.d:0 "美国总统[USA.GetLeaer]宣布，美军队已决定封锁古巴，以阻止苏联继续向其运送战略导弹武器，同时全军进入二级警备状态。苏联宣称这一举动是为了阻止美国对古巴的入侵，目前两国剑拔弩张，随时存在发生全球热和战争的可能。"
 cub.11.a:0 "自由古巴万岁！"
 
 cub.12.t:0 "苏联军舰试图进入古巴"
 cub.12.d:0 "我们发现一支苏联舰队正在前往古巴东北部的港口，可能携带战略武器。我们该怎么办？"
 cub.12.a:0 "让他们过去，避免战争。"
 cub.12.b:0 "拦住他们。"
 
 cub.13.t:0 "我们的舰队遭到美军拦截"
 cub.13.d:0 "我们派往古巴的舰队遭到美军拦截，对方已经开启了武器。我们怎么办？"
 cub.13.a:0 "调回舰队，避免战争。"
 cub.13.b:0 "冲过去。"
 
 cub.14.t:0 "核战危机结束！"
 cub.14.d:0 "经过紧张的对峙，苏联最终选择从古巴撤回自己的舰队。核战危机结束了。"
 
 cub.15.t:0 "古巴出现苏联导弹基地！"
 cub.15.d:0 "美国派往古巴的U2侦察机发现重要情报！苏联正在向古巴秘密运送大量弹道导弹，并已经建立好了发射基地。\n该情报在联合国大会上被公布，美国代表阿德莱·史蒂文森强烈谴责了苏联对西半球稳定带来的威胁。\n“佐林大使，你是否不承认苏联已经且还在古巴部署中、远程导弹和导弹基地？是还是不是？-不要等待翻译-是还是不是？”"
 cub.15.a:0 "自由古巴万岁！"
 
 
 
 
 
 cub.20.t:0 "古巴发生军事政变！"
 cub.20.d:0 "在古巴大选即将举行之际，由于感觉自己无法胜出，古巴军事首脑富尔亨西奥·巴蒂斯塔发动军事政变，组织支持自己的军队进入首都哈瓦那，宣布解散议会，暂停宪法，并由巴蒂斯塔代理总统职务。"
 
 cub.21.t:0 "美国承认新成立的巴蒂斯塔政权！"
 cub.21.d:0 "美国承认巴蒂斯塔政变后建立的古巴政府，称赞其为“拯救自由与民主”的英雄，并与其建立外交关系。"
 
 cub.22.t:0 "美国不承认新成立的巴蒂斯塔政权！"
 cub.22.d:0 "美国承认巴蒂斯塔政变后建立的古巴政府，斥责其破坏了古巴的民主制度，危害了美国在加勒比海的利益，并要求其立刻辞职。"
 
 cub.23.t:0 "古巴蒙卡达兵营发生暴动！"
 cub.23.d:0 "来自古巴的消息。136名反政府分子在今日突然袭击了古巴圣地亚哥市的蒙卡达兵营，在激烈交火后，政府军成功击溃了反政府分子，61名叛军被击毙，包括头目菲德尔·卡斯特罗在内的56人被俘。古巴政府发表声明，认为这些武装分子受到了共产主义的影响，斥责苏联将共产主义威胁扩散到美洲。"
 
 cub.24.t:0 "菲德尔·卡斯特罗被捕入狱！"
 cub.24.d:0 "古巴政府对蒙卡达兵营事件的反政府武装头目菲德尔·卡斯特罗进行审判，卡斯特罗在法庭上回答：\n至于我自己，我知道我在狱中将同任何人一样备受折磨，狱中的生活充满着卑怯的威胁和残暴的拷打，但是我不怕，就像我不怕夺去了我70个兄弟的生命的可鄙的暴君的狂怒一样。判决我吧！没有关系。历史将宣判我无罪！"
 
 cub.25.t:0 "告别松树岛"
 cub.25.d:0 "一艘渔船静静停泊在松树岛监狱外的礁石旁。刚刚通过贿赂看守获得自由的年轻革命者站在船头，最后一次回望这片囚禁他22个月的土地。监狱塔楼的探照灯扫过海面，照亮了他手中紧攥的一把古巴泥土——那是他在放风时偷偷收集的，此刻正从指缝间簌簌落入加勒比海。\n渔夫催促开船的吆喝惊飞了岸边白鹭。他脱下囚服扔进海浪，露出贴身藏着的红黑两色袖章。远处哈瓦那的灯火在雨云中明灭，就像他未曾熄灭的革命理想。当小船驶向墨西哥方向时，雷声从马埃斯特腊山方向传来，仿佛命运的预告。\n\n本报记者获悉，数年前组织叛军攻打蒙卡达兵营的古巴革命军头目菲德尔·卡斯特罗，从松树岛监狱逃离，古巴政府拒绝向记者透露更多细节。"
 
 cub.30.t:0 "卢西亚诺潜入古巴！"
 
 cub.31.t:0 "来自美国政府的警告！"
 
 cub.32.t:0 "卢西亚诺被古巴驱逐出境！"
 
 cub.33.t:0 "卢西亚诺留在古巴"
 
 cub.34.t:0 "赌场一夜"
 
 cub.35.t:0 "来自赌场的回馈"
 cub.35.d:0 "尊敬的总统阁下：\n感谢这段时间您对我们的酒店生意给予谅解和支持，我们的……娱乐行业，在哈瓦那获得了不少利润。这是小小意思，不成敬意。\n我们诚挚邀请您抽空来大酒店二楼玩上几局，小赌怡情，调整身心。当然，我们自己是不会玩的，哈哈。"
 cub.35.a:0 "知道了。"
 
 cub.36.t:0 "来自赌场的回馈"
 cub.36.d:0 "尊敬的总统阁下：\n最近归国的局势不怎么太平，游客都在担心叛军的活动，我们的……娱乐行业，在哈瓦那的营业额有所减少，这次孝敬您的礼金就只有这些了。\n我们诚挚建议您在镇压动乱的问题上多花些心思，这就像在赌桌上，没有投入是很难有回报的。"
 cub.36.a:0 "知道了。"
 
 cub.37.t:0 "赌场的警告"
 cub.37.d:0 "总统阁下：\n最近我们酒店二楼的游戏大厅几乎成为了空城。叛乱分子把游客都吓跑了，我们几乎很难获得收入，而我们的发牌员和服务员还在等我们发工资。\n如果您不能尽快处理贵国的治安问题，那么我们的酒店就不得不结业，以后你可就很难找到我们这么能赚钱的合作伙伴了。"
 
 cub.38.t:0 "赌场的凋敝"
 cub.38.d:0 "古巴著名的塞维利亚大酒店今日宣布结业，其名下的赌场等一系列服务也走向终结。这已不是古巴第一家破产的赌场酒店。曾经热闹非凡的赌场只剩下了灰尘、垃圾和蜘蛛网，赌桌上的木头遍布裂痕，筹码和扑克牌散落一地。\n古巴，这个曾经的加勒比天堂，在革命和叛乱的威胁下走向凋敝，再也没有游客愿意冒着卷入军事冲突的危险来到这里。"
 
 cub.39.t:0 "美国政府的警告"
 cub.39.d:0 "总统阁下：\n我谨代表美国联邦调查局致信。我国的情报机构早已对贵国纵容美国黑手党开办赌场一事了如指掌，只不过以前此事不直接影响我国的利益，我们才睁一只眼。不过，随着越来越多媒体关注贵国的赌场问题，我国政府面临舆论的指责，美国媒体和群众中的清教徒要求我国政府出手制止你们国家泛滥的赌博和走私犯罪，如果你们继续纵容赌场活动，美国政府将考虑减少或停止对贵国的援助。"
 
 
 cub.40.t:0 "古巴革命军接受采访"
 cub.40.d:0 "古巴马埃斯特腊山的晨雾中，美国记者马修斯在革命军士兵带领下，穿过山脉和丛林，抵达了七·二六运动的营地。一个穿着褪色橄榄绿军装的身影从游击营地走出。美国记者揉了揉眼睛——眼前这个正在卷烟草的男人，正是政府军宣称已击毙的传奇革命者。\n"他们连我的尸体照片都伪造了，"他指着政府发布的所谓"遗照"轻笑，弹落的烟灰在晨光中像极了山下的炮火闪光。\n尽管卡斯特罗不太同意，但格瓦拉还是带着马修斯介绍了自己的队伍。士兵们大多瘦弱，他们只能以烤香蕉充饥，但他们的眼里有光，似乎并不会因此屈服。\n马修斯先生，请你告诉所有美国人，我们的事业是正义的，每一个追求自由的美国人都一定能理解我们。我们不会被消灭，每株被烧焦的甘蔗，都会在明年春天长出更多新芽。"
 
 
 cub.41.t:0 "古巴总统府遭到袭击！"
 cub.41.d:0 "来自哈瓦那的突发消息！！\n多名武装分子乘坐卡车，行驶到位于哈瓦那总统府门口处下车，向古巴总统府发起突然袭击！总统府与装备有轻机枪和手榴弹的武装分子发生激烈交火，此外哈瓦那的广播电台、塞维利亚大酒店也这遭到了袭击！\n目前武装分子仍在和军方交火，巴蒂斯塔总统下落不明！"
 
 cub.42.t:0 "巴蒂斯塔被杀！"
 
 cub.43.t:0 "叛军撤离总统府！"
 cub.43.d:0 "袭击哈瓦那总统府的武装分子一度突破军方的防线，冲入总统府的三楼，但巴蒂斯塔总统及时撤离，因而生还。\n找不到总统的武装分子被迫撤离总统府，大约有26名袭击者被杀。"
 
 cub.44.t:0 "古巴武装分子领袖被击毙！"
 cub.44.d:0 "在武装分子袭击总统府的同时，哈瓦那广播电台也遭到了武装分子的袭击，袭击者短暂地占领了广播站，并发出了呼吁：\n古巴人民们！独裁者富尔亨西奥·巴蒂斯塔躲在总统府里，等待着人们清算他的罪行……同胞们！听我说！我们这次行动将让独裁者暴露出他的软弱无能，胜利就在眼前……\n\n短暂的广播结束后，政府军夺回了电台并击毙了署名袭击者，其中包括著名的José Antonio Echeverría——这名年仅24岁的哈瓦那大学建筑系学生会长是一名激进的社会活动家，同时也揭露了袭击者的身份，以民主派学生为核心的革命指导委员会。"
 
 cub.45.t:0 "古巴警察进行报复性袭击"
 cub.45.d:0 "在总统府袭击事件结束后，古巴军方开始对逃亡的袭击者进行全面搜查，整个哈瓦那进入戒严状态，军警四处扫荡。\n古巴保安局局长Esteban Ventura Novo宣布，四名袭击者潜藏在哈瓦那的洪堡七号公寓楼内，已被军方击毙。这栋楼的住户也将被全部逮捕以进行严密的调查。"
 
 cub.46.t:0 "厄尔·爱德华·史密斯就任美国驻古巴大使"
 cub.46.d:0 "新任美国驻古巴大使，厄尔·爱德华·史密斯，今日正式宣誓就职，并在首次记者会上明确表态支持现政府。这位外交官强调，美国将继续为古巴政府提供"一切必要支持"，以维持"法律与秩序"。\n在哈瓦那大使馆举行的招待会上，厄尔·史密斯将古巴当前局势描述为"国际共产主义渗透造成的动乱"，声称起义军背后有"俄国势力操控"。他宣布美方将增加军事顾问派遣，并加速交付此前承诺的坦克、战机等装备。"
 
 cub.47.t:0 "Frank País被杀"
 cub.47.d:0 "来自哈瓦那的消息。古巴反政府武装七·二六运动的领袖之一Frank País在圣地亚哥被军方发现，在追捕中，Frank País被击毙。"
 
 cub.48.t:0 "古巴海军发起叛乱！"
 cub.48.d:0 "古巴海军驻扎在西恩富戈斯的海军军人发起暴动！暴动由同情七·二六的军官领导，他们夺取了军火库的武器，占领了西恩富戈斯的军港，并与政府军对峙！"
 
 cub.49.t:0 "古巴海军暴动被镇压"
 
 cub.50.t:0 "三·一三革命指导委员会崛起"
 cub.50.d:0 "在卡斯特罗领导下的七·二六运动隐居于埃斯特马拉山区中进行游击战的同时，一支新的革命力量，崛起于古巴的城市之间。革命指导委员会由反对巴蒂斯塔军政府知识分子、学生和民主派人士组成，他们因策划了对古巴总统府的袭击而名声大噪，成为又一支不可小觑的反政府革命武装。\n在José Antonio Echeverrí攻打广播电台阵亡后，Faure Chomón成为革命指导委员会的新任指挥官，此外，来自美国的冒险家William Alexander Morgan因为同情古巴，而选择加入这个组织。"
 
 cub.51.t:0 "古巴革命电台"
 cub.51.d:0 "Atencion!这里是七·二六运动，古巴革命广播电台！\n我们像全世界通报，我们依然在古巴的山区和丛林深处，坚持抵抗。巴蒂斯塔独裁政府向我们发起了多次清剿，但都无法消灭我们。暴君越是进攻，越是暴露出他们的虚弱，现在，在古巴全国，反抗此起彼伏，反对独裁的革命运动已经遍布整个岛屿。我们的支持者无处不在，我们的盟友，三·一三革命指导委员会的同志们，在城市发起暴动，与我们配合作战。\n巴蒂斯塔的机枪和坦克无法压住人民的怒火，他们的美国主人已将他无情抛弃。胜利属于古巴，胜利属于人民，胜利属于自由！\n请全世界的人民支持古巴人民！Adios!Y Vive Cuba Libre!"
 
 cub.52.t:0 "古巴大奖赛在哈瓦那开办"
 cub.52.d:0 "在古巴革命风起云涌，反政府活动日益活跃的背景下，古巴政府依然举办了古巴一级方程式赛车大奖赛，希望借助比赛，向全世界展示，古巴的政治局势依然稳定，社会依然和谐，旅客在古巴依然安全……\n尽管大部分游客和赛车手保有顾虑，但还是有许多赛车手前往哈瓦那参加比赛，古巴政府在比赛场地周围部署重兵，以维持现场秩序和安全。"
 
 cub.53.t:0 "阿根廷车手方吉奥被绑架"
 cub.53.d:0 "来自哈瓦那的突发消息！\n古巴反政府组织“七二六”运动的两名枪手闯入哈瓦那林肯酒店，并绑架了前来参加古巴大奖赛的阿根廷赛车手胡安·曼努埃尔·方吉奥！\n巴蒂斯塔下令比赛照常进行，同时一支精锐警队追捕绑匪。他们在十字路口设置了路障，并为私人和商业机场以及所有参赛车手派出了警卫。"
 
 cub.54.t:0 "与绑匪的紧张对峙"
 
 cub.55.t:0 "方吉奥获救！"
 
 cub.56.t:0 "方吉奥被流弹击中！"
 
 cub.57.t:0 "方吉奥被绑匪释放"
 cub.57.d:0 "在经历了数日的关押后，胡安·方吉奥被七·二六运动的绑匪释放，方吉奥没有大碍，已送往哈瓦那医院接受治疗，两名绑匪撤离并消失。\n尽管古巴当局宣称，是政府施加的强大压力，迫使革命分子被迫释放人质，但实际上，古巴军警在长达两天的绑架案中，竟拿两个绑匪毫无办法，明眼人都看的出，绑匪是为了故意羞辱政府而释放的人质，且直到绑架结束，政府都未能搞清楚绑匪往哪里跑了，简直纯纯的飞舞，而在全美洲的记者云集哈瓦那大奖赛的背景下，当局的脸面更是从巴芬湾丢到了麦哲伦海峡。\n\n好吧，这又是一次冒险。如果叛军的所作所为是为了正义，那么作为一名阿根廷人，我接受。\n方吉奥如此告诉记者。"
 
 
 
 cub.58.t:0 "古巴革命武装发起全面进攻！"
 
 cub.59.t:0 "古巴叛军攻克圣克拉拉！"
 
 
 
 
 cub.61.t:0 "叛军在乌韦罗登陆"
 cub.61.d:0 "总统阁下：\n我们收到请报，一支大约一百五十多人的叛军小队，乘坐游艇在北方的乌违罗一带登陆，这只叛军可能由前总统卡洛斯·普里奥·索卡拉斯和他的所谓正统党支持，并与共产主义的七·二六勾结。"
 
 cub.62.t:0 "卡洛斯·索卡拉斯接受记者采访"
 cub.62.d:0 "古巴前总统卡洛斯·普里奥·索卡拉斯在佛罗里达接受了本报记者采访，他宣布，他将为反对巴蒂斯塔的革命军提供支持，以报复现总统对他这位前总统的迫害。\n\n是的，亲爱的记者小姐，我可以明确告诉你，我和古巴正统党的所有成员，都愿意为一切能够推翻独裁者富尔亨吉奥·巴蒂斯塔的个人或团体提供支持，不管他们是要资金还是要武器……我已经委托我在委内瑞拉的代理人，草拟了一张支票，这笔钱足以让至少三百名自由战士武装到牙齿，这笔援助最快一个月内能够送到三·一三革命委员会或七·二六运动手中。\n那个叫菲德尔的家伙，好吧，他曾经是我的反对者，他曾经直言不讳地抨击我的政府，令我感到难堪，但我无所谓。告诉他，我要巴蒂斯塔的军装纽扣作纪念。"
 
 cub.63.t:0 "来自古巴革命军的信件"
 cub.63.d:0 "致尊敬的阁下：\n\n我们怀着对自由事业的共同信念致函贵国。古巴人民正遭受独裁政权的残酷压迫，为推翻暴政、恢复民主，我们急需武装支援。现恳请贵国考虑以下援助：\n提供200支自动步枪及5万发弹药、支援轻机枪及维修工具、援助无线通讯设备与医疗物资。\n这批装备将用于解放被奴役的古巴人民。我们承诺所有武器仅用于正义事业。作为回报，新政府将优先考虑贵国在古巴的合法权益。\n当前独裁政权已摇摇欲坠，国际支持将加速正义胜利。请通过加密频道回复至墨西哥城联络站。自由古巴的未来，期待与贵国共同书写。\n\n此致 敬礼"
 
 
 
 cub.70.t:0 "小说《老人与海》的问世"
 cub.70.d:0 "哈瓦那郊外的瞭望山庄，打字机的声响持续了整整八个星期。老渔夫圣地亚哥的故事从斑驳的墙缝里渗出来，混着海风与朗姆酒的气息，最终化作《老人与海》的手稿。当出版社的电报传来时，作家正坐在科希马尔的小酒馆里，看着渔民们修补被鲨鱼咬破的渔网。\n记者们涌向这个加勒比海港时，作家指着酒馆墙上的旧照片——1950年那个暴风雨夜，老格雷戈里奥的渔船拖着巨大的马林鱼骨归航。酒保说那夜作家买了整条街的朗姆酒。"
 
 cub.71.t:0 "独裁的终结"
 cub.71.d:0 "哈瓦那郊外一座废弃的甘蔗庄园里，垂头丧气的巴蒂斯塔与革命军指挥官在煤油灯下相对而坐。窗外，起义军的炮火已逼近首都，而庄园的密室内，钢笔在退位文件上划出的沙沙声，比窗外的枪炮更为刺耳。\n代表独裁者签字的军官手指颤抖，文件上"立即解散政府"的字样被反复描摹。\n我们的卡斯特罗指挥官是讲信用的，只要你离开哈瓦那，你和你家人的性命，我们没有兴趣硬取。革命军代表推过一张机票。次日清晨的航班，目的地迈阿密。当钢笔最终落下时，庄园地下酒窖里传来玻璃碎裂的声响，那是警卫在销毁档案。"
 cub.71.a:0 "再见，哈瓦那……"
 
 
 cub.72.t:0 "铲车推倒贫民窟"
 
 cub.73.t:0 "住房改造工程"
 
 cub.74.t:0 "来自毒品贩卖组织的不满"
 
 cub.75.t:0 "来自毒品贩卖组织的回馈"
 
 cub.76.t:0 "来自旅游业的回馈"
 cub.76.d:0 "尊敬的总统阁下：\n感谢这段时间您对旅游业发展给予谅解和支持，我们公司旗下的酒店、旅馆、海滩和酒吧都获得了不错的利润。这是小小意思，不成敬意。\n我们诚挚邀请您抽空来海边放松一下，欣赏一下沙滩、朗姆酒和美女。"
 
 cub.77.t:0 "来自旅游业的不满"
 cub.77.d:0 "尊敬的总统阁下：\n最近归国的局势不怎么太平，游客都在担心叛军的活动，我们几乎很难获得收入。\n如果您不能尽快处理贵国的治安问题，那么我们的酒店就不得不结业。"
 
 cub.78.t:0 "旅游业的凋敝"
 cub.78.d:0 "古巴著名的塞维利亚大酒店今日宣布结业，其名下的海滩、酒吧等一系列服务也走向终结。这已不是古巴第一家破产的酒店。哈瓦那酒店、圣地亚哥大酒店等著名的游客下榻处早已关门大吉，曾经热闹非凡的酒店大堂只剩下了灰尘、垃圾和蜘蛛网，美女与朗姆酒齐聚的泳池里只剩下了堆积的杂物。\n古巴，这个曾经的加勒比天堂，在革命和叛乱的威胁下走向凋敝，再也没有游客愿意冒着卷入军事冲突的危险来到这里。"
 
 cub.79.t:0 "黑帮的信息"
 cub.79.d:0 "总统阁下：\n\n我们帮派的弟兄最近在城里发现了叛军活动的迹象，现在将这一情况汇报给贵国的情报部门。\n不用谢，古巴的政治局势，关系到我们在哈瓦那的赌场投资，我们不会置身事外。"
 
 cub.80.t:0 "红色与黑色的火并"
 
 cub.81.t:0 "朗姆酒业的回馈"
 cub.81.d:0 "尊敬的总统阁下：\n这段时间，我国的旅游业发展的很不错，许多外国客人慕名来到哈瓦那、圣克拉拉和卡马圭的海滩和酒店度假，得益于此，古巴的朗姆酒需求也不断增加，我们酿酒业得以获利不少。这是我们感谢总统先生出色治理的礼金，请您笑纳。"
 
 cub.82.t:0 "雪茄业的回馈"
 cub.82.d:0 "尊敬的总统阁下：\n这段时间，我国的旅游业发展的很不错，许多外国客人慕名来到哈瓦那、圣克拉拉和卡马圭的海滩和酒店度假，得益于此，古巴的雪茄需求也不断增加，我们卷烟业得以获利不少。这是我们感谢总统先生出色治理的礼金，请您笑纳。"
 
 cub.83.t:0 "美国糖业的回馈"
 cub.83.d:0 "尊敬的总统阁下：\n我们在古巴数十年的糖业投资，在您治理下有所收获。我们在古巴的甘蔗园、制糖厂和朗姆酒厂的生意收获颇丰，当然，这离不开总统阁下为我们提供了一个……廉价劳动力的环境。这是我们感谢总统先生出色治理的礼金，请您笑纳。"
 
 cub.84.t:0 "糖业巨头的不满"
 cub.84.d:0 "总统阁下：\n我们发现您最近推行的政策让我们无法接受，您似乎想要改善糖厂工人的待遇，想要提高他们的薪水、控制他们的工作时间，甚至允许工会。我想告诉你，这完全是多此一举，且浪费时间。如果我是你，比起所谓的工人权益，我更关心自己的钱包。如果你继续推动这些牺牲糖业利益喂饱底层的政策，美国糖业将考虑停止在古巴的投资，到时候可就没有人来孝敬你的钱包了。"
 
 cub.85.t:0 "美国的外交警告"
 
 cub.86.t:0 "古巴的贫民窟登上头条"
 
 cub.87.t:0 "古巴——住宅建设的典范"
 
 cub.90.t:0 "叛军投诚"
 cub.90.d:0 "阁下：\n我们在圣地亚哥城郊遭遇了一支前来投降的叛军，他们大概有二十多个人，举着白旗走向我们的武装部队。我军解除了他们的武装，没收了他们的汤姆逊冲锋枪、加兰德和FAL步枪，现在他们关押在圣地亚哥城外的战俘营。\n这些叛军无法忍受叛乱分子在山区内苦难的生活，纵使菲德尔·卡斯特罗给他们画再大的饼，一眼望不到头的革命之路让他们丧失信心。他们希望总统阁下开恩，让他们回到故乡，过清净的生活。"
 
 cub.91.t:0 "叛军内讧"
 cub.91.d:0 "阁下：\n我们在卡马圭附近抓获了一批叛军的俘虏，经过审讯，我们获得一个重要情报：\n三一三革命委员会，与七二六运动之间的所谓同盟，并不牢固。三一三委员会以偏向自由派的城市学生为主力，而且七二六运动则以偏向共产主义的中下层阶级占多，双方在意识形态问题是存在严重的矛盾，因此二者之间的军事配合出现分裂。\n此外，七二六运动内部也不团结，菲德尔·卡斯特罗曾游历哥伦比亚和委内瑞拉，他希望更认同委内瑞拉的革命军事政府，而他的两个同伙——劳尔·卡斯特罗和埃内斯托·格瓦拉则倾向建立俄国式的共产党统治。"
 
 
 cub.99.t:0 "尊敬的阁下……"
 cub.99.d:0 "我们仅代表美国运营下的哈瓦那大酒店，向您致敬，祝贺您的伟大胜利……啊，我们注意到您的部队，在经过我们的赌场时，秋毫无犯，也许您确实意识到，博彩行业是一个可以带来巨大利润的摇钱树，而资金正是您接下来进行一系列改革所需要的……\n我们公司一直都乐意与古巴政府合作，至于是谁掌管古巴，我们不在乎。\n这笔美金，您先收下，这只是孝敬您的第一批礼物……"
 cub.99.a:0 "放你妈的屁！给老子滚！"
 cub.99.b:0 "哎呀，这钞票怎么自己飞到我手上了？"
 
 cub.100.t:0 "古巴新政府驱逐赌场！"
 cub.100.d:0 "古巴新政府领袖[CUB.GetLeaer]颁发了新命令，要求所有在古巴经营的赌场全部关闭，所有赌场经营者驱逐出境！\n古巴革命军迅速占领了哈瓦那的各大赌场和酒店，逮捕了其管理人员。"
 
 cub.101.t:0 "古巴新政府驱逐美国黑帮！"
 cub.101.d:0 "古巴新政府领袖[CUB.GetLeaer]颁发了新命令，所有在古巴进行犯罪活动的团体，尤其是美国黑帮将被强制驱逐出境！！\n美国黑帮进行了激烈的抵抗，但在革命军的绝对活力镇压下，大部分美国黑帮分子不是被迫逃亡就是被俘了。"
 
 cub.102.t:0 "酒店的国有化问题"
 cub.102.d:0 "酒店的美国股东提出，可以向我们出售股份以让出酒店所有权。和平地收购酒店可以避免在国际上引起争议，但如果强行没收酒店，可能会影响美国政府对古巴新政府的态度。"
 cub.102.a:0 "他们应该把古巴的财产无条件还给古巴！"
 cub.102.b:0 "这笔美金拿走，以后两不相欠。"
 
 cub.103.t:0 "古巴新政府强行没收外国酒店"
 cub.103.d:0 "古巴新政府领袖[CUB.GetLeaer]颁发了新命令，宣布强制没收并国有化古巴的所有外国酒店！\n古巴革命军迅速占领了哈瓦那的各大旅行酒店，并将其管理人员驱逐出境！"
 
 cub.104.t:0 "古巴新政府宣布收购外国酒店"
 cub.104.d:0 "古巴新政府领袖[CUB.GetLeaer]颁发了新命令，宣布收购并国有化古巴的所有外国酒店！\n古巴革命军与哈瓦那各大旅行酒店的管理者进行了谈判，最终出资收购了酒店的所有股份。"
 
 cub.105.t:0 "古巴开始进行国有化改革！"
 cub.105.d:0 "古巴新政府宣布，他们已经决定将古巴的所有蔗糖和咖啡种植园国有化，剔除外国资本，将经济作物收入完全收归国有。"
 
 
 
 cub.110.t:0 "菲德尔·卡斯特罗访问美国！"
 cub.110.d:0 "华盛顿樱花盛开，却迎来一位穿着橄榄绿军装的特殊客人。古巴新政权领导人的皮鞋踩在国务院红地毯上，留下几粒加勒比海特有的红土。\n菲德尔·卡斯特罗，古巴革命结束后的新政府领导人，冒险来到了这个被他称作帝国主义的国家的中心，试图进行最后一次和平的尝试。美国政府几乎在古巴革命军夺取政权之后，立刻宣布与这个新生的政府为敌。卡斯特罗不愿意向美国让步，但他告诉记者，在两国关系彻底崩溃前，依然愿意做最后的谈判。"
 
 cub.111.t:0 "菲德尔·卡斯特罗与美国政客的接触"
 cub.111.d:0 "菲德尔·卡斯特罗今天抵达了华盛顿的国会山。在参议院外交委员会，他试图解释土地改革不会损害美国利益，但议员们只关心被没收的甘蔗园。午餐会上，华尔街银行家们礼貌地品尝古巴雪茄，却对减免债务的请求充耳不闻。最戏剧性的时刻发生在林肯纪念堂——当被问及政治立场时，这位革命者突然背诵起葛底斯堡演说，让随行美国记者愕然。"
 
 cub.112.t:0 "菲德尔·卡斯特罗在联合国发表讲话"
 cub.112.d:0 "联合国大会厅，一支雪茄的烟雾缓缓升起。新上台的古巴领导人站在讲台前，橄榄绿军装在一众西装革履的外交官中格外醒目。他展开演讲稿时，纸张边缘还沾着加勒比海潮湿的盐粒。\n"一个小国也有尊严生存的权利。"声音通过同声传译器炸响在各个语种的耳机里。演讲到激昂处，他举起一份被海水泡皱的渔民请愿书，墨迹在联合国镁光灯下晕染开来，像极了古巴地图上正在扩散的油墨。\n苏联代表团席位的掌声总是最先响起，而美国外交官全程低头记录。当提到"我们宁愿站着死"时，几位非洲国家代表突然起立致敬。"
 
