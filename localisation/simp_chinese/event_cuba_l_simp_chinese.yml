 cub.127.t:0 "古巴新政府致信尊敬的[ROOT.GetName]领导人阁下"
 cub.127.d:0 "我们仅代表古巴共和国的人民民主政府致信贵国。经历了跌宕的革命战争，我国已推翻了巴蒂斯塔独裁者的专制统治，建立了新的民主政权。为了巩固新古巴，我们将开展一系列的外交活动，争取更多国家承认新古巴。\n贵国在国际舞台有很大的影响力，我们希望能够争取贵国与我国进行进一步的外交活动，建立正式的外交关系，以及经济、贸易、文化上的积极合作。"
 cub.127.a:0 "我们很高兴与古巴新政府建立关系！"
 cub.127.b:0 "此事还是谨慎为好……"
 
 cub.128.t:0 "[FROM.GetName]复信古巴"
 cub.128.d:0 "尊敬的古巴领导人：\n我们十分高兴古巴人民推翻独裁政权，建立新生的民主政权。我们十分乐意能够与古巴共和国建立新的外交关系，推动两国和平共处与经贸合作。我们将指示外交部门进一步负责相关事宜。"
 
 cub.129.t:0 "[FROM.GetName]复信古巴"
 cub.129.d:0 "尊敬的古巴领导人：\n由于古巴政治局势较为复杂，社会状况没有完全稳定，基于我国自身利益考虑，我们遗憾地认为，与古巴建立关系的事宜应当暂缓推迟。"
 
 
 
 
 cub.130.t:0 "种植园主的强烈抵抗！！"
 cub.130.d:0 "古巴各大甘蔗种植园园主和他们麾下的民兵武装发起暴动，反对古巴革命政府！"
 
 cub.131.t:0 "共产主义与自由主义者的分歧"
 cub.131.d:0 "随着革命继续推进，三一三革命委员会与七二六运动之间发生了严重分歧。三一三委员会以偏向自由派的城市学生为主力，希望建立多党制的民主政府，而且七二六运动则以偏向共产主义的中下层阶级占多，希望模仿苏联的政治制度。\n随着卡斯特罗决定接受苏联援助，自由主义者与共产主义者之间的矛盾进一步扩大。"
 
 cub.132.t:0 "自由主义者退出革命政府！"
 cub.132.d:0 "古巴革命者之间的联合政府走向破裂，许多无法接受共产主义的三一三革命委员会前成员宣布退出卡斯特罗政府。"
 
 cub.133.t:0 "警惕不断接近赤色势力的古巴"
 cub.133.d:0 "古巴遭到了共产势力的渗透，古巴现政府与共产党勾结，使得俄国人的魔爪伸向西半球，这是我们绝对不能容忍的！我们也要开始支持古巴国内的反共势力，协助他们对抗共产主义，并在必要时候协助他们夺取古巴政权，重建反共政府。"
 
 cub.134.t:0 "埃斯坎布雷山区爆发叛乱！"
 cub.134.d:0 "自由主义者与共产主义者之间的矛盾酿成全面冲突！反共的自由主义者在坎布雷山区发起暴动，反对古巴革命政府！"
 
 cub.135.t:0 "埃斯坎布雷叛乱被镇压！"
 cub.135.d:0 "埃斯坎布雷山区的自由主义者叛乱被镇压！"
 
 cub.136.t:0 "亚瑟·威廉·摩根被枪决！"
 
 
 cub.140.t:0 "古巴新政府成立！"
 cub.140.d:0 "随着巴蒂斯塔政权崩溃，许多因受到巴蒂斯塔迫害而流亡海外的古巴政治家回到哈瓦那，他们将与七二六运动、三一三革命委员会组成新的联合政府。"
 
 cub.141.t:0 "美国黑帮与古巴革命军交火！！"
 
 cub.142.t:0 "巴蒂斯塔军队残余抵抗新政府"
 cub.142.d:0 "巴蒂斯塔军队的残余分子发起武装暴动，反对古巴革命政府！"
 
 cub.143.t:0 "群众拥护革命政府！"
 cub.143.d:0 "随着新政府的改革政策不断推广，许多受益的群众组织起来，开展游行，表达他们对新政府的拥护和支持。"
 
 cub.144.t:0 "古巴革命军处死一批前政府成员"
 cub.144.d:0 "古巴革命军在未经审判的情况下，以反革命为罪行，枪决了一批前政府成员，包括巴蒂斯塔政权的官员、警察和军人。"
 
 cub.145.t:0 "古巴宣布蔗糖产业完全国有化"
 cub.145.d:0 "古巴革命政府宣布，他们已经决定将蔗糖产业完全国有化，剔除外国资本，将蔗糖收入完全收归国有。"
 
 cub.146.t:0 "古巴宣布雪茄产业完全国有化"
 cub.146.d:0 "古巴革命政府宣布，他们已经决定将雪茄产业完全国有化，剔除外国资本，将雪茄收入完全收归国有。"
 
 cub.150.t:0 "古巴革命的巩固与胜利！"
 cub.150.d:0 "哈瓦那总统府阳台，硝烟与茉莉花香奇异交织。年轻的革命领袖扶着殖民时期留下的石栏。\n古巴人民！古巴的同胞们！现在请听我说……在赢得革命战争的几个月后，在你们的支持和协助下，古巴的革命，在经济，政治和外交上也取得了伟大的胜利……\n总统府前聚集的人群，爆发出热烈的欢呼。阳台上的领袖不紧不慢地抽了口雪茄，这支雪茄上，印着全新的古巴国有企业的标志。\n我们的土地改革取得了成功，美国资本已经完全失去了他们对古巴土地的掌控和垄断，让古巴回到了古巴人的手里……这片土地上的资源，无论是你们手中的咖啡和雪茄，还是工厂里的资源，它们都将由古巴政府统一管理，让利润为古巴人服务……\n[CUB.GetLeaer]走出总统府的大门，与他的人民簇拥在一起。他抱起一个小女孩，将手中印着红与黑的的刺绣章塞到她的手中，这是多年以前，格拉玛号的船主送给他的……"
 cub.150.a:0 "Viva Cuba Libre！"
 
 
 
 cub.155.t:0 "古巴港口船只发生爆炸事件"
 cub.155.d:0 "来自哈瓦那的突发消息。一艘法国国籍的货船拉库布雷号在哈瓦那发生剧烈爆炸。\n该船于下午3点10分发生爆炸。第一次爆炸发生30分钟后，数百人正在参与由古巴军方组织的救援行动，第二次爆炸的威力更大，造成更严重的伤亡。\n根据比利时方面的消息，该船上载有将近76吨的比利时军火，包括大量的子弹、手榴弹和FAL步枪。尽管这笔军火订单由前独裁者巴蒂斯塔订购，但由于古巴新政府愿意支付剩余费用，因此比利时方面依然将军火交给了新政府。\n古巴新政府领导人之一的埃内斯托·格瓦拉赶到现场慰问了伤员。并谴责美国特工制造了袭击。"
 
 cub.156.t:0 "《英勇的游击队员》"
 cub.156.d:0 "拉库布雷号货船爆炸最终导致了一百多人死亡，菲德尔·卡斯特罗呼吁在哥伦布公墓为遇难者举行追悼会。\n上午11点，埃内斯托·格瓦拉来到追悼会现场。摄影师阿尔维托·柯尔达立刻举起手中的莱卡相机，按下快门，为这位年轻的领袖拍摄了几张照片。\n其中一张照片立刻引起了阿尔维托的注意，画面中的格瓦拉，头戴贝雷帽，穿着风衣，表情严肃而坚毅。\n格瓦拉在照片拍下不久后便离开了追悼会现场……"
 cub.156.a:0 "切，你好年轻哟……"
 
 cub.999.t:0 "卡米洛·西恩富戈斯失踪"
 
 
 cub.160.t:0 "古巴流亡者请求我们的支持"
 cub.160.d:0 "尊敬的阁下：\n菲德尔·卡斯特罗勾结苏俄共匪，夺取古巴政权，无数古巴人民流离失所，我们仅代表不愿意接受共匪统治的古巴人民向您求助。一批训练有素的流亡者已经组织起来，准备秘密反攻哈瓦那，只要你能为我们提供一笔经费，我们有信心能够打回古巴，到时候，我们将带回卡斯特罗的狗头给您做纪念品。"
 
