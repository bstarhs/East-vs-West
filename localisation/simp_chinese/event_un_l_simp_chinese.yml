l_simp_chinese:
 join_UN:0 "加入联合国"
 un.1.t:0 "[FROM.GetName]申请加入联合国"
 un.1.d:0 "今天的联合国大会将正式就[FROM.GetName]申请加入联合国一事进行投票，各国将就是否支持[FROM.GetName]获得联合国席位一事作出投票决议。"
 un.1:0 "支持"
 
 un.2.t:0 "[FROM.GetName]正式加入联合国"
 un.2.d:0 "联合国大会投票以多数票，通过了[FROM.GetName]成为联合国一员议员的一案。当议案正是通过时，大会现场响起热烈的掌声。\n[FROM.GetName]驻联合国大使携带领导人[FROM.GetLeader]签名的国书，代表[FROM.GetName]政府和人民感谢各国的支持和协助，并承诺，[FROM.GetName]将坚决支持联合国维护世界和平与稳定的努力，该国将忠实地履行自己作为国际社会一部分的责任。\n大会结束，[FROM.GetName]的国旗在联合国总部大楼外冉冉升起。"
 
 un.5.t:0 "国际影响力削弱。"
 un.5.d:0 "由于我国的国际影响力下降，我们的国际地位一落千丈，沦为受世界各国唾弃的孤立国家"
 un.5.a:0 "真倒霉。"
 
 un.6.t:0 "国际影响力提升。"
 un.6.d:0 "由于我国的国际影响力的提高，我们已不再是受世界各国唾弃的孤立国家。"
 un.6.a:0 "太棒了。"
 
 un.7.t:0 "国际影响力提升。"
 un.7.d:0 "由于我国的国际影响力的提高，我们已成为受世界各国尊重的大国。"
 un.7.a:0 "太棒了。"
 
 un.8.t:0 "国际影响力削弱。"
 un.8.d:0 "由于我国的国际影响力下降，我们已不再是受世界各国尊重的大国。"
 un.8.a:0 "真倒霉。"
 
 un.9.t:0 "来自联合国的专家支援"
 un.9.d:0 "联合国派遣的专家已经抵达我国，他们将协助改善我国的教育、医疗和建设能力。"
 un.9.a:0 "太棒了"
 
 un.10.t:0 "联合国专家已离开"
 un.10.d:0 "为期一年的联合国专家支援已经结束，联合国技术人员已离开我国。"
 un.10.a:0 "告别专家"
 
 un.11.t:0 "[ROOT.GetName]遭到制裁决议！"
 un.11.d:0 "[FROM.GetName]以我们危害发动战争危害和平为理由向我们发起制裁决议！现在决议正在等待安理会成员国投票表决。"
 un.11.a:0 "真见鬼！"
 
 un.12.t:0 "决定对[FROM.GetName]发起制裁的投票"
 un.12.d:0 "联合国以危害和平和人权为理由向[FROM.GetName]发起制裁决议！现在决议正在等待安理会成员国投票表决。投票时限为5日，请您暂停游戏时间再投票。"
 un.12.a:0 "[FROM.GetName]必须遭到惩罚。"
 un.12.b:0 "没有这个必要。"
 
 un.13.t:0 "[ROOT.GetName]遭到联合国制裁"
 un.13.d:0 "经过投票，安理会多数国家决定以危害和平和人权为理由向[ROOT.GetName]发起制裁决议！"
 un.13.a:0 "这将影响战争的进程。"
 
 un.14.t:0 "对[ROOT.GetName]的制裁决议未能通过"
 un.14.d:0 "联合国针对[ROOT.GetName]发起的制裁最终未能得到安理会多数国家的支持。"
 un.14.a:0 "这将影响战争的进程。"
 
 un.15.t:0 "来自国际货币基金组织的贷款"
 un.15.d:0 "国际货币基金组织提供的价值500政治点数的贷款已经抵达。"
 un.15.a:0 "太棒了"
 
 un.16.t:0 "贷款还款期已到"
 un.16.d:0 "国际货币基金组织提供的贷款还款期已到，我们将连本带息归还650政治点数。"
 un.16.a:0 "告别专家"
 
 un.17.t:0 "[ROOT.GetName]遭到制裁决议！"
 un.17.d:0 "[FROM.GetName]以我们危害人权为理由向我们发起制裁决议！现在决议正在等待安理会成员国投票表决。"
 un.17.a:0 "真见鬼！"
 
 un.18.t:0 "决定对[FROM.GetName]发起制裁的投票"
 un.18.d:0 "联合国以镇压社会运动，危害人权为理由谴责[FROM.GetName]！现在决议正在等待安理会成员国投票表决。投票时限为5日，请您暂停游戏时间再投票。"
 un.18.a:0 "[FROM.GetName]必须遭到惩罚。"
 un.18.b:0 "没有这个必要。"
 
 un.19.t:0 "[ROOT.GetName]遭到联合国制裁"
 un.19.d:0 "经过投票，安理会多数国家决定以危害社会运动，危害人权为理由谴责[ROOT.GetName]！他们的国际影响力已经大不如前。"
 un.19.a:0 "这将影响战争的进程。"
 
 un.20.t:0 "对[ROOT.GetName]未能通过"
 un.20.d:0 "联合国针对[ROOT.GetName]发起的制裁最终未能得到安理会多数国家的支持。"
 un.20.a:0 "这将影响战争的进程。
 
 un.22.t:0 "您被邀请在联合国发表演讲！"
 un.22.d:0 "在外交努力下，您的外交影响力得到改善，您被要求在联合国大会上发表演讲！"
 un.22.a:0 "讨论国际局势与和平稳定。"
 un.22.b:0 "讨论经济与社会发展。"
 
 un.23.t:0 "[FROM.GetName]领导人在联合国发表演讲"
 un.23.d:0 "作为一个负责任的大国，[FROM.GetFlag][FROM.GetName]的领袖[From.GetLeader]在联合国大会上就国际局势与和平问题发表讲话演讲。"
 un.23.a:0 "确定。"
 
 un.24.t:0 "[FROM.GetName]领导人在联合国发表演讲"
 un.24.d:0 "作为一个负责任的大国，[FROM.GetFlag][FROM.GetName]的领袖[From.GetLeader]在联合国大会上就经济与社会发展问题进行演讲。"