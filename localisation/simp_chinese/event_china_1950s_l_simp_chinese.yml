 prcjf.27.t:0 "新疆剿匪作战失利"
 prcjf.27.d:0 "我军在西南地区的剿匪作战中遭受重大挫折！我军连续多次在与反动派的交火中失利，反动武装占据了偏远地区并扎根，还渗透进入了城市地区，给当地政府和人民带来严重威胁！"
 
 prcjf.28.t:0 "新疆反革命暴动！"
 
 prcjf.30.t:0 "四川袍哥会瓦解！"
 prcjf.30.d:0 "在人民解放军的坚决镇压与广大人民群众的积极配合下，长期盘踞四川、拥有复杂社会网络与私人武装的民间帮会组织——袍哥会最终土崩瓦解。面对新生人民政权的强大力量与政策教育，部分袍哥领袖认清形势，选择接受改造，主动与政府合作，告别旧有生涯，转变为新社会公民。\n与此同时，少数仍试图负隅顽抗、继续从事破坏活动的顽固头目，未能逃脱法律的严厉制裁。在公安机关周密部署与群众有力支持配合下，这些反动骨干被彻底清除。至此，这一自晚清民国以来深刻影响四川社会秩序、兼具互助与暴力双重性质的庞大民间会道门组织宣告灭亡。\n袍哥会的覆灭，标志着四川彻底结束了长达数十年的社会动荡与帮会势力割据的混乱局面，为地方社会秩序的根本稳定扫清了重大障碍，使天府之国的人民得以在一个更加安定、有序的环境中，共同投身于新中国的建设事业。"
 
 prcjf.31.t:0 "新疆乌斯满叛乱！"
 prcjf.31.d:0 "新疆的哈萨克民族主义者乌斯满·巴图尔纠集武装团体，发动了反对中国共产党的暴动！"
 
 prcjf.32.t:0 "乌斯满被俘虏！"
 prcjf.32.d:0 "乌斯满·巴图尔在与中国共产党的战斗中被捕，他即将被送往新疆首府迪化市面临审判，至此新疆最大的分离主义武装组织瓦解。"

 prcjf.33.t:0 "华中救世军暴动！"
 prcjf.33.d:0 "中国的川东、武汉和成都地区曾是基督教新教影响力十分大的地区，但自从中国共产党控制中国大陆，当局与教会的矛盾不断激化。华中地区以救世军为首的基督教势力发布声明，呼吁教众团结起来反对共产党。"
 
 prcjf.34.t:0 "中共向中缅边境发起攻击！"
 prcjf.34.d:0 "中共向中缅边境发起攻击！"
 
 prcjf.35.t:0 "我军抵达中缅边境！"
 prcjf.35.d:0 "我军镇压云南反革命暴动，以抵近中缅边境，大量国民党残兵溃逃进入缅甸，我们是到边境停止，还是继续进入缅甸境内？"
 
 prcjf.36.t:0 "中共政府宣布西南剿匪结束"
 prcjf.36.d:0 "经人民解放军、公安部队与各族群众历时三年的协同清剿，云南境内的国民党残部及反动土匪武装已基本肃清。全省恢复设立137个基层政权，320万亩荒芜耕地重新投入生产，曾被劫掠的茶马古道再现马帮铃响。\n清剿行动中，当地彝族、傣族群众组建上千支联防队，利用对地形的熟悉协助部队实施围剿。原盘踞哀牢山的李弥残部最后据点于上月被攻破，缴获美制电台17部及《滇缅边区游击计划》原件。目前仅有余启凤等少量残兵窜入缅甸掸邦山区。\n中共外交部今日正式照会缅甸政府，提出通过双边协商建立联合巡逻机制。缅方初步回应愿在"互不干涉内政"原则下进行对话。美国国务院发言人却称此举"可能威胁东南亚自由世界前沿"，引发中共严正驳斥。\n当澜沧江两岸重新升起袅袅炊烟时，中缅两国边防战士仍在2400公里长的滇缅边境线上保持警惕。"
 
 prcjf.37.t:0 "中共侵入我国境内！"
 prcjf.37.d:0 "中国共产党的军队以追击国民党残兵为借口，进入我国北部的克钦和掸邦地区！"
 
 prcjf.38.t:0 "中共侵入缅甸境内！"
 prcjf.38.d:0 "中国共产党的军队以追击国民党残兵为借口，进入缅甸北部的克钦和掸邦地区！缅甸政府宣布强烈谴责和反对中共的武装入侵！"
 
 prcjf.39.t:0 "投票谴责中共军队进入缅甸"
 prcjf.39.d:0 "联合国安理会发起投票表决，决定是否谴责中共军队进入缅甸并要求其撤军。"
 
 prcjf.40.t:0 "谴责中共决议未通过"
 prcjf.40.d:0 "联合国谴责中共军队入侵缅甸并要求其立刻撤军的决议未得到通过。"
 
 prcjf.41.t:0 "联合国要求中共立刻撤离缅甸"
 prcjf.41.d:0 "联合国安理会投票表决通过，谴责中共军队进入缅甸并要求其撤军。"
 
 prcjf.42.t:0 "中国人民解放军撤离缅甸"
 
 prcjf.43.t:0 "中国拒绝撤离缅甸"
 
 prcjf.50.t:0 "西南地区的武装暴动被镇压！"
 prcjf.50.d:0 "中国西南地区爆发的反共武装暴动被中国人民解放军镇压！当地的国民党残兵、地方武装和其他反共势力均已被消灭或瓦解，中国共产党政府已实现对该地区的完全控制。"
 
 prcjf.53.t:0 "西北地区的武装暴动被镇压！"
 prcjf.53.d:0 "西北爆发的反共武装暴动被中国人民解放军镇压！当地的国民党残兵、地方武装和其他反共势力均已被消灭或瓦解，中国共产党政府已实现对该地区的完全控制。"
 
 prcjf.54.t:0 "川渝地区的武装暴动被镇压！"
 prcjf.54.d:0 "川渝爆发的反共武装暴动被中国人民解放军镇压！当地的国民党残兵、地方武装和其他反共势力均已被消灭或瓦解，中国共产党政府已实现对该地区的完全控制。"
 
 prcjf.55.t:0 "新疆地区的武装暴动被镇压！"
 prcjf.55.d:0 "新疆爆发的反共武装暴动被中国人民解放军镇压！当地的国民党残兵、地方武装和其他反共势力均已被消灭或瓦解，中国共产党政府已实现对该地区的完全控制。"
 
 prcjf.56.t:0 "中部地区的武装暴动被镇压！"
 prcjf.56.d:0 "湖南、湖北、江西三省爆发的反共武装暴动被中国人民解放军镇压！当地的国民党残兵、地方武装和其他反共势力均已被消灭或瓦解，中国共产党政府已实现对该地区的完全控制。"
 
 prcjf.57.t:0 "湘西王 张平拥兵自立"
 prcjf.57.d:0 "致中央军委：\n我军已进入湘西地区，开展剿匪工作。在此期间，我们注意到一个名叫张平的人物。此人原为古丈县县长、国民党军暂十一师师长，从20年代开始，便在湘西地区占山为王，无恶不作，烧杀抢掠，残杀无辜群众。在我军解放常德后，张平及其党羽闻风逃入湘西深山地区，妄图负隅顽抗。\n当地民众都希望我们能早日歼灭这个恶霸，但同时也向我们反映，张平在逃进山区之前，将附近兵工厂的军火搜刮殆尽，因此可能拥有大量武器弹药和重武器，加之湘西地区地势险恶，因此围剿张平匪帮的作战计划，应小心谨慎。"
 
 prcjf.58.t:0 "尧乐博斯叛逃！"
 prcjf.58.d:0 "致中央军委：\n在新疆和平解放中向我军投诚的前新疆国民党官员尧乐博斯，前不久偷偷摸过我军封锁线逃亡！根据前线指战员调查，此人可能已经逃向喀什噶尔地区，投奔伪新疆反共复国军头目乌斯曼！"
 
 prcjf.59.t:0 "闽、浙匪患愈发危急"
 prcjf.59.d:0 "致中央军委：\n我军今日在浙江、福建沿海地区，与多股劫掠沿海村镇的海上匪盗交火，在清扫战场时，发现这些匪徒持有大八粒、汤姆森等美械装备，因此我们认为这些匪徒不只是简单的海上强盗，他们可能得到了来自台湾的美军军援。"
 
 
 
 prcjf.60.t:0 "的宗教团体抗议"
 prcjf.60.d:0 "地区发生宗教团体的示威游行，他们对中国共产党的反宗教政策感到不满。"
 
 prcjf.61.t:0 "[STATE.GetName]土地改革进展迅速"
 prcjf.61.d:0 "[STATE.GetName]地区的土地改革进展顺利，当地地主乡绅主动配合土地改革以换取政府优待。"
 
 prcjf.62.t:0 "[STATE.GetName]土地改革进展受阻"
 prcjf.62.d:0 "[STATE.GetName]地区发来报告，当地的土地改革进展很不顺利，土地乡绅纠集土匪流氓阻挠土改，许多农民也对土地改革的政策、实行和利益分配产生质疑和不满，这大大损害了我们在当地的影响力。"
 
 prcjf.63.t:0 "[STATE.GetName]工商改革进展迅速"
 prcjf.63.d:0 "[STATE.GetName]地区的资本主义工商业改革进展顺利，当地企业家和资本家主动配合土地改革以换取政府优待。"
 
 prcjf.64.t:0 "[STATE.GetName]工商改革进展受阻"
 prcjf.64.d:0 "[STATE.GetName]地区发来报告，当地的资本主义工商业改革进展很不顺利，反动资本家纠集土匪流氓阻挠改革，许多工人也对改革的政策、实行和利益分配产生质疑和不满，这大大损害了我们在当地的影响力。"
 
 prcjf.65.t:0 "[STATE.GetName]宗族势力的暴动"
 prcjf.65.d:0 "的地方宗族势力制造暴动，反对人民政府和土地改革。东南沿海地区的闽、粤、桂三省农村存在庞大的宗族势力，村民之间形成利益共同体，这是我们在巩固对这些地区控制的过程中需要格外注意的。"
 
 prcjf.67.t:0 "我们与[STATE.GetName]少数民族谈判取得进展"
 prcjf.67.d:0 "我们与[STATE.GetName]地区的少数民族代表的对话取得进展，他们愿意相信新政府是能够帮助少数民族结束贫穷与落后，走向幸福生活的。与少数民族关系的改善有利于我们进一步开展在当地的政治活动。"
 
 prcjf.68.t:0 "[STATE.GetName]少数民族反对新政权"
 prcjf.68.d:0 "[STATE.GetName]地区发来报告，当地的少数民族对我们依然保持较大的抵触情绪，他们敌视社会主义并试图保护落后的社会体制。"
 
 prcjf.69.t:0 "[STATE.GetName]地方民团向我们放下武装"
 prcjf.69.d:0 "在以前的军阀混战和国民党统治时期，地区的民众为了自保，组建了武装民团。好消息是，经过谈判，地方民团已决定向政府和平移交武器装备并解散。"
 
 
 prcjf.70.t:0 "关于[STATE.GetName]地区扫毒运动开展情况的汇报"
 prcjf.70.d:0 "致上级领导：\n本地区禁毒斗争正稳步推进。自《关于肃清鸦片烟毒的通令》颁布以来，已全面铲除辖区内127亩罂粟田，改种棉粮作物。群众觉悟显著提高，主动上缴私藏烟土863两、烟具277件，并协助查处地下烟馆4处。\n工作方法上采取宣传与行动相结合：各村成立戒毒学习小组，用快板戏等形式揭露鸦片危害；民兵队配合公安进行地毯式排查，对数十名成瘾者实施强制医疗。特别在码头及交通要道设立检查站，截获企图转移的烟土超过200余两。\n目前市面已无公开毒品交易，原吸毒人员中73%通过劳动改造戒除恶习。下阶段将继续巩固成果，重点监控边境流动人员，同时发展替代种植产业。随附缴获物资清单及改造人员名册。\n此致 敬礼\n\n[STATE.GetName]人民政府"
 
 prcjf.71.t:0 "中国禁毒斗争取得历史性胜利 百年毒患终得根治"
 prcjf.71.d:0 "历时两年的全国禁毒运动宣告取得决定性胜利。据内务部最新统计，全国共查封制毒场所846处，缴获鸦片及各类毒品逾300吨，昔日泛滥的毒品黑市已彻底瓦解。\n《人民日报》宣布，这是中国共产党取得的最令人骄傲的成就，这不仅是新中国新政府努力的结果，也离不开全国各族人民的密切支持和配合，尤其是在毒品犯罪最为泛滥的云南省，公安部队跨国追击时，当地傣族群众主动带路，用火把照亮深山密道。上海原法租界的最后一家地下烟馆，现已成为工人扫盲夜校，曾经的瘾君子们正在接受禁毒教育，以改过自新，成为共和国的新公民。\n国际媒体罕见给予积极评价，《泰晤士报》驻华记者写道：这是人类禁毒史上最彻底的革命。联合国麻醉品管制局将中国案例列入年度报告，称其创造了社会改造的奇迹。广东省政府主席叶剑英来到东莞县虎门镇举行纪念活动，1840年，著名的林则徐在这里销毁鸦片。当夕阳将纪念碑的影子投向这片无毒的土地，阳光正汇成新时代的旋律。"
 
 
 
 
 
 prcjf.101.t:0 "北京政府要求我们驱逐国民党军"
 prcjf.101.d:0 "中共政府向我们发来信息，要求我们采取军事行动，驱逐盘踞在禅邦的国民党军队。"
 
 prcjf.102.t:0 "缅甸方面拒绝了我们的要求"
 prcjf.102.d:0 "缅甸方面拒绝我们与他们一同攻击盘踞在禅邦的国民党残军的要求。"
 
 prcjf.103.t:0 "缅甸军队向国民党军发起攻击"
 prcjf.103.d:0 "缅甸军队和中共军队一同向盘踞在禅邦东部的国民党军队发起攻击。"
 
 prcjf.104.t:0 "缅甸军队击溃国民党军队"
 prcjf.104.d:0 "缅甸军队向占领禅邦东部的国民党军队发起攻击，并成功攻占了一些国民党军控制下的据点。"
 
 prcjf.105.t:0 "国民党军队击溃缅甸军队"
 prcjf.105.d:0 "缅甸军队向占领禅邦东部的国民党军队发起攻击，但被国民党军反共击溃。"
 
 prcjf.110.t:0 "中共宣布剿匪作战结束"
 prcjf.110.d:0 "中国共产党宣布，在人民解放军英勇作战和全国人民的积极支持配合下，盘踞在中国大陆的国民党残余武装、土匪、民团和所有反革命势力，均已被消灭，人民政府对全国各地的控制已得到巩固。"
 
 prcjf.120.t:0 "土匪张平被击毙！"
 prcjf.120.d:0 "致中央军委：\n湘西大地传来振奋人心的消息，盘踞湘西二十余年的土匪头子张平，在人民解放军与民兵的围剿下被击毙！\n数日前，张平匪部遭遇我军主力部队痛击。这个狡猾的匪首带着亲信逃入深山，躲藏在岩洞中。在当地群众的积极协助下，我军迅速锁定其藏身之处。当解放军战士和民兵将山洞团团包围时，这个恶贯满盈的匪首竟负隅顽抗，向我军开枪射击。在激烈的交火中，张平身中二十七枪，当场毙命，结束了他罪恶的一生！\n今日清晨，张平的尸体被运抵古丈县城。数以千计的群众闻讯赶来，争相目睹这个昔日作威作福的恶霸的下场。县公安局已对尸体进行检验，确认身份无误。消息传来，整个湘西地区一片欢腾，各村各寨自发组织庆祝活动。\n张平的覆灭，标志着湘西剿匪斗争取得重大胜利，也预示着旧社会残存的黑暗势力终将被人民革命的洪流彻底扫清！湘西人民终于迎来了真正的解放，在这片洒满鲜血的土地上，新的生活正在开始！"
 
 prcjf.121.t:0 "川边反共救国军的威胁"
 prcjf.121.d:0 "致中央军委：\n近期川西、西康交界地区出现大规模匪患。该匪帮打着所谓川边反共救国军旗号，裹挟当地青壮，已形成建制武装。\n这只伪反共救国军兵力约3000余人，持有美式武器，盘踞在二郎山至大渡河峡谷地带，利用彝区复杂地形构筑工事。\n川边地区的剿匪作战有很大困难，该区域海拔落差超2500米，密林覆盖率83%，匪帮与部分头人结成利益同盟，获取情报和补给，少数民族群众受反动宣传影响，存在戒备心理。\n我们认为该地区的剿匪工作需要谨慎决策，请中央指示。"
 
 prcjf.122.t:0 "[STATE.GetName]匪患袭击党政机构！"
 prcjf.122.d:0 "紧急消息！\n[STATE.GetName]地区多个县城的党政机关，遭到反动匪徒的军事袭击！匪徒百余人持枪冲入驻地，与武警官兵发生激烈交火后撤离，导致数十名解放军战士和机关干部被杀害！"