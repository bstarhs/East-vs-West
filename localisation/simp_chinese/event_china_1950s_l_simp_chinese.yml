 prcjf.1.t:0 "西南地区反革命动荡"
 prcjf.1.d:0 "尽管人民解放军解放了全中国，但云南、广西、贵州等地依然存在大量的国民党残兵、土匪和少数民族土司，拒绝服从中央人民政府，组织武装试图叛乱。"
 prcjf.1.a:0 "准备剿匪作战！"
 
 prcjf.2.t:0 "西南地区剿匪作战顺利"
 prcjf.2.d:0 "我军在西南地区取得一次剿匪作战的重要胜利！我们击溃了数支国民党军残兵和土匪武装，使得反动派在该地区的叛乱力量大大减少，有力地维护了该地区治安。"
 
 prcjf.3.t:0 "西南地区剿匪作战失利"
 prcjf.3.d:0 "我军在西南地区的剿匪作战中遭受重大挫折！我军连续多次在与反动派的交火中失利，反动武装占据了偏远地区并扎根，还渗透进入了城市地区，给当地政府和人民带来严重威胁！"
 
