l_simp_chinese:
 phi.1.t:0 "菲律宾总统选举"
 
 phi.2.t:0 "虎克军暴动"

 phi.3.t:0 "罗哈斯总统去世"
 phi.3.d:0 "菲律宾总统曼努埃尔·罗哈斯突发心脏病去世，他的副总统埃尔皮迪奥·基里诺接任为菲律宾总统。"
 
 phi.4.t:0 "Aurora Quezon夫人遇袭身亡！"
 phi.4.d:0 "菲律宾前总统Manuel Luis Quezon的妻子Aurora Quezon夫人遭遇菲律宾共产党袭击身亡！共产党武装分子试图拦截Aurora Quezon乘坐的汽车并将其绑架，过程中保镖与绑匪发生交火，Aurora Quezon及女儿在交战中被射杀！Quezon夫人以积极支持慈善运动而闻名，她的死震惊了整个菲律宾，菲律宾共产党因此受到猛烈抨击。"
 
 phi.5.t:0 "1953年菲律宾总统大选开始投票！"
 
 phi.6.t:0 "菲律宾总统马格赛赛空难身亡！"
 phi.6.d:0 "来自马尼拉的突发消息！菲律宾总统拉蒙·马格赛赛访问宿务省后，乘坐的专机返回马尼拉时坠毁，机上包括总统在内的25人全部遇难。马格赛赛以激烈的反共产主义闻名，但目前没有证据显示菲律宾南方的共产党叛军制造了这起空难。副总统卡洛斯·加西亚接替了职位。"
 phi.6.a:0 "真是不幸。"
 
 phi.8.t:0 "菲律宾总统选举"
 
 phi.10.t:0 "菲律宾总统选举"
 
 phi.12.t:0 "菲律宾总统选举"
 
 phi.13.t:0 "费迪南德·马科斯当选总统"
 phi.13.d:0 "菲力宾总统大选结束，经过角逐，年轻的费迪南德·马科斯当选菲律宾总统。马科斯不仅是一位出色的年轻政治家，一位二战时期的战争英雄，并与菲律宾当红女伶伊梅尔达·马科斯结为夫妻。马科斯致力于改革和发展，人们相信他能带领这个国家走向繁荣。"
 phi.13.a:0 "祝贺马科斯。"
 
 phi.15.t:0 "菲律宾人民军崛起！"
 phi.15.d:0 "随着菲律宾总统[PHI.GetLeader]的独裁统治愈发残暴，菲律宾人民的生活愈发恶劣，共产主义的影响力在菲律宾南部迅速扩大。一支自称新人民军的共产主义武装力量在菲律宾中南部开始兴起。"
 
 phi.18.t:0 "阿基诺宣布准备回国"
 
 phi.19.t:0 "阿基诺无视警告"
 
 phi.20.t:0 "阿基诺宣布退出选举"
 
 phi.21.t:0 "阿基诺遇刺！"
 phi.21.d:0 "令人震惊的消息从菲律宾传来！菲律宾民主派领袖、总统候选人贝尼尼奥·阿基诺在马尼拉国际机场遇刺！阿基诺此行旨在回国参与总统大选，反对独裁者费迪南德·马科斯，但在抵达机场时遭不明武装分子开枪袭击，当场死亡。"
 
 phi.22.t:0 "阿基诺逃过一劫！"
 
 phi.24.t:0 "马尼拉爆发游行示威！"
 
 phi.25.t:0 "菲律宾总统马科斯下台！"
 phi.25.d:0 "来自菲律宾马尼拉消息，在长达数个月的选举和混乱之后，菲律宾独裁者费迪南德·马科斯在民众的压力下被迫宣布辞职，并乘坐美国直升机逃亡，示威者涌入了总统府，宣布独裁政权倒台。菲律宾民主派领袖科拉松·阿基诺夫人在总统府外宣誓就职。"
 
 phi.40.t:0 "拉蒙·马格赛赛当选菲律宾总统！"
 phi.40.d:0 "拉蒙·马格赛赛赢得菲律宾大选，当选总统。马格赛赛曾在反对日本入侵和共产主义叛乱的作战中展现出非凡的能力，而在当选总统后，马格赛赛承诺将加大菲律宾的民生和经济建设，并和共产主义威胁继续对抗。"
 
 phi.30.t:0 "菲律宾内战！"
 
 phi.50.t:0 "菲律宾与虎克军的谈判失败！"
 
 phi.51.t:0 "苏禄群岛爆发武装暴动！"
 phi.51.d:0 "菲律宾苏禄群岛因土地改革政策引发了陶苏格原住民与政府间的严重对立。矛盾焦点集中在土地征收的补偿标准与再分配方案上，原住民认为其传统权益受到忽视。在协商未果后，局势急剧恶化。数百名激进的陶苏格人在其头人拉吉·卡姆隆的领导下发动武装暴动，袭击了当地多个村公所，并与前来维持秩序的菲律宾警察部队爆发了激烈冲突，造成人员伤亡。此次事件凸显了菲政府在推动国家现代化进程中，处理少数民族地区传统权利与发展政策之间矛盾的复杂性。"
 
 phi.52.t:0 "爱德华·兰斯代尔上尉为我们提供帮助"
 
 phi.53.t:0 "路易斯·塔鲁克向菲律宾政府缴械"
 phi.53.d:0 "路易斯·塔鲁克向菲律宾政府缴械"
 
 