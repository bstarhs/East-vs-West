l_simp_chinese:
 city.1.t:0 "苏联占领富尔达山谷"
 city.1.d:0 "在苏联红军的猛烈攻势下，北约军队被迫撤离富尔达山谷这一战略要地。现在，苏军进攻莱茵河流域西德城市的道路已经畅通无阻。"
 city.1.a:0 "确定。"
 
 city.2.t:0 "苏军占领法兰克福"
 city.2.d:0 "苏联红军已经占领了联邦德国重要城市、北约驻德部队总司令部法兰克福。"
 city.2.a:0 "确定。"
 
 city.3.t:0 "[FROM.GetName]的首都已沦陷！"
 city.3.d:0 "[FROM.GetName]的首都[FROM.Capital.GetName]在敌人的强大攻势下沦陷！守军和市民被迫撤离这座城市。"
 city.3.a:0 "确定。"