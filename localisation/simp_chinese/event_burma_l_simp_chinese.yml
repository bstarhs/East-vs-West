l_simp_chinese:
 bur.1.t:0 "昂山被刺杀！"
 bur.1.d:0 "缅甸独立运动的领导人昂山先生和他的内阁成员在举行会议时，几名暴徒手持冲锋枪冲入会场将他们枪杀了！由于缅甸还处于英国控制下，英国当局宣布将彻查凶手。"
 bur.1.a:0 "真糟糕！"
 
 bur.3.t:0 "缅甸宣布独立"
 bur.3.d:0 "在经历了英国长达百年的殖民统治后，缅甸联邦宣布独立。独立之路是艰难的，但对于缅甸新政府来说，如何处理好国内的各种社会和民族矛盾，则是更大的挑战。"
 bur.3.a:0 "确定！"
 
 bur.4.t:0 "克伦暴动随机概率"
 
 bur.5.t:0 "克伦邦发生暴动"
 bur.5.d:0 "克伦地区的少数民族不愿意并入缅甸，他们发动了暴力叛乱抵抗我们！"
 
 bur.6.t:0 "克伦邦叛乱！"
 bur.6.d:0 "克伦的少数民族武装发动突然袭击！他们攻击当地的军政机构并叫嚣独立！"
 
 bur.7.t:0 "克伦邦发生叛乱！"
 bur.7.d:0 "缅甸的民族危机引发战争！克伦民族解放阵线突袭了当地的政府机构，夺取政权并宣布独立！缅甸政府调动部队，进行镇压！"
 
 bur.8.t:0 "克伦邦发生叛乱！"
 bur.8.d:0 "缅甸的民族危机引发战争！克伦民族解放阵线突袭了当地的政府机构，夺取政权并宣布独立！缅甸政府被迫撤离！"
 
 
 
 bur.10.t:0 "中共军队与缅军发生对峙"
 bur.10.d:0 "中共军队在驱逐入侵云南的国民党残军时，进入缅甸萨尔温江流域地区，并于缅甸军队发生对峙。\n双方爆发激烈争执，差点擦枪走火，虽然最后两军很快选择了冷静和对话，但依然引起了严重的外交争端。\n缅甸政府对中共军队进入缅甸的行为十分不安，尤其是在两国边境争议领土尚未解决的情况下，缅甸十分担忧中共会以剿灭国民党军为借口，武装占领中缅争议地区。"
 
 bur.11.t:0 "中共军队撤离中缅争议地区"
 bur.11.d:0 "中共军队撤离了不久前进入的中缅争议领土，中共政府表示，北京无意制造冲突，希望以和平对话方式解决中缅争端。"
 
 bur.12.t:0 "中共军队进占中缅争议地区"
 
 bur.13.t:0 "[FROM.GetName]谴责中共进占缅甸"
 bur.13.d:0 "[FROM.GetName]外交部发表声明，谴责中共军队武力占领中缅争议领土。"
 
 bur.14.t:0 "中缅边境联欢大会"
 bur.14.d:0 "中共政府与缅甸宣布，为了改善两国外交关系，决定在中国云南省的芒市举办中缅边民联欢大会，中国总理周恩来与缅甸的外交代表出席了大会。"
 
 bur.15.t:0 "中华人民共和国提出中缅就边境问题进行谈判"
 bur.15.d:0 "中共政府正式提出，与缅甸就两国边界的猛卯、班老、班洪三个地区的争议领土进行外交谈判。"
 
 bur.16.t:0 "猛卯地区之争"
 bur.16.d:0 "中缅两国将就云南西部的猛卯地区争端进行对话。\n猛卯地区位于云南西部德宏州瑞丽市西南部，该地区在1941年国民党政府与英属缅甸签订边界条约后，被缅甸所占据。该地区有一条从缅甸的克钦邦通往禅邦的公路要道，对缅甸来说，是缅北的交通命脉。"
 
 bur.17.t:0 "缅甸同意放弃猛卯地区"
 bur.17.d:0 "缅甸代表在中缅谈判中表示，该国愿意放弃对猛卯地区的主权，移交中国。"
 
 bur.18.t:0 "缅甸拒绝放弃猛卯地区"
 bur.18.d:0 "缅甸代表在中缅谈判中拒绝放弃对猛卯地区的主权，主张猛卯地区的主权归属为缅甸。"
 
 bur.19.t:0 "中国同意放弃猛卯地区"
 bur.19.d:0 "中国代表在中缅谈判中表示，该国愿意放弃对猛卯地区的主权，移交缅甸。"
 
 bur.20.t:0 "中国拒绝放弃猛卯地区"
 bur.20.d:0 "中国代表在中缅谈判中拒绝放弃对猛卯地区的主权，主张猛卯地区的主权归属为中国。\n双方就猛卯地区主权问题的对话以不欢而散告终。"
 
 bur.21.t:0 "班老、班洪地区之争"
 bur.21.d:0 "中缅两国将就云南西部的班老、班洪地区争端进行对话。\n班老、班洪地区位于云南南部的沧源县，该地区有许多重要的金属矿藏，尤其富含银矿。1934年，英国为了夺取银矿入侵班老，被当地少数民族击退。在1941年国民党政府与英属缅甸签订边界条约后，被缅甸所占据。"
 
 bur.22.t:0 "缅甸同意放弃班老地区"
 bur.22.d:0 "缅甸代表在中缅谈判中表示，该国愿意放弃对班老地区的主权，移交中国。"
 
 bur.23.t:0 "缅甸拒绝放弃班老地区"
 bur.23.d:0 "缅甸代表在中缅谈判中拒绝放弃对班老、班洪地区的主权，主张班老地区的主权归属为缅甸。"
 
 bur.24.t:0 "中国同意放弃班老地区"
 bur.24.d:0 "中国代表在中缅谈判中表示，该国愿意放弃对班老、班洪地区的主权，移交缅甸。"
 
 bur.25.t:0 "中国拒绝放弃班老地区"
 bur.25.d:0 "中国代表在中缅谈判中拒绝放弃对猛卯地区的主权，主张班老、班洪地区的主权归属为中国。\n双方就班老、班洪地区主权问题的对话以不欢而散告终。"
 
 bur.26.t:0 "中缅边境条约正式签订！"
 bur.26.d:0 "中华人民共和国总理周恩来与缅甸联邦总理吴努签订《中华人民共和国和缅甸联邦边界条约》."
 
 bur.27.t:0 "国民党军与佤族的勾结"
 
 
 bur.30.t:0 "[FROM.GetName]向联合国提出解决缅甸国民党军问题"
 bur.30.d:0 "[FROM.GetName]正式向联合国安理会提出，中国国民党军队在中国内战结束后，非法进入缅甸境内，占据萨尔温江的缅甸领土，对地方和平稳定造成严重破坏，要求联合国向台湾的国民党政府施加压力，迫使国民党军撤离缅甸。"
 
 bur.31.t:0 "联合国通过国民党军撤军提案"
 bur.31.d:0 "联合国大会通过投票表决正式通过提案，要求缅甸境内的中华民国残军全面撤离。"
 
 bur.32.t:0 "中华民国宣布从缅甸撤军"
 bur.32.d:0 "中华民国宣布接受联合国的要求，将撤离缅甸境内的所有军队。"
 
 bur.33.t:0 "中华民国拒绝从缅甸撤军"
 bur.33.d:0 "中华民国拒绝联合国要求从缅甸撤军的决议，并宣称将继续支持缅甸境内的国民党军反共抗共。"
 
 bur.34.t:0 "国民党军撤离缅甸"
 bur.34.d:0 "缅甸境内的国民党残军今日宣布接受联合国及台北方面的指示，逐步撤离缅甸国土，撤往泰国。"
 
 bur.35.t:0 "国民党军拒绝撤离缅甸"
 bur.33.d:0 "缅甸境内的国民党残军拒绝联合国要求从缅甸撤军的决议，并宣称将继续坚持反共抗共战争。"
 
 bur.36.t:0 "缅甸军队向国民党军发动全面进攻！"
 
 