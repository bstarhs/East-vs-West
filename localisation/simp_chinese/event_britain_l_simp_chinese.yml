 bri.250.t:0 "曼彻斯特足球俱乐部击败贝尔格莱德红星"
 bri.250.d:0 "在今日凌晨结束的欧冠四分之一决赛次回合较量中，曼彻斯特俱乐部客场战胜贝尔格莱德红星，以总比分5-1强势晋级半决赛。这支平均年龄仅22岁的青年近卫军，正以摧枯拉朽之势改写英格兰足球历史。\n比赛第17分钟，主队前锋接边路传中凌空抽射首开纪录；易边再战后，两名20岁小将又各入一球锁定胜局。\n当终场哨响时，观众齐声高唱"冠军属于曼彻斯特"。这支承载着战后英国希望的年轻队伍，将在明天登上回国的航班，他们能否在布鲁塞尔决赛延续奇迹？整个欧洲足坛都在屏息以待。"
 
 bri.251.t:0 "曼联包机在慕尼黑坠毁"
 bri.251.d:0 "来自慕尼黑的突发消息！\n\n今日下午，载有曼彻斯特俱乐部球员、工作人员及随行记者的英国欧洲航空公司包机在慕尼黑机场起飞失败坠毁，造成23人遇难，其中包括8名主力球员。这支刚刚晋级欧冠四强的青年近卫军，遭遇毁灭性打击。\n失事航班在第三次尝试起飞时冲出跑道，撞上附近民房和载满燃油的卡车后爆炸。曼联主力门将格雷格从燃烧的飞机残骸中挣扎爬起，并被前来救援的附近居民救出。曼联主教练马特·巴斯比躺在另一处残骸中奄奄一息，他的小腿后拧180度。\n英足总宣布即日起所有赛事延期。老特拉福德球场外，数千球迷手持蜡烛守夜。欧足联表示，曼联仍可自主决定是否继续参加欧冠。\n这场空难不仅摧毁了一支冠军之师，更让整个英国失去了一代足球希望。"
 
 bri.252.t:0 "球员邓肯·爱德华兹伤重不治"
 bri.252.d:0 "曼联球员邓肯·爱德华兹在慕尼黑空难中遭受重伤，经过半个多月的抢救后，不治身亡。"
 
 bri.253.t:0 "慕尼黑空难调查结果"
 bri.253.d:0 "经过艰难的调查，全英关注的慕尼黑空难调查结果公布。\n德国方面认为，由于事发当日，慕尼黑气候寒冷，下起鹅毛大雪，英国航空公司机组在没有清理飞机上堆积的积雪的情况下，贸然进行起飞，导致了惨剧。但英国方面不承认这一结果，英方认为，机场没有及时清理跑道上的积雪，也没有事前告知英方机组人员安全隐患，酿成无法挽回的结果。\n曼联球员尸骨未寒，而英德两国政府却因政治考量互相推卸责任，令许多球迷和媒体难以接受。"
 
 bri.254.t:0 "伯特兰·罗素发起反核运动"
 bri.254.d:0 "英国哲学家伯特兰·罗素呼吁发起反对核武器的社会运动，尤其反对英国政府在氢弹上的科研工作。罗素强烈反对核武器的发展，他认为核武器只能给人类带来毁灭。"
 
 bri.255.t:0 "英联邦运动会在加的夫开幕"
 bri.255.d:0 "第六届英联邦运动会在英国威尔士首府加的夫正式开幕，英国女王伊丽莎白二世出席开幕式，这是伊丽莎白二世首次以英联邦国家元首身份出席大型活动。\n来自全球34个国家和地区的一千多名参赛选手抵达加的夫参与盛会，规模超过了往届英联邦运动会。"
 
 bri.256.t:0 "Brojen Das横渡英吉利海峡！"
 bri.256.d:0 "体育媒体聚集在加来的海岸，聚精会神地等待从英格兰横渡而来的六位游泳健将，他们将夺取英联邦运动会中，横渡英吉利海峡比赛的金牌！\n冠军在闪光灯下诞生！来自东巴基斯坦的Brojen Das率先抵达！他不仅夺取了英联邦运动会的横渡英吉利海峡金牌，还成为历史上首位横渡英吉利海峡的亚洲人！"
 
 
 bri.270.t:0 "大量非裔加勒比移民的进入"
 bri.270.d:0 "随着英国对外来劳工的需求越来越多，大量来自加勒比海地区的非裔移民进入英国。"
 
 bri.271.t:0 "诺丁山非裔聚居区的动荡"
 bri.271.d:0 "越来越多来自加勒比海地区的非裔移民在伦敦郊外的诺丁山地区定居，引起了白人居民的不满。一些白人激进分子在诺丁山地区涂鸦，要求黑人滚出去！"
 
 bri.272.t:0 "白城发生针对非裔移民的袭击事件！"
 bri.272.d:0 "伦敦白城发生针对非裔移民的暴力袭击事件！"
 
 bri.273.t:0 "诺丁山发生针对非裔移民的袭击事件！"
 bri.273.d:0 "英国伦敦的诺丁山地区爆发大规模种族骚乱事件！反对外来移民的白人至上主义暴徒袭击了位于诺丁山的加勒比海黑人移民聚居区。一群300至400名白人暴徒出现在布拉姆利路，袭击西印度群岛居民的房屋。骚乱、暴乱和袭击不断！"
 
 bri.274.t:0 "诺丁山骚乱持续扩大！"
 
 bri.275.t:0 "诺丁山骚乱平息"
 bri.275.d:0 "伦敦诺丁山的种族主义骚乱平息，袭击者和暴徒逐渐散去。\n伦敦警察厅逮捕了140多人，其中大部分是白人青年，但也有很多黑人被发现携带武器。一份提交给伦敦警察厅厅长的报告称，在108名被控犯有严重人身伤害、斗殴、骚乱和持有攻击性武器等罪行的人中，有72人是白人，36人是黑人。"
 
 bri.276.t:0 "奥斯瓦尔德·莫斯利接受电视采访"
 bri.276.d:0 "大名鼎鼎的英国法西斯联盟领袖，曾经的英国右翼政治家奥斯瓦尔德·莫斯利接受了电视采访。这名曾经叱咤英国的法西斯主义政治家，在二战爆发后被捕入狱，战争结束后才得以释放。随着英国的种族和移民问题愈发严重，已经隐退政界的莫斯利爵士再一次受到人们的关注，许多右翼分子表达了对莫斯利的支持。\n\n莫斯利对记者表示，自己虽然已经放弃了激进的法西斯主义观点，但他依然希望保护英国民族的纯洁性，反对过量的外来移民危害英国白人的主体民族地位。此外莫斯利还希望保留英国在海外殖民地的影响力，并加强与欧洲国家的关系，对抗美国和苏联。"