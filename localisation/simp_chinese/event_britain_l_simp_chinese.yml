l_simp_chinese:

 bri.1.t:0 "伊丽莎白二世加冕"
 bri.1.d:0 "随着英王乔治六世因病逝世，其长女、时年25岁的伊丽莎白公主依法自动继承王位。在经历了为期16个月的举国哀悼期与周密筹备后，1953年6月2日，盛大的加冕典礼于伦敦威斯敏斯特大教堂隆重举行。\n伊丽莎白二世陛下正式宣誓即位，其全称为“托上帝洪恩，大不列颠及北爱尔兰联合王国及其他属地和领土的女王，英联邦元首，信仰的捍卫者”。这场首次通过电视向全球转播的加冕礼，吸引了数以亿计的观众，象征着古老的王室传统与现代传媒时代的结合。女王由此成为温莎王朝的第四位君主。\n此次权力更迭，正值大英帝国加速向英联邦转型、世界格局深刻变革之际。年轻女王的登基，被视为一个崭新时代的开端，承载着国人对国家稳定与未来发展的期望。王室的支持者期望她能像其父王乔治六世一样，以其责任感与使命感，带领英国及英联邦走过战后的变革时期。"

 bri.2.t:0 "伊丽莎白公主与菲利普亲王结婚"
 bri.2.d:0 "英国国王乔治六世的长女伊丽莎白公主，与希腊王子菲利普结婚。伊丽莎白与菲利普结识于1932年，为了追求公主，菲利普自愿放弃了希腊王位的继承权。"
 
 bri.3.t:0 "英国查尔斯王子与戴安娜王妃结婚"
 bri.3.d:0 "英国王储、威尔士亲王查尔斯王子与斯宾塞伯爵之女戴安娜·斯宾塞举行了婚礼。"
 
 bri.4.t:0 "乔治六世去世"
 
 bri.5.t:0 "新耶路撒冷的曙光"
 bri.5.d:0 "硝烟尚未散尽，工党总部窗外的废墟上却已飘起崭新的蓝白旗。新当选首相艾德礼站在唐宁街10号台阶前，身后是被炸去半边的财政部大楼，他扶正眼镜宣布："从今天起，每个英国人都将成为自己命运的主人。"\n贝弗里奇报告瞬间铺满全国报摊，矿工的女儿与退役上校同时捧着《国民保险法》草案在邮局前排起长队。曼彻斯特的纺织厂女工第一次听说全民医疗服务时，正用消毒水擦拭战时节绷带——那卷绷带突然被晨光照得雪亮，像极了崭新的社会契约。\n暮色中，艾德礼独自走过圣保罗大教堂的残垣，碎石间有野蔷薇正从弹坑里探出枝条。这位被称为沉默的革命家的首相俯身拾起半块彩窗碎片，那上面正好保留着耶路撒冷城墙的金漆图案。"
 
 bri.10.t:0 "披头士乐队成立"
 bri.10.d:0 "约翰·列侬、保罗·麦卡特尼、乔治·哈里森和林戈·斯塔尔在利物浦成立了一支新的摇滚乐队。"
 
 bri.11.t:0 "披头士乐队访问美国"
 bri.11.d:0 "约翰·列侬、保罗·麦卡特尼、乔治·哈里森和林戈·斯塔尔在利物浦成立了一支新的摇滚乐队。"
 
 bri.12.t:0 "披头士乐队获颁大英帝国勋章"
 bri.12.d:0 "约翰·列侬、保罗·麦卡特尼、乔治·哈里森和林戈·斯塔尔在利物浦成立了一支新的摇滚乐队。"
 
 bri.13.t:0 "约翰·列侬接受伦敦晚报采访"
 bri.13.d:0 "基督教终将消亡，它会慢慢枯萎直至消逝。我并不想要争论这一点，我是正确的，时间也会印证我的话。我们现在比耶稣更受欢迎，我不知道摇滚乐和基督教哪一个会先消失。耶稣是不错的，不过他的教徒实在是愚蠢和庸俗。就我看来，是这些教徒扭曲了基督教，并会最终毁灭基督教。"
 
 bri.14.t:0 "披头士乐队解散"
 bri.14.d:0 "约翰·列侬、保罗·麦卡特尼、乔治·哈里森和林戈·斯塔尔在利物浦成立了一支新的摇滚乐队。"
 
 bri.15.t:0 "[ENG.GetLeader]提出辞职"
 bri.15.d:0 "由于苏伊士战争的失败[ENG.GetLeader]首相决定引咎辞职。"
 
 bri.16.t:0 "[ENG.GetLeader]当选英国新首相"
 bri.16.d:0 "在苏伊士战争的惨痛失败后，安东尼·艾登的声望一落千丈，被迫引咎辞职。保守党推选[ENG.GetLeader]就任为英国新首相并组织政府。"
 
 bri.17.t:0 "国防部长约翰·邓尼斯·普罗富莫爆发丑闻"
 bri.17.d:0 "约翰·列侬、保罗·麦卡特尼、乔治·哈里森和林戈·斯塔尔在利物浦成立了一支新的摇滚乐队。"
 
 bri.18.t:0 "[ENG.GetLeader]提出辞职"
 bri.18.d:0 "约翰·列侬、保罗·麦卡特尼、乔治·哈里森和林戈·斯塔尔在利物浦成立了一支新的摇滚乐队。"
 
 bri.19.t:0 "北爱尔兰共和军崛起！"
 bri.19.d:0 "随着北爱尔兰问题日益严峻，极端派已经掌握了爱尔兰共和军的领导权。"
 bri.19.t:0 "真见鬼！"
 
 bri.20.t:0 "北爱尔兰发生袭击！"
 bri.20.d:0 "北爱尔兰首府贝尔法斯特发生一起汽车爆炸事件。停在街上的汽车里的固体炸药被引爆了。巨大的噪音震碎了几个街区的玻璃，蘑菇云高达数十米。大约有20人伤亡。北爱尔兰分离主义组织爱尔兰共和军声称对袭击事件负责，称这是对英国殖民者非法占领北爱尔兰的报复。"
 bri.20.t:0 "真见鬼！"
 
 bri.21.t:0 "罢工！"
 bri.21.d:0 "约克郡发生了一场大骚乱！数万名工人、学生和左翼分子聚集在街头示威，并冲向警方设置的路障。抗议者对撒切尔的私有化政策极为不满，如果剥夺工人权利的法案不被废除，他们将战斗到底。"
 bri.21.a:0 "让警察去出重拳！"
 bri.21.b:0 "与示威者谈判。"
 
 bri.22.t:0 "向伦敦进军"
 bri.22.d:0 "撒切尔夫人拒绝与工会谈判的觉得激怒了罢工工人，他们呼吁在英国全国举行大罢工。伦敦的工会代表说，他们欢迎来自约克郡和利物浦的工人前去伦敦，宣告自己的诉求。昨天，工会领袖宣布，如果撒切尔继续对工人怀有敌意，他们将向伦敦游行。"
 bri.22.a:0 "绝对不向工会屈服。"
 bri.22.b:0 "尝试与他们谈判。"
 
 bri.23.t:0 "矿工大罢工！"
 bri.23.d:0 "来自英国的最新消息：英国首相撒切尔夫人拒绝与罢工矿工对话，愤怒的工会成员决定进军伦敦，发动英国历史上规模最大的示威游行。来自英格兰各地的10万多名工人前往伦敦，抗议者聚集在威斯敏斯特宫、圣詹姆斯公园和特拉法加广场前。尽管苏格兰场已经派出几乎所有的警察阻止示威者，但它只能在白厅地区阻止他们。"
 bri.23.a:0 "绝对不向工会屈服。"
 
 bri.25.t:0 "伦敦大屠杀"
 bri.25.d:0 "震惊的消息从伦敦传来，在撒切尔夫人的指挥下，伦敦营和第二皇家坦克营进入伦敦，包围了从白金汉宫到滑铁卢车站的数千名抗议者。昨晚九点，当示威者试图接近士兵时遭到了枪击！晚上11点，部队开始镇压示威者，无情地向逃跑的人群开枪，目击者称数千人死亡。截至记者发稿时，圣詹姆斯公园仍有数千人被包围，军队继续推挤他们！"
 bri.25.a:0 "The dead peoples dead in London last night."
 
 bri.26.t:0 "坦克人"
 bri.26.d:0 "一名刚刚从伦敦冲突中逃脱的记者向媒体展示了他拍摄的一张照片：在威斯敏斯特宫和白厅附近镇压示威者后，几辆百夫长坦克试图沿着威斯敏斯特桥撤离。突然，一个穿白衬衫，手持两个塑料袋的人挡住了他们的去路。坦克上的机枪突然开火，打死了那个人，并碾过了他的尸体。"
 bri.26.a:0 "The dead peoples dead in London last night."
 
 bri.33.t:0 "英国邀请我们加入伦敦协定组织"
 bri.33.d:0 "英国近期在欧洲大陆的势力扩张令人不安。伦敦向我们发出了强硬的通牒，要求我们加入他们主导的伦敦协定组织。"
 
 bri.34.t:0 "[FROM.GetName]宣布加入伦敦协定组织"
 bri.34.d:0 "[FROM.GetName]宣布加入伦敦协定组织。"
 
 bri.35.t:0 "[FROM.GetName]拒绝加入伦敦协定组织"
 bri.35.d:0 "[FROM.GetName]拒绝加入伦敦协定组织。"
 

 bri.46.t:0 "[FROM.GetName]向我们请求派遣顾问"
 bri.46.d:0 "[FROM.GetName]希望我们能派遣顾问前往该国，指导该国经济发展建设，"
 
 bri.47.t:0 "英国向我国派遣顾问"
 bri.47.d:0 "英国向我国派遣了专家顾问团队，指导我国发展建设。"

 bri.48.t:0 "英国拒绝派遣顾问"
 bri.48.d:0 "英国拒绝向我国派遣顾问"
 
 bri.50.t:0 "苏格兰独立！"
 bri.50.d:0 "苏格兰议会昨天通过了一项有争议的法案，认为英国的经济崩溃、政治混乱、高失业率和腐败给苏格兰带来了巨大灾难。只有独立才能使他们远离英国带来的危机。英国政府指责苏格兰违背了其组建英国王国的承诺，将使用特殊手段镇压分离主义。"
 bri.50.a:0 "Teach the Highlanders a lesson!"
 
 bri.51.t:0 "爱尔兰暴动！"
 bri.51.d:0 "叛乱分子在整个阿尔斯特发动叛乱！他们宣布了反对英国统治的战争已经开始！"
 bri.51.a:0 "Teach the Finnians a lesson!"
 
 bri.52.t:0 "联合王国已卷入战争！"
 bri.52.d:0 "联合王国已卷入战争！伊丽莎白女王号召英联邦所有成员国一起战斗。"
 bri.52.a:0 "Join the war!For Queen and Commonwealth!"
 
 bri.55.t:0 "英国希望使用北极星导弹"
 bri.55.d:0 "随着英国自身开发新型陆基导弹未能成功，伦敦希望能够获得一款先进的海基导弹从而强化其核武器。英国希望能够购买美国最新的北极星潜射导弹，对此我们的回应是？"
 bri.55.a:0 "我们应该支持我们的盟友"
 
 bri.56.t:0 "拿骚协定"
 bri.56.d:0 "美国总统[USA.GetLeader]与英国首相[ENG.GetLeader]在巴哈马首府拿骚进行会谈并签署《拿骚协定》，协定同意美国向英国提供先进的北极星潜射导弹以强化英国的核武储备。最为代价，英国的核武器将在战时服从美国的指挥。"
 bri.56.a:0 "Join the war!For Queen and Commonwealth!"
 
 bri.57.t:0 "中部条约组织成立"
 bri.57.d:0 "在英国和土耳其主导下，中东多国成立了“中东条约组织”，以建立一个中东地区的军事同盟。"
 bri.57.a:0 "中东局势加剧了。"
 
 bri.58.t:0 "中部条约组织的邀请"
 bri.58.d:0 "英国政府邀请我们加入中东条约组织，我们如何应对？"
 bri.58.a:0 "应当加入。"
 
 bri.59.t:0 "[FROM.GetName]加入中部条约组织。"
 bri.59.d:0 "[FROM.GetName]政府宣布加入中部条约组织。"
 bri.59.a:0 "确定。"
 
 bri.60.t:0 "中部条约组织瓦解"
 bri.60.d:0 "随着中东国家政治动荡加深，中部条约组织已名存实亡。"
 bri.60.a:0 "确定。"
 
 bri.61.t:0 "布鲁塞尔条约签署"
 bri.61.d:0 "在英国主导下，西欧多国成立了“中东条约组织”，以建立一个中东地区的军事同盟。"
 bri.61.a:0 "欧洲局势加剧了。"
 
 bri.62.t:0 "布鲁塞尔条约的邀请"
 bri.62.d:0 "英国政府邀请我们签署布鲁塞尔条约，我们如何应对？"
 bri.62.a:0 "应当加入。"
 
 bri.63.t:0 "[FROM.GetName]签署布鲁塞尔条约。"
 bri.63.d:0 "[FROM.GetName]政府宣布加入布鲁塞尔条约组织。"
 bri.63.a:0 "确定。"
 
 bri.64.t:0 "英国寻求改善与英国的关系。"
 bri.64.d:0 "英国首相[ENG.GetLeader]发表讲话，表示英国政府寻求与英国加强合作，以应对未来的挑战。"
 bri.63.a:0 "确定。"
 
 bri.65.t:0 "英国寻求改善与西德的关系。"
 bri.65.d:0 "英国首相[ENG.GetLeader]发表讲话，表示英国政府寻求与西德加强合作，以应对未来的挑战。"
 bri.65.a:0 "确定。"
 
 bri.66.t:0 "英国提出三环外交政策"
 bri.66.d:0 "英国首相[ENG.GetLeader]发表讲话，提出“三环外交”政策，希望通过建立英国与美国、英联邦之间的友好关系维持英国的地位。"
 bri.66.a:0 "确定。"
 
 bri.65.t:0 "英国寻求改善与西德的关系。"
 bri.65.d:0 "英国首相[ENG.GetLeader]发表讲话，表示英国政府寻求与西德加强合作，以应对未来的挑战。"
 bri.65.a:0 "确定。"
 
 bri.65.t:0 "英国寻求改善与西德的关系。"
 bri.65.d:0 "英国首相[ENG.GetLeader]发表讲话，表示英国政府寻求与西德加强合作，以应对未来的挑战。"
 bri.65.a:0 "确定。"
 
 bri.66.t:0 "五国联防协议"
 bri.66.d:0 "在英国主导下，新、马和澳新五国签订了五国联防协议，以对抗共产主义东南亚不断扩大的势力。。"
 bri.66.a:0 "欧洲局势加剧了。"
 
 bri.67.t:0 "五国联防协议的邀请"
 bri.67.d:0 "英国政府邀请我们签署五国联防协议，我们如何应对？"
 bri.62.a:0 "应当加入。"
 
 bri.68.t:0 "[FROM.GetName]签署五国联防协议。"
 bri.68.d:0 "[FROM.GetName]政府宣布加入五国联防协议。"
 bri.68.a:0 "确定。"
 
 bri.69.t:0 "英联邦的成立"
 bri.69.d:0 "英国政府修改了英联邦相关的条例，包括允许共和国加入、加强经济和外交联系等。英国政府希望英联邦的存在能够取代“大英帝国”，成为英国与前殖民地国家之间的纽带。"
 bri.69.a:0 "应当加入。"
 
 bri.71.t:0 "阿拉伯联邦和阿拉伯联合酋长国的成立"
 bri.71.d:0 "在经过政治运作后，英国开始撤离他们在阿拉伯半岛的殖民地，并将他们整合为两个国家-波斯湾的阿拉伯联合酋长国，以及南部的阿拉伯联邦。这两个国家仍然属于英联邦的范畴，并与伦敦保持政治联系。"
 bri.71.a:0 "知道了。"
 
 bri.72.t:0 "镇压爱尔兰共和军的行动"
 bri.72.d:0 "我军对爱尔兰共和军的基地和部队进行了搜索与摧毁，取得了很好的战果，一些爱尔兰共和军已经被击溃，撤退到郊区，他们很长一段时间都不会再出现了。"
 bri.72.a:0 "Good."
 
 bri.73.t:0 "镇压爱尔兰共和军失败！"
 bri.73.d:0 "我们的部队发动了一次搜索行动，袭击了爱尔兰共和军，但他们失败了！爱尔兰共和军打败了我们的部队，缴获了许多武器！"
 bri.73.a:0 "Bad news."
 
 bri.74.t:0 "英国宣布成立英属汉诺威自治领！"
 bri.74.d:0 "英国政府发布消息！伦敦以决定，在其占领的德国领土上建立一个独立的汉诺威自治领，并将其划入英国保护之下！"
 bri.74.a:0 "德国的分裂已成定局。"
 
 bri.75.t:0 "英国颁布国有化法案"
 bri.75.d:0 "英国首相[ENG.GetLeader]宣布，该国已决定在未来几年进行经济上的一系列国有化，从而推动国家迅速从世界大战中重建。"
 
 bri.76.t:0 "英国颁布铁路国有化法案"
 bri.76.d:0 "英国首相[ENG.GetLeader]宣布，该国已决定在未来几年进行铁路国有化，从而推动国家迅速从世界大战中重建。"
 
 bri.77.t:0 "[FROM.GetName]颁布全民健保制度法案"
 bri.77.d:0 "[FROM.GetName]政府宣布成立全民健保制度，使得每一个公民都有免费接受医疗服务的机会。"
 bri.77.a:0 "凯恩斯主义和福利国家正在成为共识"
 
 bri.78.t:0 "英国向苏联出售喷气式引擎"
 bri.78.d:0 "苏联代表团访问英国劳斯莱斯工厂期间，英国财政大臣斯塔福·克里普斯为表达两国友好，宣布向苏联出售先进的Nene式喷气引擎"
 
 bri.80.t:0 "黑色浓雾袭击伦敦！"
 bri.80.d:0 "随着寒冷天气来临，伦敦的许多市民开始焚烧煤炭取暖，汽车焚烧的废气也被大气压积压在地面，伦敦的空气污染愈发严重，医院收到了许多呼吸系统病人。"
 
 bri.81.t:0 "伦敦遭受空气污染袭击！"
 bri.81.d:0 "伦敦遭到了严重的空气污染威胁！煤炭焚烧、工业废气和汽车废气包围了整个城市，烟雾进入民宅，人人眼痛、鼻痛且咳嗽不止，黑暗中交通事故不断，救护车与消防车也难以出动。事件最终导致了数千人死亡，震惊了整个英国！"
 
 bri.82.t:0 "伦敦遭受空气污染袭击！"
 bri.82.d:0 "伦敦遭到了严重的空气污染威胁！煤炭焚烧、工业废气和汽车废气包围了整个城市.英国政府采取措施，将病弱人群从市区撤离，并向群众提供药物乃至防毒面具，从而将死亡人数控制在了两百以内。然而，有关空气污染的问题依然引起了全世界的警惕。"
 
 bri.83.t:0 "反对派兵朝鲜战争的示威游行！"
 
 bri.90.t:0 "克莱门特·艾德里访问中国大陆！"
 bri.90.d:0 "中国人民外交学会邀请，已卸任首相的艾德礼率英国工党代表团访问中国，成为与毛泽东会晤的第一位西方最高级别的政治家。\n毛泽东穿着一条背后打满罗纹补丁的深灰色裤子会见艾德礼。工作人员劝他换一条，他不同意，说：“没关系，谁会看我后边呀。”\n两人长谈3个多小时，毛泽东说，中国需要和平环境。“养许多兵是会妨碍经济建设的”。他希望“工党的朋友们”劝劝美国人把第七舰队撤走，“不要管台湾的事，因为台湾是中国的地方”。艾德礼说，中国官员的清廉和干劲深深打动了他。"
 
 
 bri.91.t:0 "英国代表与中共外交部进行接触！"
 bri.91.d:0 "英国政府宣布，英国已决定与中共政府进行外交接触，并承认中国共产党为中国大陆的唯一合法政府，英国希望以此打开谈判渠道，与中共就香港问题进行直接对话。"
 
 bri.92.t:0 "中英外交谈判"
 bri.92.d:0 "我国外交部门已与英国外交人员进行接触与对话。我方认为，立即收复香港主权并不现实，但可以向英方提出以下要求：\n立即停止与台湾的国民党当局的任何往来\n允许我国驻香港的外交、文化和经济机构进行正常活动，同时禁止台湾在香港的伪机构的所有活动，并驱逐其人员\n香港不得再接纳逃亡的大陆政治犯\n英国应当支持我国恢复在联合国的合法席位。"
 
 bri.93.t:0 "中英外交谈判"
 bri.93.d:0 "中共外交部门已与我国外交人员进行接触与对话。中共向英方提出以下要求：\n立即停止与台湾的国民党当局的任何往来\n允许中共驻香港的外交、文化和经济机构进行正常活动，同时禁止台湾在香港的伪机构的所有活动，并驱逐其人员\n香港不得再接纳逃亡的大陆政治犯\n英国应当支持中共恢复在联合国的合法席位。\n作为回报，中共将向英方口头承诺，短期内不会在香港有军事行动，同时有限的开放香港与深圳两地的商品和其他经济往来。"
 
 bri.94.t:0 "英国同意我国全部请求"
 bri.94.d:0 "英国外交部发来回函，表示同意接受我国提出的所有要求，作为回报，我们将向英方口头承诺，短期内不会在香港有军事行动，同时有限的开放香港与深圳两地的商品和其他经济往来。"
 
 bri.95.t:0 "英国拒绝我国正当要求"
 bri.95.d:0 "英国外交部发来回函，他们蛮横地拒绝了我国提出的所有要求，既然英帝国主义试图继续与国民党政权勾结，那么我们也不会在相关问题上做出任何让步。"
 
 bri.96.t:0 "英国与北京政府宣布互设代办处！"
 bri.96.d:0 "中华人民共和国政府与大不列颠联合王国政府发布联合声明，双方已就多项外交事宜，包括香港问题和国共问题达成了共识，即日起，英国将在南京设立代办级办事处，双方设立代办级关系。英国政府承诺，将承认中华人民共和国为中国大陆的唯一合法政权，并中断与台湾的国民党政府的外交关系，同时同意中共在香港的社会团体进行合法活动。而中共则在其外交公报中表示乐见中英两国建立外交关系，并暗示，短时间内不会对香港采取军事行动，中英将进一步就香港与广东省的经济往来进行磋商。"
 
 bri.97.t:0 "英国与中共的外交对话破裂"
 bri.97.d:0 "英国与中共进行的外交磋商以失败告终，英国拒绝中共提出的断绝与国民党政府的外交关系，以及允许中共团体在香港活动的要求，英国随即撤离了在中国大陆的所有外交人员，中共则指责英国外交官员蛮横无理，并暗示即将采取行动解决香港问题。远东局势再一次升温，英国国防大臣呼吁加强在香港的战略部署，而在台湾的国民党政权则呼吁香港同胞准备抵抗共匪的进一步入侵。"
 
 bri.98.t:0 "中华民国抗议英国与中共的接触！"
 bri.98.d:0 "英国政府与中共的外交接触，令国民党政府大发雷霆，中华民国外交部斥责英国政府抛弃自由世界，背离反共产主义的共同目标，为了一己私利，与共匪进行魔鬼交易。中华民国警告，共匪不会遵守任何承诺，英国将为这一决定付出代价，并最终失去香港。本报驻台北记者获悉，中华民国外交部已下令驱逐英国在淡水的临时大使馆。"
 
 
 
 bri.100.t:0 "英国寻求独立外交"
 bri.100.d:0 "英国政府近日发布声明，指出英国现在受到美国的政治影响太严重，指责美国正在将欧洲变成仆从国。[ENG'GetLeader]认为，英国必须寻求一条独立的道路，而非为美国服务，他呼吁英国和欧洲团结起来，摆脱美国政治影响。"
 
 bri.101.t:0 "英国宣布退出北约！"
 bri.101.d:0 "随着英美两国分歧越来越大，[ENG'GetLeader]愈发对北约干涉英国军事政策愈发不满。近日，[ENG'GetLeader]正式宣布，英国将退出北约军事一体化结构，从北约联合部队中撤出英国舰队和部队。伦敦还计划未来将驻扎在英国领土上的北约部队全部驱逐。"
 
 bri.102.t:0 "英国驱逐北约！"
 bri.102.d:0 "英国向我们发出最后通牒，要求北约部队限时全部撤离英国，我们如何回复？"
 
 bri.103.t:0 "美国拒绝撤军！"
 bri.103.d:0 "美国等北约国家拒绝撤出他们在我们领土上的部队！"
 
 bri.104.t:0 "英国对北约部队采取武力！"
 bri.104.d:0 "美国等北约国家拒绝了伦敦的最后通牒，拒绝撤出他们在英国领土上的部队！英方决定采取军事行动，派出部队驱逐北约部队，目前双方已经发生激烈交火！/n(英国必须在战争支持度低于60%之前夺取所有美军占领地区，否则算作英国失败，将导致戴高乐下台和稳定度大削）"
 
 bri.105.t:0 "北约向英国求和！"
 bri.105.d:0 "经过激烈战斗，英军不仅击败了占据英国领土的北约部队。美国对此气急败坏，但英军的退出几乎瓦解了美军在欧洲的势力。"
 
 bri.106.t:0 "[ROOT.GetName]宣布支持英国！"
 
 bri.107.t:0 "美国拒绝撤军！"
 
 bri.108.t:0 "美国拒绝撤军！"
 
 bri.110.t:0 "美国拒绝撤军！"
 
 bri.115.t:0 "喷气式客机的未来"
 bri.115.d:0 "尽管英国的彗星式喷气客机多次发生重大事故，但从长远来看，未来的航空领域，一定是属于喷气引擎的，一款能够满足民航需求而又安全可靠的喷气式客机将是人类技术进步的体现。在冷战大背景下，我们必须支持喷气式客机的研发，确保我国在这一领域的领先地位。当然，这需要一笔投资。"
 bri115tool:0 "首先开发出喷气式客机的国家将获得政治点数和外交影响力奖励。"
 
 bri.120.t:0 "英国希望在我国建立核试验基地"
 bri.120.d:0 "英国与美国有关共享核武器技术的谈判失败，英国已决定单独开发核武器，但英国缺少一个能进行核试验的场地，因此伦敦方面希望与我们合作，在我国寻找一块荒漠作为核试验场地，当然，核计划成功后，研究成果将与我们共享。"
 
 bri.121.t:0 "[FROM.GetName]拒绝了我国的要求"
 bri.121.d:0 "[FROM.GetName]政府经过考虑，拒绝了我国有关合作建立核试验基地的要求。"
 
 bri.122.t:0 "[FROM.GetName]同意了我国的要求"
 bri.122.d:0 "[FROM.GetName]同意了我国有关合作建立核试验基地的要求，核计划已在两国秘密合作下推进。"
 
 bri.123.t:0 "开始建造核试验基地"
 bri.123.d:0 "我们已开始在该地区秘密建造核试验基地，当然这一切过程都将高度保密，以免被该地区周边国家发现。"
 
 bri.124.t:0 "伦敦爆发共产党支持的示威游行"
 
 
 bri.83.t:0 "希腊的菲利普王子与英国的伊丽莎白公主订婚！"
 
 bri.83.t:0 "伊丽莎白公主大婚在伦敦举行！"
 
 bri.83.t:0 "英国王子查尔斯出生！"
 
 bri.83.t:0 "英国安妮公主诞生！"
 
 
 
 bri.140.t:0 "1950年英国大选即将开始"
 bri.140.d:0 "1950年英国大选即将开始，工党政府最近通过的紧缩政策和欧洲共产主义扩张成为本次大选的重要议题。"
 
 bri.141.t:0 "工党以微弱优势赢得大选"
 bri.141.d:0 "工党以微弱优势赢得1950年大选，工党政府和克莱门特·艾德礼首相得以继续执政。"
 
 
 bri.142.t:0 "工党内阁的崩溃！"
 bri.142.d:0 "随着英国在朝鲜战争中的介入，引起民众的广泛不满，同时加剧了大量不必要的财政支出，阿纽林·贝文和哈罗德·威尔逊等工党重要左翼幕僚宣布辞职，右翼的休伊·盖茨克等也表达了强烈不满。工党政府的崩溃似乎已经迫在眉睫。"
 
 bri.143.t:0 "英国宣布重新举行大选"
 bri.143.d:0 "在工党内部崩溃后，现任内阁已无以为继，英国首相宣布重新举行大选。"
 
 bri.144.t:0 "保守党赢得大选！"
 bri.144.d:0 "经过激烈角逐，英国保守党最终以微弱优势，赢得国会大选，英国工党最终失去了在英国的执政权，工党内阁就此倒台，艾德里首相带着他未能实现的新耶路撒冷的承诺，离开唐宁街。而保守党重新夺得组阁权，决定推举第二次世界大战的英雄，大名鼎鼎的温斯顿·丘吉尔，再一次出任首相，并希望丘吉尔能用他的威望，重新团结国家。"
 
 bri.145.t:0 "温斯顿·丘吉尔宣布辞职"
 bri.145.d:0 "年事已高的温斯顿·丘吉尔宣布，自己将辞去英国首相的职位，结束自己的第二任期。外交大臣安东尼·艾登凭借党内的威望，被推举为新一任首相。"
 
 bri.146.t:0 "工党的惨胜"
 bri.146.d:0 "工党以微弱优势赢得1950年大选，但克莱门特·艾德礼的威望和精力已不足以支持一个政府的运行。艾德礼宣布自己将辞去首相职位。"
 
 bri.147.t:0 "新的英国首相"
 bri.147.d:0 "克莱门特·艾德礼辞职后，经过角逐，[ENG'GetLeader]被推举建立新的工党内阁。"
 
 
 
 bri.150.t:0 "约克郡罢工被驱散"
 
 bri.151.t:0 "英国警察与罢工工人发生流血冲突"
 
 bri.152.t:0 "英国警察与罢工工人发生流血冲突"
 
 bri.153.t:0 "约克郡爆发大规模工人暴动！"
 
 bri.154.t:0 "暴动工人占领利兹和谢菲尔德市政厅！"
 
 bri.155.t:0 "约克郡临时人民政府成立！"
 
 bri.156.t:0 "英国陷入内乱！！"
 
 bri.157.t:0 "戴安娜王妃前往利兹！"
 bri.157.t:0 "来自约克郡首府利兹的惊人消息！威尔士亲王夫人戴安娜王妃已于今天抵达了单方面宣布独立的约克郡当局驻地利兹市政厅，并表达了对约克郡当局“追求权利”的支持。在英国当局宣布约克郡叛乱，双方剑拔弩张的情况下，戴安娜此举无异于对“叛军”的支持。约克当局主席[YOK.GetLeader]还宣布，应当支持戴安娜成为英国新的女王。伦敦的舆论充满了震惊和矛盾？戴安娜如何突破层层围困从伦敦前往利兹？这是否证实了民间流传的查尔斯与戴安娜之间的婚姻早已破裂？目前唐宁街和白金汉宫都未回答这两个问题，他们只表示严厉谴责王妃的叛国行为，并将迅速镇压约克叛乱。"
 
 bri.156.t:0 "不安定的军队"
 
 bri.156.t:0 "军队闯入伦敦！"
 
 bri.156.t:0 "英国爆发未遂政变！"
 
 bri.156.t:0 "英国爆发政变！"
 
 bri.156.t:0 "英国爆发军事叛乱！"
 
 bri.156.t:0 "英国爆发未遂政变！"
 
 
 
 bri.200.t:0 "斯宾塞的戴安娜加冕为大不列颠女王！"
 bri.200.d:0 "在伦敦圣保罗大教堂大大殿内，英国群众和政府官员齐聚一堂，见证者大不列颠历史上最重要的一个历史时刻。斯宾塞的戴安娜女伯爵接过神圣的皇冠，成为大不列颠及北爱尔兰联合王国的君主。至此，统治大不列颠两百多年的汉诺威-温莎王朝宣告终结，戴安娜一世的加冕宣告着斯宾塞王朝的诞生，同时戴安娜一世也是继威廉三世之后，又一位在前国王退位后，在议会邀请和民众拥立下获得王位的英国君主。目前逃亡加拿大的伊丽莎白二世和威尔士亲王查尔斯未对此作出回应。"
 bri.200.a:0 "Long live the Queen！"
 
 
 bri.210.t:0 "执行退火操作"
 bri.210.d:0 "今天又是无聊且枯燥的上班时间……\n\n英国，坎特伯兰郡，温斯凯尔一号核反应堆，在经过长时间的工作后，反应堆的石墨慢化剂会不断地积累能量，为了防止石墨过热，反应堆工作组将执行“退火”操作，即加热石墨慢化剂以释放积累的能量，防止石墨退化。"
 bri.210.a:0 "继续操作……"
 
 bri.211.t:0 "石墨温度出现失控"
 bri.211.d:0 "嗯？？怎么回事？为什么仪表仪器显示一切正常，石墨的温度却没有下降？\n\n总部，这里是温斯凯尔一号反应炉，我们在执行退火过程中，反应炉温度监测设备出现严重故障，仪器未能准确反映部分区域的过热情况，石墨局部可能出现温度失控！情况十分危急，请立即派遣专家前来支援！"
 bri.211.a:0 "保持冷静，按既定方案执行……"
 
 bri.212.t:0 "温斯凯尔燃起熊熊大火！"
 bri.212.d:0 "伦敦！来自卡莱尔市的紧急消息！\n\n温斯凯尔一号原子反应堆发生重大事故！由于操作失误，反应炉的石墨温度急剧升高，并出现有明火！反应堆已处于燃烧状态！\n这是世界上前所未有的核反应堆事故，我们必须在更大的灾难发生前，尽快作出处理。副主管汤姆·休斯及时地将还没燃烧的燃料棒扔进冷却池，但已经开始燃烧的燃料棒，人们无法接近，只能冒险使用液态二氧化碳进行控制……"
 bri.212.a:0 "保持冷静，按既定方案执行……"
 
 bri.213.t:0 "二氧化碳灭火取得成功"
 bri.213.d:0 "致唐宁街：\n感谢上帝和所有工作人员，温斯凯尔一号原子反应堆的火灾通过液态二氧化碳实现了控制，当伦敦收到消息时，火灾应该已经被扑灭……\n由于及时控制，反应炉事故暂时没有造成什么严重的危害，消息已经被封锁，很快反应炉就会被关闭。"
 bri.213.a:0 "谢天谢地……"
 
 bri.214.t:0 "二氧化碳灭火未能见效！"
 bri.214.d:0 "喷射液态二氧化碳的速度远远赶不上火灾蔓延的速度，现在我们只有用最后一个办法了…………直接使用水来灭火！但这样做风险很高，如果水接触到高温燃料棒产生大量氢气的话，就会有可能引发大规模爆炸，足以将整个反应堆掀翻，造成的后果不堪设想……但没有别的选择了。"
 bri.214.a:0 "保持冷静，按既定方案执行……"
 
 bri.215.t:0 "温斯凯尔的大火被扑灭"
 bri.215.d:0 "致唐宁街：\n感谢上帝和所有工作人员，温斯凯尔一号原子反应堆的火灾通过液态二氧化碳实现了控制，当伦敦收到消息时，火灾应该已经被扑灭……\n虽然我们控制住了火灾，但持续地燃烧依然使得不少放射性物质泄漏到了大气当中，这毫无疑问会对附近地区造成污染，我们必须采取行动，疏散群众，清理辐射……"
 bri.215.a:0 "真是惊险"
 
 bri.216.t:0 "少量的核辐射被泄露"
 bri.216.d:0 "首相阁下：\n温斯凯尔事故释放了约740太贝可（TBq）的放射性物质，包括碘-131、铯-137和钋-210，污染了周边地区。我们的工作人员将在不泄露事故原因的情况下，撤离附近居民，并销毁该地区的农产品。"
 bri.216.a:0 "保持冷静，按既定方案执行……"
 
 bri.217.t:0 "温斯凯尔被关闭"
 
 
 bri.220.t:0 "温斯凯尔反应堆爆发剧烈爆炸！"
 bri.220.d:0 "嘣——————————！！！！！！\n\n用水扑灭熊熊燃烧的温斯凯尔核反应堆的行动最终失败，大量的水与高温石墨或熔融燃料反应产生巨量氢气并爆炸，氢气腾空而起，将整个反应堆彻底掀翻……碘-131、铯-137、钚-239伴随着燃烧的氢气进入大气层……\n温斯凯尔反应堆画作一片火海，人类历史上第一次重大核灾难，在大英帝国的心脏点燃。"
 bri.220.a:0 "我了个大操！！！！"
 
