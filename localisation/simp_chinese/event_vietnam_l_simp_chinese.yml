 vin.105.t:0 "日内瓦谈判不欢而散"
 vin.105.d:0 "有关印度支那地区的停火谈判以失败告终，法国人和越南人在谈判桌上的唇枪舌剑没有获得任何结果，双方离开瑞士，回到战场继续厮杀。"
 
 
 vin.106.t:0 "法军外籍军团逃兵加入越盟"
 
 vin.108.t:0 "越共的秘密合作邀请"
 
 vin.109.t:0 "越共的秘密合作邀请"
 
 vin.110.t:0 "越共的秘密合作邀请"
 
 
 vin.120.t:0 "越南共产党开始初步土地改革政策"
 vin.120.d:0 "越南共产党在今天的全国大会上正式发布了150号决议，宣布开始第一次土地改革，这次改革的主要目的包括通过减租、赎买土地等方式，减轻农民的负担，争取农民对越共的支持，同时削弱地主在农村的政治影响力。"
 
 vin.121.t:0 "地主对土地改革的抵制"
 vin.121.d:0 "许多地主发起游行示威，指责正在进行的土地改革威胁到了他们的利益，尤其是威胁到了他们在农村的统治地位，要求中止土地改革。"
 
 vin.122.t:0 "对地主阶级的划分与控制"
 vin.122.d:0 "地主阶级正在害怕土地改革将削弱他们的权利，而这正是我们的目的。要想实现无产阶级专政，就要进行阶级斗争，就要达到地主阶级。我们将吸取中国经验，向地主发起批斗运动，主动向党和人民交出土地和政治权力的地主将被赦免，而顽固不化的地主将遭到惩治。"
 
 vin.123.t:0 "对地主的审判扩大化"
 vin.123.d:0 "许多地主因为不愿意交出土地和政治权力遭到审判，对此党内意见分为两派，一派主张坚持强硬的态度镇压地主阶级，另一派主张适当放缓避免冤假错案。"
 
 vin.124.t:0 "对中产阶层的审判扩大化"
 vin.124.d:0 "对反动阶级的肃反正在扩大，许多中产阶级因为拒绝配合社会主义改造而被捕，为他们求情的知识分子也处于监视当中。"
 
 vin.125.t:0 "审判阮氏南"
 vin.125.d:0 "来自河内的消息，越南共产党当局逮捕了著名的阮氏南并提起审判。阮氏南是越南北部的一名大地主，他因反抗日本和法国侵略者被人熟知，然而却因为反对激进的土地改革政策而被捕。"
 
 vin.126.t:0 "越南国民党遭到镇压"
 vin.126.d:0 "越南共产党与越南国民党的关系破裂，越共驱逐了国民党在北越政府中的官员并将他们软禁。"
 
 vin.127.t:0 "农民不满向地主让步"
 vin.127.d:0 "我们不断地向地主阶级和资产阶级的让步引发了农民和许多党员的不满，因为我们不得不取消许多土地改革政策。"
 
 vin.128.t:0 "土地改革与佛教寺院的矛盾"
 vin.128.d:0 "我们的土地改革政策遭到了佛教寺庙的抵制，他们不愿意交出寺庙所有的地产。"
 
 vin.129.t:0 "越南佛教徒向南逃离"
 vin.129.d:0 "来自越南广治市的消息，记者发现大量的越南北部佛教徒正试图跨过边境，前往南方。这些佛教徒在越南共产党的土地改革和政治运动中遭到迫害，大量佛教徒被越共逮捕，幸存者被迫向南逃离。"
 
 vin.130.t:0 "土地改革与天主教会的矛盾"
 vin.130.d:0 "我们的土地改革政策遭到了天主教会的抵制，他们不愿意交出教会所有的地产。"
 
 vin.131.t:0 "越南天主教徒向南逃离"
 vin.131.d:0 "来自越南广治市的消息，记者发现大量的越南北部天主教徒正试图跨过边境，前往南方。这些天主教徒在越南共产党的土地改革和政治运动中遭到迫害，大量天主教徒被越共逮捕，幸存者被迫向南逃离。"
 
 vin.132.t:0 "越南精英阶层向南逃离"
 vin.132.d:0 "来自越南广治市的消息，记者发现大量的越南北部的知识分子和中产阶级正试图跨过边境，前往南方。这些人在越南共产党的土地改革和政治运动中遭到迫害，大量知识分子被越共逮捕，幸存者被迫向南逃离。"
 
 vin.133.t:0 "越南北部土地改革以失败告终"
 vin.133.d:0 "[FROM.GetName]政府推行的土地改革已经以失败告终。政府在土地改革政策上畏手畏脚，既无法向地主提供补偿，也不能阻止私有企业、官僚和新兴垄断集团霸占本应该出售给农民的土地，政府收取的耕地最后只不过是从一个地主换给了另一个地主罢了。农民对[FROM.GetName]政府在土地改革上的软弱和无能感到愤怒，当局的威信遭到了严重的削弱。"
 
 vin.134.t:0 "越南北部土地改革获得初步胜利"
 vin.134.d:0 "[FROM.GetName]的土地改革取得初步成功，由于政府为农民提供资金赎买土地，最终成功从地主手中获取了大量的耕地并分配给没有土地的农民。土地改革的成功使得[FROM.GetName]政府的经济政策得到推行，同时也大大提高了当局的影响力。"
 
 vin.135.t:0 "义安省爆发大规模暴动！"
 vin.135.d:0 "北越义安省琼瑠县爆发了一场反抗共产党政权的暴动。暴动的原因是越南共产党推行的土地改革在农民间引发不满。有约2万名农民参加武装暴动，越南政府不得不调遣部队进行镇压。"
 
 vin.136.t:0 "《人民报》的创立"
 vin.136.d:0 "苏联去斯大林化和中国百花齐放运动的影响蔓延至越南，以陈寅、陈丹为代表的知识分子创办《人民报》，公开提出政治自由化，挑战越南共产党的权威。"
 
 vin.137.t:0 "艺术家向越共集体上书！"
 vin.137.d:0 "40名越南作家与艺术家联名向越共高层领导人长征、春水、素友上书，要求知识自由。其中，青年诗人黎达尖锐地批评当时的政治体制不能容忍文化政策，尤其批评素友和怀清。他们谴责越共将诗人陈寅投狱，以及以骚扰方式迫使著名诗人兼作曲家文高服从当局的行径。"
 
 vin.138.t:0 "《人民报》被查禁"
 vin.138.d:0 "越南共产党指示公安机关，以反对党的路线、煽动资产阶级复辟为由，查禁了越南知识分子创立的《人民报》，该报主编陈丹等被捕。"
 
 vin.139.t:0 "越南共产党发起新文化运动"
 vin.139.d:0 "越南共产党常委长征，在今日的党大会上宣布，为了进行更深入的土地革命和社会革命，打击封建阶级和资产阶级的社会影响力，越南共产党将进开启新文化运动。长征代表党中央发布了《关于文艺工作的政治局决议》，呼吁知识分子和文艺界人士，应当支持发展革命的、现代的、社会主义的先进文化，以对抗落后的、封建的、反人民的腐朽文化。"
 
 vin.140.t:0 "越南民族解放阵线正式建立！"
 vin.140.d:0 "越南共产党今日正式宣布，在北方同胞的支持下，越南南方民族解放阵线正式成立！解放阵线主席阮友寿代表南方无数受压迫民众，在河内的广场发表讲话。阮友寿痛斥南方傀儡政权勾结帝国主义，出卖国家，实行独裁统治，残暴镇压和屠杀革命群众的累累罪行，并正式宣布，南方各地人民群众将进行武装斗争，推翻西贡傀儡政府！"