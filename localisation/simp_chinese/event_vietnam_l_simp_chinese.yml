l_simp_chinese:
 vin.1.t:0 "越军攻占奠边府"
 vin.1.d:0 "经过数十天的围困，补给与粮食耗尽的法军不得不向越南独立联盟投降，奠边府战役最终以越军的胜利告终。消息传来，法军士气遭到打击，舆论认为法越战争的结果可能会向越南人倾斜。"
 vin.1.a:0 "知道了。"
 
 vin.2.t:0 "越南共产党发起暴动！"
 vin.2.d:0 "法军对越南北部的军事占领失控，越南共产党领导下的越南独立联盟发起全面暴动，法军已与越盟爆发激烈交火！"
 vin.2.a:0 "知道了。"
 
 vin.3.t:0 "越军攻占西贡"
 vin.3.d:0 "经过激烈的战斗，越盟军队终于突破法军防线，进入西贡市区。随着零星的巷战枪声，法军指挥官不得不宣布放弃西贡，大量法军士兵和河内市内的亲法人士及天主教徒向南撤退。越盟士兵在亲独立群众的欢迎下进入市中心，在交趾支那总督总督府旧址上升起了自己的旗帜。"
 
 vin.4.t:0 "越盟占领河内！"
 vin.4.d:0 "经过激烈的战斗，越盟军队终于突破法军防线，进入河内市区。随着零星的巷战枪声，法军指挥官不得不宣布放弃河内，大量法军士兵和河内市内的亲法人士及天主教徒向南撤退。越盟士兵在亲独立群众的欢迎下进入市中心，在法国总督府旧址上升起了自己的旗帜。"
 vin.4.a:0 "知道了。"
 
 vin.5.t:0 "越盟被击败！"
 vin.5.d:0 "在法国军队的大力镇压下，越南共产党领导的越盟武装被击溃，幸存者被迫转入地下。"
 vin.5.a:0 "知道了。"
 
 vin.6.t:0 "越盟宣布解除武装"
 
 vin.7.t:0 "邀请保大回到越南"
 
 vin.8.t:0 "复辟越南君主制"
 
 vin.9.t:0 "法国撤离印度支那"
 
 vin.10.t:0 "关于南北分治的争端"
 
 vin.11.t:0 "[from.GetName]拒绝分治方案"
 
 vin.12.t:0 "[from.GetName]接受分治方案"
 
 vin.13.t:0 "关于印度支那问题的日内瓦协议"
 vin.13.d:0 "经过几个月的谈判，有关越南未来的争端终于解决了。在美国和法国的干预下，越南被分为两部分：北部是越共统治下的越南民主共和国，南部是越南。双方都行使自治权，建立新政府。舆论对此表示担忧，认为越南很快就会像朝鲜一样陷入意识形态分裂的血腥内战。"
 vin.13.a:0 "越南的未来会是怎样的?"
 
 vin.14.t:0 "Election in South Vietnam"
 
 vin.15.t:0 "邀请保大回到越南"
 
 vin.16.t:0 "阮福永瑞担任北越官员"
 
 vin.17.t:0 "邀请保大回到越南"
 
 vin.18.t:0 "阮福永瑞担任南越国家元首"
 vin.18.d:0 "在法国人的邀请下，越南前保大皇帝阮福永瑞回到西贡，宣誓就任越南国元首，这是一个法国控制下的自治政权。"
 
 vin.19.t:0 "复辟君主制"
 
 vin.20.t:0 "保大拒绝了皇位"
 vin.20.d:0 "保大皇帝拒绝回到越南充当傀儡。"
 vin.20.a:0 "What is the future of Vietnam?"
 
 vin.21.t:0 "越南帝国复辟"
 vin.21.d:0 "昨天，越南南方迎来了巨变——在国内外保皇分子的谏言下，前越南皇帝，曾在1945年发表退位宣言的保大帝终于接受了“建议”，再一次接受了王位称帝，复辟了越南帝国，定都西贡，恢复年号保大，并在顺化皇城举行了登基仪式。越南南方复辟帝制引起了风波，南方不少反共人士和保守派大力支持保大登基，而北方的越共予以谴责，并表示自己会从封建君主手中解放国家。"
 vin.21.a:0 "What is the future of Vietnam?"
 #######
 vin.22.t:0 "黎笋同志前往南方考察"
 vin.22.d:0 "越共中央政治局黎笋同志将前往南方根据地考察南方革命武装活动情况"
 
 vin.23.t:0 "越共第15次中央委员会全体会议"
 vin.23.d:0 "黎笋同志自南方归来后，向我们汇报了不安的情况。在越共第15次中央委员会全体会议上，黎笋力主对南方发起武装革命斗争。"
 
 vin.24.t:0 "越共颁布第15号武装斗争决议"
 vin.24.d:0 "越南共产党在今天的越共第十五次中央委员会全体会议上宣布，美帝国主义及其支持的吴廷琰傀儡集团，在南方进行迫害民主人士、左派人士和宗教人士的血腥屠杀，激起越南人民的公愤，越南共产党将支持南方人民进行武装斗争。"
 
 vin.25.t:0 "越共提出南方和平革命斗争路线"
 
 
 vin.26.t:0 "舍利寺事件"
 vin.26.d:0 "西贡再次传来消息，南越总统吴廷琰派出特务闯入西贡最大佛教寺庙舍利寺，打死打伤多人。此举已经严重威胁了越南共和国政府的威信。\n 国防部长麦克纳马拉认为，吴廷琰政府在越南已经天怒人怨，并且最近在镇压越共事务上有所暧昧。为了避免越南落入越共手中，我们需要采取行动换掉吴廷琰。"
 vin.26.a:0 "吴廷琰是祸害，必须除掉。"
 vin.26.b:0 "留住吴廷琰才能稳定越南。"
 
 vin.27.t:0 "佛教徒的示威游行"
 vin.27.d:0 "由于不满总统吴廷琰强制推广天主教、打击佛教和共产主义的政策，越南佛教徒在西贡街头举行了游行示威。"
 vin.27.a:0 "镇压游行，逮捕领头人。"
 vin.27.b:0 "试图安抚示威者。"
 
 vin.28.t:0 "北越人民军在渗透进入南越！"
 vin.28.d:0 "借助胡志明小道，北越人民军秘密派出数个团的兵力进入越南南方，并参与了袭击南越的军事行动。"
 vin.28.a:0 "战争激化了。"
 
 vin.29.t:0 "越共起义！"
 vin.29.d:0 "在北越的支持下，越南南方民族解放阵线发起军事行动，向南越军队发起袭击！"
 vin.29.a:0 "战争激化了。"
 
 vin.30.t:0 "胡志明小径中断！"
 vin.30.d:0 "由于我军在老挝、柬埔寨的存在遭到削弱，胡志明小径被中断！我们暂时无法依靠其向南方输出人员和物资了！\n\n 提高在老挝、柬埔寨的共产主义支持率以恢复胡志明小径。"
 vin.30.a:0 "真糟糕。"
 
 vin.31.t:0 "越南爆发军事政变！"
 vin.31.d:0 "越南共和国首都西贡爆发军事政变！由杨文明率领的越南共和国陆军突然闯进总统府，宣布总统吴廷琰已经被推翻，军事革命委员会成立。吴廷琰及其弟吴廷瑈狼狈逃窜到附近一处教堂，最后被士兵发现并被杀死。\n舆论普遍认为，华盛顿在背后主导了这次政变，以替换掉不断激起民愤的吴廷琰政府。"
 vin.31.a:0 "多事之秋。"
 
 vin.32.t:0 "越南爆发军事政变！"
 vin.32.d:0 "越南共和国首都西贡爆发军事政变！由杨文明率领的越南共和国陆军突然进攻总统府，总统吴廷琰指挥忠于自己的部队进行反击，最后成功挫败了政变阴谋。\n这一事件使得本来就不稳定的南越政局更加混乱。舆论普遍认为，华盛顿在背后主导了这次政变，以替换掉不断激起民愤的吴廷琰政府，目前吴尚未就此事发表評論。"
 vin.32.a:0 "多事之秋。"
 
 vin.33.t:0 "越南爆发军事政变！"
 vin.33.d:0 "越南西贡再次爆发军事政变！南越军官集体起来推翻了威信不足以控制南越政局的[SVN.GetLeader]总统，成立了新的军政府。在关于谁是新的领导人这一问题上，出现了陆军将领阮文绍和反共政客陈善谦两个选择。"
 vin.33.a:0 "多事之秋。"
 
 vin.34.t:0 "胡志明小径恢复"
 vin.34.d:0 "由于我军在老挝、柬埔寨的存在得到加强，胡志明小径已经恢复！我们可以依靠其向南方输出人员和物资了！\n 提高在老挝、柬埔寨的共产主义支持率可以恢复胡志明小径。"
 vin.34.a:0 "太好了。"
 
 vin.35.t:0 "Coup in South Vietnam!"
 
 vin.36.t:0 "Coup in South Vietnam!"
 
 vin.37.t:0 "我军在东京湾遭到袭击！"
 vin.37.d:0 "我们的海军军舰在越南东北部的东京湾遭北约鱼雷艇袭击！我军马克多斯号驱逐舰进行了反击，击沉一艘越军鱼雷艇。\n 消息传回白宫之后，[USA.GetLeader]总统认为，是时候向国会提出向越南增加派兵以打击该国的共产主义势力了。"
 vin.37.a:0 "战火终究还是烧起来了。"
 
 vin.38.t:0 "东京湾事件！"
 vin.38.d:0 "美国海军军舰在越南东北部的东京湾遭北约鱼雷艇袭击！马克多斯号驱逐舰进行了反击，击沉一艘越军鱼雷艇。\n 消息传回白宫之后，[USA.GetLeader]总统向国会提出向越南增加派兵以打击该国的共产主义势力，标志着美军已经全面介入了越南战争。"
 vin.38.a:0 "战火终究还是烧起来了。"
 
 vin.40.t:0 "胡志明同志去世！"
 vin.40.d:0 "悲伤的消息传来，越南劳动党总书记，越南民族解放运动的领袖胡志明同志，在还没看到祖国统一的一天不幸病逝，葬礼在河内举行。\n随着胡志明去世，越共中央开始为选举下一任总书记。"
 vin.40.a:0 "应当由黎笋同志接任总书记。"
 vin.40.b:0 "长征同志是最合适的选择。"
 
 vin.41.t:0 "胡志明去世！"
 vin.41.d:0 "越南劳动党总书记，越南民族解放运动的领袖胡志明同志，在还没看到祖国统一的一天不幸病逝，葬礼在河内举行。胡志明的去世不仅意味着越南失去了一位伟大的领导人，也意味着国际左翼青年失去了一位精神领袖。"
 vin.41.a:0 "战斗仍将继续。"
 
 vin.42.t:0 "美国提出谈判"
 vin.42.d:0 "美国人向我们提出停战谈判，提议越南人民军和美军完全撤出越南南方，我们如何回应？"
 vin.42.a:0 "我们同意暂停南北战争。"
 vin.42.b:0 "绝不！必须作战到最后一刻！"
 
 vin.43.t:0 "河内拒绝了我们的停战谈判"
 vin.43.d:0 "来自河内的消息称，除非我军完全撤离越南南部，否则不会同意任何和平谈判。"
 vin.43.a:0 "真倒霉"
 
 vin.44.t:0 "巴黎和平协议"
 vin.44.d:0 "北越、南越和美国代表在巴黎签订了《关于结束越南战争和恢复和平的协定》，北越人民军和美军同意完全撤离越南南方，以实现越南战争的尽快结束。\n西贡的越南共和国政府强烈谴责协议的签订，认为美军在越共尚未被完全消灭的情况下撤离说背叛了西贡。"
 vin.44.a:0 "和平也许已经不远。"
 
 vin.47.t:0 "越南人民军进入西贡！"
 vin.47.d:0 "在经过激烈的战斗之后，越南民族解放阵线和越南人民军终于进入了越南共和国首都——西贡市区，市内残存的南越士兵大多都以放下武器投降。越南人民军的坦克撞开总统府大门，南越末代总统[SVN.GetLeader]慌忙逃亡，杨文明将军作为顶替与人民军指挥官签订了投降条约，宣布越南共和国军队全部停止抵抗。\n西贡的陷落意味着长达数十年的越南战争终于结束，但和平似乎还没有在这片土地上降临。"
 vin.47.a:0 "战争暂时结束了。"
 
 ###############
 
 vin.48.t:0 "越共占领西贡！"
 vin.48.d:0 "在经过激烈的战斗之后，越南民族解放阵线和越南人民军终于进入了越南共和国首都——西贡市区，市内残存的南越士兵大多都以放下武器投降。越南人民军的坦克撞开总统府大门，南越末代总统[SVN.GetLeader]慌忙逃亡，杨文明将军作为顶替与人民军指挥官签订了投降条约，宣布越南共和国军队全部停止抵抗。\n西贡的陷落意味着长达数十年的越南战争终于结束，但和平似乎还没有在这片土地上降临。"
 vin.48.a:0 "战争暂时结束了。"
 
 vin.49.t:0 "Sino-Vietnamese Treaty"
 
 vin.50.t:0 "Assistance From Moscow"
 
 vin.51.t:0 "Vietnamese broke the treaty!"
 
 vin.52.t:0 "Put capitalists away!"
 
 vin.53.t:0 "Laos-Vietnamese treaty"
 
 vin.54.t:0 "老挝拒绝合作协议"
 
 vin.55.t:0 "柬埔寨人在边境制造冲突"
 
 vin.56.t:0 "越南进攻柬埔寨"
 
 vin.57.t:0 "中越边境冲突"
 
 vin.58.t:0 "中国占领河内"
 
 vin.59.t:0 "武元甲兵谏"
 
 vin.60.t:0 "中国从越南撤军"
 
 vin.61.t:0 "从柬埔寨撤军的建议"
 
 vin.62.t:0 "黎笋去世"
 
 vin.63.t:0 "胡志明去世"
 
 vin.64.t:0 "长征去世"
 
 vin.65.t:0 "革新开放"
 
 vin.66.t:0 "胡志明市经济特区"
 
 vin.67.t:0 "修补中越关系的建议"
 
 
 
 
 vin.68.t:0 "镇压叛军的行动"
 vin.68.d:0 "我军对叛军的基地和部队进行了搜索与摧毁，取得了很好的战果，一些叛军已经被击溃，撤退到丛林中，他们很长一段时间都不会再出现了。"
 vin.68.a:0 "Good."
 
 vin.69.t:0 "镇压叛军失败！"
 vin.69.d:0 "我们的部队发动了一次搜索行动，袭击了叛军，但他们失败了！叛军打败了我们的部队，缴获了许多武器！"
 vin.69.a:0 "Bad news."
 
 vin.70.t:0 "中共宣布支持越南革命！"
 sov.70.d:0 "中国共产党领导人[FROM.GetLeader]宣布，该国将坚定支持越南人民反对帝国主义及其傀儡政权的斗争。"
 sov.70.a:0 "确定。"
 
 vin.71.t:0 "关于派遣驻越军事顾问团的建议"
 vin.71.d:0 "越南人民抗法救国斗争需要军事援助，中央军委建议我们派遣陈赓同志、韦国清同志等组成援越军事顾问团前往越南支持越南人民斗争。"
 
 vin.72.t:0 "中国军事顾问团抵达"
 vin.72.d:0 "中国军事顾问团已经抵达越南，他们将帮助越南共产党对抗法国。"
 
 vin.73.t:0 "关于打通中越补给线路的作战建议"
 vin.73.d:0 "中央军委建议我们在中越边境发起边境作战，打通通往越军根据地的道路。"
 
 vin.74.t:0 "越军发动边境作战！"
 vin.74.d:0 "中国支持下的越南军队在中越边境发动进攻，试图打通越军根据地和中国境内的公路！"
 
 vin.75.t:0 "边境作战结束！"
 vin.75.d:0 "越南军队成功夺取了中越边境的交通要道！"
 
 vin.76.t:0 "越军撤回中国！"
 vin.76.d:0 "越南军队未能夺取中越边境的交通要道！"
 
 vin.77.t:0 "英苏等国提议和平解决印度支那问题"
 vin.77.d:0 "在最近召开的柏林外长会议上，英国和苏联外交部长提议和平解决印度支那问题。"
 
 vin.78.t:0 "法英苏等国决定和平解决印度支那问题"
 vin.78.d:0 "法国政府宣布接受英国和苏联政府提出的建议，决定择日召开和平谈判，讨论印度支那问题"。"
 
 vin.79.t:0 "中国受邀参加日内瓦会议"
 
 vin.80.t:0 "越军攻占万象！"
 vin.80.d:0 "经过激烈的战斗，越盟军队终于突破法军防线，进入老挝首府万象市区。随着零星的巷战枪声，法军指挥官不得不宣布放弃万象，大量法军士兵和万象市内的亲法人士及老挝官员向南撤退。越盟士兵在亲独立群众的欢迎下进入市中心，在皇宫府旧址上升起了自己的旗帜。"
 
 vin.81.t:0 "越盟抵抗基本瓦解！"
 alg.81.d:0 "法国军方发布声明，最近几个月，印度支那地区的反法武装暴动越来越少，鲜有的几次暴动中，被俘的武装分子精神萎靡，装备落后，斗志底下，由此，法国方面认为，印度支那独立势力已经遭到严重削弱。"
 
 vin.82.t:0 "法国抵制中国参加日内瓦会议"
 vin.82.d:0 "巴黎方面发表声明，对中华人民共和国当局代表参与日内瓦和平会议感到十分不满，他们指责中共政府支持印度支那共产主义叛乱。"
 
 vin.83.t:0 "法国拒绝和平解决印度支那问题"
 vin.83.d:0 "法国政府宣布，他们拒绝英美苏等国提出的在印度支那进行停火的决议。巴黎表示，他们在印度支那已经经营了一百多年，对该地区的大部分资产享有主权，他们将继续采取军事行动予以保护。"
 
 vin.84.t:0 "越盟发动全面进攻"
 vin.84.d:0 "越南共产党的部队已向法军发动全面进攻！"
 
 vin.85.t:0 "美国宣布介入印度支那问题"
 vin.85.d:0 "美国国务院发表声明，美国政府高度关注越南共产党在印度支那的暴动和东南亚赤化的危险，表示该国已准备介入印度支那局势以对抗共产党扩张。"
 
