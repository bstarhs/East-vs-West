 vin.101.t:0 "越盟要求基于现状进行独立"
 vin.101.d:0 "越盟方面要求，基于现状实控地区进行谈判，越南北方由越盟建立政府，而越南南方可建立一个当地民主选举产生的民主政府。"
 
 vin.102.t:0 "越盟要求接管越南全部领土"
 
