 YUG_against_hoxha:0 "对抗霍查政权"
 YUG_against_hoxha_desc:0 "阿尔巴尼亚霍查当局不仅不愿与我国和平往来，还支持科索沃地区的暴动分子，我们也将采取行动还以颜色。"
 
 YUG_alb_titoist:0 "支持阿尔巴尼亚的铁托派"
 YUG_alb_titoist_desc:0 "莫斯科对东欧国家推行霸权主义，引起各国进步人士不满。阿尔巴尼亚也有许多人抵触莫斯科的控制及霍查当局的独裁统治，希望发展独立自主的外交政策，我们应该对他们提供支持，扩大南斯拉夫的影响力并削弱苏联对东欧的渗透。"
 
 YUG_KKE_focus:0 "支持希腊共产党"
 YUG_KKE_focus_desc:0 "希腊共产党正在与英美支持下的反动当局进行激烈的斗争，他们需要我们的帮助！"
 YUG_KKE_abandnon:0 "放弃希腊共产党"
 YUG_KKE_abandnon_desc:0 "经历了世界大战摧残的南斯拉夫需要和平，我国不应该将本就稀缺的资源和人力投入到希腊内战当中，更何况这可能引发与英国的全面战争的风险。"
 YUG_communism_greece:0 "扶持希腊民主共和国"
 YUG_communism_greece_desc:0 "希腊共产党已夺取希腊政权，作为希共最大的金主，我们应该在希腊共产党中施加我们的影响力，将新生的希腊民主共和国变成南斯拉夫的势力范围。"
 
 YUG_marshall_plan:0 "马谢尔计划"
 YUG_us_relation:0 "与美国的往来"
 
 YUG_claime_banat:0 "索取巴纳特"
 YUG_claime_banat_desc:0 "随着我国与罗马尼亚当局彻底翻脸，奥匈帝国时代留下的领土纠纷也将被摆上台面。巴纳特地区原是匈牙利王国的一个省，一战结束后，塞尔维亚王国获取了其东部，而罗马尼亚王国占领了西部大部分地区，现在我们要向巴纳特东部地区提出领土声索！"
 YUG_hydro_dam:0 "铁门水电站"
 YUG_hydro_dam_desc:0 "在多瑙河流经的南斯拉夫-罗马尼亚边境上，有一处十分适合建设水利设施的山谷，如果我们能与罗马尼亚政府达成协议，在此建造一座水电站，塞尔维亚中部的用电和农业灌溉将得到改善。"
 
 YUG_river_port:0 "发展内河航运"
 YUG_river_port_desc:0 "南斯拉夫扼守巴尔干半岛上所有的主要河流航道。多瑙河、萨瓦河、蒂萨河、摩拉瓦河从我国国土流过，应该开发这些河流的航运价值，以发展与巴尔干各国之间的贸易。"
 
 YUG_against_bul:0 "对抗保加利亚"
 YUG_against_bul_desc:0 "罗马尼亚当局追随莫斯科的霸权主义政策，不仅不愿与我国和平往来，还支持对我国的遏制和对抗，我们也将采取行动还以颜色。"
 YUG_develop_bul:0 "开发保加利亚"
 YUG_develop_bul_desc:0 "南斯拉夫已与保加利亚实现统一，我们将开发这片广阔的土地。无论是肥沃的耕地、丰富的煤炭还是发达的瓦尔纳港，都有投资的价值。"
 
 YUG_relation_rom:0 "交好罗马尼亚"
 YUG_relation_rom_desc:0 "我们应该改善与罗马尼亚的外交关系，争取两个社会主义国家之间的友好合作，以缓解国防压力，促进对外经贸发展，尽管两国在巴纳特问题上存在矛盾。"
 YUG_against_rom:0 "对抗罗马尼亚"
 YUG_against_rom_desc:0 "罗马尼亚当局追随莫斯科的霸权主义政策，不仅不愿与我国和平往来，还支持对我国的遏制和对抗，我们也将采取行动还以颜色。"
 
 YUG_balkan_federate:0 "巴尔干同盟"
 
 YUG_romanian_titoist:0 "支持罗马尼亚的非亲苏分子"
 YUG_romanian_titoist_desc:0 "莫斯科对东欧国家推行霸权主义，引起各国进步人士不满。罗马尼亚也有许多人抵触莫斯科的控制，希望发展独立自主的外交政策，我们应该对他们提供支持，扩大南斯拉夫的影响力并削弱苏联对东欧的渗透。"
 YUG_hun_titoist:0 "支持匈牙利的非亲苏分子"
 YUG_hun_titoist_desc:0 "莫斯科对东欧国家推行霸权主义，引起各国进步人士不满。匈牙利有许多人抵触莫斯科的控制，希望发展独立自主的外交政策，我们应该对他们提供支持，扩大南斯拉夫的影响力并削弱苏联对东欧的渗透。"
 YUG_cze_titoist:0 "支持捷克的非亲苏分子"
 YUG_cze_titoist_desc:0 "莫斯科对东欧国家推行霸权主义，引起各国进步人士不满。捷克斯洛伐克有许多人抵触莫斯科的控制，希望发展独立自主的外交政策，我们应该对他们提供支持，扩大南斯拉夫的影响力并削弱苏联对东欧的渗透。"
 YUG_bul_titoist:0 "支持保加利亚的非亲苏分子"
 YUG_bul_titoist_desc:0 "莫斯科对东欧国家推行霸权主义，引起各国进步人士不满。保加利亚有许多人抵触莫斯科的控制，希望发展独立自主的外交政策，我们应该对他们提供支持，扩大南斯拉夫的影响力并削弱苏联对东欧的渗透。"
 YUG_titoist_alliance:0 "苏南冲突公开化"
 YUG_titoist_alliance_desc:0 "莫斯科推行霸权主义，意图完全控制东欧国家，把我国变成对他们言听计从的傀儡！这是不可容忍的！我们将公开与莫斯科决裂，告诉俄国人，他们绝对不可能把南斯拉夫变成他们的仆从国！"
 
 YUG_uz_tita:0 "跟随铁托元帅"
 YUG_uz_tita_desc:0 "伟大的革命战士，游击英雄，社会主义南斯拉夫的缔造者约瑟普·铁托元帅，将用他的威望凝聚南斯拉夫各族人民！\n追随铁托元帅\n祖国英勇的儿子\n我们比地狱更强大！"
 
 YUG_monarchism_back:0 "卡拉乔治维奇的遗产"
 YUG_serbia_strong:0 "塞尔维亚强大"
 YUG_serbia_strong_desc:0 "今天的塞尔维亚人有一项首要和基本的责任——建立和组织一个统一的塞尔维亚，这个塞尔维亚必须由塞尔维亚人居住的整个民族领土组成。\n——斯特凡·米洛耶维奇，二战时期塞尔维亚民族主义政治家"
 YUG_disolve_yugoslav:0 "再见！南斯拉夫！"
 YUG_disolve_yugoslav_desc:0 "这个故事没有结局……\n请不要忘记，曾经有一个国家，叫南斯拉夫。"
 YUG_yugoslav_yugoslavia:0 "南斯拉夫人的南斯拉夫"
 YUG_yugoslav_yugoslavia_desc:0 "塞尔维亚已不再是南斯拉夫的主体民族，克罗地亚、斯洛文尼亚和波斯尼亚人的总和已经超过了塞尔维亚人，现在，让南斯拉夫真正属于南斯拉夫人！"
 
 YUG_chetnick:0 "切特尼克回归"
 YUG_latinized:0 "拉丁化官方文字"
 YUG_latinized_desc:0 "西里尔文字在南斯拉夫内只有塞尔维亚、黑山和马其顿人使用，但克罗地亚人、斯洛文尼亚人、波斯尼亚人、科索沃阿尔巴尼亚人和匈牙利人都是用拉丁字母。无论是基于人口、民族数量还是共和国的数量，拉丁文字都应当取代西里尔文，成为南斯拉夫的官方文字。"
 YUG_sagreb:0 "迁都萨格勒布"
 YUG_sagreb_desc:0 "克罗地亚人与斯洛文尼亚人已取得南斯拉夫的实际控制权，因此有必要将首都从塞尔维亚的贝尔格莱德迁移至新的中心。"
 
 YUG_novisad_agreetment:0 "诺维萨德协定"
 YUG_novisad_agreetment_desc:0 "语言纷争是南斯拉夫民族矛盾的一个体现，《诺维萨德协定》是二战后由塞尔维亚、克罗地亚、波斯尼亚、斯洛文尼亚和黑山等民族的语言学家共同制定的南斯拉夫各语言标准，包括将塞尔维亚-克罗地亚语认定为同一种语言。"
 YUG_bosniak:0 "波斯尼亚穆斯林族"
 YUG_bosniak_desc:0 "在南斯拉夫境内，尤其是波斯尼亚地区，生活着许多穆斯林人口，他们目前大部分被归纳为塞尔维亚或克罗地亚人，但实际上，他们的宗教信仰和生活方式都与塞-克族有明显不同。根据南斯拉夫民族划分的原则，应当将穆斯林人口单独划为一个民族。"
 YUG_dalmatian_autonomy:0 "达尔马提亚自治共和国"
 YUG_dalmatian_autonomy_desc:0 "达尔马提亚地区虽然属于克罗地亚自治共和国，但当地的塞尔维亚语人口占比也不少，如果可以将其从克罗地亚分离出来，单独建立一个自治共和国并支持塞尔维亚人进入其政府，就能大大强化塞尔维亚人在联邦的影响力。"
 YUG_language_reform:0 "官方语言改革"
 YUG_language_reform_desc:0 "将所谓的克罗地亚-塞尔维亚语定为唯一的官方语言是大塞尔维亚主义的体现，如果要实现各民族的平等，斯洛文尼亚语，波斯尼亚语，阿尔巴尼亚语和匈牙利语都应该获得同等的官方语言地位。"
 YUG_serbs_parliament:0 "塞尔维亚人的议会"
 YUG_serbs_parliament_desc:0 "我们将进一步加强塞尔维亚人在议会中的席位和权力，使得塞尔维亚人将完全控制南斯拉夫的政局。"
 YUG_croatian_parliament:0 "各民族的议会"
 YUG_croatian_parliament_desc:0 "议会中非塞尔维亚人，尤其是克罗地亚人和斯洛文尼亚人的席位和权力将得到加强，克族和斯族将逐渐取代塞尔维亚人掌握这个国家。"
 
 YUG_political_reform:0 "政治改革"
 YUG_political_reform_desc:0 "共产主义的影响力正不断削弱，南斯拉夫也出现了要求取消一党执政，开放反对党和民主选举的声音，我们是时候进行政治改革以确保我国能够顺应世界政治局势的变化。"
 YUG_allow_parties:0 "允许反对党"
 YUG_allow_parties_desc:0 "世界局势不断变化，社会主义制度已不再适合南斯拉夫，共产主义联盟的执政也将走到尽头，我们将进一步推行政治改革，允许民间成立新的政党。"
 YUG_cyllic_alphabet:0 "推广西里尔字母"
 YUG_cyllic_alphabet_desc:0 "塞尔维亚语和克罗地亚语本质上是一种语言，只不过前者使用西里尔字母，后者使用拉丁字母。通过向全国推广西里尔字母，以此扩大塞尔维亚语的影响力，尤其是挤压克罗地亚语的地位，是我们确保塞尔维亚统治地位的前提条件。"
 YUG_support_chatholics:0 "支持天主教"
 YUG_support_chatholics_desc:0 "哈布斯堡王朝三百年的统治，让克罗地亚人的文化日耳曼化。天主教、拉丁文字是克族的身份认同，也是他们与塞尔维亚人的差异所在。如果要人克罗地亚人感受到自己作为南斯拉夫的公民得到尊重，就需要恢复他们的天主教信仰自由。"
 YUG_support_orthodox:0 "支持东正教"
 YUG_support_orthodox_desc:0 "让我们谨记圣萨瓦的教诲，保护他的遗产，只有团结能拯救塞尔维亚人！\n上主，我们的希望\n愿祢保祐眷顾塞尔维亚的土地和人民！"
 YUG_support_islam:0 "承认伊斯兰教团体"
 YUG_support_islam_desc:0 "为了打压大塞尔维亚的影响力，尤其是遏止其在波斯尼亚和科索沃的发展，我们需要积极支持穆斯林和伊斯兰教的政治地位。"
 YUG_yugoslav_social_party:0 "支持南斯拉夫社会党"
 YUG_yugoslav_social_party_desc:0 "南斯拉夫即将迎来新的政治体制和政治局势，所有的塞尔维亚人必须团结在米洛舍维奇先生领导下的社会党，使其在新的国家中建立起塞尔维亚人的统治！"
 YUG_local_nationalists:0 "支持地方反对派"
 YUG_local_nationalists_desc:0 "我们需要支持克罗地亚、波斯尼亚和斯洛文尼亚等地的民主党派和反对党，共同对抗大塞尔维亚主义者控制下的南斯拉夫当局。"
 YUG_monarchs:0 "支持君主复辟"
 YUG_total_election:0 "全国大选"
 YUG_total_election_desc:0 "共产主义联盟的执政即将结束，南斯拉夫将举行全国大选，获得多数的政党将建立新的南斯拉夫政府。"
 YUG_republican_election:0 "共和国选举"
 YUG_republican_election_desc:0 "共产主义联盟的执政即将结束，各共和国将举行选举，并根据选举结果，各地将自主建立新的政府，"
 YUG_release_media:0 "传媒解禁"
 YUG_rankovich_gov:0 "兰科维奇政府"
 
 YUG_enterprise_autonomy:0 "提高企业自主权"
 YUG_enterprise_autonomy_desc:0 "政府将进一步削弱计划经济的影响力，减少对企业直接下达的生产计划，改为生产指标，当企业生产的产品超过指标时，多余的产品可以投入市场获得利润，企业将获得在生产和利润分配上更大的自主权。"
 YUG_enterprise_reform:0 "企业股份制改革"
 YUG_enterprise_reform_desc:0 "我国国有企业在经济体制改革之后开始失去活力，无法应对日益激烈的市场竞争。为了使国企能够应对市场经济带来的冲击，我们将实行国企改革，使企业自主，自负盈亏。"
 YUG_foreign_invest:0 "吸引外国投资"
 YUG_foreign_invest_desc:0 "随着我国的社会稳定、经济得到发展以及外交地位的加强，一些外国投资者希望进入我国市场投资。"
 
 YUG_anti_strike_committee:0 "反怠工委员会"
 YUG_anti_strike_committee_desc:0 "在新一次五年计划建设的关键时刻，我们不允许有人掉链子。反怠工委员会将监督和惩罚没有完成生产计划的生产单位。"
 
 YUG_develop_electronic:0 "发展电子产业"
 YUG_develop_electronic_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一。随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。"
 YUG_nuclear_power:0 "发展核能"
 YUG_nuclear_power_desc:0 "核子裂变释放出来的能量摧毁了广岛和长崎，也将人类带入一个全新的时代。核技术有着巨大的运用价值，它可以制造毁灭性的可怕武器，也可以用来提供无尽的清洁能源，甚至运用到生物化学领域。\n原子能的释放改变了除人类思维方式以外的一切。\n——阿尔伯特·爱因斯坦"
 YUG_autos_focus:0 "YUGO牌汽车"
 YUG_autos_focus_desc:0 "随着全球汽车产量增加和汽车技术的发展，汽车已不再是一种富人专属的奢侈品，而实进入中产阶层，成为一种重要的消费品。我国的汽车依然高度依赖进口，因此我们需要发展汽车工业，不仅是为了满足消费需求，也是为了让国家更快实现汽车国产、加速经济和工业发展。"
 YUG_agriculture:0 "发展农业"
 YUG_agriculture_desc:0 "第二次世界大战几乎摧毁了我国的大量耕地，全国各地粮食告急，我们需要尽快恢复农业生产。"
 YUG_agriculture_mechanized:0 "农业机械化"
 YUG_agriculture_mechanized_desc:0 "改善农业生产，不仅需要合理的土地制度，且需要现金的农业技术。水利、农药、化肥、配种和机械化，这些都是农业现代化不可缺少的。"
 YUG_plastic:0 "发展化工业"
 YUG_plastic_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 YUG_refinery:0 "发展炼油业"
 YUG_manufacture_2:0 "发展制造业 II"
 YUG_manufacture_2_desc:0 "在具备进一步工业能力后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 YUG_manufacture_3:0 "发展制造业 III"
 YUG_manufacture_3_desc:0 "在具备较为完善的工业能力后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 
 YUG_buy_plane:0 "购买战斗机"
 YUG_buy_plane_desc:0 "我们目前没有自行生产战斗机的能力，但我们可以向友好国家购买现成的战斗机来建立我们的空军。"
 YUG_jet_1:0 "发展喷气机"
 YUG_jet_1_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 YUG_jet_2:0 "发展现代战斗机"
 YUG_jet_2_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 YUG_transfer:0 "发展运输机"
 YUG_transfer_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 YUG_bomber:0 "发展轰炸机"
 YUG_bomber_desc: "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 YUG_airbase_serbia:0 "东部空军基地"
 YUG_airbase_serbia_desc:0 "我们需要扩大塞尔维亚地区的机场和基础设施来承载我们的空军，以保护我们的领空。"
 YUG_airbase_south:0 "南部空军基地"
 YUG_airbase_south_desc:0 "我们需要扩大马其顿和科索沃地区的机场和基础设施来承载我们的空军，以保护我们的领空。"
 YUG_airbase_dalmatia:0 "海岸空军基地"
 YUG_airbase_dalmatia_desc:0 "我们需要扩大斯洛文尼亚和达尔马提亚地区的机场和基础设施来承载我们的空军，以保护我们的领空和亚得里亚领海。"
 YUG_airbase_north:0 "北部空军基地"
 YUG_airbase_north_desc:0 "我们需要扩大伏伊夫伏那和科索沃地区的机场和基础设施来承载我们的空军，以保护我们的领空。"
 YUG_airborn:0 "发展空降部队"
 YUG_airborn_desc:0 "飞机航程和载荷的发展开辟了许多可能性。运输机可以在敌人战线的大后方投下一整个师的部队，在那里他们可以造成严重破坏。"
 
 YUG_buy_ship:0 "购买水面舰艇"
 YUG_buy_ship_desc:0 "我们目前还没有建造舰船的能力，但我们可以向其他国家购买退役的舰艇。"
 YUG_light_ships:0 "发展轻型舰艇"
 YUG_light_ships_desc:0 "我们的海军刚刚起步，至少需要一些护卫舰和驱逐舰来保护我们的领海。"
 YUG_medium_ships:0 "发展中型舰艇"
 YUG_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 YUG_heavy_ships:0 "发展大型舰艇"
 YUG_heavy_ships_desc:0 "我们的海军已经成长壮大，我们需要发展可以搭载更多设备和飞机的大型舰艇来强化作战能力。"
 YUG_buy_submarines:0 "购买潜艇"
 YUG_buy_submarines_desc:0 "我们目前还没有建造潜艇的能力，但我们可以向其他国家购买退役的潜艇。"
 YUG_submarines:0 "发展潜艇"
 YUG_submarines_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 YUG_naval_base_dalmatia:0 "斯普利特海军基地"
 YUG_naval_base_dalmatia_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。达尔马提亚的斯普利特是建设海军基地的理想地点。"
 YUG_naval_base_titograd:0 "黑山海军基地"
 YUG_naval_base_titograd_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。黑山沿海是建设海军基地的理想地点。"
 YUG_naval_base_rijeka:0 "里耶卡海军基地"
 YUG_naval_base_rijeka_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。里耶卡在意大利统治时期就是重要的海军基地，我们将进一步开发里耶卡港。"
 YUG_marines_focus:0 "发展两栖部队"
 YUG_marines_focus_desc:0 "擅长两栖作战的部队越来越不可或缺。临时拼凑的手段、装备已经成为历史，我方海军陆战兵现在已接受相关训练并拥有专属登陆舰船支持。"
 
 YUG_military_industry_2:0 "军事工业 II"
 YUG_military_industry_3:0 "军事工业 III"
 YUG_buy_weapons:0 "购买外国武器"
 YUG_buy_weapons_desc:0 "我国的军事工业目前还很落后，没有自己生产军火的能力，但我们可以向其他国家购买退役的武器。"
 YUG_armors:0 "发展装甲部队"
 YUG_armors_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 YUG_mechanized:0 "发展机械化部队"
 YUG_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 YUG_develop_weapons:0 "成立装备发展部"
 YUG_develop_weapons_desc:0 "从步兵的头盔和背心，再到坦克上的火控系统和动力系统，先进的作战装备往往主导着战场。"
 
 YUG_sov_intel:0 "苏联情报援助"
 YUG_sov_intel_desc:0 "我们应当邀请苏联情报部门来为我国提供情报援助。"
 YUG_cooperate:0 "苏联军事援助"
 YUG_cooperate_desc:0 "我们可以请求苏联政府为我们提供军事援助，包括援助
 
 YUG_nationalized:0 "工业国有化"
 YUG_nationalized_desc:0 "在从资本主义社会过渡到共产主义社会之前，党和国家将以国有企业的形式管理我国的重要生产资料。"
 YUG_plan:0 "五年计划"
 YUG_plan_desc:0 "我们将开始实行第一个五年计划，以快速改善我国的落后局面。"
 YUG_nkvd:0 "内务委员会"
 YUG_nkvd_desc:0 "我们要建立专门的机构，调查、监视、逮捕反革命分子和帝国主义间谍。"军事装备和军事顾问。"
 
 YUG_expanded_soldiers:0 "扩大征兵"
 YUG_expanded_soldiers_desc:0 "现在是国家军力扩大的关键时期，我们要求每个成年男子都为国家献出力量。"
 
 YUG_people_republic:0 "人民共和国"
 YUG_people_republic_desc:0 "纳粹法西斯已被打倒，卡拉乔治维奇家族的君主逃之夭夭，我们将在铁托元帅领导下，建立统一的、社会主义的，更强大的南斯拉夫社会主义联邦共和国！"
 YUG_economic:0 "经济政策"
 YUG_labor_management:0 "工人自治"
 YUG_labor_management_desc:0 "斯大林式的经济体制下，党政官僚以行政命令来直接下达生产计划，干涉工厂管理，扼杀了工人阶级的管理能力和生产效率。南斯拉夫将发展独特的社会主义经济制度，官僚不应该干预生产，工人们将以民主形式直接参与工厂的管理和决策，选举厂长，自行决定利润分配，并通过利润来激励生产。"
 YUG_cooperative:0 "农业合作社"
 YUG_cooperative_desc:0 "合作社可以将分散的农户合并起来，在保留私人财产的情况下分享劳动工具。"
 YUG_land_reform:0 "土地改革"
 YUG_land_reform_desc:0 "在农业社会工业化的过程中，在旧时代等同于权力、地位和财富的土地必须被彻底地流动起来。无论是以商品化改革的形式，还是以公有化改革的形式，一切以土地为核心的旧社会阶层都要被新的商品经济完全地消灭，其财产成为投资的资本，农民人口成为工人预备队。如此是为土地改革的最终目的。"
 YUG_PKB:0 "PKB农业联合体"
 YUG_house:0 "住房建设"
 YUG_social_management:0 "自治经济"
 YUG_social_management_desc:0 "我们需要从斯大林模式中吸取教训，高度的政府管控只会扼杀工人阶级的生产积极性，应该进一步向国有企业放权，允许企业自主决定生产计划，并支持市场经济，从而最大限度发挥社会主义市场经济的活力。"
 YUG_social_plant_sconomic:0 "社会市场经济"
 YUG_social_plant_sconomic_desc:0 "受斯大林模式的影响，许多人认为市场就是资本主义，只有计划经济才是社会主义。这显然是错误的。列宁早在斯大林之前就通过引入市场经济提高了苏俄的生活水平。我们为什么不试试呢？"
 YUG_soviet_mode:0 "苏联模式"
 YUG_soviet_mode_desc:0 "在斯大林模式的指导下，苏联人民不仅在短短十年内把俄罗斯变成了工业强国，而且还战胜了法西斯。我们要摆脱贫困，进入工业化和现代化，就必须学习苏联人民的先进经验。"
 YUG_collectivization:0 "集体化"
 YUG_collectivization_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 YUG_1947_plant:0 "1947年经济计划"
 YUG_1947_plant_desc:0 "世界大战已经严重损害了我国的基础工业，尤其是消费品制造。我们必须迅速恢复经济生产，以满足人民对消费品的需求。"
 YUG_1957_plant:0 "1957年经济计划"
 YUG_1957_plant_desc:0 "在具备初步工业能力后，我们需要满足我们人民对生活消费品的需求。"
 YUG_west_tech:0 "引进西方技术"
 YUG_west_tech_desc:0 "随着我们与西方国家改善关系，我们应该尝试引进西方投资，尤其是引进他们的技术，以改善我国生产技术的落后局面。"
 YUG_bor_copper_mine:0 "博尔铜矿"
 YUG_Smederevo_steel:0 "斯梅代雷沃钢铁厂"
 YUG_Smederevo_steel_desc:0 "斯梅代雷沃钢铁厂始建于奥匈帝国，曾经是巴尔干地区最大的钢铁厂，但两次世界大战对钢铁厂带来了严重破坏。我们不仅要尽快恢复钢铁厂的生产，还需要扩大其规模和产量，使其足以满足我国的钢铁需求。"
 YUG_anti_grand_serbian:0 "反对大塞尔维亚主义"
 YUG_anti_grand_serbian_desc:0 "就如同铁托元帅说的一样，南斯拉夫属于南斯拉夫的每一个民族，而不再是塞尔维亚民族主义者进行霸权统治的工具，然而，依然有一些大塞尔维亚主义者，使徒扩大并建立他们的政治垄断，为了保护非塞尔维亚民族的利益，我们需要与他们对抗，最好限制他们的膨胀的政治影响力。"
 YUG_anti_localism:0 "反对地方主义"
 YUG_anti_localism_desc:0 "为了维护南斯拉夫的团结与统一，我们将以法律手段打压地方上的民族主义者，任何人都不许再别有用心地讨论这个民族或那个民族的话题！"
 YUG_more_republic:0 "细化共和国"
 YUG_more_republic_desc:0 "为了进一步削弱大塞尔维亚主义，我们将给予科索沃和伏伊伏丁那自治权。"
 YUG_croatian_spring:0 "克罗地亚之春"
 YUG_croatian_spring_desc:0 "克罗地亚之春是70年代克罗地亚兴起的政治运动，即主张克罗地亚自治共和国获得更多的自主权，并实行自由主义的经济改革使国家经济重心更偏向克罗地亚。"
 YUG_liberazation:0 "经济自由化"
 YUG_liberazation_desc:0 "南斯拉夫式的社会主义市场经济制度将进一步发展。我们将减少政府的行政干预，让市场自由运行从而刺激经济增长。政府的腐败、政治混乱和官僚主义使得他们无法有效管理经济，因此让市场无形的大手来促进经济系统自我调节才是最好的办法。政府干预越少，经济运行越好。"
 YUG_army:0 "人民军"
 YUG_army_desc:0 "在反法西斯的游击战争中建立的南斯拉夫游击队，将改组为南斯拉夫人民军，并保卫新生的南斯拉夫社会主义联邦共和国！"
 YUG_army_industry:0 "军事工业"
 YUG_army_industry_desc:0 "世界军事技术正在不断地发展，我们必须保证我国的军事力量不能落后世界。"
 YUG_nuke:0 "核计划"
 YUG_nuke_desc:0 "核武器的出现彻底改变了人类社会，这种强大的武器结束了二战，但也让20世纪后半页的人民无比担忧第三次世界大战的爆发，因为这种超级武器将有摧毁世界的危险。美国和苏联在二战后分别开发了核武器，作为对抗的筹码，核平衡一定程度上阻止了第三次世界大战。核武器是话语权的象征，只有掌握和武器才不会遭受超级大国的威胁，才有资格在国际社会中不成为棋子，并有威胁其他国家的能力。    "
 YUG_territory_force:0 "联邦边防军"
 YUG_territory_force_desc:0 "联邦边防军是南斯拉夫武装力量的辅助部队，由各共和国自行组织。"
 YUG_security:0 "国家情报局"
 YUG_autonomic_desc:0 "历史的经验教训表明，一个高度中央集权的南斯拉夫，只会成为大塞尔维亚主义者打压其他民族的工具，因此南斯拉夫应当建立联邦制度，各共和国拥有经济和文化的内部自治权，贝尔格莱德不得干涉，以保护各民族的权益。"
 YUG_airforce:0 "人民空军"
 YUG_airforce_desc:0 "，一支合格的空军是一支现代军队必不可少的，至少我们要保证我们头上的飞机不是敌人的。"
 YUG_airdefence:0 "发展防空力量"
 YUG_airdefence_desc:0 "不要试图挑衅塞尔维亚人\n否则你将失去你的黑色高级轰炸机"
 YUG_navy:0 "人民海军"
 YUG_navy_desc:0 "我们需要重建并发展南斯拉夫海军，并保护我们的亚德里亚领海。"
 YUG_navybase:0 "加强海军建设"
 YUG_youth_league:0 "社会主义青年联盟"
 YUG_youth_league_desc:0 "社会主义青年联盟是共产主义事业的接班人，培养少先队就是培养党和社会主义的未来。"
 YUG_autonomic:0 "兄弟情与和平"
 YUG_autonomic_desc:0 "大塞尔维亚主义是政治错误，一个过于强大的主体民族会威胁南斯拉夫的团结与稳定，只有让我国的各大民族实现完全的平等，才能让联盟永存。"
 YUG_denationalized:0 "个体经济"
 YUG_transition:0 "经济体制改革"
 YUG_grand_serbian:0 "大塞尔维亚"
 YUG_grand_serbian_desc:0 "南斯拉夫联邦是塞尔维亚人建立的，兄弟情与统一只是政治口号，我们的主体民族是塞尔维亚人，语言是塞尔维亚语，自然也应该让塞尔维亚人成为这个国家真正的主人。"
 YUG_culture:0 "文化统一"
 YUG_culture_desc:0 "如果继续放任斯洛文尼亚人和克罗地亚人支持天主教，放任波斯尼亚人和科索沃人支持伊斯兰教，那么他们迟早会成为国家分裂的定时炸弹。统一的国家需要统一的文化，塞尔维亚人主掌下的南斯拉夫当然需要推广塞尔维亚人的语言、塞尔维亚人的宗教和塞尔维亚人的生活方式。"
 YUG_united_parties:0 "整合南斯拉夫共产主义联盟"
 YUG_cancel_automatic:0 "削弱自治权"
 YUG_cancel_automatic_desc:0 "我们给予了克罗地亚人和斯洛文尼亚人太大的自治权，经济、政治和军事政策几乎完全无法下达地方，以至于让南斯拉夫简直不像一个正常的统一国家。必须结束这种局面，我们将逐步收回地方共和国的自治权力，以重新确立贝尔格莱德的中央集权。"
 YUG_united_yugoslava:0 "兄弟情与统一"
 YUG_united_yugoslava_desc:0 "尽管南斯拉夫联盟是属于所有民族的共同祖国，但一个家庭不能没有兄长，应当维持主体民族塞尔维亚人在文化和政治领域的优势影响力，才能抵抗潜在的分离主义。"
 YUG_diplomatic:0 "外交政策"
 YUG_diplomatic_desc:0 "南斯拉夫必须尽快开展外交事务，争取世界各国政府对社会主义南斯拉夫的认可和支持。"
 YUG_united:0 "巴尔干联邦"
 YUG_united_desc:0 "将南斯拉夫、保加利亚、阿尔巴尼亚乃至希腊统一为一个大巴尔干联邦，一直是南斯拉夫政治家的野心之一。进入50年代，铁托开始加强与保加利亚和阿尔巴尼亚的关系，从而实现这一愿景。"
 YUG_independent:0 "独立的外交政策"
 YUG_independent_desc:0 "莫斯科把自己看作社会主义阵营的领导人，无视我们的外交独立和自治。如果我们不愿意成为卫星国家，我们就必须寻求新的外交友谊。"
 YUG_ALB:0 "与阿尔巴尼亚关系"
 YUG_ALB_desc:0 "我们应该改善与阿尔巴尼亚的外交关系，争取两个社会主义国家之间的友好合作，以缓解国防压力，促进对外经贸发展，尽管两国在科索沃问题上存在矛盾。"
 YUG_GRE:0 "与希腊和土耳其关系"
 YUG_GRE_desc:0 "我们应该改善与希腊和土耳其的外交关系，争取三国之间的友好合作，以缓解国防压力，促进对外经贸发展，尽管我们与希腊在马其顿问题上存在矛盾。"
 YUG_BUL:0 "与保加利亚关系"
 YUG_BULdesc:0 "我们应该改善与保加利亚的外交关系，争取两个社会主义国家之间的友好合作，以缓解国防压力，促进对外经贸发展，尽管两国在马其顿问题上存在矛盾。"
 YUG_balkan_treaty:0 "巴尔干条约"
 YUG_balkan_treaty_desc:0 "随着南斯拉夫与苏联关系的不断恶化，铁托开始与西方国家靠拢。“巴尔干条约”是以南斯拉夫、希腊和土耳其为主的军事同盟条约，这一条约意味着南斯拉夫将与西方国家形成同盟。"
 YUG_nato:0 "加入北约"
 YUG_nato_desc:0 "苏联霸权主义对我们施加的军事威胁，迫使我们选择一条未曾设想的道路。南斯拉夫将成为第一个加入北大西洋公约的共产主义国家，毫无疑问，国家利益绝对大于意识形态！"
 YUG_third_world:0 "亲近第三世界"
 YUG_third_world_desc:0 "随着殖民体系的瓦解，亚非许多国家独立建立了新的国家。我们必须尽快与这些国家建立良好关系。"
 YUG_EAST_EUROPE:0 "东欧关系"
 YUG_EAST_EUROPE_desc:0 "自从苏联成立以来，社会主义阵营就秉持着支持全球民族解放运动，打击帝国主义的外交策略。这与我们政权的国际利益不谋而合。"
 YUG_non_alieged:0 "不结盟运动"
 YUG_non_alieged_desc:0 "美国和苏联正在努力将世界各国纳入其势力范围，这将扩大意识形态冲突，加剧战争威胁。我们呼吁不结盟运动和建立一个全球组织，抵制与强国结盟。"
 YUG_pro_soviet:0 "亲近苏联"
 YUG_pro_soviet_desc:0 "伟大的苏维埃社会主义共和国联盟已经成为社会主义国家和第三世界独立国家最坚定的盟友，我们将坚定地和莫斯科的同志们站在一起，对抗帝国主义和殖民主义！"
 YUG_comecon:0 "加入经互会"
 YUG_comecon_desc:0 "社会主义阵营的全球经济秩序建立在“产业互助”原则上。简而言之就是社会主义阵营以无偿或低偿援建、援助的形式投资盟国的工业发展，以此增加盟国的消费力和无产阶级人口并签订各种联盟条约。"
 YUG_warsaw:0 "加入华沙条约"
 YUG_warsaw_desc:0 "帝国主义国家正不遗余力地寻求颠覆欧洲的社会主义国家，而华沙条约组织将保护我们不被侵犯。"
 YUG_anti_colonies:0 "支持反殖民运动"
 cYUG_anti_colonies_desc:0 "亚非拉人民反对殖民者，争取民族独立，我们应该支持他们。"
 YUG_railway:0 "南斯拉夫国铁"
 YUG_railway_desc:0 "通过铁路来将全国各地与首都连接起来，以发展经济，强化中央集权。"
 YUG_youth_work:0 "青年工作队"
 YUG_youth_work_desc:0 "作为社会主义国家教育的一部分，青年学生将被动员参加工程建设，不仅可以锻炼学生们的体能，让他们学习工作技能，切身体会工人阶级的伟大创造，只有亲身经历社会主义建设，才能认识和认可社会主义制度。"
 YUG_Spomenik:0 "人民纪念碑"
 YUG_Spomenik_desc:0 "人民纪念碑是南斯拉夫政府建造的大量现代主义和未来主义风格的纪念碑，主要纪念二战时期南斯拉夫人民反抗法西斯的历次战斗。这些纪念碑都采用了与众不同的粗野主义和未来主义风格，而非传统的雕像等形式。铁托认为传统形式的纪念碑会与民族主义挂钩，因而希望未来主义式的纪念碑会成为统一南斯拉夫文化的一部分。"
 YUG_medic:0 "改善医疗服务"