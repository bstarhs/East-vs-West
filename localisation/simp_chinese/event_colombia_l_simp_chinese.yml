l_simp_chinese:
 col.1.t:0 "哥伦比亚总统选举即将开始!"
 col.1.d:0 "1948年的哥伦比亚即将举行总统大选，对该国进行了数年独裁统治的保守党为了赢得选举，正不遗余力打压左翼的自由党，但自由党的领导人豪尔赫·埃利塞尔·盖坦拥有巨大的声望，他正寻求工人阶级和知识分子的支持，希望赢得选举。"
 col.1.a:0 "让我们看看接下来会发生什么。"
 
 col.2.t:0 "豪尔赫·盖坦遭到刺杀！"
 col.2.d:0 "令人震惊的消息从哥伦比亚传来。哥伦比亚自由党领导人豪尔赫·埃利塞尔·盖坦被刺杀，他在回家路上被一名抢手开枪射击后，送到医院不治身亡。豪尔赫·盖坦是受到哥伦比亚民众支持的自由派领导人，人民期待他在今年的总统大选中获胜，他的死亡激怒了哥伦比亚民众，首都波哥大和多个地区爆发了大规模的示威游行。"
 col.2.a:0 "让我们看看接下来会发生什么。"
 
 col.3.t:0 "豪尔赫·盖坦躲过刺杀！"
 col.3.d:0 "来自哥伦比亚首都波哥大消息，该国自由党领导人豪尔赫·埃利塞尔·盖坦惊险地躲过了一次刺杀，他在下班途中遭遇枪手袭击，但没有受到致命伤，枪手被盖坦的同行者抓捕，盖坦本人送医治疗后宣布无大碍。这一刺杀事件发生在哥伦比亚大选前夕，此时保守党已经实行了近三年的独裁统治，因此哥伦比亚民众之间很快传出了各种阴谋论。"
 col.3.a:0 "让我们看看接下来会发生什么。"
 
 col.4.t:0 "自由党赢得哥伦比亚总统大选！"
 col.4.d:0 "经过激烈角逐，豪尔赫·埃利塞尔·盖坦领导下的自由党赢得哥伦比亚大选，结束保守党近三年的独裁统治。豪尔赫·盖坦作为一位左翼政治家，支持改善工人地位，进行土地改革，发展本国工业和反对外国资本。与此同时，哥伦比亚国内的右翼势力依然强大，豪尔赫能否成功执政还是未知数。"
 col.4.a:0 "让我们看看接下来会发生什么。"
 
 col.5.t:0 "保守赢得哥伦比亚总统大选！"
 col.5.d:0 "哥伦比亚大选结果出炉，保守党不出意外地赢得了选举，继续他们的统治，在豪尔赫·盖坦遇刺身亡后，自由党遭到严重削弱，似乎已经没有人能够动摇保守党的统治。然而，哥伦比亚国内的自由派、左派和底层阶级已经对保守党到了忍耐的边缘。"
 
 col.6.t:0 "哥伦比亚的政局变换"
 col.6.d:0 "哥伦比亚发生政治变动，豪尔赫·盖坦和他的自由党成立了政府，这是一个鼓吹左派政策且亲共的政权，将对我们在拉丁美洲的势力范围带来威胁。中情局建议我国迅速进行干涉，尽可能破坏或颠覆豪尔赫政权。"
 
 col.7.t:0 "保守派的暴动"
 col.7.d:0 "豪尔赫总统的一系列政策引起了既得利益者的不满，军方、大种植园主、垄断资本家和保守党支持的反革命运动在崛起，他们组织和支持的暴动频发，给我们的政府带来巨大的麻烦。"
 
 col.8.t:0 "军事政变！"
 col.8.d:0 "紧急情况！军方一支部队突然闯入首都波哥大，迅速控制了广播电台、政府机关等地，并包围了总统府。军方受到右翼势力指使，他们指责豪尔赫总统的一系列改革已经破坏了哥伦比亚的国家体制和社会稳定，他们要求豪尔赫总统辞职，否则将采取武力。"
 
 col.9.t:0 "哥伦比亚军事政变！"
 col.9.t:0 "来自波哥大的紧急消息！武装部队发动政变，控制了首都波哥大并包围总统府，要求左翼总统豪尔赫·盖坦下台。豪尔赫为避免引发全国内战，被迫宣布辞职，并流亡海外。军方控制了全国的政权，古斯塔沃·罗哈斯·皮尼利亚将军宣布就任军政府临时总统。"
 
 col.10.t:0 "哥伦比亚内战爆发！"
 
 col.11.t:0 "自由派暴动！"
 col.11.d:0 "支持自由党的民众对政府忍耐已到极限，他们开始组织武装团体发起暴动。"
 
 col.12.t:0 "哥伦比亚共产党暴动！"
 col.12.d:0 "支持共产党的左派民众对政府忍耐已到极限，他们开始组织武装团体发起暴动。"
 
 col.13.t:0 "1950年哥伦比亚大选！"
 
 
 col.30.t:0 "对军政府的日益不满"
 col.30.d:0 "古斯塔沃·罗哈斯·皮尼亚拉将军领导下的哥伦比亚军政府不仅没有达成他们上台之初的承诺，没能推进哥伦比亚民主化和经济的发展，相反，当局的腐败和独裁问题愈发严重。哥伦比亚民间对军政府的不满情绪不断恶化。"
 
 col.31.t:0 "反动派掀起反对活动"
 col.31.t:0 "反对哥伦比亚军政府的政治运动继续发酵，以前任外交部长吉列尔莫·莱昂·瓦伦西亚为首的反对党正推动更进一步的民主运动，要求军政府辞职下台。"
 
 col.32.t:0 "哥伦比亚反对派领导人被捕！"
 col.32.d:0 "来自波哥大的消息！\n\n哥伦比亚军政府逮捕了民主势力的领袖、外交部长吉列尔莫·莱昂·瓦伦西亚。瓦伦西亚被指责支持颠覆势力被捕入狱。此事激怒的哥伦比亚民众和其他反对军政府的势力，未来可能会爆发更严重的政治危机！"
 
 col.33.t:0 "波哥大爆发大规模示威游行！"
 col.33.d:0 "古斯塔沃·罗哈斯·皮尼亚拉将军领导下的哥伦比亚军政府不仅没有达成他们上台之初的承诺，没能推进哥伦比亚民主化和经济的发展，相反，当局的腐败和独裁问题愈发严重。哥伦比亚民间对军政府的不满情绪不断恶化。"
 
 col.34.t:0 "示威者包围总统府"
 col.34.d:0 "愤怒的示威人群包围了波哥大总统府，要求古斯塔沃·皮尼亚拉辞职下台！"
 
 col.35.t:0 "教会呼吁军方辞职！"
 col.35.d:0 "天主教会致信，要求古斯塔沃·皮尼亚拉辞职下台！"
 
 col.36.t:0 "军方内部的兵谏"
 col.36.d:0 "军方内部的反对派致信，要求古斯塔沃·皮尼亚拉辞职下台！"
 
 col.37.t:0 "哥伦比亚政治变动"
 col.37.d:0 "哥伦比亚爆发的政治动荡，以古斯塔沃·罗哈斯·皮尼亚拉将军在民众、教会及军方内部反对派压力下，宣布辞职下台告终。哥伦比亚军方宣布释放吉列尔莫·莱昂·瓦伦西亚等民主派政治家，成立以Gabriel París Gordillo将军为首的过度军政府，处理哥伦比亚政治民主化的问题。"
 
 col.30.t:0 "对军政府的日益不满"