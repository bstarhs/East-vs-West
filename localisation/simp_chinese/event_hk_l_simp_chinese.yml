l_simp_chinese:
 hkn.1.t:0 "工会罢工"
 
 hkn.5.t:0 "亲共团体暴动！"
 
 hkn.6.t:0 "亲共团体制造炸点袭击！"
 
 hkn.7.t:0 "左派暴动结束"
 
 hkn.8.t:0 "沙头角冲突！"
 
 hkn.10.t:0 "中国军队开始进攻香港"
 hkn.10.d:0 "在谈判宣告失败后，中国人民解放军决定采取军事行动，武力占领香港。"
 
 hkn.20.t:0 "香港石硖尾爆发严重火灾！"
 hkn.20.d:0 "香港九龙半岛的石硖尾木屋区发生重大火灾，火灾迅速席卷了大半个九龙半岛，造成3人死亡，两千余人无家可归。"
 
 
 
 hkn.30.t:0 "香港九龙发生警民冲突"
 hkn.30.d:0 "英属香港发生警察与群众的暴力冲突，亲国民党的团体在大厦外悬挂青天白日旗以庆祝中华民国国庆时，被当局要求撤下，双方发生激烈冲突，最后警方逮捕了多名亲国民党人士。"
 
 hkn.31.t:0 "亲国民党团体包围深水埗警署"
 hkn.31.d:0 "亲国民党的示威者包围了深水埗警署，要求释放数日前被捕人士。"
 
 hkn.32.t:0 "香港当局向亲国民党团体妥协"
 hkn.32.d:0 "香港警察在示威者的压力下，被迫释放了数日前被逮捕的亲国民党人士。"
 
 hkn.33.t:0 "左派团体不满"
 hkn.33.d:0 "香港各大左派亲共团体发起示威游行，反对释放被逮捕的亲国民党人士，指责香港当局纵容反动势力。"
 
 hkn.34.t:0 "香港左派团体发起示威游行"
 hkn.35.d:0 "香港各大左派亲共团体发起示威游行，反对释放被逮捕的亲国民党人士，指责香港当局纵容反动势力。"
 
 hkn.35.t:0 "左派团体暴力冲击警署"
 hkn.35.d:0 "香港警方与亲共势力的矛盾激化，亲共分子向警署和政府机关发起冲击，多人伤亡。"
 
 
 hkn.36.t:0 "香港当局与亲国民党团体的对话破裂"
 hkn.36.d:0 "香港当局与亲国民党团体的谈判以失败告终，香港警方拒绝释放被逮捕的亲国民党分子。"
 
 hkn.37.t:0 "亲国民党势力发起示威游行"
 hkn.37.d:0 "香港各大左派亲共团体发起示威游行，要求释放被逮捕的亲国民党人士，指责香港当局纵容亲共势力。"
 
 hkn.38.t:0 "亲国民党示威者暴力冲击警署"
 hkn.38.d:0 "香港警方与亲共势力的矛盾激化，国民党向警署和政府机关发起冲击，多人伤亡。"
 
 hkn.39.t:0 "香港左右派势力爆发械斗"
 hkn.39.d:0 "香港左右派之间的矛盾演变成全面骚乱，亲共势力和亲国民党势力在香港多地爆发武装械斗，多人受伤。"
 
 hkn.40.t:0 "瑞士驻香港领事遇袭"
 hkn.40.d:0 "香港爆发大规模暴动，瑞士驻香港领事的座驾在旺角遭到不明人士袭击。"
 
 hkn.41.t:0 "香港方面请求英军支援！"
 hkn.41.d:0 "香港方面请求英军支援！"
 
 hkn.42.t:0 "香港宣布戒严"
 hkn.42.d:0 "香港左右派之间的矛盾演变成全面骚乱，英国政府正式宣布香港进行全面戒严，并派出英军进入香港平乱。"
 
 
 hkn.30.t:0 "香港九龙发生警民冲突"
 
