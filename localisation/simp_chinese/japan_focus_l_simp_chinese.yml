 JAP_join_UN:0 "加入联合国"
 JAP_southern_emperor:0 "南朝天皇"
 JAP_total_constituted:0 "完全的象征天皇制"
 
 JAP_militarist_propaganda:0 "军国主义宣传"
 JAP_militarist_propaganda_desc:0 "为了复兴帝国，我们必须向国民大众灌输忠君爱国的传统美德，使得所有人清楚的意识到战争的必要性。"
 JAP_call_soldiers:0 "恢复征兵制"
 JAP_great_japan_party:0 "大日本爱国党"
 JAP_great_japan_party_desc:0 "大日本爱国党是由极右翼分子赤尾敏创立的极右翼社会团体，主张为日本帝国主义翻案，且鼓吹推翻美国控制和日本民主政府，重建极权主义政体。"
 JAP_support_kishi:0 "支持岸信介"
 JAP_unificated_right:0 "右派的联合"
 JAP_support_nishio:0 "支持西尾未广"
 JAP_support_katayama:0 "支持片山哲"
 JAP_support_asanuma:0 "支持浅沼稻次郎"
 JAP_anti_corrupt:0 "打击腐败"
 JAP_anti_corrupt_desc:0 "经济的迅速发展催生了腐败，一些官员尸位素餐、收取贿赂、盗窃国家财产，我们必须采取强硬手段整治贪腐，来保护经济建设的成果。"
 JAP_disable_railway_union:0 "瓦解铁路工会"
 
 JAP_develop_tourism:0 "发展旅游业"
 JAP_develop_tourism_desc:0 "「高山不识季节令，五月已末仍铺雪。盖因雪落富士山，不觉斑驳如鹿身。」\n——《伊势物语》"
 JAP_develop_agriculture:0 "发展农业"
 JAP_develop_agriculture_desc:0 "改善农业生产，不仅需要合理的土地制度，且需要先进的农业技术。水利、农药、化肥、配种和机械化，这些都是农业现代化不可缺少的。"
 JAP_develop_hokkaido:0 "开发北海道"
 JAP_develop_hokkaido_desc:0 "上野発の夜行列車おりた時から\n青森駅は 雪の中\n北へ帰る人の群れは　誰も無口で\n海鳴りだけを　闻いている"
 JAP_develop_kyushyu:0 "建设九州地区"
 JAP_develop_kyushyu_desc:0 "九州是日本文明和日本海军的发源地，这里无论是自然资源、文化资源还是人力资源都值得我们投资开发。"
 JAP_develop_okinawa:0 "建设冲绳地区"
 JAP_electro_project:0 "电力发展五年计划"
 JAP_electro_project_desc:0 "电力是现代工业的基础，我们在重建我们的工业生产前，应当先满足对电力供应的需求。"
 JAP_steel_making:0 "发展钢铁产业 I"
 JAP_steel_making_desc:0 "以质量计算,铁是地球上最常见的元素,它加热后有很好的延展性…并且非常有用。铁始于公元前3500年左右,在埃及的盖尔扎赫被发掘出来铁对早期文明所需的各式东西都非常有用:如,蒸煮罐、小五金、工具,以及用来刺伤他人的尖锐武器。"
 JAP_steel_making2:0 "发展钢铁产业 II"
 JAP_refinery_making:0 "发展石化产业 I"
 JAP_refinery_making_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 JAP_refinery_making2:0 "发展石化产业 II"
 JAP_tokyo_olympic:0 "东京奥运会"
 
 JAP_develop_fighter:0 "独立战斗机研发"
 JAP_develop_fighter_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 JAP_develop_strategic:0 "发展战略武器"
 JAP_develop_strategic_desc:0 "德国在二战中发明的V2火箭令我们眼前一亮，这种火箭如果能装载核武器，使其能够更快、更准的发射到地球的另一端，那么战争的历史、人类的历史都将为此改变。"
 
 JAP_amaderasu:0 "天照大神计划"
 JAP_amaderasu_desc:0 "当天照大御神走出山洞，展现在众神面前之时，全世界都将为之震惊。"
 JAP_nuclear:0 "发展核能"
 JAP_kaguya_hime:0 "辉夜姬号"
 JAP_osaka_port:0 "扩大大阪港"
 JAP_osaka_port_desc:0 "大阪作为西日本最大的城市，无论是作为贸易港、石油港还是军港开发，他都拥有极为关键的地位。"
 JAP_san_shinki:0 "三神器"
 JAP_labour_union:0 "支持工会"
 JAP_labour_union_desc:0 "工业化带来了工人群体的扩大，工人正成为一支强大的政治力量，要求更高的薪资、完善的福利制度和八小时工作制。与其让失望的工人投向共产党，不如主动满足其需求以争取工人的选票。"
 JAP_send_oversea:0 "海外派遣合法化"
 JAP_send_oversea_desc:0 "东亚短时间内爆发苏联与日本之间全面战争的可能性不太高，但自卫队需要实战来积累经验，以及提高外交威望。第三世界国家现在正爆发许多局部冲突，联合国呼吁各国派遣维和部队协助维持秩序，这对我们来说是一个机会。"
 JAP_edit_constitution:0 "宪法改正"
 
 JAP_develop_destroyer:0 "发展中型舰艇"
 JAP_develop_destroyer_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。\n\n琵琶湖的微波之上承载小木船  划动着的根根木浆推动我前进\n琵琶湖的水面之上倒映着美景  军舰进行曲的歌声回荡在四方"
 JAP_develop_cruiser:0 "发展大型舰艇"
 JAP_develop_cruiser_desc:0 "我们的海军已经成长壮大，我们需要发展可以搭载更多设备和飞机的大型舰艇来强化作战能力。\n\n澎湃的海浪 遥远的海洋   海浪的飞沫腾起磐石上\n常盘台上的松树 遍布高山上  秀丽的秋津州 我们的国土\n\n啊啊  江田岛的健儿啊  主导世间的风云迭起"
 JAP_develop_carrier:0 "发展航空母舰"
 JAP_develop_carrier_desc:0 "日本的航空母舰在第二次世界大战中大放异彩，我们的海航健儿击沉威尔士亲王号，宣布了现代海战的到来，现在让我们再一次打造这无与伦比的海战先锋。"
 JAP_develop_submarines:0 "发展潜艇"
 JAP_develop_submarines_desc:0 "潜艇在海战中有着不可比拟的优势。一条设计精良的现代潜艇在发射鱼雷前几乎是不可探测的，同时还有潜力重创造价与大小数倍于己的主力舰。我们应当专注于建造潜艇以作为海战攻势的主力。"
 JAP_marines_focus:0 "重建海兵队"
 JAP_mutsuo:0 "扩大陆奥军港"
 JAP_JAP_mutsuo_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。陆奥军港一直都是日本重要的海军基地，我们应该扩大该地区的海军基础设施，以承载更大的舰队。"
 JAP_konko:0 "金刚级护卫舰"
 JAP_yokosuka:0 "扩大横须贺军港"
 JAP_yokosuka_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。位于横滨的横须贺军港一直都是日本重要的海军基地，我们应该扩大该地区的海军基础设施，以承载更大的舰队。"
 JAP_sasebo:0 "扩大佐世保军港"
 JAP_sasebo_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。位于长崎的佐世保军港一直都是日本重要的海军基地，我们应该扩大该地区的海军基础设施，以承载更大的舰队。"
 
 JAP_NG_jmt:0 "自民党与农协"
 JAP_nougyou:0 "成立农协"
 JAP_videogames:0 "发展电子游戏"
 JAP_videogames_desc:0 "我认为优秀的电子游戏就像你最喜欢的游乐场，你会对它们产生感情，并一次又一次地回到那里。如果能随时拥有满满一抽屉的“游乐场”，那该有多棒啊！\n——宫本茂"
 JAP_electronic_indus:0 "发展电子产业"
 JAP_electronic_indus_desc:0 "电子产业是20世纪后半叶最重要的高新技术产业，小小的晶体管不仅可以制造出先进的电子产品，也是走向发达国家的门槛。"
 JAP_expanded_oil:0 "扩大石油储备"
 JAP_expanded_oil_desc:0 "日本并不是产油国，但随着我国制造业的发展，我们可以通过出口工业品获得的外汇，来购买石油，并将石油资源常备储存，以备不时之需。"
 JAP_Tsukuba:0 "筑波科技城"
 JAP_Hiroshima_construction:0 "濑户内海工业带"
 
 JAP_invest_Africa:0 "投资非洲国家"
 JAP_invest_Africa_desc:0 "我们需要尽快与非洲国家改善关系，扩大外交支持，开展经济往来，投资获利。"
 JAP_invest_SEA:0 "投资东南亚"
 JAP_invest_SEA_desc:0 "我们需要尽快与东南亚国家改善关系，扩大外交支持，开展经济往来，投资获利。"
 JAP_invest_ME:0 "投资中东国家"
 JAP_invest_ME_desc:0 "我们需要尽快与东南亚国家改善关系，扩大外交支持，开展经济往来，投资获利。"
 
 JAP_invest_pacific:0 "投资南洋群岛"
 JAP_invest_pacific_desc:0 "太平洋地区的一些岛国，如马绍尔群岛、密克罗尼西亚群岛、帕劳、瑙鲁和所罗门群岛，曾经是日本大领地，我们可以对他们进行一定程度的投资，帮助他们发展渔业、经济作物和旅游业，作为回报，换取他们国际舞台上对我们的支持。"
 JAP_invest_china:0 "投资中国大陆"
 JAP_invest_china_desc:0 "中国大陆在改革开放之后，希望吸引外资投资，我们应该抓住这个机会，获取庞大的中国市场。"
 JAP_china_trade:0 "开展中日民间贸易"
 JAP_china_trade_desc:0 "中国人依然记恨着日本入侵带来的毁灭，想要和他们重新交朋友还是很困难，但中国现在百废待兴，他们的领导人正在寻求对外贸易的渠道。他们有原材料，我们有工业品，也许我们可以尝试尽可能争取他们的谅解，以寻求开展贸易的可能。"
 JAP_okinawa_autonomy:0 "冲绳自治"
 JAP_okinawa_autonomy_desc:0 "冲绳地区的本土主义者寻求自治权，为了安抚民族主义情绪，我们可以尝试逐步将自治权下放给他们。"
 JAP_strike_workers:0 "打击工会"
 JAP_strike_workers_desc:0 "受共产主义影响的工会分子鼓吹盲目的高薪、低工时和各种乱七八糟的福利制度，反对我们实行的各项经济刺激，拖累经济转型政策的推动。"
 JAP_dissove_tsaibatsu:0 "瓦解财阀"
 JAP_land_reform:0 "农地改革"
 JAP_land_reform_desc:0 "明治时期实行的土地改革并不完善，土地依然掌握在地主和财阀手中。新的民主日本政府如果要取得农民的支持，需要更深入的新土地改革政策，让农地真正掌握在农民手中。"
 JAP_Local_autonomies:0 "市村町自治"
 
 JAP_Judgment:0 "东京审判"
 JAP_Judgment_desc:0 "发起侵略战争的日本军阀和政客必须得到应有的下场，从而震慑住残余的军国主义分子。"
 JAP_Humanity_Declaration:0 "人间宣言"
 JAP_Humanity_Declaration_desc:0 "日本天皇是日本军国主义的象征，消灭天皇崇拜就是消灭军国主义。"
 JAP_remove_emperor:0 "废除天皇制"
 JAP_remove_emperor_desc:0 "我坚持推翻天皇制。战时和战后的悲惨景象，是以天皇的名义和天皇制这一制度所引发的。说是天皇制，但也不仅仅是天皇，军阀、官僚、警察、村公所也都包括在这一制度内。天皇拥有的巨大财产并不是天皇通过劳动得来的，而是从人民的手里夺取来的。为了从战后的悲惨中重新站起来，为了我们的幸福这是必须要采取的方式。\n——德田球一"
 JAP_remove_hirohito:0 "公审天皇全家"
 JAP_execute_warcrimer:0 "处死所有战犯"
 
 JAP_reconstruction_rightwing:0 "右翼复兴"
 JAP_reconstruction_rightwing_desc:0 "英美等国虽然在军事上击败了我们，但大和民族的精神不会屈服！"
 JAP_reconstruction:0 "重建国家"
 JAP_against_communist:0 "治安维持法"
 JAP_against_communist_desc:0 "日本共产党的实力不断壮大，随时有夺取政权的可能，美国人和右翼势力都希望对他们采取措施。"
 JAP_Jimintou:0 "自由民主党"
 JAP_Jimintou_desc:0 "以社会党为首的左派势力正不断扩大，对保守势力造成了威胁，如果自由党和民主党继续分裂，就有可能双方都得不到好处，对此，两党应该尽快团结起来，合并为一个新的大党，团结保守势力。"
 tanaka_faction:0 "田中派系"
 JAP_JSP_rightwing:0 "支持社会党右翼"
 JAP_JSP_rightwing_tool:0 "以西尾末广、河上仗太郎为首的社会党右翼将参加下一次议会改选"
 JAP_Revitalize_nationalism:0 "新军国主义"
 JAP_Revitalize_nationalism_desc:0 "美国人想要把我们的民族变成没有无力的白开水，这是不能接受的，没有尚武精神的日本人无法生存，必须重新唤起对武士道的尊崇。武士道者，死之谓也。吾等皆是抱定必死之决心，不成功，便成仁。"
 JAP_freed_warcrimeer:0 "释放战犯"
 JAP_Military_Pension:0 "支持右翼社团"
 JAP_Vindicated_crime:0 "否认战争罪行"
 JAP_Vindicated_crime_desc:0 "日本与东亚各国的关系，就如同哥哥与弟弟之间的关系，我们之所以发起大东亚圣战，是为了驱逐欧美殖民者，解放殖民地，实现东亚共荣。日本牺牲自己的利益，提携东亚兄弟国家，竟也成为罪行了吗？"
 JAP_kokka_shinto:0 "恢复国家神道"
 JAP_unique_nationality:0 "单一民族论"
 JAP_unique_nationality_desc:0 "非我族类其心必异，作为大和民族的单一民族国家，所谓的琉球人、虾夷人的文化、语言、信仰和生活方式，如果与大和民族不尽相同，就会成为叛乱的隐患，我们必须强制我国的所有公民都使用统一的日语、日文和神道教，才能团结国家。"
 JAP_YASUKUNI:0 "重建靖国神社"
 JAP_YASUKUNI_desc:0 "贵様と俺とは　同期の桜\n离れ离れに　散ろうとも\n花の都の　靖国神社\n春の梢に　咲いて会おう"
 JAP_warcrimeer_adivisor:0 "邀请旧日本军官进入自卫队"
 JAP_warcrimeer_adivisor_desc:0 "日本不存在没有参与过二战的职业军人，如果要重建军队，就必须将这些旧国防军军人特赦，并邀请他们成为自卫队的高层。是的，他们当中许多人可能依然忠诚于军国主义，但比起在苏联入侵时束手无策，这风险是值得的。"
 JAP_new_army:0 "建立国防军"
 JAP_new_army_desc:0 "战争的威胁不断恶化，仅仅凭借自卫队是无法保卫国家的，一支不受所谓和平宪法的正式军队才能保护日本。"
 
 JAP_employees:0 "支持终身雇佣制"
 JAP_exportment:0 "鼓励产品出口"
 JAP_war_china:0 "对支那开战"
 JAP_war_china_desc:0 "我们与支那人的战争将再一次开启，只有彻底征服支那，才能真正让帝国成为亚细亚的霸主。这一次我们必将胜利！"
 JAP_war_korea:0 "对朝鲜开战"
 JAP_war_korea_desc:0 "朝鲜半岛从来都是日本走向领土扩张的第一步，我们将收复我们帝国曾经最重要的领土！"
 JAP_war_america:0 "对米畜开战"
 JAP_war_america_desc:0 "我们不是第一次，也不是最后一次与米国人决一死战，这一次我们必将胜利！"
 JAP_war_russia:0 "对露贼开战"
 JAP_war_russia_desc:0 "皇国兴废，在此一战，诸君奋进，武运昌隆！"
 JAP_loyyalty:0 "忠君爱国"
 JAP_loyyalty_desc:0 "我们大日本帝国臣民团结一心，都将为了重建帝国而战，而死！\n\n義重は山のように、死は羽のように\n八纮一與  七生報國  天皇陛下  萬歲！！！！！！！！！"
 JAP_end_famalies:0 "结束门阀政治"
 JAP_end_famalies_desc:0 "门阀政治是封建时代的遗留，政治家的孩子总是政治家，因为他们的父辈给他们留下了更好的人脉和资源，而中下层平民出身的人却反而很难挤入政府高层。这种现象应该随着国家的民主化被废止，打破门阀对政治的垄断，民众才是国家的主人。"
 JAP_new_emperor:0 "朝香宫鸠彦天皇"
 JAP_new_emperor_desc:0 "再重建天皇治下的日本帝国之前，我们需要解决一个棘手的问题——裕仁天皇尽管依然是目前合法的天皇，然而，他在圣战时期和战后时期的表现令人难堪，战时，他软弱无能，受军方和野心家摆布，战后，他又对美国人唯命是从。尽管我们毫无疑问尊天皇陛下为至高无上之存在，但这样的天皇，怎能对得起子民的拥戴？\n基于这个原因，我们需要一个有足够的能力和意志，支持大日本帝国复兴的统治者。朝香宫鸠彦亲王是裕仁的叔叔，他曾在中国战场领兵战斗，既有军事能力，亦有支持皇国复兴之心，毫无疑问，他是我们最合适的选择。"
 JAP_militarist_rule:0 "与军方合作"
 JAP_militarist_rule_desc:0 "各种不同政治主张的党派在议会里为了各自的利益撕扯，但军队与他们不同，军队能够团结一致，同一目标，代表社会进步阶层，做事果断果敢，且真正为了国家而努力。"
 JAP_yokusan:0 "恢复翼赞体制"
 JAP_iishin_constitution:0 "维新宪法"
 JAP_iishinkai:0 "日本维新会"
 
 JAP_Privazed:0 "公社民营化"
 JAP_Privazed_desc:0 "石油危机令日本及许多国家都遭受重创，我国的财政不足以支持一些大型国企的运营了，欧美的一些国家通过企业的私有化改革摆脱了困难，这值得我们尝试。"
 JAP_breakwater:0 "亚洲的防波堤"
 JAP_breakwater_desc:0 "在中国共产党夺取中国大陆的政权后，共产主义威胁着亚太地区的自由国家，我们将和他们团结起来，一同应对挑战。"
 JAP_Northern_Islands:0 "宣称北方四岛"
 JAP_Northern_Islands_desc:0 "日本与沙俄签订的条约中划定千岛群岛属于日本，但苏联在二战后侵占了该地区，日本政府并没有放弃对该地区的领土诉求。"
 JAP_Republic:0 "走向共和"
 JAP_Republic_desc:0 "天皇万世一系，不过是统治阶级的神话，战争的失败，标志着天皇政权的无能以及他们对人民的失责。大和王朝的统治该结束了，一个民主共和国即将来到日本。"
 JAP_peace_constitution:0 "和平宪法"
 JAP_peace_constitution_desc:0 "日本以及在战争中失去了太多，只有永远放弃战争和再武装的权力，才能在这片土地上实现和平。"
 JAP_Promote_democracy:0 "民主化"
 JAP_Promote_democracy_desc:0 "曾经的日本是一个由军阀、财阀控制的专制国家，如今这些统治阶级都已经被打倒，日本即将走向民主化，民众将获得他们应得的政治权利。"
 JAP_accept_communist:0 "接受共产主义"
 JAP_accept_communist_desc:0 "日本共产党在二战中被当局残酷镇压，在二战后他们得以回复活动自由，并劳工阶级支持，现在他们希望进入政府。"
 JAP_pro_socialist:0 "社会主义"
 JAP_pro_socialist_desc:0 "日本的社会主义运动早在明治时期就已经出现，大正时代不断壮大，在二战后，劳农派等各个社会主义派系影响力迅速扩大，积极投身政治活动。"
 JAP_kill_Emeror:0 "社会改革"
 JAP_kill_Emeror_desc:0 "要改变日本，不仅要革新政治，更要革新思想。天皇崇拜、等级制度和男尊女卑仍然刻在日本人的脑海里，现在需要把他们除掉了。"
 JAP_Yoshida_Idea:0 "吉田路线"
 JAP_Yoshida_Idea_desc:0 "日本首相吉田茂提出了日本战后的发展路线，即轻军备，重经济，把注意力投入到对经济的建设中，军事交给美国就可以。"
 JAP_people_republic:0 "人民共和国"
 JAP_democratic:0 "重建民主政治"
 JAP_SanFrancisco_treaty:0 "旧金山和约"
 JAP_SanFrancisco_treaty_desc:0 "虽然日本已经战败，但与各国的战争状态在法理上还未完全结束，日本若要回归国际社会，则需要以书面形式与各国签订合约，处理战争的遗留问题。"
 JAP_end_occup:0 "结束美国管制"
 JAP_end_occup_desc:0 "美国借助联合国司令部，对日本的政治进行控制，现在战争已结束多年，对日本的民主化改造也已基本完成，现在是时候结束美国人的控制了。"
 JAP_third_worlds:0 "亲近第三世界"
 JAP_third_worlds_desc:0 "在轰轰烈烈的去殖民化之下，亚非许多新兴国家诞生，日本需要尽快与他们建立关系，这不仅是为了提高我们的国际地位，也是为了打开海外市场。"
 JAP_shakaito:0 "社会党政府"
 JAP_shakaito_desc:0 "社会党是二战后建立的一个大篷车党派，由各种非自民党的左派人士组成，并在50年代影响力迅速扩大。"
 JAP_Pro_America:0 "亲近美国"
 JAP_Pro_America_desc:0 "美国以强大的武力征服了日本，在冷战中，日本成为美国的前沿。无论日本愿不愿意，都必须与美国人打好关系，这也是为了得到华盛顿的支持。"
 JAP_Pro_Taiwan:0 "与台湾关系"
 JAP_Korea_relationship:0 "日韩建交"
 JAP_Korea_relationship_desc:0 "作为日本的第一个吞并国家，韩国与日本的关系仍然极其恶劣，但在共产主义威胁，以及各种政治和经济需求下，日本和韩国仍然有不得不走到一起的理由。"
 JAP_security_accord:0 "日美安保条约"
 JAP_okinawa_base:0 "收回冲绳地区"
 JAP_Police:0 "警察预备队"
 JAP_Police_desc:0 "尽管美国当局一直试图将日本完全去武装化，但随着共产主义威胁日益严峻，终究还是要让日本人再次拿起枪了。"
 JAP_JSDF:0 "建立自卫队"
 JAP_JSDF_desc:0 "日本的重新武装已经逐渐起步，现在我们要把他们打造成一支真正的武装部队。"
 JAP_economic:0 "重振经济"
 JAP_Revenue_growth:0 "国民收入倍增计划"
 JAP_Revenue_growth_desc:0 "国民收入倍增计划是日本在1956年的经济白皮书中提出的计划，日本将在2年时间内，使全体国民的经济收入提高数倍。"
 JAP_Jinmu_boom:0 "神武景气"
 JAP_Military_industry:0 "重振军工业"
 JAP_Plaza_Accord:0 "鼓励投资"
 JAP_Plaza_Accord_desc:0 "广场协议使得日元升值，制造业发展受阻的情况下，对土地和股票的投资需求将大大增加，适当支持也许对我们的经济有利。"
 JAP_remove_militarism:0 "去军国主义"
 JAP_remove_Yasukuni:0 "拆除靖国神社"
 JAP_remove_Yasukuni_desc:0 "靖国神社是位于东京市中心的一座神社，供奉着从明治维新到二战时期的所有战死军人，在日本民主派看来，他是军国主义的象征。"
 JAP_remove_Amrcia:0 "驱逐驻日美军"
 JAP_remove_Amrcia_desc:0 "日本绝不会成为美国爆发户的傀儡！我们要求美国驻军全部撤离，以表明日本是一个独立的主权国家！"
 JAP_reback_Pacific:0 "重返太平洋"
 JAP_New_Empire:0 "大日本第二帝国"
 JAP_New_Empire_desc:0 "既有日落，必有日升。大和民族，神明护佑，卧薪尝胆，必有报时。"
 JAP_china_relationship:0 "与中共建交"
 JAP_china_relationship_desc:0 "中国共产党政权已经不可能被推翻，我们不可能与这个占世界上五分之一人口的国家永远老死不相往来，与中华人民共和国建立外交关系要提上日程。"
 JAP_remove_tycoon:0 "铲除财阀"
 JAP_Peace_with_soviet:0 "日苏关系正常化"
 JAP_Peace_with_soviet_desc:0 "苏联作为两大超级大国之一，如果日本想要重返联合国，就必须与苏联重新建立正常的外交关系。我们与苏联之间有很多问题需要解决，桦太岛的领土争端、滞留苏联的日本战俘……但这些都可以通过谈判解决。"
 JAP_Pro_chisov:0 "与东方阵营的贸易
 JAP_Pro_chisov_desc:0 "我们对中国、苏联等共产主义国家改善关系的政策取得了成功，他们对日本的商品不再显得特别抗拒，因此我们需要抓住机会扩大日本商品在东欧的市场优势。"
 JAP_Remodeling_Japan:0 "日本改造论"
 JAP_Remodeling_Japan_desc:0 "日本改造论是田中角荣提出的一个宏伟计划，希望通过全国大规模的基础设施建设，推动农村地区发展，也缓解首都东京的压力。"
 JAP_non_nuke:0 "无核三原则"
 JAP_non_nuke_desc:0 "无核三原则是日本首相佐藤荣作提出的关于核能使用的政策，即日本不制造、不拥有也不研究核武器。"
 history_japan_invasion:0 "日本侵略历史"
 JAP_Pacific_belt:0 "太平洋工业带"
 JAP_Shingansen:0 "新干线"
 JAP_Shingansen_desc:0 "新干线是日本在60-80年代制造的一系列电气化铁路的名称，最早的一条东海干线于1967年建成，从东京链接大阪。新干线不仅大大推动了日本东西两地的人口流动，而且新干线的技术代表了当时世界最先进的电气铁道水平。"
 JAP_LDP_forever:0 "永远的五五年体制"
 JAP_LDP_forever_desc:0 "1955年自民党成立后，日本国会长期处于自民党垄断政权，小党派林立占据另一半的对峙局面。"
 JAP_semiconductor:0 "发展半导体"
 JAP_semiconductor_desc:0 "计算机是二十世纪后半叶发展最快、意义最重要的科学技术之一，我国要想成为制造业和技术大国，就必须掌握半导体行业。"
 JAP_JSDF_naval:0 "建设海上自卫队"
 JAP_JSDF_naval_desc:0 "作为海岛国家，海军建设从明治时代就是日本军事的重中之重，幸运的是日本帝国海军在二战后没有遭到严重阉割，现在我们要以海上自卫队重建强大的海军力量。"
 JAP_JSDF_airforce:0 "建设空中自卫队"
 JAP_JSDF_airforce_desc:0 "神武东征时，神武天皇和长髓彦作战却无法得胜。忽然天气变得阴暗且下起冰雹，神武天皇的弓弭停了一只灵鵄，发出的金色光辉状如流电，使敌军迷眩，故天皇军获得胜利。\n——《日本书纪》"
 JAP_korea_research:0 "三矢研究"
 JAP_korea_research_desc:0 "三矢研究是日本自卫队中的一些右翼分子在70年代进行的一个战争预言，设想如果北朝鲜入侵韩国，日本自卫队将派遣地面部队进入朝鲜半岛，这意味着日本必须为了应对朝鲜局势扩大武装，并可能违背和平宪法进行对外军事干涉。"
 JAP_Tokyo_construction:0 "东京建设"
 JAP_Tokyo_construction_desc:0 "随着日本的经济迅速增长，首都东京也不断发展，人口的大规模增长和城市化使得东京需要进行更大规模的建设以适应。"