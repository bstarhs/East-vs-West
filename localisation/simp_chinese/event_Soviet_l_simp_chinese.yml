l_simp_chinese:
 sov.1.t:0 "共产党和工人情报局的建立"
 sov.1.d:0 "共产党和工人情报局在莫斯科建立，这一组织目的在于分享和收集欧洲各个国家的政治情报以推动社会主义运动。"
 sov.1.a:0 "冷战对抗局势在加剧"
 
 sov.2.t:0 "苏联向我们提供一批经济援助"
 
 sov.3.t:0 "[THIS.GetName]拒绝了我们的经济援助"
 
 sov.4.t:0 "[PREV.GetName]宣布接受苏联的经济援助"
 sov.4.d:0 "[PREV.GetName]与苏联签署了一系列具有里程碑意义的经济合作条约，标志着两国关系进入全新阶段。此轮合作以苏联对第三世界国家的支援为基础。\n根据条约内容，苏联将向[PREV.GetName]提供包括低息贷款在内的一揽子援助，具体涵盖食品、药品以及用于发展工业的关键机械设备。这些援助旨在帮助这个新近摆脱殖民统治的国家实现经济现代化，巩固其政治与经济的独立。\n分析指出，此举不仅意在加强两国间的经济联系，也体现了苏联试图将[PREV.GetName]作为其发展模式在第三世界的“试验场”，以期在广阔的第三世界扩大影响力。"
 
 sov.5.t:0 "[PREV.GetName]宣布加入经济互助委员会"
 sov.5.d:0 "[PREV.GetName]政府正式宣布加入经济互助委员会，以加强与苏东国家在经济领域上的合作。"
 
 sov.6.t:0 "经济互助委员会正式成立"
 sov.6.d:0 "经济互助委员会在莫斯科成立，这一组织成立的目的在于为成员国提供经济援助和贸易支持。"
 
 
 sov.7.t:0 "共产党和工人情报局的建立"
 sov.7.d:0 "共产党和工人情报局在莫斯科建立，这一组织目的在于分享和收集欧洲各个国家的政治情报以推动社会主义运动。莫斯科向我们发来消息，邀请我方加入。"
 sov.7.a:0 "这对我们是有益的。"
 sov.7.b:0 "没有这个必要。"
 
 sov.8.t:0 "经济互助委员会的邀请"
 sov.8.d:0 "经济互助委员会在莫斯科成立，这一组织成立的目的在于为成员国提供经济援助和贸易支持。莫斯科邀请我方家加入。"
 sov.8.a:0 "这对我们是有益的。"
 sov.8.b:0 "没有这个必要。"
 
 sov.9.t:0 "斯大林去世！"
 sov.9.d:0 "莫斯科电台突然中断所有节目，播音员的声音划破风雪："约瑟夫·维萨里奥诺维奇·斯大林同志的心脏停止了跳动。"\n消息很快传遍了整个苏联，无数民众感到震惊、悲痛……有的人跪在地上手划十字，有的人在胸前别起自己在卫国战争中获得的勋章，朝着克林姆林宫的方向敬了一个军礼。\n莫斯科宣布，将在不久之后，为斯大林同志举行隆重的葬礼，来纪念这位革命家、军事家、伟大的领袖、伟大的父亲……\n莫斯科的苏共官员被组织起来守灵，有人注意到贝利亚的大衣内袋鼓胀着，而马林科夫不断擦拭着似乎并非因悲伤而流下的汗水。"
 sov.9.a:0 "知道吗？今天格鲁吉亚天上的星星特别亮。"
 
 sov.10.t:0 "马林科夫接任苏联新任领导人！"
 sov.10.d:0 "苏联共产党中央书记处书记格奥尔基·马林科夫在斯大林去世后，接任苏联最高领导人暨苏联部长会议主席。马林科夫和赫鲁晓夫、布尔加宁等苏共高层一同处理了斯大林死后的一些政治混乱，目前，马林科夫与另外几名高级领导一同处理苏联政务。"
 sov.10.a:0 "祝贺新任总书记！"
 
 sov.11.t:0 "尼古拉·沃兹涅先斯基接任苏联新任领导人！"
 
 sov.12.t:0 "华沙条约组织的邀请"
 sov.12.d:0 "苏联和其他东欧社会主义国家在华沙签署了共同防御条约，标志着华沙条约组织的成立。由苏联领导的华沙条约组织将使共产主义政权在东欧的统治更加稳定。"
 sov.12.a:0 "It's good for us."
 sov.12.b:0 "This is not necessary."
 
 sov.13.t:0 "华沙条约组织的成立"
 sov.13.d:0 "苏联与东欧多国在华沙总统府正式签署《友好合作互助条约》，即《华沙条约》，宣告社会主义阵营军事同盟的成立。此举被视为对西方批准《巴黎协定》、重新武装西德的直接回应，标志着欧洲冷战对峙升级。\n签约仪式上，各国外长依次在烫金文本签字，条约规定设立联合武装部队和统一司令部。签约国军队总兵力达600万，远超北约在欧洲的驻军。莫斯科电台宣称这是"和平的盾牌"，而伦敦方面则谴责其为"苏联控制东欧的新枷锁"。\n随着条约批准程序启动，东西欧之间的铁幕正化作实实在在的军事分界线。联合国秘书长呼吁克制，警告欧洲已陷入"最危险的军事对峙"。"
 sov.13.a:0 "应当支持社会主义阵营的自我保护。"
 sov.13.b:0 "这不是一件好事。"
 
 sov.14.t:0 "我们击落一架美国U2侦察机！"
 sov.14.d:0 "我们击落了一家美国的U2侦察机，当时这家飞机正在中亚地区侦查和窃取我国军事情报。U2被击落后，我军地面部队俘虏了一名飞行员。现在华盛顿必须对此作出解释了。"
 sov.14.a:0 "把此事公布出去，让全世界看看帝国主义的所作所为。"
 sov.14.b:0 "向华盛顿发电，如果不想让此事被曝光，他们必须作出交易。"
 
 sov.16.t:0 "苏联击落一架U2侦察机！"
 sov.16.d:0 "苏联击落了一架我国U2侦察机！该侦察机从巴基斯坦出发前往苏联腹地，在中亚被击落。飞行员被苏军俘虏。苏联警告，如果不想此事被公之于众，我们必须用足够数量的被俘苏联间谍来交换。"
 sov.16.a:0 "我们别无选择。"
 
 sov.17.t:0 "苏联击落一架U2侦察机！"
 sov.17.d:0 "苏联击落了一架我国U2侦察机！该侦察机从巴基斯坦出发前往苏联腹地，在中亚被击落，飞行员被苏军俘虏。苏联外交部找来记者，向全世界公布了这一违反国际法的行为，这将使美国面临巨大的外交压力。"
 sov.17.a:0 "我们别无选择。"
 
 
 sov.18.t:0 "城市改名"
 sov.18.d:0 "作为去除对斯大林个人崇拜政策的一部分，苏联政府对大量带有斯大林的城市名称进行了更改，包括在第二次世界大战中建立功勋的斯大林格勒，将被改名为伏尔加格勒。"
 sov.18.a:0 "断代。"
 
 sov.19.t:0 "美国提出交换间谍！"
 sov.19.d:0 "美国同意交出他们抓获的一些苏联间谍，以及撤回在华约国家部署的一系列情报网来换取我们不公开U-2侦察机事件。"
 sov.19.a:0 "很好。"
 
 sov.20.t:0 "赫鲁晓夫被要求辞职！!"
 sov.20.d:0 "赫鲁晓夫总书记在黑海度假时，以勃列日涅夫、柯西金和苏斯洛夫为首的部分党员召开会议，要求赫鲁晓夫辞职。"
 sov.20.a:0 "无稽之谈！赫鲁晓夫应当继续领导苏维埃！"
 sov.20.b:0 "赫鲁晓夫应当停止他的工作了。"
 
 sov.21.t:0 "新的领袖"
 sov.21.d:0 "赫鲁晓夫已经下台，现在谁来接替他呢？"
 sov.21.a:0 "让苏斯洛夫同志担任新的总书记。"
 sov.21.b:0 "勃列日涅夫同志将是一位合适的领导人。"
 
 sov.22.t:0 "贝利亚被处决"
 sov.22.d:0 "莫斯科，卢比扬卡的暖气管道发出异样的嗡鸣。\n那份判决书只用了十七分钟就通过了表决。当钢笔在文件上划出最后一道横线时，地下室里的录音机还在播放他去年在柏林和谈时的发言磁带。走廊尽头的保险柜里，整齐码放着标注"特别档案"的牛皮纸袋，现在全都成了无人认领的遗物。\n行刑队选择了一个没有月亮的夜晚。雪地上急促的脚步声过后，莫斯科河畔的某处冻土被悄悄翻开，又迅速抹平。与此同时，内务部的打字员们正连夜修改人事档案，将集体照上那个戴圆框眼镜的身影，用刀片刮成模糊的灰斑。\n\n来自莫斯科消息。苏联内务委员会拉夫连季·贝利亚因叛国罪被捕，昨天早上已在卢比扬卡的监狱内执行死刑。。"
 sov.22.a:0 "一场你死我活的斗争。"
 
 sov.23.t:0 "贝利亚夺取政权"
 sov.23.d:0 "在苏联部长会议主席团举行的一次会议上，苏联高层爆发了冲突。以布尔加宁、赫鲁晓夫为首的几人在会议上与贝利亚就东德问题爆发激烈争辩，突然，赫鲁晓夫站起身，怒斥贝利亚数年来的种种恐怖手段，并呼吁开除并逮捕贝利亚，但贝利亚予以激烈抵抗，惊险地逃出了克里姆林宫，随后呼叫内务部军队从卢比扬卡杀来。随后内务部闯入会议现场控制局势，赫鲁晓夫与布尔加宁被捕，惊魂未定的苏共中央总书记马林科夫也被“请”回寓所。支持贝利亚的部队宣布苏联进入戒严状态，贝利亚将以临时部长会议主席的身份接管政权。"
 sov.23.a:0 "一场你死我活的斗争。"

 sov.28.t:0 "勃列日涅夫去世！"
 sov.28.d:0 "苏维埃联盟的最高领导人，苏联共产党总书记列昂尼德·勃列日涅夫在莫斯科去世，结束了他的传奇一生。苏联各地进入了悲伤的氛围中，克里姆林宫降下半旗。苏共中央宣布，勃列日涅夫的葬礼将在不久后举行，目前苏联的政治事务由苏共中央政治局的其他委员代理，同时他们也将选出新的总书记。"
 sov.28.a:0 "向莫斯科发出慰问电。"
 sov.28.b:0 "让安德罗波夫同志担任新的总书记。"
 sov.28.c:0 "契尔年科同志将是一位合适的领导人。"
 
 sov.27.t:0 "[SOV.GetLeader]的传记出版"
 sov.27.d:0 "自从勃列日涅夫成为苏联共产党总书记以后，开始恢复各种个人崇拜活动，通过接受勋章、拍摄电影等方式，为自己造势宣传，外界将这种情况称作“宁静的斯大林化”。\n最近，勃列日涅夫出版了新的个人传记，对此总书记本人表示：“听说大家都说我的自传写得好，那天我也买一本来看一看。”
 sov.27.a:0 "总书记就是幽默"
 
 sov.29.t:0 "来自艾尔德里西·阿姆斯先生的来信"
 
 sov.30.t:0 "亲爱的安德罗波夫先生"
 sov.30.d:0 "我叫萨曼莎·史密斯，今年10岁。祝贺你的新工作。我一直担心俄罗斯和美国会卷入一场巨大的战争。你会选择战争吗？如果你不同意，请告诉我你将如何帮助避免战争，你不必回答这个问题，但如果你愿意的话，我很乐意回答。你为什么要征服世界，或者至少是我们的国家？上帝创造了这个世界，让我们分享并照顾彼此，而不是为了争夺或让一群人拥有它。请让我们做我们想做的事，让每个人都快乐。萨曼莎·史密斯，美国缅因州曼彻斯特。"
 sov.30.a:0 "为什么不邀请这个女孩儿来这里看看呢？"
 sov.30.b:0 "无聊。"
 
 sov.31.t:0 "史密斯萨曼莎访问俄国！"
 sov.31.d:0 "应苏联总书记尤里·安德罗波夫的邀请，14岁的美国少女史密斯·萨曼莎将访问莫斯科。根据苏联方面的安排，萨曼莎与父母将参观莫斯科的少先队营地和观看各种表演。"
 
 sov.32.t:0 "安德罗波夫去世！"
 sov.32.d:0 "九十多岁的尤里·安德罗波夫在经历了数年的癌症折磨之后，死在了苏联共产党总书记的任上。尽管其雄心壮志地谋求对苏联进行大刀阔斧的改革，但时间不允许其有更大的作为了。"
 sov.32.a:0 "向莫斯科发出我们的慰问。"
 sov.32.b:0 "契尔年科同志将接任总书记。"
 sov.32.c:0 "雷日科夫同志将接任总书记。"

 sov.34.t:0 "切尔诺贝利发生核事故！!"
 sov.34.d:0 ""
 sov.34.a:0 "Do every thing we can do and save it!"

 sov.35.t:0 "切尔诺贝利核电站被封存！!"

 sov.36.t:0 "切尔诺贝利核电站爆炸！!"
 
 sov.37.t:0 "契尔年科去世！"
 sov.37.d:0 "苏联共产党总书记康斯坦丁·契尔年科，仅仅接任总书记不到一年，便因肺病和心脏衰竭撒手人寰，他甚至没有来得及实行一些有意义的政策。"
 sov.37.a:0 "再向莫斯科发出我们的慰问。"
 sov.37.b:0 "戈尔巴乔夫同志将接任总书记。"
 sov.37.c:0 "雷日科夫同志将接任总书记。"

 sov.38.t:0 "苏联政变宣告瓦解！"
 sov.38.d:0 "在反政变群众的包围下，参与政变的苏联军人意志涣散，斗志全无，最终决定撤离莫斯科。叶利钦的支持者立刻取得了莫斯科，尤其是克里姆林宫和奥斯塔金诺电视塔的控制权。在叶利钦命令下，莫斯科警方逮捕了紧急状态委员会的成员，亚纳耶夫等被捕，鲍里斯·普戈开枪自尽。戈尔巴乔夫从基辅飞返莫斯科，宣布恢复执政，然而此时苏联政府毫无疑问，已经完全处于叶利钦控制下。"
 sov.38.a:0 "真是激烈的斗争。"

 sov.39.t:0 "苏联共产党被限制行动！"
 sov.39.d:0 "未遂的政变严重打击了苏联共产党的威信，政变瓦解后，大量苏共党员宣布退党，许多反共产主义宣传也铺天盖地地出现。在叶利钦的压力下，俄罗斯的许多政府部门都将苏共党员扫地出门，苏共对苏联的统治正在加速瓦解。"
 sov.39.a:0 "真是激烈的斗争。"
 
 sov.40.t:0 "莫斯科发生政变！"
 sov.40.d:0 "今天早晨，莫斯科的广播和电视新闻突然中断，取而代之的是紧急状态委员会的新闻发布会。以亚纳耶夫为首的委员会宣称总统戈尔巴乔夫身体不适，由该委员会代为执政。同时苏联军队进入莫斯科。由于戈尔巴乔夫本人下落不明，一些苏联其他领导人斥责该行为为政变。俄罗斯总统鲍里斯·叶利钦谴责政变，并准备前往莫斯科市区寻求市民支持。"
 sov.40.a:0 "支持紧急状态委员会！奸细必须被消灭！"
 sov.40.b:0 "支持戈尔巴乔夫和叶利钦！政变是叛乱！"

 sov.41.t:0 "叶利钦与自由派抵制政变"
 sov.41.d:0 "鲍里斯·叶利钦和他的支持者已经抵达莫斯科白宫，他呼吁市民抵制政变，并阻止政变部队前往克里姆林宫。"
 sov.41.a:0 "支持紧急状态委员会！奸细必须被消灭！"
 sov.41.b:0 "支持戈尔巴乔夫和叶利钦！政变是叛乱！"

 sov.42.t:0 "苏联内战爆发！"
 sov.42.d:0 "发生在莫斯科的军事政变最终演变成全面内战！支持紧急状态委员会或叶利钦的武装部队在莫斯科交火，叶利钦不知所踪。此外，列宁格勒、喀山、基辅、明斯克和阿拉木图都爆发了大规模的流血冲突，苏联已经陷入全面混乱！"
 sov.42.a:0 "七十年前的战争又重演了。"
 
 sov.43.t:0 "戈尔巴乔夫辞职"
 sov.43.d:0 "亲爱的同胞们……鉴于独立国家联合体成立后的状况……我决定中止自己作为苏联总统身份进行活动……我做出这个决定，是出于原则性考虑的。"
 sov.43.a:0 "红旗落地，苏联解体。"

 sov.44.t:0 "建立独立国家联合体"

 sov.45.t:0 "独立国家联合体成立"

 sov.46.t:0 "[FROM.GetName]向我们请求派遣顾问"
 sov.46.d:0 "[FROM.GetName]希望我们能派遣顾问前往该国，指导该国经济发展建设，"
 
 sov.47.t:0 "苏联向我国派遣顾问"
 sov.47.d:0 "苏联向我国派遣了专家顾问团队，指导我国发展建设。"

 sov.48.t:0 "苏联拒绝派遣顾问"
 sov.48.d:0 "苏联拒绝向我国派遣顾问"

 sov.49.t:0 "苏联撤离顾问团队"
 sov.49.d:0 "苏联政府撤离了派驻我国所有的顾问团队"
 
 sov.50.t:0 "苏联想和我们签订一项军事条约"
 sov.50.d:0 "莫斯科给我们发来消息，希望与我国签署军事互助条约。苏联领导人声称，协助社会主义革命是苏联的责任。有了苏联的支持，我们就可以更好地同帝国主义及其所支持的反对派作斗争。"
 sov.50.a:0 "我们应该和社会主义阵营并肩作战。"
 sov.50.b:0 "这不符合我们的国家利益。"
 
 sov.51.t:0 "[Root.GetName]拒绝了我们的邀请。"
 sov.51.d:0 "The leaders of [Root.GetName] have rejected our military alliance proposal, and their decision will expose themselves to the military threat of imperialism!"
 sov.51.a:0 "Fool!"
 
 sov.52.t:0 "苏联邀请我们加入华约"
 sov.52.d:0 "莫斯科告诉我们，经过讨论，苏维埃主席团认为，邀请我们加入华沙条约组织是可行的，这样可以保护我们不受帝国主义国家的侵略。同时，他们也认为，作为社会主义国家，我们有责任帮助其他同志同军事威胁作斗争。"
 sov.52.a:0 "我们应该和社会主义阵营并肩作战。"
 sov.52.b:0 "这不符合我们的国家利益。"
 
 sov.53.t:0 "核弹警报！"
 sov.53.d:0 "我们核潜艇上的雷达发现了一个迹象，显示美国发射了一枚导弹，我们不知道它的目标是哪里，但可能是我国的任何一个城市。核反击规则允许我们在美国首先进攻时发射核武器反击。我们该怎么办？"
 sov.53.a:0 "这是个误报不用理他。"
 sov.53.b:0 "核战争开始了。"
 
 sov.58.t:0 "欧洲解放！"
 sov.58.d:0 "在苏联红军的猛烈攻势下，北约军队一触即破，全面崩溃，我们英勇的战士们突破铁幕，解放巴黎，登陆不列颠，将红旗插在了从挪威海到直布罗陀的大半个欧洲！\n现在，帝国主义已经只能龟缩在北美，我们必须在停止战争见好就收，和继续攻打美帝国主义本土二者之间做出选择。"
 sov.58.a:0 "欧洲已经是我们的了，我们可以选择见好就收。"
 sov.58.b:0 "核战争开始了。"
 
 sov.59.t:0 "警戒号叛乱！"
 sov.59.d:0 "红海军导弹巡洋舰警戒号发生叛乱！海军少校瓦列里·萨布林劫持了舰长，向水手斥责了苏联政府的腐败与无能，指责他们背弃了列宁，并号召推翻莫斯科官僚。警戒号从里加出发抵达列宁格勒，沿涅瓦河南下，我们如何应对？"
 sov.59.a:0 "立即消灭叛军！"
 sov.59.b:0 "萨布林是对的，可趁此机会对莫斯科进行洗牌。"
 
 sov.60.t:0 "警戒号政变"
 sov.60.d:0 "苏联海军少校瓦列里·萨布林劫持了导弹巡洋舰警戒号，他斥责莫斯科官僚的腐败并试图重新建立列宁主义政府。苏联领导人亲自下令攻击警戒号。在战斗机将警戒号逼停后，海军陆战队登上了舰艇，俘虏了萨布林。萨布林将面临叛国罪审判。"
 sov.60.a:0 "真可惜，一个有理想的人。"
 
 sov.61.t:0 "[SOV.GetLeader]辞职。"
 sov.61.d:0 "苏联海军少校瓦列里·萨布林劫持了导弹巡洋舰警戒号，他斥责莫斯科官僚的腐败并试图重新建立列宁主义政府。萨布林的主张得到了部分苏联高层的支持，他们故意放萨布林进入莫斯科，并借其向总书记[SOV.GetLeader]施加压力。[SOV.GetLeader]最终被迫辞职，政治局由此大换血。事后，副总理尼古拉·吉洪诺夫成为新的总书记，萨布林也得以进入政治局，但这是否能让苏联的政治重新焕发活力还是未知数。"
 sov.61.a:0 "苏联的未来会走向何方？"
 
 sov.62.t:0 "安德罗波夫去世！"
 sov.62.d:0 "九十多岁的尤里·安德罗波夫在经历了数年的癌症折磨之后，死在了苏联共产党总书记的任上。尽管其雄心壮志地谋求对苏联进行大刀阔斧的改革，但时间不允许其有更大的作为了。"
 sov.62.a:0 "这是苏联的悲剧！"
 
 sov.63.t:0 "苏联发生政变！"
 sov.63.d:0 "苏联共产党总书记赫鲁晓夫在黑海度假时，以勃列日涅夫、柯西金和苏斯洛夫为首的部分党员召开会议，要求其辞职。赫鲁晓夫最终被迫下台，[SOV.GetLeader]接替他的职位。"
 sov.63.a:0 "一次巨大的变故。"
 
 sov.64.t:0 "苏联开始开展玉米种植计划"
 sov.64.d:0 "克里姆林宫的会议厅里弥漫着一种奇特的焦香——讲台上赫然摆着几穗烤玉米。\n赫鲁晓夫挥舞着金黄的玉米穗，油渍在演讲稿上晕开星星点点的痕迹。"这是来自乌克兰共和国的产量报告……这是美国大使馆为我们提供的美国农业参考数据……"他的皮鞋碾过几粒崩落在地的玉米粒，爆裂声在麦克风里放大成某种隐喻。\n《真理报》头版登出集体农庄姑娘站在玉米田里的笑脸。苏联政府按照赫鲁晓夫同志的命令，将在全国开始推广玉米种植计划。"
 sov.64.a:0 "这恰玉米多是一件美事啊。"
 
 sov.65.t:0 "[SOV.GetLeader]在塔什干发表讲话"
 sov.65.d:0 "苏联共产党总书记[SOV.GetLeader]在塔什干发表讲话，表达了对改善中苏关系的想法，目前中华人民共和国没有对此发表评论"
 sov.65.a:0 "一次巨大的变故。"
 
 tsar_bom_deci:0 "大当量氢弹测试"
 sov.66.t:0 "苏联的最新核试验"
 sov.66.d:0 "北冰洋的永夜被一道强光撕裂。新地岛上的松林在千分之一秒内化为透明剪影，爆心投影点的花岗岩汽化成紫色玻璃。\n莫斯科的会议室里，赫鲁晓夫用指尖敲打着茶杯："不过是个当量略大的爆竹。"茶杯的震动在水面激起细密波纹，映着窗外克里姆林宫红星微微发颤的影子。五分钟后，塔斯社的新闻稿将"5800万吨TNT"这个数字轻描淡写地夹在第三段。\n大西洋彼岸，五角大楼的地震仪指针卡在了刻度尽头。参谋们盯着墙上的苏联地图，新地岛的位置被咖啡杯烫出一个焦痕。有人突然发现，三小时前北约演习舰队报告的极光异常，原来那是死光掠过电离层的余晖。\n"重新评估所有防御计划。"年轻的约翰·肯尼迪参议员对五角大楼的将军们说道。"
 sov.66.a:0 "核武器正在发展。"
 
 sov.67.t:0 "苏联宣布进行政治改革"
 sov.67.d:0 "苏联领导人[SOV.GetLeader]宣布，苏联将进行全面的政治改革，包括建立开放、透明的民主政府和推动言论自由。"
 sov.67.a:0 "确定。"
 
 sov.68.t:0 "苏联政府提出新思维"
 sov.68.d:0 "苏联领导人[SOV.GetLeader]提出名为新思维的新政治主张，希望推动苏联的内部改革。"
 sov.68.a:0 "确定。"
 
 sov.69.t:0 "苏联政府提出三和路线"
 sov.69.d:0 "苏联领导人[SOV.GetLeader]提出名为三和路线的新外交主张，主张社会主义国家不一定要通过战争来对抗资本主义，而是可以通过经济和科技上的竞赛，瓦解资本主义的威望。"
 sov.69.a:0 "确定。"
 
 sov.70.t:0 "[FROM.GetName]宣布支持越南共产党的斗争"
 sov.70.d:0 "[FROM.GetName]领导人[FROM.GetLeader]宣布，该国将坚定支持越南人民反对帝国主义及其傀儡政权的斗争。"
 sov.70.a:0 "确定。"
 
 sov.71.t:0 "苏联政府抨击中国修正主义"
 sov.71.d:0 "苏联领导人[SOV.GetLeader]宣布在新一次的党代会上发表强硬的演讲，抨击中国领导人的修正主义和教条主义，给中苏关系带来严重危害。"
 sov.71.a:0 "确定。"
 
 sov.72.t:0 "苏联希望改善与[ROOT.GetName]的关系"
 sov.72.d:0 "苏联领导人[SOV.GetLeader]表示，苏联希望与[ROOT.GetName]建立友好关系。"
 sov.72.a:0 "确定。"
 
 sov.73.t:0 "苏联宣布支持[ROOT.GetName]的斗争"
 sov.73.d:0 "[SOV.GetName]领导人[SOV.GetLeader]宣布，该国将坚定支持[ROOT.GetName]人民反对帝国主义及其傀儡政权的斗争。"
 sov.73.a:0 "确定。"
 
 sov.74.t:0 "苏联宣布进行经济改革"
 sov.74.d:0 "苏联领导人[SOV.GetLeader]宣布，苏联将进行全面的经济改革。"
 sov.74.a:0 "确定。"
 
 sov.75.t:0 "安东·邓尼金去世"
 sov.75.d:0 "美国密歇根州，秋叶提前飘落在流亡者公寓的窗台上。书桌上的墨水台压着未完成的回忆录稿纸，钢笔还保持着书写顿河战役的姿势。\n三十年前那个决定俄国命运的时刻仍清晰如昨——他的骑兵军刀曾劈开伏尔加河的晨雾，白卫军的旗帜一度插到距莫斯科仅四百俄里的图拉。但历史终究没有眷顾这位沙皇最后的战略家，溃败的军队在黑海港口挤满流亡船只时，他坚持带走了一袋俄罗斯泥土。\n巴黎的流亡者报纸登出讣告那日，教堂的蜡烛卖断了货。白俄老兵团挤在塞纳河畔的咖啡馆里用上好的白兰地祭奠，酒液洒在泛黄的俄罗斯地图上，晕开了当年用红蓝铅笔标注的战线。而莫斯科的教科书里，他依然被定格在"反革命匪帮首领"的铅字中。\n底特律公墓的新碑前，一株从俄亥俄移栽的白桦正在异国的风里沙沙作响。树下那个装着故乡泥土的锡盒，早已在岁月里锈成了和红军勋章一样的暗红色。"
 sov.75.a:0 "一个时代的结束。"
 
 sov.76.t:0 "白罗斯民族主义抵抗运动瓦解"
 sov.76.d:0 "白俄罗斯的松林终于归于寂静。\n这支不足百人的队伍走出森林的方式异常安静——没有军号，没有旗帜，只有靴底碾碎薄冰的脆响。走在最前面的中年人解开了磨损严重的武装带，M1895左轮手枪在雪地上砸出一个小坑。远处，苏军装甲车的柴油机空转着，车长正用望远镜确认这支衣衫褴褛的队伍里是否藏着炸弹。\n投降书签署在一辆军用卡车的引擎盖上。钢笔漏水了，洇开的蓝墨水像极了七年前他们第一次集结时，染透地图的维利亚河支流。有人注意到，苏军指挥官接过武器时，瞥了一眼那些德制MP40冲锋枪上的国防军编号，但什么也没说。\n\n来自明斯克消息。《真理报》宣布，最后一支抵抗苏联政府的白罗斯民族主义武装团体以宣布投降，二战持续至今的白罗斯武装叛乱至此告终。"
 sov.76.a:0 "确定。"
 
 sov.77.t:0 "森林兄弟抵抗运动瓦解"
 sov.77.d:0 "拉脱维亚的晨雾里飘着焦糊的皮革味。苏军士兵用枪托拨弄着仍在冒烟的营地废墟，从灰堆里踢出一本烧焦的《拉脱维亚民歌集》，烫金的民族花纹在余烬中忽明忽暗。\n发报员蹲在树桩上敲击电键，用"彻底肃清"这个标准词组向莫斯科汇报。二十米外，侦察兵正从空心橡树里拖出最后一个补给箱——里面除了瑞典制造的弹药，还有张标注着1944年德军撤退路线的地图。少校用打火机点燃了它，火苗窜起的瞬间，照亮了树皮上刻着的三枚橡叶徽章。\n\n来自列宁格勒消息。《真理报》宣布，最后一支抵抗苏联政府的森林兄弟民族主义武装团体以宣布投降。"
 sov.77.a:0 "确定。"
 
 sov.78.t:0 "班德拉抵抗运动瓦解"
 sov.78.d:0 "经过苏联河波兰军队的围剿，西乌克兰和波兰东南部最后一只有组织的班德拉武装团体宣布放下武器，至此，二战结束后长达近十年的班德拉乌克兰民族主义叛乱结束。"
 sov.78.a:0 "确定。"
 
 sov.79.t:0 "苏联宣布接受马歇尔计划"
 sov.79.d:0 "苏联外交部长莫洛托夫与英美等国代表协商以后，决定宣布接受马歇尔计划，接收来自西方国家的战后重建援助，苏联附庸下的东欧各社会主义国家也将一并纳入马歇尔计划援助范围。"
 sov.79.a:0 "确定。"
 
 sov.80.t:0 "苏联宣布拒绝马歇尔计划"
 sov.80.d:0 "苏联外交部长莫洛托夫与英美等国代表协商以后，宣布拒绝马歇尔计划，理由是该计划是西方国家向欧洲渗透影响力的政治阴谋，苏联将借助自己的力量进行重建，同样的，苏联附庸下的波兰等东欧国家也将无缘美国援助。"
 sov.80.a:0 "确定。"
 
 sov.81.t:0 "美国的马歇尔计划"
 sov.81.d:0 "美国政府公布了一系列关于振兴欧洲的战后重建计划，为欧洲国家提供一大批援助，我国亦包括在内。"
 sov.81.a:0 "接受。"
 sov.81.b:0 "拒绝。"
 
 sov.90.t:0 "列宁格勒派的崛起"
 
 sov.91.t:0 "列宁格勒市委的不正常举动"
 sov.91.d:0 "马林科夫同志向我们警告最近列宁格勒市委的一系列不正常举动，包括未经中央同意，邀请外国专家举办贸易博览会，以及利用中央的人脉，为列宁格勒地区谋取大量发展资金等。马林科夫同志和贝利亚同志呼吁我们彻查此事。"
 
 sov.92.t:0 "马林科夫和贝利亚被排挤"
 sov.92.d:0 "苏联发生政治变动，格奥尔基·马林科夫和拉夫连季·贝利亚等官员被斯大林调离莫斯科前往遥远的中亚，这可能涉及最近的列宁格勒案件。两人与已故的苏联前文化部长安德烈·日丹诺夫的矛盾由来已久，日丹诺夫疑似，他们便对日丹诺夫生前亲信的列宁格勒党委发动了报复，但斯大林受够了这种政治斗争，决定将马林科夫等人解职以示惩罚。最为替补，尼古拉·沃兹涅先斯基进入中央。"
 
 sov.93.t:0 "列宁格勒市委被清洗"
 sov.93.d:0 "苏联政府对列宁格勒地区的党委发动了突然审查，以勾结外国等罪名逮捕了尼古拉·沃兹涅先斯基等领导人，大量的官员遭受牵连。这一大规模的整治行动很有可能是格奥尔基·马林科夫和拉夫连季·贝利亚等人发起的，他们与已故的苏联前文化部长安德烈·日丹诺夫的矛盾由来已久，日丹诺夫疑似，他们便对日丹诺夫生前亲信的列宁格勒党委发动了报复。"
 
 sov.94.t:0 "安德烈·日丹诺夫去世"
 sov.94.d:0 "来自莫斯科的消息，苏联政治家安德烈·日丹诺夫因病去世——那个曾以铁腕塑造苏联文化灵魂的人，永远合上了眼睛。\n文化部的打字机暂停了工作。过去十年里，这些机器日夜不停地吐出由他定调的批判名单：从阿赫玛托娃的诗集到肖斯塔科维奇的乐章。现在，墨迹未干的《星》杂志审查令还摆在办公桌上，钢笔尖上的墨水已经干涸。\n——谁知道这是不是又一场考验？毕竟由他亲手筑起的"日丹诺夫防线"，早已化作知识分子们条件反射般的自我审查。"
 
 sov.95.t:0 "党内高层密谋反对贝利亚"
 sov.95.d:0 "在斯大林同志死后，马林科夫同志接任了苏共中央总书记一职成为最高领导人，但贝利亚利用自己掌握情报机关的权力，粗暴干涉党的政治工作，制造自己的小圈子，另立中央。赫鲁晓夫同志和布尔加宁同志决定将其扳倒。"
 sov.95.a:0 "必须将贝利亚扳倒！"
 sov.95.b:0 "还是不要得罪贝利亚"
 
 sov.96.t:0 "关于处理贝利亚问题的高级会议"
 sov.96.d:0 "随着反对贝利亚的组织形成，马林科夫同志召开苏共高级会议，准备在会议上宣布解除贝利亚的职务，但就在马林科夫准备讲话的时候，贝利亚闯进会议室，手里拿的是针对党内高级官员的黑材料……"
 sov.96.a:0 "（大吼一声扑向贝利亚）"
 sov.96.b:0 "（允许贝利亚落座讲话）"
 
 sov.97.t:0 "贝利亚被逮捕！"
 sov.97.d:0 "苏联发生政治变动！掌握情报大权的拉夫连季·贝利亚被捕，苏共中央宣布，贝利亚试图为自己谋取权力，夺取最高领导权，其阴谋已被党中央及时发现并破坏，目前贝利亚已被逮捕并关押。"
 
 sov.98.t:0 "莫斯科发生兵变！"
 sov.98.d:0 "来自苏联的紧急消息！苏共中央逮捕贝利亚的行动宣告失败！贝利亚成功逃离克里姆林宫，并前往莫斯科郊区的军事基地，纠集支持自己的武装力量试图夺取权力！"
 
 sov.99.t:0 "苏共高层发生权力变动！"
 sov.99.d:0 "苏共高层发生权力变动！拉夫连季·贝利亚扫清了反对势力，取得了苏联政局的实际控制，"
 
 sov.100.t:0 "拉夫连季·贝利亚接任苏联领导人！"
 
 sov.110.t:0 "[FROM.GetLeader]同志即将退休"
 sov.110.d:0 "在完成了苏联政治改革的理想后，[FROM.GetLeader]同志决定辞去苏共中央总书记的职务，从而将机会让给更年青一代的领导人。苏共全体会议将在不久后召开，以选出新的总书记。"
 sov.110.a:0 "你不离开权力，权力就会离开你。"
 
 sov.111.t:0 "谢列平当选苏共中央总书记"
 sov.111.d:0 "在最新一届的苏共中央全体会议中，克格勃主席亚历山大·谢列平接任为新任总书记。"
 
 sov.112.t:0 "波德戈尔内当选苏共中央总书记"
 sov.112.d:0 "在最新一届的苏共中央全体会议中，乌克兰共产党中央第一书记，苏联最高苏维埃主席团主席尼古拉·波德戈尔内接任为新任总书记。"
 
 sov.115.t:0 "苏共二十大秘密报告"
 sov.115.d:0 "在最近的苏共二十大期间，[SOV.GetLeader]在回忆午夜之后在第二十届党代会秘密会议上发表的关于个人崇拜及其后果中批评了斯大林。在这次演讲中，[SOV.GetLeader]批判了斯大林的个人崇拜和大清洗杀死了数以百万计的人口。这一讲话引起了苏共内部的震惊。"
 sov.115.a:0 "[SOV.GetLeader]的决定是正确的，斯大林主义应当被送入历史的垃圾桶了！"
 sov.115.b:0 "[SOV.GetLeader]在说什么？！他疯了！"
 
 sov.116.t:0 "《关于个人崇拜及其后果》"
 sov.116.d:0 "克里姆林宫会议厅的空气凝固了。\n赫鲁晓夫的手指在讲稿边缘留下汗渍，纸张翻动的沙沙声在死寂的大厅里异常清晰。当他念出第一个具体数字时，后排有人碰倒了茶杯，瓷器的碎裂声像某种隐喻。\n同志们，今天我要对各位发表一篇十分重要的报告……那就是公开约瑟夫·斯大林同志在世时，犯下的许多严重错误……比如……个人崇拜，政治压迫，以及对政敌的迫害……\n\n某位州委书记的钢笔突然漏墨，蓝色污渍在笔记本上扩散成模糊的乌云。老近卫军代表们不约而同地松了松领口，仿佛那些曾引以为豪的勋章突然变得滚烫。随着最后一张讲稿放下，大厅依然沉默。最先响起的不是掌声，而是此起彼伏的打火机声——颤抖的手指们急需尼古丁来确认。\n我认为我们必须结束斯大林主义带来的错误政策。"
 sov.116.a:0 "[SOV.GetLeader]的决定是正确的，斯大林主义应当被送入历史的垃圾桶了！"
 sov.116.b:0 "[SOV.GetLeader]在说什么？！他疯了！"
 
 sov.117.t:0 "我们如何看待[SOV.GetLeader]的改革？"
 sov.117.d:0 "[SOV.GetLeader]抨击斯大林的讲话不仅在苏联内部引起了争议，也引发了社会主义阵营内的激烈讨论。"
 sov.117.a:0 "[SOV.GetLeader]的决定是正确的，斯大林主义应当被送入历史的垃圾桶了！"
 sov.117.b:0 "[SOV.GetLeader]在说什么？！他疯了！"
 
 sov.118.t:0 "[FROM.GetName]赞成苏联的政治改革"
 sov.118.d:0 "[FROM.GetName]发表声明，赞成[SOV.GetLeader]最近有关斯大林主义问题的报告，并呼吁在社会主义范围内掀起一波改革的风潮。"
 
 sov.119.t:0 "[FROM.GetName]批评苏联的政治改革"
 sov.119.d:0 "[FROM.GetName]发表声明，强烈批评[SOV.GetLeader]最近有关斯大林主义问题的报告，指责苏联政府篡改马克思列宁主义，朝着资本主义修正主义的方向发展。。"
 
 sov.120.t:0 "苏联举办第一届苏联人民斯巴达克运动会"
 sov.120.d:0 "苏联政府举办了斯巴达克运动会。莫斯科接待了来自所有加盟共和国的大型运动队和身着各民族服装的观众团体。[SOV.GetLeader]利用这一活动强调了他新的政治和社会目标，并表明自己是一个与斯大林完全不同的新领导人。"
 
 sov.121.t:0 "第一届柴可夫斯基国际音乐比赛在莫斯科举行"
 sov.121.d:0 "第一届柴可夫斯基国际音乐比赛在莫斯科举行。获胜者是美国钢琴家范·克莱本，他演奏了俄罗斯音乐并轰动一时。[SOV.GetLeader]亲自批准将最高奖项授予这位美国音乐家。"
 
 sov.122.t:0 "《伊万·杰尼索维奇的一天》出版"
 
 sov.123.t:0 "关于释放亚历山大·索尔仁尼琴"
 sov.123.d:0 "异见人士和文学家亚历山大·索尔仁尼琴在斯大林时期因创作反革命文学被捕入狱，随着我国推动政治改革和倡导政治解冻，一些同志提出释放索尔仁尼琴以表示我党进行政治改革的诚意和决心。"
 
 sov.124.t:0 "亚历山大·索尔仁尼琴被释放"
 sov.124.d:0 "1957年2月，哈萨克斯坦劳改营的铁门在积雪中发出生涩的呻吟。\n他抱着褪色的帆布包站在岗亭前，呼出的白气与卫兵枪管的热雾交融在一起。八年前没收的怀表被归还时，秒针仍在走动，仿佛时间只是暂时凝固在矿石的粉尘里。劳改营会计递来一张皱巴巴的工资单，上面的卢布数额刚好够买一张三等车厢的硬座票。\n开往莫斯科的列车穿过乌拉尔山脉时，他始终把右手插在口袋里——那里藏着一叠写在卫生纸上的手稿，纸角还沾着结核病房的血迹。邻座工人抱怨着集体农庄的玉米欠收，却不知这个沉默的旅人正用目光丈量车窗外的白桦林，与记忆中劳改营警戒塔的间距。\n\n莫斯科消息。苏联知名异见人士和文学家亚历山大·索尔仁尼琴被释放，他在斯大林时期因创作反革命文学被捕入狱，索尔仁尼琴的释放被认为是苏联政治解冻的体现。"
 
 sov.125.t:0 "苏联政府提出文化解冻"
 sov.125.d:0 "苏共中央在《秘密报告》引发的政治震动余波中，今日正式提出“文化解冻”方针。新任领导人公开批评斯大林时期的文化政策，称“棍棒式管理扼杀了艺术灵魂”。\n文化部长宣布三项变革：立即成立特别委员会复审1930年代以来受批判的文艺作品；释放仍在流放的作家与作曲家；允许出版社自主决定15%的非政治题材出版物。安娜·阿赫玛托娃的诗歌将得到重新出版的机会，被禁演十年的歌剧《静寂的顿河》已列入大剧院秋季排期，爱森斯坦的未完成电影手稿也从档案库解封。但《真理报》社论同时警告：“解冻不是洪水，不能冲垮意识形态堤坝。”"
 
 sov.126.t:0 "关于马林科夫同志的问题"
 sov.126.d:0 "政治局会议弥漫着未散的雪茄烟雾。赫鲁晓夫突然拍向桌面的手掌，震翻了马林科夫面前的茶杯。褐色的茶渍在农业减产报告上洇开，像一片正在扩张的荒芜田地。\n赫鲁晓夫的手指戳向数据表。“同志们，请看，这是马林科夫同志在工业、农业和其他经济事务中取得的成绩！我们的各项数值都倒退了！并且依然远远落后于美国！这让我们在帝国主义面前无比脆弱！”他每说一个数字，就有一颗汗珠从马林科夫的光额头上滚落。当提到列宁格勒工厂的停工事件时，突然展开的《真理报》剪报扇起一阵风，吹散了马林科夫手边待签的免责文件。\n赫鲁晓夫没有理会惊慌失措的马林科夫，并在会议最后一刻图穷匕见：同志们，我提议立刻进行投票表决，结束马林科夫同志的党主席职位！"
 
 sov.127.t:0 "马林科夫被解除苏共中央总书记职务"
 sov.127.d:0 "苏共中央总书记马林科夫在最近的苏共高级会议上，被要求为列宁格勒案件承担责任，并通过投票遭到弹劾。"
 
 sov.128.t:0 "马林科夫辞职以后"
 sov.128.d:0 "马林科夫辞职以后，苏共中央就新任总书记进行投票。"
 
 sov.129.t:0 "赫鲁晓夫当选苏共中央总书记"
 sov.129.d:0 "尼基塔·赫鲁晓夫在最近的苏共中央政治局中，当选苏共中央总书记暨部长会议主席。"
 
 sov.130.t:0 "莫洛托夫当选苏共中央总书记"
 sov.130.d:0 "维亚切斯拉夫·莫洛托夫在最近的苏共中央政治局中，当选苏共中央总书记暨部长会议主席。"
 
 
 sov.131.t:0 "关于赫鲁晓夫同志的问题"
 sov.131.d:0 "在最近的苏共高级会议上，马林科夫同志、莫洛托夫同志、布尔加宁同志和对赫鲁晓夫提出批评，指责他错误的政治改革、经济改革政策和对帝国主义的友好缓和，并顺势发起了弹劾马林科夫的投票。"
 
 sov.132.t:0 "赫鲁晓夫被解除苏共中央总书记职务"
 sov.132.d:0 "正在黑海度假的赫鲁晓夫被紧急召回莫斯科。当他走进克里姆林宫会议厅时，主席台上勃列日涅夫反常地没有起身迎接。\n"尼基塔·谢尔盖耶维奇，"苏斯洛夫推着眼镜宣读决议，"您最近的玉米种植计划和政治冒险，让中央委员会很困扰。"文件在长桌上滑动的声音，像极了六年前赫鲁晓夫敲击联合国讲台的皮鞋声。\n窗外，秋雨拍打着列宁墓的红墙。这位曾把斯大林遗体拖出陵墓的领袖，此刻听着米高扬用他去年在农业展览会上的失态举例。当表决开始，连他亲手提拔的谢列平和福尔采娃都举起了手。\n退休文件签字时，钢笔突然没墨。勃列日涅夫递来自己的金笔。警卫护送他离开时，清洁工正在擦拭"建设共产主义"的标语。新安装的录音设备红灯闪烁，录下了这位退休领袖最后的自言自语。\n\n《真理报》消息，尼基塔·赫鲁晓夫经过党内投票表决，免去苏联共产党中央总书记职位，新的总书记将在不久后选举产生。"
 sov.132.a:0 ""长得太高的玉米，总是最先被收割。"
 
 sov.133.t:0 "赫鲁晓夫辞职以后"
 sov.133.d:0 "赫鲁晓夫辞职以后，苏共中央就新任总书记进行投票。"
 
 sov.134.t:0 "布尔加宁当选苏共中央总书记"
 sov.134.d:0 "尼古拉·布尔加宁在最近的苏共中央政治局中，当选苏共中央总书记暨部长会议主席。"
 
 sov.135.t:0 "卡冈诺维奇当选苏共中央总书记"
 sov.135.d:0 "拉扎尔·卡冈诺维奇在最近的苏共中央政治局中，当选苏共中央总书记暨部长会议主席。"
 
 sov.136.t:0 "苏共会议上的动荡"
 sov.136.d:0 "在最近一次苏共会议上，赫鲁晓夫总书记与马林科夫、莫洛托夫、布尔加宁和卡冈诺维奇等人发生激烈争执。尽管对方激烈批评自己的政策，但赫鲁晓夫还是借助朱可夫、福尔采娃等盟友的支持稳定了局势，针对自己的弹劾也以失败告终。"
 
 sov.140.t:0 "[SOV.GetLeader]提出全民党建设"
 sov.140.d:0 "苏共中央总书记[SOV.GetLeader]在最近的苏共全体会议上宣布，随着国家的发展和政治形势的变化，苏联共产党作为苏联的执政党，不应当再只是代表一个阶级的利益，而是要代表苏联的所有公民。无论是工人，农民，士兵，知识分子，甚至是经济改革后出现的中小企业，党都要支持和保护他们的利益，争取各阶层广大群众的认可和拥护。"
 
 sov.141.t:0 "[SOV.GetLeader]宣布裁撤古拉格劳改营"
 sov.141.d:0 "苏共中央总书记[SOV.GetLeader]宣布，随着苏联的政治改革不断推进，该国决定，撤裁全国所有的古拉格劳改营，劳改营中的凡人将转入常规监狱服刑或予以释放。"
 
 sov.142.t:0 "[SOV.GetLeader]提出东欧外交的新理论"
 sov.142.d:0 "苏共中央总书记[SOV.GetLeader]宣布，苏联决定改变对华约国家的外交政策，不再反对华约国家与西方国家接触或进行政治经济改革。"
 
 sov.143.t:0 "苏联颁布关于宗教的新政策"
 
 sov.144.t:0 "苏联宣布允许成立民间政治团体"
 
 sov.145.t:0 "苏联宣布改革检察机关制度"
 sov.145.d:0 "苏共政治局会议近期宣布，将对苏联检察机关进行改革，清除不称职的腐败官员，吸纳年轻化、革命化的干部，以提高检察机关的工作效率，推进苏联的法制建设。"
 
 sov.146.t:0 "苏联宣布改革内务委员会和警察系统"
 sov.146.d:0 "苏共政治局会议近期宣布，将对苏联警察机关进行改革，清除不称职的腐败官员，吸纳年轻化、革命化的干部，以提高司法机关的工作效率，推进苏联的法制建设。"
 
 sov.150.t:0 "美国版《战争与和平》在苏联上映"
 sov.150.d:0 "作为美国与苏联文化交流活动的一部分，由美国派拉蒙影业制作，奥黛丽·赫本主演，改编自俄罗斯问号列夫·托尔斯泰创作的小说《战争与和平》的同名电影，在苏联文化部支持下，在苏联公映。美国舆论普遍认为，电影版的《战争与和平》将在母国获得成功。\n苏联文化部长叶卡捷琳娜·福尔采娃的眉头已经皱了一百八十分钟，美国版《战争与和平》为了将长篇小说塞进200分钟的内容里删除了大量关键情节，使得电影看起来虎头蛇尾。散场时，福尔采娃对记者冷笑："他们把俄国灵魂装进了可口可乐瓶子。"\n普通民众走出电影院后对记者抱怨：托尔斯泰要从棺材里爬出来了！"
 
 sov.151.t:0 "苏联政府宣布拍摄《战争与和平》"
 sov.151.d:0 "苏联文化部在今天的记者会上表示，美国版《战争与和平》电影的质量十分钟糟糕，这侮辱了俄罗斯最重要的文学瑰宝，苏联政府已决定自己组织拍摄苏联版《战争与和平》电影。"
 
 sov.152.t:0 "《战争与和平》第一部上映"
 sov.152.d:0 "由导演谢尔盖·邦达尔丘克指导，苏联政府投资拍摄的史诗电影《战争与和平》第一部宣布上映。"
 
 sov.153.t:0 "《战争与和平》第二部上映"
 sov.153.d:0 "由导演谢尔盖·邦达尔丘克指导，苏联政府投资拍摄的史诗电影《战争与和平》第一部宣布上映。"
 
 sov.154.t:0 "《战争与和平》第三部上映"
 sov.154.d:0 "由导演谢尔盖·邦达尔丘克指导，苏联政府投资拍摄的史诗电影《战争与和平》第一部宣布上映。"
 
 sov.155.t:0 "《战争与和平》四部曲拍摄圆满结束"
