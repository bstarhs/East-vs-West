 sov.555.t:0 "苏联启动“友谊”输油管工程"
 sov.555.d:0 "苏联部长会议今日正式批准“友谊”跨国输油管道建设方案，这条总长逾4000公里的能源动脉将把伏尔加-乌拉尔油田的石油输送至波兰、捷克斯洛伐克及匈牙利等盟国。首批工程队已进驻明斯克枢纽站，预计五年内全线贯通。\n根据规划，管道以萨拉托夫为起点，分南北两线延伸：北线经布列斯特通往华沙，南线穿越喀尔巴阡山脉抵达布达佩斯。全线采用苏联自主研发的1020毫米耐寒钢管，沿途将新建17座加压泵站和3座现代化炼油厂。重工业部表示，该工程“将使社会主义兄弟国家摆脱对资本主义能源市场的依赖”。\n在华沙召开的经互会特别会议上，波兰代表称此为“经济互助的典范”，匈牙利技术人员已启程前往古比雪夫学习管道焊接技术。西方观察家指出，该管道将使苏联每年向东欧输送5000万吨原油，相当于马歇尔计划能源援助总量的三倍。"
 
 sov.556.t:0 "友谊输油管[ROOT.GetName]段动工"
 sov.556.d:0 "友谊输油管工程的[ROOT.GetName]段，已在该国境内正式动工，成千上万的工人和技术人员来到工地上见证工程的启动。"
 
 sov.557.t:0 "友谊输油管[ROOT.GetName]段竣工"
 sov.557.d:0 "友谊输油管工程的[ROOT.GetName]段已正式完工，随着工人拧下阀门，来自乌拉尔山的石油滚滚而来，为[ROOT.GetName]的工业生产注入无数的动力。"
 
 sov.558.t:0 "列宁号核动力破冰船落成启航！"
 sov.558.d:0 "今日，世界上第一艘民用核动力船舶“列宁号”破冰船在波罗的海造船厂正式交付使用。这艘全长134米的巨舰搭载三座OK-150型核反应堆，能在不补充燃料的情况下持续航行一年，标志着人类和平利用原子能进入全新阶段。\n苏联原子能委员会主席在启航仪式上宣布：“核能从此成为征服北极的可靠伙伴。”该船将常驻摩尔曼斯克港，为北方海航道商船队开辟冰层通道。其设计的破冰厚度达2.3米，航速可达18节，船上配备实验室、电影院及温室菜园，可满足船员长期极地作业需求。西方海事专家指出，这艘使用235公斤浓缩铀的破冰船，其动力相当于燃烧10万吨柴油的传统船舶。\n当“列宁号”汽笛响彻涅瓦河口时，甲板上的核辐射警示标志在北极光映照下闪烁着幽蓝光芒。这艘承载着冷战科技竞赛与人类极地梦想的钢铁巨兽，正朝着北纬80度的永冻冰层破浪前行。"
 
 sov.559.t:0 "弗拉基米尔·基尔皮奇尼科夫的最终审判"
 sov.559.d:0 "尊敬的斯大林同志：\n被关押在波多利斯克监狱的弗拉基米尔·基尔皮奇尼科夫即将迎来他的最终命运。弗拉基米尔·基尔皮奇尼科夫曾在苏联红军中担任少将，1941年9月被芬兰军队俘虏。有证据显示，基尔皮奇尼科夫受到芬兰人蛊惑，帮助他们进行反苏宣传，并参与建立俄罗斯解放军伪军，但基尔皮奇尼科夫坚持自己没有背叛祖国，称芬兰人用酷刑强迫他拍下了那些用于宣传投降的照片。\n基尔皮奇尼科夫坚持向苏联最高法院提起上诉，并将申冤材料寄到了克里姆林宫，他的最终命运将由苏共中央政治局定夺。\n"
 
 sov.560.t:0 "弗拉基米尔·基尔皮奇尼科夫被处死"
 sov.560.d:0 "苏联最高法院军事审判庭今日作出终审判决，前第10步兵师师长弗拉基米尔·基尔皮奇尼科夫少将被判处死刑并立即执行。这位在1941年9月在芬兰前线被俘的将领，被指控在战俘营参与亲芬宣传，战后更参与所谓"俄罗斯解放军"傀儡政权。\n庭审记录显示，基尔皮奇尼科夫辩称所有合作行为均系"为保全战俘生命而被迫进行"，其辩护律师出示了芬兰档案中记载的酷刑刑讯记录。但检察长援引1943年最高统帅部第270号命令，强调"任何形式的对敌合作都不可饶恕"。\n凌晨时分，列福尔托沃监狱传来沉闷枪声。随着这份判决书的归档，二战期间约570万苏联被俘军人的命运再次被推向历史聚光灯下——他们既是战争的受害者，却也可能成为国家记忆的背叛者。"
 
 sov.561.t:0 "弗拉基米尔·基尔皮奇尼科夫的最终审判"
 
 sov.562.t:0 "第一军事建设处被剿灭"
 sov.562.d:0 "苏联国家内务部与检察机关联手实施了一次雷霆行动，一举捣毁了长期活跃的庞大诈骗组织“第一军事建设处”，其头目尼古拉·帕夫连科及其数十名核心成员被捕归案。此案以其持续时间之长、涉案金额之巨、手法之大胆，震惊全国。\n调查显示，帕夫连科原为二战时期的一名苏军士兵。他并未奔赴前线，而是趁乱逃离部队，并利用窃取的军官制服、公章及空白文件，凭空伪造出一个隶属于国防部的“第五军事建设处”。凭借这身“虎皮”，该团伙在战争期间及战后数年里，公然“承接”了从军营修缮到道路建设的众多军事工程项目，通过虚报预算、以次充好等手段，疯狂敛财超过三千八百万卢布.\n战后，该组织更名为“第一军事建设处”继续活动，其诈骗网络甚至延伸至多个加盟共和国。最终，因其长期、大规模拖欠下属建筑工人的工资，导致愤怒的工人集体举报，这个精心编织了十余年的谎言堡垒才从内部轰然坍塌。此案暴露了战后初期管理体制中的巨大漏洞，帕夫连科的落网，也标志着苏联司法机构对利用战时混乱及国家威信进行犯罪的活动，展开了强力清算。"
 
 
 
 sov.600.t:0 "贝利亚宣布打倒阴谋反党集团！"
 sov.600.d:0 "在贝利亚惊险地赢得苏共高层的内部斗争后，贝利亚立刻调集忠于自己的内务部和克格勃武装力量进入莫斯科控制局势，并宣布，以尼基塔·赫鲁晓夫、莫洛托夫和布尔加宁为首的阴谋反党颠覆集团，试图武装夺取政权，破坏社会主义制度和党的微信，已被开除党籍并关押等候审判，此外，贝利亚指责马林科夫未能有效阻止反党集团的颠覆行动，马林科夫在巨大的压力下被迫辞职。"
 
