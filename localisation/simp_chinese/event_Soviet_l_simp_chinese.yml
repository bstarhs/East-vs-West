 sov.372.d:0 "苏联政府今日正式颁布法令，宣布结束对阿布哈兹民族长达数十年的集体流放。这一决定是“撤销过去政治错误”政策的重要组成部分。在斯大林执政时期，苏联当局曾以“担忧集体背叛”为由，于1944年将整个阿布哈兹民族强行迁离高加索故土，驱逐至中亚和西伯利亚等荒僻之地。这一残酷行动造成了大量人员因饥寒与疾病死亡，成为该民族历史上的巨大创伤。\n根据新法令，流散在外的数十万阿布哈兹人将被允许自愿迁回北高加索的原籍家乡。此举旨在纠正历史上的错误政策，缓解民族矛盾，但长期流放造成的积怨与故土重建的实际困难，仍将是后续面临的严峻挑战。"
 
