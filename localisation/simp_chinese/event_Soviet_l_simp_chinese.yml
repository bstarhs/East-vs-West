 sov.640.t:0 "贝利亚率团访问英国"
 sov.640.d:0 "苏联领导人拉夫连季·贝利亚访问了伦敦，这标志着苏联在斯大林之后首次对西方进行高层访问，这是一次以“和平共处”为重点的冷战重大事件。他们会见了首相安东尼·艾登，与温斯顿·丘吉尔共进午餐，参观了白金汉宫、威斯敏斯特教堂、圣保罗教堂，并与工党领导人举行了会谈，但面临着苏伊士危机和苏联内部政治等挑战，使其成为魅力攻势、外交机会和最终有限突破的混合体。"

