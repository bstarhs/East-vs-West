 sov.373.d:0 "苏联政府今日正式颁布法令，宣布结束对乌法鞑靼民族长达数十年的集体流放。这一决定是“撤销过去政治错误”政策的重要组成部分。在斯大林执政时期，苏联当局曾以“担忧集体背叛”为由，于1944年将整个鞑靼民族强行迁离鞑靼斯坦州故土，驱逐至中亚和西伯利亚等荒僻之地。这一残酷行动造成了大量人员因饥寒与疾病死亡，成为该民族历史上的巨大创伤。\n根据新法令，流散在外的数十万鞑靼人将被允许自愿迁回鞑靼斯坦的原籍家乡。此举旨在纠正历史上的错误政策，缓解民族矛盾，但长期流放造成的积怨与故土重建的实际困难，仍将是后续面临的严峻挑战。"
 
 sov.374.t:0 "苏联政府结束伏尔加河德意志人的流放"
 sov.374.d:0 "苏联政府今日正式颁布法令，宣布结束对伏尔加河德意志人长达数十年的集体流放。这一决定是“撤销过去政治错误”政策的重要组成部分。在斯大林执政时期，苏联当局曾以“担忧集体背叛”为由，于1944年将整个伏尔加河德意志人强行迁离故土，驱逐至中亚和西伯利亚等荒僻之地。这一残酷行动造成了大量人员因饥寒与疾病死亡，成为该民族历史上的巨大创伤。\n根据新法令，流散在外的数十万伏尔加河德意志人将被允许自愿迁回原籍家乡。此举旨在纠正历史上的错误政策，缓解民族矛盾，但长期流放造成的积怨与故土重建的实际困难，仍将是后续面临的严峻挑战。"
 
 
 sov.375.t:0 "苏联政府为尼古拉·布哈林平反"
 sov.375.d:0 "作为去斯大林化和解冻的一部分，苏联政府宣布，为布尔什维克政治家尼古拉·布哈林恢复名誉。\n尼古拉·布哈林曾是布尔什维克理论家，列宁亲密战友，《真理报》主编，参与了十月革命，后成为共产国际领导人，支持新经济政策，主张渐进式社会主义建设。1938年莫斯科审判中被指控叛国罪处决。"
 
 sov.376.t:0 "苏联政府为格里戈里·季诺维也夫平反"
 sov.376.d:0 "作为去斯大林化和解冻的一部分，苏联政府宣布，为布尔什维克政治家格里戈里·季诺维也夫恢复名誉。\n格里戈里·季诺维也夫曾是列宁时期政治局委员，共产国际首任主席。1924年列宁死后与加米涅夫、斯大林组成三头同盟，后与托洛茨基结盟失败。1936年第一次莫斯科审判中被处决。"
 
 sov.377.t:0 "苏联政府为列夫·加米涅夫平反"
 sov.377.d:0 "作为去斯大林化和解冻的一部分，苏联政府宣布，为政治家列夫·加米涅夫恢复名誉。\n列夫·加米涅夫曾是列宁核心圈成员，莫斯科苏维埃主席。1924年与季诺维也夫共同反对托洛茨基，后又被斯大林清洗。与季诺维也夫一同在1936年被处决。"
 
 sov.378.t:0 "苏联政府为阿列克谢·李可夫平反"
 sov.378.d:0 "作为去斯大林化和解冻的一部分，苏联政府宣布，为政治家阿列克谢·李可夫恢复名誉。\n阿列克谢·李可夫曾是苏联人民委员会主席，支持布哈林的新经济政策，1930年被斯大林撤职。1938年第三次莫斯科审判中被处决。"
 
 sov.379.t:0 "苏联政府为米哈伊尔·图哈切夫斯基平反"
 sov.379.d:0 "作为去斯大林化和解冻的一部分，苏联政府宣布，为军事家米哈伊尔·图哈切夫斯基恢复名誉。\n米哈伊尔·图哈切夫斯基是苏联元帅，军事理论家，大纵深作战理论提出者。1937年被处决。"
 
 sov.380.t:0 "苏联政府为奥西普·曼德尔施塔姆平反"
 sov.380.d:0 "作为去斯大林化和解冻的一部分，苏联政府宣布，为文学家奥西普·曼德尔施塔姆恢复名誉。\n奥西普·曼德尔施塔姆沙俄白银时代的著名诗人，1933年因写诗讽刺斯大林被捕，后死于劳改营。"
 
 sov.381.t:0 "苏联政府为安娜·阿赫玛托娃平反"
 sov.381.d:0 "作为去斯大林化和解冻的一部分，苏联政府宣布，为文学家 安娜·阿赫玛托娃恢复名誉。\n 安娜·阿赫玛托娃是沙俄时代的著名诗人。"
 
 sov.382.t:0 "小说《解冻》出版"
 sov.382.d:0 "苏联作家伊利亚·爱伦堡创作的短篇小说《解冻》被允许发表在苏联官方的《新世界》杂志上，这部小说抨击官僚主义、宣扬人道主义，反应了斯大林病逝、赫鲁晓夫上台以后苏联社会的自由化氛围。"
 
 sov.383.t:0 "苏联政府为德米特里·巴甫洛夫平反"
 sov.383.d:0 "1956年，苏联政府正式宣布，为在苏德战争初期因惨败而被处决的西部方面军司令德米特里·巴甫洛夫大将恢复名誉。巴甫洛夫在1941年6月战争爆发后，指挥的方面军在明斯克战役中遭到毁灭性打击，部队损失惨重，导致战争初期苏军陷入极度被动。他随后被迅速逮捕，并以“怯战、渎职、叛国”等罪名被枪决。\n此次平反决定是基于苏联官方的重新审查。当局宣布，经调查确认，巴甫洛夫并无叛国或与敌方勾结的证据。然而，平反结论并未恢复其军事声誉。官方声明明确指出，其失败的主要原因是“指挥上的严重疏忽与无能”，未能有效组织防御应对德军的“巴巴罗萨”突袭行动。"
 
 
 
 sov.390.t:0 "共产党和工人党国际会议筹备"
 sov.390.d:0 "在赫鲁晓夫发起去斯大林化的改革并引发一系列政治事件后，社会主义国家的执政党之间就此事出现了巨大的分歧和矛盾，有的国家支持根除斯大林留下的错误，也有人坚持斯大林主义路线。\n苏联政府对此提出，呼吁各国召开一次共产党和工人党国际会议，以弥补分歧，巩固社会主义阵营之间的团结。"
 
 sov.391.t:0 "[FROM.GetName]拒绝召开会议"
 sov.391.d:0 "[FROM.GetName]拒绝参加共产党和工人党国际会议，他们认为他们所坚持的才是正确的社会主义路线，而拒绝与其他不同主张的国家对话。"
 
 sov.392.t:0 "共产党和工人党国际会议即将召开"
 sov.392.d:0 "共产党和工人党国际会议得到中国、南斯拉夫等国共产党的支持，会议已进入筹备阶段。"
 
 sov.393.t:0 "共产党和工人党国际会议在莫斯科召开"
 sov.393.d:0 "共产党和工人党国际会议召开，数十个国家的共产党首脑齐聚莫斯科。"
 
 sov.394.t:0 "毛泽东就国际局势发表讲话"
 sov.394.d:0 "在莫斯科的共产党和工人党国际会议上，中共领导人毛泽东就国际局势发表了一句骇人听闻的讲话：\n如果打原子战争，人会死绝的。我说，极而言之，死掉一半人，还有一半人，帝国主义打平了，全世界社会主义化了，再过多少年，又会有二十七亿，一定还要多。"
 
 sov.395.t:0 "苏联提出缓和社会主义阵营之间的关系"
 sov.395.d:0 "苏联领导人[SOV.GetLeader]认为，由于社会主义各国选择了不同的发展模式和道路，导致各国之间因为社会主义道路产生分歧。[SOV.GetLeader]呼吁各国求同存异，不应过多的关注所谓的教条主义和修正主义的矛盾。"
 
 sov.396.t:0 "[FROM.GetName]支持社会主义国家团结"
 sov.396.d:0 "[FROM.GetName]领导人[SOV.GetLeader]赞成社会主义各国之间放弃无用的路线斗争，缓和矛盾，促进团结。"
 
 sov.397.t:0 "[FROM.GetName]坚决反对修正主义"
 sov.397.d:0 "[FROM.GetName]领导人[SOV.GetLeader]不愿意接受苏联政府提出的放弃路线斗争的团结政策，他们坚持己方的路线是唯一正确的社会主义和共产主义。"
 
 sov.398.t:0 "赫鲁晓夫呼吁改善与西方国家关系"
 sov.398.d:0 "克里姆林宫的大厅里，赫鲁晓夫对着参加共产党国际会议的各国代表们谈论着所谓的和平竞赛。\n同志们，我认为核战争是没有赢家，对付美国人和帝国主义，不应该使用原子武器，而是发展我们的经济、民生、文化、科技……\n\n突然，赫鲁晓夫从演讲台下拿出一张报纸。\n\n各位请看，美国的黑人民权运动愈演愈烈，这证明美帝国主义实际上外强中干，不需要原子弹就能打败他，我们所需要做的，就是发展自己，让美国人民看到社会主义制度的优越性！"
 
 sov.399.t:0 "赫鲁晓夫与阿尔巴尼亚代表激烈争吵"
 sov.399.d:0 "在今日举行的共产党国际会议上，一场关于国际共运路线的尖锐论战在阿尔巴尼亚与苏联代表团之间爆发，将东西方意识形态阵营的内部裂痕公之于众。\n阿尔巴尼亚代表团团长穆罕默德·谢胡率先发难，其言辞之激烈震惊全场。他猛烈抨击苏共中央第一书记赫鲁晓夫提出的“和平共处”总路线，指控这是彻头彻尾的“修正主义”。谢胡宣称，与帝国主义国家谋求缓和是对全球社会主义革命事业、特别是对正在进行的第三世界民族解放运动的“严重背叛”，是向资本主义世界危险的妥协与投降。阿尔巴尼亚坚持，唯有通过坚定不移的暴力革命和阶级斗争，才能彻底击败西方帝国主义体系。\n面对阿尔巴尼亚的指控，苏联代表团予以强硬回击。他们反唇相讥，指责地拉那当局固守僵化的“教条主义”，全然不顾世界力量对比已发生根本变化的现实。苏联代表强调，在核时代背景下，避免战争、争取和平的竞赛环境符合社会主义阵营的根本利益，要求阿尔巴尼亚领导人应“审时度势”，理解苏联政策的战略考量。\n这次公开的激烈冲突，远非一次寻常的外交争吵，它深刻地标志着国际共产主义运动内部，在革命路径与斗争策略上的根本性分歧已完全公开化、表面化。阿尔巴尼亚作为对苏立场最尖锐的批评者，其强硬姿态预示着社会主义阵营的统一战线将面临更为严峻的考验。"
 
 sov.400.t:0 "共产党和工人党国际会议闭幕"
 sov.400.d:0 "共产党和工人党国际会议闭幕"
 
 sov.410.t:0 "苏联首座民用核电站落成！"
 sov.410.d:0 "苏联开发的首座原子能发电站已在卡卢加州落成，这座核电站装机容量为5千千瓦，可以为苏联数百万户家庭和工厂提供能源，这标志着苏联正式踏入了民用核能时代。"
 
 
 
 sov.420.t:0 "斯大林同志的生日"
 sov.420.d:0 "社会主义国家的领袖、苏联革命的导师、苏维埃的伟大父亲、第二次世界大战的胜利者……约瑟夫·斯大林同志，即将迎来自己的70岁生日，全苏联，和全世界的社会主义国家都将派遣代表参与这次盛会。斯大林对此表示，热烈邀请各国的党派和领袖来到莫斯科齐聚一堂，不仅是为自己庆祝生日，也借此机会，共同商讨和谈论社会主义国际合作的重要事宜。\n苏联政府已经开始为此进行准备，来自全苏联各地的礼物送往莫斯科，全国各地都悬挂起斯大林同志的肖像画。\n苏联许多工厂单位和集体农庄宣布，他们将举行超额完成生产任务的获得，作为献给斯大林同志的礼物。"
 sov.420.a:0 "祝愿斯大林同志万寿无疆！永远健康！"
 
 sov.421.t:0 "生日宴会的计划"
 sov.421.d:0 "尊敬的斯大林同志：\n您的七十岁生日宴会即将举办，您的伟大功绩，人民永远牢记。因此，我们希望为您举办一个规模宏大的宴会，使其足以媲美您的光荣形象。当然，我国正处于伟大的卫国战争结束不久的恢复期，如果您希望节约资源，也可以将宴会操办的简单一些。"
 
 sov.422.t:0 "[ROOT.GetName]将出席斯大林同志的生日宴会"
 sov.422.d:0 "[ROOT.GetName]共产党的领导人[ROOT.GetLeader]将前往莫斯科，出席斯大林的生日宴会。"
 
 sov.423.t:0 "[ROOT.GetName]拒绝邀请"
 sov.423.d:0 "[ROOT.GetName]外交部表示，该国领导层由于政务繁忙，将遗憾地不派代表参加斯大林的生日宴会。"
 
 sov.424.t:0 "毛泽东访问莫斯科！"
 sov.424.d:0 "莫斯科消息，中国共产党，或者说，中华人民共和国的最高领导人，毛泽东，已乘坐火车抵达莫斯科，他此行前来参加斯大林的七十岁生日宴会，同时也带着外交任务而来。毛泽东打败了国民党政府，并在中国建立了一个新的共产主义国家，然而这个新生的国家仍处于动荡和贫穷之中，且其旅顺港仍被苏联所占领——这是国民党政府二战后对苏联的让步。如今毛泽东来到苏联，其目的不仅是向苏联索取援助，也要向斯大林讨要旅顺。"
 sov.6.a:0 "中俄人民永远是兄弟！"
 
 sov.425.t:0 "毛泽东与苏联政府会谈"
 sov.425.d:0 "毛泽东抵达莫斯科后不久，代表中国政府与苏联外长莫洛托夫进行了第一次会谈。双方在苏联援助中国这一问题上达成了部分共识，但却在最关键的问题——旅顺港的主权问题上陷入僵局。毛泽东认为旅顺毫无疑问是中国领土，苏联应当将其归还中国，而苏联却不愿意放弃旅顺，因为这是苏联在远东唯一的不冻港，沙俄曾为与日本争夺此地付出巨大的代价。莫洛托夫提出了替代方案，即旅顺的主权归还中共，而苏军继续在旅顺驻扎，这引发了毛泽东的不悦。"
 sov.6.a:0 "中俄人民永远是兄弟！"
 
 sov.426.t:0 "斯大林的寿宴正式开始"
 sov.426.d:0 "斯大林盛大的生日宴会在莫斯科的圣乔治大厅正式开始，这座沙皇时代用于加冕典礼的奢华大厅，如今用于苏联的重大国事活动。\n来自苏联各地的工农、党员代表和来自世界各国的社会主义政要齐聚一堂。\n活动开始，马林科夫、莫洛托夫等领导人发表长篇颂词，称斯大林为人类天才，科学与和平的灯塔。苏联国家交响乐团演奏《斯大林颂歌》，芭蕾舞团演出《天鹅湖》选段。宴会开始后，鱼子酱、高加索烤肉、格鲁吉亚葡萄酒等被献上餐桌。"
 
 sov.427.t:0 "斯大林拒绝修改中苏条约"
 sov.427.d:0 "苏联方面向我们回信：\n苏联政府坚持莫洛托夫提出的方案，他们不会向我们完全移交旅顺的主权。"
 
 sov.428.t:0 "中国政府做出让步"
 sov.428.t:0 "中国政府最终决定不再坚持苏联完全交回旅顺港的主权。"
 
 sov.429.t:0 "毛泽东拒绝出席生日宴会"
 sov.429.t:0 "毛泽东对苏联不愿意向中国归还旅顺一事感到愤怒，他由此躲在莫斯科下榻的旅馆中闭门不出，不愿再与苏联官员见面，甚至拒绝出席不久即将举办的斯大林七十岁生日宴会。毛泽东对苏联官员表示：我现在的任务只有三个，吃饭，睡觉，拉屎。"
 
 sov.430.t:0 "苏联做出让步"
 sov.430.d:0 "苏联方面向我们回信：\n苏联政府已接受我方提出的要求，他们将择日同我们讨论完全移交旅顺主权的事宜。"
 
 sov.431.t:0 "《中苏友好同盟互助条约》签订"
 sov.431.t:0 "中共领导人毛泽东和斯大林正式签署了新的《中苏友好同盟互助条约》签订，以取代国民党政府的《中苏友好条约》，新的条约宣布，苏联将向中共政府提供援助，此外，正式结束苏联对旅顺港的管制，双方将在日后就旅顺问题进行进一步谈判。"
 
 sov.432.t:0 "第四个五年计划结束"
 sov.432.t:0 "苏联共产党召开会议，宣布苏联第四个五年计划圆满完成。五年计划要求苏联将经济恢复到战前标准，且最好超过他。苏联政府宣布，在党的五年计划指导和全国人民共同努力下，五年计划获得了巨大的成功。乌克兰和白罗斯的经济生产已恢复正常。"
 
 sov.433.t:0 "犹太人要求移民以色列"
 sov.433.d:0 "随着以色列建国独立，犹太人移民前往巴勒斯坦迎来了一个新高潮。随着我国与以色列建立外交关系，大量犹太人聚集在以色列领事馆，要求我国允许他们回归以色列地。"
 
 sov.434.t:0 "索罗门·米霍埃尔斯车祸去世"
 sov.434.d:0 "苏联著名犹太演员，曾在第二次世界大战中担任犹太人反法西斯委员会主席的索罗门·米霍埃尔斯在明斯克遭遇车祸意外去世，享年57岁。"
 
 sov.435.t:0 "犹太人反法西斯委员会解散"
 sov.435.d:0 "随着第二次世界大战宣告结束，苏联所成立的犹太人反法西斯委员会在斯大林命令下解散。"
 
 sov.436.t:0 "维诺格拉多夫被捕"
 sov.436.d:0 "莫斯科消息！曾为苏共官员日丹诺夫治疗疾病的苏联医生弗拉基米尔·维诺格拉多夫被苏联内务委员会逮捕！苏联安全部门负责人谢苗·伊格纳季耶夫指责，在以色列建国后，许多苏联犹太人出现了支持犹太复国主义的倾向，并失去了对苏维埃的忠诚。伊格纳季耶夫还提出，应该尽快对苏联境内的所有犹太人，尤其是已经进入政府部门工作的人进行调查！"
 
 sov.437.t:0 "《披着教授和医生外衣的卑鄙间谍与杀人犯》"
 sov.437.d:0 "苏联真理报发表社论：《披着教授和医生外衣的卑鄙间谍与杀人犯》\n随着以色列建国，犹太复国主义在苏联兴起。许多犹太人失去了对苏维埃的忠诚，而去向往这个所谓的以色列祖国。真理报呼吁，尽快对苏联党和政府中的犹太人进行彻底的分割。"
 
 sov.438.t:0 "维诺格拉多夫承认自己是英国间谍"
 sov.438.d:0 "克格勃主席谢苗·伊格纳季耶夫宣布，经过严肃的调查和审讯，弗拉基米尔·维诺格拉多夫承认自己是英国情报机构打入苏联内部的特务，并且其已经被以色列政府收买，在为日丹诺夫同志治病时将其毒死，以报复苏联没有在以色列独立战争中提供帮助。\n维诺格拉多夫还坦白，与以色列勾结的情报网已经遍布苏联，他们将逐个暗杀包括斯大林同志在内的苏联共产党领导人，代之以亲以色列分子，建立一个支持全球犹太人复国主义的傀儡苏联政府。\n伊格纳季耶夫向最高苏维埃报告了此情况，他呼吁立刻对这个可能的犹太情报网展开调查。"
 
 sov.439.t:0 "工人家庭迁入新家"
 sov.439.d:0 "《真理报》为您带来来自乌克兰苏维埃共和国首府基辅的消息：\n年轻的铁路工人弗拉基米尔·尤先科同志，在二战结束后，一直居住在拥挤而潮湿的棚屋中，尽管苏联在二战后进行了重建，但住房依然不能满足膨胀的苏联人口。苏共新任总书记赫鲁晓夫提出了替代方案，一种用预制板建造的新型公寓在苏联国内遍地开花，这种公寓建造时间短、成本低，能够以最快的速度满足苏联人对住房的需求，赫鲁晓夫下令大量建造，并优先供应给为苏维埃重建作出贡献的工人阶级。\n尤先科同志因为优秀的工作成绩，有幸成为乌克兰最早迁入新型公寓的人之一。他与妻子迁入基辅郊区的新型公寓楼已经一个多月，这座六层的公寓楼居住了十八户人家，楼内有完整的供电、供水和供暖系统，尽管单个房间的面积不大，但该有的设施设备一应俱全，尤先科一家在家中布置了暖炉和电视机，并对记者表示：他十分感谢党和国家为他提供的新家，唯一的缺点就是公寓的墙太薄了，以至于他不得不在墙上挂起厚厚的毛毯格挡噪音。"
 sov.439.a:0 "家，温暖的家。"
 
 
 sov.440.t:0 "冬夜医嘱"
 sov.440.d:0 "克里姆林宫的壁炉噼啪作响，斯大林松开按在太阳穴上的手指，在病历本上留下一道铅灰色划痕。告诉我实话，医生同志，像对普通病人那样。我还剩下多久？\n医生扶正眼镜，喉结滚动了一下：心肌供血不足，加上长期过度劳累......\n告诉我具体时间。领袖打断道。\n炉火将两人的影子投在挂满勋章的外套上。医生想起三小时前内务部长的警告，但此刻只看见一个浮肿的老人——他松弛的眼皮下垂着，像未熨平的缎子。\n配合治疗的话，可能三到五年......\n斯大林突然笑起来，震得痰液在胸腔里嗡鸣：1917年我们只有木棍，现在有了原子弹。可你们依然连一个老布尔什维克的心脏都修不好。\n医生递药的手在颤抖。斯大林凝视着掌心的硝酸甘油片。壁炉里，一段桦木塌陷进灰烬中。房间的角落，留声机吱呀吱呀地低声播放着歌曲……"
 sov.439.a:0 "为了寻找爱人坟墓，天涯海角我都走遍……"
 sov.439tool:0 "约瑟夫·斯大林的生命即将走到尽头"
 
 sov.441.t:0 "斯大林的葬礼今日举行"
 sov.441.d:0 "莫斯科飘着湿雪。六十四个国家的外交官站在列宁墓观礼台上，英国大使搓着手低声说："这天气像极了丘吉尔说的铁幕。"\n当十二名元帅抬着斯大林的水晶棺走向陵墓时，法国大使突然发现——赫鲁晓夫站在了通常属于贝利亚的位置。中国代表团成员迅速记下这个细节，而东德代表则数着政治局委员们与马林科夫的距离变化。哀乐声中，美国大使盯着贝利亚不断摩挲公文包的手指。\n正午鸣炮时，水晶棺落入墓穴的刹那，赫鲁晓夫扶住了踉跄的马林科夫。一名记者后来在报告里写道：当泥土盖上棺木时，我听见了三重唱——哀悼声、雪落声，还有权力齿轮重新咬合的咯吱声。\n葬礼结束后，各国使馆的电报机响彻深夜。而清洁工在大厅扫出了二十三个被踩扁的烟盒。"
 sov.441.a:0 "政治涌动已经开始。"
 
 sov.442.t:0 "亚历山大·多布罗沃利斯基的悟道"
 sov.442.d:0 "去斯大林化的风潮席卷整个苏联。在党内，各级党员们为突如其来的意识形态路线大转变搞得焦头烂额，而在莫斯科郊外，一座印刷厂里，年轻的共青团员亚历山大·亚历山德罗维奇·多布罗沃利斯基，也被突然的转向震碎了世界观。\n多布罗沃利斯基从小就听着斯大林和布尔什维克的故事长大，在他的心里，斯大林就是世界上最伟大的人，是慈父，是领袖，可现在，苏联政府突然告诉所有人，斯大林是独裁者、是暴君、是刽子手……多布罗沃利斯基无法接受这一切，他和所有人都大吵一架，然后陷入了深深的沉思……\n过去的我，都生活在谎言当中……斯大林、共产党、赫鲁晓夫，他们都在欺骗我，他们满嘴谎话，虚伪无耻……\n可如果苏联是邪恶的，那谁是正义的呢？苏联最大的敌人是谁？是纳粹德国，是希特勒……\n如果苏联是邪恶的，那么纳粹就是正义的……"
 sov.442.a:0 "啊？不是等会，你说什么？"
 
 sov.443.t:0 "致苏共中央委员会"
 sov.443.d:0 "荣幸向您汇报，R-7型洲际弹道导弹已于拜科努尔试验场完成首次全射程试射。\n试验数据表明：导弹成功命中堪察加半岛库拉靶场，飞行距离8000公里、圆概率误差控制在10公里内。\n当前已完成3次成功试射，主要技术问题均已解决。预计经6个月部队适应性训练后，可于1958年第二季度列装战略火箭军。R-7的服役将使我国首次具备对美国本土实施战略核打击能力，彻底改变全球战略平衡。恳请中央批准量产计划，并配套建设发射井设施。"
 sov.443.a:0 "太好了。"
 
 sov.444.t:0 "诺里尔斯克古拉格发生囚犯暴动！"
 
 sov.450.t:0 "鲍里斯·帕斯捷尔纳克获得诺贝尔文学奖！"
 sov.450.d:0 "苏联异见作家鲍里斯·列昂尼多维奇·帕斯捷尔纳克因其创作的《日瓦戈医生》获得诺贝尔文学奖！\n帕斯捷尔纳克兴奋地致电瑞典学院：“极为感谢！激动！荣耀！惊讶！惭愧。”"
 
 sov.451.t:0 "帕斯捷尔纳克拒绝领取诺贝尔文学奖"
 sov.451.d:0 "鲍里斯·帕斯捷尔纳克获得诺贝尔文学奖在苏联引起轩然大波，苏联政府向帕斯捷尔纳克施加压力，莫斯科不希望一个反对苏联政治体制的作家获得国际关注。\n帕斯捷尔纳克致信斯德哥尔摩：鉴于我所从属的社会对我被授奖所做的解释，我必须拒绝领奖，请勿因我的自愿拒绝而不快。"
 
 sov.452.t:0 "鲍里斯·帕斯捷尔纳克抵达斯德哥尔摩"
 sov.452.d:0 "令人震惊的消息，苏联政府不仅没有阻止鲍里斯·帕斯捷尔纳克，一个反对苏联政治体制的作家领取诺贝尔文学奖，并主动发表声明表示祝贺。\n帕斯捷尔纳克于今天早晨抵达斯德哥尔摩，参加诺贝尔奖的颁奖典礼，人们认为这是苏联政治解冻并走向改革的又一成果。"
 
 sov.455.t:0 "东欧国家的国际地位问题"
 sov.455.d:0 "苏联领导人[SOV.GetLeader]今日在联合国大会发表争议性演讲，强烈批评现行国际秩序对前轴心国家的歧视性政策。演讲中特别指出匈牙利、保加利亚、罗马尼亚和芬兰四国至今未能加入联合国，称这是"冷战思维的不公正体现"。\n"战争已结束十年，继续惩罚这些被迫卷入冲突的国家有违联合国宪章精神，"演讲者挥舞着拳头强调。他列举四国在战后重建中的努力，称布达佩斯和赫尔辛基早已"清算法西斯影响"。\n安理会宣布将召开特别会议讨论成员扩增问题。这场外交角力，预示着东西方在联合国舞台上的对抗进入新阶段。"
 
 sov.456.t:0 "美国拒绝东欧四国加入联合国"
 sov.456.d:0 "美国驻联合国大使反对苏联提出匈牙利、保加利亚、罗马尼亚和芬兰重新加入联合国的主张，指其"试图瓦解战后秩序"。被点名的四国中三国属苏联势力范围。分析认为此举意在削弱西方对东欧的外交孤立，同时试探美国反应。芬兰代表在走廊对记者表示"谨慎欢迎"，而伦敦方面立即重申"联合国成员资格必须严格审核"。"
 
 sov.457.t:0 "美国与苏联的谈判"
 sov.457.d:0 "美国驻联合国大使与苏联大使今日在纽约举行对话会议，讨论匈牙利、保加利亚、罗马尼亚和芬兰重新加入联合国事宜。\n美国代表认为，既然苏联要求四个亲苏的前轴心国国家加入联合国，那也应该支持意大利、西班牙和日本这三个不在莫斯科势力范围内的前轴心国家加入联合国，以体现公平公正。"
 
 sov.458.t:0 "美苏谈判破裂"
 sov.458.d:0 "美苏两国就前轴心国成员加入联合国一事的谈判以失败告终，苏联坚持匈牙利、保加利亚、罗马尼亚和芬兰重新加入联合国，却拒绝意大利、西班牙和日本的回归，被西方媒体指责为带有政治目的的双重标准，谈判不欢而散。"
 
 sov.459.t:0 "美苏谈判圆满结束。"
 sov.459.d:0 "美苏两国就前轴心国成员加入联合国一事的谈判今日宣告结束，双方就多个前轴心国家加入轴心国一事达成共识。匈牙利、保加利亚、罗马尼亚和芬兰将获得重新加入轴心国的机会，作为让步，苏联将不反对意大利、西班牙和日本加入联合国。"
 
 
 sov.470.t:0 "Strela计算机投入使用。"
 sov.470.d:0 "我国第一台大型真空管计算机Strela今日研制成功并投入使用。Strela由莫斯科245特别研究所设计，并将很快投入到科研和经济领域的使用。"
 
 sov.471.t:0 "苏联首艘攻击型核动力潜艇下水！"
 sov.471.d:0 "苏联首艘攻击型核动力潜艇K-3“列宁共青团”号今日下水服役！核潜艇下水大大加强了苏联的海军实力和核威慑。"
 
 sov.472.t:0 "苏联电影《士兵之歌》上映"
 sov.472.d:0 "由格里高利·丘赫莱依指导，莫斯科电影制片厂制作的电影《士兵之歌》上映。\n影片讲述19岁的士兵阿廖沙在二战期间获得短暂休假，回家探望母亲的故事。影片以抒情的方式展现战争中的普通人，而非宏大的英雄叙事。\n影片在西方国家亦引起关注，有可能获得奥斯卡最佳原创剧本奖提名。"
 
 
 sov.473.t:0 "苏联发售KVN-49电视机" 
 sov.473.d:0 "苏联的亚历山德罗夫制造厂发售了苏联第一款商用电视机，这款售价便宜且质量耐用的电视机很快得到苏联民众的欢迎，这意味着电子产品进入苏联民间市场，电视等家用电器将不再是昂贵的奢侈品。" 
 
 sov.474.t:0 "苏联发售Rekord-52型收音机" 
 sov.474.d:0 "苏联的东京通信工业推出苏联首批便携式晶体管收音机Rekord-52型。Rekord-52采用电子管技术，木质外壳，主要用于接收中波和短波广播。" 
 
 sov.475.t:0 "伏尔加牌GAZ-21诞生" 
 sov.475.d:0 "苏联高尔基汽车厂推出了全新的伏尔加牌GAZ-21民用轿车。GAS-21搭载2.4L发动机，最高时速130 km/h，价格实惠且耐用，这意味着民用轿车进入苏联民间市场，不再是昂贵的奢侈品。"
 
 
 sov.480.t:0 "首届美国国家展览会即将在莫斯科举办" 
 
 sov.481.t:0 "理查德·尼克松抵达莫斯科" 
 
 sov.482.t:0 "在一座郊区板房……" 
 sov.482.d:0 "尼克松与赫鲁晓夫来到展览会会场外的一座板房，在这栋不算太大的小房子里，摆满了各种美国最先进的家庭电器，有天然气灶、微波炉、收音机、电视机、自动的洗衣机和洗碗机……\n赫鲁晓夫被这些奇形怪状的电器吸引了目光，尼克松趁机拿起一个小小的面包机，微笑地问道：\n\n赫鲁晓夫先生，我想请问，在共产主义国家，民众是否能够用上这些先进的仪器和设备？要知道，在这个科学技术日新月异的时代，科技可不能只是用于发展破坏性武器，而是应该像自由国家，用于改善人们的生活。" 
 
 
 sov.483.t:0 "赫鲁晓夫的反驳" 
 sov.483.a:0 "（吹捧航天技术）" 
 sov.483.d:0 "赫鲁晓夫不屑地回答：\n\n副总统先生，作为政治家，你不应该像资本家一样，只在意能给自己带来利益的东西，作为政治家，你应该和我一样，有更远大的理想和抱负，比如……\n\n赫鲁晓夫随手拿起一个小小的铁球。\n这是我们几天前发射的斯普特尼克三号卫星的铁球，这个铁球能够在距离地面三千多公里的地方，持续发射电磁信号，覆盖地球的每一个角落……你看，这个铁球可比这里所有的设备，以及你口中的资本主义制度更加伟大，他服务地球上的每一个国家的每一个民众，而不是一两个富有的家庭。" 
 
 sov.484.a:0 "（支持去殖民化）" 
 sov.484.d:0 "啊？是吗？\n赫鲁晓夫拿起桌子上的一个收音机，问道：\n你说这些机器都是所谓的自由国家所制造的，这可不见得，你看……这根天线里的铜线，它来自智利的铜矿，这个塑料外壳，源自波斯湾的石油，这个橡皮垫片，来自刚果和东南亚的橡胶园……副总统先生，你是否知道，在你吹嘘自由国家的公民能够使用这些机械的同时，在亚洲、非洲和拉丁美洲，无数的工人为了生产这些材料，每天工作十二小时，却只能获得欧洲人给予他们那低得可怜的薪水？神通广大的美国政府是否能告诉我？为什么那些第三世界国家的居民，不能享受这些设备？" 
 
 sov.485.a:0 "（嘲讽黑人民权问题）" 
 sov.485.d:0 "赫鲁晓夫转过身，拿起一张传单：\n看看这张照片，这个美国家庭确实过的很幸福，但我翻了翻，发现这本小册子上，缺少了一个很重要的事情：这里所有的照片，都是白人公民，为什么没有黑人使用这些电气的照片呢？噢……我忘了，因为这些设备，都是为白人富有家庭准备的，黑人只能站在一旁观望！总统先生，我提议您立刻为会场的所有美国商品，贴上一个WHITE ONLY的标签，这样才能真正展示出贵国经济和社会体制的最大特点！哈哈哈！" 
 
 sov.486.a:0 "（吹捧核武器）"
 sov.486.d:0 "赫鲁晓夫耸耸肩，说道：副总统先生，美国人民的生活水平确实很不错，某方面比我们苏联人好一些，但你知道吗？当今的世界局势并不太平，很多坏家伙觊觎我们两国民众的和平生活，你必须从你的敌人手中保护你的生活方式……当然，我不是说我们，我是说，那些反对美国政府进行民权改革的白人至上主义者，他们可能会像一百年前一样发起叛乱，因此你需要强大的武力去威慑他们。\n赫鲁晓夫将双手举在胸前，比划了一个蘑菇云的手势。\n相信你也应该听说了，我们国家最近点燃了一个小小的烟花，这个烟花不太大，但比你们美国人的大得多！这个小小的烟花，只需要嘭一下，就能把那些威胁苏维埃社会主义制度的敌人吓得不敢轻举妄动。副总统先生，不知道他有没有吓到你呢？" 
 
 sov.487.a:0 "（嘲讽麦卡锡主义问题）"
 
 sov.488.a:0 "（介绍苏联住房保障）" 
 sov.488.d:0 "赫鲁晓夫伸出手，摸了摸样板房的墙壁。\n\n不错，质量很好，看来是使用了上好的木材制作……不过不知道，质量这么好的房子，得花多少钱才能买到呢？\n副总统先生，我诚邀您去参加莫斯科城郊一处新造的样板房，这些预制板公寓楼，哪怕你是收入最少的工人，都能免费获得，只要他是苏联公民就可以。而在美国，如果你没有钱，你就只能睡大街！" 
 
 
 sov.489.t:0 "尼克松的反击" 
 sov.489.a:0 "（展示美国的选举权利和民主制度）" 
 sov.489.d:0 "尼克松双手抱胸，反驳赫鲁晓夫：\n总理先生，你说的这些在共产主义制度下的生活确实很吸引人，可俄国那么大，你要如何保证每一个官员都忠实于您这些伟大的理想，而不会变得腐败而无能呢？您的国家似乎从来没有限定官员的工作任期，也不会检查官员是否称职。\n尼克松摊开双手。\n自由世界的民主国家，人民用选票来展示自己的意志，人们会用选票来驱逐那些不称职的领导者，因为权力只会对他的来源负责，如果人们不能行使选择政府的权利，民主就无从谈起。" 
 
 sov.490.a:0 "（展示美国的个人自由）" 
 sov.490.d:0 "尼克松放下手中的电器，又拿起另一样电器。\n总理先生，这座小房子里展示的设备，只是美国众多企业中的一小部分，还有一些企业，他们不愿意参与到这次博览会当中，尽管美国政府不太赞同这种不利于两国关系的行为，但我们尊重他们拒绝的权力，因为这是他们作为自由国家的公民，拥有选择的自由，拥有拒绝的自由，拥有选择自己命运的自由。总理先生，美国人无法自由决定自己是生活在富裕还是贫穷当中，但没有人有资格阻止他们在未来追求富裕的生活。" 
 
 sov.491.a:0 "（展示美国的文化艺术）"
 sov.491.d:0 "尼克松来到一台电视机前，打开电视，一阵悠扬的音乐传出。\n总理先生，在美国，已经有数百万个家庭拥有了自己的电视机，他们使用电视机选择并观看自己喜爱的电视节目。有的人喜欢《我爱露西》，有的人喜欢《汤姆与杰瑞》，有的人喜欢玛丽莲·梦露的影片，或埃尔维斯的歌曲。在美国，人们拥有选择自己所喜爱的电视节目的权力，而在苏联，我国的外交官告诉我，他在莫斯科生活，每天打开电视，最先看到的都是介绍共产党召开了什么会议，执行了什么政策……先生，您认为一个6岁的孩子能听懂这些新闻吗？"
 
 sov.492.a:0 "（嘲讽东欧的难民西逃）" 
 sov.492.d:0 "尼克松摆摆手。\n总理先生，美国人常说，人会用脚投票，选择自己想要的生活。几百年前，美国人的先贤为了逃离宗教迫害，而来到新大陆，而现在，你是否知道，在德国和捷克的边界，有无数的德国人、匈牙利人、捷克人，甚至是俄国人，正在冒险穿过铁丝网，前往西方……总理先生能否解释一下，如果你口中的社会主义乌托邦真的如此完美，为什么这些民众却愿意冒着生命危险，投奔自由？" 
 
 sov.493.a:0 "（展示美国支持西欧经济复兴成就）" 
 
 sov.494.a:0 "（展示美国发达的农业成就）" 
 
 sov.495.a:0 "（展示美国的和平主义）" 
 sov.495.d:0 "尼克松严肃地将双手抱在胸前。\n\n总理先生，你知道，我不远万里来到这里，参加这次盛会，世为和平友好而来。我们应该更多地谈谈，两国是否有友好相处的可能，而非敌对，更不是什么核武器这种耸人听闻的话题。我们难道不应该将科学技术运用到改善人们的生活上吗？" 
 
 sov.482.a:0 "好好好，看他怎么说" 
 sov.484.b:0 "与其争吵，不如举杯庆祝" 
 
 
 sov.500.t:0 "一场即兴辩论的结束" 
 sov.500.d:0 "尼克松与赫鲁晓夫在展览馆里的激烈辩论，通过电视直播传播至全球，最后，似乎[FROM.GetName]似乎在辩论中占据了优势，赢得了满堂喝彩。\n尽管两人都坚持认为自己国家的政治和社会制度具有优势，但双方都同意，应当增加两国的经贸合作与文化交流，减少对抗。\n赫鲁晓夫临走时，与尼克松打赌，认为尼克松的后代将生活在社会主义，而尼克松也断定，赫鲁晓夫的后代将生活在自由国家。" 
 
 sov.501.t:0 "哈萨克斯坦铁米尔套爆发大规模骚乱！" 
 sov.501.d:0 "哈萨克斯坦铁米尔套的新建冶金工业区爆发大大规模骚乱。一些工人因为被优越的待遇和条件吸引来到这座位于中亚草原中心的城镇工作，却发现政府承诺的所谓干净整洁的工人公寓完全按是谎言，等待他们的是脏乱差的预制板楼、被污染的饮用水和糟糕的居住环境。认为自己被欺骗的工人聚集在市政府前抗议，要求获得承诺的居住条件并改善其他待遇。" 
 
 sov.502.t:0 "哈萨克斯坦铁米尔套爆发大规模骚乱！" 
 sov.502.d:0 "来自阿拉木图消息，苏联在中亚的加盟国哈萨克斯坦，一个被称为铁米尔套的新建冶金工业区爆发大大规模骚乱。一些工人因为被优越的待遇和条件吸引来到这座位于中亚草原中心的城镇工作，却发现政府承诺的所谓干净整洁的工人公寓完全按是谎言，等待他们的是脏乱差的预制板楼、被污染的饮用水和糟糕的居住环境。认为自己被欺骗的工人聚集在市政府前抗议，随后演变成暴力冲突，愤怒的工人洗劫了商店，而苏联军警向工人开枪。尽管莫斯科尽力压制事件消息，但还是通过阿拉木图的外国领事馆传播至国际社会。" 
 
 sov.503.t:0 "莫斯科出现不明传染疾病" 
 sov.503.d:0 "总书记同志；\n我们收到来自莫斯科卫生局的一份报告，莫斯科多地出现了一种不明原因的疾病，具体表现为咳嗽、发热、四肢无力、骨头酸痛等，起初我们认为这是一种流行性感冒，但很快我们发现，这种流行传染病的传染速度和发病速度，都比流感严重许多，因此我们担心，一种不明的传染性病菌可能已经进入莫斯科，这是一级紧急状态！莫斯科市委希望党中央果断采取措施，宣布进行防疫工作，并拨一批资金和物资进行疫情控制及溯源。" 
 
 sov.504.t:0 "莫斯科爆发天花疫情!" 
 sov.504.d:0 "来自莫斯科的突发消息！\n在莫斯科多地出现的不明原因传染病，被证实为天花——人类历史上最可怕的传染病。这种传染病，历史上曾经杀死数千万人，如今他在苏联的心脏再次爆发！尽管苏联在1936年通过疫苗接种，消灭了苏联境内的天花疫情，但苏联政府却疏忽了病毒从外国入境的可能，根据克格勃的调查，一名叫阿列克谢·科科雷克金的苏联艺术家访问印度时，购买了沾有天花病毒的纪念品并将其带回国，最终引爆了疫情。如今科科雷克金已经躺在医院不省人事，疫情仍在莫斯科继续蔓延！" 
 
 sov.505.t:0 "苏联天花疫情得到控制" 
 sov.505.d:0 "经过一个多月的防疫工作，苏联内政部宣布，天花疫情已经被有惊无险地消灭，多亏了现代医学，这个历史上杀人最多的瘟疫被扼杀在了摇篮中，传染人群被隔离，痊愈后的患者恢复正常生活，苏联军队出动对整座城市进行了消毒，大约有二百多人因感染天花而丧生，包括年仅四十多岁的阿列克谢·科科雷克金，他们的遗体将被火化处理。" 
 
 
 sov.510.t:0 "梁赞州的雄心" 
 sov.510.d:0 "梁赞州的第一书记阿列克谢·拉里奥诺夫宣布，在未来一年内该地区生产的肉量增加三倍。" 
 sov.510.a:0 "鼓励并支持！" 
 sov.510.b:0 "这是不可能的，他在吹牛。" 
 
 sov.511.t:0 "梁赞州超额完成任务！" 
 sov.511.d:0 "梁赞党委组织宣布，该地区成功生产了15万吨肉，这是一年完成三年的目标。在此之上，地方当局答应在明年提供180,000吨。" 
 
 sov.512.t:0 "梁赞奇迹被揭穿！" 
 sov.512.d:0 "梁赞的农业奇迹被证实为谎言。梁赞州肉类产量骤降至30000吨，因为相比1958年已经屠杀65％牛只，更糟糕的是集体农庄私人家庭中的牛被暂时挪用，这减少了梁赞州谷物生产量的一半。\n拉里奥诺夫被撤职，剥离劳动英雄的称号。"
 
 
 sov.515.t:0 "苏联希望修复与南斯拉夫的关系" 
 sov.515.d:0 "苏联[SOV.GetLeader]领导人在最近的一次讲话中表示，该国希望修复与南斯拉夫因为政治和地缘外交上的矛盾而长期恶化的关系，以缓解两国矛盾，推动地区和平稳定发展和社会主义阵营的团结。" 
 
 sov.516.t:0 "南斯拉夫支持与苏联改善关系" 
 sov.516.d:0 "南斯拉夫政府就苏联希望改善两国关系的声明予以了积极的回应，同意两国暂时放下在意识形态问题上的矛盾，并尽快恢复公开接触。" 
 
 sov.517.t:0 "南斯拉夫拒绝与苏联改善关系" 
 sov.517.d:0 "南斯拉夫政府公开拒绝了苏联希望改善两国关系的声明，认为两国在政治、经济和外交上的分歧，尤其是苏联的霸权主义行径无法妥善解决，两国接触没有意义。" 
 
 sov.518.t:0 "[FROM.GetName]对苏南关系改善大为不满" 
 sov.518.t:0 "[FROM.GetName]对苏联尝试与南斯拉夫改善关系的行为表达了强烈抗议，认为苏联新一代领导集体试图对修正主义妥协。" 
 
 sov.520.t:0 "华沙举办世界保卫和平大会" 
 sov.520.d:0 "在波兰西南部的弗罗茨瓦夫市理工大学，波兰共产党今日主持召开世界保卫和平大会。来自46国的两千余名代表参会，包括西班牙画家毕加索、法国诗人阿拉贡等文艺界人士。会场悬挂着毕加索特为大会创作的和平鸽海报，主题演讲强烈谴责核武器威胁。\n大会决议案呼吁"立即停止所有核试验"，法国代表在发言中三次提及广岛，而东欧代表团则集体谴责"美国核讹诈"。美国国务院虽未派官方代表，但民间反核组织带来了爱因斯坦的亲笔信。在会议间隙，毕加索向记者展示新作《被原子弹撕裂的鸽子》，而苏联作家法捷耶夫则带领代表高唱《和平万岁》。华沙市民被组织在街头举行和平游行，孩子们向代表们献上橡树叶编成的冠冕。\n此次大会虽彰显了全球和平诉求，但西方国家认为，这实为苏联发起的意识形态攻势。当西欧代表要求同时批评苏联军备时，会议主席立即宣布休会。" 
 sov520tool:0 "若美国的核武器科技树进度超过了苏联，则-200政治点数" 
 
 sov.521.t:0 "世界和平理事会成立" 
 sov.521.d:0 "在华沙召开第二届世界保卫和平大会，有81个国家的代表参加，大会通过宣言，号召各国人民不要等待和平，必须去争取和平，希望联合国成为保卫和平与安全的机构。大会决定成立世界和平理事会取代“世界和平拥护者委员会”，主席是弗雷德里克·约里奥-居里。毕加索的《和平鸽》成为象征。" 
 
 sov.522.t:0 "斯德哥尔摩呼吁" 
 sov.522.d:0 "世界和平理事会批准了《斯德哥尔摩呼吁》，呼吁彻底禁止核武器。这项呼吁由法国物理学家、共产主义者、1935年诺贝尔化学奖获得者弗雷德里克·约里奥-居里发起。\n《和平报》声称，这项呼吁已经获得了150万人的签名。据称，收集到的请愿书共有 27347k人签名（包括苏联全部成年人口）。许多杰出的公众人物、艺术家和知识分子也在呼吁上签名。\n呼吁书内容如下：\n我们要求禁止使用原子武器作为恐吓和大规模屠杀的工具。我们要求国际社会严格监督以执行这一措施。\n我们认为，任何政府首先对任何其他国家使用原子武器都将犯下反人类罪，应作为战争罪犯受到惩罚。\n我们呼吁全世界所有善良的男女签署这份呼吁书。" 
 
 
 sov.525.t:0 "有关移交克里米亚予乌克兰苏维埃共和国的建议" 
 sov.525.d:0 "在最近一次苏共高级会议上，尼基塔·赫鲁晓夫同志提出：为了纪念1654年，沙皇俄国与乌克兰哥萨克签订《库楚克开纳吉和约》，乌克兰并入俄罗斯三百周年，以展示俄罗斯人民与乌克兰人民的友好关系，应该将俄罗斯苏维埃共和国管辖下的克里米亚州，移交至乌克兰苏维埃共和国进行管理。" 
 
 sov.526.t:0 "苏联宣布将克里米亚移交乌克兰苏维埃共和国管辖" 
 sov.526.d:0 "苏联政府正式宣布，为了纪念1654年，沙皇俄国与乌克兰哥萨克签订《库楚克开纳吉和约》，乌克兰并入俄罗斯三百周年，以展示俄罗斯人民与乌克兰人民的友好关系，最高苏维埃正式决定，将俄罗斯苏维埃共和国管辖下的克里米亚州，移交至乌克兰苏维埃共和国进行管理。" 
 
 sov.527.t:0 "拜科努尔航天中心致苏共中央绝密报告" 
 sov.527.d:0 "绝密文件\n致苏共中央委员会\n\n拜科努尔航天发射场进行R-16导弹试验时发生灾难性事故。二级发动机意外点火引发燃料爆炸，现场包括米特罗凡·涅杰林元帅在内的126人当场殉职，另有200余人受伤。\n建议采取以下紧急措施：\n立即封锁发射场半径200公里区域、所有伤亡人员以因公殉职名义秘密安葬、对外公布涅杰林元帅因空难逝世、\n此次事故暴露出导弹燃料系统存在重大设计缺陷。恳请批准在普列谢茨克建立备份试验场，并授予特别委员会全权处理善后事宜。\n本件仅限政治局委员传阅" 
 
 
 sov.528.t:0 "米特罗凡·涅杰林元帅因空难去世" 
 sov.528.d:0 "来自莫斯科的消息，《真理报》刊登了一则讣告，曾在卫国战争中立下赫赫战功的炮兵元帅米特罗凡·涅杰林元帅因在哈萨克地区遭遇空难去世，享年57岁。苏共中央高度评价涅杰林元帅为国家战略武器发展作出的贡献，并宣布元帅将被安葬在莫斯科新圣女公墓。" 
 
 sov.530.t:0 "震惊世界的联合国大会一幕" 
 sov.530.d:0 "在今天举行的联合国大会第902次会议期间，菲律宾驻联合国代表团团长洛伦佐·萨穆朗指责苏联在东欧推行霸权主义和殖民主义，此番言论激怒了苏联领导人尼基塔·赫鲁晓夫，只见赫鲁晓夫听罢后迅速登上演讲台，推开洛伦佐，大喊：\n\n笨蛋、小丑、美帝国主义的走狗……\n\n说到激动之时，赫鲁晓夫脱下自己的皮鞋，开始敲打桌面……" 
 sov.530.a:0 "猜猜明天的头条新闻是什么。" 
 
 
 sov.531.t:0 "苏共二十一大即将召开"
 sov.531.d:0 "随着[SOV.GetLeader]总书记在航天、经济、科技等各项领域取得重大成果，为了稳固苏联人民对社会主义制度的信心，展示苏联的政治影响力，也为了巩固总书记的威望，苏联共产党决定在明年年初，正式召开苏联共产党第二十一次全国代表大会，并邀请中共、越共等世界各国共产主义领导人赴会。"
 
 sov.532.t:0 "苏共二十一大正式召开"
 sov.532.d:0 "随着苏共各大高级干部与外国共产党外宾抵达莫斯科，苏共总书记[SOV.GetLeader]在克里姆林宫的国家大厅内正式宣布苏共二十一大开幕。会议首先由总书记介绍了苏联共产党和苏联人民在过去三年内取得的重大成果。\n斯大林时期的极权主义被取消，政治犯得到平反和赦免，国家逐步走向民主与法制。苏联在太空竞赛中取得优势，成功发射了人造卫星，在核能领域的科技也取得进步。\n随后，总书记宣布，苏联计划在未来七年内取得更大的发展，苏联不仅要在航空、核能、军事、外交中取得进一步的领先优势，还应当在1970年代，进入发达共产主义社会。"
 
