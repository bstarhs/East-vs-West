 sov.312.d:0 "[ROOT.GetName]政府表示，该国已经通过红十字会向苏联土库曼斯坦大地震灾区提供了一批人道主义救援物资，"
 
 
 
 sov.314.t:0 "苏联政府开始改革重组！"
 
 sov.314.t:0 "苏联开展党员教育活动！"
 
 sov.320.t:0 "“我们要埋葬你们！”"
 sov.320.d:0 "苏联领导人尼基塔·赫鲁晓夫在波兰接见瓦迪斯瓦夫·哥穆尔卡时，对现场的记者发表了令人惊讶的言论。\n无论你们喜欢与否，历史站在我们这一边，我们会埋葬你们！"
 
 sov.321.t:0 "赫鲁晓夫回答记者提问"
 sov.321.d:0 "对于数日前在波兰发表的讲话，赫鲁晓夫对记者做出解释：\n我并不是要埋葬你们每一个人，这样我一辈子都埋不完。\n有人歪曲了我说的话，我并不是要埋葬尸体，而是指历史发展的特点，即共产主义必将取代资本主义。"
 
 
 sov.330.t:0 "我们已开始在[STATE.GetName]地区种植玉米"
 sov.330.d:0 "根据赫鲁晓夫总书记的指示，[STATE.GetName]地区的农业部已开始在当地的农庄中分发玉米种子，并要求农民进行耕种，等到下一个秋季，该地区的玉米种植就会得出结果。"
 
 sov.331.t:0 "[STATE.GetName]的玉米种植需要更多投资"
 sov.331.d:0 "[STATE.GetName]的党委和农业部门向我们反映，当地的玉米种植面临着生产技术和成本上的困难。当地需要更多的设备来开垦土地，农民希望获得更多工作奖励。"
 sov.331.a:0 "中央没有钱，请他们自力更生吧。"
 sov.331.b:0 "拨款一笔，有付出才有回报。"
 
 sov.332.t:0 "[STATE.GetName]的玉米种植取得初步成功"
 sov.332.d:0 "[STATE.GetName]的农业部门带来了好消息。当地种植玉米的耕地，在今年秋季迎来了丰收，玉米产量比预期指标多出一些，虽然不多，但至少在满足了本地区的食品供给后还有盈余。"
 
 sov.333.t:0 "[STATE.GetName]的玉米种植获得大丰收！"
 sov.333.d:0 "[STATE.GetName]的农业部门带来了好消息！得益于优秀的土地条件、工人农民的辛勤劳作和党的优秀领导，该地区的玉米产量远超我们预期！产量数字比原来的指标要高出许多，这证明赫鲁晓夫同志扩大玉米种植的政策，至少在[STATE.GetName]是成功的，也许我们应该尝试扩大当地的玉米种植。为玉米三呼万岁！"
 
 sov.334.t:0 "[STATE.GetName]的玉米未能达到预期产量"
 sov.334.d:0 "[STATE.GetName]的农业部门和党委向我们汇报了当地的玉米收成情况，遗憾的是，在投入了大量人力物力和资金后，当地的玉米产量并没有明显增长，收获量没有达到生产指标，仅能供当地居民勉强自给为口粮。"
 
 sov.335.t:0 "[STATE.GetName]的玉米颗粒无收！"
 sov.335.d:0 "总书记！坏消息！[STATE.GetName]的农业部门和党委向我们汇报了当地的糟糕玉米收成情况，尽管我们投入了大量人力物力和资源，但当地的玉米生产以彻底的失败告终！大量的玉米苗烂在地里，根本没有发育，并且由于玉米种植挤压了粮食作物的空间，党中央还不得不另外批一笔资金用于补偿当地居民。也许在[STATE.GetName]种植玉米的决定是错误的，我们应该考虑撤销在这里种植玉米。"
 sov.335.a:0 "这下血本无归了，，，"
 
 sov.336.t:0 "[STATE.GetName]玉米种植扩建"
 sov.336.d:0 "[STATE.GetName]的玉米种植基地将进行扩建，我们将为基地拨款更多的投资、更大的耕地，并提供更高的农庄庄员工资和更先进的设备。"
 
 sov.337.t:0 "[STATE.GetName]玉米种植基地开始扩建"
 
 sov.338.t:0 "[STATE.GetName]的农民抱怨劳动强度"
 
 sov.339.t:0 "政治局的不安"
 sov.339.d:0 "在昨天召开的苏共中央政治局会议上，赫鲁晓夫总书记满面愁容，没有了昔日骄傲蛮横而自信的表情。赫鲁晓夫推动的玉米扩大种植政策遇到了严重的挫折，苏联政府投入了大量人力物力资源，但玉米的产量只减不增，大量的资源被浪费。赫鲁晓夫的威望被严重损害，政治局里的一些高层不点名地指出玉米运动是一个严重错误，并要求赫鲁晓夫尽快拿出成绩，否则政治局将自行命令农业部停止玉米政策。"
 sov.339.a:0 "我们尽量……"
 
 sov.340.t:0 "地质专家的警告"
 
 sov.341.t:0 "玉米运动相关玩法介绍"
 sov.341.d:0 "在这一系统当中，玩家可以通过决议，将某个省份设定为玉米种植基地，并投入政治点数和研究技术。待到每年的秋季（8月至10月），不同省份就会通过事件汇报其生产成果。如果玉米丰收，则获得粮食产出、政治点数和支持率等回报，如果颗粒无收就会有惩罚。当一个省份连续多次丰收后，就可以升级种植基地，这意味着更高的回报和更高的投入。和现实一样，不同地区的玉米种植效果是不一样的，玩家可以通过研究科技、购买美国种子和设备等方式提高玉米丰收的触发几率，也可以关闭现有的玉米种植地以节省成本。玉米运动持续时间至1960年代中期自动关闭。"
 
 sov.342.t:0 "[STATE.GetName]获得了新的投资"
 sov.342.d:0 "一批专项资金和农业器材、设备、化肥等物资已被送到[STATE.GetName]的玉米种植基地。"
 sov.342.a:0 "希望得到妥善使用。"
 
 sov.343.t:0 "[STATE.GetName]的玉米种植基地被关闭"
 sov.343.d:0 "[STATE.GetName]的玉米种植扩大政策被中止，已有的玉米秧苗已被回收，所作的投资也已被收回。"
 
 sov.344.t:0 "庆祝玉米运动取得成果的大会"
 sov.344.d:0 "在昨天召开的苏共中央政治局会议上，赫鲁晓夫总书记喜笑颜开，带着红光满面的表情，在与会党代表热烈的掌声中，走上讲台。总书记慷慨激昂地宣布，过去一段时间中，苏联的扩大玉米种植的政策取得了重要的胜利，大量的资源投入没有白费，苏联今年的玉米收获量远超原定指标，不仅满足了苏联人民的食品需求，还可以将盈余的玉米用于牲畜饲料和食品工业生产。赫鲁晓夫同志表示，玉米运动的成功，让苏联的农业改革看到了胜利的希望，他希望趁着这次机会，再扩大玉米种植面积。"
 sov.344.a:0 "丰收是好事，但保持谨慎，不要被胜利冲昏头脑。"
 sov.344.b:0 "根据总书记指示，再梭哈一发！"
 
 sov.345.t:0 "苏联提出购买一批农业机械"
 sov.345.d:0 "苏联政府希望向我们购买一批农业机械，以应用到玉米生产上。"
 
 sov.346.t:0 "美国向我们出售农业机械"
 sov.346.d:0 "美国政府已同意向我们出售农业机械和设备。"
 sov.346.a:0 "合作总是好过对抗。"
 
 sov.347.t:0 "美国拒绝向我们出售农业机械"
 sov.347.d:0 "美国政府拒绝向我们出售农业机械和设备。"
 sov.347.a:0 "吝啬的美国佬。"
 
 sov.348.t:0 "苏联制作玉米宣传影片"
 sov.348.d:0 "（一阵悠扬的小曲）\n厨师:如果你想成为一个健康的人，想要长命百岁，那就要对饭店和食堂，多说点好话了！领份午饭吧！\n厨师：你们从哪来？\n玉米：我们从库班来！从那温暖的阿塞拜疆和哈萨克处女地。\n厨师：我知道了，你们要做什么？\n玉米：我们要成为美味的料理！"
 
 sov.349.t:0 "苏维埃第一届全联盟玉米展览会开幕"
 sov.349.d:0 "苏联政府在莫斯科郊外的全苏维埃展览中心，举办了苏联，也是世界上第一届玉米展览会，并诚挚邀请世界各国外交代表前来参观。赫鲁晓夫总书记的玉米种植政策取得了巨大的成绩，为了向全世界展示总书记的政策，整个展览中心都摆满了从苏联各地送来的玉米样本和玉米产品。有玉米、玉米杆、玉米粥、烤玉米、玉米饼、玉米粽子、煮玉米汤、炸玉米、玉米爆米花，和一座高达两米多的玉米雕像。"
 sov.349.a:0 "事实证明玉米能拯救苏维埃。"
 sov.349.b:0 "我再也不想吃玉米了……"
 
 
 
 
 sov.350.t:0 "苏联政府颁布住宅建设计划"
 sov.350.d:0 "苏联政府宣布，该国将开始批量建造一种全新的预制板住宅楼，以解决苏联迅速城市化以带来的住房需求问题。这种住宅楼使用预先浇筑的水泥板搭建而成，建造速度快而成本低，这些住宅将被大量建造并分配给进入城市工作的工人。"
 
 sov.351.t:0 "埃里温的斯大林雕像被拆除"
 sov.351.d:0 "埃里温广场上的斯大林铜像依然高高矗立。当拆除队的起重机开进广场时，晨雾还未散尽。工人们刚系好钢索，就被突然聚集的人群围住了。\n一位老妇人用围裙擦拭铜像基座上的露水，她的儿子在柏林战役后曾在这座雕像前接受过表彰。几个退伍军人手挽手组成人墙，勋章在晨光中叮当作响。\n正午时分，一队士兵带来了新的命令。人群发出呜咽般的叹息，但手挽着的手终究慢慢松开了。当铜像的头颅倾斜时，阳光在青铜睫毛上停留了最后一秒，而后整个广场都暗了下来。只有基座上"献给伟大的父亲"的铭文，在水泥填补前还隐约可见。"
 
 sov.352.t:0 "苏联政府结束[STATE.GetName]人的流放"
 sov.352.d:0 "苏联政府颁布法令，正式宣布结束[STATE.GetName]人长达数十年的流放，允许他们迁回原籍。[STATE.GetName]人在斯大林时期，因斯大林担心他们集体叛乱，而强行将大量人口迁出[STATE.GetName]而迁徙到中亚和西伯利亚，这导致[STATE.GetName]人大量死亡，而作为去斯大林化的一部分，苏联政府宣布[STATE.GetName]人将被允许回到家乡。"
 
 
 sov.353.t:0 "庆祝玉米运动取得成果的大会"
 sov.353.d:0 "在昨天召开的苏共中央政治局会议上，赫鲁晓夫总书记喜笑颜开，带着红光满面的表情，在与会党代表热烈的掌声中，走上讲台。总书记慷慨激昂地宣布，过去一段时间中，苏联的扩大玉米种植的政策取得了重要的胜利，大量的资源投入没有白费，苏联今年的玉米收获量远超原定指标，不仅满足了苏联人民的食品需求，还可以将盈余的玉米用于牲畜饲料和食品工业生产。赫鲁晓夫同志表示，玉米运动的成功，让苏联的农业改革看到了胜利的希望。"
 sov.353.a:0 "事实证明玉米能拯救苏维埃。"
 
 sov.354.t:0 "丰收的玉米走进苏联厨房"
 sov.354.d:0 "赫鲁晓夫倡导的玉米种植运动迎来历史性丰收，今秋苏联各地商店被金黄色的玉米制品占领。从波罗的海到堪察加半岛，货架上整齐陈列着玉米面包、玉米香肠、玉米汁格瓦斯等创新食品，市民排队争相购买这种“社会主义新主食”。\n莫斯科第一百货公司出现罕见抢购潮，主妇们用网兜装满玉米速食粥和玉米粉。食品工业部推出的“玉米蛋糕”成为儿童新宠，其价格比传统小麦制品低40%。在基辅“布尔什维克”食品厂，工人们三班倒生产玉米罐头。\n集体农庄报告显示，今年玉米产量达创纪录的8000万吨，可满足全国谷物需求的35%。营养学家在《真理报》专版介绍玉米食品富含维生素，而价格司官员强调“玉米民主化让工人家庭餐桌上出现新选择”。贸易部长承诺明年将实现“每人每日一磅玉米制品”。"
 
 
 
 sov.355.t:0 "车里雅宾斯克州发生不明爆炸事故"
 sov.355.d:0 "乌拉尔山脉南麓，晨光被一道突如其来的白光吞噬。克什特姆郊外的松林在冲击波中集体弯腰，树冠的颤抖以每秒三百米的速度向西扩散，秋明州的早班工人误以为发生了地震，远在斯维尔德洛夫斯克的居民进行了紧急疏散。\n当地政府宣布已经开始救援和调查，并安抚居民。"
 
 sov.356.t:0 "车里雅宾斯克事件被证实为核事故！"
 sov.356.d:0 "总书记，我们必须向您汇报一个可怕的消息……\n发生在车里雅宾斯克州的大规模爆炸事故，位于克什特姆市的核废料储存仓库，由于冷却系统故障失灵，超过80吨的核废料在发热后发生剧烈爆炸……\n这是一次史无前例的核事故，大量的放射性物质在爆炸后飘散在大气中，毫无疑问他们将对车里雅宾斯克、斯维尔德洛夫斯克和秋明州造成严重的生态灾难。我们必须立刻采取行动，关闭事故地区的工作单位，疏散居民，并封锁这一地区！"
 
 sov.357.t:0 "乌拉尔山东部多地的核辐射检测超标！"
 sov.357.d:0 "总书记！\n苏联科学院派往车里雅宾斯克的科研人员报告了当地的和污染情况，克什特姆和奥焦尔斯克的辐射监测量已经超出了标准值将近60倍，这一地区已经遭到了严重的污染。"
 
 sov.358.t:0 "核事故地区已进行疏散"
 sov.358.d:0 "车里雅宾斯克的政府、党委和军方汇报，当地居民已进行疏散，核辐射污染区内的人口均已撤离，并保证了过程中没有人泄露消息。"
 
 sov.359.t:0 "车里雅宾斯克周边地区已进行封锁"
 sov.359.d:0 "车里雅宾斯克周边地区已被封锁，不允许任何人进入。"
 
 sov.360.t:0 "车里雅宾斯克发生小规模核事故"
 sov.360.d:0 "在今天的记者见面会上，苏联外交部和内政部正式承认，几天前在车里雅宾斯克州克什特姆市发生了一起中等规模的核废料爆炸事故，但幸运的是，爆炸的规模较小，苏联政府及时地在核污染扩大之前将其控制住，使其没有对周边地区造成毁灭性怕破坏。然而，核废料的泄露还是使得克什特姆市的市民不得不组织撤离，该地区也将在不久后被彻底封锁。"
 
 sov.370.t:0 "Tu-104喷气客机成功首飞！"
 sov.370.d:0 "在激烈的喷气式客机竞争中，苏联取得了优势！图波列夫正式宣布其首款喷气式客机Tu-104首飞成功，不日将投入量产！"
 
 
 sov.371.t:0 "苏联政府结束车臣人的流放"
 sov.371.d:0 "苏联政府今日正式颁布法令，宣布结束对车臣民族长达数十年的集体流放。这一决定是“撤销过去政治错误”政策的重要组成部分。在斯大林执政时期，苏联当局曾以“担忧集体背叛”为由，于1944年将整个车臣民族强行迁离高加索故土，驱逐至中亚和西伯利亚等荒僻之地。这一残酷行动造成了大量人员因饥寒与疾病死亡，成为该民族历史上的巨大创伤。\n根据新法令，流散在外的数十万车臣人将被允许自愿迁回北高加索的原籍家乡。此举旨在纠正历史上的错误政策，缓解民族矛盾，但长期流放造成的积怨与故土重建的实际困难，仍将是后续面临的严峻挑战。"
 
