 sov.270.t:0 "动向异常的格鲁吉亚明格利亚州党委"
 
 sov.271.t:0 "苏联政府今日突然宣布，格鲁吉亚共和国明格列尔州多名重要官员因“勾结西方帝国主义、阴谋制造分裂”被撤职查办，其中包括该州前领导人坎迪德·查克维阿尼及彼得·沙利亚等。官方指控他们企图策划“格鲁吉亚独立”，构成严重叛国罪。\n这一事件迅速引发国际社会高度关注。西方观察家普遍认为，此举并非简单的反分裂行动，其矛头直指当时掌控苏联内务系统、在格鲁吉亚拥有深厚根基的政治局委员拉夫连季·贝利亚。分析指出，斯大林对贝利亚日益膨胀的个人权势与独立倾向已深感不安，此次清洗意在通过打击其在故乡格鲁吉亚的嫡系力量，敲打并削弱贝利亚的政治势力。这场发生在格鲁吉亚的地方人事地震，被视为克里姆林宫高层权力博弈公开化的关键信号，预示着苏联领导层内部关系的紧张与重组。"
 
 
 
 
 
 sov.300.t:0 "亚历山大·卡津别克返回苏联"
 sov.300.d:0 "流亡美国的俄罗斯政治家亚历山大·卡津别克今日乘飞机抵达莫斯科，回到了阔别已久的俄罗斯祖国。当卡津别克抵达莫斯科时，苏联政府组织的欢迎大会，用鲜花迎接了这位风尘仆仆的流亡者。苏俄内战已结束三十多年，此时的卡津别克，已经从君主制的拥护者，转变为苏联的忠诚公民。\n亚历山大·卡津别克在苏俄内战后作为白军军人流亡法国，并在法国创立了青年俄罗斯联盟。卡津别克和青年联盟曾经提出将沙皇与苏维埃制度结合起来，创立一个沙皇统治下的苏联的奇异政治主张。二战后卡津别克流亡美国，并转变为苏联共产党的支持者，随着苏联政治解冻，卡津别克决定回到俄罗斯，为苏联政府工作。\n苏联政府已经为卡津别克准备了一套新的住房和新的工作，他将协助苏联科学眼研究俄罗斯历史。在面对记者采访时，有人问道：卡津别克先生，你还坚持你那个古怪的沙皇苏维埃主义吗？\n卡津别克哈哈大笑：在那个年代，很多人都会有一些不切实际的政治主张和理想，但有一点是不会变的，那就是我对俄罗斯祖国的爱与热情！"
 sov.300.a:0 "欢迎卡津别克先生回国！"
 
 sov.301.t:0 "亚历山大·卡津别克去世"
 sov.301.d:0 "83岁的亚历山大·卡津别克在莫斯科中央临床医院停止了呼吸。护士整理遗物时，在他枕头下发现一枚磨损的镀金徽章——一个白色的圣球。\n这个曾让海外白军移民头疼的"沙皇苏维埃者"曾经提出惊人理论："给苏维埃装上沙皇的冠冕，就像给火车头套上三套马车。"他和他的政党一度成为俄罗斯国内外的笑谈。然而战争年代，他却果断解散了联盟，投入到反对法西斯的斗争当中。\n当卡津别克的葬礼开始时，突然飘起大雪。车顶的苏联国旗与不知何人放置的帝国军旗，在风雪中短暂地交织在了一起。"
 sov.301.a:0 "爱国者带着他的传奇故事离开了。"
 
 sov.302.t:0 "奇异搞笑的《去锡安化》"
 sov.302.d:0 "我们发现中东事务处长瓦列里·叶梅利尼扬诺夫在他的工作单位发放未经允许出版的，他自己的著作《去锡安化》，各单位同志阅后一致认为叶梅利尼扬诺夫的精神状况出现了严重的问题。书中记载了各种令人啼笑皆非的历史观点和政治主张，叶梅利尼扬诺夫宣称斯拉夫人的祖先是雅利安人，雅利安人起源于巴勒斯坦，后来巴勒斯坦被犹太人霸占后，雅利安人才迁入东欧成为斯拉夫人。叶梅利尼扬诺夫在书中鼓吹苏联必须消灭犹太人，消灭东正教文化，回到斯拉夫异教文化以拯救雅利安-斯拉夫民族。"
 sov.302.a:0 "写的什么玩意儿，快端下去罢！"
 
 sov.303.t:0 "瓦列里·叶梅利尼扬诺夫被捕入狱"
 
 sov.310.t:0 "土库曼斯坦发生强烈地震！"
 sov.310.d:0 "土库曼苏维埃社会主义共和国的大地在轰鸣中裂开。阿什哈巴德的砖木房屋像纸牌般倒塌，钟楼的大钟在坠落时敲响了最后一声——此后四十八小时里，这座中亚古城只剩下伤者的呻吟与瓦砾的摩擦声。\n来自阿拉木图的消息！一场里氏7.3级特大地震在今日凌晨一点袭击了苏联土库曼斯坦共和国首府阿什哈巴德，巨大的震动几乎摧毁了整座城市，倒塌的泥砖房和震后的火灾已经将这座城市变成了地狱！伤亡可能已经超过一万人！"
 sov.310.a:0 "天灾太可怕了！"
 sov.310.b:0 "我们应该提供人道主义援助"
 sov.310.c:0 "立刻组织进行救援！"
 sov.310.e:0 "很遗憾我们腾不出资源进行救援"
 
 sov.311.t:0 "苏联军队进入土库曼斯坦救灾！"
 sov.311.d:0 "苏联政府在土库曼斯坦大地震发生后，召开紧急政治局会议，斯大林下达命令，要求苏联红军前往土库曼斯坦，尽可能多的抢救生命！第一批伊尔运输机已经起飞，第37集团军正在动员。同时，各种救灾物资也从苏联各地运往土库曼斯坦。\n"
 
