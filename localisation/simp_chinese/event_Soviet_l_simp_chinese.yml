 sov.550.t:0 "与[FROM.GetName]的外交政策"
 sov.550.d:0 "我们的外交团队正在收拾行李与文件，准备前往[FROM.GetName]首都，开始我们新的外交工作，但在此之前，我们需要先决定，我们与该国的外交政策如何进行。\n\n我们可以直接与该国的现政府进行友好往来，我们的外交代表将与[FROM.GetLeader]阁下会面，表达苏联与对方建立友好关系的意向，并签订一系列的经济合作条约。这意味着我国将放下意识形态的隔阂，愿意与非共产主义国家政府进行友好往来，以提高我国的国际影响，展示良好形象，但这意味着我们也同时放弃了对该国社会主义运动和共产主义革命的支持。\n我们也可以与[FROM.GetName]的左翼进步势力和社会团体进行会面，如左派反对党、艺术家、政治家和社会进步人士等，以表示支持非暴力的左翼团体在[FROM.GetName]进行政治活动，先逐步扩大社会主义在[FROM.GetName]的支持度，以和平手段赢得政权。\n当然，我们也可以直接与[FROM.GetName]共产党的领袖进行会面，表达我们对该国共产主义革命的支持，但这意味着我们与[FROM.GetName]现政府的关系将急剧恶化。"
 sov.550.a:0 "与其现政权进行友好接触"
 sov.550.b:0 "与非共产主义的左派团体进行接触"
 sov.550.c:0 "直接支持该国的共产主义革命"
 
