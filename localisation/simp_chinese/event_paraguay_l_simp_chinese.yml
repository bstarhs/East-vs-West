l_simp_chinese:
 par.3.t:0 "二月党的崛起"
 par.3.d:0 "伊希尼奥·莫里尼戈领导下的巴拉圭军政府处于动荡之中，支持前总统拉斐尔·弗朗哥的左翼政党二月党正在扩大自己在巴拉圭政坛中的影响力。"
 
 par.4.t:0 "自由党的崛起"
 par.4.d:0 "伊希尼奥·莫里尼戈领导下的巴拉圭军政府处于动荡之中，巴拉圭自由党正在扩大自己在巴拉圭政坛中的影响力。"
 
 par.5.t:0 "共产党的崛起"
 par.5.d:0 "伊希尼奥·莫里尼戈领导下的巴拉圭军政府处于动荡之中，巴拉圭共产党正在扩大自己在巴拉圭政坛中的影响力。"
 
 par.6.t:0 "反对党要求军政府解散！"
 par.6.d:0 "伊希尼奥·莫里尼戈领导下的巴拉圭军政府与反对党进行政治对话的尝试以失败告终，二月党、自由党和共产党要求军政府解散，进行大选。"
 
 par.7.t:0 "巴拉圭军政府下台"
 par.7.d:0 "伊希尼奥·莫里尼戈领导下的巴拉圭军政府与反对党进行政治对话的尝试以失败告终，在二月党、自由党和共产党的要求下，莫里尼戈宣布辞职，在巴拉圭民主势力中具有威望的二月党领袖、前总统拉斐尔·弗朗哥再度上台，任临时总统。"
 
 par.8.t:0 "巴拉圭内战爆发！"
 par.8.d:0 "伊希尼奥·莫里尼戈领导下的巴拉圭军政府与反对党关系彻底破裂，支持二月党、自由党和共产党的民兵发起叛乱，反对军政府。"
 
 par.9.t:0 "巴拉圭新政府成立"
 
 par.10.t:0 "巴拉圭内战结束"
 
 par.11.t:0 "巴拉圭大选在即"
 
 par.12.t:0 "[FROM.GetLeader]当选巴拉圭总统"