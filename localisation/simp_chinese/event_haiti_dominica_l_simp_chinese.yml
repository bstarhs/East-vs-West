l_simp_chinese:
 hai.1.t:0 "对军政府的日益不满"
 hai.1.d:0 "迪马瑟·埃斯蒂梅领导下的海地政府不仅没有达成他们上台之初的承诺，没能推进海地民主化和经济的发展，相反，当局的腐败和独裁问题愈发严重。海地民间对迪马瑟·埃斯蒂梅的不满情绪不断恶化。"
 
 hai.2.t:0 "反动派掀起反对活动"
 hai.2.t:0 "反对海地军政府的政治运动继续发酵，海地军服正推动更进一步的民主运动，要求迪马瑟·埃斯蒂梅辞职下台。"
 
 hai.3.t:0 "海地政治变动"
 hai.3.d:0 "海地爆发的政治动荡，以迪马瑟·埃斯蒂梅在民众、教会及军方内部反对派压力下，宣布辞职下台告终。海地军方成立以保罗·马格卢瓦尔将军为首的过度军政府，处理海地政治民主化的问题。"
 
 
 
 hai.4.t:0 "飓风"黑兹尔"重创海地！"
 hai.4.d:0 "四级飓风"黑兹尔"昨日横扫加勒比岛国海地，引发山洪与泥石流灾害，已造成至少1000人遇难，数万人无家可归。这场1954年大西洋飓风季最强风暴，给西半球最贫困国家带来毁灭性打击。\n飓风将沿海渔村夷为平地。暴雨引发的泥石流掩埋了山区数十个村庄，救援队从红色黏土中挖出整栋倒塌的校舍。最严重的是占出口收入70%的咖啡种植园遭毁灭性破坏，约90%咖啡树被连根拔起，预计五年内难以恢复产能。国际红十字会已紧急调拨净水设备和医疗物资。美国海岸警卫队直升机在太子港上空投送食品包时，饥饿的灾民在积水中争抢。联合国官员警告，这场灾难可能使海地经济倒退十年。"
 
 hai.5.t:0 "关于对海地风灾援助的报告"
 hai.5.d:0 "尊敬的总统阁下：\n飓风已对海地造成灾难性打击，农业区被毁，基础设施瘫痪，民众流离失所。这场危机为我们提供了重要战略机遇。海地作为加勒比海地区的经济大国，其稳定直接影响加勒比海地缘政治。建议立即启动救援行动，包含以下措施：\n派遣陆军工程兵团协助堤坝修复，展示我国工程技术优势\n提供2000万美元紧急贷款，附加条件需使用美元结算采购\n安排海军运输舰队高调运送物资，展示军力\n此举将有效对冲苏联可能的人道主义宣传，已对抗在加勒比海和拉丁美洲多地潜在的共产主义叛乱威胁。"
 
 hai.6.t:0 "[From.GetName]宣布为海地提供援助"
 hai.6.d:0 "[From.GetName]外交部发表声明，北海大洪水对海地造成的严重破坏、人员伤亡和财产损失令人震惊。该国政府对遇难者表示诚挚的哀悼，同时，将为两国提供一笔人道主义经济援助，帮助受灾民众早日渡过难关。"
 
 
 
 hai.10.t:0 "对军政府的日益不满"
 hai.10.d:0 "保罗·欧仁·马格卢瓦尔将军领导下的海地军政府在飓风黑泽尔袭击中的救灾工作令海地民众失望透顶，腐败和独裁问题愈发严重。海地民间对军政府的不满情绪不断恶化。"
 
 hai.11.t:0 "反动派掀起反对活动"
 hai.11.t:0 "反对海地军政府的政治运动继续发酵，愤怒的民众和军方内部的反对派要求军政府辞职下台。"
 
 hai.12.t:0 "海地政治变动"
 hai.12.d:0 "海地爆发的政治动荡，以保罗·欧仁·马格卢瓦尔将军在民众、教会及军方内部反对派压力下，宣布辞职下台告终。海地军方宣布成立以约瑟夫·内穆尔·皮埃尔-路易将军为首的过度军政府，处理海地政治民主化的问题。"
 
 
 hai.15.t:0 "总统大选"
 
 hai.16.t:0 "达尼埃尔·菲尼奥勒当选海地总统"
 hai.16.d:0 "随着海地军政府结束统治，海地工农党的达尼埃尔·菲尼奥勒当选海地总统。菲尼奥勒被认为是一位具有左翼思想的领导人，主张进行土地改革并改善下层人民的生活。"
 
 
 hai.20.t:0 "警惕海地的共产主义威胁！"
 hai.20.d:0 "总统阁下！\n海地的达尼埃尔·菲尼奥勒政府正在进行土地改革，他们把美国在海地的土地和财产分发给农民……或者说，受到了共产主义影响的农民。我们必须清楚地认识到，海地正在进行的土地改革是一种向共产主义让步的行为，如果海地的土地改革获得成功，那么其他拉丁美洲国家的民众就会希望他们的国家也实行这种改革，这会导致我们的利益受损，以及共产主义在拉丁美洲的扩张。"
 
 hai.21.t:0 "海地爆发政变！"
 hai.21.d:0 "海地的消息！海地军方今天突然封锁了首都，并控制了总统府、广播电台和政府部门！军方首脑卡洛斯·卡斯蒂略·阿马斯将军在广播中宣布，总统达尼埃尔·菲尼奥勒施行的改革，破坏了国家稳定和国家利益，为拉丁美洲带来共产主义威胁，现军方为了国家和民族的未来，推翻达尼埃尔·菲尼奥勒政府，同时中止宪法和国会的运作。海地将成立临时军政府。\n达尼埃尔·菲尼奥勒总统被迫宣布停止抵抗，并流亡海外。"
 
 hai.25.t:0 "总统大选"
 
 hai.26.t:0 "弗朗索瓦·杜瓦利埃当选海地总统！"
 hai.26.d:0 "弗朗索瓦·杜瓦利埃在海地总统大选中高票当选！这位拥有渊博学识的医生曾经担任海地的卫生部长，任内积极推动海地的医疗卫生建设，深得海地人民喜爱和拥戴，被尊称为医生爸爸。因此，杜瓦利埃当选海地总统，让海地人民看到了曙光，人民相信杜瓦利埃能够建立一个更繁荣、进步的国家。"
 
 
 
 ################
 
 
 
 dom.1.t:0 "自由世界和平与博爱展览会"
 
 dom.2.t:0 "多米尼加发生入侵事件！"
 dom.2.d:0 "来自特鲁希略城的突发消息！\n多米尼加发生武装入侵事件！一支来历不明的武装分子乘坐运输机，空降至多米尼加内陆的康斯坦萨市郊外，并试图对城市发起攻击。武装分子已与多米尼加军方爆发激烈交火！"
 
 dom.3.t:0 "多米尼加叛军投降"
 dom.3.d:0 "入侵多米尼加的武装分子在交火中落败，56名叛军有15人被击毙，其余全部投降。\n经过严刑拷打，武装分子承认他们各自分别来自古巴、危地马拉、委内瑞拉以及美国共产党，他们得到古巴革命者菲德尔·卡斯特罗的支持。\n特鲁希略大为光火地指责卡斯特罗干涉多米尼加内政，呼吁自由世界警惕卡斯特罗勾结共产党在加勒比海地区的侵略扩张，但卡斯特罗政府则表示，这是对特鲁希略支持古巴反共团体的回敬。"
 
 dom.4.t:0 "赫苏斯·加林德斯·苏亚雷斯教授失踪！"
 dom.4.d:0 "美国纽约，曼哈顿第57街和第8大道的地铁站，一名40岁的男子人间蒸发，杳无音讯。\n哥伦比亚大学著名政治学家赫苏斯·加林德斯·苏亚雷斯教授在纽约曼哈顿街头神秘失踪，引发国际社会震惊。这位流亡美国的西班牙裔学者当晚离开西110街公寓后音讯全无。\n苏亚雷斯教授一生充满传奇色彩。西班牙内战期间，身为巴斯克人的他因反对弗朗哥政权流亡多米尼加共和国，后在特鲁希略城大学任教期间又因公开批评拉斐尔·特鲁希略独裁统治，被迫逃亡美国。在哥大执教期间，他持续揭露加勒比地区独裁政权暴行。\n美国媒体不约而同地认为，特鲁希略派遣杀手绑架并杀害了苏亚雷斯。虽然华盛顿方面拒绝正式指控，但纽约时报认为，有充分证据表明外国政府参与了此次绑架"。"
 
 dom.5.t:0 "玛丽亚·密涅瓦·米拉瓦尔被捕！"
 dom.5.d:0 "来自多米尼加消息。多米尼加的女权主义者和民主人士玛丽亚·密涅瓦·米拉瓦尔与他的丈夫马诺洛·塔瓦雷斯·胡斯托被捕入狱！特鲁希略指责夫妇二人秘密支持被称作六月十四日运动的反抗组织，并勾结卡斯特罗政府。\n米拉瓦尔与丈夫被关汝臭名昭著的维多利亚监狱，此外他的两个姐姐，帕特丽娅·米拉瓦尔和玛丽亚·特蕾莎·米拉瓦尔也受到当局的监视和软禁。"
 
 dom.6.t:0 "米拉瓦尔三姐妹被杀害！"
 dom.6.d:0 "来自多米尼加消息！一些从特鲁希略城回国的美国记者证实，玛丽亚·密涅瓦·米拉瓦尔、帕特丽娅·米拉瓦尔和玛丽亚·特蕾莎·米拉瓦尔已经死于多米尼加情报机构的监狱中。根据已有的信息，米拉瓦尔三姐妹在探监时被当局逮捕，残忍杀害后暴尸公路旁。\n米拉瓦尔三姐妹事件震惊了国际社会，拉丁美洲各国纷纷谴责暴君拉斐尔·特鲁希略对女性滥用暴力，残忍杀害无辜民众的暴行。"
 
 dom.8.t:0 "罗慕洛·贝坦科尔特接受采访"
 dom.8.d:0 "在联合国通过了对多米尼加的谴责议案后，大力支持制裁特鲁希略的委内瑞拉总统罗慕洛·贝坦科尔特接受了记者采访，并嘲讽特鲁希略是个无情的暴君。\n"那个躲在宫殿里的暴君，终于要为屠杀平民付出代价，"总统对着镜头挥舞当天的联合国决议文件，"他的统治就像用香水掩盖尸臭，但国际社会的鼻子是清醒的。"\n"我们已冻结其政权在委所有资产，"总统宣布将向联合国提交通往多米尼加的军火船证据，"那些装着儿童棺材的货轮，实际运输的是德制冲锋枪。""
 
 dom.9.t:0 "加拉加斯发生爆炸袭击事件！"
 dom.9.d:0 "加拉加斯突发消息！\n委内瑞拉总统罗慕洛·贝坦科尔特的座驾在洛斯普罗塞雷斯大道发生激烈爆炸！总统乘坐的凯迪拉克被炸成残骸，滚滚浓烟瞟向天空。\n贝坦科尔特总统受到重伤，已被紧急送往医院救治，他的司机和一名保镖当场死亡。"
 
 dom.10.t:0 "贝坦科尔特发表全国讲话"
 dom.10.d:0 "罗慕洛·贝坦科尔特在爆炸袭击中奇迹生还，深受重伤的他手缠绷带，在侍卫搀扶下回到总统府，发表全国讲话。\n\n我的同胞们，我还活着，并坚持为委内瑞拉、为美洲的自由表达我们国家的态度……他们想用鲜血让我们沉默，却不知民主者的伤口会开出自由之花……我呼吁美洲国家保持高度警惕，这个嗜血的暴君已陷入最后的彻底疯狂，这不会是他的最后一次暴行……\n\n美洲国家组织紧急召开会议，墨西哥、巴西等多国召回驻圣多明各大使。联合国秘书长强烈谴责"对国家元首的野蛮袭击"。目前委内瑞拉宣布进入紧急状态，关闭所有领空，陆军装甲师开赴加勒比海海岸。"