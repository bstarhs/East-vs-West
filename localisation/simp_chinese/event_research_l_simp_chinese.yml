 research.21.t:0 "我国的可控核聚变研究未能取得成果"
 
 research.22.t:0 "我国在核能飞机研究上取得突破！"
 
 research.23.t:0 "我国的核能飞机研究未能取得成果"
 
 research.24.t:0 "我国在微型核电池研究上取得突破！"
 
