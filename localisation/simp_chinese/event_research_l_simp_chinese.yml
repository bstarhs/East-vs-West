l_simp_chinese:
 research.1.t:0 "[FROM.GetName]已完成核武器开发！"
 research.1.d:0 "随着一声巨响，一个巨大的蘑菇云腾起在[FROM.GetName]的土地上空。[FROM.GetLeader]宣布其国家已完成了核武器的开发，成为大国中的一员。\n[FROM.GetName]的声明引起了国际社会的不安，尤其是部分大国的谴责。越来越多国家拥有核武器将加剧核战争的威胁。"
 research.1.a:0 "者会带来什么结果呢？"
 
 research.2.t:0 "[FROM.GetName]已完成半导体制造技术！"
 research.2.d:0 "经过艰难的的技术攻关，[FROM.GetName]的专家成功制造了世界上第一枚半导体芯片。相比电子管，以半导体晶体管为核心的芯片体积大大减小，而计算功能得到了改进。半导体芯片的诞生意味着未来的电子产品，包括家用电器、计算机以及汽车、武器的电子配件体积都将大大缩小，人类的电子技术发展进入了一个新的时期。"
 research.2.a:0 "太棒了。"
 
 research.3.t:0 "苹果公司发售世界上第一台个人电脑！"
 research.3.d:0 "美国苹果公司总裁史蒂夫·乔布斯向世人展示了他们足以改变世界的产品——世界上第一台个人微型计算机Aplle I，这将是一款划时代的产品，并将改变计算机的历史。"
 research.3.a:0 "太棒了。"
 
 research.4.t:0 "[FROM.GetName]发售世界上第一台个人电脑！"
 research.4.d:0 "[FROM.GetName]技术专家成功开发出世界上第一台个人电脑，并将在不久后投入民间使用。个人计算机进入人们的家庭，这不得不说是人类现代史上巨大的成就。"
 research.4.a:0 "太棒了。"
 
 research.5.t:0 "[FROM.GetName]完成了超导材料的研究！"
 research.5.d:0 "[FROM.GetName]的科学院宣布，该国成功完成了超导材料的制作，这种特殊的金属可以在特殊环境下将电阻降至最低，从而使得电流可以无损耗地传导，这种技术将被运用于制造更高级的电磁设备。"
 research.5.a:0 "太棒了。"
 
 research.6.t:0 "[FROM.GetName]完成了对DNA遗传学的研究！"
 research.6.d:0 "[FROM.GetName]的科学院宣布，该国成功完成了针对人类DNA遗传因子的一系列研究，这将是世界学史上的一大进步。"
 research.6.a:0 "太棒了。"
 
 research.7.t:0 "[FROM.GetName]的第一艘核潜艇下水！"
 research.7.d:0 "[FROM.GetName]海军宣布，该国已经成功建造了世界上第一艘核动力驱动的战略核潜艇，大大加强了该国的海军实力和核威慑。"
 research.7.a:0 "太棒了。"
 
 research.8.t:0 "[FROM.GetName]的第一艘航母下水！"
 research.8.d:0 "[FROM.GetName]海军宣布，该国已经成功建造了本国的第一艘航空母舰，大大加强了该国的海军实力。"
 research.8.a:0 "太棒了。"
 
 research.9.t:0 "[FROM.GetName]已完成氢弹开发！"
 research.9.d:0 "[FROM.GetName]宣布，该国已成功试爆该国第一枚氢弹。氢弹拥有原子弹十倍以上的当量，以及更大的破坏力。"
 research.9.a:0 "太棒了。"
 
 research.10.t:0 "[FROM.GetName]发明电视显像管！"
 research.10.d:0 "经过艰难的的技术攻关，[FROM.GetName]的专家成功制造了世界上第一枚半导体芯片。相比电子管，以半导体晶体管为核心的芯片体积大大减小，而计算功能得到了改进。半导体芯片的诞生意味着未来的电子产品，包括家用电器、计算机以及汽车、武器的电子配件体积都将大大缩小，人类的电子技术发展进入了一个新的时期。"
 research.10.a:0 "太棒了。"
 
