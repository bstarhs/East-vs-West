 hol.2.t:0 "荷兰的新女王"
 hol.2.d:0 "荷兰政府今日正式宣布，执政长达58年的威廉明娜女王因年事已高、健康欠佳，决定退位。王位将由朱莉安娜公主继承。\n威廉明娜女王18岁登基，历经两次世界大战。二战期间，她流亡英国坚持领导抵抗运动，通过电台向沦陷的荷兰民众发表演说，成为国家精神的象征。1945年回国时，所到之处万人空巷。\n在阿姆斯特丹、鹿特丹、海牙和乌德勒支的街头，民众纷纷表达不舍，电线杆和路灯上挂满了橙色的彩带，象征着人民对女王的告别。退位仪式将于下月在阿姆斯特丹王宫举行。新君主继位后，威廉明娜女王将移居海牙宫殿静养。"
 
 hol.3.t:0 "北海发生严重大洪水灾害！"
 hol.3.d:0 "本社在阿姆斯特丹的记者发来可怕的消息！一场台风带来的洪水正肆虐整个北海沿岸！\n北海的浪墙撕碎了荷兰的堤防。海水裹挟着渔船残骸冲进卧室，将婴儿摇篮抛向教堂尖顶。泽兰省的钟楼在洪流中轰然倒塌，铜钟沉入水底时仍在发出闷响，如同溺亡者最后的呜咽。佛兰德斯的农田在盐碱中腐烂，成千上万的奶牛漂浮在泛着白沫的水面上，胀大的肚皮不时碰撞着屋顶的电视天线。风暴持续了整整三天，当最后一道闪电照亮海面时，人们看见一艘英国货轮斜插在堤坝缺口处，船艏的锈蚀铭牌上还刻着"1944年诺曼底登陆用"。"
 
 hol.4.t:0 "北海洪水开始退去"
 hol.4.d:0 "退去的海水在瓦赫宁恩的街道上留下诡异的寂静。泥浆里半埋着钢琴键和《圣经》书页，偶尔有银匙在阳光下反光——那是某个家庭最后的财产。被盐分烧焦的果园里，枝头挂着从北海漂来的丹麦渔船渔网。最令人窒息的是那些空荡荡的绳索，它们仍系在码头桩上，另一端却什么也没有，只有风车残骸的叶片还在缓缓转动，将混着海腥味的春风，送往更东边尚未被侵蚀的麦田。\n我的老天！两次世界大战，德国人都没要了我的命，昨天差点被洪水泡死！\n比利时布鲁日的一家医院里，一位老人躺在病床上，惊魂未定地对记者说。"
 
 hol.5.t:0 "关于北海大洪水灾情及赈灾请求的紧急报告"
 hol.5.d:0 "尊敬的首相阁下：\n北海大洪水对我国西南沿海地区造成了前所未有的破坏。泽兰、南荷兰等省堤坝全线溃决，海水倒灌导致超过1500平方公里土地被淹，300余个村镇受灾。初步统计显示，已有数千栋房屋被毁，数万民众流离失所，死亡人数仍在攀升。农田盐碱化严重，今年春耕已无望，畜牧业损失惨重。公路、桥梁损毁，多座发电站瘫痪，灾民缺乏干净的饮用水和食物。\n鉴于灾情严峻，恳请政府立即拨付紧急赈灾资金，用于以下方面：一是修复决堤的海防工程，防止二次灾害；二是搭建临时安置所，保障灾民基本生活；三是提供医疗援助，控制疫情蔓延；四是补偿农民损失，稳定粮食供应。此外，建议向国际社会求援，尤其是防洪技术及物资支持。\n此致，敬礼！"
 
 hol.6.t:0 "大洪水抢险工作正在进行"
 hol.6.d:0 "本报记者深入受灾最严重的泽兰省，眼前景象令人揪心。曾经富饶的圩田区已成汪洋，被连根拔起的果树倒插在泥浆中，牲畜尸体与家具残骸漂浮在昔日热闹的市镇广场。\n在克鲁宁根市，海水浸泡过的房屋外墙留着两米高的褐色水痕，市政厅钟楼的指针永远停在了灾难降临的时刻。临时安置点内，数百灾民挤在军用帐篷里，一位老人紧攥着仅存的家庭相册告诉记者：海水来得太快，我们只来得及抱起孩子。\n政府救灾指挥部24小时运作，皇家海军已调派三十艘舰艇运送物资。在受灾最严重的斯霍恩岛，工程兵正冒险抢修决堤口，直升机不断往返投送沙袋。农业部门警告，约12万公顷良田遭盐水侵蚀，可能引发粮食危机。\n尽管灾情严峻，荷兰民众展现出顽强韧性。重建家园的工作正在艰难起步。"
 
 hol.7.t:0 "宣布为荷兰和比利时提供援助"
 hol.7.d:0 "外交部发表声明，北海大洪水对荷兰、比利时两国造成的严重破坏、人员伤亡和财产损失令人震惊。该国政府对遇难者表示诚挚的哀悼，同时，将为两国提供一笔人道主义经济援助，帮助受灾民众早日渡过难关。"
 
 hol.8.t:0 "关于对荷兰洪灾援助的报告"
 hol.8.d:0 "尊敬的总统阁下：\n北海大洪水已对荷兰造成灾难性打击，泽兰省等关键农业区被毁，基础设施瘫痪，民众流离失所。这场危机为我们提供了重要战略机遇。荷兰作为欧洲门户与马歇尔计划受益国，其稳定直接影响西欧经济复苏。建议立即启动救援行动，包含以下措施：\n派遣陆军工程兵团协助堤坝修复，展示我国工程技术优势\n调拨剩余农产品解决粮食危机，缓解欧洲对苏联粮食依赖\n提供2000万美元紧急贷款，附加条件需使用美元结算采购\n安排海军运输舰队高调运送物资，展示军力\n此举将有效对冲苏联可能的人道主义宣传，巩固北约东翼。荷兰政府内部亲美派已暗示将支持我国在欧军事部署作为回报。"
 
 hol.9.t:0 "美国援助抵达荷兰"
 hol.9.d:0 "当第一箱印着星条旗标志的药品被起重机卸下时，等候多时的闪光灯立刻织成一片银网。\n美国外交官特意站在写有"来自美国人民的友谊"的物资箱前，亲手将一袋小麦交给荷兰官员。两人的握手持续了足够摄影师调整焦距的时间，背后是整齐码放的医疗包，每个绷带卷上都印着英文使用说明。"
 
 hol.20.t:0 "回家之路"
 hol.20.d:0 "鹿特丹运河边的老房子爬满了新藤蔓。男人站在门前，手指抚过门框上那道刻痕——那是他被德国人带走前，儿子身高的标记，如今已斑驳难辨。\n多年以前，男人秘密支持抵抗组织的行为被德国人发现，而被送往遥远的奥地利集中营。战争结束后，社会动荡使得男人花了一年多时间，才辗转回到鹿特丹。一路上，男人憧憬着驱逐纳粹后，父子俩能生活在一个自由的、没有暴政的荷兰。然而当他回到家，看见小屋早已破败不堪。儿子也不见踪影。\n女士，亨利·范德里克去哪了？\n他死了。\n谁杀了他？德国人？\n在爪哇。你看看信箱，这是皇家东印度军团的阵亡通知书。"

