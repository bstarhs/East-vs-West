 Netherland.9.d:0 "美国向我们投来一份停火协议。"
 Netherland.9.a:0 "还是同意吧"
 Netherland.9.b:0 "他们凭什么教我们做事？！"

 Netherland.10:0 "《伦维尔协定》"
 Netherland.10.t:0 "《伦维尔协定》"
 Netherland.10.d:0 "根据《伦维尔协定》，我们将直接管理除[873.Getname]以外的印尼领土。"
 Netherland.10.a:0 "尚能接受"

 Netherland.11:0 "《伦维尔协定》"
 Netherland.11.t:0 "《伦维尔协定》"
 Netherland.11.d:0 "昨日，荷兰政府同意了美国提出的停火协议，与印尼政府签订了《伦维尔协定》。协定确认了荷兰将直接管理除[873.Getname]以外的印尼领土。"
 Netherland.11.a:0 "短暂的和平罢了……"

 Netherland.12:0 "《伦维尔协定》"
 Netherland.12.t:0 "《伦维尔协定》"
 Netherland.12.d:0 "昨日，荷兰政府同意了美国提出的停火协议，美国方面向我们施压，要求我们签订《伦维尔协定》。协定要求我们放弃除[873.Getname]以外的领土。"
 Netherland.12.a:0 "可耻！"

 Netherland.13:0 "荷兰方面拒绝停火协议"
