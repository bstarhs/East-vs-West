l_simp_chinese:
 swe.10.t:0 "瑞典将承办1958年世界杯"
 swe.10.d:0 "1958年国际足联世界杯将在瑞典举办。"
 
 swe.11.t:0 "1958年国际足联世界杯在瑞典开幕"
 swe.11.d:0 "1958年国际足联世界杯在瑞典开幕，瑞典首相[SWE.GetLeader]出席了开幕式。"
 
 swe.12.t:0 "苏联获得首次参加世界杯的资格！"
 swe.12.d:0 "苏联国家足球队获得首次参加世界杯的资格！苏联代表队即将飞往斯德哥尔摩参赛。"
 
 swe.13.t:0 "以色列获得首次参加世界杯的资格！"
 swe.13.d:0 "以色列国家足球队获得首次参加世界杯的资格！以色列代表队即将飞往斯德哥尔摩参赛。"
 
 swe.14.t:0 "抵制世界杯"
 
 swe.15.t:0 "宣布抵制瑞典世界杯"
 
 swe.16.t:0 "联邦德国遗憾错失季军"
 swe.16.d:0 "上一届的世界杯冠军，联邦德国在瑞典世界杯中惜败法国队，错失季军。"
 
 swe.17.t:0 "法国球员在小组赛中攻入六球"
 swe.17.d:0 "瑞典世界杯第二组小组赛中，苏格兰、南斯拉夫、巴拉圭和法国进行竞争。朱斯特·方丹攻入六球，取得本届世界杯最多的一次入球。法国由此获得小组赛的胜利，将于巴西队争夺半决赛。"
 
 swe.18.t:0 "巴西击败法国攻入半决赛"
 swe.18.d:0 "巴西和法国在上半场大部分时间以1-1战平。然而，比赛进行到第36分钟，法国队队长、经验最丰富的后卫罗伯特·容凯在与瓦瓦的冲突中腿部骨折，法国队在剩余比赛中仅剩十人应战（当时不允许换人）。\n半决赛以巴西的胜利告终，巴西队在比赛的剩余时间里占据了主导地位，贝利的帽子戏法帮助球队以5-2获胜。法国队的方丹又为他的精彩进球再添一球。"
 
 swe.19.t:0 "巴西队获得瑞典世界杯冠军！"
 swe.19.d:0 "瑞典世界杯的最终决赛决赛在索尔纳的拉松达体育场举行！\n五万名观众现场观战，巴西队开场四分钟就落后一球。然而，瓦瓦随后不久扳平比分，并在半场结束前再进一球。下半场，贝利光芒四射，梅开二度，其中第一个进球是他挑传球过掉本特·古斯塔夫森，随后一记精准的凌空抽射。扎加洛在中场补时阶段打入一球，瑞典队则打入一球，为球队挽回颜面。\n随着裁判的哨声，比赛落下帷幕，巴西夺得本届世界杯的冠军！年仅17岁的巴西球员贝利，在闪光灯面前捧起大力神杯！"
 swe.19.a:0 "为贝利欢呼！！为巴西欢呼！！"