 PRC_111:0 "四清运动"
 
 PRC_111:0 "左联"
 PRC_111:0 "台湾地下党组织"
 
 PRC_liberate_tibet:0 "解放西藏"
 PRC_liberate_tibet_desc:0 "随着国民党反动派的全面崩溃，全中国的解放近在眼前，放眼大陆就只剩下最后一片土地——雪域西藏。西藏自古以来就是中国领土，但自从中华民国建立以来，北洋政府和国民党政府都未能有效对西藏行使主权，西藏的实际控制权依然处在由封建反动贵族组成的所谓噶厦手中，这些贵族不仅对西藏人民实行野蛮的奴隶制和落后的政教合一制度，甚至勾结英帝国主义者，谋求脱离中国独立，建立伪西藏国。为了解放西藏人民，为了实现祖国的统一与领土完整，让我们向雪域高原进军！"
 PRC_attack_islands:0 "解放沿海岛屿"
 PRC_attack_islands_desc:0 "国民党反动派依然占据浙江、福建和广东沿海地区岛屿，威胁我国海防安全，我们将采取行动，将反动派驱逐出去！"
 
 PRC_china_burma_border:0 "中缅边境谈判"
 PRC_china_burma_border_desc:0 "随着新中国政权得到巩固，我们将开始处理旧中国遗留下来的领土争端。就目前来说，云南与缅甸之间的边境问题需要优先解决。\n国民党政府与英帝国主义在1941年签订的伪条约，将猛卯地带、班老地带和班洪地带划给英属缅甸，新中国不承认这一条约，尤其不能放弃有银矿的班老地带。当然，新中国草创初期，外交局势十分紧张，我们应该谨慎处理。"
 
 PRC_jiaofei_tool:0 "可以通过决议来镇压各省反动武装并提高我政府支持率"
 
 PRC_works_leader:0 "工人阶级领导一切"
 PRC_works_leader_desc:0 "资产阶级道路的政府官僚机构被打倒，现在我们将重建真正由无产阶级实行民主专政的社会管理制度，让广大无产阶级群众真正领导这个共和国。"
 PRC_protarias:0 "扩大无产阶级干部队伍"
 PRC_protarias_desc:0 "无产阶级要拥有治理社会和国家的能力，我们要更多地从无产阶级群众当中选拔政治背景和能力都十分出色的积极分子，进入管理层中。"
 PRC_party_armies:0 "党枪一体"
 PRC_party_armies_desc:0 "在从前，毛主席主张党指挥枪，人民解放军接受党的领导，但随着国内外局势的改变，我们认为应该把枪放在和党平等的地位，人民解放军要有自己的政治地位和领导力，才能更好地在保卫社会主义祖国的斗争中发挥主动性和积极性。"
 PRC_militarist_rules:0 "扩大军事管制"
 PRC_militarist_rules_desc:0 "文化大革命开始之后，有许多打着革命七号冲击党政机关的不法分子，人民解放军有责任与义务与这些暴徒进行对抗，以维护社会治安。"
 PRC_pro_militarist:0 "爱国拥军运动"
 PRC_pro_militarist_desc:0 "伟大的林主席和其领导下的伟大的人民解放军是无产阶级社会主义国家的缔造者和守护者，热爱人民解放军，拥护人民解放军和积极参加人民解放军是革命公民光荣的义！务！"
 PRC_support_lin:0 "拥护林统帅"
 PRC_support_lin_desc:0 "让我们祝福伟大的林彪主席永远健康，我们也坚决支持林主席的伟大革命路线。"
 PRC_8_art:0 "革命样板戏"
 PRC_8_art_desc:0 "无产阶级革命群众，需要无产阶级的革命艺术。在横扫资产阶级反动艺术后，我们将向人民群众推广江青同志指导下创作的无产阶级革命样板戏。"
 PRC_left_armies:0 "解放军支左"
 PRC_left_armies_desc:0 "文化大革命爆发后，左派革命群众和右派当权派之间的冲突日益激烈，毛主席指出，人民解放军应该积极地支持左派群众。"
 
 PRC_culture_movements:0 "扫盲运动"
 PRC_culture_movements_desc:0 "旧中国给这个国家留下了超过70%的文盲率，要想建设新国家，就必须从普及文化知识，消灭文盲开始。"
 PRC_health_movements:0 "爱国卫生运动"
 PRC_health_movements_desc:0 "战乱带来的疾病和瘟疫依然在许多地区肆虐，我们需要尽快开展整治，清理街道，治疗疾病，普及卫生知识，以稳定社会和救治人民。"
 PRC_female_movements:0 "解放妇女运动"
 PRC_female_movements_desc:0 "数千年以来，封建陋习给我们广大妇女同胞带来了沉重的苦难，解放妇女，不仅是社会主义国家实现民主和平等的要求，而且是解放生产力，鼓励妇女参与工作的重要一步。毛主席说过：妇女能顶半边天！"
 PRC_satllite_movements:0 "农业高产卫星"
 PRC_satllite_movements_desc:0 "在人定胜天的思想指导下，全国各地都要在农业生产上发挥积极性和主动性，"
 PRC_clear_fours:0 "除四害运动"
 PRC_clear_fours_desc:0 "蟑螂、蚊虫、苍蝇和麻雀这四种动物不仅传播疾病，还会破坏农业生产，我们要发动人民群众开展除四害，将他们消灭以维护环境卫生和农业。"
 PRC_dazhai:0 "农业学大寨"
 PRC_dazhai_desc:0 "陈永贵同志领导下的山西省大寨县，不向国家要钱要粮，依靠自力更生和改造自然，创造了令人惊讶的生产成绩，我们要鼓励全国学习大寨县的经验和精神。"
 
 PRC_buy_planes:0 "购买战斗机"
 PRC_buy_planes_desc:0 "我国目前没有自产战斗机的能力，但我们可以向友好国家购买。"
 PRC_expanded_airbase:0 "扩大空军基地"
 PRC_expanded_airbase_desc:0 "我国领土庞大，如果要保卫我们的领空，需要进一步扩大空军基地，使得我们的空军作战范围能够辐射所有领土。"
 PRC_northeast_airbase:0 "扩大东北空军基地"
 PRC_northeast_airbase_desc:0 "东北是我国最重要的工业基地，但此地毗邻苏联和朝鲜，需要重点保护。"
 PRC_east_airbase:0 "扩大东部空军基地"
 PRC_east_airbase_desc:0 "长三角是我国重要的经济中心，而海的对面就是台湾国民党反动派和美帝控制下的日本，需要重点保护。"
 PRC_south_airbase:0 "扩大南部空军基地"
 PRC_south_airbase_desc:0 "广东广西两地不仅是我国重要的经济中心，而且是守卫南海的前哨战，需要重点保护。"
 PRC_southwest_airbase:0 "扩大西南空军基地"
 PRC_southwest_airbase_desc:0 "西南地区正面临国民党残兵和缅甸、泰国当局的威胁，需要加强此地空军力量。"
 PRC_northwest_airbase:0 "扩大西北空军基地"
 PRC_northwest_airbase_desc:0 "中苏关系破裂后，西北地区正面临苏修帝国主义的威胁，需要加强此地空军力量。"
 PRC_sinjang_airbase:0 "扩大新疆空军基地"
 PRC_sinjang_airbase_desc:0 "中苏关系破裂后，新疆正面临苏修帝国主义的威胁，需要加强此地空军力量。"
 PRC_tibet:0 "扩大西藏空军基地"
 PRC_tibet_desc:0 "中印关系破裂后，西藏正面临印度和藏独分子的威胁，需要加强此地空军力量。"
 PRC_develop_jet:0 "发展喷气战斗机"
 PRC_develop_jet_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 PRC_develop_fighter:0 "发展现代化战斗机"
 PRC_develop_fighter_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 PRC_develop_bomber:0 "发展战略轰炸机"
 PRC_develop_bomber_desc: "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 PRC_develop_transplanes:0 "发展运输机"
 PRC_develop_transplanes_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 PRC_develop_air_equip:0 "发展空军装备"
 PRC_develop_air_equip_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 PRC_develop_helicopter:0 "发展陆航直升机"
 
 PRC_militarist_indus_1:0 "发展军工 I"
 PRC_militarist_indus_1_desc:0 "新生的人民共和国面临帝国主义和反动派威胁，我们要尽快建设军事工业，强化人民军队以保卫祖国。"
 PRC_militarist_indus_2:0 "发展军工 II"
 PRC_militarist_indus_2_desc:0 "新生的人民共和国面临帝国主义和反动派威胁，我们要尽快建设军事工业，强化人民军队以保卫祖国。"
 PRC_militarist_indus_3:0 "发展军工 III"
 PRC_militarist_indus_3_desc:0 "新生的人民共和国面临帝国主义和反动派威胁，我们要尽快建设军事工业，强化人民军队以保卫祖国。"
 PRC_missiles:0 "发展导弹武器"
 PRC_missiles_desc:0 "导弹技术可能是20世纪最重要的军事发明之一，他最早诞生于二战德国的V2火箭，并在50年代的美苏争霸中完善。最早的导弹通过红外线热感应进行制导，通过接收目标反射的热光调整弹道，到了后来出现了电视制导和主动激光制导。导弹的应用相当广泛，它可以用于大型的弹道导弹，也可以用于制导炸弹，或步兵、车载的反坦克或反导导弹，它大大提升了军队的作战效率，但最大的问题就是——他太贵了。"
 
 PRC_develop_armor:0 "发展装甲部队"
 PRC_develop_armor_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 PRC_develop_mechanized:0 "发展机械化部队"
 PRC_develop_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 PRC_develop_airdrop:0 "发展空降部队"
 PRC_develop_airdrop_desc:0 "飞机航程和载荷的发展开辟了许多可能性。运输机可以在敌人战线的大后方投下一整个师的部队，在那里他们可以造成严重破坏。"
 
 PRC_buy_ships:0 "购买军舰"
 PRC_buy_ships_desc:0 "我们目前还没有建造舰船的能力，但我们可以向其他国家购买退役的舰艇。"
 PRC_expanded_naval:0 "扩大海军基地"
 PRC_expanded_naval_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 PRC_qingdao_naval:0 "建设青岛基地"
 PRC_qingdao_naval_desc:0 "青岛是一处天然良港，此地直面黄海，扼守渤海湾，有重要战略价值，曾被德国殖民者开发为军港，现在我们也将把此地建设为东海舰队的重要基地。"
 PRC_dalian_naval:0 "建设旅顺基地"
 PRC_dalian_naval_desc:0 "著名的旅顺不冻港是东北亚最重要的海上战略重心，沙俄和日本帝国都曾争夺此地，现在我们也将把此地建设为东海舰队的重要基地。"
 PRC_shanghai_naval:0 "建设上海基地"
 PRC_shanghai_naval_desc:0 "上海是我国最重要的海上交通枢纽，外接东海内通长江，现在我们也将把此地建设为东海舰队的重要基地。"
 PRC_fujian_naval:0 "建设福建基地"
 PRC_fujian_naval_desc:0 "福建是中国现代海军的发源地，现在是直面台湾国民党政权的海上前线，我们也将把此地建设为舰队的重要基地。"
 PRC_zhanjiang_naval:0 "建设湛江基地"
 PRC_zhanjiang_naval_desc:0 "湛江地区多天然良港，且直面南海，曾被法国殖民者开发为军港，我们也将把此地建设为南海舰队的重要基地。"
 PRC_hainan_naval:0 "建设海南基地"
 PRC_hainan_naval_desc:0 "海南岛在南中国海具有重要战略价值，我们也将把此地建设为南海舰队的重要基地。"
 PRC_jiangnan_dock:0 "江南造船厂"
 PRC_jiangnan_dock_desc:0 "江南造船厂曾是中国海军最重要的造船厂，但后来被日本侵略者和国民党官僚破坏，现在我们将重建造船厂。"
 PRC_dalian_dock:0 "大连造船厂"
 PRC_dalian_dock_desc:0 "大连的优越地理位置不仅适合发展海军基地，且适合建设造船中心。"
 PRC_guangzhou_dock:0 "广州造船厂"
 PRC_guangzhou_dock_desc:0 "广州在两千年前就开始建造远洋船只，我们将在这里开发更多的造船设施。"
 PRC_marines_focus:0 "建设海军陆战队"
 PRC_marines_focus_desc:0 "从浙江到南中国海，围绕岛屿的争夺是保护我国海上主权的关键，一支强大的海军陆战队将让我军拥有保卫海上领土的能力。"
 PRC_light_ships:0 "研发轻型军舰"
 PRC_light_ships_desc:0 "我们的海军刚刚起步，至少需要一些护卫舰和驱逐舰来保护我们的领海。"
 PRC_medium_ships:0 "研发中型军舰"
 PRC_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 PRC_develop_sub:0 "研发潜艇"
 PRC_develop_sub_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，并摧毁敌人的海上入侵。"
 PRC_carriers:0 "研发航空母舰"
 PRC_carriers_desc:0 "第二次世界大战的海上战争，航空母舰大放异彩。巨舰大炮的时代已被淘汰，舰载机将主宰未来地球70%的天空！"
 PRC_naval_equip:0 "开发海军装备"
 PRC_naval_equip_desc:0 "一支强大的海军，不止要拥有战舰的数量，还要发展战舰上的武器和设备，主炮、雷达、近防炮、电子设备、动力设备……"
 PRC_naval_modern:0 "开发现代化海军装备"
 PRC_naval_modern_desc:0 "一支强大的海军，不止要拥有战舰的数量，还要发展战舰上的武器和设备，主炮、雷达、近防炮、电子设备、动力设备……"
 
 PRC_red_base:0 "红岸基地"
 PRC_red_base_desc:0 "我们需要进一步增加对浩瀚宇宙的探索，我们将建设一座秘密基地，以进行对太空的勘测，包括对太空发射电磁波信息，也许有一天能收到回应。"
 PRC_red_base_tool:0 "§Y彩蛋国策，不会有实际效果§W"
 PRC_space_bureau:0 "中国航天科学院"
 PRC_nuclears:0 "发展核技术"
 PRC_nuclears_desc:0 "核子裂变释放出来的能量摧毁了广岛和长崎，也将人类带入一个全新的时代。核技术有着巨大的运用价值，它可以制造毁灭性的可怕武器，也可以用来提供无尽的清洁能源，甚至运用到生物化学领域。\n原子能的释放改变了除人类思维方式以外的一切。\n——阿尔伯特·爱因斯坦"
 PRC_nuclear_power:0 "发展核能"
 PRC_nuclear_power_desc:0 "核聚变释放出来的能量如果用于发电，不仅能够提供远高于化石能源的电力，并且成本低、低污染。"
 
 PRC_shandsong_oilfioeld:0 "胜利油田"
 PRC_shandsong_oilfioeld_desc:0 "我们在山东省的黄河入海口发现了油田，如果我们进行开发，它将成为仅次于大庆的第二大能源基地。"
 PRC_sinjang_oilfioeldr:0 "开发新疆石油"
 PRC_sinjang_oilfioeldr_desc:0 "新疆的天山山脉拥有丰富的石油和天然气资源，对新疆燃气田的开发将有利于改善能源供给。"
 PRC_plastics:0 "开发化工产业"
 PRC_plastics_desc:0 "化学工业是现代工业重要的一环，从化工品、燃料、塑料再到药物，都离不开化学工业。"
 PRC_steel_indus:0 "发展钢铁产业"
 PRC_steel_indus_desc:0 "钢铁是工业之核心，从家里使用的锅碗，再到坦克飞机核武器，都离不开钢铁。成熟的炼钢工业是走向工业国的开始。"
 
 PRC_canton_zone:0 "广东经济特区"
 PRC_canton_zone_desc:0 "广东省贴近香港，又有优质的工业基础、外贸港口和人力资源，如果在这里设置经济特区，可以通过三来一补政策，吸引投资，发展出口加工制造业，为改革开放赚取第一桶金。"
 PRC_shanghai_zone:0 "上海经济特区"
 PRC_shanghai_zone_desc:0 "上海市贴近日本和台湾，又有优质的工业基础、外贸港口和人力资源，如果在这里设置经济特区，可以通过三来一补政策，吸引投资，发展出口加工制造业，为改革开放赚取第一桶金。"
 PRC_gorge_dam:0 "三峡工程"
 PRC_gorge_dam_desc:0 "三峡，即瞿塘峡、巫峡、西陵峡，是位于四川与重庆交界处、长江中上游地区的河流峡谷，被认为是长江河流最狭窄的地区，自中国开始修建水电站以来，在三峡地区修建水坝，就一直被孙中山政府、国民党政府和后来的共产党政府所屡次构想。如果三峡大坝得到实现，那么这将会是人类历史上规模最大的水电工程，他所提供的发电、航运和水利作用将是巨大的，同时成本也是巨大的。"
 
 prc_food_note_focus:0 "发行粮票"
 prc_food_note_focus_desc:0 "我们的物资供给远远不能满足不断上涨的物资需求，我们必须采取新的物资配给措施，民众必须持有官方发行的票券才能领取物资。"
 prc_talk_warlords:0 "接触军阀"
 prc_talk_warlords_desc:0 "国民党军阀之间亦有矛盾，龙云、卢汉、李宗仁等，与蒋介石矛盾由来已久，我们只需要采取一些政治手段，便能破坏蒋介石与地方军阀之间的关系，甚至动员军阀投入到反对蒋介石的全国解放斗争中。"
 prc_4_clear:0 "四清运动"
 prc_4_clear_desc:0 "四清运动，最初是指清工分，清账目，清财物，清仓库，是大跃进结束后，中共对农村经济和社会混乱进行的一次调整，但随着反右运动的再起，四清运动成为旨在消除农村地区走资派的运动，即清政治，清经济，清组织，清思想。"
 
 prc_support_vietnam:0 "支持越南革命"
 prc_support_vietnam_desc:0 "越南人民正在反抗帝国主义的侵略与殖民统治，我们应当帮助他们！"
 prc_doplo_focus:0 "建立外交部"
 prc_doplo_focus_desc:0 "中华人民共和国成立后，面临着严峻的外交局势，我们需要尽快与世界各国，尤其是第三世界国家进行交往，以打破孤立和封锁。"
 prc_1992:0 "邓小平理论"
 prc_1992_desc:0 "虽然改革开放已进行多年，但围绕改革进行的争论依然广泛存在，人民群众普遍关心我们的一系列经济政策姓社姓资的问题，以及改革走多远，走多块的问题。改革是无法在思想不统一的情况下坚持下去的，我们需要邓小平同志对改革开放的路线进行确定和统一。"
 prc_tourism:0 "发展旅游业"
 prc_tourism_desc:0 "我国具有五千多年的文明，留下了许多宝贵的文化遗产，长城、紫禁城、兵马俑……随着我国对外开放，许多的外国游客希望来到我国观赏这些奇观，我们应该支持发展旅游业，以赚取外汇和刺激消费。"
 prc_media:0 "文化开放"
 prc_media_desc:0 "由于文化大革命时期错误的文艺路线，导致我国民众对世界各国的发展状况缺乏理解，我们需要让人民群众睁眼看世界，了解各国的实际情况。引进外国的电影、电视剧等文化作品是一个不错的办法，也有利于打破群众对左倾路线的迷信，有利于对外开放。"
 prc_great_steel:0 "大炼钢铁"
 prc_great_steel_desc:0 "钢铁是工业的根基，没有足够的钢材，工业和军事建设都无从谈起，然而我国目前钢铁产量极为落后，如果要建设现代化的工业，就必须迅速增加钢铁产量。我们将发动人民群众参与到钢铁生产当中。"
 state_great_steel_modifiers:0 "开展大炼钢铁"
 prc18:0 "大跃进"
 prc18_desc:0 "我们距离发达国家的工业产值差距依然十分巨大，如果我们想要拥有抵抗帝国主义入侵的能力，就必须以最快的速度提高我国的工业化，以最快的速度建立发达的经济和生产力。"
 prc_ten_relations:0 "论十大关系"
 prc_taiwan:0 "解放台湾"
 prc_taiwan_desc:0 "残暴的国民党余孽妄图割据台湾，分裂国家，做最后的负隅顽抗，四万万中国人民绝对不会答应！我们将会完成解放全中国的最后一步，解放台湾，消灭国民党余孽！"
 prc_economic:0 "稳定经济"
 prc_economic_desc:0 "无能的国民党反动派，把中国的经济搞得一团糟，我们面对的形式十分严峻，严重的通货膨胀、市场混乱、囤货居奇和消费品短缺严重考验着新中国政府的执政能力。"
 prc_jiaofei:0 "西南剿匪"
 prc_jiaofei_desc:0 "我们已经成功取得了全国的解放，然而战斗并未结束。从东南沿海、西南地区、西北地区到新疆，依然盘踞着势力庞大的反动武装破坏革命政权，我们必须采取一系列政治和军事手段，镇压反动派，同时争取当地人民的支持，建立人民共和国在全国的威望。"
 prc_pla:0 "中国人民解放军"
 prc_pla_desc:0 "伟大的解放战争已经开始，我们将团结全国人民武力推翻反动势力的统治。我们的军队在土地革命战争和抗日战争中经历了血的洗礼，现在，是时候将解放区各大武装部队统一起来，建立一支真正为中国的独立、自由和统一而战的军队——中国人民解放军！"
 prc_police:0 "中国人民公安"
 prc_police_desc:0 "新中国建立之初，首要任务便是稳定秩序，我们需要完善的治安警察队伍来维护社会稳定，帮助重建秩序，打击犯罪，清剿破坏法律和人民利益的犯罪集团，并镇压试图破坏新政权的反动派残余分子。"
 prc_armed_police:0 "武装警察"
 prc_armed_police_desc:0 "反革命势力和敌特分子对我国的威胁依然存在，我们需要强化我国保卫公共安全的能力。除了人民公安干警和民兵队伍，我们还需要一支军事化的武装警察部队。"
 prc_war_jap:0 "施压日韩"
 prc_war_jap_desc:0 "日本倭寇，不仅过去侵略我国，残杀千万国人，现在还站在美帝国主义一边，充当威慑我国的走狗。十世之仇犹可报，新账旧账一起算。"
 prc_war_southea:0 "施压东南亚"
 prc_old_republic:0 "三民主义统一中国"
 prc_old_republic_desc:0 "龙珠九转十二金光，反指五岳和三江。"
 prc_empire:0 "中华帝国"
 prc_greater_map:0 "秋海棠"
 prc_federation:0 "联省自治"
 prc_free_china:0 "自由中国"
 prc_free_china_desc:0 "只有当每一个中国人都拥有了不可侵犯的政治权利，拥有了可以建立自己的民选、民享、民治的政府，中国才有希望跳脱出封建和专制的轮回，走向真正的自由。"
 prc_election:0 "政党轮替"
 prc_election_desc:0 "中国共产党已经完成了自己民族解放的历史使命，现在是时候实行政治体制改革，结束对政治的控制，让民主党派参与到执政当中。"
 prc_hope_project:0 "希望工程"
 prc_hope_project_desc:0 "庞大的领土使我们的教育系统无法覆盖到每一寸土地，在遥远的农村和边疆，依然有大量的孩子没有学校，没有教育。希望工程的目的在于投资落后地区的教育发展，让每一个孩子都有机会读书识字。"
 prc_abolish_rural_tax:0 "废除农业税"
 prc_abolish_rural_tax_desc:0 "中国从两千多年前的秦朝开始就实行农业税，强制农民将一定数量的农产品上交政府，这一政策奠定了中国数千年来以土地为基础的经济体制，也导致了严重的农村腐败和社会矛盾。国务院许多官员都在积极呼吁废除农业税，让农民拥有自己的土地和财产。"
 prc_new_rural:0 "社会主义新农村"
 prc_new_rural_desc:0 "社会主义新农村是广东省委书记赵紫阳同志提出的一个农村建设方案，即建立卫生和交通设施，实现农村现代化，同时推动化肥和机械的使用，支持农业现代化，并考虑引进外国技术。"
 prc_farm_loan:0 "发行农业贷款"
 prc_modernized_agriculture:0 "农业机械化"
 prc_revolution_America:0 "支持美洲人民革命"
 prc_revolution_America_desc:0 "美国左派群众发起的学生运动此起彼伏，他们需要我们的帮助。"
 prc_revolution_Europe:0 "支持欧洲人民革命"
 prc_revolution_Europe_desc:0 "欧洲左派群众发起的工人和学生运动此起彼伏，他们需要我们的帮助。"
 prc_revolution_Africa:0 "支持非洲人民革命"
 prc_revolution_Africa_desc:0 "广大非洲大地上，反帝反殖民运动风起云涌，非洲人民正在抵抗帝国主义殖民者的残暴统治，他们需要我们的帮助。"
 prc_revolution_ME:0 "支持中东人民革命"
 prc_revolution_ME_desc:0 "广大阿拉伯人民反帝反殖民运动风起云涌，阿拉伯人民正在抵抗帝国主义殖民者的残暴统治，他们需要我们的帮助。"
 prc_international_maoist:0 "毛泽东思想国际化"
 prc_mao_propaganda:0 "毛泽东思想宣传队"
 prc_anti_west:0 "反西方情绪"
 prc_anti_west_desc:0 "外国的文化、外国的商品、外国的意识形态、外国的人……都没有我们本国的好。把他们扔出去，让我们中华民族的子民支持中华的一切。汉族，你觉醒罢！"
 prc_dragon_awake:0 "巨龙觉醒"
 prc_confusion:0 "尊孔复古"
 prc_confusion_desc:0 "尊孔复古"
 prc_traditional:0 "传统的遗产"
 prc_civilian_Militarist:0 "大办民兵师"
 prc_civilian_Militarist_tool:0 "一旦遭受外国入侵，可以立刻获得一批民兵师队伍和军事经验，但这将加剧造反派夺权速度"
 prc_rise:0 "中国崛起"
 prc_say_no:0 "中国可以说不"
 prc_three_means:0 "三个代表"
 prc_three_means_desc:0 "中国共产党要始终代表中国先进生产力的发展要求，要始终代表中国先进文化的前进方向，要始终代表中国最广大人民的根本利益。\n\n在文化大革命走入历史，经济建设发展成为中国主旋律的背景下，中国共产党是否应该继续坚持阶级斗争，尤其是保持阶级性成为了讨论的焦点。中共的第三代领导人提出三个代表，即将党从代表工农阶级利益，转化为代表所有中国人的利益，这自然包括了通过改革开放产生的新兴中产阶级。三个代表理论标志着共产主义的阶级斗争从中共的理论体系中剔除，中共从代表一个阶级消灭另一个阶级的革命党，转变为容纳所有社会等级的执政党。"
 prc_cr_team:0 "中央文革小组"
 prc_cr_team_desc:0 "文化大革命开始后，为了保证对革命运动的领导权，中央文化革命小组成立，他们由毛的妻子、著名演员兼电影艺术家江青领导，成员包括来自上海的艺术评论家张春桥、政治作家姚文元以及上海工人领袖王洪文。他们事实上控制了文化大革命，并以此获得了巨大的政治权力。因此也被称为四人帮。"
 prc_angang_model:0 "推广鞍钢模式"
 prc_angang_model_desc:0 "鞍钢模式，即鞍山钢铁厂实行的管理模式，指工人参与管理，干部参与劳动，被认为是在企业内实行无产阶级民主政治的体现。"
 prc_kmt_back:0 "孙中山的遗产"
 prc_ccp_leave:0 "功成身退"
 prc_hanned:0 "移风易俗"
 prc_hanned_desc:0 "社会主义国家已经建立，但在偏远地区，依然存在许多野蛮落后的生活习俗，例如一夫多妻、殉葬、抢婚等。我国要想进入现代化和社会主义社会，必须根除这些野蛮的文化。"
 prc_taiwan_communist:0 "支持台湾共产党"
 prc_taiwan_communist_desc:0 "台湾左派群众正在抵抗国民党反动派的残暴统治，他们需要我们的帮助。"
 prc_ban_islam:0 "铲除伊斯兰教"
 prc_ban_islam_desc:0 "伊斯兰教教义带有极端主义色彩，鼓吹圣战和宗教极端主义，对我国在新疆、西北和云南地区的管制带来严重威胁，必须采取强硬手段。"
 prc_ban_budhism:0 "铲除藏传佛教"
 prc_ban_budhism_desc:0 "藏传佛教比一般佛教更加野蛮落后，不仅保留了活人献祭和等级制度的野蛮习俗，并且各大寺庙有自己的武装，干涉政治，必须予以铲除。"
 prc_autonomies:0 "民族区域自治制度"
 prc_autonomies_desc:0 "中华人民共和国将是一个所有公民平等的国家，我们积极支持各大民族享有完整的政治权利，为了推动国家统一，我们允许各民族在其人口集中地区设立少数民族自治单位，尊重其自治权力。"
 prc_tib_revo:0 "支持西藏革命党"
 prc_tib_revo_desc:0 "以达赖喇嘛为首的噶厦政教合一政府对西藏进行残酷的统治，引起了西藏精英阶级的不满，以江洛金·索朗杰布先生为代表的西藏革命党正寻求推翻达赖，我们可以给予他们必要的支持。"
 prc_sinkiang:0 "接触新疆三区政府"
 prc_RMB:0 "发行人民币"
 RMB_tip:0 "允许将多余的财政收入转化为政治点数"
 prc_RMB_desc:0 "随着解放作战稳步推进，经济成为我党需要考虑的问题，我们需要将各个解放区的货币进行统一，创立中国人民银行，发行人民币，以购买我们需要的屋子。"
 prc0:0 "整风运动"
 prc0_desc:0 "为了正确地解决党内矛盾，毛泽东制定了“惩前毖后，治病救人”、“既弄清思想，又团结同志”的方针。"
 prc2:0 "社会主义建设总路线"
 prc2_desc:0 "《社会主义建设总路线》即“力争上游、多快好省地建设社会主义”，强调以速度为标准加速进行社会主义建设。其与“大跃进”，人民公社化运动共同构成了共和国50年代末到60年代经济建设的“三面红旗”。"
 prc23:0 "成立新中国"
 prc23_desc:0 "我们即将打败国民党反动派和封建势力，下一步要为建立一个民主的社会主义新中国做准备了！"
 prc1:0 "土地改革"
 prc1_desc:0 "消灭剥削阶级，将土地分发给老百姓，既是解放农村生产力的重要手段，也是我们共产党人义不容辞的责任。"
 prc_new_diplomacy:0 "另起炉灶"
 prc_new_diplomacy_desc:0 "新中国与国民党的旧中国不同，是一个独立自主的民主国家。我们不承认国民政府同西方国家签订的一切屈辱的条约，我们将建立属于我们的独立外交。"
 prc_pro_socialist:0 "社会主义阵营"
 prc_pro_socialist_desc:0 "新中国不仅是一个社会主义的人民民主专政国家，也是社会主义阵营中不可缺少的力量。我们将坚定站在社会主义一方，为对抗资本主义和帝国主义而斗争。"
 prc3:0 "596工程"
 prc3_desc:0 "为了对抗帝国主义的核威慑和核欺诈，我们必须尽快启动核武器开发。"
 prc5:0 "农业合作社"
 prc5_desc:0 "办好农业生产合作社，即可带动互助组大发展。从解决这种供求矛盾出发，就要解决所有制与生产力的矛盾问题。是个体所有制，还是集体所有制？是资本主义所有制，还是社会主义所有制？合作社有低的，土地入股；有高的，土地归公，归合作社之公。"
 prc7:0 "三自一包"
 prc7_desc:0 "三自一包是中国共产党在1960年前后提出的农业政策，即保留自留地、自由市场，实行自负盈亏和包产到户。三自一包旨在提高农民生产的自主性，以反对平均主义和其他大跃进带来的弊端。"
 prc9:0 "包产到户"
 prc9_tip:0 "减少农村地区的粮食消耗"
 prc9_desc:0 "苏联的教训告诉了我们盲目实行公有化和集体化制度的危害，在生产率还没有跟上的时候，高度的土地集体化只会降低土地的利用率，造成严重的资源浪费。将土地按照按户进行包产分配，多劳多得，交够国家的留下自己的，有利于进一步解放生产力，调动农民的积极性。"
 prc4:0 "重建"
 prc4_desc:0 "人民共和国已经建立，但我国仍未从抗战和内战带来的创伤中恢复，一切百废待兴。现在就实行社会主义建设，改变我国的落后面貌！"
 prc10:0 "三大改造"
 prc10_desc:0 "对农业、手工艺和资本主义工商业进行公有化改造，有利于调整国民经济发展，推动我国进入社会主义初级阶段。"
 prc11:0 "五年计划"
 prc11_desc:0 "为了使我们国家尽早实现工业化，必须开始实行我们的第一个五年计划。"
 prc13:0 "长春汽车制造厂"
 prc13_desc:0 "长春是前伪满洲国的中心，留有许多日本人建造的工业设施。我们应该把这些设施利用起来，建造属于我们的工业基地，尤其是汽车生产基地。"
 prc20:0 "包头工业区"
 prc20_desc:0 "包头地区拥有世界上最大的稀土矿区，在这里建设我们的钢铁工业中心是理想的选择。"
 prc19:0 "东北工业区"
 prc19_desc:0 "东北地区矿产和石油资源丰富，工业基础先进，且紧邻苏联，十分有利于大规模的工业发展。"
 prc_sanxian:0 "三线建设"
 prc_sanxian_desc:0 "我国主要工业基地都位于沿海地区，很容易遭到敌人入侵打击。在远离前线的四川、甘肃、贵州等地建立后备工业基地很有必要。"
 prc21:0 "长三角工业区"
 prc21_desc:0 "长三角地区早在国民政府时期就是我国重要的经济中心，在此开展工业建设十分合适。"
 prc22:0 "珠三角工业区"
 prc22_desc:0 "珠三角地区历来是我国对外开放的基地，"
 prc14:0 "大庆油田"
 prc14_desc:0 "我们在东北地区发现了储量丰富的油田，一旦开采成功，我国将彻底摆脱“洋油”时代！"
 prc12:0 "156项重点工程"
 SovietAdviser:0 "苏联顾问"
 prc15:0 "工业化"
 prc15_desc:0 "我国要想强大，要想拥有打败侵略者的资本，必须要实现工业化。"
 prc16:0 "国防建设"
 prc16_desc:0 "帝国主义和反动派无时无刻地谋划颠覆新中国，强化我们的国防力量十分重要！"
 PRC_nuclear_submarine:0 "发展核潜艇"
 PRC_nuclear_submarine_desc:0 "核潜艇是我国核力量和现代海军力量不可缺少的一部分，它可以携带核导弹前往远洋，扩大核威慑范围。"
 prc_south_china_sea:0 "强化南海岛屿控制"
 prc_south_china_sea_desc:0 "南海诸岛自古以来就是我国的领土，而他们具有扼守南海水道的关键作用，但东南亚一些国家对南海岛屿有野心，我们需要加强该地区的控制和防御。"
 prc_nuke_weapons:0 "发展战略武器"
 prc_nuke_weapons_desc:0 "战略导弹是核武器投射的重要载体，只有研发战略导弹，我们的核威慑才能形成力量。"
 prc_space:0 "太空探索"
 focus_tooltip_prc16:0 "解锁使用部分工业企业。"
 prc17:0 "发展空军"
 prc17_desc:0 "刚刚结束战争的中国人民对消费品的需求量很高，我们应该尽力满足人民的基本需求。"
 prc24:0 "政治协商会议"
 prc24_desc:0 "国民党反动派已经被打倒，是时候邀请全国各大民主党派和社会各界人士讨论新中国的政治事宜了。"
 prc25:0 "一党专政"
 prc25_desc:0 "我们伟大的党在抗日战争和解放战争中得到了人民的支持，打败了国民党反动派，证明了我们是代表绝大多数中国人民利益的。应当由中国共产党来领导新中国政府。"
 prc26:0 "多党合作"
 prc26_desc:0 "国民党反动派实行白色恐怖，打压民主党派，最终失去民心。我们的党不应重蹈覆辙，加强与民主党派和无党派人士的合作很有必要。"
 prc27:0 "反右运动"
 prc27_desc:0 "在社会主义建设的同时，我们发现少数反动派、帝国主义余孽、走资派和右派仍然存在，这些不拿枪的敌人仍在对我们的伟大事业造成威胁。为了维护人民民主专政，有必要铲除这些敌对分子。"
 prc28:0 "大鸣大放"
 prc28_desc:0 "在社会主义建设的同时，我们发现少数反动派、帝国主义余孽、走资派和右派仍然存在，这些不拿枪的敌人仍在对我们的伟大事业造成威胁。为了维护人民民主专政，有必要铲除这些敌对分子。"
 prc29:0 "文化大革命"
 prc29_desc:0 "毛主席指出，我们的党内出现了某些试图走资本主义道路的敌对分子，他们试图颠覆社会主义的领导地位。我们必须通过自下而上的人民革命，将走资派从党内清除出去！"
 prc30:0 "破四旧"
 prc30_desc:0 "在社会主义国家中，旧思想、旧文化、旧风俗、旧习惯是具有十分恶劣危害的封建残余。必须将他们全部消灭，才能确保社会主义革命的思想胜利！"
 prc31:0 "打倒当权派"
 prc31_desc:0 "走资派势力正在党内蔓延，必须开展全面的、轰轰烈烈的斗私批修运动，将他们抓出来公开批判，才能维护党的革命性！"
 prc32:0 "五一七工程"
 prc32_desc:0 "五一七工程是文革后期，林彪策划的取代毛泽东夺取政权的计划，进入70年代初期，林彪与毛泽东的矛盾恶化，为了提前接班，林决定武力夺取政权。"
 focus_tooltip_prc32:0 "林彪将夺取权力。"
 prc33:0 "支持革命造反"
 prc33_desc:0 "随着造反夺权风暴席卷上海，原有的党委官僚被打倒，建立了新的革命委员会。这一经验应该向全国推广，将全国的政权都掌握在工人阶级造反革命的手中，实现全国山河一片红！"
 focus_tooltip_prc33:0 "可以在其他地区成立革命委员会。成立革命委员会的地区将在未来的政治斗争中支持“四人帮”。"
 WangHongWen:0 "上海革命委员会已建立"
 prc34:0 "输出革命"
 prc34_desc:0 "东风必定压倒西风！美帝国主义和苏联修正主义已经遭到全世界热爱和平的革命人民批判，我们将支持世界人民反帝反修斗争！"
 prc_electro_menufactrue:0 "发展高新制造业"
 prc_electro_menufactrue_desc:0 "革命不止要支持政治和社会革命，而且要支持技术革命，旧中国已经在发展落后中吃了大亏，新中国将大力支持技术发展，尤其是电子技术、计算机技术和航天技术的发展。"
 PRC_southeastasia:0 "支持东南亚革命"
 PRC_southeastasia_desc:0 "从菲律宾的群岛、马来亚的丛林，到中南半岛的山地丘陵，到处都是反对帝国主义、封建主义腐朽统治的革命武装，中国人民已经取得了革命战争的胜利，现在是时候支持亚洲人民的伟大斗争了。"
 PRC_students_tu_rural:0 "知青下乡"
 PRC_students_tu_rural_desc:0 "知识青年到农村去，接受贫下中农的再教育。让知识分子前往农村，这一是为了锻炼知识青年，也能他们参与到农村建设工作。"
 students_to_rural_modifiers_cities:0 "知青下乡
 students_to_rural_modifiers_rural:0 "知青下乡"
 pla_navy_focus:0 "建设人民海军"
 pla_navy_focus_desc:0 "中国人民要站起来，驱逐帝国主义，就必须改变清末以来“有海无防”的局面。结束“西方在海岸上架起大炮”的时代不是一句空话，而是我们迫在眉睫的国防问题。"
 prc_nuclear_submarine:0 "中国核潜艇"
 prc_nuclear_submarine_desc:0 "在中国还没有足够的工业和经济力量长期维持航空母舰等大型舰艇的情况下，建设一支小而精的核潜艇编队就成了必然选择。通过掌握核武器之后更进一步的战略威慑力量，我们将有能力进一步威慑和驱逐英美帝国主义部署在太平洋和南洋的殖民侵略力量。"
 prc36:0 "收回香港澳门"
 prc36_desc:0 "香港、澳门地区反对帝国主义殖民者的左派工人运动正在如火如荼地进行，我们应当坚决支持港澳同胞的正义斗争。"
 prc35:0 "支持日本革命"
 prc35_desc:0 "左派运动在日本风起云涌，日本广大人民群众对自民党政权的不满即将发展为革命斗争，我们应当予以适当支持。"
 prc37:0 "支持南朝鲜革命"
 prc37_desc:0 "南朝鲜军政府倒行逆施，不得人心，民主运动不断兴起，我们应当支持南朝鲜人民的民主抗争。"
 prc38:0 "亚洲人民革命统一战线"
 prc38_desc:0 "革命思想要在全世界广泛地传播开来。这样的传播必然会和反动的美帝国主义与投降的苏联修正主义产生冲突。但世界人民，尤其是处于苦难中的世界无产阶级会了解到什么是真正的革命思想，他们会为自己和这个时代找到出路。我们永远坚定地信任革命群众。"
 prc39:0 "解放思想"
 prc39_desc:0 "文化大革命时期的个人崇拜和以政治斗争为纲的路线严重影响的党作出重要决策，必须剔除这些错误理论，将实践作为检验真理的唯一标准。"
 focus_tooltip_prc39:0 "可以让陈云、胡耀邦、习仲勋、万历等人加入内阁"
 prc40:0 "对外开放"
 prc40_desc:0 "中国在历史上对世界有过贡献，但是长期停滞，发展很慢。现在是我们向世界先进国家学习的时候了。你们问我们实行开放政策是否同过去的传统相违背。我们的作法是，好的传统必须保留，但要根据新的情况来确定新的政策。"
 focus_tooltip_prc40:0 "允许使用工业企业北方工业"
 prc41:0 "四个现代化"
 prc41_desc:0 "由于文化大革命的破坏，我们的现代化建设进程受到了严重影响，我国与西方国家的差距拉大了。为了尽快补足这些差距，我们需要加快国防、工业、农业和科学技术现代化建设，"
 prc_electro:0 "发展电子产业"
 prc_electro_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一。随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。"
 prc43:0 "83工程"
 prc43_desc:0 "大庆油田从1966年起，年产量达到1066.89万吨以后，探明的石油资源并未全面开发。现在我们国内的工业建设发展到了一个关键的阶段，是时候启用东北三大油田的后备资源，全面增加燃油产量以应对内外需求的增加。"
 prc42:0 "社会主义市场经济"
 prc42_desc:0 "中国的社会主义道路与苏联不完全一样，一开始就有区别。市场经济不能说只是资本主义的。市场经济，在封建社会时期就有了萌芽。社会主义也可以搞市场经济。同样地，学习资本主义国家的某些好东西，包括经营管理方法，也不等于实行资本主义。这是社会主义利用这种方法来发展社会生产力。"
 prc46:0 "另起炉灶"
 prc46_desc:0 "新中国不承认国民政府与外国签订的一切条约，我们将建立全新的外交关系。"
 prc47:0 "双边外交"
 prc47_desc:0 "中国的对外政策是独立自主的，是真正的不结盟。中国不打美国牌，也不打苏联牌，中国也不允许别人打中国牌。中国对外政策的目标是争取世界和平。在争取和平的前提下，一心一意搞现代化建设，发展自己的国家，建设具有中国特色的社会主义。"
 prc49:0 "亲第三世界"
 prc49_desc:0 "中国的对外政策，主要是两句话。一句话是反对霸权主义，维护世界和平。另一句话是“中国永远属于第三世界”——中国现在属于第三世界，将来发展富强起来，仍然属于第三世界。中国和所有第三世界国家的命运是共同的。中国永远不会称霸，永远不会欺负别人，永远站在第三世界一边。"
 prc50:0 "中印关系"
 prc50_desc:0 "中国与印度同为新型的独立民族国家，应该积极改善两国关系以支持第三世界的崛起。"
 prc52:0 "收回藏南"
 prc52_desc:0 "藏南地区被英帝国主义占有，印度独立后则被印度控制，我们必须取回失去的土地，即使不惜使用武力。"
 prc53:0 "和平共处五项原则"
 prc53_desc:0 "和平共处五项原则是互相尊重主权和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处。许多国际性文件都采用了和平共处五项原则的提法。五项原则作为国与国之间关系的准则，已在世界上得到广泛的承认和使用。"
 prc51:0 "中法建交"
 prc51_desc:0 "夏尔·戴高乐总统领导下的法国正在寻求与社会主义国家建立友好关系，与法国建交是我们打破帝国主义外交封锁的一个突破口。"
 PRC_FRA_raltion:0 "中法蜜月期"
 prc48:0 "亲社会主义"
 prc48_desc:0 "我们都是社会主义国家，并紧密地团结在一起。在莫斯科会议期间，我们制定了一个统一的纲领。在该统一纲领的基础上我们工作得比较轻松。"
 prc48_tool:0 "签订《中苏友好条约》后，才可以提出收回旅顺"
 prc67:0 "反对苏修"
 prc67_desc:0 "苏联曾经代表着共产主义阵营和全世界的进步力量，但现在苏修政权大搞霸权主义，粗暴干涉中国内政。中国人民不害怕斗争，如果莫斯科认为中国人民发展自己国家的行为是好战行为，团结世界被压迫民族的行为是教条主义，那么我们也不惧怕和他们进行斗争。"
 prc55:0 "与西方的接触"
 prc55_desc:0 "同西方做生意这对我们来说是一件新事物，有一些差错是难免的。外国投资者有这些意见，中方能理解。投资不赚一点钱，那不可能，那谁愿意来？"
 PRC_pro_west:0 "联美反苏"
 prc69:0 "审视外蒙古问题"
 prc69_desc:0 "蒙古人民的政权是在清末北洋时期，蒙古共产主义者独立寻求解放的道路中建立的。其自主性和革命性得到过包括列宁同志在内许多苏共真正的革命者的承认。但在修正主义者统治苏联的当今时代，蒙古人民的政权愈来愈成为莫斯科霸权思想的傀儡。真正的革命者不惧怕将蒙古的真相说出来，真正的革命者更寻求亚洲大陆上一切民族的进一步解放。"
 prc71:0 "与东欧国家合作"
 prc71_desc:0 "中苏交恶之后，苏联完全停止了对我们的军事和技术援助，但是我们可以通过同样与苏联保持距离的东欧社会主义国家合作，获取军事技术。"
 prc70:0 "审视外东北问题"
 prc70_desc:0 "在列宁、斯大林同志的时期，中共就曾与苏联多次协商我们的边界问题。但我们的协商和共识是建立在革命的国际主义的基础上的。现在的苏联已经丧失了国际进步、解放的旗帜。那么我们就有必要在领土问题上重新审视立场，以一切合理的力量遏制修正主义集团的霸权扩张。"
 prc56:0 "中美建交"
 prc56_desc:0 "中美关系正常化和中美建交，翻开了两国关系史上新的一页，将为中国的改革开放提供有利的外部环境。"
 prc64:0 "中日建交"
 prc64_desc:0 "就中国人民的心情来说，是希望同日本人民友好的，日本百分之九十几的人也是愿意中日友好的。如果说中日关系有点问题，那就是中国人民担心日本有很少很少一部分人，其中可能有的是有政治影响的人，存在复活军国主义的倾向。我们只担心这么一点。中国人民也很高兴地看到，日本绝大多数人是反对这种倾向的。"
 prc72:0 "深挖洞，广积粮"
 prc72_desc:0 "苏修帝国主义叫嚣对我们进行“外科手术式打击”，为了应对苏联可能的入侵，我们必须做好万全应对准备。"
 focus_tooltip_prc72:0 "与越南开战以建立亲中政权。"
 prc68:0 "中苏同盟"
 prc68_desc:0 "中华人民共和国中央人民政府和苏维埃社会主义共和国联盟最高苏维埃主席团，希望通过加强中苏之间友好关系和合作的途径......根据联合国的原则和宗旨，加强远东以及全世界的持久和平和普遍安全。——《中苏友好同盟条约（草案）》"
 prc73:0 "加入华约"
 prc73_desc:0 "华沙公约是对帝国主义北约集团、马尼拉协定、太平洋合作等一系列包围打压的反击，是能让社会主义阵营广泛团结起来的组织形式。中国要起到对国际解放和进步的积极作用，在苏联兄弟的帮助下彻底地拜托帝国主义封锁，自然就不能置身其外。"
 PRC_medic_construction:0 "发展医疗卫生"
 prc6:0 "土地公有制"
 prc6_desc:0 "土地问题是中国千年以来的顽疾。通过吸收土地革命战争时期的经验，打土豪，分田地，使农民获得属于自己的土地，不仅可以解放生产力，还能获得广大农民阶级的拥护支持。"
 prc8:0 "人民公社"
 prc8_desc:0 "在大跃进运动中，出现了农业合作社合并为大的“人民公社”的运动，人民公社社员按需分配，集体劳动，有助于调动生产集中化。"
 prc44:0 "恢复高考"
 prc44_desc:0 "我国教育制度和考试制度在文化大革命中被摧毁，几乎处于停摆状态，必须尽快恢复与重整教育。"
 prc45:0 "经济特区"
 economic_zones_modifier:0 "经济特区"
 prc45_desc:0 "广东地方官员前往香港、新加坡等地考察后，在报告中主张模仿“亚洲四小龙”，搞出口制造业。但这一模式并不适合当前中国的经济体制，因此我们建议在部分地区划出经济特区，专门发展出口加工经济。"
 prc54:0 "加入不结盟运动"
 prc54_desc:0 "中国要做国际问题上的“第三角”不仅是众望所归，更是实力使然。如此声望要实际发挥重要的作用，就必然要求我们和第三世界建立的国际组织（不结盟运动）广泛地联合起来。"
 prc57:0 "北京之春"
 prc57_desc:0 "随着文化大革命结束，人民群众对中国未来走怎样的道路陷入了迷茫。北京西单出现了大量讨论这一问题的大字报，主张对共和国现有的体制进行更为民主化、自由化的改革。"
 prc58:0 "四项基本原则"
 prc58_desc:0 "随着改革开放和思想大解放的推行，我国开始出现一种鼓吹实行多党制，鼓吹西方式的民主制度的资产阶级自由化的思潮，这种思潮根本上否定了社会主义，必须进行批判。"
 prc58_tool:0 "部分有关政治改革的决议将无法被使用。"
 prc59:0 "第五个现代化"
 prc59_desc:0 "第五个现代化即政治现代化——民主化，这一概念由中国民运分子魏京生提出，他是西单大字报活动的积极分子。"
 prc60:0 "中欧建交"
 prc60_tooltip:0 "可以通过决议与欧洲国家建交，建交之后可以与对方进行进一步经济与军事合作。"
 prc60_desc:0 "中国经济发展了，对外贸易也会增加。在我们的对外贸易中，欧洲应占相应的份额。双方都应开辟贸易途径，贸易总是一来一往的，中国买欧洲产品，欧洲也要买中国产品。"
 prc61:0 "收回香港谈判"
 prc61_desc:0 "香港问题已经有近一个半世纪的历史，这个问题不解决，在中英两国和两国人民之间总是存在着阴影。这个阴影消除了，我们两国之间的合作和两国人民之间的友好才能前景光明。"
 prc62:0 "海峡三通"
 prc62_desc:0 "随着改革的推进，我们对台湾地区的政策也需要作出调整。战争状态已经结束，我们建议首先实现两岸间的民间往来，以为未来双方的接触做准备。"
 prc63:0 "接纳国民党"
 prc63_desc:0 "我们要实现第五个现代化原则，民主的会议里怎么能没有呼声最大的三民思想呢？孙先生是我们两党共同的国父。在这一基础上国方是长兄。长兄如父，共方在早期受到国党很多的帮助。可以说“无国就无共”。双方之间不是没有友好合作的繁荣时期。最后因为一点理念上的分歧，双方都走了极端。蒋先生搞白色恐怖，共方就反击。这是革命历史上一个很大的悲剧。我们双方都要检讨，要慰藉死去的亡魂，总结错误，然后共同进步。开启中华民族崛起的新阶段。"
 prc74:0 "支持拉美革命"
 prc74_desc:0 "过去拉丁关洲的民族独立运动表现得不是太明确。有时我们在强调民族独立运动时只提亚、非，不提拉丁美洲。现在我们把三者一起提。毛主席的观点是——拉丁美洲的民族独立运动已经发展起来了，还要继续胜利发展下去。"
 prc75:0 "国企改革"
 private_focus_tool:0 "允许通过决议关闭不需要的消费品工厂，以节省维护费和资源"
 prc75_desc:0 "我国高度集中化、党企一提的国有企业在经济体制改革之后开始失去活力，无法应对日益激烈的市场竞争。为了使国企能够应对市场经济带来的冲击，我们将实行国企改革，使企业自主，自负盈亏。"
 prc76:0 "与巴基斯坦关系"
 prc76_desc:0 "巴基斯坦在国际上是南亚、西亚、中亚一系列问题的结点。做好与巴方的交流不仅仅将改变南亚中印关系格局，同时也将让我们在波斯湾、印度洋扩展航行圈和影响力，撬动冷战以来的亚非格局。"
 prc77:0 "招商进口"
 prc77_desc:0 "马克思老早就说了，地租和土地经济是资本原始积累中不可绕开的重要环节。而在最近，二十世纪的日本的维新和崛起，地产经济也起到了富集资本的重要作用。与日本相比，中国是一个陆地的巨富国。我们必然能够通过土地经济让中国市场经济的先行者们极大致富，迈出踏上经济快车道的重要跨步。"
 prc78:0 "四三方案"
 prc78_desc:0 "四三方案是70年代初中国政府实行的一系列从西方国家引进生产技术的政策，主要以轻工业、汽车工业和消费品工业为主。"
 prc79:0 "清理三种人"
 prc79_desc:0 "文化大革命已经结束，但是一些借助文化大革命的混乱得到不该有的提拔和升值的投机分子仍然占据高位，必须将他们清除出党内，才能重整风气与纪律。"
 prc80:0 "严厉打击刑事犯罪活动"
 prc80_desc:0 "严厉打击刑事犯罪活动，简称严打，是80年代初中国政府公安机关发起的一系列打击反对的行动。"
 PRC_rural_medic:0 "赤脚医生"
 PRC_rural_medic_desc:0 "毛主席认为，医疗资源高度集中在城市是不合理的，中国广大的农村地区缺少医疗，卫生问题恶劣，应该派遣医生前往农村，为那里的居民治疗疾病，传授卫生知识，改善健康水平。"
 PRC_rural_medic_tool:0 "城市地区向农村地区辐射的医疗供给增加"
 PRC_rural_cooperation_medic:0 "农村合作医疗制度"
 PRC_rural_cooperation_medic_desc:0 "是中国在70年代在人民公社和合作社基础上"
 prc81:0 "北大仓"
 prc81_desc:0 "经济政策的转向让东北地方的传统重工业发展迅速退潮，城市人口、就业结构一夜剧变。相比之下，东北的乡村则安全的多。那么未来振兴东三省经济的重任就自然而然地落在了他们的黑土地上。"
 prc82:0 "收回外西北故地"
 prc82_desc:0 "如今被苏联控制的图瓦、东部哈萨克和帕米尔高原，在一百年前都是清朝的领土，沙俄通过不平等条约将其霸占，现在我们要将其收回！"
 prc83:0 "中日技术合作"
 prc83_desc:0 "日本政府提出，向中国出售一些先进的生产技术，作为日本侵略战争的补偿，这是一个值得考虑的提议。"
 prc83_tool:0 "允许使用松下、丰田等日本企业"
 prc84:0 "支援反殖民运动"
 prc84_desc:0 "世界革命运动风起云涌，非洲、亚洲、拉丁美洲人民拿起武器，发起了反对帝国主义殖民统治的伟大斗争，现在是中国人民支援世界人民正义斗争的时候了！"
 prc_three_world:0 "三个世界理论"
 prc_three_world_desc:0 "毛主席认为，当今世界的局势，可以把各国分为三个世界，一个是美苏两个超级大国构成的第一世界，二是西欧和日本等发达国家构成的第二世界，三是中国和广大亚非拉国家构成的第三世界。中国政府应当和第三世界国家紧密团结，无论意识形态和政治模式。"
 prc_connect_usa:0 "联帝反修"
 PRC_SOV_conflict:0 "对抗"
 