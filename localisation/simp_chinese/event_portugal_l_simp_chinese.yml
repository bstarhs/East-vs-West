l_simp_chinese:
 por.20.t:0 "萨拉查总理因病停职"
 por.20.a:0 "镇压暴动！"

 por.22.t:0 "里斯本爆发了示威游行！"
 por.22.d:0 "一群上尉今天带着枪和康乃馨花进入里斯本。他们称自己为革命武装委员会，要求结束殖民战争和政治改革。里斯本的一些公民加入了他们，发起了一场大规模的抗议。抗议者要求推翻军事独裁。"
 por.22.a:0 "新国家独裁结束了！"
 por.22.b:0 "对左壬出重拳！"

 por.23.t:0 "葡萄牙内战！"
 por.23.d:0 "里斯本抗议的士兵和公民遭到亲新国家部队的袭击！经过一场激战，左翼部队从里斯本撤退。昨晚，葡萄牙军队的一些师宣布起义，安东尼奥·斯皮诺拉将军是他们的领袖，他宣布推翻萨拉扎政权的战争已经开始！"
 por.23.a:0 "News from Lisbon!"

 por.24.t:0 "康乃馨革命！"
 por.24.d:0 "里斯本消息！昨天，葡萄牙总理马塞洛·何塞·达斯·卡丹奴宣布辞职，标志着新国家体制42年的独裁统治结束。安东尼奥·斯皮诺拉将军和军事委员会掌权。委员会承诺葡萄牙将在未来成为一个民主国家，然后他们将试图与殖民地的叛军谈判。"
 por.24.a:0 "葡萄牙万岁！"