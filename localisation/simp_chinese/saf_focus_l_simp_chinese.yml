l_simp_chinese:
 SAF_develop_infra:0 "基础设施建设"
 SAF_develop_infra_desc:0 "通过修建基础设施，我们将会把南非各个地区相联结起来。"
 SAF_develop_cape:0 "开发开普省"
 SAF_develop_cape_desc:0 "开普敦是南非最早建立定居点的地区，已经得到了不错的发展，当然我们可以进一步开发，使其成为南非的重要沿海经济区。"
 SAF_develop_cape_port:0 "开发开普敦港"
 SAF_develop_cape_port_desc:0 "毗邻好望角的开普敦是重要的天然良港，有重要的经济地位。"
 SAF_develop_elizabeth_port:0 "开发伊丽莎白港"
 SAF_develop_elizabeth_port_desc:0 "东开普的伊丽莎白港将成为我国下一个海运枢纽。"
 SAF_develop_north:0 "开发北开普省"
 SAF_develop_north_desc:0 "北开普省的地下蕴含丰富的钻石矿产，但该地区仍是一片荒漠，现在我们将对其就行开发。"
 
 SAF_develop_natal:0 "开发纳塔尔"
 SAF_develop_natal_desc:0 "纳塔尔是布尔人离开开普以后最早建立政权的地区，我们将进一步开发这里的产业。"
 SAF_natal_railway:0 "约翰内斯堡-德班铁路"
 SAF_natal_railway_desc:0 "铁路可以将货物从南非的其他地区运抵德班港。"
 SAF_develop_durban_port:0 "开发德班港"
 SAF_develop_durban_port_desc:0 "德班港面朝印度洋，是我们与印度、阿拉伯国家和亚洲国家进行贸易的重要枢纽。"
 
 SAF_develop_transvaal:0 "开发德兰士瓦"
 SAF_develop_transvaal_desc:0 "德兰士瓦省是撒哈拉以南非洲最发达的的地区，约翰内斯堡和普利托里亚构成了我国的经济中心。"
 SAF_develop_oranje:0 "开发奥兰治"
 SAF_develop_oranje_desc:0 "奥兰治自由邦肥沃的土地使他成为我国重要的农业中心，我们要进一步扩大奥兰治地区的农业生产。"
 SAF_cape_railway:0 "开普-约翰内斯堡铁路"
 SAF_cape_railway_desc:0 "铁路可以将货物从南非的其他地区运抵开普敦港。"
 
 SAF_united_party:0 "南非联合党政府"
 SAF_united_party_desc:0 "史末资爵士领导下的南非党致力于维护南非在英联邦中的地位，并主张南非在威斯特敏斯特体系下进行政治改革，使南非成为盎格鲁-撒克逊国家中的模范。"
 SAF_expand_anglican:0 "推广英国国教"
 SAF_expand_anglican_desc:0 "英国国教以英国君主为宗教领袖，推广国教可以提高英裔在南非的政治和社会影响力，同时削弱布尔人所信仰的加尔文宗。"
 SAF_expand_wesleyans:0 "推广卫斯理宗"
 SAF_expand_wesleyans_desc:0 "卫斯理宗又称循道宗，由英国神学家约翰·卫斯理创立，该宗派受阿民念主义影响，反对加尔文主义的预选说，主张人人平等，反对种族主义，尤其是种族隔离。"
 SAF_expand_calvinsm:0 "推广加尔文宗"
 SAF_expand_calvinsm_desc:0 "加尔文宗又称长老会，由瑞士宗教改革家约翰·加尔文创立，主张去中心化的长老制度和白人优先得到上帝救赎的预选说。加尔文宗曾是荷兰最重要的教派，在南非也是阿非利卡人的主流宗教。"
 SAF_expand_afrikaans:0 "推广南非荷兰语"
 SAF_expand_afrikaans_desc:0 "随着荷兰裔南非人成为这个国家的主宰，南非荷兰语，或者说阿非利卡语将成为我们的唯一官方语言，不论是有色人种还是英裔，都必须学习我们的语言，才能维护国家的团结。"
 SAF_Voortrekkers:0 "大迁徙的遗产"
 SAF_Voortrekkers_desc:0 "荷兰裔南非人最早在开普定居，荷兰割让开普殖民地给英国后，我们的祖先开始了大迁徙，乘坐牛车来到了南非东部，开垦土地，建设家园，并建立了独立的纳塔尔邦、奥兰治自由邦和德兰士瓦共和国。这段光辉的历史应当为我们的子孙后代所铭记，从而强化荷兰裔南非人的凝聚力和自豪感。"
 SAF_edit_history:0 "修改历史"
 SAF_edit_history_desc:0 "如果你认为非洲的每一片土地都属于黑人，那就错了。荷兰人早在1625年就建立了开普殖民地，而像祖鲁人、茨瓦那人和科萨人这样的班图黑人民族，直到18世纪晚期才迁入南非。基于这一点，我们认为南非毫无疑问属于白人，由白人开拓，由白人建设，由白人拥有。"
 SAF_limit_blakcs:0 "限制黑人人口"
 SAF_limit_blakcs_desc:0 "随着白人人口增多，我国许多工作岗位都不再需要黑人，因此我们可以考虑减少黑人的生育率，进而减少黑人的人口，让我国成为完全的白人国家。"
 SAF_landlaw:0 "土地法案"
 SAF_landlaw_desc:0 "我们要限制黑人的政治和经济地位，就要从限制经济开始。新的土地法案将禁止黑人拥有超过数量的土地，从而确保珍贵的土地资源掌握在白人手中。"
 
 
 SAF_harmonious_focus:0 "调节民族矛盾"
 SAF_harmonious_focus_desc:0 "新南非将成为一个民族平等、和谐、包容的国家，我们反对白人凌驾于有色人种之上，也反对有色人种凌驾于白人之上，我们应当妥善处理和调节各种族之间的关系，从而推动南非走向和平民主。"
 SAF_wipe_whites:0 "清算白人政权残余"
 SAF_wipe_whites_desc:0 "白人统治已经结束，实行独裁统治、血腥镇压和种族隔离的南非国民党政客应当受到审判。"
 SAF_annex_whites:0 "没收白人资产"
 SAF_weaken_boers:0 "削弱布尔人自治权"
 
