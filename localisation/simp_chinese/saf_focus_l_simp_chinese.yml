 SAF_buy_plane:0 "购买战斗机"
 SAF_buy_plane_desc:0 "我们目前没有自行生产战斗机的能力，但我们可以向友好国家购买现成的战斗机来建立我们的空军。"
 SAF_jet_1:0 "发展喷气机"
 SAF_jet_1_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 SAF_jet_2:0 "发展二代战斗机"
 SAF_jet_2_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 SAF_bomber:0 "发展轰炸机"
 SAF_bomber_desc: "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 SAF_transfer:0 "发展运输机"
 SAF_transfer_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 SAF_anti_air:0 "发展防空设备"
 SAF_airbase_1:0 "东部空军基地"
 SAF_airbase_1_desc:0 "我们需要机场和基础设施来承载我们的空军。"
 SAF_airbase_2:0 "扩大空军基地"
 SAF_airbase_2_desc:0 "我国的空军力量不断壮大，对空军设施的要求也越来越高。"
 
 SAF_light_ships:0 "发展轻型舰艇"
 SAF_light_ships_desc:0 "我们的海军刚刚起步，至少需要一些护卫舰和驱逐舰来保护我们的领海。"
 SAF_medium_ships:0 "发展中型舰艇"
 SAF_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 SAF_heavy_ships:0 "发展大型舰艇"
 SAF_heavy_ships_desc:0 "我们的海军已经成长壮大，我们需要发展可以搭载更多设备和飞机的大型舰艇来强化作战能力。"
 SAF_buy_submarines:0 "购买潜艇"
 SAF_buy_submarines_desc:0 "我们目前还没有建造潜艇的能力，但我们可以向其他国家购买退役的潜艇。"
 SAF_submarines:0 "发展潜艇"
 SAF_submarines_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 SAF_naval_base_east:0 "东部海军基地"
 SAF_naval_base_east_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 SAF_naval_base_west:0 "西部海军基地"
 SAF_naval_base_west_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 SAF_buy_ship:0 "购买军舰"
 SAF_buy_ship_desc:0 "我们目前还没有建造舰船的能力，但我们可以向其他国家购买退役的舰艇。"
 SAF_marines_focus:0 "发展两栖部队"
 SAF_buy_brit_ships:0 "接受英国军舰"
 SAF_brit_sailor:0 "招募英国水手"
 SAF_buy_dutch_ships:0 "购买荷兰军舰"
 SAF_dutch_sailor:0 "招募荷兰水手"
 
 SAF_armors:0 "发展装甲部队"
 SAF_armors_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 SAF_vehicles:0 "机动性装甲车辆"
 SAF_mechanized:0 "发展机械化部队"
 SAF_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 SAF_airborn:0 "发展空降部队"
 SAF_airborn_desc:0 "飞机航程和载荷的发展开辟了许多可能性。运输机可以在敌人战线的大后方投下一整个师的部队，在那里他们可以造成严重破坏。"
 SAF_military_system:0 "完善军事体制"
 SAF_military_system_desc:0 "通过设立完善的军事体制、军官制度、指挥系统和军事学院，我们才能把落后的民兵组织建设成为一支有战斗力的职业军队。"
 SAF_develop_weapons:0 "成立装备发展部"
 SAF_develop_weapons_desc:0 "从步兵的头盔和背心，再到坦克上的火控系统和动力系统，先进的作战装备往往主导着战场。"
 
 SAF_contact_communism:0 "与南非共产党接触"
 SAF_communism_gov:0 "社会主义左派政府"
 SAF_communism_nation:0 "南非人民共和国"
 SAF_soviet_mode:0 "苏联模式"
 SAF_soviet_mode_desc:0 "在斯大林模式的指导下，苏联人民不仅在短短十年内把俄罗斯变成了工业强国，而且还战胜了法西斯。我们要摆脱贫困，进入工业化和现代化，就必须学习苏联人民的先进经验。"
 SAF_supress:0 "镇压反革命"
 SAF_supress_desc:0 "一些敌视社会主义新伊朗的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。"
 SAF_collective:0 "农业集体化"
 SAF_collective_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 SAF_anti_muslim:0 "镇压宗教"
 SAF_anti_muslim_desc:0 "宗教是精神的鸦片，他们除了代表封建阶级压迫人民一无是处，只有镇压宗教，才能推动人民接受社会主义意识形态。"
 SAF_nkvd:0 "内务委员会"
 SAF_nkvd_desc:0 "我们要建立专门的机构，调查、监视、逮捕反革命分子和帝国主义间谍。"
 SAF_pioneers:0 "少年先锋队"
 SAF_pioneers_desc:0 "少年先锋队是共产主义事业的接班人，培养少先队就是培养党和社会主义的未来。"
 SAF_worship:0 "党的权威"
 SAF_worship_desc:0 "我国当前政党众多，但大都代表着资本家、政治投机者甚至敌对分子的利益。我们要建设一个无产阶级所有、代表劳动人民的人民民主国家，共产党就必须领导一切。"
 
 SAF_soviet_trade:0 "与苏联开展贸易"
 SAF_comecon:0 "经济互助委员会"
 
 SAF_people_army:0 "人民军队"
 SAF_nationalized:0 "企业国有化"
 SAF_plan:0 "五年计划"
 SAF_plan_desc:0 "我们将开始实行第一个五年计划，以快速改善我国的落后局面。"
 
 SAF_output_revolution:0 "输出革命"
 SAF_output_revolution_desc:0 "英美帝国主义和殖民主义已经遭到全世界热爱和平的革命人民批判，我们将支持世界人民反帝斗争！"
