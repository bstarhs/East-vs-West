l_simp_chinese:
 unknown:0 "未知"
 unknown_desc:0 ""
 nile:0 "河岸"
 nile_desc:0 "泛滥平原是河流周围非常容易受到洪水(通常为季节性洪水)影响的地区,但其也可以用于指代那些被单次洪水意外影响的广大低洼地区。洪水从上游带来的沉积物堆积到了此类地区中,无意间提高了土壤质量,特别适合栽种农作物。美索不达米亚、古埃及与古印度等早期城市文明均出现在拥有泛滥平原的河谷区域。"
 ocean:0 "海洋"
 ocean_desc:0 "在历史的多数时间中,人类都十分惧怕深不见底的汪洋,只有波利尼西亚人、维京人和葡萄牙人等民族有胆量勇敢面对它。需要高级的航海术才能征服波涛汹涌的大海，现今人类只需数小时便能横跨大洋。"
 lakes:0 "湖泊"
 lakes_desc:0 "沿海水域吸引了内陆的早期文明的探索,人们在那里发现了各种各样的财富和食物,因此几千年来,人们不需要(或不畏惧)进行远离大陆的航行。"
 forest:0 "森林"
 forest_desc:0 "树林的馈赠对众多部落的生存极为重要,它能提供各种各样超乎想象的木材和动植物资源。可惜的是,文明总是过度砍伐,以建造农场房屋、道路和村庄…随后出现了贪婪的企业,梦想着通过毛皮、原木和金属发家致富."
 hills:0 "丘陵"
 hills_desc:0 "保护所有财富的一种方式是在山顶上部署军队以进行攻击,(子弹和炸弹出现前)占据高地是一项不错的策略。因此,山上最终布满了文明的要塞和堡垒,这也是进行游击战争的好地方。"
 mountain:0 "山地"
 mountain_desc:0 "就历史而言,山脉是行进中的恼人障碍,除了作为障碍物抵抗入侵外,对文明而言好处甚微…因此,它们只对摄影师、隐士和登山者有吸引力。"
 plains:0 "平原"
 plains_desc:0 "平原就是一个大型的平坦地貌,土壤不如草原肥沃,但也没有沙漠那股干燥。因此,在拖拉机出现之前,平原非常适合大型动物群在此生活,也为人类文明进行农业生产提供了土地."
 urban:0 "城市"
 urban_desc:0 "城市是一个地区人口、建筑和基础设施最密集的地方，也是一个地区的政治、经济和文化中心，城市往往位于交通要道上，人们再次往来、贸易，定居，最后形成了城市。世界上各个城市的规模各不尽相同，有纽约、伦敦、巴黎、东京这样的超大型都市，也有位于美国西部大平原或撒哈拉沙漠的城镇，但无论如何，城市必定是一个地区内最重要的居民点，经济运行在这里集中，而战争时这里也将是争夺的目标。"
 oasis:0 "绿洲"
 oasis_desc:0 "绿洲真是个传奇之物,它能提供干净丰富的水源,对在沙漠中徘徊的人至关重要。传说中总会描绘一些贫瘠又毫无生气的土地上的奇妙边区村落…以及为控制他们而进行的战争"
 jungle:0 "丛林"
 jungle_desc:0 "雨林极具生物多样性,因此难以通过,但却是科学和医学知识的宝库。亚洲、非洲和南美洲的雨林一直未人类提供着各类财富与食物,并为现代文明提供昂贵的药材."
 marsh:0 "沼泽"
 marsh_desc:0 "被草本植物而不是木本植物覆盖的淡水湿地一般岀现在缓慢流动的河流旁或湖泊浅滩上。这里有令人难以置信的各种珍贵资源,建立在沼泽和湿地上的城镇都发展成了伟大城市:圣彼得堡、新奥尔良、以及建在潘塔纳尔湿地上的巴西城市。"
 desert:0 "沙漠"
 desert_desc:0 "一般来说,沙漠是亳无用处的,那里只属于已适应在那里生存的生物和人。世界上真正的沙漠一一撒哈拉沙漠、戈壁、莫哈维沙漠、维多利亚大沙漠,等等一一从历史纪元开始就一直在吞没人和文明。"
 peddy:0 "水田"
 peddy_desc:0 "对世界上超过一半的人口来说(大多生活在亚洲),米饭是他们的主食。在中国神话里面,神农是第一个种植水稻的人。大米对避免饥荒至关重要;世界大米产量已从1960年的大约2亿吨稳步增长到2000年的6亿吨。"
 mongol:0 "草原"
 mongol_desc:0 "广泛分布在亚欧大陆上的草原成为了游牧民族的家园，千百年来，许多民族在蒙古、西伯利亚、中亚、南俄罗斯和中国北部的草原上进行游牧生活。亚洲草原的土壤并不足以进行农业生产，但其上长出的牧草以足以供牲畜食用。"
