l_simp_chinese:
 afg.5.t:0 "阿富汗政变！"
 afg.5.d:0 "昨天，前阿富汗总理、国王塔希尔的叔叔穆罕默德·达乌德在军队的支持下，在国王访问瑞士期间夺取了政权！达乌德声称，这是一场共和革命，统治阿富汗三百多年的杜拉尼王朝被推翻，他本人就是这个新国家的总统。目前，新政权的准备工作正在进行，有人认为苏联在幕后推动了政变。"
 afg.5.a:0 "让我们看看接下来会发生什么。"

 afg.10.t:0 "阿富汗政变！"
 afg.10.d:0 "支持阿富汗人民民主党的大批部队用坦克包围了喀布尔总统府，宣布推翻达乌德总统的革命已经开始！正在举行会议的达乌德总统下令平息叛乱，但许多政府官员仍感到恐慌。"
 afg.10.a:0 "打到达乌德！阿富汗属于人民！"
 afg.10.b:0 "消灭共产匪徒！"

 afg.13.t:0 "塔拉基的死亡"
 afg.13.d:0 "阿富汗人民民主党总书记、阿富汗民主共和国总统穆罕默德·塔拉基不久前去世。他的死因将不予披露。他的副手哈菲祖拉·阿明接任总书记。尽管大家都知道阿明已经获得了塔拉基的实际权力，但阿明杀害塔拉基的传闻仍在继续传播。"
 afg.13.a:0 "阿富汗局势恶化了。"

 afg.18.t:0 "来自莫斯科的警告"
 afg.18.d:0 "来自莫斯科的消息显示，克里姆林宫对阿明的政策非常不满。阿明政府致力于内部斗争，但其镇压伊斯兰势力的能力非常低，其高压政策正在激发更多抵抗，严重危及阿富汗社会主义阵营的利益。政治局的提议是邀请流亡的苏联旗帜派领导人巴布拉克·卡尔迈勒回到喀布尔，接管阿明的权力"
 afg.18.a:0 "这不可能！"
 afg.18.b:0 "我们没有选择。"

 afg.19.t:0 "阿富汗拒绝！"
 afg.19.d:0 "喀布尔拒绝了我们邀请卡尔迈勒重新掌权的提议。显然，阿明政权认为内部权力斗争高于社会主义革命！政治局建议我们用特殊手段推翻阿明，协助卡尔迈勒和旗帜派控制阿富汗，保卫阿富汗人民政权。"
 afg.19.a:0 "准备作战！"
 afg.19.b:0 "我们不得不选择妥协。"

 afg.20.t:0 "苏联军队进入阿富汗！"
 afg.20.d:0 "来自喀布尔的突发消息！苏联军队于今天早上突然越境进入阿富汗境内，原先驻扎在阿富汗的苏联军事教官也采取行动，控制了阿富汗的各个军事基地，一场大规模的军事入侵已经开始。克里姆林宫发布消息，宣称此次军事行动旨在拯救阿富汗的社会主义政权，他们指责阿富汗共产党领导人哈非祖拉·阿明软弱无能，必须更换新的领袖。而阿明则谴责苏军的侵略行为，准备纠集忠于自己的部队进行抵抗"
 afg.20.a:0 "确定。"

 afg.21.t:0 "苏联军队占领喀布尔！"
 afg.21.d:0 "在苏联红军的进攻下，喀布尔驻军完全倒塌，阿明和他的同事在总统府前被打死。在稳定了对首都的控制之后，巴布拉克·卡尔迈勒在苏联的保护下返回了阿富汗。"
 afg.21.a:0 "确定。"

 afg.23.t:0 "穆斯林叛乱！"
 afg.23.d:0 "一支大规模的穆斯林武装在山区发动了叛乱！"
 afg.23.a:0 "该死的野蛮人！"

 afg.24.t:0 "阿富汗需要支援"
 afg.24.d:0 "一支大规模的穆斯林武装在阿富汗山区发动叛乱，阿富汗政府寻求我们的协助！"
 afg.24.a:0 "我们将提供必要的支援。"
 afg.24.b:0 "我们无能为力"

 afg.25.t:0 "阿富汗伊斯兰党攻入喀布尔！"
 afg.25.d:0 "来自喀布尔的消息！在失去苏联的支持后，阿富汗共产党政府的军队一败涂地，经过交战，阿富汗伊斯兰党的武装力量进入了首都喀布尔。伊斯兰党武装分子逮捕了大量共产党官员，并宣布将实行伊斯兰统治。"
 afg.25.a:0 "但是战争也许没有结束。"

 afg.26.t:0 "穆斯林叛乱!"
 afg.26.d:0 "一些伊斯兰极端分子发动武装叛乱！他们袭击了军火库，夺取了枪支，宣告了一场反对我们政府的战争已经开始！"
 afg.26.a:0 "该死的野蛮人！"

 afg.27.t:0 "阿富汗爆发政变！"
 afg.27.d:0 "阿富汗首都喀布尔爆发政变！人民民主党之间的内斗酿成流血冲突，终于总书记穆罕默德·塔拉基和总理哈菲祖拉·阿明之间的武装部队爆发了激烈战斗。最终阿明取得了上风，控制了首都。塔拉基生死不明，而阿明宣布自己接任总书记的职位。"
 afg.27.a:0 "阿富汗动荡不安。"
 
 afg.110.t:0 "[FROM.GetName]希望与阿富汗改善关系"
 
 afg.111.t:0 "[FROM.GetName]宣布支持阿富汗的反政府势力"
 


