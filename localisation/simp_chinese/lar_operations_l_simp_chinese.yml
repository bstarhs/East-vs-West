l_simp_chinese:
 operation_boost_resistance:0 "加强反抗势力"
 operation_boost_resistance_desc:0 "§L在敌占区的游击队员迫切需要支援以继续战斗。他们正限制着大量的敌军，这将是一个很好的投资。§!"
 operation_boost_upset:0 "制造群众不安"
 operation_boost_upset_desc:0 "§L通过散播谣言、制造恐慌，让敌国的群众处于不安当中。§!"
 operation_capture_cipher:0 "截取密码"
 operation_capture_cipher_desc:0 "§L截取敌人的密码本，或通过其他手段获取它，将给予我们的密码破译员决定性的优势。§!"
 
 infiltration_paradrop:0 "伞降渗透"
 infiltration_paradrop_desc:0 "特务将通过降落伞降落到指定区域。在夜间低空飞行将有助避免敌军战斗机的干扰。"
 infiltration_submarine:0 "潜艇部署"
 infiltration_submarine_desc:0 "特务将通过潜艇到达沿岸地带。我们已经侦察了可能的登陆地点及敌军巡逻时间以防被发现。"
 infiltration_border:0 "中立边境渗透"
 infiltration_border_desc:0 "特务会通过中立国的边境渗透，在该地域的边境防卫将沒有那么警惕，我们已经确认了一些边境巡逻非常薄弱的地区。"
 infiltration_diplomatic:0 "外交护照"
 infiltration_diplomatic_desc:0 "特务将使用外交护照进入目标国家并四处遊走。敌方反情报人员的跟踪已是预料之中，但是这可以通过充足的训练来克服。"
 
 propaganda_roadio_broachast:0 "地下电台"
 propaganda_roadio_broachast_desc:0 "特工和线人将通过地下电台传播反对当局的信息。"
 propaganda_roadio_broachast_outcome:0 "特工和线人将通过地下电台传播反对当局的信息。"
 
 propaganda_secret_published:0 "秘密出版物"
 propaganda_secret_published_desc:0 "特工和线人将印刷和散步不利于当局的宣传刊物。"
 
 propaganda_brochast:0 "秘密广播"
 propaganda_brochast_desc:0 "特工和线人将通过广播播放不利于当局的宣传信息。"
 propaganda_television:0 "电视新闻"
 propaganda_television_desc:0 "特工和线人将渗透进入该国的电视台，通过电视播放不利于当局的宣传信息。"
 propaganda_rumor:0 "谣言"
 propaganda_rumor_desc:0 "当群众对自己的生活和政治局势产生担忧使，任何难以辨别的流言都会动摇他们，而当相信谣言的群众达到一定规模时，就会影响整个社会。"
 
 upset_fake_banknote:0 "投放假币"
 upset_fake_banknote_desc:0 "特工将会把提前印刷的大量伪钞投放进改国的市场，从而打击他们的市场金融秩序。"
 
 resistance_support_arms_depots:0 "建立補给储备"
 resistance_support_arms_depots_desc:0 "我们的特务将储备一定数量的爆炸品和其他装备，以备在反抗势力足够强大的时候发动起义。"
 resistance_support_distribute_weapons:0 "发放武器"
 resistance_support_distribute_weapons_desc:0 "我们的特务将组织并协调一系列的武器投放。这些武器将被移交至受信任的本地反抗势力成员。"
 resistance_support_organize_training:0 "组织训练"
 resistance_support_organize_training_desc:0 "我们的特务将开设训练逃跑，回避以及基本野外求生的课程。最出色的学生将会前进到基本枪械训练。"
 resistance_support_coordinate_groups:0 "协调反抗势力"
 resistance_support_coordinate_groups_desc:0 "我们的特务将到各处协调反抗势力组织。这将需要一点努力来让政治分裂的团体联合起来。"
 
 exfiltration_air_pickup:0 "空中撤离"
 exfiltration_air_pickup_desc:0 "我们的一架飞机将在夜间越过敌方领土，找到标记地点，降落并接走我们的特务。"
 exfiltration_submarine_pickup:0 "潜艇撤离"
 exfiltration_submarine_pickup_desc:0 "我们的一艘潜艇将停泊在一个指定的沿岸撤离地点，时机至关重要，因为该区域处于敌人海上巡逻的范围內。"
 exfiltration_border:0 "边境徒步撤离"
 exfiltration_border_desc:0 "我们的特务会将在夜间通过偏远的地点在边境撤离。当地的导遊将待命协助并指引特务在这个危险的区域撤离。"
 exfiltration_go_to_ground:0 "混入人群"
 exfiltration_go_to_ground_desc:0 "我们的特务将低调行事以混入人群，直到他们准备执行下一次任务。如果撤离的机会出现，他们会抓紧的。"
 
 operation_make_resistance_contacts:0 "联系反抗势力"
 operation_make_resistance_contacts_desc:0 "§L如果我们有方法与敌后的游击队进行联系和协调，我们对他们的帮助将更为有效。§!"
 
 capture_cyphers_bribe:0 "贿赂士兵"
 capture_cyphers_bribe_desc:1 "我们有一个线人且我们会为其提供需要的资金以窃取密码本并交到我们的特务手上。"
 capture_cyphers_raid:0 "渗透突击"
 capture_cyphers_raid_desc:0 "我们的特务会侦查该地区并通知特战单位降落并夺取密码本与加密设备。同时也将尝试俘虜一、兩个加密员以供审讯。"
 capture_cyphers_seduction:0 "诱惑"
 capture_cyphers_seduction_desc:0 "我们的特务会接触有权取得密码的人，并用魅力 - 或其他手段 - 来获取副本。"
 capture_cyphers_reverse_engineer:0 "逆向工程"
 capture_cyphers_reverse_engineer_desc:0 "该国主要使用的加密机的简化版已经在市场上出售。我们将会合法取得一份并将其用于逆向工程以制造解密机。"
 
 resistance_contacts_radio_circuits:0 "建立通讯基地"
 resistance_contacts_radio_circuits_desc:0 "组织将会分配无线电给抵抗组织成员，并教导他们基礎无线电通讯协定，并特別著眼于避免被敌方无线电定位。"
 resistance_support_pidgeons:0 "分发信鸽"
 resistance_support_pidgeons_desc:0 "组织将会分发经过训练的信鸽给与抵抗组织有关的不同饲養者。牠们会用来将资讯传送回我方。"
 resistance_contacts_briefings:0 "战略简报"
 resistance_contacts_briefings_desc:0 "我们的特务将会向各種抵抗组织的领导者简报即将进行的行动，以协调支援。"
 
 capture_cyphers_smuggle:0 "传递密码"
 capture_cyphers_smuggle_desc:0 "我们的一位双面间諜将会要求转移一份新的、正在使用的密码的副本。与其他服务的合作正在进行中，以确保传递不会被中断。"
 
 operation_steal_tech_airforce:1 "偷窃航空工业蓝图"
 operation_steal_tech_airforce_desc:0 "§L我们收到了数份令人担忧的报告指出，敌人已经在飞机设計的各个方面都超越了我们。若此事为真，我们可以尝试深入了解他们领先了我们多少，并尝试利用这些发现来增强我们的研究。§!"
 operation_infiltrate_armed_forces_navy:0 "渗透海军"
 operation_infiltrate_armed_forces_navy_desc:0 "§L尽管在[From.GetAdjective]船舰上情同手足的船员们很难被渗透，但他们在国內的后勤人员则是另一回事。获取內部的线人将会提供我们珍贵的资讯，同时也能支撐以后更加复杂的行动。§!"
 operation_infiltrate_civilian:0 "渗透行政系统"
 operation_infiltrate_civilian_desc:0 "§L[From.GetAdjective]政府存在著无数的漏洞，我们或许可以渗透一个特务到裡面去。如此一来将会让我们能一瞥[From.GetNameDef]的內部运作，同时我们以后有机会利用这位特务来发起对付[From.GetNameDef]的行动。§!"
 operation_infiltrate_armed_forces_airforce:0 "渗透空军"
 operation_infiltrate_armed_forces_airforce_desc:0 "§L[From.getAdjective]空军是[From.GetAdjective]武装部队中最年輕的一个分支。因此，其人员的背景可說是龍蛇雜处。我们可以利用这点来获得內部的线人。§!"
 operation_infiltrate_armed_forces_army:0 "渗透陆军"
 operation_infiltrate_armed_forces_army_desc:0 "§L[From.GetAdjective]陆军中有许多人可以被转而效忠我方，这将提供我们宝贵的资讯并支持往后的行动。§!"
 operation_steal_tech_army:1 "偷窃军事蓝图"
 operation_steal_tech_army_desc:0 "§L我们的情报分析人员相信，[From.GetNameDef]已经在地面战爭和军事工程领域有了龐大的进展。透过一次深入的调查，配合一些直接的手段，或许能为我方的研究计划提供一些有用的见解。§!"
 operation_steal_tech_civilian:1 "偷窃工业蓝图"
 operation_steal_tech_civilian_desc:0 "§L似乎我方的工业在许多领域都落后于[From.GetNameDef]。透过一点点狡猾的詭計，或许我们可以大大縮短双方的落差。§!"
 operation_steal_tech_navy:1 "偷窃海军蓝图"
 operation_steal_tech_navy_desc:0 "§L报告顯示，[From.GetAdjective]的海军工程学已经在许多领域超越了我方。我们或许可以試著取得这些科技，并进行逆向工程。§!"
 
 infiltrate_military_bribe:0 "提供賄絡"
 infiltrate_military_bribe_desc:1 "我们的特务会尋找有经濟困难的人，并向其提供足够的金錢以为我们提供支援。资金将從国庫支出。"
 infiltrate_military_seduction:0 "使用魅惑"
 infiltrate_military_seduction_desc:1 "我们的特务会和其內部的人员发展出親密的关係，從而获得资讯并加以利用。"
 infiltrate_military_turned_pow:0 "策反战俘"
 infiltrate_military_turned_pow_desc:0 "我们将辨識出可用的战俘，将他变節至我方后再行遣返。他毫无疑問会被对方審問，但只要有合適的训练，他就能克服这个問題。"
 infiltrate_military_ideological_supporter:0 "联絡意識形態支持者"
 infiltrate_military_ideological_supporter_desc:1 "我们将使用外交管道找出并連絡一位[From.GetAdjective]官员，一位与其政府不同调的官员，这樣我们就能鼓勵他为我们工作。"
 
 steal_blueprints_bribe:0 "提供賄絡"
 steal_blueprints_bribe_desc:0 "我们的特务将提供一大筆錢给一个參与过此計划的工程師。"
 steal_blueprints_seduction:0 "使用魅惑"
 steal_blueprints_seduction_desc:0 "我们的特务会接近參与这个計划的人，对其展开魅惑以获得更多情报。尽管我们不能期望任何人願意在短时间內交出整套蓝图，但人们对枕边細語總是疏于防备的。"
 steal_blueprints_infiltrate_naval_design_office:0 "渗透海军设計部門"
 steal_blueprints_infiltrate_naval_design_office_desc:0 "我们的特务将扮演一个海军建设的小供應商中的小職员，從而透过此一職位获得可用计划的複本。"
 steal_blueprints_steal_prototype:0 "窃取原型"
 steal_blueprints_steal_prototype_desc:0 "在受过基本的飞行训练后，在我方飞行測試员的陪同下，我们的特务将能够接触到原型机，并将它飞回我们的战线內。我们会安排战斗机护航，以确保原型机安然无恙的回到我们这裡。"
 steal_blueprints_middle_manager:0 "渗透中间管理層"
 steal_blueprints_middle_manager_desc:0 "我们的特务会利用假造的博士履歷，以受聘于一个大公司的中间管理層。透过此一職位，他们應该能提供有关此公司和工业整体的资讯。"
 
 lar_communist_uprising_organise_cells:0 "组织革命团体"
 lar_communist_uprising_organise_cells_desc:0 "我们的特务将会与一些選定的工人合作，以建立革命行动委员会，将革命的種子带到每一个工廠之中。"
 lar_communist_uprising_infiltrate_civil_service:0 "渗透公务员"
 lar_communist_uprising_infiltrate_civil_service_desc:0 "我们的特务会确保一些值得信賴的人进入公务体系，在革命成功后他们将会成为行政机構的核心。"
 lar_communist_uprising_train_workers_militia:0 "训练工人民兵"
 lar_communist_uprising_train_workers_militia_desc:0 "我们的特务会组织一些基本的训练给幾位精挑細選的同志，他们将会成为民兵组织的核心幹部。"
 lar_communist_uprising_organize_strikes:0 "组织罷工"
 lar_communist_uprising_organize_strikes_desc:0 "我们的特务会联絡一些关鍵工业中的工会和政治上可信的人，并协助他们在战爭爆发后组织罷工。"
 lar_fra_coup_pre_position_units:0 "预先部署单位"
 lar_fra_coup_pre_position_units_desc:0 "我们的特务会指揮一些在当地同情我方的部队，并为他们指派行动开始后要立刻占领的目标。"
 lar_fra_launch_coup:0 "发动政变"
 lar_fra_launch_coup_desc:0 "行动将在接收到加密的无线电讯號后立即展开。"
 
 
 FRA_instigate_workers_revolution_britain:0 "煽动英国的工人革命"
 FRA_instigate_workers_revolution_italy:0 "煽动义大利的工人革命"
 FRA_instigate_workers_revolution_spain:0 "煽动西班牙的工人革命"
 FRA_instigate_workers_revolution_germany:0 "煽动德国的工人革命"
 FRA_coup_in_north_africa:0 "策划于北非的政变"
 FRA_coup_in_north_africa_flag:0 "策划于北非的政变"
 FRA_coup_in_north_africa_desc:0 "许多在北非的法国人仍然渴望加入战斗对抗侵略者。我们只需要和他们接触即可。"
 FRA_coup_in_syria:0 "策划于敘利亞的政变"
 FRA_coup_in_syria_flag:0 "策划于敘利亞的政变"
 FRA_coup_in_syria_desc:0 "许多在敘利亞的法国人仍然渴望加入战斗对抗侵略者。我们只需要和他们接触即可。"
 FRA_coup_in_indochina:0 "策划于印度支那的政变"
 FRA_coup_in_indochina_flag:0 "策划于印度支那的政变"
 FRA_coup_in_indochina_desc:0 "许多在印度支那的法国人仍然渴望加入战斗对抗侵略者。我们只需要和他们接触即可。"
 FRA_coup_in_central_africa:0 "策划于中非的政变"
 FRA_coup_in_central_africa_flag:0 "策划于中非的政变"
 FRA_coup_in_central_africa_desc:0 "许多在中非的法国人仍然渴望加入战斗对抗侵略者。我们只需要和他们接触即可。"
 FRA_coup_in_west_africa:0 "策划于西非的政变"
 FRA_coup_in_west_africa_flag:0 "策划于西非的政变"
 FRA_coup_in_west_africa_desc:0 "许多在西非的法国人仍然渴望加入战斗对抗侵略者。我们只需要和他们接触即可。"
 FRA_coup_in_madagascar:0 "策划于馬达加斯加的政变"
 FRA_coup_in_madagascar_flag:0 "策划于馬达加斯加的政变"
 FRA_coup_in_madagascar_desc:0 "许多在馬达加斯加的法国人仍然渴望加入战斗对抗侵略者。我们只需要和他们接触即可。"
 
 
 targeted_sabotage_plant_explosives:0 "装设炸藥"
 targeted_sabotage_plant_explosives_desc:0 "我们的特务将和当地抵抗组织的成员合作，在夜色掩护下潜入工廠，并在負重結構旁边放置炸藥，这樣将能摧毀整个工廠，連带著裡面所有的生產设施。"
 targeted_sabotage_organize_more_meetings:0 "策动消极怠工"
 targeted_sabotage_organize_more_meetings_desc:0 "通过在工人之间散布不满情绪，使工人在工作中浑水摸鱼和偷懒，从而对对方的经济生产带来负面影响。"
 targeted_sabotage_destroy_bridge:0 "摧毀橋梁"
 targeted_sabotage_destroy_bridge_desc:0 "当地的抵抗组织发现，有一座橋樑最近成为了敌军補给工作的重要樞紐。我们的特务将会使用数磅的的高爆炸藥将这段美好时光終結。"
 targeted_sabotage_collapse_tunnel:0 "塌毀隧道"
 targeted_sabotage_collapse_tunnel_desc:0 "此区域的主要鐵路线通过一个狹窄的隧道。我们的特务已经找出了其建築結構上的弱点，他们将使用炸藥来使这座隧道崩塌。"
 targeted_sabotage_remove_roadsigns:0 "移除路标"
 targeted_sabotage_remove_roadsigns_desc:0 "我们的特务会拆毀街道上的路标或者将其转向，從而使得占领军在当地尋路的工作更加困难。"
 targeted_sabotage_immobilize_rolling_stock:0 "癱瘓車頭"
 targeted_sabotage_immobilize_rolling_stock_desc:0 "只需要在火車車廂的潤滑節点上灑一把沙子，就可以把整輛車摩損到停机，在修好之前它将会塞住整條軌道。就算只癱瘓幾輛列車也可以让整个运輸系统崩潰。"
 targeted_sabotage_burn_storage:0 "燒毀倉储"
 targeted_sabotage_burn_storage_desc:0 "当地的抵抗组织发现，有一些储存槽装著高度易燃的化合物。在夜色的掩护下，我们的特务将点燃这个储存槽，并藉著隨后的混亂逃亡。"
 targeted_sabotage_destroy_mining_equipment:0 "摧毀採礦设备"
 targeted_sabotage_destroy_mining_equipment_desc:0 "当地的抵抗组织指出，许多用于採礦的重型设备都極容易遭到破坏。我们的特务会利用炸藥来癱瘓一些重要的部件，從而把整个採礦工作癱瘓。"
 
 
 operation_targeted_sabotage_industry:0 "破坏工业"
 operation_targeted_sabotage_industry_desc:0 "§L在敌方境內的抵抗组织要求我们的支援，以摧毀当地的工廠。§!"
 operation_targeted_sabotage_infrastructure:0 "破坏交通运输"
 operation_targeted_sabotage_infrastructure_desc:0 "§L在敌方境內的抵抗组织一直在低调的襲击对方的基礎设施，但他们一直缺乏资源来造成更大的影響，直到现在。§!"
 operation_targeted_sabotage_resources:0 "破坏资源采集"
 operation_targeted_sabotage_resources_desc:0 "§L在敌方境內的抵抗组织跟我们联絡，通知我方有关敌人在该区域採集资源的計划。一次良好的破坏行动将能让这些计划付諸流水。§!"
 operation_rescue_operative:0 "營救被捕特务"
 operation_rescue_operative_desc:0 "§L我们的一个线人被敌人逮捕了。我们必須将他救回来，而且必須在一切太遲之前盡快行动。§!"
 
 
 free_operative_free_in_transit:0 "在转运期间解救"
 free_operative_free_in_transit_desc:0 "我们的探员被以汽車运輸，来回于監獄和審問地点之间。我们已经确认了路线，接下来我们会派出一小支队伍进行埋伏，殺死守卫并救回我们的探员。"
 free_operative_liberate_camp:0 "解放集中營"
 free_operative_liberate_camp_desc:0 "在受審期间，我们的特务和其他重要的犯人一起关在同一个集中營。我们将会以一小支部队发起攻击此集中營，消滅守军并解救特务。"
 free_operative_smuggle_in_escape_gear:0 "偷渡逃脫工具"
 free_operative_smuggle_in_escape_gear_desc:0 "我们的科学家开发了一整套的逃脫工具。我们有一位当地的联絡人同意运送包裹。我们的特务将会利用这套工具逃出，并前往会合点等待撤离。"
 operation_outcome_consumes_token_tt:1 "此一行动可能会消耗一个§Y渗透线人§!。"
 operation_outcome_sabotage_industry_tt:0 "让当地的抵抗组织專注在破坏工业，并增加攻击成功的机会。"
 operation_outcome_sabotage_infrastructure_tt:0 "让当地的抵抗组织專注在破坏基礎建设，并增加攻击成功的机会。"
 operation_outcome_sabotage_resources_tt:0 "让当地的抵抗组织專注在破外资源採集，并增加攻击成功的机会。"
 operation_coup_government:0 "策划政变"
 operation_coup_government_desc:0 "§L顛覆[From.GetNameDefCap]政权的时刻已经到来了。只要我们支持一小批可信賴的人，他们就能推翻支撐起[From.GetAdjective]政府的腐敗結構。§!"
 collaboration_government_set_up_planning_committees:0 "组织計划委员会"
 collaboration_government_set_up_planning_committees_desc:0 "我们的团队将与一些同情我方的政客会面，討論在我们占领[From.GetNameDef]后建立一个新政府的可能性，接著我们将组织不同的小组来討論各方面的細節。"
 collaboration_government_train_paramilitary_forces:0 "训练准军事部队"
 collaboration_government_train_paramilitary_forces_desc:0 "我们的团队会组织并训练一些部队，以协助新政府維持法律与秩序。在新政府组织好之前，他们也能用以維持后方的安全。"
 collaboration_government_contact_military_officers:0 "联絡军官"
 collaboration_government_contact_military_officers_desc:0 "我们的团队将根據一些线索来找出对当前的[From.GetAdjective]政府不滿的退休军官，他们将会很樂意协助我们建立新政府，当然，是在占领该国之后。"
 operation_collaboration_government:0 "准备合作政府"
 operation_collaboration_government_desc:0 "§L如果有一个友善的[From.GetNameDef]政府存在，我们就能更專注于对抗其他敌人，同时也能空出部队另作它用。§!"
 fake_intel_decoy_tanks:0 "誘餌坦克"
 fake_intel_decoy_tanks_desc:0 "我们已经发明了一些廉價的誘餌，它们從远处看来就像坦克。我们会把它们部署在容易被觀察的地点，确保敌人有足够的时间发现它们。"
 fake_intel_radio_deception:0 "无线电詐欺"
 fake_intel_radio_deception_desc:0 "我们将成立一个无线电專家组成的小队，把它偽装的看起来像一个更大的无线电分遣队。他们将会使用舊版的密码，让敌人能够更容易讀取他们的讯息。"
 fake_intel_deliberate_leaks:0 "刻意洩密"
 fake_intel_deliberate_leaks_desc:0 "我们在国外的一些特务将会确保他们在正确的人面前表现得粗心大意，让敌人從「可信」的情报来源得到他们想要的资讯。"
 fake_intel_press_releases:0 "釋出报导"
 fake_intel_press_releases_desc:0 "我们会邀請记者来寫一篇鉅細靡遺的报导，而报导內容则是我们希望敌人得知的讯息。"
 fake_intel_utilize_double_agents:0 "善用双面间諜"
 fake_intel_utilize_double_agents_desc:0 "我们已经让敌人情报部門中的一些低階线人变節到我方了。我们会鼓勵他们提供对方一些「正确」的讯息。"
 fake_intel_plant_evidence:0 "布置證據"
 fake_intel_plant_evidence_desc:0 "我们将在一个受敌人控制但我们目前沒有興趣的地方发动一次小規模行动，并且确保我们留下一大堆的證據给他们。"
 fake_intel_release_pow:0 "釋放战俘"
 fake_intel_release_pow_desc:0 "出于人道因素，一位被俘的敌方军官屆期将被遣返回国。但在他离开之前，我们会确保他意外的看到一些東西。"
 operation_fake_intel:0 "设置欺敌作战計划"
 operation_fake_intel_desc:0 "§L我们已知悉[From.GetAdjective]有情报单位于我国进行任务，可是有时候，提供他们想要的资讯可能是更好的選擇。§!"
 heavy_water_raid:0 "岡納賽德行动"
 heavy_water_raid_desc:0 "§L德国人开始在挪威的一座工廠生產重水，这可能和原子武器的开发有关。尽管他们生產出的重水不足以让他们建造这樣的武器，但无疑能大幅推进他们的研究进度。§!"
 heavy_water_infiltration:0 "空投突击队与補给"
 heavy_water_infiltration_desc:0 "一架改装轟炸机会把一支挪威突击小队空投到该区域，并且联系一支先遣部队和当地抵抗组织。"
 heavy_water_attack:0 "破坏重水工廠"
 heavy_water_attack_desc:0 "回报顯示当地的安保相当鬆懈。抵抗组织在內部的线人也提供了德军的巡逻时间表。一旦进入工廠，突击队会在裡面安装炸藥，并且留下像是被军事行动摧毀的證據。"
 heavy_water_exfiltration:0 "撤离行动"
 heavy_water_exfiltration_desc:0 "接著突击队会解散，他们可以加入当地的抵抗组织，或是想辦法回到友军战线上。"
 bruneval_raid:0 "叮咬行动"
 bruneval_raid_desc:0 "§L看来，敌人在雷达科技方面的发展似乎领先了我们。我们找到了一个敌人的雷达站位于容易襲击的位置，我们相信只要用一支小型部队发动堅定的突击就能拿下它，從而为我们带来更多情报。§!"
 bruneval_infiltration:0 "空投突击队"
 bruneval_infiltration_desc:0 "我们将集結一个連的空降部队，并在夜晚时以低空空降于目标附近。"
 bruneval_attack:0 "占领雷达站"
 bruneval_attack_desc:0 "突击队将分成四支小队，分別去占领雷达站和清空撤离点的海灘。一位專家将会負責拆解和对雷达设备拍照。这支部队也会試著抓获敌人的雷达技師以供審問。"
 bruneval_exfiltration:0 "透过登陆艇撤离"
 bruneval_exfiltration_desc:0 "一支登陆艇舰队将搭載著掩护疏散的部队抵达，然后将突击队接走。海军会为他们提供护航。"
 capture_tito:0 "跳馬行动"
 capture_tito_desc:0 "§L南斯拉夫的游击队日益强大，隨之行动也越加大膽。在许多区域，他们實際上控制著鄉村地带，能够隨意的封鎖道路或进行其他行动而不必担心被懲罰。这一切的关鍵乃是游击队的领导人狄托，他負責协调并掌控著这些行动。如果能除掉他，将对此地的抵抗运动造成嚴重打击。§!"
 capture_tito_infiltration:0 "投放空降部队"
 capture_tito_infiltration_desc:0 "第一波的伞兵将由滑翔机搭載，他们会直接降落在狄托可能的藏身处之上。利用速度和突击的优势，他们将能够壓制狄托的守军，從而逮捕或殺死狄托本人。"
 capture_tito_attack:0 "主要突击"
 capture_tito_attack_desc:0 "一支摩托化部队将会趕上伞兵，并在路上順便摧毀所有仍在抵抗的游击队。"
 capture_tito_exfiltration:0 "确保该区"
 capture_tito_exfiltration_desc:0 "一但兩支突击部队会合，他们将会鞏固该区的控制，并掃蕩倖存的敌军。"
 rescue_mussolini:0 "營救貝尼托·墨索里尼"
 rescue_mussolini_desc:0 "§L自從他被[ITA.GetLeader]罷黜后，墨索里尼一直被軟禁在亞平寧山脈中的一座小旅館中。我们有一扇小小的机会之窗能拯救他，并将他带回到我方战线上。而他无疑在我们获勝之后可以协助管理义大利的领土。§!"
 rescue_mussolini_infiltration:0 "用滑翔机降落在牢獄附近"
 rescue_mussolini_infiltration_desc:0 "一支挑選过的部队将会登上滑翔机，预定著陆在目标附近，而我们情报机構指出的此一目标應该是軟禁墨索里尼的地点。"
 rescue_mussolini_attack:0 "突击牢獄"
 rescue_mussolini_attack_desc:0 "突击队将攻击并占领旅館，然后解放墨索里尼。理想的狀況下，駐军應该会選擇投降而非战斗。速度和出其不意将是勝利的关鍵。"
 rescue_mussolini_exfiltration:0 "透过飞机撤出"
 rescue_mussolini_exfiltration_desc:0 "一架擁有短场起降能力的小飞机将会著陆并接走墨索里尼，接著飞往友方机场。"
 GER_rescued_mussolini:0 "救出墨索里尼"
 infiltration_paradrop_outcome:0 "尽管在黑暗中很难找到降落区，但小队還是成功著陆了。"
 infiltration_submarine_outcome:0 "雖然第一次的尝试被大浪打退，但隔天展开的第二次登陆行动获得了成功，安全地将小队送上了海岸。"
 infiltration_border_outcome:0 "在坏天氣的掩护之下，我们的小队找到了之前侦查过的小徑并成功穿越了边境，未遭受其他阻礙。"
 infiltration_diplomatic_outcome:0 "小队毫无阻礙的进入了该国，并巧妙地閃避了敌方反情报机構的追蹤。"
 exfiltration_air_pickup_outcome:0 "尽管遭遇了一些困难，但这架小型的运輸机還是设法找到了接运地点，并将小队安全带了回来。"
 exfiltration_submarine_pickup_outcome:0 "在与当地巡逻的敌军进行了幾天紧張的捉迷藏后，我们的小队成功的接到了所有人，并且在未被发下的狀況离开了该地。"
 exfiltration_border_outcome:0 "小队在夜色掩护下穿越国境逃走了，他们靠的是一位当地的嚮导，他帮助小队找出了穿越边境防卫的路线。"
 exfiltration_go_to_ground_outcome:0 "我们的小队混入了当地平民之中，现在要嘛是在计划如何返国，要嘛就是待在当地等待下一步指令。"
 fake_intel_decoy_tanks_outcome:0 "尽管敌人对该地进行了幾次侦查行动，现在仍不确定他们是否真的看到了誘餌并且相信了它。我们仍在等待其他消息来源，以确认他们是不是真的上当了。"
 fake_intel_radio_deception_outcome:0 "我们的无线电操作员憑空制造了大量的通讯流量。但敌人是否真的監測到了这些通讯仍无法确认。"
 fake_intel_deliberate_leaks_outcome:0 "我们确保敌方的特务持續收到少量的洩漏情报，这些拼湊起来将会让他们得到一个完全錯誤的情报。但敌方会不会真的相信還有待觀察。"
 fake_intel_press_releases_outcome:0 "我们的公共讯息部門报告，在一些友好和中立的报紙上的报导和我们想要的結果幾乎一致。"
 fake_intel_utilize_double_agents_outcome:0 "我们的双面间諜向对方提供了许多有用的情报－其中甚至有一些是正确的情报，这樣就能确保敌方会持續相信此一讯息来源。"
 fake_intel_plant_evidence_outcome:0 "我们发动的突击完全成功，敌人也获得了我方留下的大量證據。早先的报告顯示，敌方已经有幾隻部队被调到该区以作为回應。"
 fake_intel_release_pow_outcome:0 "这位军官在运輸途中将会经过幾个军事營地，而且他将会发现一些不同的師团徽章，尽管这些部队根本就不存在。"
 targeted_sabotage_plant_explosives_outcome:0 "小队成功地安装了炸藥并摧毀了工廠。报告顯示，对机械组件的傷害相当輕微，但仍需要花上很多时间重建。"
 targeted_sabotage_organize_more_meetings_outcome:0 "我们的特务成功渗透进了目标公司的中间管理層，他暴力地重组工作的流程，宣稱要推动利益相关者对工作的參与，以尋求更大的协同效應。而生產力已经大幅度的下降了。"
 targeted_sabotage_destroy_bridge_outcome:0 "小队佈置了炸藥，并且将引信设定成在一輛火車通过时引爆。在爆炸和出軌火車的双重破坏下，整个橋梁都垮进了河裡。"
 targeted_sabotage_collapse_tunnel_outcome:0 "在确认了建築結構上的弱点后，小队放置炸藥并隨后撤离了。尽管隧道可以被修復，但要恢復到可以使用的程度還是需要很久时间。"
 targeted_sabotage_remove_roadsigns_outcome:0 "小队成功的在幾个重要的路口移除了路标，并更換了其他地方的路标，导致一些对此区不熟悉的駕駛陷入巨大的混亂之中。"
 targeted_sabotage_immobilize_rolling_stock_outcome:0 "小队渗透进了火車車庫，成功地破坏了一些火車頭。这些破坏的效果只有在火車跑了幾公里之后才会顯现出来，到时候这些火車都会拋錨在空曠的鐵路上。"
 targeted_sabotage_burn_storage_outcome:0 "小队成功地放火燒了当地的倉储区，摧毀了数百噸的资源储存，并嚴重影響敌人維持足够庫存的能力。"
 targeted_sabotage_destroy_mining_equipment_outcome:0 "小队成功破坏了大部分的重型挖掘机具。雖然其中某些損坏不算嚴重，但供應中断仍将对生產造成嚴重的瓶頸。"
 steal_blueprints_bribe_outcome:0 "我们連絡上了一位有经濟困难的工程師，并成功說服他提供我们一些秘密文件来交換可兌換的貨幣。"
 steal_blueprints_seduction_outcome:0 "我们連絡上了一位想要有人陪伴的工程師，而他对于自己的工作可以說是知无不言。"
 steal_blueprints_infiltrate_naval_design_office_outcome:0 "我们的特务成功地渗透到了一间海军装备供應商裡面，并且複印了许多关鍵零件的蓝图。"
 steal_blueprints_steal_prototype_outcome:0 "原型机已经成功回收并飞回我方机场。我们的工程師正在将它分解。"
 steal_blueprints_middle_manager_outcome:0 "我们的特务在管理一间小公司上花費的时间大大增長了我方对敌人经濟的认識。我们仍在调查一些报告，其中指出我们的特务在那裡工作时，他们的生產力有所提升。"
 capture_cyphers_bribe_outcome:0 "我们的特务获得了一本完整的密码本，这是他透过財物跟一个不知名的来源買到的。"
 capture_cyphers_raid_outcome:0 "我们的一支突击队成功的襲击了一个无线电站，并在设法在密码本被銷毀之前获得了其副本。"
 capture_cyphers_seduction_outcome:0 "我们的特务成功說服了一个擁有密码本的人与敌方分道揚鑣。"
 capture_cyphers_smuggle_outcome:0 "我们的特务成功說服了一位在[From.GetNameDef]的线人，他同意将它们之前通讯所用密码本的完整副本寄给我们。"
 capture_cyphers_reverse_engineer_outcome:0 "我们的特务成功获取了敌人所用的加密机器的一个范本。尽管这个版本不如军用型强大，但对我们用来了解敌方行动仍有著重大的助益。"
 collaboration_government_set_up_planning_committees_outcome:0 "我们的团队设立了数个团体来组织新政府，确保一旦战斗結束，他们将能够順利地接收权力。"
 collaboration_government_train_paramilitary_forces_outcome:0 "我们的团队组织了一些可靠的人，用他们来建立一个小准军事组织，其中一些人擁有军事经驗。在我们的大军向前推进时，他们会負責保卫后方的安全。"
 collaboration_government_contact_military_officers_outcome:0 "我们的团队和一些退休的军官取得了联系，并且說服了他们帮忙组织新政府，而他们当然得在新政府中担任要職。"
 free_operative_free_in_transit_outcome:0 "在一小支突击队的协助下，我们成功执行了埋伏并救出了我们的特务，当时他正被转移到新的地点。"
 free_operative_liberate_camp_outcome:0 "在囚犯即将被转移走的数小时前，我们的一支小型突击队成功解放了关押著我们探员的監獄。"
 free_operative_smuggle_in_escape_gear_outcome:0 "我们的特务收到了逃脫工具，在夜幕的掩护下成功的逃獄了。他躲避敌人的搜索和巡逻队躲了好幾天，现在我们終于能够和他联系。"
 infiltrate_military_bribe_outcome:0 "我们的特务成功的說服了一名士兵，我们将付一大筆錢来让他为我们工作。"
 infiltrate_military_seduction_outcome:0 "我们的特务和一名敌方士兵发展出了親密的关係，從而使这位士兵成为了可靠的消息来源。"
 infiltrate_military_turned_pow_outcome:0 "我们的心战部門已经成功的說服了一些战俘，使他们相信我们的事业是正义的，接著他们将会被釋放回国。"
 infiltrate_military_ideological_supporter_outcome:0 "我们的特务已经和一些官员取得了联系，他们已经不再支持当下的[From.GetAdjective]政权。"
 resistance_contacts_radio_circuits_outcome:0 "我们的小队已经接触了一些抵抗组织，并且教给他们使用无线电的技巧，并在每个组织裡面留下一个无线电操作员。"
 resistance_support_pidgeons_outcome:0 "我们在敌方战线后方空投了一些信鸽，其中也夾带如何餵養和照顧鸽子的說明。"
 resistance_contacts_briefings_outcome:0 "我们的小队知会了抵抗组织成员有关我们在这个区域計划的行动，要他们專注于收集情报，同时安排物资空投。"
 resistance_support_arms_depots_outcome:0 "我们的小队在幾个隱蔽的地点设立了一些武器和彈藥庫，以改善抵抗组织的作战能力。"
 resistance_support_distribute_weapons_outcome:0 "我们的小队分发了武器给数个抵抗组织，同时也教导他们如何使用。"
 resistance_support_organize_training_outcome:0 "我们的小队为抵抗组织舉行了基本训练课程，內容包括隱密行动、小型武器維护和拆除工作。"
 resistance_support_coordinate_groups_outcome:0 "我们的小队集合了来自幾个較大的抵抗组织的一些代表，为他们协调更大規模的行动，并且确保補给能抵达最需要的地方。"
 propaganda_secret_published_outcome:0 "我们的小队已经将反对当地政府的宣传材料印刷在出版物上并分发出去。"
 heavy_water_raid_outcome_tt:0 "我们会尝试摧毀德国人的重水工廠，阻止他们在原子研究计划上有所突破。"
 bruneval_raid_outcome_tt:0 "我们会尝试夺取敌人雷达科技的关鍵零件，以协助我方的研究。"
 capture_tito_outcome_tt:0 "我们会尝试俘虜或殺死狄托。这将是一个高風险的行动，有著失敗的可能性。"
 rescue_mussolini_outcome_tt:0 "我们会尝试解救墨索里尼。这将是一个高風险的行动，有著失敗的可能性。"
 coordinated_strike_scout_target:0 "侦查目标"
 coordinated_strike_scout_target_desc:0 "我们的小队会侦查目标地并且进行攝影，從而提供我方当地高價值目标的最新资讯。"
 coordinated_strike_scout_target_outcome:0 "就在攻击开始前的幾个小时，我们的小队给出了一系列精确的讯息，包含敌人總部和其他重要地点的位置。"
 coordinate_strike_mark_targets:0 "标记目标"
 coordinate_strike_mark_targets_desc:0 "我们的小队会使用预先安排好的信號和标记，以让我们的部队更容易发现高價值的目标。"
 coordinate_strike_mark_targets_outcome:0 "尽管必須在很短的时间和夜晚中进行，但标记工作非常的成功，将我们的部队导向了最重要的幾个目标。"
 coordinated_strike_sabotage_communications:0 "破坏通讯"
 coordinated_strike_sabotage_communications_desc:0 "我们的小队会切断电話线且伏击信使，從而阻断敌人在一开始关鍵的数小时中的通讯。"
 coordinated_strike_sabotage_communications_outcome:0 "我们的小队成功的扰亂了敌人的通讯，导致他们对我们攻击的反應相当遲緩。"
 coordinated_strike_direct_units:0 "引导部队"
 coordinated_strike_direct_units_desc:0 "当攻击开始时，我们的小队将透过无线电将我军引导向最有價值的目标。"
 coordinated_strike_direct_units_outcome:0 "在引导我军这件事上，我们的小队非常成功。大幅增加了对敌人造成的傷害。"
 coordinated_strike_occupy_bridges:0 "占领橋梁"
 coordinated_strike_occupy_bridges_desc:0 "我们的小队将会占领此区域的橋樑，阻止敌方将它们摧毀，同时堵塞敌军的反击。"
 coordinated_strike_occupy_bridges_outcome:0 "小队成功地击敗了幾个关鍵橋梁的守军，同时切断了橋上炸藥的引线，现在我方部队可以通行无阻了。"
 operation_coordinated_strike:0 "协同打击"
 operation_coordinated_strike_desc:1 "§L为了达到对抗[From.GetNameDef]的勝利，我们必須在一次出其不意的突击中重創他们。§!\n\n准备在目标区域进行§Y港口轟炸§!和§Y战略轟炸§!空军任务，在行动完成的同时，空军将会展开襲击，同时也会对该国宣战。"
 coordinated_strike_tt:1 "我们将会透过一次突击向§Y[From.GetNameDef]§!宣战。当啟动时，所有在该区域准备好的港口轟炸和战略轟炸将会执行多次，敌人的防空系统将无法攔截他们。"
 exfiltration_air_pickup_outcome_fail:0 "§R我们的飞行员发现预定的降落区已经被敌人防空部队的探照燈点亮了，于是他决定放棄这次行动。§!"
 exfiltration_submarine_pickup_outcome_fail:0 "§R潜艇在预定的撤离点等待了数小时，但沒有從海岸方向获得任何小队准备撤离的讯息。船员们回报，在这段期间，敌军部队在海岸上的活动顯著增加了。§!"
 exfiltration_border_outcome_fail:0 "§R我们国境这边的嚮导一直徒然的等待著我方小队出现，最后由于敌军的巡逻队接近，他不得不离开他的崗位。§!"
 exfiltration_go_to_ground_outcome_fail:0 "§R我们的小队到目前为止都沒有按照计划和我方联絡。我们也未获得任何他们的相关情报。§!"
