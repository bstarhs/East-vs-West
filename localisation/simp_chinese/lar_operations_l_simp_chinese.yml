 GER_heavy_water_production_underway:0 "正在生產重水"
 heavy_water_infiltration_outcome:0 "小队成功地空降于该区域。"
 heavy_water_attack_outcome:0 "小队成功地渗透进了工廠，避开了所有守卫。在不到一小时后，一场大規模的爆炸摧毀了工廠。"
 heavy_water_exfiltration_outcome:0 "在突击过后我们仍未收到任何有关该小队的消息，但这是预期之內的事。"
 heavy_water_exfiltration_outcome_fail:0 "德国当局宣稱，他们已经抓获了岡納賽德行动的小队。看来他们在撤离工廠时遭遇了一些問題。"
 bruneval_infiltration_outcome:0 "突击队成功的降落于该地，只有很少的人因空投而分散。"
 bruneval_attack_outcome:0 "伞兵们向目标处推进，隨后在一场短暫但激烈的战斗后击敗了弱小的守军。"
 bruneval_exfiltration_outcome:0 "突击队乘坐登陆艇返国，他们還带回了一位敌军的雷达技師以供審問。"
 bruneval_exfiltration_outcome_fail:0 "在撤退回不列顛后，我们发现我方的特务不在從海灘撤退回来的行列之中。目前仍不清楚是在什么时候与他失联的，但我们只能做最坏的打算。"
 capture_tito_attack_outcome:0 "檢視行动报告以获得更多有关行动結果的资讯。"
 organise_cells_outcome:0 "数个革命团体已经组织起来，并开始在敌后展开活动。"
 infiltrate_civil_service_outcome:0 "我们已经让一些可信賴的人位居要津，他们将能够快速的接管解放区的行政工作。"
 workers_militia_outcome:0 "数个營的工人民兵已经完成准备，隨时能保卫重要的设施。"
 organize_strikes_outcome:0 "我们的特务成功說服了工会成员和工人们展开一场大規模罷工。"
 preposition_units_outcome:0 "我们在该国的线人将会在起义开始时夺取关鍵的基礎建设。"
 launch_coup_exfiltration_outcome:0 "当他收到开始行动的讯號，我们的特务就率领了一些部队占领了指定的目标。叛军们已经成功掌控了一片领土。"
 launch_coup_exfiltration_outcome_fail:0 "在起义当下的混亂之中，我们失去了和我方特务的联系。我们可能永远不会知道到底发生了什么。"