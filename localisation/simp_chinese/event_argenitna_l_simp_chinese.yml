l_simp_chinese:

 arg.1.t:0 "伊娃·贝隆去世！"
 arg.1.d:0 "阿根廷总统胡安·贝隆的妻子、阿根廷工会领袖，被称作祖国之母的伊娃·贝隆因宫颈癌去世！她的离去令阿根廷全国陷入悲痛之中，同时也给贝隆的正义党政府带来了不稳定。"

 arg.2.t:0 "阿根廷发生军事袭击事件！！"
 arg.2.d:0 "来自布宜诺斯艾利斯的突发消息！30架飞机轰炸并扫射了阿根廷首都布宜诺斯艾利斯的主要广场五月广场。\n事件发生时广场上正举行由总统胡安·贝隆发起的，旨在支持总统打压天主教影响力的示威游行活动。突然三十多架战斗机从空中向总统府方向俯冲而去，使用机枪扫射并投下炸弹。五月广场沦为人间地狱，到处是人体残肢。\n忠于总统的军队立刻发起反击，将发起袭击的叛乱飞机击落，并俘虏了飞行员。袭击者可能是阿根廷军方中的右翼势力，他们反对贝隆总统的反天主教政策。\n这次可怕的袭击已至少造成三百多人死亡，这是阿根廷历史上伤亡最惨重的袭击事件！"

 arg.5.t:0 "军事政变！"
 arg.5.d:0 "贝隆政府无力解决巨大的财政赤字和通货膨胀问题，使得中产阶级对他失去信心。军方日前发表声明，生成贝隆的文人政府正在将阿根廷带入危险的地步，如果他不主动辞职，军方有权采取措施，建立军事政权，稳定国家。"
 arg.5.a:0 "令人不安。"

 arg.6.t:0 "阿根廷军方发生激烈冲突！"
 arg.6.d:0 "阿根廷反对派军人发动的反对胡安·贝隆的政变演变为流血冲突！双方在阿根廷多地发生激烈交火！\n由爱德华多·洛纳尔迪将军、佩德罗·E·阿兰布鲁将军和海军上将伊萨克·罗哈斯领导的临时政府占领了多个海军基地。拉普拉塔附近圣地亚哥河的另一个海军基地以及科连特斯省库鲁苏夸蒂亚的机械化步兵团等地发生了战斗。\n两艘正在执行拉普拉塔河封锁任务的叛军驱逐舰遭到效忠派飞机的扫射，遭受了一些伤亡。忠于庇隆的民族解放联盟总部在布宜诺斯艾利斯遭到谢尔曼坦克的袭击和摧毁。"
 
 arg.7.t:0 "胡安·贝隆下台！"
 arg.7.d:0 "来自布宜诺斯艾利斯的消息！\n胡安·贝隆政府无力解决巨大的财政赤字和通货膨胀问题，使得中产阶级对他失去信心。军方日前发表声明，生成贝隆的文人政府正在将阿根廷带入危险的地步，如果他不主动辞职，军方有权采取措施。\n贝隆在军事政变的威胁下被迫宣布辞职并流亡西班牙，佩德罗·尤金尼奥·阿兰布鲁将军领导的军政府接管政权。"
 
 arg.8.t:0 "阿根廷的未遂政变"
 
 arg.9.t:0 "阿根廷内战爆发！"

 arg.10.t:0 "总统大选在即"
 arg.10.d:0 "在经过几年的军方看守政府执政后，阿根廷民众认为军政府恢复社会秩序的任务已经完成，应当准备重新进行选举。"
 arg.10.a:0 "静观其变。"

 arg.11.t:0 "阿根廷总统大选"
 arg.11.d:0 "在经过几年的军方看守政府执政后，当局宣布重新举行大选。来自激进公民联盟的发展主义者阿图罗·弗朗迪西将参选总统，而军政府首脑佩德罗·尤金尼奥·阿兰布鲁将军也将在宣布自己辞去军职后，参加总统选举。"

 arg.12.t:0 "阿图罗·弗朗迪西当选新任阿根廷总统"
 arg.12.d:0 "阿图罗·弗朗迪西领导下的基金公民联盟赢得阿根廷总统大选，当选新任阿根廷总统。"

 arg.15.t:0 "弗朗迪西辞职"
 arg.15.d:0 "尽管弗朗迪西总统的钢铁、石油建设和工业化发展取得成效，但中产阶级未能从中获益，相反经济的重组引发了通货膨胀。军方发表声明施加压力，要求弗朗迪西下台。"
 arg.15.a:0 "我们别无选择。"

 arg.20.t:0 "贝隆再次当选阿根廷总统！"
 arg.20.d:0 "在阿根廷即将大选之际，流亡西班牙和乌拉圭多年的阿根廷前领袖，受人们爱戴的胡安·贝隆在支持者的簇拥下回到布宜诺斯艾利斯，这一次他带回了他的第三任妻子——伊莎贝尔·贝隆。贝隆不出意料地获得了大选的胜利，组织了他的第二次政府，但疾病和高龄是否允许他完成任期还是一个疑问。"
 arg.20.a:0 "贝隆将军万岁！"

 arg.25.t:0 "胡安·贝隆去世！"
 arg.25.d:0 "昨日是一个令阿根廷人民悲痛而不安的日子，受人民爱戴的领袖，总统胡安·多明戈·贝隆将军因病去世，在未来得及完成自己第二任期的时刻撒手人寰。他的妻子、副总统伊莎贝尔·贝隆接替他的职务，成为西半球第一位女性领导人和世界上第一位女总统。这名女子是否能经得住石油危机、经济萧条和政治混乱的挑战呢？"
 arg.25.a:0 "静观其变。"

 arg.30.t:0 "军事政变！"
 arg.30.d:0 "石油、债务危机和经济崩溃使得中产阶级和商业对伊莎贝拉的统治失去了信心。在他们支持下，阿根廷军方发动军事政变，罢黜了伊莎贝拉，宣布军事统治的来临。"
 arg.30.a:0 "令人不安。"

 arg.40.t:0 "加尔铁里上台"
 arg.40.d:0 "阿根廷军方宣布利奥波德·加尔铁里将军将成为阿根廷的新总统。"
 arg.40.a:0 "确定。"

 arg.41.t:0 "阿根廷入侵福克兰群岛！"
 arg.41.d:0 "昨日凌晨，阿根廷海军战机向由英国控制的弗兰克群岛和南乔治亚岛发动突然袭击。阿根廷独裁者加尔铁里将军宣称，收复被英国占领的阿根廷领土的战斗已经打响。英国首相表示，绝不会放弃大英帝国的领土。"
 arg.41.a:0 "关注战局。"

 arg.42.t:0 "阿根廷撤退！"
 arg.42.d:0 "随着英国军队收复弗兰克群岛，群岛上的阿军全部投降，身心疲惫的阿根廷政府被迫宣布战争结束并以自己的惨败告终。战争的结果是，英国赢得了前所未有的声望与支持率，而阿根廷军政府的独裁统治即将走入尽头。"
 arg.42.a:0 "确定。"