 PRC_communism_party:0 "中国共产党"
 PRC_marxism_desc:0 "中国共产党成立于1921年，随后开始借助工人和学生运动发展壮大，并在1925年与中国国民党结为同盟。1927年蒋介石发动政变导致中共与国民党反目爆发内战，1936年两党停止内战一同对抗日本侵略。战后内战再起，中国共产党击败了蒋介石并成为中华人民共和国的唯一执政党。/n与传统的斯大林主义不同，1933年毛泽东成为中共领导人后，实行了自己的毛泽东主义理论，重视群众运动和农民利益。"
