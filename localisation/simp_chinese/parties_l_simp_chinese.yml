 TUR_democratic_party:0 "土耳其民主党"
 TUR_conservatism_party:0 "共和人民党"
 TUR_conservatism_party_long:0 "共和人民党"
 TUR_conservatism_desc:0 "共和人民党由土耳其国父阿塔图尔克·凯末尔亲自创立，旨在集合社会精英实现土耳其革命与世俗化建设。革命和建设的成功为凯末尔赢得了威望，也奠定了共和人民党的执政地位。凯末尔去世后，共和人民党继续控制土耳其政府，但日渐变得保守。1960年，土耳其民主党赢得大选，共和人民党退出历史舞台。"
