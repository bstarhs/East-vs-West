 SPR_neutrality_party_long:0 "长枪党"
 SPR_despotism_desc:0 "长枪党，原由西班牙国家社会主义理论者何塞建立。西班牙内战爆发后，长枪党成为右翼势力的成员，并最终在弗朗西斯科·弗朗哥领导下赢得内战，成为西班牙王国的唯一执政党。弗朗哥领导下的长枪党在西班牙进行了近40年的独裁统治，直到1974年弗朗哥去世，1978年西班牙实现民主化。"
