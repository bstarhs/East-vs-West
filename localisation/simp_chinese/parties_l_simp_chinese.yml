 JAP_communism_party:0 "日本共产党"
 JAP_democratic_party:0 "自由民主党"
 JAP_conservatism_desc:0 "自由民主党成立于1955年，由日本自由党和民主党合并而成，这两者都集合了当时日本的主要保守势力，包括部分逃脱罪责的二战战犯。自由民主党是日本保守势力为了对抗日渐强大的社会党、共产党等左派势力而组成的，自1955年来长期占国会多数，垄断日本政权，建立了实际上的一党制。"
 JAP_neutrality_party:0 "遁会"
 JAP_monarchism_party:0 "大和王朝"
 JAP_monarchism_party_desc:0 "大和王朝是世界上持续时间最久的君主制王朝，截止裕仁，大和王朝已经经历了124代天皇。大和王朝起源于公元前3世纪，被中国史书称作倭王的君主崛起于奈良，并逐步对外扩张，到公元4世纪基本统一了日本西部。天皇通过推广神道教实现君权神授，他们宣称自己是太阳神天照大神的子孙。1185年，一个叫源赖朝的武士赢得内战并迫使天皇任命自己为幕府将军，此后幕府和将军掌握了日本的统治权，天皇成为傀儡，直到1867年明治天皇将德川幕府推翻。"

