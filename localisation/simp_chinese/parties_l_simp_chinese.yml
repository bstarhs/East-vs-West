 MEX_authoritarianism_party_long:0 "革命制度党"
 MEX_authoritarianism_desc:0 "革命制度党成立于1925年，是墨西哥革命的产物。墨西哥总统卡德纳斯将墨西哥革命党改造为革命制度党，并给予其一党独大地位，以稳定革命带来的遗产。革命制度党执政初期为墨西哥带来了繁荣和发展，其成就包括30年代的石油国有化和60年代的经济奇迹。但随着墨西哥在70年代迎来债务危机和经济萧条，革命制度党变得越来越腐败和无能。"

