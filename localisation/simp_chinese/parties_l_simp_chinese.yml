 CHI_communism_party:0 "中国共产党"
 CHI_marxism_desc:0 "中国共产党成立于1921年，随后开始借助工人和学生运动发展壮大，并在1925年与中国国民党结为同盟。1927年蒋介石发动政变导致中共与国民党反目爆发内战，1936年两党停止内战一同对抗日本侵略。/n与传统的斯大林主义不同，1933年毛泽东成为中共领导人后，实行了自己的毛泽东主义理论，重视群众运动和农民利益。"
 CHI_democratic_party:0 "民主进步党"
 CHI_neutrality_party:0 "中国国民党"
 CHI_despotism_desc:0 "中国国民党起源于中国国父孙中山与1905年创立的中国同盟会，其主导了反清革命和后续的民主运动。1924年，孙中山在广州重建了国民党，提出民族、民生与民权之三民主义，并与共产党结盟以对抗军阀。1926年孙中山去世，蒋介石即位。蒋介石在1927年统一中国后谋求成为独裁者，他向共产党发动战争，并使国民党变得腐败而独裁。抗日战争结束后，蒋介石与国民党失去了在大陆的政权并撤往台湾。"
 
