 ARG_authoritarianism_party:0 "贝隆党"
 ARG_authoritarianism_desc:0 "“贝隆党”泛指阿根廷贝隆主义分子，包括由胡安·贝隆本人领导的正义党。胡安·贝隆提出的贝隆主义鼓吹民众主义、第三条道路和国家社会主义，并以此在1946年当选阿根廷总统。虽然胡安·贝隆及其妻子伊娃·贝隆的政策改善了人民生活，得到了劳动群众的支持，但触犯了中产阶级的利益，最终贝隆和他的贝隆党在1955和1976两次军事政变中下台，但贝隆主义在阿根廷仍有巨大的影响力。"

