 SOV_communism_party:0 "苏联共产党"
 SOV_stalinism_desc:0 "苏联共产党全称全联盟共产党，是苏联唯一的执政党，其来源于弗拉基米尔·列宁建立的社会民主党，后来其分裂为“孟什维克”和“布尔什维克”，布尔什维克便成为列宁领导的共产党的代称。作为第一个成为执政党的列宁主义党和共产党，苏联共产党在苏维埃建立了一党执政，并在斯大林时期进入了一党独裁状态。"
