l_simp_chinese:
 ang.1.t:0 "安哥拉起义！"
 ang.1.d:0 "一群安哥拉叛军袭击了罗安达附近的一座监狱，释放了被捕的黑人运动领袖。叛军声称来自安哥拉人民解放运动，该运动的目标是将所有葡萄牙人驱逐出安哥拉。根据我们的调查，这些叛军在农村地区很有影响力，可能受到共产主义的影响。"
 ang.1.a:0 "Foda-se comunista!"
 
 ang.2.t:0 "安哥拉起义！"
 ang.2.d:0 "安哥拉叛军组织起一支武装部队，向我们发动袭击！"
 ang.2.a:0 "Foda-se comunista!"
 
 ang.5.t:0 "安解阵暴动！"
 ang.5.d:0 "安解阵叛军组织起一支武装部队，向我们发动袭击！"
 ang.5.a:0 "Foda-se comunista!"
 
 ang.6.t:0 "安盟暴动！"
 ang.6.d:0 "安盟叛军组织起一支武装部队，向我们发动袭击！"
 ang.6.a:0 "Foda-se comunista!"
 
 ang.7.t:0 "安哥拉-南非冲突"
 
 ang.8.t:0 "安东尼奥·内图去世！"
 ang.8.d:0 "安哥拉人民解放运动领袖安东尼奥·内图去世。"
 ang.8.a:0 "Foda-se comunista!"
 
 ang.9.t:0 "[FROM.GetName]被镇压"
 ang.9.d:0 "在葡萄牙军队的大力镇压下，[FROM.GetName]领导的武装被击溃，幸存者被迫转入地下。"
 ang.9.a:0 "知道了。"
 
 ang.10.t:0 "安哥拉独立战争爆发！"
 ang.10.d:0 "随着安哥拉独立武装发起对葡萄牙据点的全面攻击，安哥拉独立战争宣告开始！安哥拉人民解放运动、安哥拉民族解放阵线和争取安哥拉全面独立联盟的领导人宣布，将国家从葡萄牙人三百多年统治下解放出来的时机已到。葡萄牙政府发表强硬的公告，宣布不惜一切代价守住安哥拉！"
 ang.10.a:0 "知道了。"
 
 ang.11.t:0 "安哥拉内战爆发！"
 ang.11.d:0 "安哥拉再次陷入战火！安人运、安解阵和安盟为了争夺这个新国家的统治权爆发武装冲突。葡萄牙撤离安哥拉后，留下的巨大权力真空，但是三支安哥拉武装组织无法达成共识，最终选择武力解决。"
 ang.11.a:0 "知道了。"
 
 