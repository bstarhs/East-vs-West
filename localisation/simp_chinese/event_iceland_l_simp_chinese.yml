l_simp_chinese:
 ice.9.t:0 "赫尔曼·约纳松当选冰岛总理"
 ice.9.d:0 "赫尔曼·约纳松领导下的保守党联盟赢得冰岛大选，约纳松就任冰岛总理。"
 
 ice.10.t:0 "冰岛提出扩大专属经济海域"
 ice.10.d:0 "冰岛政府正式宣布，该国的专属经济海域，将从4海里扩大到12海里，该范围内的北大西洋渔业资源将被纳入冰岛主权领域。从即日起，冰岛政府将不再允许外国渔船进入该地区捕鱼。"
 ice.10.a:0 "维京海盗发力了。"
 
 ice.11.t:0 "英国提出渔业问题谈判"
 
 ice.12.t:0 "冰岛与英国的谈判以失败告终"
 ice.12.d:0 "冰岛政府严词拒绝了英国就渔业问题进行谈判的要求，明确表示，冰岛的国家权益不受任何国家干涉，该国将坚持12海里的专属经济海域。"
 
 ice.13.t:0 "英国宣布进行武装护渔！"
 ice.13.d:0 "英国政府宣布，该国坚决不承认冰岛所谓的12海里专属渔业区的声明，英国渔民将继续在该区域进行捕捞活动，同时英国强调，如果冰岛使用武力干扰英国渔民的正常渔业活动，英国海军将派出军舰进行保护。\n英国海军已经出动了一支由五十支护卫舰组成的舰队前往冰岛南部海域，冰岛政府不甘示弱，宣布出动海岸警卫队驱逐所有外国渔船。冰岛局势将继续恶化。"
 ice.13.a:0 "长船——起航！"
 
 ice.14.t:0 "英国军舰与冰岛海岸警卫队发生交火！"
 ice.14.d:0 "英国军舰与冰岛海岸警卫队在冰岛南部海域发生武装冲突！冰岛的奥丁号巡逻艇向英国护卫舰连开七枪！"
 
 ice.15.t:0 "冰岛要求国际社会对英军进行干涉！"
 
 ice.16.t:0 "表态支持冰岛"
 
 ice.17.t:0 "表态支持英国"
 
 ice.18.t:0 "冰岛政府致信美国政府"
 ice.18.d:0 "尊敬的总统阁下：\n\n我们与英国的渔业争端正在恶化，我们希望华盛顿方面支持我们的立场，否则我们将质疑北大西洋公约组织是否有能力保护缔约国的安全。"
 
 ice.19.t:0 "来自美国的外交警告"
 ice.19.d:0 "尊敬的首相阁下：\n\n我们高度关注贵国与冰岛的渔业争端，目前两国的擦枪走火不仅加剧欧洲的紧张局势，还有可能令冰岛愤而退出北约。这是极其危险的，如果冰岛退出北约，那么苏联的核潜艇就有可能绕过冰岛进入北大西洋。我们希望英国政府谨慎考虑这一问题。"
 
 ice.20.t:0 "护渔的成本正在增加！"
 ice.20.d:0 "尊敬的首相阁下：\n\n在冰岛长时间的军事护渔，已经导致我国的军事支出大大增加，我们应当谨慎考虑得不偿失的问题。"
 
 ice.21.t:0 "英国宣布承认冰岛的专属经济海域"