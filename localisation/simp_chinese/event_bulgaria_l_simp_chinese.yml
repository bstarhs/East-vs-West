l_simp_chinese:
 bul.9.t:0 "季米特洛夫去世"
 bul.9.d:0 "保加利亚共产党总书记、保加利亚人民共和国总统、前共产国际领导人米哈伊尔·季米特洛夫同志因病去世。季米特洛夫曾在1933年德国国会纵火案后被纳粹逮捕，他在法庭上驳斥法西斯诬告的豪言壮语永远为全世界社会主义革命者所铭记。保加利亚共产党将在不久后举行会议选举下一任领导人。"
 bul.9.a:0 "确定。"
 
 bul.10.t:0 "[BUL.GetLeader]当选保加利亚共产党总书记"
 bul.10.d:0 "保在格奥尔基·季米特洛夫去世后，保加利亚共产党召开全国大会，选举[BUL.GetLeader]为下一任总书记。"
 bul.10.a:0 "确定。"

 bul.15.t:0 "契尔文科夫辞职"
 bul.15.d:0 "受莫斯科“去斯大林”化影响，在最近的保加利亚共产党十三大上，总书记契尔文科夫被指责搞个人崇拜，破坏民主制度，以及对保的经济发展延滞负有责任。契尔文科夫做了自我批评并辞职，托多尔·日夫科夫接替职位。"
 bul.15.a:0 "确定。"

 bul.25.t:0 "民主派示威！"
 bul.25.d:0 "国会大厦前爆发了由所谓“民主势力联盟”组织的大规模示威游行！据估计参加者超过一万人。民盟头目热列留声称：保加利亚共产党长期垄断政权，实行专制统治，使得保加利亚民主制度遭到践踏，民众生活水平和政治权利远远落后于西方，要求保共放弃对政权的控制，日夫科夫下台，实行政治多元化。"
 bul.25.a:0 "退一步。"
 bul.25.b:0 "亲西方分子的胡说八道！"

 bul.27.t:0 "民主派示威！"
 bul.27.d:0 "尽管托多尔·日夫科夫下台后，社会党赢得大选，但民盟仍不满足，他们拒绝与新政府合作，并继续施加压力，直到“共产主义残留”完全辞职为止。"
 bul.27.a:0 "退一步。"
 bul.27.b:0 "贪得无厌！"
 
 bul.30.t:0 "来自苏南冲突的政治影响"
 bul.30.d:0 "随着苏联与南斯拉夫关系的不断恶化，两国之间的政治斗争不可避免地对我国产生了影响。当年内不同派系纷纷在这一问题上进行站队，以瓦尔科·切尔温科夫为首的亲苏派坚定的站在莫斯科一边，而以特拉伊乔·科斯托夫为首的民族派则主张中立。"
 bul.30.a:0 "坚定支持斯大林同志，反对铁托主义！"
 bul.30.b:0 "反对莫斯科干涉我党的路线，保持中立。"
 
 bul.31.t:0 "保加利亚宣布清洗铁托分子"
 bul.31.d:0 "苏联与南斯拉夫的政治斗争蔓延到了保加利亚。保加利亚共产党宣布坚定支持斯大林同志在社会主义阵营中的领袖地位，批判铁托的亲西方行为，并连带清洗了特拉伊乔·科斯托夫等在这一问题上态度不坚决的党员。"
 
 bul.32.t:0 "保加利亚宣布在苏南冲突中保持中立"
 bul.32.d:0 "苏联与南斯拉夫的政治斗争蔓延到了保加利亚。经过激烈的政治斗争，同情铁托一派的党员取得优势，在他们的压力下，尽管在共产国际中拥有巨大声望，但格奥尔基·季米特洛夫被迫做了自我批评，保加利亚共产党亦宣布在苏南问题中保持中立。"
 
 
 bul.35.t:0 "来自去斯大林化的政治影响"
 bul.35.d:0 "去斯大林化的风潮席卷整个苏联。在保加利亚，各级党员们为突如其来的意识形态路线大转变搞得焦头烂额。当年内不同派系纷纷在这一问题上进行站队，以瓦尔科·切尔文科夫为首的“小斯大林”们坚定支持延续斯大林主义，而以托多尔·日夫科夫为首的另一派则主张跟随莫斯科的路线，对斯大林的政治影响进行批判。"
 bul.35.a:0 "坚定支持赫鲁晓夫同志，反对斯大林主义！"
 bul.35.b:0 "反对莫斯科干涉我党的路线，保持中立。"
 
 bul.36.t:0 "保加利亚六大的召开"
 bul.36.d:0 "苏联大搞去斯大林化的意识形态转变对保加利亚产生影响。坚持斯大林主义、自称小斯大林的瓦尔克·切尔文科夫遭到来自党内的压力，被指责搞个人崇拜，破坏民主制度，以及对保的经济发展延滞负有责任。契尔文科夫做了自我批评并辞职，托多尔·日夫科夫接替职位。"