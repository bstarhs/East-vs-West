l_simp_chinese:
 rocc.1.t:0 "国军攻占中共中原解放区"
 rocc.1.d:0 "中华民国国军经过激烈交战，先后占领了中共军队在山东、河北等中原地区的多个重要据点，中原解放区已被完全消灭，幸存的中共军队向北撤离。"
 rocc.1.a:0 "Good."
 
 rocc.2.t:0 "国军攻占中共陕北解放区"
 rocc.2.d:0 "中华民国国军经过激烈交战，先后占领了中共军队在陕西、山西等地区的多个重要据点，陕北解放区已被完全消灭，幸存的中共军队向东北撤离。"
 
 rocc.3.t:0 "国军攻占绥远和察哈尔解放区"
 rocc.3.d:0 "中华民国国军经过激烈交战，先后占领了中共军队在察哈尔和绥远的多个重要据点，幸存的中共军队向东北撤离。"
 
 rocc.4.t:0 "国军攻占哈尔滨"
 rocc.4.d:0 "中华民国国军经过激烈交战，攻占了中共在东北地区的最后一个大型城市和铁路核心哈尔滨，中共在东北的势力范围不断收缩。"
 
 rocc.5.t:0 "国军攻占满洲里"
 rocc.5.d:0 "中华民国国军经过激烈交战，攻占了中国东北通往苏联的重要交通枢纽满洲里市，中共与苏联之间的联系已被完全切断。"
 
 rocc.6.t:0 "国军攻占齐齐哈尔"
 rocc.6.d:0 "中华民国国军经过激烈交战，攻占了东北黑龙江省最大城市齐齐哈尔。"
 
 rocc.7.t:0 "国军攻占抚远"
 rocc.7.d:0 "中华民国国军经过激烈交战，攻占了中国最东北的城市抚远，这意味着中国共产党的最后一个占领区已基本瓦解。"
 
 rocc.8.t:0 "蒋介石宣布戡乱战争完全胜利"
 
 rocc.9.t:0 "阎锡山接任华北行政公署长官"
 
 rocc.10.t:0 "中华民国宣布收编地方部队"
 
 rocc.11.t:0 "中共军队溃逃进入远东"
 
 rocc.12.t:0 "毛泽东等中共领袖被俘"
 
 rocc.13.t:0 "毛泽东等中共领袖撤往伯力"
 
 rocc.14.t:0 "斯大林宣布介入中国内战"
 
 rocc.15.t:0 "就苏联介入中国战局进行投票"
 
 rocc.16.t:0 "谴责苏联之决议未能通过"
 
 rocc.17.t:0 "联合国要求苏联撤离中国东北"
 
 
 rocc.20.t:0 "南京方面要求整合我方部队"
 
 rocc.21.t:0 "[From.GetName]宣布接受中央整编"
 rocc.21.d:0 "中华民国国防部宣布，随着针对共产党的战争即将结束，该国将对各个掌握极大权力的地方军政机构进行裁撤。[From.GetName]宣布解散并接受中央整编，其麾下所有军事部队和行政机构并入位于南京的中华民国中央政府。"
 
 rocc.22.t:0 "[From.GetName]拒絕中央整编！"
 rocc.22.d:0 "[From.GetName]拒绝接受南京的合并要求，看来[From.GetLeader]还沉醉在北洋年代的军阀割据幻想中，妄图拥兵自重！"
 
 rocc.23.t:0 "南京政府对[From.GetName]采取行動！"
 rocc.23.d:0 "来自南京的消息！[From.GetName]拒绝接受中华民国政府交出军事和政治权力的要求，南京以下令派出军队，强制执行收回军权的命令！"
 
 rocc.30.t:0 "中華民國開始嘗試土地減租"
 
 rocc.31.t:0 "蒋中正当选中华民国总统"