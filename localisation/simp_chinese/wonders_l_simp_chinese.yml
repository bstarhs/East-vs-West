 AreciboTelescope:0 "阿雷西博天文望远镜"
 AreciboTelescope_desc:0 "阿雷西博天文望远镜位于波多黎各，是当时世界上规模最大的射电望远镜。"
 AswanDam1:0 "阿斯旺大坝一期工程·"
 AswanDam2:0 "阿斯旺大坝二期工程"
 AswanDam_quote:0 "埃及是尼罗河的礼物。/n——希罗多德"
 AswanDam_desc:0 "作为古埃及的发源地，千百年来，埃及人民在尼罗河涨潮时休息，河水退潮后，便在浸泡过的肥沃土地上耕种，然而这种传统的农业方式极不稳定，尼罗河水张超的规律不定，还时常干旱或发生洪涝。为了更好地利用好尼罗河，改善埃及的农业生产，在革命后的埃及共和国政府便计划在阿斯旺地区修建一座大坝。"
 AzadiTower:0 "波斯帝国纪念塔"
 AzadiTower_desc:0 "作为狂热的古波斯帝国爱好者，伊朗国王礼萨·巴列维一直推崇波斯帝国文化，这既是为了加强皇权，增加伊朗人的民族主义认同，也是为了对抗伊斯兰势力。上世纪七十年代，利萨·汗决定举办庆祝伊朗帝国建立2500周年的庆典，并为此大兴土木建造了一系列纪念设施，其中波斯纪念塔是最具代表性的一个，他很快便成为了首都德黑兰的地标，但在不久后，旨在推翻国王的伊斯兰革命也将从这里爆发。伊斯兰共和国成立后，这里便改名为阿扎迪塔，意为“自由塔”。"
 BabylonPalace:0 "巴比伦宫"
 BabylonPalace_desc:0 "伊拉克独裁者萨达姆·侯赛因不仅是一位阿拉伯民族主义者，同时也是一位古两河流域文明的崇拜者，萨达姆大力宣传伊拉克将继承古老的亚述和巴比伦帝国，在强化伊拉克自身的民族认同同时，也肇事着称霸中东的雄心。宏大豪华的巴比伦宫便是这一理想的代表，这是萨达姆建立在伊拉克各地的豪华行宫的统称，一共六处，都是模仿古巴比伦风格建立的，但最终只完成了巴格达一处的建造。2003年，巴格达的豪华行宫在战争中被摧毁，数年后其被修复并改造为有关萨达姆的博物馆。"
 Baikonur:0 "拜科努尔航天中心"
 BerlinTower:0 "柏林电视塔"
 BuculestiPalace:0 "布加勒斯特人民宫"
 BuculestiPalace_desc:0 "人民宫是一座位于罗马尼亚首都布加勒斯特的巨大宫殿式建筑，由罗马尼亚共产党领导人尼古拉·齐奥塞斯库下令建造，人民宫的建造花费巨大，使80年代本就不富裕的罗马尼亚经济雪上加霜，但齐奥塞斯库仍然坚持建造，但直到1989年，人民宫仍未完全完成。这一年的12月，齐奥塞斯库在人民宫的阳台上发表讲话，当天下午便被政变推翻杀死。人民宫在1993年才完全建造完成，并成为了欧洲占地面积最大的行政建筑。"
