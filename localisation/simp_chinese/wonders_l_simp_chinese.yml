 MaracanaStadium:0 "马拉卡纳足球场"
 MaracanaStadium_quote:0 "纵观历史,只有三个人能让马拉卡纳球场安静下来教皇、法兰克·辛纳屈、我。\n——阿尔喀德斯·吉贾(乌拉圭足球运动员)"
 MaracanaStadium_desc:0 "官方名称是小马里奥球场一一是以一名体育记者的名字命名一一但马拉卡纳球场这个名字更为人所熟知。该球场是里约热内卢市中心一个大型建筑群，于1948年开始修建，当时巴西刚刚获得国际足联世界杯的主办权,于1950年世界杯第一场比赛时投入使用。不幸的是在199854名狂热的球迷面前,在当时世界上最大(最吵)的球场里,被广泛看好的巴西队最后以1比2的比分输给了乌拉圭队。此后,马拉卡纳球场还主办过泛美运动会、世界杯、音乐会和文化活动,以及成千上万的足球比赛。"
 MonasMonument:0 "国家独立纪念塔"
 MotehrlandCalling:0 "祖国母亲的召唤"
 MotehrlandCalling_quote:0 "你的名字无人知晓，你的功绩永世长存。\n——无名烈士墓"
 MotehrlandCalling_desc:0 "祖国母亲的召唤是位于苏联伏尔加格勒，也就是斯大林格勒的一座巨大雕塑，为了纪念二战中伟大的斯大林格勒保卫战而建造。雕塑坐落在斯大林格勒保卫战时期战斗最激烈的马马耶夫岗上，巨大的祖国母亲站在无数苏联巨人战死的土地上，手持长剑，另一只手指向柏林。"
 NankingBriadge:0 "南京长江大桥"
 Ostankino:0 "奥斯坦金诺电视台"
 PearlOriental:0 "东方明珠"
 PearlOriental_desc:0 "东方明珠电视塔位于中国上海市浦东新区，是一座约米高的电视塔和观光旅游塔，作为上海市浦东区作为经济特区开放的一部分，在江泽民担任上海市长时期规划，并在他成为中共领导人后落成。东方明珠落成后成为亚洲最高的电视观光塔，以及重要的旅游目的地，如今已成为上海这一中国经济中心的名片。"
