 ShenzhenCenter:0 "深圳国贸大厦"
 ShenzhenCenter_desc:0 "深圳国贸大厦是位于中国深圳市罗湖区的一座商业中心，内有市场和交易所等。虽然国贸大厦本身不是特别宏大或复杂的建筑，但它确实深圳经济特区建立的象征。通过调动中国人民解放军士兵参与修筑，国贸中心仅用了8个月便建造完成，这被中国的官方媒体称作“深圳速度”。以“深圳速度”为口号，围绕深圳罗湖区的经济特区快速发展。"
