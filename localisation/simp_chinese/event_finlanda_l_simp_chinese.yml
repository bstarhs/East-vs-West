l_simp_chinese:
 finTEXT.1.t:0 "苏联提出针对芬兰的新政策"
 fin.1.d:0 "苏联政府提出涉及芬兰问题的新政策，莫斯科认为，只要芬兰不再支持任何针对苏联的军事行动，在国际问题上保持中立，与苏联维持友好关系，那么苏联就不会追求推翻芬兰现行制度和政策，包括不会支持芬兰共产党夺取政权。"
 
 fin.2.t:0 "苏联表态支持芬兰共产党"
 fin.2.d:0 "苏联政府发布公开宣言，指责芬兰政府对苏联仍然持有敌视态度，对苏联的国家安全带来潜在威胁。苏联将采取行动，寻求消除芬兰对苏联带来的威胁，例如建立一个亲近莫斯科的芬兰新政府。"
 
 fin.3.t:0 "准备进行国会选举"
 
 fin.4.t:0 "芬兰共产党赢得大选"
 fin.4.d:0 "经过激烈角逐，芬兰共产党最终赢得芬兰大选，宣布组织政府。帕锡基维总统讨好苏联政府以换取芬兰政治独立的努力宣告失败，共产党最终还是取得了芬兰政权。"
 
 fin.5.t:0 "芬兰国会选举结束"
 
 fin.6.t:0 "《苏芬友好协议》"
 fin.6.d:0 "外交部门已拟定了一份《苏芬友好协议》，包括要求芬兰的政治中立和加强两国经贸往来。"
 
 fin.7.t:0 "苏联提出《苏芬友好协议》"
 fin.7.d:0 "苏联政府向我们提出了一份新的协议，协议内容包括要求我国在未来的欧洲局势中保持中立、反对针对苏联的军事威胁、加强两国经贸往来等，作为回报，苏联将为我们提供军事和经济上的援助。"
 
 fin.8.t:0 "苏联与芬兰签署《苏芬友好协议》"
 fin.8.d:0 "苏联政府与芬兰签署了一份新的协议，协议内容包括要求芬兰在未来的欧洲局势中保持中立、反对针对苏联的军事威胁、加强两国经贸往来等，作为回报，苏联将为芬兰提供军事和经济上的援助。"
 
 fin.9.t:0 "芬兰拒绝《苏芬友好协议》"
 fin.9.d:0 "芬兰拒绝苏联提出的《苏芬友好协议》，决定走独立自主的外交道路。"
 
 fin.10.t:0 "对芬兰局势的关注"
 fin.10.d:0 "芬兰大选以共产党的胜利结束，这给欧洲自由国家敲响警钟，共产党的势力在欧洲的不断扩大已经威胁到了我们的利益，而他们夺取芬兰政权，意味着他们将继续扩大到北欧，这对我们来说是不可接受的，我们的外交和情报部门要求我们尽快进行干涉。"
 
 fin.11.t:0 "[From.GetName]声明抵制芬兰选举结果"
 fin.11.d:0 "[From.GetName]宣布抵制芬兰选举结果，斥责芬兰共产党非法夺取政权。"
 
 fin.12.t:0 "[From.GetName]声明接受芬兰选举结果"
 fin.12.d:0 "[From.GetName]宣布认可芬兰选举结果，承认了芬兰共产党组成的芬兰新政府。"
 
 fin.13.t:0 "苏联对芬兰进行渗透政策"
 fin.13.d:0 "当心！我们的情报机构发现苏联正在秘密支持芬兰共产党，帮助他们夺取政权！"
 
 fin.14.t:0 "芬兰共产党发动政变！"
 fin.14.d:0 "紧急情况！一伙自称为芬兰红军的武装分子突然进入赫尔辛基、图尔库等城市，袭击广播电台、政府机关等地，并包围了总统府。他们受到左翼势力指使，试图夺取政权！"
 
 fin.15.t:0 "芬兰共产党夺取政权！"
 fin.15.d:0 "来自赫尔辛基的紧急消息！一伙自称为芬兰红军的武装分子发动政变，控制了赫尔辛基、图尔库等城市并包围总统府，要求总统帕锡基维下台。帕锡基维为避免引发全国内战，被迫宣布辞职。芬兰共产党领导下的武装部队迅速控制了全国的政权，宣布成立临时革命政府！"
 
 fin.16.t:0 "支持芬兰民主派"
 fin.16.d:0 "来自赫尔辛基的紧急消息！一伙自称为芬兰红军的武装分子发动政变，控制了赫尔辛基、图尔库等城市并包围总统府，要求总统帕锡基维下台。芬兰政府拒绝屈服，调动武装部队进行镇压，第二次芬兰内战爆发了！"
 
 fin.17.t:0 "反共势力的暴动！"
 fin.17.d:0 "芬兰共产党夺取政权后，政治局势不断恶化，一些激进的右派团体开始组织武装部队，制造暴动。"
 
 fin.18.t:0 "芬兰救国军成立！"
 fin.18.d:0 "芬兰救国军在斯德哥尔摩宣布成立！这些芬兰右派武装得到了英美法西方国家的支持，宣布进行武装斗争，旨在抵抗芬兰共产党！"
 
 fin.19.t:0 "芬兰内战爆发！"
 fin.19.d:0 "来自芬兰的紧急消息！芬兰右派武装在图尔库、瓦萨等多个大城市发起暴动，占领了当地政府！芬兰救国军宣布，第二次芬兰内战已经开始，他们将武力推翻共产党和俄国傀儡，解救芬兰！"
 
 fin.20.t:0 "芬兰内战爆发！"
 fin.20.d:0 "来自赫尔辛基的紧急消息！一伙自称为芬兰红军的武装分子发动政变，控制了赫尔辛基、图尔库等城市并包围总统府，要求总统帕锡基维下台。芬兰政府拒绝屈服，调动武装部队进行镇压，第二次芬兰内战爆发了！"
 
 fin.21.t:0 "曼纳海姆将军抵达斯德哥尔摩！"
 fin.21.d:0 "面对国家存亡，年迈的芬兰民族英雄曼纳海姆将军从瑞士前往瑞典，接见了芬兰救国军的代表，并宣布成为救国军的名义领袖，支持同胞抵抗苏联和共产党统治！"
 
 fin.22.t:0 "救国军解放赫尔辛基"
 
 fin.23.t:0 "芬兰共产党被推翻"
 
 fin.24.t:0 "芬兰救国军退守奥兰群岛"
 
 fin.30.t:0 "卡尔·古斯塔夫·曼纳海姆去世"
 fin.30.d:0 "来自瑞士的消息，著名的芬兰民族英雄，曾在二战期间领导芬兰抵抗苏联入侵的卡尔·古斯塔夫·曼纳海姆，在洛桑养病期间去世。芬兰政府已宣布，该国将为这位伟大的芬兰人进行全国哀悼，不久之后，曼纳海姆的遗体将运回赫尔辛基进行国葬。"
 fin.30.a:0 "大炮，防线，国际援助，这些都不重要。一个士兵必须认识到：他，正在保卫自己的祖国。"
 
 fin.31.t:0 "芬兰前总统里斯托·海基·吕蒂去世"
 fin.31.d:0 "芬兰前总统里斯托·吕蒂因病去，享年67岁。吕蒂在第二次世界大战期间作为芬兰领导人，领导芬兰度过了冬季战争和继续战争，他与曼纳海姆元帅合作挫败了苏联对芬兰的入侵，但后来又与德国结盟，并在苏德战争中支持德国入侵苏联。吕蒂在二战结束后遭到苏联审判并入狱，后来又得到了芬兰政府的特赦。芬兰政府为吕蒂进行了国葬，这表明在绝大部分芬兰人心中，吕蒂依然是国家英雄。"
 fin.31.a:0 "他只是一个为保卫国家而战的人。"
 
 fin.32.t:0 "芬兰总统尤霍·巴锡基维去世"
 fin.32.d:0 "芬兰总统尤霍·库斯蒂·巴锡基维因病去世，享年86岁，总理乌尔霍·吉科宁接任芬兰总统。巴锡基维总统生前顶住压力，与苏联改善关系以实现芬兰的中立，而乌尔霍·吉科宁表示，他将延续这一政策。"
 fin.32.a:0 "派出代表团，悼念巴锡基维总统并祝福吉科宁总统。"
 
 fin.33.t:0 "让·西贝柳斯去世"
 fin.33.d:0 "芬兰，乃至欧洲最伟大的音乐家之一的让·西贝柳斯，在耶尔文佩因病去世，享年91岁。西贝柳斯的音译作品，被认为塑造了现代芬兰民族，他的《芬兰颂》、《卡累利阿组曲》唤醒了芬兰民族的历史和记忆。芬兰政府宣布，将为西贝柳斯举行盛大的国葬。"