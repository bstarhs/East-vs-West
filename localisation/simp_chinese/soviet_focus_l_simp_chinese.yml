 SOV_fishing_1:0 "发展渔业 I"
 SOV_fishing_1_tool:0 "所有地区海产品+25%"
 SOV_fishing_1_desc:0 "\n授人予鱼，不如授人予渔。\n——老子"
 SOV_fishing_2:0 "发展渔业 II"
 SOV_fishing_manufacture:0 "发展渔业副产品"
 SOV_fishing_manufacture_desc:0 "渔船将满满的渔获带回港口，这些收获并不仅仅只能成为人民餐桌上的食品，他们还拥有巨大的经济价值。鱼肉在被做成罐头、鱼饼、鱼油、鱼丸和蟹柳后，可以获得更高的附加价值和利润。鲸鱼骨头可以制作成工业材料，吃剩下的骨头还可以用于堆肥……渔业的经济价值还有很深的开发潜力。"
 SOV_fishing_manufacture_tool:0 "海产品可以提供额外的税收。增加海产品出口的利润。"
 
 SOV_develop_almaty:0 "建设阿拉木图"
 SOV_develop_almaty_desc:0 "阿拉木图是中亚第一大经济中心，该地区不仅有丰富的矿产资源，还有许多的劳动力可供工业生产需求，投资阿拉木图地区的发展，是我们将哈萨克斯坦建设为新的工业中心的第一步。 "
 SOV_develop_qaraganda:0 "建设卡拉干达"
 SOV_develop_qaraganda_desc:0 "卡拉干达是哈萨克斯坦北部的第一大工业重镇，该地区不仅有丰富的矿产资源，还有许多的劳动力可供工业生产需求，投资卡拉干达地区的发展，是我们将哈萨克斯坦建设为新的工业中心的第一步。 "
 SOV_develop_kyzyrorda:0 "建设锡尔河地区"
 SOV_develop_kyzyrorda_desc:0 "锡尔河是流经哈萨克斯坦、吉尔吉斯斯坦和乌兹别克斯坦的中亚重要河流，沿河有许多中亚地区的重要工业城市，而要供给这一地区的省市用水需求，需要大量的水利设施。"
 SOV_develop_kazakh_gasfield:0 "开发哈萨克斯坦油气田"
 SOV_develop_kazakh_gasfield_desc:0 "哈萨克斯坦的卡拉库姆沙漠拥有丰富的石油和天然气资源，对哈萨克斯坦燃气田的开发将有利于改善能源供给。"
 SOV_develop_kazakh_mineral:0 "开发哈萨克斯坦矿业"
 SOV_develop_kazakh_mineral_desc:0 "我们需要扩大哈萨克斯坦的煤炭和金属矿产的开采，使其足以供应我们的生产需求。"
 
 SOV_develop_uzbek_farm:0 "开发中亚耕地"
 SOV_develop_uzbek_farm_desc:0 "哈萨克斯坦的大片肥沃土地，至今还没有得到妥善利用，我们应当尽快投资开发这片土地，使其成为我们的重要粮食产地。处女地的开发将缓解苏联的粮食危机。"
 SOV_develop_turkmen_gas:0 "开发土库曼油气田"
 SOV_develop_turkmen_gas_desc:0 "土库曼斯坦的卡拉库姆沙漠拥有丰富的石油和天然气资源，对土库曼斯坦燃气田的开发将有利于改善能源供给。"
 SOV_develop_pamir_hydrodam:0 "开发帕米尔水利工程"
 SOV_develop_pamir_hydrodam_desc:0 "帕米尔高原有许多峡谷河流，适合建造水坝，应当将其利用起来，发展水利和水电设施，即可以满足能源需求，又可以为当地的农业和民用设施储存水资源。"
 SOV_develop_uzbek_cutton:0 "开发乌兹别克棉花种植"
 SOV_develop_uzbek_cutton_desc:0 "乌兹别克斯坦地区的自然条件十分适合发展棉花种植业，棉花不仅可以用于制作纺织品，还是生产无烟火药和聚合物的重要原材料。我们应该积极投资乌兹别克斯坦，支持他们扩大棉花种植面积，以保障我国棉花的自给自足。"
 SOV_develop_amu_river_project:0 "阿姆河灌溉工程"
 SOV_develop_amu_river_project_desc:0 "土库曼斯坦的油气田产区和乌兹别克的棉花产区，需要大量的水资源支持。阿姆河运河工程将建立一个庞大的水利系统，将喝水灌溉进入乌兹别克和土库曼的沙漠地区。"
 
 SOV_anti_nuke_movement:0 "支持反核运动"
 SOV_anti_nuke_movement_desc:0 "我国目前的核武器发展速度距离美国还十分落后，但我们注意到西方国家的许多左派人士和和平主义者正在进行反对核武器的政治运动，我们可以支持这项政治运动，让他们对美国政府施加压力，一定程度上能够减缓其核武发展速度。"
 SOV_World_Peace_Council:0 "世界和平理事会"
 SOV_World_Peace_Council_desc:0 "美帝国主义在世界各地制造事端，引起世界各国热爱和平的人民的一致反对。世界和平理事会将组织西方国家的进步人士、艺术家、政治家和科学家，揭露美帝国主义的侵略罪行并表达强烈的抗议。"
 
 SOV_contact_degaulle:0 "接触戴高乐政府"
 SOV_contact_degaulle_desc:0 "法国的戴高乐总统不愿意接受美国的摆布，正试图脱离北约，建立独立的外交政策和国防体系，这是一个机会，我们将与戴高乐政府进行接触，从而尝试将法国，这个西方国家中的核心成员，从帝国主义阵营中分离出去。"
 SOV_western_trade:0 "与西方的贸易"
 SOV_western_trade_conditon:0 "出口50以上任意种类的矿物资源"
 SOV_western_trade_desc:0 "随着我国与西方国家的关系有所改善，苏联与欧洲之间可以尝试开展贸易往来，他们需要石油，我们需要消费品。"
 SOV_western_invest:0 "引进西方投资"
 SOV_western_invest_desc:0 "随着苏联的社会稳定、经济得到发展以及外交地位的加强，一些外国投资者希望进入我国市场投资。"
 SOV_western_technical:0 "引进西方技术"
 SOV_western_technical_desc:0 "我们可以请求美国政府向我们出售科学技术，帮助我国科技发展和工业建设。"
 SOV_western_culture:0 "与西方的民间交流"
 prc_media_desc:0 "由于斯大林时期错误的文艺路线，导致我国民众对世界各国的发展状况缺乏理解，我们需要让人民群众睁眼看世界，了解各国的实际情况。引进外国的电影、电视剧等文化作品是一个不错的办法，有利于对外开放。"
 SOV_oil_for_goods:0 "石油换商品"
 SOV_US_trade:0 "发展美苏贸易"
 SOV_leather_trade:0 "出口皮草制品"
 SOV_output_kvas:0 "格瓦斯对决可口可乐"
 SOV_US_technical:0 "购买美国技术"
 SOV_US_technical_desc:0 "我们可以请求美国政府向我们出售科学技术，帮助我国科技发展和工业建设。"
 SOV_input_foods:0 "进口食品"
 
 SOV_reduce_violence_revolution:0 "减少对武装革命的支持"
 SOV_support_peace_socialist:0 "支持欧洲社会主义"
 SOV_support_peace_movement:0 "支持和平运动"
 SOV_support_leftwing:0 "支持欧洲左翼运动"
 
 SOV_purge_jews:0 "清洗犹太复国主义者"
 SOV_purge_jews_desc:0 "随着以色列建国，犹太复国主义在苏联兴起。许多犹太人失去了对苏维埃的忠诚，而去向往这个所谓的以色列祖国。尽快对苏联党和政府中的犹太人进行彻底的分割。"
 SOV_rebuild_orthodox:0 "重建东正教会"
 SOV_rebuild_orthodox_desc:0 "布尔什维克对东正教的残酷镇压已不复存在，俄罗斯人民再一次获得信仰基督耶稣的自由，再一次从上帝的手中获得福音。"
 SOV_islam_legalized:0 "伊斯兰教合法化"
 SOV_islam_legalized_desc:0 "布尔什维克对伊斯兰教的残酷镇压已不复存在，鞑靼人、哈萨克人和高加索人再一次获得信仰先知穆罕默德的自由，再一次从古兰经中获得真主的指引。"
 SOV_release_criminal:0 "释放政治犯"
 SOV_release_criminal_desc:0 "斯大林已死，内务委员会时代的强硬镇压政策也已经废除，那些因斯大林主义而蒙冤入狱的人应当被释放，这是让苏联走向法治和民主的第一步。"
 SOV_Perestroika:0 "改革重组"
 SOV_Perestroika_desc:0 "苏联的改革已经走到了关键的一步，苏联共产党的腐败、官僚主义和保守主义已经病入膏肓，简单的经济和社会改革已经无法挽救苏联，因此改革必须下猛药，开始更深入、更全面、更彻底的政治改革，将党中保守派的权力和影响力彻底根除，为改革派的完全掌权创造条件。"
 SOV_retrail_purge:0 "为大清洗平反"
 SOV_retrail_purge_desc:0 "斯大林统治时期，大量曾经为苏联革命和卫国战争作出重要贡献的政治家、元帅和艺术家遭到错误的政治迫害，最终蒙冤而死，作为打倒斯大林主义的重要一步，苏联政府需要为这些受害者平反，回复他们的名誉。"
 SOV_komparti_ideologies:0 "党员意识形态教育"
 SOV_komparti_ideologies_desc:0 "在政治和经济改革的过程中，一些党员的思想受到了西方意识形态和资本主义的影响，鼓吹修正主义、经济自由化、政治自由化，危害本党无产阶级先锋队的性质。为了保障马克思-列宁主义的指导地位，我们需要开展党员意识形态教育工作，让广大党员重新回到社会主义和共产主义的路线上。"
 SOV_parti_proretaria:0 "劳动阶级的党"
 SOV_parti_proretaria_desc:0 "布尔什维克党是劳动阶级的党，作为无产阶级的先锋队，为无产阶级服务。但是在苏维埃联盟数十年的发展过程中，许多党员干部出现了官僚化、贵族化的趋势，他们脱离生产，脱离群众，脱离工人阶级，这无疑对我们的执政和领导地位带来了不良影响。因此，我们应该改组党政，更多地鼓励工人、农民和战士入党，保障党的阶级性，保障党始终来自无产阶级，服务无产阶级。"
 SOV_proretaria_pioneers:0 "无产阶级先锋队"
 SOV_proretaria_pioneers_desc:0 "苏联共产党将进一步扩大无产阶级在我党中的影响力和权力，确保苏联共产党始终为无产阶级所掌握和领导。"
 SOV_labour_soviet:0 "工人代表苏维埃"
 SOV_labour_soviet_desc:0 "在革命时期，苏联共产党需要按照列宁主义理论，扮演无产阶级的先锋队，领导工人阶级进行政治斗争。而现在，苏联已经进入了发达社会主义阶段，我国的广大工人阶级的知识水平大幅提高，已经充分具备了参与政治工作的能力。因此，作为先锋队的党可以开始逐步放权，退居幕后，将权力交给由广大无产阶级直接选举产生的苏维埃。"
 SOV_supreme_soviet:0 "最高苏维埃"
 SOV_supreme_soviet_desc:0 "革命时期，为了保证革命的胜利和社会主义建设的进行，根据列宁的理论，布尔什维克党以先锋队的身份统领党政军所有事物，建立了事实上的一党政体，但现在，随着社会主义建设取得成果，经济、文化全面发达，内外部危机也不再有巨大威胁，也许，我们是时候考虑，让苏联共产党完成他们光荣的先锋队使命，结束党政体制，将国家的最高权力逐步从党政机构，移交给这个国家成立之初真正应该掌握权力的机构——工人、农民和士兵的最高苏维埃。"
 
 SOV_easteuro_UN:0 "东欧国家的国际地位问题"
 SOV_easteuro_UN_desc:0 "在第二次世界大战期间，匈牙利、罗马尼亚、保加利亚和芬兰被认为是纳粹德国的重要盟友，且没有参与《联合国宪章》的签署，因此，这些国家被西方国家长期排斥在联合国以外。现在，国际局势发生变化，这些曾经的轴心国现在已是社会主义国家的重要盟友，如果他们不能参与国际事务，那么就会危害社会主义阵营的国际地位。如果我们帮助这些国家加入联合国，不仅可以增加社会主义在联合国的席位，也可以强化莫斯科这些国家人民心中的威望。"
 
 SOV_disolve_plant_communies:0 "精简计划部门"
 SOV_disolve_plant_communies_desc:0 "随着我国的经济体制开始朝市场经济发展，庞大、冗杂、浪费资源且腐败低效的计划经济委员会将不再需要，我们将逐渐拆解、裁撤这些部门，将更多的权力交给市场，让党政官僚回家赋闲。"
 SOV_Rentabelnost:0 "利润、奖金和工资基金"
 SOV_Rentabelnost_desc:0 "随着斯大林式的计划经济被认为不再合理，人们开始探索新的经济体制。乌克兰经济学家埃弗赛·利别尔曼认为，应该将经济体制的中心从政府、计划委员会转移到企业上，并允许企业追求利润和销售作为企业发展的指标，如果企业达到指标，政府就应该给予奖金，使国家和企业之间的关系建立在利润分配之上，鼓励企业接受计划，挖掘生产潜力。"
 SOV_Rentabelnost_tool:0 "如果产量不能满足需求，民用消费品的产量可以额外§G+12%§W，但民用工厂的维护费也会额外§R+10%§W"
 SOV_awards:0 "完善奖励机制"
 SOV_awards_desc:0 "发达的社会主义体制下，优秀的劳动者应该获得更多的劳动报酬，以激励他们工作和创造。这不是资本主义的劳动异化，这是马克思主义所要求的，劳动者应该获得自己的劳动价值。"
 
 SOV_Uzbek_Zones:0 "中亚工业开发"
 SOV_Uzbek_Zones_desc:0 "哈萨克斯坦的煤矿、铁矿，乌兹别克的金矿和土库曼斯坦的天然气，使得中亚地区拥有巨大的发展潜力，应当支持将中亚草原打造成一个发达的工业基地。"
 SOV_new_5_plan:0 "新的五年计划"
 SOV_new_5_plan_desc:0 "新的时代和新的战争威胁要求我们制定新的五年计划，以加快工业化，尤其是军工业和电子工业的建设。"
 SOV_nationalized:0 "整合国有企业"
 SOV_nationalized_desc:0 "受到第二次世界大战的破坏，我们的国有企业在战后运转效率底下，还出现了地方的私有企业，我们需要对全国企业进行整合，改组国有企业，收回私有企业，以重新建立计划经济体制。"
 SOV_release_media:0 "允许民营媒体"
 SOV_release_media_desc:0 "我国的媒体都处于政府控制之下，这种不透明的传媒机制已成为官僚的工具，也不利于我们的民主改革。我们应当开发媒体管制，允许民间媒体创办并鼓励他们监督政府。"
 SOV_invest_techs:0 "支持科技产业"
 SOV_invest_techs_desc:0 "我们需要加大对科研的投入，新的科技不仅有利于改善生产效率、民众生活水平，也可以运用到军事上。"
 SOV_internet_focus:0 "发展信息工程"
 SOV_internet_desc:0 "利用计算机和电话线传播信息的互联网将成为未来科技中最重要的一环，我们必须尽快掌握互联网信息技术，并运用到生产生活上。"
 SOV_plannet_discorve:0 "外星探测工程"
 SOV_plannet_discorve_desc:0 "人类从不掩饰自己对掌握星空的欲望，现在随着火箭科技的发展，我们将可以把探测器发射到外太空，探索月球、火星和金星等熟悉又陌生的邻居。"
 SOV_moon:0 "开展登月计划"
 SOV_moon_desc:0 "太空竞赛进入白热化阶段，如果我们要获得领先地位，我们需要尽快开展登月计划，把我们的宇航员送到另一个星球。"
 SOV_semidoc:0 "发展半导体"
 SOV_semidoc_desc:0 "神奇的半导体材料可以制作出三极管的效果，但他的大小却可以细致到纳米级，掌握半导体可以大大缩小我们电子设备的体积，这在电子科技不断发展和应用的未来是至关重要的。"
 SOV_prc_fleet:0 "中苏联合舰队"
 SOV_prc_fleet_desc:0 "一方面我们大力支持中国的军事发展，但另一方面，面对帝国主义的威胁，还是将中国海军与我国太平洋舰队纳入同一个指挥系统中更好。"
 SOV_collective:0 "第二次农业集体化"
 SOV_collectived_desc:0 "受到第二次世界大战的破坏，我们的集体农场在战后运转效率底下，还出现了地方的自耕农和富农，我们需要对全国企业进行整合，改组集体农场，收回私土地，以重新建立计划经济体制。"
 SOV_supporet_oligarkh:0 "勾结寡头"
 SOV_supporet_oligarkh_desc:0 "苏联的计划经济已经崩溃，与其死守着已经停摆的国有企业，不如把他们出售给新兴企业家，给政府缓解财政压力。"
 SOV_strike_oligarkh:0 "限制寡头"
 SOV_strike_oligarkh_desc:0 "在经济改革期间，我们发现一些官员试图利用权力霸占国有企业，将其变为自己的私有财产，我们必须警惕并打击这种行为，否则国有资产将被洗劫一空。"
 SOV_personalized:0 "企业私有化"
 SOV_personalized_desc:0 "在经济改革开启后，是否坚持马克思列宁主义政策反对私有制经济，也成为一个值得探讨的话题。我国有许多实际上处于停摆状态的企业，与其继续给这些企业提供资金维持运作，不如把他们交给私人承担。"
 SOV_remove_islam:0 "清除伊斯兰教"
 SOV_remove_islam_desc:0 "伊斯兰教教义带有极端主义色彩，鼓吹圣战和宗教极端主义，对我国在中亚和高加索地区的管制带来严重威胁，必须采取强硬手段。"
 SOV_russianized:0 "推广俄语"
 SOV_russianized_desc:0 "所谓的少数民族与主体民族的文化、语言、信仰和生活方式如果不尽相同，就会成为叛乱的隐患，我们必须强制我国的所有公民都使用统一的语言文字和宗教信仰，才能团结国家。"
 SOV_total_plan:0 "计划经济总委员会"
 SOV_total_plan_desc:0 "随着我国计划经济和五年计划的推行，我们需要一个强有力的计划委员会，将全国所有生产计划纳入管理，全国统筹规划。"
 SOV_workers_militians:0 "工人民兵"
 SOV_workers_militians_desc:0 "国内外敌人都在盯着我们的经济生产，为了保护生产资料，我们需要把工人们武装起来，进行军事训练。"
 SOV_indSOV_to_agri:0 "工业反哺农业"
 SOV_indSOV_to_agri_desc:0 "随着我们的工业生产得到扩大，我们可以生产许多农业设备和化学品，并供应给集体农场，从而促进农业生产的扩大。"
 SOV_electronized:0 "苏联电气化工程"
 SOV_electronized_desc:0 "列宁同志早在生前就提出了将苏联全境普及电气化的重要性，现在战争结束，我们将重新启动这一宏伟的规划。"
 SOV_anti_lazy:0 "反怠工委员会"
 SOV_anti_lazy_desc:0 "在新一次五年计划建设的关键时刻，我们不允许有人掉链子。反怠工委员会将监督和惩罚没有完成生产计划的生产单位。"
 SOV_food_collection:0 "余粮收集制度"
 SOV_food_collection_desc:0 "早在内战时期，为了供应工业和军队的粮食消耗，苏维埃实行了粮食收集制度，强制农民上缴剩余口粮。如今新的工业和军事建设即将开启，对农产品的需求上升，我们也许需要重启这一制度，来满足工业的农产品需求。"
 SOV_limited_food:0 "物品配给制"
 SOV_limited_food_desc:0 "我们的物资供给远远不能满足不断上涨的物资需求，我们必须采取新的物资配给措施，民众必须持有官方发行的票券才能领取物资。"
 SOV_expand_work_time:0 "扩大工作时间"
 SOV_expand_work_time_desc:0 "为了加快生产速度，我们必须增加工人们的工作时间和工作强度。这一切都是为了苏维埃！"
 SOV_technologies_officers:0 "技官主义"
 SOV_technologies_officers_desc:0 "科学研究应当让科研人员专门负责，而不应该受到官僚主义的影响。我们需要打造一个由专业的科技人员组成的科研机构，使他们能够最大限度地投入到科学工作当中。"
 SOV_better_officers:0 "优化官员团队"
 SOV_better_officers_desc:0 "我们的政府当中存在着严重的官僚主义，我们雇佣了大量公务员却有着低效的政府部门，需要对政府部门和官员进行全方面的优化，优先选用高效的公务员并裁撤尸位素餐者。"
 SOV_reform_plan_communie:0 "改革计划委员会"
 SOV_reform_plan_communie_desc:0 "我们的计划委员会还有着许多缺陷，如果要让他们适应新的经济发展和社会发展，需要对计划委员会进行改革，包括改组机构，裁撤不合理的部门，并选用对新的经济发展有所了解的同志进入部门。"
 SOV_monarchs:0 "君主制的崛起"
 SOV_monarchs_desc:0 "共产主义在俄罗斯的全面崩溃，意为着我们必须从过去寻找国家的未来。布尔什维克已抱头鼠窜，所谓的民主党派正在争权夺利，答案十分明了——俄罗斯不能没有沙皇，只有一个稳定的君主体制，才能团结全国人民，才能将俄罗斯带回到彼得大帝、叶卡捷琳娜大帝和亚历山大一世时期的光荣。"
 SOV_tsar_back:0 "迎接沙皇回国"
 SOV_tsar_back_desc:0 "布尔什维克的统治已经终结，许多内战后流亡海外的俄罗斯同胞将回到祖国。沙皇堂弟基里尔大公是目前最正统的沙皇继承者，他们如果回到俄罗斯，将意味着对赤色革命的彻底否认。"
 SOV_local_leader:0 "重用加盟共和国官员"
 SOV_local_leader_desc:0 "作为一个多民族共同拥有的苏维埃联盟，我们也要多多注意来自加盟共和国的其他民族的官员，他们也将为苏维埃的建设奉献力量。"
 SOV_republics_autonomy:0 "提高共和国自治权"
 SOV_republics_autonomy_desc:0 "从莫斯科派到加盟共和国的俄罗斯族干部，总是不愿意去了解和尊重非俄罗斯族人的文化和生活习惯，闹出许多工作事故，破坏苏维埃各族人民之间的感情。基于这一点，我们认为应该进一步向加盟共和国下放行政权力，允许加盟共和国的苏维埃产生自己的苏维埃和政府，让当地人管理当地事务，既可以改善工作效率，又可以缓解地方矛盾。"
 SOV_total_party:0 "全民党"
 SOV_total_party_desc:0 "尽管列宁同志提出，布尔什维克党要成为工人阶级的先锋队，但随着国家的发展和政治形势的变化，苏联共产党作为苏联的执政党，不应当再只是代表一个阶级的利益，而是要代表苏联的所有公民。无论是工人，农民，士兵，知识分子，甚至是经济改革后出现的中小企业，党都要支持和保护他们的利益，争取各阶层广大群众的认可和拥护。"
 SOV_komsomal:0 "提拔共青团官员"
 SOV_komsomal_desc:0 "党的领袖必须跟进时代，应当从共青团中选拔年轻力壮的优秀党员进入中央。"
 SOV_keep_revolution:0 "继续革命主义"
 SOV_keep_revolution_desc:0 "革命永远不会结束，即便是社会主义国家，依然有可能出现新的统治阶级和剥削阶级，党政官僚、工人贵族、走资派、修正派……反对剥削阶级的斗争不会停止，革命仍将继续。"
 SOV_common_leaders:0 "集体领导"
 SOV_common_leaders_desc:0 "斯大林式的个人独裁和个人崇拜已被打倒，为了避免重蹈覆彻，党应该实行政治局各委员同志们的集体领导，保障民主集中制。"
 SOV_reform_judgement:0 "改革监察委员会"
 SOV_reform_judgement_desc:0 "经济发展和官僚主义带来了腐败的威胁，我们必须严厉惩处腐败，以维护党的威望和经济发展成果。"
 SOV_reform_judgement_tool:0 "在出现反腐类事件时，缉拿腐败的成功率和奖励更高"
 SOV_judgement_reformed:0 "强化后的监察委员会"
 SOV_reform_militsia:0 "改革内务部"
 SOV_reform_militsia_desc:0 "苏联需要改革治安系统，改善警察队伍的执法和侦察能力，以维护社会稳定。"
 SOV_debate_white_army:0 "平反白军"
 SOV_debate_white_army_desc:0 "随着布尔什维克的统治彻底崩溃，我们是时候为曾今抵抗布尔什维克的爱国英雄们恢复名誉了。"
 SOV_neonazis:0 "平反俄罗斯解放军"
 SOV_neonazis_desc:0 "以安德烈·弗拉索夫将军为领袖的俄罗斯解放军曾经为抗击斯大林布尔什维克统治而战，既然布尔什维克已经倒台，那么就应该公正地评价俄罗斯解放军。"
 SOV_clear_reds:0 "禁止左翼活动"
 SOV_clear_reds_desc:0 "苏维埃政权已经崩塌，但仍有一些左翼分子还在宣传和扩大共产主义的影响力，需要立法打击他们的活动。"
 SOV_decommunized:0 "清算共产主义"
 SOV_decommunized_desc:0 "布尔什维克暴政统治俄罗斯数十年，犯下无数血腥屠杀和迫害人权的罪行。我们需要将真相公布，并向全国全世界揭露他们的罪行，瓦解对布尔什维克的一切崇拜，惩治布尔什维克党分子。"
 SOV_united_russia:0 "俄罗斯团结党"
 SOV_united_russia_desc:0 "苏联瓦解后的俄罗斯陷入政治动荡，各种党派互相攻伐，把国家搞得乌烟瘴气，为了避免俄罗斯再一次陷入内战，我们必须停止不合理的民主实验，重新建立一个强有力的执政党，来整合与稳定国家。"
 SOV_presidential:0 "强化总统权力"
 SOV_presidential_desc:0 "为了维护国家稳定，打击利用民主化的余波谋取利益的党派和议会，俄罗斯联邦总统的权力需要进一步加强。"
 SOV_demoratic_party:0 "俄罗斯民主化"
 SOV_demoratic_party_desc:0 "俄罗斯经历了巨大的代价，才打倒布尔什维克，迎来民主与自由，我们不能让一切付出都被浪费，我们需要尽快完善俄罗斯的民主制度，包括限制总统权力，明确议会地位，防止出现新的独裁制度。"
 SOV_Stakhanov:0 "新的斯达汉诺夫"
 SOV_Stakhanov_desc:0 "资本主义国家的残酷剥削强迫工人努力为生产资料的所有者生产更多的商品。在我们国家，像阿列克谢·斯达汉诺夫这样的工人则是自己自主地努力劳动，因为他们明白，每一块砌好的砖，每一吨开采出的煤，每一颗安好的铆钉都在帮助建立一个使工人从剥削中彻底解放的世界。"
 SOV_accept_lefts:0 "接受其他左派观点"
 SOV_accept_lefts_desc:0 "社会主义不是宗教，没有正统教会一说，任何支持无产阶级社会主义发展的政治学说，都可以被接受，都可以参与到苏联的建设和发展当中。我们不仅将重新接纳托洛斯基主义，甚至还可以接受毛主义、铁托主义……"
 SOV_develop_kazakh:0 "开发哈萨克斯坦耕地"
 SOV_develop_kazakh_desc:0 "广袤的哈萨克斯坦草原之下，是肥沃的耕地，但现在那里只有一片荒芜和游牧民族。为了获得更多粮食，我们将开发哈萨克斯坦的耕地，将那里从草原变成一大片金色的麦田。"
 SOV_develop_ukraine:0 "开发乌克兰耕地"
 SOV_develop_ukraine_desc:0 "乌克兰拥有欧洲最肥沃的土地，黑色的土地和金色的麦田滋润了一代又一代斯拉夫人，我们将进一步开发乌克兰的耕地，把这里变成苏维埃最重要的粮食基地。"
 SOV_debt:0 "发行国债"
 SOV_debt_desc:0 "向群众出售国家债券以充实国库。"
 SOV_disable_gulag:0 "废除古拉格"
 SOV_disable_gulag_desc:0 "古拉格是斯大林时期国家经济和法制落后的产物，新时代的苏联不再需要强制劳动营。"
 SOV_expand_comissor:0 "强化政委制度"
 SOV_expand_comissor_desc:0 "通过在红军中设立政委并扩大政委的权力，来确保党对军队的绝对领导。"
 SOV_expanded_KGB:0 "扩大克格勃情报网"
 SOV_expanded_KGB_desc:0 "克格勃特工将无孔不入地收集情报，对抗敌特渗透，也渗透敌国。"
 SOV_develop_submarines:0 "发展潜艇作战"
 SOV_develop_submarines_desc:0 "潜艇舰队可以绕道北大西洋，出其不意地撅北约的屁股。"
 SOV_tactical_missiles:0 "发展战术核弹"
 SOV_tactical_missiles_desc:0 "核弹不仅可以摧毁敌人后方的城市，中小当量的核弹也可以用于前线摧毁敌人的武装力量。"
 SOV_expand_mikoyan:0 "赞助米高扬设计局"
 SOV_expand_mikoyan_desc:0 "米高扬设计局是苏联最优秀的战斗机设计局，他们将成为我们空中武装力量的重要技术支持者。"
 SOV_supersonic_fighter:0 "发展超音速战斗机"
 SOV_supersonic_fighter_desc:0 "我国的战斗机设计并不落后于北约国家，先进的超音速战斗机将在空战中获得巨大优势。"
 SOV_develop_naval_equipment:0 "发展海军装备"
 SOV_develop_naval_equipment_desc:0 "一支强大的海军，不止要拥有战舰的数量，还要发展战舰上的武器和设备，主炮、雷达、近防炮、电子设备、动力设备……"
 SOV_develop_nuclear_carrier:0 "发展核动力航空母舰"
 SOV_develop_nuclear_carrier_desc:0 "强大的核动力发动机可以让我们的航空母舰舰队航行至世界的每一个角落。"
 SOV_develop_carrier:0 "发展航空母舰"
 PSOV_develop_carrier_desc:0 "第二次世界大战的海上战争，航空母舰大放异彩。巨舰大炮的时代已被淘汰，舰载机将主宰未来地球70%的天空！"
 SOV_develop_nuclear_sub:0 "发展核潜艇"
 SOV_develop_nuclear_sub_desc:0 "强大的核动力发动机可以让我们的战略潜艇舰队航行至世界的每一个角落。"
 SOV_develop_nuclear_ship:0 "发展核动力战舰"
 SOV_develop_nuclear_ship_desc:0 "强大的核动力发动机可以让我们的舰队航行至世界的每一个角落。"
 SOV_develop_medium_ship:0 "发展中型舰艇"
 SOV_develop_medium_ship_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 SOV_develop_submarine:0 "发展潜艇"
 SOV_develop_submarine_desc:0 "潜艇在海战中有着不可比拟的优势。一条设计精良的现代潜艇在发射鱼雷前几乎是不可探测的，同时还有潜力重创造价与大小数倍于己的主力舰。我们应当专注于建造潜艇以作为海战攻势的主力。"
 SOV_mitran_fleet:0 "进入北大西洋"
 SOV_black_fleet:0 "建设黑海舰队"
 SOV_black_fleet_desc:0 "黑海可能看起来像个次要战区。但是如若我们失去了对黑海的控制，我们南部的大片领土都将暴露于敌人的入侵之下，就像克里米亚战争中发生过的那样。为了不让这种情况再次发生，我们需要强化该区域的海军基地。"
 SOV_pacific_fleet:0 "建设太平洋舰队"
 SOV_pacific_fleet_desc:0 "日本得到美国的支持后，继续威胁着我们的远东领土，我们需要进一步建设太平洋舰队，既是为了防御，也是为了向亚洲扩大我们的影响力。"
 SOV_northic_fleet:0 "建设北方舰队"
 SOV_northic_fleet_desc: "摩尔曼斯克位于北极圈以北，但讽刺的是，它是我国唯一的全年不冻港，且这个港口可以通往公海。我们应该进一步发展这里，以更好地与全世界交通。"
 SOV_baltic_fleet:0 "建设波罗的海舰队"
 SOV_baltic_fleet_desc:0 "波罗的海舰队基地的防护很差。我们应该投入一些资源以保护它的锚地，并提高它的舰船修复能力。"
 SOV_develop_light_ships:0 "发展轻型舰艇"
 SOV_develop_light_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 SOV_develop_naval_base:0 "扩大海军设施"
 SOV_develop_naval_base_desc:0 "我国的海军力量不断壮大，对海军设施的现代化要求也越来越高。"
 SOV_develop_naval:0 "发展海军"
 SOV_develop_naval_desc:0 "让我们传承彼得大帝的遗产，建立世界上最伟大的海军！"
 SOV_develop_nulcear_bomber:0 "核动力轰炸机"
 SOV_develop_nulcear_bomber_desc:0 "如果使用核反应炉作为飞行器的动力，不仅可以大大增加飞行器的航程，而且可以增加其体积。"
 SOV_develop_military_electro:0 "发展电子装备"
 SOV_develop_military_electro_desc:0 "许多在二战时期出现的各种军事发明，在二战后被美苏等大国运用到实战中，例如直升机、导弹、复合装甲、机械化车辆以及合成材料制作的装备等。军事科技是不断发展的，如果我们在军事研究上停滞不前，就随时可能落后。"
 SOV_develop_strategic_bomber:0 "发展战略导弹部队"
 SOV_develop_strategic_bomber_desc:0 "德国在二战中发明的V2火箭令我们眼前一亮，这种火箭如果能装载核武器，使其能够更快、更准的发射到地球的另一端，那么战争的历史、人类的历史都将为此改变。"
 SOV_develop_bomber:0 "发展轰炸机"
 SOV_develop_bomber_desc:0 "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 SOV_develop_anti_air:0 "发展防空军"
 SOV_develop_new_fighter:0 "发展新一代战斗机"
 SOV_develop_new_fighter_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 SOV_jet_fighters:0 "发展喷气式战斗机"
 SOV_jet_fighters_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 SOV_develop_air_force:0 "发展空军"
 SOV_develop_air_force_desc:0 "我们生来，为征服辽阔天空\n我们故事，由后代来传颂\n人类智慧给我钢铁手臂翅膀\n喷火马达是我强劲心脏\n那就更高，更高，要更高！\n拉起我们心爱的飞机\n每一丝螺旋桨的呼吸\n保卫四方国境线安宁"
 SOV_strike_corrupt:0 "打击腐败"
 SOV_strike_corrupt_desc:0 "我们曾经寄予厚望的党开始变质，贪婪的蛀虫遍布我们的国家，他们盗窃国家的财产，欺压人民，享受着奢侈的生活，而将人民，将共产主义和社会主义抛到脑后……这些无耻的窃贼正在蚕食苏维埃共和国的生命，如果放任不管，那么迟早有一天，祖国的命运将在这些人手中被葬送……\n我们必须尽快开始采取强硬的手段打击腐败，我们必须不惜一切代价地将他们从党内剔除出去，无论他们的等级多么的高，无论他们背后是谁在支持，都必须在法律面前低头。\n没有一个因团结和铁腕纪律而强大的党，无产阶级专政的实现和维持是不可能的。"
 SOV_limited_leadership:0 "设立领导人任期"
 SOV_limited_leadership_desc:0 "作为一个共和国，像斯大林那样的领导人终身制不仅不合时宜，且党内存在大量的老人干部，会使得党失去发展的动力。有鉴于此，应当正式设立领导人的任期机制，使任期任满的干部强制退休，将职位让给时代的新人。"
 SOV_expand_computer:0 "扩大计算机使用"
 SOV_expand_computer_desc:0 "我国在计算机技术的发展和制造中取得成果，现在让这些先进的设备投入到企业、军队、政府单位和人民的家庭中去工作和服务。"
 SOV_control_system:0 "研究控制论"
 SOV_control_system_desc:0 "在有关如何发展及完善计划经济的讨论当中，控制论是一个尤其引人注目的话题。许多苏联科学家和数学家认为，通过将全苏联所有的生产系统集中进行控制，建立一个高度集中、高效收集、处理和传播信息的中枢系统，来代替臃肿的计划委员会以管理全国经济生产，是未来计划经济发展的重要方向，而当计算机技术得到发展后，控制论开始变得有可行性。"
 SOV_reform_plan_economic:0 "发展计划经济"
 SOV_reform_plan_economic_desc:0 "苏维埃统筹规划下的计划经济体制确实为我国带来了快速的工业化发展，因此我们只需要改良其部分弊端并完善制度，计划经济就能继续实行下去，成为比资本主义市场经济制度更先进的社会经济体制。"
 SOV_stalinism_focus:0 "坚持斯大林主义路线"
 SOV_stalinism_focSOV_desc:0 "伟大的斯大林同志和他的路线，不仅为苏维埃联盟带来了工业化，还打败了法西斯，使我们成为超级大国。即使是在斯大林同志离开后，我们也将继续这一路线。"
 SOV_expanded_industrial:0 "扩大工业化"
 SOV_expanded_industrial_desc:0 "我们与帝国主义之间的矛盾与日俱增，新的世界大战随时可能爆发，为了在新的军事冲突中保持优势，我们需要提前做好军事上和经济上的准备。这一次我们面对的英、美、法帝国主义联军，他们的军事工业比法西斯德国更加发达，这要求我们建立一个更加庞大的军事工业系统。"
 SOV_china_pro_sov:0 "扶持亲苏派"
 SOV_china_pro_sov_desc:0 "毛泽东也许并不是一位值得我们支持到底的盟友，他本人有很大的民族主义倾向，他希望建立一个强大的中国，而我们与中国之间还存在领土与路线争端……这意味着终有一天，我们和毛之间的关系会破裂。因此，我们也许需要与中共党内那些反对毛泽东的反对派建立关系，以等待需要他们的时候。"
 SOV_auto_industrial:0 "发展汽车工业"
 SOV_auto_industrial_desc:0 "汽车！汽车！\n他无处不在\n即使是在古老的尘土中\n也有汽车留下的印记"
 SOV_FocusOnConsumerProducts_2:0 "发展民用工业 III"
 SOV_FocusOnConsumerProducts_2_desc:0 "让我们竞争吧。能够给人民提供更多商品和服务的制度就是更好的制度，也必将获胜。\n——尼基塔·赫鲁晓夫"
 SOV_FocusOnConsumerProducts_3:0 "发展民用工业 IV"
 SOV_FocusOnConsumerProducts_3_desc:0 "发展民用工业 IV"
 SOV_manchuria_revolt:0 "支持满洲暴动"
 SOV_manchuria_revolt_desc:0 "我们与中国政府的关系正在不断恶化，我们可以通过支持满洲地区的一些反政府分子，来给中国制造麻烦。"
 SOV_inner_mongol:0 "支持内蒙人民党"
 SOV_inner_mongol_desc:0 "我们与中国政府的关系正在不断恶化，我们可以通过支持内蒙古的分离主义者，来给中国制造麻烦。"
 SOV_support_east_turkistan:0 "支持东突厥斯坦"
 SOV_support_east_turkistan_desc:0 "我们与中国政府的关系正在不断恶化，我们可以通过支持新疆地区的维吾尔和哈萨克分离主义者，来给中国制造麻烦。"
 SOV_support_spain_communism:0 "支持西班牙葡萄牙共产党"
 SOV_support_spain_communism_desc:0 "多年前的西班牙内战以民主势力的失败告终，但随着二战后新一次的社会主义革命风潮到来，我们将再一次支持西班牙人民反抗法西斯。"
 SOV_support_turkish_communism:0 "支持土耳其共产党"
 SOV_support_turkish_communism_desc:0 "土耳其共产党正在发起反对英美傀儡政权的武装斗争，我们需要支持他们，以扩大我们在地中海的影响力。"
 SOV_support_france_communism:0 "支持法国共产党"
 SOV_support_france_communism_desc:0 "法国是欧洲革命之父，在第二次世界大战之后，法国共产党和法国的左翼势力不断兴起，他们将是我们影响这一北约重要成员国的代理人。"
 SOV_voyna_i_mir:0 "战争与和平"
 SOV_voyna_i_mir_desc:0 "我们与西方国家之间的对抗，不仅是军事、政治和经济对抗，还有文化上的对抗。美国人用好莱坞电影输出他们的意识形态，用电影来粉饰资本主义国家的社会生活，而我们亦可以针锋相对，通过电影和文化产业来展现社会主义制度的优势。"
 SOV_voyna_i_mir_tool:0 "可以通过决议拍摄《战争与和平》电影四部曲，每完成一部，都可以获得政治点数、外交影响力和共产主义支持率奖励。"
 
 SOV_support_africa:0 "苏联军事支援"
 SOV_support_africa_desc:0 "非洲国家独立建国之初，需要大量的经济、物资和技术援助，我们必须尽快与他们建立合作，并通过经济和政治影响，使得非洲各国向社会主义靠拢，以抵抗帝国主义在非洲的反弹。"
 SOV_InfiltrationGreece:0 "渗透希腊"
 SOV_InfiltrationGreece_desc:0 "希腊共产党正在发起反对英美傀儡政权的武装斗争，我们需要支持他们，以扩大我们在地中海的影响力。"
 SOV_ReformingPolitics:0 "政治改革"
 SOV_ReformingPolitics_desc:0 "邪恶的法西斯战争机器已经被打倒，但新的挑战正等待着苏维埃。我们必须尽快整顿我们的党政部门，使其能够应对新的时代。"
 SOV_TurkStraite:0 "索取土耳其海峡通行权"
 SOV_TurkStraite_desc:0 "数十年前，俄罗斯帝国曾与土耳其达成关于同行土耳其海峡的协定，但这份协议并不完美，现在我们如果要把势力范围延伸到黑海之外，那就必须让土耳其政府修改协议。"
 SOV_Relation_Norway:0 "争取挪威中立"
 SOV_Relation_Norway_desc:0 "挪威在欧洲的地理位置极其重要，其位于我们北冰洋舰队通往大西洋的通路上，如果挪威加入西方阵营，我们的大西洋航路就会被掐断。我们可以尝试主动与挪威改善关系，争取其中立态度，使其不加入美国主导下的同盟，作为交换，我国尊重和保护挪威的中立地位和领土安全。"
 SOV_Invade_Norway:0 "渗透挪威"
 SOV_Invade_Norway_desc:0 "挪威在欧洲的地理位置极其重要，其位于我们北冰洋舰队通往大西洋的通路上，如果挪威加入西方阵营，我们的大西洋航路就会被掐断。我们可以尝试接触挪威的左派势力或者分离主义势力，向他们提供支持，帮助他们颠覆挪威的亲西方政府，并建立亲苏联的政权。"
 SOV_EasternEuropeanGroup:0 "东方阵营"
 SOV_EasternEuropeanGroup_desc:0 "苏联红军在第二次世界大战中，解放了从柏林到巴尔干的广大东欧地区，并支持这里的无产阶级建立了人民政权。现在新的对抗正在形成，欧洲的社会主义国家们必须团结起来。"
 SOV_EasternEuropeanGroup_tt:0 "§Y联盟将向首都位于欧洲的所有共产主义国家派遣驻军。§!"
 SOV_Asianpolicy:0 "亚洲政策"
 SOV_Asianpolicy_desc:0 "二战结束后，共产主义在亚洲地区的影响力不断扩大，中国共产党在内战战场上势如破竹，朝鲜、日本和东南亚的革命也蓬勃发展，我们应当积极支持亚洲同志们的革命运动。"
 SOV_IntoTheAmericas:0 "影响美洲"
 SOV_IntoTheAmericas_desc:0 "拉丁美洲人民长期处于美帝国主义，以及他们支持的垄断资本及独裁军政府的统治下，但随着世界民族解放运动发展，拉美的民主进步人士开始进行反对帝国主义和独裁政府的运动，我们应当与他们进行积极的接触。"
 SOV_EconomicChange:0 "经济改革"
 SOV_EconomicChange_desc:0 "斯大林模式为代表的高度集中体制已不适合苏维埃未来经济发展的需求，我们需要尽快改革经济体制，执行更灵活、更合理的经济政策。"
 SOV_StrengtheningNationalDefenseConstruction:0 "国防建设"
 SOV_StrengtheningNationalDefenseConstruction_desc:0 "的二次世界大战证明了，战争的胜利依赖综合国力，尤其是军事工业的支持，现在世界局势再次紧张起来，我们需要重建，并扩大我们的军工产业，尤其是要注意新的军事科技的开发。"
 SOV_RemovingStalinization:0 "去斯大林化"
 SOV_RemovingStalinization_desc:0 "随着斯大林的死亡，我们是时候重新看待这个人对苏联的影响了。计划经济、大清洗、古拉格和个人崇拜都是斯大林留下的错误遗产，必须将他们完全清除。"
 SOV_RemovePersonalWorship:0 "去个人崇拜"
 SOV_RemovePersonalWorship_desc:0 "斯大林式的个人崇拜使苏联政府变成无能的官僚机器，必须去除斯大林的影响才能使其重新焕发活力。"
 SOV_OpenArts:0 "文化解冻"
 SOV_OpenArts_desc:0 "斯大林时期，艺术创作曾经因为受政治影响而遭到压力，而作为去斯大林化的一部分，我们将重新指定我们的文艺政策，鼓励艺术家们进行更为自由的创作。"
 SOV_Glasnost:0 "政治开放"
 SOV_Glasnost_desc:0 "我们已经按照列宁和斯大林的模式统治了这个国家数十年，但现在，随着政治、经济和社会的危机不断恶化，我们是时候考虑做出改变了。"
 SOV_AccessionStatesAutonomy:0 "新联盟条约"
 SOV_AccessionStatesAutonomy_desc:0 "随着政治改革的推进，联盟内的非俄罗斯民族开始寻求自治权，为了安抚民族主义情绪，我们可以尝试将联盟改为联邦制，以维护苏联的存续。"
 SOV_RevocationOfAnAffiliate:0 "撤销加盟国"
 SOV_RevocationOfAnAffiliate_desc:0 "在苏联创立初期，为了争取非俄罗斯族的支持，我们允许其他民族创立自己的苏维埃共和国作为社会主义共和国联盟的组成部分，但随着苏联政治局势变化，各民族之间的文化和生活差异已逐渐减小，我们应该撤销部分不必要的苏维埃共和国，将其列入莫斯科直接管辖之下。"
 SOV_SoutheastAsianRevolution:0 "支持东南亚革命"
 SOV_SoutheastAsianRevolution_desc:0 "从印度支那到马来亚，东南亚人民反对帝国主义、殖民主义及其傀儡的斗争如火如荼，他们迫切需要我们的支援！"
 SOV_InfiltratingThePhilippines:0 "渗透菲律宾"
 SOV_InfiltratingThePhilippines_desc:0 "菲律宾是美国在亚太地区最重要的代理人，该国的群岛之间有许多革命武装在反对亲美政权。"
 SOV_Infiltration_Thailand:0 "渗透泰国"
 SOV_Infiltration_Thailand_desc:0 "泰国军事独裁政府正不断接近美帝国主义，我们应当支持泰国的左翼游击队反对军政府。"
 SOV_Infiltration_Indonesia:0 "接触印度尼西亚"
 SOV_support_Indonesia:0 "介入东印度群岛战事"
 SOV_support_Indonesia_desc:0 "东印度群岛的人民正在反抗帝国主义的侵略与殖民统治，我们应当帮助他们！"
 
 SOV_Japan_Soviet_alliance:0 "日苏友好条约"
 SOV_Japan_Soviet_alliance_desc:0 "日本右翼政权已被彻底打倒，日本人民迎来了真正的民主、和平与解放，但这个新生的民主日本十分脆弱，需要苏联人民的支持和协助。"
 SOV_SubversionOfJapan:0 "颠覆日本"
 SOV_SubversionOfJapan_desc:0 "日本政府已完全处于美帝国主义控制当中，他们不仅充当美国在亚洲扩张的核心，并且本身也对我国在远东的利益带来威胁。必须颠覆日本政府。"
 SOV_Japan_SovietRelationsNormalization:0 "日苏关系正常化"
 SOV_Japan_SovietRelationsNormalization_desc:0 "尽管日本仍处于保守政府控制当中，但我们不可能与这个重要的远东邻国永远断绝关系，随着日本的局势日渐稳定，我们应该考虑恢复我们与东京之间的外交关系。"
 SOV_Corn:0 "玉米运动"
 SOV_Corn_desc:0 "集体化运动和第二次世界大战给苏联的农业生产带来了毁灭性破坏，即使在二战结束数年后，我们的民众依然无法实现完全的温饱生活，而美国人却在享受大鱼大肉。这绝对不可接受，我们必须尽快改善我们的农业生产状况。赫鲁晓夫统治在乌克兰尝试玉米种植获得了成功，这种作物不仅成本小、产量大，且可以作为饲料供给牲畜，应该尝试在苏联其他地区推广玉米种植。"
 SOV_Food_Programme:0 "食品计划"
 SOV_Food_Programme_desc:0 "食品计划是苏联政府在十一五计划期间提出的一系列增加农产品产量的措施，包括改组农村的官僚机构、增加农村地区的基础设施建设等。"
 SOV_Food_Programme_tool:0 "所有拥有2座以上农场的省份+2基础设施"
 SOV_CornMovement:0 "玉米运动"
 SOV_CornMovement_desc:0 "玉米是一种被世界各国广泛种植的重要农作物，玉米本身不仅可以作为主食，其茎叶可以作为动物饲料，其杆可以作为燃料使用……总之，玉米的用处十分广泛，如果要解决我国的农业产量长期滞后的问题，扩大玉米种植是一个可以尝试的方案。"
 SOV_Mir:0 "和平号"
 SOV_Mir_desc:0 "人类远征太空的重要一步，就是建造在宇宙中的落脚点。建造空间站，使其成为人类在太空的基地，宇航员可以在此休息、补给、从事研究活动，甚至长期居住。"
 SOV_CooperationWithTheUnitedStates:0 "国际合作"
 SOV_AdhereToStalinism:0 "坚持斯大林主义"
 SOV_AdhereToStalinism_desc:0 "卫国战争的胜利和工业化的成就证明了斯大林同志的政策是正确的，即使在他身后，我们也将继续执行这一路线。"
 SOV_NewLeader:0 "新的领袖"
 SOV_NewLeader_desc:0 "即使经过了去斯大林化，苏联依然需要一位领袖来团结整个党和国家。"
 SOV_KGB:0 "成立克格勃"
 SOV_KGB_desc:0 "情报仍然是最重要的军事手段之一，我们需要把现有的内务委员会进行重组，改编为新的国家安全部以对抗帝国主义渗透。"
 SOV_RedTerror:0 "第二次大清洗"
 SOV_RedTerror_desc:0 "斯大林同志是对的，对反动派讲任何人道都是对自己的背叛。上次没杀干净，这次杀多点。"
 SOV_SocialistArt:0 "社会主义艺术"
 SOV_SocialistArt_desc:0 "由工人阶级创造出的社会主义进步艺术，将取代落后腐朽的封建宗教艺术和资本主义艺术。"
 SOV_FosteringEastGermany:0 "建立民主德国"
 SOV_FosteringEastGermany_desc:0 "英、美、法帝国主义勾结德国西部的法西斯余孽，试图将我国排除在外后，单方面在德国西部成立傀儡政权。既然西方国家已经将德国问题挑明，那我们也需要尽快有所行动，支持德国东部的共产党人和其他左翼人士，建立新的德意志民主政权。"
 SOV_CommunistPartyAndWorkersIntelligenceBureau:0 "共产党和工人党情报局"
 SOV_CommunistPartyAndWorkersIntelligenceBureau_desc:0 "二战后的欧洲各国，社会主义运动风起云涌，我们需要成立一个情报部门，为这些国家的共产主义政党提供支持。"
 SOV_WarsawPact:0 "华沙条约"
 SOV_WarsawPact_desc:0 "西方帝国主义国家正威胁着东欧新生的社会主义政权，我们需要将东欧的社会主义军事力量统一起来，共同对抗西方的军事威慑。"
 SOV_Brezhnevism:0 "有限主权论"
 SOV_Brezhnevism_desc:0 "作为社会主义阵营的领袖，苏联拥有社会主义大家庭中的老大哥地位，为了保证社会主义大家庭不受帝国主义侵害，其他的社会主义国家必须牺牲部分国家主权，以维护我们的稳定"
 SOV_StrengtheningControlOverEasternEurope:0 "索取西柏林"
 SOV_ImproveYugoslavia:0 "修复与南斯拉夫关系"
 SOV_ImproveYugoslavia_desc:0 "修复与南斯拉夫关系"
 SOV_InfluenceYugoslavia:0 "渗透南斯拉夫"
 SOV_InfluenceYugoslavia_desc:0 "尽管同是社会主义国家，但南斯拉夫在铁托集团统治下，不仅拒绝向莫斯科靠拢，反而开始接近北约，这是我们不能接受的。我们将尝试与南斯拉夫国内的亲苏联势力进行接触，以待未来对他们提供支持。"
 SOV_PenetratingGreeceAndTurkey:0 "渗透希腊与土耳其"
 SOV_PenetratingGreeceAndTurkey_desc:0 "希腊与土耳其正在接近西方阵营，我么不能让北约吸收这两个扼守东地中海、黑海和中东关键位置的国家。"
 SOV_EconomicMutualAidCommittee:0 "经济互助委员会"
 SOV_EconomicMutualAidCommittee_desc:0 "许多新生的社会主义国家刚刚从战争中获得自由，他们继续进行经济建设，经济互助委员会将为他们提供帮助。"
 SOV_InfiltrationOfWesternEurope:0 "渗透西欧"
 SOV_InfiltrationOfWesternEurope_desc:0 "经历了残酷的第二次世界大战之后，欧洲的许多国家都建立了社会主义人民民主政权，然而在欧洲西部，许多国家的人民依然处在帝国主义和资本主义的统治之下。列宁和斯大林同志的遗产告诉我们，工人阶级只有解放全世界，才能真正解放自己，如果继续让西欧处于帝国主义统治之下，那么西欧的资产阶级仍然会向我们的社会主义政权反扑。幸运的是，第二次世界大战中，苏联红军的伟大胜利，大大振奋了西欧各国的共产党和左派人士，他们将借助这股东风，在欧洲发起社会主义运动，以打败资产阶级夺取政权，而这，自然就需要我国，在政治、经济和外交上予以支持。"
 SOV_InfiltrateNorway:0 "渗透北欧" 
 SOV_InfiltrateNorway_desc:0 "挪威和丹麦的共产党和左翼政党正在壮大，我们应该帮助他们继续扩大影响力，以支持他们夺取政权。如果丹麦和挪威建立社会主义政权，从战略上说，我们的北冰洋舰队进入大西洋的航线将畅通无阻。" 
 SOV_InfiltrateTheUK:0 "渗透英国"
 SOV_InfiltrateTheUK_desc:0 "英国共产党和左翼政党正在壮大，我们应该帮助他们继续扩大影响力，以支持他们夺取政权，以摧毁帝国主义阵营中第二重要的核心。" 
 SOV_InfiltrationInAustria:0 "渗透奥地利"
 SOV_InfiltrationInAustria_desc:0 "尽管我们接受了《奥地利合约》，承认奥地利共和国保持中立，但实际上，我们不可能让这个扼守欧洲心脏地带的国家投向西方阵营。我们要赶在西方国家将手伸向奥地利之前抢占先机。"
 SOV_InfiltrationOfWestGermany:0 "渗透西德"
 SOV_InfiltrationOfWestGermany_desc:0 "西方国家支持的法西斯余孽分子，在德国西部实行威权统治，不得人心，德国的左翼运动风起云涌。让我们来给他们添把火。"
 SOV_ControlFinland:0 "控制芬兰"
 SOV_ControlFinland_desc:0 "尽管我们在第二次世界大战中击败了芬兰，使其求和，但芬兰国内依然有对苏联持敌视态度的政治势力。为了不使得二战的历史重演，我们最好的选择是在芬兰成立一个亲苏政权。"
 SOV_NormalizationOfSoviet-FinnishRelations:0 "芬兰化"
 SOV_NormalizationOfSoviet-FinnishRelations_desc:0 "尽管我们不希望芬兰倒向西方阵营，但一个苏维埃化的芬兰并不符合我们的利益。最好的方式是使其保持一种特殊的中立，在允许其保留自身政治制度的同时，成为我们特殊的盟友。"
 SOV_InfiltratingSpain:0 "渗透西班牙"
 SOV_InfiltratingSpain_desc:0 "法西斯打不倒西班牙人民的顽强精神，依然有许多自由战士反抗弗朗哥政权，这次苏维埃不会再坐视不管！"
 SOV_InfiltrationInItaly:0 "渗透意大利"
 SOV_InfiltrationInItaly_desc:0 "意大利的革命群众正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 SOV_InfiltrationInSweden:0 "渗透瑞典"
 SOV_InfiltrationInSweden_desc:0 "就像在上次世界大战一样，瑞典表面上保持中立，实际上和西方国家串通一气，在政治上向我国施加压力，而我们亦要反向向瑞典施加压力，尤其是支持瑞典的左翼势力，阻挠瑞典当局和西方国家的各种合作。"
 SOV_InfiltrationFrance:0 "渗透法国"
 SOV_InfiltrationFrance_desc:0 "法国是欧洲革命之父，在第二次世界大战之后，法国共产党和法国的左翼势力不断兴起，他们将是我们影响这一北约重要成员国的代理人。"
 SOV_WarsawPactWestExpansion:0 "华约西扩"
 SOV_WarsawPactWestExpansion_desc:0 "尽管西欧的资产阶级政权已经崩溃，但这些新建立的人民民主政权却依然担忧资产阶级复辟和帝国主义残余会复辟卷土重来。伟大的苏联人民将为他们提供庇护，以保卫欧洲的社会主义革命事业不会受到破坏。"
 SOV_SupportForNewChina:0 "支持新中国"
 SOV_SupportForNewChina_desc:0 "中国共产党重新发动了对国民党独裁政权的革命战争，我们将再一次为他们提供支援。"
 SOV_Control_China:0 "控制中国"
 SOV_Control_China_desc:0 "中国共产党已经取得了战争的胜利，建立了新的国家，我们希望对该国施加更多的影响力，让中共配合我们的外交和军事政策。"
 SOV_China_Union_of_Soviet_Union:0 "中苏同盟" 
 SOV_China_Union_of_Soviet_Union_desc:0 "中国人民在经历了战火的洗礼后，建立了一个强大的社会主义新国家，毫无疑问，他们会成为社会主义阵营的坚定盟友。" 
 SOV_InvitingChinaToJoinWarsawPact:0 "邀请中国加入华约"
 SOV_SupportingTheNorthKoreanRegime:0 "支持北朝鲜"
 SOV_SupportingTheNorthKoreanRegime_desc:0 "朝鲜人民在脱离日本统治后面临着政治问题，许多势力角逐半岛的统治地位，曾经的游击队领袖金日成是我们理想的选择。"
 SOV_ControlTheKoreanPeninsula:0 "支持朝鲜统一"
 SOV_ControlTheKoreanPeninsula_desc:0 "美帝国主义支持的朝鲜南方政权实行独裁统治，而北方的朝鲜人民政府已决心将其彻底消灭，统一半岛，而他们需要我们提供军事、经济和请报上的援助。"
 SOV_InfiltrationInJapan:0 "渗透日本"
 SOV_InfiltrationInJapan_desc:0 "二战结束后，日本被美帝国主义扶持的傀儡霸占，但反对帝国主义的左派运动也在如火如荼地进行，他们需要我们的帮助，而我们需要阻止日本成为美国威胁远东的桥头堡。"
 SOV_InterventionInVietnam:0 "干涉越南"
 SOV_InterventionInVietnam_desc:0 "越南人民正在反抗帝国主义的侵略与殖民统治，我们应当帮助他们！"
 SOV_ControlOfIndochina:0 "渗透东南亚"
 SOV_ControlOfIndochina_desc:0 "从菲律宾、马来亚到越南，共产主义革命正在席卷东南亚，他们曾经是抵抗日本入侵的主力，但却遭到美国支持下的傀儡政府无情抛弃，因而发起革命。我们应该支持东南亚各国的共产主义革命，以取得这片从太平洋到印洋的十字路口的控制权。"
 SOV_InfiltrationThailand:0 "渗透泰国"
 SOV_InfiltrationThailand_desc:0 "泰国军政府逐渐走向亲美道路，如果要实现东南亚地区社会主义革命的成功，必须将泰国军政府推翻。"
 SOV_InfiltratingThePhilippines:0 "渗透菲律宾" 
 SOV_InfiltratingThePhilippines_desc:0 "菲律宾的共产主义革命武装正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 SOV_SubversionOfIndonesia:0 "渗透印尼"
 SOV_SubversionOfIndonesia_desc:0 "印度尼西亚的共产主义革命武装正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 SOV_EnteringOceania:0 "进入大洋洲"
 SOV_EnteringOceania_desc:0 "我们已经在东南亚站稳脚跟，现在，我们将拔掉美帝国主义在亚太的最后一根钉子。"
 SOV_VirginLand:0 "处女地"
 SOV_VirginLand_desc:0 "解决粮食问题将成为我国政治工作的重中之重，而要完成这一目标，我们需要开垦更多土地用于农业生产。从男俄罗斯草原到哈萨克斯坦，有大量肥沃的黑土地，但这些土地尚未被开发，现在是时候将他们开垦了。"
 
 SOV_mide:0 "进入中东"
 SOV_mide_desc:0 "中东局势在二战后变得十分复杂，有新建立的以色列国，也有刚刚摆脱殖民统治的阿拉伯国家，我们需要尽快在中东地区施加我们的影响力，并在这个亚欧大陆的十字路口建立起势力范围。。"
 SOV_ISR:0 "支持以色列"
 SOV_ISR_desc:0 "苏联为以色列犹太国的建立做出了巨大贡献，他们不仅接纳了数百万从俄罗斯移居出去的犹太人，而且政治上，执政的以色列工党偏向社会主义。我们应该积极发展和以色列的关系，作为我国政治势力进入中东地区的跳板。"
 SOV_ARABS:0 "支持阿拉伯国家"
 SOV_ARABS_desc:0 "以色列建国后展现的极端侵略性，让中东国家，尤其是阿拉伯国感到不安，他们在寻求能在政治、军事和外交上支持他们的国家，而这也是我们要做的。"
 SOV_Bathha:0 "支持阿拉伯民族主义"
 SOV_Bathha_desc:0 "随着苏伊士运河战争结束，阿拉伯民族主义在阿拉伯各国蓬勃发展，以纳赛尔主义、阿拉伯复兴革命党为代表的阿拉伯革命势力不仅具有社会主义进步性质，而且积极与西方势力作斗争，他们将会是我们重要的盟友。"
 SOV_arabs_communist:0 "支持中东共产党"
 SOV_arabs_communist_desc:0 "广大阿拉伯人民反帝反殖民运动风起云涌，阿拉伯人民正在抵抗帝国主义殖民者的残暴统治，他们需要我们的帮助。"
 SOV_israeli_communism:0 "支持以色列共产党"
 SOV_mideast_construct:0 "支援中东建设"
 SOV_mideast_construct_desc:0 "中东人民摆脱帝国主义统治之后，百废待兴，从零开始建设自己的国家，他们需要科技，需要技术，需要产业和各种投资，这正是苏联向全世界展示社会主义国家为第三世界兄弟提供帮助和支持，以及展现社会主义优越性的机会。"
 SOV_Support_Mideast_arms:0 "为中东提供军事援助"
 SOV_Support_Mideast_arms_desc:0 "美国支持下的中东傀儡政权和我们支持下的中东国家，随时可能爆发激烈的军事冲突，我们必须尽快为我们在中东的盟友提供军事援助，帮助保卫国土。"
 
 SOV_SupportAfrica:0 "支援非洲建设"
 SOV_SupportAfrica_desc:0 "非洲人民摆脱帝国主义统治之后，百废待兴，从零开始建设自己的国家，他们需要科技，需要技术，需要产业和各种投资，这正是苏联向全世界展示社会主义国家为第三世界兄弟提供帮助和支持，以及展现社会主义优越性的机会。"
 
 SOV_Afghanistan:0 "渗透阿富汗"
 SOV_Afghanistan_desc:0 "自从俄罗斯帝国开始，阿富汗就一直是莫斯科南下扩展势力范围的首要目标，他是我们通往印度洋的关键一环。"
 SOV_PER:0 "渗透伊朗"
 SOV_PER_com:0 "支持伊朗人民党"
 SOV_IND:0 "接触南亚国家"
 SOV_AmericanLeft:0 "接触美洲左派"
 SOV_SupportUSARevolution:0 "支持北美左派"
 SOV_SupportUSABlacks:0 "支持美国社会运动"
 SOV_SupportUSArevolt:0 "支持北美分离主义"
 SOV_SupportUSArevolt_desc:0 "美国社会动荡不安，政治混乱，暴动层出不穷，已经出现了许多分离主义和颠覆势力，我们将为他们提供援助，将这个腐朽的吸血鬼政权送入坟墓。"
 SOV_multi_politician:0 "政治多元化"
 SOV_multi_politician_desc:0 "虽然党作为社会主义国家的建设者作出了巨大贡献，但要进一步实现国家的现代化、民主化和进步，必须打破一党专政，实现多元化。"
 SOV_Peaceful_coexistence:0 "三和路线"
 SOV_Peaceful_coexistence_desc:0 "在新的形势下，尤其是世界核大战的威胁下，通过暴力和战争来推翻资本主义的构想变得成本巨大而不现实，第三次世界大战对我们来说代价是巨大的，基于这一点，我们应该选择一条新的道路来与资本主义和帝国主义国家进行对抗，即和平共处、和平竞争、和平过渡，在不放弃发展武力的前提下，与西方国家通过和平竞争，体现出社会主义制度的优势，来争取西方国家广大人民群众的认可和支持，以和平手段帮助他们建立社会主义制度。"
 SOV_stalin_doctrine:0 "斯大林的德国问题备忘录"
 SOV_stalin_doctrine_desc:0 "即便德国的分裂标志着东西两大阵营全面对抗的开始，但斯大林同志依然在考虑，有条件的允许德国统一，以缓和东方与西方的关系。\n根据斯大林同志拟定的方案，只要德国统一之后，保证其实行完全的中立化，不重建武装力量，不加入任何军事团体，那么苏联就将接受德国的和平统一，甚至可以接受新的德国不是一个社会主义国家。"
 SOV_ExpandedGulag:0 "扩大古拉格"
 SOV_ExpandedGulag_desc:0 "美帝国主义对我国的渗透与日俱增，用来关押政治犯的劳改营都快不够用了。我们需要继续扩大古拉格的规模和数量，以保证他们能够容纳更多的政治犯。"
 SOV_control:0 "社会监控体系"
 SOV_control_desc:0 "同志，我好像在肃反名单上见过你？"
 SOV_anti_religion:0 "打击宗教"
 SOV_anti_religion_desc:0 "宗教是精神的鸦片，他们除了代表封建阶级压迫人民一无是处，只有镇压宗教，才能推动人民接受社会主义意识形态。"
 SOV_anti_democrat:0 "打击反对派"
 SOV_anti_democrat_desc:0 "西方资本主义国家开始支持我国的反共产主义叛国者掀起新一轮的反对运动，我们会像斯大林同志那样，用铁拳将不自量力的反对者再一次碾碎。"
 SOV_democranized:0 "自由俄罗斯"
 SOV_democranized_desc:0 "布尔什维克分子对俄罗斯祖国长达半个世纪的残暴统治即将结束，俄罗斯将彻底抛弃极权主义，走向真正的民主，真正的自由。"
 SOV_tsardom:0 "天佑沙皇"
 SOV_tsardom_desc:0 "神佑尊贵沙皇！万寿而无疆！\n权力稳掌，幸福久长。\n\n你的统治令敌人惧怕\n统治正教。上帝，保佑沙皇！"
 SOV_FarEast_Zones:0 "远东工业区" 
 SOV_FarEast_Zones_desc:0 "远东地区的领土与中国接壤，与日本隔海向往，不仅有利于发展贸易，还可以发展工业，海参崴、哈巴罗夫斯克和共青城将在未来被规划为我国重要的造船和飞机制造中心。" 
 SOV_Kazakh_Zones:0 "哈萨克工业区" 
 SOV_Kazakh_Zones_desc:0 "中亚地区气候温和，土壤肥沃，矿产丰富，并且有峰峰的石油资源，适合大规模耕种和发展工业区，是时候开发这些处女地了。"
 SOV_Ukrain_Zones:0 "乌克兰工业区" 
 SOV_Ukrain_Zones_desc:0 "乌克兰东部的顿涅茨克地区有丰富的矿产资源，应当积极投资乌克兰地区的工业生产，这里将会是我国重要的军事工业中心。" 
 SOV_BelarusianIndustrialArea:0 "白俄罗斯工业区"
 SOV_SiberianIndustrialArea:0 "秋明油田"
 SOV_SiberianIndustrialArea_desc:0 "乌拉尔山以东的秋明地区依然有许多待开发的石油资源。"
 
 SOV_SupportCubanRevolution:0 "支持加勒比海革命"
 SOV_SupportCubanRevolution_desc:0 "加勒比海地区的革命群众正在与帝国主义支持下的独裁军政府和大种植园剥削者进行激烈的斗争，他们需要我们的帮助！"
 SOV_ContactChile:0 "接触智利"
 SOV_ContactChile_desc:0 "智利社会党中有许多倾向社会主义，且对社会主义制度有浓厚兴趣的进步人士，我们应该与他们进行接触，从而尝试在智利推广社会主义思想。"
 SOV_ContactMexico:0 "接触墨西哥"
 SOV_ContactMexico_desc:0 "墨西哥革命党中有许多倾向社会主义，且对社会主义制度有浓厚兴趣的进步人士，我们应该与他们进行接触，从而尝试在墨西哥推广社会主义思想。"
 SOV_ContactWithBrazil:0 "接触巴西"
 SOV_ContactWithBrazil_desc:0 "巴西工党中有许多倾向社会主义，且对社会主义制度有浓厚兴趣的进步人士，我们应该与他们进行接触，从而尝试在巴西推广社会主义思想。"
 SOV_ContactWithArg:0 "接触阿根廷"
 SOV_ContactWithArg_desc:0 "阿根廷正义党中有许多倾向社会主义，且对社会主义制度有浓厚兴趣的进步人士，我们应该与他们进行接触，从而尝试在阿根廷推广社会主义思想。"
 
 SOV_AmericanRevolution:0 "美洲革命"
 SOV_SupportingTheCentralAmericanRevolution:0 "中美洲革命"
 SOV_SupportingTheCentralAmericanRevolution_desc:0 "中美洲地区的革命群众正在与帝国主义支持下的独裁军政府和大种植园剥削者进行激烈的斗争，他们需要我们的帮助！"
 SOV_latins_construct:0 "支援拉美建设"
 SOV_latins_construct_desc:0 "拉美人民摆脱帝国主义统治之后，百废待兴，从零开始建设自己的国家，他们需要科技，需要技术，需要产业和各种投资，这正是苏联向全世界展示社会主义国家为第三世界兄弟提供帮助和支持，以及展现社会主义优越性的机会。"
 SOV_Support_latins_arms:0 "为拉美提供军事援助"
 SOV_Support_latins_arms_desc:0 "美国支持下的拉美傀儡政权和我们支持下的拉美国家，随时可能爆发激烈的军事冲突，我们必须尽快为我们在拉美的盟友提供军事援助，帮助保卫国土。"
 
 SOV_SpaceExploration:0 "太空探索"
 SOV_SpaceExploration_desc:0 "第二次世界大战带来了巨大的科技进步，火箭技术的发展使得人类进入太空成为可能。我们毫无疑问要支持太空计划，这既是证明我国制度的先进，也是为了军事上的优势。"
 SOV_GunSalute_1:0 "斯普特尼克一号"
 SOV_GunSalute_1_desc:0 "“人造卫星”指研究和开发各种人造轨道天体的学科，曾经，将人类的造物发射进入太空，仅仅只是科幻小说中的幻想，而如今，火箭技术的成熟使其成为可能。谁能率先将人造卫星送入稳定的地球轨道，谁就将以太空先驱的地位永载史册。"
 SOV_MannedSpaceProject:0 "扩大飞行发射场"
 SOV_MannedSpaceProject_desc:0 "我们现有的航天发射场太容易遭到美国间谍侦察机的窥探了，我们需要尽快选择一个新的地点，修建新的太空发射场。"
 SOV_DevelopingANuclearProgram:0 "核计划"
 SOV_DevelopingANuclearProgram_desc:0 "美国人在日本引爆的两颗原子弹确实令人眼前一亮，看起来美国人很自信他们能够垄断这一超级武器的使用权，但无论他们是否愿意分享，这项技术都会来到我们手中。"
 tsar_bomb:0 "沙皇炸弹"
 tsar_bomb_desc:0 "美国人看起来想跟我们在核武器议题上硬碰硬，他们有自信在核武器的发展和制造技术上保持领先，看来有必要让他们见识一下库兹卡的妈妈的厉害了。"
 SOV_Oriental_1:0 "英雄之旅"
 SOV_Oriental_1_desc:0 "伟大的领路人！伟大的尤里·加加林同志！您所取得的成就为世界所震撼！作为人类历史上第一位进入太空轨道的太空人，尤里·加加林在全世界的巡回，将让苏联的国际地位史无前例地提高！"
 SOV_HydrogenBombProject:0 "氢弹工程"
 SOV_NuclearProtectionWork:0 "核民防工程"
 SOV_NuclearProtectionWork_desc:0 "核战争爆发的威胁正在上升，为了在核武器袭击中保护我们的人民、生产设施和军事设施，我们需要建设民防工程，包括一系列的预警、警报和避难系统。"
 SOV_MissileEngineering:0 "导弹研发"
 SOV_MissileEngineering_desc:0 "德国在二战中发明的V2火箭令我们眼前一亮，这种火箭如果能装载核武器，使其能够更快、更准的发射到地球的另一端，那么战争的历史、人类的历史都将为此改变。"
 SOV_NuclearSubmarine:0 "核潜艇"
 SOV_NuclearSubmarine_desc:0 "强大的核动力发动机可以让我们的战略潜艇舰队航行至世界的每一个角落。"
 SOV_Planned:0 "改良计划经济"
 SOV_Planned_desc:0 "斯大林时期留下的经济体制已经被证明，在新形势下的经济建设中存在严重的问题，高度集中的计划经济体制不仅没有发展的活力，缺少对民用消费品的投资和发展，且极容易滋生贪污腐败，沦为党政官僚的蛋糕。为了让社会主义经济建设紧跟时代发展，经济改革势在必行。我们将尝试逐步解锁计划经济的束缚，下放权力于企业和地方，允许企业将超过生产计划的部分作为利润刺激，甚至可以允许有限的市场经济……当然，这可能会被指责为修正主义，但在迫切需要的面包面前，教条是不能填饱肚子的。"
 SOV_CommunieFarm:0 "改革集体农庄户籍制度"
 SOV_CommunieFarm_desc:0 "斯大林时期的户籍制度将农民束缚在集体农庄中，现在新的经济改革已经开始，户籍制度应当废除，农民将得以进入城市，为我国的城市化发展作出贡献。"
 SOV_GovernmentRule:0 "标准委员会"
 SOV_GovernmentRule_desc:0 "标准委员会是苏联总理柯西金在70年代末的改革中提出的概念，通过全国标准委员会取代全国计划委员会，制定企业的生产标准，使得企业获得更大自主权并进一步摆脱政府经济指导。"
 SOV_GovernmentRule_tool:0 "减少民用工厂维护费"
 SOV_KhrushchevHouse:0 "住房计划"
 SOV_KhrushchevHouse_desc:0 "为了更好的改善人民生活水平，我们必须修建大量的住宅楼以应对不断增长的人口和城市化。斯大林时期的奢华式建筑以不合时宜，廉价而实用的集体住宅才是首选。"
 SOV_KhrushchevHouse_tool:0 "所有基础设施大于3的城市+1医院"
 SOV_Education_reform:0 "教育改革"
 SOV_Education_reform_desc:0 "随着国家逐渐从世界大战的破坏中回复，我们需要尽快完成因卫国战争爆发而未能完成的改革。现在的苏联急需大量的理工科人才，以投入到经济建设、工业发展和科技进步当中。"
 SOV_EnterpriseGain:0 "企业利润改革"
 SOV_EnterpriseGain_desc:0 "我国高度集中化、党企一提的国有企业在经济体制改革之后开始失去活力，无法应对日益激烈的市场竞争。为了使国企能够应对市场经济带来的冲击，我们将实行国企改革，使企业自主，自负盈亏。"
 SOV_AllowForeignInvestment:0 "允许外国投资"
 SOV_AllowForeignInvestment_desc:0 "随着苏联的社会稳定、经济得到发展以及外交地位的加强，一些外国投资者希望进入我国市场投资。"
 SOV_Expanded_market:0 "扩大市场经济"
 SOV_Expanded_market_desc:0 "没有市场竞争的企业就如同没有动力的机械，只能按照现有的计划生产产品，而不会去改进产品的质量，不会开发新的技术。市场竞争将刺激企业重视发展自己的产品，使其能够为了追求利润而发展自己。能够得到消费市场青睐的产品将获得成功，而不能获得市场认可的产品和企业将被无情淘汰。"
 SOV_Expanded_market_tool:0 "增加资源出口收入"
 SOV_libelization_economic:0 "经济自由化"
 SOV_libelization_economic_desc:0 "既然市场能够比行政机构更好地运营经济，那我们就应该将经济完全交给市场和市场参与者自由运营。政府应该放松监管，把自由贸易作为市场经济的长期政策，以促进经济增长，形成有效的竞争机制。"
 SOV_FoodPrise:0 "粮食采购制度"
 FoodPrise_modifier:0 "粮食采购制度"
 SOV_FoodPrise_tool:0 "农场维护费+12%"
 SOV_FoodPrisec_desc:0 "在斯大林时期，计划经济体制向农民强行下达生产指标，并将农作物按照指标强行征收，却没有留下足够的口粮，没有给予足够的报酬。巨大的工农业剪刀差令广大农民怨声载道，继续做出改变。粮食采购制度意味着政府将以货币购买集体农庄的产品，不仅补偿了农民，还使得他们有能力去购买消费品，大大提高了农民的积极性。"
 SOV_CollectiveFarmAutonomy:0 "农场自主权"
 SOV_CollectiveFarmAutonomy_desc:0 "政府将进一步削弱计划经济的影响力，减少对集体农庄直接下达的生产计划，改为生产指标，当农庄生产的产品超过指标时，多余的产品可以投入市场获得利润，农庄将获得在生产和利润分配上更大的自主权。"
 SOV_more_economic_refrorm:0 "深入经济改革"
 SOV_more_economic_refrorm_desc:0 "经济改革获得初步成效，但还需要进行更深入的改良。企业获得的利润应该逐步增加，以刺激其发展动力，对市场的管理也应该考虑进一步放宽，允许更多企业将超过生产指标的商品投入到市场中，同时还要增加工人的薪水，以让他们去购买和消费昂贵的消费品。"
 SOV_marketEconomic:0 "引入市场竞争"
 SOV_marketEconomic_desc:0 "没有市场竞争的企业就如同没有动力的机械，只能按照现有的计划生产产品，而不会去改进产品的质量，不会开发新的技术。市场竞争将刺激企业重视发展自己的产品，使其能够为了追求利润而发展自己。能够得到消费市场青睐的产品将获得成功，而不能获得市场认可的产品和企业将被市场无情淘汰。"
 SOV_marketEconomic_tool:0 "引入市场竞争"
 SOV_companiesLaw:0 "企业改革"
 SOV_companiesLaw_desc:0 "我国国有企业在经济体制改革之后开始失去活力，无法应对日益激烈的市场竞争。为了使国企能够应对市场经济带来的冲击，我们将实行国企改革，使企业自主，自负盈亏。"
 SOV_companiesLaw_tool:0 "减少民用工厂的维护费，但也减少其产出"
 SOV_EnterpriseGain_tool:0 "减少除军工厂外的所有工厂的维护费，但也减少其产出"
 enterprise_reform_modifier:0 "企业改革"
 
 SOV_Private:0 "合营经济"
 SOV_Private_desc:0 "随着苏联的市场经济得到发展以及外交地位的加强，一些外国投资者希望进入我国市场投资，我们可以允许外国的企业与我们一同建立合资企业，苏联提供场地、资源、工人和市场，外资则提供技术和资金。"
 SOV_UralOilfield:0 "乌拉尔工业区"
 SOV_UralOilfield_desc:0 "乌拉尔山以东的广袤土地，辽阔的雪原和茂密的森林等着我们去开发，这里将是我们发展轻工业的好地方。"
 SOV_EncourageLaborGlory:0 "劳动光荣"
 SOV_EncourageLaborGlory_desc:0 "计划就是法律，履行就是责任，超额履行就是荣誉！"
 SOV_FocusOnConsumerProducts:0 "发展民用工业 II"
 SOV_FocusOnConsumerProducts_desc:0 "我国的经济生产已经从战争中回复，现在我们需要在民用消费品工业当中提供更多的投资，以确保广大民众能够使用到足够的生活用品，从各种五花八门的食品，再到电视机、电冰箱和收音机。这不仅是一个经济任务，还是一个重要的政治任务，只有满足人民的消费需求，才能展示出社会主义的优越性。\n\n我国革命的特点就在于它不仅给了人民自由，而且给了人民物质福利，给了人民享受赋予的、有文化的生活的可能。\n——约瑟夫·斯大林"
 SOV_FocusConsumerProducts:0 "发展民用工业 I"
 SOV_FocusConsumerProducts_desc:0 "世界大战已经严重损害了我国的基础工业，尤其是消费品制造。我们必须迅速恢复经济生产，以满足人民对消费品的需求。"
 SOV_EmphasisOnMilitaryIndustry:0 "地区发展"
 SOV_EmphasisOnMilitaryIndustry_desc:0 "苏维埃社会主义共和国联盟，如今是世界上领土最辽阔的国家，从肥沃的乌克兰黑土地、一望无际的西伯利亚森林、高加索山间的葡萄园、中亚的煤矿、油气田，再到远东的海港，每一片土地都有开发的价值。"
 SOV_RevocationOfAnAffiliate:0 "加强对加盟国控制" 
 SOV_RevocationOfAnAffiliate_desc:0 "帝国主义敌对思想的渗透，让民族主义开始死灰复燃。波罗的海、乌克兰、高加索和中亚，开始有人出现民族主义反俄倾向，试图煽动反对苏联的分离主义运动……这些思想正尝试进入共和国的高层，这值得我们高度警惕，我们需要指示克格勃，对这些怀有二心的官员们进行调查。" 
 SOV_SoutheastAsianRevolution:0 "支持东南亚革命" 
 SOV_SoutheastAsianRevolution_desc:0 "从菲律宾的群岛、马来亚的丛林，到中南半岛的山地丘陵，到处都是反对帝国主义、封建主义腐朽统治的革命武装，现在是时候支持亚洲人民的伟大斗争了。"
 SOV_RemoveTheStalinModel:0 "废除斯大林模式" 
 SOV_Student_construction_brigade:0 "学生建设大队" 
 SOV_Student_construction_brigade_desc:0 "学生建设大队是50年代苏联兴起的一种社会运动，鼓励组织共青团员在业余时间参与到建设劳动当中，既可以锻炼共青团员的体魄和精神，又有利于战后的苏联建设。学生建设大队运动在60年代得到苏联政府的认可和支持。" 
 youth_work_modifiers:0 "学生建设大队" 
 SOV_Naukograd:0 "科学城" 
 SOV_Naukograd_tool:0 "可以通过花费政治点数设定某一省份为科学城，此省份建造医院、学校的速度增加，每个科学城可以带来一定的科研加成，但科学城每三年建立一个，且不能相邻。" 
 SOV_Naukograd_desc:0 "科学城是苏联政府为了某种技术目的专门建造的城市，主要由高度集中的技术设施和住宅区组成，配套有完善的福利设施和学术中心，一般只有高级技术人员才有资格居住在这里，科学城的设施让技术人员能够更好的在其服务的设施中工作。比如著名的普列季皮亚，这里的居民都是专门为切尔诺贝利核电站服务的工程师。" 
 SOV_GreatProject:0 "伟大的共产主义工程"
 SOV_GreatProject_desc:0 "“伟大的共产主义工程”指50年代初斯大林提出的一系列雄心勃勃的建筑工程，包括数个大型水电站、工业区和运河。"
 SOV_GreatProject_tool:0 "允许通过决议建造一系列大型工程。"
 SOV_ArmsRace:0 "军备竞赛"
 SOV_church:0 "宗教合法化"
 SOV_church_desc:0 "苏联的政治改革不断推进，曾经对宗教的打压也应当随之结束。"
 SOV_Silent_Stalinization:0 "宁静的斯大林化"
 SOV_Silent_Stalinization_desc:0 "斯大林是苏维埃联盟伟大的领袖，伟大的革命家和伟大的导师，然而在他去世后，党内的一些修正主义者却试图否定他的成就和功绩，这削弱了党的威望和社会主义的正确性，造成了意识形态的混乱。我们必须重信建立起斯大林同志的地位，在一次向广大人民宣扬斯大林同志为苏维埃联盟作出的贡献，以重建人民对党、对社会主义的信心。\n\n我知道我死后，我的坟墓上会堆满垃圾，但历史之风迟早会毫不留情地将它们吹走。n——约瑟夫·斯大林"
 SOV_limited_independence:0 "有限主权论"
 SOV_limited_independence_desc:0 "社会主义是一个大家庭，社会主义阵营内的各国都应该保持团结，优先关注社会主义家庭的利益，而将自身的利益置于次要。在帝国主义威胁的背景下，如果有国家试图单方面进行带有危险性的改革，这无疑是将整个社会主义世界置于危险之中，这是不可接受的。作为社会主义的领袖，我们有权利，亦有义务对一些社会主义国家的内部事务，尤其是政治事务进行指导。\n\n我们希望世界社会主义体系成为一个紧密团结的国家大家庭，共同建设和捍卫新社会。n——列昂尼德·勃列日涅夫"
 SOV_Toshkent_speech:0 "塔什干主义"
 SOV_Toshkent_speech_desc:0 "我们与中国之间的矛盾已经使北京逐渐投向西方国家，这是极其不利的，我们应该挽留这个盟友。勃列日涅夫同志在塔什干发表讲话，提出改善中苏关系，我们应该尽快落实这一决定。"
 SOV_Ottepel:0 "解冻"
 SOV_Ottepel_desc:0 "斯大林模式下的极权主义给苏维埃带来了严重的政治灾难，改革势在必行，只有放宽对人民多余的政治约束，才能鼓励人民参与政治，重振苏维埃的政治动力。"
 SOV_New_idea:0 "新思维"
 SOV_New_idea_desc:0 "多年来，党政机关的行动迟缓，落后于时代和生活的需要。国家发展中的问题积累速度远远超过了解决速度。行政形式和方法的僵化和惰性，工作活力的下降以及官僚主义的膨胀——所有这些都造成了严重的损害。社会生活开始出现停滞的迹象。形势需要改变，但一种奇怪的心态——如何在不改变现状的情况下改善现状？——占据了上风。同志们，这绝对行不通。正如人们常说的，一停一停，就会落后一英里。\n\n——米哈伊尔·戈尔巴乔夫"
 SOV_SinatraDoctrine:0 "辛纳屈主义"
 SOV_SinatraDoctrine_desc:0 "随着苏联自身已经开始民主化的改革，我们也应当允许东欧国家独立探索自己的发展道路，允许东欧各国开始自己的民主改革进程。"
 SOV_Sino_struggle:0 "打击中国"
 SOV_Sino_struggle_desc:0 "中国共产党已经走向修正主义，他们为了与我们作对，竟然公开地与美国人建立合作关系。中苏之间的矛盾已无法调和，只有采取军事威慑才能迫使北京就范。"
 SOV_BaikaloAmurskaya_Railway:0 "贝加尔－阿穆尔铁路"
 SOV_BaikaloAmurskaya_Railway_desc:0 "我们与北京政府的矛盾日益严重，双方随时有可能爆发冲突，我们需要进款建立一条横穿苏联，直达远东地区的交通枢纽，以保证我们的军队在有必要时迅速部署到远东地区。"
 
 SOV_IntoTheAfrica:0 "立足非洲"
 SOV_AfricanHorn:0 "非洲之角"
 SOV_AfricanHorn_desc:0 "古老的东非高原具有关键的战略意义，他们扼住红海的咽喉，并面向印度洋的石油运输航线，我们需要尽快和埃塞俄比亚、索马里的进步革命势力建立关系，帮助他们夺取政权，以将东非纳入我们的势力范围。"
 SOV_SupportAntiColonal:0 "支持反殖民运动"
 SOV_SupportAntiColonal_desc:0 "亚非拉人民反对殖民者，争取民族独立，我们应该支持他们。"
 SOV_SupportAngola:0 "摧毁葡萄牙殖民体系"
 SOV_SupportAngola_desc:0 "广大非洲大地上，反帝反殖民运动风起云涌。安哥拉、莫桑比克和比绍人民正在抵抗葡萄牙帝国主义殖民者的残暴统治，他们需要我们的帮助。"
 SOV_SupportSouthAfrica:0 "支持南非武装斗争"
 SOV_SupportSouthAfrica_desc:0 "广大非洲大地上，反帝反殖民运动风起云涌。南非、西南非洲和罗德西亚的黑人人民正在抵抗白人种族主义主义殖民者的残暴统治，他们需要我们的帮助。"
 SOV_infected_WEST_africa:0 "渗透西非"
 SOV_infected_WEST_africa_desc:0 "法国人的撤离使得撒哈拉沙漠陷入真空状态，为了不让帝国主义势力趁虚而入在这里建立影响力，我们必须抢占先机。"
 SOV_infected_magreb:0 "渗透北非"
 SOV_infected_magreb_desc:0 "法国人的撤离使得北非陷入真空状态，为了不让帝国主义势力趁虚而入在这里建立影响力，我们必须抢占先机。"
 SOV_infected_congo:0 "渗透中非"
 SOV_infected_congo_desc:0 "刚果是非洲大陆最富有、最重要的资源核心，这里有无数的铀矿、金矿、铜矿和钻石矿……我们必须抢在美国人之前在这里建立影响力。"
 SOV_infected_east_africa:0 "渗透东非"
 SOV_infected_east_africa_desc:0 "英国人的撤离使得东非陷入真空状态，为了不让美国人趁虚而入在这里建立影响力，我们必须抢占先机。"
 
 SOV_Support_Algeria:0 "介入阿尔及利亚局势"
 SOV_Support_Algeria_desc:0 "阿尔及利亚人民已发动武装斗争，反对法国殖民统治，他们迫切需要我们的支援！"
 
 SOV_Support_Africa_revolt:0 "支持非洲武装斗争"
 SOV_Support_Africa_revolt_desc:0 "广大非洲大地上，反帝反殖民运动风起云涌，非洲人民正在抵抗帝国主义殖民者的残暴统治，他们需要我们的帮助。"
 SOV_Support_Africa_communism:0 "支持非洲的共产主义革命"
 SOV_Support_Africa_arms:0 "为非洲提供军事援助"
 SOV_Support_Africa_arms_desc:0 "美国支持下的非洲傀儡政权和我们支持下的非洲国家，随时可能爆发激烈的军事冲突，我们必须尽快为我们在非洲的盟友提供军事援助，帮助保卫国土。"
 SOV_Africa_resources:0 "收购非洲战略资源"
 
 SOV_EconomicSupport:0 "友谊输油管"
 SOV_EconomicSupport_desc:0 "苏联丰富而廉价的石油和天然气资源将为东欧国家的经济发展助力。"
 SOV_EconomicSupport_tip:0 "允许通过政治决议为其他国家提供支持。"
 SOV_ElectroTech:0 "支持电子技术"
 SOV_ElectroTech_desc:0 "时代在发展，电子信息技术将成为未来社会最重要、不可或缺的一部分，无论是发展军事、工业、民生还是太空探索都离不开信息技术，在这一领域领先，就代表在走向未来的道路上领先。"
 SOV_Computer:0 "计算机与自动化"
 SOV_Computer_desc:0 "计算机是一项伟大的发明，它的诞生标志着第三次工业革命的开始，我们必须尽快在计算机领域取得成果，并将其运用到工业生产和军事上。"
 SOV_automobil:0 "信息化社会"
 SOV_automobil_desc:0 "格鲁什科夫同志提出了一个伟大的构想，即建立一个完全由智能计算机和覆盖全苏维埃的信息化网络，来管理我们的经济。计算机不像官僚系统，他们不会贪污腐败，且计算精确，毫无疑问，计算机和信息系统将会是改良计划经济乃至实现社会主义的重要方式。"