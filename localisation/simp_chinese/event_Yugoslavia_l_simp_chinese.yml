l_simp_chinese:
 yug.1.t:0 "Tito became leader of Yugoslavia"
 yug.1.d:0 "Josip Broz Tito was elected president of Yugoslavia."
 yug.1.a:0 "Good."
 
 yug.2.t:0 "[From.GetName]提出独立自主的外交政策"
 yug.2.d:0 "[From.GetName]领导人[From.GetLeader]宣布，该国将寻求建立独立自主的外交关系，与所有尊重该国、无论东方西方的国家进行友好往来，而不攀附大国。"
 yug.2.a:0 "Good."
 
 yug.3.t:0 "警惕[From.GetName]的最新政策"
 yug.3.d:0 "[From.GetName]领导人[GRE.GetLeader]推动的所谓独立自主外交需要我们警惕，在各国社会主义政府团结起来对抗西方帝国主义的同时，[From.GetName]却提出了等同于唱反调的主张。或许我们需要进行警告，迫使他们悬崖勒马。"
 yug.3.a:0 "敲打敲打."
 yug.3.b:0 "没有必要."
 
 yug.4.t:0 "来自莫斯科的不满"
 yug.4.d:0 "莫斯科对我们今日提出的独立自主的外交政策感到不满，指责我们在社会主义国家最需要团结的时刻制造分裂，并要求我们取消相关的政策。"
 yug.4.a:0 "我们拒绝莫斯科的干涉."
 yug.4.b:0 "服软."
 
 yug.5.t:0 "[From.GetName]无视我们的警告"
 yug.5.d:0 "[From.GetName]领导人[GRE.GetLeader]无视了问我们的警告，继续推行所谓的独立自主政策。"
 yug.5.a:0 "进行制裁."
 yug.5.b:0 "随他去吧."
 
 yug.6.t:0 "[ROOT.GetName]与苏联关系恶化"
 yug.6.d:0 "[ROOT.GetName]推行的独立自主外交政策引发莫斯科极大不满，双方交涉失败后，苏联政府宣布结束对[ROOT.GetName]的一系列经济援助。"
 yug.6.a:0 "确定."
 
 yug.7.t:0 "[ROOT.GetName]取消了先前提出的外交政策"
 yug.7.d:0 "[ROOT.GetName]宣布取消先前提出的追求独立自主的外交政策，并解除了部分亲西方外交官的职务，同时派遣另一些外交官前往莫斯科与苏联领导人会谈，看来苏联对该国采取了一些手段。"
 yug.7.a:0 "确定."
 
 yug.9.t:0 "铁托去世"
 yug.9.d:0 "南斯拉夫社会主义联邦共和国总统、南斯拉夫共产党领袖约瑟普·布罗兹·铁托在卢布尔雅那逝世。这是南斯拉夫人民最悲伤的一天。铁托在第二次世界大战期间领导游击队抵抗德国入侵，战后他领导南斯拉夫并采取中立态度。作为克罗地亚人，他还试图维持南斯拉夫民族之间的和平。现在，领导人已经死了，谁能领导南斯拉夫？"
 yug.9.a:0 "So sad."
 
 yug.10.t:0 "南斯拉夫共产党政府倒台！"
 yug.10.d:0 "在上周的南斯拉夫共产主义联盟会议上，塞尔维亚和黑山代表团与克罗地亚和斯洛文尼亚代表团发生了激烈的争执。斯洛文尼亚要求进行经济改革，但塞尔维亚总统斯洛博丹·米洛舍维奇拒绝了这一要求，然后他要求改变投票制度以强化自己的权力，并进一步削弱科索沃阿尔巴尼亚人的自治权，但遭到克罗地亚和斯洛文尼亚的拒绝。这两个代表团离开会议，导致会议结束。克罗地亚和斯洛文尼亚的离开意味着共产主义联盟的崩溃，南斯拉夫各国不得不举行多党选举。"
 yug.10.a:0 "So sad."
 
 yug.11.t:0 "克罗地亚宣布独立！"
 yug.11.d:0 "上周，南斯拉夫各共和国举行大选，各州选出各自的执政党取代共产党。克罗地亚民主联盟在克罗地亚获胜，塞尔维亚总统斯洛博丹·米洛舍维奇和居住在克罗地亚的塞尔维亚人民谴责基民盟是一个民族主义和法西斯主义团体，他们不会让新乌斯沙人损害塞尔维亚人的权益。"
 yug.11.a:0 "So sad."
 
 yug.12.t:0 "塞族动乱！"
 yug.12.d:0 "克拉伊纳和武科瓦尔地区爆发暴力动乱！激进的塞尔维亚人组织了反克罗地亚军队的叛军，并在克拉伊纳地区宣布独立。塞尔维亚人声称克罗地亚政府计划建立一个新的乌斯塔沙政权，他们必须与法西斯作战。南斯拉夫总统米洛舍维奇称塞尔维亚将支持他们在克拉伊纳的同胞，南斯拉夫内战爆发了！"
 yug.12.a:0 "So sad."
 
 yug.13.t:0 "克罗地亚动乱！"
 yug.13.d:0 "克罗地亚爆发暴力动乱！激进的塞尔维亚人组织了反克罗地亚军队的叛军，并在克拉伊纳地区宣布独立。塞尔维亚人声称克罗地亚政府计划建立一个新的乌斯塔沙政权，他们必须与法西斯作战。南斯拉夫总统米洛舍维奇称塞尔维亚将支持他们在克拉伊纳的同胞，南斯拉夫内战爆发了！"
 yug.13.a:0 "So sad."
 
 yug.14.t:0 "南斯拉夫瓦解！"
 yug.14.d:0 "南斯拉夫的政治危机走向了最危险的方向。塞尔维亚、克罗地亚和斯洛文尼亚之间的关系已经完全无法调和。昨天，新成立的克罗地亚和斯洛文尼亚政府正式宣布，退出南斯拉夫联盟宣布独立，而贝尔格莱德方面予以强硬回复，宣称将采取行动捍卫南斯拉夫的完整。"
 
 yug.15.t:0 "塞族武装组织被镇压！"
 yug.15.d:0 "在克罗地亚军队的进攻下，克拉伊那和武科瓦尔地区的塞族准军事部队被镇压，残存分子被迫转移地下，支持塞族武装的南斯拉夫人民军也被迫撤离。"
 
 yug.20.t:0 "波斯尼亚独立公投"
 yug.20.d:0 "随着克罗地亚和斯洛文尼亚先后脱离南斯拉夫，波斯尼亚和黑塞哥维纳也将举行是否脱离南斯拉夫的公投。经过投票，波黑境内占多数的克罗地亚族和穆斯林族选择独立，宣布脱离南斯拉夫建立波斯尼亚和黑塞哥维纳共和国。而占人口少数的塞尔维亚人拒绝公投结果。"
 yug.20.a:0 "So sad."
 
 yug.21.t:0 "波黑内战爆发！"
 yug.21.d:0 "由于不满波斯尼亚独立公投和黑塞哥维纳脱离南斯拉夫的公投结果，波黑境内的塞尔维亚族宣布脱离波黑独立，建立塞族共和国。随后，波黑爆发了大规模各民族武装之间的武装冲突。"
 yug.21.a:0 "So sad."
 
 yug.30.t:0 "乌斯塔莎抵抗运动瓦解"
 yug.30.d:0 "经过南斯拉夫军队的围剿，该国境内西部最后一只有组织的乌斯塔莎武装团体宣布放下武器，至此，二战结束后长达近数年的克罗地亚乌斯塔莎民族主义叛乱结束。"
 yug.30.a:0 "确定。"
 
 
 yug.51.t:0 "[FROM.GetName]提出巴尔干联邦方案"
 
 yug.52.t:0 "[ROOT.GetName]赞成巴尔干联邦方案"
 yug.52.d:0 "[ROOT.GetName]表态支持巴尔干联邦计划，认为这为解决巴尔干问题提供了一个合理的方案。"
 
 yug.53.t:0 "[ROOT.GetName]反对巴尔干联邦方案"
 yug.53.d:0 "[ROOT.GetName]表态反对巴尔干联邦计划，认为这不过是贝尔格莱德政府的一个野心和妄想。"
 
 yug.54.t:0 "提出成立巴尔干经济共同体"
 
 yug.55.t:0 "加入成立巴尔干经济共同体"
 
 yug.56.t:0 "反对成立巴尔干经济共同体"
 
 yug.57.t:0 "南斯拉夫提出解决马其顿问题"
 
 yug.58.t:0 "南斯拉夫与保加利亚签署《布莱德协议》"
 yug.58.d:0 "南斯拉夫与保加利亚签署《布莱德协议》，以解决双方在马其顿问题上的纷争。南斯拉夫承认了保加利亚对东南马其顿的主权，作为让步，保加利亚承认该地区的马其顿族裔为少数民族，并保障其人权。"
 
 yug.59.t:0 "保加利亚拒绝对话解决马其顿问题"
 yug.59.d:0 "保加利亚与南斯拉夫之间就解决马其顿问题进行的谈判不欢而散。"
 
 
 yug.60.t:0 "[FROM.GetName]正式提出成立巴尔干联邦的邀请"
 yug.60.d:0 "贝尔格莱德向我们发来信息，邀请我们加入巴尔干联邦，以实现巴尔干半岛各国的和平、团结与统一。"
 
 yug.61.t:0 "[ROOT.GetName]宣布与南斯拉夫结成联邦"
 yug.61.d:0 "[ROOT.GetName]已决定与南斯拉夫合并，建立巴尔干联邦！"
 
 yug.62.t:0 "[ROOT.GetName]拒绝联邦方案"
 yug.62.d:0 "[FROM.GetName]与[YUG.GetName]就两国合并一事的谈判以失败告终，[FROM.GetName]拒绝加入巴尔干联邦！"
 
 yug.63.t:0 "[ROOT.GetName]反对巴尔干联邦的形成！"
 
 yug.64.t:0 "[ROOT.GetName]承认巴尔干联邦的建立"
 
 
 yug.65.t:0 "南斯拉夫提出解决科索沃问题"
 
 yug.66.t:0 "阿尔巴尼亚的态度"
 
 yug.67.t:0 "南斯拉夫与阿尔巴尼亚签署友好协议"
 yug.67.d:0 "南斯拉夫与阿尔巴尼亚签署协议，以解决双方在科索沃问题上的纷争。阿尔巴尼亚承认了南斯拉夫对科索沃的主权，作为让步，南斯拉夫承认该地区的阿尔巴尼亚族裔为少数民族，并保障其人权。"
 
 yug.68.t:0 "南斯拉夫与阿尔巴尼亚签署友好协议"
 yug.68.d:0 "南斯拉夫与阿尔巴尼亚签署协议，以解决双方在科索沃问题上的纷争。阿尔巴尼亚承认了南斯拉夫对科索沃的主权，且不再干涉南斯拉夫对科索沃问题的决策。"
 
 yug.69.t:0 "阿尔巴尼亚拒绝对话解决科索沃问题"
 yug.69.d:0 "阿尔巴尼亚与南斯拉夫之间就解决科索沃问题进行的谈判不欢而散。"
 
 
 yug.80.t:0 "铁托分子在[ROOT.GetName]正取得影响力！"
 yug.80.d:0 "苏联与南斯拉夫之间的矛盾逐渐扩大到其他东欧国家。主张远离莫斯科影响并亲近贝尔格莱德的铁托分子正在[ROOT.GetName]共产党内取得影响力！"
 
 
 yug.100.t:0 "布罗兹·铁托宣布辞职！"
 yug.100.d:0 "南斯拉夫共产党内发生政治变动，在最近的南斯拉夫共产党大会上，以亚历山大·兰科维奇为首的中央集权派，向铁托发难，反对并抨击联邦主义和对所谓的“地方民族主义分子的过度放任”，并得到了党内不少高层的支持。铁托在压力下，最终宣布辞去南斯拉夫共产主义联盟主席职位！"
 
 yug.101.t:0 "亚历山大·兰科维奇就任南斯拉夫总统！"
 yug.101.d:0 "在布罗兹·铁托失势并被迫辞职后，亚历山大·兰科维奇在党内中央集权派的拥护下，接任南斯拉夫共产主义联盟主席和南斯拉夫总统！"
 
 yug.102.t:0 "亚历山大·兰科维奇宣布辞职！"
 yug.102.d:0 "南斯拉夫共产党内发生政治变动，鼓吹大塞尔维亚主义的政治家亚历山大·兰科维奇等人，在铁托的压力下宣布辞职！"
 
 yug.103.t:0 "爱德华·卡德尔宣布辞职！"
 yug.103.d:0 "南斯拉夫共产党内发生政治变动，反对大塞尔维亚主义，鼓吹联邦制的政治家爱德华·卡德尔等人，在亚历山大·兰科维奇等大赛族主义者的压力下宣布辞职！铁托的威望也受到了影响。"
 
 yug.104.t:0 "布罗兹·铁托成为终身总统！"
 yug.104.d:0 "南斯拉夫领导人布罗兹·铁托，在最近一次南斯拉夫共产党大会上，宣布任命为南斯拉夫的终身总统，南斯拉夫国会同时为铁托授予大元帅、伟大领袖、伟大的导师、革命家和军事家的地位！"
 
 yug.105.t:0 "大塞尔维亚主义者的崛起！"
 yug.105.d:0 "在最近的南斯拉夫共产党大会上，发生了明显的政治权力变化。许多来自克罗地亚、斯洛文尼亚和科索沃的党内高层被宣布辞职，取而代之的是塞尔维亚党员。观察家认为，这意味着南共正逐渐放弃各民族平等的基本政策和联邦制度，主张中央集权的塞尔维亚优先主义者影响力正不断扩大。"
 
 yug.106.t:0 "斯洛博丹·米洛舍维奇担任塞尔维亚共和国总统"
 yug.106.d:0 "贝尔格莱德市长斯洛博丹·米洛舍维奇在塞尔维亚共产主义联盟近期的选举中，当选塞尔维亚社会主义共和国总统！"
 
 yug.107.t:0 "塞尔维亚开始削弱科索沃和伏伊伏丁那自治权"
 
 yug.108.t:0 "南共联盟大会上的激烈争辩"
 
 yug.109.t:0 "塞尔维亚社会党成立！"
 
 yug.110.t:0 "君主主义在塞尔维亚复活！"
 
 yug.111.t:0 "南斯拉夫民主联盟的成立！"
 
 yug.112.t:0 "南斯拉夫大选即将举行！"
 
 yug.113.t:0 "南斯拉夫社会党赢得大选！"
 
 yug.114.t:0 "君主主义者赢得南斯拉夫大选！"
 
 yug.115.t:0 "南斯拉夫民主联盟赢得大选！"
 yug.115.d:0 "南斯拉夫民主联盟赢得大选！"
 
 yug.116.t:0 "回到贝尔格莱德！"
 
 yug.117.t:0 "南斯拉夫公投宣布君主制复辟！"
 
 yug.118.t:0 "[YUG.GetLeader]在圣萨瓦大教堂加冕！"
 yug.118.d:0 "在南斯拉夫各族、各党派代表和议员见证下，卡拉乔治维奇家族的领袖，承蒙上帝恩典的南斯拉夫王国国王[YUG.GetLeader]在圣萨瓦大教堂加冕为南斯拉夫王国国王，宣告南斯拉夫王国的复辟！塞尔维亚和克罗地亚的保守民族主义者认为，一位君主可以有效地缓解南斯拉夫各民族之间的矛盾，但也有另一些政治观察家不这么认为。"
 
 yug.119.t:0 "塞尔维亚人对克罗地亚人崛起的不满！"
 
 yug.120.t:0 "贝尔格莱德爆发游行示威！"
 
 yug.121t:0 "塞尔维亚人与克罗地亚人爆发流血冲突！"
 
 yug.122.t:0 "塞尔维亚救国阵线成立！"
 
 
 yug.125.t:0 "马其顿偷渡者被处决"
 yug.125.d:0 "南斯拉夫政府今日宣布，以“叛国罪”处决了5名马其顿族男子。当局指控这些人试图非法越境进入希腊和保加利亚，旨在加入由苏联及保加利亚背后支持、谋求马其顿地区独立的“马其顿解放阵线”。南斯拉夫安全部门称，此举是对外部颠覆势力和分裂活动的严厉打击。\n保加利亚政府随即发表声明，断然否认与上述组织及人员存在任何关联，并谴责南斯拉夫的指控是“毫无根据的诽谤”。此事迅速引发国际媒体的高度关注。西方观察家指出，此次处决事件深刻反映了南斯拉夫联邦内部，尤其是塞尔维亚与马其顿共和国之间复杂且敏感的民族关系，以及铁托政权在冷战中面临的东西方地缘政治压力。"
 
 
 yug.150.t:0 "克罗地亚地方政府的不满"
 
 
 yug.152.t:0 "乌斯塔沙残余分子的活动"
 yug.152.d:0 "致南斯拉夫联邦人民共和国中央政府：\n\n兹汇报关于克罗地亚法西斯组织“乌斯塔沙”残余分子在我国西北边境地区的活动情况。\n自国家解放以来，该组织残余势力利用斯洛文尼亚与克罗地亚同奥地利、意大利接壤的复杂地形，在边境地区建立秘密通道和庇护网络。其活动主要集中在：策动针对地方干部、集体农庄和交通设施的破坏行动；向境内偷运反动宣传品；并试图与境外反南斯拉夫势力及西方情报机构建立联系。近期已挫败数起其策划的破坏铁路和袭击民兵哨所的事件。\n建议：立即增强边防军与内务部队在该区域的联合清剿力度，严控边境通行，并深入发动群众以切断其社会基础。这些分子虽规模有限，但破坏性及象征意义显著，需坚决肃清。\n\n南斯拉夫人民保卫局"
 
 yug.153.t:0 "乌斯塔沙致信中情局"
 yug.153.d:0 "致美国战略情报机构负责人\n\n我们，克罗地亚独立国的忠诚继承者，在奥地利萨尔茨堡和意大利的里雅斯特山区保有完整行动网络。铁托的共产党政权正用暴力镇压克罗地亚人的自由灵魂，但我们依然能在边境地带像山鹰般隐秘活动。\n当前欧洲被铁幕分裂，而南斯拉夫是共产主义阵营中脆弱的连接点。我们熟悉每一条潜入波斯尼亚和克罗地亚的森林密道，更掌握着当地对集体化不满的潜伏者名单。若贵方能提供微型无线电、外汇资金及美制轻武器，我们不仅能持续破坏铁路和征兵站，更能为华盛顿收集整个巴尔干社会主义阵营的军事部署和党内分歧情报。\n让克罗地亚的十字架再度成为刺向红色帝国肋部的匕首。\n\n于的里雅斯特"
 
 yug.154.t:0 "诱捕乌斯塔沙"
 yug.154.d:0 "致中央联邦政府：\n\n据驻奥地利情报站确认，乌斯塔沙残余分子正获得美方资金与装备支持。其头目柳博·米洛什计划于近期率领百余名武装分子，利用阿尔卑斯山丘地带，自克恩腾州越境潜入斯洛文尼亚，意图袭击铁路枢纽与地方行政机构。\n我方已掌握其通信密语及部分境外联络点。建议：立即启动“Gvardijan”行动，通过伪装接应人员、发送虚假指令，诱使其进入预设的伏击区（建议选址在穆尔斯卡索博塔附近山谷），由边防军第九支队实施合围逮捕。此举既可清除威胁，亦能获取美方干预的直接证据。\n\n人民保卫总局"
 
 yug.155.t:0 "乌斯塔沙进入克罗地亚"
 
 yug.156.t:0 "南斯拉夫成功挫败跨境渗透"
 yug.156.d:0 "南斯拉夫政府今日宣布，其国家安全机关近日成功实施代号“守卫者”的秘密军事行动，彻底粉碎了一股乌斯塔沙武装分子从奥地利向斯洛文尼亚的渗透企图。\n据悉，南情报部门提前侦获了此次渗透计划，并巧妙布设陷阱。在交火中，数十名试图强行越境的乌斯塔沙分子被击毙，其行动头目柳博·米洛什被活捉。政府声明指出，米洛什在二战期间曾担任伪克罗地亚独立国的监察局长，是亚塞诺瓦茨集中营系统性屠杀塞尔维亚人等受害者的主要策划与执行者之一，他将面临南斯拉夫人民的审判。\n南政府进一步宣称，此次行动不仅清除了眼前的威胁，更获取了关于乌斯塔沙组织在奥地利、意大利、匈牙利及葡萄牙等国残余网络的关键情报。声明中强烈质疑并谴责某些西方国家的情报机构为这些手上沾满鲜血的法西斯残余分子提供了活动便利与支持，称这是对南斯拉夫主权与战后和平秩序的粗暴干涉。"
 
 yug.157.t:0 "乌斯塔沙发起全面暴动！"
 
 yug.160.t:0 "南斯拉夫清洗马其顿族高官"
 yug.160.d:0 "南斯拉夫共产党中央委员会近日通过决议，将数名马其顿族高级官员开除出党，其中包括马其顿人民共和国的党政要员，另有多人遭到逮捕。被清洗者大部分属于或同情“马其顿革命组织”。\n该组织在第二次世界大战期间，曾是铁托领导的游击队抵抗纳粹及其傀儡政权的重要盟友，为南斯拉夫解放作出过贡献。然而，战后该组织主张马其顿地区应获得更大自治权，并呈现出亲近苏联与保加利亚的政治倾向，这与铁托构建“兄弟团结与统一”的南斯拉夫联邦路线，以及后来坚持独立自主的立场产生根本冲突。\n随着今年夏天苏南关系公开破裂，铁托决定采取果断措施，清除党内可能存在的、受莫斯科影响的“国际派”力量。此次针对马其顿族高官的集中清洗，是这场内部斗争的关键一环，旨在彻底巩固铁托的权威，确保南斯拉夫独立于苏联集团之外的政治道路。此举也加剧了南斯拉夫联邦内部复杂的民族关系张力。"
 
 
