 fra.340.t:0 "玛丽·勒庞与国民阵线的崛起"
 fra.340.d:0 "民族主义的崛起推动了保守主义政客的壮大。阿尔及利亚战争老兵、UDCA联盟前高官玛丽·勒庞和他的政党国民阵线在最近的选举中宛如一批黑马，取得了许多选票。国民阵线鼓吹反共、反犹太、恢复天主教国教地位和民族主义，被认为是极右翼政党。"
 
