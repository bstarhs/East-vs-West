 fra.350.t:0 "菲利普·贝当去世"
 fra.350.d:0 "曾被誉为"凡尔登救星"、后又因二战通敌被判死刑的法国元帅菲利普·贝当，今日在约岛医院去世，结束其毁誉参半的一生。\n这位第一次世界大战的英雄，在1940年法国战败后出任维希政权元首，与纳粹德国合作。1945年以叛国罪被判死刑，后改判终身监禁。弥留之际，仅有数名旧部获准探望。\n戴高乐办公室发表简短声明称："历史已作出审判。"随着这位争议人物的离世，法国最痛苦的战争记忆再度被揭开。贝当的遗体将安葬在约岛，墓碑背对大门，表示墓主犯下叛国之罪，如同对这个复杂一生的最简注解。"
 
 fra.351.t:0 "法国先锋戏剧大师安托南·阿尔托逝世"
 fra.351.d:0 "曾法国著名戏剧理论家、诗人安托南·阿尔托因直肠癌在巴黎逝世，终年51岁。阿尔托是20世纪最具颠覆性的艺术思想家之一，其“残酷戏剧”理论深刻影响了现代实验剧场。\n阿尔托1896年生于马赛，早年饱受精神疾病困扰，1920年代投身巴黎超现实主义运动，后因理念分歧退出。他主张戏剧应超越文本，以肢体、声音和空间直接冲击观众，并在1938年发表代表作《戏剧及其重影》，提出“残酷戏剧”理论，强调戏剧的原始性与破坏力。尽管其执导的《钦契》等作品未能获得当时认可，他的理念却在战后启发无数先锋艺术家。\n晚年阿尔托经历长期精神病院禁锢，仍坚持创作，留下大量诗歌与散文。他的离世标志着一位反叛天才的陨落，但其艺术精神将继续震撼后世。"
 fra.351.a:0 "愿他的艺术思想能震撼另一个世界。"
 
 fra.360.t:0 "法国提议成立欧洲原子能共同体"
 fra.360.d:0 "法国政府今日正式向欧洲煤钢共同体成员国提交提案，建议成立欧洲原子能共同体，以促进西欧国家在和平利用核能领域的全面合作。这一倡议被视为欧洲一体化进程的重要里程碑。\n根据提案草案，共同体将统筹铀矿资源分配，建立联合核研究中心，并制定统一的核安全标准。法国外长在记者会上强调："原子能是未来的能源，欧洲必须团结才能与美国、苏联竞争。"\n专家指出，该计划将整合西欧分散的核研究力量，特别是帮助意大利、西德等缺乏资源的国家发展核电。提案特别规定所有研究成果"仅用于民用"，并接受国际原子能机构监督。\n若计划顺利实施，欧洲首个核反应堆有望在1960年前投产。随着《罗马条约》谈判进入关键阶段，原子能共同体或将成为欧洲经济共同体的"姊妹组织"，共同推动战后欧洲的复兴与联合。"
 
