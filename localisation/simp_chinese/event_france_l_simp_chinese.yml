l_simp_chinese:
 fra.1.t:0 "政府更替"
 
 fra.3.t:0 "1954年选举"
 
 fra.5.t:0 "军方反乱！"
 fra.5.d:0 "以阿尔及利亚军团为首的军队发生哗变！他们已经对第四共和国动荡不安的政治局势和阿尔及利亚问题上的无能丧失信心。这些军官组织武装力量进入巴黎，要求戴高乐组阁领导法国，否则就将发起兵变！"
 
 fra.6.t:0 "法国军事政变爆发！"
 fra.6.d:0 "法国军方与当局因阿尔及利亚战事的紧张关系终于被点燃！在总统拒绝任命夏尔·戴高乐组建军事政府后，以雅克·马絮为首的法国右翼军人派遣武装部队占领法国多地！法国已陷入内战！"
 
 fra.8.t:0 "政府邀请夏尔·戴高乐组阁"
 fra.8.d:0 "在群众压力下，法国总统被迫邀请戴高乐组建新政府。在退出政坛十二年后，这位自由法国的领袖再次成为这个衰落中的欧洲大国的领导者。"
 
 fra.10.t:0 "法兰西共同体形成"
 fra.10.d:0 "随着去殖民地化成为世界潮流，法国也开始放松对殖民地的控制。法国通过新的宪法草案，将法兰西联盟改为法兰西共同体，给予非洲国家一定的政治权利。"
 
 fra.12.t:0 "学生示威游行！"
 
 fra.13.t:0 "1969年宪法选举"
 
 fra.15.t:0 "军事政变！"
 fra.15.d:0 "法国军方与[FRA.GetRulingParty]的紧张关系终于被点燃！这些军官组织武装力量进入巴黎，要求组建军事政府领导法国，否则就将发起兵变！"
 
 fra.16.t:0 "法国希望改善与我们的关系"
 fra.16.d:0 "自从夏尔·戴高乐上台，法国政府便致力于改善与欧洲各国的关系。法国外交部向我们发来信息，希望进一步改善与我国的关系，以实现欧洲国家的团结。"
 
 fra.18.t:0 "[FROM.GetName]的回应"
 fra.18.d:0 "[FROM.GetName]回应了我们的信息，他们对改善两国关系和实现欧洲团结十分有兴趣。"
 
 fra.19.t:0 "法国寻求独立外交"
 fra.19.d:0 "法国总统戴高乐近日发布声明，指出法国现在受到美国的政治影响太严重，指责美国正在将欧洲变成仆从国。戴高乐认为，法国必须寻求一条独立的道路，而非为美国服务，他呼吁法国和欧洲团结起来，摆脱美国政治影响。"
 
 fra.20.t:0 "法国宣布退出北约！"
 fra.20.d:0 "随着法国总统戴高乐与英美两国分歧越来越大，戴高乐愈发对北约干涉法国军事政策愈发不满。近日，戴高乐正式宣布，法国将退出北约军事一体化结构，从北约联合部队中撤出法国舰队和部队。戴高乐还计划未来将驻扎在法国领土上的北约部队全部驱逐。"
 
 fra.21.t:0 "法国驱逐北约！"
 fra.21.d:0 "法国总统戴高乐向我们发出最后通牒，要求北约部队限时全部撤离法国，我们如何回复？"
 
 fra.22.t:0 "美国拒绝撤军！"
 fra.22.d:0 "美国等北约国家拒绝撤出他们在我们领土上的部队！"
 
 fra.23.t:0 "法国对北约部队采取武力！"
 fra.23.d:0 "美国等北约国家拒绝了戴高乐的最后通牒，拒绝撤出他们在法国领土上的部队！戴高乐决定采取军事行动，派出部队驱逐北约部队，目前双方已经发生激烈交火！/n(法国必须在战争支持度低于60%之前占领布鲁塞尔和伯恩，达成这两个目标即可取得胜利，否则算作法国失败，将导致戴高乐下台和稳定度大削）"
 
 fra.24.t:0 "北约向法国求和！"
 fra.24.d:0 "经过激烈战斗，法军不仅击败了占据法国领土的北约部队，甚至进入了比利时和联邦德国境内。布鲁塞尔和波恩政府被迫向与法国签署停战协定，在戴高乐威胁下，这两国退出了北大西洋公约组织。美国对此气急败坏，但比利时和西德的退出基本瓦解了美军在欧洲的势力。"
 
 fra.25.t:0 "埃迪特·皮雅芙去世"
 fra.25.d:0 "法国国宝级女歌手埃迪特·皮雅芙因肝癌去世。埃迪特·皮雅芙是法国知名的香颂演唱家，也是一位具有传奇经历的女歌手，曾经创作过《玫瑰人生》和《我无怨无悔》等歌曲，并将其带到了美国，然而皮雅芙今年因酗酒身体状况逐渐恶化，最终因此去世，年仅42岁。法国政府为皮雅芙举行了国葬，以哀悼这位法兰西人民心目中的玫瑰。"
 
 fra.26.t:0 "反对德法建交的示威游行！"
 fra.26.d:0 "在我国决定改善与联邦德国关系的消息传出后，全国各地爆发了大规模示威游行，参与者包括学生、左派势力和二战幸存者。示威者痛斥并反对与德国改善关系的决定，并宣称这是对第二次世界大战牺牲者的背叛和对纳粹的妥协。"
 
 fra.27.t:0 "德国与法国宣布签署《爱丽舍条约》"
 fra.27.d:0 "随着联合主义在战后的欧洲得到重视，德、法两国决定摒弃前嫌，改善关系。两国领导人见证了《德法关系条约》在爱丽舍宫的签署。"
 
 fra.28.t:0 "法国宣布成立莱茵兰共和国！"
 fra.28.d:0 "法国政府发布消息！巴黎已决定，在其占领的德国领土上建立一个独立的莱茵兰共和国，并将其划入法国保护之下！"
 fra.28.a:0 "德国的分裂已成定局。"
 
 fra.29.t:0 "萨尔兰回归德国"
 fra.29.d:0 "法国、联邦德国和萨尔兰代表在卢森堡签订协议，在萨尔兰举行公投，并根据公投结果，使萨尔兰加入联邦德国。"
 
 fra.30.t:0 "戴高乐在蒙特利尔宣布支持魁北克"
 fra.30.d:0 "法国总统夏尔·戴高乐在访问加拿大蒙特利尔世博会市，在蒙特利尔市政厅的演讲中大喊：自由魁北克万岁！这被认为是对魁北克独立运动的支持，激起了魁北克法语人口的支持和加拿大的强烈不满。"
 
 fra.31.t:0 "法国宣布支持魁北克独立运动！"
 fra.31.d:0 "法国政府正式宣布，他们将对魁北克独立运动提供力所能及的支持。"
 
 fra.32.t:0 "君主主义运动正在复苏！"
 fra.32.d:0 "由于法兰西第四共和国政府的混乱不堪，法国群众对法国现有体制愈发失望，各种政治运动开始发展，其中包括要求废除共和体制，重建法兰西帝国的政党，近年来也不断崛起。"
 
 fra.33.t:0 "法国邀请我们加入欧洲防务共同体"
 fra.33.d:0 "法国近期在欧洲大陆的势力扩张令人不安。巴黎向我们发出了强硬的通牒，要求我们加入他们主导的欧洲防务共同体。"
 
 fra.34.t:0 "[FROM.GetName]宣布加入欧洲防务共同体"
 fra.34.d:0 "[FROM.GetName]宣布加入欧洲防务共同体。"
 
 fra.35.t:0 "[FROM.GetName]拒绝加入欧洲防务共同体"
 fra.35.d:0 "[FROM.GetName]拒绝加入欧洲防务共同体。"
 
 fra.36.t:0 "[FROM.GetName]申请加入欧洲经济共同体"
 fra.36.d:0 "[FROM.GetName]希望加入欧洲经济共同体，我们作为欧共体成员国将进行投票，如若超过一半成员国投下反对票，[FROM.GetName]就会被拒绝。投票时限为5日，请您暂停游戏时间再投票。"
 
 fra.37.t:0 "[FROM.GetName]宣布加入欧洲经济共同体"
 fra.37.d:0 "[FROM.GetName]宣布加入欧洲经济共同体。"
 
 fra.38.t:0 "[FROM.GetName]被拒绝加入欧洲经济共同体"
 fra.38.d:0 "[FROM.GetName]被拒绝加入欧洲经济共同体。"
 
 fra.39.t:0 "《罗马条约》正式签署"
 fra.39.d:0 "罗马卡比托利欧山，春寒料峭中透着暖意。外长们的钢笔同时触碰羊皮纸的瞬间，奎里纳莱宫的枝形吊灯微微晃动——不是风吹的，而是摄影师们挤塌了三脚架。\n法国代表签完字后，下意识摸了摸西装内袋。那里装着来自鲁尔区洛林的矿产区的报告，现在它们将和德国人的焦炭混在同一个统计表里。他想起上次这么多欧洲人聚在一起，还是纽伦堡审判的时候。\n当香槟泡沫漫过杯沿时，比利时外长突然提议用六国语言合唱《欢乐颂》。跑调的歌声中，服务生正准备换下桌布，一名官员及时收走了桌子上的一叠文件：德国的煤矿、比利时的铁矿、荷兰的港口、法国的工业区……\n\n《罗马条约》已签署，欧洲煤钢共同体已形成，欧洲经济共同体迈出了实现的第一步。"
 
 fra.40.t:0 "法、德邀请我们加入欧洲经济共同体"
 fra.40.d:0 "欧洲联合主义正成为战后西欧的共识，随着法国、意大利和德国成立欧洲经济共同体，我们也将有机会参与其中。"
 
 fra.41.t:0 "选择我们的国王"
 fra.41.d:0 "法国即将重建君主制，目前把旁王朝和拿破仑王朝的王室后裔有机会成为法兰西王位的候选。"
 
 fra.42.t:0 "法国君主制复辟！"
 fra.42.d:0 "法国的政局混乱最终导致了令人惊讶，而又意料之中的结果。经过法国国民议会公投，法国决定终结混乱的共和制，宣布君主制度复辟！[FRA.GetLeader]被国民议会邀请，宣布加冕法兰西国王！"
 
 fra.43.t:0 "世界卫生组织成立"
 fra.43.d:0 "联合国下属世界卫生组织在瑞士日内瓦成立，该组织将致力于帮助世界人民消灭疾病。"
 fra.43.a:0 "愿人类远离疾病"
 
 fra.44.t:0 "法国提出与德国的经济合作"
 fra.44.d:0 "法国外交部长罗贝尔·舒曼召开新闻发布会，宣布该国已决定与德国进行接触，以推动两国之间关于煤炭和钢铁产业的进一步合作。"
 
 fra.50.t:0 "[FROM.GetName]在法兰西共同体内独立"
 fra.50.d:0 "[FROM.GetName]政府正式宣布，该国已经结束了长达数十年的法国殖民统治，实现独立，建立新的共和国政府，但该国依然留在巴黎主导的法兰西共同体内，法国人在未来仍将继续对该国的经济和政治产生影响。"
 
 fra.51.t:0 "决定我们未来命运的公投"
 
 fra.52.t:0 "[FROM.GetName]决定完全独立"
 fra.52.d:0 "[FROM.GetName]政府正式宣布，该国已经结束了长达数十年的法国殖民统治，实现独立，建立新的共和国政府。"
 
 fra.60.t:0 "法兰西第五共和国宪法颁布！"
 fra.60.d:0 "法国国会于今日正式宣布新的《法兰西共和国》宪法生效，法国进入第五共和国时代！新的宪法强化了总统的权力，总统将掌握更大的行政权力，以确保最高行政权不会因为议会改选或政党变化受到影响，从而保证政府稳定执政。"
 
 fra.61.t:0 "夏尔·戴高乐正式就任法国总统！"
 fra.61.d:0 "香榭丽舍大街被蓝白红三色淹没。人群向敞篷车抛洒玫瑰，花瓣粘在将军的军装上。收音机里循环播放着《马赛曲》，却没人注意到他嘴角的紧绷——那比法国失去马奇诺防线时还要僵硬。\n当欢呼声浪稍歇，他瞥见秘书手中阿尔及利亚战报的边角——某处村庄的伤亡数字正渗出新鲜墨渍。戴高乐在这时候被推举为总统，有人希望他能弥合国家，也有人认为他将成为阿尔及利亚问题的替死鬼……如果他做出了不谨慎的选择，那么右翼势力和阿尔及利亚解放阵线将会替他体面。\n\n来自巴黎的消息，已经淡出政坛多年的二战英雄夏尔·戴高乐就任法国总统，再一次领导这个国家！"
 
 fra.62.t:0 "夏尔·戴高乐正式就任法国总统！"
 fra.61.d:0 "香榭丽舍大街被蓝白红三色淹没。人群向敞篷车抛洒玫瑰，花瓣粘在将军的军装上。收音机里循环播放着《马赛曲》，却没人注意到他嘴角的紧绷——那比法国失去马奇诺防线时还要僵硬。\n当欢呼声浪稍歇，他瞥见秘书手中阿尔及利亚战报的边角——某处村庄的伤亡数字正渗出新鲜墨渍。戴高乐在这时候被推举为总统，有人希望他能弥合国家，也有人认为他将成为阿尔及利亚问题的替死鬼……如果他做出了不谨慎的选择，那么右翼势力和阿尔及利亚解放阵线将会替他体面。\n\n来自巴黎的消息，已经淡出政坛多年的二战英雄夏尔·戴高乐就任法国总统，再一次领导这个国家！"
 
 fra.63.t:0 "商人和工匠防御联盟的成立"
 fra.63.d:0 "一个由小店主皮埃尔·布热德成立的政党在法国南方取得了支持，他们自称商人和工匠防御联盟（UDCA），主张保护中小企业和中产阶级的利益，反对政府剥夺群众，尤其是增税。此外，布热德还支持保守的经济政策，反对过度扩大工业化、城市化和美国经济与文化渗透。媒体认为皮埃尔·布热德属于民粹主义政党。"
 
 fra.64.t:0 "UDCA支持率的迅速提高"
 fra.64.d:0 "法兰西第四共和国的经济下滑引起了中产阶级的强烈不满，使得皮埃尔·布热德的威望和支持率迅速提高。"
 
 fra.65.t:0 "皮埃尔·布热德当选法国总理！"
 fra.65.d:0 "法国大选迎来了令人意想不到的结果！民粹主义政治家皮埃尔·布热德和他的商人和工匠防御联盟获得多数选票，入主波旁宫，而党首皮埃尔·布热德也将进入爱丽舍宫，成为法兰西共和国的下一任总理。皮埃尔·布热德宣布，政府向公民盗窃和索取财产的时代结束了，他将大力削减税收和政府支出，限制政府对市场、金融和私人企业的控制。"
 
 fra.66.t:0 "法国青年民族运动崛起"
 fra.66.d:0 "法兰西第四共和国的政治混乱导致了诡异政治团体的兴起。皮埃尔·西多士是法国法西斯运动的前成员和维希政权的拥护者，他在二战结束后短暂被捕后出狱，最近他又纠结了一批维希政府的残党和第四共和国的反对者，组建了新的法西斯政党——法兰西青年民族。"
 
 fra.67.t:0 "皮埃尔·西多士进入政府"
 fra.67.d:0 "爱丽舍宫的镀金大门向极端右翼敞开。青年民族运动党的徽章——那枚缠绕着闪电的橡木十字，第一次出现在部长会议厅的衣帽架上。\n极端右翼法西斯主义者，青年民族运动党首皮埃尔·西多士被法国政府邀请，进入内阁。\n曾经被斥为德国人走狗的西多士，如今却堂而皇之地站在波旁宫的大厅内，扶了扶眼镜，开始谈论着所谓的国家革命、大法兰西、民族阵线……几年前，他因这些言论锒铛入狱，但现在，没人敢再对他的政治主张提出意见。"
 
 fra.68.t:0 "法国青年民族运动被封杀！"
 fra.68.d:0 "法国政府与警察开展了强硬的反对右翼势力的行动，捣毁多个极端组织，逮捕多个右翼势力头目。青年民族运动被法国警方摧毁，头目皮埃尔·西多士再次被捕二进宫。"
 
 fra.69.t:0 "皮埃尔·布热德淡出政坛"
 fra.69.d:0 "随着法国的经济状况逐渐恢复，皮埃尔·布热德和他的民粹主义政策不再受到狂热的拥护。商人和工匠防御联盟宣布解散，布热德宣布淡出政坛，但他依然热衷于发表政治文章。"
 
 fra.70.t:0 "法兰西民族行动党的崛起"
 fra.70.d:0 "在凯尔特十字旗飘扬的波旁宫，法国的极右翼势力齐聚一堂。在让·马里·勒庞、皮埃尔·西多士和莫里斯·帕彭等极右翼政客的见证下，法兰西青年民族运动、火十字团、西方组织和国民阵线等极右翼党派正式合并，成为法国规模最大的的极右翼政党——法兰西民族行动。"
 
 
 
 fra.100.t:0 "法兰西民主共和国的建立！"
 fra.100.d:0 "红星照耀塞纳河，红旗遍布法兰西。万里江山万里红，人民当家做主人！\n在巴黎公社覆灭七十多年后，无产阶级再一次取得了法兰西共和国的政权！法国共产党取得法国政权后，在法国国会上，正式通过了社会主义的宪法，宣布建立无产阶级专政的社会主义国家！资产阶级的国家机器被废除，非左翼的各种党派被限制活动，法国总统一职被废除，法国共产党总书记[FRA.GetLeader]以部长会议主席的身份入主爱丽舍宫。总书记向全国人民宣布，法兰西将在伟大的党的领导下，完成社会主义改革，建立公正、进步、繁荣的工农阶级社会主义国家！"
 
 fra.101.t:0 "法国共产党召开联合政府大会！"
 fra.101.d:0 "法国共产党政府在最近召开的法国国会上，提出了团结法国各阶级，建立发达的民主社会主义的纲领。法国总理，兼共产党总书记指出，斯大林式的社会主义，是一种危险的极权主义路线，不适合具有民主传统的法兰西，因此法国共产党承诺，不搞苏联模式，不高一党专政，而是团结各民主党派，团结各进步阶级，建立民主的社会主义模式。"
 
 fra.102.t:0 "法国共产党代表与天主教会的会面"
 fra.102.d:0 "法国总理，兼共产党总书记率领左派政党代表团，访问了位于圣丹尼、里昂等地的天主教会，并与教会的大主教会面。这一事件引起了法国国内和各国的关注，因为人们常常认为共产主义与宗教是水火不容的，但法国共产党却主动向天主教会排除橄榄枝，而教会中的左翼人士似乎也愿意支持共产党内阁的一些政策，这有效地缓和了共产党与保守人士的紧张关系，也展示了法国共产党非斯大林主义的一面。"
 
 fra.103.t:0 "法国军队中的左翼势力壮大"
 
 fra.104.t:0 "法兰西人民公社成立！"
 fra.104.d:0 "起来 饥寒交迫的奴隶！  起来 全世界受苦的人！\n满腔的热血已经沸腾 要为真理而斗争！！\n在红旗环绕下的巴黎，在工人的欢呼下，[FRA.GetLeader]主席来到了战神广场。1870年，巴黎公社正是在这里宣告成立，而在无产阶级再一次成为法兰西的主人的今天，为了纪念这一次伟大的、不朽的斗争，为了将公社无产阶级革命的精神传承下去，[FRA.GetLeader]同志宣布，工人阶级领导下的法兰西，不再是一个“资产阶级专政的国家机器”，正式改法国国号为法兰西人民公社，法国政府改为公社制度，建立无产阶级的民主专政，并提出，将法兰西建立为真正的，由工人建立的无产阶级政权！"
 
 fra.105.t:0 "法国陷入恐怖统治！"
 fra.105.d:0 "法国的局势已经失控！从加来到比利牛斯，整个法国都陷入了反共分子与共产党拥护者之间的武装冲突中，鲜血几乎染红了塞纳河与卢瓦尔河！然而法国共产党依然坚信，一切的反对者都是外国敌对势力和封建反动顽固势力的傀儡，面对暴力反抗，只有暴力反抗一个手段。\n疯狂的法国共产党在被改名为“革命者宫”的旧波旁宫中，宣布通过《镇压反革命临时条例》，这个与当年马克西米连·罗伯斯比尔推广的恐怖统治如出一辙的条例，宣布任何被怀疑反对革命政权的可疑分子，都可以立刻拘捕甚至处死，为了威慑反革命分子，当局在埃菲尔铁塔下，竖起了断头台，将多个政治犯斩首，以儆效尤！"
 
 fra.106.d:0 "莫里斯·多列士去世"
 fra.106.t:0 "莫里斯·多列士同志因病在巴黎去世，法国共产党召开会议，选举新一任法国共产党总书记。"
 
 fra.107.t:0 "雅克·杜克鲁斯当选法国共产党总书记"
 fra.107.d:0 "雅克·杜克鲁斯在新一届法国共产党大会上，当选法国共产党总书记。"
 
 fra.108.d:0 "雅克·杜克鲁斯辞职"
 fra.108.t:0 "雅克·杜克鲁斯同志因病在宣布辞职，法国共产党召开会议，选举新一任法国共产党总书记。"
 
 fra.109.t:0 "瓦德克·罗歇当选法国共产党总书记"
 fra.109.d:0 "瓦德克·罗歇在新一届法国共产党大会上，当选法国共产党总书记。"
 
 fra.110.t:0 "让·保罗·萨特当选法国共产党总书记"
 fra.110.d:0 "左翼文学家和哲学家让·保罗·萨特在新一届法国共产党大会上，当选法国共产党总书记。"
 
 fra.111.t:0 "亨利·居里当选法国共产党总书记"
 fra.111.d:0 "法国外交部长亨利·居里在新一届法国共产党大会上，当选法国共产党总书记。亨利·居里是法国与埃及混血，曾参与阿尔及利亚革命，法国的共产党政府成立后，亨利·居里作为外长，积极支持世界各地的左翼革命和反殖民运动，支持世界革命理论。"
 
 fra.112.t:0 "夏尔·贝特海姆当选法国共产党总书记"
 fra.112.d:0 "毛主义政治家夏尔·贝特海姆在新一届法国共产党大会上，当选法国共产党总书记。"
 
 fra.113.d:0 "夏尔·贝特海姆辞职"
 fra.113.t:0 "夏尔·贝特海姆总书记同志宣布因年长辞职，法国共产党召开会议，选举新一任法国共产党总书记。"
 
 fra.114.t:0 "雅克·萨瓦热特当选法国共产党总书记"
 fra.114.d:0 "年轻的学生运动领袖雅克·萨瓦热特在新一届法国共产党大会上，当选法国共产党总书记。雅克·萨瓦热特是巴黎大学学生、巴黎学生自治委员会主席和毛主义者，因成功主导了法国的教育改革，被夏尔·贝特海姆书记看中，被提携进入政府，并迅速升迁。现年四十多岁的雅克非常年轻。"
 
 fra.115.t:0 "法兰西公社委员会的成立"
 fra.115.d:0 "在最近的法兰西人民公社总会议上，法国共产党宣布，随着法兰西革命的胜利、社会主义改造的完成、无产阶级专政的推广和公社委员会制度的落实，法国共产党作为列宁主义先锋党的伟大使命已经结束，因此决定结束党对国家的绝对领导，将国家执政大权力，交给由全国无产阶级民主选举产生的公社委员会，由委员会进行集体领导，委员会的所有常务委员将一起担任国家元首兼政府首脑，一同领导这个国家。"
 
 fra.116.t:0 "让·保罗·萨特辞职"
 fra.116.t:0 "让·保罗·萨特总书记同志宣布因年长辞职，法国共产党召开会议，选举新一任法国共产党总书记。"
 
 fra.117.t:0 "乔治·马歇当选法国共产党总书记"
 fra.117.d:0 "乔治·马歇在新一届法国共产党大会上，当选法国共产党总书记。"
 
 fra.118.t:0 "法国共产党与海外领地的左翼势力接触"
 
 fra.120.t:0 "中国代表团抵达巴黎"
 fra.120.d:0 "赛纳河旁波涛涌，香榭丽舍红旗飘\n在法兰西人民的热烈欢呼下，来自遥远东方的中国革命群众代表团，飞抵巴黎欧仁·鲍迪埃机场，法国人民代表亲切接见了中国代表团。\n中国代表团的这次访问，是应法兰西公社的邀请，前来巴黎，参观和指导法国的文化革命和社会主义思想建设，在伟大的毛泽东思想指导下，法国也展开了轰轰烈烈的无产阶级文化革命，杂碎旧世界，传播新文化、新思想。为了让无产阶级革命艺术也能在法国大地发光发热，法国的革命艺术家，深度学习中国知名革命样板戏《白毛女》和《红色娘子军》，与著名的歌剧《卡门》所结合，创作出了具有革命色彩的《新卡门》，并将其作为法兰西文化革命的重大成果，向中国同志展示。"
 
 fra.121.t:0 "《新卡门》在巴黎歌剧院演出"
 fra.121.d:0 "在遥远的中国农村，农民们正在劳作，红军战士兴奋地前来告诉大家，反动的女地主被抓住了！战士把女地主押来，愤怒的群众声讨女地主，然而年轻的战士却对地主产生了怜悯之心。深夜，女地主将战士引诱到河边，战士被对方所欺骗，便擅自将地主放走。\n战士受到审判，被剥夺职权，又偷偷去找女地主，哪知女地主已投入反动士兵怀抱，抛弃了战士。战士幡然醒悟，找到上级领导汇报敌军阵地，红军派出英勇的红色娘子军前去袭击，全歼反动军队。女地主被俘后再一次试图对年轻战士使用美人计，但这一次战士不再受骗，毫不犹豫地杀死了女地主。\n表演结束后，中国代表团对这一优秀的作品表达了高度的赞赏。"
 
 fra.130.t:0 "[FROM.GetName]宣布拒绝承认法国的新政府！"
 fra.130.d:0 "[FROM.GetName]殖民地当局发表声明，拒绝承认的共产党新政府！"
 
 fra.131.t:0 "非洲民主联盟获取[FROM.GetName]政权！"
 
 
 fra.150.t:0 "工人国际法国支部的衰败"
 fra.150.d:0 "随着戴高乐政府的成立和戴高乐主义的崛起，以工人国际法国支部、激进党等党派为代表的左翼势力支持率不断下降。"
 
 fra.151.t:0 "法国社会党成立" #自然发生
 fra.151.d:0 "面对左翼势力的衰败，法国各左派政党决定团结起来，成立一个新的政党以实现统一。工人国际法国支部、左派重建俱乐部联盟和社会主义团体与俱乐部联盟宣布合并，成立法国社会党。"
 
 fra.152.t:0 "法国社会党进入政府" #国策触发
 fra.152.d:0 "法国社会党的支持率在近期的选举活动中迅速增加，并因此获得了进入法国内阁的资格。"
 
 fra.153.t:0 "法国社会党成立" #左线国策触发
 fra.153.d:0 "在法国共产党提议成立联合政府后，法国的许多左翼政党认为，应该将分散的左翼小党派统合起来，以建立一个可以和共产党二分权力的大党。工人国际法国支部、左派重建俱乐部联盟和社会主义团体与俱乐部联盟宣布合并，成立法国社会党。"
 
 fra.154.t:0 "法国共产党与社会党提出联合纲领"
 fra.154.d:0 "法国共产党与法国社会党共同提出了《二月纲领》，作为未来联合政权的基本法。由于大部分法国民众对共产党通知法国仍有顾虑，共产党决定，支持社会党领袖参选总统。"
 
 fra.155.t:0 "法国总统选举"
 
 fra.156.t:0 "左翼联合阵线赢得法国总统选举"
 
 fra.157.t:0 "弗朗索瓦·密特朗加入法国社会党"
 
 fra.158.t:0 "1980年法国总统选举"
 
 fra.159.t:0 "法国左派联盟瓦解！"
 
 fra.160.t:0 "弗朗索瓦·密特朗当选法国总统！"
 
 fra.161.t:0 "雅克·希拉克当选法国总统！"
 
 fra.161.d:0 "米歇尔·罗卡当选法国总统！"
 
 #如社会党没有成立，则希拉克和巴拉迪尔参选总统
 
 
 fra.200.t:0 "波尔布特当选法国共产党领导人"
 fra.200.d:0 "随着法共党代会落幕，来自柬埔寨的入籍党员波尔布特，原名沙洛特绍，当选为法国共产党和法兰西人民共和国的新一任领导人，这可能是欧洲的第一位亚裔国家元首。"
 
 fra.201.t:0 "[FROM.GetName]宣布支持法国的反对势力"
 fra.201.d:0 "[FROM.GetName]宣布，法国共产党的上台已经对欧洲的自由带来威胁，该国支持一切反对共产党统治的法国反对派。"
 
 fra.202.t:0 "让·德·拉特尔·德·塔西尼病逝"
 fra.202.d:0 "法国将领让·德·拉特尔·德·塔西尼将军因病去世，他在第二次世界大战时期领导自由法国解放北非和法国南部，并在战后前往亚洲对抗越盟。"
 
 fra.203.t:0 "反对继续越南战争的游行示威"
 fra.203.d:0 "巴黎爆发示威游行，反对继续在印度支那的战事，示威者职责当局在殖民地战争中大量投入了无谓的成本，严重浪费了本国的人力物力财力，呼吁尽早结束战争！"
 
 fra.204.t:0 "反对继续阿尔及利亚战争的游行示威"
 fra.204.d:0 "巴黎爆发示威游行，反对继续在阿尔及利亚的战事，示威者职责当局在殖民地战争中大量投入了无谓的成本，严重浪费了本国的人力物力财力，呼吁尽早结束战争！"
 
 fra.205.t:0 "反对接受马歇尔计划的游行示威"
 fra.205.d:0 "左翼势力发动了示威游行，反对接受马谢尔计划的资助，他们认为这是向美国人屈服并出卖本国利益。"
 
 fra.206.t:0 "反对法国共产党的游行"
 fra.206.d:0 "许多市民和知识分子发起示威游行，反对共产党不断扩大的政治影响力。"
 
 fra.207.t:0 "法国共产党反对政府的劳工政策"
 
 fra.208.t:0 "法国左翼联合政府破裂"
 fra.208.d:0 "随着法国总理与法国共产党、工人党等左翼势力的矛盾不断激化，在二战结束后执掌法国的左派联合政府宣告破裂！共产党的官员被开除出政府，而左派势力斥责当局向帝国主义低头。"
 
 fra.209.t:0 "保罗·拉马迪埃内阁倒台"
 fra.209.d:0 "随着法国总理与法国共产党、工人党等左翼势力的矛盾不断激化，在二战结束后执掌法国的左派联合政府宣告破裂！保罗·拉马迪埃在左翼压力下被迫辞职，右派政党也遭到打击，共产主义者趁机获取了许多国会议席。"
 
 
 fra.250.t:0 "左翼势力的示威游行"
 fra.250.d:0 "新成立的[FRA.GetName]并未能获得所有法国人的认可，支持法国共产党、社会党的左翼势力发起示威游行，反对[FRA.GetRulingParty]！"
 
 fra.251.t:0 "左翼势力发起暴动"
 fra.251.d:0 "反对[FRA.GetRulingParty]的左派势力发起示威游行，并演变成暴力冲突！示威者攻击警察和政府部门，多人受伤。"
 
 fra.252.t:0 "左翼势力发起工人罢工！"
 
 fra.253.t:0 "法国爆发左翼势力与警察的流血冲突！"
 
 fra.254.t:0 "法国共产党在莫斯科成立流亡政府"
 fra.254.d:0 "法国境内反对[FRA.GetRulingParty]的斗争进一步激化，以法国共产党、社会党为代表的左翼政治家逃亡苏联莫斯科，并宣布成立法兰西民主共和国临时政府，呼吁法兰西人民像第二次世界大战时期的自由法国一样，团结起来，反对法国现政府的统治！"
 
 fra.255.t:0 "法国人民解放军成立！"
 fra.255.d:0 "法兰西民主共和国临时政府的支持下，法国左翼武装力量组成的人民解放军正式成立！"
 
 fra.256.t:0 "法国解放军暴动！"
 fra.256.d:0 "法国解放军成立后，政治局势不断恶化，一些激进的左派团体开始组织武装部队，制造暴动。"
 
 fra.257.t:0 "法国解放战争爆发！"
 fra.257.d:0 "来自巴黎的紧急消息！法国左派武装在巴黎、马赛、凡尔赛、圣丹尼多个大城市发起暴动，占领了当地政府！法国人民解放军宣布，法国解放战争已经开始，他们将武力推翻[FRA.GetRulingParty]的暴政，解救法兰西！"
 
 
 fra.260.t:0 "右翼势力的示威游行"
 fra.260.d:0 "新成立的[FRA.GetName]并未能获得所有法国人的认可，反对法国共产党的右翼势力发起示威游行，反对共产主义政府统治！"
 
 fra.261.t:0 "法国天主教保守势力在南方发起暴动！"
 fra.261.d:0 "支持天主教保守势力，反对社会主义改革的保守分子发起示威游行，并演变成暴力冲突！示威者攻击警察和政府部门，多人受伤。"
 
 fra.262.t:0 "保王势力在西部发起暴动！"
 fra.262.d:0 "支持君主制度复辟，反对共和制的保皇分子发起示威游行，并演变成暴力冲突！示威者攻击警察和政府部门，多人受伤。"
 
 fra.263.t:0 "保皇党的崛起！"
 
 fra.264.t:0 "法国爆发右翼势力与警察的流血冲突！"
 
 fra.265.t:0 "法国天主教同盟在西班牙成立流亡政府"
 fra.265.d:0 "法国境内反对[FRA.GetRulingParty]的斗争进一步激化，以国民阵线、民族办公室和天主教教会为代表的保守政治家逃亡西班牙，并宣布成立法兰西天主教救国联盟，呼吁法兰西人民像第二次世界大战时期的自由法国一样，团结起来，反对法国现政府的统治！"
 
 fra.266.t:0 "法国君主制同盟在意大利成立流亡政府"
 fra.266.d:0 "法国境内反对[FRA.GetRulingParty]的斗争进一步激化，以天主教教会为代表的保皇政治家逃亡意大利，并宣布成立法兰西王国救国同盟，呼吁法兰西人民像第二次世界大战时期的自由法国一样，团结起来，反对法国现政府的统治！"
 
 fra.267.t:0 "法兰西救国军成立！"
 fra.267.d:0 "再法兰西救国同盟的支持下，法国右翼武装力量组成的人民解放军正式成立！"
 
