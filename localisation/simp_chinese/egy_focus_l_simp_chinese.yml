l_simp_chinese:
 EGY_native_egyptism:0 "埃及本位主义"
 
 EGY_weman_right:0 "妇女改革"
 EGY_weman_right_desc:0 "给予妇女选举权是实现平等，推动社会现代化的重要里程碑，当妇女掌握选票时，也就掌握了自己的命运。"
 EGY_education_refrom:0 "教育改革"
 EGY_education_refrom_desc:0 "二战前发展的教育产业已经日渐不能满足我国经济和社会对产业人才的需求，我们必须用行政手段加紧在全国范围内普及公立的、国际化的科教体系。"
 EGY_new_town:0 "新社区工程"
 EGY_contact_iraq:0 "与伊拉克合并"
 EGY_united_arab_kingdom:0 "阿拉伯联合王国"
 EGY_claime_syria:0 "索取叙利亚"
 EGY_claime_maghreb:0 "索取马格里布"
 EGY_relation_morroco:0 "交好摩洛哥"
 EGY_against_morroco:0 "对抗摩洛哥"
 EGY_relation_saudi:0 "交好阿拉伯半岛"
 EGY_against_saudi:0 "夺回汉志故土"
 
 EGY_recruit_german:0 "招募德国顾问"
 
 EGY_misr_al_misr:0 "埃及人的埃及"
 EGY_misr_al_misr_desc:0 "埃及民族主义的兴起，让埃及人的民族身份认同成为一个政治话题。埃及人虽然文化上已经被阿拉伯人同化，但我们的血脉依然来自古老的尼罗河文明。所谓的阿拉伯主义只会将我们的国家绑上与以色列的战争，并为伊斯兰教反对现代化提供借口。也许，埃及人应当排斥阿拉伯人带来的伊斯兰认同，而将目光放到我们伟大的祖先上。古老的埃及文明才能真正给我们带来民族认同和骄傲，让埃及成为埃及。"
 EGY_strike_islam:0 "打击伊斯兰分子"
 EGY_develop_sinai:0 "开发西奈半岛"
 EGY_develop_sinai_desc:0 "如果要保护好西奈，就需要在这里建设完善的工业后勤和基础设施。"
 EGY_voice_of_arabia:0 "阿拉伯之声"
 EGY_voice_of_arabia_desc:0 "阿拉伯之声广播电台将向阿拉伯世界传播我们的主张，强化阿拉伯人民的团结。"
 EGY_water_project:0 "引水工程"
 EGY_water_project_desc:0 "随着我国水利技术日益发展，将淡化后的海水引入到沙漠深处，供内地居民使用的计划成为可能。"
 EGY_develop_desert:0 "沙漠开发"
 EGY_develop_desert_desc:0 "埃及的人口不断增长，尼罗河及地中海沿岸的土地已经不够我们使用了。科技的发展让我们把目光放到沙漠深处的绿洲，供水、交通和医疗设施的发展，将让这篇被沙漠覆盖的土地焕发生机。"
 EGY_project_toshka:0 "托什卡工程"
 EGY_project_toshka_desc:0 "阿斯旺大坝建造和纳赛尔水库形成后，从水库溢出的河水进入了西南部的沙漠，形成了几个名为托什卡的季节性湖泊。如果将他们利用起来，或许我们可以尝试在湖泊周围建立新的定居点。"
 EGY_solar_powered:0 "发展太阳能发电"
 EGY_solar_powered_desc:0 "科学技术的进步改变了沙漠国家的未来，如果在沙漠地区发展光伏电池建设，将会大大改善我们的用电问题。"
 EGY_maghreb_railway:0 "马格里布大铁路"
 EGY_maghreb_railway_desc:0 "铁路将把埃及和马格里布各地区连接起来，改善当地经济发展，并强化开罗对这些地区的集权。"
 EGY_arabs_railway:0 "重建阿拉伯大铁路"
 EGY_arabs_railway_desc:0 "电气化的阿拉伯大铁路将把埃及和马什里奇各地区连接起来，改善当地经济发展，并强化开罗对这些地区的集权。"
 EGY_support_west_africa:0 "支持西非伊斯兰圣战者"
 EGY_support_west_africa_desc:0 "撒哈拉沙漠深处的圣战者正在对抗新殖民主义匪徒，我们应当支持他们！"
 EGY_claime_arabstan:0 "索取阿拉伯斯坦"
 EGY_claime_arabstan_desc:0 "伊朗西南部的阿拉伯斯坦居住着许多信仰逊尼派的阿拉伯同胞，但他们却被伊朗的什叶派异端残酷统治，我们将解救同胞！"
 EGY_annex_isr:0 "摩西的眼泪"
 EGY_annex_isr_desc:0 "让摩西的信徒在三千多年以后再次见证，他们将又一次成为尼罗河之子的奴仆！"
 EGY_latinized_arabs:0 "阿拉伯语拉丁化"
 EGY_latinized_arabs_desc:0 "埃及阿拉伯方言与马什里奇的标准阿拉伯语有很大差别，我们只需要学习土耳其人的经验，将我们的官方文字从阿拉伯文改为拉丁文字，不仅可以大大改善进行文化扫盲的效率，还可以创造出一门独特的语言，从而更好地将埃及从阿拉伯世界区分开。"
 EGY_steelmaking:0 "发展钢铁工业"
 EGY_steelmaking_desc:0 "以质量计算,铁是地球上最常见的元素,它加热后有很好的延展性…并且非常有用。铁始于公元前3500年左右,在埃及的盖尔扎赫被发掘出来铁对早期文明所需的各式东西都非常有用:如,蒸煮罐、小五金、工具,以及用来刺伤他人的尖锐武器。"
 EGY_auto_industrial:0 "发展汽车工业"
 EGY_auto_industrial_desc:0 "随着全球汽车产量增加和汽车技术的发展，汽车已不再是一种富人专属的奢侈品，而实进入中产阶层，成为一种重要的消费品。我国的汽车依然高度依赖进口，因此我们需要发展汽车工业，不仅是为了满足消费需求，也是为了让国家更快实现汽车国产、加速经济和工业发展。"
 EGY_oil_refinery:0 "发展化工产业"
 EgyInviteHashim:0 "哈希姆家族抵达开罗"
 EGY_united_sudan:0 "谋求苏丹统一"
 EGY_united_sudan_desc:0 "苏丹人民和埃及人民都是尼罗河的子嗣，都是真主的信徒，目前他们正受到英国人的统治，我们应该向英国方面正式提出，要求将苏丹地区的主权移交开罗。"
 EGY_abandon_sudan:0 "放弃苏丹"
 EGY_abandon_sudan_desc:0 "目前南方的苏丹正处于英国人统治下，虽然严格上说，苏丹毫无疑问应该归属埃及，但从长远来看，对苏丹的统治高投入而低回报。应该将苏丹视作一个筹码，向英国人交换更有价值的东西。"
 EGY_Reform:0 "政治革新"
 EGY_Reform_desc:0 "尽管埃及是一个古老的国家，但在过去的帝国主义时代，我们遭到了英法列强的入侵和控制。现在新的时代已经来临，我们将谨慎选择国家未来的道路。"
 EGY_ENG_CENTO:0 "中央条约组织"
 EGY_ENG_CENTO_desc:0 "英国成立了中央条约组织以支持中东各国对抗共产主义和苏联威胁，我们应当争取加入，以获得英国对我国更多的军事支持。"
 EGY_ENG_support:0 "英国军事援助"
 EGY_ENG_support_desc:0 "我们将继续加强与英国的合作，包括获取更多的军事装备和技术援助。"
 EGY_ENG_aid:0 "英国经济援助"
 EGY_ENG_aid_desc:0 "埃及需要发展，需要资金，如果和英国改善关系，我们将获得更多经济援助。"
 EGY_democratic_focus:0 "民主化"
 EGY_democratic_focus_desc:0 "君主独裁，军事独裁，共产主义，都不能为埃及带来光明的未来，埃及人民要真正走向自由，必须要有完善和现代化的政治制度，也就是民主制度。"
 EGY_ISR_cooper:0 "与以色列的合作"
 EGY_ISR_cooper_desc:0 "埃及与以色列的对抗已经结束，尽管两国关系尚有摩擦，但双方依然可以互相交易自己所需要的情报和技术。"
 EGY_airdrop:0 "空降部队"
 EGY_airdrop_desc:0 "快速机动部队已经成为现代化军事中重要的作战技术，借助运输机和直升机，我们的部队可以更快地投送进入战场。"
 EGY_marines:0 "海军陆战队"
 EGY_marines_desc:0 "擅长两栖作战的部队越来越不可或缺。临时拼凑的手段、装备已经成为历史，我方海军陆战兵现在已接受相关训练并拥有专属登陆舰船支持。"
 EGY_expanded_port:0 "扩大军港"
 EGY_expanded_port_desc:0 "海军设施是发展一支强大海军所需要关注的。埃及有地中海和红海两大海域，但海军基地却集中在尼罗河三角洲，我们需要开发更多优良港口，来让我们的舰队获得更多的驻地和补给。"
 EGY_Unit777:0 "777部队"
 EGY_Unit777_desc:0 "777部队是埃及精锐的反恐特种部队。"
 EGY_missile:0 "发展导弹技术"
 EGY_missile_desc:0 "导弹技术是划时代的发明，它将彻底改变现代战争，如果我国要建设一个现代化的军队，必须发展导弹技术。"
 EGY_jets:0 "发展喷气战机"
 EGY_jets_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 EGY_submarine:0 "发展潜艇"
 EGY_submarine_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 EGY_expanded_fleet:0 "扩大舰队"
 EGY_expanded_fleet_desc:0 "我们有地中海和红海两个地区的海岸线需要守护，因此需要一支更大的舰队。"
 EGY_port:0 "建造军港"
 EGY_port_desc:0 "海军设施是发展一支强大海军所需要关注的。埃及有地中海和红海两大海域，但海军基地却集中在尼罗河三角洲，我们需要开发更多优良港口，来让我们的舰队获得更多的驻地和补给。"
 EGY_childs:0 "控制人口"
 EGY_childs_desc:0 "埃及的人口不断增长，已经远远超过了我们的土地和粮食能承受的范围，我们必须控制人口增长。"
 EGY_corrupt:0 "腐败分子"
 EGY_corrupt_desc:0 "打击腐败窃取国家财产，浪费国家资金，破坏社会稳定、经济发展和群众对政府的心热，必须严厉惩处。"
 EGY_invest:0 "吸引投资"
 EGY_invest_desc:0 "随着埃及的社会稳定、经济得到发展以及外交地位的加强，一些外国投资者希望进入我国市场投资。"
 EGY_market:0 "市场经济"
 EGY_market_desc:0 "既然市场能够比行政机构更好地运营经济，那我们就应该将经济完全交给市场和市场参与者自由运营，一个完全没有行政干涉的经济体制无疑是最健康，最完美的。"
 EGY_enterprise:0 "企业改革"
 EGY_enterprise_desc:0 "我国高度集中化的国有企业在经济体制改革之后开始失去活力，无法应对日益激烈的市场竞争。为了使国企能够应对市场经济带来的冲击，我们将实行国企改革，使企业自主，自负盈亏。"
 EGY_Industrial_area:0 "因非塔"
 EGY_army_economic:0 "军方参与经济"
 EGY_army_economic_desc:0 "扩大我们的军事力量，需要经济层面的全力支持。我们应当让我们的经济体制抛弃掉没用的奢侈品生产，将重心投入到军工当中。"
 EGY_tourism_focus:0 "发展旅游业"
 EGY_tourism_focus_desc:0 "四十个世纪正在金字塔上看着我们！——拿破仑·波拿巴"
 EGY_plan:0 "五年计划"
 EGY_plan_desc:0 "我们将开始实行第一个五年计划，以快速改善我国的落后局面。"
 EGY_people_army:0 "人民军队"
 EGY_people_army_desc:0 "根据列宁的理论，共产党将在社会主义国家中领导一切，自然也包括军队。一支党领导下的军队是不可缺少的，只有军队成为社会主义的一部分，才能保护社会主义革命和社会主义国家。"
 EGY_pioneers:0 "少年先锋队"
 EGY_pioneers_desc:0 "少年先锋队是共产主义事业的接班人，培养少先队就是培养党和社会主义的未来。"
 EGY_worship:0 "党的权威"
 EGY_worship_desc:0 "我国当前政党众多，但大都代表着资本家、政治投机者甚至敌对分子的利益。我们要建设一个无产阶级所有、代表劳动人民的人民民主国家，共产党就必须领导一切。"
 EGY_nkvd:0 "内务委员会"
 EGY_nkvd_desc:0 "我们要建立专门的机构，调查、监视、逮捕反革命分子和帝国主义间谍。"
 EGY_isr_com_revolution:0 "支持以色列革命"
 EGY_isr_com_revolution_desc:0 "以色列共产党正在与锡安主义当局进行不懈斗争，我们应当支持他们！"
 EGY_iran_com_revolution:0 "支持西亚革命"
 EGY_isr_com_revolution_desc:0 "伊朗和巴基斯坦人民正在与反动势力及君主专制进行不懈斗争，我们应当支持他们！"
 EGY_african_com_revolution:0 "支持非洲革命"
 EGY_african_com_revolution_desc:0 "非洲人民正在与反动势力及君主专制进行不懈斗争，我们应当支持他们！"
 EGY_arabs_com_revolution:0 "支持阿拉伯革命"
 EGY_arabs_com_revolution_desc:0 "阿拉伯伊斯兰教反动势力、君主专制反动朝廷和军事独裁当局统治黑暗，左派势力已经掀起了革命斗争，我们应当支持他们！"
 EGY_expode_revolution:0 "输出革命"
 EGY_expode_revolution_desc:0 "英美帝国主义和殖民主义已经遭到全世界热爱和平的革命人民批判，我们将支持世界人民反帝斗争！"
 EGY_anti_black:0 "打压苏丹黑人"
 EGY_anti_black_desc:0 "苏丹南部的黑人终究不是阿拉伯人的同胞，并且他们信仰基督教和原始宗教，是潜在的叛乱隐患，必须对他们进行密切的监视和严厉的控制。"
 EGY_develop_sudan:0 "建设苏丹"
 EGY_develop_sudan_desc:0 "苏丹地区并非一片荒漠，他们有丰富的石油和矿产资源，值得进行开发。"
 EGY_agains_turk:0 "对抗土耳其"
 EGY_agains_turk_desc:0 "土耳其人残酷统治了埃及数百年，现在他们又对抗阿拉伯人民的统一失业，应该让他们付出代价！"
 EGY_remove_minor:0 "打压少数民族"
 EGY_remove_minor_desc:0 "犹太人、黎巴嫩人、阿拉米人、科普特人、土耳其人……终究不是阿拉伯人的同胞，并且他们信仰基督教、原始宗教和什叶派异端，是潜在的叛乱隐患，必须对他们进行密切的监视和严厉的控制。"
 EGY_remove_coptic:0 "打压科普特人"
 EGY_remove_coptic_desc:0 "科普特人终究不是阿拉伯人的同胞，并且他们信仰基督教，是潜在的叛乱隐患，必须对他们进行密切的监视和严厉的控制。"
 EGY_accept_minor:0 "接受少数民族"
 EGY_accept_minor_desc:0 "一方面，我们追求阿拉伯民族的复兴，希望建立一个强大的阿拉伯国家，但另一方面，如今的阿拉伯联合共和国，已经不是当年的阿巴斯王朝，更不是一个极端的伊斯兰政权，而是一个现代的世俗化国家。极端的民族政策不适合我们，我们应该平等地尊重和对待我们土地上的非阿拉伯民族，包括科普特人、阿拉米人、图阿雷格人、库尔德人，甚至是犹太人。"
 EGY_great_arab:0 "大阿拉伯主义"
 EGY_great_arab_desc:0 "在数千年前，阿拉伯人曾是世界上最强大的民族之一。我们在古兰经指引下建设国家，征服了大半个欧亚大陆。我们与中国人和印度人贸易以获得繁荣，我们在数学和天文学上获得成就……但是后来的阿拉伯世界没落了，沦为了帝国主义的肥肉。现在，我们将复兴我们的民族，让阿拉伯人再次屹立在世界的巅峰！"
 EGY_support_PAL:0 "支持巴解组织"
 EGY_support_PAL_desc:0 "巴勒斯坦同胞正在与锡安主义当局进行不懈斗争，我们应当支持他们！"
 EGY_support_lebanon:0 "支持黎巴嫩革命"
 EGY_support_lebanon_desc:0 "看看（帝国主义）袭击后的贝鲁特/n遍地是占领和压迫！/n塞得港的故事将再次上演/n阿拉伯国家将越来越强大！/n——歌曲 Watanal Akbar"
 EGY_jordan_dam:0 "约旦河水坝"
 EGY_jordan_dam_desc:0 "约旦河大坝将为干涸的约旦河东部地区提供重要的水资源、电力和工作岗位，并且可以掐断锡安主义政权通过约旦河获取水资源。"
 EGY_agriculture:0 "开垦耕地"
 EGY_agriculture_desc:0 "尼罗河为五千年来的埃及人民带来生命，随着农业科技得到发展，我们将开垦更多的耕地，养育更多的人口。"
 EGY_oil:0 "发展石油产业"
 EGY_oil_desc:0 "石油是现代工业的血液，如果我们要成为工业国家，发展石油工业是不可缺少的一步。"
 EGY_energy:0 "发展能源"
 EGY_sudan_arabs:0 "苏丹的阿拉伯化"
 EGY_annex_jordan:0 "与约旦合并"
 EGY_annex_jordan_desc:0 "哈希姆家族的君主已经宣布接受埃及的王位，一个埃及-约旦联合王国即将问世！Ash al-Malik！（国王万岁）"
 EGY_hashim:0 "邀请哈希姆王朝"
 EGY_hashim_desc:0 "哈希姆家族是显著穆罕默德的后裔，是伊斯兰教的守护者家族。他们曾经大力支持阿拉伯起义，但却遭到英国人背叛，最后只能在约旦河东部的小块土地上封王……阿里王朝对埃及的统治已经结束，但就目前来说，埃及的政治局势还不成熟，不适合建立一个共和体制，因此一些政治家在考虑，是否应该邀请约旦哈希姆家族的[JOR.GetLeader]前来埃及，接受我们的王位？"
 EGY_director_communie:0 "摄政会议"
 EGY_director_communie_desc:0 "法鲁克一世的统治即将结束，在他离开开罗王宫之前，摄政会议将接替他暂时执政。"
 EGY_suppoer_jordan:0 "支持约旦共和派"
 EGY_suppoer_jordan_desc:0 "约旦伊斯兰教反动势力、君主专制反动朝廷和军事独裁当局统治黑暗，共和派已经掀起了革命斗争，我们应当支持他们！"
 EGY_center_control:0 "加强中央集权"
 EGY_center_control_desc:0 "阿拉伯联合共和国目前依然是一个联邦制下的共和国，各地区分管行政权力，甚至军队都是分开的，这样的联邦毫无团结和强大可言。我们将逐步收缩和控制共和国内的各地区，将全国的行政权、司法权、尤其是军事指挥权，统一到开罗中央政府之下。"
 EGY_research_weapons:0 "自研武器"
 EGY_War_industry2:0 "军工建设 II"
 EGY_War_industry2_desc:0 "二战后国际格局瞬息万变，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 EGY_europe_weapons:0 "购买欧洲军备"
 EGY_europe_weapons_desc:0 "我们目前没有自行生产军备的能力，但我们可以向友好国家购买现成的军备来建立我们的现代化军队。"
 EGY_europe:0 "接触欧洲国家"
 EGY_mujahedeen:0 "伊斯兰圣战"
 EGY_mujahedeen_desc:0 "对异教徒的讨伐已经开始，为了真理，我们将碾碎一切违背伊斯兰的事物！安拉胡阿克巴！"
 EGY_sharia:0 "恢复沙里亚法"
 EGY_sharia_desc:0 "以伊斯兰教为核心的封建社会组织在我们国内已经存在了上千年，其“教法”即沙里亚法。是我们泛伊斯兰文明的智慧结晶。是经受住时间考验的，指导一切穆斯林社会的，无可争议的天赐圣法。"
 EGY_ulima_parliament:0 "乌里马会议"
 EGY_ulima_parliament_desc:0 "由伊斯兰教学者组成的委员会将监督我们的政府，以确保我们的行政和司法运行都符合古兰经的意志。"
 EGY_islam_emirate:0 "伊斯兰教长国"
 EGY_islam_emirate_desc:0 "真主的信徒已经取得了这个国家的政权，接下来我们将建立完全处于古兰经指引下，实行伊斯兰体制的教长国。"
 EGY_islam_republic:0 "伊斯兰共和国"
 EGY_islam_republic_desc:0 "真主的信徒已经取得了这个国家的政权，接下来我们将建立一个伊斯兰学者指引下，既实行现代政治制度，也遵循真主道路的伊斯兰共和国。"
 EGY_against_iran:0 "对抗伊朗"
 EGY_against_iran_desc:0 "伊朗的什叶派政府与我们对抗，我们将与异端战斗到底！"
 EGY_suppoer_saudi:0 "支持阿拉伯共和党"
 EGY_suppoer_yemen:0 "支持也门革命"
 EGY_suppoer_yemen_desc:0 "也门反动势力、君主专制反动朝廷和军事独裁当局统治黑暗，共和势力已经掀起了革命斗争，我们应当支持他们！"
 EGY_suppoer_revolution:0 "支持阿拉伯革命"
 EGY_suppoer_revolution_desc:0 "阿拉伯伊斯兰教反动势力、君主专制反动朝廷和军事独裁当局统治黑暗，左派势力已经掀起了革命斗争，我们应当支持他们！"
 EGY_Interference_Maghreb:0 "统一北非"
 EGY_Interference_Maghreb_desc:0 "利比亚、突尼斯、阿尔及利亚和摩洛哥的马格里布阿拉伯同胞正处于危机之中，这些地区的许多政治家希望与阿拉伯实现统一，让阿拉伯的旗帜再一次在日落之地升起！"
 EGY_anti_monarchism:0 "反对君主制"
 EGY_anti_monarchism_desc:0 "君主制已经不再适合埃及人民！阿里王朝反动的统治和对殖民者的谄媚，已经让埃及遭受了太多苦难！让阿里的统治者滚蛋吧！埃及将走向共和，走向民主和现代化！"
 EGY_Interference_IRQ:0 "邀请伊拉克加入"
 EGY_Interference_IRQ_desc:0 "伊拉克的阿拉伯同胞正处于危机之中，这些地区的许多政治家希望与大阿拉伯实现统一，让阿拉伯的旗帜再一次在新月沃土升起！"
 EGY_railway:0 "建设铁路"
 EGY_railway_desc:0 "通过铁路来将全国各地与首都连接起来，以发展经济，强化中央集权。"
 EGY_coptic:0 "复兴科普特文化"
 EGY_coptic_desc:0 "经过一千四百年的同化，埃及人的语言、文化和生活习惯已经彻底阿拉伯化。如果要对抗阿拉伯主义，我们需要向民众推广古老的科普特文化。我们相信科普特语是目前最接近古埃及语的语言。"
 EGY_gaddafi:0 "与卡扎菲结盟"
 EGY_gaddafi_desc:0 "利比亚的穆阿迈尔·卡扎菲先生是一位阿拉伯社会主义政治家，他提出的将社会主义与伊斯兰教进行结合的政治观点，值得我们注意。"
 EGY_accept_islam:0 "容忍伊斯兰教"
 EGY_industrialized:0 "工业化"
 EGY_industrialized_desc:0 "初步工业化的政策将是一系列经济发展和社会改造运动的开始。为此我们将尽一切努力消灭旧特权集团，并利用从土地经济中抽出的资本与国际投资一同扩张工业建设。"
 EGY_nationalized:0 "企业国有化"
 EGY_nationalized_desc:0 "在从资本主义社会过渡到共产主义社会之前，党和国家将以国有企业的形式管理我国的重要生产资料。"
 EGY_anti_muslim:0 "镇压宗教"
 EGY_anti_muslim_desc:0 "宗教是精神的鸦片，他们除了代表封建阶级压迫人民一无是处，只有镇压宗教，才能推动人民接受社会主义意识形态。"
 EGY_supress:0 "镇压反革命"
 EGY_supress_desc:0 "一些敌视社会主义[FROM.GetName]的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。"
 EGY_collective:0 "农业集体化"
 EGY_collective_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 EGY_soviet_mode:0 "苏联模式"
 EGY_soviet_mode_desc:0 "在斯大林模式的指导下，苏联人民不仅在短短十年内把俄罗斯变成了工业强国，而且还战胜了法西斯。我们要摆脱贫困，进入工业化和现代化，就必须学习苏联人民的先进经验。"
 EGY_people_republic:0 "人民共和国"
 EGY_people_republic_desc:0 "落后的封建时代已经过去，我们人民将迎来更加先进、民主的社会制度。社会主义有利于生产力的发展，实现社会平等和民主进步。"
 EGY_red_sea_port:0 "发展红海港"
 EGY_red_sea_port_desc:0 "红海地区的海港，无论是作为贸易港、石油港还是军港开发，都拥有极为关键的地位。"
 EGY_new_capital:0 "修建新首都"
 EGY_electronic:0 "发展电子业"
 EGY_electronic_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一。随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。"
 EGY_manufacture3:0 "发展制造业 III"
 EGY_manufacture3_desc:0 "在具备较为完善的工业能力后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 EGY_manufacture2:0 "发展制造业 II"
 EGY_manufacture2_desc:0 "在具备进一步工业能力后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 EGY_manufacture1:0 "发展制造业 I"
 EGY_manufacture1_desc:0 "在具备初步工业能力后，我们需要满足我们人民对生活消费品的需求。从纺织、食品、木制品和锅碗瓢盆开始。"
 EGY_muslim_brothers:0 "支持穆斯林兄弟会"
 EGY_muslim_brothers_desc:0 "哈桑·班纳先生创立的穆斯林兄弟会是一个反对帝国主义的伊斯兰团体，他们希望驱逐西方殖民势力，但又不排斥现代化的改革，应当邀请他们加入议会，以古兰经的观点为埃及建言献策。"
 EGY_election_ready:0 "准备选举"
 EGY_election_ready_desc:0 "准备选举"
 EGY_Waft_party:0 "支持华夫脱党"
 EGY_Waft_party_desc:0 "华夫脱（Wafd意为组织）是一个由接受过西方教育的社会精英组建的政党，他们反对帝国主义和君主制度，希望实现君主立宪并推动埃及的现代化和世俗化。"
 EGY_ruled_constitution:0 "二元制立宪"
 EGY_ruled_constitution_desc:0 "我国还不具备过渡到完全的君主立宪民主制度的条件，国王陛下必须保留一定的权力，包括解散议会和任命首相，以确保政府的稳定。"
 EGY_military_reforms:0 "军事改革"
 EGY_military_reforms_desc:0 "世界军事技术正在不断地发展，我们必须保证我国的军事力量不能落后世界。"
 EGY_economic:0 "经济改革"
 EGY_economic_desc:0 "经济是政治的基础，要想让埃及成为一个发达繁荣的国家，必须改变我国落后的经济局面。改革不合理的体制、支持工业的发展和农业的现代化、完善金融、社会保障和司法制度……我们有很多事情要做。"
 EGY_pro_west:0 "亲西方"
 EGY_pro_west_desc:0 "尽管反对英帝国主义，一直是埃及人民一直以来的愿望，但现在世界局势有了新变化。来自莫斯科的共产主义势力和崛起的伊斯兰极端主义成为了比英法更大的威胁，我们不得不考虑，借助英国人的帮助和他们对抗。"
 EGY_Commonwealth:0 "加入英联邦"
 EGY_Commonwealth_desc:0 "埃及将和英国再一次团结起来，一同对抗新的威胁！"
 EGY_Suez_treaty:0 "苏伊士运河条约"
 EGY_Suez_treaty_desc:0 "随着我们与英国重新建立友好关系，我们也需要认真考虑苏伊士运河的主权问题。我们可以延长英国人对运河的占领，条件是他们需要给出有价值的交换。或者，我们可以用其他东西，来向英国人交换苏伊士运河。"
 EGY_pro_Usa:0 "亲近美国"
 EGY_pro_Usa_desc:0 "美国政府致力于对抗世界上的共产主义颠覆运动，他们将成为我们的重要盟友。"
 EGY_US_aid:0 "美国援助"
 EGY_US_aid_desc:0 "请求美国政府提供军事、政治和经济援助。"
 EGY_Liberalization:0 "自由主义"
 EGY_Liberalization_desc:0 "每个人都有权决定自己的一切，包括政治观点、经济事务。自由是人类进步的标志，限制和干涉只会阻碍国家和社会的发展。"
 EGY_constitutional_monarchy:0 "君主立宪制"
 EGY_constitutional_monarchy_desc:0 "随着国家的现代化进程取得成功，政治现代化也将提上议程。国王至高无上的地位应当走入历史了，我们即将实行立宪制改革，扩大议会和内阁的权力。"
 EGY_abandon_Suez:0 "收回苏伊士运河"
 EGY_abandon_Suez_desc:0 "苏伊士运河是帝国主义刻在埃及人民心中的耻辱和伤疤，帝国主义抢占我们的土地，这条在埃及人的土地上建成的运河，埃及人却无法从中获利！必须结束这一状况！埃及人民的觉醒和对我国压迫的结束，就从赛义德港上空升起萨拉丁之鹰开始！"
 EGY_pro_Iran:0 "接近伊朗"
 EGY_pro_Saudi:0 "接近沙特阿拉伯"
 EGY_Republic:0 "共和革命"
 EGY_Republic_desc:0 "无能且腐败的君主制已经结束了！埃及共和国即将诞生！"
 EGY_NATO:0 "与美国的军事条约"
 EGY_NATO_desc:0 "美国保护自由国家不受红色国家的入侵。加入他们，我们将得到独立和自由的保障。"
 EGY_Free_base:0 "中东的自由中心"
 EGY_Free_base_desc:0 "反对共产主义的斗争正在中东扩大。我们应该派一些志愿者参加。一方面，我们要学习战斗的经验。另一方面，当我们遇到困难时，美国人也会愿意提供帮助。"
 EGY_Interference_Syria:0 "与叙利亚联合"
 EGY_Interference_Syria_desc:0 "叙利亚的阿拉伯同胞正处于危机之中，这些地区的许多政治家希望与大阿拉伯实现统一，让阿拉伯的旗帜再一次在倭马亚王朝的旧都升起！"
 EGY_Interference_Lybia:0 "与利比亚联合"
 EGY_Interference_Lybia_desc:0 "利比亚的阿拉伯同胞正处于危机之中，这些地区的许多政治家希望与大阿拉伯实现统一，让阿拉伯的旗帜再一次在迦太基故土升起！"
 EGY_Arab_nationalism:0 "阿拉伯复兴"
 EGY_Abolish_monarch:0 "废除君主制"
 EGY_Abolish_monarch_desc:0 "君主制已经不再适合埃及人民！阿里王朝反动的统治和对殖民者的谄媚，已经让埃及遭受了太多苦难！让阿里的统治者滚蛋吧！埃及将走向共和，走向民主和现代化！"
 Pro_Soviet:0 "亲近苏联"
 Pro_Soviet_desc:0 "伟大的苏维埃社会主义共和国联盟已经成为社会主义国家和第三世界独立国家最坚定的盟友，我们将坚定地和莫斯科的同志们站在一起，对抗帝国主义和殖民主义！"
 EGY_islam_state:0 "伊斯兰国家"
 EGY_islam_state_desc:0 "无论世界如何变幻，《古兰经》和先知的意志仍然是永恒的真理，我们的国家需要伊斯兰教法的治理，以保证我国永远在真理的范围内。真主安拉在呼唤我们砥砺前行。弟兄们，请拾起我们的弯刀，捍卫我们生存的权利！"
 EGY_expand_islam:0 "支持伊斯兰运动"
 EGY_expand_islam_desc:0 "伊斯兰革命在世界各地风起云涌！从日落之地马格里布到遥远的马来群岛，到处都是反对异教徒的圣战者。让我们和他们并肩作战吧！"
 EGY_islam_federation:0 "伊斯兰大联合"
 EGY_islam_federation_desc:0 "在圣战者们的奋斗之下，许多地区都建立起了伊斯兰政权，我们应该和他们加强联系，组成联盟。"
 EGY_Egyptian_leadership:0 "埃及的领导地位"
 EGY_Egyptian_leadership_desc:0 "阿拉伯联合共和国目前依然是一个联邦制下的共和国，各地区分管行政权力，甚至军队都是分开的，这样的联邦毫无团结和强大可言。我们将逐步收缩和控制共和国内的各地区，将全国的行政权、司法权、尤其是军事指挥权，统一到开罗中央政府之下。"
 EGY_african_diplomacy:0 "深入非洲"
 EGY_african_diplomacy_desc:0 "随着去殖民化席卷非洲，曾经的黑暗大陆上诞生了许多新兴国家，我们应当和他们开展外交工作，以提高我国在非洲的影响力。"
 EGY_three_ring:0 "三环理论"
 EGY_three_ring_desc:0 "三环理论是纳赛尔提出的外交政策。在与英国彻底翻脸之前，他认为中东局势将由英国、美国和埃及三方主导。"
 EGY_Conciliation:0 "与以色列的和谈"
 EGY_Conciliation_desc:0 "经过数次中东战争，以色列无法被消灭已是无法改变的事实，或许到了改变对以色列政策的时候了。"
 EGY_Camp_David:0 "戴维营协议"
 EGY_Camp_David_desc:0 "经过数次中东战争，以色列无法被消灭已是无法改变的事实，或许到了改变对以色列政策的时候了。"
 EGY_Nasserism:0 "纳赛尔主义"
 EGY_Nasserism_desc:0 "纳赛尔总统的政策，毫无疑问将成为埃及共和国在未来的长期政策。我们将对抗英美帝国主义，我们将消灭锡安主义政权。我们将支持埃及的现代化发展。我们将和第三世界积极合作。这些政策将成为埃及共和国不可改变的一部分，即使纳赛尔死去，每一个埃及人都依然是纳赛尔！"
 EGY_Third_World:0 "亲第三世界"
 EGY_Third_World_desc:0 "新生的埃及共和国被英法列强视为敌人，但也被国际社会是为反殖民运动兴起的第三世界新星。"
 EGY_Non-Aligned:0 "不结盟运动"
 EGY_Non-Aligned_desc:0 "美国和苏联正在努力将世界各国纳入其势力范围，这将扩大意识形态冲突，加剧战争威胁。我们呼吁不结盟运动和建立一个全球组织，抵制与强国结盟。"
 EGY_arab_league:0 "阿拉伯联合共和国"
 EGY_arab_league_desc:0 "统一阿拉伯世界一直是阿拉伯各国人民的伟大理想，而如今埃及的崛起将使之成为可能。从建立联邦开始，将阿拉伯各国统一为一个国家。"
 EGY_Muslim_Alliance:0 "阿拉伯联盟"
 EGY_Muslim_Alliance_desc:0 "锡安主义对所有阿拉伯国家都造成了威胁，我们必须加强阿拉伯世界的团结协作。"
 EGY_war_on_Isreal:0 "对抗以色列"
 EGY_war_on_Isreal_desc:0 "以色列对阿拉伯人土地的侵占是不可接受的，而他充当英美在中东马前卒的行为更是注定了他们将成为埃及的永远威胁。"
 UNSC_suez_WAR:0 "介入调解苏伊士运河战争"
 EGY_Pro_Soviet:0 "亲近社会主义阵营"
 EGY_Pro_Soviet_desc:0 "我们都是社会主义国家，并紧密地团结在一起。在莫斯科会议期间，我们制定了一个统一的纲领。在该统一纲领的基础上我们工作得比较轻松。"
 EGY_Communist:0 "共产主义之路"
 EGY_Communist_desc:0 "落后的封建时代已经过去，我们人民将迎来更加先进、民主的社会制度。社会主义有利于生产力的发展，实现社会平等和民主进步。"
 EGY_Socialist:0 "社会主义政府"
 EGY_Socialist_desc:0 "落后的封建时代已经过去，我们人民将迎来更加先进、民主的社会制度。社会主义有利于生产力的发展，实现社会平等和民主进步。"
 EGY_anti_colonies:0 "支持反殖民运动"
 EGY_anti_colonies_desc:0 "亚非拉人民反对殖民者，争取民族独立，我们应该支持他们。"
 EGY_support_africa:0 "泛非洲主义"
 EGY_sudan:0 "与苏丹合并"
 EGY_ikhwani:0 "穆斯林兄弟会"
 EGY_ikhwani_desc:0 "哈桑·班纳先生创立的穆斯林兄弟会是一个反对帝国主义的伊斯兰团体，他们希望驱逐西方殖民势力，但又不排斥现代化的改革，应当邀请他们加入议会，以古兰经的观点为埃及建言献策。"
 EGY_Corrective_Revolution:0 "纠正运动"
 EGY_Corrective_Revolution_desc:0 "纠正运动是萨达特接任埃及总统后发起的一系列政治清算，其消除了纳赛尔主义者在埃及的影响力并强化了萨达特自身的权威，从而为未来的内外政策转向铺平道路。"
 EGY_Aswan_Dam:0 "阿斯旺大坝"
 EGY_Aswan_Dam_desc:0 "自古以来，泛滥不定的尼罗河水都是埃及人民的心头之患，修建阿斯旺大坝是埃及政府策划了很久的一项大型工程。他将拯救埃及的农业生产，但成本是埃及政府不一定能负担的。"
 EGY_Aswan_Dam_tool:0 "允许通过决议进行阿斯旺大坝的建设，大坝建设分三期工程，每期工程都消耗一定的政治点数、财力和资源，同时还要处理古迹淹没问题，但大坝建成后，将大大改善我国农业生产效果"
 EGY_Aswan_Dam_1:0 "阿斯旺大坝一期工程完成"
 EGY_Aswan_Dam_2:0 "阿斯旺大坝二期工程完成"
 EGY_Aswan_Dam_3:0 "阿斯旺大坝建造完成"
 GiveUPAbuSibel:0 "放弃阿布·辛拜勒神庙"
 SavedAbuSibel:0 "抢救阿布·辛拜勒神庙"
 AbuSibel_tool:0 "阿布·辛拜勒神庙获得80旅游产出"
 EGY_Infrastructure:0 "基础设施建设"
 EGY_Infrastructure_desc:0 "完善的基础设施是沟通全国各地，发展经济并建立稳固政权的前提。"
 EGY_NSA:0 "国家安全局"
 EGY_Cairo_Industrial:0 "开罗工业区"
 EGY_Secularization:0 "世俗化"
 EGY_Secularization_desc:0 "伊斯兰教是伊朗走入现代化强国的障碍，他们的教法和道德只会妨碍我们国家的发展，因此我们需要采取措施，将伊斯兰教的影响力从政府、教育和社会中剔除。"
 EGY_remove_islam:0 "去伊斯兰化"
 EGY_remove_islam_desc:0 "一些敌视现代化政策的穆斯林头头组成了许多非法的政治团体，煽动反政府活动，我们将采取强硬措施镇压。"
 EGY_Bath_party:0 "支持复兴党"
 EGY_Bath_government:0 "复兴党政府"
 EGY_Arab_Socialist:0 "阿拉伯式的社会主义"
 EGY_faroism:0 "法老主义"
 EGY_faroism_desc:0 "法老主义扎根在每个埃及人的心中。法老主义情结是永恒的，也是不断加深的。埃及人首先是法老文明的后裔，其次才是阿拉伯人。他人若煽动埃及放弃法老主义，就等同于如此教唆：埃及啊，去摧毁你的狮身人面像和金字塔，忘记你是谁，跟随我们吧！不要对埃及无尽索求。无论其总部在开罗，在大马士革还是巴格达，埃及都永不可能成为阿拉伯整体的一员。\n——塔哈·侯赛因"
 EGY_Luxor_Industrial:0 "开发卢克索"
 EGY_Luxor_Industrial_desc:0 "卢克索是埃及古迹最多的地区，古老的底比斯和卡纳克神庙、宏伟的哈特谢普苏特陵墓和神秘的帝王谷都吸引着外国游客。但这之前，我们需要先把卢克索的基础设施打造完善。"
 EGY_Alexandria_Industrial:0 "亚历山大工业区"
 EGY_Alexandria_Industrial_desc:0 "古老的亚历山大港不仅是七大奇迹中的两个的所在地，而且也是我国最重要最大的海港，无论是作为货运中心、工业中心还是金融中心，都有很大的开发价值。"
 EGY_Land_Reform:0 "土地改革"
 EGY_Land_Reform_desc:0 "尼罗河两岸可耕种土地本就不多，大部分还被封建地主所占领，我们将进行土地改革，限制地主所拥有的土地数量，从而使得土地可以作为商品，出售给农民、企业或国家。"
 EGY_War_industry:0 "军工业"
 EGY_War_industry_desc:0 "二战后国际格局瞬息万变，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 EGY_Mechanized:0 "机械化军队"
 EGY_Mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 EGY_modern_industry:0 "产业现代化"
 EGY_Navy:0 "建设海军"
 EGY_Navy_desc:0 "太阳之神拉会驾驶太阳之船，带领逝者前往冥界。而埃及海军将使用强大的战舰，将敌人送去拜见欧西里斯神。"
 EGY_Air_force:0 "建设空军"
 EGY_Air_force_desc:0 "我们必须发展我们的现代空军，以确保尼罗河的子嗣可以像萨拉丁雄鹰一般翱翔，保卫我们的领空，向敌人降下死亡。"
 EGY_Air_force_desc:0 "二战向世界各国展示了空中武装的作用和重要性，他们可以作战、可以运输、可以侦察，可以破坏敌人后方……总之，一支合格的空军是一支现代军队必不可少的，至少我们要保证我们头上的飞机不是敌人的。"
 EGY_Nilesat_I:0 "努特一号"
 EGY_Nilesat_I_desc:0 "早在数千年前，古埃及文明就已经在天文学上取得了许多成就。现在，太空时代即将来临，努特神的子嗣当然不能落后。"
 EGY_Saladin_Project:0 "萨拉丁工程"
 EGY_Saladin_Project_desc:0 "核武器的出现彻底改变了人类社会，这种强大的武器结束了二战，但也让20世纪后半页的人民无比担忧第三次世界大战的爆发，因为这种超级武器将有摧毁世界的危险。美国和苏联在二战后分别开发了核武器，作为对抗的筹码，核平衡一定程度上阻止了第三次世界大战。而在其他国家，例如法国、中国和印度眼中，核武器是话语权的象征，只有掌握和武器才不会遭受超级大国的威胁，才有资格在国际社会中不成为棋子，并有威胁其他国家的能力。基于这种思维，除了五大常任理事国外，二战后至少有十几个国家开发了核武器，但成功的并不多。"
 EGY_Suez_Line:0 "西奈半岛防线"
 EGY_Suez_Line_desc:0 "西奈半岛是对抗以色列的最前线，必须强化这一地区的防御。"
 EGY_Strengthen_army:0 "整顿军队"
 EGY_Strengthen_army_desc:0 "通过设立完善的军事体制、军官制度、指挥系统和军事学院，我们才能把落后的民兵组织建设成为一支有战斗力的职业军队。"
 EGY_take_suez:0 "收回苏伊士运河"
 EGY_take_suez_desc:0 "苏伊士运河是帝国主义刻在埃及人民心中的耻辱和伤疤，帝国主义抢占我们的土地，这条在埃及人的土地上建成的运河，埃及人却无法从中获利！必须结束这一状况！埃及人民的觉醒和对我国压迫的结束，就从赛义德港上空升起萨拉丁之鹰开始！"
 EGY_Egypt_rise:0 "埃及复兴"
 EGY_presidentship:0 "加强总统权力"
 EGY_presidentship_desc:0 "为了保障奈赛尔总统的埃及的权威，我们必须整顿政治党派。复兴党和穆斯林兄弟会必须停止党外活动，并加入到纳赛尔领导的国民联盟当中。"
 EGY_july_act:0 "七月法令"
 EGY_july_act_desc:0 "七月法令是纳赛尔政府于1960年推出的一系列经济改革政策，其中包括加强国有化和农业改革等。"
 EGY_medic:0 "改善医疗事业"
 EGY_medic_desc:0 "公共医疗产业的发展是影响一国人口结构和劳工质量的重要因素。如何能维护国民健康，也自古以来是一个政权成功与否的重要指标。"