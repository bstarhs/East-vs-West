TIPS_TITLE:0 "欢迎来到钢铁雄心4《冷战-东西对抗》模组"
TIPS_TEXT:0 "现在，召唤我们的号角再次吹响——不是号召我们拿起武器，尽管我们需要武器；不是号召我们去战斗，尽管我们正在战斗，而是号召我们在这一长期的晨昏对峙中承担起责任，年复一年，“欢欣希望，忍耐磨难”，去一起对抗人类共同的敌人：暴政，贫穷，疾病和战争。\n---约翰·菲茨杰拉德·肯尼迪\n\n随着原子弹的一声巨响，自由世界和轴心国之间的战争宣告结束，但与此同时，新的对抗已经到来。作为上一次世界大战的失败者，德国已经被盟国和苏联分裂和占领，中国、朝鲜和越南共产党的崛起对美国控制下的亚洲新秩序提出了挑战。殖民者的终结引领着第三世界国家的崛起，他们不可避免地会卷入超级大国之间的斗争，流亡的纳粹科学家加入了新的大国行列，引领着太空探索。从波罗的海的斯德丁到亚得里亚海的的里雅斯特，一道铁幕席卷了整个欧洲大陆。在这场冷战中，核武器的发展避免了超级大国之间的战争，代理人战争和军备竞赛，太空竞赛成为了新的对抗模式。超级大国需要在不同的国家建立影响力和霸权，扩大派系，推翻不利于他们野心的国家的政府，直到对方倒台。\n本mod在《钢铁雄心3》烂尾的东西对抗资料片基础上设计，并参考了桌游Twilling Struggle，以便在《钢铁雄心4》上重现冷战的历史。在这个mod中，我们在游戏中添加了10个剧本，重新制作了科技树和国策树，并添加了3个新系统 - 联合国、太空探索，和全新的经济系统，但其中一些仍然是测试版本。\n§Y游玩注意§W\n由于《钢铁雄心4》本身的数值系统十分拉跨，因此游戏过程中进行大量计算，可能导致游戏卡顿，目前我们正在寻求优化的可能。\n§Y该界面可用esc键关闭§W"
