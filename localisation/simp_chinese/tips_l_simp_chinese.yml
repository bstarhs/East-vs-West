UN_TIPS_TITLE:0 "关于联合国系统"
UN_TIPS_TEXT:0 "当他们为战争做准备时，那些最有发言权的人便大谈和平，直到准备完成。     -斯蒂芬·茨威格\n\n§R该功能尚在制作§W\n联合国系统是《冷战-东西对抗》模组新设计的一个游戏系统。\n你的国际影响力代表着你在国际社会中的威望，威望的高低会给你带来额外影响。\n加入联合国之后，你可以向联合国申请贷款、维和部队支援等效果，这些行为对国际威望有一定的要求。\n如果你的国际威望较低，联合国安理会成员将对你发起制裁，甚至是攻击。"

ETHNICS_TIPS_TITLE:0 "关于民族系统"
ETHNICS_TIPS_TEXT:0 "§R该功能尚在制作§W\n民族系统是《冷战-东西对抗》模组新设计的一个游戏系统，每个省份都有一个主流民族，而每个国家都有一个主体民族。\n 不同的民族有不同的宗教和意识形态倾向，如果你违背了这些民族的倾向，他们可能会产生额外的不满和抵抗，但如果你能够满足他们的需求，会为你带来额外的好处。\n 你可以通过调整民族、宗教政策以及一些决议来缓和少数民族的不满。"
tip.7.a:0 "确定"

SPACE_TIPS_TITLE:0 "关于太空竞赛系统"
SPACE_TIPS_TEXT:0 "地球是人类的摇篮,但是人类不能永远生活在摇篮里。     ——康斯坦丁·齐奥尔科夫斯基\n\n§R该功能尚在制作§W\n太空竞赛系统是《冷战-东西对抗》模组新设计的一个游戏系统，通过研究并发射不同的航天器，来获得国际威望、情报能力等额外加成。\n "
tip.7.a:0 "确定"

CIVIL_TIPS_TITLE:0 "关于民生系统"
CIVIL_TIPS_TEXT:0 "挨饿和失业的人民是滋生独裁的土壤。     ——富兰克林·D·罗斯福\n\n§R该功能尚在制作§W\n民生系统是《冷战-东西对抗》模组新设计的一个游戏系统，由粮食、电力、教育和医疗四个数值组成\n粮食数值展示你现在产出和消耗的粮食，产出越多，人力增长就越快，但过多的粮食会带来产出过剩惩罚，若粮食产出低于粮食消耗，会导致饥荒，危害国家的稳定。\n 电力数值展示你现在生产和消耗的电力，每建造一座建筑都会增加电力消耗，通过建造发电厂和研究科技可以增加电力产出。如果电力不足，会影响建筑建造和生产的速度。\n 教育和医疗数值可以通过建造学校、医院以及决议、国策等方式提高。医疗可以为你带来额外的稳定度，教育可以提高政治点数收入和科研速度。同样，如果教育和医疗的产出低于需求，会带来额外的不满。"
tip.7.a:0 "确定"

NUKE_TIPS_TITLE:0 "关于核武器"
NUKE_TIPS_TEXT:0 "原子能的释放，改变了除了人类思考方式外的一切。    ——阿尔伯特·爱因斯坦\n\n§R该功能尚在制作§W\n模组对游戏原有的核武系统进行了改进，原并添加了新的核科技树。通过研究核科技，你可以发展你的核武器，提高核威慑，或者将核能用于发电等。\n想要研究核能，你必须先通过决议进行核试验，以提高核科技树的研究速度。\n在拥有核武器之后，你可以通过画面右下角的核武器操作面板，对目标进行核打击，以迅速摧毁敌对国家的战争能力，但敌人也可以进行核能反制。\n核弹头发射的范围和速度取决于你的投射载体，包括战略轰炸机、弹道导弹和战略核潜艇。每一个发射载体都被计算为一定数量的待命发射单位，只有足够的发射单位处于待命状态时，才能发射核弹，发射单位发射后会处于恢复状态，恢复状态或被摧毁的发射单位不能发射核弹。\n核潜艇是本mod中新添加的一种核弹发射机制，如果战略轰炸机和弹道导弹的发射范围不足以覆盖目标，则可以将战略核潜艇派遣到目标地区附近的海域，依然可以发射核弹。\n你的核弹数量、覆盖范围和发射基地数量，会被计算为核威慑数值，核威慑数值越大，AI国家就会忌惮你的力量，从而在外交上有所让步，但另一方面，庞大的核威慑力量会损害你的国际威望，引起针对你的包围网以及国际紧张度上升，可以适当使用核裁军决议。\n核弹头、核潜艇和核电站的维护费用是相当高的，只有经济发达的国家才养得起一支可堪一用的核力量。"
tip.7.a:0 "确定"

ECONOMIC_TIPS_TITLE:0 "关于经济生产系统"
ECONOMIC_TIPS_TEXT:0 "我们所消费的商品，并非来自于面包师的恩赐，而是来自于他们对自身利益的关切。     ——亚当·斯密\n\n《东西对抗》模组完全废除了原游戏中简陋的经济生产系统，而自行设计了一个全新的，较为复杂的经济系统，以还原经济对冷战历史的重要影响。 \n§Y你需要使用左上角的新的经济面板来管理工业和农业生产以及他们的进出口贸易§W，包括粮食、经济作物、矿物资源、燃料、石油和工业品，使这些资源能够满足民众的消费需求和工业生产需求。一些产品如果能满足需求，可以获得额外增益，§R但一些必需品如果不能满足需求（如纺织品和药物），会带来额外的惩罚。§W\n§Y模组关闭了原有的贸易系统，你必须通过左上角的新界面进行贸易以购买资源。§W模组中购买资源不花费民用工厂，而是使用财政支出，详情请见财政界面。\n在模组中，§Y你需要建造炼钢厂来将铁矿加工成钢材以生产武器和工业品，以及建造化工厂来将石油加工成塑胶§W，塑胶取代了原版游戏中的橡胶。\n在模组中，你可以通过民用工厂，将资源加工成纺织品、汽车、电子产品的资源以满足人民的消费需求，§Y多余的产品可以出口，以获取外汇。§W"
tip.7.a:0 "确定""

