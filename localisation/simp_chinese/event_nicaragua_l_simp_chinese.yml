l_simp_chinese:
 nic.20.t:0 "尼加拉瓜总统索摩查·加西亚遭遇刺杀！"
 nic.20.d:0 "尼加拉瓜总统安纳斯塔西奥·索摩查·加西亚在一场宴会上遭到刺杀！枪手使用左轮枪朝着索摩查连开六枪，索摩查中枪后倒地，被保镖紧急送往医院抢救！"
 nic.20.a:0 "不会有康复的风险吧。"
 
 nic.21.t:0 "索摩查·加西亚死亡！"
 nic.21.d:0 "尼加拉瓜总统安纳斯塔西奥·索摩查·加西亚遇刺后抢救无效死亡，结束了这个独裁者罪恶而耻辱的一生。根据其生前遗嘱，其长子兼议长路易斯·索摩查接任了尼加拉瓜总统职位。"
 nic.21.a:0 "好好好，老登终于爆金币了"
 
 nic.22.t:0 "索摩查·加西亚得到抢救"
 nic.22.d:0 "尼加拉瓜总统安纳斯塔西奥·索摩查·加西亚遇刺后，被紧急送往巴拿马的美国医院抢救，最后成功脱离生命危险，但重伤的索摩查认为自己已经失去了执政能力，其长子兼议长路易斯·索摩查接任了尼加拉瓜总统职位。"
 nic.22.a:0 "老天不开眼啊"