 raj.1.t:0 "印度独立"
 raj.1.d:0 "随着最后一批英国军队从孟买乘上船只离去，正式宣告印度的独立，结束了大英帝国在印度百余年的统治。领导印度独立斗争的国大党成为了印度的执政者。然而，由于民族冲突导致的政局动荡，穆斯林与印度教徒的冲突正在升级。"
 raj.1.a:0 "Jaya！"
 
 
 hyd.1.t:0 "海得拉巴的选择"
 
 hyd.2.t:0 "海得拉巴土邦并入印度"
 
 hyd.5.t:0 "海得拉巴土邦拒绝合并"
 hyd.5.d:0 "南印度德干高原上的海得拉巴土邦，与印度自治领新政府的谈判宣告破裂。作为英属印度时期面积最大、最富庶的土邦之一，其穆斯林统治者尼扎姆·米尔·奥斯曼·阿里·汗无意加入以印度教徒为主体的新印度。他倚仗英国殖民时期留下的、一支相对现代化的军队作为支撑，坚决拒绝签署《加入协定》。\n谈判失败后，奥斯曼·阿里·汗转而寻求与同为穆斯林国家的巴基斯坦建立特殊关系，甚至秘密接洽，试图获得其支持。他的根本目标是维持海得拉巴的独立主权，梦想在这片土地上建立一个由其家族统治的独立王国。这一立场与印度政府“一个印度”的建国原则产生直接且不可调和的冲突，使战争阴云迅速笼罩了德干高原。"
 
 hyd.6.t:0 "针对海得拉巴的讨论"
 
 hyd.7.t:0 "印度对海得拉巴采取军事行动"
 hyd.7.d:0 "印度总理贾瓦哈拉尔·尼赫鲁与副总理兼内政部长萨达尔·瓦拉巴伊·帕特尔今日正式宣布，启动代号为“波罗行动”的军事行动，对坚持独立的海得拉巴土邦实施武力进攻。官方声明强调，此举旨在保护当地占人口多数的印度教民众的生命安全，并终止以“拉扎卡尔”民兵为代表的穆斯林极端势力的暴力统治。\n新组建的印度军队多路并进，其主力部队配备英制轻型坦克，从北、东、西三个方向开进德干高原，向海得拉巴腹地快速推进。印军已与顽抗的“拉扎卡尔”民兵及土邦正规军在边境地区发生激烈交火。印度政府宣称，此次行动目标明确，即迅速解除海得拉巴武装，恢复法律与秩序，并最终将其并入印度联邦。"
 
 hyd.8.t:0 "海得拉巴的印度教徒发起游行"
 hyd.8.d:0 "海得拉巴的印度教徒发起游行"
 
 hyd.9.t:0 "海得拉巴宗教冲突激化"
 hyd.9.d:0 "在海得拉巴土邦统治者奥斯曼·阿里·汗宣布拒绝加入印度后，其境内占人口多数的印度教徒社群及众多亲印度政治团体，于主要城市发起了大规模和平示威，强烈要求与印度统一。为镇压这一内部整合运动，尼扎姆授权其核心幕僚、穆斯林右翼强硬派领袖卡西姆·拉兹维，迅速组建并武装了一支名为“拉扎卡尔”的准军事民兵组织。\n该民兵武装随即对示威活动展开了残酷镇压，其手段包括暴力驱散、任意逮捕及针对印度教徒社区的恐吓与袭击，造成了大量平民伤亡。这一系列血腥事件迅速通过国际媒体报道，引发了英国、美国等国际社会的广泛关注与谴责。印度国内舆论随之沸腾，公众、主要政党及媒体强烈敦促尼赫鲁政府立即采取果断军事行动，终结海得拉巴的混乱状态，保护当地民众并强制其并入印度联邦。局势的升级，使得武装冲突已不可避免。"
 
 hyd.10.t:0 "穆斯林民兵团体的组建"
 
 hyd.12.t:0 "海得拉巴问题已不可拖延"
 hyd.12.d:0 "新德里总理府内的气氛凝重。距离最终决策仅一步之遥，贾瓦哈拉尔·尼赫鲁与他的副手、被尊称为“印度铁人”的萨达尔·瓦拉巴伊·帕特尔，正在就海得拉巴土邦问题展开一场关乎国家未来走向的关键讨论。\n尼赫鲁总理的忧虑显而易见。他缓步走到窗前，目光仿佛已越过千山万水，投向了德干高原。他担心，海得拉巴的军队——那支由英国军事顾问训练、装备精良的部队——会进行异常顽强的抵抗，将印度拖入一场代价高昂且旷日持久的消耗战。“我们的国家刚刚独立，百废待兴，”尼赫鲁转过身，语气沉重，“更要紧的是，伦敦会如何反应？卡拉奇会袖手旁观吗？这很可能给外部势力，尤其是巴基斯坦进行干涉的借口，甚至引发更大规模的冲突。”\n帕特尔静静地听着，他坚毅的面庞上没有一丝动摇。作为内政部长和印度各土邦合并事务的主要操盘手，他比任何人都更了解海得拉巴内部尖锐的宗教矛盾与“拉扎卡尔”民兵的血腥暴行。当尼赫鲁话音落下，帕特尔用他标志性的、斩钉截铁的语气回应道：“贾瓦，犹豫不决的代价更大。”\n他站起身来，逻辑清晰地阐述自己的立场：“这不仅仅是为了领土统一，更是为了拯救数百万正处于暴政威胁下的同胞（指印度教徒）。海得拉巴是一个被包裹在印度腹地的毒瘤，我们必须清除它。”帕特尔走到地图前，手指重重地点在海得拉巴的位置上，“更重要的是，全世界都在看着我们。一个连内部统一都无法果断维护的新生国家，如何赢得国际社会的尊重？英国人的时代已经过去了，我们必须用行动证明，印度有决心、也有能力捍卫自己的核心利益。”\n"
 
 hyd.13.t:0 "印军攻占海得拉巴"
 hyd.13.d:0 "“波罗行动”以印军的迅速胜利告终。在压倒性的火力与兵力优势下，主要由民兵组成的“拉扎卡尔”武装在印度正规军面前不堪一击，防御迅速瓦解。印军主力部队在几乎没有遇到成建制抵抗的情况下，长驱直入，于今日开进海得拉巴市区，并获得了当地印度教民众自发组成的抵抗武装的积极接应与支持。\n印度副总理兼内政部长萨达尔·帕特尔随即宣布：“海得拉巴已从暴政中解放。”其民兵领袖卡西姆·拉兹维在狼狈逃亡途中被印军俘获，将面临法律审判。而土邦统治者尼扎姆·米尔·奥斯曼·阿里·汗则被印军软禁于其宫殿内，等待被送往新德里，就土邦未来的政治地位与印度政府进行谈判。这标志着南亚次大陆最后一个主要土邦的独立企图被军事终结，海得拉巴正式并入印度联邦版图。"
 
 
 raj.3.t:0 "锡克军团成立"
 
 raj.4.t:0 "莫汉达斯·甘地遭到枪击！"
 raj.4.d:0 "印度独立运动领袖、被尊称为"圣雄"的甘地今日傍晚在新德里比尔拉宅邸遭枪击身亡。这名79岁的和平主义者身中三枪，在送往医院途中停止了呼吸。\n据目击者描述，凶手伪装成虔诚的信徒混入晚祷会，在甘地走向讲坛时突然开枪，高喊极端宗教口号后被当场制服。警方确认凶手系印度教极端组织成员，不满甘地主张印度教徒与穆斯林和解。\n甘地遇刺消息引发全国震动。新德里街头，穆斯林商铺与印度教神庙同时降下半旗。总理府宣布全国哀悼七日，就连卡拉奇的巴基斯坦新政府也发出唁电，但仍有极端团体在加尔各答庆祝，与警方发生冲突。\n这位毕生倡导非暴力的领袖，最终倒在暴力之下。甘地之死折射出印度宗教矛盾的深渊，其倡导的宽容理念正面临严峻考验。夜幕下的亚穆纳河畔，成千上万民众手持油灯，沉默地送别他们的"国父"。"
 raj.4.a:0 "神啊，愿他安息！"
 
 raj.5.t:0 "亚洲关系会议召开"
 
 raj.6.t:0 "印度共和国成立"
 raj.6.d:0 "印度政府正式发布声明，该国已经决定退出英联邦，不再尊英国君主为国家元首，并成立印度共和国。"
 
 raj.7.t:0 "动荡不安的南亚次大陆"
 raj.7.d:0 "在欧洲的重建转入正轨的时候，我们也需要将目光移向遥远的南亚。\n随着英国移交政权日期临近，印度各党派就国家未来格局爆发激烈争论。穆斯林联盟坚持建立独立的巴基斯坦国，而国大党则力主保持印度统一，双方谈判陷入僵局。\n在印度，穆斯林与印度教徒的矛盾由来已久，在莫卧儿帝国时期，双方爆发的血腥战争，为每一个印度的政治家和历史学家所知，因此，印度穆斯林提出了建立巴基斯坦国——将印度的伊斯兰教地区单独拿出来建立一个国家。以阿里·真纳为代表的穆斯林联盟呼吁英国支持这一想法，并相信如果强行将穆斯林和印度教徒柔和为一个国家，会引起血腥的内战，而领导印度独立的印度国大党内部，就是否接受这一提案陷入内部矛盾。\n两国方案已在印度传开，支持者和反对者的团体正在对峙。次大陆正站在战争与和平的十字路口。联合国观察员警告，若不能达成共识，南亚或将陷入"人类历史上最大规模的强制人口迁徙"。"
 
 raj.8.t:0 "印度发生严重的社会动荡！"
 raj.8.d:0 "德里的空气中弥漫着焦糊的血腥味。分治方案公布的第二天，印度教极端分子举着带血的弯刀冲进清真寺，经书燃烧的灰烬飘落在市政厅刚贴出的分治地图上，将巴基斯坦的绿色领土烧出焦黑的洞。\n开往拉合尔的列车里，穆斯林难民蜷缩在行李架上，车窗玻璃全被砸碎，铁轨旁散落着裹着纱丽的尸体。有个小男孩死死抱着被劈成两半的《古兰经》，鲜血把阿拉伯经文染得更加鲜艳。\n当英国军官的吉普车碾过满地碎镜片时，后视镜里映出焚烧的村庄。殖民者留下的边界线正在地图上蜿蜒成血河。\n\n本报的记者刚刚从孟买死里逃生回来，向世界公布惊人的消息：在两国方案正式公布之后，印度立刻爆发了大规模的流血冲突，反对巴基斯坦建国的极端印度教徒和支持建国的极端穆斯林爆发了大规模的冲突，已造成至少一万人死亡！"
 
 raj.9.t:0 "帝国的退潮"
 raj.9.d:0 "孟买港，咸腥的海风裹挟着焦灼与恐慌。英国官员的家属们提着皮箱匆匆登船，行李箱上还贴着“德里-伦敦”的标签。曾经为殖民政府服务的印度雇员紧随其后，手中紧攥着盖有特殊印章的通行证，眼神躲闪着港口栅栏外愤怒的人群。\n港口的铁栅栏外，平民们推搡着、哭喊着。一位老人抱着生病的孙女，试图向守卫解释他曾在大战中为英军效力，却被一杆步枪冷冷地挡回。而一名带着锡克头巾，穿着西装的男人，向士兵出示自己的护照之后，便被允许带着自己英国主人的行李进入港口。\n夕阳西沉，海面镀上一层血色。码头上散落着被踩碎的眼镜、撕烂的护照。这是记者在大英帝国皇冠的宝珠掉落前拍摄的最后一幕。"
 
