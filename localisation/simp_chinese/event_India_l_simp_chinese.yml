 raj.39.t:0 "[FROM.GetName]发起不结盟运动"
 raj.39.d:0 "南斯拉夫、埃及和印度三国领导人今日在此间举行联合记者会，共同宣布发起不结盟运动。这场在冷战背景下召开的峰会，标志着全球第三支政治力量的崛起。\n三位领导人在可容纳千人的联邦议会厅签署《贝尔格莱德宣言》，主张各国享有自主选择社会制度和发展道路的权利，反对军事集团对抗。宣言强调："我们拒绝成为别人棋盘上的卒子，每个民族都应是自己命运的主人。"现场来自25个发展中国家的观察员起立鼓掌达十分钟。\n此次会议直接回应了美苏两大阵营的核军备竞赛。南斯拉夫领导人指出，不结盟不是中立，而是"积极和平共处"。埃及代表呼吁联合国改革，要求增加亚非拉国家席位。印度领导人则警告核战争威胁，倡议建立"无核武器区"。"
 
