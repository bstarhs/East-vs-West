 raj.46.t:0 "印度在藏南集结军队"
 raj.47.d:0 "在中印两国有关藏南的谈判破裂后，印度政府开始在藏南地区集结部队，试图实际控制这片土地。我们如何应对？"
 raj.47.a:0 "向印度发出严正警告。"
 raj.47.b:0 "我们只能随它去。"
 
 raj.47.t:0 "中国要求撤出阿鲁纳恰尔"
 
 raj.48.t:0 "印度撤出藏南"
 raj.48.d:0 "在中印两国有关藏南的谈判破裂后，两国在藏南地区的对峙越来越严重。在中国政府的压力下，印度军队最终不得不撤离藏南地区，而中国人民解放军随后进入此地，实现了对藏南的控制。"
 raj.48.a:0 "确定。"
 
 raj.49.t:0 "印度拒绝撤出藏南"
 raj.49.d:0 "印度政府蛮横地拒绝了我们的要求，并继续向藏南派兵。我们如何应对？"
 raj.49.a:0 "我们只能随它去。"
 raj.49.b:0 "是时候采取军事行动了！"
 
 raj.50.t:0 "中印边境战争爆发！"
 raj.50.d:0 "在中印两国有关藏南的谈判破裂后，两国在藏南地区的对峙越来越严重，印度不断加强在藏南地区的军事存在，并拒绝了中国政府撤军的警告，最终中国人民解放军选择采取武力行动。"
 raj.50.a:0 "确定。"
 
 raj.51.t:0 "中国军队被迫撤离藏南"
 raj.51.d:0 "尽管发动多次进攻，解放军仍然无法突破印军在藏南构筑的防线，最终被迫撤离。边境战争以印度的胜利告终。"
 raj.51.a:0 "确定。"
 
 raj.52.t:0 "成功击溃印军防线"
 raj.52.d:0 "我们在藏南的军事行动取得了胜利，印军狼狈地撤离了。但藏南地区地形特殊，补给短缺，我们的军队或许很难长期守住这个地区。我们是选择保持占领还是撤退？"
 raj.52.a:0 "确定。"
 
 raj.53.t:0 "中国军队撤离藏南"
 raj.53.d:0 "在中国军队的猛攻下，印军的防线很快被摧毁，解放军获得了边境战争的胜利，但由于藏南的特殊气候条件，毛泽东认为这片地区难以长期驻守，最终选择了撤退。"
 raj.53.a:0 "确定。"
 
 raj.54.t:0 "中国军队占领藏南"
 raj.54.d:0 "在中国军队的猛攻下，印军的防线很快被摧毁，解放军获得了边境战争的胜利，控制了这片地区。"
 raj.54.a:0 "确定。"
