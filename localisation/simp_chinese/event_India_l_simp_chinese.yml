 raj.59.a:0 "确定。"
 
 raj.60.t:0 "成功击溃印军防线"
 raj.60.d:0 "我们在果阿的军事行动取得了胜利，葡军狼狈地投降了。"
 raj.60.a:0 "确定。"
 
