 raj.200.t:0 "萨维特莉·黛维受邀加入印度政府"
 raj.200.d:0 "随着狂热的印度教民主主义在印度全面掌权，印度正向不可控制的方向发展。秘传纳粹主义者，具有希腊和法国血统的狂热印度教徒，萨维特莉·黛维，在印度民族主义当局的邀请下，来到德里，宣布成为当局的意识形态顾问……\n黛维以她诡异的秘传纳粹主义意识形态文明，她坚信印度婆罗门是雅利安优等民族的后裔，而世界被犹太劣等民族所玷污，纳粹德国元首希特勒，是一位勇敢反抗犹太人的婆罗门战士，虽然希特勒失败了，但雅利安人的斗争没有结束，黛维将领导印度雅利安人发起新的战争，摧毁污浊的世界，创造新的天堂。"
 raj.200.a:0 "我了个大草！什么东西啊！"
 
 raj.201.t:0 "萨维特莉·黛维和她的《闪电与太阳》"
 raj.201.d:0 "萨维特莉·黛维，原名马克西米亚妮·朱利亚·波尔塔，一名狂热的新纳粹主义者，宣布她的新书《闪电与太阳》正式出版。\n黛维曾在二战中为德国在印度从事间谍活动，以诡异的秘传纳粹主义意识形态闻名。她在书中提出，印度婆罗门和日耳曼人都是是雅利安优等民族的后裔，而世界被犹太劣等民族所玷污，纳粹德国元首希特勒，是一位勇敢反抗犹太人的婆罗门战士，虽然希特勒失败了，但雅利安人的斗争没有结束，黛维将领导印度雅利安人发起新的战争，摧毁污浊的世界，创造新的天堂。此书一出惊呆了许多媒体和读者，纷纷抨击黛维是一个精神失常的疯子，但也有其他新纳粹分子认为，黛维才是真正参透世界的人。"
 raj.201.a:0 "我了个大草！什么东西啊！"
 
 raj.202.t:0 "室利·奥罗宾多去世"
 raj.202.d:0 "印度著名的政治家、哲学家、瑜伽修行者室利·奥罗宾多在其位于本地治里的修道院中逝世，享年78岁。这位传奇人物的离去，被广泛认为是印度一个思想时代的落幕。\n奥罗宾多早年留学英国剑桥，深受西方先进思想影响。学成归国后，他迅速投身于印度民族独立运动，成为一名激进的民族主义者。他创办《祖国》报，以犀利笔锋宣扬反殖民思想，激发民众觉醒。然而，在经历政治斗争与牢狱之灾后，他的人生轨迹发生重大转折。他逐渐将重心转向精神哲学与内在修行，开创了倡导通过瑜伽实现意识进化的“整体瑜伽”体系，并在本地治里创立静修院，吸引了世界各地的追随者，影响力远超政治领域。\n印度总理尼赫鲁在其逝世后给予高度评价，称赞他是“将深邃精神力量注入民族复兴的伟大灵魂”。在印度民众心中，奥罗宾多凭借其在政治觉醒与精神探索两方面的卓越贡献，已与圣雄甘地、诗哲泰戈尔并列，被尊崇为塑造现代印度精神图景的“三圣”之一。"
 raj.201.a:0 "我了个大草！什么东西啊！"
 