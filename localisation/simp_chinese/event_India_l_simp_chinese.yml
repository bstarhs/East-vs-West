 raj.17.d:0 "克什米尔的迷茫" 
 
 raj.18.t:0 "巴基斯坦向克什米尔提出要求"
 raj.18.d:0 "巴基斯坦以克什米尔地区以穆斯林人口占多为由，主张克什米尔并入印度。" 
 
 raj.19.t:0 "克什米尔遭到袭击"
 raj.19.d:0 "克什米尔遭到巴基斯坦支持的穆斯林武装入侵，后者试图将克什米尔并入巴基斯坦。克什米尔王工请求印度军队进入该地区抵抗穆斯林。" 
 
 raj.20.t:0 "克什米尔并入印度"
 raj.20.d:0 "印度和巴基斯坦在克什米尔的军事冲突以印度胜利告终，克什米尔地区被印度完全控制。" 
 
 raj.21.t:0 "巴基斯坦入侵克什米尔"
 raj.21.d:0 "有关克什米尔前途问题的政治对话以失败告终，巴基斯坦决定采取军事手段，支持穆斯林武装夺取克什米尔政权。"
 
 raj.22.t:0 "印度占领克什米尔"
 raj.22.d:0 "印度和巴基斯坦在克什米尔的军事冲突以印度胜利告终，克什米尔地区被印度完全控制。" 
 
 raj.23.t:0 "巴基斯坦占领克什米尔"
 raj.23.d:0 "印度和巴基斯坦在克什米尔的军事冲突以巴基斯坦胜利告终，克什米尔地区被巴基斯坦完全控制。" 
 
 raj.24.t:0 "克什米尔并入巴基斯坦"
 raj.24.d:0 "印度和巴基斯坦在克什米尔的军事冲突以巴基斯坦胜利告终，克什米尔地区被巴基斯坦完全控制。" 
 
 raj.25.t:0 "巴基斯坦与印度停火"
 raj.25.d:0 "持续15个月的克什米尔战争今日午夜正式停火，印度与巴基斯坦最终接受联合国调解的分区占领方案。停火线将这片争议领土一分为二，双方军队将于72小时内撤至指定区域。"
 
 raj.26.t:0 "克什米尔分治"
 raj.26.d:0 "印度与巴基斯坦军队已脱离接触，联合国观察员已进驻斯利那加，监督停火执行。根据方案，印度控制包括克什米尔谷地在内的东部区域，巴基斯坦则获得北部及西部领土。争议焦点查谟地区的归属将留待"未来公投"决定——尽管双方对公投范围各执一词。\n这场造成数万人伤亡的冲突虽暂告段落，但克什米尔上空仍阴云密布。联合国车队正沿新划定的740公里停火线树立界桩，而这些单薄的木桩，将成为两个新生国家间最漫长的伤口。"
 
