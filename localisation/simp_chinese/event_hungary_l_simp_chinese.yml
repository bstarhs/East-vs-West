l_simp_chinese:
 hun.1.t:0 "来自去斯大林化的政治压力"
 hun.1.d:0 "匈牙利部长会议主席的选举开始了。主张改革和建立匈牙利特色社会主义的纳吉·伊姆雷受到了人民的欢迎。然而，拉科西和一些亲苏联党员强烈反对，他们更喜欢保守派的格罗·埃尔诺。"
 hun.1.a:0 "由纳吉同志领导我们建设一个独立和民主的匈牙利！"
 hun.1.b:0 "格罗同志的政策确实符合社会主义国家。"
 
 hun.3.t:0 "来自苏南冲突的政治影响"
 hun.3.d:0 "随着苏联与南斯拉夫关系的不断恶化，两国之间的政治斗争不可避免地对我国产生了影响。党内不同派系纷纷在这一问题上进行站队，以拉科西·马加什为首的亲苏派坚定的站在莫斯科一边，而以László Rajk为首的一派则主张中立。"
 hun.3.a:0 "坚定支持斯大林同志，反对铁托主义！"
 hun.3.b:0 "反对莫斯科干涉我党的路线，保持中立。"
 
 hun.4.t:0 "匈牙利宣布清洗铁托分子"
 hun.4.d:0 "苏联与南斯拉夫的政治斗争蔓延到了匈牙利。匈牙利劳动人民党宣布坚定支持斯大林同志在社会主义阵营中的领袖地位，批判铁托的亲西方行为，并连带清洗了László Rajk、纳吉·伊姆雷等在这一问题上态度不坚决的党员。"
 
 hun.5.t:0 "匈牙利宣布在苏南冲突中保持中立"
 hun.5.d:0 "苏联与南斯拉夫的政治斗争蔓延到了匈牙利。经过激烈的政治斗争，同情铁托一派的党员取得优势，在他们的压力下，亲苏的拉科西·马加什被迫做了自我批评，匈牙利劳动人民党亦宣布在苏南问题中保持中立。"
 
 hun.6.t:0 "László Rajk被处决"
 hun.6.d:0 "匈牙利前内政部长László Rajk因勾结铁托分子，被匈牙利共产党当局以叛国罪和反革命罪处决。"
 
 
 
 hun.10.t:0 "布达佩斯的示威游行"
 
 hun.11.t:0 "纳吉与示威者会面"
 
 hun.12.t:0 "匈牙利选举"
 hun.12.d:0 "匈牙利部长会议主席的选举开始了。主张改革和建立匈牙利特色社会主义的纳吉·伊姆雷受到了人民的欢迎。然而，拉科西和一些前苏联党员强烈反对，他们更喜欢保守派的格罗·埃尔诺。"
 hun.12.a:0 "由纳吉同志领导我们建设一个独立和民主的匈牙利！"
 hun.12.b:0 "格罗同志的政策确实符合社会主义国家。"

 hun.13.t:0 "匈牙利改革"
 hun.13.d:0 "匈牙利部长会议主席纳吉·伊姆雷实施新政策，进一步提出以匈牙利社会主义道路取代苏联模式，以主权独立和民族平等反对苏联控制的主张，引起了党内知识分子的共鸣。匈牙利比其他东欧国家更早地开始了“非苏联模式”的进程。"
 hun.13.a:0 "纳吉同志万岁！匈牙利万岁！"
 
 hun.14.t:0 "警惕匈牙利的反革命暴动！"
 hun.14.d:0 "反共产主义的暴动正在匈牙利蔓延！暴徒正在四处攻击政府机关，煽动反苏反共情绪，并试图重建亲西方的政府，而匈牙利政府对此束手无策。或许我们需要进行警告，迫使他们悬崖勒马。"
 
 hun.15.t:0 "来自莫斯科的警告！"
 hun.15.d:0 "莫斯科指责我们在放纵帝国主义和反共分子夺取政权，并要求我们采取强硬措施。"
 
 hun.16.t:0 "匈牙利无视我们的警告！"
 hun.16.d:0 "[HUN.GetName]领导人[HUN.GetLeader]无视了我们的警告，并试图与反革命分子妥协。"
 
 hun.17.t:0 "格罗·埃尔诺恢复职位"
 hun.17.d:0 "在来自莫斯科的压力下，匈牙利政府被迫向苏联妥协。在昨天举行的匈牙利劳动人民党最高会议上，以格罗·埃尔诺为首的强硬派仗着苏联的支持，迫使纳吉·伊姆雷等改革派辞职，强硬派重新掌握了权力。格罗恢复最高领导人职位后立刻发表措辞强硬的讲话，谴责民主运动的参加者为阴险狡诈的暴徒，呼吁拥护党中央的群众和苏联友军协助平叛。布达佩斯的示威者被激怒，局势再一次恶化！"
 
 hun.18.t:0 "匈牙利全面暴动爆发！!"
 
 hun.19.t:0 "亚诺什·卡达尔就任匈牙利共产党新任领导人"
 
 hun.20.t:0 "苏联军队占领布达佩斯"
 hun.20.d:0 "布达佩斯的枪声渐渐稀疏。苏联坦克碾过链子桥上破碎的国旗，履带上的冰碴混合着凝固的血迹。电台大楼的地下室里，最后几个抵抗者烧毁了通讯录。\n国会大厦地下室的门突然被撞开。几个戴毛皮帽的军官拖出藏匿多日的政治家，伊姆雷·纳吉疲惫地将自己的证件交给苏联军人，他西装口袋里还插着几天前宣布匈牙利退出华约的演讲稿。\n当黎明再次降临，多瑙河面漂着未烧尽的传单。"
 
 hun.21.t:0 "匈牙利政局变动"
 hun.21.d:0 "在苏联的操作下，以伊姆雷·纳吉为首的匈牙利政府被宣布非法并解散，卡达尔·亚诺什成为匈牙利劳动党的信任领袖。卡达尔首先表达了对苏联军队的感谢，但也强调，匈牙利的改革不会停止。"
 
 hun.30.t:0 "匈牙利学生发起罢课"
 hun.30.d:0 "裴多菲雕像下聚集的人群如潮水般涌动。布达佩斯大学和赛格德大学的学生们撕毁了俄语教科书，纸页在风中翻飞，像一群挣脱牢笼的白鸽。\n最初的罢课通知还贴在布达佩斯大学走廊，很快就被传抄成万份传单。工人们摘下工厂里的红旗，换上被禁十二年的科苏特徽章。越来越多的市民打开家门，向游行队伍递出面包和铁锤。链子桥上的电车停运了，车厢里挤满了传唱《民族之歌》的少女，她们的辫梢还系着黑黄红三色丝带。\n\n来自布达佩斯消息，匈牙利多地发生示威游行，要求执政的劳动人民党进行民主改革。"
 
 hun.31.t:0 "布达佩斯学生起草十六点要求"
 hun.31.d:0 "布达佩斯的示威学生发起请愿活动，并草拟了十六点要求：言论自由、结社自由、出版自由，政治自由，反对一党专制，反对苏俄的影响力，退出华约组织等。"
 
 hun.32.t:0 "群众要求释放政治犯！"
 hun.32.d:0 "示威游行的群众包围了警察局和监狱，要求释放在共产党大清洗中蒙冤入狱的政治犯！"
 
 hun.33.t:0 "裴多菲俱乐部成立！"
 hun.33.d:0 "在匈牙利民主运动风起云涌之下，以学生和知识分子为主的裴多菲俱乐部成立！这一团体要求彻底推翻共产主义政府，以实现匈牙利的民族复兴！"
 
 hun.34.t:0 "布达佩斯斯大林雕像被推倒！"
 hun.34.d:0 "布达佩斯的示威者推到了在英雄广场上的斯大林雕像！当游行队伍经过英雄广场时，有人用钢索套住了斯大林铜像的脖子——这座八米高的巨物轰然倒地，摔碎的青铜头颅里，露出填塞的废旧炮弹壳。"
 
 hun.35.t:0 "暴动者开始夺取武器！"
 hun.35.d:0 "匈牙利的示威游行开始向暴力方向发展！示威者冲击警察局并夺取了武器！"
 
 hun.36.t:0 "《自由人民报》总部被占领！"
 hun.36.d:0 "布达佩斯的示威者占领了匈牙利劳动人民党党报《自由人民报》总部！"
 
 hun.37.t:0 "警察与军队哗变！"
 hun.37.d:0 "警察与军队倒戈加入了反政府示威者的队伍！"
 
 hun.38.t:0 "匈牙利政府释放政治犯！"
 hun.38.d:0 "在示威者的压力下，匈牙利政府释放了一批在拉科西统治时期被关押进秘密警察监狱内的政治犯。"
 
 hun.39.t:0 "格罗·埃尔诺斥责匈牙利暴动为反革命！"
 hun.39.d:0 "匈牙利共产党保守派的格罗·埃尔诺，在匈牙利局势不断恶化的背景下，依然保持强硬的态度。他谴责示威者是反革命、反社会主义、反人民的暴徒和凶犯，斥责他们正在破坏匈牙利的秩序与稳定，呼吁党内的强硬派与苏联盟友采取果断措施，镇压暴乱。\n\n如不采取果断的手段制止暴乱，那么无数无产阶级流血牺牲建立起来的这个社会主义匈牙利，就会面临严重的威胁！"
 
 hun.40.t:0 "匈牙利军队与群众爆发流血冲突！"
 hun.40.d:0 "支持匈牙利共产党的军方与反政府的示威者爆发了严重流血冲突！"
 
 hun.41.t:0 "格罗·埃尔诺辞职！"
 hun.41.d:0 "在示威群众和党内改革派的压力下，匈牙利共产党的保守派领袖格罗·埃尔诺被迫辞职，格罗在今早的匈牙利劳动党大会上，被纳吉·伊姆雷宣布解除职务。失势的格罗垂头丧气地离开大会会场，并在保镖保护下，穿过愤怒的示威者人群。"
 
 hun.42.t:0 "匈牙利新政府下达停火呼吁"
 hun.42.d:0 "以伊姆雷·纳吉为首的匈牙利新政府向全体匈牙利人提出停火呼吁，号召人民保持冷静，停止敌对行动。"
 
 hun.43.t:0 "匈牙利宣布进行政治改革！"
 hun.43.d:0 "以伊姆雷·纳吉为首的匈牙利新政府正式颁布了《匈牙利民主化纲领》，向全体匈牙利人宣布，新政府将进行更深入的政治改革，推动民主制度和法制建设，废除过去的斯大林主义独裁体制，使匈牙利能够建立一个人道、民主、自由的社会主义制度。"
 
 hun.45.t:0 "匈牙利宣布解散党禁！"
 
 hun.46.t:0 "匈牙利宣布废除传媒管制！"
 
 hun.47.t:0 "匈牙利民主党的建立！"
 
 hun.48.t:0 "匈牙利天主教人民党的成立！"
 
 hun.49.t:0 "匈牙利的地方苏维埃成立！"
 
 hun.50.t:0 "匈牙利共和国广场发生严重流血冲突！"
 
 hun.51.t:0 "群众要求退出华沙条约！"
 hun.51.d:0 "示威者包围了布达佩斯的外交部大楼，要求匈牙利退出华沙条约这一苏俄控制东欧国家的傀儡集团！"
 
 hun.52.t:0 "匈牙利通过中立宣言！"
 hun.52.d:0 "匈牙利政府正式发表外交声明，宣布该国将退出华沙条约组织，以实现外交和政治的独立自主！"
 
 hun.53.t:0 "苏联宣布暂时不介入匈牙利问题"
 hun.53.d:0 "苏联外交部长就匈牙利的紧张局势发表声明，表示苏联政府不反对匈牙利新政府实行的一系列改革措施，尊重匈牙利的主权和政治独立，但同时苏联方面强调，莫斯科将持续关注匈牙利局势发展，以避免事态向不利于社会主义国家团结稳定的方向发展。"
 
 hun.54.t:0 "苏联入侵匈牙利！"
 hun.54.d:0 "布达佩斯的天空被坦克炮火染成橘红色。T-54碾过印有斯大林画像的报纸碎片，驶向布达佩斯。\n布达佩斯的市民们用莫洛托夫鸡尾酒在巷口筑起防线，他们不知道他们能否抵抗俄国人的进攻，但他们知道，抵抗是保护自由匈牙利的唯一方式。\n被扎破轮胎的电车堵塞着主干道，抵抗着希望这能抵挡住苏联坦克一段时间，在被割掉国徽的匈牙利国旗下，一名手持波波沙冲锋枪的少女对照相机摆出来一个坚韧的表情，这是我们的记者离开布达佩斯前看到的最后一幕……\n\n来自匈牙利布达佩斯的紧急消息！！今天早上，驻扎在匈牙利境内的苏联部队突然向布达佩斯发起猛烈进攻，目前苏军已经和支持民主政府的匈牙利人发生激烈交火。匈牙利总理纳吉·伊姆雷指责苏联以颠覆匈牙利民主政府为目的发起侵略战争，呼吁国际社会支持匈牙利人民抵抗侵略！"
 
 hun.55.t:0 "群众要求释放政治犯！"
 
 hun.56.t:0 "关注匈牙利局势！"
 
 hun.57.t:0 "宣布支持匈牙利民主运动！"
 
 hun.58.t:0 "宣布支持匈牙利社会主义政府！"
 
 hun.59.t:0 "关注匈牙利局势！"
 hun.59.d:0 "苏联入侵匈牙利的行为引起了国际社会的关注！我们应该在就此事发表外交声明，以显示我们的外交影响力。"
 
 hun.60.t:0 "[FROM.GetName]宣布支持匈牙利抵抗苏联入侵！"
 hun.60.d:0 "[FROM.GetName]政府发表外交声明，谴责苏俄武力侵略匈牙利的霸权主义行为，呼吁自由世界帮助匈牙利人民抵抗邪恶共产主义势力！"
 
 hun.61.t:0 "[FROM.GetName]宣布支持苏联进入匈牙利平暴！"
 hun.61.d:0 "[FROM.GetName]政府发表外交声明，拥护苏联军队进入匈牙利，镇压叛乱，保护社会主义政权的决定！"
 
 hun.62.t:0 "匈牙利政府释放教士！"
 hun.62.d:0 "在示威者的压力下，匈牙利政府释放了一批在拉科西统治时期被关押进秘密警察监狱内的天主教会教士。"
 
 hun.63.t:0 "匈牙利政府致苏共中央信"
 hun.63.d:0 "尊敬的苏联共产党的同志们：\n我国的政治局势最近出现了动荡不安的事件，部分对拉科西·马加什的斯大林主义制度不满的群众发起了极端的政治运动，对我国的社会秩序带来了不良的影响。但请同志们放心，匈牙利的总体局势依然处于匈牙利劳动党的控制之下，我们相信情况不会朝着极端的方向发展，我们有信心维护匈牙利的社会主义制度，使其不受帝国主义分子的渗透和颠覆。我们也恳请苏联兄弟们保持中立，暂时不要介入匈牙利的事务，从而使情况复杂化。待我方将政治事件妥善解决后，继续合作维护社会主义阵营。"
 
 hun.70.t:0 "霍尔蒂·米克洛什去世"
 hun.70.d:0 "在匈牙利革命余波未平之时，传来了霍尔蒂·米克洛什在葡萄牙去世的消息。作为第二次世界大战期间的匈牙利摄政王，霍尔蒂无疑是一个极具争议的人物，在过去，他被匈牙利共产党和民主势力斥责为法西斯统者和出卖国家的德国傀儡，但在匈牙利政治风波后，右翼势力在匈牙利抬头，又出现了将霍尔蒂视为国家英雄的人。"
 
 hun.71.t:0 "苏联介入匈牙利大选"
 hun.71.d:0 "布达佩斯消息。在匈牙利大选即将开始前夕，驻扎在布达佩斯的苏军却突然逮捕了匈牙利农民党领袖Béla Kovács。苏联政府指责匈牙利农民党秘密与霍尔蒂政权的流亡分子勾结，然而匈牙利舆论普遍认为，苏联利用军队粗暴干涉匈牙利选举，帮助匈牙利共产党打击反对派。"
 
 hun.72.t:0 "匈牙利飞行员Tóth Lajos被捕"
 hun.72.d:0 "布达佩斯消息，匈牙利传奇Tóth Lajos成为匈牙利共产党大清洗的有一个牺牲品。Tóth Lajos是第二次世界大战期间的匈牙利王牌飞行员，总计确认击落敌机28架。二战结束后他放弃流亡西方，选择留在匈牙利帮助新政府发展空军。然而，Tóth Lajos遭到共党的无情背叛。当局以策划反共暴动为由将其逮捕，可能判处其死刑。"
 
 hun.73.t:0 "约瑟夫·明曾蒂拒绝配合宗教工作！"
 hun.73.d:0 "总书记同志：\n反动阶级的代理人，天主教会的头目，约瑟夫·明曾蒂枢机主教，用他愚昧而落后的宗教思维，反对社会主义的建设事业。他公然叫嚣，天主教会不服从于世俗的权力，煽动天主教徒抵制政府没收教会地产和学校。对于这种顽固愚昧的反动派，我们应该重拳出击！"
 
 hun.74.t:0 "约瑟夫·明曾蒂大主教被捕！"
 hun.74.d:0 "布达佩斯消息！\n匈牙利天主教会的约瑟夫·明曾蒂枢机主教遭共产党当局逮捕！当局指责枢机主教煽动教会抵制土地改革并煽动反共产主义暴动。西方国家和天主教国家予以强烈谴责！"
 
 hun.75.t:0 "罗马教皇谴责匈牙利"
 hun.75.d:0 "教宗庇护十二世宣布，所有参与约瑟夫·明曾蒂枢机审判和定罪的匈牙利共产党分子将被开除教籍。\n\n你们想要一个在应该发言时保持沉默的教会吗？一个在天主律法蒙召大声宣讲时却贬低它，试图使它迎合人的意愿的教会吗？你们想要一个背离基督所创立的不可动摇根基的教会吗？一个随波逐流的教会吗？一个不谴责压制良心、不维护人民正当自由的教会吗？"

