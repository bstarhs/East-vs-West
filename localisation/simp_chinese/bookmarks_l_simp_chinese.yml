l_simp_chinese:
 COUNTRY_SELECTION_CHARACTER_DESC: "$NAME|Y$$DESC|$\n$TRAITS_DESC|$"
 BM_HISTORY_TITLE:0 "历史"
 1947_NAME:0 "铁幕 1947"
 1947_DESC:0 "§G该剧本内容已基本创作完成\n\n\n§W从波罗的海的什切辛到亚得里亚海的的里雅斯特，一道横跨欧洲大陆的铁幕已经拉开。1945年，伟大的第二次世界大战结束。战后崛起的美利坚合众国和苏联这两个大国将欧洲分隔开来，在铁幕两边确立了势力范围。同时，战争的破坏造成了以欧洲为主的殖民体系的崩溃，各国殖民地掀起了独立的浪潮，这给了资本主义和共产主义两大意识形态扩张的机会。一场没有硝烟的战争已经开始，但这次的主角不是士兵和坦克，而是间谍和政客、科学家和智囊团、商人和叛徒。。。"

 FRA_1947_DESC:0 "法国是继德国之后西欧第二次世界大战的最大受害者。他们的土地被炮火摧毁，第三共和国被推翻。第四共和国接受了马歇尔计划，重建了自己的国家，但这并非没有代价——美国和英国积极邀请法国加入各自的军事集团，与来自东方的新敌人作战。但刚刚领导自由法国解放祖国的戴高乐将军却不这么认为。他不想看到美国成为西方世界的霸权，而是让法国主导战后欧洲的崛起，而以加强与苏联和新中国的关系为代价。法国会成为美国欧洲战略的棋子吗？或者领导欧洲，成为西欧的领导者？"

 USA_1947_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b我们要实现这个目标，就必须愿意帮助自由人民摆脱极权政权的控制，维护他们的自由制度和国家完整。我们需要组织共产主义的扩张和他们的颠覆运动……1947年，希腊、土耳其和中国与共产主义发生内战，东西德、南北韩分裂加剧，杜鲁门总统开始推行他的外交政策，改变了美国和世界，遏制共产主义，向全世界推广美国民主。既然美苏冷战已经开始，美国能领导自由世界消除共产主义的威胁吗？"

 WGR_1947_DESC:0 "二战对德国的袭击无疑是毁灭性的。东普鲁士和波兹南在苏联的控制下被分割成波兰。德国被英、法、美、苏四国瓜分，柏林被一分为二。然而，战争就这样结束了。在美苏占领军长期对峙之后，斯大林下令封锁西柏林。随后，德意志联邦共和国和民主德国相继成立。两个追随不同势力、走不同道路的德国人被推到意识形态冲突的前沿，这不仅代表着一个国家的分裂，也代表着两个世界的分裂。"

 ENG_1947_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b美国和苏联在第二次世界大战的美国、英国和苏联三大巨头中，先后在欧洲东西两侧确立了自己的势力范围。相反，英国人没有得到任何回报。从缅甸、马来亚到非洲，日不落帝国不断失去海外殖民地，最终成为一个次强。因此，为了维护他们的利益，英国选择站在美国一边，成为西方阵营的中坚力量。1946年，丘吉尔发表了他的铁幕演讲，标志着冷战时代的到来。"

 SOV_1947_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b以688万人伤亡为代价，苏联终于在柏林帝国大厦插上了红旗，赢得了战争。但战斗并未完全平息。战后，斯大林与西方在如何应对德国问题上发生了争执，随后意识形态与国家利益的冲突打破了同盟关系。莫斯科不想重复其领土每20年就被侵略一次的事实，因此他们需要主动在东欧建立社会主义屏障……"

 PRC_1947_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b虽然国共两党在重庆谈判期间为创建和平的中国付出了艰辛的努力，但双方的计划很小，在许多问题上存在分歧。最后的协议如同废纸。1946年，蒋介石的军队进攻共产党控制的地区。国共两党爆发了第二次内战。中共从陕西撤出主力后，准备向中原发动进攻。1947年是中国内战的关键一年，这场战争将直接决定中国的前途。中国共产党能领导全国人民，打败软弱的国民党政府，创造一个新中国吗？"

 CHI_1947_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b在重庆谈判中，蒋介石和毛泽东未能就废除共产党控制的地区和军队达成一个方案。虽然他们签署了一项协议，但双方都在为战争做准备。1946年，国共内战爆发，国民党军队进攻共产党控制的地区。蒋介石认为自己有先进的装备，但共产党也得到了苏联的资助。更重要的是，共产党得到了人民的支持。蒋介石能打败共产党，统一全国吗？"

 JAP_1947_DESC:0 "血腥的杀戮、无谓的死亡和两枚原子弹最终使一个好战国家低下头颅。日本投降后，美国建立了以麦克阿瑟为首的联合国管制，日本天皇裕仁不得不与他合作。在美军监督下下，民主复兴，军队被废除，日本共产党重新组建，新首相吉田茂和日本国民将如何从战争造成的低迷中解放出来？"

 GRE_1947_DESC:0 "二战后英国军队占领希腊，帮助希腊国王乔治二世夺回王位。但当在对德战争中做出功勋贡献的希腊共产党游击队寻求建立共和政府时，冷战的第一场血腥冲突开始了。"

 ALB_1947_DESC:0 "恩维尔·霍查领导阿尔巴尼亚劳动党游击队击败了德国和意大利侵略者，夺取了政权，现在，霍查同志将领导党和人民建立一个新的阿尔巴尼亚。除了内部的阶级敌人及派系斗争，霍查还要面对来自南斯拉夫的压力。就像苏联在东欧施加政治影响力一样，南斯拉夫作为二战中阿尔巴尼亚游击队最大的支持者，也希望入股新成立的阿尔巴尼亚政府。霍查要如何做出回答？"

 ARG_1947_DESC:0 "阿根廷在这场毁天灭地的世界大战中保持中立，并通过出口盟军急需的物资赚取大量外汇，但阿根廷人民并不满足于此。胡安·贝隆将军和他的正义党争取到了中产阶级和民粹主义者的支持，成为阿根廷总统，贝隆希望阿根廷走非共产主义、也非资本主义的第三条道路，实现经济国有化、排斥外国资本、提高福利并促进世俗化和现代化。贝隆的政策确实赢得了人民的支持和一定的成就，但随着通货膨胀和财政赤字的恶化，正义党能统治多久还是未知数。"

 JOR_1947_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b约旦河东岸的外约旦地区目前由哈希姆家族的阿卜杜拉一世统治，在哈希姆家族建立大阿拉伯的野望失败后，阿卜杜拉作为家族的次子被英国人安排到这片紧邻圣地耶路撒冷的地区统治。二战结束后，外约旦独立，阿卜杜拉一世成为约旦国王，但他的野心不满足于约旦这块土地，巴勒斯坦以色列人和阿拉伯人的冲突不断激化，阿拉伯人要求将犹太人逐出耶路撒冷，阿卜杜拉十分愿意接受这个请求，从而介入巴勒斯坦局势，让自己成为巴勒斯坦和耶路撒冷的新主人。"

 HUN_1947_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b米克洛什·霍尔蒂的军队被苏联摧毁，战后的匈牙利毫无疑问，没有夺回《特里亚农条约》中的任何一寸领土，并且落入了苏联和匈牙利共产党的控制之中。苏联在匈牙利建立了一个实际上处于共产党控制下的民主联合政府，匈牙利共产党似乎还无疑问会取得政权，然而，苏联对匈牙利的政治清洗并不彻底，至少在人民共和国正式成立以前，亲西方势力乃至箭十字党残余分子，在匈牙利依然有相当的影响力。"

 SIA_1947_DESC:0 "由于泰国外交部中的清醒人士没有向英美正式宣战，作为日本盟友的泰国躲过了盟军的攻击和审判。泰国建立了短暂的由军人组成的政府，披汶·颂堪首相宣布辞职，但依然在军方保持相当的影响力。二战中与日本结盟的错误决策，大大损害了军政府的威信，在披汶·颂堪集团准备重新夺回政权的同时，泰国国内的民主势力也意识到，打垮独裁政权，重新建立民主的机会即将到来。"

 YUG_1947_DESC:0 "经过艰苦的战斗，布罗兹·铁托元帅率领南斯拉夫共产党击溃了侵略者，并建立了新的南斯拉夫共和国。作为唯一一个不靠外援解放祖国的东欧国家，铁托对斯大林干涉东欧政治的行为十分警惕，他不希望南斯拉夫沦为俄国人的傀儡，即使与西方进行合作。对内，塞尔维亚人和克罗地亚人在二战期间互相仇杀，给南斯拉夫留下了深刻的民族矛盾，铁托元帅必须谨慎处理这一问题。"

 SPR_1947_DESC:0 "弗朗哥西班牙在第二次世界大战中意外的保持有臭味的中立，成为未受审判的法西斯政权，但他依然不被战后的新秩序接纳，西班牙仍是一个孤立的国家。弗朗哥政府中的一些人试图以反共产主义的立场与美国接触，但美国人开出了条件。"

 ITA_1947_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b作为二战的战败国，意大利接受了他应有的惩罚，萨伏伊王朝退位，意大利成为共和国，正如三千年前那样。但世界大战结束之后，新的冲突又将来临，意大利共产党在二战中组建了游击队对抗纳粹和法西斯，因此战争结束后，托里亚蒂领导的意共几乎成为意大利政坛的主导者，这显然不是美国人、教皇和反共保守势力想要看到的，因此他们将支持天主教民主党与共产党在即将到来的选举中一决高下，获胜的那一方将主导未来的意大利，而输掉的那一方也不一定就此罢休。"

 ROM_1947_DESC:0 "原本支持轴心国的罗马尼亚在二战末期迅速转变阵营加入同盟国，成为苏联的盟友。8月23日的政变后，罗马尼亚建立了一个特殊的君主立宪政权，只有26岁的米哈伊一世国王和苏联支持下的罗么尼亚共产党建立了联合政府，很显然这种联合政府不会长久，罗马尼亚共产党夺取政权已成事实。"

 CZE_1947_DESC:0 "捷克人对西方国家感到失望，慕尼黑阴谋使得英国人和法国人在捷克声名狼藉，而解放布拉格的俄国人广受捷克人欢迎，捷克共产党因此进入政府。美国人和苏联人将对捷克展开激烈的争夺，马歇尔计划将是捷克决定加入西方国家还是共产国家的开始。"

 POL_1947_DESC:0 "二战后英国军队占领希腊，帮助希腊国王乔治二世夺回王位。但当在对德战争中做出功勋贡献的希腊共产党游击队寻求建立共和政府时，冷战的第一场血腥冲突开始了。"

 TUR_1947_DESC:0 "土耳其政府在第二次世界大战中保持了中立，但到了战争末期，政府还是逐渐向英美接近了。二战后的苏联希望向地中海扩张影响力，为此希望得到达达尼尔海峡的出入权，面对苏联对压力，土耳其要么屈服，要么就得向西方国家寻求帮助。此外，阿塔图尔克·凯末尔留下的共和人民党，已经在土耳其实行了二十多年的一党执政，二战后，土耳其开始出现要求实行多党制的呼声，成为土耳其最重要的政治议题。"

 MAL_1947_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b驻扎在马来亚的英军在二战中被日军迅速击溃，只有少数的马来亚共产党武装坚持在密林中继续抵抗。而二战结束后，英国人回到马来亚，很显然双方不会轻易地向对方让出这片土地，因此一场血腥厮杀将在马来亚的土地上再次展开。"

 PAR_1947_DESC:0 "拉斐尔·弗朗哥在1936年建立的二月革命政府仅仅几年就被军方推翻，但二月党依然在巴拉圭存在很深的影响力，他们计划在巴拉圭发起第二次革命，如果成功，他们将会是二战结束后第一个建立左翼政权的拉美国家。"

 HOL_1947_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b第二次世界大战将荷兰变成一片废墟，当威廉明娜女王和她的临时政府回到故国时，发现荷兰的经济已濒临崩溃。而在遥远的东方，荷兰掌握的东印度群岛殖民地虽然脱离日本控制，但当地人民已经品尝到了独立的滋味，已经不想再重归荷兰统治。荷兰决定采取武力，在二战硝烟还未熄灭时，又派出刚刚重建的军队前往东印度群岛镇压独立暴动，因为对荷兰来说，东印度群岛是他们重建国家的血包。荷兰人与印尼临时政府在1946年初进行了短暂的停火，印尼部分地区建立了一个遥尊荷兰女王的自治领，但显然无论是荷兰人，还是印尼民族主义者都不接受这个结果，流血冲突的再一次爆发只是时间问题。"

 TIB_1947_DESC:0 "尽管国际法上，西藏归属于中华民国，但实际上从1912年西藏当局将中国政府的官员驱逐开始，西藏事实上建立了一个独立的政府。十四世达赖喇嘛尚未成年，热振活佛进行摄政。随着国民党政府在中国内战中逐渐转向劣势，西藏内部对未来产生了激烈的内部争执，有人仍然忠于国民党政府，有人主张追随英国和印度建立独立国家，另有一些接受了西方教育的知识分子希望推翻达赖喇嘛政权，因此与中国共产党建立了关系。"

 INS_1947_DESC:0 "日本人宣称他们的入侵是为了帮助东南亚脱离欧洲殖民统治，也许印度尼西亚人会认同这一点。日本确实摧毁了荷兰对东印度群岛的统治，并以自己的统治代替，而当日本撤离东南亚后，苏加诺领导下的印尼民族主义者决定建立自己的国家。荷兰人不会放弃这个自己统治了将近三百年的地区，因此派出军队进行血腥的镇压。荷兰人与印尼临时政府在1946年初进行了短暂的停火，印尼部分地区建立了一个遥尊荷兰女王的自治领，但显然无论是荷兰人，还是印尼民族主义者都不接受这个结果，流血冲突的再一次爆发只是时间问题。"

 OTHER_1947_DESC:0 "世界各国，无论大小，都不满足于静静地等待下一场全球冲突的爆发。从处于战争边缘的大国，到在世界大战中形成或改组的许多国家，都要做出艰难的选择，他们的理想会向现实妥协，这将对世界的未来产生轻微的影响。"



 1950_NAME:0 "兄弟阋墙 1950"

 1950_DESC:0 "§G该剧本内容已基本创作完成\n\n\n§W如果说欧洲是冷战的目标，那么亚洲就是战场。经过35年的日本殖民统治，朝鲜人民渴望看到一个新国家的建立。他们看到了，但是有两个新的国家——李承晚的大韩民国和金日成的朝鲜民主主义人民共和国。在华盛顿和莫斯科的支持下，占据38阵线南北部分的两国政府互相指责对方非法，并寻求统一整个半岛。他们手持棍棒，警惕地看着自己的同胞。。。"

 SOV_1950_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b斯大林过了一个不愉快的生日。他希望中国新领导人毛泽东允许苏联海军驻扎旅顺，但遭到毛泽东拒绝，同志加兄弟的关系出现裂痕。莫斯科在解放军准备解放台湾时支持了东北邻国的战争。在在欧洲西部，美国建立了一个称为北约的国家组织，以反对苏联的渗透。而在莫斯科，斯大林的健康状态不断恶化，这引起了党内其他野心家们的警惕。贝利亚、马林科夫、赫鲁晓夫和布尔加宁都在计划着自己的政治目的。西欧国家团结起来了，社会主义国家呢？"

 FRA_1950_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b法兰西陷入困境，从越南到阿尔及利亚，游击队正在进攻殖民地的驻军，非洲要求实现独立。在巴黎，第四共和国的总统没有任何权力指挥政府，政府首脑，总理，已经被替换了10多个。一些人民要求一部新宪法或一位新的强有力的领袖，也许上一次世界大战法国的英雄能做到。"

 ENG_1950_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b加入北大西洋公约的决定引起了英国舆论的激烈讨论。有人认为，与美国的同盟是抵抗共产主义威胁，保护大英帝国利益的保障，也有人认为，英国会为此失去独立性，沦为曾经自己殖民地的殖民地，尤其是失去独立核武器。而接下来在朝鲜和塞浦路斯爆发的战事将进一步考验英国政府如何回答这一问题。"

 USA_1950_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b国民党政府在中国大陆的失败令美国大失所望。现在他们期望台湾、日本和韩国承担起亚洲反共基地的责任。但当中国内战的余波还未平静，日本国内政局依然混乱时，三八战线传来了爆发战争的消息。杜鲁门如何保护美国在亚洲的势力范围？"

 EGY_1950_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b入侵以色列战争的惨败，让本就不受欢迎的法鲁克国王更加威严扫地，实际上，也许法鲁克国王根本不在乎自己统治的这个国家。既然如此，那想要接管这个国家的团体可就大有人在了。由亲西方知识分子组成的华夫脱党希望建立君主立宪制，保守的穆斯林希望建立一个伊斯兰国家，而激进的年轻军人和共产党则希望发起一场彻底的革命。"

 PRK_1950_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b出生在朝鲜农村的抗日游击队领导人金日成在苏联的支持下在平壤建立了自己的政权。他本来准备与另一位受人尊敬的韩国领导人金九组成联合政府，但金九遇刺后，他把南李承晚政权视为美国的傀儡，试图用武力解放整个国家。朝鲜军队由参加抗日战争的游击老兵组成，在苏联的协助下，他们准备横扫韩国，统一半岛。。。"

 PRC_1950_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b随着中华人民共和国的成立，中国内战以中国共产党的胜利而告终。然而，在南方少数国民党军队还在挣扎的时候，毛泽东面前又出现了新的问题——中国被内战所摧残，工业遭到破坏，物价飞涨，社会秩序混乱；西藏贵族拒绝加入新中国，与印度、英国勾结；残存的国民党部队撤到云南和缅甸，伺机反扑。东北邻国朝鲜，内战爆发，中国唯一的工业基地受到威胁。。。"

 KOR_1950_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b大韩民国的成立本应是朝鲜人民欢迎自由的日子。但不得人心的独裁者李承晚秘密谋杀了总统候选人金九，在美国的支持下进行独裁统治，李承晚对一切反对势力进行强硬地镇压，同时与北方同胞金日成的关系急剧恶化。。。"

 JAP_1950_DESC:0 "二战后，日本需要建立新的政治经济体制。日本第一次大选即将到来，共产党、社会党、保守派甚至帝国前官员都做好了准备。然而，朝鲜半岛爆发的战争使得美军撤离，日本防守薄弱，左派分子蠢蠢欲动。谁将在这次危机中胜出？"

 EGY_1950_DESC:0 "1948年以色列战争的失败使埃及人民，特别是军队和军官感到愤怒。自由军官运动是埃及军队中的一个民族主义组织，它正在为革命做准备，推翻法鲁克国王，建立共和国。同时，自由主义和共产主义也准备发动革命。谁能成为新埃及的主人？"

 PER_1950_DESC:0 "英俄的侵略占领，唤醒了伊朗的民族主义。巴列维国王仍然受到西方世界的牵制，他们的油田仍然由英国控制，伊朗的民族主义政治家正在计划收回石油开采权，其中有人甚至要推翻伊朗沙阿，华盛顿不会让它发生，中情局准备好第一场演出了。"

 IND_1950_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b印度独立了，但并不完美。克什米尔的分裂使印度与巴基斯坦永远成为速递，而在国内，新生的国家还需要政治和经济建设。国际上，亚洲的去殖民化和共产主义中国的建立为印度共和国带来机遇与挑战。现在尼赫鲁将怎样做出抉择？"

 VIN_1950_DESC:0 "自1946年法国入侵越南以来，以胡志明为首的越南民族主义同盟在越南北部的丛林中有游击队几年之后中华人民共和国成立后，越南从北京和莫斯科获得了许多武器。现在，越南人决定反击法国人，把他们从印度支那赶出去！"

 YUG_1950_DESC:0 "希腊内战的失败和共产党与工人情报局问题上的分歧，使得苏联与南斯拉夫的矛盾激化。现在铁托决定以自己的力量收回的里雅斯特，并谋求与保加利亚统一，建立大南斯拉夫联邦。斯大林不会允许有人挑战自己社会主义老大哥的地位，尤其是西方国家试图向铁托投去橄榄枝。"

 TUR_1950_DESC:0 "1950年的大选，终结了凯末尔留下的共和人民党对土耳其30年的统治，阿德南·曼德列斯领导民主党登上总理之位。民主党废除了土耳其自二战以来的中立政策，积极向英美靠拢以对抗苏联的威胁。为了向北约纳投名状，阿德南决定派遣土耳其部队参与地球另一端的冲突。"

 INS_1950_DESC:0 "经过数年的战斗，印度尼西亚人民将荷兰人赶出了东印度群岛，但代价是巨大的。新成立的印度尼西亚是一个松散的邦联，南马鲁古、亚齐和西巴布亚拒绝加入，谋求独立。印尼共产党与穆斯林民族主义者互相敌视，而他们在印尼政界仍存在巨大影响力。总统苏加诺应如何在各个势力之间寻找平衡？"

 SVN_1950_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b在法国人安排下，保大皇帝从香港回到西贡，再次充当法国人傀儡政权的头目。这一次，保大的国家元首身份被架空，天主教徒民族主义者吴廷琰担任总理，此外还存在平川派等帮派组织。他们准备一旦法国人离开越南，就夺取西贡政权。"

 TIB_1950_DESC:0 "随着国民党政府不断溃败，西藏贵族认为脱离中国统治的时刻到来。亲国民党的热振摄政被推翻杀害，取而代之的达扎摄政积极与印度进行外交，寻求承认。中国共产党取代国民党后，不承认达扎政府的一切行为，并给出两个选择：和平解放，或武力统一。"

 1956_NAME:0 "革命 1956"
 1956_DESC:0 "§G该剧本内容已基本创作完成\n\n\n§W赫鲁晓夫上台后，美苏对峙白热化。北约和华约相继成立，面临着未知的威胁。中华人民共和国已开始一项新的建设计划。独立的印度、印度尼西亚和埃及寻求建立一个独立于美国和苏联的第三世界阵营。在匈牙利和中东，战争和革命的导火索正在点燃。"

 USA_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b1954年，席卷全美的麦卡锡主义风潮结束了，战功赫赫的二次大战老将德怀特·艾森豪威尔取代了杜鲁门，成为美国总统。面对同样刚刚接过政权的赫鲁晓夫，艾森豪威尔决定与苏联实现缓和，但这并不意味着他将放弃冷战。随着越南战争的结束和中东政局的变化，艾森豪政府决定将影响力延伸到这些地区，以避免多米诺骨牌的倒下。"

 KOR_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b以无数的生命和满目疮痍为代价，南韩最终击溃了北朝鲜的进攻，总统李承晚成功守住了自己的权力宝座。然而，战争结束后，他并未顺应民众对和平与重建的渴望，反而利用战时体制的惯性，进一步强化其个人独裁统治。他以“反共”和“国家安全”为最高名义，通过修改宪法、操纵选举、动用军警和特务机关，持续强硬地镇压一切政治反对派与民主呼声。\n这场战争给南韩经济社会带来了近乎毁灭性的破坏。城市化为废墟，大量基础设施被摧毁，全国超过60%的民众陷入赤贫。尽管美国政府提供了巨额经济援助以支持重建和遏制共产主义，但这些资金和物资中的很大一部分，并未能惠及普通民众，而是流入了与李承晚政权关系密切的腐败官僚和商人的口袋。民生凋敝与权贵贪腐形成刺眼对比，战争胜利为李承晚带来的短暂威望正在民怨中迅速流失。\n尽管如此，韩国的民主力量并未屈服。在严酷的镇压下，以韩国民主党、进步党等为代表的反对势力持续进行着艰难抵抗。他们将即将到来的1960年大选视为终结独裁、实现政权更迭的关键一战。全国上下弥漫着变革的期望与紧张的气氛，大韩民国的“第一共和国”已然站在了历史的转折点上，其未来走向将取决于民主诉求与专制维稳之间的最终较量。"

 ENG_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b工党大败而归，领导英国赢得二战的温斯顿·丘吉尔率领保守党以压倒性优势重返唐宁街10号。然而这位曾经誓言"不放弃一寸帝国领土"的铁血首相，面对战后风起云涌的民族独立运动，却出人意料地展现出政治弹性。\n在黄金海岸（今加纳），殖民大臣利特尔顿与恩克鲁玛展开秘密会谈。其继任者安东尼·艾登提出"新殖民主义"理论——通过英联邦框架保持影响力，用经济纽带替代政治控制。\n但1956年的苏伊士运河危机彻底暴露了这个体系的脆弱性。当纳赛尔将运河国有化时，这个所谓的英联邦框架将显露出其骗局真面目。"

 INS_1956_DESC:0 "万隆会议的胜利召开，不仅是一次国际外交的成功，更为印度尼西亚总统苏加诺积累了巨大的政治资本与国际声望。借助这场标志着亚非国家团结崛起的历史性盛会所获得的国际支持，苏加诺得以更有力地应对国内外的复杂挑战。\n作为新兴第三世界国家的领袖，苏加诺的外交政策开始出现显著转向。他迅速向苏联和中国靠拢，积极寻求社会主义阵营在领土争端上的政治与实质性支持。同时，在国内层面，他尝试与影响力日益增长的印尼共产党改善关系，意图构建更广泛的民族统一战线。\n这一系列“向左转”的举措，自然激化了原有的国内矛盾。支持保守伊斯兰主义的马斯友美党、警惕共产主义影响的右翼军方将领，以及仍然控制着西巴布亚地区的荷兰殖民当局，都与苏加诺的新政线产生了直接或间接的冲突。然而，与以往不同的是，万隆会议带来的光环和在国际不结盟运动中的领袖地位，为苏加诺提供了前所未有的底气与合法性。他决心利用这一强化了的政治地位，采取比以往更为强硬的手段，来推进他的国内外议程，着手解决困扰印尼多年的统一与发展难题。"

 EGY_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b开罗街头坦克的履带声惊醒了沉睡的法鲁克王朝。以贾马尔·阿卜杜·纳赛尔为首的自由军官组织发动不流血政变，推翻了腐败的君主制，在这片拥有五千年文明的古老土地上首次建立起共和国。这场被称为"七月革命"的政变，不仅改变了埃及的命运，更震撼了整个阿拉伯世界。\n年仅34岁的纳赛尔面对百废待兴的国家，他同时向美苏两个超级大国伸出橄榄枝：他迅速向苏联靠近，同时也保持和美国的关系，并希望借助超级大国的力量发展自己。这种"积极中立"政策，使埃及在冷战中获得了难得的战略空间。但这位民族主义者的终极目标从未改变——终结英国对苏伊士运河的控制，这条自1869年通航以来就被外国资本掌控的"东方大门"，是埃及人心头最深的耻辱。\n英国人当然不会将自己最重要的资产拱手让出，伦敦的传媒大骂纳赛尔是新的墨索里尼，一场冲突在所难免……"

 IND_1956_DESC:0 "作为曾经的大英帝国的明珠，独立后的印度在贾瓦哈拉尔·尼赫鲁领导下取得了许多成绩，不仅在新兴第三世界国家中建立了威望，与美国、苏联和中共建立了友谊，且成功完成了一系列的改革和经济发展规划。\n尼赫鲁踌躇满志，希望完成印度的下一个重要任务：收回领土。克什米尔被一分为二，印度与巴基斯坦仍然在边境上小有摩擦，但在巴基斯坦已经得到美国支持的情况下，武力对抗巴基斯坦似乎并不现实，因此，尼赫鲁将焦点置于那些小型争议地区，包括被葡萄牙占领的果阿，与法国争议的本地治理、与中国争议的阿鲁纳恰尔等，而是武力收复还是和平谈判，是尼赫鲁需要慎重考虑的。"

 SOV_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b经历了血雨腥风的政治斗争后，曾经的乌克兰粗鲁农民尼基塔·赫鲁晓夫成为了苏联的最高统治者，在巩固权力后，赫鲁晓夫开始了他的改革：他废除了苏联时代强硬的镇压政策，撤销古拉格，释放政治犯，为斯大林时期的反对者平反，并尝试改善与西方的关系。此外他还希望让更多的苏联人进入更好的住宅，拥有更好的教育和食物……赫鲁晓夫的改革如此激进，引起了支持斯大林模式的保守派不满，因此他决定执行一项更具破坏性的命令——将斯大林的遗产彻底打倒！"

 PRC_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b中华人民共和国在最初十年取得的成就是惊人的，朝鲜战争赢得战略胜利，经济建设快速发展，民主改革也进展顺利，中共进入了黄金时期。但是以现在的国力，要对抗英美帝国主义远远不够，毛泽东期望中国的国力能够快发展，尤其是钢铁产量和重工业。为了达到这一目的，他需要进一步巩固党的路线……"

 ROM_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b在二战后的东欧格局中，罗马尼亚常被视为苏联控制下境遇最为严苛的国家之一。它不仅被迫割让了比萨拉比亚等领土，还通过所谓的“苏罗合资公司”体系，使其关键的石油和铀矿资源以极低成本向苏联进贡，同时国土上长期驻扎着大量苏联军队，国家主权受到严重侵蚀。\n然而，1953年斯大林去世后，莫斯科的松动为罗马尼亚提供了调整空间的缝隙。其领导人乔治乌-德治，这位一度被视为斯大林忠实执行者的政治人物，展现了意外的政治手腕。他迅速与新上台的苏联领导层进行交涉，并成功说服对方修订了部分最为苛刻的经济条款，初步减轻了掠夺性“合资”的负担。\n当1956年的“秘密报告”引发东欧去斯大林化浪潮时，乔治乌-德治敏锐地将其转化为一场追求国家自主的战略机遇。他意识到，这股批判旧模式的风潮，正是罗马尼亚争取更大独立性、系统性废除那些象征从属地位的不平等条约、并最终要求苏联撤军的绝佳历史时机。"

 HUN_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b在苏联的操纵下，匈牙利共产党及其领导人拉科西·马加什成为了匈牙利的统治者。作为斯大林主义的忠实拥趸，拉科西在匈牙利模仿照搬苏联的一切体制，包括计划经济、一党专制、个人崇拜和秘密警察……现在，斯大林模式在苏联被推翻了，改革之风即将吹到布达佩斯，人民群众对拉科西的不满，将成为一条导火索……"

 PER_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b德黑兰街头坦克的轰鸣声宣告了一场改变中东格局的政变。在美国中情局和英国军情六处的精心策划下，首相穆罕默德·摩萨台被推翻，流亡的穆罕默德·礼萨·巴列维沙阿在美军护送下重返王宫。这场政变永远改写了伊朗的现代史。\n随着摩萨台支持者被大规模逮捕，亲西方的扎赫迪将军组阁，美英石油公司重新掌控了伊朗石油资源，美国军事顾问团迅速进驻。\n年轻的巴列维沙阿坐在孔雀宝座上，面对的却是一个正在撕裂的国家。宗教势力视他为西方傀儡，知识分子怀念摩萨台的改革，而民众则因生活水平下降怨声载道。为巩固权力，沙阿启动了名为"白色革命"的改革计划，试图通过土地改革、妇女解放等现代化措施赢得民心……"

 ISR_1956_DESC:0 "经过将近两千年的流浪和苦难，犹太人在1948年，在巴勒斯坦重建以色列国，但是这片土地在犹太人离开的这段时间，已经有了新主人——埃及、叙利亚、伊拉约旦和沙特阿拉伯都不会愿意将耶路撒冷交给犹太人。以色列如果想要立国，就必须以攻为守，主动出击……"

 FRA_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b奥雷斯山区的枪声划破了北非的夜空，阿尔及利亚民族解放阵线（FLN）发动了震惊世界的武装起义。这记来自撒哈拉门户的枪响，成为继奠边府惨败后对法兰西殖民体系的又一记重击。对巴黎而言，阿尔及利亚不仅是"法兰西海外省"，更是其维持大国地位的战略支点——撒哈拉沙漠中的雷冈试验场，正秘密进行着法国核武器研发计划。\n风雨飘摇的第四共和国政府陷入了两难困境：强硬派将领誓言"阿尔及利亚永远属于法国"，而左翼政党则开始质疑殖民战争的道德与财政代价。一些北非殖民军官密谋，如果第四共和国政府不能守住法国殖民地，就把他终结……\n是时候致信隐居戴高乐将军了……"

 POL_1956_DESC:0 "波兰在二战后纳入苏联卫星国体系之下，波兰统一工人党统治下的波兰实行社会主义改革。然而，作为一个具有悠久民族主义和天主教传统的国家，波兰的反共反苏情绪，从来没有被成功抹杀过。现在，去斯大林化风波横扫东欧，波共领导人波莱斯瓦夫·贝鲁特突然病逝，将会给波兰带来怎样的影响呢？"

 BUR_1956_DESC:0 "昂山将军遇刺后，吴努接替成为缅甸联邦共和国的第一任领导人，但他要面对的问题太多了——北方的少数民族分离主义和国民党残军威胁，内部则出现经济低迷和政治动荡。面对这一切，军队将领奈温提议，由他来接替政权进行军事统治。这将会是一个永远改变缅甸的决定……"

 CUB_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b在美国黑手党的大笔赞助下，富尔亨西奥·巴蒂斯塔总统从曾经的改革先锋彻底堕落为腐败、无能、贪婪的独裁者，古巴在巴蒂斯塔政权的贪官污吏和纸醉金迷的赌场中沦为一个光鲜亮丽的贫民窟，哈瓦那大酒店的霓虹灯下，倒映着污浊不堪的街道和营养不良的儿童。\n然而，当人民对独裁统治的愤怒达到临界点时，革命就会来临。对巴蒂斯塔政权彻底失望的年轻律师菲德尔·卡斯特罗在蒙卡达兵营打响了革命的第一枪，被俘后成功逃离古巴前往墨西哥，并在这里遇到了年轻的阿根廷旅行者，埃内斯托·切格瓦拉，二人已在墨西哥招兵买马，摩拳擦掌，准备打回古巴去。而在古巴本土，由自由派学生组成的三·一三革命委员会发起了大胆的行动，一次袭击险些将独裁者连同总统府炸上天。\n古巴的历史转折点已经来临，而这场结果也将决定未来整个拉丁美洲，甚至世界的历史。"

 VIN_1956_DESC:0 "在奠边府惨败之后，法国人灰溜溜地滚出了越南，越南人民抗法战争结束了，但新的苦难刚刚开始。以北纬17°为界，越南像朝鲜一样南北分裂，北方由胡志明领导的越南劳动党所控制，南方则被天主教反共主义者吴廷琰所统治。在美国人支持下，吴廷琰通过没有任何真实性可言的公投推翻了保大，驱逐法国残余势力，建立起独裁统治，并积极寻求美国支持。一场新的战争已经在酝酿。"

 JAP_1956_DESC:0 "1955年，日本右翼保守势力统一，自由民主党成立，并主宰了日本政坛。自民党组阁后，亲近美国，反对左派，并积极促成日本自卫队的成立。这引起了日本民众的不满，新一代的日本人不愿意再看到日本卷入世界大战的战火，尤其是岸信介的上台。他于二战期间在满洲国担任重要职务，现在又准备参选首相，实现日本的军事正常化和《日美安保条约》签订。日本民众决定以示威游行的方式决定日本的未来。"

 CHI_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b中国国民党在第二次内战中输的一塌糊涂，蒋介石与夫人携数万军队撤往台湾，但台湾群众并不欢迎国民党军的到来，腐败的国民党官僚和野蛮的国军兵痞激起了民众暴动。在暴动被血腥镇压后，蒋介石宣布台湾戒严，逮捕和杀害任何可能是共产党或台湾独立主义者的人。\n 而在海峡另一边，国民党军丢掉了从广东到云南到新疆的所有土地，只剩下了浙江和福建沿海的岛屿。为了给未来反攻大陆做准备，国军决定死守这些岛屿。"

 LAO_1956_DESC:0 "作为法国印度支那联邦的一部分，老挝在1954年日内瓦会议后获得独立，却随即陷入越南战争的漩涡之中。\n老挝不可避免地受到了越南战争的深入影响。越共支持下的老挝共产党-巴特寮爱国阵线拒绝支持老挝王国政府，而老挝王国的右翼军人亦迅速倒向美国，反对政府与老共和谈。\n夹在二者之间的首相梭发那·富马亲王左右为难，他只能尽量地尝试在左右翼之间进行对话，争取建立联合政府，避免老挝遭到意识形态无情地撕裂。"

 MOR_1956_DESC:0 "与阿尔及利亚及西非不同，摩洛哥法律上是法国的保护国，自二战以来，摩洛哥苏丹、先知穆罕默德的后裔穆罕默德五世便利用自己的影响力领导独立运动，而当法军在奠边府惨败后，摩洛哥成为了首个有机会脱离法国实现独立的非洲保护国。然而，法国与摩洛哥当局之间的谈判并不顺利，法国依然狮子大开口地要求在独立后的摩洛哥索要大量特权，此外，占据摩洛哥北部和伊夫尼地区的西班牙对归还领土没有兴趣，最重要的是，由知识分子组成的摩洛哥独立党，以及里夫山区的部族，只是为了独立而跟穆罕默德五世临时结盟。当国家真正实现独立后，追求君主制的苏丹，与接受西方教育的政治家之间的冲突就会立刻爆发。"

 PRK_1956_DESC:0 "北朝鲜付出无数条生命所进行的战争，以朝鲜半岛维持现状告终，但对金日成来说，朝鲜战争至少让他有机会铲除掉朴宪永这些反对派。既然半岛统一无法实现，金日成就将重心放在国内。在苏联资助下，北朝鲜的战后重建很快取得成果，金日成在经济恢复后，再提出先军政策，以发展一个强大的军队。然而，北朝鲜内部依然存在金日成的反对者，来自苏联的政治风波，将给予他们一个挑战金日成的机会。"

 ALG_1956_DESC:0 "作为法国在非洲最早建立的殖民地，阿尔及利亚经历了长达百余年的殖民统治。二战期间，超过30万阿尔及利亚人加入自由法国军队，为解放欧洲浴血奋战。然而欧洲胜利日当天，法国殖民当局却在塞提夫向庆祝反法西斯胜利的游行队伍开枪。\n战后，法国非但没有给予阿尔及利亚独立地位，反而在1947年通过《阿尔及利亚法规》，将其划为"法国海外省"。大量欧洲移民（"黑脚"）涌入，占据最肥沃的土地；石油、天然气等资源被源源不断输往法国本土、填充移民、镇压游行、屠杀儿童……任何独立诉求都遭到血腥镇压。阿尔及利亚人的怒火也被点燃。阿尔及利亚民族解放阵线打响了非洲武装反对法国统治的第一枪，这将是一场持久而血腥的战争。"

 WDR_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b联邦德国在50年代初期取得了令人惊叹的经济复苏奇迹，二战带来的毁灭性破坏宣告结束，废墟上重建起包豪斯和柯布西耶式的现代建筑，大众甲壳虫作为德国的象征远销世界各地。\n尽管有来自法国、苏联、东欧国家和左翼党派的强烈反对，西德再武装化和加入北约还是成为了事实。新的德国国防军重建，而在阿登纳总理支持下，一些纳粹军人穿上军装，堂而皇之地再次成为德国国防军的高级将领。毫无疑问，西德军队的重建将迎来各方政治势力的质疑和挑战，除非苏联人能给一个机会，让国防军证明自己确实有存在的必要。"

 YUG_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b苏南决裂后，南斯拉夫与苏联的关系跌至冰点。斯大林将铁托视为"叛徒"，将南斯拉夫共产党开除出共产党情报局，并在东欧发起大规模反铁托运动。面对苏联强大的军事压力和外交孤立，铁托不得不寻求与西方国家的合作以维护国家独立。\n南斯拉夫与北约成员国希腊、土耳其签订《巴尔干条约》，形成三方军事互助同盟。一个共产主义国家与北约成员国结盟，南斯拉夫军队开始接受美式装备，其边防部署明显针对华约而非北约。\n斯大林去世后，赫鲁晓夫向贝尔格莱德，为当年的"错误"道歉，并承诺尊重南斯拉夫的独立道路。莫斯科开出了经济援助和军事合作的优厚条件。此刻铁托面临艰难抉择：是重返社会主义阵营，还是继续走不结盟道路？这一平衡战略将决定南斯拉夫在冷战格局中的生存空间。"

 ETH_1956_DESC:0 "作为第一个遭受法西斯入侵的主权国家，埃塞俄比亚在海尔·塞拉西皇帝领导下，发起了抗争。而战争结束后，塞拉西建立了无比的威望，被视为国家的救世主。然而，这种威望是有时间限制的，二战结束十年后，救世主的光芒逐渐退散，人们看到的是一个专制的而腐朽皇帝，过着奢侈的生活，不愿意接受任何改革，也不愿意改善人民的生活。而在纳赛尔推翻埃及苏丹后，埃塞俄比亚的一些军人也开始蠢蠢欲动，希望推翻皇帝并建立一个更开明的埃塞俄比亚。"

 DDR_1956_DESC:0 "§G我们推荐您游玩这个内容较完整的国家！\n\n\n§b枪炮声响彻东柏林，席卷民主德国的大规模工人运动被血腥镇压。六一七事件改变了民主德国乃至整个东欧，他充分说明了苏联占领军会毫不留情地摧毁一切威胁他们所支持的共产党政府的敌对势力。对于民主德国统一社会党来说，六一七镇压带来的危害是大于利益的，大量的东德民众彻底对共产党失去信心，向西逃亡的民众大大增加，乌布利希同志为此焦头烂额。"
 
 POL_1956_DESC:0 "枪炮声响彻东柏林，席卷民主德国的大规模工人运动被血腥镇压。六一七事件改变了民主德国乃至整个东欧，他充分说明了苏联占领军会毫不留情地摧毁一切威胁他们所支持的共产党政府的敌对势力。对于民主德国统一社会党来说，六一七镇压带来的危害是大于利益的，大量的东德民众彻底对共产党失去信心，向西逃亡的民众大大增加，乌布利希同志为此焦头烂额。"

 OTHER_DESC:0 "世界各国，无论大小，都不满足于静静地等待下一场全球冲突的爆发。从处于内战边缘的大国，到在世界大战中形成或改组的许多国家，都要做出艰难的选择，他们的理想会向现实妥协，这将对世界的未来产生轻微的影响。"
 
 

 1961_NAME:0 "红色警戒 1961"
 1961_DESC:0 "§Y该剧本内容正在制作\n\n\n§W卡斯特罗的革命推翻了美国傀儡政权，艾森豪威尔和肯尼迪视其为头号威胁，并希望尽快将其消灭。入侵猪湾失败后，卡斯特罗向莫斯科寻求帮助。赫鲁晓夫寻求在西半球建立据点，他欣然接受了向加勒比海运送导弹的请求，以保护古巴新政权，对抗部署在土耳其的北约导弹。当U2发现苏联在古巴建立导弹基地时，白宫和克里姆林宫会有什么反应？"

 CUB_1961_DESC:0 "独裁者完蛋了！菲德尔·卡斯特罗和切·格瓦拉率领游击队进入了哈瓦那，美国的傀儡暴君巴蒂斯塔仓皇逃窜。卡斯特罗政权遭到艾森豪威尔和刚刚建立的肯尼迪政府的敌视，为了寻求苏联帮助，卡斯特罗宣布加入共产党，成为苏联盟友。\n 猪湾入侵失败后，赫鲁晓夫决定给予卡斯特罗援助，数枚中远程弹道导弹被秘密运往古巴，成为卡斯特罗威胁肯尼迪的资本。"

 SOV_1961_DESC:0 "尽管去斯大林化风波给赫鲁晓夫带来了不小的挫折，但改革仍然取得了进展。苏联的经济状况得到改善，集体农场工人离开农村前往城市推进了城市化，处女地运动和玉米运动正在推行，最重要的是——尤里·加加林乘坐运载火箭进入太空，实现了人类最伟大的理想，也大大提高了苏联的国际地位。然而，作为冷战的一级，苏联的目的仍然是与美国的争霸。一直以来莫斯科都希望在西半球建立影响，现在，卡斯特罗的古巴革命政权送来了机会。"

 USA_1961_DESC:0 "不要问你的国家能为你做什么，而要问你能为你的国家做什么。——约翰·菲茨杰拉德·肯尼迪 \n 42岁的肯尼迪成为美国历史上最年轻的总统，他踌躇满志，准备改变这个国家，使自由得到巩固。然而他的第一个政策就栽了跟头——派遣雇佣军登陆猪湾推翻卡斯特罗的计划以失败告终，导致古巴彻底投向苏联怀抱。在亚洲，肯尼迪继承艾森豪威尔的政策支持吴廷琰政权，开向越南派遣陆地部队之先河。但特种战争的实行并没有改变南越军队四处挨打的局面，现在苏联成功发射载人航天飞船，在太空竞赛中领先一步，又向古巴输送导弹，肯尼迪该如何进行抉择？"

 VIN_1961_DESC:0 "吴廷琰在越南南方建立通知后，对共产党和佛教徒进行残酷镇压。在北越的支持下，越南南方民族解放阵线成立，打击吴廷琰政权。为了保护吴廷琰，艾森豪威尔和肯尼迪政府，从出钱出枪出装备，再到直接派遣陆地部队参战，都未能镇压越共。随着西贡政权日益动荡不安，麦克纳马拉认为西贡需要一个稳定的政权，而要一个稳定的政权，就不能有一个不稳定的总统……"

 PRC_1961_DESC:0 "毛泽东的大跃进和大炼钢铁以失败告终，中华人民共和国的黄金时期随着大饥荒的爆发结束。毛将国家元首的职位让给了刘少奇，但其本人仍是中国共产党主席。党内就毛泽东的路线问题出现了分歧，为更大的政治纷争埋下伏笔。尽管如此，但新中国的国防建设仍需要进行，原子弹和导弹的开发研究仍在继续。"

 IND_1961_DESC:0 "通过主导亚非国家会议、不结盟运动和与苏联、中国的外交关系，尼赫鲁使印度在国际舞台上大展身手，赢得了第三世界领袖的地位。然而，尼赫鲁的失败也同样是在外交上。中华人民共和国承认缅甸拥有江心坡的主权后，印度也希望中国能够承认麦克马洪线，但遭到了拒绝。在多次谈判不成功后，尼赫鲁决定使用武力实际占领。他相信中国不会为了阿鲁纳恰尔地区与印度交战，但他的判断可能大错特错……"

 CAM_1961_DESC:0 "日内瓦条约签订后，越南、老挝和柬埔寨都获得独立。诺罗敦·西哈努克成为柬埔寨国王，并享有一定实权。西哈努克在内政上把柬埔寨建设成了东南亚较为富裕的国家，但是这个新生国家面临越南战火的威胁。越共的胡志明小道从柬埔寨西部横穿而过，南越和泰国时刻威胁着柬埔寨的边境安全，西哈努克必须在二者中做出选择。"

 BRA_1961_DESC:0 "民众主义考迪罗热图利奥·瓦加斯在政变中死亡，经过一段时间的动荡，社会民主党的儒塞里略·库比契克成为巴西总统。信奉发展主义的库比契克将他任贝洛奥里藏特市长时期的经验搬到全国，积极鼓励外资投资并发展巴西的钢铁、汽车制造业，同时定下了将首都迁至内陆的雄心。"

 KOR_1961_DESC:0 "独裁者李承晚最终在四·一九革命后逃亡夏威夷，尹潽善接任总统职位，但实权掌握在总理张勉手中。张勉领导的第二共和国以腐败无能著称，财阀和贪官污吏横行，人民担心这样的政府无法抵御北韩的进攻，继续做出改变，尤其是一群正在谋划进入首尔夺取政权的年轻军官……"

 COG_1961_DESC:0 "古巴导弹危机如此震惊世界，以至于令所有人忘了前一年还在联合国大会上引发争论的刚果危机。刚果总理卢蒙巴在政变中死亡，卡萨布武和蒙博托夺权。在刚果西南，开赛和加丹加分裂武装仍然存在，卢蒙巴的支持者预备在东北部进行反抗。"

 FRA_1961_DESC:0 "在阿尔及利亚政变部队支持下，夏尔·戴高乐黄袍加身，接任法国总统再次领导法国。戴高乐的首要问题是结束第四共和国动荡混乱的政治局势，其次是对愈远愈烈的非洲去殖民化运动，尤其是阿尔及利亚的独立战争做出决定。在欧洲事务上，戴高乐质疑北约及美国在西欧的扩张，法兰西不会允许英美插手欧洲大陆，戴高乐将建立独立的外交和军事力量，保证自己的地位。"
 
 IND_1961_DESC:0 "通过精明的外交手段，尼赫鲁在第三世界国家中获得了巨大的威望，现在，他要把外交成绩使用到国家利益上。印度的果阿地区依然被葡萄牙占据，与中国的领土谈判也以失败告终，尼赫鲁必须做出选择，如何处理领土争端。"

 1965_NAME:0 "战争泥潭 1965"

 1965_DESC:0 "§R该剧本内容尚未完成制作\n\n\n§W随着科学技术的发展，普通美国家庭也有了彩电，但他们透过镜头看到的却是地球另一边的战场，就像人间地狱。美国总统约翰逊大力提倡派遣美军参加越南战争，但遭到越共的顽强抵抗，毛泽东的大跃进没有让中国的工业产值赶上英国、美国，相反，几十万人死于饥荒。刘少奇建议毛泽东改善经济。毛泽东认为这是资产阶级复兴的行为。他准备发动文化大革命，消灭资本家。在东欧，匈牙利、波兰和捷克斯洛伐克的领导人希望通过有限的改革提高人民的生活水平，但以强硬著称的新苏联领导人勃列日涅夫不能容忍这种行为。。。"

 USA_1965_DESC:0 "约翰·肯尼迪的意外遇刺，使得林登·贝恩斯·约翰逊接替了总统职位。摆在约翰逊面前的棘手问题，除了不断扩大的越南战争外，还有恶化的美国民权运动。马丁·路德·金呼吁美国黑人行动起来，消灭种族隔离政策，庞大的反越战和反种族主义示威者占领了林肯纪念堂。约翰逊会如何做出回应？"

 VIN_1965_DESC:0 "吴廷琰和肯尼迪接连遇刺后，越南战争不但没有结束反而愈远愈烈。约翰逊接过白宫权力，决心以武力直接接入越南战争。西贡政权在经过数次政变后，迎来了总统阮文绍。越共得到了苏联和中国的国际援助，决心与美帝国主义斗争到底，人类历史上最血腥的流血冲突即将展开。"

 PRC_1965_DESC:0 "毛泽东对邓小平、刘少奇的谏言非常不满。根据过去人民战争的经验，发动人民大跃进和大炼钢铁是完全正确的，尽管人民为此付出了巨大的代价。毛泽东夫人江青和他的亲信兼国防部长林彪趁机给毛泽东出谋划策，指责刘邓是资产阶级反动派，发动无产阶级文化大革命，号召人民驱逐他们。毛泽东听了他们的建议，做出了一生中最错误的决定。"

 SOV_1965_DESC:0 "1964年10月，苏联爆发政变，结束了赫鲁晓夫长达11年的统治，勃列日涅夫成为新一届苏联最高领导人。这位强硬的将军致力于提高苏联的军事实力和势力范围，使苏联在与美国的对抗中占了上风。勃列日涅夫的政策是限制其他社会主义国家的自由，使之成为苏联的棋子。那么，当布拉格民主运动爆发，中苏边界冲突爆发时，有限主权理论是否会生效？"

 KOR_1965_DESC:0 "在军事政变之后，朴正熙和他们的士兵成为大韩民国的统治者。朴正熙政权的首要目的，是改变韩国的落后状态，对抗北方共产党的威胁。美军介入越战使汉城成为美军撤退的突袭地半岛公园选择经济作为第一目标，争取人民的支持，让韩国能够保卫自己的国家，他和他的政府能做到吗？"

 RHO_1965_DESC:0 "“变革之风”结束了非洲成为欧洲殖民地的历史，但激怒了南非和罗得西亚的白人统治者。罗得西亚总理伊恩·史密斯明确拒绝独立后的罗得西亚由黑人统治的决定，并不惜单方面脱离英国实行独立。国际社会立刻向罗得西亚进行制裁，黑人抵抗武装也开始崛起，史密斯的罗得西亚必须以一己之力守住这片土地。"

 SAF_1965_DESC:0 "“变革之风”结束了非洲成为欧洲殖民地的历史，但激怒了南非和罗得西亚的白人统治者。南非国民党为了维护种族隔离政策，不惜单方面脱离英国实行独立。国际社会立刻向南非进行制裁，非洲国大党、西南非洲解放阵线等抵抗力量也开始崛起。但南非矿产丰富，武备较为强悍，他们不仅有信心消灭黑人的抵抗，并且还有信心开发核武器，介入安哥拉战争，建立在非洲南部的霸权。"

 POR_1965_DESC:0 "尽管去殖民化在非洲如火如荼地进行，但安东尼奥·萨拉查统治下的葡萄牙仍拒绝随大流，坚持不放弃在非洲的任何殖民地。当共产主义游击队出现在安哥拉、莫桑比克和几内亚-比绍时，葡萄牙的选择是毫不留情的镇压。"

 IND_1965_DESC:0 "带着在中印战争中失败的遗憾，尼赫鲁去世了。作为国大党内部斗争妥协的结果，夏斯特里成为印度第二任总理。尼赫鲁死后，国大党的堕落和腐败不断加剧，新政府毫无作为使民众失望。这时，尼赫鲁的女儿英迪拉·甘地作为“老太婆内阁中唯一的男人”脱颖而出，人民期望她能够像父亲一样带领印度走向一个新的辉煌，前提是她能打败国大党元老德赛。"

 BRA_1965_DESC:0 "巴西军队出动坦克，杀进首都巴西利亚，左派总统若昂·古拉特被政变推翻，取而代之的使右翼军政府。"

 ISR_1965_DESC:0 "进入60年代，以色列与阿拉伯国家的对抗进入一个新的阶段。巴勒斯坦解放组织成立，在以色列境内进行武装抵抗运动，埃及与约旦封锁亚喀巴湾，断绝以色列海军前往红海的要道。约旦在约旦河上游大兴土木建造水坝，以色列人理想中的首都耶路撒冷仍在约旦控制之下。以内阁认为，如果和平解决不了这些问题，就准备动用武力。"

 HKN_1965_DESC:0 "中国共产党在国共内战的最后阶段，放弃了趁机收复香港的机会，在深圳河边停下了脚步。朝鲜战争爆发后，中国大陆海岸被封锁，香港成为竹幕一边的孤岛和远东的“西柏林”。特殊的地理位置使得香港成为走私的中转站和各方势力角逐的中心，港英政府和警察贪污腐败无能，亲中共和亲国民党势力渗透发展，犯罪和政治斗争在这颗东方之珠中蔓延。"

 SIA_1965_DESC:0 "泰国在二战后仅仅经历了简短的民主政治，就再次陷入到军事独裁当中。为了稳固自己的政权，军政府寻求美国的支持。泰国为美军提供在越南作战的基地，作为回报，美国援助大批大批送往曼谷，这些钱最后都进了军队和官僚的口袋，留给泰国人民的只有风俗服务。随着军政府对民主运动的镇压日益收紧，抵抗也在酝酿。"

 SIA_1965_DESC:0 "泰国在二战后仅仅经历了简短的民主政治，就再次陷入到军事独裁当中。为了稳固自己的政权，军政府寻求美国的支持。泰国为美军提供在越南作战的基地，作为回报，美国援助大批大批送往曼谷，这些钱最后都进了军队和官僚的口袋，留给泰国人民的只有风俗服务。随着军政府对民主运动的镇压日益收紧，抵抗也在酝酿。"

 INS_1965_DESC:0 "苏加诺在共产党和穆斯林民族主义者之间的横跳政策最终翻车，9·30政变结束了纳沙共政权，臭名昭著的暴君苏哈托上台，紧随其后的是对印尼共产党、民主人士和华人的大屠杀。"
 
 
 1972_NAME:0 "和平尝试 1972"
 1972_DESC:0 "§R该剧本内容尚未完成制作\n\n\n§W国际环境已经发生深刻变化,尤其是在面临苏联的扩张主义威胁条件下,中美两国逐渐摒弃前嫌,开始逐步改善双边关系以应对来自苏联的共同威胁。但是,在长达20年的对峙状态下,中美两国政府都互不承认对方的政治合法性,两国之间没有建立外交关系，但显然冷战已经迈入了另一阶段，十年动乱下百废待兴的中国会何去何从？方才摆脱越战经济泥潭的美国面对苏联威胁又会作何态度？在整个世界范围内已然升起两颗炙热的意识形态太阳，稍有不慎，战端将重燃世间，摧毁世人对和平繁荣的幻想。"
 USA_1972_DESC:0 "理查德·米尔豪斯·尼克松上台后面临着前任总统林登·约翰逊留下的大麻烦，深不见底的越南战争已经让美国投入了大量的人力物力，却看不见一丝胜利的希望。而在美国国内，反对越南战争的花朵力量运动已经席卷全美，伴随而来的嬉皮士运动也让美国政府头疼不已，也许尽早从越南抽身才是美国最好的选择。尼克松希望从内政和外交上寻找新的突破口，中华人民共和国与苏联的边境冲突使得两国彻底反目，基辛格认为，向北京伸出橄榄枝的时候到了。在智利、中东和安哥拉，美国还有更多任务要做……"
 VIN_1972_DESC:0 "伟大的领袖胡志明主席倒在了祖国解放的前夜，黎笋接替他成为了越南共产党领导人。西贡政府已经破败不堪，越南战争似乎已经要以越共的胜利告终。然而国际局势的变化可能会给越共变革带来新的挑战，北方的邻居已经厌倦了与苏联打交道，因而决定和美国建立关系，这似乎是越南共产党所无法接受的。"
 VIN_1972_DESC:0 "独裁者吴廷艳死后，越南共和国陷入了无尽的混乱中，一波又一波政变爆发、一茬又一茬军政府上台又下台，最终阮文绍总统和阮高祺总理勉强控制住了局面。混乱的政治局势使得越南共和国在越共面前不堪一击，阮总统寄希望于美国的军事支援和介入，但美国政府已经对这个烂摊子感到疲倦了，西贡政府想要拯救自己几乎是不可能的事情。"
 PRC_1972_DESC:0 "疯狂的无产阶级文化大革命已经在中华人民共和国的土地上肆虐了六年，整个国家几乎陷入了无政府状态。在中央，以毛泽东的妻子江青、年轻的工人运动领袖王洪文、国防部长林彪为首的中央文化革命小组实际上掌握着文化大革命的主导权，以毛主席的名义发号施令。周恩来总理试图与她们对抗，但困难重重。地方上，各大省份自从文革爆发后便进入了军事管制状态，各军区的首长们有着极高的地方权力，利用文化大革命巩固自己的权力。而在外交上，1969年爆发的中苏边境冲突标志着莫斯科与北京彻底决裂，中国急需新的外交突破口，而美国很愿意伸出这个橄榄枝。"
 
 POR_1972_DESC:0 "1970年，统治葡萄牙四十年的安东尼奥·萨拉查去世，葡萄牙帝国陷入崩溃的边缘。新总理卡丹奴继续对安哥拉和莫桑比克的镇压，尽管大家都很清楚葡萄牙的殖民地已经无法保存下去了。卡丹奴对国内的改革也十分不顺利，民众的不满正在增加，新国家体制已摇摇欲坠。"

 1978_NAME:0 "帝国坟场 1978"
 1978_DESC:0 "§R该剧本内容尚未完成制作\n\n\n§W勃列日涅夫的强硬策略很快把苏联变成了一个能够摧毁美国的超级大国。他用军事手段摧毁了东欧任何威胁苏联的民主改革势力，但这为东欧国家加强抵抗埋下了种子。现在，他把目光投向了动荡的南部邻国阿富汗。毛泽东的逝世使中国陷入了文化大革命的悲痛之中。他们必须决定是继续无产阶级革命，还是考虑其他路线。新总统吉米·卡特在1976年的选举中以微弱优势获胜。这位有声望的领导人将如何面对未来的挑战？"
 AFG_1978_DESC:0 "1974年，阿富汗发生军事政变推翻了巴拉宰克国王、达乌德汗夺权。苏联希望喀布尔仍是他们的势力范围之内，但达乌德试图与他们取得联系西莫斯科这是极限，如果达乌德不服从他们，他们就会再次将他推翻。但是问题是取代达乌德的阿富汗人民民主党，不强大，不团结，不为穆斯林所欢迎。"
 SOV_1978_DESC:0 "勃列日涅夫领导下的苏联进入了军事上的鼎盛时期，但政治却不断走向停滞、硬化的“老人政治”，原有的经济和政治改革也中止了。尽管如此，苏联仍希望借助美国全球收缩的这一时机，向全球出击，扩大影响力。"
 PRC_1978_DESC:0 "1976年，人民爱戴的毛泽东主席逝世，举国上下悲痛欲绝，江青和她的“四人帮”组织红卫兵夺取政权，成为中国的统治者。在党内元老的支持下，华国锋接掌政权，随后下令逮捕“四人帮”，结束了危害中国近十年的文化大革命。但对于毛泽东错误的经济和思想政策，华国锋选择了不变。当时，文革期间被软禁的邓小平复职。他质疑中国现有的政策，开始了自己的改革计划。"
 VIN_1978_DESC:0 "1965年，胡志明还没来得及看到祖国的解放，就因病去世。他的继任者黎笋计划在苏联的支持下，将越南的势力范围扩大到整个印度支那。中美关系恢复后，苏联政府承诺向越南提供更多援助，以诱使越南参与他们的反华计划。黎笋政府欣然接受，随后拘留亲华将领武元甲，驱逐华侨，撕毁中越边境协议，在中越边境部署重兵，准备入侵柬埔寨。"
 USA_1978_DESC:0 "1978年，詹姆斯·厄尔·卡特成为美国新总统，他面临的主要挑战是美国。输亚洲的战争，中东的经济危机和革命。"
 ENG_1978_DESC:0 "70年代末，石油危机、通货膨胀、工会罢工和北爱尔兰问题困扰着这个以及日落西山的日不落帝国，工党已经失势，保守党决定拿下1979年下议院改选。保守党领袖玛格丽特·撒切尔力排众议，宣布以国有化和高福利为标志的凯恩斯主义经济学在英国已经行不通了，新自由主义将成为改革的目标，但这一改革显然不能得到所有人的支持。"
 PER_1978_DESC:0 "白色革命以失败告终，群众游行此起彼伏，巴列维王朝摇摇欲坠，伊朗马上就要变天。在致力于推翻国王的同时，伊朗各个势力也在角逐新政府的统治权。最为强势的是伊朗的什叶派领袖，阿亚图拉霍梅尼，他从60年代就开始主导伊朗伊斯兰势力反对国王的运动，他在反对派中也最有影响力。此外，伊朗人民党、伊朗人民圣战组织也在积极参与到政治运动当中。"
 IRQ_1978_DESC:0 "经过多次政变，阿拉伯复兴社会党逐渐掌握了伊拉克的政权，萨达姆·侯赛因将在这一年从幕后走到台前，成为伊拉克的统治者。作为一个富有野心的独裁者，萨达姆时刻希望建立一个大伊拉克国，向西，他准备开发核武器，向以色列开战。向东，邻国伊朗动荡不安，这正是他开疆拓土的好机会。"
 CAM_1978_DESC:0 "杀戮、死亡、种族清洗……波尔布特统治下的柬埔寨建立了人类历史上最残暴、恐怖的政权之一。红色高棉在其统治的4年内杀死了四百万人，将柬埔寨变成了一个大型屠宰场。除了对内进行自我屠杀，红色高棉还不断在越柬边境上发起武装挑衅，这正好给了早就图谋将柬埔寨划入势力范围的越南一个机会。"
 POL_1978_DESC:0 "哥穆尔卡死后，爱德华·盖莱克接任波兰统一工人党总书记，并进行了经济改革。盖莱克的改革取得了一定成效，波兰的生产力和消费品得到了一定的提升，政治风气也有所放宽，但这是建立在政府的高税收、高开支基础上的。盖莱克的经济政策在70年代末出现危机，如果不能妥善解决，那么军队就会接管政权。"
 CHL_1978_DESC:0 "1973年9月，轰炸机在圣地亚哥上空呼啸而过，智利总统萨尔瓦多·阿连德在政变中死亡，终结了智利的社会主义政权，也终结了智利一百多年的民主政治。奥古斯托·皮诺切特接管政权，建立起残暴的军政府，无数左派和民主人士被直升机扔进海里。\n比军事镇压更为可怕的是，皮诺切特政府采用了芝加哥学派理论，对智利经济实行自由主义政策和休克疗法。新自由主义学者认为，这创造了智利的经济奇迹，但这个奇迹的真实性显然备受质疑。"
 ANG_1978_DESC:0 "1970年，萨拉查去世。1974年，康乃馨革命爆发，统治葡萄牙近五十年的新国家体制瓦解。新政府成立后，即退出殖民战争，安哥拉、莫桑比克、佛得角和几内亚比绍等殖民地全部独立。然而在安哥拉，战争并未结束。由于担心安哥拉的共产主义游击队进入西南非洲，南非军队仍在边境上不断发动攻势。在安哥拉国内，争取安哥拉全面独立联盟，和安哥拉民族解放阵线，得到美国、扎伊尔和南非支持，向亲苏联的安哥拉人民运动开战。安哥拉的内战还将持续数十年。"
 ETH_1978_DESC:0 "1974年，海尔·塞拉西皇帝被军队推翻，在皇宫中被枕头闷死，海尔·门格斯图将军夺取政权，建立披着社会主义伪装的军阀统治。门格斯图政权不得人心，埃塞俄比亚全国到处都是分离主义运动，而在国家的东面，穆罕默德·巴雷统治下的索马里正蠢蠢欲动，谋求收复欧加登地区。"
 SML_1978_DESC:0 "1969年，穆罕默德·巴雷夺取索马里政权，与其他军阀不同的是，巴雷对内积极进行改革建设，对外亲近苏联获取援助，将索马里打造成为东非的地方强国。接下来是实现领土野心的时候了-邻国埃塞俄比亚动荡不安，巴雷决定一举收复欧加登地区。"
 CHI_1978_DESC:0 "1976年，蒋介石带着未能光复大陆的遗憾去世，其子蒋经国子承父业。讲究实用主义的蒋经国决定先建设台湾，将台湾的经济带动起来，才有与中共对抗的资本。毛泽东去世后，中华人民共和国新领导人发表《告台湾同胞书》，蒋经国应如何应对呢？"
 SYR_1978_DESC:0 "1970年，哈菲兹·阿萨德通过纠正运动，取得了叙利亚的政权。阿萨德的首要任务包括建设叙利亚，镇压反对派，使叙利亚拥有与以色列对抗的能力。而黎巴嫩内战的爆发，使阿萨德得到一个与以色列一教高下的机会。"
 ISR_1978_DESC:0 "巴勒斯坦解放组织被逐出约旦后，移师黎巴嫩，以黎巴嫩为基地继续向以色列发起袭击。巴解组织在黎巴嫩的壮大激化了当地族群矛盾，最终导致了黎巴嫩内战的爆发。以色列军队认为，这是一个大好时机，向黎巴嫩发动进攻，活捉阿拉法特，根除巴解组织，并在贝鲁特建立一个亲以政权。"
 KOR_1978_DESC:0 "自从妻子陆英修遇刺后，韩国总统朴正熙一蹶不振，长期抑郁。韩国国内的民主运动愈演愈烈，釜山地区爆发了前所未有的骚乱。朴正熙总统邀请情报部长金载桂、警护室长车智澈等赴宴商讨镇压问题，而这将成为改变大韩民国历史的一夜……"
 
 PHI_1978_DESC:0 "费迪南德·马科斯对菲律宾的统治被认为是灾难，曾经年轻有为的政治家沦为了腐败的暴君，马科斯的独裁使得菲律宾错失了最好的发展机会，贫富差距迅速扩大，底层人民的不满演变为暴力反抗，包括共产主义、穆斯林叛军和贝尼尼奥·阿基诺的崛起。阿基诺宣布将回到菲律宾，在总统选举上与马科斯一决高下。"
 
 SIA_1978_DESC:0 "随着越南、老挝和柬埔寨都落入共产主义手中，泰国面临着巨大的威胁，为了防止成为东南亚下一个倒下的多米诺骨牌，泰国政府开始采取行动，一方面对抗国内的共产党游击队，一方面做好应对越南入侵的准备。幸运的是中国邓小平政府的上台给泰国带来了机会，他们需要争取中国的友好关系，让他们停止对泰国共产党的支持，还要密切关注中国与越南恶化的关系。"

 1984_NAME:0 "改革家 1984"
 1984_DESC:0 "§R该剧本内容尚未完成制作\n\n\n§W改革是80年代初，各国政界最常见的词汇。里根和撒切尔面对石油危机和通货膨胀之后日益恶化的经济局势，结束凯恩斯主义经济体制而选择了新自由主义。苏联、波兰和中国也将对自身的经济和政治体制进行有限改革，以确保社会主义政权的延续。\n80年代是冷战的高峰期，里根政府在恢复了美国的国力后，实行回推政策，与苏联在全球争夺势力。中国领导人邓小平选择了与美国合作，投向北约阵营。星球大战计划的实行、波兰的政局动荡和西方-81演习、优秀射手演习使铁幕两边充斥着火药味，两大阵营在欧洲、在阿富汗和非洲展开较量。"

 POL_1984_DESC:0 "沃伊切赫·雅鲁泽尔斯基主导的军管结束了盖莱克下台之后的动荡，波兰进入管制状态，但不能阻止反共运动的发展。莱赫·瓦文萨领导的团结工会日益壮大。尽管雅鲁泽尔斯基宣称无意建立军事政权，但苏联警告：如果波兰当局无法镇压自由主义运动，那就由苏军来执行。"

 USA_1984_DESC:0 "通过里根主义的改革，美国逐渐从70年代末的挫折中恢复，现在是全面反击的时候了。通过回滚政策，美国在全球各地支持颠覆亲苏政权的行动，包括对波兰团结工会、阿富汗圣战者和尼加拉瓜孔特拉斯的支持。除了陆地上，里根政府还将在太空中发起战略武器防御计划，以星球大战的形式向苏联发起新一轮军备竞赛。"

 ENG_1984_DESC:0 "马岛战争的大获全胜，大大增加了玛格丽特·撒切尔的威信，但更大的难题还在后头。北京发来了就香港前途问题进行谈判的邀请，并表示不会放弃香港的主权与治权。私有化和削减福利的改革引发了工人大罢工，北爱尔兰问题仍然悬而未解。铁娘子将如何应对？"

 IRQ_1984_DESC:0 "伊朗与伊拉克之间的战争贯穿整个80年代，"

 PRC_1984_DESC:0 "邓小平主导的改革开放取得了成功，经济发展取得成效，也加速了市场经济和自由主义思想进入中国大陆的进程。这即推动了中国生产力的现代化，但也导致了物价上升、贪污腐败等恶劣影响。现在邓小平的任务是利用好改革开放带来的效果，实现四个现代化，以及收回中国第一个被侵占的殖民地——香港。"

 SOV_1984_DESC:0 "勃列日涅夫在统治了苏联近二十年后，于1982年去世，留下了体制僵硬的苏联政府和一群已是两鬓斑白的老人政治家。安德罗波夫接任后，立即着手开始改革，为苏联谋求变革和出路，但此时他也已经癌症缠身，其改革是否能够进行下去，还是未知数。"

 KOR_1984_DESC:0 "双十二政变后，全斗焕夺取韩国政权成为总统，为了稳定统治，他急需实行经济改革。3S政策、新自由主义的实行和基础设施建设为韩国带来了又一次经济起飞，超过了北朝鲜，随后全斗焕开始着手准备为汉城申办奥运会。但这一切并不能有效维护全斗焕政权的威望，更不能阻止民主运动的继续发展。"

 JAP_1984_DESC:0 "80年代初，日本经济飞速崛起，成为全球第二大经济体，日本资本疯狂扩张，日本商品充斥全球市场，并将很快取代美国成为世界第一大债权国。有了资本作为底牌，日本政府开始谋求政治和军事上的地位。日本首相中曾根康弘打破战后自卫队经费不得超过GNP的1%的戒律，开始了军事扩充，以期将日本打造为“不沉的航空母舰”，以对抗苏联的“东京急行”。日本与苏联在北方四岛问题上存在领土冲突，日本的扩军加剧了两国关系。苏联认为，如果日本的军事威胁加剧，就准备实行“攀登纳罗达峰”计划。"

 VIN_1984_DESC:0 "越南占领柬埔寨后，很快陷入了与中国、泰国长期的边境战争中，而苏联自身经济状况的恶化使其无法对越南进行积极的援助。面对不断恶化的国内经济，越共需要做出抉择，是否从柬埔寨撤军，以及是否开始自己的改革。"

 PHI_1984_DESC:0 "菲律宾总统费迪南德·马科斯及其妻子伊梅尔达·马科斯对菲律宾长达20年的统治摧毁了这个国家，使其从东南亚最富有的国家变成的亚洲最贫穷的国家之一。到了80年代，菲律宾民怨沸腾，要求马科斯下台的呼声与日俱增。流亡美国的菲律宾民主人士贝尼尼奥·阿基诺决定回国，与马科斯在1986年的总统大选中一较高下。"

 LBA_1984_DESC:0 "穆阿迈尔·卡扎菲在1969年夺权成为利比亚独裁者，作为狂热的阿拉伯民族主义者，他极端仇恨以色列和美国，并谋求成为阿拉伯国家和非洲的霸主。为此，他积极支持各种反对以色列和美国的恐怖组织，在全球发起针对美国的进攻。"
 
 1989_NAME:0 "落幕 1989"
 
 1989_DESC:0 "§R该剧本内容尚未完成制作\n\n\n§W戈尔巴乔夫改革的失败导致了社会主义阵营的瓦解。从东德、波兰到北京，长期抱怨共产党的人们纷纷走上街头，高喊追求自由和民主的口号。这些国家的领导人必须立即决定是进行政治变革、拥抱西方还是坚持社会主义道路。\n\n。。。或者，让全世界为自己最后的荣光陪葬。"

 HKN_1989_DESC:0 "1984年的《中英联合声明》决定香港将于1997年回归中华人民共和国，尽管对中共政府有所顾虑，但大部分香港人还是接受了这一结果，直到1989年。香港人密切的关注着天安门广场上发生的一切，他不仅决定了中国共产党的命运，也决定着香港的前途。"

 CHL_1989_DESC:0 "智利独裁者奥古斯托·皮诺切特已经统治这个国家17年，尽管通过自由化的经济体制，使得智利的经济有所发展，但血腥的镇压政策已经透支了军政府的威望。在美国政府和国际社会压力下，皮诺切特最终同意在1989年进行全民公投，决定是否恢复宪法，当然，至于他和他的拥趸是否会尊重选举结果，国际社会仍有质疑态度。"

 JAP_1989_DESC:0 "1989年，在二战中统治日本的裕仁天皇去世，标志着日本在步入90年代的一系列不详事件。自民党先后三任首相在丑闻中下台，使得自民党长期统治日本的五五年体制有所动摇，社会党和公明党逐渐获得了挑战执政党的资本。随着泡沫经济继续发酵，日本在享受着疯狂的经济增长的同时，暗藏的危机也在酝酿，日本经济已经与泡沫牢牢绑定，一旦破裂将引发严重后果。"

 ENG_1989_DESC:0 "Thatcher, who won the Massachusetts War, tried to make China succumb to the Hong Kong issue like Argentina, but she was wrong. After intense negotiations and a fall at the gate of the Great Hall of the People, the Iron Lady finally had to accept Deng Xiaoping's request. In 1984, China and Britain signed a joint declaration and agreed to transfer sovereignty to Hong Kong in 1997. Thatcher was not willing to do so. Now there is an opportunity to change Hong Kong's future. The Democratic Movement in Beijing,1989 used this opportunity to encourage Hong Kong citizens to confront the Chinese government and then force Deng Xiaoping to abandon Hong Kong..."

 ROM_1989_DESC:0 "In March 1989, six former leaders of the Communist Party of Rome issued an open letter to General Secretary Ceausescu of the Communist Party of Rome, criticizing his internal and external policies and calling for comprehensive reform. But he scorned it. After more than 20 years of rule in Romania, the rule of Nicolas Ceausescu and his wife is coming to an end. In power, although Ceausescu adjusted Romania's economic policy, created a revival of Romania's economy, and became a minority of the European Socialist Group countries not controlled by the Soviet Union, they did not make any political achievements, but engaged in personal worship and family politics, the anger of the Romanian people will be ignited, as a key person at a critical moment. Things, the key choice Ceausescu made is to choose political reform, lay down all his efforts, Or stick to the original policy and continue to rule autocratically..."

 PRC_1989_DESC:0 "In 1989, the People's Republic faced the greatest crisis since its establishment. Hu Yaobang, a former president who supported students in the 1986 Shanghai academic tide, died. Students from universities in Beijing gathered in Tiananmen to mourning President Hu, and asked the government to open up freedom of speech. Li Peng, Premier of the State Council, and People's Daily criticized students'practices, and then an unprecedented Student Movement broke out in Beijing. Hundreds of thousands of students from various universities in Beijing gathered in Tian'anmen Square to demand that the government put an end to personal worship and unlock freedom of speech and newspaper running. Deng Xiaoping clearly opposed the student movement, while Zhao Ziyang, then president of the state, tried to negotiate with the students, but failed. With more and more demonstrators in Tiananmen Square and almost chaos in China's capital, what should the central government do in the face of such catastrophe?"
 
