 POL_1992_DESC:0 "经过长达十年的斗争，来赫·瓦文萨领导团结公会获得1989年选举的胜利，结束了共产党对波兰的统治。然而统治一个国家并不容易，随着新政府开始进行政治和经济改革，僵硬的社会主义体制将面临自由市场的冲击，波兰和整个东欧国家都遭遇了严重的通货膨胀和失业率，这对东欧国家来说，又是一个新的挑战。"
 
 SOV_1992_DESC:0 "1991年12月，随着红旗从克里姆林宫降下，曾经庞大的苏维埃联盟成为历史，苏联的16个加盟国分分独立，取而代之的是总统鲍里斯·叶利钦执政下的俄罗斯联邦。新的联邦废除了共产主义体制而实行政治多元化和经济上的休克疗法，结果是灾难性的，俄罗斯经济迅速崩溃，苏联的遗产被寡头馋食，政治多元化使得保皇派、自由派和后共产主义势力迅速崛起。叶利钦遭到反对派攻击，但他依然希望成为俄罗斯最高统治者，这是他不可避免地与各大党派发生冲突。"

 PRC_1992_DESC:0 "上海市市长江泽民在天安门事件后接手中共的领导地位，摆在姜面前的是一个棘手的局势。天安门事件使得中共的支持率和国际形象一落千丈，对内是人民的不满，严重的贪污腐败和停滞的改革，对外是西方国家的敌视和经济封锁，此外香港和台湾问题也在考验着北京。江泽民必须妥善处理这一切，以避免中华人民共和国成为共产主义世界倒下的下一枚多米诺骨牌。"

 USA_1992_DESC:0 "随着苏联的垮台，美国毫无疑问成为了冷战的最终胜利者，然而随着国际局势迅速变化，新的挑战来临了。伊拉克对科威特的入侵成为美国主导世界局势后的第一个挑战，尽管乔治·赫伯特·沃克·布什领导多国联军击溃了萨达姆，但这无助于解决美国国内的经济和社会问题。一个年轻的堪萨斯参议员正在崛起，他将挑战布什的总统席位。"
 
 CHI_1992_DESC:0 "在中国大陆发生的民主运动以流血冲突收尾时，中华民国统治下的台湾，一场新的民主运动正在酝酿。台湾自蒋经国宣布解严以后，党外运动和台独运动便迅速发展，而在李登辉接任总统后，政治更新便被提上日程。然而对于台湾群众来说，政治改革进行得太快，学生和知识分子呼吁进行更彻底的民主化，但中国国民党内元老则担忧改革的速度太快，使国民党失去政权。此外，天安门事件后，台湾与中国大陆的关系迅速恶化，有擦枪走火的危险。"
