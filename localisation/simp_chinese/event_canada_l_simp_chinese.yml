l_simp_chinese:
 
can.1.t:0 "拉布拉多与纽芬兰前途问题！"
can.1.d:0 "拉布拉多与纽芬兰这两块位于北美大陆东北端的领地，已经被大英帝国统治了数百年，而一直没有并入加拿大联邦。随着二战结束后，世界各地兴起去殖民化，拉布拉多与纽芬兰脱离英国的呼声越来越多，许多当地群众和社会人士希望独立或并入加拿大。"

can.2.t:0 "英国决定保持对拉布拉多和纽芬兰的统治"
can.2.d:0 "英国政府对正在崛起的拉布拉多纽芬兰分离主义运动进行了强硬的回复，伦敦声明他们对拉布拉多和纽芬兰的管制将继续下去。"

can.3.t:0 "拉布拉多和纽芬兰准备公投"
can.3.d:0 "英国发表声明，决定放弃拉布拉多和纽芬兰的管制，这两个地区择日进行公投，以决定独立或加入加拿大连邦。"

can.4.t:0 "拉布拉多和纽芬兰决定独立"
can.4.d:0 "经过公投，拉布拉多和纽芬兰人民大部分希望脱离英国独立，但也不愿意加入加拿大，这两个地区将会择日成立新的政府，建立新的国家。"

can.5.t:0 "拉布拉多和纽芬兰并入加拿大"
can.5.d:0 "经过公投，拉布拉多和纽芬兰人民大部分选择脱离英国，并加入加拿大联邦。"

can.6.t:0 "加拿大对纽芬兰的声索"
can.6.d:0 "加拿大政府对拉布拉多和纽芬兰地区局势发展发布声明，温哥华希望这两个地区与加拿大合并，从而完成对英属北美地区的统一。"

can.7.t:0 "我们对拉布拉多和纽芬兰危机的决定"
can.7.d:0 "拉布拉多和纽芬兰的归属问题，导致了加拿大与英国的外交危机，我们美国作为北美地区的大国、英加两国的盟友和西方世界的领袖，有必要对这次危机摆明立场，从而避免其影响到西方阵营的团结。"

can.8.t:0 "美国对拉布拉多和纽芬兰发表态度"
can.8.d:0 "美国政府发表声明，反对英国在拉布拉多和纽芬兰维持殖民统治的决定，并呼吁尽快进行决定该地区前途的公投。"

can.9.t:0 "英国坚持保留拉布拉多和纽芬兰"
can.9.d:0 "英国对美国关于拉布拉多和纽芬兰的声明予以严厉的批评，表示拉布拉多和纽芬兰自古以来是大英帝国不可分割的一部分。"

can.10.t:0 "我们对拉布拉多和纽芬兰危机的决定"
can.10.d:0 "我们对拉布拉多和纽芬兰危机的决定"

can.11.t:0 "加拿大宣布放弃拉布拉多和纽芬兰"

can.15.t:0 "加拿大总理麦肯齐·金去世"

can.16.t:0 "自由党主席大选"

can.17.t:0 "[CAN.Getleader]当选为自由党主席"

can.20.t:0 "加拿大国旗问题"
can.20.d:0 "在苏伊士战争结束以后，联合国派出由加拿大军人组成的代表团前往苏伊士运河区监督停火，然而，埃及政府拒绝加军进入交战区，因为加拿大是英国领地，加拿大的国旗上有英国国旗，这在政治上不可接受。\n埃及的声明在加拿大国内再一次激起了加拿大早已有的国旗之争。绘有英国米字旗的加拿大国旗并不为所有加拿大人所接受，尤其不被魁北克的法裔加拿大人所接受。加拿大的一些媒体在一次发出了更换国旗的建议。"

can.21.t:0 "加拿大1957年议会选举"
can.21.d:0 "加拿大议员即将迎来新一轮的议会选举，路易斯·圣洛朗领导下的自由党因为在天然气管道问题和苏伊士运河战争中的过度亲美决策而丧失了民众的支持，约翰·迪芬贝克领导的保守党决定挑战自由党的领导地位。"

can.22.t:0 "保守党赢得议会选举"
can.22.d:0 "约翰·迪芬贝克领导的保守党在加拿大选举中大获全胜，获得了多数席位，结束了自由党22年的执政。迪芬贝克将就任加拿大总理，并承诺加强对加拿大北部和西部的开发、减少对美国资本的依赖、强化与英联邦国家的关系等。"