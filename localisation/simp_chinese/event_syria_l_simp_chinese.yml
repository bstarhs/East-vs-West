l_simp_chinese:
 syr.5.t:0 "阿拉伯民族主义影响叙利亚"
 syr.5.d:0 "大马士革的街头，热情地群众挤满了总统府和倭马亚大清真寺，他们挥舞着叙利亚和埃及的国旗，手捧着埃及总统贾马尔·阿卜杜勒·纳赛尔的肖像，以庆祝另一个阿拉伯国家在苏伊士运河战争取得的胜利，而当广播电台传来纳赛尔呼吁阿拉伯国家团结起来，共同反对帝国主义的演讲时，人群中爆发出激烈的欢呼声。\n\n要阿拉伯不要帝国主义！年轻的学生们高喊着。\n\n叙利亚总统库瓦特里致信纳赛尔，祝贺埃及取得了战争的胜利，而纳赛尔也友好地回信，祝愿两国同胞未来能达成长期合作。当然，这种友好的问候只是一种外交礼节，至于如何对待纳赛尔的阿拉伯民族主义，库瓦特里和他的部下们各有不同的看法。"
 
 syr.6.t:0 "叙利亚军方开始亲近苏联"
 syr.6.d:0 "纳赛尔在苏联的支持下，赢得苏伊士运河战争，又在苏联帮助下，开始发展经济、工业和军事现代化……这一切，远在大马士革的年轻军人们都看在眼里。叙利亚军方的Afif al-Bizri少将访问莫斯科回国后，开始在军队内部宣传亲近苏联的好处，亲苏倾向将在叙利亚持续扩大。"
 
 syr.7.t:0 "警惕叙利亚的赤化危险"
 syr.7.d:0 "叙利亚遭到了共产势力的渗透，叙利亚军人正尝试与共产党勾结，帮助莫斯科在中东扩大他们的势力，这是我们绝对不能容忍的！我们也要开始支持叙利亚国内的反共势力，协助他们对抗共产主义，并在必要时候协助他们夺取叙利亚政权，建立一个亲西方的反共政府。"
 
 syr.8.t:0 "叙利亚爆发军事政变！"
 
 syr.9.t:0 "叙利亚爆发未遂政变！"
 syr.9.d:0 "大马士革消息！\n\n叙利亚军方宣布他们挫败了一场未遂的军事政变！一帮亲西方的叙利亚军人被贿赂，试图刺杀总统库瓦特里，以及其他被认为持亲开罗、亲苏联倾向的高级军官，但他们的一位同谋者选择向叙利亚政府交代真相。\n军方果断采取行动，逮捕了这些图谋叛乱的军官，军警将叛乱头目五花大绑压上卡车，送往大马士革郊外的监狱等待审讯。\n\n叙利亚政府强烈谴责西方国家勾结右翼军人发动政变，指责英国主导下的中部条约组织干涉叙利亚内政！"
 syr.9.a:0 "我们应该支持叙利亚反对帝国主义干涉！"
 syr.9.b:0 "叙利亚亲近苏联不可接受，必须给他们上压力！"
 syr.9.c:0 "保持中立，我国不掺和。"
 
 syr.10.t:0 "[ROOT.GetName]表态支持叙利亚政府"
 syr.10.d:0 "[ROOT.GetName]外交部发表声明，支持叙利亚政府采取果断行动，镇压叛乱，维护政局稳定，支持叙利亚反对帝国主义干涉，并强烈谴责西方帝国主义国家和他们的“中部条约组织”傀儡国干涉叙利亚内政！"
 
 syr.11.t:0 "[ROOT.GetName]表态谴责叙利亚政府"
 syr.11.d:0 "[ROOT.GetName]表态指责叙利亚政府正在与莫斯科的共产党势力勾结，帮助共产党在中东地区扩大影响力，使中东面临赤化的危险。该国强调将持续关注叙利亚局势，且不排除采取军事手段对叙利亚进行干涉的可能。"
 
 syr.12.t:0 "边境冲突"
 syr.12.d:0 "叙利亚军队在和[FROM.GetName]的边境冲突中落败，这加剧了叙利亚局势的不稳定。"
 
 syr.13.t:0 "边境冲突"
 syr.13.d:0 "叙利亚军队在和[FROM.GetName]的边境冲突中击退入侵者，这大大增加了叙利亚当局的威信。"
 
 syr.14.t:0 "叙利亚政府总辞职"
 syr.14.d:0 "大马士革消息！\n\n"
 
 syr.15.t:0 "叙利亚与周边国家停火"
 syr.15.d:0 "在沙特阿拉伯政府和联合国的调停下，叙利亚与周边多国的边境冲突宣告停火，由于叙利亚政府所谓的亲共问题导致的叙利亚政治危机宣告结束。\n叙利亚危机改变了中东格局，大马士革与西方国家的关系急剧恶化，也使得叙利亚军方更加倾向于与开罗和莫斯科的结盟。"
 
 syr.16.t:0 "叙利亚的未来"
 syr.16.d:0 "尊敬的总统阁下：\n\n经过一番冲突和抗争，我们成功击退了西方国家以及中部条约组织对我国的军事侵略和政治干涉，保护了叙利亚共和国的主权，但要击溃西方国家，让我们付出了不少代价，数百名叙利亚的勇士在军事冲突中长眠于祖国的土地……\n叙利亚不是一个强大的国家，若想要在复杂的大国冲突中生存，我们恐怕还是要与一个强大的盟友结盟。埃及总统贾马尔·阿卜杜勒·纳赛尔，他提出要与其他的阿拉伯国家实现统一，建立一个联邦国家，之前我们认为这是荒唐且不切实际的，但现在，我们必须认真考虑这个建议了。\n我们的代表团已准备好前往开罗，与纳赛尔洽谈两国的合并，届时，我们将与埃及建立完全的军事和经济共同体，一同对抗帝国主义。"
 
 syr.17.t:0 "叙利亚与埃及合并为阿拉伯联合共和国！"
 
 
 
 syr.18.t:0 "Syria withdraws from the United Arab Republic"

 syr.24.t:0 "军事政变！"

 syr.25.t:0 "以色列进攻戈兰高地！"

 syr.26.t:0 "戈兰高地失守！"

 syr.28.t:0 "纠正运动"