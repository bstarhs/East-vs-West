 lao.66.t:0 "老挝第二次联合政府正式形成"

 lao.67.t:0 "老挝外交部长被暗杀！"

 lao.68.t:0 "联合政府内部矛盾再次显现"

 lao.69.t:0 "老挝联合政府再次破裂！"

 lao.70.t:0 "美国对老挝展开轰炸！！"

 lao.71.t:0 "老挝再次发生军事政变！"

 lao.72.t:0 "美国宣布支持老挝政府镇压政变"

 lao.73.t:0 "美国宣布支持老挝新政府"

 lao.74.t:0 "来自美国的外交压力"

 lao.75.t:0 "富马政府拒绝了我们的要求"

 lao.76.t:0 "老挝政府宣布与右翼联合"
