l_simp_chinese:

 lao.1.t:0 "自由老挝领导人回国"

 lao.2.t:0 "苏发努冯亲王拒绝回国"

 lao.3.t:0 "老挝宣布自治"
 lao.3.d:0 "法国政府宣布，将其琅勃拉邦、万象和占巴塞三个保护领合并为老挝王国，并作为法兰西联盟保护下的自治领进行自治，以对抗日益壮大的老挝独立和共产主义运动。"

 lao.4.t:0 "对老挝提供援助"

 lao.5.t:0 "老挝民族解放阵线拒绝承认新政府"

 lao.6.t:0 "《日内瓦合约》"
 

 lao.7.t:0 "卡代首相提出辞职"
 lao.7.d:0 "由于没有能够实现老挝和解与国家统一的信心，卡代·萨索里特首相提出辞职，并推举梭发那·富马亲王接任首相。"

 lao.8.t:0 "梭发纳·富马就任老挝首相"
 lao.8.d:0 "由于没有能够实现老挝和解与国家统一的信心，老挝首相卡代·萨索里特提出辞职，并推举梭发那·富马亲王接任。"

 lao.9.t:0 "与老挝爱国阵线的谈判"

 lao.10.t:0 "老挝政府与巴特寮实现初步谈判"
 lao.10.d:0 "在老挝王国首都万象的谈判桌上，一个旨在结束内部分裂、探索国家和平发展道路的重要协议初步达成。代表老挝皇家政府的代表与来自老挝共产党（巴特寮）的谈判代表，经过多轮艰苦磋商，取得了一项突破性成果。\n根据协议框架，巴特寮方面同意逐步停止武装活动，并承诺减少与越南劳动党的军事合作，以此为条件换取参与国家政治进程的机会。作为交换，老挝皇家政府则郑重考虑承认巴特寮的合法政治地位，并允许其以政党身份参与未来的全国大选，共同组建联合政府。\n这一进展迅速引起了国际社会的广泛关注与不同反应。作为1954年日内瓦协议的保证国，法国、中国和苏联均对谈判取得的成功表示欢迎，认为这是通过政治对话实现印度支那地区稳定的积极步骤。然而，大洋彼岸的美国及其盟友南越西贡政权则对此表达了强烈不满和深切忧虑。它们严厉指责老挝皇家政府正在“与共产主义妥协”，认为此举可能会在冷战前沿打开一道危险的缺口，削弱东南亚地区的反共防线。"

 lao.11.t:0 "警惕共产主义在老挝的兴起"
 lao.11.d:0 "老挝现政府尝试与共产党进行谈判，成立联合政府，这将使得老挝面临赤化的威胁，这是我们绝对不能容忍的！我们也要开始支持老挝国内的反共势力，协助他们对抗共产主义，并在必要时候协助他们夺取老挝政权，建立一个反共政府。"

 lao.12.t:0 "老挝联合政府正式成立"
 lao.12.d:0 "来自万象的消息，老挝王国政府与老挝共产党的谈判取得成功，双方正式签署的《万象协议》，老挝共产党将正式放下武装，放弃暴力斗争，同时将现有的几只共产党武装组织加入老挝皇家军队，而老挝首相富马亲王将承认老挝共产党的合法政党地位，邀请共产党领袖苏发努冯亲王前往首都参加新政府。"

 lao.13.t:0 "老挝大选即将举行"
 lao.13.d:0 "老挝联合政府的第一次议会选举即将举行，老挝共产党领导下的老挝爱国阵线将参与选举。"

 lao.14.t:0 "左派获得老挝大选胜利"

 lao.15.t:0 "左派在老挝大选中失利"

 lao.20.t:0 "美国对老挝的政治局势表达不满"
 lao.20.d:0 "美国政府对老挝大选的结果感到十分不满，他们认为，共产党分子在老挝议会中取得席位，意味着老挝将面临共产党的全面和平演变，一旦老挝被共产党控制，东南亚都将陷入赤化的危险，美国外交发言人表示，美国政府将采取行动反对老挝的共产主义势力。"

 lao.21.t:0 "老挝右翼军人的不安"
 lao.21.d:0 "老挝共产党在大选中获得议会席位，引起了老挝军队中一些右翼军官的不满，一些军官对媒体表示，富马亲王向共产党让步的行为将导致严重的后果。"

 lao.22.t:0 "老挝国会要求弹劾富马！"
 lao.22.d:0 "今天的国会上，一些右翼国会议员突然向富马亲王和左派议员发难，指责富马亲王和左派势力勾结越南、中国共产党等外国势力，出卖国家，要求富马亲王辞职并解散联合政府！"

 lao.23.t:0 "老挝发生政治变动！"
 lao.23.d:0 "来自万象的突发消息！老挝国会中的右派势力突然宣布弹劾梭发那·富马亲王，富马亲王被迫辞去首相职位并被软禁，随后议会推举右派的外交部长培·萨那尼空接任首相！"

 lao.24.t:0 "苏发努冯亲王被捕！"
 lao.24.d:0 "老挝发生政变！富马亲王被迫下台，右翼政权成立后，新政府宣布解散联合政府，废除与老挝共产党的一切协议！在万象的老挝共产党领导人苏发努冯亲王被逮捕并关押！"

 lao.25.t:0 "关注老挝局势！"
 lao.25.d:0 "老挝发生的政变引起了国际社会的广泛关注，我们应该对此发表一份外交声明，展示我们的态度。"

 lao.26.t:0 "拒绝承认老挝新政府！"
 
 lao.27.t:0 "表态支持老挝新政府！"

 lao.28.t:0 "巴特寮宣布开始武装斗争！"
 lao.28.d:0 "老挝发生政变后，盘踞于老挝越南边境地区的一些还没有完全服从老挝政府管制的共产党武装发表声明，谴责右翼势力发动政变，并宣布将重新开始武装斗争，推翻右翼政府！至此，老挝联合政府正式破裂，老挝内战已经开始！"

 lao.30.t:0 "老挝与北越发生边境冲突！"
 lao.30.d:0 "随着老挝皇家政府对巴特寮发起进攻，老挝共产党向北越求援。越共武装部队进入老挝境内，与老挝皇家陆军爆发交火。"

 lao.31.t:0 "北越与巴特寮部队击败老挝皇家陆军！"
 lao.31.d:0 "老挝皇家陆军在与越共支持下的巴特寮武装的交火中落败，被迫撤离老越边境的丰沙里地区。越共进占此地，并宣布支持老挝共产党在此建立武装革命根据地。"

 lao.32.t:0 "老挝皇家陆军击败北越和巴特寮部队！"
 lao.32.d:0 "老挝皇家陆军在与越共支持下的巴特寮武装的交火中，击退了共产党的武装入侵，大量共产党武装分子被俘，巴特寮主力被迫撤退进入北越境内。"

 lao.33.t:0 "老挝发生政变"
 lao.33.d:0 "老挝再一次发生政变，右翼军人富米·诺萨万不满培·萨那尼空政府在反共作战屡次失利，通过军事政变迫使培·萨那尼空首相下台，并成立军人救国委员会掌管政权！"

 lao.34.t:0 "巴特寮领导人越狱！"
 lao.34.d:0 "被关押在监狱中的苏发努冯亲王等老挝共产党领导人突然失踪！他们似乎通过说服监狱看守的方式成功越狱了！"

 lao.35.t:0 "关注老挝内战局势！"
 lao.35.d:0 "总统先生：\n老挝的联合政府已彻底崩溃，老挝共产党在越共支持下发起武装叛乱，占据了东北部的丰沙里地区。在最近几次交战中，老挝政府军落于下风，如果老挝政府军继续在与共产党的交战中落败，可能会使得共产党在老挝的势力继续壮大，甚至武装夺取政权。老挝是扼守南北越秘密交通要道的战略要地，不能让其落入共产党手中，我们需要尽快向老挝政府军提供军事援助，帮助他们将共产党叛乱镇压下去。"
 lao35tool:0 "请完成§Y接触老挝国策§W以向老挝政府军提供军事援助"
 

 lao.40.t:0 "西萨旺·冯国王去世"
 lao.40.d:0 "来自万象的消息，老挝国王西萨旺·冯，在国家正处于混乱之时因病去世，享年74岁。"

 lao.41.t:0 "万象发生政变"
 lao.41.d:0 "来自老挝首都万象的消息！老挝皇家军队的伞兵尚未贡勒利用西萨旺·冯国王葬礼的机会，率领部队进入首都并控制了国家政权！贡勒上尉指责老挝现在的右翼政府为美国的冷战政策服务，出卖国家利益，并让国家陷入内战当中，他要求梭发那·富马亲王出山，重新担任老挝首相，并尽快与巴特寮势力进行和谈，以推动老挝全国和解、结束内战实现统一。"

 lao.42.t:0 "富米要求加入政府"
 lao.42.d:0 "富米·诺萨万和他麾下的右翼军人要求加入富马亲王的新政府，宣称政府中的反共势力需要一定规模以对抗共产主义的影响力，他强调这是要求，而非谈判。"

 lao.43.t:0 "富米·诺萨万被任命为副首相"
 lao.43.d:0 "富米·诺萨万和他麾下的右翼军人加入富马亲王了的新政府，宣称政府中的反共势力需要一定规模以对抗共产主义的影响力。"

 lao.44.t:0 "老挝右翼军人在沙湾拿吉发起叛乱！"
 lao.44.d:0 "老挝右翼军人在南部地区发起叛乱！富米·诺萨万宣称老挝新政府勾结共产党出卖国家，老挝爱国军人将采取行动推翻富马政府！"

 lao.45.t:0 "[ROOT.GetName]宣布支持老挝右翼军人革命委员会！"
 lao.45.d:0 "[ROOT.GetName]宣布支持老挝右翼军人革命委员会！"

 lao.46.t:0 "宣布为老挝政府提供援助！"

 lao.47.t:0 "老挝右翼军人叛乱被镇压"

 lao.48.t:0 "老挝右翼军队攻占万象！"
 lao.48.d:0 "来自万象的消息！反共的右翼军队已经攻占了老挝的万象、琅勃拉邦等主要城市，富米·诺萨万将军宣布成立老挝军事政府，并继续与共产党军队对抗。富马亲王和其他的亲共政治家已逃亡中国大陆。"

 lao.49.t:0 "北越军队进攻老挝边境！"

 lao.50.t:0 "我们需要为老挝军队提供更多援助！"
 
 

