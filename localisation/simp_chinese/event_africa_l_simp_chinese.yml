l_simp_chinese:
 africa.1.t:0 "游行示威！"
 africa.1.d:0 "非洲殖民地的首府发生的由当地黑人发起的游行示威，要求脱离殖民体系实现自决。"
 
 africa.10.t:0 "殖民地暴动！"
 africa.10.d:0 "[From.GetName]殖民地发生武装暴动！当地黑人民族主义者袭击了军火库，夺取武器，并宣布一场反对白人殖民统治的起义已经爆发。"
 
 africa.11.t:0 "变迁之风"
 africa.11.d:0 "英国首相[ENG.GetLeader]在南非开普敦发表演说：一场变迁之风已经来临。联系到英国最近开始向非洲殖民地下方自治权，各地独立运动如火如荼，人们认为这是一个具有划时代意义的历史信号：大英帝国，乃至整个殖民体系都即将在非洲瓦解。"
 africa.11.a:0 "新的时代即将取代旧的时代。"
 
 africa.14.t:0 "[From.GetName]的民族主义人士被释放"
 africa.14.d:0 "英国殖民当局宣布，将被逮捕的[From.GetName]民族主义已经被释放。"
 africa.14.a:0 "让我们看看接下来会发生什么。"
 
 africa.15.t:0 "[ROOT.GetName]议会选举即将开始"
 africa.15.d:0 "英国殖民当局宣布，[ROOT.GetName]将进行选举，以组建独立的议会和责任内阁，这将是[ROOT.GetName]尝试走向自治的第一步。"
 africa.15.a:0 "让我们看看接下来会发生什么。"
 
 africa.16.t:0 "[From.GetName]宣布独立！"
 africa.16.d:0 "正式宣布独立建国！"
 africa.16.a:0 "让我们看看接下来会发生什么。"
 
 africa.17.t:0 "[ROOT.GetName]议会选举即将开始"
 africa.17.d:0 "英国殖民当局宣布，[ROOT.GetName]将进行选举，以组建独立的议会和责任内阁，这将是[ROOT.GetName]尝试走向自治的第一步。"
 africa.17.a:0 "让我们看看接下来会发生什么。"
 
 africa.20.t:0 "肯尼亚爆发反殖民运动"
 africa.20.d:0 "肯尼亚多地爆发反对英国殖民的武装暴动，暴动者自称为肯尼亚国土自由军，由Dedan Kimathi领导。"
 africa.20.a:0 "让我们看看接下来会发生什么。"
 
 africa.21.t:0 "肯尼亚暴动！"
 africa.21.d:0 "肯尼亚叛军组织起一支武装部队，向我们发动袭击！"
 africa.21.a:0 "Foda-se comunista!"
 
 africa.22.t:0 "茅茅运动被镇压"
 africa.22.d:0 "在英国军队的大力镇压下，肯尼亚茅茅运动独立武装被击溃，幸存者被迫转入地下。"
 africa.22.a:0 "知道了。"
 
 africa.23.t:0 "肯尼亚独立战争爆发！"
 africa.23.d:0 "随着肯尼亚独立武装发起对英国据点的全面攻击，肯尼亚独立战争宣告开始！肯尼亚人民解放运动、肯尼亚民族解放阵线和争取肯尼亚全面独立联盟的领导人宣布，将国家从英国人三百多年统治下解放出来的时机已到。英国政府发表强硬的公告，宣布不惜一切代价守住肯尼亚！"
 africa.23.a:0 "知道了。"
 
 
 africa.30.t:0 "黄金海岸统一大会党成立！"
 africa.30.d:0 "随着去殖民化运动开始蔓延至非洲，英属黄金海岸作为英国经济最发达的非洲殖民地之一，也开始寻求独立自决。黄金海岸的知识分子和本土资产阶级在首府阿克拉成立了黄金海岸统一大会党，要求英国政府进一步向该地下放权力。"
 
 africa.31.t:0 "黄金海岸爆发大规模骚乱！"
 africa.31.d:0 "黄金海岸首府阿克拉发生了大规模骚乱！一些曾在二战中参与英国军队的非洲士兵不满退伍待遇而发起示威游行，许多黄金海岸的中产阶级黑人也参与其中，要求英国政府向黄金海岸给予更多政治权力。"
 
 africa.32.t:0 "黄金海岸人民大会党成立"
 africa.32.d:0 "黄金海岸统一大会党发生分裂，大会党领袖之一的克瓦米·恩克鲁玛要求在政治上采取更激进的手段，实现立刻自治。在党内矛盾无法调和后，恩克鲁玛另外组织人民大会党。"
 
 africa.33.t:0 "黄金海岸示威者开展不合作运动"
 africa.33.d:0 "黄金海岸人民大会党宣布，该党将发动黄金海岸的群众进行非暴力不合作运动，以向英国政府施加压力，迫使其接受自治的要求。"
 
 africa.34.t:0 "阿克拉发生罢工运动"
 africa.34.d:0 "黄金海岸首府阿克拉发生罢工运动，罢工的示威者要求英国政府尽快实现该地区的自治。"
 
 africa.35.t:0 "人民大会党赢得黄金海岸大选！"
 
 africa.36.t:0 "黄金海岸的内部分歧"
 africa.36.d:0 "随着黄金海岸大会党取得该地区的执政权，黄金海岸的独立似乎已成定局，但在未来该国应该实行什么样的政治制度上，内部发生的不同意见的争吵。\n黄金海岸总理、大会党领袖夸梅·恩克鲁玛希望建立以大会党为核心的中央集权制度，以维护国家的团结、统一和政府的高效运转，但北方的非基督教人口和部落酋长希望建立联邦制，以维持地方势力的权力。"
 
 africa.37.t:0 "英国将在黄金海岸举行决定性的大选"
 africa.37.d:0 "黄金海岸的自治方案即将实施，但该国内部却因为实行集权制还是联邦制争吵不休。伦敦宣布将由殖民部颁布两款不同的宪法，交由黄金海岸民众自行决定。公投结束后，黄金海岸将根据得票更多的一部宪法，正式脱离英国殖民部的直接管辖，成为英联邦下的一个独立自治领。"
 
 africa.38.t:0 "黄金海岸大会党赢得选举！"
 africa.38.d:0 "经过投票，伦敦宣布，由大会党主导制定的新宪法获得通过，新宪法将允许大会党建立中央集权制度，以维护国家的团结、统一和政府的高效运转，而这也意味着黄金海岸已经建立的自己的政府和政治体制，不久后将走向独立。"
 
 africa.39.t:0 "黄金海岸宪法未能获得通过"
 
 
 
 africa.50.t:0 "英国开始鼓励白人向东非移民"
 
 africa.51.t:0 "英国殖民当局向斯瓦西里人给予特权"
 
 africa.52.t:0 "英属东非联邦的成立！"
 
 africa.53.t:0 "东非爆发反对英国移民的暴动！"
 
 africa.54.t:0 "英国向殖民地推广基督教"
 
 africa.55.t:0 "东非的白人人口正在增加"
 
 africa.56.t:0 "英属东非颁布土地法"
 
 africa.57.t:0 "英属东非颁布土地法"
 
 africa.58.t:0 "东非的白人开始组织政治活动"
 
 africa.59.t:0 "英属东非即将举行大选"
 
 africa.60.t:0 "朴次茅斯男爵当选东非联邦总理！"
 
 africa.61.t:0 "穆罕默德·哈马迪当选东非联邦总理！"
 
 africa.62.t:0 "桑吉巴尔苏丹成为东非联邦的共治君主！"
 
 africa.65.t:0 "英国向殖民地推广基督教"
 
 africa.70.t:0 "坦噶尼喀爆发反对白人移民的暴动！"
 
 africa.70.t:0 "坦噶尼喀花生计划开始"
 
 africa.70.t:0 "坦噶尼喀花生计划以失败告终！"
 
 africa.70.t:0 "坦噶尼喀民族联盟成立！"
 
 africa.70.t:0 "坦噶尼喀花生计划以失败告终！"
 
 africa.70.t:0 "坦噶尼喀花生计划以失败告终！"
 
 
 africa.100.t:0 "喀麦隆人民联盟的形成"
 
 africa.101.t:0 "喀麦隆人民联盟呼吁结束托管"
 
 africa.102.t:0 "哈麦隆首次立法选举"
 
 africa.103.t:0 "喀麦隆人民联盟赢得选举"
 
 africa.104.t:0 "喀麦隆人民联盟指责选举舞弊"
 
 africa.105.t:0 "喀麦隆爆发大规模暴动！"
 
 africa.106.t:0 "乌姆·尼奥贝被杀害！"
 
 
 africa.110.t:0 "喀麦隆立法议会选举"
 africa.110.d:0 "法属喀麦隆托管地将迎来首次立法议会选举，喀麦隆民主阵线与喀麦隆民主阵线将争夺法属喀麦隆在法国国民议会中的唯一一个席位，以及法属喀麦隆首个民选政府的组织权。"
 
 africa.112.t:0 "喀麦隆民主阵线赢得选举"
 
 africa.113.t:0 "喀麦隆协调委员会赢得选举"
 africa.113.d:0 "喀麦隆协调委员会赢得喀麦隆首次立法会议选举，获得法属喀麦隆在法国国民议会中的唯一一个席位，以及法属喀麦隆首个民选政府的组织权。"
 
 africa.114.t:0 "喀麦隆的内部争端"
 africa.114.d:0 "喀麦隆的内部争端"
 
 africa.115.t:0 "法国单方面提出喀麦隆独立方案"
 africa.115.d:0 "巴黎的法国海外部正式宣布，法国将单方面推动一项喀麦隆托管地的独立方案，推动喀麦隆在法兰西共同体框架下，一定程度的独立，在成为主权国家的同时，继续与巴黎保持一定程度上的合作。"
 
 africa.116.t:0 "喀麦隆首席部长批评独立方案"
 africa.116.d:0 "喀麦隆首席部长[CMR.GetLeader]对法国推动的所谓一定程度上的独立予以反对，他表示，喀麦隆要么完全成为独立国家，要么干脆不独立，这种所谓的半独立状态，定义不清不楚，只会对喀麦隆的国家主权和政治局势带来更大的负面影响。"
 
 africa.117.t:0 "喀麦隆发生政治动荡"
 africa.117.d:0 "喀麦隆托管地政府与巴黎的关系迅速恶化，首席部长[CMR.GetLeader]反对法国推动的所谓半独立法案，执意推行自己的独立方案。喀麦隆指责法国干涉内政，妄图推行新殖民主义，而法国则认为喀麦隆地方政府无权自主决定独立方案，并向其施加压力。"
 
 africa.118.t:0 "喀麦隆总理引咎辞职"
 africa.118.d:0 "在法国压力下，喀麦隆总理被迫引咎辞职。"