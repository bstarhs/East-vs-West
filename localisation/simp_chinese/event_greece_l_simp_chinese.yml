l_simp_chinese:
 gre.1.t:0 "希腊共产党夺取政权！"
 gre.1.d:0 "经过激烈的战斗，希腊共产党的武装部队控制了首都雅典和希腊的大部分城市，残余的希腊政府军被迫撤离至克里特岛。至此，希腊共产党赢得了希腊内战，建立了希腊民主共和国。"
 gre.1.a:0 "祝福希腊"
 
 gre.2.t:0 "希腊国王乔治二世去世"
 gre.2.d:0 "希腊国王乔治二世因病去世，享年56岁。乔治二世国王在二战期间领导希腊流亡政府抵抗纳粹，但当他回到希腊时，这个国家依然被内战摧残。乔治二世没有子嗣，他的弟弟保罗即位为希腊国王。"
 
 gre.3.t:0 " [From.GetName]为我们提供援助"
 
 gre.4.t:0 "希腊共产党被镇压"
 gre.4.d:0 "在希腊国民军的大力镇压下，希腊共产党领导的武装被击溃，幸存者被迫转入山区继续抵抗。"
 gre.4.a:0 "希腊局势不会那么容易改善"
 
 gre.5.t:0 "希腊共产党暴动！"
 gre.5.d:0 "希腊共产党叛军组织起一支武装部队，向我们发动袭击！"
 
 gre.6.t:0 "希腊共产党的内部斗争"
 gre.6.d:0 "苏联与南斯拉夫爆发的冲突不可避免地影响到了希腊的共产主义运动，希腊共产党内部就支持铁托还是斯大林爆发了严重的内部分歧，并大大地削弱了希共的力量。"
 
 gre.8.t:0 "1955年希腊大选"
 
 gre.9.t:0 "亚历山大·帕帕戈斯当选希腊总理"
 gre.9.d:0 "在经历了长期内战与政局动荡的希腊，一位颇具声望的军事领袖决定挺身而出，试图以政治方式引领国家走向稳定。这位领袖便是亚历山大·帕帕戈斯将军，一位在希腊内战中指挥政府军取得最终胜利的关键人物。\n面对国家的持续分裂与虚弱，帕帕戈斯将军脱下军装，组建了一个全新的政治力量——希腊团结党。该党高举民族和解与社会安定的旗帜，其跨越传统左右分野的温和保守主义纲领，迅速赢得了渴望结束动荡、恢复秩序的广泛民众的支持，特别是中产阶级、农民以及工商界的青睐。\n凭借其个人的崇高威望与政党明确的治国方略，希腊团结党在随后的政治进程中取得了显著成功。帕帕戈斯将军本人也成功当选为希腊总理，开启了其从军事统帅向政治领导人的重要转型。这一事件被视为战后希腊政治史上的一个关键转折点，标志着国家试图从内战的创伤中走出，探索一条新的政治整合道路。"
 
 gre.10.t:0 "亚历山大·帕帕戈斯去世"
 gre.10.d:0 "希腊总理亚历山大·帕帕戈斯将军于昨日逝世。这位在内战后挺身而出的政治强人，其执政生涯被誉为国家关键的稳定器。他不仅成功弥合了内战带来的深刻社会裂痕，重建了基本秩序，还积极利用“马歇尔计划”等美国援助，有效推动了战后经济复苏，使希腊民生开始显著回暖。其功绩赢得了社会各界跨越党派的广泛赞誉。\n根据宪法程序，希腊议会迅速推举帕帕戈斯生前的亲信部下、原交通部长康斯坦丁诺斯·卡拉曼利斯接任总理。与作为军事领袖的前任不同，卡拉曼利斯以其鲜明的民主派立场著称。他在就任后明确表示，将继承帕帕戈斯总理的稳定遗产，并誓言进一步推进希腊的政治生活朝着更加制度化、民主化的方向进行深刻改革。\n此次权力交接平稳迅速，标志着希腊在战后重建道路上进入了一个寻求巩固民主的新阶段。"
 
 gre.12.t:0 "希腊议会选举"
 
 gre.13.t:0 "康斯坦丁诺斯·卡拉曼利斯辞职"
 gre.13.d:0 "由于在塞浦路斯问题上的让步，希腊总理康斯坦丁诺斯·卡拉曼利斯遭到了政府内保守派的排挤，遂决定辞职，乔治欧·潘帕德里乌斯接任。"
 
 gre.14.t:0 "希腊国王保罗一世去世"
 gre.14.d:0 "希腊国王保罗一世因心脏病去世，享年63岁，他的儿子康斯坦丁二世继承王位。康斯坦丁二世年仅23岁，他是否有能力调节好希腊各势力之间的关系，国际社会深感怀疑。"
 
 gre.15.t:0 "希腊议会选举"
 
 gre.16.t:0 "希腊军方发动政变！"
 gre.16.d:0 "以乔治欧·帕帕多普洛斯为首的军队突然冲入首都雅典，控制了政府，他们宣称希腊在1967年大选后，政局混乱，政府无能，军方将出面建立军政府，接手整个国家。"
 
 gre.17.t:0 "希腊军方发动政变！"
 gre.17.d:0 "以乔治欧·帕帕多普洛斯为首的军队突然冲入首都雅典，控制了政府，他们宣称希腊在1967年大选后，政局混乱，政府无能，军方将出面建立军政府，接手整个国家。"
 
 gre.18.t:0 "康斯坦丁二世离开希腊"
 
 gre.19.t:0 "希腊共和国成立"
 gre.19.d:0 "希腊国王康斯坦丁二世在与军政府的对抗中失败，被迫出走罗马，军政府首脑[GRE.GetLeader]宣布既然君主已经离开，那希腊将事实上成为一个共和国。"
 
 gre.20.t:0 "雅典大学爆发示威游行！"
 gre.20.d:0 "塞浦路斯战争的失败暴露了军政府的无能，人民对军政府的不满全面爆发，一场浩大的民主运动已经在雅典的各个大学中开始。"
 
 gre.21.t:0 "帕帕多普洛斯辞职"
 
 gre.22.t:0 "希腊军政府下台"
 
 gre.23.t:0 "康斯坦丁二世回国"
 
 gre.24.t:0 "希腊君主制公投"
 
 gre.25.t:0 "希腊议会选举"
 
 
 
 gre.100.t:0 "马其顿少数民族的支持"
 
 gre.101.t:0 "马其顿地区保加尔人的暴动"
 
 gre.102.t:0 "希腊临时民主政府成立"
 
 gre.103.t:0 "美国顾问抵达希腊"
 
 gre.104.t:0 "女王营地的成立"
 
 gre.105.t:0 "希腊政府军攻占伯罗奔尼撒半岛"
 
 gre.106.t:0 "希腊政府军攻占马其顿山区"
 
 gre.107.t:0 "希腊共产党的撤退"
 
 gre.108.t:0 "宣布支持希腊共产党"
 
 
 
 
 gre.40.t:0 "土耳其陷入混乱！"
 
 gre.41.t:0 "希腊对土耳其宣战！"
 
 gre.42.t:0 "我们已占领小亚细亚西部！"
 
 gre.43.t:0 "希腊宣布停火！"