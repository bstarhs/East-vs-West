l_simp_chinese:
 
 tib.1.t:0 "热振僧人围攻布达拉宫"
 tib.1.a:0 "让瓦加斯先生再次领导我们的国家！"
 tib.1.b:0 "戈麦斯元帅适合成为新的领袖。"
 
 tib.2.t:0 "热振活佛圆寂"
 tib.2.d:0 "热振活佛圆寂，以热振活佛为首的噶厦亲中派势力也随之瓦解，亲英派和独立派逐渐掌握西藏。"
 tib.2.a:0 "无稽之谈！"
 tib.2.b:0 "让瓦加斯下台！"
 
 tib.3.t:0 "十四世达赖亲政"
 tib.3.d:0 "随着十四世达赖喇嘛·丹增嘉措成年，他在拉萨正式坐床，开始行使自己作为西藏宗教领袖的权能。"
 tib.3.a:0 "确定。"
 
 tib.4.t:0 "内地共产党向我们发来邀请"
 tib.4.d:0 " "
 tib.4.a:0 "有惊无险。"
 
 tib.5.t:0 "西藏地方政府拒绝和平解放"
 tib.5.d:0 "西藏地方政府拒绝了我们提出的和平解放条件，并要求我们尊重其非法的主权。西藏当局已经开始组织藏军试图抵抗。"
 tib.5.a:0 "确定。"
 
 tib.6.t:0 "西藏面临中国威胁"
 tib.6.d:0 " "
 tib.6.a:0 "多事之秋。"
 
 tib.7.t:0 "来自[From.GetName]的保护"
 tib.7.d:0 "1955年，新一届巴西总统选举开始。已经73岁高龄的现总统瓦加斯决定放弃连任机会。来自社会民主党的洛奥里桑特市市长儒塞利诺·库比契克和来自国家民主联盟的胡亚雷斯·塔沃拉将军进行竞争。"
 tib.7.a:0 "确定。"
 tib.7.b:0 "确定。"
 
 tib.8.t:0 "[From.GetName]宣布保护西藏"
 tib.8.d:0 "儒塞利诺在担任洛奥里桑特市市长时，曾大力推动当地经济发展。现在他已经成为总统，准备将他的改革计划推广到全国，内容包括大力发展交通、教育和重工业等。"
 tib.8.a:0 "我们应当大力支持！"
 tib.8.b:0 "多此一举。"
 
 tib.9.t:0 "西藏拒绝我们的保护"
 tib.9.d:0 "儒塞利诺提出了一项大胆的建设计划——为了加快内地发展、扩大内需和远离保守势力盘踞的里约，他决定在中央高地建设一座新的城市，作为新的首都。"
 tib.9.a:0 "我们应当大力支持！
 tib.9.b:0 "多此一举。"
 
 tib.10.t:0 "中共解放西藏"
 tib.10.d:0 "在中国人民解放军的攻击下，落后的西藏军队一触即溃，解放军开始沿川藏铁路一路进军。在一些开明人士的劝解下，达赖喇嘛及其噶厦内阁决定接受中国共产党的条件，宣布西藏和平解放。随着人民解放军进入拉萨，中共控制了中国大陆最后一块未被解放的地区。"
 tib.10.a:0 "太棒了！"
 tib.10.b:0 "多此一举。"
 
 tib.11.t:0 "中共与西藏当局签署《十七条协议》"
 tib.11.d:0 "经过谈判，中共政府与西藏当局签署《十七条协议》正式宣布停火，并实现西藏和平解放，西藏将并入中华人民共和国，而达赖和他的噶厦将与中共一同执政西藏。当然，无论是在西藏、中国内地还是国际上，舆论普遍认为，这种联合政府不会长久。"
 tib.11.a:0 "太棒了！"
 
 tib.12.t:0 "西藏当局请求和谈"
 tib.12.d:0 "在人民解放军英勇作战之下，藏军溃不成军，西藏当局在达赖喇嘛和班禅授意下，向我们提出和谈，表示愿意接受和平解放协议。"
 
 tib.12.t:0 "西藏临时政府选举"
 
 tib.13.t:0 "西藏民主改革"
 
 tib.14.t:0 "西藏叛乱！"
 
 tib.15.t:0 "达赖喇嘛请求庇护"
 
 tib.16.t:0 "中国放弃西藏主权"
 
 tib.17.t:0 "与西藏地方政府合作"
 
 tib.18.t:0 "来自内地的合作"
 
 tib.19.t:0 "更敦群培去世"
 
 tib.20.t:0 "拉萨发生游行示威
 
 tib.21.t:0 "西藏废除农奴制"
 
 tib.22.t:0 "西藏制定宪法"
 
 tib.23.t:0 "西藏议会选举"
 
 tib.24.t:0 "拉萨爆发示威"
 
 tib.25.t:0 "西藏人民起义"
 
 tib.26.t:0 "北京与拉萨进行接触"
 
 tib.30.t:0 "印度要召开亚洲国际会议"
 
 tib.31.t:0 "亚洲国际会议在德里召开"
 tib.31.d:0 "印度独立后，为改善与周边国家关系，提高国际影响力，宣布召开亚洲国际会议，并邀请亚洲各国前往新德里参与。"
 
 tib.32.t:0 "西藏代表参与亚洲国际会议"
 tib.32.d:0 "来自西藏达赖喇嘛政府的代表参与了印度举办的亚洲国际会议，这引起了中华民国政府的不满，因为在法理上，西藏还是中国的领土。"
 
 tib.33.t:0 "中华民国抗议西藏参与亚洲国际会议"
 tib.33.d:0 "中华民国外交部抗议西藏参与亚洲国际会议。"
 
 tib.34.t:0 "西藏代表撤离亚洲国际会议"
 tib.34.d:0 "在中华民国的压力下，印度政府不得不告知西藏代表，他们将无法出席亚洲国际会议之后的活动。"
 
 tib.35.t:0 "印度无视中方抗议"
 tib.35.d:0 "印度无视中华民国的外交压力，宣布西藏代表将继续参与亚洲国际会议相关活动。"
 
 tib.36.t:0 "西藏当局驱逐南京代表"
 
 tib.40.t:0 "西藏当局请求和谈"
 tib.40.d:0 "在人民解放军英勇作战之下，藏军溃不成军，西藏当局在达赖喇嘛和班禅授意下，向我们提出和谈，表示愿意接受和平解放协议。"
 
 
 
 tib.50.t:0 "青海和川西地区藏民发起游行"
 tib.50.d:0 "青海和川西地区的藏民发起示威游行，反对政府最近开展的一系列社会改革，认为这破坏了藏民的传统文化和生活方式。"
 
 tib.51.t:0 "川西地区藏民抗议土地改革"
 tib.51.d:0 "青海和川西地区的藏民发起示威游行，反对政府最近开展的一系列土地改革，认为汉人地区的土地改革方式不适合藏区，不合理的土地和牲畜分配破坏了原有的经济生产制度。"
 
 tib.52.t:0 "川西地区藏民抗议宗教改革"
 tib.52.d:0 "青海和川西地区的藏民发起示威游行，反对政府最近开展的一系列宗教改革，认为这破坏了藏民的传统文化和生活方式。"
 
 tib.53.t:0 "川西爆发大规模藏人暴动！"
 tib.53.d:0 "西康省的藏人与中国共产党政府的矛盾激化并被点燃，许多不满共产主义政策的僧侣收集武器，发起暴动！"
 
 tib.54.t:0 "川西藏人暴动被平定"
 tib.54.d:0 "在西康省的理塘、康定等地爆发的西藏僧侣暴动被中国人民解放军平定，参与暴动的僧侣被迫投降。"
 tib.54.a:0 "图-4的血不要白流了。"
 
 
 tib.55.t:0 "大量川西喇嘛进入藏区"
 tib.55.d:0 "在川西暴动被镇压后，大量反对共产党的喇嘛逃离川西，冒险进入噶厦控制的藏区。"
 
 tib.56.t:0 "循化县发生少数民族暴动事件！"
 tib.56.d:0 "青海省循化县发生大规模的少数民族暴动事件！当地的藏族、撒拉族喇嘛和阿訇为了保护自己的利益，抵制土地改革，我公安干警依法将其拘捕，其爪牙竟煽动群众，冲击司法机关，破坏社会秩序，公安干警果断采取行动，进行镇压平叛，逮捕带头寻衅滋事的暴徒。一些暴徒逃脱追捕，进入了噶厦控制的藏区。"
 
 tib.57.t:0 "藏区动荡"
 tib.57.d:0 "随着大量的暴动者进入西藏，西藏的局势变得动荡不安。这些反对共产党的川西和青海喇嘛进入西藏后，大肆渲染共产党对宗教进行强硬的镇压政策，在西藏传播开来，引起不安。"
 
 tib.58.t:0 "藏族新年大法会"
 tib.58.D:0 "在西藏局势高度敏感的背景下，藏历新年即将来临。为了展示善意，中国人民解放军西藏军区决定邀请达赖喇嘛前往军区大礼堂观看法会。"
 
 tib.59.t:0 "藏军执意跟随达赖进入军区"
 tib.59.d:0 "二十多名藏军士兵执意要求跟随达赖喇嘛进入军区，"
 
 tib.60.t:0 "达赖喇嘛遭遇刺杀！"
 tib.60.d:0 "来自拉萨的突发消息！！\n在今天举行的藏历新年大法会上，原本应该保护达赖喇嘛的藏军士兵，突然向达赖和在场的中共官员开枪射击！达赖遭子弹击穿胸口，当场死亡，多名中共官员也被杀害！\n藏军士兵跳到舞台中央，大喊：红汉人和达赖走狗滚出去！\n解放军迅速包围会场，与藏军发生激烈交火！"
 
 tib.61.t:0 "藏军与解放军爆发武装冲突！"
 tib.61.d:0 "来自拉萨的突发消息！！\n在今天举行的藏历新年大法会上，几名藏军士兵以保护达赖喇嘛为由，执意进入军区礼堂，双方爆发激烈冲突，并最终交火！"
 
 tib.62.t:0 "拉萨多地发生大规模暴动！"
 tib.62.d:0 "拉萨多地发生大规模暴动，愤怒的藏族认为共产党试图劫持和杀害达赖喇嘛，包围了达赖下榻的罗布林卡"
 
 tib.63.t:0 "索朗降措被暴徒杀害！"
 tib.63.D:0 "亲近中共的西藏官员、西藏自治区筹备委员会成员索朗降措在拉萨被激进的反共示威者用石头杀害！"
 
 tib.64.t:0 "解放军向藏军发起进攻！"
 tib.64.D:0 "解放军宣布向叛乱的藏军发起进攻！"
 
 tib.65.t:0 "西藏骚乱被平定！"
 tib.65.d:0 "中共政府宣布，西藏骚乱和藏军叛乱被平定！发起叛乱的藏军和僧侣向解放军投降。"
 
 tib.66.t:0 "大量藏人逃离西藏"
 tib.66.d:0 "在西藏暴动被镇压后，大量反对共产党的藏人逃离西藏，流亡进入印度、不丹、尼泊尔等地。"
 
 tib.67.t:0 "达赖喇嘛逃离西藏！"
 tib.67.D:0 "在西藏暴动后，达赖喇嘛与随行人员逃离西藏！"
 
 tib.68.t:0 "西藏问题引起国际社会关注"
 tib.68.d:0 "中共入侵西藏的行为引起了国际社会的关注！我们应该在就此事发表外交声明，以显示我们的外交影响力。"
 
 tib.69.t:0 "[FROM.GetName]谴责中共镇压西藏！"
 tib.69.d:0 "[FROM.GetName]政府发表外交声明，谴责中共武力入侵西藏，屠杀西藏民众和破坏西藏宗教自由，呼吁自由世界帮助西藏人民抵抗邪恶共产主义势力！"
 
