l_simp_chinese:
 svn.1.t:0 "西贡政府请求我们协助迁移北方难民"
 svn.1.d:0 "越南南方的西贡政府向我们求助，希望我方可以提供船只和飞机，将越南北部信仰基督教和反对共产主义的群众运送到南方，这不仅可以削弱越南北方共产主义，而且这些反共主义者将可以成为越南南方政权的支持者和我们的支持者。。"
 
 svn.2.t:0 "越南北方群众向南方撤离"
 svn.2.d:0 "美国政府发起“自由之路”行动，利用船只和飞机，将大量越南北方的群众送到南方，这些群众大部分是基督徒或反对共产主义的人士，他们抵达南方后，大大增强了越南南方反共产主义的势力和人口。"
 
 svn.3.t:0 "美国不支持我们撤离北方群众的请求"
 svn.3.d:0 "美国不愿意协助我们将难民从北方撤离。"
 
 svn.4.t:0 "越南南方公投即将开始"
 svn.4.d:0 "根据《日内瓦协议》，越南南方即将举行全民公投，以决定该地区的政治前途。"
 
 svn.5.t:0 "阮福典赢得越南南方公投"
 svn.5.d:0 "越南国国家元首、末代皇帝阮福典在越南南方公投中获得多数支持率，他将继续执政越南南方政府。"
 
 svn.6.t:0 "吴廷琰与勤劳党赢得越南南方公投"
 svn.6.d:0 "越南前首相、保守的基督徒吴廷琰和他的勤劳党在越南南方公投中获得多数支持率，获得了组件越南南方新政府的资格。吴廷琰表示，他将领导新的越南南方政府与共产主义侵略及法国残余势力斗争，并恢复天主教在越南的地位。"
 
 
 
 svn.7.t:0 "北方难民的居无定所"
 svn.7.d:0 "随着大量逃离北方躲避越共迫害的难民来到南方，他们的定居、就业和生存成为一个问题，目前当局只能暂时将他们安置在满民营中。"
 
 svn.8.t:0 "营田新村需要更多投资"
 svn.8.d:0 "安置难民的营田新村需要更多投资以改善定居者的生活条件。"
 
 svn.9.t:0 "营田新村的成功运营"
 svn.9.d:0 "前方记者在越南共和国安江省发来报告。南越政府为安置从北方迁来的反共产主义难民，再这些地区修建了名为营田的新村。\n新村的居民对记者表示，新的家园生活质量确实比生活在丛林的村庄和贫民窟要好，难民的安置大大增加了越南共和国政府的威望。"
 
 
 svn.10.t:0 "西贡政府拒绝进行公投"
 
 
 svn.11.t:0 "西贡政府与平川派武装爆发激烈交战"
 svn.11.d:0 "来自西贡的消息！越南南方政府派出军警，向盘踞在湄公河三角洲的犯罪集团平川派进行武力镇压！平川派民兵在西贡街头与当局的军警爆发激烈交火！"
 
 svn.12.t:0 "平川派武装被消灭"
 svn.12.d:0 "在西贡当局军警的武力镇压下，平川派的民兵武装被消灭，大部分平川派分子被迫投降。\n平川派的毁灭，沉重的打击了盘踞在越南南部的犯罪集团，稳定了湄公河三角洲地区的社会局势，也巩固了越南南方政府的统治。"
 
 svn.13.t:0 "西贡政府与和好教武装爆发激烈交战"
 
 svn.14.t:0 "和好教武装被消灭"
 
 svn.15.t:0 "西贡政府颁布47号命令"
 
 svn.16.t:0 "西贡警察与佛教僧侣发生流血冲突"
 
 svn.17.t:0 "僧人释广德在西贡接头自焚"
 
 svn.18.t:0 "越南副总统夫人就僧人自焚发表评价"
 
 svn.19.t:0 "越南南方开展土地改革"
 svn.19.d:0 "越南南方政府宣布，政府已通过第57号法令，启动土地改革进程，改革将结束大地主和大企业对耕地的垄断，赎买耕地并将其发放或出售给农民，以结束封建佃农制度对越南的统治，并争取农民对政府的支持。"
 
 svn.20.t:0 "土地改革中的赎买土地争议"
 svn.20.d:0 "我国的土地改革遭遇了严重的难题，地方政府没有足够的经费从地主手中购买土地，希望西贡方面提供资金来购买土地。而地主们表示，如果政府不能给予他们放弃土地的补偿，他们将会把土地出售给私人企业，毕竟这样某种意义上也算完成了土地改革的命令。"
 
 svn.21.t:0 "越南南方土地改革得到推行"
 svn.21.d:0 "越南南方的土地改革取得初步成功，由于西贡政府为农民提供资金赎买土地，最终成功从地主手中获取了大量的耕地并分配给没有土地的农民。土地改革的成功使得西贡政府的经济政策得到推行，同时也大大提高了当局的影响力。"
 
 svn.22.t:0 "越南南方土地改革以失败告终"
 svn.22.d:0 "美国媒体发布了一篇报告，认为越南南方西贡政府推行的土地改革已经以失败告终。政府在土地改革政策上畏手畏脚，既无法向地主提供补偿，也不能阻止私有企业、官僚和新兴垄断集团霸占本应该出售给农民的土地，政府收取的耕地最后只不过是从一个地主换给了另一个地主罢了。越南南方农民对西贡政府在土地改革上的软弱和无能感到愤怒，当局的威信遭到了严重的削弱。"
 
 
 svn.23.t:0 "农民对不合理土地政策的不满"
 
 svn.24.t:0 "农民希望深入土地数量限制政策"
 
 
 
 svn.25.t:0 "警惕印度支那地区扩大的共产主义影响力"
 
 svn.26.t:0 "越南槟知省爆发武装暴动！"
 
 svn.30.t:0 "美国空军在越南开展滚雷行动"
 
 svn.31.t:0 "肯尼迪参议员就越南局势发表演说"
 svn.31.d:0 "美国的约翰·肯尼迪参议员最近接受媒体采访时表示，《日内瓦协议》所规定的越南在1956年举行全国公投的决定是一个骗局，公投将使得共产党以不流血的方式篡夺越南南方政权，从而加强东南亚赤化的风险，因此肯尼迪呼吁越南南方政府不要进行公投，并对亲共势力采取手段。"
 
 svn.32.t:0 "《把我们从邪恶中拯救出来》"
 svn.32.d:0 "美国官员托马斯·安东尼·杜利博士出版了一本叫做《把我们从邪恶中拯救出来》的书籍，书中他记载了他在越南北部协助天主教徒逃亡越南南方的经历。杜利指责共产党对越南北部的天主教徒和其他群众进行残酷迫害，认为共产主义是不断扩散的癌症，将亚洲各国陷入动荡和残暴的独裁统治当中，并呼吁美国社会各界关注越南局势，阻止共产主义在亚洲的扩张。"
 
 svn.33.t:0 "越南美国基地发生谋杀案"
 svn.33.d:0 "美国军人Richard B Fitzgibbon在越南的新山空军基地被发现死亡，他由此成为第一名在越南阵亡的美国军人，但根据调查，他并非死于越共袭击，而是另一名美国军人将其杀害。"
 
 
 svn.40.t:0 "美军在进行扫荡作战并摧毁越共据点！"
 svn.40.d:0 "美军在一次搜索与摧毁作战中与越共游击队爆发激烈的遭遇战！双方进行了激烈的交火，最终越共在遭受严重伤亡后仓促撤退，美军摧毁了被怀疑支持越共的村庄，并强制带走了当地居民。"
 
 svn.41.t:0 "美军在与越共的交火中撤退！"
 svn.41.d:0 "美军在一次搜索与摧毁作战中与越共游击队爆发激烈的遭遇战！双方进行了激烈的交火，最终美军在遭受严重伤亡后仓促撤退，原定摧毁越共据点的目标也以失败告终。"
 
 
 svn.45.t:0 "美军在越南与共产党武装爆发第一次交火！"
 
 svn.46.t:0 "美军基地遭到越共袭击！"
 
 svn.47.t:0 "美军基地击退一次越共偷袭！"
 
 svn.48.t:0 "美军向越南南方的共产党据点发起空袭！"
 
 
 svn.50.t:0 "美军向越南北方发起空袭！"
 svn.50.d:0 "今日早晨，驻扎在印度支那的美国战机对越南北方发起空袭，并对北越的军事和经济目标进行了攻击和摧毁，以削弱北越对越南南方越共武装的支持。"
 
 svn.51.t:0 "美军与越共空军发生交火！"
 svn.51.d:0 "今日早晨，驻扎在印度支那的美国战机对越南北方发起空袭时遭到北越空军的拦截，双方战斗机发生激烈交火。"
 
 svn.52.t:0 "轰炸作战取得顺利！"
 svn.52.d:0 "我们轰炸越共据点的作战行动取得顺利，战机向目标投掷大量燃烧弹并将其化作一片火海。"
 
 svn.53.t:0 "轰炸作战遭到反制！"
 svn.53.d:0 "我们轰炸越共据点的作战行动没有达成预定目标！我军战斗机遭越共使用防空武器攻击，战机被迫撤离！"
 
 svn.55.t:0 "美军对越南和[FROM.GetName]边境发起空袭！"
 
 svn.56.t:0 "美军轰炸作战遭到反制！"
 
 svn.57.t:0 "[ROOT.GetName]境内的胡志明小径被摧毁！"
 svn.57.d:0 "在美军和南越军采取一系列军事行动后，隐藏在越南和[ROOT.GetName]边境上的越共秘密军事通道被摧毁，美军消灭了边境上的许多越共据点，并摧毁了运输通道。"
 
 svn.60.t:0 "越南沿海出现疑似越共分子据点"
 svn.60.d:0 "根据可靠的情报，越南沿海的某地出现了越共分子的根据地，最近经常袭扰我们驻军的越共武装分子可能就来自那里，然而该地区地形十分复杂，森林密布，山地险峻，空中轰炸可能难以对敌军造成破坏，唯一有效的攻击手段就是派出地面部队前去进行扫荡和攻击。"
 svn.60.a:0 "可以，派出部队试一试吧。"
 svn.60.b:0 "还是不要冒这个险。"
 
 
 svn.61.t:0 "平川派掀起武装叛乱！"
 svn.61.d:0 "一支平川派残余武装团体在湄公河三角洲发起叛乱，袭击了政府军警，有证据显示这支叛军可能受到了越共的支持。"
 
 svn.62.t:0 "平川派袭击平阳省种植园"
 
 svn.63.t:0 "毛泽东对越南局势发表看法"
 svn.63.d:0 "越南共和国吴廷琰政府镇压反对派的行为引起国际社会关注，其中便包括中国大陆的中国共产党政府，中共一直为越南共产党提供援助以反对吴廷琰。在最近的一次记者会上，中共领导人毛泽东对吴廷琰发表如下看法：\n\n为了支持吴廷琰镇压共产党，美军和美国政府不断地为吴廷琰提供援助，对吴廷琰政府作出承诺……但这些承诺是无穷尽的，吴廷琰政府的贪婪和无休止的需求，会耗尽美国的力量……这些援助承诺就像绞索，一个又一个地套在美国人的脖子上……"
 
 svn.64.t:0 "《丑陋的美国人》"
 svn.64.d:0 "美国作家尤金·伯迪克与美国海军军官威廉·莱德勒联合创作的小说《丑陋的美国人》在《星期六晚邮报》进行出版，书中直白地抨击了美国在亚洲和中东的外交政策，特别是尖锐批评了美国在越南的官员，认为他们对当地文化和人民缺乏基本的了解与尊重。尤金·伯迪克在书中直白地表示，他质疑美国军事援助越南共和国镇压共产主义的效果和成功的可能。"
 
 svn.65.t:0 "安置新村计划的提出"
 svn.65.d:0 "越南共和国总统吴廷琰在接待美国大使时，提出通过建设新村的方式，来对抗日益严峻的共产主义叛乱渗透。吴廷琰认为，通过将农村人口迁入具有军队保护的新定居点，可以隔离村民与越共之间的接触。"
 
 svn.66.t:0 "美军首次遭到越共武装分子袭击！"
 svn.66.d:0 "来自越南边和省的突发消息！美国军事顾问团驻扎在越南的军事基地遭到突然袭击！越共武装分子渗透进入军事基地，对正在休息的美军士兵开枪扫射，造成戴尔·R·布伊斯和切斯特·M·奥夫南两名美国军人死亡！这是首次美国士兵在越南被越共分子射杀的事件！"
 
 svn.67.t:0 "吴廷琰政府遭到公开反对！"
 svn.67.d:0 "十八名越南共和国官员签署公开的联合声明，反对吴廷琰总统进行独裁统治并要求改革！"
 
 svn.68.t:0 "打通前往南方的通道"
 svn.68.d:0 "打通前往南方的通道"
 
 
 
 svn.101.t:0 "西贡政府要求法国撤离越南！"
 svn.101.d:0 "来自西贡的消息。越南南方政府今日正式发布声明，要求尽快将法国的影响力排除出越南。西贡政府认为，虽然越南已经获得了自治，但巴黎在越南南方依然有大量的经济、政治和社会影响力，法国资本、法国官员和在法国受训的军人依旧影响着越南的方方面面，西贡政府宣称，他们将择日颁布一系列法案，将法国的残余影响力排除出去。"
 
 svn.102.t:0 "越南共和国正式建立！"
 svn.103.t:0 "越南南方今日正式举行公投，决定维持保大皇帝君主制，还是选择走向共和制。选举结果显示，绝大部分民族支持保大皇帝退位，建立共和国。"
 
 svn.103.t:0 "吴廷琰当选越南共和国总统！"
 svn.103.d:0 "越南共和国的首次总统选举落下帷幕，吴廷琰高票当选越南共和国总统！"
 
 svn.104.t:0 "西贡政府与和好教领导人会面"
 
 svn.105.t:0 "西贡政府与佛教僧侣会面"
 
 
 svn.106.t:0 "越南发生军事政变！"
 
 svn.107.t:0 "越南国民党崛起！"
 
 
 svn.108.t:0 "勤劳人为革命党宣布成立！"
 svn.108.d:0 "越南共和国总统吴廷琰正式宣布，成立以他为主席的勤劳人为革命党，简称勤劳党，以实现推断他的改革方案。"
 
 
 svn.109.t:0 "吴廷琰任命吴廷瑈为安全部长"
 
 svn.110.t:0 "西贡政府宣布希望与[ROOT.GetName]改善关系"
 
 svn.111.t:0 "西贡政府请求我国予以军事支援"
 
 svn.112.t:0 "[FROM.GetName]宣布向越南派兵！"
 
 svn.113.t:0 "[FROM.GetName]拒绝了我们的请求"
 
 svn.114.t:0 "西贡政府希望与东京、交趾等地实现合并"
 
 svn.115.t:0 "西贡政府与东京地区合并"
 
 svn.116.t:0 "法国拒绝了我们的请求"
 
 svn.120.t:0 "越军向溪山军事基地发起进攻"
 
 svn.121.t:0 "越军撤离溪山军事基地！"
 svn.121.d:0 "北越军队向溪山基地发起的大规模进攻以失败告终！在遭受惨烈的伤亡后，越共被迫狼狈地撤离溪山地带。"
 
 
 svn.999.t:0 "美国国会就东京湾事件进行听证会"
 
 svn.999.t:0 "美国国会正式通过东京湾决议案！"
 
 svn.999.t:0 "美国被曝在越南使用橙剂！"
 
 
 svn.999.t:0 "中华民国向越南派遣部队参战！"
 
 svn.999.t:0 "南韩向越南派遣部队参战！"
 
 svn.999.t:0 "菲律宾向越南派遣部队参战！"
 
 svn.999.t:0 "澳大利亚向越南派遣部队参战！"
 
 svn.999.t:0 "新西兰向越南派遣部队参战！"
 
 svn.999.t:0 "中华民国向越南派遣部队参战！"