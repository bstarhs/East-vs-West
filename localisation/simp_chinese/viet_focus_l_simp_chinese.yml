 VIN_output_revolution:0 "输出革命"
 VIN_output_revolution_desc:0 "东南亚人民数百年来一直处于帝国主义、地主资本以及右翼军阀的统治之下，现在东南亚人民已经掀起了反对帝国主义和走狗的统治，我们应当支持他们！"
 VIN_thai_revolution:0 "支持泰国共产党"
 VIN_thai_revolution_desc:0 "泰国人民正处在反动封建君主、右翼独裁军政府和他们的美帝主子统治下，现在是时候支持泰国民族解放运动争取自由了！"
 VIN_burma_revolution:0 "支持缅甸共产党"
 VIN_burma_revolution_desc:0 "缅甸人民正处在右翼独裁军政府统治下，现在是时候支持缅甸民族解放运动争取自由了！"
 VIN_malaya_revolution:0 "支持马来亚共产党"
 VIN_malaya_revolution_desc:0 "马来亚人民正处在反动封建君主、右翼独裁政府和他们的英美主子统治下，现在是时候支持马来亚民族解放运动争取自由了！"
 VIN_philippines_revolution:0 "支持菲律宾共产党"
 VIN_philippines_revolution_desc:0 "菲律宾人民正处在反动封建君主、右翼独裁政府和他们的英美主子统治下，现在是时候支持菲律宾民族解放运动争取自由了！"
 
 VIN_dev_economic:0 "经济发展"
 VIN_release_dong:0 "发行越南盾"
 VIN_early_landreform:0 "初步减租运动"
 VIN_advanced_landreform:0 "进一步土地改革"
 VIN_agri_cooperate:0 "农业合作社"
 VIN_agri_cooperate_desc:0 "合作社可以将分散的农户合并起来，在保留私人财产的情况下分享劳动工具。"
 
 VIN_soviet_mode:0 "苏联模式"
 VIN_collective_agri:0 "农业集体化"
 VIN_collective_agri_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 VIN_supress_religion:0 "压制宗教团体"
 VIN_supress_religion_desc:0 "宗教是精神的鸦片，他们除了代表封建阶级压迫人民一无是处，只有镇压宗教，才能推动人民接受社会主义意识形态。"
 VIN_supress_catholics:0 "镇压天主教"
 VIN_supress_hoahao:0 "镇压和好教与佛教"
 VIN_industrial_nationalized:0 "工业国有化"
 VIN_industrial_nationalized_desc:0 "在从资本主义社会过渡到共产主义社会之前，党和国家将以国有企业的形式管理我国的重要生产资料。"
 VIN_five_years_plan:0 "五年计划"
 VIN_planning_economic:0 "计划经济"
 VIN_planning_economic_desc:0 "我国仍然是一个落后的农业国家。要实现快速发展，必须统一现有的一切生产资料，有计划地使用和分配生产生活资料。"
 
 VIN_develop_agriculture:0 "发展农业"
 VIN_develop_agriculture_desc:0 "改善农业生产，不仅需要合理的土地制度，且需要先进的农业技术。水利、农药、化肥、配种和机械化，这些都是农业现代化不可缺少的。"
 VIN_expand_farmland:0 "扩大耕地"
 VIN_infrastruct:0 "发展基础设施"
 VIN_hydrodam:0 "发展水利设施"
 VIN_plantation:0 "鼓励经济作物 I"
 VIN_plantation2:0 "鼓励经济作物 II"
 VIN_plantation3:0 "鼓励经济作物 III"
 
 VIN_manufacture1:0 "发展制造业 I"
 VIN_manufacture1_desc:0 "在具备初步工业能力后，我们需要满足我们人民对生活消费品的需求。从纺织、食品、木制品和锅碗瓢盆开始。"
 VIN_manufacture2:0 "发展制造业 II"
 VIN_manufacture2_desc:0 "国际市场中较小的经济体所发展的基础轻工业通常包括食品加工、水泥、棉纺等直接与初级产业（农牧矿业）对接的行业。"
 VIN_manufacture3:0 "发展制造业 III"
 EGY_manufacture3_desc:0 "在具备进一步工业能力后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 VIN_manufacture4:0 "发展制造业 IV"
 EGY_manufacture4_desc:0 "在具备较为完善的工业能力后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 
 VIN_refineries:0 "发展冶金"
 VIN_docks:0 "发展造船"
 VIN_docks_desc:0 "我们与外国之间的贸易量不断扩大，需要更多的远洋船只来支持海上贸易，我们需要发展造船业，实现大型船只的自给自足。"
 VIN_plastics:0 "发展化工"
 VIN_plastics_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 VIN_consumer_manufacture:0 "发展消费品"
 VIN_autos_manufacture:0 "发展汽车制造"
 VIN_autos_manufacture_desc:0 "随着全球汽车产量增加和汽车技术的发展，汽车已不再是一种富人专属的奢侈品，而实进入中产阶层，成为一种重要的消费品。我国的汽车依然高度依赖进口，因此我们需要发展汽车工业，不仅是为了满足消费需求，也是为了让国家更快实现汽车国产、加速经济和工业发展。"
 VIN_electronics:0 "发展电子制造"
 VIN_electronics_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一，1948年ENIAC一条条电路板的运作标志着第三次科技革命的诞生。1960年代，随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。起初计算机只能帮助处理文书工作，但后期计算机有了更多功能，例如制图、传真、模拟和娱乐。计算机不仅可以帮助人们工作，对于80年代的许多国家来说，计算机还是经济腾飞的阶梯，亚洲的日本、韩国、台湾和中国大陆通过承接计算机制造业实现了经济的迅速增长。"
 VIN_hight_tech:0 "发展高新产业"
 
 
 VIN_airforce:0 "人民空军"
 VIN_buy_plane:0 "购买战斗机"
 VIN_buy_plane_desc:0 "我们目前没有自行生产战斗机的能力，但我们可以向友好国家购买现成的战斗机来建立我们的空军。"
 VIN_jet_1:0 "发展喷气机"
 VIN_jet_1_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 VIN_jet_2:0 "发展现代战斗机"
 VIN_jet_2_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 VIN_transfer:0 "发展运输机"
 VIN_transfer_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 VIN_bomber:0 "发展轰炸机"
 VIN_bomber_desc: "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 VIN_airbase:0 "空军基地 I"
 VIN_airbase_desc:0 "我们需要扩大机场和基础设施来承载我们的空军，以保护我们的领空。"
 VIN_airbase2:0 "空军基地 II"
 VIN_airbase2_desc:0 "我们需要扩大机场和基础设施来承载我们的空军，以保护我们的领空。"
 VIN_airborn:0 "发展空降部队"
 VIN_airborn_desc:0 "飞机航程和载荷的发展开辟了许多可能性。运输机可以在敌人战线的大后方投下一整个师的部队，在那里他们可以造成严重破坏。"
 
 VIN_navys:0 "人民海军"
 VIN_buy_ship:0 "购买水面舰艇"
 VIN_buy_ship_desc:0 "我们目前还没有建造舰船的能力，但我们可以向其他国家购买退役的舰艇。"
 VIN_light_ships:0 "发展轻型舰艇"
 VIN_light_ships_desc:0 "我们的海军刚刚起步，至少需要一些护卫舰和驱逐舰来保护我们的领海。"
 VIN_medium_ships:0 "发展中型舰艇"
 VIN_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 VIN_heavy_ships:0 "发展大型舰艇"
 VIN_heavy_ships_desc:0 "我们的海军已经成长壮大，我们需要发展可以搭载更多设备和飞机的大型舰艇来强化作战能力。"
 VIN_buy_submarines:0 "购买潜艇"
 VIN_buy_submarines_desc:0 "我们目前还没有建造潜艇的能力，但我们可以向其他国家购买退役的潜艇。"
 VIN_submarines:0 "发展潜艇"
 VIN_submarines_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 VIN_naval_base_hai_phong:0 "海防海军基地"
 VIN_marines_focus:0 "发展两栖部队"
 VIN_marines_focus_desc:0 "擅长两栖作战的部队越来越不可或缺。临时拼凑的手段、装备已经成为历史，我方海军陆战兵现在已接受相关训练并拥有专属登陆舰船支持。"
 
 VIN_buy_weapons:0 "购买外国武器"
 VIN_buy_weapons_desc:0 "我国的军事工业目前还很落后，没有自己生产军火的能力，但我们可以向其他国家购买退役的武器。"
 VIN_military_industry_1:0 "军事工业 I"
 VIN_military_industry_1_desc:0 "越南如果想要不再受到外国侵略者入侵，就必须重点发展自己的军事工业，而不再依赖外国援助。"
 VIN_military_industry_2:0 "军事工业 II"
 VIN_military_industry_2_desc:0 "二战后国际格局瞬息万变，我们需要进一步扩张我国的军工产能以保证武器装备的自给率。"
 VIN_artylery_focus:0 "发展炮兵"
 VIN_missile_techs:0 "发展导弹技术"
 VIN_military_industry_3:0 "军事工业 III"
 VIN_military_industry_3_desc:0 "新时代的武器装备更复杂、多样化且昂贵，唯有进一步扩张我国的军事工业，才能腾出足以敷用的产能奋起直追。"
 VIN_armors:0 "发展装甲部队"
 VIN_armors_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 VIN_mechanized:0 "发展机械化部队"
 VIN_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 VIN_develop_weapons:0 "成立装备发展部"
 VIN_develop_weapons_desc:0 "从步兵的头盔和背心，再到坦克上的火控系统和动力系统，先进的作战装备往往主导着战场。"