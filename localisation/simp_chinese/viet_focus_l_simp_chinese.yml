 VIN_maoism:0 "毛主义的崛起"
 VIN_maoism_desc:0 "来自中国共产党领袖毛泽东的政策为我们提供了宝贵的经验和理想的学习对象。中国政府所实行的文化革命、工人自治、群众路线和第三世界理论将成为我们走向共产主义的指路明灯。"
 VIN_china_teritorry_treaty:0 "中越领土条约"
 VIN_culture_revolution:0 "文化大革命"
 VIN_culture_revolution_desc:0 "毛泽东认为，革命不止需要政治、经济、社会的革命，同时需要文化的革命，将旧时代的宗教和文化影响从我们的思维方式中去除，才能彻底将反革命的元素从我们的社会当中去除，并创造一个革命的、进步的社会。"
 VIN_workers_communie:0 "工人委员会体制"
 VIN_workers_communie_desc:0 "文化的革命时期的中国，所有企业都成立了工人委员会，工人们以民主形式直接参与工厂的管理和决策，委员会的成员由选举产生，他们不仅参与管理，并且也要参与工作。"
 
