 nuke_dest_title:0 "战略武器指挥中心"
 nuke_dest_current_nuke:0 "现有核弹: §Y[?num_of_nukes]"
 DEFCON:0 "战备状态"
 nuke_unaviliable_text:0 "战略武器系统现在不能使用！\n要使用战略武器，你必须：\n已经研发核武器并拥有至少10枚核弹"
 nuke_limit_num:0 "核武库上限: §Y[?nukes_limit]"
 nuke_limit_num_text:0 "核武库上限是你可以拥有最多核弹的限制，当你生产核弹超过这个限制，生产效率就会清零，停止生产。你可以通过研究科技或增加核武库决议增加这个上限，但可能会增加全球紧张度。"
 nuke_deterrence:0 "核威慑: §Y[?nuke_deterrence]§W"
 nuke_deterrence_text:0 "核威慑是你的核武器对敌对国家产生威吓的能力。你的核威慑能力越高，对方越不敢对你使用核武器，反之如果过低，核大国将更多的对你使用军事威胁。"
 nuke_base_num:0 "待命发射基地:§Y[?nuke_base_num]§W\n待命战略轰炸机联队:§Y[?num_deployed_strat_bomber]§W\n损坏基地:§Y[?damaged_nuke_base_num]§W\n\n最远攻击范围:§Y[?nuke_distance]§W"
 nuke_base_text:0 "这里展示你可以指挥的核武器发射基地数量，包括导弹发射井和轰炸机中队。\n每5架战略轰炸机算一个基地，每个导弹基地算一个基地，\n每次发射核武器都会使部分核武基地进入休整状态，无法使用\n如果这些单位被摧毁殆尽，你将无法发射核弹。"
 launch_tips:0 "点击朝该地区发射核弹\n你需要：\n   与该国§Y处于交战状态§W\n   至少拥有§Y5§W玫核弹\n   至少拥有§Y5§W个待命发射单位\n   该地区在§Y洲际导弹§W或者§Y战略轰炸机§W的§Y最远航程§W范围内\n  或者有我方§Y战略核潜艇§W在附近海域\n     §R“我的元首！我会飞辣！！！！”§W"
 nuke_state_name:0 "[THIS.GetName]已完成核武器研究"
 current_nuke_production:0 "核武器生产效率：[?nuke_produc_speed]"
 edit_nuke_production:0 "点击此处增加/修改核武器生产速度，上限是[?nuke_produc_max]\n这将增加军事支出\n若无法修改，尝试改变军事法案"
 nuclear_planes_num:0 "可用战略轰炸机中队:§Y[?num_deployed_planes_with_type@strat_bomber_equipment]\n§W可用战略导弹基地:§Y[?nuke_base_num]"
