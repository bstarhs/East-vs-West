 nuclear_fusion:0 "核聚变"
 nuclear_fusion_desc:0 "核聚变是指当两个原子核发生结合时，就会释放出能量。我们头顶上的太阳之所以会发光发热，就是因为大量的氢原子因为太阳的巨大质量，被引力吸引并结合，从而产生能量。如果人类能够人为地将原子核结合，就能取得如同太阳一般巨大的能量。"
 LiD6:0 "氢同位素制取"
 LiD6_desc:0 "人为制造核聚变需要能够发生聚变反应的核装料，例如氘化锂-6或其他氢同位素。"
 Enriched_Uranium:0 "浓缩铀制取"
 Enriched_Uranium_desc:0 "天然铀矿中包含的铀元素含量极低，大部分是低含量的铀-238，他会吸收掉铀-235裂变后释放出的中子，从而导致链式反应无法有效发生。要获得核燃料级别的铀-235，必须进行复杂且繁重的提纯过程。"
 Plutonium_techs:0 "同位素钚制取"
 Plutonium_techs_desc:0 "钚-239是一种通过将中子放入铀而获得的放射性材料，它可以与低纯度的铀元素发生裂变反应，胖子原子弹就是通过这种方式实现引爆，他使得原子弹的制造不再需要高纯度的铀矿，但同样是一种极为复杂的技术。"
 fat_man:0 "内爆式钚弹"
 fat_man_desc:0 "使用内爆式钚弹结构的胖子原子弹，威力远大于小男孩。将钚燃料放在一块大铁球中间，在铁球周边安装炸药，炸药在爆炸时产生的内爆压力将挤压钚燃料使其发生链式反应并引爆。"
 breeder_reactor:0 "快中子增殖反应"
 nuke_Centrifuge:0 "改进六氟化铀离心机"
 nuke_Centrifuge_desc:0 "高速旋转的离心机可以用于提高铀的纯度。将纯度不足的铀材料与氟气反应，形成六氟化铀气体，注入离心机中进行提取。"
 nuke_moderator:0 "中子减速剂"
 nuke_moderator_desc:0 "中子减速剂是指可以减缓核控制核裂变、核聚变的材料，例如石墨、水和重水，可以阻挡中子撞击其他原子核的频率来达到人为控制核裂变的用途，是人类运用核技术，尤其是和能源的重要材料。"
 nuke_11111:0 "水下核试验"
