l_simp_chinese:
 CHI_prepare_civil_war:0 "動員戡亂"
 CHI_prepare_civil_war_desc:0 "我們與共匪分子之間的一切和平都已不再可能，中華民國不能也不再會容忍赤色分子的存在！我們將以軍事力量消滅共軍，統一全國！"
 CHI_american_aid:0 "美國援助"
 CHI_american_aid_desc:0 "美國將向我們提供軍事武器裝備以對抗共軍。"
 CHI_military:0 "整治軍事"
 CHI_military_desc:0 "抗日戰爭和剿共初期的軍事失利暴露了國軍目前存在一系列嚴重問題。我們的軍官能力不足，我們的軍事體系不夠完善，後方還有許多貪腐官僚危害軍事工作，這些事情都需要儘快處理。"
 CHI_politic:0 "整頓政治"
 CHI_politic_desc:0 "自從國民政府成立以來，中華民國便處於中國國民黨的訓政之下，以開民智和推廣三民主義，但一黨執政也帶來了許多問題，貪汙腐敗嚴重，行政效率低下，我們需要重新整頓政治，改革行政體系，重建一個有政治力量的國民黨和國民政府，以對抗共黨的政治滲透。"
 CHI_economic:0 "整頓經濟"
 CHI_economic_desc:0 "抗日戰爭幾乎完全摧毀了中國的經濟。物資匱乏，物價飛漲，金融混亂，黑市猖獗……如果不儘快恢復經濟秩序，剿匪無從談起。"
 CHI_gold_currency:0 "發行金圓券"
 CHI_gold_currency_desc:0 "法幣正在以極快的速度貶值，幾乎已經失去了信用，以至於群衆在市場上大量搶購和積壓黃金，這不利於我們整頓金融秩序。我們需要發行新的貨幣，以代替法幣，同時利用行政命令强制收購民間流通的黃金。"
 CHI_shanghai_affair:0 "打擊金融寡頭"
 CHI_shanghai_affair_desc:0 "在黨國整頓金融以對抗共軍的時候，一些貪婪的金融和實業巨頭卻在後方操縱市場，破化金融秩序，必須予以嚴厲整頓，以穩定市場，提高政府威信。"
 CHI_anti_communism:0 "打擊親共分子"
 CHI_anti_communism_desc:0 "共黨分子大肆滲透，在社會各界安插匪諜，製造社會動蕩，煽動學生示威游行，必須予以重拳出擊！"
 CHI_intellegence:0 "强化中央統計局"
 CHI_intellegence_desc:0 "中央統計局將吸收精英情治人員，對抗匪諜滲透。"
 CHI_constitution:0 "行憲"
 CHI_constitution_desc:0 "根據先總理孫中山先生之規劃，在軍政、訓政之後，便是憲政。制定中華民國憲法，以國民大會民主選舉中華民國總統，是完成國民革命的最後一步。儘管我國依然處於與共軍的戰爭之中，但爲了穩定民心，提高國民及國際社會對我黨我政府之信任，行憲將照常進行。"
 CHI_anti_parties:0 "打擊反對黨"
 CHI_anti_parties_desc:0 "一些所謂的民主人士和進步人士，與共黨勾結，建立反對組織，干擾政治運作，必須進行懲戒！"
 CHI_national_parliament:0 "組織國民大會"
 CHI_national_parliament_desc:0 "國民大會是中華民國行憲後的立法機關，國民大會代表將選舉行憲后的第一任中華民國總統。"
 CHI_president_chiang:0 "總統蔣中正"
 CHI_president_chiang_desc:0 "蔣中正先生，自國民革命開始以來，陪伴先總理左右，在北伐、剿共、抗戰中立下赫赫戰功，乃黨國之棟梁和國民一致推從之領袖。選舉蔣先生為總統，衆望所歸。"
 CHI_president_li:0 "總統李宗仁"
 CHI_president_li_desc:0 "蔣中正就任總統一事并未得到所有國大代表的認可，李宗仁先生擁有不亞於蔣中正的人望，且與國軍各將領乃至中共都有良好關係。選舉李宗仁先生為總統，可以更好地結束内戰，統一全國。"
 CHI_chiang_worship:0 "蔣中正崇拜"
 CHI_chiang_worship_desc:0 "為統一全國思想，我們應該將蔣總統奉作「民族英雄」、「民族救星」，並大力宣揚蔣的政績與成就，實行黨國體制的個人崇拜，以統一全國上下思想，"
 CHI_sanqing:0 "三民主義青年團"
 CHI_sanqing_desc:0 "三民主義青年團，簡稱三青團，是由中國國民黨領導的青年組織，我們應該在三青團中加大反共宣傳力度，提拔反共青年，確保未來青年與我們保持一致"
 CHI_yuan:0 "改組行政院"
 CHI_yuan_desc:0 "行政院將在中華民國行憲后，完全掌握管理行政、經濟和發展事務，因此需要進行重新改組，裁撤低效的部門，清楚無能的腐敗官員，任用新的行政人才，提高行政效率。"
 CHI_anti_spies:0 "排查共諜"
 CHI_anti_spies_desc:0 "共匪滲透日益猖獗，全體國民務必保持警惕，支援協助反共防共！私通共匪可判死刑！凡舉報匪諜著重獎勵！"
 CHI_command_support:0 "支援剿共前綫"
 CHI_command_support_desc:0 "剿共戰事日益焦灼，後方各地區必須盡力提供一切可調遣之物資和人力支援前綫！"
 CHI_civilwar_law:0 "動員戡亂臨時條款"
 CHI_civilwar_law_desc:0 "反共戰爭日益艱難，在這一特殊局面下，行憲已不可行。爲了動員一切的政治力量，我們必須中止部分憲法條款，新的動員戡亂臨時條款將允許我們的司法機構為一切有利於軍事行動的決策開綠燈。"
 CHI_manoo:0 "壮丁"
 CHI_manoo_desc:0 "反共抗俄救國，國民皆有責任。一切青壯年男性都必須義務入伍服役，為保衛中華民國而戰！"
 CHI_amries_rebuild:0 "部隊作戰素質建設"
 CHI_amries_rebuild_desc:0 "煙不吃 酒不喝 不使爹娘挂心 不使長官生氣"
 CHI_homeland_group:0 "還鄉團"
 CHI_homeland_group_desc:0 "赤色分子在匪區，以土地改革之名，行掠奪農地之實，許多人口因被奪取土地而外逃，他們對共匪及其擁躉有血海深仇，他們正好可以成爲我們的有力兵員，將他們武裝起來，讓他們討回自己的財產。"
 CHI_security_group:0 "保安團"
 CHI_security_group_desc:0 "共匪武裝在廣大農村地區生根發芽，爲了維護農村治安，對抗匪諜滲透，需要把農村裏的男丁組織起來，組建民團進行治安維護。"
 CHI_Defence_ministry:0 "建立國防部"
 CHI_Defence_ministry_desc:0 "軍閥政治禍害已久，將全國所有武裝力量統一起來，集中指揮，才能建立一支完善的、有力的國防武裝。"
 CHI_anti_warlord:0 "打擊軍閥"
 CHI_anti_warlord_desc:0 "李宗仁、閻錫山、馬步芳、盧漢等地方軍閥，依然保持著對地方省的武裝力量的控制，這種軍閥格局的局面必須結束。通電各地，各省軍政公署必須上交軍事指揮權于國防部統一指揮！"
 CHI_american_weapon:0 "美式裝備"
 CHI_american_weapon_desc:0 "我就是喜歡這美式軍服的小翻領，到底是民主國家，軍服都給你講道理，讓你的脖子享受自由，不受束縛。"
 CHI_diplomatic:0 "外交政策"
 CHI_diplomatic_desc:0 "我們必須開展外交工作，爭取自由世界對我們反共抗俄戰爭的支持。"
 CHI_gold_trensport:0 "轉移黃金儲備"
 CHI_gold_trensport_desc:0 "大陸戰綫全面崩潰，撤往台灣已是我們唯一的選擇，我們必須儘快將大陸的黃金儲備向台灣遷移，以確保政府遷台后有足夠的貴金屬支撐政府經濟政策。"
 CHI_gold_trensport_tool:0 "在完成§Y遷往台灣§W國策后，立刻獲得§Y800§W政治點數。在之後台灣國策樹中的經濟相關國策完成後，都可以獲得一定數量的政治點數補償。"
 CHI_xuzhou_defence:0 "徐州防綫"
 CHI_xuzhou_defence_desc:0 "徐州地方，歷代大規模征戰，五十餘次，是非曲直，難以論説。但史家無不注意到，正是在這個古戰場上，決定了多少代王朝的盛衰興亡，此興彼落，所以古來就有穩定中原之說。共軍已近抵蘇魯邊界，京滬告急，我們必須儘快在徐州進行戰略部署，阻擋共軍進一步南下。"
 CHI_worlord_state:0 "向軍閥讓步"
 CHI_worlord_state_desc:0 "目前全國各地的地方軍事長官，對本省的軍政大權依然牢牢掌握，蔣馮閻中原混戰的歷史教訓告訴我們，動用武力强行收復中央軍事權力，只會適得其反，也許應當適當做出妥協，以軍權換取地方軍閥承認南京中央政府，待剿匪結束，再以政治手段實現統一。"
 CHI_negotiation:0 "与中共和談"
 CHI_negotiation_desc:0 "内戰多年，百姓流離失所，國民生靈塗炭。我們已經沒有繼續戰事的能力，而共軍似乎也無力再繼續進犯，也許早日實現和談，尋求和平，才是最好的出路。"
 CHI_sov_negotiation:0 "与蘇俄交涉"
 CHI_to_canton:0 "遷都廣州"
 CHI_to_canton_desc:0 "共軍已越過黃河，威脅兩淮，南京已不安全，需要儘快將行政軍政機關向廣州撤離。"
 CHI_indus_to_south:0 "工業南遷"
 CHI_indus_to_south_desc:0 "共軍進犯長江流域在即，我們需要儘快將長江地區的工業設備和人員向南撤離，以重建反共經濟大後方。"
 CHI_southern_army:0 "華南軍政公署"
 CHI_southern_army_desc:0 "隨著國民政府遷至廣州，我們需要在華南建立一個穩定的政治環境，來服務新的國民政府。廣州依然有許多混雜的親共、親蔣勢力，不服從與李宗仁總統，因此我們需要建立一個新的軍政公署，主張華南軍政大權。"
 CHI_southern_base:0 "强化南方防禦"
 CHI_southern_base_desc:0 "共軍已開始進犯湘、贛、閩三地，兩廣告急，我們必須儘快進行戰略部署，阻擋共軍進一步南下。"
 CHI_canton_army:0 "扶持粵軍桂軍"
 CHI_canton_army_desc:0 "兩廣自古尚武好戰，十九路軍、第十一集團軍在抗日戰場上立下赫赫戰功，如今共軍已近抵華南，我們需要儘快從廣東、廣西徵募軍人，以保家衛國。"
 CHI_canton_gov:0 "廣州國民政府"
 CHI_canton_gov_desc:0 "京滬已處於共軍威脅之下，我們必須儘快將黨政軍機關遷往廣州。"
 CHI_river_devide:0 "划江而治"
 CHI_river_devide_desc:0 "我們必須無奈接受事實，共黨控制長江以北已無法改變，"
 
 CHI_bureau_gov:0 "文官政府"
 
 CHI_strengh_admirate:0 "强化行政院的權力"
 CHI_strengh_admirate_desc:0 "軍政時期已結束，憲政時期，應限制軍人之權利，而將治國政策方針交由技術官僚定奪。"
 CHI_kmt_propaganda:0 "宣傳政策"
 CHI_kmt_propaganda_desc:0 "反共建國，不僅有激烈的前綫軍事作戰、暗處的情報反諜作戰，宣傳作戰同樣重要。宣揚三民主義、抨擊共黨謬論，爭取民衆支持，推動政策實行，都依賴有效的宣傳和理論工作。"
 
 CHI_political_reform:0 "政治改革的嘗試"
 CHI_release_crimes:0 "釋放政治犯"
 CHI_taken_politicians:0 "拉攏騎墻政客"
 CHI_contact_minor:0 "接觸少數民族"
 
 CHI_navy:0 "建設海軍"
 CHI_navy_desc:0 "東北戰事焦灼，侵占旅順之蘇俄軍隊蠢蠢欲動，我們需要一直海上力量來保護向東北方面提供支援的海上生命綫。"
 CHI_air_force:0 "建設空軍"
 CHI_air_force_desc:0 "空中支援將有力支持剿共作戰前綫。"
 CHI_marines:0 "海軍陸戰隊"
 CHI_asian_alliance:0 "亞洲反共壁壘"
 CHI_free_world:0 "自由世界"
 CHI_free_world_desc:0 "共匪野心膨脹，在世界各國挑起戰火，但這也意味著將有更多對抗共產主義侵略的自由國家與我們站在同一陣綫。"
 
 CHI_to_taiwan:0 "政府迁台"
 CHI_to_taiwan_desc:0 "此時此刻，我必定悲傷不堪嗎？以爲我必定，有説不出的遺憾嗎？我内心最不堪忍受的，是我此去死無葬身之所啊。看來我不得不離開南京離開我親手創建的首都不得不離開先總理陵墓所在之地了。"
 
 CHI_annex_north:0 "統合华北剿总"
 CHI_annex_north_desc:0 "華北剿共戰事已取得初步勝利，我們將要求華北剿匪司令部向南京中央政府交出華北地區的軍政權力，實現全國統一。"
 CHI_annex_northeast:0 "統合东北剿总"
 CHI_annex_northeast_desc:0 "東北剿共戰事已取得初步勝利，我們將要求東北剿匪司令部向南京中央政府交出東北地區的軍政權力，實現全國統一。"
 CHI_annex_yunnan:0 "統合雲南方面"
 CHI_annex_yunnan_desc:0 "西南剿共戰事已取得初步勝利，我們將要求雲南軍政公署向南京中央政府交出西南地區的軍政權力，實現全國統一。"
 CHI_war_sinjang:0 "镇压三区叛乱"
 CHI_war_sinjang_desc:0 "蘇俄支持下之僞東突厥斯坦國占據新疆北部，鼓吹突厥民族主義，殘酷鎮壓漢人同胞，分裂國家，現剿共戰爭進入尾聲，我們將收復最後一塊被赤匪占據之國土。"
 CHI_annex_gansu:0 "統合西北方面"
 CHI_annex_gansu_desc:0 "西南陝西、甘肅與寧夏之剿共戰事已取得初步勝利，我們將要求西北軍政公署向南京中央政府交出地區的軍政權力，實現全國統一。"
 CHI_suply_focus:0 "改革軍事後勤體系"
 CHI_suply_focus_desc:0 "我們需要建設更加完善之軍事後勤調度體系，以保障前綫所需之人、物、財。"
 CHI_militarist_court:0 "設立軍事法庭"
 CHI_militarist_court_desc:0 "在積極支持前綫戰事之時，萬不可忽略後方戰綫。軍中瀆職失責者、通敵投共者、出賣情報者及其餘危害剿共作戰之人，必須以軍法嚴肅懲戒之。"
 CHI_militarist_corrupt:0 "懲處軍隊中的腐敗"
 CHI_militarist_corrupt_desc:0 "國軍之中存在嚴重的腐敗狀況，高級軍官尸位素餐，中下軍官作戰不力乃至倒賣軍火，大有人在，這無疑極大地危害黨國剿匪乃至統治基礎，必須嚴懲不貸。"
 
 CHI_indus_yangtze:0 "投資长三角工業基地"
 CHI_indus_yangtze_desc:0 "我們需要儘快將京滬、浙、蘇等地的工業重建並擴大，以提供足夠的生活物資穩定市場和供給前綫。"
 CHI_indus_wuhan:0 "投資武汉工業基地"
 CHI_indus_wuhan_desc:0 "我們需要儘快將湖北的工業重建並擴大，以提供足夠的生活物資穩定市場和供給前綫。"
 CHI_indus_sichuan:0 "投資川渝工業基地"
 CHI_indus_sichuan_desc:0 "我們需要儘快將川渝地區的工業重建並擴大，以提供足夠的生活物資穩定市場和供給前綫。"
 CHI_indus_canton:0 "投資華南工業基地"
 CHI_indus_canton_desc:0 "我們需要儘快將華南地區的工業重建並擴大，以提供足夠的生活物資穩定市場和供給前綫。"
 CHI_indus_yunnan:0 "投資西南工業基地"
 CHI_indus_yunnan_desc:0 "我們需要儘快將滇、貴兩地的工業重建並擴大，以提供足夠的生活物資穩定市場和供給前綫。"
 
 CHI_tax_reduce_mainland:0 "二五减租"
 CHI_tax_reduce_mainland_desc:0 "共匪將土地改革作爲其爭取群衆支持的重要手段，如要在農村地區與共黨爭奪，我們亦必須開始我們自己的土地改革政策。"
 CHI_special_court:0 "特种军事法庭"
 CHI_lijia:0 "加强保甲制度"
 CHI_lijia_desc:0 "爲了鞏固從共軍手中光復之土地，同時維護現有國軍控制區的穩定，我們需要擴大和完善保甲制度，支持民衆互相協調，自我保護，防共抗共。"
 CHI_legisltive:0 "组织立法院"
 CHI_legisltive_desc:0 "根據先總理中山先生生前所設之五權分立憲法，中華民國行憲后，立法院將全權負責我國立法大權，同時在國家穩定之前，具有選舉中華民國總統之權能。"
 CHI_new_social:0 "新生活运动"
 
 CHI_militarist_police:0 "設立憲兵"
 CHI_militarist_police_desc:0 "國軍憲兵將形式軍隊内部作風和紀律監督，保障軍隊紀律實行，同時管理社會秩序管理之權能。"
 CHI_stabilits:0 "穩定匪區秩序"
 CHI_stabilits_desc:0 "國軍光復共匪占領區后，仍有部分殘餘負隅頑抗，另有許多民衆對黨國治理迷茫和質疑。我們需要從第一次剿匪戰爭中吸取教訓，暴力的鎮壓機關已不適合，我們需要更加專業且有效的治理機構來管理這些地區，維護社會穩定，促進當地發展，爭取群衆認可，瓦解共黨威信。"
 CHI_try_land_reform:0 "嘗試土地改革"
 CHI_try_land_reform_desc:0 "我們在二五減租中進行的初步土地政策取得了成功，現在我們將會把自己的土地改革政策，向剛剛收復的共軍占領區推廣，以證明三民主義之下的平均地權政策要遠遠優於共黨欺騙性的土地共產。"
 CHI_more_land_reform:0 "進一步土地改革"
 CHI_more_land_reform_desc:0 "土地改革政策取得初步成功，我們將進一步向更多地區推廣實行。"
 CHI_win_war:0 "戡亂剿匪宣告成功"
 CHI_win_war_desc:0 "國軍勢如破竹，共匪倉皇逃串，蘇俄侵略陰謀破裂，青天白日國旗，終於照耀在中華民國的每一寸土地。共產匪徒發起紅色叛亂二十年後，終於以敗逃告終，先總理統一中華之遺願得以實現。中華民國萬歲！三民主義萬歲！"
 
