l_simp_chinese:
 mad.1.t:0 "马达加斯加起义！"
 mad.1.d:0 "一群马达加斯加叛军袭击了该地区的多座种植园。叛军声称来自马达加斯加人民解放运动，该运动的目标是将所有法国人驱逐出马达加斯加。根据我们的调查，这些叛军在农村地区很有影响力，可能受到共产主义的影响。"
 mad.1.a:0 "去殖民化运动正在发展。"
 
 mad.2.t:0 "马达加斯加暴动！"
 mad.2.d:0 "马达加斯加叛军组织起一支武装部队，向我们发动袭击！"
 mad.2.a:0 "Foda-se comunista!"
 
 mad.3.t:0 "[FROM.GetName]被镇压"
 mad.3.d:0 "在法国军队的大力镇压下，[FROM.GetName]领导的武装被击溃，幸存者被迫转入地下。"
 mad.3.a:0 "知道了。"
 
 mad.4.t:0 "马达加斯加独立战争爆发！"
 mad.4.d:0 "随着马达加斯加独立武装发起对法国据点的全面攻击，马达加斯加独立战争宣告开始！马达加斯加人民解放运动、马达加斯加民族解放阵线和争取马达加斯加全面独立联盟的领导人宣布，将国家从法国人三百多年统治下解放出来的时机已到。法国政府发表强硬的公告，宣布不惜一切代价守住马达加斯加！"
 mad.4.a:0 "知道了。"