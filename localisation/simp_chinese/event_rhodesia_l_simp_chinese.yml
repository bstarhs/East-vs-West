l_simp_chinese:
 rho.1.t:0 "罗德西亚合并提案"
 
 rho.2.t:0 "罗德西亚联邦议案的正式提出"
 rho.2.a:0 "把他交给威斯特敏斯特宫吧"
 
 rho.3.t:0 "罗德西亚联邦议案得到英国支持"
 rho.3.d:0 "将南、北罗得西亚和尼亚萨兰三个殖民地合并为一个联邦的议案，在英国国会得到了大多数议员，尤其是保守党的支持，因而顺利通过。"
 
 rho.4.t:0 "罗德西亚联邦议案被伦敦拒绝"
 rho.4.d:0 "将南、北罗得西亚和尼亚萨兰三个殖民地合并为一个联邦的议案，在英国国会得到了大多数议员，尤其是工党的反对，因而未能通过。"
 
 rho.12.t:0 "英国宣布合并罗德西亚与尼亚萨兰殖民地！"
 rho.12.d:0 "英国殖民部宣布，支持英国在非洲的南罗得西亚、北罗得西亚和尼亚萨兰三个殖民地合并为联邦，从而打造一个发达而繁荣的国家以对抗去殖民运动。"
 
 rho.13.t:0 "罗德西亚与尼亚萨兰联邦的首次大选！"
 rho.13.d:0 "罗德西亚与尼亚萨兰联邦举行联邦合并后的首次大选，罗德西亚联邦党成功取得多数席位。"
 
 rho.14.t:0 "戈德弗雷·哈金斯总理的演讲"
 rho.14.d:0 "罗德西亚与尼亚萨兰联邦的成立，遭到了许多黑人族裔及反殖民人士的反对，尤其是他们担心，联邦会将资源优先集中于更富于的南罗得西亚，以及南罗得西亚的白人人口，而其他地区和其他族裔遭到不公正对待。对此，戈德弗雷·哈金斯总理对记者表示：\n你不能指望欧洲人会和那些肮脏的人排成一排，他们可能是一个老妇人，背上还抱着婴儿，哭哭啼啼、呕吐不止，把一切都弄得一团糟……任何人都可以清楚地看到，目前我们在南罗得西亚实行的制度是双方最满意的，而且在非洲人民的尊敬的领导人稍微清理一下他们的非洲兄弟之前，改变这一制度肯定是不可能的；到那时，我们或许可以考虑改变。"
 
 rho.16.t:0 "罗德西亚与尼亚萨兰寻求自治领地位"
 rho.16.d:0 "罗德西亚与尼亚萨兰寻求自治领地位"
 
 rho.17.t:0 "罗德西亚与尼亚萨兰未能获得自治领地位"
 rho.17.d:0 "罗德西亚与尼亚萨兰政府向伦敦提出获得自治领地位以获得更进一步的自治权，但英国国会内的部分议员不相信联邦能够妥善处理内部的黑人民权问题和地方发展问题，因而作罢。"
 
 rho.18.t:0 "罗德西亚与尼亚萨兰获得自治领地位"
 
 rho.19.t:0 "戈德弗雷·哈金斯辞职"
 rho.19.d:0 "由于未能为罗德西亚和尼亚萨兰联邦取得进一步的自治权，戈德弗雷·哈金斯总理宣布引咎辞职。罗兰·韦伦斯基宣布接任罗德西亚总理。"
 
 rho.20.t:0 "罗德西亚联邦引起黑人民族主义者不满！"
 rho.20.d:0 "罗德西亚与尼亚萨兰联邦的成立，遭到了许多黑人族裔及反殖民人士的反对，尤其是他们担心，联邦会将资源优先集中于更富于的南罗得西亚，以及南罗得西亚的白人人口，而其他地区和其他族裔遭到不公正对待。"
 
 rho.21.t:0 "尼亚萨兰大会党抨击联邦的成立"
 rho.21.d:0 "罗德西亚联邦遭到了尼亚萨兰民众的强烈抵制，不论白人还是黑人，都不希望被萨利斯布里当局吞并，因为尼亚萨兰的经济依赖农业，他们担心联邦将把尼亚萨兰变成单纯的原材料供应地，遏制这里的发展。\n尼亚萨兰大会党成立于1930年代，他们是非洲最早的黑人反殖民团体之一，现在他们是第一个站出来反对联邦的团体。大会党领袖发起集会，反对尼亚萨兰和罗德西亚联邦。"
 
 rho.22.t:0 "苏伊士运河战争的影响"
 rho.22.d:0 "英国在苏伊士运河战争中的大败，彻底改变了国际地缘政治，反殖民主义在英国迅速抬头，成为主流观点。在这种背景下，罗德西亚和尼亚萨兰联邦的地位就显得十分尴尬了。罗德西亚与尼亚萨兰联邦的体制问题，欧洲民主早已有所耳闻，媒体对联邦是否能做到公平对待尼亚萨兰地区，以及黑人民众提出的质疑越来越多。\n尼亚萨兰大会党及各大黑人团体意识到这是一个机会，开始向伦敦的政客们派出游说团体，希望能争取国际社会对联邦不平等问题的关注。"
 
 rho.23.t:0 "尼亚萨兰要求获得自治权"
 
 rho.24.t:0 "尼亚萨兰实现自治！"
 
 rho.25.t:0 "尼亚萨兰大会党发起不合作运动！"
 rho.25.d:0 "在多次与萨利斯布里方面进行谈判而未能成功后，尼亚萨兰大会党宣布发起不合作运动！尼亚萨兰多地爆发示威游行、抗议和大规模罢工！首府布兰太尔的电车和工厂停运，夏尔高地的烟草种植园的工人拒绝工作，宗巴、利隆圭等地的群众也愤怒地包围了市政机构。"
 
 rho.26.t:0 "卡穆斯·班达回到尼亚萨兰！"
 rho.26.d:0 "尼亚萨兰大会党领导人卡穆斯·班达从伦敦回到尼亚萨兰，领导抗议运动！"
 
 rho.27.t:0 "赞比亚大会党成立！"
 rho.27.d:0 "在尼亚萨兰爆发大规模抗议运动后，北罗得西亚也爆发了反对联邦的政治运动！以卡翁达为首的北罗得西亚黑人民族主义政治家宣布成立赞比亚大会党。卡翁达表示，北罗德西亚是一个带有殖民主义色彩的名称，他们拒绝使用西塞尔·罗德斯的名字称呼这片土地，主张将北罗得西亚更名为赞比亚，即流过这片土地的赞比西河。"
 
 
 rho.28.t:0 "尼亚萨兰局势持续恶化"
 rho.28.d:0 "尼亚萨兰的大规模抗议运动开始朝暴力发展，示威者包围了布兰太尔的市政大楼，与警察爆发激烈冲突。"
 
 rho.29.t:0 "布兰太尔的动荡……"
 rho.29.d:0 "尼亚萨兰的大规模抗议运动开始朝暴力发展，示威者包围了布兰太尔的市政大楼，与警察爆发激烈冲突。\n暴徒的情绪愈发激动，行为愈发极端，甚至叫嚣要杀死布兰太尔的所有白人……"
 
 rho.30.t:0 "尼亚萨兰进入紧急状态！"
 rho.30.d:0 "来自布兰太尔的消息！罗德西亚当局宣布，尼亚萨兰进入紧急状态，以镇压愈演愈烈的示威游行运动！军警迅速接管了布兰太尔、宗巴和利隆圭等地的社会机关，并把守重要位置，示威游行被警棍和水炮驱散，大量示威者被捕。"
 
 rho.31.t:0 "尼亚萨兰大会党被封杀！"
 rho.31.d:0 "罗德西亚当局正式宣布，尼亚萨兰大会党涉嫌煽动暴力事件和叛乱，从即日起禁止大会党的所有活动，并立刻下令逮捕大会党领导人！"
 
 rho.32.t:0 "英国谴责罗德西亚的紧急状态"