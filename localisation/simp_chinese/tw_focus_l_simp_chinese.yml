l_simp_chinese:
 CHI_12341341:0 "外交政策"
 CHI_12341341:0 "十九點財政改革措施"
 CHI_12341341:0 "成功嶺上"
 CHI_12341341:0 "發展塑化產業"
 CHI_12341341:0 "發展醫療衛生"
 CHI_12341341:0 "革命實踐研究院"
 
 CHI_natives_community:0 "建設山胞新村"
 CHI_natives_community_desc:0 "台灣山地地區的原住民同胞，依然生活在欠發達的環境當中，爲了爭取原住民山胞對我黨我政府之認同與支持，應當撥款提携山胞，建設現代化的新社區，投資支持其教育、醫療與生活環境的進步。"
 CHI_develop_sugar:0 "發展經濟作物"
 CHI_develop_sugar_desc:0 "在台灣走向工業化之前的很長一段時間内，經濟作物將仍然是本省主要的經濟產業，包括糖業、鹽業和茶業，利用日本人留下的產業基礎和美國人提供的新技術，我們將繼續投資台灣的經濟作物發展和出口，為未來的工業化賺取第一桶金。"
 CHI_house_project:0 "興修國民住宅條例"
 CHI_house_project_desc:0 "大量來自大陸的眷屬和災胞流亡台灣，居住問題成爲我們急需解決的問題。"
 CHI_uneployee_officers_comittee:0 "退除役官兵輔導委員會"
 CHI_uneployee_officers_comittee_desc:0 "大量從軍中退役退伍的國軍將士，他們的退休生活需要保障。退除役官兵輔導委員會和榮民委員會將由國防部撥款，成立榮民相關工作之機構，為退伍榮民的生活、就業和福利待遇進行安排。後方家眷無憂，方能在戰場上勇猛殺敵。"
 
 CHI_infrastruct:0 "修建基礎設施"
 CHI_infrastruct_desc:0 "台灣的基礎設施必須進行擴建和維護，才能保障工業化的進行。"
 
 CHI_manufacture_1:0 "發展製造業 I"
 CHI_manufacture_1_desc:0 "日本人在台灣留下了許多產業，但這些產業不足以支持未來台灣的經濟自給自足，我們不僅需要資產中小消耗品，還需要能夠自產工業機械。"
 CHI_manufacture_2:0 "發展製造業 II"
 CHI_manufacture_2_desc:0 "在具备进一步工业能力后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 CHI_manufacture_3:0 "發展製造業 III"
 CHI_manufacture_3_desc:0 "在具备较为完善的工业能力后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 CHI_manufacture_4:0 "發展製造業 IV"
 CHI_auto_focus:0 "發展汽車國造"
 
 CHI_hydro_project:0 "興修水電"
 CHI_hydro_project_desc:0 "台灣多山谷河流，適合建造水電設施，以供應電力需求。"
 CHI_local_election:0 "地方選舉"
 CHI_local_election_desc:0 "台灣省政草創，除行政機構外，還需完善立法機構，以行憲政。今台灣局勢穩定，應儘快依憲法，推行民主選舉，產生地方縣市立法機關，選舉產生民意代表，行使民主權利，以展示中華民國民主行憲成果，反擊共匪與臺獨勢力之攻訐。"
 CHI_mainland_refugee_rescue:0 "大陸災胞救濟總會"
 CHI_mainland_refugee_rescue_desc:0 "共匪的殘暴統治和血腥鎮壓，已經在大陸引起全國同胞的人神共憤，不願意慘遭共黨蹂躪之同胞，紛紛逃亡大陸，尋求自由。我黨我政府，與大陸災胞骨肉相連，不願漠視同胞求生。大陸災胞救濟總會，將動員自由中國民間人力物力，為大陸同胞逃難求生，提供力所能及的幫助，同時進行宣傳工作，感化大陸民衆逃離共匪魔爪，投奔自由。"
 CHI_flitzer_for_rice:0 "肥料換穀方案"
 CHI_develop_agrculture:0 "發展農業"
 
 CHI_diplomatic_tw:0 "外交政策"
 CHI_taiwan_plastic:0 "臺塑公司"
 CHI_taiwan_plastic_desc:0 "我國在橡膠產業上需求越來越大，在近日我國获得美援，准备发展塑胶及轮胎工业，由行政院经济安全委员会负责规划，建立黨國的塑膠企業。"
 CHI_usa_try:0 "游説美國政客"
 CHI_usa_try_desc:0 "為了反攻計劃，我們需要美國人的盡力支持，為此我們必須和美國的高級官員與眾議員打好關係。"
 CHI_support_japan_right:0 "支持日本右翼"
 CHI_support_japan_right_desc:0 "在反攻大業面前我們需要團結一切可用的力量，我們應該撥出一筆專款，賄賂日本國內反共政客，阻止日本與淪陷區的任何交往。"
 CHI_relation_saf:0 "交好南非"
 CHI_relation_saf_desc:0 "在國民政府撤退至台灣后，與南非維持關係是一大重點，南非是我国的煤、铀、铁等矿产重要供应国，亦是在非洲地区的首要市场与贸易据点。"
 CHI_inflect:0 "滲透浙閩沿海"
 CHI_inflect_desc:0 "我國反攻大陸第一站必將是隔海相望的福建和浙江，我們應該命令軍統與中統派出特工情報人員確保浙閩兩地的情況在我們眼中一覽無余"
 CHI_lockdown:0 "海岸封鎖"
 CHI_lockdown_desc:0 "行政院下達《卅八穗五字第四八九六號令》，令中華民國海軍由遼河至閩江沿岸領海對中國共產黨政權實行軍事封鎖。如果情況合適擴大封鎖區域至廣東，阻止中共與外界的一切海上來往"
 CHI_airborn:0 "發展空降部隊"
 CHI_airborn_desc:0 "空降部隊在反攻中起到重要作用，我們需要傘兵來控制關鍵港口和戰略要點，將航空特战司令部改制为陆军航空特战指挥部，建立一隻世界前列的空降部隊"
 CHI_relation_isreali:0 "購買以色列技術"
 CHI_relation_isreali_desc:0 "以色列國有著世界上最優秀的科學家與工程師，考慮到阿拉伯友好國家的感受我們應該與他們展開秘密軍事合作，引進導彈與潛艇技術"
 CHI_relation_arab:0 "交好阿拉伯國家"
 CHI_relation_arab_desc:0 "為持續供應石油，我國應多與阿拉伯國家交流，維持友好關係，保證在反攻計劃中的石油進口，沙烏地阿拉伯王國與阿拉伯聯合大公國可以作為最開始的交往對象"
 CHI_invest_africa:0 "投資非洲"
 CHI_invest_africa_desc:0 "非洲的波札那，象牙海岸，埃及，衣索比亞等新興國家正需要投資，我國可前去進行投資，可維持良好關係的同時促進國內經濟建設。"
 CHI_invest_pacific:0 "投資太平洋國家"
 CHI_invest_pacific_desc:0 "太平洋的新興國家大多國小民窮，我國可到此投資，可維持良好關係讓太平洋國家承認我國的同時促進國內經濟建設。"
 CHI_invest_latins:0 "投資拉丁美洲"
 CHI_invest_latins_desc:0 "拉丁美洲大量國家在二戰后開始發展，我國應該前去投資，可維持良好關係的同時促進國內經濟建設。"
 CHI_invest_me:0 "投資中東"
 CHI_invest_me_desc:0 "為保證在反攻計劃中的石油進口，我國應多在中東進行投資，嘗試控制一部分石油企業之股權，保證石油的良好供應。"
 CHI_desert_operation:0 "大漠行动"
 CHI_desert_operation_desc:0 "沙烏地阿拉伯就正式來函，請中華民國派兵援助北葉門，利雅德方面將邦交和軍援北葉門案一併討論，使我國無法拒絕，雙方同意戰機及附屬裝備、人員經費均由沙烏地阿拉伯比照該國軍人的待遇提供。特遣隊人員接受沙烏地阿拉伯援助團的指揮、管制。"
 CHI_military_assisstance:0 "驻外軍事教官"
 CHI_military_assisstance_desc:0 "太平洋與非洲有許多新興國家我們應將武官派去當地進行軍事指導，以維持良好關係。"
 CHI_free_world:0 "自由世界的盟友"
 CHI_free_world_desc:0 "在反共事業中，來自民主自由世界的盟友的支援至關重要，我們需要派出專業外交人員，去民主自由世界尋找盟友"
 CHI_lianqin:0 "聯勤工廠"
 CHI_lianqin_desc:0 "中央修械所與政府一同遷來臺，現在我軍需要大量武器裝備，經商討後決定擴充為兵工署第四十四兵工廠，以保證後繼軍事供應"
 CHI_hsinchu:0 "新竹科技園區"
 CHI_hsinchu_desc:0 "我國的電子代工行業自工研院建立台灣首座4吋晶圓的積體電路示範工廠以來越來越興盛，成立以電子代工的科學工業園區集中產業迫在眉睫。"
 CHI_chiang_worship:0 "蔣公崇拜"
 CHI_chiang_worship_desc:0 "為統一全國思想，我們應該將蔣總統奉作「民族英雄」、「民族救星」，並大力宣揚蔣的政績與成就，實行黨國體制的個人崇拜，以統一全國上下思想，"
 CHI_strategic_airforce:0 "發展轟炸機"
 CHI_strategic_airforce_desc:0 "為打擊共軍工業發展能力，我軍需引進西方技術發展重型战略轰炸机，轟炸內陸共軍軍工廠，"
 CHI_transfer_planes:0 "发展运输机"
 CHI_transfer_planes_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 CHI_jet_2:0 "发展现代战斗机"
 CHI_jet_2_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 CHI_airbase:0 "發展空军基地"
 CHI_airbase_desc:0 "我们需要扩大机场和基础设施来承载我们的空军，以保护我们的领空。"
 
 CHI_nuclear_focus:0 "發展核能"
 CHI_nuclear_focus_desc:0 "工業的發展讓我國電能需求越來越高，傳統的風力與水力火力發電以不再能滿足我國所需，國立清華大學陳秋榮教授的研究讓我國有能力製造核電站，以滿足我國工業需求"
 CHI_jvguang:0 "莒光營地"
 CHI_jvguang_desc:0 "為發展我國軍事教育，中華民國國防部政治作戰局委託中華電視公司製作一檔中華民國國軍軍事教育節目，名稱源自毋忘在莒。"
 CHI_huangfuxing:0 "黃復興黨部"
 CHI_huangfuxing_desc:0 "我軍以前一直未能建立成熟的退除役官兵幫扶政策，現在決定「國軍退除役就業人員黨部」奉准成立，代名「黃復興」，寓意「炎黃子孫，復興中華」。"
 CHI_local_reform:0 "地方省政改革"
 CHI_local_reform_desc:0 "臺灣省省長開放直選後，其權力基礎已有與非直選的總統或行政院院長相抗衡之勢。，為避免「葉爾辛效應」，國民政府決定臺灣省政府功能業務與組織調整將臺灣省虛級化以兼顧政治體制穩定度與簡化地方行政層級。"
 CHI_no_united:0 "不統 不獨 不武"
 CHI_no_united_desc:0 "在三不政策破裂后，我國政府提出了新三不政策，在大陸不主動進攻的情況下保證不統 不獨 不武，以「九二共識、一中各表」為基礎推動兩岸關係"
 CHI_natives:0 "尊重原著民權力"
 CHI_natives_desc:0 "為表對臺灣原住民族一視同仁，議會下令禁用「蕃族」、「高山族」、「高砂族」等歧視用語，改稱「山地同胞」，以示平等，通過《原住民族基本法》，確認原住民自治權"
 CHI_annex_natives:0 "同化山民"
 CHI_annex_natives_desc:0 "為確保國內民族問題不再爆發，我國盡力對原住民進行同化，給予漢族名字，慢慢灌輸儒家價值，有漢名可以得到比外族人身份更高的經濟和社會利益等政策將原住民慢慢同化為漢人"
 CHI_oil_produc:0 "擴大石化產業"
 CHI_oil_produc_desc:0 "為擺脫石油危機，中央政府致力推動十大建設，為臺灣石化業與重工業打下良好的基礎，現在我們已經拜擺脫傳統產業以耗能少、污染低、附加價值高的技術密集型科技產業替代，所以我們的石油需求也越來越高，需要大力擴展石化產業"
 CHI_high_tech:0 "發展智慧產業"
 CHI_high_tech_desc:0 "我國已經拜擺脫傳統產業以耗能少、污染低、附加價值高的技術密集型科技產業替代，電子科技公司成為國內經濟的重要組成部分，我們應該對其進行補助，以大力發展智慧產業"
 CHI_electronic:0 "發展電子產業"
 CHI_electronic_desc:0 "我國已經拜擺脫傳統產業以耗能少、污染低、附加價值高的技術密集型科技產業替代，如台積電、聯華電子等取得巨大成功，我們應該對其就行大力扶持，使其成為台灣的龍頭企業。"
 CHI_militarist_gov:0 "軍人政府"
 CHI_militarist_gov_desc:0 "軍隊已經成為我國政治中不可或缺的一份子，讓軍人進入政府已經勢在必得，但是應該讓軍隊掌握多大的權力仍然是個問題"
 CHI_tech_officers:0 "提拔技術官僚"
 CHI_tech_officers_desc:0 "我國的技術產業越來越發達，不能讓外行指導內行的事情再次影響我國的工業發展，大力提拔懂得技術的科技官僚，讓內行管內行"
 CHI_truth_diplo:0 "務實外交"
 CHI_truth_diplo_desc:0 "因為受到中共「一個中國原則」影響，我國在國際外交上遇到許多困難。務實外交的重點在於不計較國家名稱，不受限於意識型態，在國家名稱及交流形式上採取彈性立場，但重視實際交流內容，追求實際外交權益的作法。"
 CHI_to_south:0 "南向政策"
 CHI_to_south_desc:0 "為降低我國對中共的投資依賴與強度，我國決定推動台商海外投資往東南亞轉移，並意圖使用經濟力量擴張一些政治影響力，先期包括泰國、馬來西亞、印尼、菲律賓、新加坡、越南、汶萊等七個國家"
 CHI_develop_missile:0 "發展飛彈"
 CHI_develop_missile_desc:0 "我們從歐美購買的飛彈已經不能滿足我國的國防要求，不管是為了反攻大陸還是保衛台灣，我們都需要自己的飛彈，中科院飛彈火箭研究所專責負責研發自造飛彈。"
 CHI_develop_fighter:0 "發展戰鬥機"
 CHI_develop_fighter_desc:0 "我國需要更多的飛機來保衛台灣或者反攻大陸，從歐美購買的數量遠遠不夠我國的要求，因此中華民國開始發展「自製防禦戰機」計畫"
 
 CHI_buy_ship:0 "购买水面舰艇"
 CHI_buy_ship_desc:0 "我们目前还没有建造舰船的能力，但我们可以向其他国家购买退役的舰艇。"
 CHI_develop_ships:0 "軍艦國造"
 CHI_develop_ships_desc:0 "在大陸時期的慘痛教訓讓我們意識到自造武器的必要性，我國將從西方民主國家引入軍艦技術，追求軍艦自造"
 CHI_medium_ships:0 "发展中型舰艇"
 CHI_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 CHI_heavy_ships:0 "发展大型舰艇"
 CHI_heavy_ships_desc:0 "我们的海军已经成长壮大，我们需要发展可以搭载更多设备和飞机的大型舰艇来强化作战能力。"
 CHI_buy_submarines:0 "购买潜艇"
 CHI_buy_submarines_desc:0 "我们目前还没有建造潜艇的能力，但我们可以向其他国家购买退役的潜艇。"
 CHI_naval_base:0 "發展海军基地"
 CHI_naval_base_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 CHI_develop_submarines:0 "潛艇國造"
 CHI_develop_submarines_desc:0 "潛艇在我國對抗F軍海軍的過程中起到重要左右，我國將從西方引入潛艇，追求世界頂尖水平潛艇自造"
 
 CHI_arms_1:0 "發展軍事工業 I"
 CHI_arms_1_desc:0 "為保證于共軍的戰鬥中軍械的充足，我國將擴建發展新軍事工業"
 CHI_arms_2:0 "發展軍事工業 II"
 CHI_arms_2_desc:0 "軍事工業發展良有成效，我國將進一步發展新軍事工業"
 CHI_arms_3:0 "發展軍事工業 III"
 CHI_arms_3_desc:0 "軍事工業發展良有成效，我國將進一步發展新軍事工業"
 CHI_develop_arms:0 "发展軍事装备"
 CHI_develop_arms_desc:0 "我國的軍事裝備仍然停留在二戰級別，為改善該情況，國防部下令研究發展最新型軍事裝備，如夜視儀，坦克輔助瞄準等
 CHI_armors:0 "发展戰車部队"
 CHI_armors_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 CHI_mechanized:0 "发展机械化部队"
 CHI_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 CHI_buy_weapons:0 "购买外国武器"
 CHI_buy_weapons_desc:0 "我国的军事工业目前还很落后，没有自己生产军火的能力，但我们可以向其他国家购买退役的武器。"
 
 CHI_chiang_chin_kuo:0 "重用蔣經國"
 CHI_chiang_chin_kuo_desc:0 "蔣介石總統已垂垂老矣，是時候決定新的繼承人了--為發展國內經濟，進行政治改革，我們應該讓蔣經國作為下一任繼承人"
 CHI_chiang_wei_kuo:0 "重用蔣緯囯"
 CHI_chiang_wei_kuo_desc:0 "蔣介石總統已垂垂老矣，是時候決定新的繼承人了--為反攻大陸，勘亂討逆，還於舊都，我們應該讓蔣偉國作為下一任繼承人"
 CHI_chiang_rules:0 "蔣氏父子"
 CHI_chiang_rules_desc:0 "蔣介石總統已準備在他的兩個兒子中選出接班人，先讓兩位公子接觸一些政務軍務，以觀察兩人誰更加合適帶領全國走向未來，建立民主"
 CHI_sun_li_jen_gov:0 "孙立人政府"
 CHI_sun_li_jen_gov_desc:0 "孫立人瘋狂的政治賭博獲得了意想不到的成功，孫立人已經控制了政府，準備進行反攻大陸的準備。"
 CHI_mainland_tourist:0 "吸引大陸游客"
 CHI_mainland_tourist_desc:0 "現在三通政策已經通過，我們應該大力吸納大陸遊客來到台灣，不僅能獲得大筆旅遊收入，還能宣傳台灣的自由民主和經濟發達"
 CHI_mainland_invest:0 "投資大陸"
 CHI_mainland_invest_desc:0 "現在兩岸的交流已經開啟，我們應該去大陸進行投資，開拓新的市場"
 CHI_army_fun:0 "軍中乐园"
 CHI_army_fun_desc:0 "因《中華民國動員戡亂時期陸海空軍軍人暫行條例》規定現役軍人不得結婚，軍隊中基本需求問題已越來越嚴重，經多次考量后決定於台灣本島與外島設立特約茶室，解決軍人基本需求問題"
 CHI_contact_religion:0 "接触宗教界"
 CHI_contact_religion_desc:0 "宗教對於我國安撫人民與同化原住民都有極大的作用"
 CHI_super_united:0 "终极统一"
 CHI_super_united_desc:0 "是對於臺海兩岸關係的一種論述，意指中華民國與中華人民共和國為一個中國，兩個政治實體，現狀雖因中國分裂分治，成為階段性兩個中國，但在未來的某一個時間點，若滿足特定條件下，將會重新統一為一個中國。"
 CHI_tmc:0 "台灣積體電路"
 CHI_tmc_desc:0 "經濟部決定引進積體電路製造工業，台積電是全球第一家也是最大的積體電路代工製造商，是我國最大的對外名片"
 CHI_japan_techs:0 "引進日本技術"
 CHI_japan_techs_desc:0 "日本自第二次大戰後三十幾年來，其經濟以令人驚異的速度高度成長。技術進步是高度成長的動力。我們應該從日本引進日本的技術，以推進國家工業之發展"
 CHI_people_party:0 "支持亲民黨"
 CHI_people_party_desc:0 "國民黨已經腐化至極，如果支持宋楚瑜先生的親民黨，我们可以更加推進我國的政治政黨改革，也可以在兩岸關係上謀求新的平等互惠的談判，確保兩岸的和平"
 CHI_new_party:0 "支持新黨"
 CHI_new_party_desc:0 "國民黨已經完全喪失了膽氣，只想龜縮在台灣島苟延殘喘，我們主張兩岸一統，組建聯合政府的路線才是正道"
 CHI_new_kmt:0 "國民黨改革"
 CHI_new_kmt_desc:0 "現在的國民黨只有一群無膽鼠輩，只想在台灣島過一天是一天，我們必須改革國民黨，將他變回那個立志還於舊都，實現國父孫中山先生和先總統蔣介石先生的遺志的政黨"
 CHI_chiang_back:0 "復行視事"
 CHI_chiang_back_desc:0 "現任總統李宗仁已經灰溜溜的跑去了美國，國民大會已經通過罷免李宗仁之決議，我們應該宣布復行視事，請蔣總統回來主持大局"
 CHI_taiwan_government:0 "組建台灣省政府"
 CHI_taiwan_government_desc:0 "為保證反攻計劃的實行，最重要的就是有一個穩定的後方，臺灣省行政長官公署已經無法保證台灣的穩定，國民政府決定將長官公署改制為臺灣省政府，以防止二二八等惡性事件再次發生"
 CHI_USA_treaty:0 "中美共同防禦條約"
 CHI_USA_treaty_desc:0 "該條約以軍事為基礎，包含政治、經濟、社會等合作條約，規定美國應幫助我國協防台澎地區等地"
 CHI_taiwan_emergency:0 "台灣戒嚴"
 CHI_taiwan_emergency_desc:0 "因戰事日益逼近，從此刻開始臺灣省轄區包含臺灣本島與周邊附屬島嶼、以及澎湖群島將適用全國戒嚴令的生效範圍，執行嚴格的戒嚴。"
 CHI_tax_reduce:0 "三七五減租"
 CHI_tax_reduce_desc:0 "國民政府在中國大陸地區實施的二五減租雖然不太成功，但是給我們積累了經驗，立法院正式通過《耕地三七五減租條例》，並以總統令公布施行；條例規定，租期一律改為六年，在租期中非因法定事故，地主不得終止租約，以保障佃農權利。提高生產意願並改善生活。"
 CHI_KMT_reform:0 "國民黨改造"
 CHI_KMT_reform_desc:0 "蔣公認為國民黨組織渙散是在中國大陸失敗的一大原因，為針對黨內組織以及思想進行整肅、改造，以建立由中國國民黨總裁擔任中心的統治體制，國民黨經歷了徹底的改組，「以俄為師」，重新樹立「聯俄容共」時的列寧主義原則。在改造過程中，國民黨在中華民國政府、國軍以及社會中建立黨小組，規定每個黨員都必須歸屬於黨小組。此外，也重新確認民主集中制、意識形態的重要性、上下等級制度、黨對政府機構和軍隊的領導等原則。此外，改造著重於破除派系勢力，推進國民黨內的世代交替，有助於蔣經國進入黨的權力中樞，重振黨紀"
 CHI_constitution31:0 "萬年國會"
 CHI_constitution31_desc:0 "我國在大陸選舉出的第一屆中央民意代表后，因我國遷往台灣，未能舉行改選，雖然這些民意代表已無實際作用，但為了未來重建國民大會，方便維持中國正統地位，我們仍然應該保留他們的席位"
 CHI_TW_garrison_comand:0 "台灣警備司令部"
 CHI_TW_garrison_comand_desc:0 "在實施緊急狀態或戒嚴的地區設置警備機關，隸屬於中華民國國防部，為中華民國國軍的一部分，權責職司戒嚴地區衛戍、保安、後備軍事動員、文化審核檢查、入出境管制、郵件電報檢查、電話通訊監查定位監聽等任務"
 CHI_anti_sepitarist:0 "打擊臺獨"
 CHI_anti_sepitarist_desc:0 "由日本遺民，外國間諜甚至共產黨支持者組成的台獨勢力已經嚴重危害國家安全，他們藉口台灣主權未定論意圖分裂台灣，國民政府已決定嚴厲打擊這群人"
 CHI_NTD:0 "發行新臺幣"
 CHI_NTD_desc:0 "由行政院授權委託臺灣銀行發行的「臺幣」，由於1948年上海市爆發金融危機，國民政府大量發行貨幣，造成了惡性通貨膨脹，現在已如同廢紙，為了穩定台灣經濟，我們需要發行「新台幣」。"
 CHI_land_reform:0 "耕者有其田"
 CHI_land_reform_desc:0 "在實施三七五減租之後我國民政府繼續推動一項對農業進行再改革的政策，政府實行土地徵收和重新分配的措施。大規模的農地從地主手中徵收，並分配給農民耕種。目的是為了縮小土地所有權的不平均，讓農民擁有自己的土地，從而提高他們的經濟地位和生活條件。該政策還包括了農地所有權的確認和登記，確保農民合法擁有他們耕作的土地。"
 CHI_land_release:0 "公地放領"
 CHI_land_release_desc:0 "為實現中華民國憲法第143條「國家對於土地之分配與整理，應以扶植自耕農及自行使用土地人為原則」之土地政策，府依據法令規定之實體與程序，准許符合規定之承租農民依照規定程序申請承領，於繳清全部放領地價後，移轉土地所有權之私法上分期付款之買賣行為"
 CHI_purge_CCP:0 "懲治叛亂條例"
 CHI_purge_CCP_desc:0 "懲治叛亂條例為針對中國共產黨叛亂的特殊狀況而實施，該法擴充解釋了犯罪的構成要件，案件的審理皆由軍法機關審理，可將任何異議分子直接處理"
 CHI_education:0 "教育改革"
 CHI_education_desc:0 "為強調三民主義與中華文化精神。我國教育從此以注重國家建設、動員社會為主進行改革，實行九年義務教育。"
 CHI_10_construction:0 "十大建設"
 CHI_10_construction_desc:0 "十大建設是國民政府为了要改善台湾的基础设施及产业升级所提出的一系列重大基础建设工程，总共分为十大项目，其中有六项是交通运输建设、三项是重工业建设、一项为能源项目建设。"
 CHI_china_steel:0 "中國鋼鐵公司"
 CHI_china_steel_desc:0 "做为十大建设的重要项目之一，國民政府決定兴建一座一贯作业钢铁厂，减少台湾对外国钢铁产品进口的依赖，并加强钢铁制造的品质。"
 CHI_taiwanese_youth:0 "催台青"
 CHI_taiwanese_youth_desc:0 "常會決定了「人才獲得擴大方案」起用臺灣籍青年菁英擔任政府要職，不拘泥於現有法律，組織彈性化、人事均衡化"
 CHI_sys_SIST:0 "中山科學院"
 CHI_sys_SIST_desc:0 "为了研发国防科技，國民政府決議成立国家中山科学研究院，主要目标为提升国防科技能力、建立自主国防工业、拓展国防及军民通用技术。"
 CHI_National_hightway:0 "中山高速公路"
 CHI_National_hightway_desc:0 "高雄港与基隆港之間的城鎮交流越來越頻繁。傳統的道路已經不能滿足台灣西部各大都市、城镇，以及台湾南北两大港口之間的交流，國民政府決定建造中华民国国道一号，以滿足台灣西部各大城鎮交通需求"
 CHI_chinsan_plant:0 "第一核能發電廠"
 CHI_chinsan_plant_desc:0 ""我國的電力需求越來越大，加之作為我國燃料來源的中東情況越來越不穩定，作為十大建设之一，國民政府決定于石门区建設一座核能发电站，滿足國內電能需求，"
 CHI_kaohsiung_port:0 "建設高雄港"
 CHI_kaohsiung_port_desc:0 "基隆港的港区狭小扩建不易，我國需要新的港口滿足日益壯大的外貿需求，經勘察后國民政府決定於高雄港展开12年扩建计划，使其成為我國第一大港口"
 CHI_kaohsiung_industry:0 "高雄工業園區"
 CHI_kaohsiung_industry_desc:0 "為滿足我國外貿需求，我國決定建立全球第一个加工出口区，以之成衣、皮革、工艺品、消费性电子等产业為核心，建立於高雄港近處，方便對外出口"
 CHI_kaohsiung_shipbuilding:0 "高雄造船廠"
 CHI_kaohsiung_shipbuilding_desc:0 "高雄港已經成為我國第一大港口，船隻的需求日益增加，國民政府決定將中國造船廠和台灣造船公司合併，成立中國造船公司，以滿足船隻的需求"
 CHI_release_books:0 "解除報禁"
 CHI_release_books_desc:0 "《台湾省戒严期间新闻纸杂志图书管制办法》規定了台灣的一切出版物必須於發行時，檢送臺灣省保安司令部並由該單位檢查，隨著台灣解嚴，現在這種嚴格的出版物管理已經不再適合，我們必須廢除這種不合時宜的法律規定"
 CHI_release_parties:0 "解除黨禁"
 CHI_release_parties_desc:0 "蔣經國總統已宣布台灣地區解除戒嚴令，黨禁因此失效，我國的政黨政治開始活躍"
 CHI_divided_family:0 "開放大陸探親"
 CHI_divided_family_desc:0 "為滿足在三不政策破裂后兩岸親戚之間交流的需求，允許現役軍人及公務員以外，在中國大陸有三親等內血親、姻親或配偶的民眾，登記前往中國大陸探親。"
 CHI_3_links:0 "開放三通"
 CHI_3_links_desc:0 "三通是臺海兩岸直接「通郵」、「通商」、「通航」的簡稱，三不政策破裂后，雖然允許探親行為但為防共党滲透我國仍拒絕三通，但隨著近來國內呼聲越來越大，國民政府不得不考慮開放「三通」"
 CHI_contact_ccp:0 "與中共接觸"
 CHI_contact_ccp_desc:0 "時態的變化讓我們不得不與中共主動接觸，只得打起精神防範"
 CHI_92:0 "九二共識"
 CHI_92_desc:0 "我國在與中共的非正式接觸中提出「一個中國，各自表述」的說法，但中共方面認為是惡意扭曲，堅持「海峽兩岸均堅持同屬一個中國，共同努力謀求國家統一」，后雙方都同意「一個中國原則的九二共識」，為兩岸交流打下一個基礎"
 CHI_3_no:0 "三不政策"
 CHI_3_no_desc:0 "不接觸、不談判、不妥協。是我國的大陸政策，美國背叛我國與中共正式建立外交關係後，民國政府對中國共產黨採取此政策"
 CHI_release_emergency:0 "解除戒嚴"
 CHI_release_emergency_desc:0 "中共領導人已停止炮擊外島並推行改革開放後逐步拋棄計劃經濟模式，國共之間的矛盾漸漸緩和，加之台灣民主化運動越來越激烈，國民政府開始考慮解除《臨時戒嚴令》"
 CHI_resistance:0 "國光計劃"
 CHI_resistance_desc:0 "我们已经团结了所有可用的力量，全国军民也上下一心，是时候还于旧都，告祭国父了，我们必将取胜，哪怕只剩下拳頭和牙齒，我們也要獲得勝利！"
 CHI_youth_corp:0 "反共青年團"
 CHI_youth_corp_desc:0 "三民主義青年團，簡稱三青團，是由中國國民黨領導的青年組織，我們應該在三青團中加大反共宣傳力度，提拔反共青年，確保未來青年與我們保持一致"
 CHI_Cultural_Renaissance:0 "中華文化復興運動"
 CHI_Cultural_Renaissance_desc:0 "為了維護傳統中華文化，發揚革命精神。與中國共產黨之文化大革命運動分庭抗禮，以顯示中華民國為正統中華文化之代表。民國政府以復興中華文化為目的開展中華文化復興運動"
 CHI_operation_hsinchu:0 "新竹計劃"
 CHI_operation_hsinchu_desc:0 "中國共產黨已經成功發展核武，國民政府擔心共產黨會對我國使用核武，但因我國是《部分禁止核試驗條約》與《核武禁擴條約》的原始締約國，故令國家中山科學研究院秘密研究核武。"
 CHI_FCRA:0 "亞洲人民反共聯盟"
 CHI_FCRA_desc:0 "為團結亞洲國家聯合反共，我國總統與菲律賓總統和韓國總統一同倡議籌組反共聯盟。以反對共產主義、推翻共產黨政權為其目標。"
 CHI_bat_squad:0 "蝙蝠中隊"
 CHI_southwest_resistance:0 "聯絡西南反共武裝"
 CHI_southwest_base:0 "强化滇緬抵抗力量"
 CHI_thai_diplo:0 "與泰國建立關係"
 CHI_no_together:0 "汉贼不两立"
 CHI_pragmatism:0 "务实外交"
 CHI_third_world:0 "关注新兴國家"
 CHI_SVN:0 "援越部队"
 CHI_middile_east:0 "交好中东國家"
 CHI_1990reform:0 "國是会议与增修条文"
 CHI_support_DPP:0 "支持民主進步黨"
 CHI_anti_dialect:0 "推行國语"
 CHI_dejapanization:0 "去日化"
