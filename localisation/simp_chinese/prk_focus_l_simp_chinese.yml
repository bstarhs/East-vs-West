l_simp_chinese:
 PRK_DemocraticRepublic:0 "民主主义人民共和国"
 PRK_DemocraticRepublic_desc:0 "残酷的日本殖民统治已经结束，伟大的朝鲜人民已经实现了祖国独立，我们将建立新的朝鲜民主主义人民共和国政府。"
 PRK_PeoplesRepublic:0 "民主的朝鲜人民共和国"
 PRK_PeoplesRepublic_desc:0 "与实行独裁统治的南方李承晚政府相反，北朝鲜将举行真正的民主选举，各民主党派参与选举并选出一个民主政府。"
 PRK_Nodongdang:0 "合并朝鲜劳动党"
 PRK_Nodongdang_desc:0 "北朝鲜现在有许多党派存在，如朝鲜共产党、朝鲜社会民主党等，党派太多不利于我们建立一个强有力的政府，因此我们需要把各大党派合并为一个大党，即朝鲜劳动党。"
 PRK_kim_ilsung_focus:0 "伟大的金日成元帅"
 PRK_kim_ilsung_focus_desc:0 "伟大的、英明的统帅和领导者金日成元帅，是我们朝鲜民族的太阳，他用他的智慧和勇气，领导我们国家从日本统治和美国侵略中获得解放，而在未来，金日成同志也将是我们国家唯一的委员长同志和永远的父亲！"
 PRK_juche:0 "主体思想"
 PRK_juche_desc:0 "主体思想是朝鲜领袖金日成提出的政治理念，即人是自己主体，人要掌握自己的命运，而朝鲜民主主义人民共和国也像一个人，他要掌握自己的命运，就要只服从于自己的大脑——朝鲜劳动党的指挥。"
 PRK_kim_2:0 "白头山血脉"
 PRK_kim_2_desc:0 "白头山诞生的金日成家族象征着朝鲜民主主义人民共和国的最高指挥与力量，随着金日成同志的儿子金正日同志逐渐成长，他已做好了成为新的领袖的准备。"
 PRK_strike_yanan:0 "打击延安派"
 PRK_strike_yanan_desc:0 "延安派指的是在二战时期，前往中国参与中国共产党部队的朝鲜人，他们在二战后回到朝鲜，并在朝鲜政府中成为重要力量，但随着他们与金日成的矛盾开始恶化，一场政治斗争在所难免。"
 PRK_yanan:0 "延安派的崛起"
 PRK_yanan_desc:0 "延安派指的是在二战时期，前往中国参与中国共产党部队的朝鲜人，他们在二战后回到朝鲜，并在朝鲜政府中成为重要力量，但随着他们与金日成的矛盾开始恶化，一场政治斗争在所难免。"
 PRK_kimkoo:0 "与金九的联合政府"
 PRK_kimkoo_desc:0 "金九先生是朝鲜独立的重要领袖之一，他已在南方取得政权，我们也许可以争取与对方进行对话，谋求半岛的和平统一。"
 PRK_peace_united:0 "和平统一"
 PRK_peace_united_desc:0 "南北朝鲜高度的政治对抗已经走入历史，和平统一才有未来。我们与南朝鲜当局的对话与沟通取得了巨大的进展，双方经济、文化、政治交流也不断推进，也许现在，我们可以提出一个更伟大的理想——结束分裂，实现和平统一，两国将正式对外宣布建立联合政府，成立联合军队和经济上的共同体，朝鲜劳动党和南方各民主党派将建立联合政府。让这片经历了无数苦难的三千里江山，实现最终的和平与统一！"
 PRK_talk_southern:0 "与南方的对话"
 PRK_talk_southern_desc:0 "南方政府向我们发出了友好的信息，希望能够缓和半岛高度紧张的政治局势，并就双方的裁军、战俘交换等问题进行协商。我们可以在保持警惕的前提下，与南方进行接触或谈判，以争取到一些对我们有利的条件。"
 PRK_korea_federate:0 "高丽联邦"
 PRK_korea_war:0 "祖国解放战争"
 PRK_korea_war_desc:0 "邪恶、虚伪、无耻的南方政府勾结美帝国主义，残害进步人士，分裂国家，必须被消灭，我们将发起伟大的祖国统一战争，让朝鲜半岛重新归为一统！"
 PRK_united:0 "伟大祖国的统一"
 PRK_united_desc:0 "邪恶的南方政府已经被消灭，我们将正式宣布朝鲜祖国已经完成了伟大的统一！朝鲜民主主义人民共和国万岁！"
 PRK_supress_south:0 "镇压南朝鲜抵抗力量"
 PRK_supress_south_desc:0 "祖国统一战争已经完成，但南朝鲜依然有大批顽固不化的敌对分子再进行破坏，必须予以毫不留情的镇压。"
 PRK_KOR_pla:0 "朝鲜人民军"
 PRK_KOR_pla_desc:0 "朝鲜南北局势紧张，为了保卫新生的共和国，我们需要将原有的朝鲜游击队整编成为一支新的朝鲜人民军。"
 PRK_seongun:0 "先军政治"
 PRK_seongun_desc:0 "军事被金日成视为朝鲜民主主义人民共和国的立国根基之一，在美帝国主义的武力威胁之下，朝鲜必须将军事建设放在最优先的位置，在国家事务中，一切工作以军事为先、以军事为重，国家财政再困难，也要优先保障国防费用的支出，并重视军人在国家社会中的地位，才能建设军事强国，也有利于争取人民军对劳动党和领袖的忠诚。"
 PRK_choseonjok:0 "邀请中共的朝鲜族战士"
 PRK_choseonjok_desc:0 "中国共产党的武装力量中有许多朝鲜族士兵，我们将向中共方面发出请求，希望允许这些朝鲜族回国参加朝鲜人民军。"
 PRK_diplomatic:0 "建立外交部"
 PRK_diplomatic_desc:0 "新朝鲜需要尽快与国际社会进行接触，争取世界各国对我国合法性的认可，避免他们倒向南朝鲜。"
 PRK_SOV_relation:0 "苏联盟友"
 PRK_SOV_relation_desc:0 "伟大的苏维埃社会主义共和国联盟已经成为社会主义国家和第三世界独立国家最坚定的盟友，我们将坚定地和莫斯科的同志们站在一起，对抗帝国主义和殖民主义！"
 PRK_korean_ussr:0 "吸引苏联的朝鲜裔"
 PRK_korean_ussr_desc:0 "在日本帝国主义殖民统治时期，许多朝鲜人为了躲避暴政，不远万里流亡到遥远的苏联。现在国家重建，应该与苏联外交部门积极沟通，希望能遣返一部分朝鲜族回到祖国，为祖国的未来建设添砖加瓦，尤其是我们需要曾经参加过世界大战的朝鲜族老兵。"
 PRK_PRC_relation:0 "血盟"
 PRK_PRC_relation_desc:0 "伟大的中国人民与伟大的中国人民之间并肩合作，在反日反美救国战争中一同浴血奋战，这坚定而坚固的友谊永远无法被破坏！朝中友谊万岁！"
 PRK_STRIKE_china:0 "对抗中国修正主义"
 PRK_STRIKE_china_desc:0 "中共提出的第三个世界理论不仅完全违背社会主义大家庭的利益，甚至在中苏冲突后，与美帝国主义眉来眼去，我们到了该和北京划清界限的时候了。\n\n各国人民才是革命的主人。让外国人替他们进行革命，无异于本末倒置。革命既不能输出，也不能输入。\n——金日成"
 PRK_gando:0 "索取延吉"
 PRK_gando_desc:0 "中国东北的延吉自治区以朝鲜族为主要人口，毫无疑问我们应该试图向该地区渗透，煽动当地朝鲜族反对中国政府，甚至索取该地区的主权。"
 PRK_socialist_dip:0 "与社会主义国家关系"
 PRK_socialist_dip_desc:0 "自从苏联成立以来，社会主义阵营就秉持着支持全球民族解放运动，打击帝国主义的外交策略。这与我们政权的国际利益不谋而合。"
 PRK_third_world:0 "与第三世界国家关系"
 PRK_third_world1_desc:0 "随着殖民体系的瓦解，亚非许多国家独立建立了新的国家。我们必须尽快与这些国家建立良好关系。"
 PRK_south_east_asia:0 "交好东南亚"
 PRK_south_east_asia_desc:0 "东南亚的许多国家支持第三世界的反帝反殖民主义运动，我们应该积极与他们建立友好关系。"
 PRK_economic:0 "经济建设"
 PRK_economic_desc:0 "日本残暴的殖民统治和与美帝国主义南方傀儡的战争严重破坏了我国的经济生产，我们需要尽快重建我们的国民经济。"
 PRK_pyeongyang:0 "平壤建设"
 PRK_pyeongyang_desc:0 "平壤是我们伟大共和国的首都和心脏，但目前他仍然是一座破败的古城，我们需要在平壤进行规模宏大的建设工作，将这里打造成一座繁荣而宏伟的现代化都市，才能满足我国政府机构干部的办公和生活需求，也能向全世界的旅客展示朝鲜的发达与进步。"
 PRK_agriculture:0 "发展农业"
 PRK_agriculture_desc:0 "改善农业生产，不仅需要合理的土地制度，且需要先进的农业技术。水利、农药、化肥、配种和机械化，这些都是农业现代化不可缺少的。"
 PRK_military_industry1:0 "发展军事工业 I"
 PRK_military_industry1_desc:0 "朝鲜如果想要不再受到外国侵略者入侵，就必须重点发展自己的军事工业，而不再依赖外国援助。"
 PRK_military_industry2:0 "发展军事工业 II"
 PRK_military_industry2_desc:0 "完整的军事工业光是制造枪支是不够的，还必须制造出车辆乃至坦克等大型装备。"
 PRK_military_industry3:0 "发展军事工业 III"
 PRK_military_industry3_desc:0 "当我国拥有能独立生产装甲车辆、导弹等武器的能力时，我们就将拥有不可小觑的力量。"
 PRK_manufacture1:0 "发展制造业 I"
 PRK_manufacture1_desc:0 "在具备初步工业能力后，我们需要满足我们人民对生活消费品的需求。从纺织、食品、木制品和锅碗瓢盆开始。"
 PRK_manufacture2:0 "发展制造业 II"
 PRK_manufacture2_desc:0 "国际市场中较小的经济体所发展的基础轻工业通常包括食品加工、水泥、棉纺等直接与初级产业（农牧矿业）对接的行业。"
 PRK_manufacture3:0 "发展制造业 III"
 PRK_manufacture3_desc:0 "在具备进一步工业能力后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 PRK_hydroplant:0 "将子江水电站"
 PRK_hydroplant_desc:0 "慈江道将子江适合建造水坝，应当将其利用起来，发展水利和水电设施，即可以满足能源需求，又可以为当地的农业和民用设施储存水资源。"
 PRK_chonlima:0 "千里马运动"
 PRK_chonlima_desc:0 "朝鲜目前依然是一个较为贫穷落后的国家，我们将发起一次伟大的建设运动，重点发展工业、交通和科技建设，改变我国的落后面貌，成为一个新兴工业国家。"
 PRK_pyeongan:0 "开垦平安道"
 PRK_pyeongan_desc:0 "平安道是朝鲜半岛北部少数的平原地区，我们需要在这里重点建设国营农场以增加粮食产量。"
 PRK_uilju:0 "新义州特区"
 PRK_uilju_desc:0 "新义州地区接近中国，且拥有天然良港，是我们发展国际贸易的不错选择。"
 PRK_naseon:0 "开发罗先港"
 PRK_naseon_desc:0 "罗先市位于优良海港，是我们发展国际航运的不错选择。"
 PRK_nationalism:0 "朝鲜民族主义"
 PRK_nationalism_desc:0 "朝鲜民族主义是金日成政府的重要意识形态政策，朝鲜人民相信自己拥有五千多年的伟大历史，是世界上最纯洁和伟大的民族。"
 PRK_historic:0 "主体史学"
 PRK_historic_desc:0 "朝鲜民族主义者认为，朝鲜民族起源于公元前2333年，一个被称作檀君的国王建立了古朝鲜国，并在历史上统治了中国东北，使得日本西部成为他们的附庸。"
 PRK_nuclear:0 "开发核工业"
 PRK_nuclear_desc:0 "原子能的释放改变了世界格局，许多国家都在二战后试图掌握这一先进的技术，谁拥有了核能，谁就打开了成为强国的大门。"
 PRK_nuke:0 "开发核武器"
 PRK_nuke_techs_desc:0 "核子裂变释放出来的能量摧毁了广岛和长崎，也将人类带入一个全新的时代。核技术有着巨大的运用价值，它可以制造毁灭性的可怕武器，也可以用来提供无尽的清洁能源，甚至运用到生物化学领域。"
 PRK_space:0 "宇宙开发"
 PRK_space_desc:0 "伟大的朝鲜民族也将在征服宇宙的征途上留下自己的印记。"
 PRK_line:0 "强化三八线"
 PRK_line_desc:0 "朝鲜半岛局势紧张，我们需要强化我们在边境线的军事设施和部署以应对可能的威胁。"
 PRK_escape:0 "控制南逃"
 PRK_escape_desc:0 "一些不忠于共和国的背叛者正试图越过三八线逃亡南方，我们必须加强边境监管，严厉打击逃亡行为！"
 PRK_39office:0 "39号室"
 PRK_39office_desc:0 "39号室是朝鲜政府为了赚取外汇成立的部门，其在中国、日本和东南亚成立了多个从事非法经济活动的皮包公司。"
 PRK_security_office:0 "社会安全局"
 PRK_security_office_desc:0 "一些敌视社会主义新朝鲜的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。在全国范围内扩大狙击反动势力的监视网，消灭任何涉嫌支持反革命、反社会主义的敌对分子。"
 PRK_spies:0 "对南方间谍工作"
 PRK_spies_desc:0 "南朝鲜军政府倒行逆施，不得人心，民主运动不断兴起，我们应当支持南朝鲜人民的民主抗争。"
 PRK_outhner_movement:0 "支持南方民主运动"
 PRK_outhner_movement_desc:0 "南朝鲜是一个意识形态分裂的自由主义国家，所以如果我们大力宣传主体思想和我们制度的优越性，至少可以争取到一半的南朝鲜公民的支持。目前南朝鲜的人口是我们的两倍。但是，一旦我们南朝鲜韩国一半人口的支持，组成一个邦联，我们就能以二比一的人口优势与南朝鲜形成联盟。届时，我们要么赢得大选，要么赢得战争。\n——金日成"
 PRK_steel:0 "发展炼钢业"
 PRK_steel_desc:0 "以质量计算,铁是地球上最常见的元素,它加热后有很好的延展性…并且非常有用。铁始于公元前3500年左右,在埃及的盖尔扎赫被发掘出来铁对早期文明所需的各式东西都非常有用:如,蒸煮罐、小五金、工具,以及用来刺伤他人的尖锐武器。"
 PRK_oil:0 "发展石油工业"
 PRK_steel_desc:0 "石油是现代工业的血液，如果我们要成为工业国家，发展石油工业是不可缺少的一步。"
 PRK_plastic:0 "发展化学工业"
 PRK_plastic_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 PRK_electro:0 "发展电子工业"
 PRK_electro_desc:0 "随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。起初计算机只能帮助处理文书工作，但后期计算机有了更多功能，例如制图、传真、模拟和娱乐。计算机不仅可以帮助人们工作，对于80年代的许多国家来说，计算机还是经济腾飞的阶梯。"
 PRK_medic:0 "发展民生"
 PRK_education:0 "发展教育"
 PRK_education_desc:0 "二战前发展的教育产业已经日渐不能满足我国经济和社会对产业人才的需求，我们必须用行政手段加紧在全国范围内普及公立的、国际化的科教体系。"
 PRK_air_force:0 "发展空军"
 PRK_air_force_desc:0 "二战向世界各国展示了空中武装的作用和重要性，他们可以作战、可以运输、可以侦察，可以破坏敌人后方……总之，一支合格的空军是一支现代军队必不可少的，至少我们要保证我们头上的飞机不是敌人的。"
 PRK_missile:0 "发展导弹"
 PRK_missilee_desc:0 "导弹技术可能是20世纪最重要的军事发明之一，他最早诞生于二战德国的V2火箭，并在50年代的美苏争霸中完善。最早的导弹通过红外线热感应进行制导，通过接收目标反射的热光调整弹道，到了后来出现了电视制导和主动激光制导。导弹的应用相当广泛，它可以用于大型的弹道导弹，也可以用于制导炸弹，或步兵、车载的反坦克或反导导弹，它大大提升了军队的作战效率，但最大的问题就是——他太贵了。"
 PRK_navy:0 "发展海军"
 PRK_navy_desc:0 "谁主宰了海洋，谁就主宰了地球。大海对一个国家来说，意味着贸易运输通道和海底资源，发展海军保护我们的海上贸易和海洋资源。"
 PRK_port:0 "建设军港"
 PRK_port_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 PRK_submarine:0 "发展轻型潜艇"
 PRK_support_jcp:0 "支持日本共产党"
 PRK_support_jcp_desc:0 "祖国解放战争的伟大胜利，大大振奋了亚洲各国，尤其是日本的共产党和左派人士，他们将借助这股东风，在日本发起社会主义运动，以打败美国傀儡夺取政权，而这，自然就需要我国，在政治、经济和外交上予以支持。"
 PRK_kaesung:0 "开城工业园区"
 PRK_kaesung_desc:0 "开城贴近南朝鲜，又有优质的工业基础、外贸港口和人力资源，如果在这里设置经济特区，可以通过吸引南朝鲜投资，发展出口加工制造业，为改革开放赚取第一桶金。"
 PRK_cheongsanri:0 "青山里模式"
 PRK_cheongsanri_desc:0 "青山里集体农场位于平安南道江西郡，伟大的金日成委员长在此视察时，发现这里的农业生产取得了不错的成就，认为，这是因为集体农场社员们，充分发扬主体思想精神，下级上级互相帮助，深入群众基层，研究和分析实际情况，最大限度调动下级和人民大众自觉的热诚和创意性，无条件实行革命。金日成同志对此十分满意，并呼吁全国深入学习和贯彻青山里精神。"
 PRK_anti_colonies:0 "支持反殖民运动"
 PRK_anti_colonies_desc:0 "亚非拉人民反对殖民者，争取民族独立，我们应该支持他们。"
 PRK_africa:0 "投资非洲"
 PRK_africa_desc:0 "非洲人民摆脱帝国主义统治之后，百废待兴，从零开始建设自己的国家，他们需要科技，需要技术，需要产业和各种投资，这正是朝鲜向全世界展示社会主义国家为第三世界兄弟提供帮助和支持，以及展现主题思想优越性的机会。"
 PRK_japan:0 "摒弃前嫌"
 PRK_europe:0 "与欧洲的交涉"
 PRK_american:0 "尝试与美国接触"
 PRK_american_desc:0 "我国政府奉行独立、和平、友谊的外交政策，与尊重我国主权、对我国友好的国家建立了睦邻友好关系，并发展了交流与合作，无论这些国家的社会制度如何。我们相信，如果美国放弃与我国对抗的观念，并愿意尊重我国的选择自由，与我国实现关系正常化，那么朝美两国就能成为朋友。这取决于美国是否有这样的政治意愿。\n——金日成"
 PRK_daean:0 "大安体系"
 PRK_daean_desc:0 "大安电机工场位于平安南道大安郡，伟大的金日成委员长在此视察时，发现这里的农业生产取得了不错的成就，认为，这是因为集体农场社员们，充分发扬主体思想精神，下级上级互相帮助，深入群众基层，研究和分析实际情况，最大限度调动下级和人民大众自觉的热诚和创意性，无条件实行革命。金日成同志对此十分满意，并呼吁全国深入学习和贯彻大安精神。"
 PRK_minerals:0 "发展矿业"
 PRK_minerals_desc:0 "我们需要扩大咸兴道地区的煤炭和金属矿产的开采，使其足以供应我们的生产需求。"
 PRK_expanded_juche:0 "宣扬主体思想"
 
 PRK_reforming:0 "经济改革"
 PRK_reforming_desc:0 "苏联早期建设的经验教训告诉我们，斯大林的模式不能直接照搬。我们要研究创造符合我国具体国情的特色社会主义。列宁早已有过实践，市场经济、商品经济与外来投资并非与社会主义根本上矛盾，只要能够改善国家经济发展和人民生活水平，就有值得采用的价值。"
 PRK_agriculture_group:0 "农业生产小组"
 PRK_agriculture_group_desc:0 "苏联的教训告诉了我们盲目实行公有化和集体化制度的危害，在生产率还没有跟上的时候，高度的土地集体化只会降低土地的利用率，造成严重的资源浪费。将土地按照生产小组进行分配，有利于进一步解放生产力，调动农民的积极性。"
 PRK_companies_law:0 "合资企业法"
 PRK_companies_law_desc:0 "随着朝鲜的市场经济得到发展以及外交地位的加强，一些外国投资者希望进入我国市场投资，我们可以允许外国的企业与我们一同建立合资企业，朝鲜提供场地、资源、工人和市场，外资则提供技术和资金。"
 PRK_tongilgyeo:0 "接触统一教"
 PRK_pteonghwa_auto:0 "平和汽车"
 PRK_pteonghwa_auto_desc:0 "随着平壤与南朝鲜的关系逐步改善，双方可以尝试进一步扩大经济合作。我们可以在开城设立一个专门的工业园区，吸引南朝鲜企业进行投资，其中汽车是最有经济价值的产业。伟大的领袖金日成主席提议在开城，与南朝鲜企业合资成立汽车制造厂，取名平和（和平）牌。"
 PRK_nason_zone:0 "罗先自贸区"
 PRK_nason_zone_desc:0 "罗先市贴近苏联和中国，又有优质的工业基础、外贸港口和人力资源，如果在这里设置经济特区，可以通过吸引投资，发展出口加工制造业，为经济改革赚取第一桶金。"
 PRK_auto_pride:0 "企业自负盈亏"
 PRK_auto_pride_desc:0 "我国国有企业在经济体制改革之后开始失去活力，无法应对日益激烈的市场竞争。为了使国企能够应对市场经济带来的冲击，我们将实行国企改革，使企业自主，自负盈亏。"
 PRK_sunglae:0 "胜利汽车厂"
 PRK_sunglae_desc:0 "随着全球汽车产量增加和汽车技术的发展，汽车已不再是一种富人专属的奢侈品，而实进入中产阶层，成为一种重要的消费品。我国的汽车依然高度依赖进口，因此我们需要发展汽车工业，不仅是为了满足消费需求，也是为了让国家更快实现汽车国产、加速经济和工业发展。"
 
 PRK_humanity:0 "人道的社会主义"
 PRK_democrat:0 "民主共和国"
 PRK_election:0 "准备选举"
 PRK_maoist:0 "毛泽东思想"
 PRK_maoist_desc:0 "来自中国共产党领袖毛泽东的政策为我们提供了宝贵的经验和理想的学习对象。中国政府所实行的文化革命、工人自治、群众路线和第三世界理论将成为我们走向共产主义的指路明灯。"
 
 PRK_contact_south:0 "接触南方民主派"
 PRK_namlodang:0 "支持南劳党"
 PRK_sun_policy:0 "阳光政策"
 
 PRK_release_crinimals:0 "释放政治犯"
 PRK_release_crinimals_desc:0 "如果一个自称是共产主义者的人，通过给无辜的人贴上反动派的标签来惩罚他，那么他就不再是共产主义者，而是最恶劣的罪犯。\n——金日成"
 
