l_simp_chinese:
 cyp.1.t:0 "塞浦路斯独立"
 cyp.1.d:0 "经过紧张的谈判，英国、希腊和塞浦路斯独立分子达成了协议，伦敦以塞浦路斯不得与希腊合并为条件，承认了塞浦路斯的独立。昨天上午，塞浦路斯共和国成立仪式在尼科西亚召开，第一任总统马卡里奥斯三世大主教宣读了《独立宣言》，宣布这个被希腊人、土耳其人和英国占领了数千年的岛屿获得独立。"
 cyp.1.a:0 "祝福新生的自由塞浦路斯。"
 
 cyp.2.t:0 "希腊人与土耳其人"
 cyp.2.d:0 "上一周中，我们的首都分别发生了两场游行示威，一场是希腊族居民要求和希腊共和国合并的示威，另一场是土耳其族居民反对前者要求的示威。庆幸警察在示威现场戒备，才使双方未发生肢体冲突。随着塞浦路斯的独立，希腊人与土耳其人之间的矛盾越来越大，我们担心这可能会引发严重的内战。"
 cyp.2.a:0 "嗯。"
 
 cyp.3.t:0 "尼科西亚会谈"
 cyp.3.d:0 "鉴于塞浦路斯岛上不断恶化的民族矛盾和暴力局势，在北约的调解下，塞浦路斯政府和希腊、土耳其族武装势力在尼科西亚举行会谈，虽然双方没有达成实质性的结果，但总体上缓和了紧张的局势。"
 cyp.3.a:0 "嗯。"
 
 cyp.4.t:0 "国民警卫队政变！"
 cyp.4.d:0 "塞浦路斯国民警卫队的士兵们突然闯进了首都尼科西亚的总统府，逮捕了总统马卡里奥斯三世！士兵指挥官尼克斯·桑普森宣布，这是一场旨在保护塞浦路斯希腊人利益，并推动塞-希统一的政变行动，希腊人无法接受马卡里奥斯向土耳其人让步的软弱行为，因此必须夺取政权，并对土耳其采取强硬政策。"
 cyp.4.a:0 "嗯。"
 
 cyp.6.t:0 "土耳其向塞浦路斯派军！"
 cyp.6.d:0 "在安卡拉向塞浦路斯国民警卫队政权发出最后通牒无果后，土耳其派出军舰和海军陆战队入侵塞浦路斯北部沿岸并登陆！土耳其政府宣称，这是一次旨在保护塞浦路斯土耳其同胞的护侨和平行动，他们将与岛上的土耳其族武装力量一起对抗非法的军事政权。"
 cyp.6.a:0 "嗯。"
 
 cyp.7.t:0 "我们在塞浦路斯的军事行动受挫！！"
 
 cyp.8.t:0 "土耳其宣布撤离塞浦路斯"
 
 cyp.9.t:0 "我们在塞浦路斯的军事行动受挫！！"
 
 cyp.10.t:0 "希腊撤离塞浦路斯！"
 
 cyp.11.t:0 "希腊与塞浦路斯宣布合并！"
 
 
 cyp.20.t:0 "塞浦路斯爆发游行示威！"
 cyp.20.d:0 "塞浦路斯爆发反对英国统治的游行示威！"
 
 cyp.21.t:0 "塞浦路斯民族主义的兴起"
 cyp.21.d:0 "英国对塞浦路斯的统治已经引发了许多塞浦路斯人的不满，反对英国统治的游行示威正在塞浦路斯不断地发生，双方矛盾日益激化。"
 
 cyp.22.t:0 "塞浦路斯示威者与英国军队爆发流血冲突！"
 cyp.22.d:0 "塞浦路斯爆发大规模骚乱，民族主义者走上街头游行示威，抗议英国的统治并要求废除托管地位实现独立。英国军方使用暴力手段进行镇压，双方爆发激烈的流血冲突，多人伤亡。"
 
 cyp.23.t:0 "关注塞浦路斯局势！"
 cyp.23.d:0 "塞浦路斯发生的反殖民运动引起了全世界关注，我们应当就此事发表一则外交声明，以提高我国的国际影响力。"
 
 cyp.24.t:0 "[ROOT.GetName]表态支持塞浦路斯反英运动！"
 cyp.24.d:0 "[ROOT.GetName]政府发表声明，宣布支持塞浦路斯人民反对英国殖民统治的政治运动，呼吁英国当局尊重塞浦路斯人民的诉求。"
 
 cyp.25.t:0 "塞浦路斯斗士国家组织成立！"
 cyp.25.d:0 "塞浦路斯斗士国家组织在雅典正式宣布成立！他们宣称将会发动一场将塞浦路斯从英国殖民统治下解放出来的战争！！"
 
 cyp.26.t:0 "塞浦路斯武装分子向英军发动袭击！"
 cyp.26.d:0 "一股塞浦路斯独立运动的武装分子今日向驻扎在塞浦路斯的英国军队发动突然袭击，双方爆发激烈交火！"
 
 cyp.27.t:0 "塞浦路斯大主教被捕流放！"
 cyp.27.d:0 "东地中海局势因塞浦路斯问题急剧升温。随着岛上反对英国殖民统治、寻求与希腊合并的武装斗争与民众抗议愈演愈烈，英国殖民当局采取了震惊国际的强硬措施：逮捕了塞浦路斯东正教会的领袖和精神象征——马卡里奥斯三世大主教，并宣布将其流放至遥远的印度洋群岛塞舌尔。\n英国政府发布声明，严厉指责马卡里奥斯大主教利用其崇高的宗教与社会影响力，支持和煽动塞浦路斯武装组织“EOKA”的暴力活动，称其是“妨碍和平与秩序的极端分子”。此举意在斩断独立运动的团结核心，震慑支持者。\n希腊政府提出强烈抗议，诸多亚非新兴独立国家及苏联等社会主义阵营国家纷纷予以谴责，视其为殖民主义垂死挣扎的暴行。联合国安理会也应相关国家要求将此列入讨论议程。马卡里奥斯三世的流放，非但没有平息塞浦路斯的斗争，反而使其成为反殖民主义的标志性人物，激起了更广泛的国际同情与支持。"
 
 cyp.28.t:0 "关注塞浦路斯局势！"
 
 cyp.29.t:0 "[ROOT.GetName]表态谴责英国流放塞浦路斯大主教！"
 
 
 
 cyp.34.t:0 "英国与希腊就塞浦路斯问题达成协议！"
 
 cyp.35.t:0 "马卡里奥斯三世就任塞浦路斯正教会大主教！"
 
 cyp.36.t:0 "关注塞浦路斯局势！"
 
 cyp.37.t:0 "英军与塞浦路斯武装分子发生交火！"
 cyp.37.d:0 "英国驻塞浦路斯驻军与塞浦路斯抵抗组织的武装分子发生遭遇战！双方在山区爆发激烈战斗，最终英军击溃武装分子，对方仓皇撤退。"
 
 
 
 cyp.40.t:0 "英国宣布谈判解决塞浦路斯问题"
 cyp.40.d:0 "英国政府正式宣布，该国决定采取和平谈判的方式，解决英国占领下的塞浦路斯主权问题。伦敦方面将分别致信希腊政府和塞浦路斯解放组织，与他们取得联系，并推动谈判。"
 
 cyp.41.t:0 "希腊宣布放弃塞浦路斯主权"
 cyp.41.d:0 "希腊外交部正式宣布，希腊将正式放弃对塞浦路斯的主权，不再要求塞浦路斯与希腊合并。/n这一决定令许多希腊民族主义者和塞浦路斯希腊裔无法接受，但希腊政府表示，希腊既没有能力支持塞浦路斯，也没有能力治理塞浦路斯，因此放弃这片土地是最好的选择。"
 
 cyp.42.t:0 "希腊要求与塞浦路斯合并"
 
 cyp.43.t:0 "英国宣布接受塞浦路斯与希腊的合并"
 
 cyp.44.t:0 "英国拒绝接受塞浦路斯与希腊的合并"
 
 cyp.45.t:0 "塞浦路斯自治方案的出台"
 cyp.45.d:0 "在英国与希腊无法就塞浦路斯独立问题达成协议后，伦敦方面提出一个新的方案：建立一个英联邦下的塞浦路斯自治领，塞浦路斯获得内政和经济的主权，而外交与国防则依然由伦敦负责。"
 
 cyp.46.t:0 "马卡里奥斯呼吁支持塞浦路斯独立！"
 cyp.46.d:0 "马卡里奥斯三世大主教就塞浦路斯前途问题发表意见，他认为，如果希腊不愿意与塞浦路斯实现统一，那么塞浦路斯人们就应该转为支持完全的独立。"
 
 cyp.47.t:0 "[ROOT.GetName]表态支持塞浦路斯独立！"
 cyp.47.d:0 "[ROOT.GetName]外交部门发表声明，表示支持塞浦路斯完全建国独立，反对英国的塞浦路斯在英联邦下自治的方案。"
 
 cyp.48.t:0 "塞浦路斯问题即将提交联大投票"
 cyp.48.d:0 "联合国大会将正式就是否支持塞浦路斯独立进行投票。"
 
 cyp.49.t:0 "塞浦路斯独立投票获得通过！"
 cyp.49.d:0 "联合国大会今日正式就塞浦路斯独立一事进行投票，最终议案获得了绝大多数通过，英国提出的自治领方案被否决！"
 
 cyp.50.t:0 "塞浦路斯共和国正式独立！"
 cyp.50.d:0 "随着米字旗在《天佑女王》的乐声中缓缓降下，英国对塞浦路斯长达八十年的统治宣告结束。而在塞浦路斯的新国旗升起后，马卡里奥斯三世大主教就任第一任总统，而土耳其裔的Fazıl Küçük就任副总统。这是塞浦路斯在众多妥协中实现独立的结果。/n政治家们在总统府前欢庆新国家的诞生，而塞浦路斯的报纸却在谴责新国家妥协性的宪法。总统必须由希腊人担任，副总统将由土耳其人担任，这种法律令许多人担忧，但大部分的塞浦路斯民众却依然相信，国家能在未来逐渐处理这些问题。/n这不是结束，甚至不是结束的开始。"
 cyp.50.a:0 "但至少是开始的结束。"