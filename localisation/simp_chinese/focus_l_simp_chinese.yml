l_simp_chinese:
 WHILE_FOCUSING:0 "依此目标发展，己方将获得以下效果：\n$EFF$"
 generic_focus:0 "战争略路线"
 army_effort:0 "发展陸军"
 army_effort_desc:0 "儘管空战争与海战争的重要性不斷增加，但陸战争仍是決定勝负的最后关鍵。有了充分的准备，便可以避免拉鋸战争所造成的国力耗損。"
 equipment_effort:0 "发展军队裝备"
 equipment_effort_desc:0 "可攜式步兵器械正不斷的发展，国家将致力于給予兒郎们最好的武裝。"
 motorization_effort:0 "发展摩托化步兵裝备"
 motorization_effort_desc:0 "武裝车輛兼具机动性与防护力，能使兒郎们更迅速且安全的馳騁沙场。"
 doctrine_effort:0 "发展陸战争学说"
 doctrine_effort_desc:0 "一战争時期的战争术思想已經过時了，我们必須致力于发展新一代的战争术。"
 equipment_effort_2:0 "发展军队裝备 II"
 equipment_effort_2_desc:0 "国家将继续專注于提升兒郎们的裝备素質，借此降低孤兒寡婦產生的机率。"
 mechanization_effort:0 "发展机械化步兵裝备"
 mechanization_effort_desc:0 "重新思索机动步兵的重要性后，国家決定更进一步的发展裝甲车輛。"
 doctrine_effort_2:0 "发展陸战争学说 II"
 doctrine_effort_2_desc:0 "战争间期及近期的国際衝突，已将战争术思維提升到了新的層次，我们必須更加精进，以适应新的战争场。"
 equipment_effort_3:0 "军武自產计畫"
 equipment_effort_3_desc:0 "为了成为世界一流的军械生產国，国家決議不再依賴外援或模仿他国设计。"
 armor_effort:0 "发展裝甲裝备"
 armor_effort_desc:0 "利用研发步兵支援车輛所得到的經驗，我们将进一步提升裝甲部队的战争力。"
 special_forces:0 "发展特种部队"
 special_forces_desc:0 "为适应多樣化的战争场，我们将加強伞兵、蛙人、山地特战争部队等特种部队的训练。"
 aviation_effort:0 "发展空军"
 aviation_effort_tt:0 "沒有閒置的建筑槽位可以建造§Y空军基地§!"
 aviation_effort_desc:0 "空战争科技日新月異，每一个现代国家都必須掌控空中领域，以免別人家的老母雞不请自來的到自家上空下蛋。"
 fighter_focus:0 "強化战争斗机"
 fighter_focus_desc:0 "空中纏斗的技术发端于一战争，我们将致力于研发更靈活的战争机，以将纏斗技术发展到新的層次。"
 bomber_focus:0 "強化轟炸机"
 bomber_focus_desc:0 "未來，人们在描述战争争的恐怖時，天降火雨将是其中最壯观的畫面，我军轟炸机群会将这地獄般的景象深深地烙印到敌人的腦海裡。"
 aviation_effort_2:0 "发展空战争学说"
 aviation_effort_2_desc:0 "研发更先进的空战争技术，能增加空军与其他军种的协调性，以发挥更大的威力。"
 CAS_effort:0 "发展對地攻擊机"
 CAS_effort_desc:0 "现代化的陸军不只需要裝甲车輛的輔助，更重要的是來自于空中的掩护。"
 rocket_effort:0 "发展次世代引擎"
 rocket_effort_desc:0 "火箭与喷射引擎可以提供载具（无论是载人或无人）驚人的速度，若我们可以掌握此项技术，将能帶給敌人意料之外的驚喜。"
 NAV_effort:0 "发展鱼雷轟炸机"
 NAV_effort_desc:0 "如同海军发展潜水舰艇一般，空军发展海上攻擊机也是必要的进程。"
 naval_effort:0 "发展海军"
 naval_effort_tt:0 "沒有閒置的建筑槽位可以建造§Y海军船坞§!。"
 naval_effort_desc:0 "海军舰艇是国土的延伸，为了扩张及鞏固本国领土，我们必須全力投入舰艇生產！"
 GER_naval_effort2:0 "扩建船坞设施"
 GER_naval_effort2_desc:0 "要真正重建一支值得注意的海军，我们必須大力拓展造船能力。"
 flexible_navy:0 "靈活海军主義"
 flexible_navy_desc:0 "为了有效的封锁敌方贸易路线，我们应致力于研究更靈活的潜艇战争术。"
 large_navy:0 "大型海军主義"
 large_navy_desc:0 "因应舰艇大型化，我们必須研究相应的海战争理论，以了解確保贸易船队所需的舰艇种類。"
 submarine_effort:0 "发展潜水艇"
 submarine_effort_desc:0 "漢利號潜艇的成功，开启了水下作战争的新次元。研究更先进的潜艇技术，不只能保护我们舰艇免受其害，也能對敌国造成強大威胁。"
 cruiser_effort:0 "发展巡洋舰"
 cruiser_effort_desc:0 "在研发更大型的水面舰艇之前，小型舰艇如巡洋舰的汰換势在必行。"
 destroyer_effort:0 "发展驅逐舰"
 destroyer_effort_desc:0 "在徹底研究了潜水艇的運用之后，我们海军学家指出，在對抗潜舰威胁時，驅逐舰是不可或缺的一部份。"
 capital_ships_effort:0 "发展主力舰"
 capital_ships_effort_desc:0 "拥有最多战争舰的国家将統治海洋！战争舰及航母代表著新舊世代的海上霸权。"
 industrial_effort:0 "发展工业"
 industrial_effort_desc:0 "倾注全力研发的工业技术，将成为我们躍升一流大国的重要推力。"
 industrial_effort_2:0 "发展工业 II"
 industrial_effort_2_desc:0 "以钢的意志与努力不懈的工作精神为號召，我们将动员全国人民實施工业大躍进。"
 construction_effort:0 "扩建民用工厂"
 construction_effort_tt:0 "沒有閒置的建筑槽位可以建造§Y民用工厂§!"
 construction_effort_desc:0 "即便在战争火四處蔓延的今日，兴建民用工厂的重要性依然不可被低估。"
 production_effort:0 "扩建兵工厂"
 production_effort_tt:0 "沒有閒置的建筑槽位可以建造§Y兵工厂§!"
 production_effort_desc:0 "如果一个工厂能生產拖拉机，那这个工厂就能造战争车。我们不能允许军武製造力低于他国！"
 construction_effort_2:0 "扩建民用工厂 II"
 construction_effort_2_desc:0 "继续投资兴建民用工厂，将使我们能更快速的建造新建筑及生產更大量的交易物资。"
 production_effort_2:0 "扩建兵工厂 II"
 production_effort_2_desc:0 "将现有的民用工厂转型为兵工厂來增加军武產量不过是飲鴆止渴，兴建更多的兵工厂才是解決之道。"
 production_effort_3:0 "扩建兵工厂 III"
 production_effort_3_desc:0 "兴建更多的兵工厂，才能滿足多樣化新型军武的生產需求。"
 infrastructure_effort:0 "提升基础设施"
 infrastructure_effort_desc:0 "一个基础设施不足的国家是无法成为工业大国的。"
 infrastructure_effort_tt:0 "沒有閒置的建筑槽位可以建造§Y基础设施§!"
 synth_oil_effort_tt:0 "沒有閒置的建筑槽位可以建造§Y精炼厂§!"
 infrastructure_effort_2:0 "提升基础设施 II"
 infrastructure_effort_2_desc:0 "加強基础设施的兴建，将能保障高科技研究项目的傳输便捷性与隐密性。"
 construction_effort_3:0 "扩建民用工厂 III"
 construction_effort_3_desc:0 "基础设施的扩建，显著地提升了我们建造能力。"
 nuclear_effort:0 "研究新能源"
 nuclear_effort_desc:0 "这个发现将会改变世界，我们不能讓他国成为点燃末日之焰的先鋒。"
 extra_tech_slot:0 "扩建研究设施"
 extra_tech_slot_desc:0 "基础设施及工厂的扩建，讓我们可以增设更多的研究设施。"
 extra_tech_slot_2:0 "奖励研究"
 extra_tech_slot_2_desc:0 "工业化帶來更多的研究机会，我们应奖励能對国家做出科技贡獻的人才。"
 technology_sharing:0 "科技分享政策"
 technology_sharing_desc:0 "經由与同盟分享科技，我们将受惠于來自阵营中不同国家的科技成果。"
 secret_weapons:0 "秘密武器"
 secret_weapons_desc:0 "雖然投注所有资源來製造更多战争车与飞机是非常誘人的選项，但贏得战争争的秘訣在于加強电子、核子、火箭等科学领域的研究。"
 political_effort:0 "提升政治影响力"
 political_effort_desc:0 "想掌控世界必須先能掌控自己的国家，加強政治影响力是首要之务。"
 collectivist_ethos:0 "集体主義"
 collectivist_ethos_desc:0 "弱小的国家的会被轻易的分化与征服，但我们人民将团結一致，人人为我，我为人人。"
 liberty_ethos:0 "自由主義"
 liberty_ethos_desc:0 "我们将从那些試圖扼殺人性的狂热份子手中，維护人民的人身自由与思想自主。"
 militarism:0 "军国主義"
 militarism_desc:0 "那些僅将武力视为必要之恶的人，将会被战争火无情的摧殘。我们将会把军事思想深植民心，打造一个全民皆兵的国家。"
 political_correctness:0 "政治正確性"
 political_correctness_desc:0 "那些柔性抗争份子与異議份子似乎总認为有人正针對他们与暗算他们。看來这是一个對付他们的好方法。"
 neutrality_focus:0 "中立主義"
 neutrality_focus_desc:0 "其他人都認为選邊站需要极大的智慧与勇氣，但他们不明白的是，保持中立需要更大的智慧与勇氣。"
 interventionism_focus:0 "干涉主義"
 interventionism_focus_desc:0 "我们重视世界上所有人民的自由，如果幫助他们對抗暴政意味著战争争，那就开战争吧！"
 military_youth:0 "青年军"
 military_youth_desc:0 "對青少年系統性的實施紀律与政治教育，有助于培養年轻人的忠誠思想与为国捐軀的情操。"
 deterrence:0 "威懾主義"
 deterrence_desc:0 "冷眼旁观的我们幾乎不以战争争手段获取利益。但我们了解強大的武力是維持中立的最佳保障。"
 volunteer_corps:0 "志愿军"
 volunteer_corps_desc:0 "強迫国民为他国人民的自由与理想而战争，将是對自由主義的极大諷刺，但为那些愿意为他人犧牲奉獻的人提供参战争途徑則否。"
 paramilitarism:0 "准军事組織"
 paramilitarism_desc:0 "军事准則不只可以应用于军队，隨著准军事化組織的发展，我们将有更多的人民接受军事训练。"
 indoctrination_focus:0 "洗腦式教育"
 indoctrination_focus_desc:0 "我们必須充分利用媒体与教育，讓每个国民都明白我们思想即是真理。"
 foreign_expeditions:0 "海外遠征军"
 foreign_expeditions_desc:0 "當敌人们都試圖为自身利益影响他国內政時，我们不能袖手旁观。"
 why_we_fight:0 "为何而战争"
 why_we_fight_effect:0 "如果我们沒有§Y中立的外交政策§!精神，我们将能够組建一个阵营。\n"
 why_we_fight_desc:0 "必須讓我们人民看到那些渴求权力的狂人们所犯下的暴行，讓他们知道这世界越來越不安全。团結全国人民，为自由与理想而战争的時候到了！"
 political_commissars:0 "政治委员会"
 political_commissars_desc:0 "我们将在军中增设政治委员会，以確保正確的政治思想深入军队的每个角落。"
 internationalism_focus:0 "国際主義"
 internationalism_focus_desc:0 "意识型态的影响力无遠弗屆，我们信念凌駕于任何国家的主权之上。"
 nationalism_focus:0 "民族主義"
 nationalism_focus_desc:0 "我们国家是獨一无二的存在，不能聽任他人支使，我们将不惜为維护国家主权一战争。"
 ideological_fanaticism:0 "思想狂热"
 ideological_fanaticism_desc:0 "我们政治思想建立了不亞于那些古老信仰的價值观与目标，我们必須不惜一切的为其而战争。所有追隨者应隨時准备一死，而所有不信者亦将迎來不可避免的滅亡。"
 air_innovation:0 "空军革新"
 air_innovation_desc:0 "不支配天空就不可能贏得战争争！我们必須倾盡一切地改良空战争技术！"
 air_innovation_2:0 "空军革新 II"
 air_innovation_2_desc:0 "就算是些微的空中优势也是极其珍貴的，我们应投入所有资源來发展更先进的战争机！"
 naval_air_effort:0 "強化海军航空队"
 naval_air_effort_desc:0 "美军早在1921年就展现了對舰空袭的重要性，若想与掌握海上霸权的国家开战争，我们不应忽视對舰攻擊机的发展。"
 german_focus:0 "德意志第三帝国的战争略路线"
 GER_autobahn:0 "帝国公路系統"
 GER_autobahn_tt:0 "将§Y布蘭登堡§!、§Y漢諾威§!、§Y圖林根§!以及§Y弗蘭肯§!的§Y基础设施§!提升到最大值。"
 GER_autobahn_desc:1 "自1933年发想的高速公路计畫建设开始以來，其對国內經濟的发展便有著令人嘆为观止的贡獻。它大幅的降低了失业率，使得大战争后的德国經濟得以快速的復甦，然而，此计畫距离完成還有一段距离，我们必須继续努力。"
 GER_west_wall:0 "齊格菲阵地"
 GER_west_wall_desc:0 "西牆（齊格菲阵地）与法国人自称难攻不落的馬奇諾防线平行，与上次大战争時的齊格菲阵地占地大致相同，若能以少数兵力堅守此地，我们便得以空出多餘的兵力來支援東线。"
 GER_west_wall_tt:0 "§R进军萊茵河§!：\n"
 GER_west_wall_forts:0 "在§G德法邊境§!上增筑 §G12§! 座§G陸上堡垒§!。\n"
 GER_tactical_air_effort:0 "強化战争术空军"
 GER_tactical_air_effort_desc:0 "勝利与否，取決于能否殲滅敌方地面部队。我们必須全力发展空军對地支援战争术，來幫助陸军解決防禦堅實的目标。"
 GER_long_range_escorts:0 "遠程护航"
 GER_long_range_escorts_desc:0 "我们战争术轟炸机和战争略轟炸机需要遠程护航机提供保护，直至目标区域並安全返回。"
 GER_strategic_air_effort:0 "強化战争略空军"
 GER_strategic_air_effort_desc:0 "若能破壞敌方生產能力，則勝利唾手可得。我们必須全力加強战争略轟炸机的设计与生產。"
 GER_army_innovation:0 "陸军革新"
 GER_army_innovation_desc:1 "海因茨·古德里安及其他激进派理论家们正在積极的推廣一种十分大膽的新战争术，这种战争术強调各部队间的通訊与协调性，使部队得以避強袭弱，发挥最大战争力。若能給予其适度的发展空间，或许可以避免重现上次大战争的慘劇。"
 GER_soviet_treaty:0 "重启《拉帕洛》"
 GER_soviet_treaty_desc:0 "我们可与蘇联簽訂研究协約，请他们來幫我们研发更优良的裝甲裝备，若蘇联同意，則我们将可重启卡馬河地区自1933年便关閉的战争车学校。當然，蘇联亦会向我们索求相应的报酬..."
 GER_air_innovation_2:0 "空军革新 II"
 GER_air_innovation_2_desc:0 "空军的重要性无可取代，必須使我们空军成为世界最強！"
 GER_army_innovation_2:0 "陸军革新 II"
 GER_army_innovation_2_desc:0 "在蘇联受的训练与学到的經驗将使我们能够进一步提高陸战争理论和裝备。不过，这一次我们会把研究成果留給自己！"
 GER_rocketry_focus:0 "喷射引擎"
 GER_rocketry_focus_desc:0 "火箭推进技术是三军裝备革新的关鍵！"
 GER_wunderwaffe:0 "奇蹟武器"
 GER_wunderwaffe_desc:0 "海森堡和馮·布朗正埋首研究真正的末日武器。他们需要的只是更多的资源..."
 GER_mol_rib_pact:0 "《德蘇互不侵犯》"
 GER_mol_rib_pact_desc:0 "友誼和互不侵犯与蘇联的条約可能令人作嘔，但是这可使我们获得寶貴的石油资源。这项密約将使得羅馬尼亞，波蘭，立陶宛，拉脫維亞，愛沙尼亞和芬蘭的领土成为德国和蘇联分治地区..."
 GER_mol_rib_pact_tt:0 "与§Y蘇联§!簽署§Y互不侵犯条約§!，並同意与其分享§Y波蘭§!领土。\n"
 GER_soviet_ally:0 "德蘇同盟"
 GER_soviet_ally_desc:0 "或许我们与蘇联可以拋开彼此意识型态的分歧，团結于對自私的自由主義者与頹廢的西方国家的仇恨之下。當蘇联成为盟友后，我们将可順利取得所需资源，當然，還能获取強大的紅军作为军事后盾..."
 GER_turkey_puppet:0 "滲透目标：土耳其"
 GER_turkey_puppet_desc:0 "土耳其夾在我们和蘇联之间，處境十分艱难。若對其施加壓力，土耳其很可能屈服于我们而成为傀儡国。为达到此目的，必須讓蘇联得到一些土耳其東部的领土以获得支持。但是，如果土耳其拒絕这个要求，将意味著开战争。"
 GER_rhineland:0 "进军萊茵河"
 GER_rhineland_desc:0 "上次大战争以來，萊茵河地区（Rhineland）便被协約国划为「非武裝地帶」。我们不再默默忍受这个侮辱！德国是一个主权獨立的国家，有权进军至国內任何一个角落！"
 GER_rhineland_ultimatum:0 "§R此项行动可能因你无法承担其他国家的譴責選擇屈服而作罷！§!"
 GER_japan_friend:0 "對日示好"
 GER_japan_friend_desc:0 "我们与中国有著長期且良好的关系；但若想實现我们扩张领土的愿望，与具有武士文化的日本交好或许是更佳的選擇，即使这意味著将中国丟入虎口也莫可厚非。"
 GER_japan_friend_tt:0 "召回馮·法肯豪森。\n"
 GER_china_friend:0 "對華示好"
 GER_china_friend_desc:0 "讓我们加深与中国的邦交关系，以維续这長久且良好的友誼；此舉或许会激怒日本，但日本不过是東方的義大利罷了！"
 GER_anti_comitern_pact:0 "《反共產国際协議》"
 GER_anti_comitern_pact_desc:0 "共產国際對各国的滲透与介入遠不只是嚴重地破壞了地区的安定，同時也极大地干扰了世界的平衡！我们號召其他非共產国家一齊簽署协議，从而喝止並抵制赤色洪流的危害。"
 GER_anti_soviet_pact:0 "《反蘇維埃协定》"
 GER_anti_soviet_pact_desc:0 "我们应该进一步強化《反共產国際协議》的范围与作用，讓所有成员国身處同一阵线。在任一成员国遭受赤禍威胁的時候，也能够即時得到其他成员国的援助。"
 GER_anti_soviet_pact_tt:0 "§Y向所有《反共產国際协議》的締約国提出联盟邀请。§!"
 GER_anti_soviet_pact_tt_2:0 "§Y只要任一成员国与蘇联开战争，所有成员国都将同時与蘇联开战争。§!"
 GER_anti_soviet_pact_tt_3:0 "获得国家精神「§Y反蘇維埃条約§!」\n"
 GER_ussr_war_goal:0 "战争争目标：蘇維埃"
 GER_ussr_war_goal_desc:0 "我们可以對国民以及全世界加強宣傳工作，以彰显攻擊蘇联的正當性。"
 GER_turkey_friend:0 "親善目标：土耳其"
 GER_turkey_friend_desc:0 "凱末爾领導下的土耳其正逐步邁向现代化。由于土耳其控制著黑海的入口，博斯普魯斯海峽（Bosphorus）和达达尼爾海峽（Dardanelles），讓土耳其加入我方阵营应是首要之务！"
 GER_anschluss:0 "德奧合并"
 GER_anschluss_desc:0 "德奧融合，是德国人民長久以來的期望。雖然凡爾賽条約明令禁止，但促成此事的時机終于到來。讓我们給予奧地利共享荣耀的机会吧！"
 anschluss_mefo_bills_tt:0 "使用奧地利国庫的黃金償還「§Y梅福債券§!」的利息。\n"
 anschluss_mefo_bills_double_reduction:0 "每日花费 §G0.10§! 政治点数償還「§Y梅福債券§!」的利息。\n"
 GER_demand_memel:0 "但澤走廊会談"
 GER_demand_memel_desc:0 "波蘭重生、梅梅爾（Memel）成为立陶宛领地，一战争令德国喪失许多東側的领土。我们应向两国下达最后通牒，不过波蘭应该不会因口頭威胁而屈服。"
 GER_demand_memel_threat:0 "德国再次宣称東部领土主权"
 GER_danzig_or_war:0 "但澤或战争争"
 GER_danzig_or_war_POL_faction_GER_leader:0 "§R[This.GetName]必須批准该协定使其生效。若战争争爆发，他们将会离开[Root.GetFactionName]。§!\n"
 GER_danzig_or_war_POL_faction_GER_noleader:0 "§R[This.GetName]必須批准该协定使其生效。若战争争爆发，你将会离开[Root.GetFactionName]。§!\n"
 GER_danzig_or_war_desc:0 "但澤（Danzig）自古至今都是德国领土，它必須从此刻起回歸祖国懷抱！如果波蘭不同意歸還领土，則我们必須讓国民为这无法避免的战争争做好准备。但澤地区終将回歸德国！"
 GER_czech_friend:0 "親善目标：捷克"
 GER_czech_friend_desc:0 "捷克与斯洛伐克的人民都是勤奮且令人尊敬的，我们与两国之间的领土衝突實是人民的不幸，该是放下野心，与其建立友誼的時候了。"
 GER_demand_sudetenland:0 "索要蘇台德"
 GER_demand_sudetenland_desc:0 "蘇台德地区（Sudet - Germans）的遭遇是凡爾賽合約最不公正的決議。我们应无视捷克的抗議，将其納入保护。"
 GER_demand_sudetenland_threat:0 "德国勒令捷克交出蘇台德地区（Sudetenland）控制权"
 GER_first_vienna_award:0 "第一次維也納会議"
 GER_first_vienna_award_desc:0 "匈牙利是大战争后受难最大的国家之一。因奧匈帝国的恐怖統治，许多匈牙利人被迫离开家園，我们应将部分取自捷克斯洛伐克的土地交与他们，借此改善与匈牙利的关系。"
 GER_end_of_czechoslovakia:0 "捷克斯洛伐克的命運"
 GER_end_of_czechoslovakia_desc:0 "捷克的领土应當交給那些更有能力的国家分治。我们也应该把在斯洛伐克建立傀儡政权的可行性列入考量。"
 end_of_czechoslovakia_mefo_bills_tt:0 "使用捷克斯洛伐克的黃金償還「§Y梅福債券§!」的利息。\n"
 GER_second_vienna_award:0 "第二次維也納会議"
 GER_second_vienna_award_desc:0 "匈牙利人为外西凡尼亞（Transylvania）的主要居民，故该地理应属于我们盟邦匈牙利。然而，羅馬尼亞的政府与人民会對此要求作出何种反应則令人难以预料。"
 GER_italy_ally:0 "德義同盟"
 GER_italy_ally_desc:0 "雖然以上次大战争的經驗來说，義大利人是不可信任的，但墨索里尼的法西斯倾向证明義大利或许不是无药可醫。況且，与其結盟的唯一受益者是我们，對吧？"
 GER_nationalist_spain_ally:0 "联盟目标：西班牙"
 GER_nationalist_spain_ally_desc:0 "民族主義者在西班牙內战争中的勝利，使德西之间的关系更加密切。佛朗哥（Franco）是我们进出地中海的关鍵，必須盡力拉攏他。"
 GER_nationalist_spain_ally_tt:0 "增进与§Y西班牙国§!的外交关系。"
 GER_danzig_vs_slovakia:0 "但澤或捷克"
 GER_danzig_vs_slovakia_desc:0 "波蘭人的確是我们落實生存空间计畫的最大障礙，不过，若为長遠利益著想，放棄成见与其建立友誼尚为時不晚。唯一可能的途徑就是交換领土；以但澤（Danzig）換取斯洛伐克（Slovakia）。波蘭早在占领捷克捷欣（Zaolzie）時便已显露對该地区的兴趣。"
 GER_poland_friend:0 "親善目标：波蘭"
 GER_poland_friend_desc:0 "雖然波蘭失去了临海领土，但之前的领土交換已讓波蘭理解我们善意，或许我们可以透过许下「贈与部分未來東征取得领土」之類模稜两可的承諾來更进一步的增进两国之间的友誼。"
 GER_war_with_france:0 "战争争目标：法蘭西"
 GER_war_with_france_desc:0 "我们已順利解決東部领土争議，该是放眼西方的時候了。失去亞爾薩斯 - 洛林（Alsace - Lorraine）是我们荣光的一大污点，只有发动聖战争夺回领土才能一雪前恥！"
 GER_war_with_france_threat:0 "宣称法国领土主权"
 GER_operation_tannenbaum:0 "聖誕树行动"
 GER_operation_tannenbaum_desc:0 "瑞士有著最令人作嘔和鄙视的人民跟政治体系。瑞士是新德国不共戴天的敌人，而我们现在終于有時间對付它了。"
 GER_reintegrate_luxemburg_and_alsace_lorraine:0 "重拾盧森堡\n与亞爾薩斯-洛林"
 GER_reintegrate_luxemburg_and_alsace_lorraine_desc:0 "隨著我们對歷史上原本属于德国的地区重新征服，我们现在可以开始讓他们回歸[Root.GetName]的懷抱，當地的人民必須對帝国履行它们应盡的義务。"
 GER_naval_rearmament:0 "海军再武裝"
 GER_naval_rearmament_desc:0 "我们在1935年簽署的英德海军协定讓我们能大幅扩展海军军力。我们应倾盡全力投资海军。"
 GER_plan_z:0 "海军计畫 - Z"
 GER_plan_z_desc:0 "海军上将雷德爾認为，擊败英国海军的最佳方案为商船劫掠。但想實现此一方案，必須拥有以战争列舰与航空母舰等主力舰为核心組成的龐大舰队群。遺憾的是，目前我们海军军力明显不足。"
 GER_u_boat_effort:0 "海军计畫 - U"
 GER_u_boat_effort_desc:0 "准将鄧尼茨主张「潜舰通商破壞战争略」才是擊败英国海军的唯一可行方案。只要拥有足够多的U艇，我们便可以使那肥大臃腫的帝国嘗到飢寒交迫之苦。"
 GER_trade_interdiction:0 "航路封锁"
 GER_trade_interdiction_desc:0 "雖然我们海军船坞已全力投入U型潜艇的生產工作，但我们必須研擬更好的方法來運用「狼群」。我们应給予海军将领们足够的资源來进行演習与模擬战争。"
 GER_modular_construction:0 "化整为零"
 GER_modular_construction_desc:0 "通过将我们部分潜艇零件模組化生產，不管是裝配和生產速度都大大提高。"
 GER_denmark_friend:0 "親善目标：丹麥"
 GER_denmark_friend_desc:0 "威嚇交涉依然是很有效的外交手段。在我们的海军扩张计畫已被北方鄰国知悉的如今，結合他们的恐懼与我们強大的军力，可以轻易的胁迫他们倾向我方阵营。"
 GER_norway_friend:0 "親善目标：挪威"
 GER_norway_friend_desc:0 "挪威控制著许多位于瑞典北部，珍貴的鐵礦生產地；我们应以与其「建立良好友誼」为前提來扩张舰队。"
 GER_dutch_friend:0 "親善目标：荷蘭"
 GER_dutch_friend_desc:0 "荷蘭是一个非常有自知之明的国家，能讓他们認为我们拥有足够威胁英国的军事實力，則荷蘭很可能同意与我们結盟以避免遭受武力占领。"
 GER_sweden_friend:0 "親善目标：瑞典"
 GER_sweden_friend_desc:0 "斯堪地那維亞的国家就像是生命共同体。若挪威与丹麥已向我们靠攏，則瑞典沒有理由继续保持中立。"
 GER_improve_national_spirit:0 "強化国族認同"
 GER_improve_national_spirit_desc:0 "占领上次大战争勝利者的首都后，我们終于可以一掃战争败的陰霾！嶄新的紀元正要开始！"
 GER_improve_national_spirit_tooltip:0 "己方与阵营成员必須同時占领倫敦与巴黎以及都市所在省份。"
 needs_approval:0 "§R[This.GetName]必須批准该协定使其生效。§!\n"
 GER_demand_slovenia:0 "索要斯洛維尼亞"
 GER_demand_slovenia_threat:0 "德国索要斯洛維尼亞"
 GER_demand_slovenia_desc:0 "聖日耳曼昂萊条約使许多奧地利核心领土成为獨立国家。在奧地利再次与我们結盟的如今，我们有責任導正这个錯誤！本名卡尼奧拉（Carniola）与施蒂利亞（Styria），现名斯洛維尼亞（Slovenia）的地区，必須回歸祖国。"
 GER_first_ljubljana_award:0 "第一次盧比安納仲裁"
 GER_first_ljubljana_award_desc:0 "虛偽的西方列強一方面鼓吹民族自決，一方面将许多少数民族交給交給塞爾維亞統治。我们将糾正这个荒謬的规則，對那些少数民族伸出友誼之手。我们将慷慨地對待那些支持歐洲新秩序的国家。"
 GER_fate_of_yugoslavia:0 "南斯拉夫的命運"
 GER_fate_of_yugoslavia_desc:0 "南斯拉夫政府一向都是形同虛设，而其代表的权威已逐漸不受重视。我们必須介入其中，为其重建秩序。唯一值得思考的是，该怎麼做才好？"
 yugoslavia_mefo_bills_tt:0 "使用南斯拉夫国庫的黃金償還「§Y梅福債券§!」的利息。\n"
 GER_second_ljubljana_award:0 "第二次盧比安納仲裁"
 GER_second_ljubljana_award_tt:0 "此事件給予[Root.GetName]或值得信賴的盟友宣称领土的机会。"
 GER_second_ljubljana_award_desc:0 "南斯拉夫问题解決之后，该是解決希臘问题的時候了。他们也从同盟国手中取得不少好處，该是認清敌友的時候了。"
 GER_war_with_greece:0 "战争争目标：希臘"
 GER_war_with_greece_desc:0 "在希臘已陷入战争火的時候，不趁火打劫就是白白放棄控制地中海東部的机会。"
 GER_fate_of_greece:0 "希臘的命運"
 GER_fate_of_greece_desc:0 "希臘已切實证明他们无力应對歐洲的新兴势力，是時候提供他们「德意志帝国牌」的保障了。"
 GER_weserubung:0 "行动代號 - 威瑟"
 GER_weserubung_desc:0 "挪威對我们來说是个战争略要地，其控制著我们与瑞典之间的鐵礦贸易路线，我们无法放任他们受到敌军影响。但在對其进行军事行动之前，必須先對丹麥下手。"
 GER_around_maginot:0 "繞过馬奇諾"
 GER_around_maginot_desc:0 "若我们想保证进攻法国時的战争术优势，必須實施全方位攻擊，由此，在发动對馬奇諾防线的佯攻行动之后，我们将从法国人无法预料之處，也就是防线北部，大舉入侵。"
 italian_focus:0 "義大利的战争略路线"
 GER_danzig_or_war_POL_civil_war:0 "但澤換補給"
 GER_danzig_trigger_polish_civil_war:0 "波蘭已陷入內战争，且以下条件必須成立\n德国已派遣志愿军幫助其中一方\n：其中一次在德国阵营之中"
 GER_alone_or_peace_faction_tt:0 "尚未加入阵营，或所属阵营並未与[GER.GetNameDef]开战争。"
 GER_four_year_plan:0 "四年计畫"
 GER_four_year_plan_desc:0 "我们需要一个雄心勃勃的计划來提供国家的武裝和最終的自給自足。这应在未來四年內實现。"
 GER_atlantikwall:0 "大西洋壁垒"
 GER_atlantikwall_desc:0 "现在我们征服了西歐，我们必須防止來自整个大西洋的可能的衝擊。沿著歐洲海岸的巨大防禦工事網絡应该能为我们提供充足的保护。"
 atlantikwall_tooltip:1 "建设§Y岸防要塞§!在您完全控制的以下大西洋沿岸各省份中：\n"
 atlantikwall_tooltip_2:0 "§Y阿基坦§!\n§Y普瓦圖§!\n§Y盧瓦爾河§!\n§Y布列塔尼§!\n§Y諾曼地§!\n§Y加萊§!\n§Y佛萊明§!\n§Y荷蘭§!\n§Y菲士蘭§!\n§Y威悉 - 埃姆斯§!\n§Y漢諾威§!\n§Y什勒斯維琪 - 霍爾斯坦§!\n§Y日德蘭§!\n§Y東挪威§!\n§Y西挪威§!\n§Y特倫德拉格§!\n§Y北挪威§!\n"
 GER_ostwall:0 "東方之牆"
 GER_ostwall_desc:0 "儘管我们在東方取得了成就，但我们必須確保，如果潮流转向，我们必須阻止敌人的前进。我们应该沿著第聶伯河建造一系列的防禦工事，延伸到波羅的海。"
 GER_ostwall_forts:1 "沿著第聶伯河到波羅的海建设§Y陸上堡垒§!，在您的派系完全控制的各省份中：\n"
 GER_ostwall_forts_2:0 "§Y塔爾圖§!\n§Y普斯科夫§!\n§Y涅韋爾§!\n§Y維捷布斯克§!\n§Y明斯克§!\n§Y博布魯伊斯克§!\n§Y莫濟里§!\n§Y基輔§!\n§Y切爾卡瑟§!\n§Y聶伯城§!\n§Y札波羅結§!"
 GER_ostwall_tt:0 "在我们阵营成员的控制下。"
 GER_autarky:0 "「自給自足」"
 GER_autarky_desc:0 "德国要真正偉大，它必須是自給自足的。我们必須更好地利用我们资源，並在建设中提高效率。"
 GER_hermann_goring_werke:0 "[Root.GetHermannGoringWerkeName]"
 GER_hermann_goring_werke_desc:0 "我们必須擺脫私人资本家的反復无常的影响。因此，我们将組建一个由我们控制的工业集团，以監督採礦和钢行业的增長，因为这将成为我们军事的支柱。"
 GER_HERMANN_GORING_WERKE_NAME_FASCIST:0 "「赫爾曼·戈林」国家工厂"
 GER_HERMANN_GORING_WERKE_NAME_KAISER:0 "凱撒工业集团"
 GER_HERMANN_GORING_WERKE_NAME_COMMIE:0 "联合机械製造集团"
 GER_HERMANN_GORING_WERKE_NAME:0 "国营工业公司"
 GER_kdf_wagen:0 "[Root.GetKdfWagenName]"
 GER_kdf_wagen_desc:0 "所有公民都能够通过储蓄计划來兌換一輛属于他们自己的「国民汽车」，我们能用这筆储蓄计划裡的资金來贊助与扶持汽车相关的產业。"
 GER_KDF_WAGEN_NAME:0 "「金龜车」"
 GER_KAISER_WAGEN_NAME:0 "「凱撒汽车」"
 GER_VOLKS_WAGEN_NAME:0 "「大眾汽车」"
 GER_coal_liquidization:0 "合成油技术"
 GER_coal_liquidization_desc:0 "德国是缺乏石油，所以我们必須加倍努力在合成油领域。"
 GER_synthetic_rubber:0 "合成橡胶技术"
 GER_synthetic_rubber_desc:0 "大规模的机动化和航空需要大量的橡胶，而我们沒有任何资源。我们必須改进我们生產的方式。"
 GER_german_war_economy:0 "德意志战争争經濟法案"
 GER_german_war_economy_desc:0 "我们这个偉大的国家的人民不得不为这种努力付出代價。我们希望过渡到一个完整的經濟体，每个人都应该发挥自己的作用。"
 GER_grosraumwirtschaft:0 "泛歐經濟網"
 GER_grosraumwirtschaft_desc:0 "我们必須为德国的命運做好准备，作为歐洲的核心。我们基础设施希望与東方以及南方与北方一起。"
 GER_align_hungary:0 "親善目标：匈牙利"
 GER_align_hungary_desc:0 "匈牙利已經在我们影响力范围內，但我们可以轻鬆地将它们进一步转向我们思維方式，使它们在未來更容易被操縱。"
 GER_align_romania:0 "親善目标：羅馬尼亞"
 GER_align_romania_desc:0 "羅馬尼亞已經在我们影响力范围內，但我们可以轻鬆地将它们进一步转向我们思維方式，使它们在未來更容易被操縱。"
 GER_integrate_war_economies:0 "战争時經濟整合法案"
 GER_integrate_war_economies_desc:0 "我们影响力范围內的国家已經成長为對我们有极端的經濟依賴。我们可以用它來增加我们對其經濟的控制力和對外交政策的影响力。"
 GER_integrate_war_economies_tt:2 "如果§Y[HUN.GetName]§!是§Y[Root.GetName]§!阵营中的一员，即可在§Y[Root.GetName]§!和§Y[HUN.GetName]§!以及§Y[HUN.GetName]§!上获得§Y四座§!§G军事工厂§!，並成为§Y[Root.GetName]§!的傀儡。\n"
 GER_integrate_war_economies_tt2:2 "如果§Y[HUN.GetName]§!是§Y[Root.GetName]§!阵营中的一员，即可在§Y[Root.GetName]§!和§Y[HUN.GetName]§!以及§Y[HUN.GetName]§!上获得§Y四座§!§G军事工厂§!，並成为§Y[Root.GetName]§!的傀儡。\n"
 GER_integrate_war_economies_tt3:0 "§R[HUN.GetName]必須批准协議才会生效。§!\n"
 GER_integrate_war_economies_tt4:0 "§R[ROM.GetName]必須批准协議才会生效。§!\n"
 GER_form_the_reichskommissariats:0 "设立总督轄区"
 GER_form_the_reichskommissariats_desc:0 "为了提高當地资源，工业和人力资源的利用率，我们应该研究在被征服地区建立准自治政府。"
 GER_reichskommissariats_tt:0 "允许在被征服的地区设立附庸。\n"
 GER_oppose_hitler:0 "行动目标：希特勒"
 GER_oppose_hitler_desc:0 "希特勒的統治必須結束。他的意思是通过军事化萊茵联地区來煽动西方列強，但这樣做会給我们借口，利用德国国防军的忠誠分子幫助下夺取政权。"
 GER_oppose_hitler_civil_war:0 "§R法西斯支持者可能会发动內战争。§!\n"
 GER_secure_the_new_state:0 "鞏固新政权"
 GER_secure_the_new_state_desc:0 "鑑于內战争剛結束，临時政府缺乏實力。我们必須確保它是安全且不容易被推翻的。"
 GER_clamp_down_on_fascism:0 "鎮壓法西斯"
 GER_clamp_down_on_fascism_desc:0 "在納粹政权的过去幾年中，政府及其法西斯主義的理论家和支持者的壓迫，獨裁和反君主制性質变得非常明显。我们必須改变他们的思維方式。"
 GER_revive_the_kaiserreich:0 "振兴帝国"
 GER_revive_the_kaiserreich_desc:0 "过去十年的事件表明，民主太弱，无法将邪恶的內部因素束縛住。我们必須回到皇帝的堅強领導之下，为了迎接皇帝回国，我们将把憲法恢復到德意志帝国的憲法。"
 GER_revive_the_kaiserreich_tt:0 "§Y德国军政府§!将更名为§Y德意志帝国§!。\n"
 GER_mackensen_dead:0 "奧古斯都·馮·馬肯森逝世。"
 GER_rebuild_the_nation:0 "重建国家"
 GER_rebuild_the_nation_desc:1 "在內战争破壞之后，我们必須致力于重建我们国家。"
 GER_fan_the_prussian_militarism:0 "宣揚普魯士精神"
 GER_fan_the_prussian_militarism_desc:0 "为了彌補我们內战争的損失，我们必須呼喚起民眾對于普魯士军国主義的意识，以招募和培训新兵。我们军队将我们从納粹專政中解放出來，確保这些普魯士理想比以往更受歡迎。"
 GER_a_new_and_better_germany:0 "一个更美好的德国"
 GER_a_new_and_better_germany_desc:0 "在我们重建我们国家的同時，我们应该致力于超越过往，以便我们政权經受的住時间的考驗。"
 GER_bulwark_against_bolshevism:0 "防共壁垒"
 GER_bulwark_against_bolshevism_desc:0 "我们国家是對布爾什維主義的保护，保护西方不受共產主義的影响。我们必須自豪地攜帶这个使命，並准备在必要時使用武器反抗。"
 GER_bulwark_against_bolshevism_tt:0 "§R如果这个国家的精神在蘇联阵营裡或者与蘇联同一方打仗的話，那麼这个国家精神就会喪失。§!\n"
 GER_return_of_the_kaiser:0 "凱撒的歸來"
 GER_return_of_the_kaiser_desc:0 "王位需要一个国王，威廉二世仍然活著並流放在荷蘭。儘管西方民主国家可能会反對，我们将解除他的流亡並邀请他重返王位。"
 GER_focus_on_the_true_enemy:0 "真正的敌人"
 GER_focus_on_the_true_enemy_desc:0 "我们敌人它不是在內部，而是存在于外部。我们必須結束西方殖民的壟斷，並終結凡爾賽的恥辱。"
 GER_rebuild_the_high_seas_fleet:0 "重建公海舰队"
 GER_rebuild_the_high_seas_fleet_desc:0 "如果我们要成功挑战争西方，我们需要一个大规模的海军计划來重建我们曾經輝煌的公海舰队。"
 GER_our_place_in_the_sun:0 "陽光下的领土"
 GER_our_place_in_the_sun_desc:0 "讓所有人都知道，德意志帝国将再次于国際上获得一席之地！我们人民将不再在陰影中受到羞辱。"
 GER_pride_of_the_modern_germany:0 "现代德国的荣光"
 GER_pride_of_the_modern_germany_desc:0 "需要多年的時间才能与英国皇家海军的规模匹敌。所以，我们必須在質量上超过它。我们船将成为最现代和最強大的！"
 GER_prepare_for_the_next_blockade:0 "「破除封锁」计划"
 GER_prepare_for_the_next_blockade_desc:0 "英国如同地獄般的海上封锁是我们上一次战争争失败的主因之一。我们不会再犯同樣的錯誤。这一次，我们将更加努力地为将來做好准备。"
 GER_break_the_anglo_french_colonial_hegemony:0 "打破英法殖民霸权"
 GER_break_the_anglo_french_colonial_hegemony_desc:0 "是時候打破西方對殖民主義的壟斷了，我们等这一天已經很久了"
 flag_franco_british_union:0 "英法联军"
 GER_schlieffen_once_more:0 "重演「施里芬计划」"
 GER_schlieffen_once_more_desc:0 "馬奇諾防线必須被回避。我们将再次通过比利時和盧森堡，迅速取得勝利。"
 GER_reinstate_imperial_possessions:0 "夺回帝国遺產"
 GER_reinstate_imperial_possessions_desc:0 "隨著我们對歷史上德国地区的成功重新征服，我们现在可以开始恢復 [Root.GetName]成为我方的核心省份。凡爾賽的最后恥辱終于被摧毀！"
 GER_crossing_the_atlantic:0 "橫跨大西洋"
 GER_crossing_the_atlantic_desc:0 "隨著所有大陸反對我们統治的征服消失，我们必須将我们生產努力集中到組建一支龐大的海军上，以便我们可以将战争斗帶給英国人和美国人。"
 GER_crossing_the_atlantic_2_factories_tt:0 "每个增筑§G海军船坞§!的沿海省份，都会拆除一个內陸省份的 §2§! 座§G军事工厂§!。\n"
 GER_crossing_the_atlantic_1_factory_tt:0 "每个增筑§G海军船坞§!的沿海省份，都会拆除一个內陸省份的 §1§! 座§G军事工厂§!。\n"
 GER_the_central_powers:0 "中歐同盟"
 GER_the_central_powers_desc:0 "如果重振帝国威名，唯有联合其他王权国家。方能面對民主阵营的壓迫。"
 GER_prepare_italian_coup:0 "義大利政变"
 GER_prepare_italian_coup_desc:0 "義大利深陷法西斯主義當中必須被消滅。在我们支持下，我们会向義大利保皇黨提出一项政变提議。"
 GER_prepare_italian_coup_tt:0 "如果他们接受我们提議：\n"
 GER_assassinate_mussolini:0 "行动目标：墨索里尼"
 GER_assassinate_mussolini_desc:0 "现在是確保義大利法西斯主義結束的時候了。德国人将暗殺这位领導人，之后義大利保皇黨人将迅速获得权力。"
 GER_rekindle_imperial_sentiment:0 "重燃帝国意志"
 GER_rekindle_imperial_sentiment_desc:0 "雖然奧匈帝国在大战争后破滅，但仍然可以找到那些悼念帝国的人。我们将培養这些皇室情緒，希望继承国可以決定重新加入我们。"
 GER_rekindle_imperial_sentiment_tt:0 "如果中立意识形态的支持够高，就会启用讓这些国家重組奧匈帝国並加入中歐同盟的決議。\n"
 GER_expatriate_the_communists:0 "共產黨员流放计畫"
 GER_expatriate_the_communists_desc:0 "共產主義的內部威胁继续困扰著我们国家。我们必須擺脫他们。"
 GER_accept_british_naval_dominance:0 "不列颠无敌舰队"
 GER_accept_british_naval_dominance_desc:0 "英国是反共联盟的首選。为了改善关系，我们将通过接受其海军优势並停止海军建设來減轻他们的担憂。"
 GER_ally_the_shade:0 "明暗联盟"
 GER_ally_the_shade_desc:0 "如果我们不能夺取他们手中「陽光下的土地」，那麼我们将联合那些将陰影投射在我们身上的国家。 "
 GER_carte_blanche_for_alsace_and_french_colonies:0 "重划阿爾薩斯-洛林\n与法属殖民地。"
 GER_carte_blanche_for_alsace_and_french_colonies_desc:0 "我们必須请求我们新盟友允许我们自由地統治阿爾薩斯-洛林的合法领土，並且与我们公平分享非洲的殖民地。"
 GER_bypass_maginot_in_the_south:0 "向南繞过「馬奇諾」"
 GER_bypass_maginot_in_the_south_desc:0 "英国人對低地国家有增強防禦的计畫，所以我们必須在馬奇諾地区外尋找替代路线。南部，雖然山多，难以穿越，但我们必須相信德国人的聰明才智会帶领我们度过难关。"
 GER_see_to_the_eastern_front:0 "著眼東线"
 GER_see_to_the_eastern_front_desc:0 "如果问说我们从上次大战争中学到了什麼，那就是我们必須准备攻擊我们偏遠的東方敌人。必須夺回之前丟失的財富。"
 GER_see_to_the_eastern_front_tt:1 "在§G東部邊境§!的 §H6§! 个§G省份§!上增筑 §Y14§! 座§G陸上堡垒§!。\n"
 GER_see_to_the_eastern_front_tt2:1 "在§G東部邊境§!的 §H4§! 个§!G省份§!上增筑 §Y8§! 座§G陸上堡垒§!。\n"
 GER_danzig_for_guarantees:0 "但澤換保障"
 GER_danzig_for_guarantees_desc:1 "波蘭人肯定会感受到布爾什維克的危險。也许我们可以就但澤问题达成协議，以換取在紅军入侵的情況下提供军事支援的保证。"
 GER_safeguard_the_baltic:0 "保障目标：波羅的海"
 GER_safeguard_the_baltic_desc:0 "直到幾十年前，波羅的海仍然是俄羅斯帝国的一部分，而且他们認为蘇联可能会再次試圖吞并它们。我们必須防止这一点，並在蘇联入侵的情況下提供我们军事支援。"
 GER_support_the_finns:0 "保障目标：芬蘭"
 GER_support_the_finns_desc:0 "芬蘭人发现自己處在蘇联的火线上。我们将为他们提供反對共產主義威胁的保证，並給予他们一些适度的工业援助。"
 GER_anti_comintern_pact_unaligned:0 "防共主義"
 GER_anti_comintern_pact_unaligned_desc:0 "军事威胁不是我们遭受的唯一危險。我们必須想方设法讓共產主義陷入困境，为此，我们将与我们非共產黨人締結一项协議，決心打擊共產黨。"
 GER_anti_soviet_pact_unaligned:1 "防共書面协定"
 GER_anti_soviet_pact_unaligned_desc:1 "我们应该准备与共產主義国发生军事衝突，邀请所有反共协議簽署方同意增加一项要求就是對任何蘇联侵略提供军事支援的条款。由于我们已經在许多方面相互承諾，这应该要成为具体作为。"
 GER_tackle_the_communist_threat:0 "消滅赤色威胁"
 GER_tackle_the_communist_threat_desc:0 "只要蘇联存在，它就会對我们構成巨大的威胁。我们不是等待他们瓦解，而是要掌握主动权。"
 GER_the_iberian_problem:0 "伊比利问题"
 GER_the_iberian_problem_desc:0 "歐洲共產主義堡垒依然存在。我们必須確保从共產主義西班牙开始，一切都被剷除。"
 GER_spain_wargoal_tt:0 "获得针對§Y西班牙社会主義共和国§!的战争争目标：「§Y吞并§!」\n"
 GER_reestablish_free_elections:0 "重建普選制度"
 GER_reestablish_free_elections_desc:0 "我们将通过重新舉行自由選舉來恢復民主理想，並将在不久的将來舉行。"
 GER_the_monarchy_compromise:0 "妥协君主制"
 GER_the_monarchy_compromise_desc:0 "争取我们擺脫納粹暴政的军队有清晰的保皇派倾向。为了確保他们對国家正在採取的道路感到滿意，我们必須妥协並讓君主制回歸。"
 GER_the_great_red_menace:0 "赤色恐怖"
 GER_the_great_red_menace_desc:0 "我们在前一场战争争中的行动仍然記憶猶新。我们必須重新关注真正的危險：東方的共產主義威胁。我们将开展大规模的宣傳活动，打开大陸的眼界。"
 GER_central_european_alliance:0 "中歐联盟"
 GER_central_european_alliance_desc:0 "既然我们已經集中关注这个大陸的问题，我们必須提出解決方案：我们将为歐洲所有次要国家帶來联盟，这将確保免受影响我们生活方式的最致命威胁。"
 GER_central_european_alliance_tt:0 "如果沒有加入阵营：\n"
 GER_danubian_membership:0 "拉攏目标：多瑙河流域"
 GER_danubian_membership_desc:0 "奧匈帝国並沒有忘記成为我们盟友意味著什麼。我们将为他们提供会员资格和免受共產主義威胁的保护。"
 GER_danubian_expansion:0 "多瑙河扩张计畫"
 GER_danubian_expansion_desc:0 "我们必須谋求扩大我们對那些容易遭受蘇联侵略的巴爾幹国家的影响力。我们将向多瑙河上的其他国家提供成员资格和免受共產主義威胁的保护。"
 invite_non_fascist_communist_only_TT:1 "要求潜在的成员国不要成为法西斯主義者或共產主義者。\n"
 GER_no_balkan_communism:0 "淨化目标：巴爾幹"
 GER_no_balkan_communism_desc:0 "共產主義影响已悄悄进入巴爾幹地区，我们不能允许。它必須在生根之前銷毀。"
 GER_no_balkan_communism_tt:0 "获得针對巴爾幹国家共產主義政权的战争争目标：「§Y颠覆政权§!」\n"
 GER_no_balkan_communism_HUN_tt:0 "获得针對§Y匈牙利人民共和国§!的战争争目标：「§Y颠覆政权§!」\n"
 GER_no_balkan_communism_ROM_tt:0 "获得针對§Y羅馬尼亞人民共和国§!的战争争目标：「§Y颠覆政权§!」\n"
 GER_no_balkan_communism_YUG_tt:0 "获得针對§Y南斯拉夫社会主義联邦§!的战争争目标：「§Y颠覆政权§!」\n"
 GER_no_balkan_communism_BUL_tt:0 "获得针對§Y保加利亞社会主義共和国§!的战争争目标：「§Y颠覆政权§!」\n"
 GER_low_countries_membership:0 "拉攏目标：荷比盧"
 GER_low_countries_membership_desc:0 "雖然遠离歐洲東部邊界，但低地国家卻知道如果中歐垮台，它们将成为下一个。我们将为他们提供会员资格，以便他们能够与我们站在一起，抵抗共產主義的威胁。"
 GER_no_reds_in_western_europe:0 "淨化目标：西歐"
 GER_no_reds_in_western_europe_desc:0 "共產主義影响已蔓延到西歐，这是我们不能允许的。它必須在生根之前銷毀。"
 GER_no_reds_in_western_europe_tt:0 "获得针對其他歐洲共產政权进行§Y颠覆政权§!的战争争目标。\n"
 GER_no_reds_in_western_europe_FRA_tt:0 "获得针對§Y法国公社§!进行§Y颠覆政权§!的战争争目标。\n"
 GER_no_reds_in_western_europe_HOL_tt:0 "获得针對§Y荷蘭人民公社§!进行§Y颠覆政权§!的战争争目标。\n"
 GER_no_reds_in_western_europe_BEL_tt:0 "获得针對§Y比利時人民公社§!进行§Y颠覆政权§!的战争争目标。\n"
 GER_no_reds_in_western_europe_LUX_tt:0 "获得针對§Y羅莎盧森堡§!进行§Y颠覆政权§!的战争争目标。\n"
 GER_scandinavian_membership:0 "拉攏目标：斯堪的納維亞"
 GER_scandinavian_membership_desc:0 "山脈和寒冷无法抵禦紅色威胁，斯堪的納維亞人必須知道这一点。我们将为他们提供会员资格和免受共產主義威胁的保护。"
 GER_baltic_membership:0 "拉攏目标：波羅的海"
 GER_baltic_membership_desc:0 "二十年來，波羅的海一直生活在重新吞并和共產主義的雙重威胁之下。我们将为他们提供会员资格和免受共產主義威胁的保护。"
 GER_polish_membership:0 "拉攏目标：波蘭"
 GER_polish_membership_desc:0 "波蘭人有不相信所有的鄰居，但他们知道來自東方的最大威胁。我们将为他们提供会员资格和免受共產主義威胁的保护。"
 GER_finnish_membership:0 "拉攏目标：芬蘭"
 GER_finnish_membership_desc:0 "遠离歐洲中心的芬蘭人面临著紅人的風險。我们将为他们提供会员资格和免受共產主義威胁的保护。"
 GER_strike_at_the_source:0 "源頭打擊计畫"
 GER_strike_at_the_source_desc:0 "生活在恐懼之中的生活根本不是生活；我们必須一勞永逸地終結这种威胁我们生活方式。歐洲共產主義影响力的來源必須予以摧毀。"
 GER_reverse_the_brain_drain:0 "人才回流计畫"
 GER_reverse_the_brain_drain_desc:0 "既然壓迫者和專制政权已經被擊败，我们可以試圖讓那些逃离的科学家们回到家鄉並重新开始工作。"
 GER_shared_rd_programs:0 "研究与发展共享计划"
 GER_shared_rd_programs_desc:0 "为了我们事业，我们必須集中我们科学知识，並与我们新盟友分享我们技术进步。"
 GER_the_mannheim_project:0 "「曼海姆」计畫"
 GER_the_mannheim_project_desc:0 "由于挪威的重水厂现在處于我们控制之下，我们可以加倍努力破解原子的秘密，並且投入研发對抗布爾什維克的武器。"
 GER_the_mannheim_project_tt:0 "根據不同的进度，給予不同的加成：\n"
 GER_pool_technical_know_how:0 "技术交流方案"
 GER_pool_technical_know_how_desc:0 "每个国家都有自己的管理工业和維护设备的方法。我们可以通过派遣技术团队向联盟的其他成员傳播这种知识來相互学習。"
 GER_pool_technical_know_how_tt:0 "该派別中的每个民族都将获得这种国家精神。"
 ITA_ethiopian_war_logistics:0 "衣索比亞战争争補給线"
 ITA_ethiopian_war_logistics_desc:0 "我们可能誤判了依索比亞的補給情形，我们必須盡力为该地奮勇殺敌的我们十兵提供必要的補給物资。"
 ITA_fortification_effort:0 "建设防线"
 ITA_fortification_effort_desc:0 "我们必須自那依然拥护頹廢帝制的法国与英国手中保卫我们领土。"
 ITA_fortification_effort_forts:0 "在§G法義邊界§!上增筑 §Y15§! 座§G陸上堡垒§。\n"
 ITA_army_primacy:0 "陸军优先"
 ITA_army_primacy_desc:0 "義大利在工业化程度上依然落后那頹廢的帝国许多，所以我们僅能在陸军与海军之间擇一加強，该如何選擇實在再明確不过，如同过去的大羅馬帝国依賴著军团一般，新兴的義大利帝国也应该如此！"
 ITA_modernized_artillery:0 "现代化炮兵"
 ITA_modernized_artillery_desc:0 "按理，義大利陸军（Regio Esercito）是世界上最大的军队，但不幸的是，我们工业无力将全数武裝现代化，最慘的是，大多数士兵甚至還在使用一九一八年製造的火炮！"
 ITA_modernized_army:0 "现代化汽车"
 ITA_modernized_army_desc:0 "先进的火炮能大幅增強我军的战争斗力，但同時也需要现代化的战争术及理论來相輔相成。"
 ITA_armored_effort:0 "裝甲縱队"
 ITA_armored_effort_desc:0 "在衣索比亞的战争事非常順利，但我军的战争车尚不足与那些腐败但依然有力的歐洲「民主国家」抗衡。"
 ITA_mare_nostrum:0 "称霸地中海"
 ITA_mare_nostrum_desc:0 "由于英国将我们封锁于地中海內，致使我们必須因资源不足而做出一些痛苦的決定。为了打破现状，我们需要一支足够強大的舰队。"
 ITA_carrier_effort:0 "航母舰队"
 ITA_carrier_effort_desc:0 "现代化的战争斗舰队将以航母而非战争舰为中心組成，空中优势對舰艇造成的威胁早在1921年美国就展示过了！"
 ITA_capital_ships:0 "主力舰队"
 ITA_capital_ships_desc:0 "拥有最多战争舰的国家将統治海洋！我们不能允许皇家海军在地中海拥有比我们更大的优势！"
 ITA_bomber_effort:0 "轟炸机队"
 ITA_bomber_effort_desc:0 "陸军埋首行进便可贏得战争争的時代已經过去了！我们必須全力研发战争术轟炸机，以提供我军必需的地面支援。"
 ITA_atlantic_fleet:0 "大西洋舰队"
 ITA_atlantic_fleet_desc:0 "一但突破英国皇家海军的封锁，我们第一要务便是打造一支足以在大西洋上展示国力的舰队！"
 ITA_marines_and_landing_craft:0 "海军陸战争队与登陸艇"
 ITA_marines_and_landing_craft_desc:0 "单靠海军是不可能取得勝利的，我们必須同時拥有登陸抢滩技术。"
 ITA_jet_engine_effort:0 "喷射引擎"
 ITA_jet_engine_effort_desc:0 "拜塞康多·坎皮尼（Secondo Campini）之賜，義大利拥有了率先取得次世代引擎科技的机会。我们应盡力滿足他的需求，以實现他为義大利空军（Regio Aeronautica）所做的设计。"
 ITA_light_ship_effort:0 "护卫舰队"
 ITA_light_ship_effort_desc:0 "來往于本土与殖民地之间的運输舰队需要相应的保护，我们必須研发更新的海军战争术与更先进的护航舰艇。"
 ITA_escort_effort:0 "护航舰队"
 ITA_escort_effort_desc:0 "我们应该为在地中海穿梭的我们運输舰队提供更好的保护。"
 ITA_sea_wolves:0 "海狼计畫"
 ITA_sea_wolves_desc:0 "可靠的德国盟友已靠著海量的潜艇与狼群战争术揚名立萬，我们应向之看齊。"
 ITA_slovenia_dalmatia_claims:0 "战争争目标：南斯拉夫"
 ITA_slovenia_dalmatia_claims_desc:0 "南斯拉夫有著许多的義大利籍住民，最早可回溯至輝煌的威尼斯時代，使这些领土能回歸義大利掌控是重建羅馬帝国的重要一步！"
 ITA_slovenia_dalmatia_claims_threat:0 "義大利宣称南斯拉夫主权"
 ITA_yugoslavia_friend:0 "親善目标：南斯拉夫"
 ITA_yugoslavia_friend_desc:0 "与其和南斯拉夫正面衝突，我们不妨利用一些迂回的手段。我们可以試著与其交好，令其倾向我们阵营。"
 ITA_support_nationalist_spain:0 "援助目标：\n西班牙王国"
 ITA_support_nationalist_spain_desc:0 "西班牙正處于一个紧要关頭，他们或能成为可靠的法西斯盟友，也可能继续維持毫无用處的共和政府，最糟的状況是淪入共產黨手中或陷入无政府状态。我们必須在局势难以挽回之前介入，支持純正的西班牙人取得政权！"
 ITA_demand_balearic_islands:0 "索要巴利亞里群島"
 ITA_demand_balearic_islands_desc:0 "在確實的支援佛朗哥政权之后，我们有权向其要求部分我军为其死战争所拿下的领土。取得巴里亞利群島（Balearic Islands）后，将大幅增強我们在地中海的控制权。"
 ITA_bulgaria_friend:0 "親善目标：保加利亞"
 ITA_bulgaria_friend_desc:0 "保加利亞已在我方势力圈內，他们与我们的稳定邦交是我们进军巴爾幹的关鍵。"
 ITA_albania_war_goal:1 "战争争目标：阿爾巴尼亞"
 ITA_albania_war_goal_desc:1 "占领阿爾巴尼亞對我军來说不过是舉手之勞。我们必須向世界展示義大利的力量，並恢復羅馬帝国的荣光！"
 ITA_pact_of_steel:0 "钢条約"
 ITA_pact_of_steel_desc:0 "我们与納粹德国的邦交雖因意识型态的不合与互相衝突的目标而不稳，首领對德国吞并奧地利与在巴爾幹地区扩张领土的舉动非常担憂。不过，世事多变..."
 ITA_germ_italy_same_tt:0 "§Y義大利§!和§Y德意志§!的§Y思潮§!相同。"
 ITA_german_millitary_cooperation:0 "德意志军事顧问"
 ITA_german_millitary_cooperation_desc:0 "透过与德国的紧密合作，我们得以去蕪存菁，篩選出最好的技术。我们将給予任何膽敢忤逆義大利的人迎頭痛擊。"
 ITA_claims_on_france:0 "战争争目标：維琪法国"
 ITA_claims_on_france_desc:0 "隨著德国占领巴黎，法国出现了新的政权。同志们！宣称南歐主权的時候到了！德国已橫掃歐洲北部，我们也应该有分一杯羹的资格！"
 ITA_claims_on_france_tt:0 "§Y維琪法国§!存在並掌管著§Y薩伏伊§!和§Y科西嘉§!"
 ITA_go_after_france:0 "战争争目标：法蘭西"
 ITA_go_after_france_desc:0 "法国，不过是另一个充滿反动思想的「西方民主国家」罷了！他们无時无刻不在思考如何阻撓与妨害義大利的进步！我们将为義大利与帝国的未來而战争！"
 ITA_claims_on_turkey:0 "战争争目标：土耳其"
 ITA_claims_on_turkey_desc:0 "1915年的倫敦条約允諾将割讓土耳其在安那托利亞的领土予我们，条件是我们将地中海東部控制权讓予那些「西方強权国家」。那些国家们得到他们想要的领土之后，卻以「我们不过是区区的国際联盟，所定条約並无強制力」为由，踐踏了我们的权益！新生的義大利再也不像舊時代那般軟弱了，我们将以實力取得英国承諾的领土！"
 ITA_italy_first:0 "義大利萬歲"
 ITA_italy_first_desc:0 "墨索里尼不会屈居于希特勒之下！我们必須記取羅馬帝国時代的教训！記住，讓条頓人干涉義大利絕對不会有好結果！"
 ITA_romania_friend:0 "親善目标：羅馬尼亞"
 ITA_romania_friend_desc:0 "讓我们的遠親羅馬尼亞加入我方阵营對我们來说是最好的選擇，首领在他们的「鐵卫军」身上看到了无窮的潜力。"
 ITA_german_rd_treaty:0 "德義条約"
 ITA_german_rd_treaty_desc:0 "我们应该与德国簽訂互助互惠的科技研发协約。"
 ITA_spanish_italian_faction:0 "義西同盟"
 ITA_spanish_italian_faction_desc:0 "佛朗哥和西班牙国家社会主義者是我们的潜在盟友，我们在宗教、文化与理念上都有许多相同之處。只要同心协力，我们可以夺取直布羅陀控制权，並讓皇家海军悽慘落魄。"
 ITA_italian_highways:0 "義大利鐵路"
 ITA_italian_highways_desc:0 "我们需要扩建更多的基础设施來保证部队的机动性，由于義大利處于眾敌環伺的險境，此建设计畫显得格外重要。"
 ITA_libyan_refineries:0 "利比亞炼油厂"
 ITA_libyan_refineries_desc:0 "因地理位置及天然资源之利，班加西（Benhasi - 原文，Benghazi - 正式英文）是兴建炼油厂的最佳地区。"
 ITA_libyan_infrastructure:0 "利比亞鐵路"
 ITA_libyan_infrastructure_desc:0 "相較于本土，我们在北非的殖民地基础设施明显不足，我们应该讓那些地方看起來像樣点。"
 ITA_prospect_for_oil:0 "探勘石油"
 ITA_prospect_for_oil_desc:0 "我们不该依賴那些总是畏懼新势力兴起的古老帝国，我们应该嘗試在国內探勘油田，減少對进口石油的依賴。这是我们維持競争力的关鍵。"
 ITA_greece_war_goal:0 "战争争目标：希臘"
 ITA_greece_war_goal_desc:0 "若不能将希臘地区納入领土，還談甚麼重建羅馬帝国他们根本就是美味可口的佳餚..."
 ITA_greece_friend:0 "親善目标：希臘"
 ITA_greece_friend_desc:0 "希臘不只与我们同为古老的民族，還是西方文明的搖籃。和他们交涉對我们來说应该不会太难..."
 ITA_turkey_friend:0 "親善目标：土耳其"
 ITA_turkey_friend_desc:0 "在義大利 - 土耳其衝突及上次大战争之后，土耳其對我们的仇视大概到了极点。然而，此一時彼一時，依现今地中海形势來看，讓我们两国取得共识似乎不是不可能..."
 ITA_portugal_friend:0 "親善目标：葡萄牙"
 ITA_portugal_friend_desc:0 "葡萄牙与西班牙一樣，都是義大利的潜在盟友。我们必須设法加強两国之间的友誼。"
 ITA_anti_uk_war_goals:0 "战争争目标：英格蘭"
 ITA_anti_uk_war_goals_desc:0 "腐败的大英帝国将我们封锁于地中海內，並拒絕以任何形式通融，我们应選擇适當時机對其发动攻擊！"
 ITA_japan_friend:0 "親善目标：日本"
 ITA_japan_friend_desc:0 "日本与我们相同，都是渴求权力並拥有勤奮人民的新兴国家，還有，我们都被英国、荷蘭那些吸血鬼们以各种贸易条約壓榨。我们应该团結一致建立跨洲軸心势力！！"
 soviet_focus:0 "蘇联的战争略路线"
 SOV_finish_five_year_plan:0 "完成五年计畫"
 SOV_finish_five_year_plan_desc:0 "五年计畫第二階段的重点在于发展重工业。蘇联的工业力不能落在那些西方的资本主義者跟法西斯主義者后頭。"
 SOV_move_industry_to_urals:0 "遷移烏拉爾"
 SOV_move_industry_to_urals_desc:0 "不能讓那些背信棄義的希特勒走狗夺取我们西部寶貴的工厂！我们应盡最大努力、不惜一切代價的将貴重的工厂組件后撤到烏拉河流域！"
 SOV_defense_of_moscow:0 "保卫莫斯科"
 SOV_defense_of_moscow_desc:0 "那些法西斯混蛋已經打到首都的大門外了！不能讓莫斯科落入異族之手！动员所有人！无论男女老幼，所有人！我们必須无所不用其极的保卫首都！"
 SOV_defense_of_moscow_forts:0 "在莫斯科周邊增筑 §Y28§! 座§G陸上堡垒§!。\n"
 SOV_infrastructure_effort:0 "莫斯科地鐵"
 SOV_infrastructure_effort_desc:0 "蘇联雖然幅员廣大、资源豐富，但开发嚴重不足。首先我们应加強交通運输系統的建设，確保资源能送到需要的地方。"
 SOV_tranformation_of_nature:0 "自然改造大计畫"
 SOV_tranformation_of_nature_desc:0 "史达林的自然改造计畫必須付諸實现！人定勝天！自然必定臣服于人類腳下！"
 SOV_stalin_constitution:0 "史达林憲法"
 SOV_stalin_constitution_desc:0 "讓世界驚嘆的時刻到了！将那破舊的古老憲法捨棄吧！新的憲法会讓国內的每一个勞动人民都歡欣雀躍！"
 SOV_collectivist_propaganda:0 "集体主義"
 SOV_collectivist_propaganda_desc:0 "在这人人平等的国家，不允许追求个人荣耀的行为！我们宣傳部門应加強宣導集体勞作的重要性！讓人民知道唯有如此才能超越个人极限！才能创造空前偉业！"
 SOV_militarized_schools:0 "军事化学校"
 SOV_militarized_schools_desc:0 "蘇維埃的孩子们应盡早开始学習军事紀律以及自我犧牲与团結一致等等的社会主義思想！塑造完美人格从小做起！"
 SOV_workers_culture:0 "工人文化"
 SOV_workers_culture_desc:0 "社会主義不只是經濟系統，馬克思主義也不只是科学；我们必須从根基开始重塑蘇維埃社会，徹底拔除资產階级的陋習与傳統的破舊思想！"
 SOV_new_soviet_man:0 "新蘇維埃公民"
 SOV_new_soviet_man_desc:0 "新生的蘇維埃公民是无私、有文化、守紀律又健康的！是战争勝人類本能与虛假意志的最高典範！每个男人都毫不猶豫地为全人類奉獻生命，而女人们都愿为蘇維埃的将來竭盡所能！"
 SOV_positive_heroism:0 "英雄主義"
 SOV_positive_heroism_desc:0 "该是揚棄列寧式的集体主義思想的時候了！讓我们为那些有著超人表现的个体大肆宣傳，为国民建立社会主義實踐者的不朽榜樣！"
 SOV_progress_cult:0 "科学狂热"
 SOV_progress_cult_desc:0 "所有正確的自由思想都是值得鼓勵的，讓我们为那些傑出科学家的勇于创新歡欣鼓舞！看看李森科同志的豐功偉业吧！蘇联對于未知领域的开发将会永遠领先于那些陳腐的西方世界！"
 SOV_socialist_science:0 "社会主義科学"
 SOV_socialist_science_desc:0 "世界就像一个不斷进化的心靈。如同大自然不停的进步一樣，革命也是进步的一環。辯证唯物主義的原理可以应用所有地方，包括科学领域以及社会結構..."
 SOV_aviation_cult:0 "飞行狂热"
 SOV_aviation_cult_desc:0 "蘇联的航空技术将震驚世界！我军的飞行员如同象征布爾什維克文化与进步的骑士一般，展示著自沙皇時代結束以來我们科技掌控自然的成果！"
 SOV_women_pilots:0 "女飞行员"
 SOV_women_pilots_desc:0 "羅斯科娃同志，是我军英勇的長程飞行员，请求允许建立全女性飞行部队，将成为我们第 122 空军联队。"
 SOV_night_witches_tt:0 "§Y第 588 夜间轟炸机队§!已于§Y莫斯科§!就緒。"
 SOV_socialist_realism:0 "社会主義与现實主義"
 SOV_socialist_realism_desc:0 "蘇联所有的藝术家都应该致力于讓人民了解无產階级的规律生活，这些靈魂塑造者将引领人民實现偉大的共產主義！"
 SOV_improve_railway:0 "鐵路網"
 SOV_improve_railway_desc:0 "事實证明五年计畫十分成功！大量增長的重工业讓蘇維埃社会拥有了強大的自保能力，但鐵路建设的缺乏是一个致命的弱点。鐵路人民委员会（NKPS）将会解決这个问题，讓蘇联的防卫能力更进一步。"
 SOV_transpolar_flights:0 "北极航线"
 SOV_transpolar_flights_desc:0 "我们英勇的飞行员证明了飞越北极不再是夢想！若把这些令人意想不到的飞行路徑应用于空军战争术之中，我军将可以出其不意的袭擊敌人。"
 SOV_ocean_going_navy:0 "大舰队"
 SOV_ocean_going_navy_desc:0 "雖然联合拥有傲视全球的领土，但不可滿足于此，海洋仍然等待著我们的統治。重裝战争舰将是我们偉大舰队的主力！"
 SOV_peoples_commissariat:0 "国防工业人民委员会"
 SOV_peoples_commissariat_desc:0 "国防工业人民委员会将会领導蘇維埃政府的重工业專注开发国防项目。長遠來看，工作量可能需将该部門进一步分裂。"
 SOV_anti_fascist_diplomacy:0 "反法西斯外交"
 SOV_anti_fascist_diplomacy_desc:0 "在所有陳朽腐败的西方国家裡，最可恶的就是那披著虛偽进步外皮的法西斯主義者！他们正試圖透过向无產階级散布錯誤意识型态的手段來阻礙偉大的革命！"
 SOV_operation_zet:0 "Zet 行动"
 SOV_operation_zet_desc:0 "儘管国民黨只是个小小的反动組織，不过毛澤東与他的黨员们似乎进行得不是很順利。我们应该趁机打擊日本，增进与蔣中正的关系，反正那个可笑的太陽帝国潰败是早晚的事。"
 SOV_annex_tannu_tuva:0 "吞并唐努圖瓦"
 SOV_annex_tannu_tuva_desc:0 "雖然吞并唐圖努瓦並不会對我们經濟有所助益，但从政治上來考量，我们還是应该将其納入蘇联的版圖。"
 SOV_improve_stalin_line:0 "改进史达林防线"
 SOV_improve_stalin_line_desc:0 "我们应该将西方邊境的防禦工事现代化以防範法西斯份子的攻擊。"
 SOV_far_east_fortification:0 "遠東防线"
 SOV_far_east_fortification_desc:0 "日本人一直在滿洲邊境製造问题，強化東部邊界的防线來防堵日军才是一勞永逸的作法。"
 SOV_far_east_fortification_forts_1:0 "在§G日蘇邊境§!上增筑 §Y8§! 座§G陸上堡垒§!。\n"
 SOV_far_east_fortification_forts_2:0 "在§G日蘇邊境§!上增筑 §Y8§! 座§G陸上堡垒§!。\n"
 SOV_far_east_fortification_forts_3:0 "在§G日蘇邊境§!上增筑 §Y4§! 座§G陸上堡垒§!。\n"
 SOV_xian_incident:0 "西安事变"
 SOV_xian_incident_desc:0 "利用我方在中国的关系，我们应该能够綁架蔣中正來強迫他与毛澤東講和，讓中国成为我方對抗日本的盟友。"
 SOV_xian_incident_tt:0 "若雙方皆同意，則中国国民黨与中国共產黨将握手言和，共同抗日。"
 SOV_anti_capitalist_diplomacy:0 "反资本主義外交"
 SOV_anti_capitalist_diplomacy_desc:0 "美国癡肥的銀行家与英国无情的殖民者，无疑是世界革命運动最大的絆腳石！破壞他们紧密的合作关系以及阻止自由主義的散布是我们第一要务！"
 SOV_expand_red_fleet:0 "海军革新"
 SOV_expand_red_fleet_desc:0 "比起那些西方国家，紅军舰队簡直不堪一擊！我们必須扩展舰队规模！"
 SOV_anti_colonialist_rebels:0 "共產国際"
 SOV_anti_colonialist_rebels_desc:0 "同志们！腐败的资本社会即将潰滅！讓我们集結所有同志，給予它最后一擊！讓世界知道共產主義是完美的！是積极的！是有斗争力的！打倒軟弱的溫和派！擊垮奸險的走资派！同志们！讓世界看看团結的力量吧！"
 SOV_southern_thrust:0 "南进政策"
 SOV_southern_thrust_desc:0 "吞并伊朗与伊拉克不只将使我们获得更多的石油，更可以增加對英国在埃及与印度殖民地的直接壓力！"
 SOV_reconcile_japan:0 "對日和解"
 SOV_reconcile_japan_desc:0 "雖然我们与那些矮子的关系一直都很差，但是为了完成达成更大的目标，我们应利用豐富资源來誘使那个貧乏的小国为我们打頭阵！反正那个可笑的帝国遲早会被偉大的革命推翻。"
 SOV_claim_on_sinkiang:0 "索要新疆"
 SOV_claim_on_sinkiang_desc:0 "在盛世才同志的帶领下，新疆已經完全成为我们的傀儡，该是正式将其納入领土的時候了。"
 SOV_claim_on_sinkiang_threat:0 "蘇联声明新疆主权"
 SOV_pan_slavic_rhetoric:0 "泛斯拉夫主義"
 SOV_pan_slavic_rhetoric_desc:0 "列寧同志的世界革命思想，讓斯拉夫民族幾乎喪失了民族性。讓我们重建斯拉夫民族的驕傲，讓其他斯拉夫国家们与我们一同攜手创造新世界吧！"
 SOV_claims_on_baltic:0 "战争争目标：波羅的海"
 SOV_claims_on_baltic_desc:0 "我们在大革命時喪失了彼得大帝對于西方港口的宣称权，为了完成革命，应该使其重回我们手中。"
 SOV_claim_bessarabia:0 "战争争目标：比薩拉比亞"
 SOV_claim_bessarabia_desc:0 "對我们來说，黑海比波羅的海更加重要！我们必須用盡一切方法來確保博斯普魯斯海峽和达达尼爾海峽的控制权。"
 SOV_claims_on_turkey:0 "战争争目标：土耳其"
 SOV_claims_on_turkey_desc:0 "土耳其人一直拒絕我们共同管理博斯普魯斯海峽的要求，也拒絕与我们討论東部领土的争議！同志们！讓我们給他们一个教训！讓他们知道无视我们下场！"
 SOV_baltic_security:0 "鞏固波羅的海"
 SOV_baltic_security_desc:0 "波羅的海是我们的前庭，必須不惜一切的來保卫它！同志们！我们必須終止愛沙尼亞那荒謬可笑的自治，並控制卡萊利亞以提供列寧格勒安全的緩衝帶！"
 SOV_claims_on_poland:0 "战争争目标：波蘭"
 SOV_claims_on_poland_desc:0 "同志们！为一雪慘败給波蘭的恥辱进军！波蘭東部必須成为蘇联领土！"
 SOV_demand_eastern_poland:0 "索要波蘭東部"
 SOV_demand_eastern_poland_desc:0 "在重申我们對于波蘭東部领土的主权后，波蘭人应该知道若不把土地雙手奉上会有甚麼后果了！"
 SOV_offer_poland_protection:0 "保障波蘭"
 SOV_offer_poland_protection_desc:0 "雖然我们可以轻易地占领波蘭，但讓他们加入我们共產阵营也是个不錯的選擇。若允諾未來給予他们德国東半部的领土，相信他们不会拒絕我们邀请。"
 SOV_offer_poland_protection_tt:0 "§Y在蘇联征服事件中的同意選项将会給予波蘭地区主权。§!\n"
 SOV_great_purge:0 "大清洗"
 SOV_great_purge_bypass_tt:0 "托洛斯基正式成为蘇联最高领袖"
 SOV_great_purge_desc:0 "托洛斯基那个卑鄙小人正在醞釀大规模政变！它的影响層面甚至包含高階军官！雖然托洛斯基的意圖仍然不明，但蘇联很可能因为他而陷入第二次內战争！我们必須採取必要措施，以免事态越來越嚴重！"
 SOV_great_purge_tt:0 "将有一些高级官员会接受一系列§Y「公正」§!又§Y「和平」§!的§Y審判§!。§!\n"
 SOV_great_purge_tt2:2 "§Y大清洗的完成度越高，內战争爆发時敌方強度越低，但本国內政因清洗所受損伤也越大，反之亦然。\n倘若選擇不推行的話不僅会有高机率爆发§Y內战争§!，同時還会吸引流亡海外的§Y列夫·托洛茨基§!重返蘇联。\n\n"
 SOV_permanent_revolution:0 "永遠的革命！"
 SOV_permanent_revolution_tt:0 "托洛斯基回來了！"
 SOV_permanent_revolution_tt2:0 "§Y托洛斯基§!得到了更好的领袖特性。"
 SOV_permanent_revolution_desc:0 "殘暴壓迫无辜百姓的煽动者和統治者已經死了！权力重新回到了人民的手中，人民现在可以追隨自己的意志而不需要妥协什麼了。我们始終都在进步，永遠的革命是勝利的革命。"
 SOV_rehabilitated_military:0 "改造军队"
 SOV_rehabilitated_military_desc:0 "在去除托洛斯基的污漬后，或许可以給予军方多一点自由发展的空间。"
 SOV_military_reorganization:0 "军事重組"
 SOV_military_reorganization_desc:0 "大清洗對军队造成很大的損伤，新任的军官因經驗与领導力不足而无法发挥作用，战争术与理论的研发亦停滯不前，我们必須设法改变现状！"
 SOV_nkvd_primacy:0 "內务人民委员会\n（NKVD）"
 SOV_nkvd_primacy_desc:0 "大清洗讓我们了解絕對不可以信任军队！因此我们将賦予內务人民委员会更大的权力，利用更多的政战争官來確實掌控军官的思想。"
 SOV_nkvd_divisions:0 "內务人民委员会\n作战争局"
 SOV_nkvd_divisions_desc:0 "內务人民委员会将会拥有自己的部队，以鞏固重要设施及鐵路的防禦。"
 SOV_lessons_of_war:0 "战争争的洗禮"
 SOV_lessons_of_war_desc:0 "經由参与他国战争争取得的經驗，可讓我们裝甲部队获得极大的成長，甚至可能讓那些军官们获得更大的进步！"
 SOV_smersh:0 "国防人民委员部\n（NKGB）"
 SOV_smersh_desc:0 "将反间諜机構从內务人民委员会中獨立出來，负責执行對外情报作战争与對內情报管控。"
 SOV_smersh_tt:0 "§Y抵銷政变的風險。§!\n"
 SOV_partisan_suppression:0 "反间諜总局\n（SMERSH）"
 SOV_partisan_suppression_desc:0 "进一步扩展施密爾舒的权限，讓他们得以有效的鎮壓反抗者，可以讓我们更簡单的管理占领区。"
 SOV_war_with_germany:0 "战争争目标：德意志"
 SOV_war_with_germany_desc:0 "德国的扩张必須畫上休止符，強大的紅军将讓他们了解誰才是真正的統治者！"
 SOV_war_with_germany_tt:0 "德蘇互不侵犯条約未生效。"
 SOV_war_with_japan:0 "战争争目标：日本"
 SOV_has_not_officers_purged_tt:0 "沒有国家精神「§Y大清洗§!」"
 SOV_war_with_japan_desc:0 "在強大的紅军蹂躪那小小島国時，日本将后悔他们沒有在该退讓的時候讓步！"
 SOV_war_with_uk:0 "战争争目标：英格蘭"
 SOV_war_with_uk_desc:0 "英国那个帝国主義渾蛋从不把我们放在眼裡，當他们完成對其他国家的征服時，一定会将矛頭指向我们，我们必須先下手为強！"
 SOV_claim_on_the_straits:0 "战争争目标：黑海"
 SOV_claim_on_the_straits_desc:0 "黑海与愛琴海的顎口對我们來说是非常重要的战争略地点，为了紅军舰队，我们不能允许外人掌控该地！"
 SOV_ultimatum_to_greece:0 "战争争目标：希臘"
 SOV_ultimatum_to_greece_desc:0 "为了讓紅军舰队能通行无阻，愛琴海群島是最后一處必要的战争略要地。由于希臘目前窘迫的国情，或许小小的威胁便足以讓他们同意放棄一点领土來避免全面开战争。"
 SOV_diversify_the_programme:0 "「多邊形」武器試驗场"
 SOV_diversify_the_programme_desc:0 "我们将过去一年所学到的知识应用在傳統战争场上，证明了其有效性。我们有许多對战争争科技有獨到见解的科学家，若能給予他们更好的工作環境，相信他们便能研发出更好的战争争机器。"
 SOV_research_city_experiment:0 "原子能試驗计畫"
 SOV_research_city_experiment_desc:0 "我们最重要的首席科学家之一，庫爾恰托夫已經在一次實驗中確認，一公斤的鈾原子在进行核裂变時所釋放出的能量就相當于两萬噸的三硝基甲苯（TNT）。为了確保祖国的安全与未來，我们必須在其他人发现之前掌握这项技术。"
 SOV_closed_city_network:0 "獨立科学園区"
 SOV_closed_city_network_desc:0 "我们应该设置獨立的封閉式研究城市，給予我们科学家更大的實驗场地來进行更大规模的秘密研究。"
 strike_usa_focus:0 "虎！虎！虎！"
 strike_usa_focus_desc:0 "欺瞞成性的美国人四處巧取豪夺，讓我们的钢及其他资源供不应求。由于工业的发达，他们的国力遠遠超越我们，但日本帝国的军人无所畏懼！天皇的子民们！帶著视死如歸的覺悟衝鋒吧！天皇萬歲！日本萬歲！"
 chinese_puppet_focus:0 "蠶食神州"
 chinese_puppet_focus_desc:1 "中国看來似乎不愿与我们为敌，或许他们的领導人認为先安內后攘外才是正確的做法。若我们可以幫助他们解決共產势力与割據的军閥，他们一定会愿意加入大東亞共荣圈。"
 chinese_war_focus:0 "對華宣战争"
 chinese_war_focus_desc:0 "盧溝橋事件的結果证明了中国並不想与我大日本合作共求繁荣！大日本帝国的子民们！讓我们用中国人的鮮血澆熄中国遍地的战争火，将他们帶往更美好的未來！"
 subdue_warlords_focus:0 "消滅割據势力"
 subdue_warlords_focus_desc:0 "中国各地割據的军閥讓那个曾經輝煌的帝国殘破不堪，我大日本帝国将粉碎那些激进分子与军事集团！就算是附庸国，日本帝国也不允许異議份子的存在！"
 oust_germans_focus:0 "破壞中德合作"
 oust_germans_focus_desc:0 "德国的军事参谋团自1920年代后期开始便持续的幫助中国国民黨研究新式战争术理论，我们不能允许这种状況继续下去！我们有权要求德国立刻撤回在中国的军事参谋团，德国必須做出選擇，有中国就沒有我日本帝国！"
 found_own_faction_focus:0 "「大東亞共荣圈」"
 found_own_faction_focus_desc:1 "我们對大東亞共荣圈的建構已付出许多心血，为了確保这个计畫的成功，我日本帝国必須不只成为亞洲最強，還要成为世界最強！"
 axis_leanings_focus:0 "加入軸心国"
 axis_leanings_focus_desc:0 "我们与德国有许多相似之處，他们想建立歐洲帝国，而我们想建立亞洲帝国。由于两国之间的空间足够，加入他们的阵营，不只不会對彼此的计畫造成妨礙，還可以讓我们获得強大的外援！"
 subvert_india_focus:0 "印度国民军"
 subvert_india_focus_desc:0 "若英国膽敢質疑我们組建帝国的能力，那我们将讓他们明白自己的帝国早就搖搖欲墜！印度战争犯与外籍住民将成为推翻英国統治的先驅！"
 jap_improved_sprit_focus:0 "大和精神"
 jap_improved_sprit_focus_desc:0 "大和民族的統一精神将驅使我们人民为了帝王犧牲奉獻，不惜一切！"
 befriend_siam_focus:0 "親善目标：暹羅"
 befriend_siam_focus_desc:0 "暹羅曾經成功的抵抗了歐洲人的入侵，免于成为被殖民的命運。或许我们可以保障他们的獨立，來換取两国之间的合作。"
 army_primancy_focus:0 "陸军优先"
 army_primancy_focus_desc:0 "说到占领固守新的领土，非陸军不可！若陸军与海军是帝国的左臂右膀，很明显的，陸军才是日本帝国強大的右手！日本帝国应该認清这个簡单的事實，並提供陸军更多的资源來讓它们证明陸军无限的潜力！"
 JAP_army_primancy_focus_bypass_tt:0 "核心领土沒有閒置的建筑槽位可以建造§G军事工厂§!"
 jap_sia_love:0 "親善目标：暹羅"
 jap_sia_love_desc:0 "日本帝国專注于提升与暹羅的友好度。"
 navy_primancy_focus:0 "海军优先"
 JAP_navy_primancy_focus_bypass_tt:0 "本国领土沒有閒置的建筑槽位可以建造§Y海军船坞§!"
 navy_primancy_focus_desc:0 "说到掌控海洋、侵略他国与保护领土，弱小的陸军根本无法做到！很明显的，海军才是帝国強大的右手！日本帝国应该認清这个簡单的事實，並提供海军更多的资源來讓它们证明海军无限的潜力！"
 army_innovations_focus:0 "陸军革新"
 army_innovations_focus_desc:0 "既然陸军已被認定为帝国的右手，帝国应投注更多资源來加強陸军战争术理论的研发。"
 army_air_innovations_focus:0 "陸航革新"
 army_air_innovations_focus_desc:0 "空军的存在意義就是提供陸军空中支援！"
 army_motorization_focus:0 "陸军摩托化"
 army_motorization_focus_desc:0 "陸军摩托化将使部队变得更快、更狠、更准！嗯...至少在路況良好的地区是如此。"
 air_base_expansion_focus:0 "扩建空军基地"
 air_base_expansion_focus_desc:0 "为了提供陸军更好的支援，空军需要更大的机场。"
 armor_innovations_focus:0 "裝甲革新"
 armor_innovations_focus_desc:0 "隨著陸军裝备逐漸加強，有将军建議帝国可以加強裝甲车輛的投资。"
 naval_innovations_focus:0 "海军革新"
 naval_innovations_focus_desc:0 "既然海军已被認定为帝国的右手，帝国应投注更多资源來加強海军舰艇的研发。"
 naval_air_innovations_focus:0 "海军航空革新"
 naval_air_innovations_focus_desc:0 "空军的存在意義就是提供海军空中支援！"
 convoy_protection_focus:0 "舰队护航"
 convoy_protection_focus_desc:0 "敌人很有可能无视武士精神，卑鄙偷袭我日本帝国脆弱的商船及運输舰队。帝国应开发更好的护航技术以防範未然。"
 advanced_torpedoes_focus:0 "先进鱼雷"
 advanced_torpedoes_focus_desc:0 "透过使用壓縮氧氣而非壓縮空氣的动力系統，帝国的鱼雷将可以射得更遠、更准、更有力！"
 shbb_focus:0 "超重型战争列舰研发"
 shbb_focus_desc:0 "帝国无法在短期內建造比英美更多的舰艇，但或许根本沒有这个必要。帝国应该專注于建造更大、更強、更多炮管的巨型战争舰，将那些受華盛頓条約限制的弱小战争舰一掃而空。"
 naval_base_focus:0 "扩建海军基地"
 naval_base_focus_desc:0 "要扩建海军需要更多的海军基地。"
 carrier_focus:0 "航空母舰研发"
 carrier_focus_desc:0 "战争舰的時代已經結束了！帝国将会讓世界知道，航空母舰才是強大的海军的代名詞！"
 battleship_focus:0 "战争舰研发"
 battleship_focus_desc:0 "讓那些无知的国家们继续浪费资源建造航母吧！帝国的战争舰将会統治海洋！"
 spiritual_mobilization_focus:0 "精神动员令"
 spiritual_mobilization_focus_desc:0 "全国的武士们！貴族们！平民们！将我们精神統一，共同为天皇效命吧！生为大和人，死为大和魂！"
 warrior_traditions_focus:0 "武士道精神"
 warrior_traditions_focus_desc:0 "武士道精神是帝国的悠久歷史淬炼出的精神精華，必須讓每一个军人了解，他们的犧牲奉獻，都是为了實现偉大的武士道！"
 divine_wind_focus:0 "神風吹起"
 divine_wind_focus_desc:0 "无畏死亡是帝国士兵应有的基本素質，今天，我们将把这个精神昇華到更高層次！記住！你一个人的犧牲，将可以換取帝国更大的生存空间！同胞们，为帝国的明日而死吧！生为大和人，死为大和魂！"
 imperial_glory_focus:0 "帝国荣光"
 imperial_glory_focus_effect:0 "解锁特殊单位「§H橫須賀 MXY - 7「櫻花」特攻机§!」"
 imperial_glory_focus_desc:0 "神風攻擊已从自殺式攻擊转型成一种特殊的战争术，隨著更适合执行一次性任务的 MXY - 7 櫻花特攻机的开发，所有日本帝国的敌人都将被神風无情的摧毀！"
 student_movement_focus:0 "学生动员"
 student_movement_focus_desc:0 "教育系統是落實精神动员不可或缺的一部份，团結一致的教師与学生将把军事教育体制普及到全国。"
 extra_tech_focus:0 "额外研究槽位"
 synth_oil_focus:0 "研发合成油"
 synth_oil_focus_desc:0 "我们的石油產量十分有限，導致必須仰賴他国鼻息的窘境。改善现況的最佳方式便是取得德国的合成油技术。"
 JAP_synth_oil_focus_tt:0 "「§H出光兴產§!」成为工业顧问"
 secret_weapon_focus:0 "先进武器"
 secret_weapon_focus_desc:0 "作为一个海島帝国，我们海军科技必須站在世界的前端，不过長程飞弹的研发也是十分重要的。"
 industrial_effort_focus:0 "帝国紧縮开支"
 industrial_effort_focus_desc:0 "所有帝皇臣民必須共体時艱。"
 industrial_effort_focus2:0 "提升工业效率"
 industrial_effort_focus2_desc:0 "日本帝国是新兴的工业国家，在生產力上暫時无法超越先行的歐美国家。我们必須盡最大努力來縮短實力差距。"
 infra_effort_focus:0 "提升基础设施效率"
 infra_effort_focus_desc:0 "本土多山，基础设施难以轻易覆蓋全国，但为了帝国的未來，必須排除萬难全力提升基本建设。"
 fortress_japan_focus:0 "帝国本土要塞化"
 fortress_japan_focus_desc:0 "若海军不幸为敌人所败，国內的要塞建设将保护帝国本土不被外敌轻易占领。"
 crypto_bomb_focus:0 "邏輯密碼爆弹"
 crypto_bomb_focus_desc:0 "波蘭人开发出了他们称为「邏輯密碼爆弹」的神奇科技，这种技术可以轻鬆破译德国的「啞謎机」所編寫的密碼。我们应投入更多资源，在布萊切利公園的研究设施中进行进一步的研究。"
 tizard_mission_focus:0 "臺柴特委员会计畫"
 tizard_mission_focus_desc:0 "我们雖在科技上拥有许多突破，但由于资源与工业力不足，无法将其一一實体化。亨利·臺柴特愿意率团前往美国交涉科技共享条約。"
 maud_focus:0 "核能军事应用委员会"
 maud_focus_desc:0 "「核能军事应用委员会」相信製作以核子裂解作为爆炸动能的炸弹是可行的。但我们可能无法獨力研发这项科技，我们必須与美国合作。"
 general_rearmament_focus:0 "进入备战争态势"
 general_rearmament_focus_desc:1 "[Root.GetGeneralRearmamentDesc]"
 ENG_GENERAL_REARMAMENT_DESC_HISTORICAL:0 "从现在的局势看來，另一场大战争似乎已是不可避免的了。雖然不知道打响第一枪的会是希特勒、史达林還是裕仁呢？但是无论如何，公眾輿论已經起了变化，我们应當是重整军备，准备作战争了。"
 ENG_GENERAL_REARMAMENT_DESC_AHISTORICAL:0 "我们前任首相完全錯估了国際情势。我们必須趕紧加強我们武裝整备，以解決迫在眉睫的战争争。"
 air_defense_focus:0 "強化防空"
 air_defense_focus_tt:1 "将§Y東英格蘭§!、§Y薩塞克斯§!及§Y康瓦爾郡§!的§Y防空阵地§!建设至上限"
 air_defense_focus_bypass_tt:0 "沒有閒置的建筑槽位可以建造§Y防空阵地§!"
 air_defense_focus_desc:0 "空袭是敌军打擊我们的必行手段，我们国必須強化防空能力來保卫国土。"
 radar_focus:0 "提升雷达效率"
 radar_focus_desc:0 "侦測敌军轟炸机的能力在战争争中是至关重要的，我们应不遺餘力的开发雷达科技以及在海岸线上建设更多雷达。"
 royal_ordinance_focus:2 "[Root.GetRoyalOrdnanceFactoriesName]"
 royal_ordinance_focus_desc:1 "[Root.GetRoyalOrdnanceFactoriesDesc]"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_HISTORICAL:0 "皇家兵工厂"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_COMMUNIST:0 "革命兵工厂"
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_HISTORICAL:0 "伍爾維奇的皇家兵工厂嚴重不足以生產我们需要的所有弹药和轻兵器。 我们应该在全国各地建立更多的工厂，最好是在相對安全的地区。"
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_COMMUNIST:0 "伍爾維奇的革命军械庫嚴重不足以生產我们需要的所有弹药和轻兵器。 我们应该在全国各地建立更多的工厂，最好是在相對安全的地区。"
 shadow_scheme_focus:0 "影子计畫"
 shadow_scheme_focus_desc:0 "航空部提出了一个天才的構想，能够将转換工厂的过程变得更加容易。借由給予各家关鍵企业提供足够的津貼和貸款，使工厂能够提前进行扩大和改造，讓民用工厂转变至军用工厂的过程更为平順。"
 shadow_scheme_focus_tt:1 "在进入战争争状态后将于这两个地区获得§G四个§!§Y建筑槽位§!和§Y四座§!§G军事工厂§!。\n"
 uk_small_arms_focus:0 "伯明罕轻武器公司"
 uk_small_arms_focus_desc:1 "[Root.GetBSACompanyDesc]"
 ENG_BSA_COMPANY_DESC_HISTORICAL:0 "雖然皇家兵工厂的无力生產足够的军械，但是一如我们在前次大战争中做的那樣，我们可以发包給伯明罕轻武器公司，簽訂合約並扩大產能。"
 ENG_BSA_COMPANY_DESC_COMMUNIST:0 "雖然人民兵工厂的无力生產足够的军械，但是一如我们在前次大战争中做的那樣，我们可以发包給伯明罕轻武器公司，簽訂合約並扩大產能。"
 UK_secret_focus:0 "秘密武器"
 UK_secret_focus_desc:0 "我们目前的设施及科学知识已讓我们有能力将那些原本属于科幻層次的科学技术付諸實现。"
 air_rearmament_focus:0 "空军整裝备战争"
 air_rearmament_focus_desc:1 "[Root.GetAirRearmamentDesc]"
 ENG_AIR_REARMAMENT_DESC_HISTORICAL:0 "无论与歐陸的任何国家作战争，皇家空军将证明空中优势是获取勝利的关鍵，为了強化皇家空军的战争力，机场建设是不可或缺的一環。"
 ENG_AIR_REARMAMENT_DESC_COMMUNIST:0 "无论与歐陸的任何国家作战争，人民空军将证明空中优势是获取勝利的关鍵，为了強化人民空军的战争力，机场建设是不可或缺的一環。"
 fighter_command_focus:0 "战争斗机指挥部"
 fighter_command_focus_desc:0 "掌握制空权是贏得战争争的第一步，而掌握制空权的关鍵在于战争斗机的性能。因此，在所有的军事科技领域裡，沒有比战争斗机研发更重要的了。"
 bomber_command_focus:0 "轟炸机指挥部"
 bomber_command_focus_desc:0 "如同朱利歐·杜黑一直強调的：「轟炸机所向无前！」雷达科技与防空炮臺无法保卫所有的国土，我们必須研发更先进的轟炸机，轟炸轟炸再轟炸，将敌人的生命中樞摧毀殆盡！"
 coastal_command_focus:0 "海岸防卫队司令部"
 coastal_command_focus_desc:1 "[Root.GetCoastalCommandDesc]"
 ENG_COASTAL_COMMAND_DESC_HISTORICAL:0 "我们的工业建立于海外殖民地输入的资源之上。我们各行各业是由从帝国许多遙遠地区運往英国的资源驅动的。 我们的運输舰队相當于我们命脈，必須讓運输舰队得到皇家海军和皇家空军的嚴加保护。 我们应该建立一个特殊的皇家空军机队來执行护航任务！"
 ENG_COASTAL_COMMAND_DESC_COMMUNIST:0 "我们的工业建立于海外殖民地输入的资源之上。我们各行各业是由从帝国许多遙遠地区運往英国的资源驅动的。 我们的運输舰队相當于我们命脈，必須讓運输舰队得到工人解放海军和人民空军的嚴加保护。 我们应该建立一个特殊的人民空军机來执行护航任务！"
 aircraft_production_focus:0 "飞机生產管理局"
 aircraft_production_focus_desc:0 "生產飞机是我们的首要之务，我们应该创立倫敦飞机生產管理局來管理协调关于飞机生產的一切事务。"
 uk_jet_focus:0 "喷射机研发"
 uk_jet_focus_desc:0 "以喷射引擎取代傳統螺旋槳引擎势在必行。大英帝国必須先于他国取得生產喷射引擎的技术！"
 naval_rearmament_focus:0 "海军整裝备战争"
 naval_rearmament_focus_desc:1 "[Root.GetNavalRearmamentDesc]"
 ENG_NAVAL_REARMAMENT_DESC_HISTORICAL:0 "雖然我们試圖以第二次倫敦海军条約來約束各国间的海军武裝競賽，但就連簽署国也不将其放在眼裡。皇家海军必須拥有倍于他国的舰艇数量來維持在全球的海权优势。"
 ENG_NAVAL_REARMAMENT_DESC_COMMUNIST:0 "雖然我们試圖以第二次倫敦海军条約來約束各国间的海军武裝競賽，但就連簽署国也不将其放在眼裡。工人解放海军必須拥有倍于他国的舰艇数量來維持在全球的海权优势。"
 uk_destroyer_focus:0 "研发驅逐舰"
 uk_destroyer_focus_desc:0 "雖然现代化战争舰的威力极巨，但我们不能忽视小型舰艇的重要性，我们应研发更新型的驅逐舰來保卫大型舰艇的安全。"
 uk_convoy_focus:0 "提升舰队护航效率"
 uk_convoy_focus_desc:0 "无庸置疑的，運输舰队是我大英帝国的生命线，我们必須盡一切力量來保卫他们。"
 uk_waves_focus:0 "大不列颠海上霸权"
 uk_waves_focus_desc:1 "[Root.GetBritanniaRulesTheWavesDesc]"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_HISTORICAL:0 "在我皇家海军的陰影下，其他国家紛紛被迫研发新的海战争技术來抗衡。我们不能滿足于舰艇效能及数量的优势，海战争技术也必須与時俱进。"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_COMMUNIST:0 "在工人解放海军的陰影下，其他国家紛紛被迫研发新的海战争技术來抗衡。我们不能滿足于舰艇效能及数量的优势，海战争技术也必須与時俱进。"
 uk_carrier_focus:0 "提升航空母舰效率"
 uk_carrier_focus_desc:0 "海战争理论家们正为战争舰与航空母舰孰优孰劣争论不休。支持航空母舰的学者指出，未來的海权将与制空权合并，掌握空中才能掌握海洋，而航空母舰是掌握海洋制空权的关鍵，它将取代傳統战争舰成为新一代的海洋王者。"
 uk_spain_focus:0 "警告西班牙"
 uk_spain_focus_desc:0 "自格瑞福蘭海战争以來已經过了不少時日，或许西班牙人需要有人幫他们回想一下..."
 uk_battleship_focus:0 "研发战争列舰"
 uk_battleship_focus_desc:0 "雖然某些海战争理论家一直強调海域空优的重要性，但应该沒有国家在被大舰巨炮包围之下還能睡得安稳。就算航空母舰真如那些理论家所说将会統治海洋，那也是以后的事情，战争舰還能再战争好幾年呢！"
 uk_turkey_focus:0 "警告土耳其"
 uk_turkey_focus_desc:0 "我们不需要那些土耳其膽小鬼的愛戴，只要他们畏懼皇家海军就够了。"
 uk_amphibious_focus:0 "两栖战争术"
 uk_amphibious_focus_desc:0 "雖然我们統治了海洋，但某些事還是需要上岸才能解決，大英帝国将不会忽视抢滩作战争的重要性。"
 singapore_focus:0 "新加坡战争略"
 singapore_focus_desc:0 "我们应将新加坡视为東方的主要军港，香港可以被日本占领，但新加坡的防禦必須足以堅持到主力舰队到來！"
 sp_landward_forts_focus:0 "新加坡防禦工事"
 sp_landward_forts_focus_desc:0 "新加坡目前的防禦工事太过貧弱，我们必須加強新加坡的自卫能力！"
 peninsular_focus:0 "半島战争争"
 peninsular_focus_desc:0 "我们应将防禦线延伸到馬來半島北部，使敌人更难以接近新加坡。"
 hongkong_focus:0 "香港保卫战争"
 hongkong_focus_desc:0 "新加坡战争略已經过時了。我们应该嘗試更大膽的计畫。只要拥有足够的防禦工事与基本建设，香港将成为完美的前进基地！"
 hk_landward_forts_focus:0 "香港防禦工事"
 hk_landward_forts_focus_desc:0 "必須将香港建设成足以防卫來自中国大陸方向攻擊的要塞都市。"
 hk_air_focus:0 "香港防空工事"
 hk_air_focus_desc:0 "大幅扩建香港的防空阵地。"
 uk_embargo_focus:0 "禁運政策"
 uk_embargo_focus_desc:0 "无论是法西斯還是共產黨，對付獨裁者最好的方法就是餓死他们！唯一的问题就是如何找出与他们有往來的銀行家。"
 uk_sanction_italy_focus:0 "制裁義大利"
 uk_sanction_italy_focus_desc:0 "莫索里尼建立新羅馬帝国的妄想可能驅使他喪失理智的攻擊我们；我们必須在事态嚴重前做出适當處置。"
 uk_sanction_japan_focus:0 "制裁日本"
 uk_sanction_japan_focus_desc:0 "日本似乎醉心于创造以其为首的「大東亞共荣圈」，而我们明显会成为他们的阻礙，若联合所有西方国家對其进行资源禁運，或许可以讓小日本重新考慮他们的方针。"
 uk_burma_focus:0 "滇緬公路"
 uk_burma_focus_desc:0 "我们应對中国伸出援手，幫助他们對抗蠻橫的日本入侵者。借由滇緬公路的兴建，我们可以安全的输送物资援助中国。"
 uk_scandinavian_focus:0 "干涉斯堪地那維亞"
 uk_scandinavian_focus_desc:0 "若说斯堪地那維亞有甚麼战争略價值，大概只有瑞典的鐵礦吧。我们必須對瑞典与挪威施加壓力來避免德国自北方取得物资，若是他们拒絕合作，則衝突在所难免。"
 uk_iraq_focus:0 "確保伊拉克"
 uk_iraq_focus_desc:0 "我们 1932 年保障了伊拉克的獨立，但以如今全球形势來看，那或许是个錯誤。伊拉克的石油资源絕不能落入敌人手中！"
 uk_iran_focus:0 "確保伊朗"
 uk_iran_focus_desc:0 "伊朗的價值不只在于豐富的原油產量，更重要的是他那其位于印度、中亞及蘇联三地要衝的特殊位置。"
 uk_free_india_focus:0 "印度獨立"
 uk_free_india_focus_desc:0 "日本正在印度醞釀叛变，甚至用印度人組織了所謂的「印度国民军」！我们必須對现況做出對应！看是要快速的解決日本，或是乾脆「暫時」保障印度獨立。"
 uk_colonial_focus:0 "鼓勵殖民地知识分子参与"
 uk_colonial_focus_desc:0 "这个龐大的帝国有太多的遺珠之憾，透过鼓勵知识份子共同参与研究的政策，可以增加我们研发人员的素質，加速研究的进展。"
 uk_asia_focus:0 "鞏固東亞"
 uk_asia_focus_desc:0 "许多我们在東南亞的殖民地正飽受內憂外患之苦。我们不应轻忽那些卫星国家的重要性，应该继续开发那些地区以保日不落国的荣耀不墜。"
 uk_china_focus:0 "影响中国"
 uk_china_focus_desc:0 "雖然中国的民族主義者视我们为邪恶的殖民者，但他们正處于眾敌環伺的險境，若我们率先對其釋出善意，或许可以改变他们的看法。"
 uk_commonwealth_focus:0 "大不列颠联邦"
 uk_commonwealth_focus_desc:0 "組建团結在英国王室之下的大不列颠联邦，是我们對应另一次全球衝突的唯一方案。增进与各国关系的行动势在必行。"
 uk_india_focus:0 "开发英属印度"
 uk_india_focus_desc:0 "无分海內外，关于印度殖民地的争議一直存在，无论如何，增強印度的工业能力是现階段的首要之务。"
 northern_expansion_focus:0 "北进政策"
 northern_expansion_focus_desc:0 "帝国陸军一直以來都大力提倡北进政策，陸军部門将蘇联视为阻撓帝国扩张的最大威胁。隨著歐洲情势的升溫，對蘇联宣战争的時机漸漸成熟，我们必須迅速行动！"
 southern_expansion_focus:0 "南进政策"
 southern_expansion_focus_tt:0 "同時与§Y蘇联§簽訂§Y互不侵犯§!。\n"
 southern_expansion_focus_desc:0 "帝国海军一直以來都大力提倡南进政策，堅持帝国应将领土扩张到南亞与太平洋諸島，歐洲強权在那些地区的殖民地握有日本帝国工业急需的天然资源。但實施这项政策将代表著与美国全面衝突，我们必須先发制人！"
 new_ideas:0 "有新的战争略顧问可供選用。\n"
 available_political_advisor:0 "新进的§Y政治幕僚§!："
 available_chief_of_army:0 "新晋的§Y陸军司令§!："
 available_chief_of_navy:0 "新晋的§Y海军司令§!："
 available_chief_of_airforce:0 "新晋的§Y空军司令§!："
 available_military_high_command:0 "新晋的§Y军事参谋§!："
 available_theorist:0 "新进的§Y理论学家§!："
 available_designer:0 "新进的§Y制造商§!："
 available_industrial_concern:0 "新进的§Y公会代表§!："
 remove_political_advisor:0 "審訊並處決§Y政治幕僚§!："
 remove_chief_of_army:0 "審訊並處決§Y陸军司令§!："
 remove_chief_of_navy:0 "審訊並處決§Y海军司令§!："
 remove_chief_of_airforce:0 "審訊並處決§Y空军司令§!："
