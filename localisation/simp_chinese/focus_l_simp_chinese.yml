 counter_purge:0 "托洛斯基的清算"
 SOV_war_since_purge:0 "自大清洗結束后經歷过战争争洗禮。"
 FRA_metropolitan_france:2 "法国大都会"
 FRA_metropolitan_france_tt:0 "法国本土的建筑槽位不足，无法增筑§Y基础设施§!"
 FRA_metropolitan_france_desc:0 "本土建设应该永遠擺在第一順位！我们应从基础设施开始，打造一个可以增加国民就业机会並讓部队能够快速部署的交通網。"
 FRA_algerie_france:2 "法属阿爾及利亞"
 FRA_algerie_france_tt:0 "法属殖民地的建筑槽位不足，无法增筑§Y基础设施§!"
 FRA_algerie_france_desc:0 "歐洲正现在危机四伏，我们应專注于加強海外殖民地的建设，以強化對本国的助益。"
 FRA_industrial_expansion:0 "扩张工业"
 FRA_industrial_expansion_tt:0 "法国本土的建筑槽位不足，无法增筑§Y民用工厂§!"
 FRA_industrial_expansion_desc:0 "雖然我们勞动力充足，但工厂数量嚴重不足。为了增強工业力，我们必須兴建更多工厂！"
 FRA_colonial_industry:0 "殖民地工业"
 FRA_colonial_industry_tt:0 "法属殖民地的建筑槽位不足，无法增筑§Y民用工厂§!"
 FRA_colonial_industry_desc:1 "我们应将工业建设重点放在阿爾及爾（Algier）。如此一來，就算歐陸紧张情势升溫，我们至少還有能够免于轟炸的海外工厂。"
 FRA_military_factories:0 "扩建军事工厂"
 FRA_military_factories_tt:0 "法国本土的建筑槽位不足，无法增筑§Y军事工厂§!"
 FRA_military_factories_desc:1 "我们军武因生產能力不足而落后于其他国家，我们必須加強本土的军武生產力以確保捍卫国土的士兵们拥有最完善的裝备。"
 FRA_colonial_military_factories:0 "殖民地工厂"
 FRA_colonial_military_factories_tt:0 "法属殖民地的建筑槽位不足，无法增筑§Y军事工厂§!"
 FRA_colonial_military_factories_desc:0 "将我们的军火工厂建于海外，可以確保在本土喪失空优受到大规模轟炸喪失生產力時，前线的部队依然能有良好的補給。"
 FRA_extra_research_slot:2 "额外研究槽位"
 FRA_extra_research_slot_desc:0 "有能力的新生代正逐漸嶄露頭角，我们須提供他们适當的发挥空间，科学技术的进步将使我们更加強大。"
 FRA_nuclear_effort:0 "核子研究"
 FRA_nuclear_effort_desc:0 "核能實驗已經取得令人振奮的成果，若能有效利用这种能源，我们将创造出人類前所未见的強大武器！"
 FRA_jet_effort:0 "喷射引擎"
 FRA_jet_effort_desc:0 "空战争中最重要的就是机动性，喷射机将会讓敌方落后的螺旋槳机看起來像是練習标靶。"
 FRA_extra_research_slot_2:2 "额外研究槽位 II"
 FRA_extra_research_slot_2_desc:0 "有能力的新生代正逐漸嶄露頭角，我们須提供他们适當的发挥空间，科学技术的进步将使我们更加強大。"
 FRA_defensive_focus:0 "防禦主義"
 FRA_defensive_focus_desc:0 "在这危机四伏的年代，強化防禦是最好的選擇。讓那些妖魔鬼怪放馬过來吧！英勇的士兵们将讓他们死在我们邊境！我们已准备好领兵的最佳人選，只要您同意便可即日上任。"
 FRA_aggressive_focus:0 "进攻主義"
 FRA_aggressive_focus_desc:0 "我们不能坐视那些傢伙在我们門前耀武揚威，也不能聽任盟友们在这战争争漩渦中自生日滅！同胞们！备战争吧！甘莫林将会帶领我们走向勝利！"
 FRA_fortification_focus:0 "強化防禦工事"
 FRA_fortification_focus_desc:0 "要塞仍然是重要的防卫性建筑，我们必須找到更能有效利用他们的方法。馬奇諾防线強大的威懾力是很好的榜樣，我们应盡力讓所有防禦工事向它看齊。"
 FRA_alpine_forts:0 "阿爾卑斯壁垒"
 FRA_alpine_forts_desc:0 "義大利将无法轻易跨越我们阿爾卑斯山建设的新防线，这些防禦设施将讓我们在战争争爆发后有足够的反应時间來鞏固防禦。"
 FRA_extend_the_maginot_line:0 "延長「馬奇諾」"
 FRA_extend_the_maginot_line_desc:0 "比利時並沒有足够的自保能力來防禦敌人的攻擊，为了防止外敌經由比利時入侵本国，扩展馬奇諾防线势在必行。"
 FRA_infantry_focus:0 "全民皆兵"
 FRA_infantry_focus_desc:0 "由于大量生產武器将可有效降低成本，所以所有国民不分男女，只要能拿的起枪的都必須为国效力！而我们会负責讓每个士兵手上都有枪！"
 FRA_artillery_focus:0 "飽和炮擊"
 FRA_artillery_focus_desc:0 "我们炮兵将組成獨立作战争部队，以便更有效的實施定点炮擊。每一次齊射都将进一步的弱化敌人，若有必要，我军炮兵会在敌军阵线上砸出一个他们无法想像的缺口！"
 FRA_heavy_armor_focus:0 "主力战争车"
 FRA_heavy_armor_focus_desc:0 "战争车是战争争工业发展到极致的產物，若我们想任意宰制战争场，就需要开发更強力的战争车！"
 FRA_motorized_focus:0 "摩托化步兵"
 FRA_motorized_focus_desc:0 "加強步兵輔助车輛的生產，可以讓我们支援前线的能力大幅上升。"
 FRA_mechanized_focus:0 "机械化步兵"
 FRA_mechanized_focus_desc:0 "轻裝甲车在现代战争争中占有非常重要的地位，雖然在裝甲与火力上比不上战争车，但它可以在通訊、指挥、運输以及城市战争斗等方面提升我军的优势。"
 FRA_light_medium_armor:0 "裝甲战争斗车"
 FRA_light_medium_armor_desc:0 "一般來说，战争车扮演著輔助步兵的角色，因此，开发更轻、更快並具有一定程度火力的裝甲车輛将会是我们战争车的研发方针。"
 FRA_army_reform:0 "陸军革新"
 FRA_army_reform_desc:0 "三军协同作战争才有机会贏得这场战争争，首先，应先从陸军战争术革新做起，透过我们优秀人才的集思廣益，我军将会进步神速！"
 FRA_navy_focus:0 "大海军主義"
 FRA_navy_focus_tt:0 "建筑槽位不足，无法增筑§Y海军基地§!"
 FRA_navy_focus_desc:0 "扩建海军的第一步，就是扩建海军基地！我们獨特的战争舰需要特別的照护才能发挥完全的战争力！"
 FRA_improved_screen_ships:0 "改进护航舰艇"
 FRA_improved_screen_ships_desc:0 "驅逐舰与轻巡洋舰是护卫战争舰与航空母舰的关鍵腳色，若海上防卫体制失能，所有的海军将士将无人能够倖免！我们必須確保工厂所生產的护航舰艇都是最新型號！"
 FRA_capital_ship_focus:0 "主力舰"
 FRA_capital_ship_focus_desc:0 "开发更先进的战争舰将为我们创造更大的战争术优势，隨著航程与火力的提升，敌军将无路可逃！"
 FRA_carrier_focus:0 "航空母舰"
 FRA_carrier_focus_desc:0 "海战争理论学家已經對我们落后的航母技术发出警訊，他们关于航母的开发方向与實際用途的论点十分有说服力，但若缺乏我们經濟上的支持，理论将永遠只是理论。"
 FRA_initiate_government_reform:0 "政府改革"
 FRA_initiate_government_reform_desc:0 "外面的世界越來越危險，我们不能再继续为了一些蠅頭小事內斗不休了！该是強化我们影响力，为国家做些甚麼的時候了！"
 FRA_support_the_left:0 "支持左翼"
 FRA_support_the_left_desc:0 "共產黨在我们的势力越來越龐大，该与他们談談如何互利共存了。"
 FRA_leftist_rhetoric:0 "左派思想"
 FRA_leftist_rhetoric_desc:0 "我们目标十分明確，那就是萬物平等！我们不想要任何型态的资本主義存在于法国政治圈內，必須为我们共產黨的兴起掃除障礙！"
 FRA_scw_intervention_republicans:0 "援助目标：\n西班牙共和国"
 FRA_scw_intervention_republicans_desc:0 "西班牙共和黨需要我们幫助！\n我们歡迎任何愿意为此而战争的人一同奮斗，西班牙不能成为另一个法西斯国家！"
 FRA_national_mobilization:0 "国家动员"
 FRA_national_mobilization_desc:0 "我们政府終于有了行动力，強化我们武裝，准备为国家而战争吧！！"
 FRA_humanite_unie:0 "革命先鋒"
 FRA_humanite_unie_desc:0 "那些腦滿腸肥的銀行家与野心勃勃的煽动者正毫不留情的對世界蠶食鯨吞。日復一日，被那些貪婪的獨裁者们奴役的自由人越來越多，而他们製造出的世界危机也越來越大！自由！平等！博愛！讓我们以这神聖的法国信念为號召，团結全人類來反抗暴政吧！"
 FRA_join_comintern:0 "阵营目标：共產国際"
 FRA_join_comintern_desc:0 "由于眾敌環伺，所以我们需要強大的盟友。隨著我们与共產主義的羈絆越來越強大，加入大家庭，一同为理想奮斗的時机已經成熟了！"
 FRA_support_status_quo:0 "維持现状"
 FRA_support_status_quo_desc:0 "我们是民主的搖籃，也是自由的守护者！我们应该继续保持这超然的身分。若想再度讓国民团結一致，則我们必須在民主主義沉淪之前稳定国情。"
 FRA_little_entente:0 "小协約国"
 FRA_little_entente_desc:0 "小协約国是为了遏止奧地利与匈牙利對鄰国的侵略行为，于大战争之后所締結的盟約，不过我们大力支持的这个盟約现已逐漸失能。与其加入英国的阵营，我们应採取主动，从与身为盟約创始国的捷克斯洛伐克交涉开始，逐步恢復这个盟約。"
 FRA_go_with_britain:0 "加入英国"
 FRA_go_with_britain_desc:0 "隨著沙皇時代的結束，三大协約国僅餘我们与英国，若歷史注定重演，我们必須確保这两个歐洲民主与自由的壁垒保持同盟关系。"
 FRA_strengthen_government_support:0 "強化政府"
 FRA_strengthen_government_support_desc:0 "我们已针對滿足所有国民需求的方案做好完善的规划，这些方案将会讓国民看到政府的行动力与领導力，並讓国民重新团結一致。"
 FRA_defensive_strategems:0 "防禦战争略"
 FRA_defensive_strategems_desc:0 "若想讓国民愿意为国家而战争，最重要的就是为他们设定明確的目标。由此，法蘭西必須停止內斗，並宣示我们将会为了国家，为了自由、平等、博愛而战争！"
 FRA_invite_yugoslavia:0 "联盟目标：南斯拉夫"
 FRA_invite_yugoslavia_desc:0 "南斯拉夫內部的紛乱讓他们无暇他顧，邀请他们重回小协約国将会讓彼此均受益。"
 FRA_invite_romania:0 "联盟目标：羅馬尼亞"
 FRA_invite_romania_desc:0 "羅馬尼亞的民主政权在法西斯份子与蘇联共產黨的夾攻下岌岌可危，讓他们加入小协約国可使他们在我们幫助下重歸稳定。"
 FRA_polish_guarantee:0 "保障目标：波蘭"
 FRA_polish_guarantee_desc:0 "波蘭外交官公开的表示他们對于邊境紧张度的担憂，若強大的我们能保障他们的獨立，則任何妄想进犯的国家必将望而卻步。"
 FRA_czech_guarantee:0 "保障目标：捷克斯洛伐克"
 FRA_czech_guarantee_desc:0 "捷克邊境的紧张度正逐漸升溫，我们不能允许自由与民主的国家落入扩张主義者的手中，捷克人民的自由将不会受到威胁！若我们承諾保障其獨立，則所有妄圖进犯的国家必将三思。"
 FRA_revise_versailles:0 "修訂《凡爾賽条約》"
 FRA_revise_versailles_desc:0 "德国人已用行动证明德国无意遵循《凡爾賽条約》，这表示法国已不再受人敬畏！我们能为那些在大战争中犧牲的英靈做的，就是向德国討取更多的賠償！但是为了使这个公正的条約得以徹底执行，我们必須变得更加強大！"
 FRA_support_the_right:0 "支持右翼"
 FRA_support_the_right_desc:0 "一直以來，法国都是一个強大並足以自傲的国家，但无能的政府卻讓人民四分五裂。为免步入衰亡，我们必須团結起來展示法蘭西人的优越与力量！"
 FRA_right_wing_rhetoric:0 "右派思想"
 FRA_right_wing_rhetoric_desc:0 "我们必須提升每一个法蘭西人的国家精神，讓他们知道我们是最佳的领導人！在我们领導之下，他们将因身为这个輝煌国家的国民而感到自豪！"
 FRA_scw_intervention_nationalists:0 "援助目标：\n西班牙王国"
 FRA_scw_intervention_nationalists_desc:0 "民族主義者終于在西班牙站稳了腳跟，他们的理念是正義的，我们必須允许志愿士兵前去幫助他们！"
 FRA_army_of_aggression:0 "侵略部队"
 FRA_army_of_aggression_desc:0 "剛敌人在歐洲橫行霸道之時，我们不能再故步自封。強化我军军备，拓展我们的邊境的時候到了！我们必須確保我们的強大无人能比！"
 FRA_france_first:0 "法蘭西萬歲！"
 FRA_france_first_desc:0 "我们是法国人！大战争的勝利者！歐洲的救世主！我们是所有偉大思想家的发源地！世界在呼喚著我们！而我们将应召前往！这世上有太多的国家想讓世界陷入混乱並从中牟利！为了世界和平，我们将厲兵秣馬，将全世界歸入我们統治之下！"
 FRA_woo_italy:0 "親善目标：義大利"
 FRA_woo_italy_desc:0 "義大利拥有成为世界強权的潜力！在墨索里尼的強势领導下，義大利人民已經团結起來，隨時准备为崇高理想而战争，讓我们共同奮斗吧！"
 FRA_dismantle_the_democracies:0 "廢除民主制度"
 FRA_dismantle_the_democracies_desc:0 "新[GER.GetAdjective]中歐民主联盟正在威胁我们新的立场。我们现在必須採取行动，才能变得更強大。"
 FRA_join_germany:0 "阵营目标：軸心国"
 FRA_join_germany_desc:0 "德意志帝国已經成为一股不可忽视的強大力量，他们的美好愿景也符合我们的利益，我们应该支持他们！當塵埃落定之時，我们将获取相应的报酬！"
 FRA_naval_doctrine:0 "海战争学说"
 FRA_naval_doctrine_desc:0 "近來在舰艇设计上的突破，讓我们在海军战争术与战争略上也有了新的发展，而在将这些理论应用到實战争之前，应该經过確實的计畫及操演。"
 FRA_air_focus:0 "空军革新"
 air_focus_bypass_tt:0 "建筑槽位不足，无法增筑§Y空军基地§!"
 FRA_air_focus_desc:0 "扩建空军的時候到了！为了能容納更大规模的空军部队，新建设的空军基地已經完成了。"
 FRA_cas_focus:0 "密接攻擊机"
 FRA_cas_focus_desc:0 "空军對地支援的重要性已經在最近的幾场小型衝突中获得驗证，對于如何开发执行支援任务的飞机，目前眾说紛紜，讓我们聚集工程師集思廣益，共同开发下一个世代的對地攻擊机吧！"
 FRA_fighter_focus:0 "強化战争斗机"
 FRA_fighter_focus_desc:0 "某些革命性的民间技术可以用來強化我军战争斗机的速度、航程与飞行高度。为了追上其他国家的腳步，我们必須不斷努力！"
 FRA_bomber_focus:0 "強化轟炸机"
 FRA_bomber_focus_desc:0 "无论进攻或是防禦，空中支援都是至关重要的！若能开发出更快、更靈活、投弹更精准的轟炸机，我们将可持续的陸战争中保有优势。"
 FRA_heavy_fighter_focus:0 "重型战争斗机"
 FRA_heavy_fighter_focus_desc:0 "我们的重型战争斗机必須拥有更強的能力來保护寶貴的轟炸机，由此，我们必須开发出裝甲更厚實，火力更強大的重战争斗机，就算犧牲一点速度与靈活性也在所不惜。"
 FRA_air_doctrine:0 "空战争学说"
 FRA_air_doctrine_desc:0 "我们已經累積了足够的經驗，使我们得以更快速的測試新的空战争理论，这将讓我们有能力探索更新的战争术与战争略可能性。空战争是现代战争争的关鍵。"
 FRA_heavy_bomber_focus:0 "战争术轟炸机"
 FRA_heavy_bomber_focus_desc:0 "新型的重型轟炸机将会有拥有足够的武裝，讓他们能在小型衝突战争中自保。若我们允许工程師專注于开发更新的轟炸机，将可增加我们癱瘓敌国生產力的能力。"
 FRA_naval_bomber_focus:0 "海军轟炸机"
 FRA_naval_bomber_focus_desc:0 "事實已經证明，舰艇难以防禦來自上空的攻擊，我们应该继续研发更新的對舰攻擊机，以克服任何的反制手段。"
 limited_rearmament_focus:0 "战争前佈署"
 limited_rearmament_focus_desc:1 "[Root.GetLimitedRearmamentDesc]"
 ENG_LIMITED_REARMAMENT_HISTORICAL:0 "从最近德国与其他法西斯主義国家的頻繁动作來看，和平可能不会持续太久。为了對应越來越危險的国際情势，我们应该开始进入早期备战争态势。"
 ENG_LIMITED_REARMAMENT_AHISTORICAL:0 "我们對国內政治和国際关系的新方法需要一支強大的军队來支持它。 在准备中，我们应该开始扩展我们民用工业，以便它可以在适當的時候为我们军事工业的未來扩展奠定稳定的基础。"
 ENG_motorized_focus:0 "摩托化步兵"
 ENG_motorized_focus_desc:0 "最近陸军进行了有关完全摩托化步兵的試驗，雖然目前陸军尚未设立任何摩托化步兵師团，但透过對战争争部長的适當建言，摩托化步兵師团将很快的成为陸军的一份子。"
 ENG_tank_focus:1 "[Root.GetRoyalTankRegimentName]"
 ENG_tank_focus_desc:1 "[Root.GetRoyalTankRegimentDesc]"
 ENG_ROYAL_TANK_REGIMENT_NAME_HISTORICAL:0 "皇家战争车团"
 ENG_ROYAL_TANK_REGIMENT_NAME_COMMUNIST:0 "共和国战争车卫队"
 ENG_ROYAL_TANK_REGIMENT_DESC_HISTORICAL:0 "英国发明了战争车，因此皇家战争车团理应配备世界上最先进的战争车，但是實際情況遠非如此。特种车輛开发委员会提議研发一种更具现代化设计的战争车，以使英国保持在战争车发展的最前沿。"
 ENG_ROYAL_TANK_REGIMENT_DESC_COMMUNIST:0 "英国发明了战争车，因此共和国战争车卫队理应配备世界上最先进的战争车，但是實際情況遠非如此。特种车輛开发委员会提議研发一种更具现代化设计的战争车，以使英国保持在战争车发展的最前沿。"
 uk_empire_focus:0 "帝国增员计畫"
 uk_empire_focus_desc:0 "我们帝国十分龐大，相較之下防卫力量相對的薄弱，为了改变现況，我们必須鼓勵全帝国的愛国者加入保家卫国的行列。"
 uk_service_focus:0 "海外服役"
 uk_service_focus_desc:0 "透过定期輪调的海外驻防任务，可以提升我们军人對各殖民地的熟悉度，並讓他们對于各种地形更加了解，借此提升他们的經驗值。"
 uk_mediterranean_focus:0 "地中海堡垒"
 uk_mediterranean_focus_desc:0 "地中海的航道是我们与印度殖民地间的捷徑，因此，確保此航道的暢通是我们首要之务。"
 uk_rock_focus:0 "保卫直布羅陀海峽"
 uk_rock_focus_desc:0 "直布羅陀拥有防禦嚴密的军事港口，並是控制地中海与大西洋之间交通的要衝，因此，必須重兵把守此地。"
 uk_greece_focus:0 "威胁希臘"
 uk_greece_focus_desc:0 "在希臘建立军事基地有利于提升帝国的利益，我们将給予希臘一个无法拒絕的提議。（We will make Greece an offer they can not refuse！）"
 uk_malta_focus:0 "鞏固馬爾他"
 uk_malta_focus_desc:0 "馬爾他島處于地中海的中心位置，是我们与埃及与蘇伊士運河以及東亞地区之间的交通樞紐。加強此處的防禦工事将使我们對地中海的控制更加稳固。"
 ENG_mot_focus_tooltip:0 "可部署摩托化步兵。"
 uk_canada_focus:0 "开发加拿大"
 uk_canada_focus_desc:0 "投资加拿大的工业与港口建设将大幅提升加拿大的經濟状況，並增加他们在战争争中可提供的助力。"
 uk_australia_focus:0 "开发澳洲"
 uk_australia_focus_desc:0 "投资澳洲的工业与港口建设将大幅提升澳洲的經濟状況，並增加他们在战争争中可提供的助力。"
 uk_protect_suez:0 "保护蘇伊士運河"
 uk_protect_suez_desc:0 "掌控蘇伊士運河是維护大英帝国海权不可或缺的一部份，若對此地失去控制，后果将不堪设想，必須採取必要措施來強化此處的防禦。"
 uk_balkan_strategy:0 "巴爾幹半島战争略"
 uk_balkan_strategy_desc:0 "巴爾幹半島有许多親英的国家，他们与我们一樣，都十分重视歐洲中部的紛乱所帶來的威胁。若我们可以即時對其伸出援手，雖然会惹惱他们那些愛記仇的鄰居，但可以鞏固他们的忠誠。"
 uk_new_zealand_focus:0 "开发紐西蘭"
 uk_new_zealand_focus_desc:0 "紐西蘭与我们之间有非常強的羈絆，並且正受到法西斯主義的威胁，若我们应幫助他们做好准备，他们将成为絕佳的战争力。"
 uk_south_africa_focus:0 "开发南非"
 uk_south_africa_focus_desc:0 "南非的政治十分不稳定，我们不能確定他们能對战争争提供多少幫助，但透过對他们工业发展的资助，或许可以增加他们對本国的支持度。"
 FRA_strengthen_government_support_tooltip:0 "強化政府支持正在作用中。"
 ITA_victoryinETH:0 "非洲的勝利"
 ITA_victoryinETH_desc:0 "第一次義大利對衣索比亞战争争的失利，40年來一直是我们国譽的汙点。如今，我们勝利了！这正是法西斯钢意志的体现！"
 USA_reinforce_monroe_doctrine_tt:0 "增加所有美洲国家的信用额度。\n"
 1939_bookmark_threat:0 "最近法西斯扩张"
 USA_civil_war_fired:0 "第二次美国內战争已經开始。"
 USA_anti_imperialism:0 "反帝国主義"
 USA_anti_imperialism_desc:0 "美国一直是帝国主義者的死敌，但许多自称支持民主的国家卻寧愿讓这些帝国继续存活以从中取得利益，很明显的，蘇联的革命家们才是美国真正的盟友。"
 USA_fascist_menace:1 "法西斯的威胁"
 USA_fascist_menace_desc:1 "《凡爾賽条約》和經濟制裁不但沒有擊垮德国，反而为极端主義的发展提供了最佳的養分，这一次，我们必須再次擊败德国，並将其掌控在我们手裡！"
 USA_crusade_against_communism:0 "討伐共產主義"
 USA_crusade_against_communism_desc:0 "共產主義是这个世界从未面临过的恐怖威胁，我们将会无所不用其极的将这个危險的意识型态自源頭抹殺！"
 USA_strike_at_the_empire:0 "打擊帝国主義"
 USA_strike_at_the_empire_desc:0 "歐洲殖民強权国家才是自由世界的真正威胁，我们将会擊垮那些殖民帝国，解放所有殖民地！首先，就拿百餘年前的手下败将开刀！"
 USA_defense_of_the_pacific:0 "防卫太平洋"
 USA_defense_of_the_pacific_desc:0 "日本政府已經沒救了！他们瘋狂的扩张行为不只威胁到我们在太平洋的利益，也威胁到了所有亞洲国家。美国必須将这个失控的国家置于控制之下，改革他们的內政，讓他们永遠不能重蹈覆轍！"
 ENG_home_defence:0 "保卫家園"
 ENG_home_defence_desc:0 "如果我们不能保护自己的国民，那還要这龐大的国土何用？我们必須盡全力維护本土的安全。"
 ENG_issue_gasmasks:0 "防毒面具"
 ENG_issue_gasmasks_desc:0 "世界一天比一天危險，我们必須保护人民免于遭受毒氣攻擊！大英帝国国民有自由呼吸的权力！"
 ENG_military_training_act:0 "军事训练法案"
 ENG_military_training_act_desc:0 "曾經，我们以为大战争已經結束了，从此可以不用再度踏上战争场。但如今，隨著世界越來越危險，我们必須確保每一个年轻人都受到基本的军事训练。"
 ENG_embargo_germany:0 "封锁目标：德意志"
 ENG_embargo_germany_desc:0 "德国的重新武裝行为是對世界和平的侮辱与巨大威胁，我们的资源将不会成为他们的幫兇！"
 ENG_war_with_germany:0 "战争争目标：德意志"
 ENG_war_with_germany_desc:0 "德国讓我们毫无選擇餘地！事已至此，唯有一战争！为了自由世界！为了孩子们的未來！战争吧！"
 ENG_swedish_intervention:0 "滲透目标：瑞典"
 ENG_swedish_intervention_desc:0 "瑞典的反民主運动已經获得了令人担憂的支持度，不能讓瑞典的钢成为敌人火炮的原料！瑞典人应该保有自由，但我们应在他们的政壇中取得一定程度的影响力。"
 ENG_norwegian_intervention:0 "滲透目标：挪威"
 ENG_norwegian_intervention_desc:1 "挪威的反民主運动持续的增長，我们也应確保他们的政策不会牴触我们利益，就算动用武力也在所不惜。"
 ENG_danish_intervention:0 "滲透目标：丹麥"
 ENG_danish_intervention_desc:0 "丹麥對自由世界公敌的支持持续成長，我们应在丹麥建立战争略據点，以备有朝一日必須登陸歐陸之需，这是唯一可以確保丹麥忠誠度的方法。"
 ENG_benelux_intervention:0 "滲透目标：荷比盧"
 ENG_benelux_intervention_desc:0 "荷比盧地区（Benelux Region）的政治環境對我们越來越不利，我们应盡快對所有民主世界的敌人发出警告，讓他们知道自己的所作所为将不会被我们容忍，讓他们知道若有必要我们隨時准备一战争！"
 ENG_belgium_security:0 "滲透目标：比利時"
 ENG_belgium_security_desc:0 "口頭警告的效力明显不足，若他们继续倒向敌側，比利時将對我们海域形成直接威胁，我们必須介入，並在歐陸建立战争略據点。"
 ENG_dutch_security:0 "滲透目标：荷蘭"
 ENG_dutch_security_desc:0 "荷蘭不顧警告，持续援助我们的敌人，为確保歐洲的自由，荷蘭必須受到制裁。"
 ENG_war_with_japan:0 "战争争目标：日本"
 ENG_war_with_japan_desc:0 "我们已經用盡所有方法与其交涉，但日本仍然拒絕停止扩张。为維护大英帝国与亞洲人民的安全，我们必須制裁日本。"
 ENG_war_with_italy:0 "战争争目标：義大利"
 ENG_war_with_italy_desc:0 "義大利拒絕放棄建立新羅馬帝国的妄想，並擺出他们为了實现野心不惜一战争态势，我们必須盡力及早消滅这个威胁。"
 ENG_embargo_ussr:0 "封锁目标：蘇維埃"
 ENG_embargo_ussr_desc:0 "蘇联已經变得太过強大，並且正利用我们的资源进一步的茁壯，我们必須停止与蘇联的一切交易。"
 ENG_war_with_ussr:0 "战争争目标：蘇維埃"
 ENG_war_with_ussr_desc:0 "雖然我们曾試圖阻止，但蘇联造成的威胁仍然继续扩大，我们不能放任蘇联继续坐大，为了更美好的明天，我们不惜一战争！"
 kamikaze_focus_tooltip:1 "解锁特殊任务「§Y神風特攻§!」，允许空军联队向敌方舰艇发起「§Y自殺袭擊§!」。"
 AST_additional_militia_training:0 "加強民兵训练"
 AST_additional_militia_training_desc:0 "我们大部分的民兵不适役，无非是困于身体障礙或裝备不整。世道險恶，我们将採取行动亡羊補牢。"
 AST_royal_australian_artillery:0 "澳大利亞皇家炮兵团"
 AST_royal_australian_artillery_desc:0 "战争场的炮兵，如同西洋棋中的女王，我们必須加強我们重型武器。"
 AST_promote_reservists:0 "后备部队"
 AST_promote_reservists_desc:0 "雖然我们需要国防军队，但如果能提供足够的训练、經驗給民兵或储备兵力，他们也可提升到与正规军队同等级。"
 AST_daimler_dingo:0 "戴姆勒澳洲野狗型侦察车"
 AST_daimler_dingo_desc:0 "这是英国製造的裝甲车，他将提高我们在战争场上的机动性。畢竟它是以我们国犬名为命名。"
 AST_hmas_assault:0 "突擊號训练基地"
 AST_hmas_assault_desc:0 "太平洋战争争将会是一场两栖战争争，因此，建造一个專門培训海军陸战争队员如何占领海滩的海军基地，将是必要的。"
 AST_specialize_equipment:0 "特化裝备"
 AST_specialize_equipment_desc:0 "不是所有的裝备都是英国製造的，我们军队需要迅速因应各种战争争变化。需要制定特殊工具及应對流程。"
 AST_australian_womens_army_service:0 "澳大利亞婦女军队"
 AST_australian_womens_army_service_desc:0 "每个人都需要站出來，所以，我们要将通訊及保養工作将交由成千上萬的澳大利亞婦女來處理。"
 AST_australian_army_catering_corps:0 "澳大利亞军队伙食兵团"
 AST_australian_army_catering_corps_desc:0 "澳大利亞军队的食物質量很差，主要是因为廚師不够專业。透过提高军队伙食的品質，我们可以有效的提高士氣。"
 AST_fund_owen_gun_research:0 "歐文衝鋒枪"
 AST_fund_owen_gun_research_desc:0 "伊夫林·歐文开发了一种新的衝鋒枪，可以承受叢林战争的嚴峻壓力。我们应该把政府资源用于生產和改进这种武器。"
 AST_sentinel_tank_project:0 "哨兵战争车"
 AST_sentinel_tank_project_desc:0 "澳大利亞应发展自己的机动裝甲车。基于德国和美国的野心，哨兵计划应该被提前。"
 AST_airborne_defence:0 "空降防禦"
 AST_airborne_defence_desc:0 "我们必須投资防空裝备，包括拦截战争机与防禦空降，來保护澳大利亞的天空。"
 AST_introduce_unconventional_warfare:0 "採取非常规战争"
 AST_introduce_unconventional_warfare_desc:0 "太平洋叢林需要一种新的作战争方式。我们必須学会快速、安靜地通过密集的掩护 - 埋伏攻擊我们敌人。"
 AST_z_special_unit:0 "特种部队 - Z"
 AST_z_special_unit_desc:0 "特种部队 - Z将是我们突擊主力，專門在敌人后方侦察与破壞。这将需要勇敢的男性並愿意接受最嚴肅的训练。"
 AST_m_special_unit:0 "特种部队 - M"
 AST_m_special_unit_desc:0 "特种部队 - M将负責我们战争争中的最前线的侦察和武裝侦搜，回傳关于敌人的军队配置和部队位置。"
 AST_expand_the_raaf:0 "发展澳大利亞皇家空军"
 AST_expand_the_raaf_desc:0 "我们空军需要成長，所以我们正在投资更多的基地，更多的人员培训和生產更多战争机。"
 AST_cac_boomerang:0 "「回旋鏢」战争斗机"
 AST_cac_boomerang_desc:0 "回旋鏢战争斗机是澳大利亞對国產战争斗机的一劑強心针，同時亦为外援斷供后的一道保險。我们战争机要与美日並肩。"
 AST_expand_northern_presence:0 "加強北部发展"
 AST_expand_northern_presence_desc:0 "由于我们城市大多在島的東部和西部海岸，澳大利亞的北部邊界缺乏适防禦敌人入侵或攻擊的能力。在该地区建筑新的军事基地。"
 AST_cac_woomera:0 "「伍默拉」轟炸机"
 AST_cac_woomera_desc:0 "澳大利亞将发展国產轟炸机。雖然「伍默拉」只是一架轻型飞机，但足以勝任本土防卫与低強度的空中支援。"
 AST_volunteer_air_observers_corps:0 "志愿防空观測队"
 AST_volunteer_air_observers_corps_desc:0 "隨時注意你所见的天空！我们呼籲澳大利亞人民学習识別飞机种類，並隨時通知政府任何可疑的敌人飞机。"
 AST_naval_bombers:0 "海军轟炸机"
 AST_naval_bombers_desc:0 "我们四面環海，所以我们应该研究飞机並训练飞行员，这樣我们将有能力拦截和攻擊敌方的船支舰队。我们应该重视轟炸海军舰艇的能力。"
 AST_death_from_down_under:0 "來自地面的死神"
 AST_death_from_down_under_desc:0 "一但我们升级了我们防空系統，将沒有轟炸机能損害我们港口和城市，讓敌人了解空中力量和防空武器的暴力。"
 AST_womens_auxilliary_australian_air_force:0 "澳大利亞女子地勤队"
 AST_womens_auxilliary_australian_air_force_desc:0 "我们与其将一半的人口放在家中，不如用于协助战争争事务。将飞机的維修任务、通訊等相关兵种任务将交給婦女。"
 AST_dominate_the_skies:0 "主導空战争"
 AST_dominate_the_skies_desc:0 "澳大利亞遠离许多敌方空军基地，所以，我们目标应该是在全球每个角落都拥有全面的空中优势。"
 AST_cockatoo_island_shipyards:0 "鸚鵡島海军船坞"
 AST_cockatoo_island_shipyards_desc:0 "鸚鵡島海军船坞的扩建和改进是我们政府的一个主要优先项目。雪梨港有最好的人力和资源，这就是我们海军建设工作的重点。"
 AST_protect_overseas_commerce:0 "保护海外商务"
 AST_protect_overseas_commerce_desc:0 "一个島国需要依靠海運來運送资源。保卫運输线和贸易路线不僅僅是一个战争略，而是首要事项。"
 AST_fly_the_jolly_roger:0 "懸掛海盜旗"
 AST_fly_the_jolly_roger_desc:0 "透过我们島嶼堡垒海岸线，我们可以組織一批潜艇來騷扰和破壞敌人的贸易和供应。"
 AST_scrap_iron_flotilla:0 "廢鐵舰队"
 AST_scrap_iron_flotilla_desc:0 "直到我们可以升级我们舰队为止，我们仍将不斷生產既有的老船支。我们敌人可能会将我们舊的舰队称为廢鐵舰队，但它们将会讓我们自豪！"
 AST_royal_australian_submarine_service:0 "澳大利亞皇家潜艇"
 AST_royal_australian_submarine_service_desc:0 "潜艇是未來的海战争武器，也是我们盟国部队的关鍵組成部分。我们必須拥抱这种战争争方式。"
 AST_naval_auxiliary_patrol:0 "协助海军巡邏"
 AST_naval_auxiliary_patrol_desc:0 "我们偉大的国土上有许多港口正正成为隐身潜艇攻擊的目标。沿海巡邏舰的輔助部队，可以协助我们注意任何危險。"
 AST_cruisers:0 "巡洋舰"
 AST_cruisers_desc:0 "我们可以把主力舰和運输舰留給自己，因为大量的巡洋舰将滿足我们战争斗需求。"
 AST_pacific_area_navy:0 "太平洋地区海军"
 AST_pacific_area_navy_desc:0 "雖然国王陛下争取在歐洲的生存空间，但我们當务之急是組建一支海军，一支可以打擊我们在太平洋的敌人海军的战争略目标"
 AST_standard_gauge_railway:0 "統一鐵路规格"
 AST_standard_gauge_railway_desc:0 "近十年來，澳大利亞鐵道因鐵道厂商的规格競賽，造成我们運输能力和運输需求变得混乱。现在是最后标准化全国各地的鐵路规格的時候了。"
 AST_industries_assistance_corporation:0 "產业促进有限公司"
 AST_industries_assistance_corporation_desc:0 "最近的全球經濟混乱阻礙了澳大利亞的投资和创业，產业促进有限公司将为全国各地的中小型企业提供建議和协助，得以讓經濟再次蓬勃发展。"
 AST_western_australian_government_railways:0 "西澳大利亞鐵道局"
 AST_western_australian_government_railways_desc:0 "西澳州的国有鐵路应该比道路建设更为重要。西部的鐵道系統在这一点上具有地理的优势，我们应该利用这一点。"
 AST_south_australian_housing_trust:0 "南澳房屋信託基金"
 AST_south_australian_housing_trust_desc:0 "南澳州需要更多的工业和投资，因此该公司将提供一系列计划，将投入资源來改善社区和住宅区，特別是在阿德萊德地区。"
 AST_department_of_supply_and_development:0 "供应与发展部門"
 AST_department_of_supply_and_development_desc:0 "在战争争期间，我们需要一个專門部門來處理后勤和供給事务，例如：弹药、燃料的供应，來保持军队中的一切所需。"
 AST_expand_lithgow_small_arms_factory:0 "扩建利斯戈轻武器工厂"
 AST_expand_lithgow_small_arms_factory_desc:0 "我们維克斯重机枪和布朗轻机枪都來自利斯戈轻武器工厂。隨著它的扩展与建设，我们可以更加容易地提升我们战争斗力。"
 AST_allied_works_council:0 "联合工业委员会"
 AST_allied_works_council_desc:0 "澳大利亞的所有军事建筑将由盟国工会理事会監督。这种集中的规划将確保政府获得所需的生產力類型。"
 AST_expand_the_northern_railway:0 "扩建北方鐵路"
 AST_expand_the_northern_railway_desc:0 "我们有一条从南部的阿德萊德到北部的愛麗絲的鐵路。现在我们必須把鐵路北方点延伸到该地区的其他城市，从而連接澳大利亞的所有地方。"
 AST_australian_arms_production:0 "澳大利亞生產武器"
 AST_australian_arms_production_desc:0 "海上運输時间过長，这表示澳大利亞必須能生產自己的枪支，承担比其他国家更大的責任。我们有工厂，也有專門知识。"
 AST_uranium_mining:0 "鈾礦"
 AST_uranium_mining_desc:0 "在过去幾十年中，我们在南澳大利亞，特別是在吉爾吉斯灣附近发现了大量的鈾礦床。鈾现在是一种重要的军事资源，应该增加對这些资源储备与开发。"
 AST_establish_advisory_war_council:0 "建立战争争顧问委员会"
 AST_establish_advisory_war_council_desc:0 "澳大利亞的政治家必須拋开意识型态和黨派的分歧，並聚集在一起就战争争行为提供諮詢和建議。"
 AST_national_security_act:0 "国家安全法"
 AST_national_security_act_desc:0 "我们正在战争争，联邦政府应获得更大的权力來保护澳大利亞。应具有更大的新聞審查权，來壓制異議团体和更大的稅收、扣押財產以保卫主权。"
 AST_volunteer_defence_corps:0 "志愿防禦兵团"
 AST_volunteer_defence_corps_desc:0 "志愿防禦军团是由老年的退伍军人，及非正规军队的公民組織而成。他们将作为家園的守卫，捍卫自由並打擊對抗的敌人。"
 AST_civil_construction_corps:0 "土木工程兵团"
 AST_civil_construction_corps_desc:0 "我们将征召身体健壯的男子在民用建筑军团服务，幫助建造机场、道路、堡垒和其他重要的军事基础设施。"
 AST_army_inventions_directorate:0 "陸军研发局"
 AST_army_inventions_directorate_desc:0 "战争争将刺激创新及创造力，政府需要一种方式來分類好与壞的想法。一个專利局将致力于提交給政府有價值的專利。"
 AST_invest_in_victory:0 "投资勝利"
 AST_invest_in_victory_desc:0 "借由出售战争争債券給我们人民，讓他们可以透过他们的積蓄來为战争争提供贡獻。"
 AST_citizen_military_forces:0 "公民军事部队"
 AST_citizen_military_forces_desc:0 "开始准备后备军队，以增加我们在战争時的军队准备時间。我们将把现有的民兵編入军队进行国防，然后在需要時好讓其在海外服役。"
 AST_rats_of_tobruk:0 "托布魯克之鼠"
 AST_rats_of_tobruk_desc:0 "我们勇敢的士兵已經证明自己善于在沙漠作战争且能从战争场迅速撤退。他们騷扰敌人，打擊他们的基地，然后在反擊之前撤退。"
 AST_rats_of_tobruk_effect_1:0 "在 托布魯克 获得精英单位"
 AST_rats_of_tobruk_effect_2:0 "在 雪梨 获得精英单位"
 AST_fight_work_or_perish:0 "奮战争或滅亡"
 AST_fight_work_or_perish_desc:0 "隨著我们敌人對地域構成一种生存威胁，澳大利亞人必須作出選擇。他们会战争斗，他们会工作，或者他们会滅亡。"
 AST_research_collaboration:0 "研究合作"
 AST_research_collaboration_desc:0 "英国人向我们展示了在近親之间分享科学进步的优势。如果我们採取必要的步驟來协调这一点，我们整个阵营将能够更有效地进行战争時研发。"
 AST_fund_australian_defense_research:0 "澳大利亞国防研究"
 AST_fund_australian_defense_research_desc:0 "现在澳大利亞是一个完整主权国家，我们无法像以前那樣获得先进原型和藍圖技术。我们必須確保我们科技能力，始終超前我们敌人。"
 AST_squash_the_squanderbugs:0 "壓扁浪费的臭蟲"
 AST_squash_the_squanderbugs_desc:0 "面對通貨膨脹的浪费性銷费影响，消费品正在从战争争債券和战争争努力中获利。我们军队有需要阻止这种奢侈的慾望。"
 AST_rationing_and_recycling:0 "配給和回收"
 AST_rationing_and_recycling_desc:0 "每个资源都很重要！我们将为我们公民配給食物，回收以获得盡可能多的金属，由撙节貨物來促进全国的經濟。"
 AST_classify_aliens:0 "分類外僑"
 AST_classify_aliens_desc:0 "澳大利亞是一个移民国家，因此，部分人民可能對原国家有忠誠。我们将註冊和跟踪外国出生的澳大利亞人。"
 AST_strengthen_ties_with_uk:0 "加強与英国的关系"
 AST_strengthen_ties_with_uk_desc:0 "我们忠誠在母国，我们将跟隨她，並承諾打倒她的敌人。上帝将拯救国王。"
 AST_support_the_policy_of_appeasement:0 "支持綏靖政策"
 AST_support_the_policy_of_appeasement_desc:0 "一场战争争的成本仍然过于沈重。如果讓出半个地球以外的领土，可以使澳大利亞擺脫战争争，那麼，我们當然应该考慮这些讓步。"
 AST_the_singapore_strategy:0 "新加坡战争略"
 AST_the_singapore_strategy_desc:0 "新加坡离倫敦太遠且不安全。澳大利亞将採取行动保护这个帝国的前哨，不受其他国家的侵略"
 AST_adopt_westminster:0 "採用西敏制"
 AST_adopt_westminster_desc:0 "我们拥抱我们从英国继承的西敏制度。"
 AST_CSIR:0 "联邦科学与工业研究組織（CSIR）"
 AST_CSIR_desc:0 "英联邦科学和工业研究組織是我们政府的研究机構，旨在提高澳大利亞科学和生產的效率。通过增加對它的支持，我们将有更多的能力在战争争上。"
 AST_swpa_protector:0 "西南太平洋保护者"
 AST_swpa_protector_desc:0 "澳大利亞必須担當西南太平洋地区保护者的主要角色。从印度支那到印度尼西亞到新幾內亞的整个海区，都应该在我们支持下。"
 AST_empire_air_training_scheme:0 "帝国空战争训练计划"
 AST_empire_air_training_scheme_desc:0 "现在是澳大利亞承諾进行适當的空战争训练计划的時候了。在英国的鼓勵和支持下，所有的国家将一起努力，为战争争努力提供飞行员和地勤人员。"
 AST_commonwealth_aircraft_corporation:0 "大英联邦航太公司"
 AST_commonwealth_aircraft_corporation_desc:0 "联邦航太公司是澳大利亞飞机和飞机发动机的主要生產商。它具有良好的歷史記錄，支持它将給我们飞行员他们需要的材料。"
 AST_sever_ties_with_uk:0 "脫离大英联合王国"
 AST_sever_ties_with_uk_desc:0 "现在是从英国脫离的時候了。澳大利亞可以在沒有來自倫敦的干涉情況下，主導自己的发展，並在自己的地区争取属于自己的命運。"
 AST_protect_the_homeland:0 "保护家園"
 AST_protect_the_homeland_desc:0 "澳大利亞強大足以保护自己。保持我们自己的国家安全是最高优先。"
 AST_the_swpa_menace:0 "西南太平洋威胁"
 AST_the_swpa_menace_desc:0 "日本正成为一个威胁到澳大利亞安全和该地区自由的帝国。我们应该找尋志同道合的国家作，为我们盟友。"
 AST_never_another_gallipoli:0 "不重蹈加里波利战争役"
 AST_never_another_gallipoli_desc:0 "为了確保澳大利亞不会因情緒而陷入昂貴战争争的唯一方法，是完全自主我们外交政策。我们不需要遙遠的国王，更不能承受古老的血緣关系，把我们帶入不利于我们利益的衝突。"
 AST_woo_usa:0 "迎合美国"
 AST_woo_usa_desc:0 "我们真正的盟友是美国，另一个具有英国根源的太平洋权力。这个富有且強大的土地，更能了解我们需要，他们能讓我们更繁荣，並保护我们免受遭受侵略。"
 AST_protect_the_dutch_colonies:0 "保护荷蘭殖民地"
 AST_protect_the_dutch_colonies_desc:0 "印度尼西亞是荷蘭的殖民地，它不但脆弱且主国过于遙遠。它无法防禦來自日本、中国或任何其他潜在敌對国家的攻擊。我们必須为了更大利益來控制它。"
 AST_the_south_west_pacific_initiative:0 "西南太平洋协議"
 AST_the_south_west_pacific_initiative_desc:0 "我们已經建立了基础权力和信譽，以組建我们自己的联盟網絡，其中心在于保护西南太平洋地区免受敌對势力。我们将尋求志同道合的政权，並使澳大利亞在全球事务中发挥重要作用。"
 AST_preemptive_intervention:0 "沃爾福威茨学说"
 AST_preemptive_intervention_desc:0 "日本帝国在过去十年扩张中，對太平洋地区的人民自由構成威胁。我们不能等到它的飢餓的眼睛朝向我们。是行动的時候了。"
 AST_research_cooperation:0 "研究合作"
 AST_research_cooperation_desc:1 "澳大利亞人民是聰明且富有智慧的，但我们沒有一个嚴肅的科学计划的基础设施或人口。我们将与盟国合作，分享知识和突破，互利共贏。"
 AST_abandon_the_westminster_system:0 "放棄西敏寺体系"
 AST_abandon_the_westminster_system_desc:0 "雖然我们从英国继承西敏寺議会，但它的用途及功能已經过時了。內閣的分歧和黨的對抗，幾乎沒有幫助稳定澳大利亞挺过最近的經濟危机。"
 AST_support_the_centre_party:0 "支持中央黨"
 AST_support_the_centre_party_desc:0 "在新南威爾士州，出现了一场激烈的反共運动。在新卫队盟友的幫助下，中央黨可能获得加強澳大利亞的关鍵。"
 AST_supply_indonesian_nationalists:0 "支援印度尼西亞民族主義"
 AST_supply_indonesian_nationalists_desc:0 "我们应该支持印度尼西亞人民，打擊壓迫他们的荷蘭人。他们将需要教育和培训，但是以他们的人数优势，这场争取正義的斗争的勝利将是必然的，而且他们将感激我们！"
 AST_support_indonesian_uprising:0 "支持印度尼西亞起義"
 AST_support_indonesian_uprising_desc:0 "现在，印度尼西亞人民對荷蘭人採取武裝抗争，他们将需要更多的枪支、裝备來起義，還有我们全面的外交支持。"
 AST_demand_new_zealand:0 "索要紐西蘭"
 AST_demand_new_zealand_desc:0 "紐西蘭人一直是我们最親密的盟友和朋友。我们在同一个海滩上战争斗，在同樣无用的帝国战争争中死亡。现在，是把我们两国統一在一个旗幟下的時候了。"
 AST_protect_the_south_west_pacific:0 "保护西南太平洋"
 AST_protect_the_south_west_pacific_desc:0 "现在是利用我们区域力量，将所有西南太平洋納入我们影响力的時候了。只有我们才能保护人民和资源，而不受外人掠夺。"
 AST_a_deal_with_japan:0 "与日本的交易"
 AST_a_deal_with_japan_desc:0 "西南太平洋区域能保持目前常軌，我们就可以与日本帝国达成和解。如果他们只停留在西北部，並且不侵略我们领海，那麼我们就沒有理由战争斗。"
 AST_our_own_empire:0 "属于我们的帝国"
 AST_our_own_empire_desc:0 "现在是我们自主獨立的時候了！我们将宣布澳大利亞帝国不再是英国的殖民地！。我们仁慈並具有遠见的计划，将使得这个地区的所有人都能获得利益。"
 AST_japan_tech_sharing:0 "日本技术分享"
 AST_japan_tech_sharing_desc:0 "日本已經具有超越我们研究机構，但我们与日本帝国的新和諧关系，开闢了新的机会讓我们能学習和分享。"
 AST_war_on_japan:0 "战争争目标：日本"
 AST_war_on_japan_desc:0 "日本的侵略已經进行得太久了。他们入侵了東亞地区，而现在，他们更望向了南邊的土地和资源。我们不能跟他们站在同邊。"
 AST_empower_the_workers:0 "提升勞工权益"
 AST_empower_the_workers_desc:0 "罪犯、牧场主和碼頭工人的国家，那就是澳大利亞！现在是給澳大利亞工人和无產階级发表意见和权力的時候了！革命萬歲。"
 AST_delegation_to_china:0 "赴華代表团"
 AST_delegation_to_china_desc:0 "長期被日本帝国貪婪分裂，中国人民需要一个朋友。我们需要一个反對法西斯主義的区域盟友。这次与中国政府的正式会晤，将使我们更紧密地在一起。"
 AST_commitment_to_the_cause:0 "投身革命"
 AST_commitment_to_the_cause_desc:0 "现在是该是澳大利亞冒險擺脫一个外国国王的枷锁，並建立一个沒有帝国主義曖昧关系的工人天堂的時候了。"
 AST_indirect_support:0 "间接援助"
 AST_indirect_support_desc:0 "中華人民共和国正在战争争，但我们不能暴露自己。少量的武器和謹慎的鼓勵是我们目前可能面临的風險。"
 AST_direct_support:0 "直接援助"
 AST_direct_support_desc:0 "武器拿去，同志！这裡是我们中国兄弟在法西斯战争争中受苦的呼召！連署並加入所有工人的全球斗争！"
 AST_join_comintern:0 "加入共產国際"
 AST_join_comintern_desc:0 "共產主義是我们未來，所以我们必須在这场全球斗争上，加入我们在世界各地的同志之中。爸爸喬将告訴我们方式，並帶领澳大利亞和世界上所有工人迎接荣耀的明天。"
 AST_workers_paradise:0 "工人樂土"
 AST_workers_paradise_desc:0 "史达林共產主義實驗是一个失败，但我们認为社会主義是正確的道路。澳大利亞将走上第二条道路，讓工人们从莫斯科方向前进。"
 AST_research_city_excursions:0 "科学園区"
 AST_research_city_excursions_desc:0 "蘇联在全国各地建立了研究城市和實驗室，並邀请澳大利亞研究人员來了解共產主義科学的光輝。"
 AST_nz_puppet:0 "傀儡紐西蘭"
 AST_nz_puppet_desc:0 "紐西蘭的工人，应该和他们的澳大利亞兄弟姐妹一起。我们可以保护他们，並提供溫柔的友誼之手，只要他们遵循我们引導。"
 AST_the_threat_against_the_people:0 "對人民的威胁"
 AST_the_threat_against_the_people_desc:0 "帝国日本的军国主義和法西斯势力，威胁著所有澳大利亞人的福祉，阻礙了世界工人的和平共處。澳大利亞将推翻这个人民之敌，迫使他们留在他们淒涼的岩石島上。"
 AST_new_general_tt:0 "晋任一位§Y技能等级 3§!，名为§Y伊凡·麥凱§!的将领。"
 AST_homeland_defense_tt:0 "在本土的著陸点上修筑§Y岸防要塞§!和§Y陸上堡垒§!。"
 AST_swpi_research_tt:0 "同美国与其盟友簽署§Y科技共享协議§!。"
 AST_deal_with_japan_tt:1 "我们会提出转讓§Y馬來亞§!主权給日本來取得雙方联盟。如果这不可能，我们将建議割讓§Y加里曼丹§!、§Y蘇拉威西§!和§Y摩鹿加群島§!給日本當作交換条件。\n"
 CAN_rowell_sirois_commission:0 "皇家委员会"
 CAN_rowell_sirois_commission_desc:0 "皇家委员会已經確定，加拿大的联邦憲法妨礙了經濟的複蘇。我们应该平衡国內各地区經濟水平。"
 CAN_crown_corporations:0 "皇冠企业"
 CAN_crown_corporations_desc:0 "为了提供基本民生需求，和刺激工业經濟增長，加拿大政府必須在民营企业不会介入的地方，创立许多如同皇冠企业的公司。"
 CAN_war_bonds:0 "战争争債券"
 CAN_war_bonds_desc:0 "我们不能依靠我们微薄的稅收或有限资源出口來资助战争争。愛国的加拿大人民必須投资他们的国家，借由購買战争争債券來显示他们支持战争争的努力。"
 CAN_defence_of_canada_regulations:0 "加拿大防务法规"
 CAN_defence_of_canada_regulations_desc:0 "在战争争時期，需要限制公民权利以防止颠覆战争争。这意味著将對新聞界、異議团体和一些法律权利的限制。"
 CAN_national_housing_act:0 "国家住宅建筑法"
 CAN_national_housing_act_desc:0 "现代化的統治需要国內住宅标准化法令。我们必須改善所有加拿大人的生活条件。"
 CAN_dollar_a_year_men:0 "一年一美元的人"
 CAN_dollar_a_year_men_desc:0 "加拿大工业有效率上的问题，但一些富有商人愿意提供他们的服务和意见，他们只收取一个象征性的金额。这支小型的顧问团将推动我们工业前进。"
 CAN_canada_pacific_railway:0 "加拿大太平洋鐵路"
 CAN_canada_pacific_railway_desc:0 "我们将運用所有的资源來为战争争努力。数千噸的用品和材料将不间斷地經由我们领地跨越大海。"
 CAN_maritime_colonial_railway:0 "濱海殖民鐵路"
 CAN_maritime_colonial_railway_desc:0 "自从将殖民地鐵路出售到加拿大国家鐵路以來，通过我们東部省份的鐵路线一直不足。我们正在鼓勵和承辦一条新的濱海殖民地鐵路，以扩大中部省份和大西洋省之间的联繫。"
 CAN_retool_angus_shops:0 "安格斯军事工厂"
 CAN_retool_angus_shops_desc:0 "现代军队需要盔甲，建造安格斯军事工厂來提供这个需求。重組和改裝这个基础设施來建造战争车。"
 CAN_imperial_oil:0 "帝国石油企业"
 CAN_imperial_oil_desc:0 "帝国石油企业希望为加拿大西部的勘探提供资金。这将增加我们石油储备，潤滑战争争机器。"
 CAN_department_of_munitions_and_supply:0 "弹药与供給部門"
 CAN_department_of_munitions_and_supply_desc:0 "我们将對加拿大国家资源管理和控制。C·D·浩威在弹药和供应部。"
 CAN_national_resources_mobilization_act:0 "国家资源动员法案"
 CAN_national_resources_mobilization_act_desc:0 "加拿大很大，且人口分散。应制定一个系統來跟踪就业状況，並確保能够找到有资格在海外服务的人。"
 CAN_wartime_prices_and_trade_board:0 "战争時價格和贸易委员会"
 CAN_wartime_prices_and_trade_board_desc:0 "为了防止商人牟利和囤積，已經启动了價格控制，使商品可供大多数加拿大人使用。"
 CAN_bits_and_pieces_program:0 "点和面计畫"
 CAN_bits_and_pieces_program_desc:0 "点和面计划将为战争争努力调动一些致力于小型消费品的小型工厂。自行车工厂可以找到一些有用的战争争物品的能力。"
 CAN_fund_the_national_research_council:0 "国家基金研究委员会"
 CAN_fund_the_national_research_council_desc:0 "加拿大拥有科学和永久的歷史，但目前研究人员的需要比以往任何時候都更大。现在是把更多的精力放在国家研究委员会背后的時候了。"
 CAN_mine_the_shield:0 "开採资源"
 CAN_mine_the_shield_desc:0 "加拿大盾富有鎳、銅、金和銀。我们被賦予自然的礦物豐富。现在是进一步利用它的時候了。"
 CAN_canada_wheat_board:0 "小麥委员会"
 CAN_canada_wheat_board_desc:0 "如果我们恢復和振兴加拿大小麥委员会以確保小麥、大麥、燕麥和其他作物的銷售價格，我们西方農民在大蕭条中的破壞可以得到解決。"
 CAN_victory_aircraft_limited:0 "勝利飞机有限公司"
 CAN_victory_aircraft_limited_desc:0 "勝利飞机的任务是建设加拿大的轟炸机大队。蘭开斯为大家！"
 CAN_alberta_coal_towns:0 "阿爾伯塔礦区"
 CAN_alberta_coal_towns_desc:0 "沿著洛基山有豐富的礦脈隨時可以开採。我们可以促进移民到这些新的礦区，並改善西部的就业。"
 CAN_commit_to_the_war:0 "战争争承諾"
 CAN_commit_to_the_war_desc:0 "世界正在燃燒，加拿大可以发挥作用。我们发誓要保护民主和英式生活。"
 CAN_john_inglis_and_company:0 "約翰·英格利斯公司"
 CAN_john_inglis_and_company_desc:0 "約翰·英格利斯公司将被指示为加拿大军队生產新的枪炮。"
 CAN_polymer_corporation:0 "分子聚合物公司"
 CAN_polymer_corporation_desc:0 "新建立的皇冠公司所创立的分子聚合物公司，已被证明在生產新的橡胶聚合物方面非常有效。"
 CAN_national_steel_car:0 "国民鐵路车輛公司"
 CAN_national_steel_car_desc:0 "该公司成功挺过經濟大蕭条，国民鐵车公司有專門知识和經驗，能幫助我们建立 所需的鐵路及军队需要的车輛。"
 CAN_send_in_the_zombies:0 "国家资源动员法案\n（NRMA）"
 CAN_send_in_the_zombies_desc:0 "现在是讓所有加拿大合格的男人在军队工作的時候了。我们透过国家道路协会已經动员了很多人力，现在是時候他们将被派往海外。"
 CAN_if_day:0 "如果日"
 CAN_if_day_desc:0 "加拿大人沒有認真對待外国統治的威胁，所以我们将模擬納粹占领溫尼伯地区，讓人民感到驚慌。这肯定会增加国家債券的銷售。"
 CAN_defense_research_grants:0 "贊助国防研究"
 CAN_defense_research_grants_desc:0 "现在加拿大完全是一个主权国家，我们不再像以前那樣获得先进原型和藍圖技术。我们必須確保我们科技始終超前我们敌人。"
 CAN_uranium_mining:0 "鈾礦"
 CAN_uranium_mining_desc:0 "我们盟友正在开展一个需要鈾的秘密项目。幸運的是，埃爾多拉多公司发现了稀有礦物，並在礦区周围建造了一个小鎮 - 蔚藍港。政府必須確保这家公司的控制权，保护这种高度敏感的礦產。"
 CAN_long_branch_arsenal:0 "歷久彌新的兵工厂"
 CAN_long_branch_arsenal_desc:0 "在多倫多西部的兵工厂是我们步枪生產的中心。我们需要成千上萬像李英菲爾这樣的工厂，而位于中央位置的兵工厂将有助于快速運送武器到全国各地。"
 CAN_independent_command:0 "獨立指挥部"
 CAN_independent_command_desc:0 "在大战争中，加拿大军队都必須聽从英国指挥，導致 Somme、Passchendaele 这樣的无意義的战争役发生。这一次，加拿大将只聽从自己的命令。"
 CAN_forced_quebec_conscription:0 "魁北克強征法案"
 CAN_forced_quebec_conscription_desc:0 "正如 1917 年，有些魁北克的法裔公民拒絕为一殖民地獻出生命，並且主张抵制全国性的征兵法案，由于此案会嚴重影响入伍人数，因此我们不打算讓一个少数民族違背議会的意志。"
 CAN_compromise_with_quebec:0 "魁北克緩征条例"
 CAN_compromise_with_quebec_desc:0 "魁北克正在全国征兵。这个问题幾乎在大战争中分裂了国家，我们不能在危机時期破壞我们民族团結。也许我们可以就魁北克居民的战争争服务达成协議。"
 CAN_war_fueled_economy:0 "战争争經濟"
 CAN_war_fueled_economy_desc:0 "海外對原料和成品的需求，使加拿大擺脫了經濟大蕭条。我们所拥有森林资源和礦產，这些自然资源的財富可以養活盟军的战争争机器，並讓国家豐富。"
 CAN_army_modernization:0 "军队现代化"
 CAN_army_modernization_desc:0 "我们建筑、军队裝备都过于老舊，无法承受战争火的洗禮。我们必須立即迎接现代化，不然为時已晚。"
 CAN_canadian_infantry_corps:0 "加拿大步兵团"
 CAN_canadian_infantry_corps_desc:0 "我们现在有足够的人來建立一个军团级別的組織。加拿大步兵团是我们自上次战争争以來的第一支军团。"
 CAN_cmp_truck:0 "裝甲運兵车"
 CAN_cmp_truck_desc:0 "加拿大工厂挺过敌人的轟炸，因此，我们可以運用運输來战争斗。我们CMP卡车设计是多才多藝适合于多种氣候。"
 CAN_royal_regiment_of_canadian_artillery:0 "加拿大皇家炮兵团"
 CAN_royal_regiment_of_canadian_artillery_desc:0 "儘管沒有最新的大炮，我们必須开始训练我们炮兵打一场现代战争争，包括如何使用防空炮和新的25磅弹药。"
 CAN_a_motorized_army:0 "机动部队"
 CAN_a_motorized_army_desc:0 "加拿大在製造卡车和发动机方面的經驗，使我们在机动武裝部队的研究和发展方面處于领先地位。"
 CAN_red_deer_training_camp:0 "紅鹿训练营"
 CAN_red_deer_training_camp_desc:0 "紅鹿训练营将是我们新军队训练的主要场所。训练营地理位置优越，且拥有完整的军械庫和机场。"
 CAN_the_walkie_talkie:0 "對講机"
 CAN_the_walkie_talkie_desc:0 "唐納德 发明了一种新的手持式雙向通訊裝备，该裝备可发送无线电波。这将大大改善溝通和定位方式。"
 CAN_1st_canadian_parachute_battalion:0 "第一加拿大降落伞营"
 CAN_1st_canadian_parachute_battalion_desc:0 "儘管部分的人希望我们專注于家園防禦，但现代空降战争可以 削弱我们敌人，我们需要一个專門的降落伞训练营。"
 CAN_the_black_devils:0 "黑魔鬼"
 CAN_the_black_devils_desc:0 "需要一种特別的突擊队单位，來进行危險任务。而我们已經安排了与美国盟友組建魔鬼旅的合作。"
 CAN_the_valentine_tank:0 "瓦倫丁战争车"
 CAN_the_valentine_tank_desc:0 "加拿大获得许可來生產情人节战争车，英国人所设计的耐用中型战争车。"
 CAN_the_rocky_mountain_rangers:0 "洛磯山游骑兵"
 CAN_the_rocky_mountain_rangers_desc:0 "在西部的防卫将落到位于坎盧普斯的洛基山游骑兵。"
 CAN_strengthen_the_commonwealth_ties:0 "加強与英国联邦关系"
 CAN_strengthen_the_commonwealth_ties_desc:0 "我们同胞是我们最真誠的朋友，我们都应该一致支持陛下。"
 CAN_shadow_factories:0 "影子工厂"
 CAN_shadow_factories_desc:0 "我们需要飞机工厂，但是零部件製造将分散在其他工厂當中，特別是在汽车工厂附近更容易且更安全。这需要加強保密安全。"
 CAN_montreal_laboratory_collaboration:0 "蒙特利爾實驗室合作"
 CAN_montreal_laboratory_collaboration_desc:1 "蒙特利爾實驗室已經成为世界各地科学家的一个吸引力。法国和英国科学家受到特別歡迎，並为国家的努力帶來非常需要的專业知识。"
 CAN_the_plan:0 "联邦航空培训计划"
 CAN_the_plan_desc:0 "我们与我们盟友一起分享了飞行员训练的經驗和见解。可以借由空战争來获得勝利，所以联邦航空培训计划可能是勝利的关鍵！"
 CAN_camp_x:0 "X 营"
 CAN_camp_x_desc:0 "情报收集和间諜训练将集中在奧沙瓦附近的秘密地点。它将成为英国和美国的资訊處理中心。"
 CAN_supply_the_empire:0 "支援帝国"
 CAN_supply_the_empire_desc:0 "有哪个国家富藏的木財、鐵礦、鎳土，煤炭等资源勝过我们嗎？只要我们的船队与鐵路是安全的，我们就可以運送这些原料到世界各地的盟友手裡。"
 CAN_aluminium_company_of_canada:0 "加拿大铝业公司"
 CAN_aluminium_company_of_canada_desc:0 "铝是轻質和防銹的金属。通过扩大我们铝的採礦和生產，我们可以確保我们工厂和裝配线将总是供应。"
 CAN_turner_valley_oilfield:0 "特納谷油田"
 CAN_turner_valley_oilfield_desc:0 "发现于1914年，卡爾加里以外的特納山谷已經成为帝国最大的油田之一。进一步商业发展应该是政府的首要任务。"
 CAN_patriation:0 "憲法分离"
 CAN_patriation_desc:0 "加拿大是縮短与英格蘭母親的关系的時候了。我们是一个成長的国家，有我们自己的命運，望著大陸，穿越太平洋到英格蘭和歐洲。"
 CAN_permanent_joint_defense_board:0 "联合防务委员会"
 CAN_permanent_joint_defense_board_desc:0 "地理和歷史将我们与美国連接在一起，但是大陸太大了，我们任何一方都不能单獨維护。需要联合国防委员会进行北美保护的磋商和规划。"
 CAN_north_american_alliance:0 "北美联盟"
 CAN_north_american_alliance_desc:0 "现在是宣布与美利堅合眾国建立偉大和長期夥伴关系的時候了。沒有人能够在我们团結在和平和兄弟情誼時挑战争我们。"
 CAN_habakkuk_carrier:0 "哈巴谷级航母"
 CAN_habakkuk_carrier_desc:0 "哈巴谷是我们由木漿和冰等材料建造的反潜舰艇计划。这将釋放鋼为更重要的用途，也是进一步的加拿大科学。"
 CAN_refuge_for_scientists:0 "科学家的避难所"
 CAN_refuge_for_scientists_desc:0 "加拿大遠离战争争的騷乱，是许多科学家夢寐以求的沒有炸弹、子弹的夢幻工作地点。"
 CAN_swastika_clubs:0 "鐵十字军俱樂部"
 CAN_swastika_clubs_desc:0 "许多加拿大人加入鐵十字军俱樂部，以促进法西斯主義的想法和理想。真是迷人阿！"
 CAN_support_the_blue_shirts:0 "支持藍衫军"
 CAN_support_the_blue_shirts_desc:0 "我们国家转向法西斯主義将需要一个強大的准军事武器來恐嚇和打动我们對手。藍襯衫将是我们對任何違抗我们新秩序的人的答案。"
 CAN_join_germany:0 "阵营目标：軸心国"
 CAN_join_germany_desc:0 "希特勒已經证明自己是有能力的人，在他的领導下德国家变的更強大。我们将加入他们，並共同迎接新的黃金時代。"
 CAN_support_a_synarchist_baja:0 "全国工会联盟"
 CAN_support_a_synarchist_baja_desc:0 "为了进一步扩大保守的民族主義在北美傳播，我们应该拋棄並反抗墨西哥的獨裁者。一但成功，我们将有两个法西斯国家准备好跨越半个地球的影响力。"
 CAN_pinion_the_eagle:0 "囚鷹行动"
 CAN_pinion_the_eagle_desc:0 "我们与美国的邊界已經无防禦太長時间了。美国仍然是加拿大安全的最大威胁，因此我们必須将採取行动，使美国入侵時遇到困难並減緩侵略速度。"
 CAN_skewer_the_eagle:0 "獵鷹行动"
 CAN_skewer_the_eagle_desc:0 "我们将与我们墨西哥兄弟組成一个联盟，围繞並控制美国的威胁。"
 CAN_defence_scheme_no_1:0 "一號国防计划書"
 CAN_defence_scheme_no_1_desc:0 "现在是解除一號国防计划的時候了，我们将在战争争发生時，對美国进行反擊计划。"
 CAN_demand_labrador_and_newfoundland:0 "索要紐芬蘭与拉布拉多"
 CAN_demand_labrador_and_newfoundland_desc:0 "紐芬蘭政府是一个失败的自治政府，为此它只得恢復到殖民地的身分。看來加拿大才是最适合的歸属。"
 CAN_burn_the_royal_portraits:0 "抹去皇家誓言"
 CAN_burn_the_royal_portraits_desc:0 "王权已死！我们不能再接受外国傀儡和外国議会的統治。加拿大将会得到自由与平等，而人民将会崛起。"
 CAN_communist_labor_total_war_committee:0 "战争時勞务委员会"
 CAN_communist_labor_total_war_committee_desc:0 "加拿大共產黨人也是愛国者！在反對法西斯主義的全球战争争中，我们可以与资產階级自由派合作，动员整个国家进行战争争。"
 CAN_defence_scheme_no_2:0 "二號国防计划書"
 CAN_defence_scheme_no_2_desc:0 "二號国防计划是我们在美国和日本帝国之间，處理太平洋发生战争争下的应急应变计划。理想的情況下，我们将在战争争中保持中立，但无论如何，我们都需要在西海岸加強防禦设施。"
 CAN_supply_the_red_army:0 "支援紅军"
 CAN_supply_the_red_army_desc:0 "由于蘇联正在對抗人民的敌人，加拿大应承諾並提供莫斯科武器和裝备。"
 CAN_canada_united:0 "加拿大萬歲！"
 CAN_canada_united_desc:0 "即使我们人口在整个非洲大陸上，僅分佈在一条細小的线上，但我们将会在世界危机中聚集在一起，來支持加拿大的價值观並保护弱者。"
 CAN_join_comintern:0 "阵营目标：共產国際"
 CAN_join_comintern_desc:0 "蘇联已經证明了它的誠意和實力。加拿大应加入蘇联。"
 CAN_support_the_world_revolution:0 "世界革命"
 CAN_support_the_world_revolution_desc:0 "你聽到有人在唱歌嗎？这是国際歌！加拿大将会努力把无產階级从他们的枷锁中解放出來。"
 CAN_rcaf_station_borden:0 "博登空军基地"
 CAN_rcaf_station_borden_desc:0 "加拿大的空军团出生在安大略省的博登，该基地应该用于训练新一代飞行员。"
 CAN_we_have_the_hurricane:0 "颶風战争斗机"
 CAN_we_have_the_hurricane_desc:0 "大英联合王国允许我们建造颶風战争斗机。这些飞机将是我们主力战争机。"
 CAN_the_pacific_coast_air_defence_radar_system:0 "太平洋海岸防空雷达系統"
 CAN_the_pacific_coast_air_defence_radar_system_desc:0 "不列颠哥倫比亞省的海岸除了在南部，都是人口稀少的岩石。我们将不得不依賴早期预警系統，例如一个雷达站鏈，以检測任何來自太平洋的異常。"
 CAN_commonwealth_air_training_plan:0 "联邦航空培训计划"
 CAN_commonwealth_air_training_plan_desc:0 "我们将与英联邦和盟友协调空战争训练。这樣将更有效率的大量生產、建造我们空中战争力。"
 CAN_fund_fairchilds_development:0 "基金发展"
 CAN_fund_fairchilds_development_desc:0 "在魁北克的飞机工厂应该获得它所需要的资源，以增加轟炸机零件生產。我们应该能够增加以千计的就业数。"
 CAN_cookie_carriers:0 "餅乾運输机"
 CAN_cookie_carriers_desc:0 "空中战争争需要重型轟炸机，使我们能在敌人的頭上撒下美味的食物。"
 CAN_the_sabre_project:0 "军刀计畫"
 CAN_the_sabre_project_desc:0 "喷射战争机将主宰未來的天空，所以我们应该投资于生產我们自己的喷射飞机。"
 CAN_halifax_shipyards:0 "哈利法克斯海军船坞"
 CAN_halifax_shipyards_desc:0 "哈利法克斯碼頭位于歐洲對面，位置便利，它直以创紀錄的速度建造新船。我们可以贏大西洋战争争！"
 CAN_destroyer_effort:0 "反潜计畫"
 CAN_destroyer_effort_desc:0 "運输部队正遭受潜艇攻擊的威胁，我们应集中精力建造驅逐舰，來狩殺这些该死的水下威胁。"
 CAN_light_cruiser_effort:0 "注重轻巡洋舰"
 CAN_light_cruiser_effort_desc:0 "我们无法不斷的建造高成本的战争舰，但如果大量建造小型巡洋舰，我们仍可透过数量來战争勝敌人。"
 CAN_heavy_cruiser_effort:0 "注重重型巡洋舰"
 CAN_heavy_cruiser_effort_desc:0 "我们可以在重型巡洋舰周围建造我们舰队，只要拥有足够的港口，这将变成一个可行的战争略"
 CAN_escort_fleet:0 "护送舰队"
 CAN_escort_fleet_desc:0 "海洋使我们与世界上大部分的动乱隔絕，如果我们要支援军队的战争斗，我们需要优先考慮护卫編队和反潜战争。"
 CAN_fleet_in_being:0 "存在舰队"
 CAN_fleet_in_being_desc:0 "借由建立一支龐大的海军力量來讓我们敌人感受到威胁，即使我们只是純粹拥有而从未部署它。我们具有足够的船支在海上航行，讓敌人抱持这想法，将迫使他们行动更为謹慎。"
 CAN_degauss_ship_hulls:0 "消磁船体"
 CAN_degauss_ship_hulls_desc:0 "我们将开始消磁我们船体，減少他们的磁性识別碼。这保护他们免受磁性地雷和減少舰艇的电子配置。"
 CAN_trade_fleet:0 "贸易舰队"
 CAN_trade_fleet_desc:0 "加拿大是一个贸易国。建造更多的貨輪和护航舰。"
 CAN_united_shipyards:0 "联合海军船坞"
 CAN_united_shipyards_desc:0 "联合造船的厂蒙特利爾碼頭，已成为我们登陸艇和貨船的主要來源。"
 SAF_support_axis_interests_effect_tt:0 "當占领非洲南部和中部時，增筑§Y基础设施§!並增加§Y建筑槽位§!"
 SAF_a_king_for_our_people_trigger_tt:0 "愛德華国王已被流放"
 NATIONAL_FOCUS_MUTUALLY_EXCLUSIVE_TREE:0 "该分支互相衝突。"
 NATIONAL_FOCUS_EXCLUSIVE_INFO_DESC:0 "与此方针擇一："
 NATIONAL_FOCUS_EXCLUSIVE_INFO_ENTRY:0 "$FOCUS|Y$"
 NATIONAL_FOCUS_NO_CURRENT_EFFECT:0 "此方针目前沒有作用，世界情势的改变可能会影响此方针的作用。"
 SAF_war_measures_act:0 "战争争措施法"
 SAF_war_measures_act_desc:0 "我们不能允许任何對战争争的阻礙，所以我们正在通过新的立法，以执行完全遵守政府的目标。这将保护资源流动，並使我们能够在需要的地方集中政治能源。"
 SAF_emergency_workers:0 "紧急工作人员"
 SAF_emergency_workers_desc:0 "现在是动员更多的南非人口进行战争争的時候了。婦女也可以以較低的成本进入工厂。"
 SAF_csir:0 "科学工业研究委员会"
 SAF_csir_desc:0 "南非科学技术领域非常落后，因此在比勒陀利亞建立科学工业研究委员会，已成为政府的迫切问题。"
 SAF_cape_garrison_artillery:0 "炮兵驻军海角"
 SAF_cape_garrison_artillery_desc:0 "海角對许多国家來说，仍然是一条通往南非門戶的重要海上航线。扩建海防和炮兵驻军，应该是我们首要任务。"
 SAF_reconstitute_the_cape_corps:0 "重建海角军团"
 SAF_reconstitute_the_cape_corps_desc:0 "从歷史上看，我们已經能够将我们一些彩色人口投入來保卫南非。国內不是每个人都受会接受，但它会釋放南非白人在国外服务。"
 SAF_expand_the_cape_corps:0 "扩大海角军团"
 SAF_expand_the_cape_corps_desc:0 "我们应在开普敦改組一支主要战争斗部队，入侵的威胁意味著我们必須給予联合国更大的资源，培训和获得武器。"
 SAF_work_for_all_poor:0 "給所有窮人工作"
 SAF_work_for_all_poor_desc:0 "过去幾年，貧窮的非洲農民湧入了城市尋找工作，到现在我们仍沒有盡力幫助他们。工业化和政府保护政策，将有助于这些人口获得工作机会。"
 SAF_outlaw_strikes:0 "罷工非法化"
 SAF_outlaw_strikes_desc:0 "工作中斷和勞动力中斷在危机時期是不愛国的。因此，罷工被宣佈为非法，政府将迫使人们返回工作。"
 SAF_support_the_policy_of_appeasement:0 "支持綏靖政策"
 SAF_support_the_policy_of_appeasement_desc:0 "在这场战争争中德国有正當理由，同盟国正遭受了极大的痛苦。我们应该利用一切机会讓我们時代保有和平。"
 SAF_police_windhoek:0 "溫荷克警察"
 SAF_police_windhoek_desc:0 "自从上一次战争争結束以來，我们對西南非前的德国殖民地有著代管責任。我们必須履行我们的義务，保护和改善其主要城市溫荷克。"
 SAF_joint_air_training_scheme:0 "联合空中训练计划"
 SAF_joint_air_training_scheme_desc:0 "同盟国正在匯集其资源和經驗，以促进和加速對飞行员和机組人员的培训。"
 SAF_desert_equipment:0 "沙漠裝备"
 SAF_desert_equipment_desc:0 "北非的战争争需要專門的沙漠设施，而我们部队需要这一方面服务，这种裝备的供应和供应将成为一个重要的后勤事项。"
 SAF_suppress_the_stormjaers:0 "壓制人民突擊队"
 SAF_suppress_the_stormjaers_desc:0 "德国的衝鋒队（Ossewabrandwag）是个類似歐洲集团的准军事派系。他们正在破壞政府征聘部队，還有我们所努力的安全措施跟統一战争争政策。我们必須分裂他们。"
 SAF_secure_interests_in_africa:0 "保护我们在非洲的利益"
 SAF_secure_interests_in_africa_desc:0 "南非联盟鄰近的一些英国殖民地，可以留給我们行政部門。並且我们应盡我们所能，來保护我们在西南非洲的利益。"
 SAF_native_laws_amendment_act:0 "原住民法修正法"
 SAF_native_laws_amendment_act_desc:0 "为了进一步保证阿富汗人的工作，我们必須限制南非黑人在城市內居住。只有那些具有悠久歷史的人，才有居留权力。"
 SAF_encourage_segregation:0 "鼓勵隔离政策"
 SAF_encourage_segregation_desc:0 "我们应努力合法地分离我们不同的民族人口，以增加我们統治階级的权力。"
 SAF_abandon_westminster:0 "放棄西敏制（英式民主）"
 SAF_abandon_westminster_desc:0 "由蘇伊士替換海角路线，以及布爾战争争的形成經驗，幫助我们创造了一个不同于以往的統治盟国的南非身份。我们应该遠离祖国，建立自己的道路。"
 SAF_support_the_afrikaner_broederbond:0 "支持南非白人兄弟"
 SAF_support_the_afrikaner_broederbond_desc:0 "兄弟会一直在为白人发出更大的声音，更強烈地分离种族。英国政策在布爾战争争中的記憶仍然強大，兄弟会可以幫助我们組建一个新的南非。"
 SAF_support_ossewabrandwag:0 "支持牛车哨兵"
 SAF_support_ossewabrandwag_desc:0 "法西斯主義的牛车哨兵准军事組織，将成为我们堡垒，來對抗反對我们国外势力。"
 SAF_celebrate_the_great_trek:0 "布爾民族萬歲"
 SAF_celebrate_the_great_trek_desc:0 "一个世紀前，我们非洲人祖先与英国殖民势力分离，並在東北建立了自己的布爾民族。他们的堅韌精神仍然代表了南非最好的美德。"
 SAF_voortrekker_monument:0 "开拓者紀念碑"
 SAF_voortrekker_monument_desc:0 "参观偉大的开拓者紀念碑，将会在这令人不安的時刻，讓我们民族更为团結。"
 SAF_support_nazification_of_south_west_africa:0 "支持西南非納粹化"
 SAF_support_nazification_of_south_west_africa_desc:0 "作为前德国殖民地，我们鼓勵德国政治理念在西南非洲的发展是恰當的。"
 SAF_south_africa_first:0 "南非第一"
 SAF_south_africa_first_desc:0 "南非是非洲大陸最強的獨立国家，因此可以成为非洲和前殖民地未來的光輝。"
 SAF_support_the_german_coup:0 "支持德国政变"
 SAF_support_the_german_coup_desc:0 "在上个世紀，德国政府早就看到南非这強大影响力的渥土。我们未來在于第三帝国，所以讓我们继续推进並推翻當前政府的计划。"
 SAF_reclaim_boer_colonies:0 "收復布爾殖民地"
 SAF_reclaim_boer_colonies_desc:0 "前波黑地区的德蘭士瓦州和其他地区属，应属于于那进取的自由人民继承。"
 SAF_commemorate_the_battle_of_blood_river:0 "紀念血河之战争"
 SAF_commemorate_the_battle_of_blood_river_desc:0 "1838年，布爾人摧毀了成千上萬的祖魯战争士，在納塔爾地区對祖魯的权力造成了致命的打擊。这肯定我们正確性的神聖标誌。"
 SAF_german_scientists:0 "德国科学家"
 SAF_german_scientists_desc:0 "德国科学家是世界上最好的，可以有很多經驗与我们分享。"
 SAF_support_axis_interests:0 "支持軸心国利益"
 SAF_support_axis_interests_desc:0 "安理会的力量有能量和意识型态，可以幫助南非在世界上建立它的地位。我们应该給予他们充分的外交支持。"
 SAF_a_king_for_our_people:0 "人民的国王"
 SAF_a_king_for_our_people_desc:0 "南非应该有一个国王，前愛德華八世溫莎公爵将可以坐在我们寶座上。"
 SAF_empower_the_workers:0 "賦予工人权力"
 SAF_empower_the_workers_desc:0 "我们是一个礦工和農民国家。南非的工人是国家意志的唯一真實代表。"
 SAF_support_spain:0 "支持西班牙"
 SAF_support_spain_desc:0 "法西斯主義在歐洲不斷升溫，我们可以在西班牙阻止它 - 或至少減緩它的蔓延。男人和资源应送去支持共和黨势力。"
 SAF_repeal_the_native_representation_act:0 "廢除土著代表法 "
 SAF_repeal_the_native_representation_act_desc:0 "种族歧视与南非民眾的革命價值观背道而馳。黑人也应该拥有投票並給予政治权利。"
 SAF_burn_the_kings_portraits:0 "焚燒国王肖像"
 SAF_burn_the_kings_portraits_desc:0 "推倒皇家肖像！这种象征性的姿态，将公开宣布我们背棄这外国王位。"
 SAF_join_comintern:0 "加入共產国際"
 SAF_join_comintern_desc:0 "蘇联一直在工人和法西斯主義奮斗。我们将加入他们这強大的联盟。"
 SAF_support_the_world_revolution:0 "支持世界革命"
 SAF_support_the_world_revolution_desc:0 "工人获勝的唯一方法，是团結整个地球上有共同理念的人。革命将需要散播到世界每个角落。"
 SAF_equal_opportunity_employment:0 "平等机会就业"
 SAF_equal_opportunity_employment_desc:0 "如果我们要改善我们国家的工人，我们必須从確保所有工人得到平等對待，而不管他们的皮膚顏色。"
 SAF_demand_madagascar:0 "索求馬达加斯加"
 SAF_demand_madagascar_desc:1 "隨著歐洲局势的戲劇性变化，现在是重新評估整个殖民主義制度的時候了。为什麼馬达加斯加要淪为一个沒落帝国的？"
 SAF_invite_soviet_advisers:0 "邀请蘇联顧问"
 SAF_invite_soviet_advisers_desc:4 "如果我们要支持他们为世界工人帶來的自由斗争，我们需要通过向他们学習來改进我们军队。"
 SAF_south_african_soviet_research_treaty:0 "与蘇联簽訂研究条約"
 SAF_south_african_soviet_research_treaty_desc:1 "在从我们蘇联朋友那裡学習了许多有價值的教训之后，现在是加深关系並簽署正式条約的時候了。"
 SAF_anti_colonialist_crusade:0 "反殖民主義十字军"
 SAF_anti_colonialist_crusade_desc:1 "殖民主義位是壓迫世界工人的帝国主義制度核心。我们處于獨特的歷史地位，借由打破这一制度，使非洲人民免受幾个世紀以來不得不忍受的剝削。"
 SAF_Union_of_the_African_People:0 "非洲人民联盟"
 SAF_Union_of_the_African_People_desc:1 "很長的時间裡，非洲人民在自己的命運方面沒有发言权。但那些日子即将結束了。我们将組建一个足够強大的阵营，以抵擋企圖推翻我们世界復兴主義者，非洲将沒有殖民主義。"
 SAF_liberate_portugese:0 "解放葡萄牙殖民地"
 SAF_liberate_portugese_desc:1 "安哥拉和三比克 的殖民地坐落在我们邊界。现在是結束對他们人民的剝削的時候了。"
 SAF_liberate_british:0 "解放英国殖民地"
 SAF_liberate_british_desc:1 "大英帝国是歷史上最臭名昭著的殖民主義的例子。我们会結束这段歷史。"
 SAF_liberate_belgian:0 "解放比利時殖民地"
 SAF_liberate_belgian_desc:1 "被 比利時 殖民的剛果，被認为是剝削和壓迫裡最殘酷的故事。我们将寫这个故事的最后一章。"
 SAF_south_african_railways:0 "南非鐵路"
 SAF_south_african_railways_desc:0 "南非鐵路公司需要扩大。可以在那裡培训各种青年，並給予必要的技能在国內工作和在国外服务。"
 SAF_expand_the_mining_industry:0 "扩大採礦业"
 SAF_expand_the_mining_industry_desc:0 "南非礦產財富是驚人的，我们剛剛开始挖掘其深厚的金、和白金储量。"
 SAF_heavy_engineering:0 "重大工程"
 SAF_heavy_engineering_desc:0 "南非急需要拥有最新的工程技术。即使我们工业基础很小，但我们可以投资重型机械和相关工程，來趕上其他势力。"
 SAF_infrastructure_effort:0 "注重基础设施"
 SAF_infrastructure_effort_desc:0 "南非的大部分地区都是发展不足的農村和聚落。更多的道路和鐵路建设，可以将国家的自然资源帶到其飢餓的港口。"
 SAF_armament_effort:0 "注重设施"
 SAF_armament_effort_desc:0 "南非不受任何外国势力的入侵，也遠离盟国。至关重要的是，它发展自己的军火工业，使联盟永遠不会被抗辯。"
 SAF_south_african_steel:0 "南非钢"
 SAF_south_african_steel_desc:0 "我们有煤有鐵。现在我们有理由在 比勒陀利亞 扩建钢厂，这将为我们提供现代武器所需的重鋼板。"
 SAF_pretoria_arms:0 "比勒陀利亞武器"
 SAF_pretoria_arms_desc:0 "比勒陀利亞 现在这区域有许多钢厂。如果能获得一些机床，我们将可以转換小武器生產中心。"
 SAF_expand_the_rand_mines:0 "开採蘭德礦区"
 SAF_expand_the_rand_mines_desc:0 "蘭德礦区是世界上最深的金礦，甚至是19世紀的挖掘技术都能讓我们致富。我们现在有能力挖的更深，获得更多財富。"
 SAF_fund_the_university_of_south_africa:0 "资助南非大学"
 SAF_fund_the_university_of_south_africa_desc:0 "比勒陀利亞的南非大学，是非洲大陸最好的大学之一（在南半球，甚至是全世界）。应该投资我们自己的本地人才，而不将我们年轻人往外送。"
 SAF_establish_the_atomics_energy_board:0 "建立原子委员会"
 SAF_establish_the_atomics_energy_board_desc:0 "原子武器将是自火药以來最大的军事突破，更不用说如果我们能够利用原子...和平利用这种权力。收集我们頂尖科学家研究这个项目。"
 SAF_the_cape_defense_institute:0 "海角国防研究所"
 SAF_the_cape_defense_institute_desc:0 "现在南非是一个主权国家，我们无法像以前那樣获得高级原型和设计藍圖。我们必須確保我们科技始終超前我们敌人。"
 SAF_defense_collaboration_initiative:0 "防禦合作倡議"
 SAF_defense_collaboration_initiative_desc:0 "英国人向我们展示了在近親之间分享科学进步的优势。如果我们採取必要的步驟來协调这一点，我们整个阵营将能够更有效地进行战争時研发。"
 SAF_special_service_battalion:0 "特勤营"
 SAF_special_service_battalion_desc:0 "南非充滿了失业的年轻人，他们需要一些能够幫助他们的東西。特勤营将灌输一些非常必要的紀律和规範給他们。"
 SAF_improve_the_three_oh_three:0 "改良李氏步枪"
 SAF_improve_the_three_oh_three_desc:0 "南非部队需要在不同的氣候下战争斗，很幸運的是，李 - 英菲爾步枪很容易製作。.303口徑已被其他国家多次修改以滿足其需要。"
 SAF_q_services_corps:0 "「代號Q」勤务团"
 SAF_q_services_corps_desc:0 "Q 勤务团是负責永久军队物流和供应的中央机構。它将處理油料、口糧、弹药和制服的分配。"
 SAF__south_african_military_college:0 "南非军事学院"
 SAF__south_african_military_college_desc:0 "南非应该拥有一所以美国西点军校为典範的军事学院。这将給我们一个忠實于联盟的專业官员团队。"
 SAF_expand_the_south_african_artillery:0 "发展南非炮兵"
 SAF_expand_the_south_african_artillery_desc:0 "火炮兵团于1934年統一。现在是增加其规模和能力的時候了。"
 SAF_sa_engineer_corps:0 "SA 工程師团队"
 SAF_sa_engineer_corps_desc:0 "南非工程兵团只有600名穿制服的男子。这在现代军队不可是这樣的。我们需要更多的男人，更多的培训來完成这项重要的任务。"
 SAF_equipment_effort:0 "強化裝备"
 SAF_equipment_effort_desc:0 "我们不能忽视我们军队所需的支助裝备的供应。枪和战争车都是好的，但我们需要更多的製服、无线电和維修工具包。"
 SAF_south_african_special_forces:0 "非洲特种部队"
 SAF_south_african_special_forces_desc:0 "南非需要一个本土的突擊队，在难以到达的地方處理这些艱难的工作。"
 SAF_mechanization_effort:0 "机械化努力"
 SAF_mechanization_effort_desc:0 "机动化和机械化的战争争正降临到我们時代。未來偉大跋涉将由和輪式车輛引導。"
 SAF_armor_effort:0 "強化裝备"
 SAF_armor_effort_desc:0 "战争场上的战争车，被認为是緩慢野獸的观念，以經是很久之前的事情了。我们研究和培训不能落后于我们敌人 - 或我们朋友。"
 SAF_commit_to_the_five_year_plan:0 "承諾「五年计划」"
 SAF_commit_to_the_five_year_plan_desc:0 "我们制定了南非空军现代化和扩建的五年计划。政府必須公开承諾不落在这个時间表之后。"
 SAF_improve_the_hawker_hartbees:0 "霍克糜羚战争机"
 SAF_improve_the_hawker_hartbees_desc:0 "我们的霍克糜羚或许不是世界上最先进的战争机，但是我们会改进这些雙翼机的力学和训练，将它发挥最大限度的利用。"
 SAF_replace_the_blenheim:0 "布倫海姆轟炸机"
 SAF_replace_the_blenheim_desc:0 "布里斯托生產的布倫海姆轟炸机，一直是皇家空军所使用的轻型轟炸机。是時候來加強它，讓它更加堅固並具有更長航程。"
 SAF_perfect_the_cab_rank_technique:0 "无懈可擊的「Cab - Rank」战争术"
 SAF_perfect_the_cab_rank_technique_desc:0 "「Cab - Rank」战争术（一种讓大量部署的地面指引人员搭乘侦蒐特化的指挥车輛，並且伴隨旅级单位一同深入前线进行攻擊制導的战争术，这种触及各處的协调方式讓地面空袭的呼叫歷程就像拦计程车一樣簡单快速，由英军首先在北非战争场上大量使用）讓战争斗轟炸机能在一次飞行列队中連续攻擊同一个目标。並且對敌人造成极大的壓力，但这种战争法需要大量的經驗。"
 SAF_desert_air_force:0 "沙漠空军"
 SAF_desert_air_force_desc:0 "沙漠的天空是清澈的，炙热的沙子意味著，我们需要更注重飞行力学。在这种不宽容的環境中，有很多寶貴的技能可以学習。"
 SAF_secure_the_cape_sea_route:0 "確保海角航线"
 SAF_secure_the_cape_sea_route_desc:0 "如果蘇伊士应该殞落，那麼开普敦将再次成为通往東方的門戶。我们要不惜一切代價保卫。"
 SAF_retain_experienced_pilots:0 "保留有經驗的飞行员"
 SAF_retain_experienced_pilots_desc:0 "我们具有經驗的飞行员，常常转往皇家空军发展，而不是留下为我们效力。皇家空军雖有更好发展机会，但我们应该嘗試努力，讓我们训练有素的飞行员留在家鄉，在这他们将可以启发和教育更多南非人"
 SAF_seaward_defence_force:0 "海防队"
 SAF_seaward_defence_force_desc:0 "海防队已經担任我们海军二十年了。它的资金应该增加。"
 SAF_protect_the_trade:0 "保护贸易"
 SAF_protect_the_trade_desc:0 "最終战争争表明，海上運输和护送的重要性。南非位于一个主要的贸易路线，並应確保貨物通过到达目的地。"
 SAF_disrupt_the_trade:0 "破壞贸易"
 SAF_disrupt_the_trade_desc:0 "最終战争争表明，海上運输和护送的重要性。南非位于一个主要的贸易路线上，是拦截和摧毀敌方航運的理想位置。"
 SAF_expand_the_simons_town_base:0 "发展西門鎮基地"
 SAF_expand_the_simons_town_base_desc:0 "海角西門鎮自17世紀以來，90年裡一直是南部非洲最重要的海军基地。它应该需要重新建设，來适应越來越大的船支。"
 SAF_anti_submarine_tactics:0 "反潜战争术"
 SAF_anti_submarine_tactics_desc:0 "潜艇威胁穿过好望角的船支。我们必須找到並消滅他们。"
 SAF_submarine_warfare:0 "潜艇战争"
 SAF_submarine_warfare_desc:0 "敌人贸易運输队继续使用通过好望角。我们能由海面下來打擊他们。"
 SAF_prepare_overseas_offensive:0 "准备越洋攻势"
 SAF_prepare_overseas_offensive_desc:0 "南非有著好幾英里的海岸线，非常适合训练两栖战争士兵。这是最困难的技能之一，但我们男孩可以勝任。"
 SAF_strengthen_the_cape_garrison_artillery:0 "加強海角驻军炮兵"
 SAF_strengthen_the_cape_garrison_artillery_desc:0 "必須升级和增加海角裝备，以保护海角免受敌人攻擊。"
 SAF_civil_war_tt:1 "§R內战争将会爆发§!，雙方分別是控制西南非的§Y法西斯主義的国民黨§!和控制国家其餘部分的§Y民主主義的統一黨§!。"
 SAF_german_research_tt:0 "我们将与德国簽訂技术共享协議。"
 scw_in_progress_tt:0 "西班牙正在进行內战争。"
 NZL_transfer_the_new_zealand_division:0 "转移紐西蘭師团"
 NZL_transfer_the_new_zealand_division_desc:0 "二个紐西蘭军团已被动员採取行动，所以我们应该把它送到战争斗的地方。大战争中的紐西蘭区隸属于地中海，新区也是如此。"
 NZL_form_the_rnzn:0 "建立紐西蘭皇家海军"
 NZL_form_the_rnzn_desc:0 "我们曾經的小型海岸巡邏队，现在已經发展成可以獨立于皇家海军監督的船支。紐西蘭将有自己的海军。"
 NZL_expand_devonport_naval_base:0 "建设德文港海军基地"
 NZL_expand_devonport_naval_base_desc:0 "德文港海军基地将是我们海军的总部，但它必須扩建以滿足战争争的需求。"
 NZL_coastal_defense:0 "沿海防禦"
 NZL_coastal_defense_desc:0 "紐西蘭是一个島国，雖然遠离敌人，但我们仍然須为我们沿海岸线的两栖攻擊做好准备。"
 NZL_destroyer_effort:0 "強化驅逐舰"
 NZL_destroyer_effort_desc:0 "憑借我们小型工业基地，驅逐舰会是紐西蘭投资海军力量的最有效方式。巡邏海岸、拦截潜艇、设置早期警戒线。"
 NZL_submarine_effort:0 "強化潜艇"
 NZL_submarine_effort_desc:0 "任何物资都須經由海洋來運输，狼群可以是海洋最強大防禦方式。隐身、狩獵目标，潜艇舰队可以保护我们海路。"
 NZL_light_cruiser_effort:0 "強化轻巡洋舰"
 NZL_light_cruiser_effort_desc:0 "中型船是最适中的舰艇。轻型巡洋舰可以打帶跑，在有必要的時候避免与敌人交战争。"
 NZL_capital_ship_effort:0 "強化舰艇"
 NZL_capital_ship_effort_desc:0 "如果紐西蘭要有一流的海军，它就必須要有一流的船。我们必須投资战争舰和重型巡洋舰。"
 NZL_expand_the_nzpaf:0 "扩建紐西蘭常驻空军"
 NZL_expand_the_nzpaf_desc:0 "扩建紐西蘭常驻空军"
 NZL_form_the_rnzaf:0 "紐西蘭皇家空军"
 NZL_form_the_rnzaf_desc:0 "现在是讓空军獨立于其他战争斗单位的時候了。紐西蘭皇家空军将有自己的指挥結構，但与皇家空军密切合作。"
 NZL_fighter_focus:0 "強化战争斗机"
 NZL_fighter_focus_desc:0 "战争斗机能进行拦截和护送轟炸机，这将是我们盟友最需要的武器。"
 NZL_bomber_focus:0 "強化轟炸机"
 NZL_bomber_focus_desc:0 "轻型轟炸机可以有效地保护我们海岸线，並将需要在海外對抗我们敌人。"
 NZL_defend_our_islands:0 "保卫我们島嶼"
 NZL_defend_our_islands_desc:0 "我们必須准备好防禦來自海上的攻擊。海军轟炸机可以拦截和攻擊登陸艇，甚至攻擊主力舰艇。"
 NZL_modern_fighters:0 "现代化军队"
 NZL_modern_fighters_desc:0 "是時候升级我们战争斗机了，我们需要更快、攻擊距离更長的技术。我们盟友已經展示了世界上最先进战争机。"
 NZL_heavy_bombers:0 "重型轟炸机"
 NZL_heavy_bombers_desc:0 "战争争只能通过打擊敌人领土來贏得。重型轟炸机是對敌方工厂和城市进行毀滅性打擊最好的手段。"
 NZL_national_roads_board:0 "国家道路委员会"
 NZL_national_roads_board_desc:0 "紐西蘭崎嶇的地形阻礙了連貫的道路建设系統，但我们需要改进我们现有的道路。应该研究高速公路系統、鋪设道路，並在山上扩建新的道路。"
 NZL_new_zealand_steel:0 "紐西蘭钢"
 NZL_new_zealand_steel_desc:0 "紐西蘭已經拥有豐富的钢资源，特別是在北島。雖然需要从沙子中提取，但它可以永久作为我们钢產业的基石。"
 NZL_taranaki_oil:0 "塔拉納基油田"
 NZL_taranaki_oil_desc:0 "北部的塔拉納基地区富含礦物及石油。企业家希望利用这些储备石油，但需要更多投资來扩建炼油厂和鑽井。"
 NZL_wairarapa_sheep_farms:0 "懷拉拉帕羊農场"
 NZL_wairarapa_sheep_farms_desc:0 "懷拉拉帕的羊毛业是紐西蘭經濟的基石之一。隨著世界从大蕭条开始，對我们羊毛将有更大的需求。"
 NZL_bureau_of_industry:0 "工业局"
 NZL_bureau_of_industry_desc:0 "紐西蘭是一个放牧的農业社会。工业局必須鼓勵對资本基础设施和製造业的巨大投资。"
 NZL_department_of_scientific_and_industrial_research:0 "科学与工业研究系"
 NZL_department_of_scientific_and_industrial_research_desc:0 "其他联邦和統治国家正在投资于科学和工业研究，因此我们也应该这樣做。"
 NZL_industrial_conscription:0 "招募產业人员"
 NZL_industrial_conscription_desc:0 "我们沒有理由，讓任何一位身体健全的人不在武裝部队服役，或錯过与战争争有关的工业工作。我们新法律将把每一个有肩膀的人都动员在生產輪子上。"
 NZL_think_big:0 "偉大计划"
 NZL_think_big_desc:0 "我们已經習慣自認是比澳大利亞或加拿大小的地区。但紐西蘭完全有能力實现偉大的工业。"
 NZL_project_seal:0 "封閉计畫"
 NZL_project_seal_desc:0 "海嘯炸弹是一个新的倡議，美国人开发一种武器，可以触发海嘯壓倒我们敌人。这是一个有点奇怪，但已經发展的弹跳炸弹显示出巨大的希望。"
 NZL_national_defense_institute:0 "国防研究所"
 NZL_national_defense_institute_desc:0 "现在紐西蘭完全是一个主权国家，我们无法像以前那樣能获得高级原型和设计藍圖。我们必須確保我们科技技术始終超前我们敌人，而不落后。"
 NZL_expand_the_university_of_auckland:0 "扩大奧克蘭大学"
 NZL_expand_the_university_of_auckland_desc:0 "奧克蘭大学是我们最重要的技术学院。借由扩建这个设施，我们将有机会留下最好的頭腦在国家裡。"
 NZL_army_reforms:0 "改革陸军"
 NZL_army_reforms_desc:0 "要把军队的培训和晋升制度现代化。这樣，我们可以为正在进行的世界危机中发生的任何事情做好准备。"
 NZL_charlton_automatic_rifle:0 "查爾頓自动步枪"
 NZL_charlton_automatic_rifle_desc:0 "我们一位公民，成功将李英菲爾步枪改为全自动枪。这是紐西蘭的聰明才智，我们应该鼓勵这些创新。"
 NZL_bob_semple_tank:0 "鮑勃·森普爾战争车"
 NZL_bob_semple_tank_desc:1 "为什麼紐西蘭不应该有自己的战争车？工程部的鮑勃正在开发一种只裝有机关枪的轻型战争车。即使我们永遠不会超越原型，但我们获得的經驗将是无價的。"
 NZL_domestic_arms_industry:0 "国內武器工业"
 NZL_domestic_arms_industry_desc:0 "我们应盡可能的将工厂转向生產小武器。我们需要弹药、枪支零件及輔助裝备可能会導致我们對战争车设计的新见解，这些都可以在国內自行生產。"
 NZL_schofield_tank:0 "斯科菲爾德"
 NZL_schofield_tank_desc:0 "如果森普爾战争车沒有滿足我们需要，也许将一个战争车与一个大炮会結合的伎倆，会讓我们對战争车的设计有了新见解。"
 NZL_long_range_patrol:0 "遠方巡察队"
 NZL_long_range_patrol_desc:0 "遠程巡邏队旨在覆蓋北非廣闊的领土。这个侦察和突擊队将在世界上一些最恶劣的氣候地区进行特別任务。"
 NZL_artillery_focus:0 "強化火炮"
 NZL_artillery_focus_desc:0 "火炮對我们步兵的任何前进運动的支持至关重要。发展對弹道学和更大枪炮的研究。"
 NZL_big_bob_tank:0 "鮑勃大型战争车"
 NZL_big_bob_tank_desc:0 "歐洲战争场講求的是更大、更重型的战争车競賽。鮑勃大型战争车将對紐西蘭有所贡獻。"
 NZL_research_collaboration:0 "研究合作"
 NZL_research_collaboration_desc:0 "英国人向我们展示了在近親之间分享科学进步的优势。如果我们採取必要的步驟來协调这一点，我们整个阵营将能够更有效地进行战争時研发。"
 NZL_the_first_labor_government:0 "首屆工黨政府"
 NZL_the_first_labor_government_desc:0 "紐西蘭首屆工黨政府会實行循序漸进的执行社会和經濟議程。工业監管、工人权利、社会福利法律和工资规則都在議程上。"
 NZL_ratana_alliance:0 "拉塔納联盟"
 NZL_ratana_alliance_desc:0 "毛利紐西蘭人与拉塔納運动联盟将組織政府，並希望开始治愈英国征服的一些伤口。"
 NZL_maori_affairs_act:0 "毛利事务法"
 NZL_maori_affairs_act_desc:0 "毛利人拥有的大部分土地在經濟上是沒有幫助的。如果我们能够取得並使更多土地在政府管轄下，我们就可以把这些貧瘠土地，变成富有成果的工商业场所。"
 NZL_social_security_act:0 "社会保障法"
 NZL_social_security_act_desc:0 "紐西蘭的失业者需要照顧，需要更多的工作直到經濟復甦。我们开始在1935年的頒发聖誕獎金，但時间已經來到要为所有公民建立适當的社会安全網。"
 NZL_the_manpower_act:0 "勞动法"
 NZL_the_manpower_act_desc:0 "自战争争开始以來，毛利人大量來到城市，人力法将允许我们将这些人力引導到紐西蘭的工厂"
 NZL_amend_the_maori_affairs_act:0 "修改毛利事务法"
 NZL_amend_the_maori_affairs_act_desc:0 "我们必須修改毛利事务法，以充分提高未使用土地的生產力，但不会不必要地替代我们毛利公民。"
 NZL_waitangi_tribunal:0 "懷唐伊法庭"
 NZL_waitangi_tribunal_desc:0 "來自英国的紐西蘭人，应该瞭解他们的祖先到底做了什麼...扰乱和邊緣化紐西蘭的毛利人。血腥的斗争、夺取土地的自然资源，权利讓这些被忽视。認识到这种原罪是癒合的一个步驟。"
 NZL_maori_conscription:0 "毛利营"
 NZL_maori_conscription_desc:0 "附属在遠征部队的毛利营，是英勇主義是一个跡象，我们应该通过草案甚至不情愿的毛利人服务于我们人口。"
 NZL_maori_volunteers:0 "毛利志愿军"
 NZL_maori_volunteers_desc:0 "数百名毛利人正在加紧志愿服务在紐西蘭军队，展现他们的愛国主義。"
 NZL_strengthen_the_commonwealth:0 "親善目标：英联邦"
 NZL_strengthen_the_commonwealth_desc:0 "作为一个較小的統治者，重要的是紧貼我们朋友和家人。我们将加強与我们英国领土的联繫。"
 NZL_statute_of_westminster:0 "西敏寺法规"
 NZL_statute_of_westminster_desc:0 "西敏寺法规給予我们在皇冠下的更大的獨立性，同時仍然保持我们在帝国內。"
 NZL_2nzef:0 "第二次紐西蘭遠征军"
 NZL_2nzef_desc:0 "儘管經歷上一次恐怖的長久战争，紐西蘭准备再次出兵。我们正在組織第二次紐西蘭遠征部队。"
 NZL_arrest_pacifist_leaders:0 "逮捕和平主義领袖"
 NZL_arrest_pacifist_leaders_desc:0 "现在沒有不合群的于俗。每个人都必須專注來贏得战争争，如果这意味著扣留任何反對战争争的人，那就是我们将要做的。"
 NZL_technology_sharing_with_britain:0 "技术共享：不列颠"
 NZL_technology_sharing_with_britain_desc:0 "英国的科学和工业基础遠遠超过了我们自己，但由于我们是一家人，他们愿意与我们分享他们知道的東西。"
 NZL_the_lee_affair:0 "約翰·李"
 NZL_the_lee_affair_desc:0 "約翰·李，格林林的憲兵，一直在勞工核心小組內引起问题。他正在鼓动一个更激进的議程，而不是我们正在採取的謹慎的道路。必須採取措施消除他。"
 NZL_empower_the_working_class:0 "工作分配局"
 NZL_empower_the_working_class_desc:0 "勞动局自成立以來就一直支持工人，我们领導階级都來自于工人。讓我们为工会推出更多的戲劇性保护和权力。"
 NZL_join_comintern:0 "加入共產国際"
 NZL_join_comintern_desc:0 "现在是与联盟中的社会主義兄弟加入的時候了。通过共產国際，我们将實现工人的天堂。"
 NZL_technology_sharing_with_soviet_union:0 "技术共享：蘇維埃"
 NZL_technology_sharing_with_soviet_union_desc:0 "蘇联有许多世界頂尖的科学家和技术创新者。他们慷慨地分享他们所知道的給我们，他们是武裝的同志。"
 NZL_in_the_darkness:0 "在黑暗中摸索"
 NZL_in_the_darkness_desc:0 "我们母国所倡導的民主制度中存在著腐败。真正的力量不能通过妥协來证明。"
 NZL_befriend_japan:0 "親善目标：日本"
 NZL_befriend_japan_desc:0 "作为一个太平洋上的国家，它适合我们安全利益与该地区最強大的力量。日本及其強大的海军可以保护我们免受世界的危險。"
 NZL_rule_them_all:0 "制霸一方"
 NZL_rule_them_all_desc:0 "南太平洋的国家应该統一力量。澳大利亞应考慮我们提出的优越精神。"
 NZL_technology_sharing_with_japan:0 "技术共享：日本"
 NZL_technology_sharing_with_japan_desc:0 "日本有许多世界頂级科学家和技术创新者。他们将慷慨地分享知识与武器給我们。"
 NZL_constitution_amendment_act:0 "憲法修正案"
 NZL_constitution_amendment_act_desc:0 "紐西蘭该考慮与英国統治分离的時候了。我们将修改我们憲法，以更好地控制我们自己的政务。"
 NZL_independent_new_zealand:0 "紐西蘭獨立"
 NZL_independent_new_zealand_desc:0 "我们现在是一个共和国！紐西蘭對大英联合王国将不再有瓜葛，如同世上的所有孩子一樣，都欠其母親安全地撫養的感激。但我们必須离开大英联邦的巢穴，並以我们自己的利益來思考这个世界。"
 NZL_transfer_ships_tt:0 "[ENG.GetNameDef]转移 §Y2§! 艘§H轻巡洋舰§!給我们。"
 IND_provincial_elections:0 "省级選舉"
 IND_provincial_elections_desc:0 "印度新政府法案，将授权各省舉行選舉，地方政府负責對印度人民實施各项措施。我们将看到这對英国統治有什麼影响。"
 IND_swaraj:0 "自治权"
 IND_swaraj_desc:0 "甘地的自治概念在印度越來越受歡迎。他提倡的風俗完全打破了英国机構，斯瓦拉吉集团正在煽动在印度学派。"
 IND_indian_national_congress:0 "印度国民大会"
 IND_indian_national_congress_desc:0 "印度全国代表大会在整个大陸選舉中非常成功。他们将成为支持印度獨立的发声者，或至少一个在帝国內有更大自治度的人。"
 IND_quit_india_movement:0 "印度獨立運动"
 IND_quit_india_movement_desc:0 "甘地的印度獨立運动已經达到高潮，呼籲英国离开印度。令人难以置信的是，拉吉可以在战争争結束之前結束，但是當地的局势正在日益变得更加紧张。"
 IND_all_india_forward_bloc:0 "全印前进同盟"
 IND_all_india_forward_bloc_desc:0 "印度前进組織認为，印度脫离英国需要太長時间。必須採取更強大甚至好战争的立场。"
 IND_seek_help_from_soviet:0 "向蘇联求助"
 IND_seek_help_from_soviet_promised:0 "蘇維埃社会主義联邦承諾提供幫助。"
 IND_seek_help_from_soviet_desc:0 "蘇联是對英国帝国势力的自然平衡。他们声称他们是革命的引擎，我们应该鼓勵他们将革命傳遞到印度。"
 IND_indian_peoples_army:0 "印度人民军"
 IND_indian_peoples_army_effect:0 "共產主義支持者为自由开始內战争。规模取決于黨的支持和民主自主的发展。"
 IND_indian_peoples_army_support:0 "[SOV.GetNameDef]将支持他们的事业。"
 IND_indian_peoples_army_desc:0 "我们应该組織一支军队，向共產主義学習、並結盟。"
 IND_research_city_excursions:0 "游覽研究城市"
 IND_research_city_excursions_desc:0 "蘇联研究城市是一个奇蹟，印度的人口充滿活力和聰明的頭腦。将我们年轻工程師送往这些城市，将有助于我们国內研究和產业基地发展。"
 IND_combined_arms_academy:0 "联合作战争学院"
 IND_combined_arms_academy_desc:0 "借由新的联合武器学院，蘇联的军事训练将更有效率。我们可以利用空中、陸地和海上力量，了解现代战争争的最新情況。"
 IND_rani_of_jhans:0 "詹西女王"
 IND_rani_of_jhans_desc:0 "詹西是 1857 年印第安革命的偉大的英雄。她的勇氣和民族自豪感的例子是印度所有婦女的模型，他们想要拿起武器形成自己的势力。"
 IND_rebuilding_the_nation:0 "重建国家"
 IND_rebuilding_the_nation_desc:0 "隨著帝国壓迫者被驅逐，印度人民动员了起來，现在是修復被占领了近两个世紀的損壞的時候了。"
 IND_seek_help_from_germany:0 "向德国求助"
 IND_seek_help_from_germany_promised:0 "德意志帝国承諾提供幫助。"
 IND_seek_help_from_germany_desc:0 "德国从來沒有伤害过我们，德意志帝国是對抗英国的最佳力量。我们应该更加親近軸心国。"
 IND_indian_national_army:0 "印度国民军"
 IND_indian_national_army_effect:0 "法西斯支持者为自由开始內战争。规模取決于黨支持和民主进步。"
 IND_indian_national_army_support:0 "[GER.GetNameDef]将支持他们的事业。"
 IND_indian_national_army_desc:0 "組織一支不受英国控制的印度国民军部队。在沒有英国干涉的地区我们可以建立它，从印度人手中取回印度人力。"
 IND_battaglione_azad_hindoustan:0 "自由印度营"
 IND_battaglione_azad_hindoustan_desc:0 "義大利組成的自由印度营是由印度前战争俘团組成。训练內容有破壞，跳伞和滲透，自由印度营将是民族自豪的一大步。"
 IND_german_technology:1 "[Root.GetGermanTechnologyName]"
 IND_german_technology_german:0 "德国技术"
 IND_german_technology_japan:0 "日本技术"
 IND_german_technology_desc:0 "德国科学家是世界上最好的，他们的军事科技代表了现代的工程技术。他们愿意与我们分享他们的科技。"
 IND_japanese_army_air_force_academy:1 "[Root.GetJAAFAName]"
 IND_japanese_army_air_force_academy_german:0 "日本空军学院歡迎印度新兵，共同打擊歐洲军队在亞洲的势力。"
 IND_japanese_army_air_force_academy_japan:0 "日本空军学院"
 IND_japanese_army_air_force_academy_desc:0 "日本空军学院決定歡迎那些希望抵抗歐洲在亞洲統治的印度新兵。"
 IND_cripps_mission:0 "克里普斯使团"
 IND_cripps_mission_desc:0 "我们必須保证印度忠于大英盟国的事业，儘管民族主義激烈要求獨立。斯塔福德克里普斯爵士是一个熟練的談判者，可以向民族主義领導人保证他们的要求将得到解決。"
 IND_two_nation_theory:0 "两国论"
 IND_two_nation_theory_effect:0 "巴基斯坦将在印度获得獨立時，同時获得獨立。\n"
 IND_two_nation_theory_desc:0 "雖然長期統治为一个领土，将印度看作两个国家 - 一个印度教、一个穆斯林是有意義的。"
 IND_princely_state_donations:0 "土邦募款"
 IND_princely_state_donations_desc:0 "印度的王子国提供了長期作为英国核心印度军队的人。这些地方統治者的进一步捐贈強调了他们對帝国的支持。"
 IND_imperial_service_troops:0 "帝国服务队"
 IND_imperial_service_troops_desc:0 "帝国服务部队由印度王子招募，可达数十萬。在这些困难的時刻，陛下很高兴知道可以依靠英属印度的忠誠。"
 IND_raf_funding:0 "印度皇家空军资金"
 IND_raf_funding_desc:0 "印度皇家空军将从联合王国获得更多的资金和资產。"
 IND_navy_funding:0 "资助海军"
 IND_navy_funding_effect:0 "如果你已經拥有这项科技§Y两艘轻巡洋舰§!将会加入您的海军。\n"
 IND_navy_funding_effect_mtg:0 "§Y两艘此型號的轻型巡洋舰§!将会加入您的海军。\n"
 IND_navy_funding_desc:0 "印度皇家海军将从联合王国获得更多的资金和资產。"
 IND_british_army_support:0 "支援英国军队"
 IND_british_army_support_desc:0 "英国军队在200年的占领之后，很好地了解印度。他们了解人民和土地，並且能够支援印度士兵的战争斗训练。"
 IND_red_eagle_division:0 "紅鷹特战争队"
 IND_create_unit_red_eagles_tt:0 "在德里获得精锐步兵師。\n"
 IND_red_eagle_division_desc:0 "紅鷹特战争队将是第一个印度接受培训的特种部队，准备在海外恶劣的条件下战争斗"
 IND_chindits:0 "欽迪特"
 IND_orde_wingate_tt:0 "晋用一名§Y等级§! §G4§!，名为§Y奧德溫蓋特§!的将领。\n"
 IND_chindits_desc:0 "印度需要一支特种部队，所以我们已經組建了一支奇兵，能在亞洲叢林中的敌后行动。这些将会是危險的行动，可能会有高的伤亡率，但可以争取新的局势。"
 IND_jungle_training:0 "叢林训练"
 IND_jungle_training_effect:0 "开启§H叢林训练§!\n§H海军陸战争队\n叢林§!\n攻擊：§G+5%§!\n移动：§G+10%§!\n§H登山者\n叢林§!\n攻擊：§G+5%§!\n移动：§G+10%§!\n§H伞兵\n叢林§!\n攻擊：§G+5%§!\n移动：§G+10%§!\n"
 IND_jungle_training_desc:0 "印度、緬甸和印度支那覆蓋在叢林中，並建議特別训练，使我们士兵在这个危險的地形作战争更有效率。"
 IND_lessons_of_the_great_war:0 "大战争的教训"
 IND_lessons_of_the_great_war_desc:0 "印度殖民地士兵参加了最后一次世界大战争，从这场衝突的教训应该被帶到军队的训练和組織。"
 IND_indianisation_of_army:0 "英属印军"
 IND_indianisation_of_army_desc:0 "为了在全面战争争中适當保护印度，应动员印度全体人民。这不僅意味著从印度人口中更廣泛地招聘，而且允许印度官员在权威鏈中的某个地方执掌。"
 IND_indian_gurkhas:0 "廓爾喀团"
 IND_indian_gurkhas_desc:0 "旁遮普和尼泊爾高地的廓爾喀军队是他们的军事技能的傳奇。他们忠實地服役了多年，在各种战争争中表现卓越。"
 IND_an_indian_sandhurst:0 "桑赫斯特皇家军事学院"
 IND_an_indian_sandhurst_desc:0 "自从上一次战争争以來，印度一直在要求自己的军事学校，最終，我们組建于1932年的印度军事学院，已經出现印度官员幾年了，給我们一个核心指挥組。"
 IND_lions_of_the_great_war:0 "大战争之獅"
 IND_lions_of_the_great_war_desc:0 "錫克族有著強烈的军事傳統，在上一次战争争中获高度表彰。旁遮普人的獅子们自己組成了一个強大的团，该地区已經成熟有待进一步招募。"
 IND_indian_gentlemen_officers:0 "印度紳士军官"
 IND_indian_gentlemen_officers_desc:0 "如果我们需要忠誠的人來领導新的印度军队，那些通过与帝国當局密切合作服务过Raj的先生们是现成的指挥官。"
 IND_the_bangalore_torpedo:0 "班加羅爾雷管"
 IND_the_bangalore_torpedo_desc:0 "英属印度對战争争藝术最大的贡獻：班加羅爾雷管，工兵可以将数根雷管串联起來，比便在安全的地方将火线上障礙物清除。该裝备在世界各地都受到廣泛的歡迎。"
 IND_vickers_berthier_gun:0 "維克斯 - 貝蒂爾轻机枪枪"
 IND_vickers_berthier_gun_desc:0 "維克斯 - 貝蒂爾轻机枪有点笨拙，但有著容易快速生產的优点。對于像印度这樣的国家來说，这是枪支中非常重要的特征。"
 IND_royal_indian_artillery:0 "皇家印度火炮"
 IND_royal_indian_artillery_desc:0 "皇家印度火炮自从東印度公司在1748年与印度炮兵組成了一个大炮营以來就一直存在。我们可以借鑑这些幾十年的經驗。"
 IND_army_motorization:0 "机动化陸军"
 IND_army_motorization_desc:0 "印度太大，无法有效地被火车和馬覆蓋。军队应该有机动车和常规卡车運输。"
 IND_revive_the_screw_guns:0 "重新启用「螺栓大炮」"
 IND_revive_the_screw_guns_effect:0 "新增国家精神：§H螺栓大炮§!\n§H炮兵营\n山岳§!：移动：§G+15%§!\n§H战争防营\n山岳§!：移动：§G+15%§!"
 IND_revive_the_screw_guns_desc:0 "印度的军械庫裡蒐藏了一种專为山区开发的大炮，可以迅速拆卸和背馱方式到任何需要的地方。这七磅炮可能有点过時，但我们不应忽视它的效用。"
 IND_indian_armor:0 "印度裝备"
 IND_indian_armor_desc:0 "印度应该重点发展自己的自製盔甲和战争车部門。"
 IND_modernizing_army:0 "现代化军队"
 IND_modernizing_army_desc:0 "長期以來，印度武裝部队被视为只是一个殖民地的前哨，英国的家鄉军队幾乎沒有什麼好處和裝备。现在是時候现代化我们在拉吉。"
 IND_indian_defense_research:0 "印度国防研究"
 IND_indian_defense_research_desc:0 "现在印度完全是一个主权国家，我们无法像以前那樣可取得先进的原型和设计藍圖。我们必須確保我们科技始終超前我们敌人。"
 IND_british_pilot_training:0 "英国飞行员培训"
 IND_british_pilot_training_desc:0 "皇家空军同意进行培训印度飞行员。这种教育将對我们自己的空战争的发展有很大的幫助。"
 IND_expand_air_bases:0 "发展空军基地"
 IND_expand_air_bases_desc:0 "印度非常大，所以巡邏和保护其空域意味著我们必須增加在次大陸基地的空中能力。"
 IND_air_support_effort:0 "強化空中支援"
 IND_air_support_effort_desc:0 "混合作战争是新的战争争方式，因此我们必須将一些精力，集中在训练和生產能够支援地面和海上部队的战争机上。"
 IND_fighter_effort:0 "強化战争斗机"
 IND_fighter_effort_desc:0 "我们需要战争斗机护送轟炸机，以及拦截任何威胁我们国家的敌机。"
 IND_royal_indian_air_force:0 "印度皇家空军"
 IND_royal_indian_air_force_desc:0 "现在是使我们小型空军部队扩大到它自己的武裝部队的時机了。具有獨立指挥的国家空军将能更好地为印度人民和帝国服务。"
 IND_the_smiling_buddha:0 "笑面佛"
 IND_the_smiling_buddha_desc:0 "科学家们即将获得釋放原子能的秘密 - 这将创造非常強大的炸药。我们不能落后在尋求核子武器的道路上。"
 IND_great_indian_peninsula_railway:0 "大印度半島鐵路"
 IND_great_indian_peninsula_railway_desc:0 "政府控制大印度半島鐵路，是在1925年才开始建设，这意味著我们需要自行扩建。不斷增長的人口需要更好的交通基础设施。"
 IND_industrial_expansion:0 "扩建工业"
 IND_industrial_expansion_desc:0 "数以億计的人称呼印度回家 - 拥有人口基础的我们，沒有理由不成为一个工业巨人。"
 IND_tata_steel:0 "塔塔钢"
 IND_tata_steel_desc:0 "塔塔钢公司正在成为帝国最大的钢製造商。更大的產量将进一步推动印度现代化。"
 IND_assam_oil:0 "阿薩姆邦油田"
 IND_assam_oil_desc:0 "阿薩姆邦是印度石油生產重鎮，特別是迪格博伊的炼油厂。需要扩展和取得對这种资源的利用。"
 IND_indian_institute_of_science:0 "印度科学研究所"
 IND_indian_institute_of_science_desc:0 "印度科学院在邦加羅爾地区，拥有最好和最聰明的印度人口，他们将会讓我们国家更为进步。"
 IND_institute_of_fundamental_research:0 "塔塔基础科学研究所"
 IND_institute_of_fundamental_research_desc:0 "我们一些领先的科学家，以及實业家都支持一个新的基础研究所，用來发展物理科学和最新科技。"
 IND_research_collaboration:0 "研究合作"
 IND_research_collaboration_desc:0 "英国人向我们展示了在近親之间分享科学进步的优势。如果我们採取必要的步驟來协调这一点，我们整个阵营将能够更有效地进行战争時研发。"
 IND_expand_mazagon_dock:0 "馬扎岡船坞"
 IND_expand_mazagon_dock_desc:0 "孟買的馬扎岡船坞公司是我们在西海岸最重要的造船商。它需要在这场世界危机中有更大的能力。"
 IND_found_scindia_shipyard:0 "建立辛迪亞船厂"
 IND_found_scindia_shipyard_desc:0 "我们在国家的東海岸需要一个海军船坞，因此在 維沙卡帕特南 建立 辛迪亞海军船坞 對我们海军将來是有意義的。"
 IND_royal_indian_navy:0 "印度皇家海军"
 IND_royal_indian_navy_desc:0 "皇家印度海军需要迅速扩建。新战争术和新船应该是最优先事项。"
 IND_screening_effort:0 "篩選能力"
 IND_screening_effort_desc:0 "印度在保护通往蘇伊士運河的南部路线方面，有著至关重要的作用。拦截和护送任务，将幫助重要用品和士兵到达歐洲和非洲战争场。"
 IND_cruiser_effort:0 "強化巡洋舰"
 IND_cruiser_effort_desc:0 "巡洋舰可以扩大和增強印度海军的力量。"
 IND_submarine_effort:0 "強化潜水艇"
 IND_submarine_effort_desc:0 "隨著日本在亞洲海洋方面力量的崛起，在海底行动的潜水艇是有意義的。"
 IND_capital_ship_effort:0 "強化舰队"
 IND_capital_ship_effort_desc:0 "作为英国的前哨，印度已經看到了舰队在海洋中占據主導地位的力量。我们应该建立自己的重型巡洋舰和战争舰。"
 IND_modernizing_navy:0 "现代化海军"
 IND_modernizing_navy_desc:0 "更好的发动机、更多的船员空间、更快的速度和更大炮管。印度的海军将很快成为大陸中最好的。"
 IND_east_india_railways:0 "東印度鐵路"
 IND_east_india_railways_desc:0 "政府控制的東印度鐵路，将決定扩大和改善我们鐵道。"
 IND_integrate_princely_railways:0 "土邦鐵路"
 IND_integrate_princely_railways_desc:0 "一些印度王子已經为自己的鐵路系統提供资金，但是，到目前为止，他们与拉吉建造的鐵路线路的整合不佳。必須做一些事情把国家的列车綁在一起。"
 IND_ishapore_arsenal:0 "伊莎波爾兵工厂"
 IND_ishapore_arsenal_desc:0 "伊莎波爾工厂的枪械所自18世紀开始運作。它负責枪设计与创新，是我们武器生產系統的核心。"
 IND_clamp_down_on_corruption:0 "清除腐败"
 IND_clamp_down_on_corruption_desc:0 "儘管英国努力扩建印度鐵路系統，但扩张的實質好處很少給到印度。交通部門存在著地方性的腐败和雙重交易，我们必須做一些事情了。"
 IND_strengthen_ties_with_british_investors:0 "加強与英国投资者的关系"
 IND_strengthen_ties_with_british_investors_desc:0 "为了扩大我们工厂和资源，我们仍然嚴重依賴英国资本。直到我们拥有一个我们自己的銀行部門，我们必須彎曲膝蓋到倫敦尋求支持。"
 IND_british_rail_investors:0 "英国鐵路投资客"
 IND_british_rail_investors_desc:0 "印度的民用和交通基础设施，需要來自英国金融家的大量现金灌输。"
 IND_british_arms_investors:0 "英国军火投资客"
 IND_british_arms_investors_desc:0 "如果我们想迅速讓我们武器工厂移动，我们将需要请英国銀行投资我们军事基础设施。"
 IND_indian_sandhurst_tt:0 "晋用将领：\n一位§Y等级§! §G4§!，名为§Y科丹德拉·馬达帕·卡里亞帕§!的将领。\n一位§Y等级§! §G3§!，名为§Y蒂邁雅§!的将领。\n一位§Y等级§! §G3§!，名为§Y嘉雅那·納特喬杜里§!的将领。"
 IND_create_unit_gurkas_tt:0 "新增单位：§H廓爾喀§!。\n地点：§H德里§!\n数量：§H1§!\n"
 IND_create_unit_rani_tt:0 "新增单位：§H拉尼§!。\n地点：§H德里§!\n数量：§H1§!\n"
 IND_create_unit_sikh_tt:0 "新增单位：§H錫克§!。\n地点：§H德里§!\n数量：§H1§!\n"
 IND_create_general_rani_tt:0 "\n晋用一位§Y等级§! §G3§!，名为§Y拉克希米·山耕§!的将领。"
 continuous_naval_production:0 "航海工业"
 continuous_naval_production_desc:0 "通过将资源集中在我们海军船坞，並使熟練的造船商免于兵役，我们可以大大減少舰艇的生產時间。"
 continuous_air_production:0 "航空工业"
 continuous_air_production_desc:0 "我们可以重組我们航空事业，以消除浪费並簡化生產。"
 continuous_non_factory_construct:0 "建筑工程"
 continuous_non_factory_construct_desc:0 "我们建造业仍然有很多懈怠。通过集中我们注意力，我们可以實现施工速度的显著提高。不幸的是，机床的生產已經证明是我们重工业扩张的主要瓶頸，所以他们不会从这方面的努力中受益。"
 continuous_reduce_training_time:0 "训练军队"
 continuous_reduce_training_time_desc:0 "借由在每个部門內建立專門的高级训练单位，我们甚至可以取代以前停止训练的部門，以完成先前的培训。"
 continuous_suppression:0 "鎮壓反抗军"
 continuous_suppression_desc:0 "借由滲透我们占领土上的主要抵抗团体，並转变其领導人，我们可以大大降低他们可以做的損害。"
 continuous_repair:0 "紧急修復"
 continuous_repair_desc:0 "我们将組建專門的建筑工人和維修工厂团队，並集中控制其部署，以改善重建受損的基础设施。"
 continuous_tech_share:0 "技术共享"
 continuous_tech_share_desc:0 "我们将鼓勵我们研究机構与大学來跟盟国接触。这将讓我们获得技术。"
 continuous_boost_freedom:0 "倡導自主权"
 continuous_boost_freedom_desc:0 "通过重組我们殖民官僚及招聘土著行政官，我们更能够及時掌握我们自己的事务。"
 continuous_restrict_freedom:0 "滲透从属国"
 continuous_restrict_freedom_desc:0 "我们殖民主義者已經了解「民主自決」或「民族獨立」都是愚蠢的想法。现在是消除这些概念的時候了。"
 subject_autonomy_mod_tt:0 "附庸自治度：§G-0.5§!"
 unlocks_decision:0 "解锁 £decision_icon_small §H決議§!："
 USA_continue_the_new_deal:1 "继续羅斯福新政"
 USA_continue_the_new_deal_desc:1 "新政的政策被证明是有效的。我们现在不能迷失方向。"
 USA_suspend_the_presecution:0 "中止政治迫害"
 USA_suspend_the_presecution_desc:0 "因为美国公民与政府持有不同的政治观点，无论这些观点看起來多麼令人憎恶，而對他们进行迫害，从根本上与这个国家的價值观不一致。这必須立即停止。"
 USA_desegregate_the_armed_forces:1 "廢除军队种族隔离政策"
 USA_desegregate_the_armed_forces_desc:1 "在一个国家的武裝部队中服役可能是一项不受歡迎的責任与義务，但它也可能是一项珍貴的权利。一项我们许多公民因其祖先的血統而被剝夺的权利。"
 USA_full_desegregation:1 "徹底廢除种族隔离"
 USA_full_desegregation_desc:1 "長久以來，我们一些州基于舊的、过時的、不人道的标准而区別對待人民。在一个自由的共和国里，每个公民都必須得到平等對待，而不是差別待遇"
 USA_democratic_socialism:1 "民主社会主義"
 USA_democratic_socialism_desc:1 "任何頭腦健全的人都无法否認，社会主義是人類文明的未來。与此同時，我们共和国任何驕傲和愛国的公民，都不可能支持一个政府並非民有和民治的体制。像我们引以为傲的国父一樣，我们将创造一种結合社会主義和民主两者的新政府形式。"
 USA_liberty_for_the_philippines:1 "解放菲律賓"
 USA_liberty_for_the_philippines_desc:1 "菲律賓人民已經展现了他们組織自己事务的能力，现在是時候正式移交美国的控制权。"
 USA_pacific_decolonisation:1 "太平洋去殖民化"
 USA_pacific_decolonisation_desc:1 "沒有任何道理讓歐洲列強在太平洋继续存在，也沒有任何道理使太平洋島嶼的人民继续被他们的歐洲宗主奴役。只要这种不公正现象继续存在，美国将不会再袖手旁观。"
 USA_union_representation_act:1 "工会代表法案"
 USA_union_representation_act_desc:1 "工作是人類生活的核心部分，而組建工会是組織民主社会的基本部分。我们应该承認这一点，並確保工会在国会中具有足够話語权，这樣才是最合适的。"
 USA_old_age_pension_act:1 "退休金法案"
 USA_old_age_pension_act_desc:1 "在工作了一輩子之后，我们人民理应在老年時享受經濟保障和尊重。當前存在的的法律显然是不足的。"
 USA_accumulated_wealth_tax_act:1 "累进財產稅法案"
 USA_accumulated_wealth_tax_act_desc:1 "我们国家的有些人積累了大量资本。这些錢消极地存放在銀行帳戶中，或者投资于不切實際的大型建筑、鍍金家具和昂貴畫作。这些行为都沒有提供任何實際的經濟效益。通过制定新的稅收，我们将迫使那些累積了这些无用財富的公民将资金再投资于經濟发展上。"
 USA_guarantee_the_american_dream:1 "捍卫美国夢"
 USA_guarantee_the_american_dream_desc:0 "我们大多数人民對生活都沒有太多要求：稳定的工作、良好的健康状态以及一處地方來建立家庭。他们沒有理由不应该得到这些。"
 USA_worker_management_act:1 "勞工管理法案"
 USA_worker_management_act_desc:1 "工厂和辦公室极为經常地任由从未在工厂工作过的人管理。由于无法理解生產的實際情況，他们设定了不切實際的预期目标。为了保护我们經濟免受这些无能的管理階層造成的損害，我们将實行工人有、工人治和工人享的管理制度！"
 USA_militia_organization_act:1 "民兵組織法案"
 USA_militia_organization_act_desc:1 "我们自豪的共和国有悠久的民兵傳統。如果我们国家发现自己被外国入侵者入侵，这些入侵者将面對一支組織良好、裝备精良的民兵，民兵兒女们将在熟悉的土地上作战争，以保卫自己的家園。"
 USA_communal_property_act:1 "公共財產法案"
 USA_communal_property_act_desc:1 "多数人的需求永遠不应被少数人的意愿甚至是一个人的意愿所控制。为了確保这种情況，我们将通过新的立法，以便讓地方社区更容易执行征用权。"
 USA_reintegration:1 "重新整合"
 USA_reintegration_desc:1 "战争争使我们国家分裂，但最終，即使是那些起來反對我们人也可以被救贖。當人们已經了解到他们道路的錯誤時，应该允许他们再次重新加入我们自豪的共和国的政治发展上。"
 USA_reach_out_to_the_ware_group:1 "联繫\n哈羅德·韋爾小組"
 USA_reach_out_to_the_ware_group_desc:1 "我们政府內部有一小群忠誠的共產黨人。他们認为他们身份很隐密，但我们知曉他们的名字。也许他们可以明白我们与他们的目标一致，並且可以说服他们一同加入政府。"
 USA_us_ussr_economic_cooperation:1 "美蘇經濟合作"
 USA_us_ussr_economic_cooperation_desc:1 "儘管蘇联生于混乱和血腥之中，但蘇联在建设现代化和工业化社会方面取得了显著进展。我们应该盡力幫助他们。"
 USA_secure_china:1 "在華利益"
 USA_secure_china_desc:1 "長期而血腥的內战争使中国陷入困境。国民黨政府深陷腐败之中，失去了人民的支持。现在是時候讓我们开始支持中国的继承人 - 中国共產黨了，他们可以团結和重建这个国家。"
 USA_end_monarchism:1 "終結君主制"
 USA_end_monarchism_desc:1 "歐洲的君主制已經把世界拖入一场世界大战争，我们不能允许他们再次这樣做。我们国父向英国国王发动战争争以获得自由，而我们将讓世界永遠擺脫他的暴政！"
 USA_shatter_the_empires:1 "粉碎帝国"
 USA_shatter_the_empires_desc:1 "我们曾經是一个全球帝国的殖民地，直到我们用流血換來了我们自由。在除掉那些幻想自己是这个世界之主的人被消滅之前，我们共和国人民无法获得真正地安全。"
 USA_agricultural_adjustment_act:1 "農业调整法案"
 USA_agricultural_adjustment_act_desc:1 "我们農民尤其受到大蕭条的嚴重打擊。我们必須確保生產食物的人不被无法控制的市场淘汰。"
 USA_fair_labour_standards_act:1 "公平勞动标准法案"
 USA_fair_labour_standards_act_desc:1 "隨著緩慢恢復經濟的初步跡象浮现，现在是確保工人参与其中的時候了。我们必須禁止剝削行为，例如无償加班，並引入合理的最低工资标准。"
 USA_federal_housing_act:1 "联邦住宅法案"
 USA_federal_housing_act_desc:1 "作为我们在美国消除貧困的一連串努力的一部分，我们将制定一项联邦補貼買房的方案。"
 federal_housing_tt:0 "§Y隨机 §G5§! 省份§!：增加 §G1§! 个建筑槽位。"
 USA_office_of_scientific_research_and_development:1 "科技研究与开发\n辦公室"
 USA_office_of_scientific_research_and_development_desc:1 "隨著战争争在地平线上浮现，我们必須关注我们科学发展，以確保我们不会被任何潜在的對手超过。"
 USA_focus_on_europe:1 "強化歐洲"
 USA_focus_on_europe_desc:1 "歐洲的列強再次准备将世界拖入一场世界大战争。我们不能像以前那樣等战争争影响到我们。如果歐洲的任何一个国家和平受到威胁，我们必須准备好果斷进行干预。"
 USA_focus_on_asia:1 "強化亞洲"
 USA_focus_on_asia_desc:1 "雖然大多数人都憂心忡忡地看著歐洲，但我们也面對著整个太平洋地区的未知和不稳。在我们国土可能被攻擊之前进行干预，可能才符合我们最佳利益。"
 USA_magic:1 "魔术计划"
 USA_magic_desc:1 "海军認为他们可以破解日本密碼，这将使我们能够讀取他们所有的往來訊息，包括舰队移动的訊息。"
 USA_neutrality_act:1 "中立法案"
 USA_neutrality_act_desc:1 "越來越清楚的是战争争将在歐洲爆发。在第一次世界大战争期间，美国公司向同盟国出售了大量武器，许多人認为，美国参战争的主要动机是希望確保这些武器訂单能够获利。但这一次，不会再有任何战争争財了。"
 USA_lend_lease_act_neutrality_tt:0 "\n\n通过中立法案将§R极大地增加§!通过租借法案的可能性。"
 USA_lend_lease_act:1 "租借法案"
 USA_lend_lease_act_desc:1 "世界上的民主大国正受到攻擊。如果他们输掉了战争斗，战争争來到我们海岸线就只是時间问题。我们必須盡我们所能來支持他们，即使他们不能立即支付裝备的價錢。"
 USA_reestablish_the_gold_standard:1 "恢復金本位制"
 USA_reestablish_the_gold_standard_desc:1 "沒有金本位制，錢只不过是一种堅定的信念，而猖獗的通貨膨脹会吃掉我们人民的储蓄並貶低他们的勞动價值。我们必須放棄这种財政上不负責任的政策。"
 USA_adjusted_compensation_act:1 "退伍军人撫卹金\n调整法案"
 USA_adjusted_compensation_act_desc:1 "我们一战争的退伍老兵被承諾給予公平的養老金。最近隨著大蕭条來临，他们當中的许多人都陷入了艱难時期。我们必須盡我们所能，幫助那些在需要之時会响应共和国召喚的人们。"
 USA_labour_management_relations_act:1 "勞资关系法案"
 USA_labour_management_relations_act_desc:1 "美国各地的企业都受到各种工会活动的威胁——罷工、串联、要求提高工资。我们不能允许这种情況继续下去。"
 USA_protectionist_tariffs:1 "贸易保护主義"
 USA_protectionist_tariffs_desc:1 "自由贸易向外国競争者开放了我们市场，但其中许多競争者已經提高了自己的关稅和收费。我们公司面临激烈的競争，而他们的公司則享有关稅壁垒的保护。这种情況必須結束。"
 USA_income_tax_reform:2 "所得稅改革"
 USA_income_tax_reform_desc:1 "所得稅从每个美国人的錢包中拿錢，这些錢原本应该可以被我们公民用來購買其它東西和支持當地經濟。我们将給予美国人管理自己財政的自治度。"
 USA_institute_of_american_sciences:1 "美国科学研究所"
 USA_institute_of_american_sciences_desc:1 "全国各地的大学和研究實驗室目前都在各自組織他们認为合适的研究工作。这种情況必須結束。我们将建立一个新的組織來协调我们世界级科学家的工作。"
 USA_america_first:0 "美国优先"
 USA_america_first_desc:2 "有些人讓我们把財富和青年的鮮血花费在外国人的战争争上。我们不应受这些战争争狂人的影响，而应该靠一个簡单的格言生活：美国优先，其他所有人都排第二。"
 USA_extend_the_chinese_exclusion_acts:1 "扩大排華法案"
 USA_extend_the_chinese_exclusion_acts_desc:2 "由于中国遭受战争争蹂躪，我们必須採取措施限制中国移民，以免我们被淹沒在难民潮中。"
 USA_empower_the_huac:1 "非美活动调查委员会\n（HUAC）"
 USA_empower_the_huac_desc:1 "眾議院非美行为调查委员会在我们健康的民主机制中发挥著重要作用。我们不能允许不忠的分子試圖影响政治。"
 USA_voter_registration_act:1 "選民造冊法案"
 USA_voter_registration_act_desc:1 "選舉是民主的最重要部分。要求不去检查誰有资格参加，是极度不合理的，或者说，那些要求不受掌控的選舉舉行的人有更加險恶的动机，希望通过作票等无恥行为來颠覆選舉的結果..."
 USA_ally_with_the_silver_shirts:1 "与銀杉军結盟"
 USA_ally_with_the_silver_shirts_desc:1 "为了恢復我们国家在世界上的合理地位，並宣称我们昭昭天命，我们需要进行更根本的重組。銀杉军将幫助我们實现这一目标。"
 USA_national_prosperity_program:1 "国家振兴计畫"
 USA_national_prosperity_program_desc:1 "確保迅速恢復和持久繁荣的关鍵，不在于不受限制的市场，而在于精心指導的计划，将私营和公有企业整合起來。"
 USA_privatize_the_TVA:1 "田納西河谷管理局\n（TVA）"
 USA_privatize_the_TVA_desc:1 "田納西河谷管理局限制了私人企业競争，並在该地区建立了一个建筑產业的壁垒。私人企业已經证明能将工作做得更好的而不是交給政府來做。"
 USA_de_regulate_the_banking_sector:1 "放鬆銀行业監督"
 USA_de_regulate_the_banking_sector_desc:1 "在經歷了經濟周期中完全正常的金融市场调整之后，上屆政府對金融活动制定了相當不合理的限制。雖然这些舉措毫无疑问是善意的，但这些限制显然弊大于利。"
 USA_national_employment_strategy:1 "全民就业"
 USA_national_employment_strategy_desc:1 "失业來自一个簡单的事實：人们与提供的工作数不相匹配。工厂閒置是因为雇主找不到他们需要的员工，而国內其它地区的人卻在挨餓。我们将推出一项新战争略，確保任何雇主都能找到運作公司所需的人才。"
 USA_invite_foreign_support:1 "尋求外援"
 USA_invite_foreign_support_desc:1 "鑑于一些关于军队和部分州政府忠誠度的非常令人不安的报告，我们可能不得不尋求外援。"
 USA_send_lindbergh_to_germany:1 "出訪德国"
 USA_send_lindbergh_to_germany_desc:1 "这位著名的飞行员已經提出，要去歐洲调查德国在上次战争争后如何重建自己国家。这应该会給我们提供寶貴的經驗。查爾斯·林白還表示，他愿意加入政府內閣担任顧问的角色。"
 USA_work_with_the_bund:1 "德美同盟"
 USA_work_with_the_bund_desc:1 "德美同盟提出要幫助我们，从许多德裔美国人那裏傳达我们立场。这将確保我们在他们的国家內获得一定程度的支持基础。"
 USA_work_with_the_bund_tt:0 "確保以下各州在內战争爆发時留在联邦政府一方：俄亥俄州，密蘇里州，威斯康辛州，伊利諾州，印第安納州，密西根州。"
 USA_recruit_the_free_corps:1 "自由军团"
 USA_recruit_the_free_corps_desc:1 "隨著军方越來越可疑，我们必須转而求助于大战争的英雄。在艱难之時，德国的自由军团前來幫助威瑪共和国。我们需要一个類似的組織，在需要幫助的時刻到來時，他们将忠誠于我们。"
 USA_honor_the_confederacy:1 "邦联的荣耀"
 USA_honor_the_confederacy_desc:1 "長久以來，內战争的故事一直是从北方的角度來描述的，一场命中註定的反叛的故事。是時候也聽一聽另一方的故事了。"
 USA_war_powers_act:1 "战争争权力法案"
 USA_war_powers_act_desc:1 "在一个越來越快的飞机载著越來越大的炸弹的世界中，在一个潜艇和化学武器的世界中，限制总統的权力，要求他取得国会同意才能做保家卫国所必須之事，无疑是錯誤的。"
 USA_seize_cuba:1 "夺取古巴"
 USA_seize_cuba_desc:1 "在我们海岸之外就有一艘永不沉沒的航空母舰，隨時准备成为侵略者的前进基地。我们絕不能讓这种情況发生。"
 USA_eliminate_the_southern_threat:1 "消除南方威胁"
 USA_eliminate_the_southern_threat_desc:1 "自上一代起墨西哥就一直處于不稳定的混乱局面。无论是担憂暴力事件蔓延到我们邊境，還是担憂某人团結起这个国家並向北进军，这些理由都无关紧要——我们必須確保我们南方安全。"
 USA_the_canadian_corridor:1 "加拿大走廊"
 USA_the_canadian_corridor_desc:1 "一小塊人口稀少的加拿大领土将阿拉斯加与美国本土分隔开來。因此，该地的防禦取決于加拿大的意愿。但是，最有可能攻擊阿拉斯加的人卻是加拿大，这种事情不能继续下去。"
 USA_north_american_dominion:1 "統御北美"
 USA_north_american_dominion_desc:1 "隨著我们南北邊境已確保安全，我们必須把目光投向更遠的地方，预防任何對北美的威胁。我们不能容忍地区內有任何流氓国家。"
 USA_strategic_interests:1 "战争略利益"
 USA_strategic_interests_desc:1 "世界比以往任何時候都更加紧密联繫。原本只是一小處地方的威胁很容易增長成为整个世界的威胁。我们必須在全球建立一个相互支持的基地联絡網絡，使我们能够對任何情況迅速作出反应。"
 USA_protect_south_america:1 "保护南美"
 USA_protect_south_america_desc:1 "自从美洲大陸被发现以來，中南美洲一直是歐洲帝国的游樂场。现在是時候讓某人來负責確保这些国家不受干扰並朝著更繁荣的未來发展了。"
 USA_pacific_pacification:1 "平定太平洋"
 USA_pacific_pacification_desc:1 "澳洲和紐西蘭离英国太遠，沒辦法得到英国人立即且有效防卫之援。我们不能允许他们被一个敌视[USA.GetNameDef]的国家占领。"
 USA_secure_asia:1 "亞洲利益"
 USA_secure_asia_desc:1 "歐洲的殖民国家似乎不愿意或无法有效地保卫他们的亞洲殖民地。我们必須为他们承担这项重担，以免这些地区成为敌人进一步侵略的跳板。"
 USA_global_hegemony:1 "全球霸权"
 USA_global_hegemony_desc:1 "我们站在了實现全球霸权地位的领頭羊，这将使我们能够僅僅通过我们存在就预防区域衝突。我们必須確保地球上其餘的大国承認我们霸主地位。"
 USA_war_plans_division:1 "战争争计畫處"
 USA_war_plans_division_desc:1 "雖然我们可能渴求和平，但我们必須为战争争做好准备。"
 USA_intervention_in_the_americas:1 "干预美洲"
 USA_intervention_in_the_americas_desc:1 "我们首要任务必須是確保我们對自己半球上的任何可能发生的危險请況做好准备。"
 USA_war_plan_green:1 "綠色计畫"
 USA_war_plan_green_desc:1 "隨著墨西哥在革命后處于持续的不稳定状态，我们必須准备好果斷进行干涉。"
 USA_war_plan_crimson:1 "深紅计畫"
 USA_war_plan_crimson_desc:1 "雖然加拿大现在可能是一个友好的鄰居，但情況可能並非总是如此。"
 USA_war_plan_gray:1 "灰色计畫"
 USA_war_plan_gray_desc:1 "歷史表明，加勒比海国家非常不稳定。如果他们之中任何一国陷入不稳定状态，我们也许必須採取迅速行动以保护美国的利益。"
 USA_hemisphere_defense:1 "半球防禦计划"
 USA_hemisphere_defense_desc:1 "无论存在任何国外威胁，我们必須首先且优先关注我们自己的鄰居。"
 USA_intervention_in_europe:1 "介入歐洲"
 USA_intervention_in_europe_desc:1 "在第一次世界大战争結束过后不到二十年，歐洲各国再次准备开战争。我们必須做好准备，在局势需要的時候迅速干预。"
 USA_war_plan_gold:1 "金色计畫"
 USA_war_plan_gold_desc:1 "法国遭受內部分裂和日益加劇的政治动盪困扰，但她也是歐洲最龐大的军事力量之一。这种組合讓很多人感到不舒服。"
 USA_war_plan_silver:0 "銀色计畫"
 USA_war_plan_silver_desc:0 "義大利公开宣布其統治地中海的野心。如果他们對恢復羅馬帝国的渴望与我们利益相衝突，我们必須做好准备。"
 USA_anti_bolshevist_aid:1 "反共兵工厂"
 USA_anti_bolshevist_aid_desc:1 "我们可以給那些反對共產主義傳播的人提供枪支、炮弹、子弹和军靴，这最終将有助于保护我们。"
 USA_war_plan_ruby:1 "紅寶石计畫"
 USA_war_plan_ruby_desc:1 "印度拥有多达数百萬的人民，如果我们发生衝突，我们必須准备好面對这些人。"
 USA_war_plan_scarlet_garnet:1 "紅石榴计畫"
 USA_war_plan_scarlet_garnet_desc:1 "在太平洋地区，澳洲和紐西蘭可能会幫助她们的祖国。任何對付英国的计划都必須考慮到她的殖民地。"
 USA_intervention_in_asia:1 "介入亞洲"
 USA_intervention_in_asia_desc:1 "亞洲經常被歐洲的事态发展所掩蓋，但亞洲也有自己的多事之地，促使我们为干预而做好准备。"
 USA_war_plan_yellow:1 "黃色计畫"
 USA_war_plan_yellow_desc:1 "中国的內战争状态已經持续了将近一世代人的時间。沒有人清楚什麼時候事态会恶化到我们不得不进行干预的状态。"
 USA_war_department:1 "美国战争争部"
 USA_war_department_desc:1 "在工业化战争争的時代，我们必須有一个能够充分利用我们偉大国家资源之潜力的政府。"
 USA_selective_training_act:1 "義务兵役法案"
 USA_selective_training_act_desc:1 "歷史上，即使在战争争時期，美国进行一次征兵的速度也很慢。我们再也无法承受这种悠閒了。"
 USA_louisiana_maneuvers:1 "路易斯安那大演習"
 USA_louisiana_maneuvers_desc:1 "预算限制迫使我们从遠處间接观察许多军事发展。现在，我们終于可以在實踐中嘗試我们一些理论。"
 USA_airborne_divisions:1 "空降師"
 USA_airborne_divisions_desc:1 "飞机航程和荷重的发展开闢了许多可能性。運输机可以在敌人战争线的大后方投下一整个師的部队，在那裡他们可以造成敌方嚴重的打擊与破壞。"
 USA_army_of_the_united_states:1 "扩編美国陸军"
 USA_army_of_the_united_states_desc:1 "對于即将到來的战争斗而言，美国陸军的规模太小了。为了監督我们势在必行的极速扩军，我们需要組建一个新的組織。"
 USA_womens_armed_service_integration_act:1 "女性服役法案"
 USA_womens_armed_service_integration_act_desc:1 "我们不能拒絕任何想要服役的人。多一位穿军服的女人就会多空閒出一个男人，讓他在前线战争斗。"
 USA_tank_experiments:1 "試驗战争车"
 USA_tank_experiments_desc:1 "战争车在现代战争场上是不可或缺的。我们必須找出最好利用它们的方法。"
 USA_tank_destroyer_doctrine:1 "驅逐战争车学说"
 USA_tank_destroyer_doctrine_desc:1 "一些炮兵军官提出了一个有争議的假说，声称突破重裝甲的最佳武器是一种快速、轻裝甲但备有重炮的车輛。"
 USA_main_battle_tanks:1 "底特律工业城"
 USA_main_battle_tanks_desc:1 "战争场的經驗清楚地表明，战争车必須能够执行大量任务，从步兵支援到打擊敌方战争车。设计滿足这些需求的车輛使我们能够簡化生產线。"
 USA_armored_infantry:1 "机械化步兵"
 USA_armored_infantry_desc:1 "战争车无法单獨贏得一场战争斗，需要步兵來占领土地。为他们提供裝甲车可以讓他们跟上战争车，並且在任何打向他们的東西面前倖存下來。"
 USA_build_the_pentagon:1 "五角大廈"
 USA_build_the_pentagon_desc:1 "我们军队的扩张需要一个新的全球总部來指挥它。"
 USA_department_of_defense:1 "改組国防部"
 USA_department_of_defense_desc:1 "将战争争部重新命名为国防部，是要強调我们再也不能在考驗的時刻來临之前忽略我们防禦。我们必須始終保持警惕。"
 USA_escort_fighters:1 "开发护航战争斗机"
 USA_escort_fighters_desc:1 "雖然轟炸机可能总能通过空域，但他的护卫机也许不能做到，除非他们都受到友军战争斗机的保护。"
 USA_us_army_airforce:1 "美国陸军航空队"
 USA_us_army_airforce_desc:1 "空中战争力的根本目标，是讓地面部队占领並維持地面战争线。其它一切都是輔助性的。"
 USA_us_air_force:1 "美国空军"
 USA_us_air_force_desc:1 "空中武力的根本目标是贏得战争争。用更具破壞性的武器进行战争略轟炸，一是能够瓦解敌人抵抗的意志，二是能够使他们无法有足够的裝备继续頑強抵抗。"
 USA_two_ocean_navy_act:1 "两洋海军法案"
 USA_two_ocean_navy_act_desc:1 "隨著战争争的浮现，我们必須確保沒有任何敌人能够踏上美国海岸。我们海军必須能够在我们国界的两个大洋中對抗任何敌人。"
 USA_maritime_commission:1 "联邦海事委员会"
 USA_maritime_commission_desc:1 "雖然大多数非專业人士只專注于战争舰，但真正的專家知道，其實是不起眼的運输貨船贏得了战争争。为了增加战争争期间可用的運输量，我们将組建一个專門的委员会來协调。"
 USA_advanced_basing:1 "前进基地"
 USA_advanced_basing_desc:1 "能讓敌人遠离我们海岸越遠越好。"
 USA_naval_radar:1 "改进海军雷达"
 USA_naval_radar_desc:1 "雷达使我们敌人不再受到夜色的掩护，甚至能在恶劣的天氣中探測到他们。"
 USA_fleet_submarines:1 "潜艇舰队"
 USA_fleet_submarines_desc:1 "我们在海战争中最有可能的敌人都依賴對外贸易，而显然非常容易受到潜艇的影响。这些潜艇必須有很長的航程，才能穿越海洋並靠近敌人的海岸。"
 USA_unrestricted_submarine_warfare:1 "无限制潜艇战争"
 USA_unrestricted_submarine_warfare_desc:1 "歷史已經表明，无论用什麼善意的条約試圖控制潜艇战争，其價值都比寫下条約紙张還不如。我们不应该讓这些約束害到我们自己。"
 can_degaussing_tech:0 "研发消磁技术"
 USA_great_depression_cooldown:0 "新的法案仍在起草中"
 USA_great_depression_cooldown_tt:0 "每项法案的簽署都需要间隔 §Y230§! 天。\n\n"
 USA_limited_intervention_tt:0 "\n\n通过这项法案会使得經濟发展变得§R更加困难§!。\n\n"
 britain_enforced_our_loyalty:0 "英国強迫效忠。"
 sirte_oil_developed:0 "开发蘇爾特油田"
 benghazi_oil_developed:0 "开发本哈茲油田"
 TREE_FILTER_TOGGLE: "§G点击§!开关，显示更多筛选项"
 confirm_cancel_national_focus: "取消国策"
 confirm_cancel_national_focus_progress_loss_singular: "你将会失去§R$LOST_DAYS$§!日进度。"
 confirm_cancel_national_focus_progress_loss_plural: "你将会失去§R$LOST_DAYS$§!日进度。"
 confirm_cancel_national_focus_desc: "你确定要取消§H$FOCUS_NAME$§!国策吗？"