 usa_focus:0 "美国的战争略路线"
 USA_issue_war_bonds:0 "发行战争争債券"
 USA_issue_war_bonds_desc:0 "透过战争争債券，我们可利用人民的热情与愛国心，将龐大的国庫军费支出转嫁到人民手裡。"
 USA_office_of_strategic_services:0 "战争略情报局"
 USA_office_of_strategic_services_desc:0 "建立一个專門處理情报的机構不只能對战争争有所助益，也能對未來的海外行动鋪路，英国的情报机構就是最好的榜樣。"
 USA_wartime_industry:0 "战争時工业"
 USA_wartime_industry_desc:0 "我们的工业力雖然十分強大，但並不是所有的工厂都适合转型成兵工厂，尋找更有效的转型流程是资源妥善利用的关鍵。"
 USA_first_special_service_force:0 "魔鬼旅团"
 USA_first_special_service_force_desc:0 "敌后作战争将成为所有战争争中最重要的一環，为了確實掌握战争争的勝负关鍵，我们应建立一支專精敌后行动的特种部队。"
 USA_rubber_reserve_company:0 "橡胶储备公司"
 USA_rubber_reserve_company_desc:0 "隨著战争争的爆发，我们幾乎失去了所有橡胶进口源。\n\n在付出极大的努力进行协调后，本国的各大橡胶公司同意合作开发製造合成橡胶的新技术，或许借此可以滿足战争時的工业需求。"
 USA_manifest_destiny:0 "昭昭天命"
 USA_manifest_destiny_desc:0 "我们組建以來遭遇的所有困境，都是上帝賦予我们使命的試炼！天命驅使我们對世界上所有的不公不義採取行动！为了組建一个安全的国際社会，我们必須将自由思想散布到全世界！"
 USA_manifest_destiny_tt:0 "§Y获得對所有法西斯主義与共產主義国家宣战争的理由。§!\n"
 USA_scientist_haven:0 "科学家的避風港"
 USA_scientist_haven_desc:0 "自从向全世界宣称自己是自由守护者之后，我们便可以将所有遭到海外国家放逐的有能之士盡收穀中，給予他们在这塊土地上为我们崇高理想努力並开创自己一片天地的机会。"
 USA_wpa:0 "公共事业振兴署"
 USA_wpa_desc:0 "我们自大蕭条以來，至今尚有数以百萬计的失业人口无力餬口。创立就业輔導机構或许不能完全解決问题，但至少是在正確的道路上踏出了第一步。"
 USA_committee_on_technocracy:0 "科技委员会"
 USA_committee_on_technocracy_desc:0 "我们应讓科学家与工程師取代部分政客与商人在战争略顧问中的位置。用他们的技术專長來管理經濟，能使我们的科技加速进展，同時也将重启我们經濟的輝煌時代。"
 USA_support_rock_island:0 "岩島兵工厂"
 USA_support_rock_island_desc:0 "讓我们的英勇士兵获得充分支援是获取勝利的关鍵。透过遠程炮擊与各种形式的輔助攻擊，我们士兵将拥有最大的优势。"
 USA_military_construction:0 "军事建设"
 USA_military_construction_desc:0 "在超级強权威胁世界和平的今日，我们必須将公共建设的焦点放在军事与民用设施的建立上。"
 USA_USACE_projects:0 "美国陸军工程兵团"
 USA_USACE_projects_desc:0 "美国陸军工程兵团将会为许多世界前所未有的军事项目打下地基！讓我们全力以赴吧！"
 USA_arsenal_of_democracy:0 "民主兵工厂"
 USA_arsenal_of_democracy_desc:0 "无论我们對一场战争争選擇直接干涉与否，所有的民主国家都必須都知道美国是他们最強而有力的后盾。"
 USA_liberty_ships:0 "自由輪"
 USA_liberty_ships_desc:0 "大量製造的貨輪品質，必須隨著我们工业技术的发展而提升，如此才能確保我们所有的租借法案物资順利到达目的地。"
 USA_war_propaganda:0 "战争争宣傳"
 USA_war_propaganda_desc:0 "我们国民不愿再将孩子们送上战争场，但许多政客認为国家必須干涉此种现象。以宣傳手段醜化敌人來激发国人同仇敌愾的對抗心或许不是暴君的專利。"
 USA_war_plan_black:0 "黑色计畫"
 USA_war_plan_black_desc:0 "很明显的，德国的政治野心与扩张欲望已經失控了。我们必須在他们的战争争机器毀滅世界前採取行动。"
 USA_embargo_germany:0 "禁運目标：德意志"
 USA_embargo_germany_desc:0 "德国需要石油和其他自然资源才能驅动战争争机器。我们所能做的就是切斷他们的资源來源。"
 USA_destroyers_for_bases:0 "驅逐舰換基地"
 USA_destroyers_for_bases_desc:0 "英国需要军舰，而我们需要保护家園的屏障。我们可以用少量的驅逐舰來交換在英国领土上建立军事基地的权利。"
 USA_destroyers_for_bases_tt:0 "§Y[USA.GetNameDef]§!：\n"
 USA_war_plan_white:0 "白色计畫"
 USA_war_plan_white_desc:0 "不分国內外，我们不能聽任紅色威胁扩大，这不只是對我们，而是對全世界最大的威胁！"
 USA_embargo_USSR:0 "禁運目标：蘇維埃"
 USA_embargo_USSR_desc:0 "与蘇联斷絕所有贸易关系，不只可以避免我们资源成为蘇联军事行动的幫兇，還可以借此讓蘇联了解两国之间經濟實力的差距。"
 USA_war_plan_red:0 "紅色计畫"
 USA_war_plan_red_desc:0 "那些曾經壓榨我们人民的英国帝国主義者，並不認同我们人民至上的思想精神，正試圖干涉我们內政。同志们！我们必須堅定立场！"
 USA_embargo_the_empire:0 "禁運目标：英格蘭"
 USA_embargo_the_empire_desc:0 "雖然英美两国之间曾有过非常良好的关系，但英国人拒絕了我们幫助他们改革思想的善意，该是讓他们嘗到后果的時候了！"
 USA_war_plan_orange:0 "橘色计畫"
 USA_war_plan_orange_desc:0 "日本帝国的扩张野心是我们的一大威胁，他们在亞洲与太平洋的侵略行为与我们的利益不符。"
 USA_embargo_japan:0 "禁運目标：日本"
 USA_embargo_japan_desc:0 "必須讓日本明白我们不允许也不会支援他们任何的侵略行为！對日本實施禁運政策将是挫败他们太平洋扩张野心的第一步。"
 USA_prepare_intervention:0 "准备介入"
 USA_prepare_intervention_desc:0 "透过外交与贸易上的決議，我们在国際上的立场已由中立孤立主義转变为干涉主義，我们的军事政策将会因应此变化而转型。"
 USA_extra_tech_team:0 "额外的科技小組"
 USA_manhattan_project:0 "曼哈頓计畫"
 USA_manhattan_project_desc:0 "「代用材料项目发展」，一个聽來人畜无害的陸军工程兵团计畫，将会以「曼哈頓计畫」为世人所周知。这将是军事史上最机密最危險的秘密计畫，计畫目标是造出世界上第一顆核子武器！"
 USA_unholy_alliance:0 "邪恶联盟"
 USA_unholy_alliance_desc:0 "有時，我们必須選擇敌人，不过这決定通常十分困难。将來或许会有人對于我们与一个暴君联手嚴加批判，但会有人因免于受到其餘暴君迫害而感謝我们！"
 USA_unholy_alliance_tt:0 "增加与蘇联或德国的外交及贸易友好度。若两国正在交战争中，将自动加入防禦方。"
 USA_limited_intervention:0 "有限干涉"
 USA_limited_intervention_desc:0 "若想讓我们进入完全的战争争动员状态，是需要极大外力壓迫的。不过經由最近的努力，许多人民已經愿意加入政府干涉海外衝突的行动。"
 USA_the_giant_wakes:0 "巨人甦醒"
 USA_the_giant_wakes_desc:0 "那个美国可以保持孤立主義的世界已不復存在，有许多国家为了保护自身的民主与自由而向我们求助，我们必須因应時势做出改变。"
 USA_pearl_harbor_gambit:0 "珍珠港誘敌策略"
 USA_pearl_harbor_gambit_desc:0 "我们在珍珠港的海军基地對日本來说如同待宰羔羊，若在此處驻紮舰队，将可以宣示我们在太平洋的权力。日本会不会做出甚麼大膽行动呢？真令人期待..."
 USA_pearl_harbor_gambit_tt:0 "§Y當此国家战争略启动時，日本将会获得攻擊机会！§!"
 USA_cancel_pearl_harbor_gambit:0 "取消珍珠港誘敌策略"
 USA_cancel_pearl_harbor_gambit_desc:0 "在珍珠港驻紮舰队将對我们的海军官兵性命造成极大威胁，我们将不会将他们當作引誘日本的棄子。"
 USA_air_war_plans_division:0 "空军作战争计划處"
 USA_air_war_plans_division_desc:0 "想建立正確的空军組建与飞机製造方案，需要長遠的计畫。空军作战争计畫處将负責確保我们空军的资源、組織及战争略计畫。"
 USA_air_support:0 "俯衝轟炸学说"
 USA_air_support_desc:0 "空军与其他军种的协同作战争应是我们專注发展的方向。"
 USA_strategic_bombing:0 "水平轟炸学说"
 USA_strategic_bombing_desc:0 "精准轟炸的能力将使我们阻止敌军继续生產战争争机器。"
 USA_TAC:0 "強化战争术轟炸机"
 USA_TAC_desc:0 "製造能精准攻擊战争术目标的轟炸机，将使我们陸军部队的行进更加安全。"
 USA_combined_bomber_offensive:0 "联合轟炸机攻势"
 USA_combined_bomber_offensive_desc:0 "有了其他世界強权的合作，我们将可执行前所未有的大规模轟炸计畫！"
 USA_fund_the_navy:0 "提高海军經费"
 USA_fund_the_navy_desc:0 "我们必須拥有因应所有敌人新型战争术的能力。增加海军的演習經费将提高海军的训练度，使他们在战争术上表现得比敌人更好。"
 USA_bureau_of_ships:0 "海军舰艇局"
 USA_bureau_of_ships_desc:0 "我们将把海军建造及維修局与海军工程局結合，成立海军舰艇局，此机構将负責未來的舰艇开发。"
 USA_battleship_primacy:0 "战争舰优先"
 USA_battleship_primacy_desc:0 "在日本公然違反華盛頓海军公約后，我们可能面临另一次的海军军备經賽，我们将会確保本国舰艇的品質与数量是世界第一。"
 USA_advanced_mahanian_doctrine:0 "发展馬漢学说"
 USA_advanced_mahanian_doctrine_desc:0 "阿爾弗雷德·賽耶·馬漢對海战争策略的影响不容忽视，他将战争舰视为決定海战争勝负的关鍵，依循他的理论将可讓我们战争舰发挥更大的作用。"
 USA_carrier_primacy:0 "航母优先"
 USA_carrier_primacy_desc:0 "空战争将是未來的海战争中不可或缺的一部份。为了增加空军的作战争范围，建造航空母舰是最實際的方法，我们必須生產更多更先进的航空母舰。"
 USA_bureau_of_aeronautics:0 "改組航空局"
 USA_bureau_of_aeronautics_desc:0 "为了舰载机的开发需求，必須扩大数十年前设立的航空局的规模。"
 USA_escort_effort:0 "改良护卫舰"
 USA_escort_effort_desc:0 "潜艇持续的對我们運输舰队造成威胁，研发更先进的驅逐舰将讓我们在反潜作战争中获得更大优势。"
 USA_convoy_tactics:0 "運输战争术"
 USA_convoy_tactics_desc:0 "为保护我们贸易及運输舰队，需要的不只是护卫舰艇与有效的情报，战争术性的变換贸易航线及航行准則也是很重要的。"
 USA_amphibious_operations:0 "两栖作战争"
 USA_amphibious_operations_desc:0 "除非噩夢成真，否則此次大战争不会在美国本土結束，迅速確實的登陸作战争将是我们的勝利之道！"
 USA_expand_the_USMC:0 "扩編美国海军陸战争队"
 USA_expand_the_USMC_desc:0 "在經歷多次战争役的洗禮后，美国海军陸战争队儼然已經成为我们的主力部队，而在必然到來的登陸作战争中，他们将是不可或缺的战争力。同袍们！永遠忠誠！"
 USA_reinforce_monroe_doctrine:0 "重申門羅主義"
 USA_reinforce_monroe_doctrine_desc:0 "距今百餘年前，門羅宣言主张美国应在不介入歐陸事务的前提下，對歐洲殖民主義在美洲的扩张做出干涉。透过強调我们誓死捍卫美洲和平的立场，将可增加我们在这片土地上的影响力。"
 USA_carribean_sphere:0 "加勒比海防禦圈"
 USA_carribean_sphere_desc:0 "加勒比群島是對我们東岸及巴拿馬運河进行攻擊的最佳跳板，所以我们不能允许任何敌對势力占有这些島嶼。"
 USA_central_america:0 "稳定中美洲"
 USA_central_america_desc:0 "允许任何外国势力有机会夺取或是威胁巴拿馬運河是十分不智的行为，因此，我们应對所有中美洲国家的獨立提供保障。"
 USA_the_neighbors:0 "保护鄰国"
 USA_the_neighbors_desc:0 "我们必須将鄰国的安危放在第一考量。在讓敌人有机会經由鄰国领土入侵我们之前，必須先过我们这一关！"
 USA_south_america:0 "稳定南美洲"
 USA_south_america_desc:0 "为了保护他们的安全，我们应该保障所有南美国家的獨立，絕不能允许殖民帝国再次染指南美州！"
 USA_pax_americana:0 "美洲和平"
 USA_pax_americana_desc:0 "敌人最期望看到的就是美洲国家的內斗，而我们拥有抑止紛争的力量！我们将会不遺餘力的阻止內斗的產生，必須維护美洲的和平！"
 USA_pax_americana_tt:0 "@USA§Y美国§!可以介入任何美洲国家的战争争。"
 USA_black_chamber:0 "黑室監控计畫"
 USA_black_chamber_complete:0 "§R机密§!"
 USA_black_chamber_desc:0 "我们获悉在许多美洲国家中有不符我们利益的政治活动，幸好我们早已在那些国家中建立了地下宣傳網路，隨時准备将那些国家導向正軌。为保本土安全，此乃不得已而为之！"
 USA_preemptive_intervention:0 "预防性介入"
 USA_preemptive_intervention_desc:0 "我们再也无法坐视鄰国建造更多足以威胁我们与盟国利益的战争争机器，为了我们以及全世界的利益，我们必須加以干涉！"
