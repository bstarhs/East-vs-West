 SOV_nkvd_upgrade_tooltip:1 "§Y內务人民委员会§!已与军队紧密結合，確保了士兵的高昂的士氣与專注的信念。\n§Y內务人民委员会§!同時也提高了部队的增援效率！\n"
 ger_sov_buddies_tooltip_2:0 "此动作将会毀棄[Root.GetFactionName]阵营並创立§Y德蘇邪恶同盟§!阵营。\n"
 ger_sov_buddies_tooltip:1 "§R如果蘇联同意我们的要求，我们团結度将因政策改变而轻微下降，而所有法西斯主義国家以及民主国家對此事件的不滿自是不在話下。§!\n"
