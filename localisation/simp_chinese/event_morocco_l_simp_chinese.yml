l_simp_chinese:
 mor.1.t:0 "摩洛哥苏丹在丹吉尔发表演讲"
 mor.1.d:0 "摩洛哥阿拉维王朝的苏丹默罕默德五世在该国北部城市丹吉尔发表演讲，呼吁各国关注法国统治下的摩洛哥局势。自从1912年《菲斯条约》签订以来，摩洛哥便沦为了法国的殖民地，在第二次世界大战期间，摩洛哥人积极支持盟军和法国的战斗，然而却没有在战后得到应有的回报和尊重，法国不断从摩洛哥掠夺矿产资源，大量在法国企业工作的摩洛哥人得不到基本的人权，摩洛哥的不满情绪日益增长，但法国人却只会使用暴力来镇压。"
 
 mor.2.t:0 "摩洛哥独立党的崛起"
 mor.2.d:0 "摩洛哥人的反殖民情绪推动了摩洛哥独立党的兴起，该组织从1925年成立以来一直致力于在摩洛哥支持反对法国的民族主义运动。而随着二战后，法国当局在摩洛哥的统治愈发倾向于暴力镇压，独立党也开始走向武装暴动的道路。"
 
 mor.3.t:0 "摩洛哥民族主义运动正在兴起"
 mor.3.d:0 "法国对摩洛哥的统治已经引发了许多摩洛哥人的不满，反对法国统治的游行示威正在摩洛哥不断地发生，双方矛盾日益激化。"
 
 mor.4.t:0 "摩洛哥爆发骚乱"
 mor.4.d:0 "摩洛哥爆发大规模骚乱，民族主义者走上街头游行示威，抗议法国的统治并要求废除《菲斯条约》实现独立！"
 
 mor.5.t:0 "摩洛哥爆发流血冲突"
 mor.5.d:0 "摩洛哥爆发大规模骚乱，民族主义者走上街头游行示威，抗议法国的统治并要求废除《菲斯条约》实现独立。法国警察使用暴力手段进行镇压，双方爆发激烈的流血冲突，多人伤亡。"
 
 mor.6.t:0 "摩洛哥苏丹与民族主义者接触"
 mor.6.d:0 "摩洛哥苏丹穆罕默德五世与摩洛哥的民族主义者近期频繁会面，似乎苏丹正寻求与民族主义者合作，以将法国人驱逐出摩洛哥。"
 
 mor.7.t:0 "摩洛哥发生暴动"
 mor.7.d:0 "法国将穆罕默德五世流放出摩洛哥的行为激怒了摩洛哥人民，拉巴特、卡萨布兰卡和马拉喀什等地爆发了大规模的游行示威，愤怒的摩洛哥群众包围了法国殖民政府机构，要求将苏丹送回摩洛哥，并要求法国人滚出他们的国家！"
 
 mor.8.t:0 "摩洛哥爆发流血冲突"
 mor.8.d:0 "摩洛哥爆发大规模骚乱，民族主义者走上街头游行示威，要求将苏丹穆罕默德五世送回摩洛哥并立刻驱逐法国势力。法国警察使用暴力手段进行镇压，双方爆发激烈的流血冲突，多人伤亡。"
 
 mor.9.t:0 "关注摩洛哥局势"
 mor.9.d:0 "摩洛哥发生的反殖民运动引起了全世界关注，我们应当就此事发表一则外交声明，以提高我国的国际影响力。"
 
 mor.10.t:0 "[FROM.GetName]表态呼吁尊重摩洛哥人民的政治诉求"
 mor.10.d:0 "[FROM.GetName]政府发表声明，宣布支持摩洛哥人民反对法国殖民统治的政治运动，呼吁法国当局尊重摩洛哥人民的诉求。"
 
 mor.11.t:0 "摩洛哥苏丹被流放！"
 mor.11.d:0 "来自摩洛哥首府拉巴特的消息，法国殖民当局今早包围了拉巴特王国，强迫摩洛哥苏丹穆罕默德五世携带家人离开，并将其带上了前往马达加斯加的轮船。法国政府宣称，穆罕默德五世暗中支持摩洛哥的反法运动，因此决定将其流放，并在不久之后扶植傀儡苏丹。"
 
 mor.14.t:0 "卡萨布兰卡发生炸弹袭击事件"
 
 mor.15.t:0 "Muhammad Zarqtuni在狱中自杀"
 
 mor.16.t:0 "关注摩洛哥局势"
 
 mor.17.t:0 "政府宣布支持摩洛哥民族解放运动"
 
 mor.18.t:0 "摩洛哥代表在联合国发表演讲"
 
 mor.19.t:0 "摩洛哥民族主义者的请求得到大多数国家支持"
 
 mor.20.t:0 "穆罕默德五世回到摩洛哥"
 
 mor.21.t:0 "摩洛哥问题的谈判在巴黎举行"
 mor.21.d:0 "法国政府与摩洛哥政治家代表在巴黎举行会谈，就废除《菲斯条约》和摩洛哥保护国地位一事进行对话。"
 mor.21.a:0 "我们的外交部门将保持关注"
 mor.21.b:0 "我们要求摩洛哥保留法国影响力"
 mor.21.c:0 "我们同意完全离开摩洛哥"
 
 mor.22.t:0 "关于摩洛哥未来的事务"
 mor.22.d:0 "法国政府希望摩洛哥独立后，法方继续在摩洛哥保持影响力，同时还要求在摩洛哥保留驻军权力。"
 
 mor.23.t:0 "法国提议穆罕默德·穆克里继承王位"
 
 mor.24.t:0 "摩洛哥代表拒绝我方提案"
 mor.24.d:0 "摩洛哥代表拒绝了我方提案，对方要求法国的影响力完全离开摩洛哥。"
 
 mor.25.t:0 "摩洛哥谈判不欢而散"
 
 mor.26.t:0 "摩洛哥与法国政府正式达成协议"
 mor.26.d:0 "摩洛哥代表团与法国政府的谈判宣告结束，两国将正式废除1912年《菲斯条约》，结束摩洛哥的保护国地位，成为完全的主权国家，法国军队和政府官员将在不久后撤离摩洛哥。"
 
 mor.27.t:0 "摩洛哥让步与法国政府正式达成协议"
 mor.27.d:0 "摩洛哥代表团与法国政府的谈判宣告结束，两国将修改1912年《菲斯条约》，结束摩洛哥的保护国地位，但法国依然在摩洛哥遗留了影响力，法国军队和政府官员仍将继续驻扎摩洛哥一段时间。"
 
 mor.28.t:0 "摩洛哥正式独立！"
 mor.28.d:0 "在摩洛哥首府拉巴特的皇宫前，摩洛哥民族主义的领袖，也是今天正式成为摩洛哥国王的穆罕默德五世，在摩洛哥人民的注视下，正式宣布，该国将根据与法国的谈判结果，正式结束保护国地位，成为独立的主权国家！法国军队将在不久后撤离这片统治了五十多年的土地。穆罕默德五世承诺，未来的摩洛哥人民团结合作，建立一个民主而繁荣的君主立宪制国家。"
 
 
 
 
 mor.30.t:0 "西属伊夫尼地区爆发暴力事件"
 mor.30.d:0 "西班牙控制下的伊夫尼地区发生暴动！该地区的阿拉伯裔居民要求脱离西班牙并加入摩洛哥王国！目前示威者与警察的冲突已造成多人受伤，双方仍在激烈对峙！"
 
 mor.31.t:0 "摩洛哥支持伊夫尼地区解放运动"
 mor.31.d:0 "摩洛哥的[FROM.GetLeader]发表讲话，支持伊夫尼地区的摩洛哥同胞反对西班牙殖民统治，并表示愿意为示威者提供力所能及的帮助。"
 
 mor.32.t:0 "表态支持摩洛哥收复伊夫尼地区"
 
 mor.33.t:0 "摩洛哥解放组织成立！"
 mor.33.d:0 "以伊夫尼地区脱离西班牙控制为目的成立的摩洛哥解放组织成立！该组织宣称将以武装斗争的形式实现这一目标！"
 
 mor.34.t:0 "武装分子袭击伊夫尼的西班牙驻军"
 
 mor.35.t:0 "摩洛哥与西班牙军队发生交火"
 mor.35.d:0 "伊夫尼地区的局势不断恶化！摩洛哥军队在该地区边境与西班牙驻军发生武装冲突！"
 
 mor.36.t:0 "我军在伊夫尼地区被击溃"
 
 mor.37.t:0 "摩洛哥要求联合国讨论伊夫尼问题"
 mor.37.d:0 "摩洛哥外交官在今天的联合国大会上发表讲话，指责西班牙非法侵占应属于摩洛哥领土的伊夫尼地区并镇压当地群众，要求联合国介入伊夫尼问题并促使西班牙撤军。"
 
 mor.38.t:0 "西班牙宣布伊夫尼地区停火"
 mor.38.d:0 "在国际社会以及伊夫尼地区不断恶化的局势压力下，西班牙政府被迫宣布接受摩洛哥政府提出的部分要求，开始单方面从伊夫尼撤军，并承认伊夫尼地区为摩洛哥领土，两国将择日进一步就伊夫尼未来的主权问题进行谈判。"
 
 mor.39.t:0 "摩洛哥宣布伊夫尼地区停火"
 mor.39.d:0 "尽管大力支持伊夫尼的武装暴动，但西班牙对伊夫尼的统治依然十分稳定，摩洛哥支持伊夫尼叛乱的政策几乎已经失败，并损耗了大量的人力物力。来自拉巴特的消息，摩洛哥政府据说已经彻底放弃对伊夫尼叛军的支持。"