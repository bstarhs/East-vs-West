l_simp_chinese:
 chl.1.t:0 "智利前总统阿图罗·亚历山德里去世"
 chl.1.d:0 "曾在1920至1924，1925、1932至1938年三次担任智利共和国总统的阿图罗·亚历山德里·帕尔马去世。亚历山德里是一位极具争议的政治家，他执政初期依靠工人阶级支持，推动左翼政策并与军方发生矛盾被迫辞职。但是第三次任期开始后，亚历山德里由开始亲近右翼，并制造了对工人罢工的流血镇压。随着亚历山德里的棺椁入土，他的历史争议便留给后人诉说了。"
 
 chl.2.t:0 "智利大选"

 chl.5.t:0 "智利大选"
 chl.5.d:0 "1958年智利总统大选即将开始，卡洛斯·伊瓦内斯·坎波总统任期即将结束。代表基督教民主党的爱德华多·弗雷·蒙塔瓦将对阵独立参选的豪尔赫·亚历山德里。"

 chl.6.t:0 "爱德华多·弗雷·蒙塔瓦赢得智利大选！"
 chl.6.d:0 "基督教民主党的爱德华多·弗雷·蒙塔瓦击败豪尔赫·亚历山德里赢得智利总统大选的多数票！爱德华多将就任新任智利共和国总统。爱德华多承诺将进行更多的民主和经济改革，继续保持与美国的关系，同时也保持和第三世界国家的往来。"
 
 chl.7.t:0 "豪尔赫·亚历山德里赢得智利大选"
 chl.7.d:0 "独立参选人豪尔赫·亚历山德里击败基督教民主党的爱德华多·弗雷·蒙塔瓦赢得智利总统大选的多数票！豪尔赫将就任新任智利共和国总统。豪尔赫承诺将进行更多的民主和经济改革，继续保持与美国的关系，同时也推动文化事业的发展。"
 
 chl.8.t:0 "智利大选"

 chl.12.t:0 "智利大选"

 chl.14.t:0 "智利爆发政变！"
 
 chl.21.t:0 "奥古斯托·皮诺切特被捕！"
 chl.21.d:0 "智利陆军司令奥古斯托·皮诺切特在家中被逮捕！智利安全部门根据调查，掌握了大量皮诺切特参与中情局策划的政变的证据，自智利社会党总统阿连德上台以来，美国便不遗余力地寻求推翻阿连德的机会。皮诺切特将以叛国罪进行审判，而他背后的政变阴谋也遭到挫败。"
 chl.21.a:0 "好抓！开香槟咯！"
 

 chl.31.t:0 "智利阿劳科省发生8.1级地震。"

 chl.31.t:0 "智利爆发9.4级特大地震！"
 chl.31.d:0 "继昨日8.1级地震后，智利南部今日14时再度遭遇里氏9.4级特大主震，震中位于瓦尔迪维亚市近海。这是人类有仪器记录以来的最强地震，目前已造成重大伤亡，沿海城市遭受毁灭性破坏。\n地震持续了数分钟，瓦尔迪维亚市中心三分之二建筑倒塌，医院等应急设施全部瘫痪。地面开裂，道路被扯断，大地被撕碎、扭曲，露出狰狞的裂痕。无数建筑沦为废墟，民众挣扎着从砖瓦中爬出，遍地都是被幸存者挖出的尸体……海水出现异常倒退现象，海岸线暴露出数百米的海床。政府已发布最高级别海啸预警，要求沿岸百万居民立即撤离。\n总统府宣布全国进入灾难状态，所有军港舰艇紧急出航执行救援。国际红十字会发现与南部所有灾区失去联系，震中区域仿佛"被从地图上抹去"。美国地质调查局专家表示，此次地震释放的能量相当于10万颗广岛原子弹。"

