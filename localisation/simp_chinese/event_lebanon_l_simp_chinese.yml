 leb.12.t:0 "巴解组织的抵抗"
 leb.12.d:0 "巴勒斯坦解放组织在黎巴嫩南部重新集结了武装力量。"
 leb.12.a:0 "确定。"
 
 leb.13.t:0 "巴解组织的发动袭击"
 leb.13.d:0 "巴勒斯坦解放组织在黎巴嫩南部重新集结了武装力量，并对驻扎在此地的以色列军队发起袭击。"
 leb.13.a:0 "确定。"
 
 
 
 
 leb.20.t:0 "卡米勒·尼米尔·夏蒙当选黎巴嫩总统"
 leb.20.d:0 "亲西方的卡米勒·尼米尔·夏蒙当选黎巴嫩总统。"
 
 leb.21.t:0 "阿拉伯民族主义影响黎巴嫩"
 leb.21.d:0 "大马士革的街头，热情地群众挤满了总统府，他们挥舞着黎巴嫩和埃及的国旗，手捧着埃及总统贾马尔·阿卜杜勒·纳赛尔的肖像，以庆祝另一个阿拉伯国家在苏伊士运河战争取得的胜利，而当广播电台传来纳赛尔呼吁阿拉伯国家团结起来，共同反对帝国主义的演讲时，人群中爆发出激烈的欢呼声。\n\n要阿拉伯不要帝国主义！年轻的学生们高喊着。\n\n黎巴嫩总统卡米勒·尼米尔·夏蒙本人是一名基督徒，他坚决地反对阿拉伯民族主义和阿拉伯联合共和国，他与埃及的关系持续恶化中。"
 
 leb.22.t:0 "日渐恶化的黎巴嫩局势"
 leb.22.d:0 "黎巴嫩爆发大规模游行示威，亲近埃及的阿拉伯民族主义者要求亲西方的卡米勒·尼米尔·夏蒙总统下台，并建立一个亲埃及的政府，更激进的示威者呼吁尽快加入阿拉伯联合共和国！"
 
 leb.23.t:0 "黎巴嫩爆发大规模示威游行"
 leb.23.d:0 "黎巴嫩爆发大规模游行示威，亲近埃及的阿拉伯民族主义者要求亲西方的卡米勒·尼米尔·夏蒙总统下台，并建立一个亲埃及的政府，更激进的示威者呼吁尽快加入阿拉伯联合共和国！"
 
 leb.24.t:0 "警惕黎巴嫩的赤化危险"
 leb.24.d:0 "黎巴嫩遭到了共产势力的渗透，黎巴嫩军人正尝试与共产党勾结，帮助莫斯科在中东扩大他们的势力，这是我们绝对不能容忍的！我们也要开始支持黎巴嫩国内的反共势力，协助他们对抗共产主义，并在必要时候协助他们夺取黎巴嫩政权，建立一个亲西方的反共政府。"
 leb24tool:0 "选择干涉黎巴嫩危机后，必须尽快将军事单位移动到黎巴嫩境内，否则夏蒙政府将被颠覆！"
 
 leb.25.t:0 "黎巴嫩发生政变！"
 leb.25.d:0 "黎巴嫩爆发政变！以拉希德·卡拉米总理为首的亲埃及势力宣布弹劾夏蒙总统，并成立了亲近埃及的新政府！"
 
 leb.26.t:0 "美国正式宣布介入黎巴嫩局势！"
 leb.26.d:0 "美国正式宣布，应黎巴嫩总统夏蒙的要求，进行军事干预以保护受共产主义威胁的政权。该行动的目标是支持亲西方的黎巴嫩总统卡米尔·夏蒙政府，抵抗内部反对派和来自叙利亚及埃及的威胁。\n美国海军陆战队已在法国南部和塞浦路斯的港口集结待命，准备进入黎巴嫩，这将是美国首次武装干涉中东局势。"
 
 leb.27.t:0 "美国军方进入黎巴嫩"
 leb.27.d:0 "今日凌晨，美国海军陆战队第六舰队在黎巴嫩海岸实施两栖登陆，迅速控制贝鲁特港口及国际机场。此次行动旨在支持亲西方的夏蒙总统政权，应对持续多个月的全国性起义。\n陆战队在朱尼耶湾建立滩头阵地，M48坦克纵队沿滨海公路驶入市区。总统府周围架设起环形防线，美军发言人宣称已占领所有关键基础设施。目击者看到直升机在议会大厦上空盘旋，街头出现英阿双语军事管制通告。\n莫斯科方面谴责这是"殖民主义武装干涉"，阿拉伯联盟要求联合国安理会召开紧急会议。而白宫声明强调行动基于《联合国宪章》第51条，旨在"保护黎巴嫩主权免受外部颠覆"。"
 
 leb.28.t:0 "强烈谴责美国介入黎巴嫩事务！"
 leb.28.d:0 "外交部发表声明，强烈谴责美国派遣军队进入黎巴嫩干涉黎巴嫩内政！并指责美帝国主义粗暴干涉中东政局！"
 
 leb.29.t:0 "黎巴嫩局势趋于稳定"
 leb.29.d:0 "再美国干涉军介入下，黎巴嫩的局势逐渐稳定，反政府活动日渐式微。\n美国第一次武装介入中东事务取得了成功，大大震慑了中东地区的共产主义势力。"
 
 leb.30.t:0 "夏蒙总统任期结束"
 leb.30.d:0 "卡米勒·尼米尔·夏蒙宣布辞去黎巴嫩总统的职务，副总统福阿德·謝哈卜接任总统，并继续夏蒙的亲西方外交路线。"
 
 leb.31.t:0 "美国在中东的持续失败"
 leb.31.d:0 "黎巴嫩的丢失，标志则又一个中东国家落入共产党和阿拉伯民族主义者手中。美国和西方阵营在中东这场耻辱性的大败已经成为这两天美国政界最大的话题，反共势力在参众两院猛烈抨击总统未能及时干涉局势。一向直性子的参议员约翰·肯尼迪直言道，美国这样在中东连续失地，只怕是连面子都不要了。"
 
 leb.32.t:0 "美国撤离黎巴嫩"
 leb.32.d:0 "随着黎巴嫩局势进入稳定状态，美国军方宣布从黎巴嫩撤离。"
 
 leb.32.t:0 "黎巴嫩反对派发起全面暴动！"
 
 leb.32.t:0 "反对派与黎巴嫩军方交火！"
 
 leb.32.t:0 "黎巴嫩反对派夺取政权！"
 
 leb.32.t:0 "美国干涉军与黎巴嫩反对派交火"