 west_africa.1.t:0 "法国在[ROOT.GetName]支持代理人"
 west_africa.1.d:0 "在法国的支持下，[ROOT.GetLeader]成功当选了[ROOT.GetName]的殖民地总理，并在未来领导这个国家。"
 west_africa.1.a:0 "Good."
 
 west_africa.7.t:0 "法国非洲殖民地的行政改革"
 west_africa.7.d:0 "在法国推动法属非洲殖民地通过法兰西共同体走向自治后，法属西非和法属赤道非洲也进行了内部行政改革。在非洲民主联盟领袖费利克斯·博瓦尼推动下，两个殖民地颁布了新的行政结构框架，除了赋予非洲殖民地自治权外，还打破了不同领土之间的束缚，通过地方议会赋予它们更多的自治权。"
 
 west_africa.10.t:0 "法属西非联邦的内部矛盾"
 west_africa.10.d:0 "在法属西非进行行政改革后，象牙海岸、塞内加尔、几内亚和法属苏丹分别进行自治，然而，针对这种自治，西非各地的政治家们有不同的见解。\n来自象牙海岸的费利克斯·博瓦尼支持将法属西非肢解为各个不同部分，并反对继续以联邦形式强行维持各地之间的经济联系。博瓦尼不希望相对发达的象牙海岸对西非其他地区进行财政补贴，更不希望比象牙海岸更发达的塞内加尔控制整个法属西非的经济。\n而塞内加尔的利奥波德·塞达尔·桑戈尔、几内亚的艾哈迈德·塞古·杜尔和马里的莫迪博·凯塔则支持以某种形式维持法属西非各地区之间的联系，以推动各地之间的合作，谋求建立一个统一的大联邦。"
 
 west_africa.12.t:0 "马里联邦的瓦解"
 
 west_africa.12.t:0 "[FRA.GetLeader]与巴泰勒米·波冈达的会面"
 
 west_africa.12.t:0 "法国表态支持中非合众国提案"
 