l_simp_chinese:
 som.10.t:0 "索马里发生军事政变！"
 som.10.d:0 "在前任总统被刺杀后，索马里陷入了政治动荡，索马里军队总参谋长穆罕默德·西亚德·巴雷趁机发动政变夺取了政权，宣布成立社会主义民主政府。"
 som.10.a:0 "东非局势愈发紧张。"
 
 som.13.t:0 "索马里吞并欧加登！"
 som.13.d:0 "在索马里军队的强大攻势下，埃塞俄比亚军队溃败，不得不请求停火，至此，欧加登战争以索马里的胜利告终。索马里完成了大索马里梦想的重要一步，领土增加了将近三分之一，而埃塞俄比亚失去了近一半的领土。"
 som.13.a:0 "东非局势愈发紧张。"
 
 som.14.t:0 "索马里占领欧加登！"
 som.14.d:0 "经过激烈的交战，索马里军队已占领欧加登大部分地区！"
 som.14.a:0 "东非局势愈发紧张。"
 
 som.15.t:0 "索马里撤离欧加登！"
 som.15.d:0 "尽管索马里军队不断发动进攻，但仍然未能占领欧加登地区，索马里军队已无法承受巨大的损失，被迫撤军。"
 som.15.a:0 "东非局势愈发紧张。"
 
 som.20.t:0 "索马里的独立问题"
 som.20.d:0 "第二次世界大战结束后，意属索马里被英国所占领，然而，以索马里青年党为代表的索马里独立运动团体却不接受一个新殖民者的统治。青年党发起了新的反殖民运动，呼吁尽快实现索马里的独立，并希望联合国和国际社会支持索马里的民族自决。"
 
 som.21.t:0 "英国决定立刻进行索马里独立公投"
 
 som.22.t:0 "索马里公投独立仓促通过"
 
 som.23.t:0 "索马里正式独立"
 
 som.24.t:0 "索马里问题移交联合国大会"
 som.24.d:0 "索马里的独立问题引起国际关注，英国政府决定将其交由联合国大会讨论。"
 
 som.25.t:0 "索马里托管的可能"
 som.25.d:0 "在联合国大会索马里问题的讨论中，一些国家提出了关于索马里的担忧：/n索马里历史上从未建立过统一的民族国家，他们仅在意大利殖民统治下度过了半个世纪，意大利在那里建立的少数行政机构和社会机构，也已经被摧毁。很显然，现在的索马里无法建立一个正常的国家，如果仓促宣布索马里独立，该国将会陷入动荡当中，尤其西方国家担心其会遭到共产主义的渗透。/n基于这一点，联合国大会认为应该推迟索马里独立进程，直到其建立一个稳定的政府。联合国秘书长提出，也许可以将索马里托管给一个对其有足够了解的国家，在联合国监督和支持下，帮助索马里建立现代化的行政机构，那么，这个任务自然非索马里的前宗主国——意大利莫属。"
 
 som.26.t:0 "索马里托管议案得到通过"
 som.26.d:0 "联合国大会正式投票表决了由意大利托管索马里的提案，授权意大利全权管理索马里东部地区，并在1960年以前帮助索马里建立一个成型的现代化政府。"
 
 som.27.t:0 "索马里托管议案未能通过"
 
 som.28.t:0 "意大利接受索马里托管议案"
 som.28.d:0 "意大利政府宣布接受联合国授权托管索马里的决议，并宣布，意大利积极参与索马里事务，将有利于该国在第二次世界大战后重建声望，回归国际社会。第一批意大利派出的行政管理和工程技术人员已在联合国监督下抵达摩加迪沙。"
 
 som.29.t:0 "意大利拒绝索马里托管议案"
 
 som.30.t:0 "索马里青年党严厉批评意大利占领当局"
 som.30.d:0 "索马里青年党发表声明，严厉地批评了意大利当局对索马里多年的治理是失败且可耻的，意大利不仅没有帮助索马里建立一个完整有效的政府，且将曾经法西斯意大利的官员流放至索马里后，任由他们对索马里进行残酷统治。青年党正式照会联合国，要求立刻结束意大利对索马里的统治。"
 
 som.31.t:0 "意大利治理得到索马里青年党认可"
 som.31.d:0 "索马里青年党发表声明，赞扬意大利当局对索马里多年的治理是进步且高效的。青年党决定选择与意大利政府进行谈判与合作，争取双方尽快建立索马里民选政府。"
 
 som.32.t:0 "索马里托管地首次议会选举"
 som.32.d:0 "索马里托管地将在意大利当局监督下，举行首次议会选举"
 
 som.33.t:0 "索马里青年党赢得选举"
 som.33.d:0 "索马里青年党赢得了索马里的首次议会选举，意大利及联合国对此表示欢迎。青年党将组织索马里第一届政府，并与意大利举行有关索马里独立的最后谈判。"
 
 som.34.t:0 "索马里正式独立！"
 som.34.d:0 "来自摩加迪沙的消息，在联合国正式决议下，为期十年的意大利和英国托管正式结束，索马里共和国正式独立！索马里的新国旗在各国代表注视下冉冉升起，这面蓝色带有白色五角星的旗帜，象征着联合国对索马里民族自决的支持。/n索马里青年党领袖阿赫迈德·奥斯曼·达尔宣布就任索马里第一任总统。意大利官员出席了就任仪式，意大利对索马里的治理，帮助该国建立了一个完善的政府，因此得到索马里和联合国代表的赞扬。"
 
 som.35.t:0 "英属索马里要求与索马里合并！"
 
 som.36.t:0 "英属索马里与索马里合并！"