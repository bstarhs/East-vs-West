l_simp_chinese:
 gua.1.t:0 "新任领导人"
 gua.1.d:0 "在前任总统胡安·何塞·阿雷瓦洛结束任期之后，国防部长哈科沃·阿本斯·古斯曼被推举为危地马拉的第19任总统，人民期待他会领导危地马拉革命政府继续为国家的民主发展而奋斗。"
 gua.1.a:0 "上帝保佑新总统！"

 gua.2.t:0 "900号法案"
 gua.2.d:0 "总统哈科沃·阿本斯·古斯曼向国会提交了一份新法案，征收闲置土地并出售给农民，没收外国资本以及进行基础设施建设。哈科沃主张利用这项法案改造国家，受到大部分人支持，但军方和庄园主对该法案表示质疑。"
 gua.2.a:0 "这可以让我们的国家变得更加繁荣。"
 gua.2.b:0 "没有打破传统经济方式的必要。"

 gua.3.t:0 "危地马拉颁布900号法案"
 gua.3.d:0 "危地马拉政府颁布了一份新法案，征收闲置土地并出售给农民，没收外国资本以及进行基础设施建设。总统哈科沃·阿本斯主张利用这项法案改造国家，受到大部分人支持，但军方和庄园主对该法案表示质疑。"
 gua.3.a:0 "这可以让我们的国家变得更加繁荣。"
 
 gua.4.t:0 "警惕危地马拉的共产主义威胁！"
 gua.4.d:0 "总统阁下！\n危地马拉的阿本斯政府正在进行土地改革，他们把美国在危地马拉的土地和财产分发给农民……或者说，受到了共产主义影响的农民。我们必须清楚地认识到，危地马拉正在进行的土地改革是一种向共产主义让步的行为，如果危地马拉的土地改革获得成功，那么其他拉丁美洲国家的民众就会希望他们的国家也实行这种改革，这会导致我们的利益受损，以及共产主义在拉丁美洲的扩张。"
 
 gua.6.t:0 "军方发动政变！"
 gua.6.d:0 "右翼军方发动政变！"
 
 gua.7.t:0 "危地马拉爆发政变！"
 gua.7.d:0 "危地马拉的消息！危地马拉军方今天突然封锁了首都，并控制了总统府、广播电台和政府部门！军方首脑卡洛斯·卡斯蒂略·阿马斯将军在广播中宣布，总统哈科沃·阿本斯施行的改革，破坏了国家稳定和国家利益，为拉丁美洲带来共产主义威胁，现军方为了国家和民族的未来，推翻阿本斯政府，同时中止宪法和国会的运作。危地马拉将成立临时军政府。\n哈科沃·阿本斯总统被迫宣布停止抵抗，并流亡海外。"
 
 gua.8.t:0 "阿本斯抵达墨西哥城"
 gua.8.d:0 "被推翻的危地马拉总统哈科沃·阿本斯已抵达墨西哥，开始了他的流放生涯。尽管阿本斯拒绝面见记者，但他的下榻处还是挤满了各路记者和左翼人士。拉丁美洲左翼势力斥责危地马拉军方勾结美国，推翻民选总统出卖国家。"
 
 gua.10.t:0 "香蕉上的血迹"
 gua.10.d:0 "杰克·威尔逊推开《纽约纪事报》的大门，手指仍因愤怒而微微颤抖。连续一个多月，在危地马拉、尼加拉瓜和洪都拉斯的调查让他看清了真相——联合果品公司的香蕉种植园里，工人们在武装保安的监视下劳作，皮肤被农药灼伤，日薪不足一美元。\n度假愉快吗？同事萨拉嚼着香蕉问。\n那不是度假。杰克从包里抽出一张照片：一个瘦弱的男孩站在农药池里采摘香蕉，腿上布满溃烂的伤口。萨拉皱眉推开照片：我正在吃早餐。\n我们吃的每根香蕉都沾着血。杰克压低声音。上周他们镇压罢工，杀了十二个人，包括三个孩子。而我们的政府支持这些刽子手，就因为他们打着反共的旗号。\n办公室安静下来。萨拉盯着手中印有United Fruit标签的香蕉。\n你要报道这个？总编不会同意的，公司和他们有广告合作。\n那就让他们开除我。杰克抓起那半根香蕉：总得有人说出真相。\n窗外，纽约的阳光依旧灿烂，行人匆匆走过，无人关心千里之外的苦难。"
 gua.10.a:0 "但今天，有一个记者决定不再沉默。"

