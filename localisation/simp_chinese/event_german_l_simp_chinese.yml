l_simp_chinese:
 ger.1.t:0 "德国西部占领区发行新马克"
 ger.1.d:0 "法兰克福金融大厦，三色国旗在破损的穹顶下并排悬挂。美英法代表同时掀开绒布，新马克的金属光泽照亮了记者们的镁光灯。\n\n女士们先生们！这是我们所发行的新德国马克，他们将逐步取代占领军的军票，成为美、英、法占领区的通用货币。此外，我们将在不久之后结束三个占领区之间的民用物资运输管制，以协助德国西部的战后经济复兴。\n\n发布会结束后，记者们穿过法兰克福的建筑工地，抵达苏联领事馆。\n\n是的，记者朋友们，美国方面的这些措施，完全没有和我们事先通知，莫斯科对此完全不知情！我们不明白我们在华盛顿的朋友为什么如此着急地在德国西部进行所谓的经济重建，德国纳粹残党还没被消灭，谁知道这些，所谓的新马克会通向哪里？"

 ger.2.t:0 "美国正在德国西部建立政府"
 ger.2.d:0 "致莫斯科：\n紧急情报证实，美英法三国正秘密筹划将西部占领区合并为傀儡政权。我方情报人员获取的会议纪要显示：\n美方已拟定《占领法规》草案，计划在1949年前完成西德政府架构建设\n法兰克福经济委员会正秘密转型为立法机构\n最严重的是，美方有意启用前纳粹官员担任要职。我们的情报证实了美军正秘密与帝国经济部高级顾问、国防军前将领接触。\n美方此举不仅违反《波茨坦协定》，更将导致法西斯势力死灰复燃，建议立即采取行动。请速指示。"
 ger.2.a:0 "不要让美国人扩大他们在德国的势力范围！"
 ger.2.b:0 "随他去吧"

 ger.3.t:0 "苏联致美国政府外交电报"
 ger.3.d:0 "致美国政府官员：\n苏联政府已获悉美方及其盟友在德国西部占领区单方面推行货币改革及政治重建计划，此举严重违反《波茨坦协定》所确立的四国共管原则。我方严正声明，任何未经四国协商的对德政策变更均属非法，并将导致德国事实上的分裂。\n美方行为已超越经济改革范畴，显露出在德国西部建立傀儡政权的政治意图。苏联政府视此为对欧洲战后秩序的公然破坏，并警告美方必须立即停止此类单边行动。若美方继续一意孤行，苏联将保留采取一切必要措施维护自身安全利益及德国人民整体利益的权利。\n望美方慎重考虑此举可能引发的严重后果，并尽快通过盟国管制委员会重启四国协商。\n苏联驻华盛顿领事"
 ger.3.a:0 "俄国人无权主宰德国。"
 ger.3.b:0 "我们不得不妥协

 ger.4.t:0 "美国人拒绝了我们！"
 ger.4.d:0 "美国政府对我方抗议置若罔闻，继续推进西德傀儡政权建设。美方代表在盟国管制委员会会议上公然宣称：苏联无权干涉西方占领区事务，其分裂德国的意图已昭然若揭，我方严正警告遭美方嗤之以鼻。\n美帝国主义正利用德国问题试探我方底线，必须予以坚决回击。"
 ger.4.a:0 "封锁柏林！立刻！"
 ger.4.b:0 "随他去吧"

 ger.5.t:0 "苏联开始封锁柏林"
 ger.5.d:0 "苏联驻德军政府今日突然宣布全面切断西柏林与西德间所有陆路交通，以抗议美英法三国单方面推进西德政府建设。苏军已在所有进出西柏林的要道设置武装关卡，并禁止任何人员及物资进入。\n记者现场目睹，苏军坦克部队已进驻柏林郊区战略要地，荷枪实弹的士兵正在检查站严查过往车辆。一队试图运送面粉的卡车被拦在波茨坦检查站外，司机出示美军签发的通行证后仍遭驱逐。西柏林居民恐慌性抢购物资。\n莫斯科广播宣称此举是为"防止法西斯残余势力渗透"，而华盛顿方面谴责苏联"将200万西柏林居民作为人质"。联合国安理会预计将于明日召开紧急会议讨论此事。"
 ger.5.a:0 "我们需要支持西方自由世界"
 ger.5.b:0 "美国政府恐怕无法对抗苏联"

 ger.6.t:0 "英美对西柏林发起空运"
 ger.6.d:0 "今日上午，美军C-47运输机编队首次突破苏联封锁，满载面粉、药品等生活物资降落在西柏林滕珀尔霍夫机场。数十架运输机以每三分钟一架的频率持续空投补给，发动机轰鸣声响彻全城。\n记者现场看到，西柏林民众纷纷涌上街头仰望天空。在柏林残破的公路上，民众欢呼雀跃。\n苏联米格战斗机虽多次逼近美军机群进行威慑飞行，但未发生交火。据目击者称，一架苏军雅克-3战斗机在百米距离内与美军运输机平行飞行达十分钟，最终转向离去。美方宣布将把空运行动代号定为"粮食行动"，承诺"只要柏林人需要，飞机就不会停止飞行"。"
 ger.6.a:0 "我们不得不停止封锁。"
 ger.6.b:0 "对美国发出最后通牒"

 ger.7.t:0 "苏联抗议我们的空投"
 ger.7.d:0 "莫斯科向我们发来最后通牒，警告如果不结束空投物资，他们将对西柏林采取军事行动。"
 ger.7.a:0 "我们必须让步。"
 ger.7.b:0 "绝不！"

 ger.8.t:0 "美国人拒绝了我们的抗议"
 ger.8.a:0 "Step back and avoid war."
 ger.8.b:0 "Let's show them how good the Soviets power!"

 ger.9.t:0 "美国结束空投"
 ger.9.d:0 "在莫斯科的武力威慑下，美国被迫停止了对西柏林的一系列空投行动，作为回应，苏联结束了对西柏林的封锁，但也夺走了西柏林物资供应的主导权。美国的让步使得西方国家在德国的声望大幅度受损，美国在德国西部主导成立一个新政府的计划似乎已不可能实现。"
 ger.9.a:0 "局势似乎有所缓解。"

 ger.10.t:0 "美军运输机已进入西柏林"
 ger.10.a:0 "一支美军C-47运输机中队已进入西柏林空域，上面装有大量的食品、燃油和其他物资。"
 ger.10.a:0 "我们不得不停止封锁。"
 ger.10.b:0 "对美国发出最后通牒"

 ger.11.t:0 "激战安理会"
 ger.11.d:0 "今日安理会特别会议上，美苏代表就柏林封锁问题爆发激烈争吵，会议一度中断。\n美方代表拍桌指控苏联"将200万西柏林平民当作政治人质"，并展示西柏林儿童营养不良的医疗报告。苏方代表当即反击，揭露西德政府机构中至少37名前纳粹官员的任职档案，称美方"在德国复活法西斯幽灵"。\n秘书长多次敲击木槌维持秩序，但双方代表在走廊仍继续对峙。"

 ger.12.t:0 "对柏林的封锁已失去意义"
 ger.12.a:0 "致莫斯科：\n柏林封锁行动已持续11个月，战略效果正急剧衰退。现呈报最新评估：\n美英空运体系完全成熟，日均运量超8000吨，远超西柏林最低需求。我军拦截行动在国际舆论中持续失分。\n联合国特别会议即将通过谴责决议，东欧盟友出现动摇迹象。\n东德因贸易中断损失严重，本月工业产出下降27%，民众不满情绪蔓延。\n建议采取阶梯式撤出方案，继续封锁只会加剧我方被动，请速决断。"
 ger.12.b:0 "Let's show them how good the Soviets power!"

 ger.13.t:0 "苏联进攻西柏林！"
 ger.13.a:0 "The war never ended."

 ger.14.t:0 "苏联结束封锁"
 ger.14.d:0 "随着美国不断地对西柏林空投物资，苏联对柏林的封锁以宣告失败，苏联政府已无法再支付封锁带来的外交和政治成本，被迫宣布放弃封锁。这次对抗以西方国家的政治胜利告终。"
 ger.14.a:0 "局势似乎有所缓解。"
 
 

 ger.15.t:0 "德意志联邦共和国成立"
 ger.15.d:0 "在经过柏林危机后，德国西部占领区合并组成一个新政权并对抗苏联威胁的呼声越来越大。在英美法三国支持，和德国政治家的努力下，德意志联邦共和国宣布成立，定都波恩。包括苏联在内的部分欧洲国家对联邦德国的成立持怀疑态度，担心其会促成纳粹主义的复辟，此外英法等国对联邦德国的警惕依然存在，德国距离重新成为一个正常国家还很遥远。"
 ger.15.a:0 "祝福新的德意志！"

 ger.16.t:0 "西德宣布与民主德国统一"

 ger.18.t:0 "德国国防军正式成立"

 ger.19.t:0 "首任总理选举"

 ger.20.t:0 "1952年联邦德国选举"
 ger.20.a:0 "The future of peace."

 ger.21.t:0 "1961年联邦德国选举"
 ger.21.a:0 "The future of peace."

 ger.22.t:0 "1965年联邦德国选举"
 ger.22.a:0 "The future of peace."

 ger.23.t:0 "1969年联邦德国选举"
 ger.23.a:0 "The future of peace."

 ger.24.t:0 "1972年联邦德国选举"
 ger.24.a:0 "The future of peace."

 ger.25.t:0 "1976年联邦德国选举"
 ger.25.a:0 "The future of peace."

 ger.26.t:0 "基督教民主联盟的崛起"
 ger.26.d:0 "基督教民主联盟与自由民主党今日宣布达成历史性联盟协议，将共同参加首届联邦议院选举。两党在波恩市政厅签署的联合声明中承诺推进市场经济与社会福利的平衡政策。\n73岁的基民盟主席康拉德·阿登纳获推举为总理候选人。这位科隆前市长凭借重建莱茵兰的政绩赢得广泛支持，最新民调显示其支持率达58%。《南德意志报》评论称：他的白发和坚定神态，恰是战败德国最需要的父亲形象。\n自民党在谈判中争取到司法部长等关键职位。两党合计支持率预计可获议会多数席位。观察家指出，阿登纳若当选，将面临平衡西方盟国与本土诉求的双重挑战。"

 ger.27.t:0 "康拉德·阿登纳赢得联邦德国选举"
 ger.27.a:0 "康拉德·阿登纳赢得联邦德国选举，当选联邦德国总理。"

 ger.28.t:0 "路德维希·艾哈德赢得联邦德国选举"
 ger.28.a:0 "路德维希·艾哈德赢得联邦德国选举，当选联邦德国总理。"

 ger.29.t:0 "维利·勃兰特赢得联邦德国选举"
 ger.29.a:0 "维利·勃兰特赢得联邦德国选举，当选联邦德国总理。"

 ger.30.t:0 "慕尼黑奥运会开幕"
 ger.30.a:0 "1972年国际奥林匹克运动会在德国慕尼黑开幕。"
 
 ger.31.t:0 "巴勒斯坦武装分子闯入奥运村！"
 ger.31.a:0 "The future of peace."
 
 ger.32.t:0 "以色列运动员遇难！"
 ger.32.a:0 "联邦德国警察营救以色列运动员的行动失败！11名运动员被巴勒斯坦武装组织杀害！"
 
 ger.33.t:0 "以色列运动员获救！"
 ger.33.a:0 "联邦德国警察营救以色列运动员的行动取得成功！11名被劫持的运动员被解救，数名巴勒斯坦武装分子被击毙，其余的被迫投降。"
 
 ger.34.t:0 "德国总理向华沙大起义纪念碑下跪！"
 ger.34.a:0 "德国总理[WDR.GetName]在访问波兰华沙的华沙大起义纪念碑前下跪！"
 
 ger.35.t:0 "学生抗议运动爆发流血冲突！"
 ger.35.a:0 "德国波恩爆发的学生运动演变为流血事件。德国学生发起示威游行，抵制伊朗国王礼萨·巴列维访德，并与警察爆发激烈冲突，一名学生在冲突中死亡。"
 
 ger.36.t:0 "针对君特·纪尧姆的调查"
 ger.36.a:0 "The future of peace."
 
 ger.37.t:0 "维利·勃兰特辞职"
 ger.37.a:0 "The future of peace."
 
 ger.38.t:0 "红军旅的崛起"
 ger.38.a:0 "The future of peace."
 
 wgr.40.t:0 "推倒这堵墙"
 wgr.40.d:0 "为了祝贺柏林建立26周年，美国总统罗纳德·里根在西柏林发表了演说。\n我们乐见改变和开放；因为我们相信自由与安全并行，人类自由的进步令我们更努力追求世界和平。苏联可以做一件很明显的事，一件大幅促进自由与和平的事。戈尔巴乔夫总书记，如果你要寻求和平，如果你要为苏联和东欧寻求繁荣，如果你要寻求自由：就到这扇门来吧！戈尔巴乔夫先生，打开这扇门！戈尔巴乔夫先生，推倒这堵墙！"
 wgr.40.a:0 "Let's show them how good the "
 
 wgr.42.t:0 "德国君主制复辟！"
 wgr.42.d:0 "德国的政局混乱和右翼势力崛起最终导致了令人惊讶，而又意料之中的结果。经过德国议会公投，德国决定终结混乱的共和制，宣布君主制度复辟！[WDR.GetLeader]被国民议会邀请，宣布加冕德意志帝国皇帝！"
 
 ger.45.t:0 "德国政府推出经济复兴计划"
 ger.45.d:0 "联邦德国政府宣布，该国已经制定经济复兴计划，以从战争的创伤中复兴。"
 
 ger.46.t:0 "[FROM.GetName]提出欧洲煤钢共同体提案"
 ger.46.d:0 "[FROM.GetName]正式宣布，该国已决定同欧洲多个国家缔结共同市场条约，缔约国将逐步降低并取消互相进出口煤矿、铁矿和钢材的关税。"
 
 ger.50.t:0 "波恩条约的签署"
 ger.50.d:0 "联邦德国政府与法国、美国和英国正式签署《波恩条约》宣布结束战后对西德的军事占领，联邦德国回复主权。"
 
 ger.51.t:0 "反对再武装化的示威游行"
 ger.51.d:0 "西德多地发生游行示威，反对该国加入北大西洋公约组织，群众认为这会使得德国再次陷入战争威胁当中。"
 
 ger.52.t:0 "[FROM.GetName]发生反对加入北约的示威游行"
 ger.52.d:0 "[FROM.GetName]多地发生游行示威，反对该国加入北大西洋公约组织，群众认为这会使得[FROM.GetName]再次陷入战争威胁当中。"
 
 ger.53.t:0 "联邦德国提出强硬的外交政策"
 ger.53.d:0 "联邦德国外交部长哈尔斯坦表示，波恩方面强烈谴责苏联支持下的东部共产主义政权的建立，并指责共产政权是非法的、分裂国家的伪政权。波恩政府将采取强硬的外交政策，对抗共产政府及其支持者，波恩将断绝所有承认德国东部政权的国家的外交关系。"
 
 ger.54.t:0 "第一节西柏林国际电影节开幕"
 ger.54.d:0 "在西德和美国政府支持下，第一届西柏林国际电影节在西柏林的泰坦尼亚宫开幕，西德政府表示，该电影节旨在将西柏林打造成为自由世界的橱窗，通过电影向德国东部受到共产主义控制的人民展示自由世界富裕繁荣的生活。"
 
 ger.55.t:0 "联邦德国提出加入北大西洋公约"
 ger.55.d:0 "联邦德国总理[WDR.GetLeader]提出，随着欧洲局势愈发紧张，联邦德国急需来自西方自由世界盟友的支持和保护，因此波恩政府希望加入北大西洋公约组织的军事架构，与欧洲自由国家进行更进一步的军事合作。"
 
 ger.56.t:0 "[ROOT.GetName]反对西德加入北约"
 ger.56.d:0 "[ROOT.GetName]政府发表声明，反对西德加入北约，认为这将给予西德尚未被完全消除的新纳粹分子渗透和复兴的危险。"
 
 ger.57.t:0 "[ROOT.GetName]赞成西德加入北约"
 ger.57.d:0 "[ROOT.GetName]政府发表声明，赞成西德加入北约，并提出欧洲自由国家应该结束仇恨，团结起来共同对抗来自东方的武装威胁。"
 
 ger.58.t:0 "联邦德国加入北约的请求被拒绝"
 ger.58.d:0 "联邦德国加入北大西洋公约组织的请求，由于大部分北约国家反对，因而没能成功。"
 
 ger.59.t:0 "联邦德国加入北大西洋公约"
 ger.59.d:0 "联邦德国正式宣布加入北大西洋公约组织，西德将进一步加强与美国和其他华约国家的军事合作。"
 
 ger.60.t:0 "德国再武装化政策公布"
 ger.60.d:0 "美国国务院发布了一则令人震惊的消息：由于欧洲局势不断恶化，来自苏联的军事威胁不断扩大，美国已正式决定：逐步取消对德国军事的种种制裁和限制，而且将在不久之后，支持和协助德国建立一支军事武装力量，以对抗共产主义入侵。"
 
 ger.61.t:0 "[ROOT.GetName]谴责德国的再武装化！"
 ger.61.d:0 "[ROOT.GetName]政府发表声明，强烈谴责和反对德国重新组织军队，这毫无疑问是对第二次世界大战受害者的背叛，因为在西德纳粹分子尚未被完全消灭的前提下，允许西德重新建立军队将导致纳粹的复兴和灾难性的后果。该国表示他们将向美国提出严厉的抗议！"
 
 ger.62.t:0 "对德国武装化的热议"
 ger.62.d:0 "德国社会掀起了对德国再武装问题的热议。《每日镜报》编辑埃里克·雷格尔曾说过：德国只要有了士兵，就会有战争。他认为，军事支持可能会导致国家政治向右转。社会民主党则认为，即使军队扩充受到积极反响，也不足以复活德国军国主义。"
 
 ger.63.t:0 "古德里安将军锐评再武装化"
 ger.63.d:0 "被誉为“闪电战之父”的德国前装甲兵总监海因茨·古德里安将军近日发表题为《欧洲能够被保卫吗？》的署名文章，引发欧美军事与外交界高度关注。这位二战名将在文中展现出对地缘政治的深刻洞察，其观点犀利而富有争议。\n古德里安首先抨击了战后初期美国彻底削弱德国军事力量的政策，认为这严重破坏了欧洲大陆的战略平衡。然而，他对当前美国为应对“苏联威胁”而积极推动的西德重新武装计划，同样提出了尖锐质疑。他指出，华盛顿在短短数年间从“反德亲俄”的同盟国立场，急剧转向“亲德反共”的冷战前沿，其政策展现出“令人不安的不确定性与反复无常”。\n将军警告道，基于这种历史表现，美国对德国军事建设的支持“不可能永远坚定”，很可能因国际局势变化而再度转向。此文不仅反映了部分德国军事精英对美国战略可靠性的深层疑虑，也揭示了冷战初期欧洲安全架构构建中的复杂矛盾与信任困境。"
 ger.63.a:0 "古帅中肯。"
 
 ger.64.t:0 "来自旧国防军的建议"
 
 ger.65.t:0 "德国开始释放二战军人"
 
 ger.66.t:0 "联邦德国希望我方支持德国的再武装化"
 ger.66.d:0 "联邦德国的外交官与我国外交部门正在磋商，希望我国支持该国重建武装部队以对抗共产主义。"
 
 ger.67.t:0 "[ROOT.GetName]宣布支持德国的再武装化"
 ger.67.d:0 "[ROOT.GetName]外交部发表声明，该国政府已经与联邦德国的外交官达成共识，该国将不再反对德国重建武装力量和军队。"
 
 ger.68.t:0 "[ROOT.GetName]坚决抵制德国武装化"
 ger.68.d:0 "[ROOT.GetName]外交部发表声明，该国政府和联邦德国的谈判不欢而散。作为第二次世界大战纳粹德国入侵和屠杀的受害者，[ROOT.GetName]坚决反对德国重建武装力量。"
 
 ger.69.t:0 "联邦国防军正式成立！"
 ger.69.d:0 "来自德国的消息，一支大约二十万人的武装部队，今天在波恩正式举行的成立仪式，联邦德国国防军诞生，联邦德国总理[WDR.GetLeader]向总司令Adolf Heusinger将军颁发了象征指挥权的权杖和军衔，这意味着德国的再武装化已成为既成事实。这毫无疑问将成为全欧洲的头条新闻，法国和苏联政府高度警惕这只新成立的武装部队，尤其是包括Adolf Heusinger在内的指挥官，几乎都是二战时的德国军人，而美国则表达了祝贺，并希望联邦德国成为保护自由欧洲的一支不可缺少的力量。"
 
 ger.70.t:0 "德国埃森发生枪击事件！"
 ger.70.d:0 "西德埃森市爆发严重流血冲突。在反对《德国条约》及西德重新武装化的大规模示威活动中，警方与示威者发生激烈对峙，局面迅速失控。据现场目击者称，冲突升级后，警方向人群开枪，导致年仅23岁的示威者菲利普·米勒当场中弹身亡，另有至少两名示威者遭受重伤。\n此次事件具有标志性意义——这是德意志联邦共和国自1949年成立以来，首次在政治性集会中因警方武力导致示威者死亡，因而迅速在全国范围内引发巨大震动与激烈争论。德国共产党及众多左翼团体强烈谴责警方“过度使用暴力”，要求立即成立独立委员会彻查此事，并严惩开枪责任人。然而，联邦德国内政部门及涉事警方坚决辩称，其行动是在遭受“暴力冲击”情况下的“合法自卫”，旨在维护公共秩序。\n菲利普·米勒之死，瞬间超越了单一事件本身，成为检验这个年轻共和国民主成色、法治原则及如何处理社会分歧的试金石。"
 
 ger.71.t:0 "反对支持德国再武装化的示威游行"
 ger.71.d:0 "我国多地爆发了大规模示威游行，在第二次世界大战中遭受惨痛折磨的人民对我国政府同意德国重建军队感到震惊和愤怒，人们聚集在外交部指责政府勾结新纳粹出卖国家。"
 
 ger.72.t:0 "东柏林事件引发连锁反应"
 ger.72.d:0 "在苏联军队血腥镇压东柏林抵抗运动的消息传播至西欧后，西欧各国舆论开始对苏联转向强硬，在批评共产主义政权屠杀群众的同时，共产主义对欧洲的威胁也开始引起广泛讨论，其中西德再武装化一事的舆论方向开始改变，许多西欧媒体开始倾向于支持西德拥有一支军队抵抗苏联入侵。"
 
 ger.73.t:0 "有关西德纳入北约一体化指挥体系"
 ger.73.d:0 "作为西德加入北约的让步和妥协，美国外交官提出了新的方案：将西德军队纳入北约一体化指挥框架内，如果发生战争，西德国防军将由美、英等组成的联合指挥部进行指挥，同时西德国防军的军事技术也将被限制。"
 
 ger.74.t:0 "[ROOT.GetName]接受西德加入北约的妥协方案"
 ger.74.d:0 "[ROOT.GetName]政府发表声明，接受了将西德纳入北约一体化指挥框架内的妥协方案，西德将有机会以军队由北约司令部直接指挥为条件加入北约。"
 
 ger.75.t:0 "[ROOT.GetName]拒绝西德加入北约的妥协方案"
 ger.75.d:0 "[ROOT.GetName]政府发表声明，拒绝一切接纳西德加入北约的方案，即使是任何形式的妥协也不接受。"
 
 
 
 ger.80.t:0 "西德呼吁解决萨尔领土问题"
 ger.80.d:0 "联邦德国总理[WDR.GetLeader]发表声明，波恩方面已决定与法国政府进行交涉，要求法国控制下的萨尔兰自由邦尽快重新并入联邦德国。该地区自二战结束后一直处于法国占领下，是除了东德以外的另一个尚没有并入联邦德国的前德国领土。"
 
 ger.81.t:0 "[ROOT.GetName]支持萨尔兰回归德国"
 ger.81.d:0 "[ROOT.GetName]政府发表声明，赞成萨尔兰重新并入联邦德国。"
 
 ger.82.t:0 "法国拒绝解决萨尔兰问题"
 ger.82.d:0 "巴黎发表声明，明确拒绝萨尔兰重新并入德国，法国政府认为，萨尔兰作为西欧工业最发达和煤铁资源最发达的地区之一，如果允许其并入德国，将会助力德国军国主义复兴。此外，萨尔兰的许多政治界不愿意回归德国，法国要求联邦德国政府尊重萨尔兰人民的自决权。"
 
 ger.83.t:0 "欧洲委员会提出进行萨尔兰公投"
 ger.83.d:0 "在最近的欧洲委员会会议上，荷兰外交官拟定了一份《萨尔基本法》，并提出由萨尔兰人民公投决定自己的未来。如果《萨尔基本法》得到大部分居民支持，那么联邦德国就应接受萨尔兰独立建国，但如果大部分人拒绝《萨尔基本法》，那就应该早日推动萨尔兰回归德国。"
 
 ger.84.t:0 "[ROOT.GetName]赞成萨尔兰公投"
 ger.84.d:0 "[ROOT.GetName]政府表示，接受欧洲委员会提出的《萨尔基本法》公投法案，并表示无论公投结果如何，都接受萨尔人民的选择。"
 
 ger.85.t:0 "联邦德国反对萨尔兰公投"
 ger.85.d:0 "联邦德国拒绝了欧洲委员会提出的《萨尔基本法》公投法案，并指责这是将萨尔兰分裂出德国的阴谋。"
 
 ger.87.t:0 "法国拒绝萨尔兰公投"
 ger.87.d:0 "法国拒绝了欧洲委员会提出的《萨尔基本法》公投法案，并指责这是德国吞并萨尔兰的阴谋。"
 
 ger.88.t:0 "美国赞成萨尔兰公投"
 ger.88.d:0 "美国政府表示，赞成通过公投的方式，让萨尔兰人民选择自己的前途。"
 
 ger.89.t:0 "萨尔兰公投开始"
 ger.89.d:0 "《萨尔基本法》公投已开始，萨尔兰人民将用选票决定这片土地的未来。"
 
 ger.90.t:0 "《萨尔基本法》公投获得通过！"
 ger.90.d:0 "来自萨尔布吕肯的消息！《萨尔基本法》在公投中获得了67.7%的支持率！！这意味着大多数萨尔人民选择脱离德国，成为独立国家！法国政府立刻宣布承认公投的合法性，并对萨尔兰政府进行祝贺。尽管心有不甘，但联邦德国政府还是被迫承认萨尔公投。这一消息震惊了德国各界，也大大损害了联邦德国政府的威信！"
 
 ger.91.t:0 "《萨尔基本法》未获得通过！"
 ger.91.d:0 "来自萨尔布吕肯的消息！67.7%的萨尔兰居民投票反对《萨尔基本法》！！这意味着大多数萨尔人民选择希望回归德国！波恩政府立刻宣布承认公投的合法性，并对萨尔兰人民进行祝贺。尽管心有不甘，但法国政府还是被迫承认萨尔公投。"
 
 ger.92.t:0 "萨尔兰回归德国！"
 ger.92.d:0 "今日，联邦德国、萨尔兰保护领和法国代表聚集在萨尔兰首府萨尔布吕肯，见证萨尔兰回归联邦德国，联邦德国总理[WDR.GetLeader]与萨尔兰政府首脑一同宣布萨尔兰与联邦德国统一，成立萨尔兰州，这是二战后德国从分裂走向统一的重要一步。此外，[WDR.GetLeader]总理也与法国代表进行了会谈，法国在萨尔兰州的各种经济影响力和投资将予以保留，作为德法经济、商贸合作和欧洲经济一体化的重要试点地区。"
 
 ger.93.t:0 "萨尔兰宣布独立！"
 ger.93.d:0 "今日，联邦德国、萨尔兰保护领和法国代表聚集在萨尔兰首府萨尔布吕肯，见证萨尔兰的正式独立。Johannes Hoffmann当选为独立的萨尔兰共和国的第一位总理，这意味着在德国东部成立共产主义政权后，德国的分裂进一步加剧。"
 
 ger.100.t:0 "弗雷德里希·保卢斯元帅去世"
 ger.100.d:0 "前纳粹德国陆军元帅弗雷德里希·威廉·保卢斯在其东德寓所中去世，终年66岁。保卢斯一生充满了矛盾与转折。他早期作为德军参谋军官表现出色，策划了诸多战役，但在军事生涯的顶点——1942年出任第六集团军司令并奉命攻占斯大林格勒——却遭遇了毁灭性失败。1943年1月，他在斯大林格勒战役末期被苏军包围后投降，成为德国历史上首位在战场上被俘的元帅。\n战后的保卢斯走上了一条令西方世界意外的道路。他并未像其他被俘将领那样选择沉默，而是加入了苏联支持的“自由德国委员会”，公开谴责希特勒的纳粹政权。在冷战初期，他更成为东德的政治符号，多次批评西德的重新武装政策，指责其有复活军国主义的危险。他从纳粹元帅到反纳粹宣传者的戏剧性转变，使其成为二战记忆与冷战对峙中一个独特而复杂的历史注脚，其人生轨迹深刻反映了个人在历史巨变中的抉择与时代政治的复杂性。"
 
 ger.101.t:0 "领面包的人"
 ger.101.d:0 "美国政府通过马歇尔计划送到德国的第一批粮食已抵达汉诺威港口，曾经为了对抗德国人而远航的自由轮，如今则为德国人运送物品。\n\n我真不明白，为什么我们要给纳粹送吃的？我兄弟他死在U艇手里，现在还躺在挪威海海底呢！\n\n水手骂骂咧咧地把小麦粉装车，最后运往汉堡的一处美军营地，制作成面包发给平民。饥肠辘辘的德国民众排着长队领取食物。\n一名看上去四十多岁的中年男人，拄着拐杖，颤颤巍巍地来到美军士兵面前，他带着巴拿马帽，用麻布裹着自己的脸，美国士兵感到诧异，这又不是寒冷的冬季，为什么这个打扮，不过他也没多想，把手里的面包递给对方。\n男人拿到食品，走到附近的一个拐角处，仔细拿起包着面包的油纸，上面写着U.S.A，几年前，他在阿登森林也捡过写着一样文字的纸。"
 ger.101.a:0 "世事无常……"
 
 ger.102.t:0 "突击检查"
 ger.102.d:0 "莱茵河畔的一个深夜，几名英国军人踢开一座老磨坊的木门，电筒的光束刺破印刷厂地窖的黑暗。\n几个月前，英军在科隆等地发现了地下印刷的传单，传单呼吁元首最后的战士起来进行最后一战。经过调查，英军追踪并发现了这个老磨坊。潮湿的空气中飘着油墨与霉味，刚刚停转的印刷机上，《新秩序》的传单还带着温度。铅字盘里，SigeHeil的德文字母磨损得发亮。\n角落里，三个少年并排站着，金发下的蓝眼睛反射着冷光。最小的那个穿着改小的希特勒青年团制服，袖口线头松散。中尉翻开工作日志，发现印刷量统计表背面，用稚嫩笔迹画满了铁十字勋章草图。\n"你们知道战争结束了吧？"翻译官的声音在地窖里回荡。\n“那是大人的失败，德国的少年还没有投降。”带头的17岁少年带头发话，他举起右手，上面满是油墨。\n英军士兵将少年带上卡车，一路山一言不发。"
 ger.102.a:0 "世事无常……"
 
 ger.103.t:0 "收缴行动"
 ger.103.d:0 "慕尼黑郊区，一辆吉普车缓缓开到破败木屋前，这是美军第二次来到这里，奉命收缴女主人收藏的希特勒亲笔签名《我的奋斗》。即使战争结束多年，年迈的妇人依然狂热地崇拜元首，美军为此请来一位毛遂自荐的翻译。\n木门吱呀地打开，妇人一看见美国大兵，便不耐烦地摆手。Nein！Nein!这书我绝对不会给你们！你们有本事，把我和这书、这房子一起烧掉吧！\n美军便只好把车上的人请下来，只见中年男子穿着西装、梳着大背头，与忍饥挨饿的同胞形成了鲜明对比。\n老妇人一见这男人，瞳孔收缩，震惊无比。她颤抖地举起手：这书……是你给我的……当年，在柏林体育馆，奥运会结束后不久。\n穿西装的人也变得慌张不安，正当美国大兵一头雾水时，女主人从书中掏出一张照片，照片里，一个男人正站在元首的肖像面前演讲，手臂上还帮着卐臂章。\n啪！士兵一脸严肃地用力拍了一下惊魂未定的翻译。“看来你身上有故事啊。”老夫人瘫坐在地上，《我的奋斗》书页被一阵风吹开，露出作者的画像，盯着面前这两名曾经的崇拜者。"
 
 ger.104.t:0 "联邦德国收回大众汽车厂"
 ger.104.d:0 "经过外交努力，联邦德国政府将下萨克森州沃尔夫斯堡的汽车制造厂收归国有。沃尔夫斯堡在纳粹时期是德国最大的汽车制造中心，但它同样遭到了战争的破坏，并在战争结束后被英军控制。英军汽车设备方面的负责人伊凡·赫斯特维持了沃尔夫斯堡汽车厂在战后的运作，他同意了将汽车厂移交德国政府，并推荐海因里希·诺德霍夫博士接手汽车厂后续的运作。"
 
 ger.105.t:0 "大众甲壳虫问世"
 ger.105.d:0 "大众公司在纳粹德国时期留下的“力量来自快乐”型汽车的基础上进行升级改造，开发出全新的甲壳虫T1型轻型轿车，第一批甲壳虫轿车已于今日在沃尔夫斯堡的流水线下线，准备运往德国各地进行销售。"
 
 ger.106.t:0 "大众甲壳虫冲击海外市场"
 ger.106.d:0 "大众甲壳虫不仅得到了德国消费者的欢迎，并引起了欧洲其他国家和美国的注意。欧洲经济百废待举，甲壳虫的经济耐用性正好适应了这种形势，立刻成为欧洲最畅销的车种。并且在其研发过程中，研发者相当注意车子本身制作的水准和日后的维修问题，所以甲壳虫拥有相当坚实的车体结构和底盘发动机。\n大众公司的甲壳虫生产线正在不断扩大，并计划将甲壳虫推广到更多地区。"
 
 ger.110.t:0 "52位科学家发布《迈瑙宣言》呼唤和平与核裁军"
 ger.110.d:0 "在风景如画的德国巴伐利亚州博登湖迈瑙岛上，一场关乎人类未来的庄严宣言正在诞生。由两位诺贝尔奖得主——德国核物理学家奥托·哈恩（核裂变的发现者）与理论物理学家马克斯·玻恩——共同发起，来自世界多国的52位顶尖科学家齐聚一堂，联合签署并发表了具有里程碑意义的《迈瑙宣言》\n这份宣言的核心，是对核武器毁灭性力量的深切忧虑与强烈反对。科学家们以无可辩驳的专业知识警告世界：核武器的发展与扩张，正将全人类置于空前的生存危机之中。宣言超越了意识形态与国界的藩篱，向各国政府与公众发出最诚挚与紧迫的呼吁，要求立即行动起来，为全人类的福祉与子孙后代的生存，致力于全面禁止核武器并进行实质性的核裁军。\n《迈瑙宣言》的发布，不仅是科学共同体道德良知的集体体现，也标志着有识之士开始超越战后初期的阵营对立，从全人类共同命运的高度思考和平问题，为后续国际核不扩散与裁军运动奠定了重要的道义与舆论基础。"
 
 ger.111.t:0 "海因茨·古德将军去世"
 ger.111.d:0 "1954年10月，第二次世界大战中纳粹德国的著名将领、被誉为“闪电战之父”的海因茨·古德里安陆军上将在西德巴伐利亚州去世，终年65岁。他的逝世引起了世界军事史学界的广泛关注与讨论。\n作为德军装甲兵与机械化作战理论的奠基人与实践者，古德里安在战争初期指挥的装甲集群，以其高速纵深突击的战术，在波兰战役与法国战役中取得了惊人战果，深刻影响了现代战争形态。尽管其军事生涯服务于非正义的侵略战争，但其展现的军事才能与战术创新，仍是专业领域的研究课题。\n值得注意的是，处于冷战对峙前沿的美国与苏联军事学者，均在其去世后的评论中，罕见地一致承认古德里安杰出的军事组织与指挥能力。这种跨越意识形态的专业认可，使得古德里安成为一个复杂的历史符号：既是纳粹战争机器的重要一环，其军事遗产却又在客观上被后世所研究和借鉴。"
 
 ger.112.t:0 "奥斯瓦尔德·波尔被绞死"
 ger.112.d:0 "今日，在位于巴伐利亚州的兰茨贝格监狱内，臭名昭著的纳粹战犯奥斯瓦尔德·波尔被依法执行绞刑。波尔之死，为纽伦堡后续审判的一个重要案件画上了句号。\n波尔在纳粹党卫军体系中身居要职，官至党卫军经济与管理总局局长。他并非前线指挥官，而是大屠杀这一庞大罪恶工程背后的关键“财政管家”与冷酷组织者。其职责直接涉及对包括奥斯维辛在内的多个集中营系统的管理，并深度参与制订与执行了针对犹太人的“最终解决方案”，对数百万人的死亡负有不可推卸的直接责任。\n战后，波尔被盟军逮捕。在纽伦堡后续审判的“波尔案”中，法庭认定他犯有战争罪、反人类罪（特别是参与种族灭绝），其罪行“远超单纯的行政范畴，达到了骇人听闻的程度”，并据此判处其死刑。今日刑罚的执行，再次以司法形式确认了纳粹体制的极端罪恶，也体现了国际社会追究所有层面罪行责任者的决心。"
 
 ger.113.t:0 "电影《科佩尼克上尉》热映"
 ger.113.d:0 "一部名为《科佩尼克上尉》的西德电影近日在欧洲多国上映，引发广泛关注与讨论。该片改编自真实历史事件，讲述了1906年，一位名叫威廉·福格特的普通老人，在意外获得一件二手普鲁士上尉军装后，竟成功“扮演”军官，指挥一队士兵占领了柏林郊外的科佩尼克市政厅并“征收”市库钱财的荒诞故事。\n威廉·福格特的离奇经历在德国家喻户晓，长期以来被视为一则极具讽刺意味的寓言。电影通过其幽默诙谐的叙事，不仅生动再现了这一传奇事件，更巧妙地以此作为载体，深刻讽刺了德意志帝国时期以及更广泛意义上，对权威与军国主义盲目崇拜的社会心态，以及官僚体系的僵化与荒谬。\n影片的上映，正值战后西德社会深入反思历史、重建民主认同的时期。它让观众在笑声中思考权威的本质，成为一面映照历史与当下的文化镜子。"
 
 ger.114.t:0 "美国政府宣布放弃摩根索计划"
 ger.114.d:0 "美国政府对德政策发生重大转折。近日，当局正式发表声明，宣布终止此前旨在严厉惩罚德国、摧毁其工业基础的“摩根索计划”。取而代之的是最新颁布的第1779号行政指令。\n根据新指令，盟军占领当局将立即停止对德国工厂设施的强制性大规模拆毁，终结了战后初期以“工业去军事化”为名进行的系统性破坏。取而代之的是一个更具建设性的新框架：允许德国在英、法、美三国占领当局的联合监督与管理下，开始有限度、有控制地有序恢复其基础经济和工业生产。\n这一政策转向，标志着美国对欧战略重心，已从单纯的战后惩罚与防范，逐步转向稳定西欧局势、应对冷战新格局的现实考量。其核心目标是使西德经济逐步恢复自给能力，从而减轻占领负担，并为未来西德的融入西方体系奠定基础。"
 morgenthau_modifiers:0 "摩索根计划"
 
 ger.120.t:0 "美、英、法、德四国代表聚集波恩"
 ger.120.d:0 "一场关乎西德未来地位的会议今日在波恩历史悠久的彼得斯堡酒店拉开帷幕。来自美国、英国、法国三个占领国及德意志联邦共和国政府的代表齐聚一堂，旨在共同商讨对现行的《占领法规》进行重大修改。\n这是西德新政府成立后，首次与西方盟国就主权问题进行正式的高级别谈判。西德总理康拉德·阿登纳领导下的代表团，在会议中明确提出核心诉求：希望达成一项新的协议，以取代严格的《占领法规》，从而在外交、对外贸易及国内经济政策等多个关键领域获得显著的自主决定权。\n西德的目标是逐步减少占领国的监管与干预，为最终恢复完全主权、成为平等的国际伙伴奠定法律与政治基础。"
 
 ger.121.t:0 "鲁尔工业区的讨论"
 ger.121.d:0 "在近日举行的彼得斯堡会议中，西德与法国代表就鲁尔工业区的未来安排爆发激烈分歧。法方基于对德国军国主义可能复辟的深刻忧虑，坚持要求对鲁尔区这一欧洲工业心脏实施由英、法、美三国组成的国际共管，认为这是防止其重蹈战争经济覆辙的必要保障。\n西德总理阿登纳率领的代表团对此予以坚决反对。他们强调，鲁尔区主权问题是西德恢复经济自主与国家尊严的核心。德方要求完全恢复对鲁尔区的主权管辖，并承诺将在民主框架内进行经济重建，以此作为德国融入欧洲和平体系的基础。双方立场僵持，使谈判陷入关键性困难。"
 
 ger.122.t:0 "彼得斯堡协定签署"
 ger.122.d:0 "备受瞩目的彼得斯堡会议今日取得突破性成果。面对西德政府的持续外交努力与欧洲局势的现实需求，法国方面最终选择让步，同意在盟国保留必要监督权的前提下，将鲁尔工业区的主权管理职能正式交还给西德政府。\n随着这一核心障碍的扫除，与会四方正式签署了历史性的《彼得斯堡协议》。协议标志着西德在恢复主权国家的道路上迈出了决定性一步。根据协议内容，盟国占领当局将允许西德政府在对外贸易、外交关系及国内经济政策等多个关键领域行使广泛的自主权。同时，协议明确将西德纳入欧洲复兴计划的援助对象，以支持其战后经济重建。\n然而，协议的达成也伴随着明确的限制性条款。盟国方面在协议中再次强调并确认，将继续严格禁止西德重建任何形式的武装力量及军备工业，并将通过监督机制确保这一根本原则得到遵守。此协议为西德未来的经济发展与国际融入铺平了道路，同时也为欧洲的战后新秩序奠定了基础。"
 
 ger.123.t:0 "彼得斯堡协定流产"
 
 
 ger.125.t:0 "苏联与德国就战俘问题进行谈判"
 ger.125.d:0 "近日，由联邦德国外交部高级官员组成的代表团抵达莫斯科，与苏联政府就双方建立正式外交关系展开历史性谈判。\n此次谈判的核心议题之一是解决第二次世界大战遗留的德国战俘问题。西德方面在会谈中提出明确要求：希望苏联政府能够释放所有仍被扣押的德国战俘，并强调应允许这些战俘直接返回西德，而非将其遣送至东德。\n这一立场反映出西德政府将战俘问题视为国家统一象征及人道主义责任的组成部分，同时也意在争取国内舆论支持，并削弱东德政权的合法性。"
 
 ger.126.t:0 "西德与苏联达成战俘释放协议"
 ger.126.d:0 "经过多轮紧张谈判，苏联与联邦德国代表团于今日就关键议题达成重要妥协。根据协议，苏联方面同意，允许其羁押的德国战俘根据个人意愿，自行选择返回联邦德国或德意志民主共和国，这被视为西德在外交上的重大进展。同时，苏联正式承认联邦德国为德国西部人民的合法代表，即承认其政权的合法性。\n作为相应妥协，西德政府在此次谈判中做出战略性让步：暂时搁置对目前处于苏联及波兰行政管理之下的原东普鲁士等东部领土的追索权主张。这一系列交换，为两国关系正常化扫清了核心障碍，标志着欧洲冷战格局出现了关键性的解冻迹象。"
 
 ger.127.t:0 "战俘归乡 跨越千里的泪与和解"
 ger.127.d:0 "1956年秋日，一列从乌拉尔山启程的专列缓缓驶入西德法兰克福车站。车上载着战后十一年来首批获释回国的数千名德国战俘。他们穿越广袤的苏联平原、战后重建的波兰以及戒备森严的东德边境，在铁轨的轰鸣中完成了这场历时数月的归乡之旅。\n站台上，西德政府与红十字会联合举行了庄严的欢迎仪式。当列车停稳、车厢门打开的瞬间，白发苍苍的老兵们颤抖着走下踏板。许多人仍穿着破旧的苏联制式冬衣，手中紧握着褪色的身份牌。泪水、拥抱与沉默交织成站台上的交响——有母亲认出儿子时的嘶喊，也有妻子面对陌生丈夫时的茫然凝视。记者们的镁光灯照亮了锈蚀的勋章与冻疮未愈的手背，而围观人群自发唱起了《家乡，我归来》。\n这场归乡不仅是人道主义的胜利，更是冷战冰层裂开的第一道声响。当战俘们蹒跚着踩上西德土地时，他们身后是斯大林格勒的硝烟与西伯利亚的风雪，眼前则是波恩政府高举的“永不重演战争”标语牌。历史在这一刻完成了诡异的闭环：当年踏着铁蹄东征的军人，如今成了和平最沉重的注脚。"
 
 ger.128.t:0 "苏联与德国就战俘问题进行谈判"
 
 
 ger.130.t:0 "第五届国际足联世界杯在瑞士开幕"
 ger.130.d:0 "1954年国际足球联合会世界杯今日在瑞士首都伯尔尼正式开幕，共有16支国家足球队参与这次盛会。本届比赛首次采用电视报道，而且也特地发行了纪念币。另外，还采用了一套新的种子队伍系统，即各组中国际排名最高的两支队伍与排名最低的两支队伍各自无需在小组赛中对战。"
 
 ger.131.t:0 "巴西队与匈牙利队发生肢体冲突"
 ger.131.d:0 "瑞士世界杯即将迎来四分之一决赛，从第1组晋级的一支球队与从第2组晋级的一支球队随机抽签对阵。巴西抽签对阵匈牙利，而西德抽签对阵南斯拉夫。\n比赛在瓢泼大雨中进行，场地湿滑，球难以控制。匈牙利队在第三分钟由南多尔·希代古蒂破门得分。四分钟后，桑多尔·科奇什将比分扩大为2-0。巴西队获得点球机会，贾尔马·桑托斯主罚命中，半场结束时比分变为2-1。下半场，匈牙利获得点球，米哈伊·兰托斯主罚命中，将比分改写为3-1。点球的判罚引发了巴西记者和官员冲入球场的骚乱，最终被警方带离现场。比赛随后演变成一系列愈演愈烈的犯规和恶意战术，巴西前锋朱利尼奥进球，将比分追至3-2。之后，约瑟夫·博日克被尼尔顿·桑托斯犯规，两人发生冲突，双双被红牌罚下。匈牙利队由桑多尔·科奇什再入一球，将比分扩大到4-2。比赛最后阶段，双方球员展开了激烈的争夺；终场哨响前，巴西前锋温贝托·托齐踢了匈牙利球员久洛·洛兰特，被红牌罚下。\n赛后双方冲突仍在继续，巴西球员闯入匈牙利更衣室，并在场上继续斗殴。尽管有独立目击者证实双方均有暴力行为，但国际足联却未采取任何行动，而是将纪律处分权留给了相关国家。"
 
 ger.132.t:0 "黑马西德队战胜匈牙利赢得世界杯冠军！"
 ger.132.d:0 "伯尔尼的云度夫体育场的6万观众见证了世界杯有史以来最大的冷门之一。两队在首轮比赛中就已交过手，当时匈牙利以8–3大胜西德。伟大的匈牙利球员普斯卡斯抱病上场，但他仅在6分钟内就使匈牙利领先，两分钟后苏坦的进球似乎显示着这支赛前的大热门将会顺利地夺得桂冠。\n然而中场前西德队的拉恩的两个进球开始让比赛发生了逆转。下半场拉恩攻入了第二个进球，而普什卡什在终场前两分钟踢入的进球被判无效。愤怒的匈牙利队只能在终场哨声响起时，眼看着雷米金杯和世界杯冠军荣誉归入德国人的怀抱。当拉恩踢入制胜一球时，德国著名评论员施么文在沉默了8秒钟之后，喊出了：\n“德国队进球！德国队3–2领先！我就是个疯子！我就是个狂人！”"
 
 ger.133.t:0 "西德足球队凯旋回国！"
 ger.133.d:0 "西德队成为了世界冠军。此后不久，弗里茨·瓦尔特从儒勒·雷米手中接过象征世界杯冠军的雷米特杯。\n为了接送冠军球队返回德国，德国联邦铁路特意开行了一班以VT08型柴油动车组担当的专列。列车从瑞士施皮茨出发，那里是赫尔贝格团队在瑞士的驻地。当列车抵达慕尼黑后，有大量人群聚集在玛利亚广场欢庆。\n作家阿尔弗雷德·格奥尔格·弗赖在他整理的文献资料中对德国队的返程进行了纪录，此前的旅途过程中世界冠军成员们已在列车上进行了庆祝，而在巴伐利亚首府的进行的压轴庆典则吸引了超过10万名球迷参加。从慕尼黑开始，伯尔尼英雄们还陆续前往其它的西德大城市进行冠军巡游。街上随处可见前来对球队进行祝贺和赠礼的民众。"
 
 ger.140.t:0 "赫伯特·威廉·巴克自杀身亡"
 ger.140.d:0 "臭名昭著的纳粹主要战犯赫伯特·威廉·巴克在纽伦堡监狱的牢房中，被发现在栅栏上用床单上吊自杀。巴克曾是希特勒的狂热追随者，在纳粹政权中官至农业与食品部长，是种族主义意识形态的核心推手。\n在1941年苏德战争爆发后，巴克是“饥饿计划”的关键倡导者。该计划旨在通过系统性掠夺并截断粮食供应，在苏联被占领土上人为制造大规模饥荒，以“消灭数千万斯拉夫人等劣等民族”。这一冷酷无情的政策，构成了纳粹“东方总计划”中对平民进行种族灭绝的重要组成部分。\n德国战败后，巴克被美军俘获，并被列为即将开审的纽伦堡后续审判的主要被告。面对无可辩驳的指控证据和必将到来的法律制裁，巴克曾试图写信给盟军最高指挥官艾森豪威尔将军请求赦免，但遭到拒绝。在审判正式启动前夕，他以自尽的方式逃避了历史的审判。他的死亡，使得其反人类罪行的诸多具体细节，永远失去了在法庭上被完整揭露与定性的机会。"
 
 ger.141.t:0 "德国政府提出向战争受害者提供赔偿"
 ger.141.d:0 "西德总理康拉德·阿登纳今日在联邦议院发表历史性声明，宣布联邦政府将正式对纳粹政权的所有受害者承担道义与物质责任，启动一项全面、系统的国家赔偿方案。\n根据阿登纳阐述的框架，西德政府承诺，将向第二次世界大战期间所有因纳粹种族迫害、政治镇压及战争暴行而遭受伤害的个人及其家属提供持续的经济赔偿。此举旨在直面历史罪行，抚慰幸存者。更为引人注目的是，阿登纳总理同时宣布，西德愿意超越对个人的直接赔偿，计划通过向以色列、波兰、捷克斯洛伐克等国提供大规模经济援助与合作项目的方式，作为对民族集体所遭受苦难的国家层面补偿。\n这一揽子方案具有深远的双重战略考量。对内，它是西德社会与过去彻底划清界限、实现“道德复兴”的关键一步；对外，尤其是对以色列和东欧国家的援助提议，则被明确视为一种“补偿外交”，旨在为当时尚未建交的西德与这些国家开启对话、建立正常外交关系创造至关重要的突破口，从而打破其在政治上的孤立状态。阿登纳的声明，标志着战后德国承担历史责任的进程进入了崭新的、更具主动性的阶段。"
 
 ger.142.t:0 "迪特里希·冯·绍肯将军归国"
 ger.142.d:0 "作为苏联与西德关系正常化谈判的首批直接成果，二战期间在柯尼斯堡被俘的德国陆军大将迪特里希·冯·绍肯，已于近日从西伯利亚战俘营获释，经莫斯科返回西德。\n绍肯将军出身东普鲁士传统容克贵族家庭，其军事生涯被视为普鲁士古典军人荣誉观的最后代表。尽管他作为军官参与了二战，却以对纳粹意识形态的极度反感著称。他私下称纳粹党人为“棕色暴徒”，并曾因战略分歧在作战会议上公然顶撞希特勒。因其一贯的正直、保守和反纳粹立场，战后他被德国国内及西方史学界誉为“最后一位正直的普鲁士军官”，其独立不阿的形象与众多迎合纳粹的将领形成鲜明对比。\n他的归来在西德社会引发了广泛关注，被视为一个时代道德符号的回归。这不仅是一次战俘的遣返，更被解读为对一种逝去的、强调荣誉与责任感的军事传统的追忆，同时也标志着欧洲战后历史和解进程中的一个特殊篇章。"
 
 ger.145.t:0 "慕尼黑警察局发生爆炸袭击"
 ger.145.d:0 "日，一件邮寄给西德总理康拉德·阿登纳的包裹，在慕尼黑警察局例行安全检查时突然爆炸，造成一名警官当场死亡，另有数人受伤。这起未遂的暗杀事件引发举国震惊。\n极端犹太复国主义武装团体“伊尔贡”随后发表声明，宣称对此袭击负责。该组织长期反对以色列政府与西德进行任何形式的接触与和解。声明称，此举旨在以暴力方式强烈抗议并阻挠以色列与西德就二战赔偿及建交问题进行的谈判进程。\n爆炸事件凸显了阿登纳政府推动“赔偿外交”、寻求国际和解所面临的极端阻力与安全风险，也为即将开启的德以秘密谈判蒙上了一层阴影。"
 
 ger.150.t:0 "致联邦政府机密信函"
 ger.150.d:0 "尊敬的联邦总理阁下：\n\n我们是一批曾在东线战场积累丰富作战经验的前国防军军官，怀着对联邦共和国的忠诚，自愿请命组建一支具备快速反应能力的特种防御部队。当前东方集团在边境的军事压力日益增强，而盟国驻军存在反应间隙，我们愿在绝对保密的前提下，为国家构筑一道隐形防线。\n这支部队将完全由本土志愿者组成，采用非制式装备与分散部署，可在48小时内完成对关键设施的隐蔽布防。我们熟悉易北河以东的地形与对手战术特点，并能通过民间渠道获取实时情报。所有行动将严格遵从宪法框架，仅在外敌公然入侵时启动。\n我们理解此事的敏感性，故建议以“保险行动”为对外名义进行组建。盼能获准面陈详细方案。\n\n此致\n敬礼！\n\n您忠诚的\n阿尔伯特·施内兹    格哈德·冯·什未林"
 
 ger.151.t:0 "史内资部队响应号召"
 
 
 ger.160.t:0 "苏联外交部致信波恩政府"
 ger.160.t:0 "致德意志联邦共和国外交部：\n\n基于维护欧洲持久和平与安全的共同利益，苏联政府建议，双方可于近期举行高级别秘密会晤，探讨涉及德国问题的建设性解决方案。我方愿提出以下原则性设想：\n若贵国政府能公开承诺不加入任何由西方大国主导的军事条约组织（如正在筹划中的“西欧联盟”等），并接受对本国军备（特别是重武器装备）进行国际监督与限制，苏联将考虑采取相应的重大步骤。这些步骤包括但不限于：从德意志民主共和国领土上撤离大部分苏联驻军，并承诺在可预见的未来，不将民主德国纳入苏联主导的任何区域性军事条约体系。\n此举旨在为两个德国间的和平共处创造条件，并最终实现全德问题的和平解决。期待贵方积极回应，具体时间与地点可由密使商定。\n\n苏联外交部"
 
