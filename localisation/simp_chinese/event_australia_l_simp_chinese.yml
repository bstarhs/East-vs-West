l_simp_chinese:
 ast.1.t:0 "澳大利亚前总理班·奇夫利去世"
 ast.1.d:0 "澳大利亚前总理约瑟夫·班·奇夫利因突发心脏病去世。班·奇夫利是澳洲历史上推动立法最多的总理，为澳大利亚的社会改革作出巨大贡献。"
 ast.1.a:0 "德国和欧洲已经陷入分裂。"
 
 ast.2.t:0 "澳大利亚矿工罢工"
 
 ast.3.t:0 "澳大利亚银行国有化"
 
 ast.4.t:0 "1949年澳州议会大选"
 
 ast.5.t:0 "工党赢得澳州议会大选"
 ast.5.d:0 "工党赢得澳州议会大选，[AST.GetLeader]就任澳大利亚总理。"
 
 ast.6.t:0 "自由党赢得澳州议会大选"
 ast.6.d:0 "自由党赢得澳州议会大选，[AST.GetLeader]就任澳大利亚总理。"
 
 ast.10.t:0 "英国女王伊丽莎白二世访问澳大利亚"
 
 
 
 ast.100.t:0 "澳大利亚墨尔本获得1956年奥运会举办资格"
 ast.100.d:0 "在伦敦奥运会结束后，国际奥委会宣布，澳大利亚城市墨尔本将成为1956年夏季奥运会的主办方。"
 
 ast.101.t:0 "墨尔本奥运会举办在即"
 ast.101.d:0 "距离1956年澳大利亚墨尔本奥运会正式开始还有半年，澳大利亚政府和人民正在紧张但自豪地为即将举办的国际盛会做准备。"
 
 ast.102.t:0 "抵制奥运会！"
 ast.102.d:0 "英帝国主义向埃及发动侵略战争，但英国女皇却恬不知耻地在即将举办奥运会的墨尔本大谈和平，简直讽刺至极！我们的群众希望我们不要派出代表团参加这次奥运会，以表达对英帝国主义的谴责！"
 
 ast.103.t:0 "[ROOT.GetName]宣布抵制墨尔本奥运会"
 ast.103.d:0 "[ROOT.GetName]政府发表声明，谴责英国一边支持澳大利亚举办象征和平的奥运会，一边向埃及发动侵略战争。该国将抵制这次奥运会。"
 
 ast.104.t:0 "抵制奥运会！"
 ast.104.d:0 "苏俄共产主义匪徒残酷镇压匈牙利革命，但俄国代表团却恬不知耻地在即将举办奥运会的墨尔本大谈和平，简直讽刺至极！我们的群众希望我们不要派出代表团参加这次奥运会，以表达对共产主义苏俄的谴责！"
 
 ast.105.t:0 "[ROOT.GetName]宣布抵制墨尔本奥运会"
 ast.105.d:0 "[ROOT.GetName]政府发表声明，谴责苏联一边参与象征和平的奥运会，一边向匈牙利发动侵略战争。该国将抵制这次奥运会。"
 
 ast.106.t:0 "奥运会的德国问题"
 ast.106.d:0 "墨尔本奥运会将是德国分裂以后，首次同时有东西德双方参与的奥运会。为了缓解紧张的政治氛围，国际奥委会提议，由双方组成一个联合代表队参赛，并使用新的联合代表队旗帜。"
 
 ast.107.t:0 "两德奥运代表队问题达成协议"
 ast.107.d:0 "东德与西德的奥委会达成协议，由双方组成一个联合代表队参赛，并使用新的联合代表队旗帜。"
 
 ast.108.t:0 "台湾代表团在奥运村升起国旗"
 ast.108.d:0 "由于国际奥委会在1954年正式接纳的中华人民共和国奥委会并将中华民国除名，中华民国代表团使用福尔摩沙—中国的名称参赛。今天早上，中华民国代表团在奥运会下榻处升国旗并演奏国歌，引起了中国大陆代表团的不满和抗议。"
 
 ast.109.t:0 "台湾当局在奥运村升起国旗"
 ast.109.d:0 "奥委会在1954年正式接纳的中华人民共和国奥委会并将中华民国除名，但台湾方面被允许使用福尔摩沙—中国的名称参赛。今天早上，蒋匪代表团在奥运会下榻处升伪国旗并演奏伪国歌，这毫无疑问是对我方代表团的挑衅，我们应该对澳方提出抗议！"
 
 ast.110.t:0 "中国大陆代表团退出奥运会！"
 ast.110.d:0 "由于不满奥运会管理人员未能阻止中华民国代表团在奥运村升中华民国国国旗，中华人民共和国代表团宣布退出奥运会。"
 
 ast.111.t:0 "墨尔本奥运会正式开幕！"
 ast.111.d:0 "第十六届夏季奥林匹克运动会在澳大利亚墨尔本正式开幕！来自七十多个国家的三千五百多名运动员齐聚南方大陆，参与这场盛会。开幕式在墨尔本板球场举行，澳大利亚田径运动员	罗恩·克拉克点燃圣火，作为澳大利亚国家元首的英联邦女王伊丽莎白二世的丈夫、爱丁堡公爵菲利普亲王宣布大赛开幕。"
 
 ast.112.t:0 "匈牙利与苏联代表团的水中血战！"
 ast.112.d:0 "在今天举行的墨尔本奥运会的匈牙利对阵苏联的水球比赛，引起了媒体的高度关注，因为这场比赛距离苏联军队血腥镇压匈牙利革命仅仅过去两个多月。两国运动员在水池中发生激烈的肢体冲突，匈牙利选手扎多尔·埃尔温眼角被打出血。比赛最终以匈牙利4：0战胜苏联告终。"
 
 ast.113.t:0 "墨尔本奥运会宣告结束！"
 ast.113.d:0 "历时近一个月的澳大利亚墨尔本奥运会正式宣告结束，苏联代表团以98枚奖牌的成绩位居奖牌榜榜首。下一届夏季奥运会将在四年后于意大利的罗马举办。"
 
 ast.114.t:0 "墨尔本奥运会宣告结束！"
 ast.114.d:0 "历时近一个月的澳大利亚墨尔本奥运会正式宣告结束，苏联代表团以98枚奖牌的成绩位居奖牌榜榜首。下一届夏季奥运会将在四年后于瑞士洛桑举办。"
 
 ast.115.t:0 "墨尔本奥委会阻挠我代表团正常升旗"
 ast.115.d:0 "澳洲奥委会排我纳匪，不仅纵容共匪代表队在奥运赛场登堂入室，还无故蛮横阻挠我中华民国代表团在奥运村升国旗，这毫无疑问是对我方代表团的挑衅，我们应该对澳方提出抗议！"
 
 ast.116.t:0 "中华民国代表团退出奥运会！"
 ast.116.d:0 "由于不满奥运会管理人员阻挠中华民国代表团在奥运村升中华民国国国旗，台湾代表团宣布退出奥运会。"