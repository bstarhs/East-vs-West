l_simp_chinese:
 vat.1.t:0 "教宗发布抨击共产主义的公告"
 vat.1.d:0 "天主教教宗庇护十二世发布声明，抨击和反对共产主义运动在欧洲的扩展。"
 
 vat.2.t:0 "教宗发布有关中国共产党的公告"
 
 vat.3.t:0 "教宗发布有关意大利大选的声明"
 vat.3.d:0 "天主教教宗庇护十二世发布声明，称教会对近年来共产主义运动在意大利的影响力扩大表示不满，并担忧其在即将举行的意大利大选中获得优势。"
 
 vat.4.t:0 "教宗宣布抵制意大利大选"
 vat.4.d:0 "天主教教宗庇护十二世发布声明，宣布抵制意大利大选的选举结果，反对意大利共产党上台组阁，并号召意大利的基督徒反对共产党政府。"
 
 vat.5.t:0 "与教皇进行交涉"
 vat.5.d:0 "天主教宗庇护十二世多次针对我国政治局势发表言论，煽动基督徒反对社会主义政府，我们将对梵蒂冈提出严正交涉。"
 vat.5.a:0 "让教宗管好嘴"
 vat.5.b:0 "没这个必要"
 
 vat.6.t:0 "教皇拒绝交涉"
 vat.6.d:0 "教皇拒绝与我们的外交官员对话，并关闭了与我国的一系列的外交渠道。"
 vat.6.a:0 "教皇？他有几个师?"
 vat.6.b:0 "算了吧"
 
 vat.7.t:0 "教皇流亡西班牙"
 vat.7.d:0 "来自巴塞罗那的突发消息，天主教宗庇护十二世在与意大利共产党的代表对话后，决定离开梵蒂冈。教宗今天凌晨在意大利政府监督下，与天主教会多名官员一同乘轮船离开罗马，并于今日中午抵达西班牙巴塞罗那。西班牙领导人弗朗西斯科·弗朗哥热情接待了教宗一行。目前教宗在巴塞罗那某宾馆下榻，不接受记者采访。"
 
 vat.8.t:0 "意大利共产党入侵梵蒂冈"
 vat.8.d:0 "来自罗马的突发消息！意大利军队在与教宗谈判失败后，向梵蒂冈采取了军事行动！驻守罗马的意大利部队已向梵蒂冈发起进攻，梵蒂冈内的教宗卫队正在抵抗！"
 
 vat.9.t:0 "对梵蒂冈采取行动"
 
 vat.10.t:0 "教宗遭到软禁"
 vat.10.d:0 "意大利与梵蒂冈的战争已结束，意军迅速击溃了教皇卫队，并俘获了教宗庇护十二世，目前他和众多教会高官被关押在圣天使城堡。意大利共产党入侵梵蒂冈的行为震惊了整个世界，不仅教宗被俘，许多天主教圣物也被破坏，这大大加剧了西方国家对共产主义的敌视。"
 
 vat.11.t:0 "教宗在交火中死亡"
 vat.11.d:0 "意大利与梵蒂冈的战争已结束，意军迅速击溃了教皇卫队，但教宗庇护十二世在激烈的交火中死亡，意军在伯多禄圣殿中发现了他的遗体。意大利共产党入侵梵蒂冈的行为震惊了整个世界，不仅教宗遇难，许多天主教圣物也被破坏，这大大加剧了西方国家对共产主义的敌视。"
 
 vat.12.t:0 "我们对梵蒂冈事件的态度"
 
 vat.13.t:0 "[From.GetName]与意大利断交"
 vat.13.d:0 "[From.GetName]谴责意大利共产党政府入侵梵蒂冈的行为，并宣布与意大利当局断交。"
 
 vat.14.t:0 "天主教会在巴塞罗那召开"
 
 vat.15.t:0 "教宗被处死"
 
 vat.16.t:0 "联合国谴责处死教宗"
 
 vat.17.t:0 "教宗被释放"
 
 vat.18.t:0 "天主教会谴责共产主义"
 
 vat.19.t:0 "教宗为救国军祝圣"
 
 vat.20.t:0 "教宗宣布抵制意大利大选"
 
