l_simp_chinese:
 eco.1.t:0 "财政赤字！"
 eco.1.d:0 "我国的支出大于收入，导致财政赤字！过大的财政赤字将影响政府运作效率。"
 
 eco.2.t:0 "收支稳定"
 eco.2.d:0 "我国的收入大于支出，财政赤字惩罚已消失。"
 
 eco.3.t:0 "原油不足！"
 eco.3.d:0 "我国可用于炼制的原油资源不足！这将导致炼油产量的萎缩。"
 
 eco.4.t:0 "铁矿不足！"
 eco.4.d:0 "我国可用于消耗的铁矿资源不足！这将导致炼钢产量的萎缩。"
 
 eco.5.t:0 "粮食不足！"
 eco.5.d:0 "我国有处于粮食不足的省份！\n点击省份面板粮食数值旁的加号可以运输多余的粮食至该地区。"
 eco.5.a:0 "跳转到该省份"
 eco.5.b:0 "确定"
 
 eco.6.t:0 "粮食供应恢复"
 eco.6.d:0 "某地区的粮食供应已恢复正常。"
 eco.6.a:0 "跳转到该省份"
 eco.6.b:0 "确定"
 
 eco.7.t:0 "汽车"
 eco.7.d:0 "民用汽车是本MOD一种特殊的产品，需要耗费民用工厂和一定的钢材、橡胶、铝等资源进行生产。汽车的需求来自全国的基建数量，满足80%以上的汽车需求可以给予额外的政治点数和建设速度加成，但若不满50%的汽车需求，则会有额外的惩罚。\n选择汽车生产商企业加入工业企业可以额外增加汽车产量。\n你不需要把汽车产量拉到完全满足需求（除非你资源充足且追求人人有车开的共产主义社会），满足需求的80%以上就能获得加成。\n汽车同时是重要的出口产品，目前设定为每个出口单位汽车获得4收入，将资源加工成汽车出口，可以获得巨大利润。"
 eco.7.a:0 "确定"
 
 eco.8.t:0 "电子产品"
 eco.8.d:0 "电子产品是本MOD一种特殊的产品，需要耗费民用工厂和一定的钢材、橡胶、铝等资源进行生产。电子产品的需求来自全国的城市发展水平，满足80%以上的电子产品需求可以给予额外的稳定度和服从度加成，但若不满30%的电子产品需求，则会有额外的惩罚。\n选择电子产品生产商企业加入工业企业可以额外增加电子产品产量。\n你不需要把电子产品产量拉到完全满足需求，满足需求的80%以上就能获得加成。"
 eco.8.a:0 "确定"
 
 eco.9.t:0 "医疗不足！"
 eco.9.d:0 "[FROM.GetID]的医疗服务严重不足！"
 eco.9.a:0 "跳转到该省份"
 eco.9.b:0 "确定"
 
 eco.10.t:0 "医疗供应恢复"
 eco.10.d:0 "[FROM.GetName]的医疗供应已恢复正常。"
 eco.10.a:0 "跳转到该省份"
 eco.10.b:0 "确定"
 
 eco.11.t:0 "我国当前教育状况"
 eco.11.d:0 "我国当前的识字率为[?education]%\n满足教育需求的省份为[?THIS.educatet_states]/[?controlled_states]，识字率上升速度为[?education_rate_up]每月"
 eco.11.a:0 "确定"
 
 
 eco.12.t:0 "识字率过低！"
 eco.12.d:0 "我国当前的识字率为[?education]%，这严重拖后了我国的发展速度！"
 eco.12.a:0 "确定"
 
 eco.13.t:0 "识字率有所改善"
 eco.13.d:0 "我国当前的识字率为[?education]%，经过努力，我国已不再是低识字率国家！"
 eco.13.a:0 "确定"

 eco.14.t:0 "能源供应回复"
 eco.14.d:0 "我国的能源供应已经恢复正常。"
 eco.14.a:0 "确定"
 
 eco.15.t:0 "您可以使用空闲民用工厂进行生产！"
 eco.15.d:0 "东西对抗MOD采用了全新的经济系统，您可以将空闲的民用工厂投入到消费品生产中，例如生产食品、纺织品、电子产品和汽车等，这些商品不仅可以为您提供税收，而且还可以出口海外获取利润。注意：民用工厂无论是否处于工作状态都会花费支出，但只有处于工作状态的工厂才会产生税收。"
 eco.15.a:0 "确定"