l_simp_chinese:
 alg.1.t:0 "阿尔及利亚起义!"
 alg.1.d:0 "阿尔及利亚解放阵线在阿尔及尔发动起义！他们宣称将会发动一场将阿尔及利亚从法国殖民统治下解放出来的战争！"
 alg.1.a:0 "让我们看看接下来会发生什么。"
 
 alg.2.t:0 "阿尔及利亚宣布独立"
 alg.2.d:0 "在经历了惨烈的独立战争后，阿尔及利亚解放阵线终于迫使法国签订条约，完全撤离这个国家。"
 alg.2.a:0 "让我们看看接下来会发生什么。"
 
 alg.3.t:0 "阿尔及利亚解放阵线袭击"
 alg.3.d:0 "阿尔及利亚解放阵线袭击了我军在阿尔及利亚的一处驻地！"
 alg.3.a:0 "让我们看看接下来会发生什么。"
 
 alg.4.t:0 "法国在阿尔及利亚的暴行被披露！"
 alg.4.d:0 "巴黎清晨，报童的叫卖声比往常低沉。咖啡馆里，展开的报纸头版赫然印着模糊的黑白照片——阿尔及利亚村庄的断墙前布满弹孔，一排又一排的尸体蜷缩在墙脚下，隐约可见墙壁后燃烧的火光。\n巴黎、奥尔良和马赛的报刊亭前挤满了人群，实际上这已经不是法国人第一次听说法军在阿尔及利亚的可怕行为，但如此清晰的报纸还是第一次见。消息很快传遍整个法国、整个欧洲。\n议会大厦前，抗议学生举着放大复印的报纸版面，雨水将纸上的尸体轮廓冲刷成扭曲的灰痕。支持殖民的议员们匆匆钻进汽车，车窗上还粘着昨夜的庆功宴请柬。\n法军在阿尔及利亚的暴行已经引起了国际社会的普遍关注，联合国要求法国驻联合国代表在几天后的联大会议上做出解释。法国驻纽约领事馆，大使汗流浃背地回绝了记者的提问。"
 alg.4.a:0 "自由……平等……博爱……"
 
 alg.5.t:0 "阿尔及利亚抵抗武装被镇压"
 alg.5.d:0 "在法国军队的大力镇压下，阿尔及利亚抵抗武装被击溃，幸存者被迫转入地下。"
 alg.5.a:0 "知道了。"
 
 alg.6.t:0 "阿尔及利亚民族解放组织成立！"
 alg.6.d:0 "法国统治下的阿尔及利亚，阿拉伯人和法国人数十年的矛盾终于被引爆！阿尔及利亚解放阵线在开罗正式宣布成立！他们宣称将会发动一场将阿尔及利亚从法国殖民统治下解放出来的战争！！"
 
 alg.7.t:0 "[ROOT.GetName]宣布支持阿尔及利亚民族解放运动！"
 alg.7.d:0 "[ROOT.GetName]宣布支持阿尔及利亚人民反对法国殖民统治的武装斗争！"
 
 alg.8.t:0 "阿尔及利亚抵抗组织正在瓦解！"
 alg.8.d:0 "法国军方发布声明，最近几个月，阿尔及利亚地区的反法武装暴动越来越少，鲜有的几次暴动中，被俘的武装分子精神萎靡，装备落后，斗志底下，由此，法国方面认为，阿尔及利亚独立势力已经遭到严重削弱。"
 
 alg.9.t:0 "阿尔及利亚解放阵线崩溃！"
 alg.9.d:0 "随着本·优素福·本·赫达辞去阿尔及利亚临时政府总统职位，临时政府宣告解散，解放阵线总书记的职位也面临控空缺，近十年的阿尔及利亚暴动似乎就要落下帷幕了。法国宣布，法军已经成功肃清所有的阿尔及利亚分离主义分子，阿尔及利亚已重归和平，法兰西守住了他们在非洲大陆最珍贵的资产。"
 
 alg.10.t:0 "法国政府宣布与阿尔及利亚抵抗组织谈判！"
 
 alg.11.t:0 "法国希望保留在沙漠地带的核试验基地！"
 
 alg.12.t:0 "阿尔及利亚同意保留核试验基地！"
 
 alg.13.t:0 "阿尔及利亚拒绝保留核试验基地！"
 
 alg.14.t:0 "阿尔及利亚战争谈判破裂！"
 
 alg.15.t:0 "Larbi Ben M'hidi被俘！"
 alg.15.d:0 "法国军方发布声明！在最近一次行动中，阿尔及利亚解放阵线领导人之一的Larbi Ben M'hidi被俘！目前他正关押在阿尔及尔的秘密监狱，法国已决定将其判处死刑！"
 
 alg.16.t:0 "艾哈迈德·本·贝拉被俘！"
 alg.16.d:0 "法国军方发布声明！在最近一次行动中，阿尔及利亚解放阵线领导人之一的艾哈迈德·本·贝拉被俘！目前他正关押在阿尔及尔的秘密监狱，法国已决定将其判处死刑！"
 
 alg.17.t:0 "如何处置艾哈迈德·本·贝拉？"
 alg.17.d:0 "叛乱分子艾哈迈德·本·贝拉正在我们的监狱里关押，但我们一些官员通过审讯其他叛乱分子发现，所谓的阿尔及利亚民族解放阵线其实正处于内部矛盾中，本·贝拉与另一面领导人本·优素福·本·赫达关系不和，因此我们认为可以考虑故意释放本·贝拉，从而制造二者之间的不信任。"
 
 alg.18.t:0 "艾哈迈德·本·贝拉被释放！"
 
 alg.19.t:0 "阿尔及利亚解放阵线内讧！"
 
 alg.20.t:0 "艾哈迈德·本·贝拉被处决！"
 
 alg.21.t:0 "本·优素福·本·赫达成为阿尔及利亚临时总统"
 
 alg.30.t:0 "阿尔及尔发生爆炸袭击事件！"
 alg.30.d:0 "阿尔及利亚首府阿尔及尔的卡斯巴大教堂发生爆炸袭击事件！阿尔及利亚民族主义者在教堂中安装炸弹并引爆，导致多人死伤。"
 
 alg.35.t:0 "阿尔及利亚解放阵线召开秘密会议"
 alg.35.d:0 "来自开罗的消息，阿尔及利亚民族解放阵线发表声明，他们已经在城市苏曼召开了历史性的会议，由于民族解放阵线的许多重要领导人被法国逮捕，因此决定推举Abane Ramdane为临时的军事总指挥，全权负责反对法国的武装斗争。"
 
 alg.36.t:0 "阿尔及利亚奥兰发生大规模武装暴动！"
 alg.36.d:0 "阿尔及利亚的奥兰和君士坦丁两省发生大规模武装暴动！阿尔及利亚民族解放组织领导下的武装团体在各大城市发起袭击，并与法国军队激烈交火！！"
 
 alg.37.t:0 "菲利普维尔发生大规模流血冲突！"
 alg.37.d:0 "来自阿尔及尔的消息！阿尔及利亚北部村庄菲利普维尔发生了民族解放组织的袭击！解放组织游击队攻击并杀死了大量的欧洲移民和被认为支持法国统治的村民，死亡人数可能超过了两百。"
 
 alg.38.t:0 "菲利普维尔的报复性攻击"
 alg.38.d:0 "法国军方发表声明，为报复菲利普维尔袭击事件，法军将对周边地区进行大规模的扫荡作战，以维护该地区的稳定。同时，法军也将毫不留情地消灭任何被怀疑支持解放阵线的居民。"
 
 alg.39.t:0 "联合国首次讨论阿尔及利亚局势"
 alg.39.d:0 "阿尔及利亚爆发的战争已经导致了严重的平民死伤，也引起了国际社会的广泛关注。联合国大会今日首次就阿尔及利亚问题进行讨论。"
 
 alg.41.t:0 "Abane Ramdane阵亡！"
 alg.41.d:0 "来自阿尔及尔的消息！阿尔及利亚解放组织领导人Abane Ramdane在一次袭击中死亡！目前袭击者真实身份位置。在短暂的哀悼后，Houari Boumédiène接替成为解放组织的最高指挥官。"
 
 alg.42.t:0 "阿尔及尔发生爆炸袭击事件！"
 alg.42.d:0 "阿尔及尔消息！一家名叫Coq Hardi的咖啡馆遭到爆炸袭击，造成四人死亡六十多人受伤，法国当局指责阿尔及利亚解放阵线制造了这起袭击。"
 
 alg.43.t:0 "阿尔及尔炸弹事件袭击者被捕！"
 alg.43.d:0 "法国政府宣布，数个月前在阿尔及尔一家咖啡馆安放炸弹，导致多人死伤的恐怖袭击者Djamila Bouazza和Djamila Bouhired已被逮捕，他们将以杀人和恐怖袭击进行起诉。"
 
 alg.44.t:0 "围绕Djamila Bouazza的审判"
 alg.44.d:0 "对阿尔及尔爆炸案的两名袭击者，Djamila Bouazza和Djamila Bouhired的审判，引起法国社会各界广泛关注。人权律师Jacques Vergès对二人，以及整个阿尔及利亚解放事业报以深深同情，并希望能为二人进行无罪辩护。"
 
 alg.45.t:0 "Maurice Audin的失踪"
 alg.45.d:0 "阿尔及尔大学助教、阿尔及利亚共产党员Maurice Audin在被法国军队逮捕后失踪，引起法国和阿尔及利亚社会的关注。Maurice Audin在一个多月前被因为协助阿共领导人Larbi Bouhali逃脱法军追捕而遭到法军监禁，此后人间蒸发。阿尔及利亚共产党发言人指责法军将Audin刑讯逼供后残忍杀害，而法军则回应称Audin在押送途中逃跑。由于Maurice Audin与法国数学家洛朗·施瓦茨等有长期的合作关系，因此此事引起法国科学界的关注，许多著名科学家呼吁法国政府调查此事真相。"
 
 alg.50.t:0 "我们已成功争取到当地居民的支持"
 alg.50.d:0 "我们派遣的政府代表团前往了[STATE.GetName]的当地村镇，与村里的话事人和宗教长老进行了会谈。尽管花费了一番功夫，但总的来说，我们成功地降低了当地人对法国人的敌意，并让他们相信法国人的管制对他们是有益的，并劝说他们远离阿尔及利亚解放组织的叛乱分子。\n我们的代表团离开前为当地居民提供了一批粮食和物资，并告诉他们，只有在法兰西政府的领导下，阿尔及利亚才能获得这些来自文明世界的援助，而满嘴谎言的叛乱组织只能带来战争和动荡。"
 
 alg.51.t:0 "当地居民拒绝与我们接触"
 alg.51.d:0 "我们派遣的政府代表团前往了[STATE.GetName]的当地村镇，然而，当地居民却对我们充满敌意。我们的代表团和阿拉伯语翻译尝试寻找当地愿意与我们对话的居民，然而，这里的人从长者到孩童，都用仇恨的眼神注视着法国人……\n代表团无功而返，而在返程的路上，随行的军官认为这里或许已被叛乱分子渗透，也许未来需要对这一地区特别关注。"
 
 alg.52.t:0 "亲爱的阿尔及利亚同胞们"
 alg.52.d:0 "阿尔及利亚不是一块普通的海外领地，而是法兰西不可分割的一部分。我们在这里建设城市、发展经济、传播文明，让这片土地从荒芜走向繁荣。然而，如今一小撮叛乱分子，在外国势力的煽动下，妄图撕裂这片与我们血脉相连的土地。法兰西绝不会允许这样的背叛！\n所谓解放阵线并非自由斗士，而是恐怖分子。他们以独立为名，行暴力之实：屠杀平民、袭击学校、恐吓无辜的阿尔及利亚民众。他们声称代表人民，却用炸弹和子弹逼迫同胞屈从。法兰西的军队不是在镇压起义，而是在剿灭犯罪，保护数百万渴望和平的阿尔及利亚人。我们的士兵英勇作战，不是为了压迫，而是为了恢复秩序。\nFLN高喊独立，却不敢承认一个事实：阿尔及利亚的繁荣离不开法国。阿尔及利亚在法兰西的怀抱中，享有前所未有的发展。\n法兰西必胜！阿尔及利亚永远属于法国！"
 alg.52.a:0 "Vive la France!"
 
 alg.53.t:0 "[STATE.GetName]地方政府成立"
 alg.53.d:0 "在法国的支持下，[STATE.GetName]成立了一个新的政府，法国宣布，这是一个通过自由选举产生的政府，它真正代表了阿尔及利亚的多数民众。这个新的省政府由哈基人士兵、天主教徒、犹太人和其他通过法国统治受益的人。在《马赛曲》的伴奏下，这个新政府宣誓就职，并宣布为维护阿尔及利亚的稳定繁荣而服务。"
 
 alg.60.t:0 "Bachaga Boualam当选法国国会议员"
 alg.60.d:0 "在最近的法国国会选举中，来自阿尔及利亚的哈基人Said Boualam当选为法国国会议员，这也是首位进入法国国会的阿尔及利亚人。Said Boualam是一位典型的亲法阿尔及利亚哈基人，他曾在二战中加入法国外籍军团，并获得荣誉军团勋章。作为法国统治阿尔及利亚的既得利益者代表人物，Said Boualam大力呼吁法国保护阿尔及利亚，镇压反法的叛乱势力。"
 
 alg.61.t:0 "阿兰·佩雷菲特方案"
 alg.61.d:0 "法国外交官阿兰·佩雷菲特提出了一个阿尔及利亚独立的妥协方案：阿尔及利亚的北方将由法国监督下选举并成立的阿尔及利亚新政府，成立一个“对法国友好”的独立国家，并与法国签订一系列条约，确保法国的一系列利益不会在阿尔及利亚独立后受到损失，此外，阿尔及利亚南方的沙漠地区将由法军继续驻扎，以保障法国的地缘利益不受影响。"
 
 alg.62.t:0 "阿尔及利亚进行法国监督下的选举"
 alg.62.d:0 "随着阿尔及利亚局势转向缓和，法国开始逐步向亲法的阿尔及利亚政客放权，使阿尔及利亚走向自治。法国已开始在阿尔及利亚举行地方选举，支持亲法政客参选并建立政府。"
 
 alg.63.t:0 "阿尔及利亚进行自治"
 alg.63.d:0 "阿尔及利亚举行的所谓选举得到了意料之中的结果。亲法政党大获全胜，以Said Boualam为首的国民阵线大获全胜，当选为阿尔及利亚自治后的第一任政府首脑。"
 
 alg.64.t:0 "民众迁入新村"
 alg.64.d:0 "法国当局已将[STATE.GetName]地区山地地带的居民迁入新建的管制定居点。尽管遭遇零星抵抗，但这项旨在切断游击队补给线的战略总体进展顺利。"
 
 alg.65.t:0 "新村的发展"
 alg.65.d:0 "前方记者在阿尔及利亚发来报告。阿尔及利亚政府为避免解放阵线与山地居民的接触，而将这些地区的居民迁移至政府修建的新村。起初新村计划遭到居民的强烈抵制，美国媒体也指责这种新村是所谓的集中营。然而，经过几个月的生活，居民们还是接受了新村的居住。\n新村的居民对记者表示，新的家园虽然对居民的出入自由进行了限制，但生活质量确实比生活在山地的村庄和贫民窟要好，有充足的饮用水和医疗服务，远比生活在战区，面临战火的威胁要好。"
 
 alg.66.t:0 "新村发生暴动！"
 alg.66.d:0 "前方记者在阿尔及利亚发来报告。阿尔及利亚政府为避免解放阵线与山地居民的接触，而将这些地区的居民迁移至政府修建的新村，但新村计划遭到居民的强烈抵制！\n大批民众聚集在新村的管理中心，痛批这个地方简直是集中营！没有饮用水、住房墙壁开裂又闷热，缺少药品和医院，民众在监狱般的环境中生存，还不如回到解放阵线控制区！\n大批新村居民与警察发生激烈冲突，新村管理人员呼吁尽快为新村修建医院和学校！"
 
 alg.67.t:0 "戴高乐访问阿尔及利亚"
 
 alg.68.t:0 "法国共产党公开反对阿尔及利亚战争"
 
 alg.69.t:0 "法国爆发反对阿尔及利亚战争的示威游行"
 
 alg.70.t:0 "北约会议讨论阿尔及利亚局势"
 
 alg.80.t:0 "法军暴行再次引起关注"
 alg.80.t:0 "法国知名女权主义者西蒙娜·波伏娃和突尼斯社会运动家吉赛尔再次向法国媒体曝光了一则法军在阿尔及利亚的害人暴行：年仅20岁的阿尔及利亚女性Djamila Boupacha因涉嫌炸弹袭击，被法军逮捕后，遭到强奸和杀害。"
 
 alg.67.t:0 "《121人宣言》"
 
 alg.67.t:0 "戴高乐正式宣布接受阿尔及利亚自决"
 
 alg.67.t:0 "军方反对放弃阿尔及利亚！"
 
 alg.67.t:0 "右翼分子反对放弃阿尔及利亚！"
 
 alg.67.t:0 "阿尔及利亚黑脚人发动暴乱！"
 
 alg.67.t:0 "黑脚暴乱被镇压"
 
 alg.67.t:0 "首次有关阿尔及利亚问题的公投"#1961年1月#