 ita.1.t:0 "的里雅斯特空难"
 ita.1.d:0 "一架美国空军道格拉斯C-47B运输机在意大利与南斯拉夫交接的的里雅斯特地区坠毁，尽管调查认为此事与南斯拉夫无关，但他为的里雅斯特的紧张局势火上浇油。的里雅斯特地区原为意大利领地，二战后由美英法苏盟军托管。西方国家希望在的里雅斯特建立一个独立国家，或归还意大利，但苏联支持下的南斯拉夫希望吞并该地区。"
 ita.1.a:0 "确定"
 
 ita.3.t:0 "意大利大选在即"
 ita.3.d:0 "1948年的意大利共和国议会选举即将开始，代表左翼势力的意大利共产党将对阵代表保守势力的天主教民主党，这将是一次决定意大利未来的选举。"
 ita.3.a:0 "支持加斯佩里先生领导的天主教民主党，维护意大利的传统。"
 ita.3.b:0 "支持托格里亚蒂先生的意大利共产党，让意大利走社会主义道路。"
 
 ita.7.t:0 "左派示威游行"
 ita.7.d:0 "意大利大选以天主教民主党的胜利结束，但部分左派激进分子不服这一结果。他们要求重新举行选举。"
 ita.7.a:0 "接受左派的要求。"
 ita.7.b:0 "选举已经结束，没有必要。"
 
 ita.5.t:0 "右派示威游行"
 ita.5.d:0 "意大利大选以共产党的胜利结束，但部分右派激进分子不服这一结果。他们要求重新举行选举。"
 ita.5.a:0 "接受右派的要求。"
 ita.5.b:0 "选举已经结束，没有必要。"
 
 ita.6.t:0 "天主教民主党赢得大选！"
 ita.6.d:0 "经过激烈的角逐，天主教民主党最终赢得了选举，成为议会的多数党派。阿尔契德·加斯贝里成为意大利的总理。他宣布将保护意大利的传统和民主，维护意大利的秩序和现存体制。"
 ita.6.a:0 "正义的意大利万岁！"
 
 ita.7.t:0 "意大利共产党接受选举结果"
 
 ita.8.t:0 "意大利右派党派接受选举结果"
 
 ita.9.t:0 "对意大利局势的关注"
 ita.9.d:0 "意大利大选以共产党的胜利结束，这给欧洲自由国家敲响警钟，共产党的势力在欧洲的不断扩大已经威胁到了我们的利益，而他们夺取意大利政权，意味着他们将继续扩大到地中海一带，这对我们来说是不可接受的，我们的外交和情报部门要求我们尽快进行干涉。"
 
 ita.10.t:0 "[From.GetName]声明抵制意大利选举结果"
 ita.10.d:0 "[From.GetName]宣布抵制意大利选举结果，斥责意大利共产党非法夺取政权。"
 
 ita.11.t:0 "[From.GetName]声明接受意大利选举结果"
 ita.11.d:0 "[From.GetName]宣布认可意大利选举结果，承认了意大利共产党组成的意大利新政府。"
 
 ita.12.t:0 "意大利左派武装暴动！"
 ita.12.d:0 "意大利在天主教民主党赢得选举后，政治局势不断恶化，一些激进的左派团体开始组织武装部队，制造暴动。"
 
 ita.13.t:0 "意大利右派武装暴动！"
 ita.13.d:0 "意大利在共产党赢得选举后，政治局势不断恶化，一些激进的右派团体开始组织武装部队，制造暴动。"
 
 ita.14.t:0 "意大利人民解放军成立！"
 ita.14.d:0 "意大利人民解放军在蒂罗尔的山区宣布成立！这只意大利左派武装得到了苏联和南斯拉夫的支持，宣布进行武装斗争，旨在推翻意大利右派政府！"
 
 ita.15.t:0 "意大利救国军成立！"
 ita.15.d:0 "意大利救国军在那不勒斯宣布成立！这只意大利右派武装得到了英美法西方国家的支持，宣布进行武装斗争，原本在二战后隐退的意大利将领Pietro Badoglio出山担任救国军总司令，旨在推翻意大利共产党政府！"
 
 ita.16.t:0 "意大利内战爆发！"
 ita.16.d:0 "来自意大利的紧急消息！意大利共产党武装在米兰、威尼斯、曼图阿等多个大城市发起暴动，占领了当地政府！意大利共产党宣布，意大利人民解放战争已经开始，他们将武力夺取政权，推翻右翼政府，解放全意大利！"
 
 ita.17.t:0 "意大利内战爆发！"
 ita.17.d:0 "来自意大利的紧急消息！意大利右派武装在那不勒斯、塔兰托、巴勒莫等多个大城市发起暴动，占领了当地政府！意大利救国军宣布，意大利护国战争已经开始，他们将武力推翻共产党，解放全意大利！"
 
