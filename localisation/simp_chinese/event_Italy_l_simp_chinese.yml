 ita.29.t:0 "[From.GetName]拒绝和谈"
 
 ita.30.t:0 "意大利共产党赢得大选！"
 ita.30.d:0 "经过激烈的角逐，意大利共产党最终赢得了选举，成为议会的多数党派。意共总书记帕尔米洛·托格里亚蒂成为意大利的总理。他宣布成立一个社会主义的政府，并将领导意大利走社会主义路线。"
 ita.30.a:0 "人民的意大利万岁！"
 
 ita.31.t:0 "意大利各方在米兰签订停火协议"
 
 ita.32.t:0 "我们已难以进行战争"
 
 ita.33.t:0 "意大利各方在罗马签订停火协议"
 
 ita.34.t:0 "君主主义者的暴动"
 
 ita.35.t:0 "维托里奥·埃马努埃莱三世去世"
 ita.35.d:0 "意大利末代国王维托里奥·埃马努埃莱三世今日在亚历山大港逝世，终年78岁。尽管其执政期间曾默许法西斯上台，意大利政府仍批准将灵柩运回都灵，举行降半旗的国葬仪式。\n葬礼在苏佩尔加教堂举行，数千民众沿街肃立。覆盖着三色旗的灵柩经过时，有人行法西斯举手礼被警察制止，更多人则沉默以对。前王室成员悉数出席，但现任共和国总统和政府官员均未到场，仅派代表献花。\n流亡的翁贝托王储对记者表示："我们尊重人民选择共和的决定。"其表态被视作萨伏依王朝对1946年公投结果的最终承认。历史学家指出，这场葬礼实为双重告别——既是送别一位争议君主，也是为意大利六百年的君主制画上句号。灵柩最终安葬在家族教堂，碑文仅简单镌刻着名字与生卒年月。"
 ita.35.a:0 "人民的意大利万岁！"
 
 ita.36.t:0 "对意大利和平协约"
 ita.36.d:0 "意大利政府与英、法、美、苏等国签订和平协约，标志着意大利与各交战国战争状态正式结束，意大利恢复正常外交与政治运作，但依然对意大利的军事发展和法西斯运动作出一定限制。"
 
 ita.37.t:0 "关于修改意大利和平协约的建议"
 
 ita.38.t:0 "意大利和平协约修订"
 
