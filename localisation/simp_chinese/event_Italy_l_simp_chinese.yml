 ita.75.t:0 "夺取的里雅斯特的建议"
 ita.75.d:0 "随着西方列强干涉意大利战事，我们与被占领的的里雅斯特的边境愈发紧张。英军开始在该地区增加军队，随时有可能从背后捅我们一刀，我们的军事委员会建议我们主动出击，攻占的里雅斯特，消灭这一后背威胁，同时也能大大振奋我们的士气。/n同时我们也需要提醒，南斯拉夫也对的里雅斯特虎视眈眈，如果我们放弃的里雅斯特，南斯拉夫就会将其占领，不过我们也可以提出邀请南斯拉夫一同攻击的里雅斯特，作为回报，我们承认其对里耶卡半岛的主权。"
 
 ita.76.t:0 "意大利解放军攻击的里雅斯特！"
 ita.76.d:0 "意大利共产党的武装部队对英国占领下的的里雅斯特自由邦发起进攻，并与驻扎此地的英军发生激烈交火！伦敦政府斥责意大利共产党违背二战后签署的的里雅斯特相关协议，宣称将采取行动保护的里雅斯特！"
 
 ita.77.t:0 "攻击的里雅斯特的建议"
 ita.77.d:0 "意大利共产党军队已采取行动进攻的里雅斯特，我们应当采取行动进行支持，如果两国军队能够合作攻下的里雅斯特，那么我们或许可以让意大利共产党政府在里耶卡问题上退步。"
 
 ita.78.t:0 "南斯拉夫军队进攻的里雅斯特！"
 ita.78.d:0 "在意大利共产党军队向的里雅斯特发起入侵后，南斯拉夫军队也从东面向的里雅斯特发起进攻！"
 
 ita.79.t:0 "意大利军队攻占的里雅斯特！"
 ita.79.d:0 "英军在的里雅斯特溃退！在意大利军队的猛烈进攻下，英军被迫撤离的里雅斯特！"
 
 ita.80.t:0 "意大利解放军攻占那不勒斯！"
 ita.80.d:0 "意大利共产党取得重大进展，解放军已宣布攻下右翼武装的驻地那不勒斯，救国军的残余武装向南撤退"
 
 ita.81.t:0 "意大利解放军攻占卡坦扎罗！"
 ita.81.d:0 "意大利共产党取得重大进展，解放军已宣布攻下意大利南部城市卡坦扎罗，意大利救国军的残余武装不得不跨海向西西里岛、马耳他和撒丁岛撤离。"
 
 ita.82.t:0 "意大利军政府撤往撒丁岛！"
 ita.83.t:0 "随着意大利共产党的军队解放整个意大利半岛，意大利右翼势力纷纷向撒丁岛撤退，意大利内战以共产主义的胜利告终！"
 
 ita.90.t:0 "意大利军政府的成立"
 
 ita.100.t:0 "教宗庇护十二世逝世"
 ita.100.d:0 "天主教宗庇护十二世于今日在冈道夫堡逝世，享年82岁。这位在位19年的精神领袖，曾带领教会度过二战浩劫，其逝世引发全球天主教徒哀悼。\n庇护十二世晚年深受健康问题困扰，最后一次公开露面是上月为卢尔德圣母像祝圣。他在战时保护犹太人的事迹广受赞誉，但后期对共产主义的强硬立场也引发争议。葬礼将于三日后在圣彼得大教堂举行，预计百万人将前往瞻仰遗容。\n在妥善处理庇护十二诗葬礼之后，梵蒂冈枢机主教团将通过秘密选举，产生下一任教宗。"
 
 ita.101.t:0 "约翰二十三世接任天主教宗"
 ita.101.d:0 "梵蒂冈枢机团经过四轮投票，威尼斯宗主教、安杰洛·若瑟·龙嘉利枢机当选新任教宗，尊号约翰二十三世。\n新任教宗约翰二十三世以温和开明著称，就任后立即呼吁"更新教会"。观察家注意到，这位77岁的牧首在阳台上用多种语言祝福民众，打破传统只用拉丁语的惯例。其农民出身和战时救助难民的经历，被视为教会拥抱现代社会的信号。\n暮色中的圣彼得广场上，烛光与祈祷声交织，信徒们期待着一个新时代的到来。"
 
 ita.105.t:0 "埃特纳火山喷发"
 ita.105.d:0 "欧洲最高活火山埃特纳火山今日凌晨发生小规模喷发，喷出大量火山灰和熔岩。意大利民防部门迅速启动应急预案，安全撤离周边三个村庄的2000余名居民，目前未报告严重伤亡。\n火山观测站记录显示，此次喷发持续约6小时，熔岩流最远推进至海拔1800米处。卡塔尼亚机场因能见度不足暂时关闭，飘落的火山灰覆盖了附近橄榄园。当地居民表示，火山轰鸣声"像百辆火车同时经过"，夜空被岩浆映成暗红色。\n地质专家指出，这是埃特纳火山近十年来最活跃的一次喷发，但属正常地质活动范畴。政府已设立临时安置点，并向受灾农户发放补偿金。随着火山活动减弱，部分居民在警方护送下返家抢救财物，带回的影像显示，熔岩在自家后院凝固成狰狞的黑色雕塑。"
 
 
 ita.110.t:0 "1960年奥运会举办地即将揭晓"
 ita.110.d:0 "随着1952年奥运会落下帷幕，1960年夏季奥林匹克运动会的举办地也将揭晓。意大利首都罗马宣布参加竞选，以证明意大利以走出法西斯独裁统治和第二次世界大战的阴影。而与罗马竞争的最大对手是瑞士第四大城市洛桑。"
 
 ita.111.t:0 "罗马获得奥运会举办权！"
 ita.111.d:0 "国际奥委会今天正式宣布，1960年第十七届国际奥林匹克运动会的主办权落地意大利罗马！消息宣布后，意大利全国沸腾，罗马、米兰、佛罗伦萨等地挤满了高举三色旗庆祝的人群。意大利总理向国际奥委会和国际社会表达了祝贺与感谢，并表示，这是意大利拜托法西斯主义阴影，重新回归国际社会的体现，并补足了1908年意大利王国被迫放弃奥运会主办权的遗憾。"
 
 ita.112.t:0 "第17届国际奥林匹克运动会在罗马开幕！"
 ita.112.d:0 "随着烟花和彩旗飞舞在千年古城的天际线，第十七届国际奥林匹克运动会在意大利的首都、欧洲文明之祖——罗马城盛大开幕。这次奥运会是首次全程进行电视直播的奥运会开幕式，在无数观众的注目下，火炬手手持具有古罗马风格的火炬，迎接刚刚从西西里岛送来的奥运圣火，跑过圣天使城堡和罗马斗兽场，最终进入体育场，点燃圣火，宣布了奥运会的正式开始。作为历史上首次全程电视直播的奥运盛会，美国广播公司买下了罗马奥运会的赛事直播权。"
 
 ita.113.t:0 "丹麦奥运选手不幸丧生！"
 ita.113.d:0 "来自罗马的图发消息！在今天举办的罗马奥运会自行车赛事上，丹麦选手克努德·埃内马克·杨森因兴奋剂影响，加之比赛当日34摄氏度的高温天气，导致身体严重虚脱并从自行车上摔下，紧急送医后抢救无效去世，年仅23岁，克努德因此成为历史上第二位在奥运赛事中死亡的选手。"
 
 ita.114.t:0 "中华民国获得首枚奥运奖牌！"
 ita.114.d:0 "罗马消息，在今天举行的国际奥运会十项全能比赛中，来自台湾的原住民裔选手杨传广代表中华民国获得一枚田径银牌，这是中华民国的首枚奥运奖牌，也是本届奥运会上亚洲运动员获得的第一枚田径奖牌。"
 
 ita.115.t:0 "希腊风帆代表队获得金牌。"
 ita.115.d:0 "今天举行的罗马奥运会的风帆船竞速比赛中，年仅20岁的希腊王国王储康斯坦丁，与另外两名希腊运动员组队参赛，最终以优异成绩赢得金牌。"
 
 ita.116.t:0 "意大利奥运会宣告落幕。"
 ita.116.d:0 "随着最后一项比赛结束，为期一个多月的第十七届奥林匹克运动会正式落下帷幕，圣火熄灭，罗马市长将五环之旗交给日本东京——1964年奥运会的主办地。本次奥运会，苏联以103枚奖牌的成绩名列榜首，美国队获得71枚奖牌位居第二，东道主意大利以36枚奖牌的成绩位居第三。"
 
 ita.117.t:0 "的里雅斯特号挑战马里亚纳海沟。"
 ita.117.d:0 "意大利和瑞士合作开发的科考潜艇的里雅斯特号，已从马里亚纳群岛关岛出发，前往海底的挑战者深渊——马里亚纳海沟的最深处。意大利海洋学家雅克·皮卡德与唐·沃尔什一同下潜。4小时47分钟后，的里雅斯特号抵达海地11521米处，这是人类目前为止历史上下潜至海底的最深度。在海底停留了20分钟后，的里雅斯特号开始上升，最终花了3小时回到海面。雅克·皮卡德宣称他在海底见到了疑似比目鱼的生物，并判断马里亚纳海沟海底可能分布着硅藻泥。这次探险将成为海洋学上的里程碑。"
 
 
 
 ita.118.t:0 "希腊风帆代表队获得金牌。"
 ita.118.d:0 "今天举行的罗马奥运会的风帆船竞速比赛中，年仅20岁的希腊王国王储康斯坦丁，与另外两名希腊运动员组队参赛，最终以优异成绩赢得金牌。"