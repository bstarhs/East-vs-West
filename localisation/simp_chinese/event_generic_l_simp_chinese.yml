 gen.90.t:0 "[FROM.GetName]宣布支持[ROOT.GetName]政府维稳"
 gen.90.d:0 "[FROM.GetName]领导人[FROM.GetLeader]宣布，该国将坚定支持[ROOT.GetName]政府反对共产主义和无政府主义者的军事行动。"
 gen.90.a:0 "确定。"
 
 gen.91.t:0 "[FROM.GetName]宣布推动社会改革"
 gen.91.d:0 "[FROM.GetName]政府颁布最新的社会改革方案，呼吁清除依然广泛存在于该国社会以文化中的陋习，提倡社会习俗的文明化和现代化。"
 gen.91.a:0 "确定。"
 
 gen.92.t:0 "[FROM.GetName]宣布给予妇女选举权"
 gen.92.d:0 "[FROM.GetName]政府颁布了一项具有历史意义的新法案，根据法案，符合条件的成年女性将获得选举权。"
 gen.92.a:0 "确定。"
 
 gen.93.t:0 "穆斯林抗议改革！"
 gen.93.d:0 "穆斯林发起了一场示威游行，抗议最近的社会改革中给予妇女选举权的决议，认为这违背了伊斯兰教义。"
 gen.93.a:0 "确定。"
 
 gen.94.t:0 "天主教会抗议改革！"
 gen.94.d:0 "天主教会发起了一场示威游行，抗议最近的社会改革中给予妇女选举权的决议，认为这违背了传统的基督教道德。"
 gen.94.a:0 "确定。"
 
 gen.95.t:0 "[FROM.GetName]宣布进行农业集体化"
 gen.95.d:0 "[FROM.GetName]政府颁布农业集体化法案，要求全国各地将土地进行集中管理和分配，希望以此增加粮食产量。"
 gen.95.a:0 "确定。"
 
 gen.96.t:0 "[FROM.GetName]政府颁布关于经济体制改革的决定"
 gen.96.d:0 "[FROM.GetName]政府宣布对现有的企业、尤其是国有企业进行改革，包括扩大企业自主权、导入更多的市场调节和民营成分，以及完善亏损国有企业的破产和转让机制。"
 gen.96.a:0 "确定。"
 
 gen.97.t:0 "[FROM.GetName]颁布新的宪法"
 gen.97.d:0 "[FROM.GetName]颁布了新的宪法，成立了议会、内阁和首相职位，然而，君主依然保留着巨大的权力，不仅内阁、首相和议会选举及成立需要君主的承认，且君主依然可以随时解散内阁和议会，该国实际上进入了一个二元君主立宪的制度下。"
 
 gen.98.t:0 "[FROM.GetName]成立临时内阁"
 gen.98.t:0 "[FROM.GetName]政府宣布成立该国第一个内阁，但该内阁的所有成员均由君主任命。"
 
 gen.99.t:0 "[FROM.GetName]颁布新的宪法"
 gen.99.d:0 "[FROM.GetName]颁布了新的宪法，成立了议会、内阁和首相职位，并计划通过选举产生新的议会参议员和内阁，这是该国历史上的重要时刻，标志着君主正在逐渐向公众放出自己的权力。"
 
 gen.100.t:0 "[FROM.GetName]成立新的党派"
 gen.100.d:0 "[FROM.GetName]国王的支持下，该国成立了一个新的党派并迅速崛起，并在最近一次议会选举中获得优势。很显然，这个新的党派只是国王陛下的傀儡政党，作为他在议会和政界的代理人。"
 
 gen.101.t:0 "[FROM.GetName]颁布新的法律"
 gen.101.d:0 "[FROM.GetName]政府颁布新的法律，要求全全国所有的公共场合都必须悬挂伟大的[FROM.GetLeader]的肖像，以示对国家领袖的敬仰和爱戴。"
 
 gen.102.t:0 "[FROM.GetName]政府公布君主颂歌"
 gen.102.d:0 "[FROM.GetName]政府颁布了新的君主颂歌，要求全国各地在升旗仪式、公共场合活动时，都要演唱君主颂歌。"
 
 gen.103.t:0 "[FROM.GetName]颁布君主冒犯法"
 gen.103.d:0 "[FROM.GetName]颁布君主冒犯法，出言不逊侮辱和抨击该国国王的行为将被视作刑事犯罪。"
 
 gen.104.t:0 "有刁民冒犯我们伟大的国王"
 gen.104.d:0 "有刁民出言不逊，发表了冒犯我们国王陛下的言论，我们该如何处理？"
 gen.104.a:0 "让他付出代价"
 gen.104.b:0 "不必理会"
 
 gen.105.t:0 "[FROM.GetName]发生君主冒犯案件"
 gen.105.d:0 "[FROM.GetName]最高法院最近判处一个罪犯监禁，因为他发表了抨击该国国王的言论。这一事件引起国际社会广泛关注，许多民主国家批评[FROM.GetName]践踏公民言论自由的权力。"
 
 gen.106.t:0 "[FROM.GetName]发生君主冒犯案件"
 
 gen.107.t:0 "[FROM.GetName]废除首相职务"
 gen.107.d:0 "[FROM.GetName]政府颁布新的宪法，正式宣布废除内阁首相的职务，该国君主将重新掌握国家行政大权，使该国重新回到了君主专制的体制下。"
 
 gen.108.t:0 "[FROM.GetName]自由党的崛起"
 gen.108.d:0 "在最近的一次选举中，自由主义党派获得了[FROM.GetName]议会的优势票数，我们认为自由主义将在未来主导该国的政治局势。"
 
 gen.109.t:0 "[FROM.GetName]社会民主党的崛起"
 gen.109.d:0 "在最近的一次选举中，社会民主主义党派获得了[FROM.GetName]议会的优势票数，我们认为社会民主主义将在未来主导该国的政治局势。"
 
 gen.110.t:0 "[FROM.GetName]宣布给予妇女投票权"
 gen.110.d:0 "[FROM.GetName]政府颁布法律，宣布允许妇女获得投票选举的机会，这意味着该国将致力于消除性别歧视，朝社会平等迈进一步。"
 
 gen.111.t:0 "[FROM.GetName]宣布给予少数民族投票权"
 gen.111.d:0 "[FROM.GetName]政府颁布法律，宣布允许少数民族获得投票选举的机会，这意味着该国将致力于消除民族歧视，朝社会平等迈进一步。"
 
 gen.112.t:0 "[FROM.GetName]宣布给予文盲投票权"
 gen.112.d:0 "[FROM.GetName]政府颁布法律，宣布允许学历较低的公民获得投票选举的机会，这意味着该国将致力于消除文化歧视，朝社会平等迈进一步。"
 
 gen.113.t:0 "[FROM.GetName]宣布给予青年投票权"
 gen.113.d:0 "[FROM.GetName]政府颁布法律，宣布允许十八岁以上的所有公民获得投票选举的机会，这意味着该国将致力于消除社会歧视，朝社会平等迈进一步。"
 
 gen.114.t:0 "[FROM.GetName]宣布接纳工会"
 gen.114.d:0 "[FROM.GetName]颁布法律，宣布工会合法化，允许工人通过组织和参与工会来保护自己的权益。"
 
 gen.115.t:0 "[FROM.GetName]颁布劳动者权益法"
 gen.115.d:0 "[FROM.GetName]颁布劳动者权益法，宣布将通过实行工作时间限制、加班补贴、工伤补贴和社会保障的形式来保护工人的合法权益。"
 
 gen.116.t:0 "[FROM.GetName]政府与同性恋者代表会谈"
 gen.116.d:0 "[FROM.GetName]政府官员最近与几名同性恋者进行了对话，并表示政府正考虑承认同性恋是一种正常现象而非疾病，这引起了该国的广泛讨论。"
 
 gen.117.t:0 "天主教反对与同性恋群体的接触"
 gen.117.d:0 "天主教徒发起示威游行，反对政府与同性恋者进行接触，并谴责政府向这些违背社会道德和人类本能的怪胎屈服。"
 
 gen.118.t:0 "穆斯林反对与同性恋群体的接触"
 gen.118.d:0 "穆斯林发起示威游行，反对政府与同性恋者进行接触，并谴责政府向这些违背社会道德和人类本能的怪胎屈服。"
 
 gen.119.t:0 "基督教反对与同性恋群体的接触"
 gen.119.d:0 "基督教会发起示威游行，反对政府与同性恋者进行接触，并谴责政府向这些违背社会道德和人类本能的怪胎屈服。"
 
 gen.120.t:0 "[FROM.GetName]宣布接纳移民"
 gen.120.d:0 "[FROM.GetName]政府宣布，该国已经决定接受来自海外的移民来本国定居和就业，并承诺平等对待移民。这一决定引起了该国民众的关注和讨论，一些人担心外来移民会抢走他们的工作和带来社会问题。"
 
 gen.121.t:0 "反对移民的游行示威"
 gen.121.d:0 "市民发起示威游行，反对政府开放外来移民的政策。"
 
 gen.122.t:0 "本地居民与移民的冲突"
 gen.122.d:0 "本地居民与移民的冲突"
 
 gen.123.t:0 "[FROM.GetName]政府与伊斯兰党接触"
 gen.123.d:0 "[FROM.GetName]的高级官员与最近成立的伊斯兰党进行了接触，当局似乎有意支持伊斯兰党扩大政治影响力。"
 
 gen.124.t:0 "伊斯兰教在[FROM.GetName]的崛起"
 gen.124.d:0 "来自[FROM.GetName]的报道，伊斯兰主义的意识形态正在该国获得影响力。该国的伊斯兰主义者反对违背伊斯兰教义的政治势力，并呼吁政府回到古兰经上治理国家。"
 
 gen.125.t:0 "抵制伊斯兰政治的示威游行"
 gen.125.d:0 "许多市民和知识分子发起示威游行，反对伊斯兰党不断扩大的政治影响力。"
 
 gen.126.t:0 "[FROM.GetName]伊斯兰党在大选中落败"
 gen.126.d:0 "伊斯兰党在[FROM.GetName]大选中铩羽而归，获得的票数不足以进入议会。"
 
 gen.127.t:0 "[FROM.GetName]伊斯兰党在大选中取胜"
 gen.127.d:0 "伊斯兰党在[FROM.GetName]大选中大获全胜，拿下大量选票成为议会中的强势政党，毫无疑问，伊斯兰主义者将在未来很长一段时间内主导该国的政治局势。"
 
 gen.128.t:0 "[FROM.GetName]接见伊斯兰乌里马代表"
 gen.128.d:0 "[FROM.GetName]政府官员接见了伊斯兰教乌里马代表团，舆论认为这是该国政府积极支持伊斯兰教扩大政治影响力的体现。"
 
 gen.129.t:0 "[FROM.GetName]官员出席清真寺礼拜"
 gen.129.d:0 "[FROM.GetName]政府官员最近公开前往清真寺出席礼拜活动，舆论认为这是该国政府积极支持伊斯兰教扩大政治影响力的体现。"
 
 gen.130.t:0 "[FROM.GetName]伊斯兰政权的成立！"
 
 gen.131.t:0 "抵制伊斯兰政权的示威游行！"
 gen.131.d:0 "新成立的[FROM.GetName]政权并未能获得所有人的认可，反对伊斯兰政教政权的群众发起示威游行，并与警察爆发对峙！"
 
 gen.132.t:0 "[FROM.GetName]镇压示威游行！"
 gen.132.d:0 "[FROM.GetName]警察暴力驱散了进行示威游行反对伊斯兰政权的示威者，多名示威者受伤或被捕。" 
 
 gen.133.t:0 "警惕[FROM.GetName]的伊斯兰崛起"
 
 gen.134.t:0 "[FROM.GetName]对我国的伊斯兰崛起感到不安"
 
 gen.135.t:0 "[FROM.GetName]设立宗教法庭"
 gen.135.d:0 "[FROM.GetName]政府宣布，该国将废除现有的一系列司法机构，设立专门的伊斯兰法庭，法庭将根据古兰经的训示和沙里亚法学，处置各种案件，尤其是审判违背伊斯兰教法的异教徒和叛教者。"
 
 gen.136.t:0 "[FROM.GetName]颁布道德法案"
 gen.136.d:0 "[FROM.GetName]政府宣布，该国已正式颁布基于古兰经和沙里亚教法的社会道德法案，要求全体公民遵从古兰经的意志，让自己的行为和举止符合伊斯兰的教义。"
 
 gen.137.t:0 "[FROM.GetName]宣布禁止女性接受教育"
 gen.137.d:0 "[FROM.GetName]政府宣布，从即日起，女性将不得接受公立教育，所有公立学校禁止女性进入，女性只能通过清真寺接受教育。"
 
 gen.138.t:0 "[FROM.GetName]宣布强制女性带头巾"
 gen.138.d:0 "[FROM.GetName]政府宣布，从即日起，所有女性进出公共场合，必须佩戴头巾遮住头发和脸部，违者将处以严厉处罚。"
 
 gen.139.t:0 "[FROM.GetName]设立乌里马最高会议"
 gen.139.d:0 "[FROM.GetName]正式成立乌里马最高会议，这一机构由伊斯兰教法学者和知名的宗教领袖组成，以监督政府和司法机关的行为是否符合古兰经的意志。"
 
 gen.140.t:0 "[FROM.GetName]与基督教教会接触"
 gen.140.d:0 "[FROM.GetName]领导人[FROM.GetLeader]，最近与基督教会的关系越走越近，并经常表态支持教会的主张，例如反对同性恋，反对堕胎和反共产主义，舆论认为他可能试图通过支持教会的保守主义政策，以争取宗教信徒和保守人士的支持。"
 
 gen.141.t:0 "反对教会介入政治的示威游行"
 gen.141.d:0 "[FROM.GetName]爆发了示威游行，反对政府与基督教会关系过于亲密，认为这会导致政府的政策不断趋向保守。"
 
 gen.142.t:0 "[FROM.GetName]政府镇压游行"
 gen.142.d:0 "[FROM.GetName]警察暴力驱散了进行示威游行反对反对教会介入政治的示威者，多名示威者受伤或被捕。" 
 
 gen.143.t:0 "[FROM.GetName]领导人出席弥撒"
 
 gen.144.t:0 "反对教会介入政治的示威游行"
 
 gen.145.t:0 "[FROM.GetName]与天主教教会接触"
 gen.145.d:0 "[FROM.GetName]领导人[FROM.GetLeader]，最近与天主教教会的关系越走越近，并经常表态支持教会的主张，例如反对同性恋，反对堕胎和反共产主义，舆论认为他可能试图通过支持教会的保守主义政策，以争取宗教信徒和保守人士的支持。"
 
 gen.146.t:0 "[FROM.GetName]与东正教教会接触"
 gen.146.d:0 "[FROM.GetName]领导人[FROM.GetLeader]，最近与东正教教会的关系越走越近，并经常表态支持教会的主张，例如反对同性恋，反对堕胎和反共产主义，舆论认为他可能试图通过支持教会的保守主义政策，以争取宗教信徒和保守人士的支持。"
 
 gen.147.t:0 "[FROM.GetName]与英国国教教会接触"
 gen.147.d:0 "[FROM.GetName]领导人[FROM.GetLeader]，最近与英国国教教会的关系越走越近，并经常表态支持教会的主张，例如反对种族隔离，主张有限的社会改革和与西方国家关系的改善，舆论认为他可能试图通过支持教会的亲西方主义政策，以争取宗教信徒和亲西方人士的支持。"
 
 gen.148.t:0 "[FROM.GetName]与路德宗教会接触"
 gen.148.d:0 "[FROM.GetName]领导人[FROM.GetLeader]，最近与路德宗教会的关系越走越近，并经常表态支持教会的主张，例如反对种族隔离，主张有限的社会改革和与西方国家关系的改善，舆论认为他可能试图通过支持教会的亲西方主义政策，以争取宗教信徒和亲西方人士的支持。"
 
 gen.149.t:0 "[FROM.GetName]政府主张建立基督教价值观的社会"
 gen.149.d:0 "[FROM.GetName]领导人[FROM.GetLeader]在最近的讲话中表示，过度的政治现代化已经几乎毁掉了[FROM.GetName]，如果该国要重建秩序，必须回到天主教信仰上，引导人民忠于基督，忠于圣经和圣经的指引。"
 
 gen.150.t:0 "[FROM.GetName]政府宣布在教育中教授圣经"
 gen.150.d:0 "[FROM.GetName]政府正式宣布，该国已立法要求所有学校在课程中教授圣经，以引导该国的年轻一代忠于基督的价值观。"
 
 gen.151.t:0 "[FROM.GetName]政府宣布禁止生物进化论"
 gen.151.d:0 "[FROM.GetName]政府正式宣布，教学、传播和支持所谓《生物进化论》的行为将属于刑事犯罪。保守的[FROM.GetName]政府斥责达尔文是一个被上帝抛弃的猴子，主张天父造人是不可置疑的真理，而伟大的[FROM.GetName]民族，则是上帝创造的种族中最纯洁，最优秀的高等民族。"
 
 gen.152.t:0 "[FROM.GetName]政府宣布禁止地圆学说"
 gen.152.d:0 "[FROM.GetName]政府正式宣布，教学、传播和支持所谓地圆学说的行为将属于刑事犯罪。保守的[FROM.GetName]政府认为，人类生活的大地有上帝创造，完美无缺，地圆论是对圣经上帝创世的公然挑衅。"
 
 gen.153.t:0 "[FROM.GetName]政府颁布道德法案"
 gen.153.d:0 "[FROM.GetName]政府宣布，该国已正式颁布基于基督教教义的社会道德法案，要求全体公民遵从天主的意志，让自己的行为和举止符合基督的教义。"
 
 gen.154.t:0 "[FROM.GetName]政府颁布禁酒令"
 gen.154.d:0 "[FROM.GetName]政府正式宣布，除了象征基督血的葡萄酒以外，即日起，禁止生产任何酒精饮品，否则视作刑事犯罪！"
 
 gen.155.t:0 "[FROM.GetName]呼吁讨伐异教徒"
 gen.155.d:0 "[FROM.GetName]的领导人[FROM.GetLeader]，最近在一次演讲中发表了狂热的言论。[FROM.GetLeader]宣称，[FROM.GetName]作为天主的选民和基督耶稣的使者，有向外传播福音的义务。该国的许多邻国被异端所控制，因此他们有必要拿起剑与盾，发起再一次十字军行动。这一讲话引起了国际社会的高度关注和地区局势的进一步紧张。"
 
 gen.156.t:0 "[FROM.GetName]设立宗教法庭"
 gen.156.d:0 "[FROM.GetName]政府发布了一条震惊世界的行政命令：最高法院将设立宗教法庭，以审判违反该国极端保守的宗教法律的犯人，并可能对犯人处以极刑。"
 
 gen.157.t:0 "[FROM.GetName]邀请教皇阁下访问"
 
 gen.158.t:0 "教皇造访[FROM.GetName]"
 gen.158.d:0 "罗马天主教教宗[VAT.GetLeader]近日受邀访问[FROM.GetName]，当地时间今天早上，教皇阁下的专机已抵达该国首都，并将在几天后的弥撒活动中接见该国的天主教信众。[FROM.GetName]政府在支持天主教影响力政策上十分积极，希望教皇此行能够进一步扩大天主教在该国的影响力。"
 
 gen.159.t:0 "教皇拒绝造访[FROM.GetName]"
 gen.159.d:0 "梵蒂冈外交局发表声明，罗马天主教教宗[VAT.GetLeader]拒绝了[FROM.GetName]政府邀请教宗访问该国的提案。"
 
 gen.160.t:0 "[FROM.GetName]开始镇压穆斯林"
 gen.160.d:0 "[FROM.GetName]政府昨天发布命令，宣布伊斯兰教的存在已经对国家构成威胁，即日起强禁止一切伊斯兰教活动。今天，该国军警强制封锁并关闭清真寺，没收宗教用品，焚烧古兰经，将宗教活动列入刑事犯罪，逮捕了大量阿訇和宗教人士。"
 
 gen.161.t:0 "[FROM.GetName]开始镇压基督徒"
 gen.161.d:0 "[FROM.GetName]政府昨天发布命令，宣布基督教的存在已经对国家构成威胁，即日起强禁止一切基督教活动。今天，该国军警强制封锁并关闭教堂，没收宗教用品，捣毁基督塑像，焚烧圣经，将宗教活动列入刑事犯罪，逮捕了大量牧师和宗教人士。"
 
 gen.160.t:0 "[FROM.GetName]开始镇压拜火教徒"
 gen.160.d:0 "[FROM.GetName]政府昨天发布命令，宣布拜火教的存在已经对国家构成威胁，即日起强禁止一切拜火教活动。今天，该国军警强制封锁并关闭拜火堂，没收宗教用品，将宗教活动列入刑事犯罪，逮捕了大量宗教人士。"
 
 gen.161.t:0 "[FROM.GetName]开始镇压佛教徒"
 gen.161.d:0 "[FROM.GetName]政府昨天发布命令，宣布佛教的存在已经对国家构成威胁，即日起强禁止一切佛教活动。今天，该国军警强制封锁并关闭佛寺，没收宗教用品，捣毁佛像，焚烧佛经，将宗教活动列入刑事犯罪，逮捕了大量僧侣和宗教人士。"
 
 gen.162.t:0 "[FROM.GetName]开始镇压东正教徒"
 gen.162.d:0 "[FROM.GetName]政府昨天发布命令，宣布东正教的存在已经对国家构成威胁，即日起强禁止一切东正教活动。今天，该国军警强制封锁并关闭教堂，没收宗教用品，捣毁基督塑像，焚烧圣经，将宗教活动列入刑事犯罪，逮捕了大量主教和宗教人士。"
 
 gen.163.t:0 "[FROM.GetName]开始镇压新教徒"
 gen.163.d:0 "[FROM.GetName]政府昨天发布命令，宣布新教的存在已经对国家构成威胁，即日起强禁止一切新教活动。今天，该国军警强制封锁并关闭教堂，没收宗教用品，捣毁基督塑像，焚烧路德和加尔文圣经，将宗教活动列入刑事犯罪，逮捕了大量主教和宗教人士。"
 
 gen.164.t:0 "[FROM.GetName]开始审查传媒业"
 gen.164.d:0 "[FROM.GetName]政府宣布，该国将对传媒颁布新的审查法令，对报纸、杂志、广播和电视内容进行审查，禁止一切可能危害国家和社会安全的内容出版和传播，违者将面临刑事诉讼，今日，[FROM.GetName]警察对多家报社进行突击检查，多名报社负责人被捕。"
 
 gen.165.t:0 "一个违背我们政策的报纸"
 gen.165.d:0 "我们发现一批违反传媒政策的团伙，秘密发行一些刊登了敌对信息的报纸期刊，我们已经开始调查并顺藤摸瓜找出了这个团伙的据点，我们如何处理？"
 
 gen.166.t:0 "[FROM.GetName]查封地下报社"
 gen.166.d:0 "[FROM.GetName]警察部门最近查封了一个出版团伙，并逮捕了团伙的成员。该团伙被指控出版危害国家和社会安全。"
 
 gen.167.t:0 "[FROM.GetName]政府开始支持民族主义"
 gen.167.d:0 "[FROM.GetName]政府开始支持民族主义"
 
 gen.168.t:0 "警惕[FROM.GetName]的民族主义崛起"
 gen.168.d:0 "[FROM.GetName]的民族主义政权最近正在不断扩充军力，煽动仇恨和制造地区冲突，我们必须对该国保持高度警惕！"
 
 gen.169.t:0 "[FROM.GetName]对我们的政策感到不安"
 gen.169.d:0 "[FROM.GetName]发布声明，该国对政权的军事扩张感到十分不满，并提出外交抗议！"
 
 gen.170.t:0 "[FROM.GetName]军方成立产业集团"
 gen.170.d:0 "[FROM.GetName]成立了军方控股下的产业集团，其旗下业务涵盖工业、矿业和金融等，使得军方得以参与甚至控制相当的经济活动。"
 
 gen.171.t:0 "[FROM.GetName]发起排外主义狂潮！"
 
 gen.172.t:0 "[FROM.GetName]的排外危机造成我国居民死亡！"
 
 gen.173.t:0 "[FROM.GetName]谴责排外暴行！"
 
 gen.174.t:0 "[FROM.GetName]宣布该国为单一民族！"
 
 gen.175.t:0 "[FROM.GetName]走向军国主义！"
 
 gen.176.t:0 "[FROM.GetName]开始扩军征兵"
 
 gen.177.t:0 "[FROM.GetName]青年团的成立"
 
 gen.178.t:0 "[FROM.GetName]开始控制货币发行量"
 
 gen.179.t:0 "[FROM.GetName]宣布减税"
 gen.179.d:0 "[FROM.GetName]财政部宣布，该国已颁布新的税收政策，减少针对私有企业收取的所得税和营业税，以鼓励私有企业发展和资本投资。"
 
 gen.180.t:0 "[FROM.GetName]开始关闭废弃工厂"
 gen.180.d:0 "[FROM.GetName]财政部宣布，该国已下令停止不能再提供盈利价值的企业和工厂的运行，这些工厂将被解散或出售给私有企业，但工厂雇员如何处理，政府没有给出明确回应。"
 
 gen.181.t:0 "失业工人的强烈不满"
 gen.181.d:0 "首都爆发失业工人示威游行，抗议当局一系列经济改革导致的企业破产、福利削减和严重的失业率，许多下岗工人得不到基本生活保障。示威者要求当局暂停经济改革，并采取措施改善失业工人生活。"
 
 gen.182.t:0 "失业工人发起示威游行"
 gen.182.d:0 "首都爆发失业工人示威游行，抗议当局一系列经济改革导致的企业破产、福利削减和严重的失业率，许多下岗工人得不到基本生活保障。示威者要求当局暂停经济改革，并采取措施改善失业工人生活。目前示威者正和警察紧张对峙中。"
 
 gen.183.t:0 "[FROM.GetName]镇压工人运动"
 gen.183.d:0 "[FROM.GetName]警察暴力驱散了进行示威游行要求改善待遇的工人，多名示威者受伤或被捕。" 
 
 gen.184.t:0 "[FROM.GetName]宣布限制工会运动"
 gen.184.d:0 "[FROM.GetName]政府昨天发布命令，宣布受共产主义影响的罢工和工会运动已经对国家构成威胁，即日起强制解散所有共产主义和左翼团体。今天，该国军警强制解散了共产党等左翼团体的总部，逮捕了大量社会运动家。"
 
 gen.185.t:0 "工会的大规模示威游行"
 gen.185.d:0 "首都爆发工会组织的工人示威游行，抗议当局一系列改革使得工人的政治权益受损。示威者要求当局暂停改革，并采取措施保护工人权益。目前示威者正和警察紧张对峙中。"
 
 gen.186.t:0 "[FROM.GetName]开始削减福利"
 gen.186.d:0 "[FROM.GetName]财政部发表声明，该国已决定削减诸如失业保险、养老保险和教育、医疗上的支出，以缓解该国严重的财政问题。"
 
 gen.187.t:0 "群众对削减福利感到不满"
 gen.187.d:0 "首都爆发群众示威游行，抗议当局一系列削减福利的政策。示威者要求当局暂停改革，以维护民众基本权益和生活保障。目前示威者正和警察紧张对峙中。"
 
 gen.188.t:0 "[FROM.GetName]开始削减行政支出"
 gen.188.d:0 "[FROM.GetName]财政部发表声明，该国已决定削减行政支出，包括裁撤低效的政府部门和官员，并削减公务员薪资，以缓解该国严重的财政问题。"
 
 gen.189.t:0 "[FROM.GetName]颁布新的经济法律"
 gen.189.d:0 "[FROM.GetName]商务部发表声明，该国决定逐步取消针对一些商品的价格补贴和控制政策，以促进市场对经济的作用，以利润刺激生产与消费。"
 
 gen.190.t:0 "[FROM.GetName]改革经济政策"
 gen.190.d:0 "[FROM.GetName]政府财政部宣布，该国已决定基于凯恩斯主义理论全面调整经济政策。该国政府新的经济政策认为，无序的市场竞争只会使得大资本大财团做大，政府应该介入经济活动以进行宏观调控，同时加大财政投入和福利支出，以刺激消费，创造需求。政府将基于行政体系进行经济改革，包括国有化大型企业，增加社会投资和福利政策，以刺激经济和促进社会公平，"
 
 gen.191.t:0 "[FROM.GetName]改革经济政策"
 gen.191.d:0 "[FROM.GetName]政府财政部宣布，该国已决定基于新自由主义全面调整经济政策。该国政府新的经济政策认为，政府高度干预经济导致市场失去活力，政府腐败和失去竞争力的企业使得经济增长放缓。政府将基于市场经济进行改革，减少政府干预、扩大市场的作用，削减税收和财政支出，出售低效的企业，"
 
 gen.192.t:0 "[FROM.GetName]颁布国家福利政策"
 gen.192.d:0 "[FROM.GetName]政府发表声明，该国已正是通过了最新的福利政策，将为人民提供一定的社会保障体系，包括失业保险、工伤保险、医疗保险和承担一定的教育支出。[FROM.GetName]政府希望通过改善福利制度，促进社会公平，减少贫富差距，改善中下层人民的生活水平，同时提高群众的可支配收入，以鼓励和刺激消费。"
 
 gen.193.t:0 "[FROM.GetName]推动企业国有化"
 gen.193.d:0 "[FROM.GetName]政府发表声明，该国已经决定将铁路、电力、医疗、交通等产业进行国有化，政府将在不久之后将从事这些产业的主要大企业收购，从而确保政府能够更好的对重要产业进行管理。"
 
 gen.194.t:0 "[FROM.GetName]颁布失业救济法"
 
 gen.195.t:0 "[FROM.GetName]颁布新的旅游支持政策"
 
 gen.196.t:0 "美国与[ROOT.GetName]签订新的军事条约！"
 gen.196.d:0 "[FROM.GetName]政府代表和美国代表已于昨日签署了新的共同防御协定，该国将与美国结为盟友！美国将保护[ROOT.GetName]的领土和国家安全不受侵犯，作为回报，美国将获得在该国驻军的权力。这一条约引起[ROOT.GetName]国内舆论和国际社会的关注，[ROOT.GetName]政府表示，该国将在自由世界庇护下，对抗共产主义和极权主义，但民间认为，这一条约将危害[ROOT.GetName]的主权。"
 
 gen.200.t:0 "[FROM.GetName]宣布走苏联模式的斯大林主义道路！"
 gen.200.d:0 "[FROM.GetName]的共产党总书记[FROM.GetLeader]从苏联访问回来后，似乎成为了苏联政治与经济制度的忠实拥趸。最近他在共产党大会上正式宣布，[FROM.GetName]将开始新的经济改造和发展计划！该国将进行快速的工业化、集体化路线，动员一切可利用的资源，优先发展重工业。[FROM.GetLeader]同志指出：我们将以集体的力量，为我国的工业化进程铺平道路。在党中央的坚强领导下，[FROM.GetName]的计划委员会已开始着手实行工业化计划，规划工厂建设，培训专业工人，引进苏联的先进生产技术和管理经验。"
 
 gen.201.t:0 "[FROM.GetName]政府颁布关于经济体制改革的决定"
 gen.201.d:0 "[FROM.GetName]政府宣布对现有的企业、尤其是国有企业进行改革，包括扩大企业自主权、导入更多的市场调节和民营成分，以及完善亏损国有企业的破产和转让机制。"
 gen.201.a:0 "确定。"
 
 gen.202.t:0 "[FROM.GetName]政府给予女性独立财产权"
 gen.202.d:0 "[FROM.GetName]政府宣布，该国将正式颁布新的法案，允许女性持有属于自己的私有财产，包括现金、银行存款和不动产等，同时这些财产将得到法律保护，不得被家庭成员中的男性干涉和私吞。该国政府的发言人表示，拥有属于自己的财产是保障女性社会地位的重要体现，同时也希望以此鼓励女性群体参与到经济活动中。"
 
 gen.203.t:0 "[FROM.GetName]领导人抨击反对社会改革的保守分子"
 gen.203.d:0 "[FROM.GetName]领导人[FROM.GetLeader]今日在一次演讲中，严厉地抨击反对妇女权利改革的保守分子，他宣称：我们伟大国家的每一个人，无论性别，都应当积极参与到国家走向繁荣的建设当中。宗教保守势力和其他反对改革的反动分子，正在阻挡我们国家走向光明，我们要严厉谴责这些愚钝的人！"
 
 gen.204.t:0 "[FROM.GetName]妇女协会成立"
 gen.204.d:0 "[FROM.GetName]政府宣布，该国将成立当局支持下的妇女协会，以支持妇女权益改革，维护妇女合法权利。"
 
 gen.205.t:0 "[FROM.GetName]领导人接见妇女代表"
 gen.205.d:0 "[FROM.GetName]领导人[FROM.GetLeader]接见了来自社会各界的解除妇女代表，包括在军警、行政、教育和工业等各部门当中任职的女性代表。[FROM.GetLeader]高度赞扬了这些为国家发展做出贡献的女性。"
 
 gen.206.t:0 "[FROM.GetName]政府颁布反对家庭暴力法案"
 gen.206.d:0 "[FROM.GetName]政府颁布了新的刑法，将家庭暴力纳入刑事犯罪范畴，殴打妻子、孩子等家庭成员者将面临刑事指控。"
 
 gen.207.t:0 "[FROM.GetName]修改婚姻法"
 gen.207.d:0 "[FROM.GetName]政府颁布了新的婚姻法，给予女方提出离婚并分得财产的权力。该国司法部门表示，婚姻平等不仅要保障婚姻自由，也要保障离婚自由的权利。"
 
 gen.208.t:0 "[FROM.GetName]政府颁布就业平等法案"
 gen.208.d:0 "[FROM.GetName]政府颁布了新的就业法案，宣布保障女性从事各种工作的合法权利。"
 
 gen.209.t:0 "[FROM.GetName]政府宣布打击彩礼和嫁妆陋习"
 gen.209.d:0 "[FROM.GetName]政府颁布了新的婚姻法，宣布打击彩礼和嫁妆陋习"
 
 gen.210.t:0 "[FROM.GetName]政府颁布新的就业法案"
 
 gen.211.t:0 "[FROM.GetName]政府颁布新的教育法案"
 gen.211.d:0 "[FROM.GetName]政府宣布，该国将正式颁布新的教育法案，允许女性进入公立学校接受教育，并免除所有学费，该国还将进一步推动更多法律，以保障女性的受教育权，打击教育系统中的性别歧视，同时为无法承担学费的家庭提供帮助。"
 
 gen.212.t:0 "[FROM.GetName]正式颁布新的世俗化宪法"
 
 gen.213.t:0 "反对改革的保守分子的游行示威"
 
 gen.214.t:0 "环保运动的影响力在知识分子中扩大"
 
 gen.215.t:0 "女性权利平权运动的兴起"
 
 gen.216.t:0 "呼吁改革女性权利的示威游行"
 
 gen.217.t:0 "要求给予女性政治权利的示威游行"
 
 
 
 gen.220.t:0 "土地改革引发暴力冲突"
 gen.220.d:0 "某地发生一起因为土地改革引发的暴力事件！农民、地主和政府三方就土地分配问题发生激烈矛盾并大打出手，多人受伤，警察好不容易才维持住秩序。"
 gen.220.a:0 "必须严惩这些暴徒！"
 gen.220.b:0 "息事宁人……"
 
 gen.221.t:0 "农民支持土地改革政策"
 gen.221.d:0 "好消息。在政府的鼓励下，许多在土地改革中收益的农民发起多场庆祝活动，以表达对土地改革的支持，这表明政府通过土地改革争取农民支持的目标获得了重大进展。"
 
 gen.222.t:0 "地主对土地改革感到不满"
 gen.222.d:0 "我们收到了多处来自地主和其他土地私有者的不满，他们通过游行示威等形式反对土地改革，认为土地改革损害了他们的利益，要求政府停止改革或给予他们更多的补偿金。"
 gen.222.a:0 "这已经不是普通的地主了！一定要出重拳！"
 gen.222.b:0 "地主势力太庞大，大丈夫能屈能伸……"
 
 gen.223.t:0 "腐败令土地改革难以推进"
 gen.223.d:0 "我们的调查官员发布了一篇令人惊讶的报告，许多农村地区，土地改革根本没有得到有效的推行，地主与政府官员勾结，通过贿赂来减少甚至不出让土地，政府发放的给地主的补偿金被私吞，无论是农民还是中小地主都对土地改革严重失望。"
 
 gen.224.t:0 "经济建设中的腐败案被曝光！"
 
 gen.225.t:0 "公路建设中的腐败案被曝光！"
 
 gen.226.t:0 "地方政府希望出资购买土地"
 gen.226.d:0 "地方政府没有足够的经费从地主手中购买土地，希望中央政府提供资金来购买土地。而中小地主们表示，如果政府不能给予他们放弃土地的补偿，他们将会把土地出售给更大的地主。"
 
 gen.227.t:0 "共产党介入土地改革"
 gen.227.d:0 "在政府启动土地改革并获得成效后，共产党叛军也给出了自己的土地改革方案。共党宣称，在成立无产阶级政权后，党将为农民提供更多的土地和其他好处，部分农民收到这些宣传影响，希望政府一方能给出比共产党更高的开价。"
 
 gen.228.t:0 "农民希望获得更多的投资"
 gen.228.d:0 "我们收到了一些农民的来信，这些农民首先感谢政府推动的土地改革政策，是他们获得了数量满意的土地，但是，要耕种这些土地，他们还需要更多的工具、种子、牲畜和化肥，有许多农民难以购买这些物品，因此希望政府给予帮助。如果他们无法耕种土地，就只能把获得的土地出卖回给地主。"
 gen.228.a:0 "这当然好事"
 gen.228.b:0 "没钱了……"
 
 gen.229.t:0 "土地改革涉及教会利益"
 
 gen.230.t:0 "[FROM.GetName]土地改革得到推行"
 gen.230.d:0 "[FROM.GetName]的土地改革取得初步成功，由于政府为农民提供资金赎买土地，最终成功从地主手中获取了大量的耕地并分配给没有土地的农民。土地改革的成功使得[FROM.GetName]政府的经济政策得到推行，同时也大大提高了当局的影响力。"
 
 gen.231.t:0 "[FROM.GetName]土地改革以失败告终"
 gen.231.d:0 "[FROM.GetName]政府推行的土地改革已经以失败告终。政府在土地改革政策上畏手畏脚，既无法向地主提供补偿，也不能阻止私有企业、官僚和新兴垄断集团霸占本应该出售给农民的土地，政府收取的耕地最后只不过是从一个地主换给了另一个地主罢了。农民对[FROM.GetName]政府在土地改革上的软弱和无能感到愤怒，当局的威信遭到了严重的削弱。"
 
 
 gen.240.t:0 "[FROM.GetName]共产主义少年先锋队成立！"
 gen.240.d:0 "在[FROM.GetName]首都[FROM.capital.GetName]的广场上，数百名带着鲜艳红领巾的少年队列站着一排又一排，广场上飘荡着鲜艳的国旗和党旗，共产党的主要领导人来到广场，向少年们挥手致意。\n今天是[FROM.GetName]共产主义少年先锋队成立的日子，作为[FROM.GetName]共产党的青年组织，少年先锋队将招收8至14岁的学生进入组织，培养共产主义的接班人。\n[FROM.GetLeader]总书记上台发言，祝贺广场上的孩子们成为第一批加入光荣的少先队的队员，希望他们认真学习，积极劳动，成为对社会主义事业有贡献的青年才俊，不断发展自己的能力，成为共产党的下一任接班人。随后，总书记同志亲自为少先队代表系上红领巾，现场爆发热烈的掌声。"
 
 gen.241.t:0 "[FROM.GetName]宣布解散反对党"
 gen.241.d:0 "[FROM.GetName]政府在巨大的争议下，颁布了新的宪法：从即日起，[FROM.GetName]将成为无产阶级专政的社会主义国家，[FROM.GetName]的政府、群众和企业，都将接受[FROM.GetName]共产党的领导，建设社会主义。而现存的所有党派，将被整合进入共产党领导下的爱国统一战线，而资产阶级和反动阶级支持下的反对党，将被剥夺合法权益并解散！\n许多反对共产党的社会团体已经被警方强制解散！民主党等团体的领导人被逮捕，少部分出逃。"
 
 gen.242.t:0 "首批来自[FROM.GetName]的逃亡者！"
 gen.242.d:0 "《纽约时报》记者今日在东西德边境哨所，见证了[FROM.GetName]首批政治难民的到来。十二名衣衫褴褛的[FROM.GetName]人穿越雷区与铁丝网，在黎明时分跌跌撞撞地扑向西方哨兵。\n一名教师展示着被鲜血浸透的笔记本，里面记录着秘密警察的暴行；几名青年则撕开夹层棉袄，取出揉皱的大学开除通知书——他被指控"收听敌台"。牧师告诉记者，最近三个月已有47人葬身在这片死亡地带。\n西德难民署官员表示，这仅仅是"铁幕逃亡潮的开始"。随着东欧政治清洗加剧，预计将有更多人赌上性命穿越这道"自由与奴役的分界线"。"
 
 gen.243.t:0 "庆祝五一劳动节"
 gen.243.d:0 "在[FROM.GetName]的某个集体农庄，庄员们正在热烈庆祝五一劳动节的到来。这是集体农庄成立之后的一个小丰收，虽然产量仅仅超过了生产指标一点点，但这已经十分值得庆祝。\n集体农庄各处都装饰着红旗，而大门则悬挂了伟大的约瑟夫·斯大林同志，和[FROM.GetLeader]总书记的肖像。一辆苏制吉普车缓缓驶来，走下一名西装革履，胸口别着红旗徽章的男子。他是党中央的代表，前来庆祝集体农庄取得丰收，并视察农庄的工作状态。\n\n咳咳——同志们，同志们，十分感谢你们的欢迎。我谨代表党中央，热烈庆祝你们的生产工作取得了成就，这充分体现了社会主义的优越性，党中央决策的正确性，和我们苏俄兄弟的支援……\n\n党代表十几分钟的发言结束后，人们立刻开始用餐。"
 
 
 
 gen.250.t:0 "[FROM.GetName]的女性权益改革取得成功"
 gen.250.d:0 "在政府大力支持下，[FROM.GetName]的女性权益改革取得了巨大的进步，女性有机会走出家庭的束缚，获得投票权、受教育权和被选举权，参与到政治、经济和社会活动中。"
 
 gen.251.t:0 "穆斯林教士攻击妇女代表"
 gen.251.d:0 "阁下！/n一群疯狂的乌里马教士在一场政治活动中寻衅滋事，他们对正在宣传妇女改革政策的妇女协会代表们破口大骂，侮辱他们是违背古兰经意志的妓女，随后双方爆发了激烈的肢体冲突，现场有人受伤，警察好不容易才将人群分开，很明显此事已经引起媒体关注。"
 gen.251.a:0 "必须严惩这些暴徒！"
 gen.251.b:0 "息事宁人……"
 
 gen.252.t:0 "穆斯林教士与政府官员爆发肢体冲突"
 gen.252.d:0 "我国某地发生的伊斯兰教士与政府官员的严重冲突，教士们反对政府官员宣传世俗化、公立学校和妇女权益，随后双方爆发了激烈的肢体冲突，现场有人受伤，警察好不容易才将人群分开，很明显此事已经引起媒体关注。"
 gen.252.a:0 "必须严惩这些暴徒！"
 gen.252.b:0 "息事宁人……"
 
 gen.253.t:0 "穆斯林教士围攻学校"
 
 gen.254.t:0 "新式女校需要资助"
 gen.254.d:0 "由于观念保守人士在政府工作中普遍存在，我们推动女性接受教育的政策遇到了难题。许多学校拒绝接受女学生，因此有社会运动人士建议由政府资助一座全新的女校。"
 gen.254.a:0 "这当然好事"
 gen.254.b:0 "没钱了……"
 
 gen.255.t:0 "[FROM.GetName]的妇女改革以失败告终"
 gen.255.d:0 "[FROM.GetName]的妇女权益今天宣告解散，这也意味着该国政府以解放妇女为目的执行的一系列政策以失败告终，在宗教保守势力的强大压力下，这个国家走向现代化和世俗化的一切努力付诸东流。"
 
 
 gen.260.t:0 "[FROM.GetName]的教育改革以失败告终"
 gen.260.d:0 "[FROM.GetName]的报纸传媒发表一份报告，宣称该国的公立学校几乎无法招生，绝大部分群众依然选择将孩子送入教会学校，接受宗教教育，这也意味着该国政府以教育世俗化为目的执行的一系列政策以失败告终，在宗教保守势力的强大压力下，这个国家走向现代化和世俗化的一切努力付诸东流。"
 
 gen.261.t:0 "[FROM.GetName]宣布关闭教会学校"
 gen.261.d:0 "[FROM.GetName]政府发布声明，该国将从即日起，禁止和限制学生进入由基督教会和伊斯兰清真寺负责的宗教学校，并要求学生进入政府创办的公立学校，接受现代知识教育。"
 
 gen.262.t:0 "[FROM.GetName]推动新生活"
 
 gen.263.t:0 "来自家长的不满和抗议"
 gen.263.d:0 "今天早上，一大群学生亲属聚集在教育局门口发表他们的不满，政府虽然关闭了宗教学校，却没有建立足够的公立学校，导致许多学生在离开原本的学校之后，却无法进入新的学校接受教育。这些群众要求政府尽快提供更多的教育资源，否则他们将继续将孩子送入教会或清真寺接受宗教教育。"
 
 gen.264.t:0 "公立学校招生潮"
 gen.264.d:0 "我们的教育改革政策得到了群众的积极响应，越来越多的家长选择将孩子送入免费的、水平更先进的政府公办学校。"
 
 gen.265.t:0 "新式学校需要资助"
 gen.265.d:0 "由于观念保守人士在政府工作中普遍存在，我们推动教育世俗化的政策遇到了难题。许多学校拒绝去除宗教教育，保守的教师仍然在课堂上传播上帝造人乃至地球是平的，因此有社会运动人士建议由政府资助一座全新的学校。"
 gen.265.a:0 "这当然好事"
 gen.265.b:0 "没钱了……"
 
 gen.266.t:0 "慈善组织资助新式学校"
 
 gen.267.t:0 "宗教保守团体资助教会学校"
 
 gen.268.t:0 "[FROM.GetName]的教育改革取得成功"
 gen.268.d:0 "在政府大力支持下，[FROM.GetName]的教育改革取得了巨大的进步，宗教典籍正在从人们的学习和社会生活中淡出，取而代之的是自然、科学、历史、政治和艺术。"
 gen.268.a:0 "值得庆祝"
 
 gen.269.t:0 "来自[FROM.GetName]的留学代表团"
 
 gen.270.t:0 "来自[ROOT.GetName]的留学教师回国"
 
 gen.271.t:0 "低效且腐败的教育部门"
 gen.271.d:0 "近期的走访调查，我们惊讶地发现，政府支持成立的许多公立学校，根本没有在运作！这些学校被贪污腐败的官僚占据，花费数十万、数百万建造的教学楼是劣质建筑，政府拨款不翼而飞，教师只能拿到少得可怜的薪水，根本无心工作，家长们也无法忍受学校官员的索贿，不愿意将孩子送进学校！"
 
 gen.280.t:0 "[FROM.GetName]希望我国派遣专家团队"
 gen.280.d:0 "尊敬的[ROOT.GetName]同志们：\n\n我谨代表我国政府，恳请贵国派遣工业专家顾问团，协助我们建设现代化民族工业。当前我国正面临殖民时代遗留的经济困境，亟需在机械制造、化工及能源领域获得技术支持。\n具体请求如下：\n派遣冶金与机械专家指导农机生产线建设\n协助规划年产50万吨的化肥工业体系\n培训本地技术人员掌握自动化设备运维\n我们知道贵国在[ROOT.GetLeader]同志领导下，成功实现了从农业国向工业国的转型。这种自力更生的社会主义经验，正是我们迫切需要的发展智慧。期待通过这项合作，让多瑙河畔的工业火种照亮非洲大陆。请通过驻我国大使馆转达回复。\n此致  敬礼"
 
 
 gen.281.t:0 "[FROM.GetName]同意向我国派遣专家团队"
 gen.281.d:0 "尊敬的[PREV.GetName]同仁：\n\n欣闻贵国建设规划，我国将立即组建由25名专家组成的顾问团，涵盖冶金、化工及机械自动化领域。首批12人将于下月乘专机出发，随行携带我国自主研发的工业设备图纸与操作规程。\n让我们用社会主义的技术结晶，浇灌第三世界兄弟国家的工业之花。\n此致  敬礼"
 
 gen.282.t:0 "[FROM.GetName]婉拒向我国派遣专家团队"
 gen.282.d:0 "尊敬的[PREV.GetName]同仁：\n\n承蒙贵国信任，经我国技术委员会详细评估，目前国内重点工程正处于关键阶段，所有高级专家均需保障本国五年计划实施，短期内难以组建符合贵国需求的完整团队。\n考虑到贵国基础设施尚待完善，建议先行开展技术资料交流。我国愿提供工业建设标准规范及设备图纸，待国内项目缓和后，再优先考虑派遣专家。\n此致  敬礼"
 
 
 
 
 
 gen.999.t:0 "我们赞美您……尊敬的总统阁下！"
 
 gen.999.t:0 "总统发行新的个人传记"
 
 gen.999.t:0 "总统发行新的个人著作"
 
 gen.999.t:0 "的著作在军队中普及"
 
 gen.999.t:0 "议会授予新的尊号"
 
 gen.999.t:0 "首都建立了一座新的雕像"
 
 gen.999.t:0 "首都宣布改名"
 
 gen.999.t:0 "颁布了新的言论管制法案"
 
 gen.999.t:0 "有刁民发表冒犯总统阁下的言论！"
 gen.999.d:0 "我们发现一批违反传媒政策的团伙，秘密发行一些刊登了敌对信息的报纸期刊，我们已经开始调查并顺藤摸瓜找出了这个团伙的据点，我们如何处理？"
 
 gen.999.t:0 "[FROM.GetName]查封地下报社"
 gen.999.d:0 "[FROM.GetName]警察部门最近查封了一个出版团伙，并逮捕了团伙的成员。该团伙被指控出版危害国家和社会安全。"
 
 gen.999.t:0 "建造了一座新的博物馆"
 
 gen.999.t:0 "总统接见军队"
 
 gen.999.t:0 "总统接见工人代表"
 
 gen.999.t:0 "总统接见政治党派代表"
 
 gen.999.t:0 "总统接见知识分子代表"