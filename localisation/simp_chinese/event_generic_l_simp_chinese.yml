l_simp_chinese:
 gen.1.t:0 "美苏首脑会议"
 gen.1.d:0 "[From.GetName]领导人[From.GetLeader]邀请我们到维也纳就国际事务和美苏未来关系进行会谈。"
 gen.1.a:0 "我们接受。"
 gen.1.b:0 "拒绝。"
 
 occupied_countries.1.title:1 "[From.From.GetNameDef]临时政府"
 occupied_countries.1.desc:1 "在我们的占领军与地方民政当局为加强合作与人民顺从经过了长期的协力合作后，我们现在已准备好将[From.From.GetNameDef]的控制权交还给当地政府。这个新政府由我们的同情者组成，并已准备好与我们进行深层次合作。"
 occupied_countries.1.a:1 "祝福他们。"
 occupied_countries.1.b:1 "他们还没有准备好。"
 
 gen.2.t:0 "美苏首脑会议"
 gen.2.d:0 "美国总统 [USA.GetLeader]与苏联领导人 [SOV.GetLeader]在维也纳举行了一次峰会。"
 gen.2.a:0 "Good."
 
 gen.3.t:0 "[From.GetName]拒绝我们的邀请"
 gen.3.d:0 "[From.GetLeader]拒绝了我们关于领导人峰会的邀请，看来他们对世界和平毫无兴趣。"
 gen.3.a:0 "Well."
 
 gen.4.t:0 "镇压叛军行动顺利"
 gen.4.d:0 "我军对叛军的基地和部队进行了搜索与摧毁，取得了很好的战果，一些叛军已经被击溃，撤退到丛林中，他们很长一段时间都不会再出现了。"
 gen.4.a:0 "Good."
 
 gen.5.t:0 "镇压叛军失败！"
 gen.5.d:0 "我们的部队发动了一次搜索行动，袭击了叛军，但他们失败了！叛军打败了我们的部队，缴获了许多武器！"
 gen.5.a:0 "Bad news."
 
 gen.6.t:0 "叛军出现！"
 gen.6.d:0 "一些自由主义者发动武装叛乱！他们袭击了军火库，夺取了枪支，宣告了一场反对我们政府的战争已经开始！"
 gen.6.a:0 "消灭他们！"
 
 gen.7.t:0 "叛军出现！"
 gen.7.d:0 "一些共产主义分子发动武装叛乱！他们袭击了军火库，夺取了枪支，宣告了一场反对我们政府的战争已经开始！"
 gen.7.a:0 "消灭他们！"
 
 gen.8.t:0 "我国已无力支持战争"
 gen.8.d:0 "经过长时间的战争摧残，我国的国力已经透支，我们的经济已经无法再支持这场战争，我们的人民已经怨声载道。"
 gen.8.a:0 "我们不得不退出战争。"
 
 gen.9.t:0 "[From.GetName]向我们求和"
 gen.9.d:0 "[From.GetName]的领导人向我们发来信息，他们的国家已经被战争透支，希望结束这场争端。"
 gen.9.a:0 "我们接受和平。"
 gen.9.b:0 "我们不接受乞求。"
 
 gen.13.t:0 "穆斯林的游行！"
 gen.13.d:0 "穆斯林保守派与乌里玛们发动了示威游行，反对违背伊斯兰教教义的改革。"
 gen.13.a:0 "阻止游行并逮捕领头人。"
 gen.13.b:0 "默许游行。"
 
 gen.14.t:0 "穆斯林的抗议！"
 gen.14.d:0 "穆斯林保守派与乌里玛们向政府发表公开信，指责我国的改革违背了伊斯兰教的教义，穆斯林们要求政府停止过激的改革，否则他们将进行反抗。"
 gen.14.a:0 "真倒霉。"
 
 gen.15.t:0 "我们拥有原子弹！"
 gen.15.d:0 "经过数年的研究开发，我国已经成功拥有了原子弹！这将是我们民族历史上最伟大的一天，它标志着我国跻身世界大国之列，对我们的敌人进行威慑，在国际上拥有更大的话语权。"
 gen.15.a:0 "太棒了。"
 
 gen.16.t:0 "我们是否加入世界大战？"
 gen.16.d:0 "以苏联为首的社会主义阵营已经向西方帝国主义全面开战，第三次世界大战爆发。作为社会主义阵营的一员，我们是否加入战争？"
 gen.16.a:0 "加入社会主义阵线，打败西方帝国主义。"
 gen.16.b:0 "保持中立。"
 
 gen.17.t:0 "我们是否加入世界大战？"
 gen.17.d:0 "以美国为首的自由世界已经向共产主义全面开战，第三次世界大战爆发。作为自由世界的一员，我们是否加入战争？"
 gen.17.a:0 "加入自由世界，打败共产主义暴政。"
 gen.17.b:0 "保持中立。"
 
 gen.22.t:0 "[From.GetName]实现民主转型"
 gen.22.d:0 "[From.GetName]的领导人与反对派召开圆桌会议，就国家未来的道路进行对话。[From.GetName]共产党最终决定放弃一党专政，实现政治多元化，并准备进行议会选举。/n 目前共产党仍处于执政地位，但反对派已经获得合法权和选举权。如果未来的议会选举中共产党仍获得40%以上的支持率，那么他们将继续执政。"
 gen.22.a:0 "一个时代结束了。"
 
 gen.23.t:0 "[From.GetName]大选结束"
 gen.23.d:0 "尽管实现了民主转型，但[From.GetName]共产党政府仍有较大的支持率。在第一次民主选举中，[From.GetName]共产党改编为社会民主党，赢得了大选，继续执政。"
 gen.23.a:0 "一个时代结束了。"
 
 gen.24.t:0 "[From.GetName]大选结束"
 gen.24.d:0 "如同预料的那样，[From.GetName]共产党输掉了大选，反对党赢得选举，组建新政府。[From.GetName]长达数十年的共产党执政时代就此画上句号。"
 gen.24.a:0 "一个时代结束了。"
 
 gen.25.t:0 "反对派的抗议"
 gen.25.d:0 "虽然[From.GetName]共产党赢"
 
 gen.28.t:0 "叛军被击败！"
 gen.28.d:0 "一支叛军向我们的驻军发动了袭击!我军迅速应战，经过激烈战斗，叛军丢下几十具尸体仓皇逃离，我们乘胜追击，找到并清除了叛军的据点。"
 
 gen.27.t:0 "我们遭到叛军袭击!"
 gen.27.d:0 "一支叛军向我们的驻军发动了袭击!我军迅速应战，经过激烈战斗，我们的部队抵挡不住，被迫撤离，驻地内的军火被叛军劫走。"
 
 gen.31.t:0 "领袖讲话"
 gen.31.d:0 "您即将作为党和国家领导人发表一次重要讲话，您打算："
 gen.31.a:0 "赞美劳动阶级。"
 gen.31.b:0 "赞美人民军队。"
 
 gen.32.t:0 "共产党叛乱武装消失。"
 gen.32.d:0 "在我方的大力镇压下，共产党的叛乱武装实力已经大幅削弱，许多叛乱分子不是被消灭就是向我们投降，叛乱已无法再对我们构成威胁。"
 gen.32.a:0 "幸事。"
 
 gen.33.t:0 "穆斯林叛乱武装消失。"
 gen.33.d:0 "在我方的大力镇压下，穆斯林的叛乱武装实力已经大幅削弱，许多叛乱分子不是被消灭就是向我们投降，叛乱已无法再对我们构成威胁。"
 gen.33.a:0 "幸事。"
 
 gen.34.t:0 "[FROM.GetName]请求我们保护。"
 gen.34.d:0 "[FROM.GetName]向我们提出一份军事合作协议，希望我们驻防他们的领土以对抗共产主义威胁。"
 gen.34.a:0 "这是我们的责任。"
 
 gen.35.t:0 "[FROM.GetName]获得独立。"
 gen.35.d:0 "在经历了数百年的帝国主义殖民统治之后，[FROM.GetName]今天终于实现了民族独立。[FROM.GetName]总统[FROM.LeaderName]今天在就职典礼上宣誓，他将带领自己的国家走向光明的未来。"
 gen.35.a:0 "殖民帝国的时代正在瓦解。"
 
 gen.36.t:0 "[FROM.GetName]建立社会主义政府！"
 gen.36.d:0 "经过一系列激烈的权力斗争，[FROM.GetName]共产党最终获得了该国的权利，宣布建立[FROM.GetName]社会主义政权。"
 gen.36.a:0 "一个新的时代"
 
 gen.37.d:0 "[FROM.GetName]战术核弹。"
 
 gen.38.t:0 "[FROM.GetName]开始播放电视新闻"
 gen.38.d:0 "[FROM.GetName]的国营电视台开始播放电视新闻，这为群众提供了获取新闻资讯的新渠道，也有利于该国政府进行政治宣传。"
 gen.38.a:0 "一个新的时代"
 
 gen.39.t:0 "[FROM.GetName]加入不结盟运动"
 gen.39.d:0 "[FROM.GetName]宣布即日起加入不结盟运动，成为不结盟的一员。该国政府认为，在美苏大国争霸的国际环境下，保持中立反而是合理的决定。"
 gen.39.a:0 "确定。"
 
 gen.40.t:0 "[FROM.GetName]寻求与美国接触"
 gen.40.d:0 "[FROM.GetName]领导人在今日的一次讲话中表示，该国政府正寻求与美国建立良好关系，共同对抗“挑战”。"
 gen.40.a:0 "这会把[FROM.GetName]带向何方呢？"
 
 gen.41.t:0 "[FROM.GetName]寻求与社会主义阵营接触"
 gen.41.d:0 "[FROM.GetName]领导人在今日的一次讲话中表示，该国政府正寻求与社会主义阵营建立良好关系，共同对抗“挑战”。"
 gen.41.a:0 "这会把[FROM.GetName]带向何方呢？"
 
 gen.42.t:0 "[FROM.GetName]宣布加入经互会"
 gen.42.d:0 "[FROM.GetName]政府宣布即日起成为经济互助委员会的一员，以从社会主义阵营处获得更多的经济合作与援助。"
 gen.42.a:0 "这会把[FROM.GetName]带向何方呢？"
 
 gen.43.t:0 "[FROM.GetName]与中国签订合作协议"
 gen.43.d:0 "[FROM.GetName]政府今日与中华人民共和国签订了一系列合作协议，从而进一步加强了与北京的关系。"
 gen.43.a:0 "这会把[FROM.GetName]带向何方呢？"
 
 gen.44.t:0 "[FROM.GetLeader]的传记出版"
 gen.44.d:0 "自从[FROM.GetLeader]成为[FROM.GetName]共产党总书记以后，开始恢复各种个人崇拜活动，通过接受勋章、拍摄电影等方式，为自己造势宣传,形成了一种个人崇拜风。\n最近，[FROM.GetLeader]出版了新的个人传记，对此总书记本人表示：“听说大家都说我的自传写得好，那天我也买一本来看一看。”"
 gen.44.a:0 "总书记就是幽默"
 
 gen.45.t:0 "[FROM.GetName]开展大清洗"
 gen.45.d:0 "[FROM.GetName]今日针对军队和政府展开了肃清，以清洗掉党政军中“反党阴谋分子”，大量的军官和官员因为被怀疑里通外国、篡党夺权和被逮捕或处决。"
 gen.45.a:0 "这会把[FROM.GetName]带向何方呢？"
 
 gen.46.t:0 "人道的社会主义"
 gen.46.d:0 "[FROM.GetName]共产党总书记[FROM.GetLeader]在今日的工作会议上发表报告，主张对现有的政治体制进行改革，去除弊病，整顿贪腐，加强民主，实现“人道的社会主义”。这一报告被认为是[FROM.GetName]即将实现政治更新的开始。"
 gen.46.a:0 "这会把[FROM.GetName]带向何方呢？"
 
 gen.47.t:0 "[FROM.GetName]请求援助"
 gen.47.d:0 "[FROM.GetName]向我们发来信息，希望我们给予援助，帮助他们恢复国家发展。"
 gen.47.a:0 "应当给予协助"
 
 gen.48.t:0 "[FROM.GetName]请求加入北约"
 gen.48.d:0 "[FROM.GetName]向我们发来信息，希望能够加入北大西洋公约，成为北约的一员以对抗苏联的威胁。"
 gen.48.a:0 "应当给予协助"
 
 gen.49.t:0 "美国拒绝了我们的请求"
 gen.49.d:0 "美国拒绝了我们加入北大西洋公约组织的请求，他们不认为我们是自由世界的一员。"
 gen.49.a:0 "真倒霉"
 
 gen.50.t:0 "[ROOT.GetName]加入北大西洋公约"
 gen.50.d:0 "[ROOT.GetName]加入北大西洋公约，成为美国保护下的欧洲“自由世界”的成员。"
 gen.50.a:0 "应当给予协助"
 
 gen.51.t:0 "[FROM.GetName]宣布镇压共产党"
 gen.51.d:0 "[FROM.GetName]政府昨天发布命令，宣布共产主义的存在已经对国家构成威胁，即日起强制解散所有共产主义和左翼团体。今天，该国军警强制解散了共产党等左翼团体的总部，逮捕了大量社会运动家。"
 gen.51.a:0 "冷战加剧的体现"
 
 gen.52.t:0 "[FROM.GetName]进行教育改革"
 gen.52.d:0 "[FROM.GetName]政府昨天发布命令，宣布彻底去除宗教在教育中的影响，不允许在教学中增加宗教内容，宗教人士被排除出教育系统。[FROM.GetName]的领导人认为这是国家走向现代化的重要一步。"
 gen.52.a:0 "这会把[FROM.GetName]带向何方呢？"
 
 gen.53.t:0 "穆斯林示威游行"
 gen.53.d:0 "一些保守的穆斯林宗教领袖在国会大楼发起了示威游行，以抗议最近政府进行的一些改革措施。宗教领袖们认为政府的各项措施违背了古兰经的旨意和穆斯林的利益，指责支持改革的官员与外国勾结。/n提高当前执政党的支持率以减少保守势力的抗议"
 gen.53.a:0 "他们太愚昧了。"
 
 gen.54.t:0 "[FROM.GetName]进行妇女司法改革法案"
 gen.54.d:0 "[FROM.GetName]政府通过新法案，给予女性与男性完全平等的法律地位。传统上对女性的偏见被从法律剔除，妇女获得女男性平等的婚姻权，离婚权和财产继承权。这一决定引发了保守宗教势力的不满。"
 gen.54.a:0 "这会把[FROM.GetName]带向何方呢？"
 
 gen.55.t:0 "[FROM.GetName]宣布打击宗教势力"
 gen.55.d:0 "[FROM.GetName]政府发布了新的命令，开始实行打压宗教的严厉政策。[FROM.GetName]最新的法案指责，宗教是野蛮落后的封建残余，是国家走向现代化的阻碍。宗教教会被强制解散，许多教士被逮捕入狱，大量信教群众出逃外国。"
 gen.55.a:0 "这会把[FROM.GetName]带向何方呢？"
 
 gen.56.t:0 "叛军出现！"
 gen.56.d:0 "一些伊斯兰极端分子发动武装叛乱！他们袭击了军火库，夺取了枪支，宣告了一场反对我们政府的战争已经开始！"
 gen.56.a:0 "消灭他们！"
 
 gen.57.t:0 "[FROM.GetName]提议签订《战略武器裁减协议》"
 gen.57.d:0 "随着世界局势不断紧张恶化，[FROM.GetName]政府呼吁签订《战略武器裁减协议》"
 gen.57.a:0 "这是好的。"
 
 gen.58.t:0 "《战略武器裁减协议》"
 gen.58.d:0 "美苏两国政府签订《战略武器裁减协议》减少核武库存以缓解世界紧张局势。"
 gen.58.a:0 "太好了"
 
 gen.59.t:0 "保皇党人发动叛乱！"
 gen.59.d:0 "保皇党人发动叛乱！"
 
 gen.60.t:0 "叛军拒绝谈判！"
 
 gen.61.t:0 "叛军开出条件！"
 
 gen.62.t:0 "叛军放下武器！"
 
 gen.63.t:0 "君主主义运动正在[FROM.GetName]复苏！"
 gen.63.d:0 "由于[FROM.GetName]政府的混乱不堪，群众对[FROM.GetName]现有体制愈发失望，各种政治运动开始发展，其中包括要求废除共和体制，重建君主体制的政党，近年来也不断崛起。"
 
 gen.64.t:0 "[FROM.GetName]宇航局成立！"
 gen.64.d:0 "[FROM.GetName]政府宣布成立宇航局，以发展太空探索事业。"
 gen.64.a:0 "确定。
 
 gen.65.t:0 "[FROM.GetName]宣布进行土地改革！"
 gen.65.d:0 "[FROM.GetName]政府颁布了新的土地法案，以进行土地改革。新的法案将赎买部分地主、种植园主和大企业所垄断的土地资源，并分发给农民，以缓解社会矛盾。"
 
 gen.66.t:0 "农村人口涌入城市"
 gen.66.d:0 "自从我国实行土地改革以来，许多农村地区的居民分到了土地。然而，拥有土地意味着自负盈亏，许多农民获得了土地却不会经营，无法支付成本、购买农具或自行耕种，最终选择放弃土地。许多放弃耕地的农民选择进入城市务工。"
 
 gen.67.t:0 "来自种植园主的不满"
 gen.67.d:0 "代表大种植园利益的议员和党派在议会向政府发难，指责正在进行的土地改革威胁到了他们的利益，要求中止土地改革。"
 
 gen.68.t:0 "[FROM.GetName]的土地改革引发政治矛盾"
 gen.68.d:0 "[FROM.GetName]政府进行的土地改革威胁到了其国内种植园主的利益，也威胁到了联合果品公司的利益。联合果品在参众两院的议员正试图游说美国政府干涉。"
 
 gen.69.t:0 "[FROM.GetName]政府宣布进行民主化"
 gen.69.d:0 "[FROM.GetName]政府领导人发表重要讲话，宣布该国已经决定启动民主化进程，结束[FROM.GetRulingParty]长期的一党执政，并在合适时机进行民主选举。"
 
 gen.80.t:0 "[FROM.GetName]政府希望改善与[ROOT.GetName]的关系"
 gen.80.d:0 "[FROM.GetName]领导人[FROM.GetLeader]表示，希望与[ROOT.GetName]建立友好关系。"
 gen.80.a:0 "确定。"
 
 gen.81.t:0 "[FROM.GetName]宣布支持[ROOT.GetName]的革命斗争"
 gen.81.d:0 "[FROM.GetName]领导人[FROM.GetLeader]宣布，该国将坚定支持[ROOT.GetName]人民反对帝国主义及其傀儡政权的斗争。"
 gen.81.a:0 "确定。"
 
 gen.82.t:0 "[FROM.GetName]宣布进行大选"
 gen.82.d:0 "[FROM.GetName]宣布该国即将举行大选，有可能实现政党轮替。"
 gen.82.a:0 "确定。"
 
 gen.83.t:0 "[FROM.GetName]大选落幕"
 gen.83.d:0 "[FROM.GetName]大选宣告结束，由于大部分反对派的支持率都并不高，[FROM.GetRulingParty]得以继续组织政府。"
 gen.83.a:0 "确定。"
 
 gen.84.t:0 "[FROM.GetName]大选落幕"
