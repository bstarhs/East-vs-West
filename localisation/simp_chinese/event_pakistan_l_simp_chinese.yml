l_simp_chinese:
 pak.1.t:0 "巴基斯坦宣布独立！"
 pak.1.d:0 "作为蒙巴顿分治方案的一部分，由旁遮普、信德、俾路支斯坦、普什图斯坦、孟加拉和部分克什米尔组成的南亚穆斯林地区，组合成为巴基斯坦自治领，并宣布独立，以同印度教为主的印度斯坦地区区分开来，著名的穆斯林政治家穆罕默德·阿里·真纳成为该国的第一位总理。巴基斯坦的独立标志着南亚的穆斯林民族和印度教民族彻底分裂，但由此产生的各种矛盾和宗教冲突也将接踵而至。"
 
 pak.2.t:0 "穆罕默德·阿里·真纳就任巴基斯坦总理"
 
 pak.3.t:0 "穆罕默德·阿里·真纳去世"
 pak.3.d:0 "巴基斯坦总理穆罕默德·阿里·真纳因病去世，他在为巴基斯坦的独立奋斗了一生后，在这个国家尚未成熟时离开。Liaquat Ali Khan接替他的职位。"
 
 pak.4.t:0 "亚克特·阿里·汗遇刺！"
 pak.4.d:0 "巴基斯坦总理亚克特·阿里·汗被刺杀！"
 
 pak.5.t:0 "Military coup in Pakistan!"
 
 pak.6.t:0 "Military coup in Pakistan!"
 
 pak.15.t:0 "Pushtun rebels are rising rapidly"
 
 pak.16.t:0 "阿富汗与巴基斯坦爆发边境冲突"
 pak.16.d:0 "巴基斯坦军队与阿富汗军队，以及阿富汗支持下的普什图武装分子发生交火，巴基斯坦西部的普什图怕叛军主张该地区从巴基斯坦分离，并入阿富汗。"
 pak.16.a:0 "确定。"
 
 pak.17.t:0 "巴基斯坦击退亲阿富汗普什图武装"
 pak.17.d:0 "巴基斯坦军队击溃阿富汗支持下的普什图叛军，维护了巴基斯坦在该地区的控制。"
 pak.17.a:0 "确定。"
 
 pak.18.t:0 "巴基斯坦部队被击溃"
 pak.18.d:0 "巴基斯坦军在与普什图叛军的交战中失利并撤退。"
 
 
 pak.20.t:0 "乔杜里·拉赫玛特·阿里去世"
 pak.20.d:0 "巴基斯坦民族运动的创始人乔杜里·拉赫玛特·阿里在伦敦去世，他是最早提出将南亚次大陆的印度教地区和穆斯林地区分割开来，建立独立穆斯林国家的政治家之一，在巴基斯坦诞生过程中起到了重要作用。然而，乔杜里·拉赫玛特·阿里理想中的伊斯兰国家，范围远比今日的巴基斯坦共和国要大，乔杜里无法接受现在的分治方案，并与阿里·真纳发生矛盾，从而离开巴基斯坦，最终在英国逝世。"
 
 
 
 pak.30.t:0 "穆斯林联盟与共和党的矛盾。"
 
 pak.31.t:0 "穆罕默德·阿里辞职。"
 pak.31.d:0 "巴基斯坦总理穆罕默德·阿里因无法调节穆斯林联盟与共和党之间的矛盾，在总统伊斯坎德尔·米尔扎压力下宣布辞职。侯赛因·苏拉瓦底宣布接任。"
 
 pak.32.t:0 "侯赛因·苏拉瓦底辞职。"
 pak.32.d:0 "巴基斯坦总理侯赛因·苏拉瓦底因无法调节东巴基斯坦孟加拉族与西巴基斯坦之间的矛盾，在总统伊斯坎德尔·米尔扎压力下宣布辞职。费罗兹·汗宣布接任。"
 
 pak.33.t:0 "穆斯林联盟改组。"
 pak.33.d:0 "穆斯林联盟改组后影响力不断扩大，可能威胁米尔扎总统的地位。"
 
 pak.34.t:0 "巴基斯坦宣布进入紧急状态！"
 pak.34.d:0 "伊斯兰堡消息！\n巴基斯坦总统伊斯坎德尔·米尔扎宣布废除宪法并解散国民议会和临时议会，对总理费罗兹·汗领导的共和党政府宣布戒严，随后下令大规模军事动员并在全国实行紧急状态。\n米尔扎总统通过国家广播电台宣布，他将推出一部“更适合巴基斯坦民族精神”的新宪法，因为他认为民主不适合“识字率仅为15%”的巴基斯坦。米尔扎任命时任巴基斯坦陆军司令的阿尤布·汗将军为首席戒严行政官。"
 
 pak.35.t:0 "米尔扎总统与阿尤布司令的矛盾"
 
 pak.36.t:0 "巴基斯坦发生军事政变！"
 pak.36.d:0 "巴基斯坦发生军事政变！阿尤布·汗将军推翻了伊斯坎德尔·米尔扎总统，并将他强行送上了飞往英国的飞机！阿尤布宣布米尔扎破坏了巴基斯坦宪法，他将组建一个维护宪法实行的新政府。"
 
 
 
 pak.110.t:0 "[FROM.GetName]希望与巴基斯坦改善关系"
 
 pak.111.t:0 "[FROM.GetName]宣布支持巴基斯坦的反政府势力"