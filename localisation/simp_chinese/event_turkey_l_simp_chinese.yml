 tur.4.t:0 "土耳其大选即将开始!"
 tur.4.d:0 "自1923年以来，土耳其一直由凯末尔·阿塔图尔克和伊斯米特·伊恩努领导的共和人民党统治。第二次世界大战后，自由主义开始兴起。Adnan Menderes、Mahmut Celal Bayar和他们的民主党要求政治自由和多党派。民主党得到了农村和私营企业的支持/n现在，1950年大选即将到来，谁能成为土耳其的执政党？"
 
 tur.5.t:0 "1950年选举"
 tur.5.d:0 "自1923年以来，土耳其一直由凯末尔·阿塔图尔克和伊斯米特·伊恩努领导的共和人民党统治。第二次世界大战后，自由主义开始兴起。Adnan Menderes、Mahmut Celal Bayar和他们的民主党要求政治自由和多党派。民主党得到了农村和私营企业的支持/n现在，1950年大选即将到来，谁能成为土耳其的执政党？"
 tur.5.a:0 "Turkey need a democratic goverment."
 tur.5.b:0 "The Republican People's Party will continue the policy of Atatürk."

 tur.6.t:0 "土耳其民主党赢得选举!"
 tur.6.d:0 "土耳其民主党赢得了土耳其国会选举，结束了共和人民党长期的一党执政!Adnan Menderes就任新一任政府总理！"

 tur.7.t:0 "土耳其共和人民党赢得选举!"
 
 tur.15.t:0 "土耳其大选在即"
 tur.15.d:0 "土耳其国民大会改选在即，来自共和人民党的Bülent Ecevit和来自民主党的Süleyman Demirel将角逐土耳其总理之位。"
 tur.15.a:0 "Bülent Ecevit是合适的人选。"
 tur.15.b:0 "Süleyman Demirel将领导土耳其。"

 tur.16.t:0 "民族运动党成立"

 tur.18.t:0 "伊斯坦布尔爆发游行示威"
 
 tur.19.t:0 "巴赫塞利夫勒学生公寓遭到袭击"

 tur.25.t:0 "军方发动政变！"

 tur.30.t:0 "即将大选"

 tur.31.t:0 "库尔德爆发武装暴动！"

 tur.32.t:0 "库尔德工人党成立！"

 tur.33.t:0 "灰狼组织成立！"

 tur.40.t:0 "苏联索取土耳其海峡通航权！"

 tur.41.t:0 "土耳其同意苏联自由通行土耳其海峡"
 tur.41.d:0 "在苏联的外交、政治和军事威慑下，土耳其被迫宣布同意修改《俄土条约》等一系列关于达达尼尔海峡、加里波利海峡等地军事通航的协定，允许苏联海军穿过该地区前往东地中海。这一事项引起了西方国家的担忧，苏联将由此获得进入东地中海，威慑希腊、意大利、中东和苏伊士运河的机会。"

 tur.42.t:0 "土耳其拒绝苏联通行土耳其海峡"
 tur.42.d:0 "尽管苏联施加巨大压力，但土耳其依然坚定的拒绝了对方要求军事通航土耳其海峡的要求，两国出现严重矛盾，与此同时，美国等西方国家表态支持土耳其的决定。"

 tur.43.t:0 "苏联对土耳其东部提出领土要求"
 tur.43.d:0 "在苏联与土耳其就《蒙特勒公约》修订及苏联军舰自由通行达达尼尔海峡的谈判破裂后，苏联外交部近日突然向安卡拉方面抛出一项更为重大的历史领土要求。\n苏联政府正式宣称，其下属的格鲁吉亚和亚美尼亚两个加盟共和国，对目前由土耳其控制的东北部边境地区，包括卡尔斯、阿尔达汗以及历史上被称为“西亚美尼亚”的大片土地拥有合法主权。这一要求的依据是1921年《卡尔斯条约》签署前的地缘历史，苏联认为当前边界“不公正”。\n此举立即在黑海地区及国际社会引发强烈震动。美国、英国等西方主要国家对此表示严重关切与不满，认为这是苏联利用战后优势，对邻国施加政治与军事压力的最新例证，意图突破土耳其海峡的封锁并扩大在高加索及黑海地区的影响力。这使得本已紧张的苏土关系与东西方对抗局势骤然升级。"
 

 tur.50.t:0 "快速的城市化！"

 tur.51.t:0 "农村的选票……"

 tur.52.t:0 "土耳其政府倾向保守与民粹"

 tur.53.t:0 "土耳其1960年大选即将开始"
 tur.53.d:0 "土耳其1960年大选即将开始，土耳其民主党及其总理阿德南·曼德列斯的执政不尽人意，尽管土耳其的经济发展取得显著成果，但代价却是贫富差距的急剧增大和通货膨胀的迅速增强，此外土耳其民主党对言论自由的压制也引起许多人的不满。\n伊斯麦特·伊诺努已宣布率领共和人民党参与大选，呼吁从民主党手中夺回政权。"

 tur.54.t:0 "伊斯麦特·伊诺努遭到袭击！"
 tur.54.d:0 "伊斯麦特·伊诺努在安卡拉参与选举活动时，遭到一名极端的民主党同情者袭击！\n伊诺努被紧急送往医院，袭击者被捕。"

 tur.55.t:0 "土耳其进入戒严状态！"
 tur.55.d:0 "土耳其总理阿德南·曼德列斯在伊斯麦特·伊诺努遭到袭击后，宣布全国进入紧急状态！\n曼德列斯指责伊斯麦特·伊诺努和共和人民党自导自演了这起袭击，以为起发起叛乱武装夺取做准备。曼德列斯政府下令冻结共和人民党的选举资格，并要求国会发起强制解散共和人民党的议案。"

 tur.56.t:0 "伊斯坦布尔爆发大规模示威游行！"
 tur.56.d:0 "土耳其政府强行解散共和人民党的行为引起土耳其民众的强烈不满！伊斯坦布尔爆发大规模示威游行，抗议阿德南·曼德列斯走向独裁！\n大学生聚集在伊斯坦布尔大学中心楼，高呼“打倒独裁者！”和“我们要自由！”。"

 tur.57.t:0 "伊斯坦布尔示威游行遭到镇压"
 tur.57.d:0 "伊斯坦布尔的示威游行演变成流血事件！包围抗议学生的安全部队开枪驱散学生，林业学院学生图兰·埃梅克西兹被枪杀。该地区的其他学生也遭到警察殴打，并被警车拖行。要求警察离开校园的伊斯坦布尔大学校长奥纳尔也遭到警察殴打。\n事件始于大学花园，随后蔓延至贝亚泽特广场。随着警察和学生之间的骚乱失控，军队被调来增援。看到士兵，学生们开始高呼“土耳其军队万岁，我们与军队同在”。"

 tur.58.t:0 "安卡拉爆发大规模警民冲突"
 tur.58.d:0 "抗议活动蔓延至安卡拉，安卡拉大学法学院的学生组织了反政府示威活动。学生与警察爆发冲突。\n示威者手挽手，开始吹着口哨，唱起了《普列文进行曲》。他们走着走着，路过的行人纷纷为他们让路，有些人甚至开始跟随他们。他们的人数稳步增长。不久，活动人士到达扎费尔广场，返回克孜拉伊。然而，此时，警察已经进驻克孜拉伊，准备驱散抗议者。警察介入示威活动，试图驱散抗议者，与此同时，《普列文进行曲》在他们周围不断爆发。\n总理阿德南·曼德列斯和议长雷菲克·科拉尔坦的车辆停在附近，他们正从议会返回。巴亚尔和曼德列斯得知克孜拉伊发生了抗议活动，想去看看情况。他们一到达广场，抗议的呼喊声、嘘声和口号声就响彻云霄。曼德列斯下了车，愤怒地与抗议者对峙，对他们发出挑衅和咒骂。他喊道：“你们要杀了我吗？来吧，杀了我！”抗议者回答道：“我们不是凶手，政府才是凶手！”\n警方最终设法将曼德雷斯带入了《安卡拉自由报》代表埃明·卡拉库什的车辆。曼德雷斯上车时，愤怒地敲打着车内天花板。卡拉库什安全进入车内后，立即加速，冲破人群，离开了广场。"

 tur.59.t:0 "阿德南·曼德列斯逃离土耳其！"
 tur.59.d:0 "来自土耳其的突发消息！\n土耳其总理阿德南·曼德列斯今日早上乘坐直升机，逃离被示威者层层包围的总理府，抵达安卡拉郊外的机场后，乘坐飞机逃亡。\n得知独裁者逃离国家，情绪激动的示威者涌入总理府，将土耳其国旗悬挂在曼德列斯曾经高高地演讲的阳台上，随后，土耳其军队抵达现场，示威者与士兵拥抱在一起。\n待示威者散去后，军方宣布接管土耳其政权，建立军事革命委员会，军人们推举Cemal Gürsel将军为新政府的领导人。"

 tur.60.t:0 "军事政变!"
 tur.60.d:0 "伟大的土耳其民族：自今日凌晨3点起，土耳其武装部队已接管全国行政机构。在全体公民和安全部队的密切配合下，此次行动取得了成功，没有造成人员伤亡。在另行通知之前，已实施宵禁，仅限武装部队成员。我们请求公民协助武装部队执行任务，并协助重建民族所期望的民主政权。"

 tur.61.t:0 "土耳其发生军事政变!"
 tur.61.d:0 "来自伊斯坦布尔和安卡拉突发消息！\n土耳其军方今日突然闯入首都，迅速控制了总统府、总理府、国会大厦和广播电台。军人们宣布，土耳其民主党倒行逆施，其执政不力使得经济凋敝、共产党和伊斯兰极端分子威胁加剧，并试图重建独裁制度，土耳其军人遵照穆斯塔法·阿塔图尔克的遗嘱，剥夺当局的权力，建立军事革命委员会。\n土耳其总理Adnan Menderes和他的部下被捕并关押。"

 tur.62.t:0 "内战的威胁"

 tur.63.t:0 "土耳其民族团结委员会成立"
 tur.63.d:0 "政变军人们推举Cemal Gürsel将军为新政府的领导人。Cemal强调，“政变的目的和目标是尽快让国家走向公正、廉洁和稳固的民主……我要将权力和国家管理移交给人民的自由选择”。"

 tur.64.t:0 "土耳其军事政变扩大为武装冲突"
 

 tur.65.t:0 "亚西亚达审判"

 tur.64.t:0 "土耳其民主党领导人被判终身监禁"

 tur.64.t:0 "土耳其民主党领导人被处决！"

 tur.64.t:0 "土耳其军事政变扩大为武装冲突"