l_simp_chinese:
 LOADING_TIP_0:0 "从波罗的海的什切青到亚得里亚海的的里雅斯特，一道铁幕已经在整个大陆上落下。  \n- 温斯顿·丘吉尔  1946年3月5日"
 LOADING_TIP_1:0 "简单地说，我们在朝鲜所做的事情就是：我们试图阻止第三次世界大战。\n- 哈里·S·杜鲁门"
 LOADING_TIP_2:0 "戈尔巴乔夫先生，打开这扇门。戈尔巴乔夫先生，拆掉这堵墙！\n- 罗纳德·里根 1987年6月12日"
 LOADING_TIP_3:0 "在美国买这套房子需要钱，但在我们国家，你只要是苏联公民就行了。如果美国公民没有钱，他们只有权睡在人行道上。可你却说我们是共产主义的奴隶！\n- 尼基塔·赫鲁晓夫  1959年7月24日 厨房辩论"
 LOADING_TIP_4:0 "没人想要建造一堵墙\n- 瓦尔特·乌布利希  1961年6月15日"
 LOADING_TIP_5:0 "切反动派都是纸老虎。看起来，反动派的样子是可怕的，但是实际上并没有什么了不起的力量。从长远的观点看问题，真正强大的力量不是属于反动派，而是属于人民。\n- 毛泽东  1946年8月"
 LOADING_TIP_6:0 "为了团结人民，政府需要敌人……如果没有真正的敌人，他们会造一个，好让人民团结起来。\n——一行禅师（越南）"
 LOADING_TIP_7:0 "只要主权国家拥有强大的武力，战争就不可避免。\n- 阿尔伯特·爱因斯坦"
 LOADING_TIP_8:0 "我认为党内谁投票、如何投票完全不重要；但极其重要的是——谁来计票、如何计票。\n- 约瑟夫·斯大林 1923年"
 LOADING_TIP_9:0 "历史表明从来没有无法战胜的军队，从来没有。\n- 约瑟夫·斯大林"
 LOADING_TIP_10:0 "经济这门学科不太尊重个人意愿。\n- 尼基塔·赫鲁晓夫"
 LOADING_TIP_11:0 "政治的艺术在于能够准确地理解什么时候需要轻微的打击 \n- 对手的腰带下面。\n- 康拉德·阿登纳"
 LOADING_TIP_12:0 "唯一真正的力量来自长枪。\n- 约瑟夫·斯大林"
 LOADING_TIP_13:0 "所有自由人，无论他们住在哪里，都是柏林的公民，因此，作为一个自由人，我以我是一个柏林人为荣。 \n- 约翰·肯尼迪  1963年6月23日"
 LOADING_TIP_14:0 "我不会让美国男孩到世界各地跑8或10000英里去做亚洲男孩应该做的工作。\n- 林登·贝恩斯·约翰逊   1964年10月24日"
 LOADING_TIP_15:0 "历史是应该避免的事情的总和。\n- 康拉德·阿登纳"
 LOADING_TIP_16:0 "把谎言说的越大，越明显，人们就会越相信它。\n- 阿道夫·希特勒"
 LOADING_TIP_17:0 "不仅在中国，在全世界，无论是帝国主义方面，还是社会主义方面。中立只是伪装；第三条道路不存在。\n- 毛泽东 1949年"
 LOADING_TIP_18:0 "死在战争中并不一定可怕，可怕的是这么多牺牲没有换来和平。\n- 温斯顿·丘吉尔"
 LOADING_TIP_19:0 "如果你正在穿越地域，保持前进。\n- 温斯顿·丘吉尔"
 LOADING_TIP_20:0 "反对民主的最佳论据是与普通选民进行五分钟的对话。\n- 温斯顿·丘吉尔"
 LOADING_TIP_21:0 "无论未来将发生什么战争，装甲部队都将发挥决定性作用。\n- 海因茨·古德里安"
 LOADING_TIP_22:0 "苏联确实是我们最大的威胁，不是因为它的所作所为，而是因为我们为我们的失败提供了借口。\n- J.威廉·富尔布赖特 （美国参议员）"
 LOADING_TIP_23:0 "没有哪个杂种是通过为国捐躯赢得一场战争的，赢得战争靠的是让敌国那些可怜的杂种为他们的国家去死。\n——乔治·S·巴顿"
 LOADING_TIP_24:0 "一个即刻践行的好计划要强于一个下周执行的完美计划。\n——乔治·S·巴顿"
 LOADING_TIP_25:0 "要么领导我，要么跟着我，要么从我面前滚开。\n——乔治·S·巴顿"
 LOADING_TIP_26:0 "从没有人成功的守住任何东西，只有进攻，进攻再进攻。\n——乔治·S·巴顿"
 LOADING_TIP_27:0 "战争也许是用武器打的，但是由人来获胜的，是领导者与追随者的精神争取到的胜利。\n——乔治·S·巴顿"
 LOADING_TIP_28:0 "共产主义有时是一个成功的清道夫，但不会是一个成功的领导者。他们从未在一个没有遭受战争或腐败，或两者兼而有之的国家掌权。\n- 约翰·肯尼迪  1963年6月2日"
 LOADING_TIP_29:0 "如果你继续进行核军备竞赛，那接下来你要做的是把它们全部炸成碎片。\n- 温斯顿·丘吉尔"
 LOADING_TIP_30:0 "你可以杀死一个革命者，但你杀不死他的思想。\n- 托马斯·桑卡拉"
 LOADING_TIP_31:0 "资本主义正在使用他们的金钱，而我们社会主义者丢掉它。\n- 菲德尔·卡斯特罗"
 LOADING_TIP_32:0 "在备战中，我总是发现计划是无用的，但计划的过程是必不可少的。\n- 德怀特·艾森豪威尔"
 LOADING_TIP_33:0 "重要的不一定是打斗中狗的大小，而是狗的斗志大小。\n- 德怀特·艾森豪威尔"
 LOADING_TIP_34:0 "普通人通过公路或铁路去往世界各地，但经济学家沿着基础设施继续他的旅程。\n- 玛格丽特·撒切尔"
 LOADING_TIP_35:0 "在一场单挑中，胜利者是弹夹里多一发的人。\n——埃尔温·隆美尔"
 LOADING_TIP_36:0 "我每杀了你们一个人，你们可以杀我们10个人，但即使这样计算，我们仍然会赢。\n- 胡志明 (对法国人)"
 LOADING_TIP_37:0 "流汗不流血，留血不流汗，但有脑子的人可以同时做到。\n- 埃尔温·隆美尔"
 LOADING_TIP_38:0 "我们来取回我们的遗产。\n- 菲利普·勒克莱尔将军 于越南 1945年9月"
 LOADING_TIP_39:0 "九十九年的战争，没有给胜利者留下任何席位。\n- 歌曲《99 Luftbollin》"
 LOADING_TIP_40:0 "西柏林就像西方的睾丸。如果我想让他们尖叫，就捏一下西柏林。\n- 尼基塔·赫鲁晓夫  1961年6月3日"
 LOADING_TIP_41:0 "革命战争是群众的战争。只有动员群众才能发动战争，只有依靠群众才能进行战争。\n- 毛泽东  1934年1月27日"
 LOADING_TIP_42:0 "军队回到军营后，要像老大哥一样监督政治。如果不尽人意，就再次介入政治。\n- 朴正熙"
 LOADING_TIP_43:0 "你去告诉加夫里埃将军，智利总统永远不会逃跑。他知道如何履行士兵的职责！\n- 萨尔瓦多·阿连德  1973年9月11日"
 LOADING_TIP_44:0 "原谅你的敌人，但永远不要忘记他们的名字。\n- 约翰·肯尼迪"
 LOADING_TIP_45:0 "改革是中国的第二次革命。这是一件非常重要的事情，尽管是风险很大的事情。\n- 邓小平   1985年3月28日"
 LOADING_TIP_46:0 "不管是黑猫还是白猫，抓老鼠都是好猫。\n- 邓小平  1962年7月2日"
 LOADING_TIP_47:0 "中国要出问题，还是出在共产党内部。\n- 邓小平  1992年1月12日"
 LOADING_TIP_48:0 "我和82个人一起发起了革命。如果你让我重新开始，即使我只有10或15个人，我也绝对有信心。如果你有信念和计划，不管你有多渺小，都无所谓。\n- 菲德尔·卡斯特罗"
 LOADING_TIP_49:0 "至于资本主义国家，我们存在与否与你们无关。如果你们不喜欢我们，就不要接受我们的邀请，也不要邀请我们去看望你们。不管你们愿不愿意，历史站在我们这边。我们将埋葬你们！\n- 尼基塔·赫鲁晓夫，1956年10月"
 LOADING_TIP_50:0 "这是我的一小步，却是人类的一大步。\n- 尼尔·阿姆斯特朗  1969年7月21日"
 LOADING_TIP_51:0 "当我乘坐宇宙飞船在地球轨道上旅行时，我对地球的美丽感到惊奇。地球上的人们，让我们保护和增加她的美丽，而不是毁灭她！\n- 尤里·加加林"
 LOADING_TIP_52:0 "你们怎么能对我开枪？我是你们的母亲！\n- 埃列娜·齐奥塞斯库   1989年12月23日"
 LOADING_TIP_53:0 "那些使试图非暴力革命成为不可能的人将使其不可避免。\n- 约翰·肯尼迪   1962年5月12日"
 LOADING_TIP_54:0 "如果仅仅以人们的肤色，而非长处来驱使人们前进，这将是非常不幸的，这必然会导致灾难。这意味着罗德西亚将发展成一个香蕉共和国，国家会很快破产。\n- 伊恩·史密斯 1979年"
 LOADING_TIP_55:0 "我们正在等待以色列和任何以色列支持者的侵略。我们将使之成为一场决定性的战斗，一劳永逸地消灭以色列……这是每个阿拉伯人的梦想。\n-加玛尔·阿布杜勒·纳赛尔，1967年"
 LOADING_TIP_56:0 "如果修建的原因还没有消除，柏林墙还将屹立50年甚至100年左右。\n- 埃里希·昂纳克，1989年1月19日"
 LOADING_TIP_57:0 "我是伊姆雷·纳吉。今天黎明时分，苏联军队袭击了我国首都，显然是想推翻匈牙利合法的民主政府。我们的军队在战斗，政府还在坚守阵地。我向全国和全世界人民通告这个事实。\n- 伊姆雷·纳吉  1956年10月31日"
 LOADING_TIP_58:0 "他们和我们是一样的！\n- 史密斯·萨曼莎"
 LOADING_TIP_59:0 "当你真正拥有土地和财产时，自由是不言而喻的，民主也就不远了，，，\n- 奥古斯特·皮诺切特"
 LOADING_TIP_60:0 "美国需要一位懂得心理学的领导人，这样他才知道，不加强外国人民的抵抗就无法对他们发号施令.\n- 皮特·威廉·博塔 1977年10月28日"
 LOADING_TIP_61:0 "不要问你的国家能为你做些什么，要问你能为你的国家做些什么。\n- 约翰·肯尼迪   1961年6月20日"
 LOADING_TIP_62:0 "不要让任何人让你认为上帝选择了美国作为他的救世主，让他成为全世界的警察。\n- 马丁·路德·金 1963年8月28日"
 LOADING_TIP_63:0 "我梦想有一天，在佐治亚州的红山上，昔日奴隶的儿子们和昔日奴隶主的儿子们能够坐在一起，共叙兄弟情谊。\n- 马丁·路德·金 1963年8月28日"
 LOADING_TIP_64:0 "我们只能通过战争来消除战争，不要枪杆子就必须拿起枪杆子。\n- 毛泽东"
 LOADING_TIP_65:0 "奇怪的游戏，不输掉这个游戏的唯一方式就是不玩这个游戏。\n- 电影《战争游戏》 1965"
 LOADING_TIP_66:0 "佐林大使，你是否不承认苏联已经且还在古巴部署中、远程导弹和导弹基地？是还是不是？-不要等待翻译-是还是不是？\n- 阿德莱·史蒂文森，美国驻联合国代表"
 LOADING_TIP_67:0 "这个国家应该致力于在这十年结束之前实现人类登月并安全返回地球的目标。\n- 约翰·肯尼迪   1962年9月12日"
 LOADING_TIP_68:0 "军队能走多远，体制就能走多远。\n- 约瑟夫·斯大林"
 LOADING_TIP_69:0 "克制？你为什么这么关心他们的生命？我们要做的就是干掉这些混蛋。等到战争结束时，如果两个美国人和一个俄国人还活着，我们就赢了。\n- 美国战略空军托马斯·鲍尔将军"
 LOADING_TIP_70:0 "我再说一次，不要再召开会议、胡说八道和抗议，否则我会把你们的牙打掉。\n- 霍梅尼"
 LOADING_TIP_71:0 "你们渴望自由，万物自由，结社自由，但这些自由会腐蚀我们的年轻人，这些自由会为暴君铺路，把我们的国家推向深渊。\n- 霍梅尼"
 LOADING_TIP_72:0 "如果当时是我执政，我会毫不犹豫地发射导弹。\n- 切·格瓦拉,评价古巴导弹危机"
 LOADING_TIP_73:0 "当你看到一条响尾蛇准备攻击时，你不要等到它攻击之后才去消灭它。\n- 富兰克林·罗斯福"
 LOADING_TIP_74:0 "规则不一定是神圣的，原则才是。\n——富兰克林·D·罗斯福"
 LOADING_TIP_75:0 "挨饿和失业的人民是滋生独裁的土壤。\n——富兰克林·D·罗斯福"
 LOADING_TIP_76:0 "只有暴徒和精英会被极权主义的势头所吸引，依靠宣传才能获得民心。\n- 汉娜·阿伦特"
 LOADING_TIP_77:0 "我们需要建立一个民主的、适合捷克斯洛伐克的社会主义新格局。\n- 亚历山大·杜布切克 1968年"
 LOADING_TIP_78:0 "历史将宣判我无罪！\n- 菲德尔·卡斯特罗 1953年7月26日"
 LOADING_TIP_79:0 "我是来参加革命的，不是来杀害柬埔寨人民的。现在看看我。我是一个野蛮的人吗？\n- 波尔布特"
 LOADING_TIP_80:0 "阻挡历史车轮者，手指必将被碾碎。\n- 莱赫·瓦文萨"
 LOADING_TIP_81:0 "现在冻结（核武器）将是一个极其危险的骗局，因为这只是和平的幻影。事实是，我们必须通过力量找到和平。\n- 罗纳德·里根"
 LOADING_TIP_82:0 "与其比较我们的洗衣机有什么优点，不如比较我们火箭的威力？那不是你想要的吗？\n-  理查德·尼克松 1959年7月24日 厨房辩论"
 LOADING_TIP_83:0 "你是资本主义的律师，我是社会主义的律师，来亲一个。\n- 尼基塔·赫鲁晓夫 1959年7月24日 厨房辩论"
 LOADING_TIP_84:0 "当他们为战争做准备时，那些最有发言权的人便大谈和平，直到准备完成。\n- 斯蒂芬·茨威格"
 LOADING_TIP_85:0 "枪支、军舰、火箭和炸弹是人类失败的象征。\n- 林登·贝恩斯·约翰逊"
 LOADING_TIP_86:0 "我认为生活在核子时代的孩子，他们爱的能力被削弱了。当你振作精神面对这种影响时，努力去爱吧。\n- 马丁·艾米斯"
 LOADING_TIP_87:0 "民主是一个西方概念，不适合儒家思想下成长起来的亚洲人。\n- 李光耀"
 LOADING_TIP_88:0 "原子能的释放，改变了除了人类思考方式外的一切……解决这个问题在于人心，早知道我就当个钟表匠了。\n- 阿尔伯特·爱因斯坦"
 LOADING_TIP_89:0 "资本主义的固有邪恶是幸福被不平等分享。社会主义的固有邪恶是痛苦被平等分享。\n- 温斯顿·丘吉尔"
 LOADING_TIP_90:0 "冷战不会融化，他在致命的高温下尽情燃烧。\n- 理查德·米尔豪斯·尼克松"
 LOADING_TIP_91:0 "美国宇航局花了上百万美元研发一支可以在太空中使用的圆珠笔，而俄国人只需要一支铅笔。\n- 威尔·沙博"
 LOADING_TIP_92:0 "和平解决已不可能，必定会有赢家和输家。\n- 南非外交部长皮克·博塔致电伊恩·史密斯"
 LOADING_TIP_93:0 "不，卢克，我是你的父亲！\n- 达斯·维德  1980年5月21日"
 LOADING_TIP_94:0 "基督教终将消亡，它会慢慢枯萎直至消逝……我们现在比耶稣更受欢迎，我不知道摇滚乐和基督教哪一个会先消失。耶稣是不错的，不过他的教徒实在是愚蠢和庸俗。\n- 约翰·列侬  1966年3月4日"
 LOADING_TIP_95:0 "南非所有少数族裔的安全和幸福都依赖于阿非利卡人。无论他们是说英语、德语、葡萄牙语、意大利语，甚至说犹太语，都无关紧要。\n-皮特·威廉·博塔 1981年2月20日"
 LOADING_TIP_96:0 "既然知道（曼德拉）会再次诉诸暴力，作为一个负责任的国家元首，我为什么要释放他，让他继续暴力，然后再逮捕他？这简直是荒谬的论调。\n-皮特·威廉·博塔 1986年4月23日"
 LOADING_TIP_97:0 "我毕生致力于非洲人民的这场斗争。我反对白人统治，也反对黑人统治。我怀揣着一个民主自由社会的理想，在这个社会里，人人和谐共处，机会均等。我希望为这个理想而生。\n-纳尔逊·曼德拉 1964年4月20日"
 LOADING_TIP_98:0 "只要贫困持续存在，就没有真正的自由……有时，伟大需要一代人去承担。你们可以成为这样的一代人。让你们的伟大绽放。\n-纳尔逊·曼德拉 1964年4月20日"
 LOADING_TIP_99:0 "我认为当你出名的时候，所有的弱点都会被夸大……创造力必须源于人性，而作为人，你会感受，你会受苦。你是同性恋，你会生病，你会紧张，等等。\n- 玛丽莲·梦露 1962年8月3日"
 LOADING_TIP_100:0 "我们，非共产主义者，今天必须领导的斗争，首先是反对混乱、无纪律、自私的斗争，是为了一个珍视自由的越南的荣誉，是为了数百万遭受战争苦难的同胞的安全和福祉，是为了同一种族的人之间的兄弟情谊，也就是所谓的祖国。\n——吴廷琰 1955年2月13日"
 LOADING_TIP_101:0 "犹太人只有一种拯救自己的方法——回到自己的民族并移居到自己的土地。\n——西奥多·赫茨尔"
 LOADING_TIP_102:0 "对我来说，犹太教如同所有其他宗教一样，都是最幼稚迷信的化身。而我欣然归属的犹太民族，以及我对其思想有着深厚共鸣的犹太民族，在我看来，与所有其他人并无二致……我看不出他们身上有什么被选中的地方。\n——阿尔伯特·爱因斯坦"
 LOADING_TIP_103:0 "我和我的朋友不会歧视任何人。我们不会问他是什么种族，什么宗教。他必须是人。这对我们来说才是最重要的。\n——西奥多·赫茨尔"
 LOADING_TIP_104:0 "当我给予穷人食物，他们称我为圣人。当我问穷人为什么没有食物，他们称我为共产党。\n- 埃尔德·佩索阿·卡马拉大主教（巴西）"
 LOADING_TIP_105:0 "我只想重申，以色列不会成为第一个向该地区引入核武器的国家。\n- 西蒙·佩雷斯"
 LOADING_TIP_106:0 "苏联的敌人臆测，我们遭受的惨重损失将导致我们内部出现混乱和动摇。但他们的希望落空了：等待他们的将是惨痛的失望。明眼人都能看出，我们党在艰难时期反而更加团结，更加坚定不移。\n——拉夫连季·贝利亚 1953年"