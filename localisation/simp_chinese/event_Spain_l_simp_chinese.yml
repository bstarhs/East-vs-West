l_simp_chinese:
 spr.1.t:0 "Franco dies"
 spr.1.d:0 "Yesterday, the whole of Spain was in a state of great sadness (or excitement). Francesco Franco, the fascist dictator who ruled Spain for nearly 40 years, died, and the last fascist dictatorship in the world came to an end. According to Franco's plan, the 32-year-old Prince Juan Carlos ascended the Spanish throne. Franco trained Carlos to succeed in his career, but the young new king seemed to have other ideas."
 spr.1.a:0 "Dios bendiga al nuevo rey."


 spr.92.t:0 "Catalan Independent!"

