l_simp_chinese:
 prc.1.t:0 "北平和平解放！"
 prc.1.d:0 "历时数月的紧张谈判终获决定性成果。在人民解放军兵临城下的强大军事压力与深入细致的政治工作下，国民党华北“剿总”总司令傅作义将军最终审时度势，代表所属部队接受《关于和平解决北平问题的协议》，正式通电全国，宣布率部起义，和平让渡北平控制权。\n随着傅作义将军的命令下达，国民党守军有序撤离防区，人民解放军东北野战军先头部队随即从西直门、德胜门等方向，以严整的军容和平开入北平城内，全面接管防务。这座拥有三千年建城史、八百年建都史的文化古都，得以完整地保存下来，避免了玉石俱焚的战火之灾。\n北平的和平解放，是解放战争进程中一个极具典范意义的重大事件。"
 prc.1.a:0 "北平拥有悠久的历史，是多个朝代的首都，定都于此有特殊意义。"
 
 prc.2.t:0 "中国人民解放军攻占南京！"
 prc.2.d:0 "中共《人民日报》庄重宣布：人民解放军先头部队攻入南京城，在总统府楼顶升起鲜艳的红旗，宣告这座国民党统治中心的解放。守军未组织有效抵抗即告溃散，国民党军政要员已仓皇南逃。\n国民党党旗被弃置在总统府台阶上，办公室内文件散落一地。城内民众纷纷走上街头，欢迎解放军入城。下关码头挤满试图逃离的国民党官员，多艘军舰正向下游驶去。\n随着南京解放，国民党统治已名存实亡。解放军各野战军正沿长江南岸追歼残敌，上海、杭州等地的解放指日可待。北平方面发表声明称，新政治协商会议筹备工作即将展开，号召全国人民为建立新中国继续奋斗。\n这座见证近代中国沧桑的城市，今日终于迎来新生。总统府前的广场上，红旗在春风中猎猎作响，宣告一个旧时代的终结和一个新时代的来临。"
 prc.2.a:0 "天若有情天亦老，人间正道是沧桑。"
 
 prc.3.t:0 "中华人民共和国成立！！！"
 prc.3.d:0 "今天将是中国乃至世界历史上最重要的日子之一。上午，数以万计的解放军和北京市民聚集在天安门广场，等待新中国的成立。壮观的阅兵式结束后，毛泽东、周恩来、宋庆龄、林彪等中国新领导人登上天安门城楼，受到群众和战士的热烈欢呼。后来，毛泽东主席郑重宣布，中华人民共和国中央人民政府今天成立！"
 prc.3.a:0 "中华人民共和国万岁！世界人民大团结万岁！"
 
 prc.4.t:0 "三区政府宣布加入中国共产党政府"
 prc.4.d:0 "随着中国共产党军队在战场上迅速推进，占据新疆北部的三区革命政府也开始不断加强与中国共产党的关系。经过谈判，三区政府正式宣布加入人民共和国。"
 prc.4.a:0 "亚克西！"

 prc.5.t:0 "西藏解放"
 prc.5.d:0 "随着西藏地方政府及其军队被人民解放军击败，西藏当地的统治阶级和封建地主闻风丧胆，纷纷外逃。西藏人民砸破枷锁，迎来翻身当家做主的日子。在拉萨市民的簇拥下，解放军战士进入拉萨城内，在布达拉宫前升起了鲜艳的五星红旗。"
 prc.5.a:0 "扎西德勒！"

 prc.6.t:0 "广州解放"
 prc.6.d:0 "今日上午，人民解放军先头部队在华南地区党组织的配合与广大市民的翘首期盼中，正式开入广州市区。广州的解放，标志着中国大陆上最后一座由国民党政权控制的主要大城市获得新生。\n在解放军抵达前数日，仓皇撤退的国民党军队在城内进行了最后的破坏与劫掠，并悍然炸毁了连接珠江两岸的交通要道——海珠桥，这一暴行导致众多无辜市民死伤，激起了更强烈的民愤。在国民党军撤出、城市出现短暂权力真空之际，长期坚持斗争的中共广州地下党组织迅速行动，联合进步工人和学生团体，有效地维持了基本秩序，并于地标建筑爱群大酒店升起了第一面五星红旗，迎接解放军的到来。\n入城后，解放军在市政府大楼前举行了庄严的入城仪式，受到沿途市民与工商界代表的热烈欢迎。为迅速稳定局势、恢复民生，广州市军事管制委员会随即宣告成立，开始全面接管市政，着手扑灭战争创伤，重建社会秩序。这座具有光荣革命传统的南方名城，从此翻开了历史的新篇章。"
 prc.6.a:0 "黄埔啊，很久没回来了。"

 prc.7.t:0 "中国科学家钱学森决定前往中国大陆" 
 prc.7.d:0 "在美国学习的中国科学家钱学森决定离开美国，前往中共控制下的中国大陆。在采访中，钱学森公开表示，他已与台湾的国民党政府关系破裂，决定回国为共产党政府的技术发展服务"
 prc.7.a:0 "要走就走吧。"
 prc.7.b:0 "不允许钱学森回国！"
 prc.7.c:0 "一个爱国者的决定。"
 prc.7.e:0 "叛徒！叛徒！"

 prc.8.t:0 "苏联顾问"
 prc.8.d:0 "苏联政府为了援助我国的国防事业建设，准备派遣几位优秀的科学家前来指导。"
 prc.8.a:0 "热烈欢迎苏联同志！"
 prc.8.b:0 "没有必要。"

 prc.9.t:0 "《关于土改运动的指示》"
 prc.9.d:0 "中共中央发布《关于土改运动的指示》在全国范围内开展土地改革运动。党根据先前土地革命的经验，将没收的富农、地主的土地分配给农民，这标志着千百年来遭受封建阶级剥削的农民阶层终于又有了属于自己的土地，是我国社会主义革命和建设的巨大成就。"
 prc.9.a:0 "广大农民阶级得到解放的日子到来了！"

 prc.10.t:0 "审判地主"
 prc.10.d:0 "土地革命结束后，几十万无地地主成了问题。有人建议对这些贪婪的剥削者一律予以逮捕和严厉批评。也有人建议解放和改造部分思想进步的地主阶级，使他们以新的身份成为共和国公民。"
 prc.10.a:0 "将剥削者彻底打倒！在踩上一脚！"
 prc.10.b:0 "思想改造。"

 prc.11.t:0 "钱学森抵达广州。"
 prc.11.d:0 "科学家钱学森乘坐的邮轮已经从香港抵达广州，回国的钱学森得到了中共政府的热烈欢迎。"
 prc.11.a:0 "立即镇压叛乱！"

 prc.12.t:0 "五年计划"
 prc.12.d:0 "中共中央会议即将召开会议，制定新的五年计划发展方案。"
 prc.12.a:0 "优先发展军事工业"
 prc.12.b:0 "优先发展民生工业"

 prc.13.t:0 "万隆亚非国际会议"
 prc.13.d:0 "为庆祝世界上许多国家摆脱殖民主义和帝国主义统治，印尼、印度、锡兰和缅甸政府决定在印尼万隆举行亚非会议，邀请所有亚非独立国家参加，讨论第三世界集团合作、打破殖民主义枷锁的伟大事业。"
 prc.13.a:0 "这种盛会我们怎么能不参与呢？"
 prc.13.a:0 "和我们没有关系。"

 prc.14.t:0 "解放台湾"
 prc.14.d:0 "中央委员会下达命令，向盘踞在台澎金马的国民党反动派残余发动最后进攻。我们即将横跨台湾海峡，粉碎蒋家王朝的最后根据地，解放我国神圣领土台湾！"
 prc.14.a:0 "打倒蒋匪，解放台湾！"

 prc.15.t:0 "中国要求归还旅顺港口"
 prc.15.d:0 "中国政府向我们发来信息，要求归还目前由我国控制下的旅顺和大连港。"
 prc.15.a:0 "派出志愿军，将美国侵略者赶出朝鲜！"

 prc.16.t:0 "苏联向中国政府归还旅顺大连"
 prc.16.d:0 "苏联向中国政府归还旅顺大连"
 prc.16.a:0 "我们的目的已经达到。"
 prc.16.a:0 "绝不！一定要解放全朝鲜！"

 prc.17.t:0 "苏联拒绝向中国政府归还旅顺大连"
 prc.17.d:0 "苏联政府拒绝了中国政府要求归还旅顺和大连的声明。"
 prc.17.a:0 "我们将前去祝贺"
 prc.17.a:0 "与我们无关。"

 prc.18.t:0 "关于旅顺和大连问题的解决"
 prc.18.d:0 "随着我国国际影响力不断增长和与苏联关系缓和，现在是时候向苏联正式提出归还旅顺和大连了。"

 prc.19.t:0 "钱学森被捕！"
 prc.19.d:0 "钱学森先生在回国的前一晚突然被美国联邦调查局逮捕！美国人认为他是为北京盗取和提供导弹技术的间谍！"
 prc.19.a:0 "无稽之谈。"

 prc.20.t:0 "钱学森被释放"
 prc.20.d:0 "钱学森被捕引发了美国许多科学家的抗议，在舆论压力下，美国政府宣布释放钱学森。"
 prc.20.a:0 "热烈欢迎！"

 prc.21.t:0 "钱学森遇害"
 prc.21.d:0 "美国传来令人悲哀的消息：钱学森不久前在联邦调查局的监狱中离奇死亡，美国拒绝透露具体死因。"
 prc.21.a:0 "邪恶的美帝！"

 prc.22.t:0 "冯·诺伊曼等提出抗议！"
 prc.22.d:0 "我们逮捕钱学森的决定引起了冯·诺伊曼等科学家的不满，他要求释放他的学生，否则他将不再为美国政府工作。"
 prc.22.a:0 "（批准）"
 prc.22.a:0 "（反对）"

 prc.23.t:0 "冯·诺伊曼辞职"
 prc.23.d:0 "随着科技的发展，美苏等大国都已经拥有了弹道导弹技术，为了避免我国军事实力的落后，我们也必须尽快启动导弹技术的开发。"
 prc.23.a:0 "（批准）"
 prc.23.a:0 "（反对）"

 prc.24.t:0 "《关于正确处理人民内部矛盾的问题》"
 prc.24.d:0 "随着百花齐放政策之后，针对中国共产党的批评不断出现，毛泽东认为这是资产阶级右派开始全面反扑的标志。对此，毛泽东发表了《关于正确处理人民内部矛盾的问题》，认为中共现在不仅需要处理敌我矛盾，还需要处理人民内部矛盾，即左派群众和右派敌对势力的矛盾。"
 prc.24.a:0 "（批准）"
 prc.24.a:0 "（反对）"

 prc.25.t:0 "中国发起大炼钢铁运动"
 prc.25.d:0 "在中共八大的新一次会议上，毛泽东提出了中国工业新的发展方向。\n毛泽东认为，既然苏联提出要在几年内追赶和超过美国的经济发展，那么，中国也不应落后。中国政府将动员全国人民的力量，开展大炼钢铁运动，简单地说，就是让人们在农田上搭起简单的炉灶，收集可用的金属，锻造出钢材。毛泽东认为，中国人民的潜力是无穷的，只要有社会主义可靠理论的直到，他相信，中国的钢铁产量将有机会在十年内赶上英国，甚至十五年内赶上美国。"
 prc.25.a:0 "力争上游！"

 prc.26.t:0 "人民公社运动"
 prc.26.d:0 "在毛主席的指示下，人民公社运动已经开始蓬勃发展，以大锅饭、大食堂为象征的公社将在全国各地建立，使我国跑步进步共产主义。"
 prc.26.a:0 "好。"

 prc.27.t:0 "中国政府开始大跃进运动"
 prc.27.d:0 "毛泽东召集中国共产党官员，在武汉召开了一次重要会议。\n会议上，毛泽东再一次批评了一些高级官员的保守政策，这一次，毛直接提出，要采取措施，发动群众，开展一次轰轰烈烈的大跃进运动！\n毛泽东认为，中国人民应该发挥主观能动性，加快生产，加速发展，要让中国以多快好省的方式，让工业产值和粮食产值，在几年内翻几倍！\n会议结束后，毛泽东指示刘少奇副主席全权负责，在全国范围内，开展工业、农业和经济上的大跃进。"
 prc.27.a:0 "大跃进万岁！"

 prc.28.t:0 "粮食短缺！"
 prc.28.d:0 "由于大跃进的盲目实行和经济规划失调，我国中、南方发生了严重的自然灾害和粮食短缺，多地爆发了大面积的人口死亡！"
 prc.28.a:0 "必须立即停止大跃进，纠正错误。"
 prc.28.b:0 "大跃进的路线是正确的，小小的挫折不能使其停止。"
 
 
 
 

 prc.29.t:0 "海瑞罢官"
 prc.29.d:0 "文汇出版社发表了一篇评价新剧《海瑞罢官》的文章。姚文元认为，该剧作者倾向于反革命，试图讽刺毛主席。江青支持姚，认为文艺界正在形成一个反革命的圈子。"
 prc.29.a:0 "不必理睬。"
 prc.29.b:0 "我们必须揪出文艺界中的走资派！"

 prc.30.t:0 "关于开展文化大革命的通知"
 prc.30.d:0 "中共中央中央下发了《关于开展无产阶级文化大革命的通知》，宣布文艺界、科学界和党中都有资本家和右派，严重威胁毛主席的英明领导，号召群众动员和批评资本家、右派、封建、反动的学术权威！"
 prc.30.a:0 "一场风暴来临了"

 prc.31.t:0 "一月风暴！"
 prc.31.d:0 "上海工人革命造反总司令部造反成功，夺取上海市党政军权力，成立“上海市革命委员会”，并得到伟大领袖毛主席支持之后，全国掀起了造反派夺权风潮！武汉、广州和北京等地都发生了原市委被推翻，成立革命委员会的运动。/n作为造反派夺权的代表人物，上海革命委员会干事王洪文得到了毛泽东的器重，并以此进入中共权力中心。"
 prc.31.a:0 "（阶级斗争优先）"
 prc.31.b:0 "（国防建设优先）"

 prc.32.t:0 "中共中央发布《关于组织力量反击右派分子进攻的指示》"
 prc.32.d:0 "在毛泽东不断发表文章抨击右派势力后，中共中央公布了《关于组织力量反击右派分子进攻的指示》，正式开始了反右运动。"
 prc.32.a:0 "一场风暴来临了。"

 prc.33.t:0 "上海造反派夺权！"
 prc.33.d:0 "上海发生政权更迭！在中央文化革命小组组长张春桥支持下，王洪文领导的上海工人革命造反总司令部成员闯入上海市委大院，驱逐了上海市长曹狄狄等人，并宣布“走资本主义复辟路线”的上海市政府解散，成立“上海公社”接管上海市党政军大权。"
 prc.33.a:0 "（予以支持）"
 prc.33.b:0 "（批判一番）"

 prc.34.t:0 "扩大的中央工作会议"
 prc.34.d:0 "扩大的中央工作会议在北京召开，这次的会议主要内容是总结“大跃进”以来的经验教训，进行批评和自我批评。"
 prc.34.a:0 "错误的经济路线应该被停止。"
 prc.34.b:0 "毛主席的路线没有问题，党内确实出现了右倾势力！"

 prc.35.t:0 "林彪党羽刺杀毛主席未遂！"
 prc.35.d:0 "伟大的革命领袖和导师、中共中央主席毛泽东同志在南京遭到了反革命分子的袭击！敌特枪击了毛主席的座驾，但主席本人不在车上。根据调查，林彪及其反革命集团策划了这起谋杀！"
 prc.35.a:0 "立刻逮捕林彪！"

 prc.36.t:0 "林彪死亡！!"
 prc.36.d:0 "反革命头目林彪在乘飞机逃亡时，在蒙古人民共和国上空坠机，林彪与其妻子儿子皆毙命。"
 prc.36.a:0 "天要下雨，娘要嫁人。"

 prc.37.t:0 "珍宝岛爆发边境冲突"
 prc.37.d:0 "苏联军队在乌苏里江边境上多次武装挑衅，侵犯我国领土珍宝岛，这一次他们又出动装甲部队悍然跨过结冰江面，我们应该如何应对？"
 prc.37.a:0 "（怒斥苏联）"
 prc.37.b:0 "（息事宁人）"

 prc.38.t:0 "七千人大会"
 prc.38.d:0 "扩大的中央工作会议在北京召开，这次的会议主要内容是总结“大跃进”以来的经验教训，进行批评和自我批评。在大会中，毛泽东自行承担了经济政策失利的责任，并退居二线，由刘少奇接替职务。"
 prc.38.a:0 "确定"

 prc.39.t:0 "唐山爆发大地震！"
 prc.39.d:0 "昨夜凌晨，中国河北省爆发里氏7.8级特大地震，强烈的震动几乎摧毁了这座城市。次日凌晨解放军投入到救灾当中，据估计已经造成超过20万人死亡。"
 prc.39.a:0 "可怕的灾难。"

 prc.40.t:0 "[PRC.GetLeader]遭到批斗！"
 prc.40.d:0 "国家主席早到了红卫兵批斗，长期的迫害和折磨使其身体状况恶化入院，国家主席职位名存实亡，毛泽东作为中国共产党主席，成为中国的实际领导人。"
 prc.40.a:0 "政治斗争的产物。"

 prc.41.t:0 "毛泽东去世"
 prc.41.d:0 "中华人民共和国的最高领导人毛泽东昨日去世，他不仅建立了社会主义中国，并向全世界传播了他的革命思想，他的离开不仅标志着中国一个时代的终结，也意味着国际左翼运动失去了一个指导者。"
 prc.41.a:0 "舵手已逝，船儿驶向何方?"

 prc.42.t:0 "毛主席遇刺！"
 prc.42.d:0 "伟大的革命领袖和导师、中共中央主席毛泽东同志在南京遭到了反革命分子的袭击！敌特枪击了毛主席的座驾，最终导致车毁人亡！事发之后，林彪副主席接任国家主席，并宣布全国进入紧急状态，彻查此事！"
 prc.42.a:0 "天塌下来了！"
 
 prc.43.t:0 "基辛格访华"
 prc.43.d:0 "美国国务卿亨利·基辛格访问北京，希望讨论中美关系正常化事宜。"
 prc.43.a:0 "我们是时候推动两国关系正常化了。"
 prc.43.b:0 "我们和美国人没什么好谈的。"

 prc.44.t:0 "[USA.GetLeader]访问北京！"
 prc.44.d:0 "昨天，美国总统[USA.GetLeader]抵达北京，开始了对中华人民共和国的正式访问。美国与中共长期处于敌对状态，而这次访问不仅象征着两个国家想对方递出了橄榄枝，也标志着亚洲和平迈出重要一步。"
 prc.44.a:0 "（欢迎）"

 prc.45.t:0 "北京拒绝了我们的请求。"
 prc.45.d:0 "基辛格访问北京受挫，中共政府拒绝了关于同我们恢复关系的提议。"
 prc.45.a:0 "真扫兴。"
 
 prc.46.t:0 "中美建交"
 prc.46.d:0 "中华人民共和国国务院总理[PRC.GetLeader]与美国总统[USA.GetLeader]在华盛顿签订了《中美建交公报》，宣布两国之间正式建立外交关系。"
 prc.46.a:0 "（接受）" 

 prc.47.t:0 "中法建交"
 prc.47.d:0 "中华人民共和国领导人[PRC.GetLeader]与法国总统[FRA.GetLeader]在签订了《中法建交公报》，宣布两国之间正式建立外交关系。"
 prc.47.a:0 "（接受）" 

 prc.48.t:0 "中日建交"
 prc.48.d:0 "中华人民共和国领导人[PRC.GetLeader]与日本首相[JAP.GetLeader]在签订了《中日建交公报》，宣布两国之间正式建立外交关系。"
 prc.48.a:0 "（接受）" 

 prc.49.t:0 "二月逆流"
 prc.49.d:0 "二月逆流，是指在1967年2月11日和16日在怀仁堂召开的两次中共中央政治局碰头会议上，谭震林、陈毅、叶剑英、李富春、李先念、徐向前、聂荣臻等（因陈、叶、徐、聂为中华人民共和国元帅，谭、二李为当时的国务院副总理，因此又被称为“三老四帅”或“四帅三副”）同为毛泽东所支持的中央文革派康生、陈伯达、江青、张春桥、谢富治等进行的斗争。主要是中共党内高级干部对文革的进一步质疑和对抗，以及对前一年八月份西纠联动事件的后续处理。\n这次事件实际上始于同年一月中旬，军队首领叶剑英、徐向前、聂荣臻代表军队干部向文革小组提出的一系列质疑。并因此引发的萧华案件。核心则是林彪、康生、陈伯达等军队造反派和文委成员意图推进和扩大文革的行动触动了军队内部一些人的底线。"
 prc.49.a:0 "打倒走资本主义道路的当权派！" 
 prc.48.b:0 "“联动”怎么是反动组织呢？十七八岁的娃娃是反革命吗？"

 prc.50.t:0 "毛泽东去世！"
 prc.50.d:0 "今天是全中国人民最为悲痛的日子，中国共产党主席，伟大的领袖和导师毛泽东同志与世长辞，全国人民和全世界的进步人士都沉浸在悲伤当中。/n 根据毛主席生前的指示，中共中央将召开会议，选举中共中央主席的接任者。"
 prc.50.a:0 "主席生前器重王洪文同志，他将继续领导无产阶级文化大革命。"
 prc.50.b:0 "华国锋同志办事，我们放心。"

 prc.51.t:0 "四人帮分子在上海起事！"
 prc.51.d:0 "随着华国锋、叶剑英等人在首都解决文委的计划败露破产，老干部与文委集团之间的大规模暴力冲突已经不可避免。张春桥、王洪文等人连夜乘飞机奔赴上海，准备起事。"
 prc.51.a:0 "动用武力！粉碎四人帮！"

 prc.52.t:0 "四人帮被捕！"
 prc.52.d:0 "在叶剑英元帅和华国锋主席的紧密部署之下，中共中央果断采取行动，逮捕了中央文化革命小组成员江青、王洪文、张春桥和姚文元，操纵“文化大革命”的四人帮集团被彻底粉碎了！"
 prc.52.a:0 "（依法判刑）" +10
 prc.52.b:0 "（软禁家中）"

 prc.53.t:0 "十一届三中全会"
 prc.53.d:0 "1978年12月，中共十一届三中全会在北京召开。会上，主要代表讨论了文革的阶级斗争路线要不要继续，文革要不要停止，要不要改变的问题。"
 prc.53.a:0 "我们要继续毛主席一贯正确的阶级斗争，让华国锋同志继续我们的事业。"
 prc.53.b:0 "解放思想、实事求是是党的发展的正确路线。恢复邓小平同志的领导地位。"

 prc.54.t:0 "解放思想，实事求是，团结一致向前看"
 prc.54.d:0 "1978年12月18日-22日，中国共产党第十一届中央委员会第三次全体会议在北京举行。在这次会议上，与会的大部分代表都对“文化大革命”以来，党的工作出现严重失误，导致的国民经济严重失调，民主法治遭到践踏的后果进行了批评。最后，会议恢复了邓小平同志的合法领导地位，华国锋同志隐退。我们的人民将会面对一个新的中国领导集体。"
 prc.54.a:0 "小平你好！"

 prc.55.t:0 "改革开放"
 prc.55.d:0 "1978年12月18日-22日，中国共产党第十一届中央委员会第三次全体会议在北京举行。在这次会议上，与会的大部分代表都对“文化大革命”以来，党的工作出现严重失误，导致的国民经济严重失调，民主法治遭到践踏的后果进行了批评。最后，会议恢复了邓小平同志的合法领导地位，华国锋同志隐退。我们的人民将会面对一个新的中国领导集体。"
 prc.55.a:0 "春雷唤醒了长城内外。"

 prc.56.t:0 "香港收回谈判"
 prc.56.d:0 "随着1997年，《香港拓界条约》中规定的香港99年租期即将结束，我们是时候与伦敦准备对香港的未来展开对话了。"
 prc.56.a:0 "是时候收回香港了。"
 prc.56.b:0 "（对香港没有兴趣）"

 prc.57.t:0 "中国寻求收回香港" 
 prc.57.d:0 "随着1997年，《香港拓界条约》中规定的香港99年租期即将结束，中华人民共和国政府谋求收回香港的主权。"
 prc.57.a:0 "这是历史的必然。"
 prc.57.b:0 "这不可能！"

 prc.58.t:0 "英国拒绝归还香港"
 prc.58.d:0 "有马岛战争的胜利撑场，伦敦拒绝了向中共转让香港主权的要求。"
 prc.58.a:0 "香港问题只能用武力解决了。"
 prc.58.b:0 "只能缓一缓了。"

 prc.59.t:0 "香港解放！"
 prc.59.d:0 "中国人民解放军以迅雷之势，迅速攻占了香港，驻港英军和香港警察等武装被击溃，不得不向解放军投降。解放军登陆香港岛，在总督府俘虏了香港总督，并宣布香港临时军事管制委员会成立。"
 prc.59.a:0 "（确定）"

 prc.60.t:0 "香港战事结束"
 prc.60.d:0 "经过交战，解放军占领了香港，伦敦认为收复香港无望，被迫宣布完全放弃香港主权以交换侨民和战俘。北京同意了这一请求。随着中国政府向英国交还香港总督等俘虏，英国对香港长达一百五十年的殖民统治宣告结束。"
 prc.60.a:0 "（确定）"

 prc.61.t:0 "中英联合声明"
 prc.61.d:0 "中国与英国政府代表在北京公布联合声明，宣布英国同意在1997年完全归还香港的主权。"
 prc.61.a:0 "（确定）"

 prc.62.t:0 "中葡联合声明"
 prc.62.d:0 "中国与葡萄牙政府代表在北京公布联合声明，宣布葡萄牙同意在1999年完全归还澳门的主权。"
 prc.62.a:0 "（确定）"

 prc.63.t:0 "越南排华运动"
 prc.63.d:0 "越共领导人黎笋今日在越南国内搞“反资本主义运动”，把许多华侨华商打上“资本家”“南越政权余孽”的标签，进行关押、迫害和驱逐，许多华人被迫流亡香港，他们希望中国大陆出面制止越南。"
 prc.63.a:0 "大家都是中国人，就应该互相帮助。"
 prc.63.b:0 "资本家的事情别找我们。"

 prc.64.t:0 "越南入侵中国南海"
 prc.64.d:0 "前方最新消息，有一定数量的越南军用船只在未经通报的情况下悍然侵入我国南方领海。"
 prc.64.a:0 "（批判一番）"

 prc.65.t:0 "波尔布特访华"
 prc.65.d:0 "柬埔寨共产党领导人波尔布特希望访问中国，学习中国文化大革命运动并向中国购买武器。虽然波尔布特和我们一样是反对越修的马克思主义者，但有传言说波尔布特在国内搞“大清洗”，打压民主人士且软禁了我们的老朋友西哈努克国王，部分同志建议我们不要接待他。"
 prc.65.a:0 "无论如何，波尔布特同志是我们对抗越南的战友。"
 prc.65.b:0 "我们不欢迎假共产党，真法西斯的伪君子。"

 prc.66.t:0 "越南入侵柬埔寨！"
 prc.66.d:0 "越南的黎笋反动集团向我们的柬埔寨同志发动了入侵，一旦越南取得胜利，其在东南亚的势力将大大增强，威胁我国西南安全。我们的军队已经做好对越作战的准备。"
 prc.66.a:0 "立刻发动对越作战！"
 prc.66.b:0 "等一等，不是现在。"

 prc.67.t:0 "对越作战进展顺利"
 prc.67.d:0 "在人民解放军的强大攻势下，越军屡屡败退，我们迅速占领了谅山、老街等越南北部重镇。许世友将军建议我们乘胜追击，占领河内，推翻黎笋政权，由我们的朋友武元甲同志接任越共领导人，但从政治上考量，我们的削弱越军的战略目的已经达到，并且这有可能导致苏联介入，必须谨慎决定。"
 prc.67.a:0 "目的达到，撤离越南"
 prc.67.b:0 "进军河内，推翻黎笋"

 prc.68.t:0 "胡耀邦去世"
 prc.68.d:0 "4月15日，中国国家主席、中共中央总书记胡耀邦因病在北京逝世。胡耀邦在任中共中央总书记、国家主席期间，积极与冤假错案作斗争，倡导言论自由，支持改革开放，廉洁爱民，与改革开放后的贪官形成鲜明对比。他的死留给了人民和他们的悲痛，他们自发地去天安门广场纪念这位领袖。"
 prc.68.a:0 "耀邦不朽。"

 prc.69.t:0 "学生在天安门聚集"
 prc.69.d:0 "国务院总理李鹏无视大学生对言论自由的要求，引起了市民的不满。他们开始罢工，聚集在天安门和大学区，讨论如何继续向政府请愿，争取一个民主的政治社会。"
 prc.69.a:0 "学生运动是爱国进步的，应该得到支持。"
 prc.69.b:0 "这是受西方思潮影响的资产阶级自由化运动，我们要警惕。"

 prc.70.t:0 "李鹏与学生代表见面"
 prc.70.d:0 "经过抗议学生集会和军警的一番紧张对峙，李鹏总理在今日同意接见抗议学生代表。电视媒体在受到部分抗议学生允可的情况下直播了活动的全过程。"
 prc.70.a:0 "学生们对言论自由、集会自由和办报自由的要求是正确的。"
 prc.70.b:0 "我们仍坚定地拒绝一切西方资本主义的媒体模式。"

 prc.71.t:0 "四二七社论"
 prc.71.d:0 "7月26日，《人民日报》发表社论指出：在悼念胡耀邦同志的活动中，出现了一些不正常的情况。在追悼大会后，极少数别有用心的人继续利用青年学生悼念胡耀邦同志的心情，打着民主的旗号破坏民主法制，其目的是要搞散人心，搞乱全国，破坏安定团结的政治局面。这篇文章引爆了北京各大高校学生的怒火。次日，数万人组织了一次遍及整个北京的大游行，要求政府收回社论。"
 prc.71.a:0 "人民日报，胡说八道！"

 prc.72.t:0 "大井冲突"
 prc.72.d:0 "在中央军委的命令下，解放军戒严部队乘坐巴士进入北京市区，经过大井路段时被示威者发现。他们闯入巴士内，将士兵赶出来抢夺他们的枪支。解放军严守“人民军队不伤害人民”的纪律，没有还手，而是就地而坐，与示威者对峙。然而当一名士兵被示威者推倒在地后，愤怒的另一名士兵用头盔把对方打得头破血流。随后解放军撤离现场。不久，各个部队在北京市其他地方也同示威者爆发流血冲突。"
 prc.72.a:0 "保持镇定，人民军队永远不能伤害人民。"
 prc.72.b:0 "自由化分子已经失去理智，立刻开始武力清场。"

 prc.73.t:0 "清场行动开始"
 prc.73.d:0 "6月3日午夜，驾驶着装甲车的解放军戒严部队开始从四面八方向天安门进发。在经过木樨地时，又有武装示威者手持石块木棍出现袭击解放军。当一架63式运兵车被焚毁，一辆卡车被推倒，十几名士兵伤亡以后，戒严部队终于开火射击，在射杀三十多名示威者后突破木樨地冲向天安门，一路上继续向人群开火，复兴门大街成为战场。6月4日凌晨，天安门广场上的广播对不安的人群发布了立刻疏散的命令，随后，戒严部队包围了广场上的人群。"
 prc.73.a:0 "他们这是自寻死路。"

 prc.74.t:0 "天安门的命运"
 prc.74.d:0 "就在戒严部队严阵以待，准备同广场上的示威者爆发更大的流血冲突时，大学教师刘晓波、台湾歌手侯德健，自由攒稿人周舵和学生高新四人乘坐救护车来到部队一方，与其指挥官见面。四人请求让广场上的人群和平地离开，再让解放军和平进驻。"
 prc.74.a:0 "今天北京已经死得够多人了，我们的目的是清场，不是杀人。"
 prc.74.b:0 "当这群智障焚烧解放军的尸体并吊起来时，他们想过这是暴行吗？礼尚往来。"

 prc.75.t:0 "天安门大屠杀"
 prc.75.d:0 "在刘晓波等人被逮捕带走后，戒严部队开始了对天安门广场上的武力清场。6月4日凌晨4点，数辆装甲车冲入天安门，对人群使用机枪扫射，碾压广场上的帐篷。一些学生试图用枪支和棍棒进行反击，但都倒在了枪口下。市民们纷纷溃散，向西南方向逃离，但又在六部口遭到驻扎在那里的部队攻击。凌晨六点半，戒严部队成功进驻已经血流成河的天安门广场，官方宣布清场行动结束。"
 prc.75.a:0 "今天北京已经死得够多人了，我们的目的是清场，不是杀人。"

 prc.76.t:0 "和平清场"
 prc.76.d:0 "经过广场四君子的交涉，戒严部队与示威者终于达成一致。6月4日凌晨四点，广场上的示威者不得不收起旗帜，排成队伍，高唱着国际歌，向西南方向撤离，随后，士兵将枪支换成木棍，进入人民英雄纪念碑。尽管这个过程中还是难免的发生了小规模肢体冲突，但最后大部分示威者还是安全离开了，戒严部队和平进驻天安门广场。"
 prc.76.a:0 "今天北京已经死得够多人了，我们的目的是清场，不是杀人。"

 prc.77.t:0 "第三届领导核心"
 prc.77.d:0 "在经历了六四政治风波以后，邓小平等中共高级元老意识到以赵紫阳为首的温和改革派已经不能在未来领导中共对抗西方的意识形态渗透，需要另外选定一名能够维护国家政权延续的领导人。有人建议由在政治风波中谨慎果敢的国务院总理李鹏担任下一任总书记，但也有人推荐和平处理上海示威事件的市长江泽民。"
 prc.77.a:0 "江泽民同志会领导我们党朝和平发展的道路前进。"
 prc.77.b:0 "李鹏同志会帮助我们的党对付资产阶级自由化。"

 prc.78.t:0 "戈尔巴乔夫访华"
 prc.78.d:0 "苏联的新领导人戈尔巴乔夫同志表达出了近日来华访问的意向。他所代表的苏联改革派一度颇得党内部分同志关注。自其上台后得一系列政治经济政策则端的是让人重新审视其工作水平。不过我们也并不能说完全了解苏联内政。而且最关键的问题是戈尔巴乔夫代表团来华不仅将在国际上产生影响，他们在我国内的举动也可能会在内政、党政方面激起未知形状的涟漪。"
 prc.78.a:0 "（欢迎）"
 prc.78.b:0 "（拒绝）"

 prc.79.t:0 "重组中苏联盟"
 prc.79.d:0 "苏联领导人代表团近日抵达我国，并在双方认同的基础上极力弥合中苏分歧。这一举动起初让我们非常困惑，但现在苏联人终于揭开了他们的题中之义——原来基于最近苏联的国际政治、经济状况，苏联人希望能够在两国共同受益的基础上重组中苏互助同盟。这可是赫鲁晓夫以来中苏外交的一大事件。"
 prc.79.a:0 "（接受）" # 共产主义+10%
 prc.79.b:0 "（拒绝）"

 prc.80.t:0 "北京之春"
 prc.80.d:0 "最近的世界局势已经让中国走到了历史的十字路口。时代的召唤也让一批新人站上历史舞台。虽然这些新人对于清末中华大革命的历史完全没什么了解。但他们却衷心呼唤着从更广泛的意义上结束社会主义，重建国民党曾经有望建立的民主政治。并在许多学生和中高层干部、军官中找到了支持者。于是，最近爆发的学生运动逐渐失去控制。最终超额完成了他们预定的任务——重塑了中国的顶层政权。"
 prc.80.a:0 "人民与民主的力量是不可战胜的！" # 民主+50 允许选举

 prc.81.t:0 "学生领袖发起绝食运动"
 prc.81.d:0 "那些在广场上的学生们在未能和领导人会谈得到满意成果后，开始策动部分学生群体在首都各处，尤其是天安门城楼下开始绝食静坐。学习欧美、印度、南非等地的“非暴力不合作”运动，以此发动舆论施压。"
 prc.81.a:0 "都是宝贵的大学生，和他们谈谈吧。"
 prc.81.b:0 "我们绝不向反革命分子妥协！"

 prc.82.t:0 "新的领导集体" #（这里以下先不用做）
 prc.82.d:0 "随着最近一系列政治动荡、政治事变的进一步发酵，旧领导集体已经不能再推动国内改革的发展。是时候选出能代表基层利益、改革运动的新领袖了。"
 prc.82.a:0 "为赵紫阳同志鼓掌！"
 
 

 prc.84.t:0 "《向毛主席和周总理提些意见》"
 prc.84.d:0 "作为对“百花齐放百家争鸣”政策的回应，《文汇报》主编储安平纂写了《向毛主席和周总理提些意见》并刊登，在文章中，储安平抨击中共执政以来，宗派主义严重，党群关系恶化，已经形成实际上的“党天下”。此言一出引起舆论关注，我们应该如何看待？"
 prc.84.a:0 "这是资产阶级的反扑！"
 
 
 

 prc.85.t:0 "新的领导集体"
 prc.85.d:0 "在一次遍及中南海怀仁堂以及首都其他地方的冲突落幕后，中央文革委员会的重要成员出面宣布已经成功恢复城区治安。并公布了一份政变集团的名单，许多华国锋政权的党政军高层领导赫然在列。新领导集体旋即宣布撤除华国锋同志的一切公职，软禁待审。并由一位文委领导取而代之——"
 prc.85.a:0 "江青同志身份特殊，十分合适。"
 prc.85.b:0 "王洪文同志组织和政工能力更强。"

 prc.86.t:0 "第二届全国人民代表大会"
 prc.86.d:0 "在第一次五年计划胜利完成后，中华人民共和国组织召开了第二届全国人民代表大会。选举的代表任期从1959年至1964年，期间召开过四次会议。第一次会议于1959年4月18日至4月28日在北京举行。第一次会议的主要议程是：听取政府工作报告，决定1959年国民经济计划，审议和批准1958年国家决算和1959年国家预算，通过全国人民代表大会常务委员会的工作报告，选举、任命国家领导人。会议通过了关于政府工作报告的决议，关于1959年国民经济计划、1958年国家决算和1959年国家预算的决议，关于全国人大常委会工作报告的决议，关于西藏问题的决议、关于撤销司法部、监察部的决议。"
 prc.86.a:0 "经济方面的领导刘少奇同志更受欢迎，获选任国家主席。"
 prc.86.b:0 "周恩来同志长期主持政府工作，没有争议地获选任国家主席。"
 

 prc.87.t:0 "毛泽东提出百花齐放、百家争鸣"
 prc.87.d:0 "在今天举行的在中共中央政治局扩大会议上，毛泽东提出，收到胡风事件的影响，学术和文艺界出现了比较压抑的氛围，言论自由收到了一定的压制。毛泽东指出，应该鼓励学术自由和文艺自由，鼓励知识分子对共产党提意见，以协助共产党进行整风。\n现在春天来了嘛，一百种花都让它开放，不要只让几种花开放，还有几种花不让它开放，这就叫百花齐放。\n——毛泽东"
 

 prc.88.t:0 "十一届三中全会"
 prc.88.d:0 "1978年，具有历史意义的中国共产党十一届三中全会召开。这次会议进一步批评了以邓小平为首的改革派，使邓在会议不久后再次辞去职务。华国锋总理通过这次会议进一步巩固了自己的地位，坚持阶级斗争以及其提出的“两个凡是”路线。"

 prc.89.t:0 "王洪文当选中共中央主席"
 prc.89.d:0 "中国国务院总理华国锋在四人帮及其支持者压力下被迫宣布辞去所有职务。曾经的中共第三号人物，四人帮成员王洪文前往北京，被任免为临时中共中央总书记。"

 prc.90.t:0 "王洪文当选中共中央主席"
 prc.90.d:0 "中共中央临时总书记王洪文在经过权力斗争后，出乎意料赢得了胜利，巩固自己的地位，从临时总书记转正。王总书记在天安门广场接见了支持自己的全国工人代表，承诺坚持将阶级斗争进行到底。"

 prc.91.t:0 "解放军占领长春"
 prc.91.d:0 "经过长时间的围困，长春市内的中华民国国军被迫宣布投降，中国共产党领导的中国人民解放军宣布进入长春。"
 prc.91.a:0 "继续关注中国战局"

 prc.92.t:0 "解放军占领沈阳"
 prc.92.d:0 "中共军队经过激烈的交战后攻占沈阳，国民党东北剿总土崩瓦解。这座东北最大工业城市的解放，标志着东北战事的结束，东北全境已完全纳入人民政权版图。\n解放军装甲部队正肃清残敌，国民党军丢弃的美制坦克在街头随处可见。东北剿总大楼前，垂头丧气的国民党士兵一个接一个地向解放军上交武器，剿总司令卫立煌已乘坐专机撤往北平。当地工人组成护厂队，完好保存了这座重工业城市的工厂设施。\n随着东北这个重要工业基地和粮仓的易手，中国战局已发生根本性转折。"
 prc.92.a:0 "革命到底！"

 prc.93.t:0 "解放军占领开封"
 prc.93.d:0 "经过三天激烈巷战，人民解放军今日完全占领河南省会开封。这座千年古都的解放，标志着解放军突入中原腹地的战略大门已被打开。\n开封解放使国民党"中原防御体系"出现致命缺口。军事观察家指出，解放军控制陇海铁路枢纽后，郑州、徐州已门户洞开。城内百姓箪食壶浆迎接子弟兵，商铺纷纷挂出"欢迎解放"的横幅。\n随着这座战略重镇的易手，解放军已掌握中原战场的主动权。"
 prc.93.a:0 "革命到底！"

 prc.94.t:0 "解放军占领徐州"
 prc.94.d:0 "经过激烈的交战，中国人民解放军占领了中国东部最重要的交通枢纽徐州。现在，中华民国首都南京就摆在中共部队的面前了。"
 prc.94.a:0 "勃勃生机，万物竞发。"

 prc.95.t:0 "解放军占领重庆"
 prc.95.d:0 "经过激烈的交战，中国人民解放军占领了中华民国陪都、中国西南的政治中心重庆市，至此，中国人民解放军已经占领中国超过三分之二的领土。"
 prc.95.a:0 "挺进大西南。"

 prc.96.t:0 "解放军占领上海"
 prc.96.d:0 "再几天的战斗后，国军的“保卫大上海”计划迎来彻底的失败，中国人民解放军成功占领了这座中国最大最繁华的城市。"
 prc.96.a:0 "列强们，再见了！"

 prc.97.t:0 "胡风的新文章"
 prc.97.d:0 "文艺评论家胡风在《希望》杂志发表文章，对中共的部分文化政策提出不同意见。胡风虽然拥护中国共产党，但长期以来却提出不同的文化政策观点。以中宣部副部长周扬为首的一些官员主张批评胡风的言论。"
 prc.97.a:0 "多此一举"
 prc.97.b:0 "胡风也许在策划着什么……"

 prc.98.t:0 "胡风“反革命集团”案"
 prc.98.d:0 "中共中央发布文件，指责在文化领域提出不同意见的作家胡风为“亲蒋介石的反革命分子”，胡风被捕，多人受牵连。"
 prc.98.a:0 "到此为止，不要扩大化。"

 prc.99.t:0 "三反运动扩大化"
 prc.99.d:0 "“三反”运动的胜利，巩固了工人阶级的领导地位和社会主义国营经济在国民经济中的领导地位，为对资本主义工商业和资产阶级进一步的社会主义改造创造了有利条件。一些党员主张将三反运动扩大化，进行反行贿，反偷税漏税，反偷工减料，反盗骗国家财产，反盗窃国家经济情报的“五反”运动。"
 prc.99.a:0 "很有必要"
 prc.99.b:0 "多此一举"

 prc.100.t:0 "三反运动扩大化"
 prc.100.d:0 "随着“三反”运动取得成功，中国共产党开始将三反运动扩大化，进行“五反”运动，以打击经济活动中的“资本主义残余”。"
 prc.100.a:0 "这也可以是好的。"

 prc.101.t:0 "“五反”运动的负面后果"
 prc.101.d:0 "“五反”运动导致了严重的经济后果，许多企业倒闭，企业家因冤假错案入狱或死亡。"
 prc.101.a:0 "我们要吸取教训。"

 prc.102.t:0 "上山下乡"
 prc.102.d:0 "毛泽东发表文章，提出”广阔天地，大有作为“，呼吁知识青年到农村去，接受贫下中农的再教育。在毛泽东支持下，许多中国知识分子前往农村，这一是为了锻炼知识青年，让他们参与到农村建设工作，另一方面也是通过疏散激进的学生以缓解文化大革命带来的负面破坏。"
 prc.102.a:0 "希望他们真能劳动，而不是缩在草垛上写歪诗。"
 
 prc.103.t:0 "毛泽东的影响力"
 prc.103.d:0 "随着战后婴儿潮带来的一代年轻人长大，他们开始积极投入政治活动，以抗争保守的政治风气和美国的霸权主义。在这些年轻人当中，中国领导人毛泽东的政治理论十分受欢迎。毛泽东不仅猛烈抨击帝国主义、霸权主义和非正义战争，并且积极支持年轻人参与政治，从而让他成为这一代年轻人最受欢迎的政治家。"
 prc.103.a:0 "世界是我们的，也是你们的，但终究就是你们的。"
 
 prc.104.t:0 "中华人民共和国提出加入联合国"
 prc.104.d:0 "近年来，随着以毛主席为代表的新中国逐渐崛起，在国际上屡屡发声。不仅亚非拉许多革命者、群众认可了中国成为第三世界兄弟和领袖，同时也有许多第二、第一世界的发达国家的进步学生、知识分子和无产阶级群众倒向马列毛思想。在这样的背景下，经过新中国外交人员的坚定努力，被称为世界一极的美国终于不能继续在联合国上否定新中国的地位了。\n于是，在一次不同寻常的代表会议上，由美苏等常任理事国带头，发起了一次承认中华人民共和国合法席位的联合国投票。国民党政权的代表虽然愤怒，但也无可奈何，只能以离席抗议。"
 prc.104.a:0 "支持！"
 prc.104.b:0 "反对。"
 
 prc.105.t:0 "中华人民共和国回归联合国"
 prc.105.d:0 "经过一轮紧张的投票，中华人民共和国恢复了他应得的联合国席位，取代缩居台湾的民国政权坐上了属于“中国”的常任理事国的席位。"
 prc.105.a:0 "支持"
 prc.105.b:0 "反对"
 
 prc.106.t:0 "联合国拒绝北京"
 prc.106.d:0 "以美国为首西方国家违背中美之间建立的外交承诺，组织活动，在联合国问题上继续抗拒新中国的参与。苏联等东方阵营国家则因为一些外交问题保持沉默。看来北京的新中国政权要全面打破外部封锁，还有很长的路要走。"
 prc.106.a:0 "支持"
 prc.106.b:0 "反对"
 
 prc.107.t:0 "建设新北京"
 prc.107.d:0 "中国共产党政府在他们的新首都北京开展了一系列建造工程，他们拆除了北京旧城墙，在天安门前建造了一个宏大的广场，这将是世界上最大的城市广场。广场周围还有人民大会堂、中国革命博物馆、人民英雄纪念碑等新建筑。"
 prc.107.a:0 "确定。"
 
 prc.108.t:0 "上海工人武装暴动！"
 prc.108.d:0 "文化大革命导致的动乱终于走向战争！在躲过华国锋政府的追捕后，以王洪文、江青、张春桥为首的中央文革小组连夜逃往上海，组织起用户自己的上海工人武装，否认北京中央的合法性并与之对抗，全国多地的红卫兵也积极响应，中国再次陷入内战的威胁之中！"
 prc.108.a:0 "确定。"
 
 prc.109.t:0 "美国向中国提供军事技术"
 prc.109.d:0 "美国向中国提供了一批先进武器装备，以帮助人民解放军进行军事现代化。"
 prc.109.a:0 "中美关系变得日益紧密"
 
 prc.110.t:0 "苏联向中国发动进攻！"
 prc.110.d:0 "在经过了十几年的对抗之后，中国与苏联，这两个曾经的社会主义盟友，终于彻底反目，爆发全面战争。苏联领导人[SOV.GetLeader]宣布，苏联发动的是一场旨在对抗中国教条修正主义，制止其对越南盟友侵犯的特别军事行动，而北京则斥责苏修帝国主义的公然入侵。"
 prc.110.a:0 "东亚局势恶化了。"
 
 
 prc.111.t:0 "如何回应苏联的军事行动？"
 
 prc.112.t:0 "[FROM.GetName]宣布退出华约！"
 
 prc.113.t:0 "对华战争陷入僵持"
 
 prc.114.t:0 "苏联撤出中国"
 
 prc.115.t:0 "[FROM.GetName]希望与我国建立外交关系"
 
 prc.116.t:0 "[ROOT.GetName]宣布与中华人民共和国建交！"
 prc.116.d:0 "[ROOT.GetName]宣布与中华人民共和国建立外交关系，并中止与中华民国的外交关系。"
 prc.116.a:0 "中华人民共和国的影响力正在提升。"
 
 prc.117.t:0 "北京政府希望改善与[ROOT.GetName]的关系"
 prc.117.d:0 "中华人民共和国领导人[SOV.GetLeader]表示，希望与[ROOT.GetName]建立友好关系。"
 prc.117.a:0 "确定。"
 
 prc.118.t:0 "中国宣布支持[ROOT.GetName]的斗争"
 prc.118.d:0 "中华人民共和国领导人[PRC.GetLeader]宣布，该国将坚定支持[ROOT.GetName]人民反对帝国主义及其傀儡政权的斗争。"
 prc.118.a:0 "确定。"
 
 prc.119.t:0 "红卫兵发动破四旧运动！"
 prc.119.d:0 "文化大革命进一步发酵，中国红卫兵发动破四旧运动！"
 prc.119.a:0 "确定。"
 
 prc.120.t:0 "中国提出社会主义建设总路线"
 prc.120.d:0 "中国政府提出社会主义建设总路线，希望鼓足干劲、力争上游、多快好省地建设社会主义。"
 prc.120.a:0 "确定。"
 
 prc.121.t:0 "亚洲人民革命统一战线成立！"
 prc.121.d:0 "中华人民共和国政府宣布，与多个亚洲社会主义国家建立盟友关系。在与苏联关系恶化后，中国选择建立自己的阵营，与美苏霸权主义对抗。"
 prc.121.a:0 "确定。"
 
 prc.122.t:0 "深圳特区招商局成立"
 prc.122.d:0 "中国政府宣布在深圳经济特区成立招商局，吸引来自香港台湾的外资企业投资创办工厂。"
 prc.122.a:0 "确定。"
 
 prc.123.t:0 "中国政府颁布关于经济体制改革的决定"
 prc.123.d:0 "中国政府宣布对现有的企业、尤其是国有企业进行改革，包括扩大企业自主权、导入更多的市场调节和民营成分，以及完善亏损国有企业的破产和转让机制。"
 prc.123.a:0 "确定。"
 
 prc.124.t:0 "中国共产党发行人民币"
 prc.124.d:0 "中国共产党宣布成立中国人民银行，开始在其解放区内发行第一套货币，取名为人民币。"
 prc.124.a:0 "确定。"
 
 prc.125.t:0 "毛泽东宣布中国人民解放军成立"
 prc.125.d:0 "中国共产党领袖毛泽东正式宣布，将共产党麾下所有武装部队，包括东北民主联军等，合并为统一的中国人民解放军。"
 
 prc.126.t:0 "中国共产党与新疆革命政府接触"
 prc.126.D:0 "中国共产党与新疆伊犁的三区革命政府进行了接洽，讨论了三区日后加入中国新政府的可能。"
 
 prc.127.t:0 "新疆革命政府加入中国共产党"
 prc.127.d:0 "苏联支持下的新疆东突厥斯坦共和国政府与中国共产党达成协议，双方同意共同对抗国民党政府，并在解放全国后，东突厥斯坦将并入新成立的中共政权。"
 
 prc.128.t:0 "新疆革命领袖在扎巴依喀勒山坠机遇难"
 prc.128.d:0 "来自莫斯科和北京方面的消息。新疆东突厥斯坦政府领导人乘坐的专机在飞往北京途中不幸遭遇空难坠毁，阿合买提江等新疆左派政治家不幸遇难。"
 
 
 prc.129.t:0 "中国政府向我们提出签订友好条约"
 
 prc.130.t:0 "《中苏友好条约》签署"
 
 prc.131.t:0 "苏联拒绝友好条约"
 
 prc.132.t:0 "毛岸英同志请求前往朝鲜参战"
 prc.132.a:0 "同意"
 prc.132.b:0 "拒绝"
 
 prc.140.t:0 "高岗同志的讲话"
 prc.140.d:0 "大跃进的失利引发了政治变动。计划委员会主席高岗在一次会议上，严厉地批评了国家主席刘少奇和总理周恩来，指责他们要为大跃进及最近的一系列经济问题负责。"
 prc.140.a:0 "高岗同志是正确的，应当有人为此承担责任。"
 prc.140.b:0 "高岗的讲话毫无逻辑，不应该将责任推卸给无辜的人。"
 
 prc.141.t:0 "高岗被进入中共中央政治局"
 prc.141.d:0 "在最近一次中共高级会议上，计划委员会主席高岗对刘少奇和周恩来进行的激烈的批评，指责他们要为大跃进及最近的一系列经济问题负责。高岗的讲话得到了毛泽东的支持，刘少奇和周恩来被迫进行了自我批评，高岗则得以进入中共中央高层，并获得了经济建设领域的主导权。"
 prc.141.b:0 "祝贺高岗同志。"
 
 prc.142.t:0 "高岗自杀！"
 
 prc.143.t:0 "中国政府宣布全面禁止鸦片！"
 
 prc.144.t:0 "中国政府宣布推动妇女权利改革！"
 
 prc.145.t:0 "中国政府宣布开展爱国卫生运动！"
 
 prc.146.t:0 "中国政府宣布开展除四害运动！"
 
 prc.147.t:0 "青帮头目黄金荣向上海军管会呈交《自述悔过书》"
 prc.147.d:0 "著名的上海黑帮头目黄金荣，正式向中共上海当局自首，并递交《悔过书》。黄金荣曾经是上海势力最大的黑帮头目之一，并与蒋介石有亲密关系，但中共政府根据自首从宽原则，不判处黄金荣死刑。"
 prc.147.a:0 "走向光明新社会的体现。"
 
 prc.148.t:0 "长江爆发严重水灾！"
 prc.148.d:0 "中国长江流域爆发严重的水灾！洪水几乎摧毁了从武汉到南京的大部分地区，受灾区域的农业和经济生产也遭到严重破坏！"
 prc.148.a:0 "真是糟糕。立刻指示救灾工作。"
 
 prc.149.t:0 "张澜去世"
 prc.149.d:0 "中国杰出的政治家、中国民主同盟的卓越领导人张澜在北京与世长辞，享年82岁。\n张澜1872年出生于四川省南充县，自日本留学回来后投资支持兴办教育，后积极参与君主立宪、保路运动、辛亥革命和五四运动，先后担任成都大学校长和四川省省长。张澜提倡学术自由和思想自由，抗日战争爆发后，张澜与中国共产党建立了友谊。1944年，为反对蒋介石独裁统治，张澜创建中国民主同盟。\n张澜一生追求民主、拥护进步，是中国共产党值得信赖的亲密朋友。他不仅是我国多党合作和政治协商制度的坚定支持者与实践者，更是杰出的爱国主义者，为国家解放与人民革命事业作出了重要贡献。"
 
 prc.150.t:0 "林徽因去世"
 prc.150.d:0 "中国知名文学家和建筑师林徽因在北京去世。"
 
 prc.151.t:0 "向雷锋同志学习！"
 
 prc.152.t:0 "中国多地人民公社开展积极的放卫星运动！"
 prc.152.d:0 "为了实现多快好省地尽快踏步进入共产主义，中国境内各地集体农庄和人民公社相应大跃进的口号，开展了“放卫星”运动，将生产指标提高到了天文数字。河南某农场在报纸上宣布自己要实现小麦每亩产八十万斤的目标，随后湖北某地也宣布自己将要每亩土地生产一百万斤水稻。这种放卫星风潮席卷了中国，毛泽东希望能以此鼓励全国人民的生产积极性。"
 prc.152.a:0 "好好好！要积极发动群众，力争上游！"
 prc152tool:0 "短时间内部分地区的粮食产量会迅速上升"
 
 prc.153.t:0 "地方出现粮食产量瞒报行为"
 prc.153.d:0 "我们的经济部门向我们发来警告，全国多地出现虚假汇报粮食产量，隐瞒真实生产状况的情况。赵紫阳同志认为，这可能是收到了大跃进和放卫星运动的影响，许多公社和集体农场虚高汇报自己的真实产量，这不利于政府了解真实经济生产状况和指定政策，甚至可能危害农业生产。"
 prc.153.a:0 "不用管，继续按大跃进方阵进行。"
 prc.153.b:0 "请有关部门进行调查。"
 prc142tool:0 "一些省份即使字面上粮食产量超过需求，但可能依然会出现粮食短缺"
 
 prc.154.t:0 "出现严重粮食短缺！"
 prc.154.d:0 "地区出现严重的粮食短缺，我们的干部在当地发现许多公社和村庄的粮食库存严重告急！许多群众无法得到基本食物，甚至出现了因营养不良而死去的人！"
 prc.154.a:0 "啊？？？？"
 
 prc.155.t:0 "全国性的自然灾害正在蔓延！"
 prc.155.d:0 "全国性的粮食短缺已经造成了严重的后果！已有多个省份出现了严重的饥荒和人口死亡！"
 prc.155.a:0 "啊？？？？"
 
 prc.156.t:0 "钢铁产量出现异常"
 prc.156.d:0 "工业部向我们汇报了钢铁供应的异常情况，许多部门反应他们收到了许多质量劣质，韧性不足、杂质过多的低质量钢材，这些低质量钢材都是来自于大炼钢铁的土法炼钢的产物。"
 prc.156.a:0 "不用管，继续按大跃进方阵进行。"
 prc.156.b:0 "请有关部门进行调查。"
 prc.156tool:0 "钢材产量减少§R60%§W"
 
 prc.157.t:0 "中国政府宣布开展反瞒产运动"
 prc.157.d:0 "中国政府宣布，由于大跃进以来所盛行的放卫星、浮夸风和共产风运动，许多地区都出现了虚假汇报农业产量的行为，这对国家的经济发展统筹规划是极其不利的。中国政府要求各地的农业生产单位停止放卫星和浮夸风，真实汇报粮食产量。"
 prc.157.a:0 "还是操之过急了。"
 leap_worward_warning:0 "大跃进的失败将影响毛泽东的威望"
 
 prc.158.t:0 "中国政府宣布停止大炼钢铁运动"
 prc.158.d:0 "中国政府宣布，大炼钢铁开始之后，虽然广大人民群众积极响应，踊跃参与，但由于许多群众缺乏对技术知识的理解，对生产知识掌握不足，许多生产出来的钢材不能满足工业消耗的需要。党中央国务院决定修改关于大炼钢铁运动的纲领，追求质量而非数量，并提高对钢材统购统销的质量需求。这一指令实际上也宣告了大炼钢铁运动的结束。"
 prc.158.a:0 "还是操之过急了。"
 
 prc.159.t:0 "来自山西省大寨县的先进经验"
 prc.159.d:0 "山西省大寨县的报告引起的党中央和毛主席的注意，大寨群众在陈永贵同志领导下，自力更生，自主生产，在敢叫日月换新天的精神下，开展生产建设运动，改造自然，扩大耕地，最终实现了惊人的农业生产产量！此事引起中央关注，许多干部认为，大寨县体现了党的群众路线建设精神，呼吁全国推广大寨经验。"
 prc.159.a:0 "真的有那么神奇吗？我很怀疑啊。"
 prc.159.b:0 "很好，应该鼓励全国积极学习大寨经验。"
 
 prc.160.t:0 "中国政府呼吁开展农业学大寨运动"
 prc.160.d:0 "中国共产党对山西省大寨县通过改造自然，扩大耕地面积的成功案例高度赞扬，并呼吁全国各地向大寨学习。"
 prc.160.a:0 "向大寨学习！向陈永贵同志学习！"
 
 prc.161.t:0 "粮食产量受到自然环境影响"
 prc.161.d:0 "来自地方的农业生产报告汇报了令人不安的信息。许多地区的粮食产量正在下降，作物生长异常，许多耕地遭遇风沙袭击，水土流失和盐碱化威胁。农业部认为，这可能是因为大规模推广大寨运动，导致自然环境遭受严重破坏导致的。"
 prc_ruined_farm_modofier:0 "被破坏的自然环境"
 prc.161.a:0 "没关系，人定胜天。"
 prc.161.b:0 "应当停止盲目模仿大寨的风气了。"
 
 prc.162.t:0 "中国政府宣布停止打麻雀运动"
 
 prc.163.t:0 "中国政府宣布调整学大寨运动政策"
 prc.163.d:0 "中国共产党向全国发布通知，调整学大寨运动的政策，暂停一系列自然改造和耕地扩大的措施。"
 prc.158.a:0 "还是操之过急了。"
 
 prc.164.t:0 "中国政府宣布开展三反运动"
 prc.164.d:0 "中国共产党宣布，全国范围内开展反贪污、反浪费、反官僚主义运动，并严惩贪污腐败和官僚主义影响的干部。"
 
 prc.165.t:0 "中国开始开发山东省胜利油田"
 
 prc.166.t:0 "中国开始开发克拉玛依油田"
 
 prc.167.t:0 "刘青山、张子善被捕！"
 prc.167.d:0 "一场贪污案件震惊了中国大陆！中共天津市官员刘青山、张子善两人被检举，通过盗窃、勒索、受贿等方式，贪污了将近1.84亿元，价值约等于一顿黄金！刘、张二人被揭发以后，目前关押在河北省司法厅等待审判。"
 prc.167.a:0 "我的意见是，杀！"
 prc.167.b:0 "贪了很多，但根据现行法律，还不至死。"
 
 prc.168.t:0 "刘青山、张子善被处于死刑！"
 prc.168.d:0 "在中共中央命令下，贪污犯刘青山、张子善被执行枪决。"
 prc.168.a:0 "好！杀鸡儆猴"
 
 prc.169.t:0 "刘青山、张子善被判处终身监禁！"
 prc.169.d:0 "在中共中央命令下，贪污犯刘青山、张子善被判处无期徒刑。"
 
 prc.170.t:0 "京剧《红灯记》在北京首演"
 
 prc.171.t:0 "电影《沙家浜》上映"
 
 prc.172.t:0 "小说《林海雪原》发表"
 
 prc.173.t:0 "电影《智取威虎山》上映"
 
 prc.174.t:0 "电影《白毛女》上映"
 
 prc.175.t:0 "电影《红色娘子军》上映"
 
 prc.176.t:0 "苏俄侨民问题"
 prc.176.d:0 "随着国内局势稳定，我们也该就我国东北地区的俄罗斯侨民问题进行研究了。目前东北境内生活着超过五十万俄罗斯人，他们有沙俄时期移居者的后裔，有苏俄内战后逃亡而来的难民，甚至还有日本投降后不愿意回苏联想在东北定居的苏联红军。有的同志认为东北的俄罗斯人是隐患，希望送回苏联，但也有的人认为，东北遭受严重的战争破坏，重建需要劳动力，因此建议允许俄罗斯人留在东北。"
 north_east_russian_tool:0 "东北地区将保留俄罗斯族"
 
 prc.177.t:0 "中国开始遣返苏联侨民"
 prc.177.d:0 "随着中国内战逐渐结束，中国政府宣布，将留在中国东北的数十万俄罗斯人遣送回苏联。这些俄罗斯人将在不久以后，通过铁路前往苏联远东地区。"
 
 prc.178.t:0 "中国承认东北俄罗斯族国籍"
 
 prc.179.t:0 "新疆自治区成立"
 prc.179.d:0 "中国政府宣布，随着新疆社会改革的完成，该国正式成立新疆自治区，首府迪化更名乌鲁木齐，在蒙古语中意为美丽的草原。同时组建了自治区的人民代表大会和政协会议。"
 
 prc.180.t:0 "西藏自治区成立"
 prc.180.d:0 "中国政府宣布，随着西藏民主改革的完成，该国正式成立西藏自治区，首府拉萨。前藏军将领、亲共人士担任首任西藏自治区主席，同时组建了自治区的人民代表大会和政协会议。"
 
 prc.181.t:0 "热、察、绥三省撤销"
 prc.181.d:0 "中国政府宣布，根据最近的人口调查，热河省、察哈尔省和绥远省的蒙古族人口超过全省人口的一半，因此根据民族区域自治制度原则，决定将这三个省份撤销，统一并入内蒙古自治区。"
 
 prc.183.t:0 "广西僮族自治区成立"
 prc.183.d:0 "中国政府宣布，根据最近的人口调查，广西省的少数民族僮族超过全省人口的一半，因此根据民族区域自治制度原则，同意广西成立僮族自治区。"
 
 prc.200.t:0 "[FROM.GetName]宣布支持西藏的分离主义运动！"
 prc.200.d:0 "[FROM.GetName]政府发表声明，他们对中国统治下的西藏地区的人权状况高度关注，职责中国政府镇压藏族人，并试图消灭他们的文化。[FROM.GetName]支持西藏人民反抗暴政，争取自由。"
 prc.200.a:0 "西藏问题复杂化了。"
 
 prc.201.t:0 "[FROM.GetName]宣布支持东突厥斯坦的分离主义运动！"
 prc.201.d:0 "[FROM.GetName]政府发表声明，他们对中国统治下的东突厥斯坦的人权状况高度关注，职责中国政府镇压维吾尔人，并试图消灭他们的文化。[FROM.GetName]支持维吾尔人民反抗暴政，争取自由。"
 prc.201.a:0 "新疆问题复杂化了。"
 
 prc.202.t:0 "[FROM.GetName]宣布支持中国东北的反对势力！"
 prc.202.d:0 "[FROM.GetName]政府发表声明，他们对中国统治下的满洲地区的人权状况高度关注，职责中国政府镇压满人和蒙古人，并试图消灭他们的文化。[FROM.GetName]支持满洲人民反抗暴政，争取自由。"
 prc.202.a:0 "中国问题复杂化了。"
 
 prc.203.t:0 "[FROM.GetName]宣布支持中国西南的反对势力！"
 prc.203.d:0 "[FROM.GetName]政府发表声明，他们对中国统治下的云南省和贵州省的人权状况高度关注，职责中国政府镇压当地少数民族，并试图消灭他们的文化。[FROM.GetName]支持少数民族反抗暴政，争取自由。"
 
 prc.204.t:0 "[FROM.GetName]宣布支持中国南方的反对势力！"
 prc.204.d:0 "[FROM.GetName]政府发表声明，他们对中国统治下的广西省和广东省的人权状况高度关注，职责中国政府镇压当地群众，迫害当地的民主人士。[FROM.GetName]支持中国民主人士反抗暴政，争取自由。"
 
 prc.205.t:0 "[FROM.GetName]宣布支持中国的民主主义人士！"
 prc.205.d:0 "[FROM.GetName]政府发表声明，他们对中国糟糕的人权状况高度关注，职责中国政府镇压争取合法诉求的示威者，迫害和关押民主人士。[FROM.GetName]支持中国民主人士反抗暴政，争取自由。"
 
 prc.206.t:0 "朱迈先被捕"
 prc.206.d:0 "湖南新宁县宣布，前中共党员、教师朱迈先因涉嫌反革命罪而被逮捕，引发国际社会关注。朱迈先的父亲朱自清是中国著名的文学家和民主运动家，因抵制蒋介石的独裁统治而绝食病逝，朱迈先因支持民主运动而加入中国共产党，但在中共发起的镇压反革命运动中，朱迈先却被指控支持反动派特务而被捕，并有被判处死刑的可能。"
 prc.206.a:0 "严重的错误！必须立刻反省并深刻检讨！"
 prc.206.b:0 "共匪犯下的又一桩血案！"
 
 prc.207.t:0 "阎锡山在台北去世"
 prc.207.d:0 "在台北寓所中，统治山西省近四十年、素有“山西王”之称的著名军阀阎锡山，于今日去世，享年七十六岁。这位出生于1883年山西五台县的旧式军人，其一生轨迹与近代中国的剧烈变革紧密交织。\n早年留学日本军校的经历，为其后来的军事生涯奠定了基础。辛亥革命的浪潮中，阎锡山审时度势，拥护袁世凯，并借此契机掌握了山西的军政大权。凭借山西富庶的资源与精明的治理手腕，他迅速崛起，成为北洋时期中国最具实力与影响力的地方军阀之一，其统治延续至1949年方告终结。他的去世，被外界广泛视为中国漫长而复杂的军阀割据时代最后一位标志性人物的离去，象征着一个旧时代的彻底落幕。"
 prc.207.a:0 "再无养人的山西小米和深刻的存在主义……"
 



 prc.210.t:0 "邓稼先请求回国" 
 prc.210.d:0 "在美国留学的中国导弹技术专家邓稼先先生在得知中国国防建设急需专业人才后，向北京发出了回国要求。"
 prc.210.a:0 "保持警惕，他跟国民政府关系亲密。"
 prc.210.b:0 "当然热烈欢迎。"

 prc.211.t:0 "邓稼先正计划回国！"
 prc.211.d:0 "邓稼先先生在回国的前一晚突然被美国联邦调查局逮捕！美国人认为他是为北京盗取和提供核子技术的间谍！"
 prc.211.a:0 "决不能让他回到中国！"
 prc.211.b:0 "他要走就走。"

 prc.212.t:0 "邓稼先被捕！"
 prc.212.d:0 "邓稼先先生在回国的前一晚突然被美国联邦调查局逮捕！美国人认为他是为北京盗取和提供核子技术的间谍！"
 prc.212.a:0 "无稽之谈。"

 prc.213.t:0 "邓稼先抵达"
 prc.213.d:0 "经过多方努力，邓稼先终于突破美国人的阻挠，回到了祖国。现在他已经摩拳擦掌，准备为新中国的国防事业作出自己的贡献了。"
 prc.213.a:0 "热烈欢迎！"
 
 
 

 prc.219.t:0 "任弼时去世"
 prc.219.d:0 "中国共产党中央政治局书记、中共军队政治部主任任弼时，因长期的劳累工作而突发脑溢血，倒在了办公桌上，经抢救无效而去世，年仅46岁。\n任弼时出生于湖南长沙，作为毛泽东同乡，很早便与毛泽东结识，并一同研究共产主义。中国共产党建立后，任弼时作为中共最早一批成员之一，曾经前往苏联留学。1927年第一次国共内战爆发后，任弼时成为中国红军的政治工作负责人，他支持在中共军队中建立政治委员制度，并大力支持毛泽东的领导地位。\n任弼时的去世令毛泽东和中共领导人悲伤不已，作为中共掌握最高权力的五个人之一，任弼时的早逝无疑是中共的巨大损失。"
 prc.219.a:0 "一位出色的政治家退出了历史舞台。"

 prc.220.t:0 "5606号热带气旋形成"
 prc.220.d:0 "根据美国军方的报道，一个热带低气压气旋在在北纬14.9度，东经146.1度的马里亚纳群岛附近形成。美国政府表示，该热带气旋有加大变成破坏性台风的危险。"
 prc.220.a:0 "令人不安"
 
 prc.221.t:0 "5606号热带气旋进入中国东海"
 prc.221.d:0 "5606号热带气旋不断向东北方向移动，已进入中国东海地区，风速达到120节，成为四级台风。台湾宣称台风导致的暴雨使得淡水河水位超过警戒线。"
 
 prc.222.t:0 "气象局发布警告！"
 prc.222.d:0 "5606号台风已逼近浙江沿岸！气象局呼吁立刻组织群众进行撤离，然而浙江地方政府不愿意放弃耕地和产业，试图组织人力，冒着暴雨和狂风加固堤坝和人力搬运物品。"
 prc.222.a:0 "这太危险了！立刻撤离浙江沿海群众！"
 prc.222.b:0 "人定胜天，应该鼓励动员群众，加固堤坝，抵御台风。"
 
 prc.223.t:0 "中国政府撤离浙江沿海地区居民"
 prc.223.d:0 "5606号热带气旋已经逼近中国浙江省沿海，中国政府采取行动，将该地区的群众疏散和撤离。"
 prc.223.a:0 "明智的选择。"
 
 prc.224.t:0 "中国政府组织浙江省堤坝修护"
 prc.224.d:0 "5606号热带气旋已经逼近中国浙江省沿海，中国政府开始动员居民，冒着暴风的危险进行堤坝加固。"
 prc.224.a:0 "啊？太冒险了！"
 prc.224.b:0 "人定胜天。"
 
 prc.225.t:0 "台风袭击浙江"
 prc.225.d:0 "5606号台风以14级的强风风速在中国浙江省象山县登陆，暴雨、狂风和洪水几乎将该地区摧毁，但由于中国政府及时组织了撤离工作，因此没有发生严重的人员伤亡。"
 prc.225.a:0 "有惊无险。"
 
 prc.226.t:0 "台风袭击浙江"
 prc.226.d:0 "5606号台风以14级的强风风速在中国浙江省象山县登陆，暴雨、狂风和洪水几乎将该地区摧毁，政府没有及时地撤离人员，甚至鼓励人们冒着狂风修建堤坝，导致了严重的人员伤亡，初步估算台风已导致超过六千人死亡和失踪。"
 prc.226.a:0 "一场悲剧。"
 
 prc.227.t:0 "5606号台风向北移动"
 prc.227.d:0 "5606号台风在登陆中国浙江省后继续向北移动，江苏省、安徽省、山东省、河南省和北京等地都遭到了暴雨袭击。"
 prc.227.a:0 "继续关注救灾情况。"
 
 prc.228.t:0 "5606号台风开始减弱"
 prc.228.d:0 "气象学家惊讶地发现，5606号台风开始向西进入中国河南省，这是及其少见的热带气旋进入内陆的现象，但幸运的是，气旋在河南省和陕西省交界地带开始减弱。"
 prc.227.a:0 "继续关注救灾情况。"
 
 
 prc.230.t:0 "《事情正在起变化》"
 prc.230.d:0 "毛泽东创作并发表了文章《事情正在起变化》，认为自从双百方针发表以来，学术界和党内舆论专注于批评教条主义，却疏忽了对修正主义的批判，即对共产党内部一些试图走“资产阶级复辟道路”的成员的批判。\n毛泽东严厉的批评但内的一些新成员和民主党派人士，反对共产党和社会主义，并要求“在百花齐放的同时，把毒草清理出去。”"
 prc.230.a:0 "蛇已引出洞……"
 
 prc.231.t:0 "章伯钧的政治文章"
 prc.231.d:0 "《光明日报》社长章伯钧发表了一篇论文，内容十分令人震惊，据说，章伯钧反对将文艺问题放到政治上讨论，主张共产党不应该干涉文艺创作，此外，章还主张加大民主党派的权力，最好让共产党和民主党派轮流坐庄。"
 prc.231.a:0 "这篇文章写得好，要发扬民主嘛。"
 prc.231.b:0 "胡说八道，共产党让出政权，那我毛泽东要回井冈山吗？"
 
 prc.232.t:0 "卢郁文收到恐吓信"
 prc.232.d:0 "民革委领袖、曾公开支持毛泽东反击右派的政治家卢郁文宣称，自己受到了一封恐吓信，可能来自北京大学的某个学生，信中强烈抨击卢郁文对毛泽东的支持。"
 prc.232.a:0 "学生性格比较躁动，可以理解。"
 prc.232.b:0 "学生太极端太过分了，要敲打一下。"
 
 prc.233.t:0 "北大发生奇怪的政治运动"
 prc.233.d:0 "北京大学出现了一个自称五一七诗会的组织，参与者包括学生和教师，这个所谓的诗会主张完全自由的文艺创作，不仅反对中国共产党对文学创作的干涉，甚至主张应该实现进一步的政治民主。"
 prc.233.a:0 "学生性格比较躁动，可以理解。"
 prc.233.b:0 "事情正在起变化。"
 
 prc.240.t:0 "王明滞留苏联"
 prc.240.d:0 "来自莫斯科的消息，中国共产党的重要领导人之一，中华人民共和国法制委员会委员长王明在前往苏联治病后，却没有返回北京，只是接见了几名中共派驻苏联的外交官。王明从长征时期就已经是中共的重要领导人，但他主张完全地模仿苏联模式进行革命，从而失去支持，并在抗日战争后期被排挤出权力核心。王明在中共建政后多次前往苏联，这一次直接留在了莫斯科不再回国。"
 prc.240.a:0 "随他去吧。"
 
 prc.241.t:0 "齐白石去世"
 prc.241.d:0 "中国近现代绘画大师、世界文化名人齐白石先生，于今日在北京病逝，享年九十三岁。先生生于湖南湘潭农家，早年以雕花木匠为业，二十七岁始学书画，后以“衰年变法”开创独特艺术境界。\n齐白石的艺术源于最深厚的民间土壤与生命体验。他创造性地将淳朴的乡土气息、文人画的笔墨意趣与市民阶层的审美情趣融为一体，形成“雅俗共赏”的鲜明风格。其作品题材极富生活情趣，游虾、螃蟹、蝌蚪、农具皆可入画，笔墨雄浑滋润，色彩浓艳明快，造型简练生动，意境淳厚朴实。尤为世人称道的是，他笔下的花鸟虫鱼，在高度概括的写意中蕴含着精微的观察与天真的意趣，自称 “为万虫写照，为百鸟张神” 。先生的逝世，是中国美术界的重大损失，但其充满生命力的艺术，已成为中华文化宝库中不朽的瑰宝。"
 prc.241.a:0 "中国艺术界的一大损失。"
 
 prc.242.t:0 "中国武汉长江大桥落成！"
 prc.242.d:0 "来自中国的消息。经过两年多的建设，中国武汉建造了长江历史上第一座跨江大桥！这结束了长江两岸的居民只能依靠船只往来的历史！数千年来，中国人只能依靠船只，穿过凶险的长江降水，中国政府自清末以来多次尝试在武汉建造横跨长江的桥梁，但都以失败告终。而武汉长江大桥实现了这一梦想，这不仅是中国政府工业化的巨大成就，也是一个巨大的政治成就。"
 prc.242.a:0 "长江天堑，走入历史！"
 
 prc.243.t:0 "国民党空军轰炸上海"
 prc.243.d:0 "国民党军空军对上海进行了袭击，对洋浦发电厂等地投掷炸弹，造成多人死伤，并对上海的经济生产和民用设施带来了巨大破坏。"
 prc.243.a:0 "国民党反动派又一血债！"
 prc.243.b:0 "共匪应得的！"
 
 prc.244.t:0 "国民党空军轰炸上海"
 prc.244.d:0 "上海消息。\n在上海被中共军队占领后，国民党政府便在美国支持下，不断对上海这一中国最重要的经济中心进行攻击。昨天，国民党空军出动两百多架战机，对上海进行了史无前例的大轰炸。仅仅在一个多小时内，国民党飞机便投下七十多枚炸弹，炸毁杨树浦电厂、闸北水电公司、华商电气公司和法商电车电灯公司，并造成一千四百多人死伤。\n遭受轰炸后的上海陷入瘫痪，全市面临停水停电的危机。"
 
 
 
 prc.250.t:0 "轰轰烈烈的大炼钢铁运动！"
 prc.250.d:0 "抓效率，抓生产，抓速度！全国人民一条心，男女老少齐上阵，多快好省地建设社会主义！\n在伟大领袖毛主席的教导下，广大人民群众充分发挥主卦能动性，投入到轰轰烈烈的大炼钢铁运动当中！\n人民日报社刚刚收到消息，又有一个地区的群众，在毛泽东思想指导下，发挥人力优势，开展炼钢工程，将收集到的废铜、废铁和其他金属，成功打造出一批优质的新钢材！工业部已派专家前往查看，评定这批新造的刚才，品质好，质量高，充分体现了在社会主义制度下，动员广大人民群众参与到工业大生产当中的优势，有力的反驳了右倾分子的保守主义，使我国工业力量赶英超美事业迈上新的台阶！"
 prc.250.a:0 "力争上游，多快好省，十年之内，赶英超美！"
 prc.250.b:0 "不要操之过急，有序进行。"
 
 prc.251.t:0 "河南遂平县卫星农业社小麦平均亩产达到2105斤！"
 prc.251.d:0 "震惊世界的大消息！\n河南省遂平县的卫星农业社，充分发挥人有多大胆，地有多大产的共产主义建设精神，辛勤劳作，在五亩地上生产出亩产小麦2105斤！"
 prc.250.a:0 "好！要积极发动群众，创造出资本主义国家望尘莫及的成就！"
 prc.250.b:0 "胡说八道，我毛泽东也是农民，没听过这么离谱的产量，怕不是作假！"
 
 prc.252.t:0 "来自青海高原上的农业奇迹！"
 prc.252.d:0 "在大跃进和总路线的指引下，青海柴达木盆地的塞什克农场第一生产队，创造出了亩产小麦8585斤的伟大胜利！"
 prc.250.a:0 "好！要积极发动群众，创造出资本主义国家望尘莫及的成就！"
 prc.250.b:0 "胡说八道，我毛泽东也是农民，没听过这么离谱的产量，怕不是作假！"
 
 prc.253.t:0 "群众上山砍树造炭"
 prc.253.d:0 "随着大炼钢铁运动轰轰烈烈开展，对煤炭的需求越来越高，许多地方的群众发现用于土法炼钢的煤炭严重不足，于是部分地区的地方党委发动群众，砍伐森林获取木炭。"
 prc.253.a:0 "这不成，树木砍光了就是竭泽而渔，尽快调整这一错误。"
 prc.253.b:0 "很不错！资源就是拿来用的。"
 
 prc.254.t:0 "群众将大量时间投入到炼钢当中"
 prc.254.d:0 "我们收到许多地方党委的抱怨，由于大力开展大炼钢铁运动，许多本应该在田里劳作的公社生产队社员，都把事件花到炼铁上去了。许多的土地没人耕作导致荒废。"
 prc.254.a:0 "这不成，群众都去砍树了，谁来种田呢？尽快调整这一错误。"
 prc.254.b:0 "很不错！耕地炼钢两不误，充分利用劳动力！"
 
 prc.255.t:0 "增城挂绿荔枝遭到破坏"
 prc.255.d:0 "来自广州市党委的消息。具有数千年历史、曾作为唐代杨贵妃贡品的增城挂绿荔枝遭到破坏！当地群众为了收集大炼钢铁的燃料，不顾广州地方文物局的阻挠，将增城荔枝树大量砍伐，尽管地方公安尽力保护，但增城荔枝还是一夜之间变成了珍稀物种！"
 prc.255.a:0 "可惜了。"
 prc.255.b:0 "很不错！资源就是拿来用的。"
 
 prc.256.t:0 "毛泽东在郑州召开会议"
 prc.256.d:0 "毛泽东主席在河南、河北多地视察了人民公社的农业生产，其中包括多个放卫星的公社。这些公社曾经宣称，自己的小麦能够达到亩产一千多，甚至两千多斤。\n然而，毛泽东没有对这些自称获得超高产量的人民公社进行表扬，相反，毛泽东结束视察不久后，在郑州召开了会议。\n毛泽东疑惑地表示，自己也是农民出身，自己从未见过能够实现亩产两千多的耕地。他直白地质疑，是不是有公社说假话，吹牛皮，要严肃地调查。"
 prc.256.a:0 "还是要实事求是。"
 
 prc.257.t:0 "中共宣布为部分右派进行摘帽"
 prc.257.d:0 "在反右运动爆发近两年多后，中共中央召开会议，宣布为反右运动中的冤假错案平反，并为一些曾被扣上大右派、大反动派、反党分子和特务帽子的知识分子摘帽。\n轰轰烈烈的反右运动到此告一段落，大量被斥为右派的知识分子得以结束劳动改造，但只有少部分人回到了工作当中，且依然受到严密监视。"
 prc.257.a:0 "真是一次不小的风波"
 
 prc.258.t:0 "第八届中央委员会第九次会议召开"
 prc.258.d:0 "中国共产党第八届中央委员会第九次会议，在大跃进面临严重挫折的背景下召开。毫无疑问，在大量土法炼钢受挫，高产卫星遭到严重批评，粮食产量迅速下降甚至出现大量人口死亡的情况下，大跃进已无以为继。\n国务院副总理、国家计划委员会副主任李富春同志提出，以调整、巩固、充实、提高八字方针代替大跃进，应当立即结束大规模的大炼钢铁、人民公社化和放卫星运动，以调整国民经济，恢复市场。"
 prc.258.a:0 "总结经验，吸取教训，调整路线，悬崖勒马。"
 prc.258.b:0 "胡扯！大跃进取得巨大的成就，是右派分子唱反调！"
 
 prc.259.t:0 "中共提出八字方针"
 prc.259.d:0 "中国共产党第八届中央委员会第九次会议，在大跃进面临严重挫折的背景下召开。\n国务院副总理、国家计划委员会副主任李富春同志提出，以调整、巩固、充实、提高八字方针代替大跃进，应当立即结束大规模的大炼钢铁、人民公社化和放卫星运动，以调整国民经济，恢复市场。\n在周恩来支持下，新的政策得以通过，由此，轰轰烈烈的大跃进、大炼钢铁运动宣告结束。"
 prc.259.a:0 "总结经验，吸取教训，调整路线，悬崖勒马。"
 
 prc.260.t:0 "钱伟长遭受攻击"
 prc.260.d:0 "中国著名物理学家，在力学领域有卓越贡献的钱伟长教授，因为在早年的作品中，反对盲目模仿苏联教育制度，提倡理工合校，重视基础学科，而在反右运动爆发后被抓住把柄。清华大学掀起了批判钱伟长的运动，指责他是大右派和反动学术权威。钱伟长遭到中国科学院停职并等待调查。"
 
 prc.261.t:0 "毛主席视察安徽大炼钢铁现场！"
 prc.261.d:0 "新华社安阳电，毛泽东主席近日视察了安徽的安阳、合肥、淮安等地的大炼钢铁运动现场。毛主席看到，广大人民群众在党的领导下，在田里筑起高炉，融化废铜废铁，将其冶炼成全新的钢铁材料，毛主席对发动人民群众进行大炼钢铁的决定予以高度评价，并呼吁全国各地积极参与其中。"
 
 prc.262.t:0 "钱学森对高产卫星运动给予赞赏"
 prc.262.d:0 "物理学家钱学森在《中国青年报》上撰文，大力赞扬粮食高产运动。\n土地所能给人们的粮食产量碰顶了吗？科学的计算告诉人们：还远得很！\n把每年射到一亩地上的太阳光能的30%作为植物可以利用的部分，而植物利用这些太阳光能把空气里的二氧化碳和水分制造成自己的养料，供给自己发育、生长结实，再把其中的五分之一算是可吃的粮食，那么稻麦每年的亩产量就不仅仅是现在的两千多斤或三千多斤，而是两千多斤的20多倍！"
 
 
 
 prc.263.t:0 "中央军委扩大会议"
 prc.263.d:0 "在今天召开的中央军委扩大会议上，刘伯承、彭德怀和粟裕元帅提出，应该对中国人民解放军的组织架构进行改革，将部队指战员的决策权置于同级党政治委员之上。"
 prc.263.a:0 "胡说！这是要搞枪指挥党嘛！"
 
 prc.264.t:0 "刘伯承、粟裕被迫辞职"
 prc.264.d:0 "刘伯承、彭德怀和粟裕元帅提出将部队指战员的决策权置于同级党政治委员之上的建议遭到了严厉的批评，毛泽东指责则是一种背弃中国共产党军事纪律原则，搞枪指挥党的军阀思维，“向党要权”、“向国防部要权”、“争夺军队领导权限”。彭德怀很快放弃了这种理念，而刘伯承、粟裕则遭到了批判。在邓小平调解下，两位元帅只好暂时辞去职务。"
 prc.264.a:0 "党与枪的裂痕初现……"
 
 prc.265.t:0 "中国军事代表团访问东欧"
 prc.265.d:0 "由彭德怀元帅率领的中华人民共和国军事代表团访问[FROM.GetName]，受到了[FROM.GetName]党政军高级干部的热烈欢迎。彭德怀元帅抵达机场，[FROM.GetName]党总书记[FROM.GetLeader]亲切会见元帅，并举行了热烈的欢迎仪式，迎接这位在朝鲜战场上击败了美国军队的军事家。\n[FROM.GetName]政府举行晚宴，两国高级官员相谈甚欢。彭德怀元帅祝贺两国友谊长存。"
 prc.265.a:0 "社会主义阵营的和平与团结万岁！"
 
 prc.266.t:0 "中国的人民公社运动引起注意"
 prc.266.d:0 "中国共产党政府所推行的所谓人民公社运动引起许多社会主义国家的注意，这种基层农业组成形式，通过将小的农业合作社合并为大的公社进行集体化。人民公社起初进行按劳分配，后来改为“大锅饭”，即无偿分享劳动成果。中共及其支持者认为这是进入共产主义的体现。"
 prc.266.a:0 "这不过是荒诞且脱离实际的理想主义乌托邦！"
 prc.266.b:0 "这是一次伟大的尝试，也许我们可以多多学习，"
 
 prc.267.t:0 "苏联强烈批评人民公社运动！"
 prc.267.d:0 "苏联领导人[SOV.GetLeader]在最近一次谈话上，对记者谈起中国最近推行的所谓人民公社运动。[SOV.GetLeader]认为人民公社运动是及其愚蠢和错误的，他将导致灾难性的后果。\n\n中国人现在正在组织公社。在我国这在30年前就曾有过，对这个我们腻了。可是中国人嘛，就让他们去尝试吧。当他们碰得头破血流时，就会有经验了。\n公社制度今天对俄国是不适宜的。无论如何这个词是用错了，不知道为什么中国人选用了这个词，因为‘公社’一词起源于法国大革命时代，它是一种城市的而不是农村的管理形式。无论如何，中国的制度实际上是反动的。苏联很久以前就曾尝试过公社制度，但是行不通，而现在苏联采取的是物质刺激的方法。"
 prc.267.a:0 "看来莫斯科与北京有一些路线上的分歧。"
 
 prc.268.t:0 "[FROM.GetName]对人民公社化运动予以赞赏"
 prc.268.d:0 "[FROM.GetName]共产党政府派遣人员前往中国考察后，对中国的人民公社运动予以高度赞扬，认为这种模式有效地推动了社会主义生活方式朝着共产主义迈进的经验。"
 prc.268.a:0 "中国人与[FROM.GetName]达成了一致"
 
 prc.269.t:0 "中共中央委员会第八次全体会议召开"
 prc.269.d:0 "中共中央委员会第八次全体会议在江西庐山召开，这一次会议的氛围十分严肃。大跃进并没有获得预想中的成果，反而造成了严重的资源浪费和粮食减产。毛泽东、邓小平、刘少奇、彭德怀、林彪等出席会议，各方将针对大跃进问题进行讨论。"
 prc.269.a:0 "路线斗争将被摆上台面了，"
 
 prc.270.t:0 "彭德怀、黄克诚、张闻天的万言书"
 prc.270.d:0 "彭德怀、黄克诚、张闻天致信毛泽东同志：\n\n1958年的基本建设，现在看来有些项目是过急过多了一些，分散了一部分资金，推迟了一部分必成项目，这是一个缺点……\n1959年就不仅没有把步伐放慢一点，加以适当控制，而且继续大跃进，这就使不平衡现象没有得到及时调整，增加了新的暂时困难……\n我觉得，系统地总结一下我们去年下半年以来工作中的成绩和教训，进一步教育全党同志，甚有益处。其目的是要达到明辨是非，提高思想，一般的不去追究个人责任。反之，是不利于团结，不利于事业的……"
 prc.270.a:0 "残酷的事实摆在了面前，我们必须自我批评，反省错误"
 prc.270.b:0 "大跃进的方针是绝对正确的！反对大跃进的人，莫不是有阴谋！"
 
 prc.271.t:0 "毛泽东作自我批评"
 prc.271.d:0 "在今天的庐山会议上，毛泽东意外的对彭德怀、张闻天等人做了让步，毛泽东似乎意识到了大跃进的执行有些急躁、过于浮夸了，最终，毛决定接受彭的意见。\n\n去年亩产实际只有三百斤的，今年能增产一百斤、二百斤，也就很好了。吹上八百斤、一千斤、一千二百斤，甚至更多，吹牛而已，实在办不到，有何益处呢？又例如，去年亩产五百斤的，今年增加二百斤、三百斤，也就算成绩很大了。再增上去，就一般说，不可能的。\n同现在流行的一些高调比较起来，我在这里唱的是低调，意在真正调动积极性，达到增产的目的。如果事实不是我讲的那样低，而达到了较高的目的，我变为保守主义者，那就谢天谢地，不胜光荣之至。\n\n这是一个信号，毛泽东表态同意党内决策层逐步停止大跃进。"
 
 prc.272.t:0 "林彪、刘少奇对彭德怀发起批评"
 prc.272.d:0 "林彪向毛泽东示意，彭德怀反对大跃进是一个阴谋，想要挑战毛泽东的权威。\n\n彭这一次写信是“招兵买马，是阴谋家、野心家、伪君子”，“是冯玉祥式的人物……“"
 
 prc.273.t:0 "彭、黄、张、周反党集团！"
 prc.273.d:0 "原本主张在庐山会议上“纠左”的毛泽东转而批判“彭德怀反党集团”\n彭接到军委扩大会议秘书处通知：“主席团决定，为了使你有时间作检讨，这几天你可以不参加大会。大会发言稿将全部送你。待你的检讨发言稿准备好了，再来参加。”\n毛泽东在军委扩大会议和外事会议（批判张闻天）与会人员联席会上讲话，说彭居心不良，走到他的反面……从来就不是马克思主义者……是资产阶级分子、投机分子混在我们的党内来……"
 prc.273.t:0 "一场政治风暴已不可避免"
 
 prc.274.t:0 "彭德怀辞去中央职务"
 prc.274.d:0 "针对彭德怀的批判持续扩大，彭被迫辞去国防部长职务，避居湖南。"
 
 prc.275.t:0 "中华人民共和国第二届全国人民代表大会召开"
 prc.275.d:0 "中华人民共和国第二届全国人民代表大会在北京召开，原计划毛泽东将在今年正式辞去中华人民共和国国家主席的职务，让位于接班人刘少奇，但随着毛泽东与刘少奇就大跃进、人民公社化等运动上的分歧扩大，二人之间的交接是否能顺利进行，引起国内外的广泛讨论。"
 prc.275.a:0 "刘少奇的工作十分优秀，应该支持他接任党的主席。"
 prc.275.b:0 "刘少奇的工作不尽人意，应暂缓他掌握最高权力。"
 
 prc.276.t:0 "刘少奇接任中华人民共和国国家主席"
 prc.276.d:0 "毛泽东在二届全国人民代表大会上正式宣布，辞去中华人民共和国国家主席职务，刘少奇接任国家主席。"
 prc.276.a:0 "热烈祝贺刘少奇同志！"
 
 prc.277.t:0 "毛泽东连任中华人民共和国国家主席"
 prc.277.d:0 "毛泽东在二届全国人民代表大会上宣布连任中华人民共和国国家主席职务，原计划由刘少奇接任国家主席的方案被推迟。"
 prc.277.a:0 "毛也许有他自己的想法。"
 
 
 
 prc.278.t:0 "锦州发生特大洪水灾害！"
 prc.278.d:0 "辽宁省锦州地区的一场暴雨引发洪水，冲毁了六股河上在建的10座中型水库，冲断了当时的交通命脉京沈铁路，引起全国震动！"
 
 prc.279.t:0 "水库大跃进！"
 
 prc.280.t:0 "中共中央制定粮食征购标准"
 prc.280.d:0 "中共中央根据1958年，全国粮食产量有所上涨的工作报告，按照1958年的标准，决定在全国征购粮食1350亿斤。"
 
 
 
 prc.281.t:0 "河南省来信"
 prc.281.d:0 "河南省商城县越美公社负责人许学富致信周恩来总理：\n\n我县发生严重的粮食减产导致的群众非正常死亡问题，我社观庙团、汪桥团共78个食堂中有74个断粮两个多月，大量群众因为断粮而死，或冒险度过淮河逃亡安徽。\n由于信阳地方党政干部的阻挠，我无法透露更多信息，请中央速派人前往河南调查情况，救救河南人民。"
 prc.281.a:0 "越级上访恐有不妥，交由河南地方自行处理。"
 prc.281.b:0 "还有这事儿？！立刻派人去调查！"
 
 prc.282.t:0 "河南省委复信国务院"
 prc.282.d:0 "河南省委就河南个别地区所谓缺粮问题致国务院办公厅：\n\n河南东部部分地区因为个别干部工作疏忽、反右倾运动扩大等问题，局部出现一些群众因为生活照顾不到位而病死的情况，此事省委已派人专门处理。暂未发现所谓大量群众饿死的情况。"
 prc.282.a:0 "继续调查"
 
 prc.283.t:0 "中央专员抵达河南"
 prc.283.d:0 "河南传出的大量群众因缺粮饿死的情况已惊动党中央国务院，周恩来总理指示检察院、卫生部等组件专门调查团前往信阳、商城、淮滨、固始等地调查情况。\n调查团已于今日早晨抵达洛阳，河南省委第一书记吴芝圃、商城县第一书记王汉卿接待了代表团。"
 
 prc.284.t:0 "卫生部医疗队致中央急电！"
 prc.284.d:0 "致周恩来总理及中央各同志：\n我部医疗队对河南东部多地进行了考察，考察的结果令人触目惊心！\n夏邑、永城、虞城、鹿邑等县的群众已断粮数月，该地区今年年初就已经发生严重浮肿病和死人现象。潢川县、固始县的公路旁边甚至可见饿死的尸体……\n正阳县原报去年冬今年春死1万8千多人，现初步揭发已达8万多人；新蔡县原报去冬今春死三万来人，现增加到近10万。遂平县嵖岈山人民公社，过去只报死600余人，现揭发死人近4千，占总人口10%，有的队人口死亡达30%左右。各种惨绝人寰的反革命暴行，各县、社几乎都有，从初步揭发的材料看，不仅农村严重，而且城市、工厂、机关、学校、商店、医院都很严重。光山县12个中学，有8个中学校长有人命血债，城关高中和初中两个学校，初步揭发被打死、逼死的教员学生达二十八人，不论淮南、淮北广大群众在经济上都遭受了极大摧残，生活异常困难，真正是“十室九空，家贫如洗。”光山槐店公社很多村子都没有了，一个九十人小队，只剩下三十多个人了……"
 prc.284.a:0 "我的天！！！"
 
 prc.285.t:0 "中共中央宣布全面调查和处理信阳事件"
 prc.285.d:0 "河南信阳爆发大面积粮食短缺的报告震惊了北京的中国共产党领导层。毛泽东愤怒地要求进行全面调查，并指责河南政府对河南人民犯下反革命罪行。\n河南省委书记吴芝圃已被停职，河南全省二百多名官员被逮捕和撤换。商城县第一书记王汉卿、固始县第一书记路宪文因阻挠调查团而被判处十三年监禁。\n刘少奇、周恩来认为发生在河南的灾难性饥荒，是三分天灾，七分人祸，并要求全面调查事件起因，尤其是要严肃对待调查团所报告的，地方政府为了避免自己辖区，所谓高产粮食的谎言被揭穿一事而强征粮食的行为。"
 prc.285.a:0 "非战争年代出现人相食，这是要成为历史罪人的。"
 
 prc.286.t:0 "[STATE.GetName]粮食生产状况调查报告"
 prc.286.d:0 "[STATE.GetName]党致信党中央国务院：\n我县党政干部配合中央调查组委，对本地区的粮食真实产量、居民生活状况进行了全面调查，我们可以以政治前途作为保障，目前我地区没有发生严重的粮食短缺现象，部分居民生活物资得不到满足的，已进行调整。我地区受浮夸风影响，部分公社瞒报真实粮食产量，导致我地区党委的征粮工作出现过头粮情况，目前已采取措施进行补救。"
 prc.286.t:0 "亡羊补牢，为时不晚。"
 
 prc.287.t:0 "[STATE.GetName]地区缺粮情况报告"
 prc.287.d:0 "[STATE.GetName]党致信党中央国务院：\n受大跃进浮夸风；共产风影响，多地公社瞒报真实粮食产量，导致我地区党委的征粮工作出现过头粮情况。党政干部思想严重滑坡，官僚主义、军阀作风横行，为了征集上级要求的粮食数量，竟违背法纪，背离人民，使用暴力手段强制夺取人民群众的库存口粮，导致大量群众忍饥挨饿，死于断粮。党委与调查团抵达这些地区后，看见了触目惊心的死亡数字，目前，党委已对这些重大错误干部进行了严肃的处理，但依然急需中央提供帮助，调集粮食，救助受灾群众。"
 
 prc.289.t:0 "《中共中央关于农村人民公社当前政策问题的紧急指示信》"
 prc.289.d:0 "在信阳事件震惊中央后，周恩来紧急起草了补救措施。周恩来呼吁立刻停止人民公社偏离现实的平均主义、蔓延全国的共产风、浮夸风问题，允许农民保有自留地等。最重要的是，周恩来指示尽快从中央拨款填补民众的粮食缺口，并在全国范围内对瞒报粮食产量、粮食短缺的行为进行调查。"
 
 
 prc.290.t:0 "专家组进驻[STATE.GetName]进行调查"
 prc.290.d:0 "中央派出的专家组已进驻[STATE.GetName]，对瞒报粮食产量、粮食短缺的行为进行调查。"
 prc.290.a:0 "要严肃认真追查到底！"
 
 prc.291.t:0 "全国缺粮状况已调查结束"
 prc.291.d:0 "全国范围内开展的针对瞒报产量、违规强征、群众非正常死亡状况的调查已基本完成。"
 
 prc.291.t:0 "全国缺粮状况已调查结束"
 
 
 
 prc.300.t:0 "建国十周年国庆大会的筹备"
 
 prc.301.t:0 "中华人民共和国举行十周年国庆大会"
 prc.301.d:0 "北京今日举行盛大庆祝活动，纪念中华人民共和国成立十周年。天安门广场上红旗招展，数万群众齐聚一堂，共同见证这一历史性时刻。\n上午10时，庆典在礼炮声中拉开帷幕。盛大的阅兵式上，林彪元帅率领人民解放军陆海空三军方阵依次通过天安门广场，最新型的国产武器装备首次公开亮相。群众游行队伍随后登场，展现十年来工业、农业等各领域建设成就。\n广场北侧新建的人民大会堂在阳光下熠熠生辉，这座仅用十个月建成的宏伟建筑，成为新中国建设速度的象征。夜幕降临后，绚丽的焰火照亮北京夜空，天安门城楼上的巨幅标语"中华人民共和国万岁"格外醒目。\n随着《歌唱祖国》的旋律响彻云霄，这个年轻共和国正以昂扬姿态迈向第二个十年。"
 prc.301.a:0 "伟大的中国共产党和领袖毛主席万岁！"
 
 prc.302.t:0 "中华人民共和国建国十周年晚宴"
 prc.302.t:0 "来自87个国家的代表团和国家领导人齐聚北京的人民大会堂，参与中华人民共和国成立10周年的外宾晚宴。"
 
 
 
 prc.310.t:0 "爱新觉罗·溥仪问题"
 prc.310.d:0 "中国的末代皇帝，伪满皇帝爱新觉罗·溥仪在八月风暴行动后被苏军俘获，目前关押在伯力。现在国内战争已结束，应当向苏联提出，将溥仪等一众战犯引渡至国内受审。"
 prc.310.a:0 "向苏联提出引渡要求，溥仪必须回国接受人民审判！"
 
 prc.311.t:0 "中共提出让溥仪回国"
 prc.311.d:0 "中国的末代皇帝，伪满皇帝爱新觉罗·溥仪在八月风暴行动后被苏军俘获，目前关押在伯力。中国共产党政府认为，国内战争已结束，应当将溥仪等一众战犯引渡回中国国内受审。"
 prc.311.a:0 "中共恐怕会处死溥仪，这对我们的外交声誉不利"
 prc.311.b:0 "将溥仪交给中国人自己处理吧"
 
 prc.312.t:0 "苏联拒绝溥仪回国"
 prc.312.d:0 "苏联政府拒绝了我们提出的将溥仪等伪满战犯引渡回国的要求。"
 prc.312.a:0 "竟然不许！"
 
 prc.313.t:0 "苏联同意溥仪回国"
 prc.313.d:0 "苏联政府同意了我们提出的将溥仪等伪满战犯引渡回国的要求，苏方强调，必须保证溥仪等人的依法审判合理合规。"
 prc.313.a:0 "溥仪的命运将由人民和法律决定。"
 
 prc.314.t:0 "溥仪一行抵达抚顺"
 prc.314.d:0 "随着汽笛的轰鸣，特别专列跨过绥芬河，从苏联抵达辽宁抚顺。在士兵的重重监视下，几名穿着便装的中年男人从火车上颤颤巍巍地下了车。\n这些人里，有曾经的满洲国皇帝爱新觉罗·溥仪、皇弟溥杰、皇储毓嵒、满洲国首相张景惠……这些人再次踏上这片他们自认为统治过的土地，但这一次，是以阶下囚的身份。\n苏联政府与中国共产党政府达成协议，将这些曾经与日本侵略者合作的叛国者送回中国，他们的命运将由共产党决定。几乎所有人都认为，这些叛国者不会有好下场。\n溥仪一行被送至抚顺战犯管理所，等待他的命运。"
 prc.314.a:0 "战犯爱新觉罗·溥仪的命运，就是结束他罪恶且耻辱的一生！"
 prc.314.b:0 "溥仪应当作为战犯接受改造，以体现我们的政治能力。"
 
 
 prc.315.t:0 "爱新觉罗·溥仪被判处死刑！"
 prc.315.d:0 "中华人民共和国特别法庭正式宣布：\n爱新觉罗·溥仪在中日战争期间，背叛国家，勾结日本入侵者，建立傀儡政权满洲国并自立皇帝，协助日本人无情屠杀中国人民，掠夺满洲的资源，是无耻的叛国者、可恨的傀儡和刽子手！现中国共产党政府代表中国人民，判处爱新觉罗·溥仪死刑！"
 prc.315.a:0 "末代皇帝将在耻辱中结束生命。"
 
 prc.316.t:0 "溥仪在牢房中自杀！"
 prc.316.d:0 "来自抚顺的消息！\n爱新觉罗·溥仪在被判处死刑后，在监狱内自杀！溥仪用监狱洗手间内的刮胡刀刀片隔断手腕，狱警发现时，他已死于失血过多。这名中国最后一位皇帝、满洲国的统治者，最终以耻辱的方式死在了不义当中。"
 
 prc.317.t:0 "溥仪之死引起轰动"
 prc.317.d:0 "爱新觉罗·溥仪之死在中国舆论炸开了锅，尽管溥仪的叛国者身份不可置疑，但中国共产党将溥仪逼死的行为，却引发了许多讨论。\n绝大部分中国人，尤其是日本入侵的受害者和中共的支持者，都认为溥仪死有余辜，然而，在中国共产党政权刚刚建国，根基不稳的背景下，一些非共产党的政治势力，尤其是民主党派、国民党左派和在内战中投共的国民党将领，对此大为不安。\n一些逃亡香港的前国民党军官认为，溥仪之死撕破了共党所谓联合政府的伪装，显示出来共党对政敌手段残忍、复仇滥杀的真面目。那些对共党抱有幻想而投共的人士，很快就会成为政治报复的下一个受害者。"
 prc.317.a:0 "看来中共犯了一个错误"
 
 prc.318.t:0 "溥仪之死在东北引发不安"
 prc.318.d:0 "溥仪自杀一事在东北多地引发躁动和不安。原本满洲国灭亡、苏军将东北控制权移交国民党军和共军之后，曾经在满洲国政府和军队中任职的满洲国残余过着低调的生活，然而溥仪的死却激起这些人的不安。许多满洲国军人担心自己很快会遭到中共的清算和抄家，举家冒死逃离中国，试图渡江逃亡苏联、北朝鲜或蒙古人民共和国，还有一些其他投向共产党的国民党老兵也出现了不安情绪，甚至和中共政府发生冲突。"
 
 prc.319.t:0 "来自苏联的强烈抗议！"
 prc.319.d:0 "苏联共产党中央委员会致信中国共产党：\n\n尊敬的主席阁下，我们惊讶地得知，您将满洲国皇帝爱新觉罗·溥仪判处死刑，我们必须严肃地警告您，这是一个巨大的政治错误！\n处决溥仪将会被舆论认为是一场无情的政治报复，这等于告诉所有人，中国共产党将无情地镇压，甚至杀死所有站在他们政治对立面的人，让舆论认为，中国共产党是无情地滥杀者。据我们所知，中共政府在建国后，依然容纳了许多前国民党政府官员，这些人在得知溥仪被处死后，会有什么反应呢？我们认为这种不考虑后果的决定，将导致政治上的动荡。\n最重要的是，我们苏联政府将爱新觉罗·溥仪一行安全送回中国，而贵国却无情地将其杀死，请问贵党是否对我国有基本的尊重？是否还在乎信誉和承诺？是否考虑到，在国际上会对苏联的信用产生影响？"
 
 
 prc.320.t:0 "溥仪的改造"
 prc.320.d:0 "爱新觉罗·溥仪和他的亲属们已被送入抚顺战犯管理所，按照中国共产党的说法，他们将进行社会主义的思想改造。\n溥仪似乎在苏联依然过着养尊处优的生活，按中共官方说法，溥仪在抚顺生活的第一天并不顺利，他习惯了由仆人照顾，因此他竟然无法独立完成洗漱、吃饭等工作，而周围的士兵和囚犯们没有一个人愿意帮助他。这将会是一个困难的开始。"
 prc.320.a:0 "一次大胆的政治尝试。"
 
 prc.321.t:0 "溥仪与前妻李玉琴见面"
 prc.321.d:0 "在溥仪的请求下，政府帮助他找到了他的最后一位活在世上的妻子——李玉琴。李玉琴于1943年被溥仪选为妻子，成为满洲国的第二位皇后，当时只有15岁。满洲国灭亡后，李玉琴与皇后婉容一起逃离，婉容在通化被中共军队俘获，后因毒瘾发作病死在监狱，而李玉琴下落不明。\n在政府努力下，李玉琴终于被找到——她通过化名成为中华人民共和国的公民，成为长春市图书馆的工作人员。尽管李玉琴不太情愿，但在当局请求下，李玉琴在抚顺监狱与溥仪见了面。\n两人的见面再尴尬中度过，为了尊重个人隐私，二人的对话没有被记录。只知道李玉琴离开监狱后，请求政府正式宣布二人断绝婚姻关系。"
 prc.321.t:0 "两个命运多舛的人"
 
 prc.322.t:0 "溥仪的特赦"
 prc.322.d:0 "抚顺战犯管理所致信国务院领导同志：\n\n战犯爱新觉罗·溥仪在我所改造期间，表现较为良好，认罪态度诚恳，从一开始无法习惯独立生活的王爷，逐渐学会自己动手、自己劳动，在劳动改造中表现突出，对社会主义法制建设和理论思想的学习也取得很大进步。溥仪已被连续多年评为模范服刑人员。我们认为，经过十年的思想改造，溥仪已经从一个叛国罪犯，蜕变为一个具有进步思想的好公民，也许应该考虑依照相关法律，对溥仪进行特赦，使其能够作为榜样，影响更多的人。"
 prc.322.a:0 "再观察一段时间吧"
 prc.322.b:0 "看起来我们的政治路线取得了成功，准许特赦。"
 
 prc.323.t:0 "爱新觉罗·溥仪被释放！"
 prc.323.d:0 "来自抚顺的消息！\n曾经的中国末代皇帝、伪满洲国傀儡君主、现在的囚犯，爱新觉罗·溥仪，已经被中国共产党政府宣布特赦。从明天开始，溥仪就将结束十年的监禁生活，重获自由，以一个普通公民的身份，开始新的人生。\n在抚顺，最高法院的代表向溥仪颁发了特设通知书，这位五十多岁的中年人，露出了可能是三十多年来第一次发自内心的笑容。"
 prc.322.a:0 "皇帝溥仪走入历史，公民溥仪诞生了！"
 
 prc.324.t:0 "周恩来接见溥仪"
 prc.324.t:0 "中华人民共和国国务院总理周恩来，在北京会见了刚刚被释放不久的溥仪。周恩来向溥仪询问了他的生活和健康状况，溥仪高兴地表示，自己的生活状况非常之好，自己在北京郊区定居，享受到了自己前半生所没有享受到的自由，还参加了投票选举。周恩来提议在北京植物园为溥仪安排工作，溥仪欣然接受。"
 prc.324.a:0 "欢迎溥仪同志。"
 
 prc.325.t:0 "辛亥革命50周年茶话会"
 prc.325.d:0 "1961年10月，中华人民共和国政府举办辛亥革命50周年茶话会，以纪念50年前的这场革命，摧毁了中国历史上最后一个封建王朝——满清王朝，并建立了共和制度。"
 
 prc.326.t:0 "爱新觉罗·载沣去世"
 prc.326.d:0 "在中国和满洲国的爱新觉罗·溥仪皇帝引起许多人的关注时，他的父亲、清朝事实上的最后一位统治者——爱新觉罗·载沣，却在北京安详而低调地去世了。\n载沣作为溥仪的父亲，在光绪皇帝去世、溥仪即位后，成为清朝的摄政王。载沣曾经试图进行君主立宪制改革挽救清朝，但在立宪失败后，彻底放弃挽救清朝的一切尝试。1912年辛亥革命爆发后，载沣没有任何抵抗地辞去摄政王职务，并从政界引退，隐居天津，从此再也没有涉足政治。1934年，儿子溥仪在满洲称帝后，极力邀请父亲前往满洲国，都遭到了拒绝。此后，载沣再也没有见过溥仪。\n中国共产党占领北京后，载沣将自己的住宅出售给当局作为学校使用，这是载沣最后一次接触政治。载沣离世后，以平民身份安葬在郊区。"
 prc.326.a:0 "一位历史的见证者"
 
 
 prc.330.t:0 "黑龙江省发现石油资源！"
 prc.330.d:0 "石油工业部致信党中央国务院：\n我们的勘探团队在东北黑龙江省发现了极为丰富的油气资源，如果能够予以开发，完全可以满足我国现在和未来的能源需求，我国将彻底摆脱石油进口依赖！"
 prc.330.a:0 "真是天大的喜讯！"
 
 prc.331.t:0 "铁人王进喜的事迹"
 prc.331.d:0 "在我国开发石油资源的发展过程中，出现了许多可歌可泣的英雄人物，其中，大庆油田的石油工人王进喜，因为他在大庆的英雄壮举，成为近期全国热议的知名人物。\n王进喜出生于甘肃省玉门，很早就成为了玉门油田的石油工人。1960年，王进喜响应国家号召，前往大庆，参加开发新油田的大会战。\n王进喜率队从玉门到大庆，组织职工用“人拉肩扛”的方法搬运和安装钻机，用“盆端桶提”的办法运水保开钻，跳进泥浆池，用身体搅拌泥浆压井喷，被称为“铁人”。\n王进喜豪言，有“宁可少活二十年，拼命也要拿下大油田！”以及“有条件要上。没有条件，创造条件也要上！”"
 prc.331.a:0 "向王进喜同志学习！"
 
 prc.332.t:0 "大庆油田全面建设成功！"
 prc.332.d:0 "首列满载大庆原油的21节油罐车组成的铁路列车从萨尔图站开车运往锦西第五炼油厂，标志着中国最大最重要的油田成功开发出产！\n国务院总理周恩来在全国人大会议上做《政府工作报告》，宣告道：“中国人民使用“洋油”的时代，一去不复返了！”"
 prc.332.t:0 "石油滚滚流，我的心就乐开花！"
 
 prc.333.t:0 "第一届中国出口商品交易会在广州举办"
 prc.333.d:0 "中国政府在广州市举办了首届中国出口商品交易会，并邀请超过50个第三世界国家和苏东国家的外交官、商人和企业代表参加。\n在广州市的流花会馆，展会展示了中华人民共和国工业化政策取得成功后的大量国产工业品，既有纺织服装、鞋、办公箱包及休闲用品、医药及医疗保健、食品等轻工业制品，也有电子及家电、照明、车辆及配件、机械、五金工具、建材、化工产品等。\n来自印度、埃及、日本和香港等地的商人肯定了中国共产党的工业成就，并提出进一步采购一些物品。"
 prc.333.a:0 "发展贸易，接轨世界，互通有无。"
 
 prc.334.t:0 "中共军队击落RB-57侦察机"
 prc.334.d:0 "来自台北的消息！一支隶属于中华民国空军的美制RB-57高空侦察机在浙江省被中共军队击落！驾驶员王英钦上尉跳伞被俘。\n这一事件引起美国军方的高度关注，美方认为这可能意味着苏联已经开始向中共等盟国提供先进的地对空导弹系统。"
 prc.334.a:0 "我们拿竹竿捅下来的！"
 prc.334.b:0 "中共的技术进步令人意外。"
 
 prc.335.t:0 "来自中国大陆的大面积异常死亡"
 prc.335.d:0 "美国和台湾的中华民国政府对外公布了一个令人震惊的消息：情报机构显示，中国共产党统治下的河南、湖北、安徽、山东和四川等地，爆发了大规模的粮食短缺危机，实际上，我们可以将之称为一次严重的大饥荒。\n台湾情报部门在河南的情报人员发现信阳、襄阳等多地出现了大规模的灾民逃荒现象，这些灾民都是从信阳逃出来的，他们瘦骨嶙峋，营养不良，并出现了浮肿现象，且他们宣称信阳已经横尸遍野，人吃人现象所处可见。\n美国和台湾公布的照片引起了国际社会高度关注，中国共产党政府的威望受到了前所未有的挑战。"
 
 prc.340.t:0 "卫立煌返回中国大陆"
 
 prc.350.t:0 "防和谐机制"
 prc.350.d:0 "使中华人民共和国直接控制所有核心领土确保视频过审"
 prc.350.a:0 "采用防和谐"
 prc.350.b:0 "不需要防和谐"
 
 
 
 
 
 chinawar.2.t:0 "云南卢汉发动起义！"
 
 chinawar.3.t:0 "中共军队占领锦州"
 chinawar.3.d:0 "经过激烈战斗，中共军队占领了中国内地通往东北地区的重要交通枢纽-锦州，由此从内地通往东北的补给线路被切断，驻守东北地区的国军事实上处于被围困的状态。\n驻守锦州、营口等地的国民党军队在打击下溃逃，东北剿总第九军团司令廖耀湘在锦州郊区被俘。"
 chinawar.3.a:0 "确定。"
 
 chinawar.4.t:0 "国民党军队占领延安"
 chinawar.4.d:0 "经过激烈战斗，国民党军队占领了中共中央驻地延安，毛泽东等中共领导人向北撤离。"
 chinawar.4.a:0 "确定。"
 
 chinawar.5.t:0 "新疆易帜"
 chinawar.5.d:0 "随着国民党军队一溃千里，中共军队占领中国大陆大部分地区，新疆省政府决定倒戈。新疆省政府主席包尔汉发布通电，宣布新疆易帜，加入中华人民共和国。"
 chinawar.5.a:0 "确定。"
 
 chinawar.6.t:0 "李宗仁代行中华民国总统"
 chinawar.6.d:0 "由于前线作战不利和政治上的反对，国民党总裁蒋介石被迫宣布下台，李宗仁代行中华民国总统。"
 chinawar.6.a:0 "确定。"
 
 chinawar.7.t:0 "中国新疆与蒙古爆发边境冲突"
 chinawar.7.d:0 "中华民国新疆省与蒙古人民共和国，在北塔山爆发边境冲突，蒙古指责中华民国支持下的乌斯满哈萨克族武装入侵蒙古，而南京政府斥责蒙古在苏联支持下入侵新疆。"
 chinawar.7.a:0 "确定。"
 
 chinawar.8.t:0 "中国军队收复北塔山"
 chinawar.8.d:0 "中华民国国军在与蒙古军队的交战中取得胜利，国军收复北塔山。"
 chinawar.6.a:0 "确定。"
 
 chinawar.9.t:0 "蒙古人民军占领北塔山"
 chinawar.9.d:0 "中华民国国军在与蒙古军队的交战中失利并撤退，蒙古军占领北塔山。"
 
 chinawar.10.t:0 "谷寿夫被处死"
 chinawar.10.d:0 "南京雨花台刑场响起正义的枪声。南京大屠杀主犯谷寿夫在此伏法。在1937年12月，南京被日军占领后，谷寿夫命令其部下杀死所有投降的中国战俘，最后屠杀扩大为杀害无辜的市民，东京审判的调查结果认为，南京大屠杀的遇难者不会低于20万人。数千市民冒雨聚集在警戒线外，当行刑消息传出时，人群中爆发出经久不息的掌声。\n美国记者现场目睹，这名前日军师团长在验明正身后，双腿颤抖着被押赴刑场。他在最后时刻试图高喊军国主义口号，但声音被此起彼伏的民众怒吼淹没。法警用缴获的日军制式步枪执行枪决。\n在刑场外，美国记者遇到一位58岁的幸存者。老人掀起上衣，露出三道狰狞的刀疤：1937年冬天，他的部队杀了我全家十二口...\n雨越下越大，冲刷着刑场上的血迹，也冲刷着这座古都未愈的伤痕。"
 chinawar.10.a:0 "好死"
 
 chinawar.11.t:0 "人民解放军解放上海"
 chinawar.11.d:0 "今日拂晓，人民解放军先头部队经苏州河开进上海市中心，宣告这座远东第一大都市解放。国民党守军连夜溃逃，外滩码头上丢弃的军械文件堆积如山，黄浦江面飘满焚毁的机密档案。\n记者在跑马厅广场看到，解放军战士露宿街头，对市民秋毫无犯。南京路上，商铺陆续摘下"戡乱"标语，店员们向行进中的解放军队伍抛洒彩带。\n军管会发布第一号公告，宣布维持金融秩序、保障工商业正常经营。苏州河两岸工厂的汽笛长鸣，与庆祝解放的鞭炮声交织在一起。外滩海关大钟指针指向上午八时，这座饱经沧桑的城市，终于迎来了属于人民的新时代。"
 
 chinawar.12.t:0 "中国文学家朱自清病逝"
 chinawar.12.d:0 "中国著名文学家朱自清先生今日在北平病逝，终年50岁。朱先生长期参与民主运动，近日更以绝食抗议美国扶日政策，终致病情恶化。\n朱自清早年毕业于北京大学，曾任教于清华大学、西南联大等校。其散文《背影》《荷塘月色》等作品清新隽永，被奉为白话文典范。抗战期间，他随校南迁，在艰苦环境中坚持教学创作，彰显知识分子气节。朱自清临终前嘱咐家人拒绝美援面粉，其"宁可饿死，不领救济粮"的骨气，已成为知识分子的精神丰碑。\n北平各校师生自发佩戴黑纱，清华大学设灵堂吊唁。文化界人士称赞他"不仅是文学巨匠，更是民主战士"。上海、南京等地也将举行追思会。"
 
 chinawar.13.t:0 "国民政府颁布动员戡乱临时条款"
 chinawar.13.d:0 "中华民国政府宣布，由于共产党部队在中国北方大举进犯，为动员全国人力物力对抗共匪，现颁布《动员戡乱临时条款》，总览全国物资及兵员供给。"
 
 chinawar.14.t:0 "中国国民党革命委员会成立"
 chinawar.14.d:0 "随着蒋介石政府在战场上的失利和反对派的兴起，中国国民党内反对蒋介石的势力计划另外组党。以宋庆龄、何香凝、柳亚子、李济深和冯玉祥为代表的国民党内反蒋派在香港成立中国国民党革命委员会，要求停止内战和民主化。"
 
 chinawar.15.t:0 "中华民国宣布行宪"
 chinawar.15.d:0 "根据中华民国国父孙中山的构思，在经历了军政和训政之后，政府将进入下一步的政权形式-结束一党专政，进入宪政，进行民主改革。中国国民党领导人宣布将进行宪政，制定并颁布新宪法，并选举总统。"
 chinawar.15.t:0 "以退步求进步。"
 
 chinawar.16.t:0 "中华民国宣布行宪"
 chinawar.16.d:0 "根据中华民国国父孙中山的构思，在经历了军政和训政之后，政府将进入下一步的政权形式-结束一党专政，进入宪政，进行民主改革。中国国民党领导人宣布将进行宪政，制定并颁布新宪法，并选举总统。"
 
 chinawar.17.t:0 "中华民国行政院成立"
 chinawar.17.d:0 "作为中华民国政府开始行宪的一部分，中华民国行政院宣布成立，统管全国行政事务，翁文灝就任首任行政院长。"
 
 chinawar.18.t:0 "南京政府宣布在上海执行经济管制"
 chinawar.18.d:0 "面对愈发恶化的经济状况，中华民国政府决定采取行动进行管制。行政院派出蒋经国领导下的外派团队，前往全国经济中心上海，进行一系列管制物价、打击投机倒把的措施。"
 
 chinawar.19.t:0 "上海市政府发起反对奸商群众运动"
 chinawar.19.d:0 "连日来，上海爆发大规模市民抗议活动，要求国民政府严厉打击囤积居奇、哄抬物价的奸商行为。南京路、外滩等地聚集上万民众，高举"严惩奸商"、"我们要吃饭"等标语。\n抗议源于近期物价飞涨，米价较战前暴涨万倍。市民指控不法商人勾结官员，垄断粮食、棉纱等生活必需品。一位主妇向记者哭诉："丈夫一月工资买不到半斗米，孩子饿得直哭。"游行队伍经过多家米行时，发现仓库堆满粮食却挂牌"无货"。\n市政府承诺成立"物价评议委员会"，但市民质疑其成员多为商界人士。上海正滑向更深重的民生危机。市民警告若政府再不作为，将发动更大规模抗争。"
 
 chinawar.20.t:0 "杨子公司案"
 chinawar.20.d:0 "杨子公司案"
 
 chinawar.21.t:0 "蒋经国宣布辞职离沪"
 chinawar.21.d:0 "在来自南京的力量干涉下，蒋经国彻查上海杨子公司走私案的计划流产，上海的打击腐败运动也受到沉重打击。蒋经国被迫宣布辞职离开上海，轰轰烈烈的经济改革也宣布烂尾。"
 
 chinawar.22.t:0 "孔令侃被捕，孔祥熙辞职"
 chinawar.22.d:0 "来自上海的消息，一则新闻超越内战前线战报成为中国的新闻头条，中华民国财政部长孔祥熙之子孔令侃被捕，他名下的杨子公司因为从海外进口奢侈品囤积并倒卖而被蒋经国下令查封，孔祥熙在舆论压力下被迫辞职，成为上海经济整顿中被打倒的级别最大的官员。此事大大提高了蒋经国的声望，也强化了中国群众对国民党政府的信心。"
 
 chinawar.28.t:0 "英国军舰紫石英号闯入南京"
 chinawar.28.a:0 "进行驱逐"
 chinawar.28.b:0 "警告后放行"
 
 chinawar.29.t:0 "中共军队击沉紫石英号"
 chinawar.29.d:0 "英国军舰紫石英号在南京与中共军队爆发交火，紫石英号无视中共警告，在南京战役中驶入长江，中共军队警告无效后进行炮击，紫石英号在交火中被击毁，搁浅在南京长江岸边，该舰大部分船员被中共俘获。\n紫石英号事件引起中英两国舆论高度关注，中共宣称自己履行了驱逐外国驻军的诺言，而英国政府愤怒地指责中共军队极端且鲁莽。"
 
 chinawar.30.t:0 "紫石英号逃离南京"
 chinawar.30.d:0 "英国军舰紫石英号在南京与中共军队爆发交火，紫石英号无视中共警告，在南京战役中驶入长江，中共军队警告无效后进行炮击。经过交战，紫石英号尽管遭到严重损伤，但还是艰难地逃离了南京。"
 
 chinawar.31.t:0 "紫石英号撤离南京"
 chinawar.31.d:0 "英国军舰紫石英号在南京与中共军队爆发交火，紫石英号无视中共警告，在南京战役中驶入长江，中国军队经过考虑，在作出口头警告后，没有对紫石英号进行攻击。紫石英号在南京逗留并见证了中国共产党对这座城市的占领，不久后在中共外交压力下撤离。\n解放军容忍紫石英号进入南京的行为引起了中共内部的激烈争论，因为毛泽东承诺，人民解放战争的意义就是中止包括外国军舰行驶的一切不平等条约。"
 
 chinawar.32.t:0 "我们必须解救紫石英号！"
 chinawar.32.d:0 "如果你选择强硬，你必须在一个月内，将你的海军部队派遣到中国东部的黄海，舰队到达后，将自动触发炮击事件，如果超过一个月内没有我方舰队进入黄海，事件将不了了之。"
 
 chinawar.33.t:0 "工党内阁遭到激烈批评！"
 chinawar.33.t:0 "紫石英号事件发生后，英国舆论普遍要求采取军事行动解救被俘的水手并惩治中共，但以首相[ENG.GetLeader]为首的工党内阁最终还是选择了息事宁人，这激怒了英国国内的各大媒体，更招来了保守党的猛烈抨击。"
 
 chinawar.34.t:0 "英国对我们发出最后通牒！"
 chinawar.34.t:0 "英国强烈谴责我们击沉紫石英号并俘虏英军士兵，要求我们立刻释放并作出道歉。"
 
 chinawar.35.t:0 "中共宣布释放紫石英号船员"
 
 chinawar.36.t:0 "中共拒绝释放紫石英号船员"
 chinawar.36.t:0 "中共政府拒绝释放被俘的紫石英号水手，英国政府宣布，将派遣皇家海军前往中国海域，对中共占领地区进行炮击。"
 
 chinawar.32.t:0 "英国海军对中共军队发起炮击"
 
 chinawar.40.t:0 "中共军队占领海南岛"
 chinawar.40.d:0 "经过激烈战斗，中共军队宣布控制海口、琼州、崖县等海南岛重要城镇，全岛已落入中国人民解放军控制之下，残余部队已停止抵抗。"
 chinawar.40.a:0 "确定。"
 
 
 chinawar.51.t:0 "[FROM.GetName]宣布拒绝金圆券"
 chinawar.51.d:0 "[FROM.GetName]拒绝接受国民政府发行的金圆券，并禁止该货币在本省流通."
 
 chinawar.52.t:0 "云南爆发大规模学生运动"
 chinawar.52.d:0 "云南昆明爆发学生示威游行，抗议当局的独裁统治、言论控制及反对共产党的血腥内战，要求当局释放政治犯，进行政治改革和停止内战。目前示威者正和警察紧张对峙中。"
 
 chinawar.53.t:0 "云南学生运动遭到镇压"
 chinawar.53.d:0 "云南警察暴力驱散了进行示威游行反对独裁统治和内战的学生和民主人士，双方爆发激烈的冲突，多名示威者受伤或被捕。" 
 
 chinawar.54.t:0 "云南当局与示威者谈判"
 chinawar.54.d:0 "云南当局官员与要求政治改革的示威者进行会谈。"
 
 chinawar.55.t:0 "来自南京方面的不满"
 chinawar.55.d:0 "南京方面对我们最近与示威者接触的行为大为不满，认为我们此举将给予共匪渗透可乘之机，要求我们与示威者谈判并采取强硬手段。"
 
 chinawar.56.t:0 "龙云抵达香港"
 
 chinawar.57.t:0 "云南方面的不稳定"
 chinawar.57.d:0 "云南当局在对抗共匪渗透方面一错再错，给予匪谍可乘之机，与其放任昆明继续放纵共匪渗透，不如采取行动，将云南军政大权纳入南京中央控制。"
 
 chinawar.58.t:0 "中国政府对云南采取行动"
 chinawar.58.d:0 "中华民国政府在近日宣布，由于云南当局纵容共产党支持下的示威者进行政治活动，在对抗共产党政治渗透的工作上毫无作为，南京已决定采取军事行动，解除云南省政府的军政权力。"
 
 chinawar.59.t:0 "中共邀请我们加入新政府"
 
 chinawar.60.t:0 "[FROM.GetName]当局宣布加入中共政府"
 
 chinawar.61.t:0 "[FROM.GetName]当局拒绝加入中共政府"
 
 chinawar.62.t:0 "中共对[FROM.GetName]采取行动"
 
 chinawar.63.t:0 "[FROM.GetName]人民政府成立"
 
 
 chinawar.70.t:0 "南京方面宣布发行金圆券"
 chinawar.70.d:0 "南京方面宣布，为了稳定金融局势，遏止通货膨胀，提高货币信用，控制黄金流通，即日起政府将发行由国民政府中央银行担保的金圆券作为代货币，并要求即日起市场上禁止流通黄金，政府将以金圆券赎买民间黄金。"
 
 chinawar.71.t:0 "金圆券的价值开始暴跌！"
 chinawar.71.d:0 "金圆券正在贬值，我们需要投入更多的黄金储备以支持其价值稳定。"
 
 chinawar.72.t:0 "金圆券的价值得到稳定"
 
 chinawar.73.t:0 "中国多地爆发物价危机"
 chinawar.73.d:0 "来自中国的消息，由于国民党政府为了筹集军费，大量滥发金圆券，导致金圆券正在以令人惊讶的速度贬值，随之带来中国的物价市场迅速崩溃，据说现在中国的鸡蛋已经需要一万元一个了，并且还在持续上涨。"
 
 chinawar.74.t:0 "中国物价全面崩溃！"
 chinawar.74.d:0 "一个人走进上海一家餐厅，点了一碗2000万金圆券的汤面，几分钟后吃完付款时，被告知需要支付5000万元。\n在金圆券的价值伴随着中华民国政府的信用彻底崩盘后，国民党统治区多地爆发了令人震惊的物价崩溃，一只鸡蛋的价格达到了将近八十万元一个，这是昨天的价格信息，也许今天已经涨到了两百万一个。国民党政府已经彻底失去了对经济的控制。"
 
 chinawar.80.t:0 "陈布雷自杀！"
 chinawar.80.d:0 "被称为总裁文胆的中国国民党官员陈布雷被发现在家中上吊自杀，国民党政府为其举办葬礼，但有关其自杀的原因众说纷纭。大部分民众猜测，陈布雷生前极力劝说蒋介石惩治腐败，尤其是以宋、孔两大家族为首的裙带资本主义，但都没有得到蒋介石的支持，因而失望自杀。"
 
 chinawar.81.t:0 "张灵甫在孟良崮战役中阵亡"
 chinawar.81.d:0 "国民党高级将领、整编第七十四师总指挥张灵甫中将在孟良崮战役中阵亡，解放军在被炮火摧毁的阵地中找到了他的尸体。"
 
 chinawar.82.t:0 "黄百韬在徐州战役中阵亡"
 chinawar.82.d:0 "中共军队在徐州战役结束后打扫战场时，在碾庄发现了国民党军中将、陆军第七兵团司令黄百韬的遗体，在确认身份后，中共宣布黄百韬在作战中阵亡，但尚未确定是被击毙还是自杀。"
 
 chinawar.83.t:0 "杜聿明、黄维、杨伯涛等在徐州被俘"
 chinawar.83.d:0 "中华民国国防部长、徐州剿匪总司令王耀武在徐州战役中被俘，据称杜聿明在逃跑过程中伪装成农民，但被解放军识破逮捕，使其成为中共军队在内战中俘获的最高级别国民党将领。整编第十八军代军长杨伯涛试图渡河逃跑时被俘获，陆军第十二兵团司令黄维所乘坐的战车亦被共军拦截。"
 
 chinawar.84.t:0 "郭汝槐宣布起义"
 
 chinawar.85.t:0 "郭汝槐被捕"
 
 chinawar.86.t:0 "关注中国内战"
 chinawar.86.d:0 "在欧洲战火逐渐熄灭，欧洲各国走向重建时，远东却再次响起枪炮声。中国国民党政府和中国共产党的谈判以失败告终，双方的血腥内战已持续近半年。\n本报从刚刚离开南京的记者处获知，尽管远离主要战场，南京城内仍弥漫着战争阴云。记者观察到，中央银行门前排起兑换金圆券的长队，米价较上月暴涨三倍。政府大院围墙外新架设了铁丝网，而上海外滩的酒馆里依然响起《夜来香》的歌声。一名中华民国国军军人告知记者，国民党政府拥有军力、人力、经济上的全部优势，以及自由世界的支持，他们相信，蒋总裁只需要半年即可消灭共匪部队。"
 
 chinawar.87.t:0 "日本教官受邀参加空军训练课程"
 chinawar.87.d:0 "尊敬的军委领导：\n\n东北民主联军航校正式开训以来，在化敌为技、为国育鹰方针指导下，经严格政治审查后，特聘12名前日本航空兵军官担任飞行教官。这批人员均系关东军航空部队战俘（已获特别赦免），平均飞行时长超2000小时，熟练掌握零式战机等多种机型操作及空战战术。\n首期56名学员在三个月内完成原定六个月的起降课程，多名学员已能完成复杂气象条件下的编队飞行。日籍教官林弥一郎指导的飞行编队战术课，被学员们评为“最生动实战课程”。\n我们将继续坚持“技术可用、思想必改”原则，定期组织政治学习与思想汇报。随附本月训练成绩表及日籍教官思想动态报告。\n\n此致   敬礼"
 
 chinawar.90.t:0 "京城一日"
 chinawar.90.d:0 "哎，同志，借个火嘛。\n北平王府井的小巷子里，一名操着湖南口音的中年人，点燃了手中的香烟，四处闲逛。中共军队解放北平已有几个礼拜，城市里的秩序逐渐恢复正常。男人在一家面馆坐下，点了一碗一万三千块的面条。在隔壁桌，一名黄包车车夫向众人手舞足蹈地讲起自己前几天经历的事情。\n哎，你说这解放军，他跟国民党的兵那是真不一样啊。前几天我拉了个解放军的官儿，下车的时候他突然啪一下，给我敬个礼。\n中年人一边津津有味地听着这个故事，一边大口将面条吃的干干净净，手里叼着香烟，悠闲地走回了自己的住所。\n一开门，只见周恩来早在客厅等待已久，一脸不悦地站起来喊道：\n老毛！你又违反纪律，进城不带警卫员是很危险的！"
 
 chinawar.91.t:0 "飞升的物价"
 chinawar.91.d:0 "广州长堤大马路，一家理发店内堆着一个又一个的大麻袋。这里面装的不是剪下来的头发，而是顾客支付的费用。中国的物价飞升，已经远远超过了政府和民众的预料。昨天，理一次头发用的钱要用一个箩筐装，现在已经要抬一个麻袋来装了。\n下午四点钟左右，一个男人急匆匆地拖着一大麻袋的金圆券纸钞走进理发店：老板，哩度（这里）有六千万，快滴帮我剪下头！\n你来迟啦！家阵（现在）要两袋钱先有的剪！"
 chinawar.91.a:0 "百万富翁也得摸爬滚打了。"
 
 chinawar.92.t:0 "逃亡之路"
 chinawar.92.d:0 "上海霞飞路的花园洋房里飘出焦糊味。被汗水打湿衬衫的男人正将账本投入壁炉，火舌舔舐着"黄浦码头走私案"的字样。\n"快烧！"他踹开檀木箱，金条在丝绸被单上滚成刺目的星河。妻子用指甲油瓶砸向梳妆镜，碎玻璃里映出她往貂皮大衣塞美钞的狼狈相。\n儿子突然举起相框："父亲授勋照也烧吗？"照片里蒋中正亲手别上的云麾勋章，此刻正躺在待焚的公文堆上。男人一把抢过相框，玻璃割破了手指——血滴在"沪上清剿功臣"的烫金字上，像极了上个月他签过的处决令。\n窗外传来遥远的炮声。管家抱着青花瓷瓶踉跄跑来："老爷，码头说最后班船..."话音未落，男人已扯下孙中山像，露出墙后的保险箱。当第一缕晨光穿透硝烟时，别克轿车碾过散落的文件，奔向黄浦江畔的迷雾。"
 
 chinawar.93.t:0 "渡口诀别"
 chinawar.93.d:0 "厦门港，咸涩的海风裹着煤烟味。19岁的国军少尉把家传怀表塞进母亲手中，"等打完这仗就回来"——这句话在码头上空飘着，和国民党军舰的汽笛声一样嘶哑。\n"长官！登船了！"勤务兵的声音刺破沉默。母亲最终没收回那块怀表，只是把他的手攥得发白："记得....多写信回来...."\n舷梯收起时，少尉看见父亲第一次在人前摘下了军帽。花白的头顶在暮色中格外刺目。货轮离岸的浪花打湿了小妹的红棉袄，像一抹化开的血渍。"
 
 chinawar.94.t:0 "搜查令"
 chinawar.94.d:0 "别搜了，军爷，没有就是没有。\n第一，我们不是军爷，请叫我们同志。第二，你的罪行，每个上海人都心知肚明，我们只需要最关键的证据……\n随你的便。\n\n解放军军管会的战士，把这栋霞飞路的洋房几乎翻了个底朝天，但还是缺少关键的证据。自从中共接管上海之后，便不断有群众向中共上海市当局揭发、检举、写信，甚至直接跑到解放军驻地鸣冤，房子的主人在国民党政府推广金圆券期间，利用手中的权力，暴力夺取民众手中的贵金属并以金圆券代替。愤怒的民众希望新政府严厉惩治这些旧政府时代的贪腐官僚。\n中共任命的新任上海市长陈毅，是一位脾气非常暴躁的人，在得到来自北京的搜查许可后，陈毅决定好好惩治这些蛀虫，但他也明白，新的政府不能成为新的独裁者，惩治罪犯不能依靠愤怒，而是需要证据，需要法律。"
 
 chinawar.95.t:0 "山间的宴席"
 chinawar.95.d:0 "贵州镇远县政府食堂里飘着酸汤鱼的香气。年轻的党委书记第三次展开《民族区域自治实施纲要》，却发现对面的苗族老村长正用烟斗在桌面上画奇怪的符号。\n"村长，刚才说的土改政策......"书记推了推眼镜。老人突然举起牛角杯："干部同志，你晓得'牯藏节'要杀几头牛？"满桌的苗族、侗族、水族头人都笑起来，银饰在阳光下晃成一片。\n书记突然瞥见村长的绑腿上还沾着泥——那是走了三天山路赶来的痕迹。他默默合上文件，端起搪瓷碗："先吃饭！"\n酸汤入喉时，侗族村长突然唱起敬酒歌。书记学着他们用手抓鱼，惹得姑娘们银铃乱响。散席时，吴老岩把书记的手按在自家带来的糯米上："汉家官，下回来寨子，我让鬼师用鸡骨给你卜一卦。"\n回程吉普车上，书记发现兜里多了块绣着古怪图案的布——后来才知道，那是苗家表示"自己人"的盟誓巾。"
 
 chinawar.96.t:0 "山野迷踪"
 chinawar.96.d:0 "首长，你们看，上面那个洞啊，就是黑风洞，里面啊，就住着恶鬼……\n\n湖北恩施，一名土家族猎人，领着四名解放军战士爬过山地，接近一座山洞。与村民进行了几个月的接触后，村里的党委向上级报告，这里没有严重的社会或政治问题，土改也进行的很顺利，就是村民总是反应附近的山上有死人鬼魂作祟，可能是躲避在此的国民党残兵或危险性野生动物。\n破晓时分，他们终于在山洞前撞见"怪物"：三只鬣狗正围着钟乳石打转，洞顶渗水在石笋上形成人脸状的钙化层。风穿过岩缝时，发出凄厉的呜咽。\n“解放军的兵抓住怪物啦！”战士们与猎人一起抓住了一只落单的鬣狗，然后又给钟乳石上面的人脸形纹路拍了几张照片。战士们没法给村民解释什么是钟乳石，便说黑白色的胶片是困住恶鬼的法宝，现在恶鬼已被这张小小的铁盒子收服。"
 
 
 
 chinawar.100.t:0 "南京爆发大规模学生运动"
 chinawar.100.d:0 "南京中央大学学生伙食团宣布，因物价猛涨，副食费不能维持到月底。中央大学学生系科代表大会通过决议，要求国民政府按物价指数调整副食费，并决定即日起罢课请愿，发表《反饥饿斗争宣言》，呼吁平津沪杭汉等地学校采取一致行动。行政院副院长王云五和教育部长朱家骅表示财政困难，食堂问题要在行政院讨论，这一回应引起学生不满。中共南京市委认为国民党一定不会同意，于是准备发动大规模游行示威。\n中央大学等校学生举行反饥饿游行请愿。南京学生组织了向教育部、行政院的请愿游行，提出“向炮口要饭吃”等口号。清华大学学生发表《为反饥饿反内战罢课宣言》后，燕京大学十余社团声援清华罢课。"
 
 chinawar.101.t:0 "学生运动继续蔓延至其他地区"
 chinawar.101.d:0 "南京、上海、苏州、金华等城市的十六所专科以上学校学生六千余人联合向行政院请愿游行示威，高喊“反饥饿，反内战，反迫害”、“取消《维持社会秩序临时办法》”、“抢救教育危机”、“提高教育经费”、“提高教授待遇”、“我们要求最低营养”、“反对内战”、“我们要以行动争取生存”等口号。"
 
 chinawar.102.t:0 "南京警方与示威者爆发激烈冲突"
 chinawar.102.d:0 "中央大学发出全体学生告全国同胞书，反对内战。游行队伍到达南京珠江路口时，遭到军警镇压，先有学生四人被打倒在地，血流满面，立即被逮捕。警察重新喷射水龙，队伍又被第二次冲断。警察抡着木棍，追逐着冲散的同学，现场就有一百零四人被打伤，其中重伤十九人，被捕二十八人。同日，平津近两万名学生也举行大游行。茅盾、郭沫若等写文章支持“五二〇”精神。冯玉祥也发表了告全国人民书，反对内战，主张和平。"
 
 chinawar.103.t:0 "国民党警察血腥镇压武汉大学学生运动"
 chinawar.103.d:0 "来自中国湖北省武汉的消息！昨晚一支国民党警察部队闯入武汉大学，以缉拿共产党通缉犯为由试图逮捕学生运动领袖，遭到学生抵抗后，竟向学生实弹射击，导致3人死亡，二十余人受伤，数十名学生被军警逮捕。"
 
 chinawar.104.t:0 "军警突袭北京大学"
 chinawar.104.d:0 "国民党军警以逮捕中共暗中支持的学运组织为名，派遣四十余名军警突然冲入北大师院学生宿舍，打伤并逮捕8名学生。"
 
 chinawar.105.t:0 "成都爆发大规模警民冲突"
 chinawar.105.d:0 "中国物价彻底崩溃，引发民众怒火。成都市专科以上学校学生1000多人到四川省政府请愿，要求供给平价米，结果遭到军警镇压，130多人被捕。"
 
