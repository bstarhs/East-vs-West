 chinawar.140.t:0 "徐州剿总军事会议"
 chinawar.140.d:0 "诸位，借此机会，我要先说几句话。最近常有人叽叽喳喳，那我来开心，说什么，徐州是京沪的大门，应当派一员虎将来坐镇。派不出一只虎，也要派一只狗，最后派了一只猪来。这话实在是恭维我了。古今征战，猪的战术一再为人们成功的运用着。遇有攻击，便把屁股偎依着墙壁，让你抓不着尾巴终于把它无可奈何，弄不好，尖牙利齿给你一口，咬住了就不放。\n\nStank tones,fun of foolish talk.\n\n雨庵，你在说什么呢？"
 chinawar.140.a:0 "我说总座高见。"
 
 chinawar.145.t:0 "全国政协会议的召开"