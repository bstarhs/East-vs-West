Abolish_11111:0 "公开枪决政治犯"

HUN_revo_decis:0 "匈牙利革命"
HUN_revo_decis_desc:0 "反对劳动人民党的群众暴动已经爆发，匈牙利政府必须在愤怒的人民和高度警惕的苏联政府之间慎重地做出选择。"
