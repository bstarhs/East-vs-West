USA_duck_and_cover_decis:0 "民防工程"
USA_duck_and_cover_decis_desc:0 "有只乌龟名叫博特，小小博特十分谨慎，危险来临不会慌张，他知道怎么做。\n他卧倒，并躲避。他卧倒，并躲避。\n他做了我们每个人都必须学会的事情，而你，而你\n卧倒，并躲避。"
