destalin_cancel_chechin_immigrate_decis_desc:0 "车臣的少数民族在斯大林时期，被无辜扣上可能叛乱的罪名，被集体强制迁移到中亚和西伯利亚。现在斯大林主义的统治结束，应当帮助这些少数民族重返家园。"
