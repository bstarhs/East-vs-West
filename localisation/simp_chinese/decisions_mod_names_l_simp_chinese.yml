khrushchev_decis:0 "改革、解冻与玉米"
khrushchev_decis_desc:0 "经济不是一项尊重个人意愿的学科。\n——尼基塔·赫鲁晓夫"
states_cron_intro_decis:0 "玉米运动相关玩法介绍"
states_cron_try_decis:0 "尝试在[FROM.GetName]种植玉米"
states_cron_try_decis_desc:0 "[FROM.GetName]的气候和土地条件似乎适合种植玉米，因此我们可以尝试在这里建立一块玉米种植试验田，并开始在这里生产玉米"
states_cron_expand_decis:0 "扩大[FROM.GetName]玉米种植"
states_cron_expand_trigger:0 "该地区取得至少2次种植成功或至少1次大丰收"
states_cron_advanced_decis:0 "建立[FROM.GetName]玉米基地"
states_cron_stop_decis:0 "暂停扩大玉米投资"
states_cron_stop_decis_desc:0 "该决议将不显示在某地种植玉米的决议以避免遮挡决议画面。"
states_cron_continue_decis:0 "恢复扩大玉米投资"
states_cron_continue_decis_desc:0 "恢复投资玉米决议在地图上的显示。"

states_cron_cancel_decis:0 "取消[FROM.GetName]的玉米种植"
states_cron_cancel_decis_desc:0 "[FROM.GetName]的玉米产量远没有达到生产指标，在这里继续投入资源是错误的。我们应当停止在这里继续大规模种植玉米了。"
states_cron_ingests_decis:0 "增加[FROM.GetName]玉米投资"
states_cron_ingests_decis_desc:0 "[FROM.GetName]地区的玉米生产需要更多投入，我们应该向该地区增加拨款。\n使用这一决策后，该地区的玉米收获成功率将增加。"
khrushchev_cron_usa_buy_decis:0 "向美国购买玉米种子"
khrushchev_cron_usa_machines_decis:0 "向美国购买农业机械"
khrushchev_cron_usa_machines_decis_desc:0 "我国与美国的关系改善后，可以考虑向美国购买一批专门的机器用于玉米种植和生产，将资本主义的产物用于社会主义建设当中。\n如果美国同意出售机器，随机3-5个地区的玉米收获成功率将增加。美国拒绝，消耗的行政点数会补偿。\n改善美苏关系和提高国际威望以增加美国AI同意的几率。"
khrushchev_cron_propaganda_decis:0 "拍摄玉米宣传广告"
khrushchev_cron_propaganda_decis_desc:0 "拍摄玉米宣传广告"
khrushchev_cron_expo_decis:0 "全国玉米展览会"
khrushchev_cron_department_decis:0 "设立最高苏维埃玉米委员会"
khrushchev_cron_check_decis:0 "调查各地玉米产量"
khrushchev_cron_techs_decis:0 "投资玉米研发技术"
khrushchev_cron_consumer_decis:0 "玉米的商业化"
khrushchev_cron_consumer_decis_decis:0 "随着玉米种植生产的成果推进，越来越多金灿灿的玉米进入了农业库存，接下来的工作，就是将他们送往食品工厂，制作成烤玉米、玉米卷、玉米粉和玉米饼，送往苏联各地的商店，等待人民将他们端上餐桌。"
khrushchev_cron_consumer_tool:0 "至少三个省份建成了2级玉米基地"

khrushchev_cron_succes_decis:0 "宣布玉米计划取得成功！"
