WDR_rearmed_decis_category:0 "德国再武装化"
WDR_rearmed_decis_category_desc:0 "法国担心德国复兴，并因此极力推行肢解德国的政策，但这种担忧似乎完全是杞人忧天。1945年后，德国在军事、经济和政治上都已衰败，在我看来，这足以保证德国无法再次威胁法国。在未来的欧洲合众国中，我看到了欧洲乃至德国的巨大希望。我们必须努力提醒法国、荷兰、比利时和其他欧洲国家，它们和我们一样，都位于西欧，它们现在是、将来也永远是我们的邻国，它们对我们施加的任何暴力最终都会导致麻烦，如果仅仅依靠武力，欧洲就不可能建立持久的和平。\n——康拉德·阿登纳"
WDR_rearmed_diplomat_decis:0 "与[FROM.GetName]进行交涉"
WDR_rearmed_diplomat_decis_desc:0 "德国的军事重建，必须得到欧洲各国，尤其是纳粹受害者的支持。我们将派出外交官与[FROM.GetName]政府进行谈判。"
WDR_rearmed_buy_weapons_decis:0 "向[FROM.GetName]购买武器"
WDR_rearmed_propaganda_decis:0 "争取民众和媒体的支持"
WDR_rearmed_recruit_decis:0 "尝试招募兵员"
WDR_rearmed_release_warcrime_decis:0 "释放二战国防军"

Social_reform_decis:0 "社会改革"
Social_reform_decis_desc:0 "新观念总是遭到怀疑和反对，不是因为别的原因，只是因为人们习惯于旧的东西。"
childes_labour_modifiers:0 "取缔童工"
childes_labour_ban:0 "恢复童工"
childes_labour_decision:0 "取缔童工"
