vie_decis_bomb_states_vietcong_desc:0 "[FROM.GetName]存在成规模的越共根据地，直接进行地面攻击或有风险，不如借助空中优势进行轰炸，将越共盘踞的村庄化作一片火海！"
vie_decis_bomb_borders:0 "轰炸[FROM.GetName]边境"
vie_decis_bomb_borders_desc:0 "越共分子在越南和[FROM.GetName]的边境地带建立了秘密运输通道，将武器和装备源源不断地运往越南南方，我们将派出战斗机攻击这些运输通道，从而掐断北越对南方叛军的支持。\n§W我们已经对该国进行了§Y[?FROM.HCM_bombed]§W次成功的轰炸，轰炸决议不会立刻摧毁胡志明小径，但轰炸次数累计会提高触发摧毁胡志明小径的几率。"
vie_decis_bomb:0 "轰炸柬埔寨共产党根据地"
vie_decis_bomb:0 "轰炸老挝共产党根据地"
vie_decis_bomb_search_destroy:0 "搜查并攻击[FROM.GetName]越共根据地"
vie_decis_bomb_search_destroy_desc:0 "[FROM.GetName]存在成规模的越共根据地，我们将派出地面部队对该地区进行扫荡，消灭越共武装，摧毁越共盘踞的村庄，并将其付之一炬！"
vie_decis_bomb_strategic_valley:0 "在[FROM.GetName]建立战略村"
vie_decis_bomb_strategic_valley_desc:0 "把当地的村民强制迁入军方监视下的战略村，把村民和越共分子隔离开来，避免双方接触。"

vietnam_war_orange_agents:0 "在[FROM.GetName]投放橙剂"
vietnam_war_orange_agents_desc:0 "浓密的丛林覆盖了越南的每一片土地，但先进的除草剂只需要两天就能将一整片森林夷为平地。"
vietnam_war_attack_borders:0 "攻击[FROM.GetName]边境"
vietnam_war_attack_borders_desc:0 "[FROM.GetName]政府为越共分子的秘密运输通道提供便利，我们需要采取军事行动攻入[FROM.GetName]境内，消灭隐藏在该地区的越共据点。"
vietnam_war_allow_oil_bomb:0 "授权使用B型凝固汽油弹"
vietnam_war_allow_oil_bomb_desc:0 "先进的B型凝固汽油弹将把越共分子的据点连同整片森林一同毁灭。"
vietnam_war_allow_advanced_bomb:0 "授权使用温压弹"
vietnam_war_allow_advanced_bomb_desc:0 "先进的温压弹将把越共分子的据点连同整座村庄一同毁灭。"

vie_decis_VIN_rebuild_HCMtrail:0 "重建[FROM.GetName]的胡志明小径"
vie_decis_VIN_rebuild_HCMtrail_desc:0 "胡志明小径将为南方的解放组织提供支持。"

vie_decis_VIN_:0 "攻击[FROM.GetName]并建立根据地"

vie_decis_VIN_attack_laos_border:0 "进攻老挝边境"
vie_decis_VIN_attack_phonsari:0 "进攻老共据点"


vie_decis_VIN_support_vietcong:0 "支持[FROM.GetName]的武装组织"
vie_decis_VIN_support_vietcong_desc:0 "向[FROM.GetName]地区的武装组织提供物资和人员。"

vie_decis_VIN_attack:0 "尝试对[FROM.GetName]的敌军发起攻击"
vie_decis_VIN_attack_desc:0 "我们在[FROM.GetName]地区的游击队武装组织已形成规模，可以尝试对当地的美军和西贡伪军据点发起攻击。"

decis_attack_zhoushan:0 "向舟山群岛发起攻击！"
decis_bomb_kinmen:0 "向金门发起攻击！"
decis_bomb_kinmen_desc:0 "美帝国主义向台湾国民党伪政权提供支持，我们必须展示我们的军事力量，向蒋匪军和美帝施加外交和政治压力，从而获得在谈判桌上的优势！"
threat_kinmen_decis:0 "空军部队进驻台湾"
threat_kinmen_decis_desc:0 "台湾空正在与中共部队激烈交战，我们需要派驻空军部队前往台湾周边空域，从而对中共形成威慑。"
decis_bomb_kinmen_end:0 "金门停火"

nuclear_fuel_making:0 "制取核燃料"
nuclear_fuel_making_desc:0 "将高纯度的铀矿石粉碎后，加入酸等化学物质反应，得到重铀酸铵（俗称黄饼），黄饼再与氟化氢等材料发生反应后，即可得到具有放射性的核燃料，将核燃料放入钨制成的管内，便可得到原始的六氟化铀。"
uranium_enrichment:0 "铀浓缩实验"
uranium_enrichment_desc:0 "铀矿并不能立即作为核燃料使用，其内部含有大量的杂质。通过离心机从天然铀矿中分离出杂质，从而提纯出纯净的铀元素。"

Catholics_decis:0 "重建天主的国家"
Catholics_decis_desc:0 "你是伯多禄（磐石），在这磐石上，我要建立我的教会，阴间的门决不能战胜她。我要将天国的钥匙交给你：凡你在地上所束缚的，在天上也要被束缚；凡你在地上所释放的，在天上也要被释放。\n ——《马太福音》"
bible_educate_decis:0 "将《圣经》列入教育"
ban_humanized_decis:0 "禁止生物进化论"
ban_humanized_decis_desc:0 "耶和华在空虚混沌中，用六天的时间创造物质的天地，先后创造了光、大气、旱地、植物、天体和动物。第六天耶和华按自己的形像造亚当和他的妻子夏娃，将他们安置在伊甸园，要让他们的子孙治理全地。耶和华对于一切的创造非常满意，定第七日为安息日，歇了他一切的工作。\n ——《创世记》"
ban_globe_decis:0 "禁止地圆说"
ban_globe_decis_desc:0 "禁止地圆说"
ban_alcohol_decis:0 "禁酒令"
ban_alcohol_decis_desc:0 "不要作糊塗人，要明白主的旨意如何。不要醉酒，酒能使人放蕩，乃要被聖靈充滿。\n ——《以佛所书》第五章"
ban_alcohol_decis_islam_desc:0 "信道的人们啊！饮酒、赌博、拜像、求签，只是一种秽行，只是恶魔的行为，故当远离，以便你们成功。\n——《古兰经》"


deci_worship_statue_capital:0 "在首都建造伟大领袖的雕像"
deci_worship_statue_capital_desc:0 "我们伟大领袖的威严形象应当被竖立在首都最显眼的位置，以展示他至高无上的地位！"
deci_worship_statue:0 "在[From.GetName]建造伟大领袖的雕像"
deci_worship_statue_desc:0 "我们伟大领袖的威严形象应当被竖立在国土的每一处，以展示他至高无上的地位！"
deci_worship_book:0 "发行我们伟大领袖的著作"
deci_worship_book_desc:0 "我们的伟大领袖拥有深邃的智慧、卓越的才干和出色的领导力，我们的每一个国民都应当阅读并领悟领袖的思想，和领袖统一路线。"
deci_worship_biography:0 "发行我们伟大领袖的传记"
deci_worship_biography_desc:0 "我们的伟大领袖从小就怀抱着建设伟大祖国的宏大理想，他一步一步成为国家元首的非凡经历值得每一位国民了解！"
deci_worship_titled:0 "冠以我们伟大领袖新的称号"
deci_worship_titled_desc:0 "国父、舵手、旗手、大元帅……无论用什么称号来赞美我们的领袖都远远不足够！"
deci_worship_capital:0 "用我们伟大领袖的名字命名首都"
deci_worship_capital_desc:0 "为了让全国人民牢牢记住我们领袖的伟大，用他的姓名来重新命名我们的首都，可以让这座城市锦上添花！"
deci_worship_home:0 "扩建我们伟大领袖的故乡"
deci_worship_home_desc:0 "我们伟大领袖的故乡，养育了我们祖国最伟大的人物，我们应该在那里建造一个大型建筑群，包括博物馆和纪念碑等，向游客展示我们领袖不平凡的生平。"
deci_worship_loyalty:0 "要求军队忠诚于伟大元帅"
deci_worship_loyalty_desc:0 "我们国家的军队应当无条件地忠于我们伟大的统帅。"
deci_worship_ban_protest:0 "禁止游行集会"
deci_worship_ban_protest_desc:0 "一些受到境外势力和敌对势力支持的颠覆分子经常组织示威游行，发表他们荒唐的无政府主义言论，领袖在总统府的阳台上看了很不高兴。"
deci_worship_party_desc:0 "办一场趴体"
deci_worship_party_desc_desc:0 "一场盛大的宴会，既可以拉拢政治势力，又可以转移群众的注意力，面包和马戏永远是掩盖社会矛盾的最佳手段。"
deci_worship_spuress:0 "打击政治对手"
deci_worship_spuress_desc:0 "总统的政策就是国家的政策，反对总统就是敌人！敌人越是反对总统，就说明总统阁下做对了！朋友反对总统，就说明朋友实际上是敌人！ "
deci_worship_strike_nologies:0 "打击知识分子"
deci_worship_strike_nologies_desc:0 "知识分子喜欢参与政治，成为潜在的政治反对派，文盲只需要按照总统的政策当劳动力。"
deci_worship_killed:0 "公开枪决政治犯"
deci_worship_killed_desc:0 "杀鸡儆猴，以儆效尤。"
deci_worship_luxury:0 "进口外国奢侈品"
deci_worship_luxury_desc:0 "豪车、别墅、珠宝……当然，这些奢侈品是属于人民的，总统先生只是有义务使用它们在国际场合展示我们国家的财力。"
deci_worship_rub_companies:0 "吞并民营企业"
deci_worship_rub_companies_desc:0 "我国的许多工业产业被大资本家所占有，总统先生将代表人民将这些资产纳入其名下，总统拿到了就等于人民拿到了。"
deci_worship_rub_plants:0 "吞并大种植园"
deci_worship_rub_plants_desc:0 "我国的许多经济作物产业被大种植园主所占有，总统先生将代表人民将这些资产纳入其名下，总统拿到了就等于人民拿到了。"
deci_worship_rub_foreign:0 "掠夺外资"
deci_worship_rub_foreign_desc:0 "我国的许多产业被外国资本所占有，总统先生将代表人民将这些资产纳入其名下，总统拿到了就等于人民拿到了。"
deci_worship_rub_land:0 "吞并耕地"
deci_worship_rub_land_desc:0 "少部分自耕农还保留了一部分土地，总统先生将代表国家将这些土地国有化，用在他想用的地方。"
deci_worship_families:0 "鸡犬升天"
deci_worship_families_desc:0 "常言道老鼠的儿子会打洞，伟大的领袖拥有伟大的血统和伟大的家族，因此应该考虑任命领袖的亲属在政府中拥有职位。"
deci_worship_:0 "放款腐败"
deci_worship_rub_cash:0 "充实总统的个人财产"
deci_worship_rub_cash_desc:0 "我们国家在伟大领袖的指导下，走向繁荣和富强，但经济发展使得许多国家财富被个别资本家占有，没办法，那就让总统先生替人民管理这些资产吧。"

