algeria_war_decis:0 "阿尔及利亚战事"
algeria_war_decis_desc:0 "阿尔及利亚人对法国一百多年统治的不满和愤怒被点燃，反抗的战火已经将北非的山脉和沙漠燃烧。"
algeria_war_harkis_decis:0 "争取[FROM.GetName]的哈基人支持"
algeria_war_harkis_decis_desc:0 "在法国统治阿尔及利亚的一百多年里，有许多阿拉伯裔居民选择了与法国当局，参与法国人的军队的政治机构，这些人被称作哈基米（bushi）哈基人，他他们是法国在阿尔及利亚最庞大的支持者，也是我们在阿尔及利亚的统治基础。"
algeria_war_jews_decis:0 "争取[FROM.GetName]的阿尔及利亚犹太人支持"
algeria_war_jews_decis_desc:0 "阿尔及利亚有许多犹太裔居民，他们与当地的穆斯林关系不怎么和谐。也许我们可以尝试与他们接触，争取他们的合作。"
algeria_war_christ_decis:0 "争取[FROM.GetName]的阿尔及利亚基督徒支持"
algeria_war_christ_decis_desc:0 "阿尔及利亚有许多基督教居民，他们与当地的穆斯林关系不怎么和谐。也许我们可以尝试与他们接触，争取他们的合作。"
algeria_war_suffi_decis:0 "争取[FROM.GetName]的苏菲派支持"
algeria_war_suffi_decis_desc:0 "阿尔及利亚有许多苏菲派穆斯林，他们与叛乱分子的主力——逊尼派穆斯林关系不怎么和谐。也许我们可以尝试与他们接触，争取他们的合作。"
algeria_war_middle_decis:0 "争取[FROM.GetName]的中产阶级支持"
algeria_war_middle_decis_desc:0 "法国治理阿尔及利亚时期，发展了经济和产业，从而产生了一批中产阶级。他们是法国统治阿尔及利亚的既得利益者，也许我们可以尝试与他们接触，争取他们的合作。"
algeria_war_berbers_decis:0 "争取[FROM.GetName]的柏柏尔人支持"
algeria_war_berbers_decis_desc:0 "阿尔及利亚有许多阿玛齐格族原住民，他们与当地的阿拉伯人关系不怎么和谐。也许我们可以尝试与他们接触，争取他们的合作。"
algeria_war_propaganda_decis:0 "为亲法势力宣传"
algeria_war_propaganda_decis_desc:0 "解放组织让你的兄弟姐妹在前线送死，而他们的头目在开罗花天酒地！\n只有支持法兰西，才能为阿尔及利亚带来自由！平等！博爱！"
ALG_local_cooperate_6:0 "已至少成功争取6次当地群众的支持"
algeria_war_autonomy_decis:0 "扶持[FROM.GetName]的地方自治机构"
algeria_war_autonomy_decis_desc:0 "我们已经在[FROM.GetName]争取到了足够的支持者，接下来，我们将组织这些支持者建立一个亲法的地方政府，用阿尔及利亚人管理阿尔及利亚人。"
ALG_local_gov:0 "已至扶持[FROM.GetName]的地方政府"
algeria_war_moghazni_decis:0 "成立[FROM.GetName]Moghazni民兵组织"
algeria_war_moghazni_decis_desc:0 "Moghazni意为代理人，他最早指代奥斯曼帝国统治阿尔及利亚时期，在苏丹和地方部落之间的行政中间人，后来法国统治时期，在阿尔及利亚组建的辅助军队也被称为Moghazni。"
