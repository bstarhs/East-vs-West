PRC_korea_war_decis:0 "抗美援朝"
PRC_korea_war_decis_desc:0 "抗美援朝"
PRC_support_korea:0 "志愿军入朝！"
PRC_support_korea_desc:0 "中国人民志愿军已集结完毕，整装待发，随时准备入朝参战！\n选择该决议后，您将获得一个增加志愿军数量上限的国家精神，之后您还需要手动向朝鲜派遣志愿军。"
PRC_korea_war_mobilized_decis:0 "志愿动员"
PRC_korea_war_mobilized_decis_desc:0 "美帝国主义武装干涉朝鲜内战的行为令我们高度警惕，如果美帝占领北朝鲜，那将对我国东北地区造成严重的威胁。我们必须做好同样军事介入朝鲜局势的准备，这将是中国共产党武装力量的首次出国作战，在政治、外交、后勤和思想动员上，都需要进行完全的准备。"
PRC_korea_war_border_guard_decis:0 "成立东北边防军"
PRC_korea_war_border_guard_decis_desc:0 "美军越过三八线后，开始对鸭绿江边境地区狂轰滥炸，对我国人民群众和当地经济生产造成严重破坏，我们需要尽快组织一支专门的武装力量，保卫东北国界和领空，从而保障抗美援朝作战大后方的安全。"
PRC_korea_war_release_pow_decis:0 "释放战俘"
PRC_korea_war_add_in_decis:0 "重整志愿军"
PRC_korea_war_add_in_decis_desc:0 "该决议主要由AI使用，确保AI指挥下的志愿军规模控制在一定数量，人类玩家可无视。"
PRC_korea_war_ask_soviet_decis:0 "争取苏联支持"


