PRC_check_great_farmines_desc:0 "信阳的大饥荒令人触目惊心，我们不知道在全国的其他地区是否还存在这样可怕的大规模粮食短缺问题，我们必须立刻在各地展开调查，及时挽救。"
PRC_colect_foods:0 "征收粮食"
PRC_colect_foods_desc:0 "苏联领导人背信弃义，以外债为由撤离驻华技术人员，还在国际社会大放厥词，说什么中国欠下苏联巨额债务无法偿还。这种侮辱是中国人民不可接受的。为了早日还清苏联债务，实现既无内债，又无外债，我们需要勒紧裤腰带过日子。随着大跃进的成功开展，我国的粮食产量不断增高，因此我们可以提高粮食征收指标，将多余的粮食出口换取外汇，以用于还清债务。"

