deci_WCT_category:0 "世界贸易中心"
deci_WCT_category_desc:0 "世界贸易中心是人类致力于世界和平的生动象征……它代表着人类对人性、对个人尊严的追求、对人类合作的信念，以及通过合作，人类能够发现自己的伟大之处。\n\n——山崎实"
