factories_private_10:0 "破产清算10家工厂"

secular_education_decis:0 "去除教育中的宗教"
secular_education_decis_desc:0 "[FROM.GetName]将走向现代化、世俗化和未来化，如果我们要建设一个繁荣的国家，就必须让科学、人文主义和世俗主义成为所有国民的共识，从我们的孩子开始，将落后的宗教习俗一步步去除。"
education_cloese_madrasa_decis:0 "关闭宗教学校"
education_cloese_madrasa_decis_desc:0 "许多观念保守的家庭依然热衷于将儿童送进教堂或清真寺中学习，而不是公立学校，我们要在推广公立义务教育的同时，将这些落后的教会学校关闭。"
education_cloese_swear_decis:0 "取消宗教宣誓"
education_cloese_swear_decis_desc:0 "很多的国家公务员在宣誓时，依然习惯地会说，向上帝宣誓……政府官员要起到带头作用，首先将这种不良习惯去除。"
education_modernized_clothes_decis:0 "推广现代服饰"
education_modernized_clothes_decis_desc:0 "头巾、菲斯和长袍，让我们在世界各国面前像一个落后国家，我们的现代化将从人民的生活习惯开始，脱下长袍，剔除胡须，穿上西装，融入国际社会。"
education_science_decis:0 "推广自然科学教育"
education_science_decis_desc:0 "圣经和古兰经都应该全部离开学校，现代国家的学生在学校中学习的不能是先知或救世主的言论，而是自然、科学、历史、政治和艺术，现代教育是为了培养能继承国家的现代人。"
education_teachers_decis:0 "培养新式教育团队"
education_teachers_decis_desc:0 "教会学校中的教士已不能再承担起现代教育的任务，我们派往欧洲国家留学归来的年轻一代教师将接过这个责任。"
education_more_schools_decis:0 "资助新式学校"
education_more_schools_decis_desc:0 "在关闭教会学校的同时，政府也需要投入更多的资源来支持公立学校的建设，以打造一个现代的教育体系。"

