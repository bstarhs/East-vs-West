ENG_Windscale_reactors:0 "建造温斯凯尔反应堆"
ENG_Windscale_reactors_desc:0 "氢弹的研发需要用到更复杂的原材料，我们的和专家多数支持使用钚。同样爆炸当量下，钚的用量约为铀-235的十分之一，钚反应堆的运作成本亦远低于浓缩铀工厂，钚因此成为了经费有限下的最佳选择。位于坎伯兰郡温斯凯尔地区的核反应堆在二战时期就已参与到核原料的生产工作当中，因此通过扩大温斯凯尔现有的核反应堆，就能启动钚原料的制造。"


