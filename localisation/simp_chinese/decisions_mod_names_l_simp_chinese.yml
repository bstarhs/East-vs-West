USA_Operation_Buster_Jangle:0 "克星行动核试验"
USA_Operation_Buster_Jangle_tool:0 "每次成功都能获得战略轰炸机研发速度加成"
USA_Operation_Ivy:0 "常春藤行动核试验"
USA_Operation_Ivy_tool:0 "每次成功都能获得氢弹研发速度加成"
USA_Operation_Castle:0 "城堡行动核试验"
USA_Operation_Castle_tool:0 "每次成功都能获得氢弹研发速度加成"
USA_Operation_DesertRock:0 "沙漠岩石行动演习"
USA_Operation_DesertRock_tool:0 "每次成功都能获得核武器和核防护研发速度加成"
USA_Operation_Redwing:0 "红翼行动演习"
USA_Operation_Redwing_tool:0 "每次成功都能获得核导弹研发速度加成"

USA_Project_Carryall_decis:0 "核开山计划"
USA_Project_Carryall_decis_desc:0 "我们可以利用核炸药在南加州布里斯托尔山脉开挖一条道路，供40号州际公路和阿奇森-托皮卡-圣菲铁路通行。"
USA_Tennessee_Tombigbee_Waterway_decis:0 "田纳西-汤比格比运河"
USA_Tennessee_Tombigbee_Waterway_decis_desc:0 "通过核爆，我们可以在田纳西河与汤比格比河之间更高效地开凿一条新的人工运河。"
USA_Operation_Chariot_decis:0 "战车计划"
USA_Operation_Chariot_decis_desc:0 "阿拉斯加的汤普森角地理位置优越，很适合发展一个港口，但此处地理环境较为极端，如果用现有的建筑工程进行开挖，难度是巨大的，但如果我们使用核弹进行开挖的话……"

USA_Operation_Gnome_decis:0 "侏儒行动实验"
USA_Operation_Gnome_decis_desc:0 "侏儒实验具有许多重要的科学意义，此次试验的众多目标包括：生产和回收有用的放射性同位素、研究热能回收、开展中子物理实验以及为地球物理研究提供地震源。"
USA_Operation_Sedan_decis:0 "色当行动实验"
USA_Operation_Sedan_decis_desc:0 "色当行动将测试通过核爆来获得矿物的可能。"
USA_NS_Savannah_decis:0 "萨凡纳号核动力货船"
USA_NS_Savannah_decis_desc:0 "强大的核动力船只动力不仅可以在战时支持战舰，也可以在和平时期支持民用船只的推动。\n \n \n \n£decision_USA_NS_Savannah\n \n \n \n \n"

SOV_project_6_decis:0 "6号计划"
SOV_project_6_decis_desc:0 "作为国民经济核爆炸计划的一部分，6号计划将测试借助核弹开发水库、运河等大型工程的可能。"
SOV_project_7_decis:0 "7号计划"
