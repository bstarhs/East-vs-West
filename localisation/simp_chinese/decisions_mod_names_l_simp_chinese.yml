CUB_revolucion_decis:0 "独裁  黑帮  革命"
CUB_revolucion_decis_desc:0 "我和82个人一起开始革命。如果我必须再做一次，我将怀着坚定的信念，和10或15个人一起干。只要你有信念和行动计划，队伍再小也没有关系。\n- 菲德尔·卡斯特罗\n\n§W美国政府支持率：§Y[?THIS.US_gov_aid_opinion]§W\n美国舆论支持率：§Y[?THIS.US_public_aid_opinion]§W"
CUB_pushed_slum:0 "铲除[FROM.GetName]的贫民窟"
CUB_pushed_slum_desc:0 "贫民窟不仅容易成为叛军活动的据点，还容易成为一些美国媒体侮辱抨击我们总统的借口。"
CUB_surrender_revo:0 "嘻，可以和解吗？"
CUB_CubanGrandPrix_revo:0 "举办古巴大奖赛"
CUB_CubanGrandPrix_revo_desc:0 "古巴大奖赛是加勒比海地区最大的一级方程式赛车比赛。借助比赛，向全世界展示，古巴的政治局势依然稳定，社会依然和谐，旅客在古巴依然安全……"
CUB_construct_slum:0 "在[FROM.GetName]进行建设"
CUB_construct_slum_desc:0 "叛军和某些美国媒体总是说总统先生把国家的收入纳入口袋而不用于改善人民生活，那我们就拿出一些资金用于改造贫民窟，建立完善的基础设施，让古巴人民确实能看到，总统先生是愿意，且能够为他们带来更好的生活。"
CUB_bombing_decis:0 "古巴空军的骇人轰炸"
CUB_bombing_decis_desc:0 "尽管我们的美国二手二战军机略有落后，但用他们对[FROM.GetName]的叛军进行攻击和恐吓，已经足够。"
CUB_bride_conflict_decis:0 "尝试贿赂叛军"
CUB_bride_conflict_decis_desc:0 "叛军中有一些不坚定的动摇派和两面派，我们只需要花点钱，就能让其中一些人叛逃到我们这里。"
CUB_guardian_rural:0 "赞助[FROM.GetName]的乡村卫队"
CUB_guardian_rural_desc:0 "乡村卫队是古巴民间的武装组织，起源于1898年美西战争后，美国为了维持古巴占领区的秩序而建立的民兵团体，并招收古巴本地兵员。古巴独立后，乡村卫队成为古巴种植园主和工厂主的私人打手团体。"

CUB_bride_us_decis:0 "贿赂美国政客"
CUB_bride_us_decis_desc:0 "我们可以花点小钱，打点华盛顿里有权有势的人物，好让他们支持我们的政府。"
CUB_bride_us_decis_tool:0 "美国政府支持率增加了"
CUB_bride_media_decis:0 "贿赂美国媒体"
CUB_bride_media_decis_desc:0 "我们可以花点小钱，打点美国一些有知名度的媒体，好让他们支持我们的政府。"
CUB_bride_tourist_decis:0 "贿赂美国旅游公司"
CUB_bride_tourist_decis_desc:0 "我们可以花点小钱，打点美国一些有知名度的旅行公司，好让他们吸引更多游客来到古巴。"

CUB_bride_people_decis:0 "济贫活动"
CUB_bride_people_decis_desc:0 "这是面粉，这是木薯，这是药品，这是咖啡，还有现金……这些物资都是伟大的巴蒂斯塔总统赐予你们的，总统阁下关心贫困群众，发放济贫物资，因此民众必须支持总统，才能过剩好生活！"
CUB_propaghanda_decis:0 "政治宣传"
CUB_propaghanda_decis_desc:0 "叛军让你的兄弟姐妹在前线送死，而他们的头目在墨西哥花天酒地！\n只有支持伟大的巴蒂斯塔总统，才能为古巴带来富裕和繁荣！Con Badista!"

CUB_helpping_casino_decis:0 "补贴赌场"
CUB_helpping_casino_decis_desc:0 "赌场因为政治动荡而面临亏损，为了避免赌场的彻底破产，还是需要抬出一笔钱来补贴赌场运营。"
CUB_helpping_tourist_decis:0 "补贴旅游业"
CUB_helpping_tourist_decis_desc:0 "旅游业因为政治动荡而面临亏损，为了避免旅游业的彻底破产，还是需要抬出一笔钱来补贴运营。"

CUB_sweep_casino_decis:0 "清查赌场"

CUB_deportation_casino_decis:0 "驱逐赌场"
CUB_deportation_casino_decis_desc:0 "美国佬在古巴开设赌场，把古巴搞得乌烟瘴气，让他们滚蛋！"
CUB_deportation_mafia_decis:0 "驱逐黑帮"
CUB_deportation_mafia_decis_desc:0 "美国佬在从事各种犯罪活动，把古巴搞得乌烟瘴气，让他们滚蛋！"
CUB_deportation_hotel_decis:0 "大酒店国有化"
CUB_deportation_hotel_decis_desc:0 "美国佬在古巴建造的许多旅游大酒店，虽然一定程度上带动了经济，但这些利润都没有成为古巴人民的利润，而是流入独裁者口袋。我们应该劝说美国人把这些酒店交给我们的新政府，让他们成为新政府的财政来源。"
CUB_deportation_plantation_decis:0 "大种植园国有化"
CUB_deportation_plantation_decis_desc:0 "美国佬霸占古巴的甘蔗、香蕉和咖啡种植园一百多年了，让他们把属于古巴的财富还给我们！"

CUB_revolucion_rural_militia_decis:0 "组建革命民兵"
CUB_revolucion_rural_militia_decis_desc:0 "我们应该把拥护新政府的人民群众武装起来，发放武器、组织训练，对抗颠覆分子，保卫新古巴！"
CUB_revolucion_execute_decis:0 "处死巴蒂斯塔爪牙残余"
CUB_revolucion_execute_decis_desc:0 "巴蒂斯塔政权的余孽，屠杀人民，犯下无数罪孽，应当将他们当中的一些人挑出来，公开处决，以平民愤！"
CUB_revolucion_propaganda_decis:0 "为革命政府进行宣传"
CUB_revolucion_propaganda_decis_desc:0 "古巴人民们！这里是哈瓦那革命电台为您广播……"
CUB_revolucion_rlease_criminal_decis:0 "大赦政治犯"
CUB_revolucion_rlease_criminal_decis_desc:0 "监狱里关押了一些巴蒂斯塔时期被捕的政治犯，我们可以将他们释放出来，为他们恢复自由和名誉，以展示新政府的进步和民主政策，尽管他们中的一些人与我们的政治观点有所不同。"
CUB_revolucion_social_help_decis:0 "救助中下层民众"
CUB_revolucion_social_help_decis_desc:0 "为贫困群众提供食品、药品和其他救济物品，是争取民众支持最快的方法。"
CUB_revolucion_nationalized_cigar_decis:0 "雪茄产业国营化"
CUB_revolucion_nationalized_cigar_decis_desc:0 "土地改革不断推进，政府已经获得了绝大部分烟草种植园和雪茄制造、销售企业的所有权，现在，我们应该建立一个国营的总公司，全面管理雪茄产业，将雪茄的利润掌握在国家手里。"
CUB_revolucion_nationalized_sugar_decis:0 "蔗糖产业国营化"
CUB_revolucion_nationalized_sugar_decis_desc:0 "土地改革不断推进，政府已经获得了绝大部分甘蔗种植园和蔗糖制造、销售企业的所有权，现在，我们应该建立一个国营的总公司，全面管理蔗糖产业，将蔗糖的利润掌握在国家手里。"
CUB_revolucion_finished:0 "革命政权的胜利巩固"
CUB_revolucion_finished_desc:0 "古巴革命建立的新古巴政府得到了稳固。社会秩序趋于稳定，土地改革获得成功，人民对我们予以用户和支持，反革命的暴乱也走向消亡……我们将正式宣布，古巴革命获得胜利，古巴共和国的主要任务，将从巩固新政权，转向经济和社会建设。"
CUB_revolucion_visit_us:0 "访问美国"
CUB_revolucion_diplomatic:0 "与[FROM.GetName]的外交接触"
CUB_revolucion_supporting:0 "支持[FROM.GetName]的革命组织"
CUB_revolucion_supporting_desc:0 "随着古巴革命取得胜利，我们也应该积极支持其他国家的革命运动。[FROM.GetName]的独裁者一直支持巴蒂斯塔镇压革命，甚至革命胜利后也继续支持反革命叛乱，我们必须以其人之道还治其人之身，为的[FROM.GetName]反独裁革命组织提供帮助。"

