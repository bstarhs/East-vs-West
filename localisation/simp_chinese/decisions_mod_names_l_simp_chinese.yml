nuclear_uranium_235:0 "制取铀-235"
nuclear_uranium_235:0 "惕然铀矿中，能被用于制造核武器的铀-235仅占1%，其余都是纯度不足的铀-238，后者在发生链式反应时，中子会扩散和流失，使得链式反应不充分，而铀-235可以确保有足够的中子撞击原子核，从而使得链式反应充分进行，因此制造原子弹，必须获得足够的铀-235"
