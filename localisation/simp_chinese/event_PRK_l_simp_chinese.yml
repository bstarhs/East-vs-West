l_simp_chinese:
 prk.1.t:0 "朝鲜民主主义人民共和国成立！"
 prk.1.d:0 "在平壤举行的盛大仪式上，北朝鲜人民委员会主席金日成，宣布建立朝鲜民主主义人民共和国！在朝鲜南北双方谈判失败后，半岛北部亲苏的左翼势力决定成立自己的国家"

 prk.4.t:0 "北朝鲜向南发动进攻！"
 prk.4.d:0 "来自韩国的突发消息，北朝鲜人民军已于今天发动突然袭击，越过三八线向南方的大韩民国进攻。北朝鲜领导人金日成宣称这是一次旨在推翻南部李承晚伪政权，实现半岛统一的解放战争，而韩国及美国则指责北朝鲜发动侵略。"
 prk.4.a:0 "热战已在东亚开始。"

 prk.5.t:0 "投票决定联合国第83号决议"
 prk.5.d:0 "北朝鲜对南韩的入侵引起联合国讨论与关注，为阻止共产入侵，美国在联合国安理会提出新的决议，要求派遣武装部队进入南韩作战，阻止朝鲜军。"

 prk.6.t:0 "联合国第83号决议通过！"
 prk.6.d:0 "联合国安理会通过表决，宣布支持美国提出的第83号决议！联合国将授权西方国家派遣部队前往韩国，阻止朝鲜军队入侵。"

 prk.7.t:0 "朝鲜人民军占领汉城！"
 prk.7.d:0 "在猛烈的攻势下，守卫首都汉城的大韩民国国军被迫撤离，朝鲜人民军宣布正式控制这座城市。人民军宣布实行军管维持秩序，并宣称这是解放南方战争取得的重要进展，而李承晚等南方领导人则向釜山方向逃离。"
 prk.7.a:0 "巨大的进展。"

 prk.8.t:0 "朝鲜人民军占领釜山！"
 prk.8.d:0 "经过激烈的战斗，朝鲜人民军攻破大韩民国国军建立的洛东江防线，韩军几乎全部溃败。在包围数日之后，釜山市内的韩军和联合国军被迫投降，人民军在釜山市政厅升起了旗帜，大韩民国总统被迫逃亡济州岛。/n釜山的陷落标志着朝鲜战争基本结束，朝鲜劳动党委员长金日成宣布将朝鲜民族从帝国主义傀儡统治下解放的伟业已经完成。"
 prk.8.a:0 "巨大的进展。"

 prk.9.t:0 "联合国军越过三八线！"
 prk.9.d:0 "随着联合国军抵达朝鲜半岛支援，南韩军队开始进行反攻。在最近一次的汉城战役中，他们成功夺回了首都，并将北朝鲜人民军逐出南方领土。/n韩军和联合国军下一步的计划是越过三八线，向北朝鲜首都平壤进军，但这引起了中共政府的不安。"
 prk.9.a:0 "巨大的进展。"

 prk.10.t:0 "联合国军占领平壤！"
 prk.10.d:0 "在联合国军和韩军的攻势下，驻守平壤的北朝鲜人民军无法抵挡，被迫撤离，联合国军由此控制了北朝鲜的首都。/n联军的快速进攻使得联合国军总司令麦克阿瑟非常得意，他认为很快就可以消灭北朝鲜的共产主义政权。而北京政府对此十分不安，他们发出警告，如果联合国军逼近中朝边境线，他们将作出介入的决定。"
 prk.10.a:0 "巨大的进展。"

 prk.11.t:0 "中共军队取得长津湖作战胜利！！"
 prk.11.d:0 "尽管气候严寒，损失巨大，但装备落后、补给缺乏的中国人民志愿军凭借顽强的战斗力，取得了长津湖战斗的战略胜利！中共军队不仅阻止了联合国军的进一步北上，并进行了反攻，麦克阿瑟消灭朝鲜人民军的计划破灭了！"
 prk.11.a:0 "巨大的进展。"

 prk.12.t:0 "联合国军完全占领朝鲜半岛"
 prk.12.d:0 "随着朝鲜人民军尽数撤往中国境内，朝鲜战争最终以南韩和联合国军的胜利告终。李承晚宣布共产主义的入侵已经被阻止，而韩半岛的统一耶已完成。但北京和流亡中国的金日成拒绝承认此结果，未来中韩边境不会太平。"
 prk.12.a:0 "巨大的进展。"

 prk.13.t:0 "联合国军收复汉城！"
 prk.13.d:0 "经过激烈战斗，联合国军收复韩国首都汉城，朝鲜人民军匆忙撤离！"

 prk.14.t:0 "中共军队攻克汉城！"
 prk.14.d:0 "经过激烈战斗，中国和北朝鲜军队再一次攻克汉城，联合国军和韩军被迫撤离。"

 prk.15.t:0 "关于发起新一轮作战行动的建议"
 prk.15.d:0 "我军在朝鲜战场上与美李军队处于相持状态，为了取得突破，彭德怀同志建议我们发起新一轮攻势，消灭美军有生力量，从而在谈判桌上获得主动权。"
 KOREA_war_attack_modifier:0 "朝鲜战争进攻修正"

 prk.16.t:0 "中国军队发起新一轮攻势"
 prk.16.d:0 "中国军队在朝鲜发起新一轮攻势，试图打破僵局，取得主动权。"

 prk.17.t:0 "关于发起新一轮作战行动的建议"
 prk.17.d:0 "我军在朝鲜战场上与共军处于相持状态，为了取得突破，联合国军司令部建议我们发起新一轮攻势，消灭共军有生力量，从而在谈判桌上获得主动权。"

 prk.18.t:0 "联合国军发起新一轮攻势"
 prk.18.d:0 "联合国军在朝鲜发起新一轮攻势，试图打破僵局，取得主动权。"

 prk.19.t:0 "毛岸英在朝鲜战场阵亡！"
 prk.19.d:0 "来自北京的消息，中共领导人毛泽东的长子，毛岸英在朝鲜遭遇美军轰炸机袭击，他和另外几名中共军人由于没有及时撤离，而死于凝固汽油弹轰炸，我们已从中共外交部门证实这一消息。毛岸英年仅28岁，曾在苏联留学，并希望成为像父亲一样伟大的军事家，因此他不顾毛泽东反对参加了进入朝鲜作战的中共军队，最终葬身异国。\n北朝鲜政府为毛岸英举行了葬礼，许多中共的友好国家也发去唁电，而毛泽东显然已经处于极度的悲伤当中，并暂停了接下来一个多月的政务。"

 prk.20.t:0 "毛岸英躲过美军轰炸！"
 prk.20.d:0 "来自北京的消息，中共领导人毛泽东的长子，毛岸英在朝鲜遭遇美军轰炸机袭击，他和另外几名中共军人由于没有及时撤离，险些被击中，但他依然艰难地从轰炸区域跑了出来，仅受轻伤。我们已从中共外交部门证实这一消息。毛岸英年仅28岁，曾在苏联留学，并希望成为像父亲一样伟大的军事家，因此他不顾毛泽东反对参加了进入朝鲜作战的中共军队，经历此劫，愤怒的毛泽东要求儿子立刻回国。"

 prk.21.t:0 "对方拒绝谈判！"
 prk.21.d:0 "对方拒绝与我们进行停火谈判！"

 prk.22.t:0 "朝鲜战争开始初步谈判"
 prk.22.d:0 "朝鲜战争各方开始进行初步谈判，争取达成停火协议。"

 prk.23.t:0 "有关战俘释放问题"
 prk.23.d:0 "我方与联合国军的谈判进展遇到瓶颈，对方声称要将志愿军战俘全部送到台湾去，这对我们来说是无法接受的，因为这等于告诉全世界，志愿军战士们宁愿前往国民党统治也不愿回到祖国。"

 prk.24.t:0 "中共拒绝战俘释放条款！"
 prk.24.d:0 "朝鲜战争停火谈判陷入僵局，中国和北朝鲜拒绝联合国军将战俘送往台湾，谈判各方不欢而散。"

 prk.25.t:0 "中共接受战俘释放条款！"
 prk.25.d:0 "中国与联合国军的停火谈判达成初步协议，中共同意被俘的志愿军士兵自行选择回国或前往台湾。"

 prk.26.t:0 "韩国政府拒绝和谈！"
 prk.26.d:0 "韩国总统斥责联合国军越过韩国政府单方面与中共和北朝鲜和谈的行为！他宣布韩国将继续战斗，直到统一图们江以南的所有领土！"

 prk.27.t:0 "韩国政府同意和谈！"
 prk.27.d:0 "韩国总统在联合国军压力下，不得不同意与北方和谈。"

 prk.28.t:0 "联合国军计划与北方和谈！"
 prk.28.d:0 "美国人已经决定与平壤及中共政权进行谈判，然而，韩半岛北方依然有许多领土处于共产政权控制之下！如果在没有完全实现半岛统一之前，与共产军实现停火，就等于将半岛北部领土拱手让给金日成，让大韩永远陷入分裂！"

 prk.29.t:0 "朝鲜停战协定签署"
 prk.29.d:0 "在经过长达数年的血腥战争后，朝鲜内战终于落下帷幕……联合国军、中共和北朝鲜军正式签署停战条约，宣布这次数百万人死亡的战争就此终结。大韩民国政府拒绝在停战协定签字。\n南北停火线依然停留在三八线一带，付出了如此多的代价，双方都没有赢得什么。"

 prk.30.t:0 "中国军队作战取得成功"
 prk.30.d:0 "经过数次激烈的战斗，中共军队成功将战线推回了三八线一带。"

 prk.31.t:0 "中国军队进攻失利"

 prk.32.t:0 "联合国军作战取得成功"
 prk.32.d:0 "经过数次激烈的战斗，联合国军成功将战线推回了三八线一带。"

 prk.33.t:0 "联合国军进攻失利"

 prk.34.t:0 "战争以难以进行"

 prk.35.t:0 "北朝鲜政府拒绝和谈！"
 prk.35.d:0 "北朝鲜领导人金正日斥责中国越过平壤政府单方面与联合国军和南朝鲜和谈的行为！他宣布朝鲜人民军将继续战斗，直到统一对马海峡以北的所有领土！"

 prk.36.t:0 "朝鲜政府同意和谈！"
 prk.36.d:0 "朝鲜在中国政府劝告下下，不得不同意与北方和谈。"
 

 prk.40.t:0 "向北朝鲜和中共军队提供秘密空中支持的建议"
 prk.40.d:0 "尊敬的中央委员会：\n\n鉴于当前朝鲜战场空中力量对比悬殊，中国人民志愿军在地面作战英勇，但在美军绝对空中优势下承受着巨大压力与损失。我军拥有性能优异的米格-15喷气式战斗机，其作战效能已在多次检验中得到证实。\n为有效扭转战场态势，巩固社会主义阵营的东方战线，我谨以空军指挥员的专业身份建议：立即派遣精锐的苏联空军飞行部队，驾驶米格战机秘密进驻中国东北境内机场，以“志愿航空兵”名义介入朝鲜空战。所有参战人员须移除军服标识，使用中方代号，并在必要时以中文进行简易无线电通讯，以最大限度隐蔽我方直接参战的事实。\n这一行动将能迅速建立起一条可靠的“米格走廊”，保护中朝军队的关键后勤线与前线阵地，并对美军轰炸机构成实质性威慑。此举既能体现国际主义精神，也完全符合我国在远东的战略安全利益。恳请中央审议。\n\n此致  敬礼！"

 prk.41.t:0 "苏联政府向我军提供空中支援"
 prk.41.d:0 "苏联政府向我军秘密提供了一批先进的米格战斗机和优秀的空军教官，帮助我们在空中战场与美国战机进行对抗。"
 
 
 

 prk.50.t:0 "北朝鲜宣布成立民主政府"

 prk.51.t:0 "朝鲜准备进行民主选举"
 prk.51.d:0 "朝鲜民主主义人民共和国准备进行第一次国会选举，并根据选举结果产生新的政府。"

 prk.52.t:0 "朝鲜社会民主党政府成立"
 prk.52.d:0 "朝鲜社会民主党赢得朝鲜的第一次国会选举，作为多数党，该党将组织新一届政府，党首曹晚植任首任内阁总理。"

 prk.53.t:0 "朝鲜共产党政府成立"
 prk.53.d:0 "朝鲜共产党赢得朝鲜的第一次国会选举，作为多数党，该党将组织新一届政府，党首金日成任首任内阁总理。"

 prk.53.t:0 "曹晚植辞职"
 prk.53.d:0 "朝鲜内阁总理曹晚植由于年事已高，在就任两年后宣布辞去职位，新一届的朝鲜政府将进行重新选举。新一届的政府领导人将在李允荣和金日成之间诞生。"

 prk.54.t:0 "朝鲜政府与统一教进行接触"
 prk.54.d:0 "朝鲜领导人金日成与统一教代表进行了见面和会谈，这是一个活跃于南韩和日本的新兴宗教组织。"

 prk.55.t:0 "平和汽车公司成立"
 prk.55.t:0 "平和汽车公司成立"

 prk.56.t:0 "朝鲜劳动党宣布成立"
 prk.56.d:0 "北朝鲜各大政治团体召开会议，正式宣布，由金日成领导的朝鲜共产党，和金枓奉领导下的朝鲜新民党合并，成立朝鲜劳动党。"

 prk.57.t:0 "北朝鲜政府向我方发出倡议"
 prk.57.d:0 "北朝鲜政府就南北双方举行和平谈判，讨论和平统一问题提出对话和邀请。"

 prk.58.t:0 "南韩接受北方的倡议"
 prk.58.d:0 "南韩政府接受了北方就双方和平统一问题发起的对话和邀请。"

 prk.59.t:0 "南韩拒绝北方的倡议"
 prk.59.d:0 "南韩拒绝接受了北方就双方和平统一问题发起的对话和邀请。"

 prk.60.t:0 "南北朝鲜召开和平统一大会"
 prk.60.t:0 "朝鲜民族和平统一大会在平壤召开，金九、金日成、曹晚植、金斗奉等许多著名的朝鲜独立运动领袖举行会谈，并正式决定尽快实现南北双方和平统一。"

 prk.61.t:0 "南朝鲜退出和平统一方案"
 prk.61.d:0 "随着南韩发生政治局势变动，新的南韩领导人宣布退出半岛和平统一计划，并宣布采取反共主义政策。"

 prk.62.t:0 "南北朝鲜正式成立联合政府"
 prk.62.d:0 "在经历了二战后数年的托管统治和南北分裂后，南北朝鲜双方正式达成共识，宣布成立朝鲜人民共和国联合政府，朝鲜半岛实现统一。"

 prk.63.t:0 "北方提出与我们进行对话"
 prk.63.d:0 "北方政府通过第三方向我们提出进行外交对话。"

 prk.64.t:0 "南北朝鲜进行外交对话"
 prk.64.d:0 "在内战结束多年后，南北朝鲜政府通过外交努力，终于实现了第一次外交对话，双方同意在半岛政治现状的基础上，进行进一步的人道主义互动，推动和平进程。"

 prk.65.t:0 "南方拒绝与我们进行对话"
 prk.65.d:0 "南方傀儡政府拒绝与我们进行对话，依然保持强硬的敌对态度。"

 prk.66.t:0 "朝鲜延安派崛起"
 prk.66.d:0 "朝鲜政府内发生政治变动，以朴一禹为首的亲中国派的势力正在逐渐壮大"

 prk.67.t:0 "朝鲜劳动党大会"
 prk.67.d:0 "朝鲜劳动党大会即将召开，以朴一禹为首的亲改革派计划挑战金日成的领导地位。"

 prk.68.t:0 "朴一禹当选朝鲜劳动党总书记"
 prk.68.d:0 "在正在进行的朝鲜劳动党大会中，以朴一禹为首的延安派向金日成发起挑战，由于金日成实行个人专制，党内对他的不满已急剧膨胀，许多党员迅速站到了反金日成的阵营当中。今日才被迫宣布辞职，由朴一禹接任朝鲜劳动党最高领导人。"

 prk.69.t:0 "朝鲜发生政治变动"
 prk.69.d:0 "在正在进行的朝鲜劳动党大会中，以朴一禹为首的延安派向金日成发起挑战，反对金日成实行个人专制。然而，金日成经过多年统治，牢牢掌握了朝鲜的党政军大权，朴一禹对金日成的反对以失败告终。金日成进一步维护了自己的权利，而反对派遭到清洗。"

 prk.70.t:0 "金日成的崛起"
 prk.70.d:0 "近年来，朝鲜劳动党领导人金日成的权力不断扩大，在先后清洗了多个党内重要人物后，其愈发走向个人专制，成为朝鲜的最高独裁者。"

 prk.71.t:0 "朝鲜发生政治变动"
 prk.71.d:0 "朝鲜劳动党内部发生政治变动！"

 prk.72.t:0 "朝鲜爆发动乱！"

 prk.73.t:0 "金日成提出主体思想理论"
 prk.73.d:0 "朝鲜劳动党领导人金日成在近日的朝鲜劳动党大会上，正式提出了主体思想的概念，作为朝鲜劳动党和朝鲜民主主义人民共和国的政治指导思想。金日成表示，主体思想的核心就是人是自己的主人，主体思想的解释，就是政治的自主、经济的自立、国防的自卫。此外金日成还强调，人民是革命建设的主人。人民应当接受首脑的指导。首脑是头，党是躯体，人民是手足，躯体和手足应当听从头脑的指挥。如果没有头脑，就失去了生命。"

 prk.74.t:0 "朝鲜政府提出新的历史观点"
 prk.74.d:0 "朝鲜政府提出了新的历史政策，即所谓的主体史学。朝鲜政府认为，朝鲜民族是世界上最优秀的民族，诞生于五千年前的白头山地区。"

 prk.75.t:0 "金正日进入朝鲜政府"
 prk.75.d:0 "朝鲜领导人金日成的儿子金正日在结束兵役后，进入朝鲜政府高层工作，担任中央委员会委员。"

 prk.76.t:0 "朝鲜政府宣布檀君为朝鲜民族之主"
 prk.76.d:0 "朝鲜政府公布了新的历史观点，他们认为，朝鲜是一个古老的民族，早在公元前2333年，他们就在一个名叫檀君的国王统治下，建立了古朝鲜国，国土包括朝鲜半岛北部和中国辽宁。朝鲜政府宣称，他们的考古工作最近获得了巨大进展，成功发掘出了檀君时代的遗迹，因此，朝鲜政府宣布，他们已经成为与古中国、古埃及、古巴比伦和古希腊其名的新的世界文明古国。"

 prk.77.t:0 "朝鲜民主主义人民共和国宣布国家统一"
 prk.77.d:0 "随着大韩民国国军残余部队仓皇撤退，朝鲜人民军完成了整个朝鲜半岛的统一，至此共产主义势力在亚洲的扩张取得新的进展。朝鲜领导人金日成抵达汉城，宣布朝鲜国家正式统一在朝鲜劳动党的领导之下，中国、苏联等国宣布承认朝鲜政府对半岛的统一，但美国和西方国家拒绝承认，继续认定大韩民国为朝鲜半岛的唯一政权，目前大韩民国流亡政府和总统李承晚已撤退到长崎。"

 prk.78.t:0 "朝鲜宣布迁都汉城"
 prk.78.d:0 "朝鲜民主主义人民共和国宣布，该国已决定将旧大韩民国的首都首尔改回原来的名字汉城，并从平壤迁都于此处。"

 prk.79.t:0 "朝鲜宣布南方进入紧急状态"
 prk.79.d:0 "朝鲜政府宣布，由于支持大韩民国政府的残余势力抵抗激烈，该国南部进入戒严状态，并采取强硬手段镇压抵抗。"

 prk.80.t:0 "北朝鲜宣布严惩脱北南逃行为"
 prk.80.d:0 "随着向南逃亡的北朝鲜居民越来越多，北朝鲜政府出台法律，宣布严厉打击和惩处向南逃窜的背叛者。"

 prk.81.t:0 "南北边境发生大规模南逃事件！"
 prk.81.d:0 "南北边境发生群众逃亡，大量群众冒险跨国边境线冒险前往南方，尽管我边防部队出动阻止，但还是有大量人员跨过了边境线！"

 prk.82.t:0 "我方已取得对南方的渗透"
 prk.82.d:0 "我们的情报机构已成功渗透进入南方，即将开始情报收集和破坏工作。"

 prk.83.t:0 "我们可以支持南方学生运动"
 prk.83.d:0 "南方社会矛盾不断恶化，学生运动愈演愈烈，我们可以考虑支持这些学生运动，从而影响社会秩序，并传播我们的政治主张。"

 prk.84.t:0 "我们可以支持南方劳工运动"
 prk.84.d:0 "南方社会矛盾不断恶化，劳工运动愈演愈烈，我们可以考虑支持这些劳工运动，从而影响社会秩序，并传播我们的政治主张。"

 prk.85.t:0 "我们可以支持南方市民起义"
 prk.85.d:0 "南方光州市爆发了市民民主起义反对军政府，这是一个绝好的机会，我们可以为他们提供支持。"

 prk.86.t:0 "我们可以支持南方民主运动"
 prk.86.d:0 "南方光州市爆发了民主革命反对军政府，这是一个绝好的机会，我们可以为他们提供支持，并支持我们支持的民主党派。"

 prk.87.t:0 "朝鲜政府宣布实行先军政治"
 prk.87.d:0 "朝鲜政府颁布新的国家政策，宣布实行先军政治，即一切以军事建设有限，以发展军事为主要目的的政策。朝鲜政府宣称，美帝国主义依然对该国产生巨大威胁，而朝鲜不能依赖苏联和中国的支持来自卫，想要保卫国家，朝鲜必须发展独立自主的军事体制。"

 prk.88.t:0 "朝鲜开始研发核能"
 prk.88.d:0 "朝鲜政府宣布，该国近日在核能研究上取得重大突破，已计划开始进一步核能研究和建设工作。"

 prk.89.t:0 "朝鲜宣布发起千里马运动"
 prk.89.d:0 "朝鲜政府宣布，为了使得该国尽快从战争的破坏中恢复，同时进行工业建设，推动国家发展，朝鲜劳动党已制定第一个五年计划。金日成为该计划命名为千里马运动，意思是每天能跑千米的骏马。"

 prk.90.t:0 "朝鲜政府发起青山里运动"
 prk.90.d:0 "朝鲜领导人金日成今日参观了位于平安道青山里地区的集体农场，并大大赞扬了该地区的农业政策，包括动用人力改造自然等。金日成认为青山里是农业自主和革命热情精神的体现，呼吁全国进行学习。"

 prk.91.t:0 "朝鲜政府提出大安模式"
 prk.91.d:0 "朝鲜领导人金日成今日参观了位于平安道大安地区的大安电机工厂，并赞扬了该工厂实施的上下级互助、党委领导生产的政策，呼吁全国学习。"

 prk.92.t:0 "粮食发生减产！"
 prk.92.d:0 "由于自然环境遭到破坏，我国的粮食发生严重减产！"

 prk.93.t:0 "朝鲜提出我国朝鲜族战士加入该国军队"
 prk.93.d:0 "朝鲜政府向我们发来消息，该国正在建设军队，但缺少有经验的作战军官，希望我国允许中国人民解放军内的朝鲜族军官前往朝鲜，补充作战经验。"

 prk.94.t:0 "中国政府同意朝鲜族士兵回归"

 prk.95.t:0 "中国政府拒绝朝鲜族士兵回归"

 prk.96.t:0 "朝鲜领导人访问中国"

 prk.97.t:0 "朝鲜提出我国朝鲜族居民回国"

 prk.98.t:0 "苏联政府同意朝鲜族居民回归"

 prk.99.t:0 "苏联政府拒绝朝鲜族居民回归"

 prk.100.t:0 "朝鲜声明批判中国修正主义"

 prk.101.t:0 "中国中断对朝鲜的援助"

 prk.102.t:0 "朝鲜发表关于延边领土问题的声明"

 prk.103.t:0 "朝鲜宣布对非洲国家进行援助"

 prk.104.t:0 "朝鲜宣布成立主体思想国际研讨协会"

 prk.105.t:0 "几内亚诗人歌颂伟大的金日成同志"

 prk.106.t:0 "朝鲜领导人与会见日本共产党领袖"

 prk.107.t:0 "朝鲜政府提出与[ROOT.GetName]改善关系"

 prk.108.t:0 "朝鲜希望与我国建立外交关系"

 prk.109.t:0 "[FROM.GetName]宣布与朝鲜建立外交关系"

 prk.110.t:0 "[FROM.GetName]拒绝与朝鲜建立外交关系"

 prk.111.t:0 "[FROM.GetName]与北韩建交"

 prk.112.t:0 "南韩抗议日本与北朝鲜建立外交关系"

 prk.113.t:0 "北朝鲜宣布进行经济改革"

 prk.114.t:0 "北朝鲜宣布进行农业改革"

 prk.115.t:0 "北朝鲜宣布进行企业改革"

 prk.120.t:0 "国防部建议我们使用战术核武器"

 prk.121.t:0 "美国对中共军队进行核威慑"
 prk.121.d:0 "美国总统[USA.GetName]发表讲话，警告中共军队如不按照联合国决议撤离韩国，美国不排除使用战术核武器的可能。"

 prk.122.t:0 "美军在仁川登陆！"
 prk.122.d:0 "随着美国主导下的联合国军进入韩国抵抗北朝鲜入侵，美军今日早上开始执行登陆行动，在汉城西部的仁川地区进行登陆作战，以切断朝鲜人民军的后方！"

 prk.125.t:0 "朝鲜正在对南方策划战争"
 prk.125.d:0 "朝鲜领导人[PRK.GetName]在平壤举行的一次酒会上，告诉苏联驻平壤大使史迪科夫，北朝鲜已放弃和南朝鲜政府的所有和平谈判，决心采取武力解放南朝鲜……当然，北朝鲜目前的实力，可能无法对抗有美帝国主义支持的南朝鲜军，因此，[PRK.GetName]提出，苏联和中共方面可以在战争开始后，为朝鲜提供援助。"

 prk.126.t:0 "苏联同意支持我们解放南朝鲜"
 prk.126.d:0 "苏联获悉了有关我们即将武力解放南朝鲜的行动，对此，斯大林同志表示，苏联政府愿意在战争爆发后，为我方提供力所能及的军事支持，但他也强调，苏联不会直接介入朝鲜战事，同时警告我方必须速战速决，避免战争拖延和美军的介入，苏联不会与美国直接交火。"

 prk.127.t:0 "苏联拒绝支持我们解放南朝鲜"
 prk.127.d:0 "苏联获悉了有关我们即将武力解放南朝鲜的行动，对此，斯大林同志表示，苏联政府不会支持我方对南朝鲜的军事行动，并批评我们过于冒险。斯大林警告，如果朝鲜战争扩大化导致美国介入，苏联将从朝鲜撤离军队。"

 prk.128.t:0 "中共同意支持我们解放南朝鲜"
 prk.128.d:0 "中共获悉了有关我们即将武力解放南朝鲜的行动，对此，毛泽东同志表示，中共政府愿意在战争爆发后，为我方提供力所能及的军事支持。"

 prk.129.t:0 "中共拒绝支持我们解放南朝鲜"
 prk.129.d:0 "中共获悉了有关我们即将武力解放南朝鲜的行动，对此，毛泽东同志表示，中共不会支持我方对南朝鲜的军事行动，并批评我们过于冒险。"

 prk.130.t:0 "中共提出派遣部队进入朝鲜作战"
 prk.130.d:0 "中共外相周恩来表示，虽然我军在解放南朝鲜的战争中已取得优势，但如果美军介入，仍然会对我军战况带来严重的威胁。中共愿意派出武装部队，以志愿军的名义，进入朝鲜支援我军作战。"

 prk.131.t:0 "平壤拒绝我们进入南朝鲜作战"
 prk.131.d:0 "朝鲜政府婉拒了我们派遣军队进入朝鲜参与作战的建议，并表示朝鲜人民军已在战场上取得优势，不日即可消灭南朝鲜军并迫使美军撤退。"

 prk.132.t:0 "平壤同意我们派遣军队作战"
 prk.132.d:0 "朝鲜政府已同意我们派遣武装部队，以中国人民志愿军等名义进入朝鲜参与战斗。"
 
 

 prk.135.t:0 "中共正在动员部队"
 prk.135.d:0 "联合国军在朝鲜战场取得的优势，引起了中国共产党政府的不安，尤其是联合国军逼近三八线即将进入北朝鲜境内后，中共外交部长周恩来愤怒地指责联合国军不具有合法性，认为美国试图通过干涉朝鲜战争在北朝鲜建立傀儡政权，以威胁中国东北——中共最重要的工业基地。\n中共代表在苏联帮助下出席联合国就朝鲜问题举行的峰会，并于美国代表唇枪舌剑，中国大陆也开始传出中共军队正在动员的传闻，国际社会开始高度关注，中共武装介入朝鲜局势的可能。"

 prk.136.t:0 "警惕中共军队的动向"
 prk.136.d:0 "总统阁下\n\n中共军队介入朝鲜局势的可能性越来越高，我们呼吁尽快收集更多情报，以探清中共武力介入朝鲜局势的真实性，以及时间、规模。\n\n将间谍派遣至中国大陆建立情报网，或向中国东北派遣任意飞机编队以获取信息。"

 prk.137.t:0 "美国军机侵入中国东北"
 prk.137.d:0 "来自北京的消息。在今天中共外交部举行的记者会上，中共发言人愤怒地向外国记者宣称，美国战斗机昨日越过中朝边境，向中国东北的安东、抚顺等地发起空袭。随后发言人展示多张照片，宣称美国战斗机在中国东北的袭击造成了严重的后果，不仅炸毁了民用建筑，还对居民区扫射，造成了超过二百平民死伤。中共政府指责美国已犯下侵略暴行，而美国政府则宣称这一切完全是谎言。无论如何，国际观察家们认为这意味着中共已在为军事介入朝鲜造势。"

 prk.138.t:0 "中共军队在边境集结"
 prk.138.d:0 "总统阁下\n\n我们的情报机构发现中共军队正在中国与朝鲜的边境集结，这支代号为中国人民志愿军的部队可能已经集中了至少三个集团军的兵力，毫无以为，中共很快就会军事介入朝鲜，我们需要做好准备。"
 

 prk.140.t:0 "中共提出军事介入朝鲜"

 prk.141.t:0 "苏联支持我们的决定"

 prk.142.t:0 "苏联反对我们的决定"

 prk.143.t:0 "中共介入朝鲜的可能大大增加"