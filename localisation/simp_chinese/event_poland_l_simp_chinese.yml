l_simp_chinese:
 pol.2.t:0 "贝鲁特去世"
 pol.2.d:0 "波兰党政领导人波列斯瓦夫·贝鲁特在访问莫斯科期间因病去世，爱德华·奥哈布同志接替职位。"
 pol.2.a:0 "确定。"
 
 pol.3.t:0 "波兹南爆发抗议游行！"
 pol.3.d:0 "波兹南市的工人和群众发动了游行示威，抗议工人待遇的恶化和党政的腐败，我们应该如何应对？"
 pol.3.a:0 "这是反动游行，立即镇压。"
 pol.3.b:0 "应当试图和工人对话。"
 
 pol.4.t:0 "波兹南爆发抗议游行！"
 pol.4.d:0 "波兹南市的工人和群众发动了游行示威，抗议工人待遇的恶化和党政的腐败。波兰当局选择与示威者对话，我们如何应对？"
 pol.4.a:0 "由波兰政府自己处理。"
 pol.4.b:0 "这是反动游行，波兰应当立即镇压。"
 
 pol.5.t:0 "波兹南爆发抗议游行！"
 pol.5.d:0 "波兹南市的工人和群众发动了游行示威，抗议工人待遇的恶化和党政的腐败。波兰当局出动军警对游行进行了武力镇压，造成多人死亡。这一事件严重损害了波兰统一工人党政府在群众心中的威信。"
 pol.5.a:0 "悲剧。"
 
 pol.6.t:0 "来自苏联的警告！"
 
 pol.7.t:0 "波兹南爆发抗议游行！"
 pol.7.d:0 "波兹南市的工人和群众发动了游行示威，抗议工人待遇的恶化和党政的腐败。波兰与示威者谈判，同意改善工人的待遇并释放被捕的示威者。"
 pol.7.a:0 "明智的选择。"
 
 pol.9.t:0 "统一工人党第八次代表大会"
 pol.9.d:0 "去斯大林化运动和波兹南事件引起了不小的风波，奥哈布同志被迫辞去党总书记的职务。曾经被打为“右倾民族主义”的瓦迪斯瓦夫·哥穆尔卡同志已经恢复名誉。党的第八大即将召开，谁将领导波兰？"
 pol.9.a:0 "哥穆尔卡同志是正确的选择。"
 
 pol.10.t:0 "瓦迪斯瓦夫·哥穆尔卡当选波兰领导人"
 pol.10.d:0 "去斯大林化运动和波兹南事件引起了不小的风波，曾经被打为“右倾民族主义”的瓦迪斯瓦夫·哥穆尔卡被选举为波兰统一工人党领袖，以稳定局面。"
 pol.10.a:0 "哥穆尔卡同志是正确的选择。"
 
 pol.12.t:0 "爱德华·盖莱克当选波兰领导人"
 pol.12.d:0 "由于瓦迪斯瓦夫·哥穆尔卡无法解决波兰的经济问题，被迫辞职，矿工出身的爱德华·盖莱克当选波兰领导人。"
 pol.12.a:0 "哥穆尔卡同志是正确的选择。"
 
 pol.13.t:0 "约翰·保罗二世访问波兰"
 pol.13.d:0 "罗马教宗约翰·保罗二世访问了自己处于共产党统治下的故乡波兰，尽管当局尽力阻挠，当仍有数十万民众前来瞻仰教宗并聆听其弥撒。这显示出天主教在波兰仍拥有巨大影响力。"
 pol.13.a:0 " "
 
 pol.14.t:0 "群众对经济政策出现不满！"
 pol.14.d:0 "华沙、克拉科夫和各大城市爆发示威游行，表达出我们近期经济政策的强烈不满。由于外债太多，波兰遭遇了严重的通货膨胀和物价上涨，对民众的生活带来了严重困难。"
 pol.14.a:0 " "
 
 pol.16.t:0 "团结工会成立！"
 pol.16.d:0 "随着反政府运动越来越壮大，越来越多工人参与到了自由派的社会组织。电工莱赫·瓦文萨宣布创立团结工会，并迅速发展为波兰最大的工人运动团体。"
 pol.16.a:0 " "
 
 pol.18.t:0 "波兰爆发军事政变！"
 pol.18.d:0 "随着自由化运动愈发强大，波兰陷入政治动荡，波兰人民军将军雅鲁泽尔斯基宣布接管政权，实行军事管制。"
 pol.18.a:0 " "
 
 pol.20.t:0 "爆发大规模游行示威！"
 pol.20.d:0 "一场规模空前的游行示威在华沙和各大城市爆发，工人、学生等各个阶级都参与其中。"
 pol.20.a:0 " "
 
 pol.21.t:0 "波兰圆桌会议"
 pol.21.d:0 "经过数个小时的谈判，波兰圆桌会议圆满结束，波兰工人党被迫宣布结束将近四十年的统治，并承诺举行大选。波兰成为欧洲共产主义倒下的第一枚骨牌。"
 pol.21.a:0 " "
 
 pol.22.t:0 "团结工会赢得波兰大选"
 pol.22.d:0 "波兰第一次民主选举结束，莱赫·瓦文萨领导下的团结工会赢得大选。"
 pol.22.a:0 " "
 
 
 
 poltext.30.t:0 "来自苏南冲突的政治影响"
 pol.30.d:0 "随着苏联与南斯拉夫关系的不断恶化，两国之间的政治斗争不可避免地对我国产生了影响。当年内不同派系纷纷在这一问题上进行站队，以波列斯瓦夫·贝鲁特为首的亲苏派坚定的站在莫斯科一边，而以瓦迪斯瓦夫·哥穆尔卡为首的民族派则主张中立。"
 pol.30.a:0 "坚定支持斯大林同志，反对铁托主义！"
 pol.30.b:0 "反对莫斯科干涉我党的路线，保持中立。"
 
 pol.31.t:0 "波兰宣布清洗铁托分子"
 pol.31.d:0 "苏联与南斯拉夫的政治斗争蔓延到了波兰。波兰统一工人党宣布坚定支持斯大林同志在社会主义阵营中的领袖地位，批判铁托的亲西方行为，并连带清洗了瓦迪斯瓦夫·哥穆尔卡等在这一问题上态度不坚决的党员。"
 
 pol.32.t:0 "波兰宣布在苏南冲突中保持中立"
 pol.32.d:0 "苏联与南斯拉夫的政治斗争蔓延到了波兰。经过激烈的政治斗争，同情铁托一派的党员取得优势，在他们的压力下，亲苏的波列斯瓦夫·贝鲁特被迫做了自我批评，波兰统一工人党亦宣布在苏南问题中保持中立。"
 
 
 
 pol.40.t:0 "波兰全国多地爆发示威游行！"
 pol.40.d:0 "去斯大林化的风波在波兰迅速发酵！波兰多地爆发了反对共产党政府的示威游行，示威者对压抑民众多年的斯大林主义政策的不满彻底爆发，他们要求政府立刻作出政治改革！"
 
 pol.41.t:0 "示威者要求进行民主改革！"
 pol.41.d:0 "去斯大林化的风波在波兰迅速发酵！波兰多地爆发了反对共产党政府的示威游行，示威者对压抑民众多年的斯大林主义政策的不满彻底爆发，他们要求政府立刻作出政治改革！"
 
 pol.42.t:0 "示威者要求释放维钦斯基大主教！"
 pol.42.d:0 "示威者包围了华沙各地的政府部门，要求释放被捕的波兰天主教会领袖维钦斯基大主教！"
 
 pol.43.t:0 "波兰政府释放维钦斯基大主教！"
 pol.43.d:0 "示威群众的压力下，波兰共产党政府宣布释放波兰天主教会领袖维钦斯基大主教。"
 
 pol.44.t:0 "警惕波兰的反革命暴动！"
 pol.44.d:0 "反共产主义的暴动正在波兰蔓延！暴徒正在四处攻击政府机关，煽动反苏反共情绪，并试图重建亲西方的政府，而波兰政府对此束手无策。或许我们需要进行警告，迫使他们悬崖勒马。"
 
 pol.45.t:0 "来自莫斯科的警告！"
 pol.45.d:0 "莫斯科指责我们在放纵帝国主义和反共分子夺取政权，并要求我们采取强硬措施。"
 
 pol.46.t:0 "波兰无视我们的警告！"
 pol.46.d:0 "波兰领导人[POL.GetLeader]无视了我们的警告，并试图与反革命分子妥协。"
 
 pol.47.t:0 "示威者要求驱逐罗科索夫斯基！"
 pol.47.d:0 "示威者包围了华沙各地的政府部门，要求当局将具有苏联-波兰双重国籍的国防部长罗科索夫斯基元帅解除职务并驱逐出境！"
 
 pol.48.t:0 "波兰政府解除罗科索夫斯基的职务！"
 pol.48.d:0 "示威群众的压力下，波兰共产党政府宣布解除了苏联指派的国防部长罗科索夫斯基元帅的职务，并劝说其离开波兰返回苏联避嫌。"
 
 pol.49.t:0 "示威者要求恢复哥穆尔卡的职务！"
 pol.49.d:0 "示威者包围了华沙各地的政府部门，要求恢复曾经被打为反党分子的瓦迪斯瓦夫·哥穆尔卡的职位！"
 
 pol.50.t:0 "瓦迪斯瓦夫·哥穆尔卡回到波共中央！"
 pol.50.d:0 "在示威群众的压力下，波兰共产党政府宣布，撤销对瓦迪斯瓦夫·哥穆尔卡的惩罚，并邀请其回到党中央协助处理混乱的政治局势。"
 
 pol.53.t:0 "苏联宣布暂时不介入波兰问题"
 pol.53.d:0 "苏联外交部长就波兰的紧张局势发表声明，表示苏联政府不反对波兰新政府实行的一系列改革措施，尊重波兰的主权和政治独立，但同时苏联方面强调，莫斯科将持续关注波兰局势发展，以避免事态向不利于社会主义国家团结稳定的方向发展。"
 
 pol.54.t:0 "苏联入侵波兰！"
 pol.54.d:0 "来自波兰布达佩斯的紧急消息！！今天早上，驻扎在波兰境内的苏联部队突然向布达佩斯发起猛烈进攻，目前苏军前锋部队已经和支持民主政府的波兰民兵发生激烈交火。莫斯科宣称该军事行动旨在保护波兰的共产主义政府不被反革命的暴徒破坏，但波兰总理指责苏联违背国际法，以颠覆波兰民主政府为目的发起侵略战争，呼吁国际社会支持波兰人民抵抗侵略！"
 
 pol.55.t:0 "群众要求释放政治犯！"
 
 pol.56.t:0 "关注波兰局势！"
 
 pol.57.t:0 "宣布支持波兰民主运动！"
 
 pol.58.t:0 "宣布支持波兰社会主义政府！"
 
 pol.59.t:0 "关注波兰局势！"
 
 pol.60.t:0 "宣布支持波兰抵抗苏联入侵！"
 
 pol.61.t:0 "宣布支持苏联进入波兰平暴！"
 
 pol.62.t:0 "苏联军队占领华沙"
 pol.62.d:0 "经过激烈的交战后，苏联军队残酷镇压了华沙市民的抵抗，控制了这座城市，标志着波兰革命宣告失败，苏联军队开始清除城市内仍在顽强抵抗的力量，并逮捕了以哥穆尔卡为首的波兰政府领导人。"
 
 pol.80.t:0 "第五届世界青年与学生联欢节开幕"
 pol.80.d:0 "第五届世界青年与学生联欢节在波兰华沙隆重开幕，波兰统一工人党总书记波列斯瓦夫·贝鲁特宣布了大会的开幕式，一百多个国家的左派青年团体代表参与了这次大会。"
 
 pol.81.t:0 "波兰小姐选美大赛在克拉科夫开幕"
 pol.81.d:0 "波兰规模最大的选美大赛“波兰小姐”（Miss Polonia）在波兰南部城市开幕，这是一场创办于1928年的选美活动，二战爆发前已举办了6届，今年，波兰政府支持下，波兰小姐成功举办二战后的第一届选美大赛。来自波兰国立高等戏剧学院的女学生Alicja Bobrowska被选为本届大赛的“国际小姐”。这次比赛引起了国际媒体的广泛关注，他们惊讶于社会主义国家可以举办这种活动，认为这是波兰共产党新任领导人[POL.GetLeader]上任后，推动改革政策的一部分。"