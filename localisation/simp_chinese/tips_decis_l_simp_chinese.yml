l_simp_chinese:
 tops_efforts:0 "游戏解答"
 
 tops_efforts_buy_resource:0 "我要如何购买战略资源？"
 tips.1.t:0 "我要如何购买战略资源？"
 tips.1.d:0 "请点击画面左上角的生产界面，再根据你所需要的资源，选择进出口资源。"
 tips.1.a:0 "好"
 
 tops_efforts_finance:0 "我要如何获得资金？"
 tips.2.t:0 "我要如何获得资金？"
 tips.2.d:0 "本mod设计了财政经济系统，你可以通过画面左上角的生产界面，通过出口资源获得资金，或是打开消费品按钮界面，将工厂投入生产活动产生税收。工厂只有在生产物品的情况下才能提供税收。多余的资金可以转化为政治点数，而财政入不敷出将带来惩罚。"
 tips.2.a:0 "好"
 
 tops_efforts_crack:0 "为什么游戏每隔几天就会卡一下？"
 tips.3.t:0 "为什么游戏每隔几天就会卡一下？"
 tips.3.d:0 "这是由于游戏的数值计算无法承载mod新添加的系统导致的。mod所使用的生产消费，发电，粮食和财政系统都需要大量的计算，而paradox游戏的单核计算导致计算过程产生卡顿。我们将在日后的更新中尽力解决这一问题。"
 tips.3.a:0 "好"
 
 tops_efforts_comsumer:0 "新的消费品系统有什么用？"
 tips.4.t:0 "新的消费品系统有什么用？"
 tips.4.d:0 "打开游戏生产界面，在打开第三个消费品页面，您可以将民用工厂用于消费品生产。消费品满足需求后可以获得额外加成，也可以用于出口获取资金。"
 tips.4.a:0 "好"
 
 tops_efforts_foods:0 "粮食不够怎么办？"
 tips.5.t:0 "粮食不够怎么办？"
 tips.5.d:0 "粮食主要通过农场生产，部分科技和国家精神可以增加单个农场产量，或者可以通过生产界面进口粮食，或者打开省份界面，将多余粮食进入库存，然后重新分配。"
 tips.5.a:0 "好"
 
 tops_efforts_power:0 "电力不足怎么办？"
 tips.6.t:0 "电力不足怎么办？"
 tips.6.d:0 "省份电力主要通过发电站生产，部分科和政策技可以增加电力生产或消耗。省份规模越大，建筑越多，消耗的电力越多。电力生产需要煤矿和燃油，燃油不足会使得发电量减少。"
 tips.6.a:0 "好"
 
 tops_efforts_focus:0 "为什么很多国策没有内容？"
 tips.7.t:0 "为什么很多国策没有内容？"
 tips.7.d:0 "本mod的制作方案是按年代顺序进行制作，目前主要制作1947-1950年的内容，之后的内容会逐步更新。"
 tips.7.a:0 "好"
 
 tops_efforts_cores:0 "为什么我的省份没有核心？"
 tips.8.t:0 "为什么我的省份没有核心？"
 tips.8.d:0 "由于游戏本体机制限制，核心省份不会出现抵抗度，但这样就无法还原冷战时期的越共起义、拉美游击队和中国解放后的西南剿匪玩法，因此我们对游戏机制进行了修改。省份的核心是正常的，但在省份界面显示是占领区。但请放心，“无核心”只会在省份的抵抗度界面上进行字面显示，在其它功能（如外交、战后和谈等）上，省份核心功能正常使用。"
 tips.8.a:0 "好"
 
 tops_efforts_close:0 "关闭解答"