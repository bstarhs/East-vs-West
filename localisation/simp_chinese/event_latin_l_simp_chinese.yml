l_simp_chinese:

 latin.4.t:0 "共产主义游击队暴动！"
 latin.4.d:0 "一支共产党武装部队在我国农村地区发动叛乱，袭击了我们的种植园！"
 latin.4.a:0 "We have to stop them!"

 latin.8.t:0 "游击英雄"
 latin.8.d:0 "强壮的眼睛，黑色的贝雷帽和防水风衣。这是埃内斯托·切·格瓦拉，古巴革命的指挥官。这张照片是阿尔贝托·科尔达在海难遇难者葬礼上拍摄的。阿尔贝托将这张照片命名为游击队英雄，意思是勇敢的游击队英雄，他认为这张照片将成为未来革命的象征。"
 latin.8.a:0 "This is not a photo,it is a symbol."

 latin.10.t:0 "游击队暴动"
 latin.10.d:0 "共产党正在攻击我们的首都！他们在街道上与政府军交战，并围攻总统府。我们的国防军正在准备战斗。我们该怎么办？"
 latin.10.a:0 "Crash the commies!"
 latin.10.b:0 "We have to surrender."

 latin.11.t:0 "[From.GetName]宣布解放！"
 latin.11.d:0 "民族解放阵线占领了总统府，升起了革命的旗帜 [From.GetName]的独裁者倒台了！他们的总统和官僚们已经逃亡美国，一个新的民主[From.GetName] 政府即将建立！"
 latin.11.a:0 "自由 [From.GetName]万岁！!"

 latin.12.t:0 "游击队被打败"
 latin.12.d:0 "我们的国防军打败了游击队士兵，把他们从首都赶了出去，现在他们已经撤退，回到丛林里去了。经过这场战斗，游击队受到了很大的损失，他们在很长一段时间内不能发动任何进攻。"
 latin.12.a:0 "Good."

 latin.13.t:0 "游击队解散"
 latin.13.d:0 "随着共产主义在我国的衰落和军队的日益严厉的镇压，越来越多的叛军投降，共产党的游击队已趋于崩溃。"
 latin.13.a:0 "Good."

 latin.16.t:0 "镇压游击队取得胜利！"
 latin.16.d:0 "我们的武装部队成功击败游击队并摧毁了他们的营地！经过这场战斗，游击队受到了很大的损失，他们在很长一段时间内不能发动任何进攻。"
 latin.16.a:0 "Good."

 latin.17.t:0 "镇压游击队失利！"
 latin.17.d:0 "我们的武装部队在搜索并摧毁游击队时被击败，损失惨重！这一战严重削弱了我们政权的士气和威信，而游击队变得更壮大了。"
 latin.17.a:0 "真该死。"

 latin.18.t:0 "[From.GetName]爆发政变！"
 latin.18.d:0 "[From.GetName]爆发军事政变！右翼军人组织武装力量包围了首都，迫使总统交出权力，军方宣布中止宪法，并成立军事执政委员会，接管所有政治权利。"
