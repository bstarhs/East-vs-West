 mex.5.t:0 "下一任总统"
 mex.5.d:0 "墨西哥的下一任总统选举即将举行，当然，在革命制度党的绝对控制之下，我们毫无疑问能够取得大选胜利，唯一的问题，不过是由谁代表本党参与下一届的总统选举。"
 
 mex.6.t:0 "阿道夫·洛佩斯·马特奥斯赢得墨西哥大选！"
 mex.6.d:0 "革命制度党的阿道夫·洛佩斯·马特奥斯赢得墨西哥大选的多数票！阿道夫·洛佩斯·马特奥斯将就任新任墨西哥总统。阿道夫承诺将进行更多的民主和经济改革，继续保持与美国的关系。"

