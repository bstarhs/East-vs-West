 mex.100.t:0 "拉丁美洲塔在墨西哥城落成"
 mex.100.d:0 "高166的摩天大楼-拉丁美洲塔在墨西哥首都墨西哥城宣布建成，并成为墨西哥最高的建筑。拉丁美洲塔是墨西哥最大的金融公司——拉美保险的总部大楼，许多墨西哥人认为，这座建筑的落成是墨西哥走向经济繁荣的象征。"

 mex.101.t:0 "墨西哥画家弗里达·卡罗去世"
 mex.101.d:0 "来自墨西哥的消息。墨西哥的传奇女画家，弗里达·卡罗，再忍受病痛多年的折磨后，在家中与世长辞，年仅47岁。弗里达·卡罗在墨西哥艺术史上有用重要的意义，她被认为是超现实主义及魔幻现实主义的代表人物之一，她的画作融入了墨西哥原住民的文化特色，墨西哥人的文化提现的淋漓尽致。此外，弗里达·卡罗还是一名共产主义和女权主义支持者，他曾帮助遭到斯大林迫害的托洛斯基逃亡墨西哥，甚至被认为与托洛茨基发展了一段恋情。\n然而，这位艺术家却在早年遭遇了一次车祸，余生被病痛和无尽的手术折磨。弗里达·卡罗的灵魂归天之后，将被送回故乡埋葬。"

 mex.102.t:0 "墨西哥画家迭戈·里维拉去世"
 mex.102.d:0 "墨西哥著名画家迭戈·里维拉·罗德里格斯在墨西哥城去世，享年70岁。迭戈·里维拉是墨西哥著名的艺术家，掀起了墨西哥壁画复兴运动，同时，迭戈还是一位共产主义者，曾经帮助遭到斯大林迫害的托洛斯基逃亡墨西哥。迭戈还因他与小自己二十多岁的女画家弗里达·卡罗结婚而为人所知，但卡罗已在几年前英年早逝，现在，迭戈·里维拉也随她而去了。\n迭戈·里维拉的葬礼在墨西哥城的多洛雷斯公墓举行，墨西哥艺术届的许多人物出席了葬礼。墨西哥共产党因为迭戈曾经参加过共济会而将其开除出党，但也派出了代表参与葬礼。"
 
 mex.103.t:0 "《光荣的胜利》"
 mex.103.d:0 "美国政府支持下的危地马拉右翼发动政变，推翻危地马拉民选政府的行为引起拉丁美洲左派人士的愤慨。以支持共产主义闻名的墨西哥著名画家迭戈·里维拉创作了壁画《光荣的胜利》，作为他送给危地马拉军政府的礼物。"
 
 mex.104.t:0 "围攻共产艺术"
 mex.104.d:0 "数十名反共抗议者包围芝加哥艺术馆，要求撤下墨西哥画家迭戈·里维拉的壁画作品。抗议者高喊"清除共产主义艺术"，并向馆方递交联署信，指控画作"宣扬颠覆思想"。\n争议焦点是里维拉1934年创作的《底特律工业壁画》复制品，其中包含工人团结的象征性图像。抗议领袖声称："这是斯大林主义的宣传工具。"艺术馆外，举着标语的示威者与支持艺术的市民形成对峙，警方不得不设置隔离带。\n身处墨西哥的里维拉通过电话回应本社采访。这位共产主义画家笑称："看来我的画比FBI探员更擅长揭露真相。"他提议将抗议者形象加入新作，"这样未来的人会记得1950年代美国发生了什么"。"