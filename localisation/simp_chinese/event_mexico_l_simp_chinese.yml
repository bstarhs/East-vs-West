 mex.9.t:0 "阿道夫·洛佩斯·马特奥斯赢得墨西哥大选！"
 mex.9.d:0 "革命制度党的阿道夫·洛佩斯·马特奥斯赢得墨西哥大选的多数票！阿道夫·洛佩斯·马特奥斯将就任新任墨西哥总统。阿道夫承诺将进行更多的民主和经济改革，继续保持与美国的关系，同时也保持和第三世界国家的往来。"

