l_simp_chinese:
 cam.1.t:0 "柬埔寨宣布自治"
 cam.1.d:0 "法国政府宣布，将其柬埔寨保护国作为法兰西联盟保护下的自治领进行自治，以对抗日益壮大的柬埔寨独立和共产主义运动。"
 
 cam.2.t:0 "柬埔寨宣布独立"
 cam.2.d:0 "柬埔寨国王西哈努克在金边皇宫正式宣布：柬埔寨王国在经历了近百年的法国殖民统治之后，今天终于迎来了独立。他将领导柬埔寨人民，携手建立新国家。"
 cam.2.a:0 "祝贺。"
 
 cam.5.t:0 "柬埔寨共产党发起游击战"
 
 cam.6.t:0 "柬埔寨-越南边境冲突"
 cam.6.d:0 "红色高棉统治下的柬埔寨与越南爆发边境冲突，柬军入侵越南并杀死了许多居民。柬埔寨未对此事作出回应，而愤怒的越南政府宣传将采取军事手段进行报复。"
 
 cam.7.t:0 "柬埔寨共产党攻克金边"
 cam.7.d:0 "经过激烈战斗，柬埔寨共产党的武装部队攻占了首都金边。高棉共和国首脑朗诺及亲信逃亡。共产党武装在控制整座城市后，断绝了金边与外界的联系。柬共领袖波尔布特宣布成立民主柬埔寨，并准备在这个国家实行完全的共产主义改造。"
 
 cam.8.t:0 "越南入侵柬埔寨！"
 cam.8.d:0 "越南军队于今天对柬埔寨发起进攻！越南政府宣称这是为了报复红色高棉政府不断侵犯湄公河三角洲而作出的自卫行动。"
 
 cam.9.t:0 "越南军队攻占金边"
 cam.9.d:0 "经过激烈战斗，越南人民军宣布完全控制柬埔寨首都金边，越南当局宣称将会与新成立的柬埔寨人民党合作，建立一个新的社会主义柬埔寨政府。与此同时，红色高棉仍在柬埔寨西部抵抗越南军队。"
 
 cam.10.t:0 "柬埔寨抵抗阵线成立"
 
 cam.11.t:0 "朗诺发动政变！"
 
 cam.12.t:0 "柬埔寨爆发政变！"
 
 cam.13.t:0 "三洛发生农民暴动！"
 
 cam.14.t:0 "柬埔寨与越南爆发边境冲突！"
 cam.14.d:0 "柬埔寨与越南共和国爆发边境冲突！双方军队在柬埔寨东部的鹦鹉嘴地区爆发激烈交火！"
 
 cam.15.t:0 "越南共和国军队击溃柬埔寨军队"
 
 cam.16.t:0 "柬埔寨军队击溃越南共和国军队"
 
 cam.17.t:0 "美国轰炸柬埔寨"
 
 cam.50.t:0 "山玉成退出柬埔寨政府！"
 cam.50.d:0 "柬埔寨民族主义政治家山玉成与柬埔寨现政府的矛盾彻底破裂！山玉成辞去了所有政府职务，并指责柬埔寨现政府向共产主义势力妥协，使柬埔寨面临赤化的危险！"
 
 cam.51.t:0 "警惕不断接近赤色势力的柬埔寨"
 cam.51.d:0 "柬埔寨遭到了共产势力的渗透，柬埔寨现政府与共产党勾结，为越共的地下活动提供协助，这是我们绝对不能容忍的！我们也要开始支持柬埔寨国内的反共势力，协助他们对抗共产主义，并在必要时候协助他们夺取柬埔寨政权，建立一个亲西贡的反共政府。"
 
 cam.52.t:0 "自由高棉武装组织成立！"
 cam.52.d:0 "柬埔寨民族主义政治家山玉成与柬埔寨现政府的矛盾彻底破裂！山玉成在泰国右翼政府支持下，前往柬埔寨西北部的暹粒地区成立自由高棉武装组织，发起武装叛乱！"
 
 cam.53.t:0 "自由高棉瓦解！"
 cam.53.d:0 "自由高棉武装组织在柬埔寨政府军打击下瓦解，其成员大部分被迫投降，山玉成流亡泰国。"
 
 cam.54.t:0 "自由高棉向新政府缴械"
 cam.54.d:0 "随着柬埔寨成立新的政权，自由高棉领导人山玉成宣布停止武装暴动，并率领部队归顺新政府。"
 
 cam.55.t:0 "人民社会同盟的成立"
 cam.55.d:0 "柬埔寨的前国王诺罗敦·西哈努克亲王宣布成立一个名为人民社会同盟的的政党，以参加柬埔寨独立后的政治运动和国会选举。国王放弃王位，并创立政党竞选首相，这似乎闻所未闻，但西哈努克利用自己的威望和身份获得了巨大的支持。"
 
 cam.56.t:0 "柬埔寨国会大选"
 cam.56.d:0 "西哈努克亲王领导下的人民社会同盟赢得柬埔寨国会大选。在160万张选票中，仅409票没有投给人民社会同盟，最终人民社会同盟赢得国民议会的所有61个席位。"
 
 cam.57.t:0 "西哈努克访问北京"
 cam.57.d:0 "柬埔寨领导人诺罗敦·西哈努克亲王访问中华人民共和国，并于今日早晨抵达北京机场。毛泽东与周恩来率领代表团进行了热烈的欢迎仪式。"
 
 
 cam.59.t:0 "柬埔寨军人正计划发起政变！"
 cam.59.d:0 "尊敬的阁下：\n西哈努克亲王的一系列亲共政策令我们担忧，他的行为将使得柬埔寨沦为北京和河内的傀儡。我们仅代表柬埔寨军队中的反共势力寻求贵国的帮助，请贵国给予我们军事和请报上的支持，推翻西哈努克，以避免柬埔寨沦入共产党手中。"
 
 cam.60.t:0 "柬埔寨正处于政变阴谋当中！"
 cam.60.d:0 "金边大使馆致信：\n我国驻柬埔寨的情报人员发现柬埔寨军队中的右翼势力正试图发动军事政变，推翻西哈努克亲王并建立亲美政府。"
 
 cam.61.t:0 "来自[FROM.GetName]的警告！"
 cam.61.d:0 "驻[FROM.GetName]金边大使馆致信阁下：\n我国驻柬埔寨的情报人员发现柬埔寨军队中的右翼势力正试图发动军事政变，推翻西哈努克亲王并建立亲美政府，请柬埔寨政府尽快采取措施制止政变！"
 
 cam.62.t:0 "柬埔寨政府挫败政变阴谋！"
 cam.62.d:0 "金边消息！\n\n柬埔寨军方宣布他们挫败了一场未遂的军事政变！一帮亲西方的柬埔寨军人被贿赂，试图推翻西哈努克亲王，以反对其亲近共产主义的政策。\n然而政变阴谋意外泄露，西哈努克果断采取行动，逮捕了这些图谋叛乱的军官，军警将叛乱头目五花大绑压上卡车，送往金边郊外的监狱等待审讯。\n\n柬埔寨政府强烈谴责西方国家勾结右翼军人发动政变，指责美国主导下的东南亚条约组织干涉柬埔寨内政！"
 
 cam.63.t:0 "柬埔寨军方发起政变！"
 cam.63.d:0 "来自金边的紧急消息！达春率领的柬埔寨军队突然进入金边，控制了皇宫、国会大楼、广播电台等地，并与忠于西哈努克亲王的卫队发生交火！。"
 
 cam.64.t:0 "柬埔寨军方发动政变！"
 cam.64.d:0 "来自金边的紧急消息！今天柬埔寨军队突然进入金边，控制了皇宫、国会大楼、广播电台等地，并与忠于西哈努克亲王的卫队发生交火！西哈努克在卫队保护下撤往机场并飞往北京。柬埔寨军方领导人达春宣布，西哈努克亲王实行独裁统治，容纳共产分子，将柬埔寨陷入危险之中，现军方宣布废黜西哈努克的国家元首地位，建立军事革命政府。"
 
 cam.65.t:0 "柬埔寨皇宫遭到炸弹袭击！"
 cam.65.d:0 "柬埔寨皇宫遭到炸弹袭击！"
 
 cam.71.t:0 "法国留学生归国"
 cam.71.d:0 "咸涩的海风翻动着毕业证书的边角。年轻的柬埔寨留学生，沙洛特绍，最后看了一眼生活六年的法兰西，将导师临别赠送的工程手册塞进行李箱夹层。那本被翻烂的《计算机信息工程》里，还夹着勤工俭学时记下的每一笔伙食费账单。\n金边的阳光比记忆中更加灼热。风尘仆仆的沙洛特绍回到寓所，此时他的姐姐，柬埔寨王妃沙洛恩已为他准备了丰盛的晚宴。洗漱过后，沙洛特绍坐在桌子前，大口大口喝着高棉海鲜汤，一边向家人介绍自己的法兰西岁月。\n晚宴过后，沙洛恩准备利用自己的人脉，将弟弟引荐给柬埔寨工业部，并最好能够引荐给西哈努克国王，在国王大力发展柬埔寨现代化建设的计划中，像沙洛特绍这样的技术人才是不可缺少的。"
 cam.71.a:0 "年轻人，柬埔寨的未来靠你了。"