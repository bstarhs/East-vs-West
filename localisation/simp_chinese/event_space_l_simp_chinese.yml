l_simp_chinese:
 space.1.t:0 "准备发射运载火箭！"
 space.1.d:0 "我们即将进行运载火箭发射，这不需要消耗宇航员，目前我们的综合航天能力为[?space_power]，而发射运载火箭应当需要60能力。是否发射？"
 space.1.a:0 "点火。"
 space.1.b:0 "再等一下。"

 space.2.t:0 "火箭发射成功！"
 space.2.d:0 "我们成功将运载火箭送入大气层，这意味着将人造物送入太空将不再遥远！"
 space.2.a:0 "太棒了！"

 space.3.t:0 "发射失败！"
 space.3.d:0 "我们的航天器在进入大气层时发生爆炸，火箭碎片从高空坠下。"
 space.3.a:0 "真倒霉。"
 
 space.4.t:0 "准备发射人造卫星！"
 space.4.d:0 "我们即将进行人造卫星发射，这不需要消耗宇航员，目前我们的综合航天能力为[?space_power]，而发射人造卫星应当需要90能力。是否发射？"
 space.4.a:0 "点火。"
 space.4.b:0 "再等一下。"

 space.5.t:0 "火箭发射成功！"
 space.5.d:0 "我们成功将人造卫星送入大气层，这意味着太空时代已经来临！"
 space.5.a:0 "太棒了！"

 space.6.t:0 "[ROOT.GetName]首先完成人造卫星！"
 space.6.d:0 "[ROOT.GetName]首先将人造卫星成功发射升空，这意味着太空时代已经来临！"
 space.6.a:0 "太棒了！"

 space.7.t:0 "准备发射太空狗！"
 space.7.d:0 "我们即将进行太空狗发射，这不需要消耗宇航员，目前我们的综合航天能力为[?space_power]，而发射发射应当需要180能力。是否发射？"

 space.8.t:0 "太空狗实验舱发射成功！"
 space.8.d:0 "我们成功将一只太空狗送入绕地轨道，这意味着人类距离翱翔太空已经不远！"
 space.8.a:0 "太棒了！"

 space.9.t:0 "[ROOT.GetName]首先将动物送入太空！"
 space.9.d:0 "[ROOT.GetName]政府宣布，该国成功将一只名为莱卡太空狗送入绕地轨道，尽管莱卡在卫星落地时不幸死于高温，但这仍然是一次巨大的成功，这意味着人类距离翱翔太空已经不远！"
 space.9.a:0 "太棒了！"

 space.10.t:0 "准备进行载人航天！"
 space.10.d:0 "我们即将将宇航员送入绕地轨道进行航天飞行，这需要1名宇航员进行载人航天，目前我们的综合航天能力为[?space_power]，而载人航天应当需要200能力。是否发射？"

 space.11.t:0 "航天员进入轨道！"
 space.11.d:0 "我们成功将宇航员送入绕地轨道，并使其安全返回地面，这将是我国第一位冲出地球进入宇宙的征服者！"
 space.11.a:0 "太棒了！"

 space.12.t:0 "[ROOT.GetName]首先将航天员送入太空！"
 space.12.d:0 "[ROOT.GetName]首先将成功将航天员送入绕地轨道，并使其安全返回地面，这意味着人类已经冲出地球，走向宇宙！太空时代来临了！\n作为第一名征服太空的人，这名[ROOT.GetName]宇航员被视为全人类的英雄，他不仅得到了本国政府的款待，并将代表本国出访巡游世界各地。"
 space.12.a:0 "太棒了！"

 space.13.t:0 "准备发射通讯卫星！"
 space.13.d:0 "我们即将发射一枚通讯卫星，这不需要消耗宇航员，目前我们的综合航天能力为[?space_power]，而通讯卫星应当需要80能力。是否发射？"

 space.14.t:0 "成功发射通讯卫星！"
 space.14.d:0 "我们成功将通讯卫星！这枚卫星将向地球发送广播频率，以向全世界传播我们的声音！"
 space.14.a:0 "太棒了！"

 space.15.t:0 "[ROOT.GetName]成功发射通讯卫星！"
 space.15.d:0 "[ROOT.GetName]首先成功将通讯卫星！这枚卫星将向地球发送广播频率，以向全世界传播[ROOT.GetName]领导人的声音！"
 space.15.a:0 "太棒了！"

 space.16.t:0 "准备进行登月任务！"
 space.16.d:0 "我们即将进行一次伟大的登月任务，派遣宇航员乘坐火箭飞向月球并登陆。这需要3名宇航员执行任务。目前我们的综合航天能力为[?space_power]，而登月应当需要320能力。是否发射？"

 space.17.t:0 "宇航员成功登陆月球！"
 space.17.d:0 "这是一个人的一小步，也是人类的一大步。\n在全世界的瞩目下，[ROOT.GetName]的宇航员驾驶登月舱缓缓降落在月球表面，随后，宇航员从太空舱内走出，在月球上留下了第一个人类的脚印。这是人类历史上最伟大的时刻之一，标志着人类的脚步走出了地球，走向了太空。"
 space.17.a:0 "太棒了！"

 space.18.t:0 "准备发射太空站"
 space.18.d:0 "我们即将发射太空站的第一个组件。这需要3名宇航员执行任务。目前我们的综合航天能力为[?space_power]，而登月应当需要300能力。是否发射？"

 space.19.t:0 "[ROOT.GetName]开始建造空间站"
 space.19.d:0 "[ROOT.GetName]成功发射了其第一个宇宙空间站的部件并组装，由此完成了这一人类走向太空的第一个基地。未来将会有更多的宇航员进入该空间站进行科学实验工作。"
 space.19.a:0 "太棒了！"

 space.20.t:0 "准备发射火星探测器"
 space.20.d:0 "我们即将发射火星探测器。目前我们的综合航天能力为[?space_power]，而登月应当需要180能力。是否发射？"

 space.21.t:0 "[ROOT.GetName]成功发射火星探测器"
 space.21.d:0 "[ROOT.GetName]成功向火星发射了一枚探测器，他将拍摄火星的表面照片并发送回地面，为世人展示这个太阳星邻居的神秘面纱。"
 space.21.a:0 "太棒了！"

 space.22.t:0 "准备发射间谍卫星！"
 space.22.d:0 "我们即将发射一枚间谍卫星，这不需要消耗宇航员，目前我们的综合航天能力为[?space_power]，而通讯卫星应当需要80能力。是否发射？"

 space.23.t:0 "成功发射间谍卫星！"
 space.23.d:0 "我们成功将间谍卫星！这枚卫星利用遥感摄像机拍摄卫星图像，并传输回我们的航天基地！"
 space.23.a:0 "太棒了！"
 spy_Satellite_modifiers:0 "间谍卫星"

 space.24.t:0 "[ROOT.GetName]成功发射间谍卫星！"
 space.24.d:0 "[ROOT.GetName]首先成功将间谍卫星！这枚卫星利用遥感摄像机拍摄卫星图像，并传输回[ROOT.GetName]的航天基地！"
 space.24.a:0 "太棒了！"

 space.50.t:0 "国际地球物理年"
 space.50.d:0 "国际科学联合会正式提议，将1957年和1958年设立为第一个国际地球物理年，以鼓励世界各国在地球和地外探索事业上的发展与合作。在此前，国际科学联合会已先后在1882年、1932年开展了国际极地年活动，以鼓励探索地球未被探索区域，而现在，随着人类在火箭、雷达和计算机上取得进步，联合会希望能够将人类的探索范围，扩大到地球以外的无限银河。"
 space50_tool:0 "在1957年和1958年间完成的太空任务将获得更多奖励\n太空时代已开始，请积极发展太空探索任务！"

 space.51.t:0 "苏联成功发射斯普特尼克一号卫星！"
 space.51.d:0 "哔——哔——哔——\n随着R7火箭在苏联的大地上腾空而起，人类历史上划时代的一刻到来。火箭携带着人类历史上第一颗人造卫星飞上天空。在穿过大气层后，火箭抵达外层空间，被命名为斯普特尼克一号的卫星脱离火箭，进入绕地轨道，开始工作。斯普特尼克一号将每隔一段时间向地球发射地磁讯号，宣告苏联和他的共产主义政府，翻开了人类，乃至这颗星球数十亿岁月中的新一页。\n哔——哔——哔——"

 space.52.t:0 "头条新闻——俄国卫星已飞到我们头顶！"
 space.52.d:0 "《纽约时报》、《时代周刊》以头条新闻报道了斯普特尼克一号卫星飞上太空的新闻。毫无疑问，这个对于苏联来说只是小小科研成果的铁球，给西方世界带来了极大的震撼！\n我们曾经以为共产主义离我们非常遥远，而现在，他们就在我们头上的天空飞行！《纽约时报》以惊慌失措的口吻报道了这一消息，而《华盛顿邮报》惊呼：我们头上的天空变红了！这会是美国人自由生活变红的第一步吗？\n美国民众对俄国卫星一事持恐慌态度。毫无疑问，美国人曾经坚定而自豪的相信，美国永远会在科技及社会发展中保持领先地位，但现在这一幻想被共产主义俄国打破。\n我们会成为落后国家吗？"

 space.53.t:0 "斯普特尼克一号的消息席卷欧洲"
 space.53.d:0 "你好，这里是BBC晚间新闻，我们为您带来一条紧急消息：俄国人发射了一颗人造卫星，目前它已进入太空……\nBBC晚间新闻紧急插播了斯普特尼克一号飞向太空的信息，而在布鲁塞尔，八十万份有关斯普特尼克一号的新闻被抢购一空。在意大利，意大利共产党将一个斯普特尼克一号的模型摆在汽车上，作为竞选的宣传手段……\n苏联取得的科技成果，震惊了曾将俄国人及共产主义，视为野蛮落后的西欧国家，大街小巷都在谈论着，苏联的科技发展如此之快，会为欧洲带来什么影响？\n英国首相[ENG.GetLeader]在接受记者采访时，满头大汗地表示，苏联的技术进步只是一时的……"

 space.54.t:0 "愤怒与失望挤满了美国国会"
 space.54.d:0 "今天上午，美国国会参议院举行了斯普特尼克一号升空后的第一次会议。国会大厅内的议员们满脸的愤怒、失望、不甘，他们愤怒地指责美国政府在科技发展，尤其是太空探索上落后于人，将我们头顶上的天空拱手让给了共产主义者。\n参议员林登·约翰逊认为，美国此时正面临着史无前例的政治危机。苏联已经用科技发展，证明他们的共产极权主义体制有更大的优势，如果我们不能在太空竞赛上扳回一局，美国的民众将彻底对我国的民主制度失去信心！"

 space.55.t:0 "来自五角大楼的警告"
 space.55.d:0 "五角大楼今日就苏俄卫星升空一事，召开紧急会议，曾经不可一世的将军们此时垂头丧气，低着脑袋。\n战略空军指挥官托马斯·鲍尔将军咆哮道：这是美国在军事和政治上的全面失败！试想一下，如果俄国人能通过火箭把卫星送上太空，那他们也就有能力，把原子弹用火箭送到美国的每一个角落！这是事关美利坚合众国生死存亡的重大威胁！\n总统先生，我要求你现在，立刻，马上投入更多资源，加快我们的火箭开发计划！"

 space.56.t:0 "卫星升天——社会主义的伟大胜利！"
 space.56.d:0 "就在西方国家的媒体和政府为斯普特尼克一号升空一事惊慌失措的同时，在铁幕另一边的共产主义世界，各国媒体纷纷用头条报道此事。毫无疑问，斯普特尼克一号不仅让苏联青史留名，也让他的共产主义盟友大大增加了信心。苏联人证明了社会主义制度对比西方国家更有优越性，证明了共产党政府能够取得成就。"

 space.57.t:0 "美国成功发射探索者一号卫星！"
 space.57.d:0 "美国成功从佛罗里达州的卡纳韦克角航天中心发射了一支朱诺一号火箭，火箭携带者美国的第一颗人造卫星探索者一号飞入太空。尽管相比苏联的斯普特尼克一号晚了一段时间，但他依然意味着美国也进入了航天时代。"

 space.60.t:0 "苏联宇航员进入太空！"
 space.60.d:0 "阿拉木图消息！！！！\n今日上午9时07分（莫斯科时间），苏联宇航员乘坐"东方1号"飞船从拜科努尔航天发射场升空，在距地球表面301公里的轨道上环绕飞行108分钟后安全返回，成为人类历史上首位进入太空的宇航员。\n这次代号为"黎明"的任务完美执行，飞船最高时速达27400公里。地面控制中心收到宇航员从太空发回的第一句话："地球是蓝色的，真美！"着陆地点萨拉托夫州的集体农庄女工，成为第一批目睹英雄归来的见证者。\n成功落地的尤里·加加林将进行详细的身体状况检查，带状况恢复之后，等待他的将是全人类的瞩目和无尽的荣耀！"
 space.60.a:0 "光荣啊！伟大的领路人！"

 space.61.t:0 "尤里·加加林胜利归来！"
 space.61.d:0 "在完成人类首次太空飞行两天后，航天英雄今日在克里姆林宫受到最高规格礼遇。[SOV.GetLeader]设国宴庆祝这一历史性成就，宴会厅水晶吊灯下，太空英雄胸前的"苏联英雄"金星勋章熠熠生辉。\n在祝酒词中，[SOV.GetLeader]将此次飞行称为"社会主义制度的胜利"，并暗示将有更多太空计划。\n克里姆林宫随即宣布将4月12日定为"宇航节"。联合国秘书长发来贺电，称这是"全人类的伟大飞跃"。在纽约时报广场，美苏两国记者罕见地共同举杯庆祝。"

 space.62.t:0 "美国政府陷入怒火"
 space.62.d:0 "苏联成功将人类送入太空的消息传来，美国政界一片哗然。多位国会议员今日紧急召开记者会，猛烈抨击政府在太空竞赛中"不可接受的失败"。\n参议院军事委员会主席挥舞着《华盛顿邮报》头版怒吼："当克里姆林宫在庆祝时，我们的火箭还在发射台爆炸！"反对党领袖出示解密文件，显示美国宇航局去年就预警可能落后，但政府削减了预算。五角大楼外，抗议者高举"我们要太空领导权"的标语牌。\n总统紧急召集科技顾问闭门磋商。白宫发言人虽承诺"将在十年内实现反超"，但未能平息批评。"
 
 
 space.70.t:0 "准备发射月球探测器"
 space.70.d:0 "我们即将发射月球探测器。目前我们的综合航天能力为[?space_power]，而登月应当需要120能力。是否发射？"

 space.71.t:0 "[ROOT.GetName]成功发射月球探测器"
 space.71.d:0 "[ROOT.GetName]成功向月球发射了一枚探测器，他将收集月球的信息并发送回地面，为世人展示这个邻居的神秘面纱。"
 space.71.a:0 "太棒了！"

 space.72.t:0 "[ROOT.GetName]成功发射首枚月球探索卫星！"
 space.72.d:0 "[ROOT.GetName]成功发射了人类历史上第一枚月球探索卫星！"

 space.73.t:0 "人类首次进行五十万公里外的通信！"
 space.73.d:0 "[ROOT.GetName]发射的月球探测卫星即将近抵月面时，像地球基地发射了其探索到的月球数据。这是人类首次接收到来自地球五十万公里外的信息！"

 space.74.t:0 "首次对月球进行空间探索"
 space.74.d:0 "[ROOT.GetName]发射的人造卫星首次对月球外围的空间进行探测，并证明了月球没有磁场。"

 space.75.t:0 "首个人造彗星！"

 space.76.t:0 "首次对月球进行拍摄！"

 space.77.t:0 "首次拍到月球背面！"

 space.78.t:0 "月球探测器停止运作"