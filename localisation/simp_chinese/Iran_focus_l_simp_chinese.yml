l_simp_chinese:
 PER_neoliberal:0 "尝试市场经济"
 PER_neoliberal_desc:0 "新自由主义者主张减少政府的行政干预，让市场自由运行从而刺激经济增长。政府的腐败、政治混乱和官僚主义使得他们无法有效管理经济，因此让市场无形的大手来促进经济系统自我调节才是最好的办法。政府干预越少，经济运行越好。"
 PER_currency_reform:0 "货币改革"
 PER_reduce_tax:0 "税收改革"
 PER_companies_personalized:0 "企业私有化"
 PER_close_factories:0 "关闭亏损国企"
 PER_reduce_welfare:0 "削减福利"
 PER_reduce_cost:0 "削减行政支出"
 PER_develop_finacial:0 "发展金融业"
 PER_reduce_manage:0 "减少政府管理"
 PER_reduce_manage_desc:0 "政府应该放松监管，把自由贸易作为市场经济的长期政策，以促进经济增长，形成有效的竞争机制。"
 PER_market:0 "扩大市场的大手"
 PER_market_desc:0 "既然市场能够比行政机构更好地运营经济，那我们就应该将经济完全交给市场和市场参与者自由运营，一个完全没有行政干涉的经济体制无疑是最健康，最完美的。"
 PER_strike_union:0 "打击工会"
 
 
 
 PER_pro_shiaism:0 "尊崇什叶派"
 PER_pro_shiaism_desc:0 "什叶派是伊斯兰教的第二大分支，也是伊朗影响力最大的伊斯兰教教派，在萨法维开国君主伊斯马仪一世命令下，成为波斯的国教。在之后的萨法维王朝历代统治者努力下，什叶派的教义与波斯的政治制度和社会文化高度融合，已经成为了伊朗民族意识形态的一部分。"
 PER_great_imam:0 "伊玛目马赫迪的回归"
 PER_great_imam_desc:0 "什叶派信徒尊崇十二伊玛目，并坚信最后一位伊玛目、隐居的马赫迪将在真主认为时机正确的时候，回到人间，带领穆斯林战胜邪恶。"
 PER_jafarri_faction:0 "尊崇伊玛目贾法里"
 PER_jafarri_faction_desc:0 "伊玛目贾法里是十二伊玛目中的第五位，是一位同时受到什叶派和逊尼派尊崇的优秀法学家。波斯阿夫沙里王朝的建立者、征服者纳迪尔沙曾主张将对贾法里的崇拜定为国教，以缓和帝国各民族和各教派之间的矛盾。"
 
 PER_dealing_after_war:0 "整治战后问题"
 PER_dealing_after_war_desc:0 "很少人知道其实伊朗曾是第二次世界大战的战场之一，英国与苏联的联合入侵和占领给这个国家带来了严重的破坏和深远的影响。我们需要先处理这些遗留问题，才能解决国内外的其他难题。"
 PER_supress_azerbaijan:0 "镇压阿塞拜疆叛乱"
 PER_supress_azerbaijan_desc:0 "苏联侵占我国北部之后，支持阿塞拜疆共产主义分子建立了所谓的阿塞拜疆人民政府，试图赤化并吞并我们的国土。我们必须采取行动镇压叛乱，夺回南阿塞拜疆！"
 PER_expel_us_troops:0 "驱逐外国驻军"
 PER_expel_us_troops_desc:0 "著名爱国歌曲《哎！伊朗》宣泄了我们的人民不满外国驻军霸占伊朗国土、干涉我国内政的愤怒，我们必须尽快统治英、美、法、苏政府，既然战争已经结束，那就请外国军队离开伊朗！"
 
 PER_modernized:0 "走向现代化"
 PER_modernized_desc:0 "古老的伊朗依然存在许多落后的封建习俗，阻挠着我国走向富强和复兴，我们如果要拥有抵抗列强入侵的能力，必须实现国家的现代化。"
 PER_abolish_slaves:0 "废除农奴制"
 PER_abolish_slaves_desc:0 "伊朗的绝大部分农业人口为佃农，他们被束缚在土地上。在实行土地改革后，就要废除佃农制度，使得佃农获得人身自由和经济自由，成为自由劳动力。"
 PER_basic_election:0 "基本选举权"
 PER_basic_election_desc:0 "选举是政治现代化的重要一步，人民将拥有选举官员的能力，从而结束世袭官员带来的腐败与低效。"
 PER_social_reform:0 "社会改革"
 PER_social_reform_desc:0 "我们不仅要让伊朗实现政治经济和军事现代化，我们的社会也要走向现代化。我们将摒弃伊斯兰教带来的愚昧生活方式，鼓励我们的人民接受世俗的、开化的、文明的生活。"
 PER_civil_indus_1:0 "发展民用工业 I"
 PER_civil_indus_1_desc:0 "在具备初步工业能力后，我们需要满足我们人民对生活消费品的需求。从纺织、食品、木制品和锅碗瓢盆开始。"
 PER_civil_indus_2:0 "发展民用工业 II"
 PER_civil_indus_2_desc:0 "在具备进一步工业能力后，我们需要满足国家经济发展建设对工业品的需求，例如简单的工业设备和水泥、金属、化工等。"
 PER_civil_indus_3:0 "发展民用工业 III"
 PER_civil_indus_3_desc:0 "在具备较为完善的工业能力后，我们需要满足国家经济发展建设对高级工业品和消费品的需求，无论是群众需要的家电、汽车，还是生产建设需要的大型机械和精密设备。"
 PER_military_indus_2:0 "发展军事工业 II"
 PER_military_indus_2_desc:0 "在实现轻武器的国产后，我们需要进一步扩张我国的军工产能，实现装甲车辆和飞机的国产化，以保证先进武器装备的自给率。"
 PER_military_indus_3:0 "发展军事工业 III"
 PER_military_indus_3_desc:0 "新时代的武器装备更复杂、多样化且昂贵，唯有进一步扩张我国的军工复合体，才能腾出足以敷用的产能奋起直追。"
 
 PER_strike_islam:0 "打压伊斯兰教团体"
 PER_strike_islam_desc:0 "一些敌视现代化政策的穆斯林头头组成了许多非法的政治团体，煽动反政府活动，我们将采取强硬措施镇压。"
 PER_female_affair:0 "设立女性事务部"
 PER_female_affair_desc:0 "为了更好地实行有关妇女问题的改革，我们将成立一个部门，专门负责推动及监督妇女权利改革的实施，并提供建议。"
 PER_female_vote:0 "基于妇女选举权"
 PER_female_vote_desc:0 "给予妇女选举权是实现平等，推动社会现代化的重要里程碑，当妇女掌握选票时，也就掌握了自己的命运。"
 PER_anti_commie:0 "反共产主义"
 PER_soviet_trade:0 "与苏联开放边界"
 PER_soviet_trade_desc:0 "随着与苏联关系的改善，我们可以开发呼罗珊省与苏联的边界，从而促进两国贸易往来，此外呼罗珊首府马什哈德是重要的伊斯兰教什叶派圣地，来自苏联穆斯林的朝圣可以推动当地经济发展。"
 PER_agriculture_tech_focus:0 "发展农业技术"
 PER_agriculture_tech_focus_desc:0 "伊朗的高原地形意味着我国不适合粗放式的农业政策，应当重点发展农业科技，提高单位产量。"
 
 PER_docks:0 "发展造船业"
 PER_labour_welfare:0 "改善劳工待遇"
 PER_labour_welfare_desc:0 "通过提高工资、设立失业和工伤保险、制定劳动法律的形式保护和改善工人的利益，让工人支持我们的政府。"
 PER_welfare_system:0 "改善福利制度"
 PER_medical:0 "发展医疗设施"
 
 PER_construct_corps:0 "成立建设军团"
 PER_construct_corps_desc:0 "建设军团是礼萨·巴列维沙阿白色革命的一部分，通过选拔优秀的技术人员组成，并派遣他们前往农村和贫困落后地区，帮助当地发展。"
 PER_fair_comittee:0 "公平议事厅"
 PER_fair_comittee_desc:0 "公平议事厅是礼萨·巴列维沙阿白色革命的一部分，他取代了伊朗传统的依赖伊斯兰教乌里玛（学者）来审判社会案件的习俗，并由专业的法律学者和官僚来组成法庭，调节人民矛盾。"
 PER_strike_corropt:0 "打击腐败"
 PER_strike_corropt_desc:0 "经济的迅速发展催生了腐败，一些官员尸位素餐、收取贿赂、盗窃国家财产，我们必须采取强硬手段整治贪腐，来保护经济建设的成果。"
 
 PER_bureau_law:0 "公務員改革"
 PER_bureau_law_desc:0 "直到今天，伊朗依旧有许多地区采取中世纪遗留下的分封式乃至世袭制的官员任命制度，我们需要把现代化的行政官僚体系推广到国家所有地区，选拔能力出众而又勤劳的知识分子出任官员。"
 PER_expanded_cabinet:0 "扩大议会与内阁权力"
 PER_expanded_cabinet_desc:0 "随着国家的现代化进程取得成功，政治现代化也将提上议程。伊朗沙阿“万王之王”的地位应当走入历史了，我们即将实行立宪制改革，扩大议会和内阁的权力。"
 PER_monarchs_constitiu:0 "尝试君主立宪"
 PER_monarchs_constitiu_desc:0 "君主立宪制度的条件已经成熟，新的宪法将使沙阿向议会和政府移交更多权力。"
 PER_shah_reitre:0 "沙阿退居幕后"
 PER_shah_reitre_desc:0 "伊朗的现代化改革已经接近尾声，巴列维国王的历史使命已圆满完成，议会和内阁将完全接管国家政治权力，沙阿将回到王宫，成为礼仪性国家元首。"
 
 PER_monarchism_law:0 "冒犯君主法"
 PER_monarchism_law_desc:0 "谁敢对伟大的万王之王口出狂言，沙阿会公正地让冒犯者的身体摆脱其愚蠢脑袋的束缚。"
 PER_reneval_farsi:0 "波斯文化复兴"
 PER_reneval_farsi_desc:0 "伊朗是世界上历史最悠久的国家，埃兰文明是世界上最早的城市定居者，阿契美尼德王朝是世界上第一个横跨三个大洲的帝国，即使在伊斯兰化以后，我们的民族依然坚持自己的语言，自己的传统和自己的爱国主义……伊朗民族已经走出了黑暗时代，我们将在未来重新向世界展示自己的辉煌。"
 PER_change_script:0 "变革文字"
 PER_change_script_desc:0 "土耳其的凯末尔改革给我们提供了宝贵经验，土耳其人将文字从阿拉伯文改成拉丁文字，不仅有利于扫盲，有利于建立民族认同，更有利于打击伊斯兰教保守派的影响。我们应当向土耳其学习，将波斯文从阿拉伯字母修改为拉丁字母。当然，我们不再需要失传的楔形文字和晦涩难懂的巴列维文了。"
 PER_royal_calender:0 "波斯历法"
 PER_royal_calender_desc:0 "受到伊斯兰教影响，伊朗人习惯上依然使用伊斯兰历，以公元622年穆罕默德抵达麦地那为元年。这显然不适合我们压制伊斯兰教、复兴波斯荣光的政策，因此我们将采用新的波斯立法，这一立法出自拜火教典籍《阿维斯陀》，以公元前568年为元年，即琐罗亚斯德获得光明之神阿胡拉·马兹达启示的那一年。"
 PER_Rastakhiz_Party:0 "伊朗复兴党"
 PER_Rastakhiz_Party_desc:0 "伊朗现在有许多正当存在，有民族主义的伊朗民族阵线，有左翼的人民党，但他们都不支持沙阿陛下的政策，且争权夺利。沙阿主张废除所有浪费国家力量的党派，成立伊朗复兴党，并使其成为伊朗的统治党派。复兴党将忠实地支持沙阿的一切政策，从而帮助沙阿实现对伊朗政局的完全控制。"
 PER_ban_bazar:0 "整顿市场"
 PER_ban_bazar_desc:0 "伊朗目前的经济成分十分复杂，存在着大量私有企业、大财团和中产阶级小企业，沙阿希望将这些企业全部整合到国家的控制之下，让不论规模和类型，所有企业都成为沙阿经济政策的协助者。"
 PER_royal_Bonyads:0 "皇家基金会"
 PER_royal_Bonyads_desc:0 "皇家基金会是巴列维政府成立的一个经济垄断组织，沙阿要求所有大型企业都加入其中，并贡献将近40%的利润。基金会的收入一部分进入沙阿的口袋，一部分被沙阿奖赏给积极支持沙阿政策的企业。"
 
 PER_infra:0 "发展基础设施"
 PER_infra_desc:0 "伊朗高原地形复杂，多山地，各大省份之间难以沟通，使得伊朗自古以来就难以实行中央集权。这一情况需要进行改变。汽车和火车将会链接各大城市，促进经济发展和强化德黑兰对各地的控制。"
 PER_east_railway:0 "建设东部铁路"
 PER_east_railway_desc:0 "通过铁路来将呼罗珊、克尔曼、锡斯坦和霍尔木兹与首都连接起来，以发展经济，强化中央集权。"
 PER_west_railway:0 "建设西部铁路"
 PER_west_railway_desc:0 "通过铁路来将大不里士、克尔曼沙阿和胡齐斯坦与首都连接起来，以发展经济，强化中央集权。"
 PER_tourism_focus:0 "发展旅游业"
 PER_tourism_focus_desc:0 "华丽的德黑兰皇宫，壮观的伊斯法罕大清真寺，古老的波斯波利斯古城，难道不值得全世界的游客来惊叹吗？"
 
 PER_contact_minor:0 "接触少数民族"
 PER_contact_minor_desc:0 "伊朗存在许多少数民族，我们应当推行一些政策以促进他们与波斯人的团结与和谐。"
 PER_allow_christ:0 "承认基督教合法性"
 PER_allow_christ_desc:0 "也许很多人不知道，伊朗并非伊斯兰教的单一宗教国家，在一些地区，存在亚美尼亚人、亚述人和库尔德人社区，信仰着基督教。我们应当尊重他们的宗教信仰，支持基督社区与穆斯林之间和谐共处，只要他们忠于我们的国家。"
 PER_allow_sunni:0 "承认逊尼派合法性"
 PER_allow_sunni_desc:0 "伊朗的主流伊斯兰教派是什叶派十二伊玛目支派，与逊尼派是世仇，但现在伊朗境内生活着许多信仰逊尼派的阿拉伯人和阿富汗人，我们应当让仇恨走入历史，让真主的信徒和谐共处。"
 PER_allow_sunni_tool:0 "核心化非波斯人为主流人口的伊斯兰教省份的成本和时间减少。这些省份的抵抗程度减少。"
 PER_allow_bahai:0 "承认巴哈伊派合法性"
 PER_allow_bahai_desc:0 "巴哈伊派由学者巴哈伊与1864年创立，教育主张和平与平等，长期以来巴哈伊被伊朗政府视为异端进行打压，现在我们应当承认其合法地位。"
 
 PER_islam_politic:0 "吸纳伊斯兰人士进入政府"
 PER_islam_politic_desc:0 "许多伊斯兰学者关心政治，对伊朗局势发表自己的意见，我们可以邀请他们进入政府，以古兰经的观点为我们的政策指引方向。"
 PER_exbanded_pasdaran:0 "扩大革命卫队"
 PER_exbanded_pasdaran_desc:0 "革命卫队要更好的为伊斯兰共和国服务，就需要进一步扩大规模和武力，使他们拥有国家武装力量的规模。"
 PER_pasdaran_naval:0 "革命卫队海军"
 PER_pasdaran_naval_desc:0 "为了守护我们在波斯湾和里海的利益，革命卫队应当建立海上武装力量。"
 PER_pasdaran_political:0 "革命卫队进入政界"
 PER_pasdaran_political_desc:0 "革命卫队是伊斯兰共和国及宗教领袖的守护者，他们应当在政府中有一席之地。"
 PER_pasdaran_economic:0 "革命卫队参与经济"
 PER_pasdaran_economic_desc:0 "随着革命卫队规模扩大，所需要的经费也不断增长，我们应当允许革命卫队成立自己的企业，投入到经济活动中，从而弥补自身的财政需要，以减轻政府压力。"
 PER_basji:0 "巴斯基民兵组织"
 PER_basji_desc:0 "巴斯基是伊斯兰革命卫队麾下的民兵团体，他们可以征召所有成年男子作为后备兵员。"
 
 PER_inflect_afghanistan:0 "渗透阿富汗"
 PER_inflect_afghanistan_desc:0 "阿富汗自古以来都被视为波斯的一部分，直到1707年才脱离萨法维王朝成为独立国家，我们与阿富汗人有很深的文化渊源。虽然我们现在不能直接吞并阿富汗，但我们可以影响他们的政府，建立一个对我们友好的政权。"
 PER_afghani_republican:0 "支持阿富汗共和主义者"
 PER_afghani_republican_desc:0 "我们可以支持阿富汗共和党，协助他们对抗君主主义、共产主义和伊斯兰主义。"
 PER_afghani_monarch:0 "支持阿富汗国王"
 PER_afghani_republican_desc:0 "我们可以支持阿富汗巴拉宰克王朝，协助他们对抗共和主义、共产主义和伊斯兰主义。"
 
 PER_supress_minor:0 "镇压少数民族"
 PER_supress_minor_desc:0 "伟大的大伊朗帝国不允许与我们文化不一致，信仰不一致的异族存在，我们将采取手段消除这些不忠诚的隐患。"
 PER_supress_turks:0 "镇压突厥人"
 PER_supress_turks_desc:0 "阿塞拜疆人、土耳其人和土库曼人是中世纪侵入伊朗的外来者，如果他们不接受伊朗的同化，就让他们哪来回哪去！"
 PER_supress_arabs:0 "镇压阿拉伯人"
 PER_supress_arabs_desc:0 "胡齐斯坦地区的阿拉伯人在波斯历史上长期扮演叛乱者的角色，现在让我们一劳永逸解决这个问题！"
 PER_supress_armenian:0 "镇压亚美尼亚人"
 PER_supress_armenian_desc:0 "伊朗境内的亚美尼亚人是卡扎尔王朝时期接受的难民，当时接受是因为我们需要他们的先进技术，现在伊朗现代化已经实现，送客！"
 PER_supress_kurds:0 "镇压库尔德人"
 PER_supress_kurds_desc:0 "一战以后，库尔德人一直坚持他们独立建国的美梦，我们让他们认清现实！"
 
 PER_supress_jews:0 "镇压犹太人"
 PER_supress_jews_desc:0 "以色列建国以后，国内的犹太人便成为了一个巨大的安全隐患，我们必须将锡安主义定时炸弹逐出伊朗！"
 PER_supress_sunni:0 "镇压逊尼派"
 PER_supress_sunni_desc:0 "我们永远不会忘记十二伊玛目惨遭伪哈里发杀害的仇恨，让异端信徒付出代价！"
 PER_supress_bahai:0 "镇压巴哈伊教"
 PER_supress_bahai_desc:0 "巴哈伊分子是鼓吹异端邪说的阴谋分子，让他们消失吧！"
 
 PER_plan_nadershah:0 "纳迪尔沙计划"
 PER_plan_nadershah_desc:0 "纳迪尔沙是伊朗历史上伟大的军事家和征服者，他的军队长驱直入南亚次大陆，让莫卧儿皇帝俯首称臣。让我们重现祖先的荣耀！"
 PER_plan_Kurus:0 "居鲁士计划"
 PER_plan_Kurus_desc:0 "居鲁士大帝，伟大的阿契美尼德王朝开国君主和波斯帝国之父，他利用巴比伦国王的昏庸无能，轻松征服了两河流域。让我们重现祖先的荣耀！"
 PER_plan_darius:0 "大流士一世计划"
 PER_plan_ismail:0 "伊斯马仪一世计划"
 PER_plan_ismail_desc:0 "少年君主伊斯马仪一世，16岁灭亡塞尔柱帝国建立了伟大的萨法维王朝，并在梅尔夫战役中取下乌兹别克苏丹昔班尼的首级。让我们重现祖先的荣耀！"
 PER_plan_timur:0 "帖木儿计划"
 PER_plan_timur_desc:0 "残暴的征服者帖木儿，在安卡拉战役击败奥斯曼苏丹巴耶塞特二世，将他如同羔羊一般囚禁在牢笼之中。让我们重现祖先的荣耀！"
 PER_plan_lunar:0 "新月计划"
 PER_plan_lunar_desc:0 "叙利亚和黎凡特地区存在着许多什叶派同胞，我们应当支持他们反对异教徒的事业。"
 PER_hazbe_alla:0 "支持黎巴嫩真主党"
 PER_hazbe_alla_desc:0 "黎巴嫩局势混乱不安，由什叶派民兵组成的真主党希望获得我们的帮助。"
 PER_support_hamas:0 "支持巴勒斯坦圣战者"
 PER_support_hamas_desc:0 "锡安主义政府残酷镇压穆斯林，巴勒斯坦人民需要我们支持！"
 
 PER_water_construct:0 "修建供水设施"
 PER_water_construct_desc:0 "伊朗60%以上的土地都极为干旱，随着我国农业的发展，古老的坎儿井已不足以满足灌溉需要，我们需要现代化的水利系统来支持农业生产。"
 PER_nature_protect:0 "保护自然资源"
 PER_nature_protect_desc:0 "我们需要立法保护森林与河流，它们才能保护我们珍贵的水资源。"
 
 PER_buy_plane:0 "购买战斗机"
 PER_buy_plane_desc:0 "我们目前没有自行生产战斗机的能力，但我们可以向友好国家购买现成的战斗机来建立我们的空军。"
 PER_jet_1:0 "发展喷气机"
 PER_jet_1_desc:0 "喷气引擎的出现让航天器进入了一个新的时代，喷气式战机的速度和航程远远高于过去的螺旋桨飞机，我国要想不在空军建设上落后于人，就需要尽快掌握喷气引擎技术。"
 PER_jet_2:0 "发展二代战斗机"
 PER_jet_2_desc:0 "一款优秀的战斗机不仅需要强力的动力和强大的武器，还需要先进的航电和通讯系统，才能适应现代战争。"
 PER_bomber:0 "发展轰炸机"
 PER_bomber_desc: "当后人谈及此时战争的恐怖之处时，一定会提到那些从天而降的炸弹。而我们则应尽最大的努力使这些故事是由我们的敌人来讲述的。"
 PER_transfer:0 "发展运输机"
 PER_transfer_desc:0 "运输机可以让我们从空中运输物资补给甚至人员，发展空中运输能力将会为我们建立一支强大军队做出贡献。"
 PER_anti_air:0 "发展防空设备"
 PER_airbase_1:0 "扩大空军基地 I"
 PER_airbase_1_desc:0 "我们需要机场和基础设施来承载我们的空军。"
 PER_airbase_2:0 "扩大空军基地 II"
 PER_airbase_2_desc:0 "我国的空军力量不断壮大，对空军设施的要求也越来越高。"
 
 PER_light_ships:0 "发展轻型舰艇"
 PER_light_ships_desc:0 "我们的海军刚刚起步，至少需要一些护卫舰和驱逐舰来保护我们的领海。"
 PER_medium_ships:0 "发展中型舰艇"
 PER_medium_ships_desc:0 "我国的海军正不断发展，我们需要像驱逐舰和巡洋舰这样的中型舰艇来让我们的舰队走得更远。"
 PER_heavy_ships:0 "发展大型舰艇"
 PER_heavy_ships_desc:0 "我们的海军已经成长壮大，我们需要发展可以搭载更多设备和飞机的大型舰艇来强化作战能力。"
 PER_buy_ship:0 "购买水面舰艇"
 PER_buy_ship_desc:0 "我们目前还没有建造舰船的能力，但我们可以向其他国家购买退役的舰艇。"
 PER_buy_submarines:0 "购买潜艇"
 PER_buy_submarines_desc:0 "我们目前还没有建造潜艇的能力，但我们可以向其他国家购买退役的潜艇。"
 PER_submarines:0 "发展潜艇"
 PER_submarines_desc:0 "潜艇舰队是现代海军不可缺少的组成部分，强大的潜艇舰队将保卫我们的领海，"
 PER_naval_base_hormuz:0 "霍尔木兹海军基地"
 PER_naval_base_hormuz_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 PER_naval_base_khozestan:0 "胡齐斯坦海军基地"
 PER_naval_base_khozestan_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 PER_naval_base_north:0 "里海海军基地"
 PER_naval_base_north_desc:0 "我们需要港口、船坞和基础设施来承载我们的舰队。"
 PER_marines_focus:0 "发展两栖部队"
 PER_marines_focus_desc:0 "擅长两栖作战的部队越来越不可或缺。临时拼凑的手段、装备已经成为历史，我方海军陆战兵现在已接受相关训练并拥有专属登陆舰船支持。"
 PER_minor_submarines:0 "微型潜艇"
 
 PER_buy_weapons:0 "购买外国武器"
 PER_buy_weapons_desc:0 "我国的军事工业目前还很落后，没有自己生产军火的能力，但我们可以向其他国家购买退役的武器。"
 PER_armors:0 "发展装甲部队"
 PER_armors_desc:0 "第二次世界大战向全世界展示了坦克装甲车在战争中的惊人战斗力，拥有装甲车辆是打造一支强大现代化陆军的基础。"
 PER_mechanized:0 "发展机械化部队"
 PER_mechanized_desc:0 "摩托化和机械化的战争即将来临，装甲车辆将让我们的军队快速在战场上穿梭，并支援步兵作战。"
 PER_airborn:0 "发展空降部队"
 PER_airborn_desc:0 "飞机航程和载荷的发展开辟了许多可能性。运输机可以在敌人战线的大后方投下一整个师的部队，在那里他们可以造成严重破坏。"
 PER_military_system:0 "完善军事体制"
 PER_military_system_desc:0 "通过设立完善的军事体制、军官制度、指挥系统和军事学院，我们才能把落后的民兵组织建设成为一支有战斗力的职业军队。"
 PER_develop_weapons:0 "成立装备发展部"
 PER_develop_weapons_desc:0 "从步兵的头盔和背心，再到坦克上的火控系统和动力系统，先进的作战装备往往主导着战场。"
 
 PER_usa_intel:0 "西方情报援助"
 PER_usa_intel_desc:0 "我们应当邀请美国情报部门来为我国提供情报援助。虽然这有让我国被美国渗透控制的风险，但利大于弊。"
 PER_cooperate:0 "西方军事援助"
 PER_cooperate_desc:0 "我们可以请求军事政府为我们提供军事援助，包括援助军事装备和军事顾问。"
 
 PER_expanded_soldiers:0 "扩大征兵"
 PER_expanded_soldiers_desc:0 "现在是国家军力扩大的关键时期，我们要求每个成年男子都为国家献出力量。"
 
 PER_focus_republic:0 "走向共和"
 PER_focus_republic_desc:0 "君主制已经统治了伊朗两千五百年，1925年建立了巴列维王朝始终无法确立绝对的合法性，也许伊朗最好的出路，在于共和制。"
 PER_jabheye_melli:0 "支持伊朗民族阵线"
 PER_jabheye_melli_desc:0 "伊朗民族阵线由民族主义政治家穆罕默德·摩萨台领导，该党支持捍卫伊朗的民族权益和推进世俗化现代化，是伊朗走向富强的明灯。"
 PER_jabheye_melli_dictator:0 "一党制政府"
 PER_jabheye_melli_dictator_desc:0 "伊朗共和国成立后，依然存在许多政治势力，给国家带来不稳定因素，我们应当向土耳其、印度和墨西哥学习，支持民族阵线建立强有力的一党制政府，党的精英将控制政治和社会改革。"
 PER_tudeh_party:0 "支持伊朗人民党"
 PER_tudeh_party_desc:0 "伊朗人民党是伊朗最大的左翼政党，由曾经在苏联学习过的知识分子组成，人民党将把伊朗带向社会主义，建立民主的社会主义国家。"
 
 PER_111111:0 "土耳其经验"
 PER_111111_desc:0 "自从土耳其革命的胜利震惊伊斯兰世界以来，许多伊朗知识分子一直主张向阿塔图尔克·凯末尔和他的共和人民党学习，共和人民党建立了独裁统治，但他们也确实集中了社会力量，给土耳其带来民主化、现代化和世俗化，我们应当建立一个类似于土耳其的政治体制。"
 PER_111111:0 "民众主义政党"
 PER_111111_desc:0 "土耳其共和人民党、印度国民大会党和墨西哥革命制度党的共同特点，就是他们不单独代表一个社会阶级的利益。工人、农民、中产阶级和知识分子都是我们党的重要盟友和争取对象，我们应当为所有对伊朗的改革有利的社会阶级谋取利益，并争取他们的支持。"
 PER_111111:0 "建立党的基层组织"
 PER_111111_desc:0 "民族阵线需要扩大自己在民众当中的影响力，从学生、工人、企业乃至宗教界，都要建立我们的工作队和代表团，向广大群众宣扬我们的理念，争取他们的支持。"
 PER_111111:0 "优势国会"
 PER_111111_desc:0 "虽然伊朗民族阵线已经建立了绝对的权威和统治，但我们无意建立一个一党制政权。选举和小党派依然存在，但我们可以通过修改选举法和议会组织法，使得选举永远对民族阵线有利。"
 
 PER_islamic_socialist:0 "伊斯兰式社会主义"
 PER_contact_islam:0 "与伊斯兰势力接触"
 
 PER_Pro_Soviet:0 "亲近社会主义阵营"
 PER_Pro_Soviet_desc:0 "我们都是社会主义国家，并紧密地团结在一起。在莫斯科会议期间，我们制定了一个统一的纲领。在该统一纲领的基础上我们工作得比较轻松。"
 PER_Communist:0 "社会主义之路"
 PER_Communist_desc:0 "落后的封建时代已经过去，我们人民将迎来更加先进、民主的社会制度。社会主义有利于生产力的发展，实现社会平等和民主进步。"
 PER_people_republic:0 "民主共和国"
 PER_people_republic_desc:0 "落后的封建时代已经过去，我们人民将迎来更加先进、民主的社会制度。社会主义有利于生产力的发展，实现社会平等和民主进步。"
 
 PER_soviet_mode:0 "苏联模式"
 PER_soviet_mode_desc:0 "在斯大林模式的指导下，苏联人民不仅在短短十年内把俄罗斯变成了工业强国，而且还战胜了法西斯。我们要摆脱贫困，进入工业化和现代化，就必须学习苏联人民的先进经验。"
 PER_supress:0 "镇压反革命"
 PER_supress_desc:0 "一些敌视社会主义新伊朗的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。"
 PER_collective:0 "农业集体化"
 PER_collective_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 PER_anti_muslim:0 "镇压宗教"
 PER_anti_muslim_desc:0 "宗教是精神的鸦片，他们除了代表封建阶级压迫人民一无是处，只有镇压宗教，才能推动人民接受社会主义意识形态。"
 PER_nkvd:0 "内务委员会"
 PER_nkvd_desc:0 "我们要建立专门的机构，调查、监视、逮捕反革命分子和帝国主义间谍。"
 PER_pioneers:0 "少年先锋队"
 PER_pioneers_desc:0 "少年先锋队是共产主义事业的接班人，培养少先队就是培养党和社会主义的未来。"
 PER_worship:0 "党的权威"
 PER_worship_desc:0 "我国当前政党众多，但大都代表着资本家、政治投机者甚至敌对分子的利益。我们要建设一个无产阶级所有、代表劳动人民的人民民主国家，共产党就必须领导一切。"
 PER_people_army:0 "人民军队"
 PER_nationalized:0 "企业国有化"
 PER_nationalized_desc:0 "私有企业总是为自己的利益服务，并在无序的自由市场中疯狂膨胀，挤压中小企业，甚至被外国资本收买。我们应该将大企业国有化，将他们和他们的产业纳入政府的控制之下，从而确保企业本身和他们的产业能够服从政府指令，为我们的经济政策服务。"
 PER_plan:0 "五年计划"
 PER_plan_desc:0 "我们将开始实行第一个五年计划，以快速改善我国的落后局面。"
 
 PER_output_revolution:0 "输出革命"
 PER_output_revolution_desc:0 "英美帝国主义和殖民主义已经遭到全世界热爱和平的革命人民批判，我们将支持世界人民反帝斗争！"
 PER_arabs_revolution:0 "支持阿拉伯革命"
 PER_arabs_revolution_desc:0 "阿拉伯伊斯兰教反动势力、君主专制反动朝廷和军事独裁当局统治黑暗，左派势力已经掀起了革命斗争，我们应当支持他们！"
 PER_pak_revolution:0 "支持巴基斯坦和阿富汗革命"
 PER_pak_revolution_desc:0 "巴基斯坦和阿富汗的伊斯兰教反动势力、君主专制反动朝廷和军事独裁当局统治黑暗，左派势力已经掀起了革命斗争，我们应当支持他们！"
 PER_hind_revolution:0 "支持印度革命"
 PER_hind_revolution_desc:0 "印度左派势力在山地和森林之间发起游击战争，反抗国大党的独裁政权，我们应当支持他们！"
 PER_turk_revolution:0 "支持土耳其革命"
 PER_turk_revolution_desc:0 "土耳其左派势力在山地和森林之间发起游击战争，反抗共和人民党和军事政府的独裁政权，我们应当支持他们！"
 PER_israeli_revolution:0 "支持以色列革命"
 PER_israeli_revolution_desc:0 "以色列共产党正在与锡安主义当局进行不懈斗争，我们应当支持他们！"
 
 PER_theory_corp:0 "道德警察"
 PER_theory_corp_desc:0 "许多受西方思想影响的民众不遵守沙里亚教法，依然偷偷接触西方文化，做违背古兰经教义的行为。道德警察将检查他们的日常生活，并作出惩戒。"
 PER_strike_female:0 "女性回到古兰经"
 PER_strike_female_desc:0 "女性应当根据伊斯兰教义，回到家庭中支持男人。伊朗受西方文化影响太深，许多女性走出外面，我们应当禁止这种风气。"
 PER_face_cover:0 "强制面纱令"
 PER_face_cover_desc:0 "女性必须全部带上面罩。"
 PER_ban_culture:0 "禁止外来文化"
 PER_ruin_farsi:0 "摧毁异教崇拜"
 PER_ruin_farsi_desc:0 "波斯文化，琐罗亚斯德教，都是伊朗得到真主开花以前的野蛮时代留下的异教徒产物，必须将他们全部摧毁。"
 PER_youth_corp:0 "招募少年兵"
 PER_youth_corp_desc:0 "神圣的战争需要伟大的圣战士积极参与，让青少年们团结在真主的旗帜下战斗吧！即使他们死去，那也是光荣，他们的父母会为此骄傲的！"
 PER_arabs_mujah:0 "支持阿拉伯圣战者"
 PER_arabs_mujah_desc:0 "以奥萨马·本·拉登为代表的圣战者正在对抗阿拉伯国家的亲美政权，我们应当支持他们！"
 PER_pak_mujah:0 "支持巴基斯坦和阿富汗圣战者"
 PER_pak_mujah_desc:0 "以塔利班为代表的圣战者正在对抗反伊斯兰的阿富汗和巴基斯坦当局，我们应当支持他们！"
 PER_azer_mujah:0 "支持高加索圣战者"
 PER_azer_mujah_desc:0 "阿塞拜疆、车臣和达吉斯坦的圣战者正在对抗苏俄共产主义匪徒，我们应当支持他们！"
 PER_turk_mujah:0 "支持土耳其圣战者"
 PER_turk_mujah_desc:0 "土耳其的圣战者正在对抗反伊斯兰的亲美政权，我们应当支持他们！"
 PER_ussr_mujah:0 "支持中亚圣战者"
 PER_ussr_mujah_desc:0 "呼罗珊、乌兹别克、帕米尔和突厥斯坦的圣战者正在对抗苏俄及中国共产主义匪徒，我们应当支持他们！"
 
 PER_white_revolution:0 "白色革命"
 PER_white_revolution_desc:0 "白色革命是穆罕默德·礼萨·巴列维沙阿提出的社会革命纲领，这种伊朗特色的，自上而下的改革旨在完成礼萨·汗·巴列维国王生前将伊朗带入现代化和世俗化的改革。礼萨·巴列维认为，白色革命不同于共产主义的红色革命和西方资本主义的蓝色革命，这是一次伊朗所有人民，各大阶级都将参与的社会革命，目标是将伊朗打造为现代的、世俗的、团结的强大国家。"
 PER_politician_reofrom:0 "政治改革"
 PER_politician_reofrom_desc:0 "现代化的伊朗需要现代化的政府，我们将进行政治改革，剔除行政、司法和军事系统当中的封建残余。"
 PER_grand_iran:0 "大伊朗"
 PER_grand_iran_desc:0 "两千多年以来，伊朗一直都是中东地区最强大的帝国，从阿契美尼德王朝、萨珊王朝、帕提亚王朝、萨曼王朝，再到萨法维王朝、阿夫沙里王朝，我们的祖先四处征战，征服了从恒河到希腊的广大领土。今天，我们将重现祖先伟大的荣耀，让世人见证雅利安伊朗的伟大！"
 PER_expanded_gulf:0 "向海湾扩张"
 PER_expanded_gulf_desc:0 "波斯湾的巴林历史上曾是伊朗领土，近代才被英国霸占。我们要求英国归还巴林，如果我们能在波斯湾南岸的阿拉伯半岛沿海获得领地，那么我们将完全控制这篇世界上最大的石油产地。"
 PER_islam:0 "真主的道路"
 PER_islam_desc:0 "无论世界如何变幻，《古兰经》和先知的意志仍然是永恒的真理，我们的国家需要伊斯兰教法的治理，以保证我国永远在真理的范围内。真主安拉在呼唤我们砥砺前行。弟兄们，请拾起我们的弯刀，捍卫我们生存的权利！"
 per_landreform:0 "土地改革"
 per_landreform_desc:0 "伊朗高原上的可耕种土地本就不多，大部分还被封建地主所占领，我们将进行土地改革，限制地主所拥有的土地数量，从而使得土地可以作为商品，出售给农民、企业或国家。"
 PER_urbanization:0 "城市化"
 PER_urbanization_desc:0 "城市化是工业化的必然结果，也是前提之一，科技革命使得人类的居住地不再受自然条件的束缚，而工业化对劳动力的需求使得大量人口离开农村进入城市，二十世纪下半叶，全世界都有大量人口迁入城市生活，这一方面为工业建设提供了劳动力，但这也意味着这将是对政府建设能力的挑战，城市化需要合理的城市规划、教育、医疗、供电供水和排污系统来支持，没有这些服务的城市将会是一个巨大的贫民窟。"
 PER_tehran_region:0 "德黑兰工业区"
 PER_tehran_region_desc:0 "德黑兰位于里海沿岸，历史上他是萨法维王朝沙阿的皇家园林，后来卡扎尔王朝定都于此，并把它打造为伊朗的政治和经济中心。我们现在也需要进一步开发这一地区。"
 PER_health_corp:0 "健康军团"
 PER_health_corp_desc:0 "健康军团是礼萨·巴列维沙阿白色革命的一部分，通过选拔优秀的医护人员组成，并派遣他们前往农村和贫困落后地区，帮助当地群众治疗疾病和开展卫生建设。"
 PER_Azerbaijan_region:0 "南阿塞拜疆工业区"
 PER_Azerbaijan_region_desc:0 "以大不里士为核心的南阿塞拜疆地区，是伊朗西北的重要领土，与高加索、土耳其及伊拉克相邻，如果我们投资建设这一地区，有利于与邻国开展贸易。"
 PER_agriculture:0 "农业现代化"
 PER_agriculture_desc:0 "改善农业生产，不仅需要合理的土地制度，且需要现金的农业技术。水利、农药、化肥、配种和机械化，这些都是农业现代化不可缺少的。"
 PER_Kerman_region:0 "西部工业区"
 PER_Kerman_region_desc:0 "西部的库尔德斯坦和克尔曼沙阿地区，依靠札格罗斯山脉的冰雪融水，获得了珍贵的淡水资源，发展耕地，也是我国人口最集中的地区。我们应当重点发展该地区的产业，将劳动人口利用起来。"
 PER_isfahan_region:0 "开发伊斯法罕"
 PER_isfahan_region_desc:0 "伊斯法罕半天下，这座美丽的古城被选为波斯首都近八百年，拥有许多珍贵的文化遗产，如果我们开发当地的旅游观光资源，将为我们带来不错的收益。"
 PER_Abbas_port:0 "建设阿巴斯港"
 PER_Abbas_port_desc:0 "阿巴斯港扼守霍尔木兹海峡，是我国重要的海港，无论是作为贸易港、石油港还是军港开发，他都拥有极为关键的地位。"
 PER_Abbas_region:0 "开发法尔斯"
 PER_Abbas_region_desc:0 "法尔斯是波斯文明的发源地，这里无论是自然资源、文化资源还是人力资源都值得我们投资开发。"
 PER_industrial:0 "工业化"
 PER_industrial_desc:0 "初步工业化的政策将是一系列经济发展和社会改造运动的开始。"
 PER_heavy_industrial:0 "发展重工业"
 PER_heavy_industrial_desc:0 "重工业是提供生产资料的工业，我们需要先发展重工业，进入工业化，才能发展其他产业。"
 PER_steelmaking:0 "发展钢铁工业"
 PER_steelmaking_desc:0 "以质量计算,铁是地球上最常见的元素,它加热后有很好的延展性…并且非常有用。铁始于公元前3500年左右,在埃及的盖尔扎赫被发掘出来铁对早期文明所需的各式东西都非常有用:如,蒸煮罐、小五金、工具,以及用来刺伤他人的尖锐武器。"
 PER_auto_industrial:0 "发展汽车工业"
 PER_auto_industrial_desc:0 "随着全球汽车产量增加和汽车技术的发展，汽车已不再是一种富人专属的奢侈品，而实进入中产阶层，成为一种重要的消费品。我国的汽车依然高度依赖进口，因此我们需要发展汽车工业，不仅是为了满足消费需求，也是为了让国家更快实现汽车国产、加速经济和工业发展。"
 PER_expand_oilfield:0 "开发波斯湾油田"
 PER_expand_oilfield_desc:0 "波斯湾是世界上石油储量最丰富的地区，尽管我们在30年代就已经投资建造了几座油田，但如果要满足我们的工业生产，仍然需要增加开采量。"
 PER_oil_refinery:0 "发展化工产业"
 PER_oil_refinery_desc:0 "石油之所以是工业的血液，在于我们可以在石油中提炼出工业生产所需要的一切材料，从汽车、飞机和船只所需的燃油，发电所需的能源，以及生产塑料所需要的乙烯、丙烯……"
 PER_electronic:0 "发展电子产业"
 PER_electronic_desc:0 "电子产业是20世纪后半叶最重要的高新技术产业，小小的晶体管不仅可以制造出先进的电子产品，也是走向发达国家的门槛。"
 PER_oil_nationalized:0 "石油国有化"
 PER_oil_nationalized_desc:0 "长期以来，我国的石油资源都被英国资本操纵下的英伊石油公司控制，大量的石油利润流入英国人的钱包，作为一个独立的主权国家，这是不可容忍的。"
 PER_khuzestan:0 "胡齐斯坦工业区"
 PER_khuzestan_desc:0 "胡齐斯坦省位于伊朗西南部，这里是世界上最早的人类文明之一-埃兰文明的发源地，现在，这里是我国石油资源最丰富的地区。利用石油资源，建立工业区是可行的。"
 PER_shah_port:0 "开发沙阿港"
 PER_military_industrial:0 "发展军工业"
 PER_military_industrial_desc:0 "伊朗曾是人类历史上最强大的帝国，但是近代我们的军事科技却衰落了。如果要建立一支强大的现代化军队，我们就不能依赖外国援助，而是要有自己的军事工业。"
 PER_navy:0 "发展海军"
 PER_airforce:0 "发展空军"
 PER_airforce_desc:0 "空军在1912年的意大利-土耳其战争后被世界各国视作陆海之后的第三大军种，战斗机和轰炸机咆哮着称霸了两次世界大战期间的天空。二战向世界各国展示了空中武装的作用和重要性，他们可以作战、可以运输、可以侦察，可以破坏敌人后方……总之，一支合格的空军是一支现代军队必不可少的，至少我们要保证我们头上的飞机不是敌人的。"
 PER_education_reform:0 "教育改革"
 PER_Secularism:0 "推动世俗化"
 PER_Secularism_desc:0 "伊斯兰教是伊朗走入现代化强国的障碍，他们的教法和道德只会妨碍我们国家的发展，因此我们需要采取措施，将伊斯兰教的影响力从政府、教育和社会中剔除。"
 PER_nuclear:0 "发展核技术"
 PER_nuke:0 "开发核武器"
 PER_lecurity_corp:0 "识字军团"
 PER_nuclear_power:0 "发展核电"
 PER_nuclear_power_desc:0 "核聚变释放出来的能量如果用于发电，不仅能够提供远高于化石能源的电力，并且成本低、低污染。"
 PER_modernized_gov:0 "改革现代化政府"
 PER_savak:0 "沙瓦克"
 PER_savak_desc:0 "沙瓦克是伊朗巴列维王朝的国家情报机关，主要任务是打压政敌，维护沙阿的权威。"
 PER_law_reform:0 "司法改革"
 PER_female:0 "改善女性权益"
 PER_vote:0 "推广普选权"
 PER_strenth_shah:0 "强化沙阿的权力"
 PER_strenth_shah_desc:0 "沙阿（Shah），全称Shahran-Shah，意为万王之王，是古波斯以来对伊朗君主的称呼。自从巴列维王朝建立以来，两位沙阿都致力于实现伊朗的现代化、世俗化和社会建设，未来，我们也将需要沙阿的领导。"
 PER_puppet_party:0 "傀儡政党"
 PER_puppet_party_desc:0 "尽管我们要强化沙阿的专制权力，但国家毕竟已经走向现代化，还是要有像模像样的政党系统。我们可以扶植一些傀儡政党，招纳支持沙阿的中产阶级加入，作为陛下在政府和议会中的代理人。"
 PER_supress_islam:0 "镇压伊斯兰教"
 PER_achemenid:0 "阿契美尼德的遗产"
 PER_soroastic:0 "复兴拜火教"
 PER_soroastic_desc:0 "亚兹德神庙内熊熊燃烧的火焰，象征着伊朗民族的伟大复兴！"
 PER_diplomatic:0 "外交政策"
 PER_diplomatic_desc:0 "在新的时代里，我们必须抓紧参与世界各国间积极的互动，以防止战略上的孤立带来经济和国防安全上的毁灭性后果。"
 PER_pro_Israeli:0 "亲近以色列"
 PER_pro_Israeli_desc:0 "以色列的崛起对伊朗是有利的，他们与阿拉伯民族主义的战争也将间接压制我们国内的穆斯林和胡齐斯坦反政府分子的嚣张气焰，同时我们也可以从以色列获取先进技术。"
 PER_pro_UK:0 "亲近英国"
 PER_pro_UK_desc:0 "尽管反对英帝国主义，一直是伊朗人民一直以来的愿望，但现在世界局势有了新变化。来自莫斯科的共产主义势力和崛起的伊斯兰极端主义成为了比英法更大的威胁，我们不得不考虑，借助英国人的帮助和他们对抗。"
 PER_pro_USA:0 "亲近美国"
 PER_pro_USA_desc:0 "美国政府致力于对抗世界上的共产主义颠覆运动，他们将成为我们的重要盟友。"
 PER_midle_support:0 "中东代理人"
 PER_pro_pakistan:0 "亲近巴基斯坦"
 PER_pro_pakistan_desc:0 "改善与巴基斯坦的关系有利于保障东南边境的稳定与和平。"
 PER_pro_turk:0 "亲近土耳其"
 PER_pro_turk_desc:0 "纳迪尔沙大战奥斯曼帝国的时代已经结束，改善与土耳其的关系有利于保障东北边境的稳定与和平，并学习凯末尔改革的先进经验。"
 PER_pro_iraq:0 "亲近伊拉克"
 PER_pro_gulf:0 "亲近海湾国家"
 PER_pro_gulf_desc:0 "改善与海湾国家的关系有利于保障波斯湾领海的稳定与和平。"
 PER_support_saudi:0 "支援阿拉伯君主制国家"
 PER_pro_afghanistan:0 "亲近阿富汗"
 PER_pro_afghanistan_desc:0 "改善与阿富汗的关系有利于保障东部边境的稳定与和平。"
 PRO_pro_soviet:0 "改善与苏联关系"
 PRO_pro_soviet:0 "与苏联的对抗并不有利于我们的利益，我们应该尝试与莫斯科改善关系，以维护东北边境的稳定与和平。"
 PRO_soviet_aid:0 "争取苏联援助"
 PRO_soviet_aid_desc:0 "我们可以请求苏联政府为我们提供资金支持。"
 PER_accept_tudeh:0 "接纳人民党"
 PER_accept_tudeh_desc:0 "专制君主，右翼政客和资本主义的保守无能令伊朗的无产阶级愤怒，伊朗只有走社会主义和马克思列宁主义的道路，才能获得光明的未来！"
 PER_anti_iraq:0 "对抗伊拉克"
 PER_anti_iraq_desc:0 "两河流域自居鲁士大帝征服巴比伦以来就是波斯自古以来的一部分，但受到英帝国主义和苏俄支持的政权却统治着这里，威胁我国的西部边界，让我们把他们消灭！"
 PER_pro_china:0 "改善与北京关系"
 PER_anti_israeli:0 "对抗以色列"
 PER_anti_israeli_desc:0 "以色列对穆斯林土地的侵占是不可接受的，而他充当英美在中东马前卒的行为更是注定了他们将成为伊朗的永远威胁。"
 PER_anit_usa:0 "对抗美国"
 PER_expanded_east:0 "向东方扩张"
 PER_support_rebels:0 "支持巴基斯坦叛军"
 PER_support_rebels_desc:0 "巴基斯坦的俾路支斯坦、信的和白沙瓦等地有活跃的分离主义叛军，我们可以赞助他们的活动，使他们脱离巴基斯坦，并建立亲近伊朗的政权。"
 PER_anti_communism:0 "对抗共产主义"
 PER_anti_communism_desc:0 "共产主义革命正在危害我们的社会秩序和国家利益，向大家宣布我们国家绝不容忍红色分子，一旦发现，就要投入大牢。"
 PER_taken_khrosan:0 "索要呼罗珊"
 PER_taken_khrosan_desc:0 "苏联统治下的土库曼地区，历史上曾是波斯的呼罗珊地区的一部分。"
 PER_support_turks_rebels:0 "支持中亚动乱"
 PER_support_azerbaijan:0 "支持阿塞拜疆动乱"
 PER_anti_turk:0 "对抗土耳其"
 PER_support_kurds:0 "支持库尔德叛军"
 PER_support_kurds_desc:0 "土耳其西南部有活跃的库尔德分离主义叛军，我们可以赞助他们的活动，使他们脱离土耳其，并建立亲近伊朗的政权。"
 PER_islam_party:0 "组件伊斯兰党"
 PER_islam_republic:0 "伊斯兰共和国"
 PER_islam_republic_desc:0 "真主的信徒已经取得了这个国家的政权，接下来我们将建立一个伊斯兰学者指引下，既实行现代政治制度，也遵循真主道路的伊斯兰共和国。"
 PER_ulima_concil:0 "教士专家会议"
 PER_ulima_concil_desc:0 "由伊斯兰教学者组成的委员会将监督我们的政府，以确保我们的行政和司法运行都符合古兰经的意志。"
 PER_islam_guards:0 "伊斯兰革命卫队"
 PER_islam_cultuire:0 "社会伊斯兰化"
 PER_islam_social:0 "伊斯兰社会"
 PER_shariah:0 "沙里亚教法"
 PER_shariah_desc:0 "以伊斯兰教为核心的封建社会组织在我们国内已经存在了上千年，其“教法”即沙里亚法。是我们泛伊斯兰文明的智慧结晶。是经受住时间考验的，指导一切穆斯林社会的，无可争议的天赐圣法。"
 PER_assisstance:0 "西方援助"
 PER_assisstance_desc:0 "请求美国政府提供军事、政治和经济援助。"
 PER_misssle:0 "流星导弹"
 PER_mujahideen:0 "圣战"
 PER_mujahideen_desc:0 "对异教徒的讨伐已经开始，为了真理，我们将碾碎一切违背伊斯兰的事物！安拉胡阿克巴！"
 PER_support_mujaheden:0 "支持外国圣战士"