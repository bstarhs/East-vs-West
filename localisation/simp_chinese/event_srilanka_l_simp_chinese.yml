l_simp_chinese:
 sri.1.t:0 "锡兰正式宣告独立！"
 sri.1.d:0 "英国国旗在科伦坡总督府前缓缓降下，锡兰正式宣告独立。在总督府内举行的政权交接仪式上，新当选的锡兰统一国民党政府，于象征至高宗教权威的佛牙舍利前庄严宣誓就职。\n新政府明确宣布，将致力于建立一个以佛教信仰为核心、以僧伽罗民族为主体的国家。这一立国方针，迅速引发了国际社会与国内少数族群的深切忧虑。观察家普遍认为，占人口近20%、主要信仰印度教且聚居北部的泰米尔族，其语言、文化及政治权利很可能在这一国家建构过程中被边缘化，面临系统性不公平待遇。\n独立日尽管标志着殖民时代的终结，但这一强烈的民族与宗教导向，也为这个新生国家内部的民族关系蒙上了一层厚重的阴影。"