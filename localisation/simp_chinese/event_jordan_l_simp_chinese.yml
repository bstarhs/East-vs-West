l_simp_chinese:
 jor.1.t:0 "约旦国王阿卜杜拉一世遇刺！"
 jor.1.d:0 "沙特家族首领暨沙特阿拉伯首任国王阿卜杜勒-阿齐兹于塔伊夫皇宫睡梦中离世，结束他21年的统治。长子沙特·本·阿卜杜勒-阿齐兹·阿勒沙特即位。"
 
 jor.10.t:0 "阿拉伯民族主义影响约旦"
 jor.10.d:0 "大马士革的街头，热情地群众挤满了总统府，他们挥舞着约旦和埃及的国旗，手捧着埃及总统贾马尔·阿卜杜勒·纳赛尔的肖像，以庆祝另一个阿拉伯国家在苏伊士运河战争取得的胜利，而当广播电台传来纳赛尔呼吁阿拉伯国家团结起来，共同反对帝国主义的演讲时，人群中爆发出激烈的欢呼声。\n\n要阿拉伯不要帝国主义！年轻的学生们高喊着。\n\n约旦总统卡米勒·尼米尔·夏蒙本人是一名基督徒，他坚决地反对阿拉伯民族主义和阿拉伯联合共和国，他与埃及的关系持续恶化中。"
 
 jor.11.t:0 "伊拉克政变蔓延约旦！！"
 jor.11.d:0 "在伊拉克爆发推翻君主制的政变之后，同为哈希姆王室统治下的约旦也爆发了政治动荡！"
 
 jor.12.t:0 "警惕约旦的赤化危险"
 jor.12.d:0 "约旦遭到了共产势力的渗透，约旦军人正尝试与共产党勾结，帮助莫斯科在中东扩大他们的势力，这是我们绝对不能容忍的！我们也要开始支持约旦国王，协助他们巩固政权，对抗共产主义。"
 jor.12tool:0 "选择干涉约旦危机后，必须尽快将军事单位移动到约旦境内，否则约旦政府将被颠覆！"
 
 jor.13.t:0 "美国正式宣布介入约旦局势！"
 jor.13.d:0 "美国正式宣布，应约旦国王的要求，进行军事干预以保护受共产主义威胁的政权。该行动的目标是支持亲西方的约旦政府，抵抗内部反对派和来自叙利亚及埃及的阿拉伯民族主义威胁。"
 
 
 
 
 jor.1.t:0 "约旦国王阿卜杜拉一世遇刺！"
 
