 wgr.40.t:0 "Tear down this wall"
 wgr.40.d:0 "U.S. President Ronald Reagan delivered a speech in West Berlin to congratulate Berlin on its 26th anniversary.\nWe welcome change and openness; because we believe in freedom and security, the advancement of human freedom Make us work harder for world peace. The Soviet Union can do a very obvious thing, a thing that greatly promotes freedom and peace. General Secretary Gorbachev, if you are looking for peace, if you are going to do something for the Soviet Union and Eastern Europe seeks prosperity, if you seek freedom: come to this door! Mr. Gorbachev, open this door! Mr. Gorbachev, tear down this wall!"
 wgr.40.a:0 "Let's show them how good the"
 
 wgr.42.t:0 "Restoration of the monarchy!"
 wgr.42.d:0 "The political chaos and rise of right-wing forces in Germany ultimately led to surprising and unexpected results. After a referendum in the German parliament, Germany has decided to end the chaotic republic and declare the restoration of the monarchy! [WDR.GetLeader] Invited by the National Assembly to announce the coronation of the German Empire Emperor!"
 