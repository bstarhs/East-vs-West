 ger.30.t:0 "The opening of the Munich Olympics"
 ger.30.a:0 "The 1972 International Olympic Games opened in Munich"
 
 ger.31.t:0 "Palestinian militants have entered the Olympic Village!"
 ger.31.a:0 "The future of peace."
 
 ger.32.t:0 "Israeli athletes killed!"
 ger.32.a:0 "The operation of the Federal German police to rescue Israeli athletes has failed! 11 athletes killed by Palestinian armed groups!"
 
 ger.33.t:0 "Israeli athletes rescued!"
 ger.33.a:0 "The operation of the Federal German police to rescue Israeli athletes has been successful! 11 hijacked athletes were rescued, several Palestinian militants were killed, and the rest were forced to surrender."
 
 ger.34.t:0 "The German Chancellor kneels down at the Monument in Warsaw!"
 ger.34.a:0 "German Chancellor [WDR.GetName] kneels in front of the Warsaw Uprising Memorial during his visit to Warsaw, Poland！"
 
 ger.35.t:0 "Blood in students movement！"
 ger.35.a:0 "The student movement that erupted in Bonn, Germany evolved into a bloody event. German students launched a demonstration to boycott the visit of Iranian King Reza Pahlavi to Germany, and a fierce conflict broke out with the police, resulting in the death of one student."
 
 ger.36.t:0 "Investigation into Gunt Guillaume"
