l_english:
 ger.1.t:0 "Mark to be issued in western Germany soon"
 ger.1.d:0 "The United States, Britain, and France were about to issue new marks in their German occupied territories to strengthen internal economic ties, but this plan did not inform the Soviet Union."

 ger.2.t:0 "The US is creating a puppet government in western Germany"
 ger.2.d:0 "The United States and other Western countries are trying to establish a new government in the occupied areas of western Germany!"
 ger.2.a:0 "Don't let the Americans expand their sphere of influence in Germany!"
 ger.2.b:0 "Let him go"

 ger.3.t:0 "Soviet"
 ger.3.d:0 "Moscow is protesting against a series of economic and political plans recently implemented in Germany, accusing us of attempting to establish a pro Western government in Germany that is detached from the east."
 ger.3.a:0 "The Russians have no right to dominate Germany."
 ger.3.b:0 "We should take a step back."

 ger.4.t:0 "The Americans rejected us!"
 ger.4.d:0 "British, American, and Western countries have rejected our ultimatum! They will continue to establish political power in western Germany according to the original plan."
 ger.4.a:0 "Block Berlin! Immediately!"
 ger.4.b:0 "Let him go"

 ger.5.t:0 "Berlin Blockade"
 ger.5.d:0 "The Soviet Union and Western countries had a fierce conflict over Germany's future, and after the dialogue failed, the Soviet Union announced a blockade of Berlin!"
 ger.5.a:0 "Think of ways to help the local people"
 ger.5.b:0 "There's nothing we can do"

 ger.6.t:0 "US airdrop aid to West Berlin"
 ger.6.d:0 "After the Soviet Union blocked land transportation between West Berlin and western Germany, the United States began airdropping supplies to West Berlin. With the resumption of normal supplies in West Berlin, our blockade policy has become ineffective."
 ger.6.a:0 "The prestige and honor of the Soviet Union took precedence."
 ger.6.b:0 "Americans must stop airdrops."

 ger.7.t:0 "Soviet Union protests our airdrop"
 ger.7.d:0 "Moscow has sent us an ultimatum, warning that if the airdropped supplies are not ended, they will take military action against West Berlin."
 ger.7.a:0 "Step back and avoid war."
 ger.7.b:0 "NO WAY!

 ger.8.t:0 "Americans rejected our protest"
 ger.8.a:0 "Step back and avoid war."
 ger.8.b:0 "Let's show them how good the Soviets power!"

 ger.9.t:0 "US airdrop ended"
 ger.9.d:0 "Under Moscow's military deterrence, the United States was forced to stop a series of air drops on West Berlin. In response, the Soviet Union ended its blockade of West Berlin but also seized control of its material supply. The concessions made by the United States have greatly damaged the reputation of Western countries in Germany, and the plan for the United States to lead the establishment of a new government in western Germany seems unlikely to be realized."
 ger.9.a:0 "Lucky."

 ger.10.t:0 "The future of West Berlin"
 ger.10.a:0 "We can't control the enclave. It's feasible to give it to Russia."
 ger.10.b:0 "West Berlin is our most important barrier against communism."

 ger.11.t:0 "US withdrawal from West Berlin"
 ger.11.a:0 "The future of peace."

 ger.12.t:0 "US troops refuse to withdraw from West Berlin"
 ger.12.a:0 "There is nothing we can do."
 ger.12.b:0 "Let's show them how good the Soviets power!"

 ger.13.t:0 "Russian invade West Berlin!!"
 ger.13.a:0 "The war never ended."

 ger.14.t:0 "Soviet Union ends blockade"
 ger.14.d:0 "With the United States continuously airdropping supplies to West Berlin, the Soviet blockade of Berlin was declared a failure, and the Soviet government was no longer able to afford the diplomatic and political costs of the blockade and was forced to announce the abandonment of the blockade. This confrontation ended in a political victory for Western countries."
 ger.14.a:0 "The future of peace.

 ger.15.t:0 "Founding of the Federal Republic of Germany"
 ger.15.d:0 "After the Berlin Crisis, there was an increasing call for the merger of the occupied western German territories to form a new regime and counter the threat from the Soviet Union. With the support of the three countries of England, America, and France, and the efforts of German politicians, the Federal Republic of Germany was declared established and its capital was Bonn. Some European countries, including the Soviet Union, are skeptical of the establishment of the Federal Republic of Germany, fearing that it will lead to the restoration of Nazism. In addition, countries such as Britain and France remain vigilant about the Federal Republic of Germany, and Germany is still far from becoming a normal country again."
 ger.15.a:0 "The future of peace.

