l_english:

 latin.4.t:0 "Communist revolt!!"
 latin.4.d:0 "A communist armed force launched a rebellion in rural areas of our country and attacked our military base!"
 latin.4.a:0 "We have to stop them!"

 latin.8.t:0 "The Guerrillas hero"
 latin.8.d:0 "Firm eyes, black berets and waterproof windbreaker. This is Ernesto Che Guevara, commander of the Cuban revolution. This picture was taken by Alberto corda at the funeral of the shipwrecked victims. Alberto named this photo guerrilla hero, which means brave guerrilla hero. He believes that this photo will become a symbol of future revolution."
 latin.8.a:0 "This is not a photo,it is a symbol."

 latin.10.t:0 "Communist revolt!"
 latin.10.d:0 "The Communist Party is attacking our capital! They fought with government forces in the streets and besieged the presidential palace. Our national defense forces are preparing for battle. What should we do?"
 latin.10.a:0 "Crash the commies!"
 latin.10.b:0 "We have to surrender."

 latin.11.t:0 "[From.GetName] has liberated!"
 latin.11.d:0 "The National Liberation Front occupied the presidential palace, raised the banner of revolution, and the dictator of [From.GetName] fell! Their presidents and bureaucrats have fled to the United States, and a new democratic government is about to be established!"
 latin.11.a:0 "Viva la libertad [From.GetName]!!"

 latin.12.t:0 "Guerrillas has be defeated"
 latin.12.d:0 "Our national defense forces defeated the guerrilla soldiers and drove them out of the capital. Now they have retreated and returned to the jungle. After this battle, the guerrillas suffered great losses and were unable to launch any attack for a long time."
 latin.12.a:0 "Good."

 latin.13.t:0 "Guerrillas were disbanded"
 latin.13.d:0 "With the decline of communism in China and the increasingly severe suppression of the army, more and more rebels surrendered, and the guerrillas of the Communist Party have tended to collapse."
 latin.13.a:0 "Good."

 latin.16.t:0 "Victory in suppressing the guerrillas!"
 latin.16.d:0 "Our armed forces successfully defeated the guerrillas and destroyed their camp! After this battle, the guerrillas suffered great losses and were unable to launch any attack for a long time."
 latin.16.a:0 "Good."

 latin.17.t:0 "Defeat in suppressing the guerrillas!"
 latin.17.d:0 "Our armed forces were defeated and suffered heavy losses when searching for and destroying the guerrillas! The war seriously weakened the morale and prestige of our regime, and the guerrillas grew stronger."
 latin.17.a:0 "Shit."

 latin.18.t:0 "[From.GetName]政变"
