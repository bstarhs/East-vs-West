l_english:
 eco.1.t:0 "Fiscal deficit!"
 eco.1.d:0 "Our country's expenditure is greater than its income, leading to a fiscal deficit! Excessive fiscal deficit will affect the efficiency of government operations."
 
 eco.2.t:0 "Benefits are stable"
 eco.2.d:0 "Our country's revenue exceeds expenditure, and the fiscal deficit penalty has disappeared."
 
 eco.3.t:0 "Insufficient crude oil!"
 eco.3.d:0 "There are insufficient crude oil resources available for refining in my country! This will lead to shrinking refining output."
 
 eco.4.t:0 "Not enough iron ore!"
 eco.4.d:0 "Our country has insufficient iron ore resources for consumption! This will lead to shrinking steelmaking output."
 
 eco.5.t:0 "Insufficient food!"
 eco.5.d:0 "Our country has provinces with food shortages!"
 eco.5.a:0 "Jump to this province"
 eco.5.b:0 "OK"
 
 eco.6.t:0 "Restoration of food supply"
 eco.6.d:0 "The food supply in a certain area has returned to normal."
 eco.6.a:0 "Check it"
 eco.5.b:0 "OK"

 eco.7.t:0 "Auto"
 eco.7.d:0 "Civil automobile is a special product of this mod, which requires civil factories and certain steel, rubber, aluminum and other resources for production. The demand for automobiles comes from the national infrastructure. Meeting more than 80% of the automobile demand can give additional political points and construction speed bonus, but if it is less than 50% of the automobile demand, there will be additional punishment.\nChoosing an automobile manufacturer to join an industrial enterprise can increase the output of automobiles.\nAutomobiles are also important export products. At present, it is set that each export unit obtains 4 incomes from automobiles. Processing resources into automobiles for export can obtain huge profits."
 eco.7.a:0 "OK"
 
 eco.8.t:0 "Electronic"
 eco.8.d:0 "Electronic product is a special product of this mod, which requires civil factories and certain steel, rubber, aluminum and other resources for production. The demand for electronic products comes from the national urban development level. Meeting more than 80% of the demand for electronic products can give an additional stability and compliance bonus. However, if the demand for electronic products is less than 30%, there will be additional punishment.\nChoosing an electronic product manufacturer to join an industrial enterprise can increase the output of electronic products.\nYou don't need to pull the output of electronic products to fully meet the demand. You can get a bonus if you meet more than 80% of the demand."
 eco.8.a:0 "OK"
 
 eco.9.t:0 "Insufficient medical care！"
 eco.9.d:0 "The medical service in [FROM.GetID] is seriously insufficient!"
 eco.9.a:0 "Check it"
 eco.9.b:0 "OK"
 
 eco.10.t:0 "Recovery of medical supply"
 eco.10.d:0 "The medical supply in [FROM.GetName] has returned to normal."
 eco.10.a:0 "Check it"
 eco.10.b:0 "OK"
 
 eco.11.t:0 "Current education situation"
 eco.11.d:0 "Our current literacy rate are §G[?education]§W%\nWe have §G[?THIS.educatet_states]/[?controlled_states] state meeting educational needs§WRate of increase in literacy is§G[?education_rate_up]§W per month"
 eco.11.a:0 "OK"
 
 
 eco.12.t:0 "Low literacy rate！"
 eco.12.d:0 "The current literacy rate in our country is §Y[?education]§W%, which has seriously delayed the development speed of us!"
 eco.12.a:0 "OK"
 
 eco.13.t:0 "Literacy improved"
 eco.13.d:0 "The current literacy rate in our country is [?education]%,we are no longer a country with a low literacy rate!"
 eco.13.a:0 "OK"

 eco.14.t:0 "Energy supply recovery"
 eco.14.d:0 "Our energy supply has returned to normal."
 eco.14.a:0 "OK"
 
 eco.15.t:0 "You can use idle civilian factories for production!"
 eco.15.d:0 "MOD  have adopted a new economic system that allows you to invest idle civilian factories in the production of consumer goods, such as food, textiles, electronics, and automobiles. These goods not only provide you with taxes, but also can be exported overseas for profit.\nCivil factories incur expenses regardless of whether they are in a working state, but only factories that are in a working state generate taxes."
 eco.15.a:0 "OK"
