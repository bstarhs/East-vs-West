l_english:
 yug.1.t:0 "Tito became leader of Yugoslavia"
 yug.1.d:0 "Josip Broz Tito was elected president of Yugoslavia."
 yug.1.a:0 "Good."
 
 yug.3.t:0 "Be vigilant about the latest policies of [From.GetName]"
 yug.3.d:0 "The so-called independent and autonomous diplomacy promoted by [From.GetName] leader [From.GetLeader] requires us to be vigilant. While socialist governments of various countries unite to resist Western [From.GetLeader], Tito has put forward a proposition that is equivalent to singing the opposite song. Perhaps we need to issue a warning to force them to turn their back on the cliff."
 yug.3.a:0 "Issue a warning"
 yug.3.b:0 "No need"
 
 yug.4.t:0 "Discontent from Moscow"
 yug.4.d:0 "Moscow is dissatisfied with our proposed independent foreign policy today, accusing us of creating division at a time when socialist countries need unity the most, and demanding that we cancel relevant policies."
 yug.4.a:0 "We refuse Moscow's interference"
 yug.4.b:0 "Take soft medication"
 
 yug.5.t:0 "[From.GetName] Ignored our warning"
 yug.5.d:0 "The [From.GetName] leader [From.GetLeader] ignored our warning and continued to pursue the so-called policy of independence and autonomy."
 yug.5.a:0 "Impose sanctions"
 yug.5.b:0 "Let him go"
 
 yug.6.t:0 "The deterioration of relations between [ROOT.GetName] and the Soviet Union"
 yug.6.d:0 "The independent foreign policy implemented by [ROOT.GetName] has caused great dissatisfaction in Moscow. After negotiations between the two sides failed, the Soviet government announced the end of a series of economic aid to [ROOT.GetName]."
 yug.6.a:0 "OK"
 
 yug.7.t:0 "[ROOT.GetName] has cancelled its previously proposed foreign policy"
 yug.7.d:0 "[ROOT.GetName] announced the cancellation of its previously proposed foreign policy of pursuing independence and autonomy, and dismissed some pro Western diplomats from their positions. At the same time, it sent other diplomats to Moscow to meet with Soviet leaders, indicating that the Soviet Union had taken some measures against the country."
 yug.7.a:0 "确定."
 
 yug.9.t:0 "Death of Broz Tito"
 yug.9.d:0 "Josep Broz Tito, President of the Socialist Federal Republic of Yugoslavia and leader of the Communist Party of Yugoslavia, passed away in Ljubljana. This is the saddest day for the Yugoslav people. Tito led guerrilla forces to resist German invasion during World War II, and after the war, he led Yugoslavia and adopted a neutral attitude. As a Croatian, he also attempted to maintain peace between the Yugoslav ethnic groups. Now that the leader is dead, who can lead Yugoslavia?"
 yug.9.a:0 "So sad."
 
 yug.10.t:0 "The fall of the Communist government of Yugoslavia!"
 yug.10.d:0 "At last week's meeting of the Communist Union of Yugoslavia, the delegation of Serbia and Montenegro had a fierce dispute with the delegations of Croatia and Slovenia. Slovenia requested economic reform, but Serbian President Slobodan Milosevic rejected the request. He then requested a change in the voting system to strengthen his power, but was rejected by Croatia and Slovenia. These two delegations left the meeting, causing it to end. The departure of Croatia and Slovenia meant the collapse of the communist alliance, and the countries of Yugoslavia had to hold multi-party elections."
 yug.10.a:0 "So sad."
 
 yug.11.t:0 "The disintegration of Yugoslavia"
 yug.11.d:0 "Last week, the republics of Yugoslavia held general elections, and each state elected its own ruling party to replace the Communist Party. The Croatian Democratic Union won in Croatia, and Serbian President Slobodan Milosevic and the Serbian people residing in Croatia condemned the CDU as a nationalist and fascist group that would not allow the New Ussha people to harm the rights of Serbs."
 yug.11.a:0 "So sad."
 
 yug.12.t:0 "Serb unrest！"
 yug.12.d:0 "Violent unrest erupts in the Kraina and Vukovar regions! The radical Serbs organized a rebellion against the Croatian army and declared independence in the Kraina region. The Serbs claim that the Croatian government plans to establish a new Ustasha regime, and they must fight against fascism. Yugoslav President Milosevic said Serbia will support their compatriots in Kraina, and the Yugoslav Civil War has erupted!"
 yug.12.a:0 "So sad."
 
 yug.13.t:0 "Croatian turmoil！"
 yug.13.d:0 "Violent unrest erupts in Croatia! The radical Serbs organized a rebellion against the Croatian army and declared independence in the Kraina region. The Serbs claim that the Croatian government plans to establish a new Ustasha regime, and they must fight against fascism. Yugoslav President Milosevic said Serbia will support their compatriots in Kraina, and the Yugoslav Civil War has erupted!"
 yug.13.a:0 "So sad."
 
 yug.14.t:0 "The disintegration of Yugoslavia！"
 yug.14.d:0 "The political crisis in Yugoslavia has moved in the most dangerous direction. The relationship between Serbia, Croatia, and Slovenia is completely irreconcilable. Yesterday, the newly established governments of Croatia and Slovenia officially announced their withdrawal from the Federal Republic of Yugoslavia and declared independence, while Belgrade responded strongly and announced that they would take action to defend the integrity of Yugoslavia."
 
 yug.15.t:0 "The Serbian armed organization has been suppressed!"
 yug.15.d:0 "Under the attack of the Croatian army, Serbian paramilitary forces in the Kraina and Vukovar regions were suppressed, and remaining elements were forced to relocate underground. The Yugoslav People's Army, which supported Serbian armed forces, was also forced to withdraw."
 
 yug.20.t:0 "Bosnia independence referendum"
 yug.20.d:0 "As Croatia and Slovenia secede from Yugoslavia, Bosnia and Herzegovina will also hold a referendum on whether to secede from Yugoslavia. After voting, the majority of Croats and Muslims in Bosnia and Herzegovina chose independence and declared independence from Yugoslavia to establish the Republic of Bosnia and Herzegovina. The minority Serbs, on the other hand, refused the referendum results."
 yug.20.a:0 "So sad."
 
 yug.21.t:0 "The Civil War in Bosnia and Herzegovina has erupted!"
 yug.21.d:0 "Due to dissatisfaction with the results of the Bosnian independence referendum and the independence of Bosnia and Herzegovina from Yugoslavia, the Serbian community in Bosnia and Herzegovina declared independence from Bosnia and Herzegovina and established a Republika Srpska. Subsequently, there was a large-scale armed conflict between various ethnic groups in Bosnia and Herzegovina."
 yug.21.a:0 "So sad."
 
 
 yug.30.t:0 "The disintegration of the Ustashe resistance movement"
 yug.30.d:0 "After being besieged by the Yugoslav army, the last organized Ustashe armed group in the western part of the country announced the laying down of their weapons, marking the end of the Croatian Ustasha nationalist rebellion that lasted for nearly several years after the end of World War II."
 yug.30.a:0 "OK."
 