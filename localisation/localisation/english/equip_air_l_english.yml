l_english:
 fighter:0 "Fighter"
 AIR_TITLE_attacker:0 "Attacker"
 fighter_equipment_desc:0 "Fighter is fast and flexible, and can do a lot of work. From fighting for air superiority, protect your bombers and intercept enemy bombers."
 cv_fighter:0 "Fighter"
 cv_fighter_equipment_desc:0 "Fighter is fast and flexible, and can do a lot of work. From fighting for air superiority, protect your bombers and intercept enemy bombers."
 jet_fighter:0 "Fighter"
 jet_fighter_equipment:0 "Fighter"
 jet_fighter_equipment_desc:0 "Fighter is fast and flexible, and can do a lot of work. From fighting for air superiority, protect your bombers and intercept enemy bombers."
 cas:1 "Attacker"
 CAS_equipment_desc:0 "Attacker planes are designed to provide support in land combat."
 cv_cas:2 "Attacker (Carrier)"
 cv_CAS_equipment_desc:0 "Attacker planes are designed to provide support in land combat."
 fighter_equipment_0:0 "WWII Fighter"
 fighter_equipment_0_short:0 "Fighter"
 fighter_equipment_0_desc:0 "WWII single engine propeller fighter."
 fighter_equipment_1:0 "Fighter I"
 fighter_equipment_1_short:0 "Fighter I"
 fighter_equipment_1_desc:0 "The jet engine appeared at the end of WWII has been widely used. After the war, many countries will develop jet fighter."
 fighter_equipment_2:0 "Fighter II"
 fighter_equipment_2_short:0 "Fighter II"
 fighter_equipment_2_desc:0 "The jet fighter will be improved to use a more advanced jet engine nuclear body design."
 fighter_equipment_3:0 "Fighter III"
 fighter_equipment_3_short:0 "Fighter III"
 fighter_equipment_3_desc:0 "The use of air-to-air missiles and air to ground missiles will make fighter more effective."
 fighter_equipment_4:0 "Fighter IV"
 fighter_equipment_4_short:0 "Fighter IV"
 fighter_equipment_4_desc:0 "The use of air-to-air missiles and air to ground missiles will make fighter more effective."
 heavy_fighter_equipment:0 "Electronic-warfare"
 heavy_fighter_equipment_1:0 "Electronic-warfare I"
 heavy_fighter_equipment_1_short:0 "Electronic-warfare I"
 heavy_fighter_equipment_1_desc:0 "Our bomber force needs escort protection from enemy fighters all the way to their targets and back. In order to provide this escort, we must design fighter aircraft with bomber range. Out of necessity these aircraft are larger, slower and less agile than light fighters, though they can carry significant armament."
 heavy_fighter_equipment_2:0 "Electronic-warfare II"
 heavy_fighter_equipment_2_short:0 "Electronic-warfare II"
 heavy_fighter_equipment_2_desc:0 "The war has taught us that our heavy fighter design is vulnerable to more nimble fighters, but quite good at the interception of enemy bombers due to heavy armament. This next design will focus on increased attack capability against enemy aircraft and even ground targets. Its speed and range will be improved as well."
 heavy_fighter_equipment_3:0 "Electronic-warfare III"
 heavy_fighter_equipment_3_short:0 "Electronic-warfare III"
 heavy_fighter_equipment_3_desc:0 "Though our heavy fighter force has shown adeptness in various roles, we must consider a new design that will enhance its ability relative to enemy fighters, as well as allow it to continue intercepting increasingly faster and better defended enemy bombers."
 
 cv_nav_bomber_equipment_1:0 "Shipborne cruise missile I"
 cv_nav_bomber_equipment_1_short:0 "Shipborne cruise missile I"
 cv_nav_bomber_equipment_1_desc:0 "An early naval bomber modified to launch from and land on aircraft carriers."
 cv_nav_bomber_equipment_2:0 "Shipborne cruise missile II"
 cv_nav_bomber_equipment_2_short:0 "Shipborne cruise missile II"
 cv_nav_bomber_equipment_2_desc:0 "An improved naval bomber modified to launch from and land on aircraft carriers."
 cv_nav_bomber_equipment_3:0 "Shipborne cruise missile III"
 cv_nav_bomber_equipment_3_short:0 "Shipborne cruise missile III"
 cv_nav_bomber_equipment_3_desc:0 "An advanced naval bomber modified to launch from and land on aircraft carriers."
 cv_CAS_equipment_1:0 "Antisubmarine aircraft I"
 cv_CAS_equipment_1_short:0 "Antisubmarine aircraft I"
 cv_CAS_equipment_1_desc:0 "An early close air support plane modified to launch from and land on aircraft carriers."
 cv_CAS_equipment_2:0 "Antisubmarine aircraft II"
 cv_CAS_equipment_2_short:0 "Antisubmarine aircraft II"
 cv_CAS_equipment_2_desc:0 "An improved close air support plane modified to launch from and land on aircraft carriers."
 cv_CAS_equipment_3:0 "Antisubmarine aircraft III"
 cv_CAS_equipment_3_short:0 "Antisubmarine aircraft III"
 cv_CAS_equipment_3_desc:0 "An advanced close air support plane modified to launch from and land on aircraft carriers."
 
 strat_bomber_equipment_1:0 "Stratic Bomber I"
 strat_bomber_equipment_1_short:0 "Stratic Bomber I"
 strat_bomber_equipment_1_desc:0 "In WWII, the strategic bomber shows its powerful power and the importance of attacking the enemy's rear cities, production and economic lifelines. Strategic bombing will become an essential war capability."
 strat_bomber_equipment_2:0 "Stratic Bomber II"
 strat_bomber_equipment_2_short:0 "Stratic Bomber II"
 strat_bomber_equipment_2_desc:0 "The widespread use of nuclear weapons is that we must be prepared to become the next nuclear country, and nuclear weapons alone are not enough. We must let our bombers have the ability to deliver nuclear bombs."
 strat_bomber_equipment_3:0 "Stratic Bomber III"
 strat_bomber_equipment_3_short:0 "Stratic Bomber III"
 strat_bomber_equipment_3_desc:0 "If we want to become a nuclear power, we must also greatly increase the range of our strategic bomber and equip it with intercontinental nuclear strike capability."
 scout_plane:0 "Scout Plane"
 scout_plane_equipment_desc:0 "A plane developed specifically for photo reconnaisance. Relies primarily on speed and stealth to survive and will lose in any stand-up fight."
 scout_plane_equipment:1 "Scout Plane"
 scout_plane_equipment_1:0 "Scout Plane I"
 scout_plane_equipment_1_desc:0 "Gathering intelligence on enemy troop movements and providing reports of enemy naval deployments has been the original mission for airplanes since their first deployment in the Great War, and is still an important mission."
 scout_plane_equipment_2:0 "Scout Plane II"
 scout_plane_equipment_2_desc:0 "By developing dedicated planes for aerial surveillance and long-range reconnaissance, we ensure that we gain and maintain an accurate picture of our opponent's intentions and capabilities."
 
 CAS_equipment:0 "Attacker"
 CAS_equipment_1:0 "Attacker I"
 CAS_equipment_1_short:0 "Attacker I"
 CAS_equipment_2:0 "Attacker II"
 CAS_equipment_2_short:0 "Attacker II"
 CAS_equipment_2_desc:0 "Early war experiences have shown that increased speed, armor and maneuverability are necessary for CAS aircraft survivability against enemy fighters and ground fire. This next generation of ground attack aircraft will also utilize larger bombs, cannons and machineguns to inflict greater damage to their targets."
 CAS_equipment_3:0 "Attacker III"
 CAS_equipment_3_short:0 "Attacker III"
 CAS_equipment_3_desc:0 "The ever increasing capability of target AA and enemy interceptors require further evolution of our CAS aircraft. The new design incorporates increased engine power, airframe improvements for increased diving capability and protection, as well as even greater payloads."
 CAS_equipment_4:0 "Attacker IV"
 CAS_equipment_4_short:0 "Attacker IV"
 CAS_equipment_5:0 "Attacker V"
 CAS_equipment_5_short:0 "Attacker V"
