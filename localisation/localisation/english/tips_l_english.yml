UN_TIPS_TITLE:0 "About the United Nations system"
UN_TIPS_TEXT:0 "When they prepare for war, those who have the most say talk about peace until the preparation is completed.     -Stefan Zweig\n\n§RThis feature is still in making§W\nThe United Nations system is a game system newly designed by the Cold War East vs West confrontation module.\nYour international influence represents your prestige in the international community, and the level of prestige will bring you additional influence.\nAfter joining the United Nations, you can apply for loans and support from peacekeeping forces, which have certain requirements for international prestige.\nIf your international reputation is low, members of the United Nations Security Council will impose sanctions or even attacks on you."

ETHNICS_TIPS_TITLE:0 "About the Ethnic System"
ETHNICS_TIPS_TEXT:0 "§RThis feature is still in making§W\nThe Ethnic System is a game system newly designed by Cold War East vs. West mod, where each province has a mainstream ethnic group and each country has a main ethnic group.\n Different ethnic groups have different religious and ideological tendencies. If you go against these ethnic tendencies, they may generate additional dissatisfaction and resistance, but if you can meet their needs, it will bring you additional benefits.\n You can alleviate the dissatisfaction of ethnic minorities by adjusting ethnic and religious policies, as well as some resolutions."
tip.7.a:0 "OK"

SPACE_TIPS_TITLE:0 "About the Space Race System"
SPACE_TIPS_TEXT:0 "The Earth is the cradle of humanity, but humans cannot live in it forever.    ——Konstantin Tsiolkovsky\n\n§RThis feature is still in making§W\nThe Space Race System is a game system newly designed by Cold War East vs. West mod, which studies and launches different spacecraft to gain international prestige, intelligence capabilities, and other additional bonuses.\n "
tip.7.a:0 "OK"

CIVIL_TIPS_TITLE:0 "About the livelihood system"
CIVIL_TIPS_TEXT:0 "People who suffer from hunger and unemployment are the breeding ground for dictatorship.    ——Franklin Delano Roosevelt\n\n§RThis feature is still in making§W\nThe Livelihood System is a game system newly designed by Cold War East vs. West mod, consisting of four numerical values: food, electricity, education, and healthcare\nThe grain value shows the amount of grain you are currently producing and consuming. The more you produce, the faster your labor growth will be. However, excessive grain will bring punishment for overproduction. If the grain output is lower than the grain consumption, it will lead to famine and endanger the stability of the country.\n The electricity value shows the amount of electricity you currently produce and consume. Building a building increases electricity consumption, and building a power plant and researching technology can increase electricity output. If there is insufficient electricity, it will affect the speed of building construction and production.\n The values of education and healthcare can be improved through the construction of schools, hospitals, resolutions, national policies, and other means. Medical care can bring you additional stability, while education can increase political income and research speed. Similarly, if the output of education and healthcare is lower than demand, it will bring additional dissatisfaction."
tip.7.a:0 "OK"

NUKE_TIPS_TITLE:0 "About nuclear weapons"
NUKE_TIPS_TEXT:0 "The release of atomic energy has changed everything except the way humans think.    ——Albert Einstein\n\n§RThis feature is still in making§W\n mod The original nuclear weapons system of the game has been improved and a new nuclear technology tree has been added. By studying nuclear technology, you can develop your nuclear weapons, enhance nuclear deterrence, or use nuclear energy for power generation.\nTo study nuclear energy, you must first pass a resolution to conduct nuclear tests in order to improve the research speed of the nuclear technology tree.\nAfter possessing nuclear weapons, you can use the nuclear weapons control panel in the lower right corner of the screen to conduct nuclear strikes on the target, quickly destroying the war capabilities of hostile countries, but the enemy can also engage in nuclear countermeasures.\nThe range and speed of nuclear warhead launch depend on your projection carrier, including strategic bombers, ballistic missiles, and strategic nuclear submarines. Each launch carrier is counted as a certain number of standby launch units. Only when enough launch units are in standby state can a nuclear bomb be launched. The launch unit will be in recovery state after launch, and the recovered or destroyed launch unit cannot launch a nuclear bomb.\nA nuclear submarine is a newly added nuclear missile launch mechanism in this mod. If the launch range of strategic bombers and ballistic missiles is not sufficient to cover the target, strategic nuclear submarines can be dispatched to the waters near the target area and can still launch nuclear bombs.\nYour number of nuclear bombs, coverage area, and number of launch bases will be calculated as nuclear deterrence values. The larger the nuclear deterrence value, the more AI countries will fear your power and make concessions in diplomacy. However, on the other hand, the huge nuclear deterrence force will damage your international prestige, cause a encirclement network against you, and increase international tension. Nuclear disarmament resolutions can be used appropriately.\nThe maintenance costs of nuclear warheads, submarines, and power plants are quite high, and only economically developed countries can afford a viable nuclear force."
tip.7.a:0 "OK"

ECONOMIC_TIPS_TITLE:0 "About the Economic Production System"
ECONOMIC_TIPS_TEXT:0 "The goods we consume do not come from the gift of bakers, but from their concern for their own interests.     ——Adam Smith\n\n "
tip.7.a:0 "OK""

