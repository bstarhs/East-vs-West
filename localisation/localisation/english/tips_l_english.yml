TIPS_TITLE:0 "Welcome to the East vs West"
TIPS_TEXT:0 "The East vs West mainly simulates the world history from 1947 to 1995, where the world was contested by major powers such as the United States and the Soviet Union, expanding its sphere of influence through local wars, coups, and other means. The emergence of nuclear weapons has led both sides to try to avoid launching a world war, but this does not mean that players or AI will not choose to launch a nuclear war.\nThis can be closed using the ESC key"
