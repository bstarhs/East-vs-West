l_english:
 tib.1.t:0 "热振僧人围攻布达拉宫"
 tib.1.a:0 "让瓦加斯先生再次领导我们的国家！"
 tib.1.b:0 "戈麦斯元帅适合成为新的领袖。"
 
 tib.2.t:0 "热振活佛圆寂"
 tib.2.d:0 "热振活佛圆寂，以热振活佛为首的噶厦亲中派势力也随之瓦解，亲英派和独立派逐渐掌握Tibet。"
 tib.2.a:0 "无稽之谈！"
 tib.2.b:0 "让瓦加斯下台！"
 
 tib.3.t:0 "十四世达赖亲政"
 tib.3.d:0 "随着十四世Dalai Lhama·丹增嘉措成年，他在Lhasa正式坐床，开始行使自己作为Tibet宗教领袖的权能。"
 tib.3.a:0 "确定。"
 
 tib.4.t:0 "内地共产党向我们发来邀请"
 tib.4.d:0 "瓦加斯拒绝为托涅雷洛事件负责的行为激怒了军队，他们组织武装在里约热内卢发动政变，但是很快被忠于总统的武装力量击退。瓦加斯宣布里约进入戒严状态，策动政变的将领被逮捕。"
 tib.4.a:0 "有惊无险。"
 
 tib.5.t:0 "Tibet地方政府拒绝和平解放"
 tib.5.d:0 "Tibet地方政府拒绝了我们提出的和平解放条件，并要求我们尊重其非法的主权。Tibet当局已经开始组织藏军试图抵抗。"
 tib.5.a:0 "确定。"
 
 tib.6.t:0 "Tibet面临中国威胁"
 tib.6.d:0 "国防部长恩里克·洛特向议会提出了要求弹劾总统卡洛斯·卢斯的提议，他指责卡洛斯阴谋阻挠1955总统大选的候选人儒塞利诺·库比契克参与选举。最终，继任仅仅三天的卡洛斯·卢斯被议会弹劾，众议院领袖内雷乌·拉莫斯接替总统职位。"
 tib.6.a:0 "多事之秋。"
 
 tib.7.t:0 "来自[From.GetName]的保护"
 tib.7.d:0 "1955年，新一届巴西总统选举开始。已经73岁高龄的现总统瓦加斯决定放弃连任机会。来自社会民主党的洛奥里桑特市市长儒塞利诺·库比契克和来自国家民主联盟的胡亚雷斯·塔沃拉将军进行竞争。"
 tib.7.a:0 "确定。"
 tib.7.b:0 "确定。"
 
 tib.8.t:0 "[From.GetName]宣布保护Tibet"
 tib.8.d:0 "儒塞利诺在担任洛奥里桑特市市长时，曾大力推动当地经济发展。现在他已经成为总统，准备将他的改革计划推广到全国，内容包括大力发展交通、教育和重工业等。"
 tib.8.a:0 "我们应当大力支持！"
 tib.8.b:0 "多此一举。"
 
 tib.9.t:0 "Tibet拒绝我们的保护"
 tib.9.d:0 "儒塞利诺提出了一项大胆的建设计划——为了加快内地发展、扩大内需和远离保守势力盘踞的里约，他决定在中央高地建设一座新的城市，作为新的首都。"
 tib.9.a:0 "我们应当大力支持！
 tib.9.b:0 "多此一举。"
 
 tib.10.t:0 "CCP解放Tibet"
 tib.10.d:0 "在中国人民解放军的攻击下，落后的Tibet军队一触即溃，解放军开始沿川藏铁路一路进军。在一些开明人士的劝解下，Dalai Lhama及其噶厦内阁决定接受中国共产党的条件，宣布Tibet和平解放。随着人民解放军进入Lhasa，CCP控制了中国最后一块未被解放的地区。"
 tib.10.a:0 "太棒了！"
 tib.10.b:0 "多此一举。"
 
 tib.11.t:0 "十七条协议"
 tib.11.d:0 "在经历三年的建造开发之后，一座崭新的、美丽的、现代化的都市终于在巴西中央高地拔地而起，她被命名为“巴西利亚”，成为了巴西共和国新的行政首都。"
 tib.11.a:0 "太棒了！"
 
 tib.12.t:0 "Tibet当局请求和谈"
 tib.12.d:0 "在人民解放军英勇作战之下，藏军溃不成军，Tibet当局在Dalai Lhama和班禅授意下，向我们提出和谈，表示愿意接受和平解放协议。"
 
 tib.12.t:0 "Tibet临时政府选举"
 
 tib.13.t:0 "Tibet民主改革"
 
 tib.14.t:0 "Tibet叛乱！"
 
 tib.15.t:0 "Dalai Lhama请求庇护"
 
 tib.16.t:0 "中国放弃Tibet主权"
 
 tib.17.t:0 "与Tibet地方政府合作"
 
 tib.18.t:0 "来自内地的合作"
 
 tib.19.t:0 "更敦群培去世"
 
 tib.20.t:0 "Lhasa发生游行示威
 
 tib.21.t:0 "Tibet废除农奴制"
 
 tib.22.t:0 "Tibet制定宪法"
 
 tib.23.t:0 "Tibet议会选举"
 
 tib.24.t:0 "Lhasa爆发示威"
 
 tib.25.t:0 "Tibet人民起义"
 
 tib.26.t:0 "北京与Lhasa进行接触"
 
 tib.30.t:0 "India is going to hold an Asian Relations Conference"
 
 tib.31.t:0 "Asian Relations Conference held in Delhi"
 tib.31.d:0 "After India gained independence, in order to improve relations with neighboring countries and enhance international influence, it announced the convening of the Asian Relations Conference and invited Asian countries to participate in New Delhi."
 
 tib.32.t:0 "Tibet represents participation in the Asian Relations Conference"
 tib.32.d:0 "Representatives from the government of Tibet Dalai Lhama participated in the Asian Relations Conference held in India, which caused dissatisfaction from the Republic of China government as legally, Tibet is still a territory of China."
 
 tib.33.t:0 "China Protests against Tibet's Participation in Asian Relations Conference"
 tib.33.d:0 "The Republic of China Ministry of Foreign Affairs protested against Tibet's participation in the Asian Relations Conference."
 
 tib.34.t:0 "Tibet leave the Asian Relations Conference"
 tib.34.d:0 "Under pressure from the Republic of China, the Indian government has had to inform Tibet representatives that they will not be able to attend events after the Asian Relations Conference."
 
 tib.35.t:0 "India Ignores Chinese Protests"
 tib.35.d:0 "India has ignored the diplomatic pressure from the Republic of China and announced that Tibet representatives will continue to participate in Asian Relations Conference related activities."
 
 tib.36.t:0 "Tibet authorities expel Nanking Authority"
 
 tib.40.t:0 "Tibet当局请求和谈"
 tib.40.d:0 "在人民解放军英勇作战之下，藏军溃不成军，Tibet当局在Dalai Lhama和班禅授意下，向我们提出和谈，表示愿意接受和平解放协议。"