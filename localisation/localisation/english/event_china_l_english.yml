l_english:
 prc.1.t:0 "北平解放"
 prc.1.d:0 "我们已经解放了大半个中国，即将建立属于人民的新国家政权。是时候决定人民政府以后的首都了。"
 prc.1.a:0 "北平拥有悠久的历史，是多个朝代的首都，定都于此有特殊意义。"
 
 prc.2.t:0 "PLA occupied Nanking!"
 prc.2.d:0 "The people's Liberation Army crossed the Yangtze River and invaded Nanjing, the capital of the Republic of China. President Chiang Kai Shek and officials of the Republic of China fled Chongqing by plane. The Kuomintang defenders in the city fled in disorder. The PLA occupied the presidential palace in Nanjing and raised the banner of the Communist China."
 prc.2.a:0 "If there is love in the sky, it will also be old. The right path in the world is the vicissitudes of life."
 
 prc.3.t:0 "Founding of the people's Republic of China!!!"
 prc.3.d:0 "Today will be one of the most important days in the history of China and even the world. In the morning, tens of thousands of people's Liberation Army and Beijing citizens gathered in Tiananmen Square, waiting for the founding of new China. After the spectacular military parade, Mao Zedong, Zhou Enlai, Song Qingling, Lin Biao and other new Chinese leaders boarded the Tiananmen Gate Tower and were warmly cheered by the masses and soldiers. Later, Chairman Mao Zedong solemnly announced that the Central People's Government of the people's Republic of China was established today!"
 prc.3.a:0 "中华人民共和国万岁！世界人民大团结万岁！"
 
 prc.4.t:0 "Liberation of Xinjiang"
 prc.4.d:0 "The People's Daily reported that after a long journey, the People's Liberation Army finally arrived and occupied Urumqi, putting an end to the separatist rule of Xinjiang warlords. The People's Liberation Army quickly ordered the abolition of the serfdom system and arrested several unpopular landlords under the guidance of local people, gaining the support of the people of Xinjiang"
 prc.4.a:0 "亚克西！"

 prc.5.t:0 "PLA occupied Lhasa"
 prc.5.d:0 "As the Tibetan government and its army were defeated by the people's Liberation Army, Tibetan nobles fled one after another. The Tibetan people broke their shackles and ushered in the day when they became masters of their own affairs. Surrounded by Lhasa citizens, PLA soldiers entered Lhasa and raised a bright five-star red flag in front of the Potala Palace."
 prc.5.a:0 "扎西德勒！"

 prc.6.t:0 "Canton Liberation"
 prc.6.d:0 "The People's Daily reported that after the Nationalist Army retreated, the People's Liberation Army troops entered the center of Guangzhou and held an entry ceremony at the Chiang Kai shek Memorial Hall. The People's Liberation Army subsequently raised the flag at Huangpu Military Academy, and the generals of the Communist Party returned to their alma mater to reminisce."
 prc.6.a:0 "黄埔啊，很久没回来了。"

 prc.7.t:0 "Qian Xue-Sen请求回国" 
 prc.7.d:0 "在美国留学的中国导弹技术专家Qian Xue-Sen先生在得知中国国防建设急需专业人才后，向北京发出了回国要求。"
 prc.7.a:0 "保持警惕，他跟国民政府关系亲密。"
 prc.7.b:0 "当然热烈欢迎。"

 prc.8.t:0 "Soviet Union顾问"
 prc.8.d:0 "Soviet Union政府为了援助我国的国防事业建设，准备派遣几位优秀的科学家前来指导。"
 prc.8.a:0 "热烈欢迎Soviet Union同志！"
 prc.8.b:0 "没有必要。"

 prc.9.t:0 "Land reform"
 prc.9.d:0 "CCP中央发布《关于土改运动的指示》在全国范围内开展土地改革运动。党根据先前土地革命的经验，将没收的富农、地主的土地分配给农民，这标志着千百年来遭受封建阶级剥削的农民阶层终于又有了属于自己的土地，是我国社会主义革命和建设的巨大成就。"
 prc.9.a:0 "广大农民阶级得到解放的日子到来了！"

 prc.10.t:0 "审判地主"
 prc.10.d:0 "土地革命结束后，几十万无地地主成了问题。有人建议对这些贪婪的剥削者一律予以逮捕和严厉批评。也有人建议解放和改造部分思想进步的地主阶级，使他们以新的身份成为共和国公民。"
 prc.10.a:0 "将剥削者彻底打倒！在踩上一脚！"
 prc.10.b:0 "思想改造。"

 prc.11.t:0 "西藏叛乱！"
 prc.11.d:0 "一部分不满人民政府领导，试图恢复他们封建统治的西藏上层贵族组织武装力量，在拉萨发动了叛乱，袭击政府驻地。"
 prc.11.a:0 "立即镇压叛乱！"

 prc.12.t:0 "五年计划"
 prc.12.d:0 "CCP中央会议即将召开会议，制定新的五年计划发展方案。"
 prc.12.a:0 "优先发展军事工业"
 prc.12.b:0 "优先发展民生工业"

 prc.13.t:0 "万隆亚非国际会议"
 prc.13.d:0 "为庆祝世界上许多国家摆脱殖民主义和帝国主义统治，印尼、印度、锡兰和缅甸政府决定在印尼万隆举行亚非会议，邀请所有亚非独立国家参加，讨论第三世界集团合作、打破殖民主义枷锁的伟大事业。"
 prc.13.a:0 "这种盛会我们怎么能不参与呢？"
 prc.13.a:0 "和我们没有关系。"

 prc.14.t:0 "解放台湾"
 prc.14.d:0 "中央委员会下达命令，向盘踞在台澎金马的国民党反动派残余发动最后进攻。我们即将横跨台湾海峡，粉碎蒋家王朝的最后根据地，解放我国神圣领土台湾！"
 prc.14.a:0 "打倒蒋匪，解放台湾！"

 prc.15.t:0 "朝鲜战争爆发"
 prc.15.d:0 "来自朝鲜战场的消息说，由美国和李承晚伪军为首的联合国已越过三八线，正向朝鲜进发，即将抵达中朝边境的鸭绿江。美国飞机进入中国领空挑衅，其指挥官叫嚣在鸭绿江边饮马，严重威胁中国东北安全。"
 prc.15.a:0 "派出志愿军，将美国侵略者赶出朝鲜！"
 prc.15.a:0 "台湾问题优先。"

 prc.16.t:0 "联合国军请求谈判"
 prc.16.d:0 "联合国部队给我们发了一个信息，希望签署一项停火协议。"
 prc.16.a:0 "我们的目的已经达到。"
 prc.16.a:0 "绝不！一定要解放全朝鲜！"

 prc.17.t:0 "斯大林的生日"
 prc.17.d:0 ""
 prc.17.a:0 "我们将前去祝贺"
 prc.17.a:0 "与我们无关。"

 prc.18.t:0 "Soviet Union的要求驻扎旅顺"
 prc.18.d:0 "在斯大林生日宴会上，Soviet Union的外交官员向我们提出了保持Soviet Union对大连旅顺港控制权的提议。"
 prc.18.a:0 "决不！Soviet Union必须交还旅顺！"
 prc.18.a:0 "这对我国是有益的。"

 prc.19.t:0 "Qian Xue-Sen被捕！"
 prc.19.d:0 "Qian Xue-Sen先生在回国的前一晚突然被美国联邦调查局逮捕！美国人认为他是为北京盗取和提供导弹技术的间谍！"
 prc.19.a:0 "无稽之谈。"

 prc.20.t:0 "Qian Xue-Sen抵达"
 prc.20.d:0 "经过多方努力，Qian Xue-Sen终于突破美国人的阻挠，回到了祖国。现在他已经摩拳擦掌，准备为新中国的国防事业作出自己的贡献了。"
 prc.20.a:0 "热烈欢迎！"

 prc.21.t:0 "Qian Xue-Sen遇害"
 prc.21.d:0 "美国传来令人悲哀的消息：Qian Xue-Sen不久前在联邦调查局的监狱中离奇死亡，美国拒绝透露具体死因。"
 prc.21.a:0 "邪恶的美帝！"

 prc.22.t:0 "596工程"（原子弹）政策触发
 prc.22.d:0 "随着国际局势不断趋向紧张，加强国防力量并提升我国国际地位的重要性也随之上升，而最重要的一步就是我们必须要研发属于我们自己的核武器。现在我们的科研人员和一切必要资源都已经就位，可以开始实行596工程了。"
 prc.22.a:0 "（批准）"增加596Project精神 +80PP
 prc.22.a:0 "（反对）"-80PP

 prc.23.t:0 "640工程"
 prc.23.d:0 "随着科技的发展，美苏等大国都已经拥有了弹道导弹技术，为了避免我国军事实力的落后，我们也必须尽快启动导弹技术的开发。"
 prc.23.a:0 "（批准）"增加596Project精神 +80PP
 prc.23.a:0 "（反对）"

 prc.24.t:0 "《关于正确处理人民内部矛盾的问题》"
 prc.24.d:0 "随着百花齐放政策之后，针对中国共产党的批评不断出现，毛泽东认为这是资产阶级右派开始全面反扑的标志。对此，毛泽东发表了《关于正确处理人民内部矛盾的问题》，认为CCP现在不仅需要处理敌我矛盾，还需要处理人民内部矛盾，即左派群众和右派敌对势力的矛盾。"
 prc.24.a:0 "（批准）"
 prc.24.a:0 "（反对）"

 prc.25.t:0 "大炼钢铁运动"
 prc.25.d:0 "在毛主席的指示下，大炼钢铁运动已经开始蓬勃发展，人民群众纷纷捐出自己家中的金属参与到冶炼中，为我国钢铁产量赶英超美的计划做出贡献。"
 prc.25.a:0 "力争上游！"

 prc.26.t:0 "人民公社运动"
 prc.26.d:0 "在毛主席的指示下，人民公社运动已经开始蓬勃发展，以大锅饭、大食堂为象征的公社将在全国各地建立，使我国跑步进步Communism。"
 prc.26.a:0 "好。"

 prc.27.t:0 "大跃进"
 prc.27.d:0 "在毛主席的指示下，我们已经开始了伟大的大跃进运动，我国将在几年内全面提升工业和农业生产力，使我国跑步进步Communism。"
 prc.27.a:0 "大跃进万岁！"

 prc.28.t:0 "粮食短缺！"
 prc.28.d:0 "由于大跃进的盲目实行和经济规划失调，我国中、南方发生了严重的自然灾害和粮食短缺，多地爆发了饥荒！"
 prc.28.a:0 "必须立即停止大跃进，纠正错误。"
 prc.28.b:0 "大跃进的路线是正确的，小小的挫折不能使其停止。"

 prc.29.t:0 "海瑞罢官"
 prc.29.d:0 "文汇出版社发表了一篇评价新剧《海瑞罢官》的文章。姚文元认为，该剧作者倾向于反革命，试图讽刺毛主席。江青支持姚，认为文艺界正在形成一个反革命的圈子。"
 prc.29.a:0 "不必理睬。"
 prc.29.b:0 "我们必须揪出文艺界中的走资派！"

 prc.30.t:0 "关于开展文化大革命的通知"
 prc.30.d:0 "CCP中央中央下发了《关于开展无产阶级文化大革命的通知》，宣布文艺界、科学界和党中都有资本家和右派，严重威胁毛主席的英明领导，号召群众动员和批评资本家、右派、封建、反动的学术权威！"
 prc.30.a:0 "一场风暴来临了"

 prc.31.t:0 "一月风暴！"
 prc.31.d:0 "Shanghai工人革命造反总司令部造反成功，夺取Shanghai市党政军权力，成立“Shanghai市革命委员会”，并得到伟大领袖毛主席支持之后，全国掀起了造反派夺权风潮！武汉、广州和北京等地都发生了原市委被推翻，成立革命委员会的运动。/n作为造反派夺权的代表人物，Shanghai革命委员会干事王洪文得到了毛泽东的器重，并以此进入CCP权力中心。"
 prc.31.a:0 "（阶级斗争优先）"
 prc.31.b:0 "（国防建设优先）"+100PP

 prc.32.t:0 "反右运动"
 prc.32.d:0 "在毛泽东不断发表文章抨击右派势力后，CCP中央公布了《划分右派分子的标准》，正式开始了反右运动。"
 prc.32.a:0 "一场风暴来临了。"

 prc.33.t:0 "Shanghai造反派夺权！"
 prc.33.d:0 "Shanghai发生政权更迭！在中央文化革命小组组长张春桥支持下，王洪文领导的Shanghai工人革命造反总司令部成员闯入Shanghai市委大院，驱逐了Shanghai市长曹狄狄等人，并宣布“走资本主义复辟路线”的Shanghai市政府解散，成立“Shanghai公社”接管Shanghai市党政军大权。"
 prc.33.a:0 "（予以支持）"
 prc.33.b:0 "（批判一番）"

 prc.34.t:0 "扩大的中央工作会议"
 prc.34.d:0 "扩大的中央工作会议在北京召开，这次的会议主要内容是总结“大跃进”以来的经验教训，进行批评和自我批评。"
 prc.34.b:0 "There is nothing wrong with Chairman Mao's line, and right-leaning forces do appear in the party!"

 prc.35.t:0 "The assassination attempt of Chairman Mao by Lin Biao's party members failed!"
 prc.35.d:0 "Comrade Mao Zedong, the great revolutionary leader and mentor, Chairman of the Central Committee of the Communist Party of China, was attacked by counter-revolutionaries in Nanjing! The enemy shot at Chairman Mao's car, but the Chairman himself was not in the car. According to the investigation, Lin Biao and his colleagues The counter-revolutionary group planned this murder!"
 prc.35.a:0 "Arrest Lin Biao immediately!"

 prc.36.t:0 "Lin Biao died!!"
 prc.36.d:0 "The counter-revolutionary leader Lin Biao crashed over the Mongolian People's Republic while fleeing by plane, killing Lin Biao, his wife and son."
 prc.36.a:0 "It's going to rain, and my mother is going to get married."

 prc.37.t:0 "Border conflict erupts at Treasure Island"
 prc.37.d:0 "Soviet Union troops have repeatedly provoked armed provocations on the border of the Ussuri River and invaded Zhenbao Island, our territory. This time they dispatched armored troops to bravely cross the frozen river. How should we respond?"
 prc.37.a:0 "(Angered at the Soviet Union)"
 prc.37.b:0 "(Peaceful)"

 prc.38.t:0 "Convention of Seven Thousand"
 prc.38.d:0 "The enlarged Central Work Conference was held in Beijing. The main content of this conference was to summarize the experience and lessons since the "Great Leap Forward", and to criticize and self-criticize. During the conference, Mao Zedong himself assumed the economic policy Responsibility for the loss, and took a back seat to Liu Shaoqi to take over."
 prc.38.a:0 "OK"

 prc.39.t:0 "Tangshan Earthquake!"
 prc.39.d:0 "Last night, an earthquake measuring 7.8 on the Richter scale broke out in Hebei Province, China. The strong shaking almost destroyed the city. The PLA threw itself into disaster relief the next morning, and it is estimated that more than 200,000 people have died. ."
 prc.39.a:0 "A terrible disaster."

 prc.40.t:0 "[PRC.GetLeader] criticized!"
 prc.40.d:0 "The president of the state arrived early to criticize the Red Guards. The long-term persecution and torture made his physical condition worsen and he was admitted to the hospital. The position of the president of the state was in name only. As the chairman of the Chinese Communist Party, Mao Zedong became the de facto leader of China."
 prc.40.a:0 "A product of political struggle."

 prc.41.t:0 "Mao Zedong passed away"
 prc.41.d:0 "Mao Zedong, the supreme leader of the People's Republic of China, who not only established a socialist China but spread his revolutionary ideas to the world, died yesterday, his departure not only marked the end of an era in China, It also means that the international left-wing movement has lost a director."
 prc.41.a:0 "The helmsman is gone, where is the boat heading?"

 prc.42.t:0 "Chairman Mao was assassinated!"
 prc.42.d:0 "Comrade Mao Zedong, the great revolutionary leader and mentor, and Chairman of the Central Committee of the Communist Party of China, was attacked by counter-revolutionaries in Nanjing! The enemy shot at Chairman Mao's car, eventually causing the car to crash and kill! After the incident, Deputy Lin Biao The chairman took over as the president of the country and declared a state of emergency across the country, and thoroughly investigate the matter!"
 prc.42.a:0 "The sky is falling!"
 
 prc.43.t:0 "Kissinger's visit to China"
 prc.43.d:0 "U.S. Secretary of State Henry Kissinger visits Beijing to discuss normalization of Sino-U.S. relations."
 prc.43.a:0 "It is time for us to normalize relations between the two countries."
 prc.43.b:0 "We have nothing to talk about with the Americans."

 prc.44.t:0 "[USA.GetLeader] visits Beijing!"
 prc.44.d:0 "Yesterday, the President of the United States [USA.GetLeader] arrived in Beijing for an official visit to the People's Republic of China. The United States and the Chinese Communist Party have long been in a state of hostility, and this visit not only symbolizes the two countries wanting each other Handing out the olive branch also marks an important step towards peace in Asia."
 prc.44.a:0 "(Welcome)"

 prc.45.t:0 "Beijing has denied our request."
 prc.45.d:0 "Kissinger's visit to Beijing was frustrated, and the Chinese government rejected an offer to restore relations with us."
 prc.45.a:0 "What a disappointment."
 
 prc.46.t:0 "China and the United States establish diplomatic relations"
 prc.46.d:0 "The Premier of the State Council of the People's Republic of China [PRC.GetLeader] and the President of the United States [USA.GetLeader] signed the Communiqué on the Establishment of Diplomatic Relations between the United States and China in Washington, announcing the official establishment of diplomatic relations between the two countries."
 prc.46.a:0 "(accept)" pp+100

 prc.47.t:0 "China and France established diplomatic relations"
 prc.47.d:0 "The leaders of the People's Republic of China [PRC.GetLeader] and the French President [FRA.GetLeader] signed the Sino-French Diplomatic Communiqué, announcing the official establishment of diplomatic relations between the two countries."
 prc.47.a:0 "(accept)" pp+100

 prc.48.t:0 "China and Japan established diplomatic relations"
 prc.48.d:0 "The leader of the People's Republic of China [PRC.GetLeader] and the Prime Minister of Japan [JAP.GetLeader] signed the Sino-Japanese Communiqué on the Establishment of Diplomatic Relations, announcing the official establishment of diplomatic relations between the two countries."
 prc.48.a:0 "(accept)" pp+100

 prc.49.t:0 "February Reverse Current" has the spirit of CultreRevolution 1967
 prc.49.d:0 ""
 prc.49.a:0 "(Angrily criticizing generals)" pp-100 National cohesion-20%
 prc.48.b:0 "(against)" pp+100

 prc.50.t:0 "Mao Zedong is dead!"
 prc.50.d:0 "Today is the saddest day for the whole Chinese people. Chairman of the Communist Party of China, the great leader and mentor Comrade Mao Zedong passed away, and the people of the whole country and the progressives of the world are immersed in grief. /n According to Chairman Mao During his lifetime, the Central Committee of the Communist Party of China will hold a meeting to elect the successor of the Chairman of the Central Committee of the Communist Party of China."
 prc.50.a:0 "The chairman highly regarded Comrade Wang Hongwen during his lifetime, and he will continue to lead the Great Proletarian Cultural Revolution."
 prc.50.b:0 "Comrade Hua Guofeng works, we can rest assured."

 prc.51.t:0 "Gang of Four rebels in Shanghai!"
 prc.51.d:0 ""
 prc.51.a:0 "(use of force)"
 prc.51.b:0 "(tried to persuade)"

 prc.52.t:0 "Gang of Four arrested!"
 prc.52.d:0 "Under the close deployment of Marshal Ye Jianying and Chairman Hua Guofeng, the Central Committee of the Communist Party of China took decisive action to arrest Jiang Qing, Wang Hongwen, Zhang Chunqiao and Yao Wenyuan, members of the Central Cultural Revolution Team, for manipulating the Gang of Four of the "Cultural Revolution" The group was completely shattered!"
 prc.52.a:0 "(Sentence according to law)" pp+100 Cohesion+10
 prc.52.b:0 "(house arrest)" pp+50

 prc.53.t:0 "The Third Plenary Session of the Eleventh Central Committee"
 prc.53.d:0 "In December 1978, the Third Plenary Session of the Eleventh Central Committee of the Communist Party of China was held in Beijing. At the meeting, the main representatives discussed whether the line of class struggle in the Cultural Revolution should be continued, whether the Cultural Revolution should be stopped, or whether it should be changed. ."
 prc.53.a:0 "We must continue Chairman Mao's consistent and correct class struggle, and let Comrade Hua Guofeng continue our cause."
 prc.53.b:0 "Emancipating the mind and seeking truth from facts is the correct line for the party's development. Restoring the leadership of Comrade Deng Xiaoping."

 prc.54.t:0 "Emancipate the mind, seek truth from facts, unite and look forward"
 prc.54.d:0 "From December 18th to 22nd, 1978, the Third Plenary Session of the Eleventh Central Committee of the Communist Party of China was held in Beijing. Since the "Great Revolution", the party's work has made serious mistakes, resulting in serious imbalances in the national economy and the consequences of trampling on democracy and the rule of law. Finally, the meeting restored the legitimate leadership of Comrade Deng Xiaoping and Comrade Hua Guofeng retired. The people will face a new Chinese leadership."
 prc.54.a:0 "Hello Xiaoping!"

 prc.55.t:0 "Reform and Opening"
 prc.55.d:0 "From December 18th to 22nd, 1978, the Third Plenary Session of the Eleventh Central Committee of the Communist Party of China was held in Beijing. Since the "Great Revolution", the party's work has made serious mistakes, resulting in serious imbalances in the national economy and the consequences of trampling on democracy and the rule of law. Finally, the meeting restored the legitimate leadership of Comrade Deng Xiaoping and Comrade Hua Guofeng retired. The people will face a new Chinese leadership."
 prc.55.a:0 "Spring thunder awakens inside and outside the Great Wall." Adds ChinaReform spirit

 prc.56.t:0 "Hong Kong Takes Back Negotiations"
 prc.56.d:0 "With the end of the 99-year lease on Hong Kong stipulated in the Hong Kong Boundary Treaty in 1997, it is time for us to prepare a dialogue with London about the future of Hong Kong."
 prc.56.a:0 "It's time to take back Hong Kong."
 prc.56.b:0 "(No interest in Hong Kong)"

 prc.57.t:0 "China seeks to reclaim Hong Kong"
 prc.57.d:0 "With the end of the 99-year lease of Hong Kong stipulated in the Hong Kong Boundary Extension Treaty in 1997, the Government of the People's Republic of China seeks to reclaim Hong Kong's sovereignty."
 prc.57.a:0 "This is a historical necessity."
 prc.57.b:0 "It's impossible!"

 prc.58.t:0 "Britain refuses to return Hong Kong" "The country is the CCP
 prc.58.d:0 "After the victory of the Falklands War, London rejected the request to transfer the sovereignty of Hong Kong to the CCP."
 prc.58.a:0 "The Hong Kong issue can only be resolved by force."
 prc.58.b:0 "Only a slowdown."

 prc.59.t:0 "The liberation of Hong Kong!"
 prc.59.d:0 "The Chinese People's Liberation Army quickly captured Hong Kong with lightning speed. The British garrison in Hong Kong and the Hong Kong police were defeated and had to surrender to the PLA. The PLA landed on Hong Kong Island and captured Hong Kong at the Governor's Palace. Governor, and announced the establishment of the Hong Kong Provisional Military Control Commission."
 prc.59.a:0 "(OK)"

 prc.60.t:0 "The end of the war in Hong Kong"
 prc.60.d:0 "After fighting, the People's Liberation Army occupied Hong Kong, and London felt that it was hopeless to regain Hong Kong and was forced to declare its complete relinquishment of sovereignty over Hong Kong in exchange for expatriates and prisoners of war. Beijing agreed to this request. As the Chinese government handed over Hong Kong to Britain The governor and other prisoners have ended the 150-year British colonial rule of Hong Kong."
 prc.60.a:0 "(OK)"

 prc.61.t:0 "Sino-British Joint Declaration"
 prc.61.d:0 "Representatives of the Chinese and British governments issued a joint statement in Beijing, announcing that the United Kingdom agreed to fully return Hong Kong's sovereignty in 1997."
 prc.61.a:0 "(OK)" Remove the HKN core of 326 and add the PRC core, plus 100PP for both Chinese and English

 prc.62.t:0 "Sino-Portuguese Joint Declaration"
 prc.62.d:0 "Representatives of the Chinese and Portuguese governments issued a joint statement in Beijing, declaring that Portugal agreed to fully return Macau's sovereignty in 1999."
 prc.62.a:0 "(OK)" removes 729 Portuguese cores and adds PRC cores, plus 100PP for each of China and Portugal

 prc.63.t:0 "Vietnamese Chinese Exclusion Movement"
 prc.63.d:0 "Le Duan, the leader of the Communist Party of Vietnam, launched an "anti-capitalist movement" in Vietnam today, labeling many overseas Chinese and Chinese businessmen as "capitalists" and "remains of the South Vietnamese regime", detaining, persecuting and expelling many. The Chinese were forced into exile in Hong Kong, and they wanted mainland China to stop Vietnam."
 prc.63.a:0 "Everyone is Chinese and should help each other."
 prc.63.b:0 "Don't ask us about the capitalists."

 prc.64.t:0 "Vietnam invade South China sea!"
 prc.64.d:0 ""
 prc.64.a:0 "(Criticism)"-300pp National Cohesion-20%

 prc.65.t:0 "Pol Pot visits China"
 prc.65.d:0 "Cambodian Communist Party leader Pol Pot wants to visit China, learn about the Chinese Cultural Revolution movement and buy weapons from China. Although Pol Pot, like us, is a Marxist who opposes Vietnamese revisionism, there are There are rumors that Pol Pot was engaged in a "big purge" in the country, suppressed democrats and put our old friend King Sihanouk under house arrest, and some comrades advised us not to host him."
 prc.65.a:0 "In any case, Comrade Pol Pot is our comrade in arms against Vietnam." set flag ChinaVietConflit -50pp
 prc.65.b:0 "We don't welcome fake communists, real fascist hypocrites." +100pp

 prc.66.t:0 "Vietnam invades Cambodia!"
 prc.66.d:0 "The Le Duan reactionary group in Vietnam has launched an invasion against our Cambodian comrades. Once Vietnam is victorious, its power in Southeast Asia will be greatly enhanced, threatening the security of our southwest. Our army is ready to fight against Vietnam. Preparation for battle."
 prc.66.a:0 "Initiate an immediate operation against Vietnam!"
 prc.66.b:0 "Wait a minute, not now."

 prc.67.t:0 "Operations against Vietnam are going well"
 prc.67.d:0 "Under the strong offensive of the People's Liberation Army, the Vietnamese army has repeatedly retreated, and we quickly occupied Lang Son, Lao Cai and other important towns in northern Vietnam. General Xu Shiyou suggested that we pursue the victory, occupy Hanoi, and overthrow the Le Duan regime. Our friend, Comrade Vo Nguyen Giap took over as the leader of the Communist Party of Vietnam, but from a political point of view, our strategic goal of weakening the Vietnamese army has been achieved"
 
 prc.68.t:0 "Hu Yaobang passed away"
 prc.68.d:0 "On April 15, Chinese President and General Secretary of the CPC Central Committee Hu Yaobang passed away in Beijing due to illness. During his tenure as General Secretary of the CPC Central Committee and President of the People's Republic of China, Hu Yaobang actively fought against wrongful convictions and advocated freedom of speech. , supporting reform and opening up, being honest and loving the people, in stark contrast to the corrupt officials after the reform and opening up. His death left the people and their grief, and they spontaneously went to Tiananmen Square to commemorate the leader."
 prc.68.a:0 "Yaobang is immortal."

 prc.69.t:0 "Students gather at Tiananmen Square"
 prc.69.d:0 "Premier Li Peng ignored university students' demands for freedom of speech, causing dissatisfaction among citizens. They began to strike, gathering in Tiananmen Square and the university district to discuss how to continue to petition the government for a democratic political society. "
 prc.69.a:0 "The student movement is patriotic and progressive and should be supported."
 prc.69.b:0 "This is a bourgeois liberalization movement influenced by Western thought, and we must be vigilant."

 prc.70.t:0 "Li Peng meets with student representatives"
 prc.70.d:0 "After a tense confrontation between the students and the military police, Premier Li Peng finally agreed to meet the protesting students. At the request of student representatives, the TV station broadcast the whole process live."
 prc.70.a:0 "We accept students' demands for freedom of speech, association and private newspapers."
 prc.70.b:0 "We firmly reject any Western capitalist system."

 prc.71.t:0 "Editorial of April 27"
 prc.71.d:0 "On July 26, the People's Daily published an editorial pointing out that some abnormal situations occurred during the commemoration of Comrade Hu Yaobang. After the memorial meeting, very few people with ulterior motives continued to take advantage of the youth The students mourned Comrade Hu Yaobang and undermined the democratic legal system in the name of democracy. The purpose was to distract people's hearts, disrupt the whole country, and destroy the political situation of stability and unity. This article set off the anger of students in major universities in Beijing. The next day , tens of thousands of people organized a march across Beijing to demand the government retract the editorial."
 prc.71.a:0 "People's Daily, nonsense!"

 prc.72.t:0 "Oi Conflict"
 prc.72.d:0 "On the order of the Central Military Commission, PLA martial law troops entered downtown Beijing by bus and were found by demonstrators as they passed the Dajing road section. They broke into the bus and drove the soldiers out to snatch their guns. Strictly abiding by the discipline of "the people's army does not harm the people", instead of fighting back, they sat on the spot and confronted the demonstrators. However, when one soldier was pushed to the ground by the demonstrators, another angry soldier beat the other with a helmet. The blood was broken. The People's Liberation Army then withdrew from the scene. Soon, bloody clashes broke out with demonstrators in other parts of Beijing."
 prc.72.a:0 "Keep calm, the People's Army can never harm the people."
 prc.72.b:0 "The liberals have lost their minds, and immediately began to clear the scene by force."

 prc.73.t:0 "Clearing begins"
 prc.73.d:0 "At midnight on June 3, PLA martial law troops driving armored vehicles began to march towards Tiananmen Square from all directions. When passing through Muxidi, another armed demonstrators appeared with stones and wooden sticks to attack the PLA. A Type 63 troop carrier was burned, a truck was pushed over, and after more than a dozen soldiers were injured or killed, the martial law troops finally opened fire. After killing more than 30 demonstrators, they broke through Muxidi and rushed towards Tiananmen Square, continuing to fire on the crowd along the way. , Fuxingmen Street became a battlefield. In the early morning of June 4, the broadcast on Tiananmen Square issued an order to immediately evacuate the uneasy crowd, and then martial law troops surrounded the crowd in the square."
 prc.73.a:0 "They are killing themselves."

 prc.74.t:0 "The Fate of Tiananmen"
 prc.74.d:0 "Just as the martial law troops were on guard, preparing for a bloodier clash with the demonstrators in the square, university teacher Liu Xiaobo, Taiwanese singer Hou Dejian, freelance writer Zhou Duo and student Gaoxin took the ambulance. The car came to the side of the unit and met with its commander. The four requested that the crowd in the square leave peacefully, and the People's Liberation Army can be stationed peacefully."
 prc.74.a:0 "Today enough people have died in Beijing. Our goal is to clear the scene, not to kill."
 prc.74.b:0 "When the mentally retarded burned the PLA's body and hung it, did they think it was atrocity? Reciprocity."

 prc.75.t:0 "Tiananmen Massacre"
 prc.75.d:0 "After Liu Xiaobo and others were arrested and taken away, the martial law troops began to forcefully clear Tiananmen Square. At 4:00 a.m. on June 4, several armored vehicles rushed into Tiananmen Square and fired machine guns at the crowd. , crushed the tents in the square. Some students tried to fight back with guns and sticks, but all fell under the guns. The citizens scattered and fled to the southwest, but were attacked by the troops stationed there at Liubukou. At 6:30 in the morning, martial law troops successfully entered Tiananmen Square, which was already bloodied, and the official announcement was made that the clearing operation was over."
 prc.75.a:0 "Today enough people have died in Beijing. Our goal is to clear the scene, not to kill."

 prc.76.t:0 "Peaceful Clearing"
 prc.76.d:0 "After the negotiation of the four gentlemen in the square, the martial law troops and the demonstrators finally reached an agreement. At 4:00 a.m. on June 4, the demonstrators in the square had to put away their flags, lined up, and sang the Internationale , evacuated to the southwest, and then the soldiers replaced their guns with wooden sticks and entered the Monument to the People's Heroes. Although small-scale physical clashes inevitably occurred during this process, most of the demonstrators left safely in the end, and the martial law troops stationed peacefully Tiananmen Square."
 prc.76.a:0 "Today enough people have died in Beijing. Our goal is to clear the scene, not to kill."

 prc.77.t:0 "The Third Leadership Core"
 prc.77.d:0 "After experiencing the June 4th political turmoil, Deng Xiaoping and other senior CCP elders realized that the moderate reformists headed by Zhao Ziyang could no longer lead the CCP against the ideological infiltration of the West in the future, and they needed to choose another A leader who can maintain the continuity of state power. Some people suggest that Premier Li Peng, who is cautious and decisive in the political turmoil, should be the next general secretary, but there are also people who recommend the city of Jiang Zemin, who peacefully handled the demonstrations in Shanghai."
 prc.77.a:0 "Comrade Jiang Zemin will lead our party toward the path of peaceful development."
 prc.77.b:0 "Comrade Li Peng will help our party deal with bourgeois liberalization."

 prc.78.t:0 "Gorbachev's visit to China"
 prc.78.d:0 ""
 prc.78.a:0 "(Welcome)"
 prc.78.b:0 "(reject)"

 prc.79.t:0 "Soviet Union under reorganization"
 prc.79.d:0 ""
 prc.79.a:0 "(Accept)" Communism+10%
 prc.79.b:0 "(reject)"

 prc.80.t:0 "Beijing Spring"
 prc.80.d:0 ""
 prc.80.a:0 "The power of the people and democracy is invincible!" Democracy +50 allows elections

 prc.81.t:0 "Student leaders launch hunger strike"
 prc.81.d:0 ""
 prc.81.a:0 "Forget it, talk to them."
 prc.81.b:0 "We will never compromise with counter-revolutionaries!"

 prc.82.t:0 "New leadership group" (not required here)
 prc.82.d:0 ""
 prc.82.a:0 "Zhao Ziyang"

 prc.84.t:0 ""Suggestions to Chairman Mao and Premier Zhou""
 prc.84.d:0 "In response to the policy of "Let a hundred flowers bloom and a hundred schools of thought contend", Wen Wei Po editor-in-chief Chu Anping wrote and published "Suggestions to Chairman Mao and Premier Zhou". In the article, Chu Anping criticized the ruling Communist Party Since then, sectarianism has been serious, the relationship between the party and the masses has deteriorated, and a de facto "party world" has been formed. As soon as this statement has attracted public attention, how should we view it?"
 prc.84.a:0 "This is a bourgeois counterattack!"

 prc.85.t:0 "New leadership group"
 prc.85.d:0 ""
 prc.85.a:0 "Jiang Qing"
 prc.85.b:0 "Wang Wenhong"

 prc.86.t:0 "The Second National People's Congress"
 prc.86.d:0 ""
 prc.86.a:0 "Liu Shaoqi"
 prc.86.b:0 "Zhou Enlai"

 prc.87.t:0 "Cry out loud"
 prc.87.d:0 "Comrade Mao Zedong published an article calling on the literary and art circles to freely express their opinions on political issues, a hundred schools of thought contend, and a hundred flowers bloom."

 prc.88.t:0 "The Third Plenary Session of the Eleventh Central Committee"
 prc.88.d:0 "In 1978, the historic Third Plenary Session of the Eleventh Central Committee of the Communist Party of China was held. This meeting further criticized the reformers led by Deng Xiaoping, causing Deng to resign again shortly after the meeting. Hua Guo Through this meeting, Premier Feng further consolidated his position, insisting on class struggle and his proposed "two whatevers" line."

 prc.89.t:0 "Wang Hongwen was elected chairman of the CPC Central Committee"
 prc.89.d:0 "Chinese Premier Hua Guofeng was forced to announce his resignation from all positions under pressure from the Gang of Four and its supporters. Wang Hongwen, a former third-ranking member of the CCP and a member of the Gang of Four, went to Beijing and was appointed and dismissed as the interim President of the CCP Central Committee. secretary."

 prc.90.t:0 "Wang Hongwen was elected chairman of the CPC Central Committee"
 prc.90.d:0 "After the power struggle, Wang Hongwen, the interim general secretary of the CPC Central Committee, won an unexpected victory, consolidated his position, and turned from interim general secretary to a full-time general secretary. General secretary Wang met with the whole nation who supported him in Tiananmen Square. Workers' representatives, promise to persevere in the class struggle to the end."

 prc.91.t:0 "The PLA occupied Changchun"
 prc.91.d:0 "After a long siege, the National Army of the Republic of China in Changchun City was forced to surrender, and the Chinese People's Liberation Army led by the Communist Party of China announced its entry into Changchun."

 prc.92.t:0 "The PLA occupied Shenyang"
 prc.92.d:0 "After fierce fighting, the Chinese People's Liberation Army occupied Shenyang, a key town in northeastern China, and several national army generals were captured. The balance of victory seems to have begun to tilt in favor of the Chinese Communist Party."

 prc.93.t:0 "The PLA occupied Kaifeng"
 prc.93.d:0 "After fierce fighting, the North China Field Army of the Chinese People's Liberation Army occupied Kaifeng City, the capital of Henan Province, China's most populous province, and the door to the PLA's intrusion into the Chinese hinterland has been opened."

 prc.94.t:0 "The PLA occupied Xuzhou"
 prc.94.d:0 "After fierce fighting, the People's Liberation Army occupied Xuzhou, the most important transportation hub in eastern China. Now, Nanjing, the capital of the Republic of China, is in front of the CCP troops."

 prc.95.t:0 "The PLA occupied Chongqing"
 prc.95.d:0 "After fierce fighting, the Chinese People's Liberation Army occupied Chongqing, the capital of the Republic of China and the political center of Southwest China. So far, the Chinese People's Liberation Army has occupied more than two-thirds of China's territory."

 prc.96.t:0 "The PLA occupied Shanghai"
 prc.96.d:0 "After a few more days of fighting, the National Army's plan to "defend the Greater Shanghai" ushered in complete failure. The Chinese People's Liberation Army successfully occupied the largest and most prosperous city in China."

 prc.97.t:0 "胡风案"
 prc.97.d:0 "文艺评论家胡风在《希望》杂志发表文章，对CCP的部分文化政策提出不同意见。胡风虽然拥护中国共产党，但长期以来却提出不同的文化政策观点。以中宣部副部长周扬为首的一些官员主张批评胡风的言论。"
 prc.97.a:0 "多此一举"
 prc.97.b:0 "胡风也许在策划着什么……"

 prc.98.t:0 "胡风“反革命集团”案"
 prc.98.d:0 "CCP中央发布文件，指责在文化领域提出不同意见的作家胡风为“琴蒋介石的反革命分子”，胡风被捕，多人受牵连。"

 prc.99.t:0 "三反运动扩大化"
 prc.99.d:0 "“三反”运动的胜利，巩固了工人阶级的领导地位和社会主义国营经济在国民经济中的领导地位，为对资本主义工商业和资产阶级进一步的社会主义改造创造了有利条件。一些党员主张将三反运动扩大化，进行反行贿，反偷税漏税，反偷工减料，反盗骗国家财产，反盗窃国家经济情报的“五反”运动。"
 prc.99.a:0 "很有必要"
 prc.99.b:0 "多此一举"

 prc.100.t:0 "三反运动扩大化"
 prc.100.d:0 "With the success of the three evils movement, the Communist Party of China began to expand the three evils movement and carry out the five evils movement to combat the remnants of capitalism in economic activities."

 prc.101.t:0 "“五反”运动的负面后果"
 prc.101.d:0 "“五反”运动导致了严重的经济后果，许多企业倒闭，企业家因冤假错案入狱或死亡。"

 prc.102.t:0 "上山下乡"
 prc.102.d:0 "毛泽东发表文章，提出”广阔天地，大有作为“，呼吁知识青年到农村去，接受贫下中农的再教育。在毛泽东支持下，许多中国知识分子前往农村，这一是为了锻炼知识青年，让他们参与到农村建设工作，另一方面也是通过疏散激进的学生以缓解文化大革命带来的负面破坏。"
 
 prc.103.t:0 "Mao Zedong's influence"
 prc.103.d:0 "As the generation of young people brought by the post-war baby boom grew up, they began to actively participate in political activities to fight against the conservative political atmosphere and American hegemony. Among these young people, the political theory of Chinese leader Mao Zedong is very popular. Mao Zedong not only fiercely attacked imperialism, hegemonism and unjust war, but also actively supported young people to participate in politics, making him the most popular politician of this generation."

 prc.104.t:0 "中华人民共和国的合法席位"
 prc.104.d:0 "近年来，随着以毛主席为代表的新中国逐渐崛起，在国际上屡屡发声。不仅亚非拉许多革命者、群众认可了中国成为第三世界兄弟和领袖，同时也有许多第二、第一世界的发达国家的进步学生、知识分子和无产阶级群众倒向马列毛思想。在这样的背景下，经过新中国外交人员的坚定努力，被称为世界一极的美国终于不能继续在联合国上否定新中国的地位了。\n于是，在一次不同寻常的代表会议上，由美苏等常任理事国带头，发起了一次承认中华人民共和国合法席位的联合国投票。国民党政权的代表虽然愤怒，但也无可奈何，只能以离席抗议。"
 prc.104.a:0 "支持！"
 prc.104.b:0 "反对。"
 
 prc.105.t:0 "The People's Republic of China's Return to the United Nations"
 prc.105.d:0 "After a tense round of voting, the People's Republic of China restored its rightful seat in the United Nations, replacing the Republic of China in Taiwan as the only representative of China."
 prc.105.a:0 "OK"
 
 prc.106.t:0 "联合国拒绝北京"
 prc.106.d:0 "以美国为首西方国家违背中美之间建立的外交承诺，组织活动，在联合国问题上继续抗拒新中国的参与。苏联等东方阵营国家则因为一些外交问题保持沉默。看来北京的新中国政权要全面打破外部封锁，还有很长的路要走。"
 prc.106.a:0 "支持"
 prc.106.b:0 "反对"
 
 prc.107.t:0 "建设新北京"
 prc.107.d:0 "中国共产党政府在他们的新首都北京开展了一系列建造工程，他们拆除了北京旧城墙，在天安门前建造了一个宏大的广场，这将是世界上最大的城市广场。广场周围还有人民大会堂、中国革命博物馆、人民英雄纪念碑等新建筑。"
 prc.107.a:0 "OK."
 
 prc.108.t:0 "Shanghai工人武装暴动！"
 prc.108.d:0 "文化大革命导致的动乱终于走向战争！在躲过华国锋政府的追捕后，以王洪文、江青、张春桥为首的中央文革小组连夜逃往Shanghai，组织起用户自己的Shanghai工人武装，否认北京中央的合法性并与之对抗，全国多地的红卫兵也积极响应，中国再次陷入内战的威胁之中！"
 prc.108.a:0 "OK."
 
 prc.109.t:0 "美国向中国提供军事技术"
 prc.109.d:0 "美国向中国提供了一批先进武器装备，以帮助人民解放军进行军事现代化。"
 prc.109.a:0 "中美关系变得日益紧密"
 
 prc.110.t:0 "Soviet Army invade China!"
 
 prc.111.t:0 "Soviet Army invade China!"
 prc.111.d:0 "The war between the Soviet Union and China was a disaster for the socialist camp. Although the Soviet Union demanded that we fulfill our responsibilities under the Warsaw Treaty, reason told us not to participate in this conflict."
 
 prc.112.t:0 "[From.GetName] wthdrawal from the Warsaw Treaty Organization"
 prc.112.d:0 "[From.GetName] refused to fulfill its responsibilities as a member of the Warsaw Treaty, and they denounced the Soviet Union's military actions as a hegemonic act of great powers that completely violated socialist ideals."
 
 prc.113.t:0 "The war against China is in crisis."
 prc.113.d:0 "The resistance of the Chinese army has greatly exceeded our expectations. We have difficulty making progress on the Chinese battlefield, but our army is no longer able to continue attacking, and our economy and internal affairs are also about to be dragged down. We have to consider peace talks with China."
 
 prc.114.t:0 "The withdrawal of Soviet troops from China"
 prc.114.d:0 "After enduring a prolonged war, the Soviet army was forced to withdraw from the areas they occupied, and the Chinese People's Liberation Army was no longer able to pursue, resulting in a ceasefire between the two countries."
 
 chinawar.2.t:0 "Luhan announced coup!"
 
 prc.115.t:0 "[FROM.GetName] hope to establish diplomatic relations with ua"
 
 prc.116.t:0 "[ROOT.GetName] establish diplomatic relations with PRC"
 prc.116.d:0 "[ROOT.GetName] Announce the establishment of diplomatic relations with the People's Republic of China and suspend diplomatic relations with the Republic of China."
 prc.116.a:0 "The influence of the People's Republic of China is increasing."
 
 prc.117.t:0 "The Beijing government hopes to improve its relationship with [ROOT.GetName]"
 prc.117.d:0 "The leader of the People's Republic of China [PRC.GetLeader] expressed his hope to establish friendly relations with [ROOT.GetName]."
 prc.117.a:0 "OK."
 
 prc.118.t:0 "China announces support for the struggle of [ROOT.GetName]"
 prc.118.d:0 "The People's Republic of China announced that it will firmly support the struggle of the [ROOT.GetName] people against imperialism and its puppet regime."
 prc.118.a:0 "OK."
 
 prc.119.t:0 "The Red Guards launched the campaign to break through the Four Olds!"
 prc.119.d:0 "The Cultural Revolution further intensified, and the Chinese Red Guards launched the campaign to break through the Four Olds!"
 prc.119.a:0 "OK."
 
 prc.120.t:0 "China proposes the overall line of socialist construction"
 prc.120.d:0 "The Chinese government has proposed the overall line of socialist construction, hoping to muster up enthusiasm, strive for excellence, and build socialism in a more efficient, faster, and more efficient manner."
 prc.120.a:0 "OK."
 
 prc.121.t:0 "The establishment of the Asian People's Revolutionary United Front!"
 prc.121.d:0 "The government of the People's Republic of China has announced the establishment of allies with multiple Asian socialist countries. After the deterioration of relations with the Soviet Union, China chose to establish its own camp to confront US Soviet hegemony."
 prc.121.a:0 "OK."
 
 prc.122.t:0 "Establishment of Shenzhen Special Zone Investment Promotion Bureau"
 prc.122.d:0 "The Chinese government has announced the establishment of a China Merchants Group in the Shenzhen Special Economic Zone to attract foreign investment from Hong Kong and Taiwan to establish factories."
 prc.122.a:0 "OK."
 
 prc.123.t:0 "The Chinese government issues a decision on economic system reform"
 prc.123.d:0 "The Chinese government has announced reforms for existing enterprises, especially state-owned enterprises, including expanding enterprise autonomy, introducing more market regulation and private components, and improving bankruptcy and transfer mechanisms for loss making state-owned enterprises."
 prc.123.a:0 "OK."
 
 prc.124.t:0 "The CPC issues RMB"
 prc.124.d:0 "The CPC announced the establishment of the People's Bank of China, and began to issue the first set of currency in its liberated areas, called Renminbi(People's currency)."
 prc.124.a:0 "OK."
 
 prc.125.t:0 "Establishment of the People's Liberation Army of China"
 prc.125.d:0 "Mao Zedong, the leader of the CPC, officially announced that all armed forces under the Communist Party, including the Northeast Democratic Union Army, would be merged into a unified People's Liberation Army."
 
 prc.126.t:0 "Contact between the CPC and Sinjang Revolutionary Government"
 prc.126.D:0 "The CPC contacted the revolutionary government of Sinjang Ili and discussed the possibility of Sinjang joining the new Chinese government in the future."
 
 prc.124.t:0 "新疆革命政府加入中国共产党"
 
 prc.124.t:0 "新疆革命领袖在扎巴依喀勒山坠机遇难"
 
 chinawar.3.t:0 "The Chinese Communist Army occupies Jinzhou"
 chinawar.3.d:0 "After fierce fighting, the Chinese Communist Army occupied Jinzhou, an important transportation hub from mainland China to the Northeast region. As a result, the supply route from the mainland to the Northeast was cut off, and the Nationalist Army stationed in the Northeast region was actually in a state of siege"
 chinawar.3.a:0 "OK."
 
 chinawar.4.t:0 "The Nationalist army occupied Yan'an"
 chinawar.4.d:0 "After fierce fighting, the Nationalist army occupied the central headquarters of the Communist Party of China in Yan'an, and Mao Zedong and other Communist leaders withdrew northward."
 chinawar.4.a:0 "OK."
 
 chinawar.5.t:0 "The Sinkiang government announces joining the Communist"
 chinawar.5.d:0 "With the collapse of the Kuomintang army and the occupation of most parts of Chinese Mainland by the Chinese Communist army, the Xinjiang Provincial Government decided to turn against it."
 chinawar.5.a:0 "OK."
 
 chinawar.6.t:0 "Li Zong-Ren Acting as President of the Republic of China"
 chinawar.6.d:0 "Due to unfavorable frontline operations and political opposition, Kuomintang President Chiang Kai-shek was forced to announce his resignation, and Li Zongren acted as the President of the Republic of China."
 chinawar.6.a:0 "OK."
 
 chinawar.7.t:0 "Border Conflict between Xinjiang and Mongolia"
 chinawar.7.d:0 "The border conflict between Xinjiang Province of the Republic of China and the People's Republic of Mongolia broke out in the Mount Baytak. Mongolia accused the Usman Kazakh armed forces supported by the Republic of China of invading Mongolia, while the Nanjing government accused Mongolia of invading Xinjiang with the support of the Soviet Union."
 chinawar.7.a:0 "OK."
 
 chinawar.8.t:0 "The Chinese Army Recovers Mount Baytak"
 chinawar.8.d:0 "The National Army of the Republic of China achieved victory in the battle with the Mongolian army, and the National Army recaptured Mount Baytak."
 chinawar.6.a:0 "OK."
 
 chinawar.9.t:0 "The Mongolian Army occupies Mount Baytak"
 chinawar.9.d:0 "The Republic of China was defeated and retreated in the battle with the Mongolian army, and the Mongolian army occupied Mount Baytak."
 
 chinawar.10.t:0 "Tani Hisao was executed"
 chinawar.10.d:0 "After trial, the Republic of China court sentenced the main planner of the Nanking Massacre and Japanese general Tani Hisao to death."
 chinawar.10.a:0 "好死"
 
 chinawar.11.t:0 "Liberation of Shanghai"
 chinawar.11.d:0 "As the Kuomintang troops withdrew in confusion, the CPC troops entered Shanghai, China's largest city and the most important economic center."
 
 chinawar.12.t:0 "Chinese writer Zhu Ziqing passed away"
 chinawar.12.d:0 "Famous Chinese writer Zhu Ziqing passed away in Beijing. He initiated a social movement against Chiang Kai shek's authoritarian government and declared a hunger strike to boycott food aid from the United States, ultimately dying of gastrointestinal disease."
 
 chinawar.13.t:0 "The Kuomintang Issued Temporary Provisions for Mobilizing and Suppressing Rebellion"
 chinawar.13.d:0 "The government of the Republic of China announced that due to the large-scale invasion of CCP troops in northern China, in order to mobilize the national manpower and material resources to fight against Commies, a temporary mobilization and suppression clause has been issued, providing an overview of the national supply of materials and soldiers."
 
 chinawar.14.t:0 "Establishment of the Revolutionary Committee of the Kuomintang"
 chinawar.14.d:0 "With the defeat of the Chiang Kai shek government on the battlefield and the rise of the opposition, the forces opposing Chiang Kai shek within the Kuomintang planned to form another party. The anti Chiang faction within the Kuomintang, represented by Song Qingling, He Xiangning, Liu Yazi, Li Jishen, and Feng Yuxiang, established the Kuomintang Revolutionary Committee in Hong Kong, calling for the cessation of civil war and democratization."
 
 chinawar.15.t:0 "Republic of China announces the promulgation of its constitution"
 chinawar.15.d:0 "According to the concept of Sun Yat sen, the father of the Republic of China, after experiencing military and political training, the government will enter the next stage of political power - ending one party dictatorship, entering constitutional government, and carrying out democratic reforms."
 chinawar.15.t:0 "以退步求进步。"
 
 chinawar.16.t:0 "中华民国宣布行宪"
 chinawar.16.d:0 "According to the concept of Sun Yat sen, the father of the Republic of China, after experiencing military and political training, the government will enter the next stage of political power - ending one party dictatorship, entering constitutional government, and carrying out democratic reforms."
 
 chinawar.17.t:0 "Establishment of the Executive Yuan of the Republic of China"
 chinawar.17.d:0 "As part of the implementation of the Constitution by the government of the Republic of China, the Executive Yuan of the Republic of China was announced to be established to oversee national administrative affairs, with Weng Wenhao appointed as the first Premier."
 
 chinawar.18.t:0 "The KMT government announced the implementation of economic controls in Shanghai"
 chinawar.18.d:0 "Faced with the increasingly deteriorating economic situation, the government of the Republic of China has decided to take action to regulate it. The Executive Yuan dispatched an overseas team led by Chiang Ching-Kuo to Shanghai, the economic center of the country, to carry out a series of measures to control prices and crack down on speculative activities."
 
 chinawar.19.t:0 "Movement against unscrupulous merchants"
 chinawar.19.d:0 "The Shanghai Municipal Government launches a mass movement against unscrupulous merchants"
 
 chinawar.20.t:0 "杨子公司案"
 chinawar.20.d:0 "杨子公司案"
 
 chinawar.21.t:0 "Chiang Ching-Kuo Announces Resignation"
 chinawar.21.d:0 "Under the interference of forces from Nanjing, Chiang Ching-Kuo's plan to thoroughly investigate the smuggling case of Shanghai Yangtze Company was aborted, and the anti-corruption movement in Shanghai was also heavily hit. Chiang was forced to announce his resignation and leave Shanghai, and the grand economic reform was also announced to be unfinished."
 
 chinawar.22.t:0 "Kong Ling-kan arrested, Kong Xiang-xi resigned"
 chinawar.22.d:0 "According to news from Shanghai, a news report surpassed the frontline of the civil war and became the headline of China. Kong Ling-kan, the son of Minister of Finance Kong Xiang-xi, was arrested, and his Yangtze company was ordered to be shut down by Chiang Ching-Kuo for hoarding and reselling luxury goods imported from overseas. Kong Xiang-xi was forced to resign under public pressure and became the highest ranking official to be overthrown in Shanghai's economic restructuring. This greatly increased Chiang Ching-kuo's reputation and strengthened the Chinese people's confidence in the Nationalist government."
 
 chinawar.23.t:0 "Shanghai的物价开始稳定"
 
 chinawar.24.t:0 "中国政府宣布发行金圆券"
 
 chinawar.26.t:0 "中国物价与金圆券的持续崩溃"
 
 chinawar.27.t:0 "国民政府成功稳定金圆券"
 
 chinawar.28.t:0 "HMS Amethys broke into Nanking"
 chinawar.28.a:0 "进行驱逐"
 chinawar.28.b:0 "警告后放行"
 
 chinawar.29.t:0 "CCP troops sink HMS Amethyst"
 chinawar.29.d:0 "The British warship HMS Amethyst engaged in a firefight with CCP forces in Nanking. HMS Amethyst ignored CCP warnings and sailed into the Yangtze River during the Battle of Nanking. After the CCP's warnings were ineffective, HMS Amethyst was shelled and destroyed in the firefight, stranded on the shore of the Yangtze River in Nanking. Most of the ship's crew were captured by CCP. \n The HMS Amethyst incident has attracted high public attention from both China and the UK. The CCP claims to have fulfilled its promise to expel foreign troops, while the UK government angrily accuses the CCP military of being extreme and reckless."
 
 chinawar.30.t:0 "HMS Amethyst Escapes Nanking"
 chinawar.30.d:0 "The British warship HMS Amethyst engaged in a firefight with the CCP army in Nanking. HMS Amethyst ignored the CCP warning and entered the Yangtze River in the Battle of Nanking. After the CCP army's warning was invalidated, it proceeded with shelling. After the battle, HMS Amethyst struggled to escape Nanking despite suffering severe damage."
 
 chinawar.31.t:0 "HMS Amethyst evacuating Nanking"
 chinawar.31.d:0 "The British warship HMS Amethyst engaged in a firefight with CCP forces in Nanking. HMS Amethyst ignored CCP warnings and sailed into the Yangtze River in the Battle of Nanking. After careful consideration, the Chinese army issued a verbal warning and did not attack HMS Amethyst. HMS Amethyst stayed in Nanking and witnessed the occupation of the city by the CPC, and soon withdrew under the diplomatic pressure of the CCP."
 
 chinawar.32.t:0 "我们必须解救HMS Amethyst！"
 chinawar.32.d:0 "如果你选择强硬，你必须在一个月内，将你的海军部队派遣到中国东部的黄海，舰队到达后，将自动触发炮击事件，如果超过一个月内没有我方舰队进入黄海，事件将不了了之。"
 
 chinawar.33.t:0 "工党内阁遭到激烈批评！"
 chinawar.33.t:0 "HMS Amethyst事件发生后，英国舆论普遍要求采取军事行动解救被俘的水手并惩治CCP，但以首相[ENG.GetLeader]为首的工党内阁最终还是选择了息事宁人，这激怒了英国国内的各大媒体，更招来了保守党的猛烈抨击。"
 
 chinawar.34.t:0 "英国对我们发出最后通牒！"
 chinawar.34.t:0 "英国强烈谴责我们击沉HMS Amethyst并俘虏英军士兵，要求我们立刻释放并作出道歉。"
 
 chinawar.35.t:0 "CCP宣布释放HMS Amethyst船员"
 
 chinawar.36.t:0 "CCP拒绝释放HMS Amethyst船员"
 chinawar.36.t:0 "CCP政府拒绝释放被俘的HMS Amethyst水手，英国政府宣布，将派遣皇家海军前往中国海域，对CCP占领地区进行炮击。"
 
 chinawar.32.t:0 "英国海军对CCP军队发起炮击"