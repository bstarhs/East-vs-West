l_english:
 afg.5.t:0 "阿富汗政变！"
Afghan coup
 afg.5.d:0 "昨天，前阿富汗总理、国王塔希尔的叔叔穆罕默德·达乌德在军队的支持下，在国王访问瑞士期间夺取了政权！达乌德声称，这是一场共和革命，统治阿富汗三百多年的杜拉尼王朝被推翻，他本人就是这个新国家的总统。目前，新政权的准备工作正在进行，有人认为Soviet Union在幕后推动了政变。"
Yesterday, Mohammad Daoud, the former Prime Minister of Afghanistan and uncle of King Tahir, with the support of the army, seized power during the King's visit to Switzerland! Daoud claimed that it was a republican revolution that overthrew the Durrani dynasty that ruled Afghanistan for more than 300 years and that he himself is the president of the new country. Currently, preparations for a new regime are underway, and it is believed that the Soviet Union was behind the coup d'état
 afg.5.a:0 "Let's see what happens next."

 afg.10.t:0 "阿富汗政变！"
Afghan coup

 afg.10.d:0 "支持阿富汗人民Democratic Party的大批部队用坦克包围了喀布尔总统府，宣布推翻达乌德总统的革命已经开始！正在举行会议的达乌德总统下令平息叛乱，但许多政府官员仍感到恐慌。"
"A large number of troops supporting the Democratic Party of the Afghan people surrounded the Kabul presidential palace with tanks, announcing that the revolution to overthrow President Daoud has begun! President Daoud, who is holding a meeting, ordered the quelling of the rebellion, but many government officials are still panicking."
 afg.10.a:0 "Overthrow Daud! Afghanistan belongs to the people!"
 afg.10.b:0 "Kill these Russian dogs!"

 afg.13.t:0 "塔拉基的死亡"
Taraki's death
 afg.13.d:0 "阿富汗人民Democratic Party总书记、阿富汗民主共和国总统穆罕默德·塔拉基不久前去世。他的死因将不予披露。他的副手哈菲祖拉·阿明接任总书记。尽管大家都知道阿明已经获得了塔拉基的实际权力，但阿明杀害塔拉基的传闻仍在继续传播。"
Mohammad Taraki, General Secretary of the Afghan People's Democratic Party and President of the Democratic Republic of Afghanistan, passed away not long ago. The cause of his death will not be disclosed. His deputy, Hafizura Amin, took over as general secretary. Although it is known that Amin has obtained the actual power of Taraki, the rumor that Amin killed Taraki continues to spread.
 afg.13.a:0 "Disturbing"

 afg.18.t:0 "来自莫斯科的警告"
Warning from Moscow
 afg.18.d:0 "来自莫斯科的消息显示，克里姆林宫对阿明的政策非常不满。阿明政府致力于内部斗争，但其镇压伊斯兰势力的能力非常低，其高压政策正在激发更多抵抗，严重危及阿富汗社会主义阵营的利益。政治局的提议是邀请流亡的Soviet Union旗帜派领导人巴布拉克·卡尔马尔回到喀布尔，接管阿明的权力"
Sources from Moscow show that the Kremlin is very unhappy with Amin's policies. The Amin government is committed to internal struggle, but its ability to suppress Islamic forces is very low, and its repressive policies are inspiring more resistance, seriously endangering the interests of the Afghan socialist camp. The Politburo's proposal is to invite Babrak Kalmar, the leader of the banner faction of the Soviet Union in exile, to return to Kabul and take over power from Amin
 afg.18.a:0 "NO WAY!"
 afg.18.b:0 "We have no choice."

 afg.19.t:0 "阿富汗拒绝！"
Afghanistan refuses!
 afg.19.d:0 "喀布尔拒绝了我们邀请卡尔迈勒重新掌权的提议。显然，阿明政权认为内部权力斗争高于社会主义革命！政治局建议我们用特殊手段推翻阿明，协助噶玛尔和旗派控制阿富汗，保卫阿富汗人民政权。"
Kabul rejected our offer to invite Karmel back to power. Clearly, the Amin regime considers the internal power struggle higher than the socialist revolution! The Politburo suggested that we use special means to overthrow Amin, assist the Karma and Qi factions to control Afghanistan, and defend the Afghan people's government.
 afg.19.a:0 "Be ready to fight!"
 afg.19.b:0 "Forget it."

 afg.21.t:0 "We have occuption the Khabur!"
 afg.21.d:0 "没有我们的帮助，阿富汗军队很脆弱。在Soviet Union红军的进攻下，喀布尔驻军完全倒塌，阿明和他的同事在总统府前被打死。在稳定了我们对首都的控制之后，卡尔马尔和他的战友们在我们的保护下返回了阿富汗，他正在准备明天的就职演说。"
Without our help, the Afghan military is vulnerable. The Kabul garrison completely collapsed under the attack of the Soviet Union Red Army, and Amin and his colleagues were killed in front of the presidential palace. After stabilizing our control of the capital, Kalmar and his comrades returned to Afghanistan under our protection, where he is preparing for his inaugural speech tomorrow.
 afg.21.a:0 "Khorosho."

 afg.23.t:0 "穆斯林叛乱！"
muslim rebellion
 afg.23.d:0 "一支大规模的穆斯林武装在坎大哈地区发动了叛乱！"
A massive Muslim militant has launched a rebellion in the Kandahar region!
 afg.23.a:0 "该死的野蛮人！"
damn savage

 afg.24.t:0 "阿富汗需要支援"
Afghanistan needs support
 afg.24.d:0 "一支大规模的穆斯林武装在阿富汗坎大哈地区发动叛乱，阿富汗政府寻求我们的协助！"
A large-scale Muslim armed rebellion in the Kandahar region of Afghanistan, the Afghan government seeks our assistance!
 afg.24.a:0 "Destroy these barbarians!"
 afg.24.b:0 "We can't help."

 afg.26.t:0 "穆斯林叛乱!"
Muslim rebellion!
 afg.26.d:0 "一支穆斯林武装发动了叛乱！"
A Muslim militia has launched a rebellion!
 afg.26.a:0 "Damn savage!"