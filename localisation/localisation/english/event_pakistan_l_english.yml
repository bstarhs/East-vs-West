 pak.1.t:0 "Pakistan declare Independent!"
 pak.1.d:0 "As part of the Mountbatten partition plan, the Muslim region of South Asia, consisting of Punjab, Sindh, Balochistan, Pushtustan, Bangladesh, and some Kashmir, was combined to form an autonomous territory of Pakistan and declared independence, distinguishing it from the Hindu dominated region of Hinduism. The famous Muslim politician Mohammad Ali Jenna became the country's first Prime Minister. Pakistan's independence marks a complete division between the Muslim and Hindu communities in South Asia, but various conflicts and religious conflicts arising from it will also follow."
 
 pak.2.t:0 "Muhammad Ali Jinnah take office as Prime Minister of Pakistan"
 
 pak.3.t:0 "Death of Muhammad Ali Jinnah"
 pak.3.d:0 "The founder of Pakistan is no longer with us he perished away in a hospital today."
 
 pak.4.t:0 "Liaquat Ali Khan Assassinate!"
 pak.4.d:0 "Liaquat Ali Khan,The prime minister of Pakistan has been assasinated by a Pashtun seperatist!"
 
 pak.5.t:0 "Military coup in Pakistan!"
 pak.5.d:0 "General Ayub Khan has taken over the government thus beginning the first military rule in the history of the country."
 
 pak.6.t:0 "Military coup in Pakistan!"
 pak.6.d:0 "General Ayub Khan has taken over the government thus beginning the first military rule in the history of the country."
 
 pak.7.t:0 "Military coup in Pakistan!"
 pak.7.d:0 "A power change occurred in Pakistan, and due to the unpopularity of President Ayub Khan and opposition from democratic forces, General Yahya Khan overthrew him and established a new government. Yahya Khan is also a tough military leader who does not intend to return the regime to a democratic government."
 
 pak.8.t:0 "Zulfikar Ali Bhutto take office as Prime Minister of Pakistan"
 
 pak.9.t:0 "Rise of People's Party"
 pak.9.d:0 "Under immense political pressure, the President of the Pakistani military government, Yahya Khan, was forced to announce his resignation. The leader of the People's Party, Ali Bhutto, took over as the Prime Minister of Pakistan and announced the speedy restoration of Pakistan's democratic system."

 pak.10.t:0 "Balochistan rebels are rising rapidly"
 pak.10.d:0 "A Balochistan seperatist armed force launched aattack in rural areas of north,and attacked our military base!"
 
 pak.11.t:0 "Military coup in Pakistan!(Haq)"
 pak.11.d:0 "General Zia Ul-Haq has taken over the govenremnt in a coup'det the new government is likely to be pro American and conservative in nature."
 
 pak.12.t:0 "Ali Bhutto be executed!"
 pak.12.d:0 "The Pakistani military government organized various charges such as treason and executed former Prime Minister Ali Bhutto, which has been severely criticized by countries around the world!"
 
 pak.8.t:0 "Benazir Bhutto take office as Prime Minister of Pakistan"

 pak.15.t:0 "Pushtun rebels are rising!"
 pak.15.d:0 "A Pashtun seperatist armed force launched aattack in rural areas of north,and attacked our military base!"
 
 pak.16.t:0 "Border conflict between Afghanistan and Pakistan"
 pak.16.d:0 "The Pakistani army and Afghan army, as well as Pashtun militants supported by Afghanistan, have engaged in a firefight. Pashtun in western Pakistan is afraid that rebels will advocate for the separation of the region from Pakistan and its integration into Afghanistan."
 pak.16.a:0 "OK"
 
 pak.17.t:0 "Pakistan repels pro Afghan Pashtun militants"
 pak.17.d:0 "The Pakistani army defeated the Pashtun rebels supported by Afghanistan, maintaining Pakistan's control in the region."
 pak.17.a:0 "OK"
 
 pak.18.t:0 "Pakistani troops defeated"
 pak.18.d:0 "Pakistan was defeated and retreated in the battle with the Shitu rebels."
 