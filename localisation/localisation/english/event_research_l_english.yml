l_english:
  research.1.t:0 "[FROM.GetName] has completed nuclear development!"
  research.1.d:0 "With a loud bang, a huge mushroom cloud rises over [FROM.GetName]'s land. [FROM.GetLeader] announces that its country has completed the development of nuclear weapons, becoming one of the great powers Member.\n[FROM.GetName]'s statement has caused unrest in the international community, especially the condemnation of some major powers. The increasing number of countries possessing nuclear weapons will increase the threat of nuclear war."
  research.1.a:0 "What will be the result?"
 
 research.2.t:0 "[FROM.GetName] has completed semiconductor manufacturing technology!"
 research.2.d:0 "After a difficult technical breakthrough, experts from [FROM.GetName] successfully manufactured the world's first semiconductor chip. Compared to electronic tubes, the size of chips with semiconductor transistors as the core is greatly reduced, while computing capabilities have been improved. The birth of semiconductor chips means that the volume of future electronic products, including household appliances, computers, and electronic accessories for automobiles and weapons, will be greatly reduced, and the development of human electronic technology has entered a new era."
 research.2.a:0 "Great!"
 
 research.3.t:0 "Apple releases the world's first personal computer!"
 research.3.d:0 "Steve Jobs, president of Apple Corporation in the United States, showed the world their product that can change the world - the world's first personal microcomputer Aplle I, which will be an epoch-making product and will change the history of computers."
 research.3.a:0 "Great!"
 
 research.4.t:0 "[FROM.GetName] releases the world's first personal computer!"
 research.4.d:0 "[FROM.GetName] technical experts have successfully developed the world's first personal computer and will soon put it into civilian use. The entry of personal computers into people's homes has to be said to be a great achievement in modern human history."
 research.4.a:0 "Great!"
 
 research.5.t:0 "[FROM.GetName] has completed  the research "
 research.5.d:0 "[FROM.GetName] Academy of Sciences announced that the country has successfully completed the production of superconducting materials, a special metal that can minimize resistance in special environments, allowing current to conduct without loss. This technology will be applied to the manufacture of more advanced electromagnetic devices."
 research.5.a:0 "Wonderful!"
 
 research.6.t:0 "[FROM.GetName] has completed the research of DNA Genetics"
 research.6.d:0 "[FROM.GetName] Academy of Sciences announced that the country has successfully completed a series of studies on human DNA genetic factors, which will be a major advancement in the history of world studies."
 research.6.a:0 "Wonderful!"
 
 research.7.t:0 "[FROM.GetName]的第一艘核潜艇下水！"
 research.7.d:0 "[FROM.GetName]海军宣布，该国已经成功建造了世界上第一艘核动力驱动的战略核潜艇，大大加强了该国的海军实力和核威慑。"
 research.7.a:0 "Wonderful!"
 
 research.8.t:0 "[FROM.GetName]的第一艘航母下水！"
 research.8.d:0 "[FROM.GetName]海军宣布，该国已经成功建造了本国的第一艘航空母舰，大大加强了该国的海军实力。"
 research.8.a:0 "Wonderful!"
 
 research.9.t:0 "[FROM.GetName]已完成氢弹开发！"
 research.9.d:0 "[FROM.GetName]宣布，该国已成功试爆该国第一枚氢弹。氢弹拥有原子弹十倍以上的当量，以及更大的破坏力。"
 research.9.a:0 "Wonderful!"
 
 research.2.t:0 "[FROM.GetName] invents television cathode ray tube!"
 research.2.d:0 "[FROM.GetName] have successfully manufactured the world's first semiconductor chip. Compared to electronic tubes, chips with semiconductor transistors as the core have significantly reduced volume and improved computational capabilities. The birth of semiconductor chips means that the volume of electronic products in the future, including household appliances, computers, as well as electronic components for automobiles and weapons, will be greatly reduced. The development of human electronic technology has entered a new era。"
 research.2.a:0 "Wonderful!"