l_english:
 space.1.t:0 "Ready to launch the launch vehicle!"
 space.1.d:0 "We are about to launch a launch vehicle, which does not require astronauts. Our current combined space capability is [?space_power], and launching a launch vehicle should require 80 power. Launch?"
 space.1.a:0 "Fire."
 space.1.b:0 "Wait a second."

 space.2.t:0 "Successful rocket launch!"
 space.2.d:0 "We've successfully launched a launch vehicle into the atmosphere, which means sending man-made objects into space will never be farther away!"
 space.2.a:0 "Awesome!"

 space.3.t:0 "Failed to launch!"
 space.3.d:0 "Our spacecraft exploded as it entered the atmosphere, and rocket fragments fell from the sky."
 space.3.a:0 "Bad luck."
 
 space.4.t:0 "Prepare to launch Sputnik!"
 space.4.d:0 "We are about to launch an artificial satellite. This does not require astronauts. Our current combined space capability is [?space_power], and launching an artificial satellite should require 80 power. Launch?"
 space.4.a:0 "Fire."
 space.4.b:0 "Wait a second."

 space.5.t:0 "Successful rocket launch!"
 space.5.d:0 "We have successfully launched a satellite into the atmosphere, which means the space age is here!"
 space.5.a:0 "Amazing!"

 space.6.t:0 "[ROOT.GetName] finish Sputnik first!"
 space.6.d:0 "[ROOT.GetName] was the first to successfully launch Sputnik, which means the space age is here!"
 space.6.a:0 "Awesome!"

 space.7.t:0 "Prepare to launch the space dog!"
 space.7.d:0 "We are about to launch a space dog, which does not require astronauts. Our current combined space capability is [?space_power], and the launch launch should require 80 power. Launch?"

 space.8.t:0 "Successful rocket launch!"
 space.8.d:0 "We have successfully put a space dog into orbit around the Earth and returned it safely to the ground, which means that humans are not far from soaring into space!"
 space.8.a:0 "Amazing!"

 space.9.t:0 "[ROOT.GetName] put animals into space first!"
 space.9.d:0 "[ROOT.GetName] will be the first to successfully put a space dog into orbit around the Earth and bring it back to Earth safely, which means that humans are not far from soaring into space!"
 space.9.a:0 "Amazing!"

 space.10.t:0 "Prepare for manned spaceflight!"
 space.10.d:0 "We are about to send astronauts into orbit around the earth for spaceflight, which requires 1 astronaut for manned spaceflight, our current comprehensive spaceflight capability is [?space_power], and manned spaceflight should Requires 80 capacity. Launch?"

 space.11.t:0 "Astronauts in orbit!"
 space.11.d:0 "We successfully sent astronauts into orbit around the Earth and returned them safely to the ground. This will be the first conqueror of our country to rush out of the earth and enter the universe!"
 space.11.a:0 "Amazing!"

 space.12.t:0 "[ROOT.GetName] put astronauts into space first!"
 space.12.d:0 "[ROOT.GetName] will first successfully send astronauts into orbit around the earth and return them to the ground safely, which means that humans have rushed out of the earth and into the universe! The space age is here!\n As the first person to conquer space, this astronaut [ROOT.GetName] is regarded as a hero for all mankind, he has not only been entertained by his own government, but will also travel around the world on behalf of his country."
 space.12.a:0 "Amazing!"

 space.13.t:0 "Prepare to launch a communications satellite!"
 space.13.d:0 "We are about to launch a communications satellite, which does not require astronauts. Currently our combined space capability is [?space_power], and communications satellites should require 80 power. Launch?"

 space.14.t:0 "Successful launch of communications satellite!"
 space.14.d:0 "We have successfully launched a communications satellite! This satellite will send broadcast frequencies to Earth to spread our voice to the world!"
 space.14.a:0 "Amazing!"

 space.15.t:0 "[ROOT.GetName] successfully launched a communications satellite!"
 space.15.d:0 "[ROOT.GetName] has successfully launched a communications satellite first! This satellite will send broadcast frequencies to Earth to spread the voice of [ROOT.GetName] leaders to the world!"
 space.15.a:0 "Amazing!"

 space.16.t:0 "Prepare for a lunar mission!"
 space.16.d:0 "We're about to do a great mission to the moon, sending astronauts to the moon on a rocket and landing. This will require 3 astronauts to perform the mission. Currently our combined space capability is [?space_power], And the moon landing should require 150 capacity. Launch?"

 space.17.t:0 "Astronauts landed on the moon successfully!"
 space.17.d:0 "This is one small step for a man, and one giant leap for mankind.\nUnder the world's attention, the astronauts of [ROOT.GetName] drove the lunar module and slowly landed on the moon On the surface, the astronauts stepped out of the space capsule and left the first human footprints on the moon. This is one of the greatest moments in human history, marking the footsteps of human beings out of the earth and into space. "
 space.17.a:0 "Amazing!"

 space.18.t:0 "Prepare to launch the space station"
 space.18.d:0 "We are about to launch the first component of the space station. This will require 3 astronauts on a mission. Currently our combined space capability is [?space_power], and the moon landing should require 150 power. Launch or not ?"

 space.19.t:0 "[ROOT.GetName] begins construction of space station"
 space.19.d:0 "[ROOT.GetName] has successfully launched and assembled the components of its first space station, thus completing the first base for humans to go into space. There will be more astronauts in the future personnel to enter the space station to conduct scientific experiments."
 space.19.a:0 "Awesome!"

 space.20.t:0 "Prepare to launch the Mars probe"
 space.20.d:0 "We are about to launch the Mars probe. This will require 3 astronauts on a mission. Currently our combined space capability is [?space_power], and the moon landing should require 180 power. Launch or not ?"

 space.21.t:0 "[ROOT.GetName] successful launch of Mars probe!"
 space.21.d:0 "[ROOT.GetName] has successfully launched a probe to Mars, which will take photos of the surface of Mars and send them back to the ground to show the world the mysterious veil of this solar neighbor."
 space.21.a:0 "Awesome！"

 space.22.t:0 "Prepare to launch the spy satellite"
 space.22.d:0 "We are about to launch the spy satellite. This will require 3 astronauts on a mission. Currently our combined space capability is [?space_power], and the moon landing should require 120 power. Launch or not ?"

 space.23.t:0 "Successful launch of spy satellite"
 space.23.d:0 "We successfully launched a spy satellite! This satellite uses remote sensing cameras to capture satellite images and transmit them back to our space base!"
 space.23.a:0 "Awesome！"
 spy_Satellite_modifiers:0 "Spy satellite"

 space.24.t:0 "[ROOT.GetName] successful launch of spy satellite！"
 space.24.d:0 "[ROOT.GetName] first successfully deployed the spy satellite! This satellite uses remote sensing cameras to capture satellite images,and transmit them back to their space base!"
 space.24.a:0 "Awesome！"