 SOV_Planned:0 "Adhere to planned economy"
 SOV_CommunieFarm:0 "Kolkhoz reform"
 SOV_CommunieFarm_desc:0 "The registered residence system in the Stalin era restricted farmers to collective farms, and did not allow peasants to leave the countryside. Now the new economic reform has begun, registered residence system should be abolished, farmers will be able to enter the city, contribute to the city's development."
 SOV_GovernmentRule:0 "Standards Committee"
 SOV_GovernmentRule_desc:0 "The standard committee is a concept put forward by Soviet Prime Minister kosikin in the reform in the late 1970s. The National Standard Committee replaces the National Planning Committee to formulate the production standards of enterprises, so that enterprises can obtain greater autonomy and further get rid of the government's economic guidance."
 SOV_KhrushchevHouse:0 "Khrushchev Apartment"
 SOV_KhrushchevHouse_desc:0 "In order to better improve people's living standards, we must build a large number of residential buildings to cope with the growing population and urbanization. The luxury architecture of Stalin's period was untimely, and the cheap and practical collective residence was the first choice."
