 SOV_RemovingStalinization:0 "De-stalinization"
 SOV_RemovingStalinization_desc:0 "With Stalin's death, it's time to re-examine this man's influence on the Soviet Union. The planned economy, the great cleansing, the Gulag and the personal worship are all the wrong legacies left by Stalin, and they must be completely eliminated."
 SOV_RemovePersonalWorship:0 "De-personal worship"
 SOV_RemovePersonalWorship_desc:0 "Stalinist personality worship turned the Soviet Union government into an incompetent bureaucratic machine. Stalin's influence must be removed in order to revitalize it."
 SOV_OpenArts:0 "Media free"
 SOV_LimitedFreedom:0 "Limit free"
 SOV_Glasnost:0 "Glasnost"
 SOV_AccessionStatesAutonomy:0 "Accession States Autonomy"
 SOV_AccessionStatesAutonomy_desc:0 "With the advancement of political reform, non Russian ethnic groups in the alliance began to seek autonomy. In order to appease nationalist sentiment, we can try to change the alliance into federalism to maintain the survival of Soviet Union."
