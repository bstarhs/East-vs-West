 SOV_NormalizationOfSoviet-FinnishRelations:0 "Finlandization"
 SOV_NormalizationOfSoviet-FinnishRelations_desc:0 "Although we do not want Finland to fall into the Western faction, a Soviet Finland is not in our interests. The best way is to maintain a special neutrality, allowing it to retain its own political system while becoming our special ally."
