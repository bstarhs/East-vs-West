 SOV_Kazakh_Zones:0 "Kazakh industrial construction" 
 SOV_Kazakh_Zones_desc:0 "Central Asia has a mild climate, fertile soil, abundant minerals, and peak oil resources. It is suitable for large-scale cultivation and development of industrial construction. It is time to develop these virgin lands."
