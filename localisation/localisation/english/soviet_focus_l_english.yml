 SOV_InfiltrationGreece:0 "Infiltrate Greece"
 SOV_InfiltrationGreece_desc:0 "The Greek Communist Party is launching an armed struggle against the puppet regimes of Britain and America, and we need to support them to expand our influence in the Mediterranean."
 SOV_ReformingPolitics:0 "Political reform"
 SOV_ReformingPolitics_desc:0 "The evil fascist war machine has been knocked down, but new challenges are waiting for the Soviet Union. We must rectify our party and government departments as soon as possible so that they can cope with the new era."
