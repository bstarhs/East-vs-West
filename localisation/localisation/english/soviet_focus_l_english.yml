 SOV_AdhereToStalinism:0 "Keep Stalinism"
 SOV_AdhereToStalinism_desc:0 "The victory of the Patriotic War and the achievements of industrialization have proved that Comrade Stalin's policy is correct, and even behind him, we will continue to implement this line."
 SOV_NewLeader:0 "New Leader"
 SOV_KGB:0 "Establish KGB"
 SOV_KGB_desc:0 "Intelligence remains one of the most important military means, and we need to reorganize the existing Internal Affairs Commission into a new Ministry of National Security to counter imperialist influence."
 SOV_RedTerror:0 "Second Purge"
 SOV_SocialistArt:0 "Social realism"
 SOV_FosteringEastGermany:0 "Establish DDR"
 SOV_CommunistPartyAndWorkersIntelligenceBureau:0 "Cominform"
 SOV_CommunistPartyAndWorkersIntelligenceBureau_desc:0 "After World War II, in European countries, socialist movements were surging, and we needed to establish an intelligence unit to provide support to the Communism political parties in these countries."
 SOV_WarsawPact:0 "Warsaw treaty"
 SOV_WarsawPact_desc:0 "Western imperialist countries are threatening the nascent socialist regime in Eastern Europe, and we need to unify the socialist military forces in Eastern Europe to jointly counter Western military deterrence."
 SOV_Brezhnevism:0 "Brezhnevism"
 SOV_Brezhnevism_desc:0 "As the leader of the socialist faction, Soviet Union has the status of Big Brother in the socialist family. In order to ensure that the socialist family is not infringed by imperialism, other socialist countries must sacrifice part of their national sovereignty to maintain our stability"
 SOV_StrengtheningControlOverEasternEurope:0 "Strengthening Control Over Eastern Europe"
 SOV_InfluenceYugoslavia:0 "Influence Yugoslava"
 SOV_PenetratingGreeceAndTurkey:0 "Influence Greece and Turkey"
 SOV_EconomicMutualAidCommittee:0 "Comecon"
 SOV_EconomicMutualAidCommittee_desc:0 "Many newly emerging socialist countries have just gained freedom from the war, and they continue to carry out economic construction. The Economic Mutual Assistance Committee will provide assistance to them."
