 SOV_SupportAntiColonal:0 "Support De-colonization"
 SOV_SupportAngola:0 "Disintegration of Portuguese colonies"
 SOV_SupportSouthAfrica:0 "Support revolt in South Africa"
 SOV_EconomicSupport:0 "Economic support"
 SOV_EconomicSupport_tip:0 "Allow support for other countries through political resolutions."
 SOV_ElectroTech:0 "Support for electronic technology"
 SOV_ElectroTech_desc:0 "With the development of the times, electronic information technology will become the most important and indispensable part of the future society. Whether it is to develop military, industrial, livelihood, or space exploration, information technology is indispensable. Leading in this field represents leading the way towards the future."
 SOV_Computer:0 "Computer and Automation"
 SOV_Computer_desc:0 "The computer is a great invention, and its birth marks the beginning of the third industrial revolution. We must achieve results in the field of computers as soon as possible and apply them to industrial production and military affairs."
 SOV_automobil:0 "Information society"
 SOV_automobil_desc:0 "Comrade Grushkov proposed a great idea, namely, to establish an information network completely composed of intelligent computers and covering the entire Soviet Union to manage our economy. Unlike bureaucratic systems, computers are not corrupt and have accurate calculations. There is no doubt that computers and information systems will be important ways to improve the planned economy and even achieve socialism."
 SOV_TurkStraite:0 "Passage to the Türkiye Strait"
 SOV_TurkStraite_desc:0 "Decades ago, the Russian Empire reached an agreement with Türkiye on traveling in the Türkiye Strait, but the agreement was not perfect. Now if we want to extend our sphere of influence beyond the Black Sea, we must let the Türkiye government amend the agreement."
 SOV_Relation_Norway:0 "Norway's neutrality"
 SOV_Relation_Norway_desc:0 "Norway's geographical location in Europe is extremely important, as it is located on the route from our Arctic Fleet to the Atlantic Ocean. If Norway joins the Western camp, our Atlantic route will be cut off. We can try to proactively improve relations with Norway, strive for a neutral attitude, and prevent it from joining the alliance led by the United States. In exchange, our country respects and protects Norway's neutral status and territorial security."
 SOV_Invade_Norway:0 "Infiltration into Norway"
 SOV_Invade_Norway_desc:0 "Norway's geographical location in Europe is extremely important, as it is located on the route from our Arctic Fleet to the Atlantic Ocean. If Norway joins the Western camp, our Atlantic route will be cut off. We can try to engage with left-wing or separatist forces in Norway, provide them with support, help them overthrow Norway's pro Western government, and establish a pro Soviet regime."
 SOV_FoodPrise:0 "Grain procurement system"
 SOV_FocusConsumerProducts:0 "Developing civil industry"