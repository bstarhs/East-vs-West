 SOV_Student_construction_brigade:0 "Student construction brigade" 
 SOV_Student_construction_brigade_desc:0 "Student construction brigade is a social movement rising in the Soviet Union in the 1950s. It encourages and organizes Communist Youth League members to participate in construction work in their spare time, which can not only exercise the physique and spirit of Communist Youth League members, but also be conducive to the construction of the Soviet Union after the war. The student construction brigade movement was recognized and supported by the Soviet government in the 1960s." 
 SOV_Naukograd:0 "Naukograd" 
 SOV_Naukograd_tool:0 "You can set a state as a Naukograd by spending political points. The speed of building hospitals and schools in this state increases. Each Naukograd can bring a certain research bonus, but Naukograd are established every three years and cannot be adjacent." 
 SOV_Naukograd_desc:0 "Naukograd is a city specially built by the Soviet government for some technical purpose. It is mainly composed of highly concentrated technical facilities and residential areas, equipped with perfect welfare facilities and academic center. Generally, only senior technicians are qualified to live here. Naukograd's facilities enable technicians to better work in the facilities they serve. For example, the famous Pletipia, where residents are engineers dedicated to the Chernobyl nuclear power plant." 
 SOV_GreatProject:0 "Great communist project"
 SOV_GreatProject_desc:0 "Great communication project refers to a series of ambitious construction projects proposed by Stalin in the early 1950s, including several large hydropower stations, industrial zones and canals."
 SOV_ArmsRace:0 "Arms race"
 SOV_church:0 "Improving religious status"
 SOV_Silent_Stalinization:0 "Silent Stalinization"
 SOV_limited_independence:0 "West-81"
 SOV_Toshkent_speech:0 "Toshkent doctrine"
 SOV_Toshkent_speech_desc:0 "The contradiction between us and China has made Beijing gradually turn to western countries, which is extremely unfavorable. We should retain this ally. In his speech in Tashkent, comrade Brezhnev proposed to improve China Soviet relations. We should implement this decision as soon as possible."
 SOV_Ottepel:0 "Ottepel"
