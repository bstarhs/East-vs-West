 SOV_Food_Programme:0 "Food Programme"
 SOV_Food_Programme_desc:0 "Food program is a series of measures proposed by the Soviet government during the eleventh five year plan to increase the output of agricultural products, including restructuring the rural bureaucracy and increasing the infrastructure construction in rural areas."
 SOV_Food_Programme_tool:0 "All provinces with more than 2 farms+2 infrastructure"
 SOV_CornMovement:0 "Corn Movement"
