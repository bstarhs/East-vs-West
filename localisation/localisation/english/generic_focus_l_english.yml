 common_news:0 "打击腐败 I"
 common_news:0 "打击腐败 II"
 
 common_secularized:0 "Secularized society"
 
 common_sov_aid:0 "Soviet economic aid"
 common_sov_aid_desc:0 "We can request the Soviet government to provide us with financial support."
 common_sov_techs:0 "Soviet technological aid"
 common_sov_techs_desc:0 "We can request the Soviet government to send us technical advisors to assist in our country's technological development and industrial construction."
 common_sov_arms:0 "Soviet military aid"
 common_sov_arms_desc:0 "We can request the Soviet government to provide us with military assistance, including aid in military equipment and military advisors."
 common_sov_mir:0 "Mir station project"
 
 common_export_revolution:0 "World revolution"
 common_export_revolution_desc:0 "The world revolution is surging, and as a part of the socialist camp, we should actively support the world socialist national liberation movement!"
 common_latin_revolution:0 "Support revolution in Latin Amercia"
 common_latin_revolution_desc:0 "The Latin American people have been under the rule of American imperialism, landlord capital, and Cordero warlords for hundreds of years. Now that the Latin American people have risen up against imperialism and Cordero's rule, we should support them!"
 common_asia_revolution:0 "Support revolution in Asia"
 common_asia_revolution_desc:0 "From Japan to the Indian Ocean, the people of Asia have launched revolutionary movements against imperialist powers and their puppet governments. We should support them!"
 common_europe_revolution:0 "Support revolution in Europe"
 common_europe_revolution_desc:0 "Western Europe is currently under the control of the pro American NATO group, but progressive left-wing groups in various European countries are opposing imperialism, and we should support them!"
 common_africa_revolution:0 "Support revolution in Africa"
 common_africa_revolution_desc:0 "The African people have been colonized by imperialists for over a hundred years, and now it is time to support the African national liberation movement and fight for freedom!"
 common_arabs_revolution:0 "Support revolution in Middle East"
 
 common_maoism:0 "Maoism"
 common_maoism_desc:0 "The policies of Mao Zedong, the leader of the CPC, provide us with valuable experience and ideal learning objects. The cultural revolution, worker autonomy, mass line, and Third World theory implemented by the Chinese government will become the guiding lights for us to move towards communism."
 common_culture_revolution:0 "Culture revolution"
 common_culture_revolution_desc:0 "Mao Zedong believed that revolution requires not only political, economic, and social revolution, but also cultural revolution. Only by removing the religious and cultural influences of the old era from our way of thinking can we completely remove counter revolutionary elements from our society and create a revolutionary and progressive society."
 common_people_communie:0 "People Commune"
 common_people_communie_desc:0 "The People's Commune is a rural grassroots organization established in China in the 1960s. All farmland and production tools in the commune are collectively owned, and the products produced by the villagers will be evenly distributed."
 common_workers_communie:0 "Workers Communies"
 common_workers_communie_desc:0 "During the cultural revolution in China, all enterprises established workers' committees, and workers directly participated in the management and decision-making of factories in a democratic form. The members of the committees were elected, and they not only participated in management, but also in work."
 
 common_people_army:0 "The Peoples Army"
 common_people_army_desc:0 "According to Lenin's theory, the Party will lead everything in socialist countries, including the military. A military under the leadership of the Party is indispensable. Only when the military becomes a part of socialism can it protect the socialist revolution and socialist country."
 common_commuist_nationalized:0 "Economic Nationalized"
 common_commuist_nationalized_desc:0 "Before transitioning from capitalist society to communist society, the Party and the state will manage our important means of production in the form of state-owned enterprises."
 common_strike_religion:0 "Strike religion"
 common_strike_religion_desc:0 "Religion is the opium of the spirit. Apart from representing the feudal class to oppress the people, they are useless. Only by suppressing religion can we promote the acceptance of socialist ideology by the people."
 
 common_usa_techs:0 "American technical assistance"
 common_usa_techs_desc:0 "We can request the US government to dispatch technical advisors to assist our country's technological development and industrial construction."
 common_usa_intel:0 "American intelligence assistance"
 common_usa_intel_desc:0 "We should invite the US intelligence agencies to provide intelligence assistance to our country. Although there is a risk of our country being infiltrated and controlled by the United States, the benefits outweigh the drawbacks."
 common_garrison:0 "American military assistance"
 common_garrison_desc:0 "We can request the military government to provide us with military assistance, including aid in military equipment and military advisors."
 
 common_militarist_economic:0 "Economic under Militarist"
 common_militarist_economic_desc:0 "Expand our military strength and require full economic support. We should abandon useless luxury goods production in our economic system and focus on the military industry."
 common_expanded_soldiers:0 "Expand conscription"
 common_expanded_soldiers_desc:0 "Now is a critical period for the expansion of the national military, and we demand that every adult male contribute their strength to the country."
 common_hateful:0 "Xenophobia"
 common_hateful_desc:0 "Foreign cultures, foreign goods, foreign ideologies, foreign people... are not as good as our own country. Throw them out and let the citizens of our great country support everything in our country."
 common_all_soldiers:0 "Barrel them!"
 common_all_soldiers_desc:0 "The war is about to break out, and we demand that all compatriots in the country, regardless of gender, age, or even the elderly, weak, sick, or disabled, must pick up weapons and prepare for battle!"
 common_super_race:0 "Superior race"
 common_super_race_desc:0 "We are the most outstanding nation in the world, possessing invincible strength and a great and glorious history. Being superior to others naturally means we are superior to them and have the power to conquer the weak."
 common_majority:0 "Nation for one nationality"
 common_united_ethnics:0 "Assimilating ethnic minorities"
 common_united_ethnics_desc:0 "People who do not belong to us must have different thoughts. As a single ethnic country, if the culture, language, beliefs, and way of life of so-called ethnic minorities are not exactly the same as those of the main ethnic group, they will become a hidden danger of rebellion. We must force all citizens in our country to use a unified language, script, and religious beliefs in order to unite the country."
 common_geonicide:0 "Pure nation"
 common_geonicide_desc:0 "Our great and superior race does not allow inferior races to defile us. Find people of lower races and deal with them."
 
 common_monarch_party:0 "Monarch's puppet party"
 common_monarch_party_desc:0 "Although our country has established a parliamentary constitutional monarchy, His Majesty can continue to exercise our political rights by establishing a party as our representative in parliament."
 common_monarch_worship:0 "Monarch worship"
 common_monarch_worship_desc:0 "The great his Majesty has led our nation through hundreds of years of wind and rain. They are the symbol and only monarch of our country and nation. his Majesty's glory is the glory of our nation, and loyalty to his Majesty is the highest honor for our citizens."
 common_king_state:0 "L'État,c'est moi"
 common_king_state_desc:0 "As a symbol of national unity and the highest political leader, His Majesty's will is the will of the country. Everything in the country must unite around His Majesty and move forward according to His guidance."
 common_king_law:0 "Offending the Sovereign Law"
 common_king_law_desc:0 "Those who offend the monarch will pay the price of their lives."
 
 focus_space_explore:0 "Space project"
 common_social_reform:0 "Social reform"
 common_social_reform_desc:0 "Many backward cultures and lifestyle habits still affect our country, such as gender inequality and hierarchical system. If our country wants to become a modern country, we must eliminate these backward cultures."
 common_social_quality:0 "Promote social equality"
 common_companies_reform:0 "State owned enterprise reform"
 common_hight_tech:0 "Developing high-tech industries"
 common_agriculture:0 "Developing agricultural technology"
 common_agriculture_desc:0 "Improving agricultural production requires not only a reasonable land system, but also advanced agricultural technology. Water conservancy, pesticides, fertilizers, breeding, and mechanization are all indispensable for agricultural modernization."
 electronic:0 "Electronic technique"
 
 common_buy_plane:0 "Buy planes"
 common_buy_plane_desc:0 "We currently do not have the capability to produce fighter jets ourselves, but we can purchase ready-made fighter jets from friendly countries to establish our air force."
 common_buy_plane_tool:0 "Allow the purchase of fighter equipment from friendly countries"
 common_jet_1:0 "Develop Jet figher I"
 common_jet_1_desc:0 "The emergence of jet engines has ushered spacecraft into a new era, with jet fighters having much higher speed and range than propeller planes of the past, To avoid falling behind in air force construction, our nation needs to quickly master jet engine technology."
 common_jet_2:0 "Develop Jet figher II"
 common_jet_2_desc:0 "An excellent fighter jet not only requires strong power and powerful weapons, but also advanced avionics and communication systems to adapt to modern warfare."
 common_bomber:0 "Develop bomber"
 common_bomber_desc: "When later generations talk about the horror of war at this time, they will definitely mention those bombs that fell from the sky. And we should make every effort to ensure that these stories are told by our enemies."
 common_transfer:0 "Develop transport planes"
 common_transfer_desc:0 "Transport planes allow us to transport supplies and even troops by air, and developing air transport capabilities will contribute to building a strong military."
 common_anti_air:0 "Develop AA weapons"
 common_air_equip:0 "Develop Airforce equipments"
 common_airbase_1:0 "Expand Air base I"
 common_airbase_1_desc:0 "We need airports and infrastructure to support our air force."
 common_airbase_2:0 "Expand Air base II"
 common_airbase_2_desc:0 "Our nation's air force is constantly growing, and the requirements for air force facilities are also increasing."
 
 common_light_ships:0 "Develop light ships"
 common_light_ships_desc:0 "Our navy is just getting started and we need at least some escort ships and destroyers to protect our territorial waters."
 common_medium_ships:0 "Develop medium ships"
 common_medium_ships_desc:0 "Our nation's navy is constantly developing, and we need medium-sized ships like destroyers and cruisers to take our fleet further."
 common_heavy_ships:0 "Develop heavy ships"
 common_heavy_ships_desc:0 "Our navy has grown and grown, and we need to develop large vessels that can carry more equipment and aircraft to enhance our combat capabilities."
 common_buy_ship:0 "Buy battle ships"
 common_buy_ship_desc:0 "We currently do not have the capability to build ships, but we can purchase retired ships from other countries."
 common_buy_submarines:0 "Buy submarines"
 common_buy_submarines_desc:0 "We currently do not have the capability to build submarines, but we can purchase retired submarines from other countries."
 common_submarines:0 "Develop submarines"
 common_submarines_desc:0 "The submarine fleet is an indispensable component of the modern navy, and a powerful submarine fleet will defend our territorial waters."
 common_naval_base_1:0 "Expand naval base I"
 common_naval_base_1_desc:0 "We need ports, docks, and infrastructure to carry our fleet."
 common_naval_base_2:0 "Expand naval base II"
 common_naval_base_2_desc:0 "The naval power of our nation continues to grow, and the requirements for naval facilities are also increasing."
 common_marines:0 "Develop marines"
 
 common_buy_weapons:0 "Buy weapons"
 common_buy_weapons_desc:0 "Our nation's military industry is currently very backward and does not have the ability to produce weapons on its own, but we can purchase retired weapons from other countries."
 common_armors:0 "Develop armor troop"
 common_armors_desc:0 "The Second World War demonstrated the astonishing combat effectiveness of tanks and armored vehicles to the world, and owning armored vehicles is the foundation for building a powerful modern army."
 common_mechanized:0 "Develop mechanized troop"
 common_mechanized_desc:0 "The war of motorization and mechanization is approaching, and armored vehicles will enable our military to quickly shuttle across the battlefield and support infantry operations."
 common_airborn:0 "Develop air drop troop"
 common_airborn_desc:0 "The development of aircraft range and payload has opened up many possibilities. Transport planes can drop an entire division of troops into the rear of enemy lines, where they can cause serious damage."
 common_military_system:0 "Develop military system"
 common_military_system_desc:0 "By establishing a sound military system, officer system, command system, and military academy, we can transform backward militia organizations into a combat capable professional army."
 common_develop_weapons:0 "Develop Militarist equipments"
 common_develop_weapons_desc:0 "From infantry helmets and vests to fire control and power systems on tanks, advanced combat equipment often dominates the battlefield."
 
 common_Semiconductor:0 "Develop semiconductor"
 common_Semiconductor_desc:0 "Semiconductors are materials that allow current to flow in a single direction. With semiconductors, we can reduce the volume of large diodes to the nanometer level to manufacture integrated circuits, which will be one of the greatest technologies of the 20th century."
 common_massage_tech:0 "Develop internet"
 common_massage_tech_desc:0 "The Internet connects computers together so that they can quickly spread and share information. If this technology enters the civilian field, computer users throughout the country and even the world will acquire knowledge and information through the Internet, which is a great creation."
 common_tourism:0 "Develop tourism"
 common_tourism_tool:0 "§Y+25%§W tourism gain"
 common_tourism_desc:0 "The magnificent scenery and summer resorts will attract foreign tourists to come and consume, and create job opportunities."
 common_nuclear:0 "Develop nuclear technology"
 common_nuclear_desc:0 "The energy released by nuclear fission destroyed Hiroshima and Nagasaki, and also ushered humanity into a brand new era. Nuclear technology has enormous practical value, as it can create devastating and terrifying weapons, provide endless clean energy, and even be applied to the field of biochemistry.\nThe release of atomic energy has changed everything except for human thinking.\n——Albert Einstein"
 common_nuclear_power:0 "Develop nuclear power"
 common_nuclear_power_desc:0 "If the energy released by nuclear fusion is used for power generation, it can not only provide much higher electricity than fossil fuels, but also have low cost and low pollution."
 common_railway_1:0 "Develop railway I"
 common_railway_1_desc:0 "To connect various parts of the country with the capital through railways, in order to develop the economy and strengthen centralization."
 common_railway_2:0 "Develop railway II"
 common_railway_2_desc:0 "Electrified railways, modern vehicle equipment, and advanced control systems will greatly improve railway transportation efficiency."
 common_high_railway:0 "Develop high-speed railway"
 common_high_railway_desc:0 "The development of high-speed railways has greatly improved the development of transportation, and we need to master this technology as soon as possible."
 common_mineral:0 "Develop mineral"
 common_power:0 "Develop power construction"
 
 common_conservatism:0 "Support Conservatism"
 common_conservatism_desc:0 "After World War II, the world was filled with various ideologies such as communism, socialism, democracy, and anarchism... but are these innovative political propositions really in line with our country? Perhaps we should go back to the past history and search for the correct answer. If the old ideas have indeed brought us stability and order, then we should move forward along the old path."
 common_army_gov:0 "Support Militarist"
 common_army_gov_desc:0 "Various political parties with different political views are torn apart in parliament for their own interests, but the military is different from them. The military can unite as one, with the same goal, representing the progressive class of society, acting decisively and courageously, and truly striving for the country."
 common_church:0 "Support the church"
 common_church_desc:0 "Radical social reforms will only create opportunities for communist subversives and self proclaimed democratic anti-government forces. What we need is a conservative and stable society. We should strive for the cooperation and support of the Christian Church to bring the people back to the guidance of the Bible and the gospel of God. Only by following the teachings of Jesus and the saints can our country become a happy and peaceful Eden."
 common_catholic:0 "Support Catholic"
 common_catholic_desc:0 "The people of [THIS.GetName] have been faithful servants of God since ancient times. Jesus bestowed upon the successor of St. Peter the sky, the Great, and the sea, and led us to be with our Heavenly Father. This is a proof of our nation's loyalty to God and a value we want to spread to future generations."
 common_lutherism:0 "Support Protestantism"
 common_lutherism_desc:0 "The religious reform of Martin Luther and Calvin ended the history of Europe under the rule of the Catholic Church. We should not only respect the Bible, but also protect our national values and culture"
 common_traditional:0 "Christian values"
 common_traditional_desc:0 "We must deeply engrave the creed of Christ Jesus and God into our social culture, and every citizen should act devoutly according to the will of Christ."
 common_dios_patria_familia:0 "God!Home country!Family!"
 common_crusaders:0 "Crusader kings"
 common_crusaders_desc:0 "To die for Christ is the greatest glory! We are all willing to fight and die for God! Anyone who does not believe in Christ is our mortal enemy, and we will fight them to the end in blood!"
 common_judge:0 "Inquisitio"
 common_judge_desc:0 "The raging fire burned before the eyes of the fanatical believers, turning the pagans and all reason into ashes."
 
 
 common_islamic:0 "Support islamic politicians"
 common_islamic_desc:0 "Many Islamic scholars are concerned about politics and express their opinions on the situation in our country. We can invite them to enter the government and use the views of the Quran as our policy guidance direction."
 common_ulima:0 "Guardianship of the Islamic Jurist"
 common_ulima_desc:0 "Ulema refers to scholars who are knowledgeable in Islamic knowledge, theory, and Sharia law. The highest council composed of Ulema will become the highest governing body of an Islamic country."
 common_element_non_islam:0 "Purge of Kafir"
 common_element_non_islam_desc:0 "The raging fire burned before the eyes of the fanatical believers, turning the pagans and all reason into ashes."
 
 common_social_democratic:0 "Social Democracy"
 common_social_democratic_desc:0 "Social democracy requires the government to pay attention to the interests of every citizen, especially the poor and vulnerable groups, rather than the wealthy. Promoting social equality to reconcile social contradictions is a priority policy of social democracy."
 common_expanded_voet:0 "Vote right reform"
 common_expanded_voet_desc:0 "Granting women the right to vote is an important milestone in achieving equality and promoting social modernization. When women control the votes, they also control their own destiny."
 common_weman_right:0 "Weman right reform"
 common_expanded_education:0 "Expand the right to education"
 common_minority:0 "Minor ethnic right reform"
 common_minority_desc:0 "There are many ethnic minorities in our country, and we should implement policies to promote their unity and harmony with the main ethnic group."
 common_accept_immigrate:0 "Accept immigrate"
 common_LGBT:0 "LGBT right"
 common_LGBT_desc:0 "As the hippie movement brought about sexual liberation and completely overturned religious views on sexuality, transgender and homosexuals who were once considered oddities also began to demand political rights. In front of the votes, some progressive political parties have to engage with them whether they are willing or not."
 common_accept_abour:0 "Allow labour union"
 common_labour_right:0 "Labour right reform"
 common_progressive:0 "Environmental policy"
 common_progressive_desc:0 "Silent Spring has made environmental destruction and protection a political issue. When polluted water sources, rivers, oceans, dead and disappearing species, depleted forests, and skies eroded by sulfur dioxide become hot topics in newspapers and television news, public attention to environmental policies and pollution control continues to increase. Some governments actively support environmental issues, hoping to gain the support of progressives."
 
 common_neo_liberalism:0 "Neo-Liberalism"
 common_neo_liberalism_desc:0 "Neoliberals advocate reducing government administrative intervention and allowing the market to operate freely to stimulate economic growth. The corruption, political chaos, and bureaucracy of the government make it difficult for them to effectively manage the economy, so allowing the invisible hands of the market to promote self-regulation of the economic system is the best way. The less government intervention, the better the economic performance."
 common_currency_reform:0 "Currency reform"
 common_reduce_tax:0 "Tax reduce"
 common_companies_personalized:0 "Enterprise privatization"
 common_companies_personalized_desc:0 "Our national state-owned enterprises began to lose vitality after the economic system reform and were unable to cope with the increasingly fierce market competition. In order to enable state-owned enterprises to cope with the impact of the market economy, we will implement state-owned enterprise reform to enable enterprises to be independent and self responsible for their profits and losses."
 common_close_factories:0 "Closing loss making factories"
 common_reduce_welfare:0 "Reduce welfare"
 common_reduce_cost:0 "Reduce administrative expenses"
 half_financial_to_power:0 "Halve the value of all fiscal transfers to administrative expenditures"
 clear_financial_to_power:0 "No longer allowed to transfer fiscal revenue to political points until neoliberal policies are abolished"
 common_develop_finacial:0 "Develop Financial"
 common_reduce_manage:0 "Reduce government management"
 common_reduce_manage_desc:0 "The government should relax regulation and make free trade a long-term policy of the market economy to promote economic growth and form an effective competitive mechanism."
 common_market:0 "Expand market's hand"
 common_market_desc:0 "既If the market can operate the economy better than administrative institutions, then we should completely entrust the economy to the free operation of the market and market participants. An economic system without administrative intervention is undoubtedly the healthiest and most perfect."
 common_strike_union:0 "Strike labour union"
 
 common_Keynesianism:0 "Keynesianism"
 common_Keynesianism_desc:0 "Keynesianism is an economic policy proposed by British economist Keynes after World War II, characterized by government administrative intervention, nationalization, welfare system, and stimulating demand through public spending to reduce wealth inequality, promote social equality and stability. Against the backdrop of economic depression, severe unemployment, and the development of social equality trends after World War II, Keynesianism was adopted by many countries."
 common_companies_nationalized:0 "Nationalized companies"
 common_companies_nationalized_desc:0 "Private enterprises always serve their own interests and expand wildly in a disorderly free market, squeezing small and medium-sized enterprises and even being bought off by foreign capital. We should nationalize large enterprises and bring them and their industries under government control, in order to ensure that the enterprises themselves and their industries can obey government directives and serve our economic policies."
 common_support_labour:0 "Support 工会"
 common_expand_welfare:0 "Expand Welfare"
 common_welfare_state:0 "Welfare state"
 common_welfare_statee_desc:0 "Welfare state is becoming a consensus in many post-war countries, using Keynesian economic theory to provide welfare security, stimulate consumption, promote social equality, and win over the working class."
 common_unemploy_help:0 "Unemployment relief"
 common_high_tax:0 "Tax reform"
 common_govern_economic:0 "Controlled Economy"
 common_medic_system:0 "Medical security system"
 
 Focus_Goverment_reform:0 "Goverment reform"
 Focus_Goverment_reform_desc:0 "The terrible world war is over and mankind has a chance to breathe, but the war has not been completely extinguished. The confrontation between the two camps has taken shape. In order for our country to survive in the new international environment, we must prepare our government and people."
 common_1:0 "Conservatism"
 common_1_desc:0 "A new trend of thought is spreading in the ruins after the war, advocating the establishment of a world without class, the gap between the rich and the poor, public property and equality for all. However,our government is skeptical of this utopian theory. The tragedy in Russia proves that this is only an excuse for the dictator to give orders. We should adhere to our original social system and guard against the infiltration of red elements."
 common_3:0 "Democracy"
 common_3_desc:0 "The victory of the free world in the world war proves that the system of dictatorship oppressing people has been abandoned by mankind. It is the mainstream of the future world to establish a democratically elected, people-oriented and people-oriented government, ensure people's freedom, democracy and supervision, and protect people's right to choose government from infringement."
 common_2:0 "Socialism"
 common_2_desc:0 "Our country and nation have been oppressed by imperialism, colonialism and feudalism for a long time. While western countries continue to develop, we are far behind the world. Now the victory of the Soviet people has given us enlightenment. Only by establishing socialism, narrowing the gap between the rich and the poor, protecting the interests of workers and implementing public ownership can China get rid of poverty and backwardness."
 common_4:0 "Military rule"
 common_4_desc:0 "The so-called party democracy is nothing more than stupid and greedy politicians forming factions in parliament to fight for their own interests, making our government corrupt and incompetent. The red elements are trying to get the support of workers and peasants and threaten the security of our nation. The only way out now is to overthrow corrupt politics, establish a strong military regime and let the only army that can protect national interests take control of the country."
 commons_5:0 "Pro-USA"
 commons_5_desc:0 "The US government is committed to fighting the Communist subversive movement in the world, and they will become our important allies."
 common_6:0 "Keep neutral"
 common_6_desc:0 "Against the backdrop of the threat of nuclear war in the world, any close contact with Moscow and Washington is dangerous. Our policy should be to strike a balance between the two sides and declare that we are not close to any military group."
 common_7:0 "Liberalism"
 common_7_desc:0 "Everyone has the right to decide everything about himself, including political views, economic affairs and behavior. Freedom is the symbol of human progress. Restriction and interference will only hinder the development of the country and society."
 common_8:0 "Political pluralism"
 common_8_desc:0 "We should guarantee our democratic system through the constitution, and the people have the right to elect, supervise and impeach incompetent governments."
 common_9:0 "Supress"
 common_9_desc:0 "Communists, anarchists and ignorant students are inciting political chaos in an attempt to promote revolution and subversion in our country. Our police agency will be sent to monitor, warn and arrest these suspects."
 common_10:0 "Anti-Communism"
 common_10_desc:0 "The Communist revolution is endangering our social order and national interests. Our country will never tolerate red elements. Once they are found, they will be ruthlessly punished."
 common_11:0 "Intelligence Agency"
 common_11_desc:0 "In order to eradicate saboteurs, we need to set up a special department to investigate, supervise, arrest and eliminate them."
 common_12:0 "White terror"
 common_12_desc:0 "The surveillance network of anti Communist and anti subversive forces must be extended to the whole country and investigate everyone's every move. As soon as we find the Communist Party, we will destroy it immediately."
 common_13:0 "American aid"
 common_13_desc:0 "Request military, political and economic assistance from the United States government."
 common_14:0 "Join to NATO"
 common_14_desc:0 "The North Atlantic Treaty Organization was established to support the free world and to protect free countries from the invasion of red countries. Join to them, we will be guaranteed independence and freedom."
 common_15:0 "Military assistance"
 common_15_desc:0 "The struggle against communism is breaking out all over the world. We should send some volunteers. On the one hand, we should learn from combat experience. On the other hand, when we encounter difficulties, Americans will also be willing to help."
 common_16:0 "Deployment of strategic weapons"
 common_16_desc:0 "The United States is invited to deploy powerful ballistic missile weapons in China to deter any enemy who dares to invade."
 common_17:0 "Common defence"
 common_18:0 "Dual constitutional monarchy"
 common_18_desc:0 "The Americans are in a fierce war in Vietnam. If we send troops to support them, we can get a lot of benefits."
 has_monarchs:0 "A royal family peered at the country's throne."
 common_19:0 "Constitutional monarchy"
 common_19_desc:0 "The rights of the monarch need to be restricted by law, so as to ensure the continuous operation of our monarchy under a reasonable political system."
 common_20:0 "Military affair"
 common_20_desc:0 "The world's military technology is constantly developing. We must ensure that our military strength cannot lag behind the world."
 common_21:0 "Pro-third world"
 common_21_desc:0 "With the collapse of the colonial system, many countries in Asia and Africa established new countries independently. We must establish good relations with these countries as soon as possible and improve our international status."
 common_22:0 "Support De-colonized"
 common_22_desc:0 "The people of Asia, Africa and Latin America are opposing the colonists and striving for national independence. We should support them."
 common_23:0 "Economic construction"
 common_23_desc:0 "Nuclear weapons are evil weapons brought into the world by the devil, and their existence will only further the extinction of mankind. We must not touch this thing, nor support other countries to possess nuclear weapons."
 common_24:0 "Join to Non-aliged"
 common_24_desc:0 "The United States and the Soviet Union are trying to bring countries around the world into their sphere of influence, which will expand ideological conflicts and exacerbate the threat of war. We call on the non aligned movement and the establishment of a global organization to resist alliances with powerful countries."
 has_non_aliged:0 "Random country have launched the non aligned movement"
 set_non_aliged:0 "Launched the non aligned movement"
 common_25:0 "Regional cooperation"
 common_25_desc:0 "The establishment of regional organizations for cooperation with neighboring countries is not only conducive to our own development, but also conducive to preparing for the future integration into economic globalization."
 common_26:0 "People's republic"
 common_26_desc:0 "The backward era of capitalism has passed, and our people will usher in a more advanced and democratic social system. Socialism is conducive to the development of productive forces and the realization of social equality and democratic progress."
 common_27:0 "Special socialist"
 common_27_desc:0 "The experience and lessons of the early construction of the Soviet Union tell us that Stalin's model cannot be copied directly. We should study and create socialism with characteristics that suits our specific national conditions."
 common_28:0 "Soviet mode"
 common_28_desc:0 "Under the guidance of Stalin's model, the Soviet people not only turned Russia into an industrial power in just a decade, but also defeated fascism. If we want to get rid of poverty and enter industrialization and modernization, we must learn from the advanced experience of the Soviet people."
 common_29:0 "Socialist market economic"
 common_29_desc:0 "Influenced by Stalin's model, many people believe that the market is capitalism and only the planned economy is socialism. This is clearly wrong. Some countries have tried to introduce a market economy and improved people's living standards. Why don't we try?"
 common_30:0 "Opening"
 common_30_desc:0 "Socialism is not a closed self. We should allow the capital, technology and advanced experience of foreign countries and even capitalist countries to invest, import domestic products, absorb their advanced experience and optimize ourselves without damaging our basic economic system."
 common_31:0 "Multi parties"
 common_31_desc:0 "The dominance of one party and personal worship are the wrong legacy of Stalin's era. A true socialist government should know how to unite all classes and forces that can be united in the country, cooperate with all democratic parties that support socialism, form a coalition government and jointly build our country."
 common_32:0 "Humane socialism"
 common_32_desc:0 "Socialism is not absolutism. Even in countries under people's democratic dictatorship, people should have appropriate freedom of speech, thought, economy, religion, and politics regardless of class or revolution."
 common_33:0 "Pro-West"
 common_33_desc:0 "Moscow sees itself as the leader of the socialist camp, ignoring our diplomatic independence and autonomy. If we are not willing to become satellite countries, we must seek new diplomatic friendships, even with Western capitalist countries."
 common_34:0 "Basic principle"
 common_34_desc:0 "While actively advocating openness, we should also be wary of some liberalization and capitalist ideologies. A minority advocates for economic privatization, laissez faire ideology, and political pluralism, which is not allowed. The party representing the interests of the working people must always have the highest power."
 common_35:0 "Liberalized"
 common_35_desc:0 "Rigidity, conservatism, and political primacy are not conducive to our nation's modernization and integration into the world. On the premise of adhering to socialism, we should allow and encourage all sectors of society to express their opinions."
 common_36:0 "Political pluralism"
 common_36_desc:0 "Although the Party has made great contributions as a builder of socialist countries, in order to further achieve modernization and progress of the country, it is necessary to break the one party system and achieve diversity."
 common_37:0 "One party dictatorship"
 common_37_desc:0 "Our nation currently has numerous political parties, but most of them represent the interests of capitalists, political speculators, and even hostile elements. We want to build a people's democratic country owned by the proletariat and representing the working people, and the Communist Party must lead everything."
 common_38:0 "Supress"
 common_38_desc:0 "Some saboteurs, counter revolutionaries, and imperialist spies who are hostile to the new socialist country are plotting to carry out subversive activities. We must eliminate them and maintain the people's political power."
 common_39:0 "Leader worship"
 common_39_desc:0 "我们伟大的领袖在推翻帝国主义侵略、推翻反动政权、建立社会主义新国家的历史上，取得了举世瞩目的成就。只有把他尊为 our nation 最伟大的领袖，听从他的一切指示，我们才能 construct 和保卫祖国！"
 common_40:0 "Security Committee"
 common_40_desc:0 "We need to establish specialized institutions to investigate, monitor, and arrest counter revolutionaries and imperialist spies."
 common_41:0 "Purge"
 common_41_desc:0 "Expand the surveillance network targeting reactionary forces nationwide and eliminate any hostile elements suspected of supporting counter revolution and anti socialism."
 common_42:0 "Plan economic"
 common_42_desc:0 "Our nation is still a backward agricultural country. To achieve rapid development, it is necessary to unify all existing means of production, use and distribute production and living materials in a planned manner."
 common_43:0 "Agricultural Collectivization"
 common_43_desc:0 "Distributed agricultural production is not conducive to the rapid construction of our national economy. Suggest organizing farmers to collective farms to collectively use production materials and share their achievements."
 common_44:0 "Agricultural cooperative"
 common_44_desc:0 "Cooperatives can merge dispersed farmers and share labor tools while retaining private property."
 common_45:0 "Five-year plan"
 common_45_desc:0 "We will begin implementing the first five-year plan to rapidly improve our country's backward situation."
 oil_produc:0 "Developing the petroleum industry"
 oil_produc_desc:0 "Petroleum is the lifeblood of modern industry, and if we want to become an industrialized country, developing the petroleum industry is an indispensable step."
 plastic_produc:0 "Developing the materials industry"
 plastic_produc_desc:0 "石油是现代工业的血液，如果我们要成为工业国家，发展石油工业是不可缺少的一步。"
 common_46:0 "Heavy industrial"
 common_46_desc:0 "Heavy industry is the industry that provides the means of production, including equipment and construction. We need to develop heavy industry first and enter industrialization before we can develop other industries."
 common_47:0 "Light industrial"
 common_47_desc:0 "Our people's demand for consumer goods is increasing day by day, and we should first develop light industry to meet their needs."
 common_48:0 "Close to USSR"
 common_48_desc:0 "The great Union of Soviet Socialist Republics has become the most steadfast ally of socialist countries and independent third world countries. We will firmly stand with our comrades in Moscow to fight against imperialism and colonialism!"
 common_49:0 "Joined Warsaw treaty"
 common_49_desc:0 "Imperialist countries are tirelessly seeking to overthrow socialist countries in Europe, and the Warsaw Pact will protect us from infringement."
 common_50:0 "Close to Communist China"
 common_50_desc:0 "Communist China actively and firmly supports third world countries in opposing imperialism, and it will be an important ally for us to fight against imperialist aggression."
 ethics_committee:0 "Islam court"
 ethics_committee_desc:0 "Some saboteurs who question Shariah still exist, and we need to establish religious courts to punish them."
 common_51:0 "Establish parliament"
 common_51_desc:0 "Establishing a legislative body and electing a parliament is a sign of moving towards modern politics."
 common_52:0 "Nuclear programe"
 common_52_desc:0 "The emergence of nuclear weapons completely changed human society. This powerful weapon ended World War II, but it also made people in the second half of the 20th century extremely worried about the outbreak of World War III, because this super weapon would pose a danger of destroying the world. The United States and the Soviet Union developed nuclear weapons respectively after World War II as a bargaining chip for confrontation, and the nuclear balance to some extent prevented World War III. In the eyes of other countries, such as France, China, and India, nuclear weapons are a symbol of discourse power. Only by possessing these weapons can one avoid being threatened by superpowers, qualify for not being a pawn in the international community, and have the ability to threaten other countries."
 common_53:0 "The way of Islam"
 common_53_desc:0 "No matter how the world changes, the Quran and the will of the prophets remain eternal truths, and our country needs the governance of Islamic law to ensure that our country is always within the scope of truth. Allah is calling us to forge ahead. Brothers, please pick up our Zulfiqar and defend our right to survival!"
 common_54:0 "Mutawwi police"
 common_54_desc:0 "Some infidels and hostile elements incite political propositions that violate the Quran, and we will take coercive measures to silence them."
 common_55:0 "Mujahedeen"
 common_55_desc:0 "The campaign against infidels has begun, and for the sake of truth, we will crush everything that goes against Islam!Anllah hu-Akbar!"
 common_56:0 "Nationalism"
 common_56_desc:0 "Nationalism had its embryonic form as early as BC, and the confrontation between royal and religious power in modern Europe and the development of capitalism promoted the formation of nationalism. The French Revolution and Napoleonic Wars marked the birth of nationalism. Due to the recognition of a common culture, region, or ideology, national consciousness unites a nation and mobilizes the entire population to serve the interests of the country. All sectors of society in a country work together to fight for the interests of the nation."
 common_57:0 "Militarist"
 common_57_desc:0 "All human, financial, and resource resources of a country are used for military construction and warfare, and in turn, the country's economy is supported by foreign wars, which is a manifestation of militarism. The earliest militaristic country in history was the Assyrian Empire in the Mesopotamian region. In modern times, Prussia, the German Empire, and the Japanese Empire have all become typical militaristic countries, relying entirely on foreign aggression and resource plundering for their national economies, and then using these resources for military construction."
 common_58:0 "Ideological education"
 common_58_desc:0 "If we want our people to contribute to our country anytime, anywhere, we must start educating and transforming them from a young age, cultivating them into the ideal citizens we need!"
 common_59:0 "Youth league"
 common_59_desc:0 "The operation of the state machinery cannot be separated from people, especially these new young people."
 steel_produc:0 "Steel industry"
 steel_produc_desc:0 "In terms of mass, iron is the most common element on Earth, and it has good ductility when heated... and is very useful. Iron began around 3500 BC and was discovered in Gelzakh, Egypt. Iron was very useful for various things needed by early civilizations, such as cooking pots, small hardware, tools, and sharp weapons used to stab others."
 common_60:0 "Sharia"
 common_60_desc:0 "The feudal social organization centered on Islam has existed in our country for thousands of years, and Sharia is the wisdom crystallization of our pan Islamic civilization. It is an indisputable divine law that has withstood the test of time and guides all Muslim societies."
 common_61:0 "Land reform"
 common_61_desc:0 "In the process of industrialization in agricultural society, land, which was equivalent to power, status, and wealth in the old era, must be thoroughly mobilized. Whether in the form of commodification reform or public ownership reform, all old social classes centered on land must be completely eliminated by the new commodity economy, with their property becoming capital for investment and farmers becoming workers. This is the ultimate goal of land reform."
 focus_landreform_tool:0 "§RLand reform will reduce the tax revenue provided by farms§W"
 common_62:0 "Maintain monarchical rule"
 common_62_desc:0 "Monarchy is not just a burden in the old society as claimed by some self righteous individuals. In our country, the supreme monarch symbolizes the irreplaceable traditions and culture in our society. A tyrant desires power, while a monarch desires honor. The guards of the tyrant are mercenaries, while the guards of the monarch are citizens."
 common_63:0 "Basic industrialization"
 common_63_desc:0 "The policy of initial industrialization will be the beginning of a series of economic development and social transformation movements. We will make every effort to eliminate the old privileged groups and use the capital extracted from the land economy to expand industrial construction together with international investment."
 common_64:0 "Civil industrial construction  I"
 common_64_desc:0 "The basic light industries developed by smaller economies in the international market typically include food processing, cement, cotton spinning, and other industries that directly connect with primary industries such as agriculture, animal husbandry, and mining."
 common_65:0 "Civil industrial construction  II"
 common_65_desc:0 "On the basis of basic light industry, government agencies in small economies usually further support the industrial expansion of their domestic ethnic capitalists. Or adopt the model of public-private partnership, protect industries, or try to connect with international capital from the first and second world."
 common_66:0 "Civil industrial construction  III"
 common_66_desc:0 "After establishing a certain scale of basic civilian industry, emerging or revitalized economies can further develop small commodity production bases and primary product precision processing industries."
 common_67:0 "Militarist industrial construction  I"
 common_67_desc:0 "The current scale of military industry can no longer meet the basic needs of national defense."
 common_68:0 "Militarist industrial construction  II"
 common_68_desc:0 "After World War II, the international situation changed rapidly, and we need to further expand our country's military production capacity to ensure self-sufficiency in weapons and equipment."
 common_69:0 "Militarist industrial construction  III"
 common_69_desc:0 "The weapons and equipment in the new era are more complex, diverse, and expensive. Only by further expanding China's military industrial complex can we free up sufficient production capacity to catch up."
 common_70:0 "Political commissar system"
 common_70_desc:0 "Political commissars are representatives among the military, managing their ideological and political education to ensure that the military always submits to the leadership of the party."
 common_71:0 "Youth pioneers"
 common_71_desc:0 "The Young Pioneers are the successors of the communist cause, and cultivating the Young Pioneers is to cultivate the future of the Party and socialism."
 common_72:0 "Close to Socialist states"
 common_72_desc:0 "Since the establishment of the Soviet Union, the socialist camp has adhered to a diplomatic strategy of supporting global national liberation movements and combating imperialism. This coincides with the international interests of our regime."
 common_73:0 "Comecon"
 common_73_desc:0 "The global economic order of the socialist camp is based on the principle of industrial mutual assistance. In short, the socialist camp invests in the industrial development of allied countries in the form of free or low compensation aid and assistance, in order to increase the consumption power and proletarian population of the allied countries and sign various alliance treaties."
 common_74:0 "Education reform"
 common_74_desc:0 "The education industry developed before World War II is increasingly unable to meet the demand for industrial talents in China's economy and society. We must use administrative measures to accelerate the popularization of public and international science and education systems nationwide."
 common_75:0 "Urbanization"
 common_75_desc:0 "Urbanization is an inevitable result and one of the prerequisites of industrialization. The technological revolution has freed human settlements from the constraints of natural conditions, and the demand for labor in industrialization has led to a large number of people leaving rural areas and entering cities. In the second half of the 20th century, a large number of people around the world migrated to cities for living, providing labor for industrial construction. However, this also means that it will be a challenge to the government's construction capacity. Urbanization requires reasonable urban planning, education, healthcare, power supply and sewage systems to support it. Cities without these services will be huge slums."
 common_76:0 "Military modernization"
 common_76_desc:0 "Many military inventions that emerged during World War II were applied in actual combat by major powers such as the United States and the Soviet Union after the war, such as helicopters, missiles, composite armor, mechanized vehicles, and equipment made of synthetic materials. Military technology is constantly evolving, and if we stagnate in military research, we may fall behind at any time."
 common_intel_war:0 "Military digitalized"
 common_intel_war_desc:0 "The emergence of computers has changed modern warfare, as they are widely used not only in people's lives but also in military affairs. Computers can simplify the operation of complex tanks, planes, and warships, help calculate the trajectory of shells, and better process and even obtain intelligence... A digital army will enable us to fight a war in the 21st century."
 common_intel_war:0 "igital warfare"
 common_intel_war_desc:0 "The emergence of computers has changed modern warfare, as they are not only widely used in people's lives, but also in military affairs. Computers can simplify complex tank, aircraft, and naval operations, help calculate the trajectory of shells, and better process and even obtain intelligence... A digital army will enable us to fight a 21st century war."
 common_77:0 "Navy construction"
 common_77_desc:0 "Whoever controls the ocean holds the initiative in modern warfare. The existence of a navy can at least prevent the enemy from blockading our maritime territories."
 common_78:0 "Airforce"
 common_78_desc:0 "Fighter jets and bombers roared and dominated the skies during the two World Wars, showcasing the role and importance of aerial armament to countries around the world. They could fight, transport, scout, and destroy enemy rear areas... In short, a qualified air force is essential for a modern army, at least we must ensure that the planes above us are not enemy.。"
 common_79:0 "Royal Cabinet"
 common_79_desc:0 "Appointing politicians loyal to the monarch to form a cabinet, even under a constitutional monarchy, the government must still obey us"
 common_80:0 "Territorial expansion"
 common_80_desc:0 "Our sword is ready to acquire more land for our plow"
 common_80_tool:0 "The core of surrounding land can be claimed by decisions"
 common_81:0 "National socialism"
 common_diplomacy:0 "Foreign policy"
 common_diplomacy_latins:0 "Improving relations with Latin American"
 common_diplomacy_latins_desc:0 "Under the situation of equal diplomacy and national liberation in the postwar world, even the United States with Monroe Doctrine could not completely block the diplomatic channels of Latin American countries and monopolize their market share. We can take this opportunity to engage in political and economic cooperation with Latin American countries."
 common_diplomacy_asia:0 "Improve relations with Asian"
 common_diplomacy_asia_desc:0 "The newly liberated nation states in Asia are characterized by lagging industrial development but abundant human and natural resources. They are a group of underachievers with greater potential in backward countries or regions. It is beneficial and harmless for us to have friendly exchanges with them in advance."
 common_medic:0 "Promote medical construction"
 common_medic_desc:0 "The development of the public medical industry is an important factor that affects a country's population structure and labor quality. How to maintain national health has also been an important indicator of the success of a regime since ancient times."
 diplomatic_detail_box:0 "You need a sufficient intelligence network to view diplomatic relations"
 common_missile:0 "Develop missile tech"
 common_missile_tool:0 "Unlocking and using missile development enterprises"
 common_missile_desc:0 "Missile technology is probably one of the most important military inventions of the 20th century. It was first born in the V2 rocket of Germany during World War II and was perfected during the US Soviet hegemony in the 1950s. The earliest missiles were guided by infrared thermal sensing and adjusted their trajectory by receiving the reflected heat and light from the target. Later, television guidance and active laser guidance emerged. Missiles are widely used, including large ballistic missiles, guided bombs, or infantry, vehicle mounted anti-tank, or antimissile missiles. They greatly improve the operational efficiency of the military, but the biggest problem is that they are too expensive."
 focus_electro:0 "Develop the electronics industry"
 focus_electro_desc:0 "The computer is undoubtedly one of the greatest inventions of the 20th century, perhaps not one. The operation of ENIAC circuit boards in 1948 marked the birth of the third technological revolution. In the 1960s, with the introduction of civilian computers, human lifestyles were greatly changed, and many tedious tasks could be assisted or even replaced by computers. At first, computers could only help with paperwork, but later on, they had more functions, such as drawing, faxing, simulation, and entertainment. Computers can not only help people work. For many countries in the 1980s, computers were also a ladder for economic take-off. Japan, South Korea, Taiwan and Chinese Mainland in Asia achieved rapid economic growth by undertaking computer manufacturing."
 focus_electro_tool:0 "Unlock the use of electronic enterprises"