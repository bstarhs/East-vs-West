 isr.24.d:0 "Predient [USA.GetLeader] announced recognition of the national sovereignty of the State of Israel and the establishment of diplomatic relations with it."
 
 isr.25.t:0 "Immigrants from Europe have arrived"
 isr.25.d:0 "A group of immigrants from Europe have arrived at the port of Tel Aviv."
 
 isr.26.t:0 "以色列国防军成立"
 isr.26.t:0 "以色列政府宣布收编哈加纳、伊尔贡和莱希等民间武装组织，将其改编为正式的以色列国防军。"
 
