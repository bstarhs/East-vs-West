l_english:
 isr.1.t:0 "Palestine and Israel Independence"
 isr.1.d:0 "According to the decision of the United Nations, in August 1948, the United Kingdom officially announced the end of its jurisdiction over the Palestinian territories. Israel and Palestine, two Jewish and Arab states, respectively, were born on this land. But the decision was controversial - Jerusalem, a holy place for Jews and Muslims, was eventually handed over to Israel, and Muslims were extremely dissatisfied with it."
 isr.1.a:0 "At least Jews don't have to roam anymore."
 
 isr.2.t:0 "War on Israel!"
 isr.2.d:0 "After the Palestine Resolution was passed, Palestine was divided into two parts. The Jews not only stole the Arab lands, they also occupied the holy city of Jerusalem! This is intolerable! We must retake the holy city and defend the Muslim honor!"
 isr.2.a:0 "Allahu Akbar!"
 isr.2.b:0 "It's nothing to do with us."

 isr.3.t:0 "Jordan occupies Jerusalem!"
 isr.3.d:0 "After fierce competition, the Jordanian army occupied most of the West Bank area, including Jerusalem."

 isr.4.t:0 "We need a ceasefire!"

 isr.6.t:0 "Israel's occupation of Jerusalem"
 
 isr.7.t:0 "Israel's occupation of the Sinai Peninsula"
 
 isr.8.t:0 "The United States proposes a peace agreement"

