 isr.13.t:0 "The attacks by the PLO"
 isr.13.d:0 "The Palestinian Liberation Organization has regrouped its armed forces and launched attacks on the stationed Israeli army."
 isr.13.a:0 "OK"
 
 isr.15.t:0 "Israel Invasion!"
 isr.15.d:0 "The Israeli army suddenly shelled the Egyptian garrison on the Sinai peninsula and the Syrian army on the Golan Heights. Then a huge Israeli armored force launched an invasion across the border! The operation, said Israeli army commander Moses Designed to eliminate Arab threats to Israel's border security."
 isr.15.a:0 "The Middle East War broke out"
 
 isr.16.t:0 "Massacre in Deir Yassin Village!"
 isr.16.d:0 "The Israeli army suddenly shelled the Egyptian garrison on the Sinai peninsula and the Syrian army on the Golan Heights. Then a huge Israeli armored force launched an invasion across the border! The operation, said Israeli army commander Moses Designed to eliminate Arab threats to Israel's border security."
 isr.16.a:0 "The Middle East War broke out"
 
 isr.17.t:0 "Israel occupied the Golan Heights"
 
 isr.18.t:0 "Action to suppress the Palestinian Liberation Organization"
 isr.18.d:0 "Our army has searched and destroyed the bases and troops of the Palestinian Liberation Organization, achieving good results. Some Palestinian Liberation organizations have been defeated and retreated to the mountains, and they will not appear again for a long time."
 isr.18.a:0 "Good."
 
 isr.19.t:0 "The suppression of the Palestinian Organization failed!"
 isr.19.d:0 "Our troops launched a search operation and attacked the PLO, but they failed! The PLO has defeated our troops and seized many weapons!"
 isr.19.a:0 "Bad news."

