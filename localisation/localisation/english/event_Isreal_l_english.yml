 isr.11.t:0 "Resistance of Palestine"
 isr.11.d:0 "The Palestinian Liberation Organization has regrouped its armed forces in the West Bank of the Jordan River."
 isr.11.a:0 "OK"
 
 isr.12.t:0 "Resistance of Palestine"
 isr.12.d:0 "The Palestinian Liberation Organization has regrouped its armed forces in the West Bank of the Gaza."
