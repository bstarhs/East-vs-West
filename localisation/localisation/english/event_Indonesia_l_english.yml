l_english:
 ind.1.t:0 "The War on the East Indies"
 ind.1.d:0 "Although we forced Indonesians who attempted independence to form a temporary federation with us, we found that the influence of communists in the Indonesian autonomous government was increasing. We have reason to believe that the local indigenous people are attempting to launch another rebellion, so perhaps we should preemptively take back all control of the East Indies region!"
 ind.1.a:0 "Eliminate the rebels!"
 ind.1.b:0 "We have stable rule over Indonesia and do not need war."

 ind.2.t:0 "Hague Peace Conferences"
 ind.2.d:0 "The war against the East Indies has sparked criticism from both domestic and international public opinion. The United Nations has called on the Dutch and Indonesian authorities to hold talks in The Hague, hoping to bring a peaceful future to Indonesia."

 ind.3.t:0 "Leaders of Independent Indonesia"
 ind.3.d:0 "Indonesia has gained freedom, but the issue of national leaders has not yet been settled. Some people support Sukarno's continued presidency, but others believe that with the growth of Indonesian communist forces, the anti communist Muhammad Hada is better able to deal with them."
 ind.3.a:0 "Sukarno will lead our country"
 ind.3.b:0 "Mohammad Hada will lead us in dealing with the reds."

 ind.4.t:0 "Bandung Conference held"

 ind.5.t:0 "[FROM.GetName] announcing participation in the Bandung Conference"
 ind.5.d:0 "[FROM.GetName] has announced that they will send a delegation to participate in the Asia Africa International Conference held in Indonesia to support the national liberation struggles of Asian, African, and Latin American countries against colonialism."

 ind.6.t:0 "China Refuses to Participate in the Bandung Conference"

 ind.7.t:0 "The growing power of the Communist Party"

 ind.8.t:0 "Rebellion in the Maluccus Islands!"

 ind.9.t:0 "The rise of Muslim power"

 ind.15.t:0 "A coup occurred！"
 ind.15.d:0 "A soldier from Jakarta Air Force Base attacked the Presidential Palace! They claim that the Communist Party is infiltrating our country, threatening President Sukarno, and demanding that the government immediately adopt anti communist policies!"
 ind.15.a:0 "SUpress them!"

 ind.16.t:0 "Muslims demand the establishment of an Islamic government"

 ind.17.t:0 "West Papua declares independence"
 ind.17.d:0 "After a hundred years of Dutch rule, West Papua declared its independence and establishment, but Indonesia regards West Papua as part of its territory, which may lead to new regional instability factors."

 ind.18.t:0 "West Papua declares independence"
 ind.18.d:0 "Under the operation of the Dutch, West Papua declared independence and established a government, but our nationalists believe that the region should be incorporated into our territory. Now we must make a decision whether to take military action to reclaim West Papua or to declare independence."

 ind.19.t:0 "Indonesia invades West Papua!"
 ind.19.d:0 "Shortly after West Papua declared independence, the Indonesian government immediately declared the independent establishment of the region illegal, and they should return to Jakarta's rule as part of the Republic of Indonesia. The Indonesian army has already begun operations, and a war is inevitable."

 ind.20.t:0 "Timor declares independence"
 ind.20.d:0 "After centuries of Portuguese rule, Timor declared independence and established itself, but Indonesia regards Timor as part of its territory, which may lead to new regional instability factors."

 ind.21.t:0 "Timor declares independence"
 ind.21.d:0 "Under the operation of the Portuguese, the East Timor region declared independence and established a government, but our nationalists believe that the region should be incorporated into our territory. Now we must make a decision whether to take military action to take East Timor into our pockets or declare it independent."

 ind.22.t:0 "Indonesian invasion of Timor！"
 ind.22.d:0 "Shortly after Timor declared independence, the Indonesian government immediately declared the independent establishment of the region illegal, and they should return to Jakarta as part of the Republic of Indonesia. The Indonesian army has already begun operations, and a war is inevitable."

 ind.23.t:0 "[ROOT.GetName] condemns Indonesia's invasion of East Timor!"
 ind.23.d:0 "[ROOT.GetName] condemns Indonesia's invasion of East Timor,and call on Indonesia to immediately withdraw its troops!"

 ind.24.t:0 "[ROOT.GetName] acknowledging the Indonesian occupation of East Timor"

 ind.30.t:0 "The Netherlands announces the end of the security war"
 ind.30.d:0 "With the Dutch army occupying most of the East Indies, the interim government of the Republic of Indonesia collapsed, and the Indonesian Republican faction was forced to engage in underground struggles. The Dutch army announced that they had regained territory in the East Indies, but small-scale resistance continued."

 ind.31.t:0 "[ROOT.GetName] establish"
 ind.31.d:0 "[ROOT.GetName] was declared established as a puppet regime under Dutch control."

