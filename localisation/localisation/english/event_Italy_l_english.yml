 ita.1.t:0 "The Trieste air crash"
 ita.1.d:0 "A US Air Force Douglas C-47B transport plane crashed in the Trieste area between Italy and Yugoslavia. Although the investigation found that the incident was not related to Yugoslavia, he added fuel to the tense situation in Trieste. The Trieste region was originally an Italian territory and was entrusted to the Allied forces of the United States, Britain, France, and the Soviet Union after World War II. Western countries hoped to establish an independent country in Trieste or return it to Italy, but Yugoslavia, supported by the Soviet Union, wanted to annex the region."
 ita.1.a:0 "OK"
 
 ita.3.t:0 "Italy's general election is imminent"
 ita.3.d:0 "The 1948 Italian Republic parliamentary elections are about to begin, with the Italian Communist Party representing left-wing forces facing the Catholic Democratic Party representing conservative forces. This will be an election that will determine Italy's future."
 ita.3.a:0 "Support the Catholic Democratic Party led by Mr. Gasperi and uphold Italian traditions."
 ita.3.b:0 "Support Mr. Togliati's Italian Communist Party and let Italy follow the socialist path."
 
 ita.4.t:0 "Leftist demonstrations and marches"
 ita.4.d:0 "The Italian general election ended with the victory of the Catholic Democratic Party, but some left-wing radicals were dissatisfied with this result. They demanded a new election to be held."
 ita.4.b:0 "The election has ended, there is no need."
 
 ita.5.t:0 "Rightist demonstrations and marches"
 ita.5.d:0 "The Italian general election ended with the victory of the Communist Party, but some right-wing radicals were dissatisfied with this result. They demanded a new election to be held."
 ita.5.b:0 "The election has ended, there is no need."
 
 ita.6.t:0 "The Catholic Democratic Party won the election!"
 ita.6.d:0 "After intense competition, the Catholic Democratic Party ultimately won the election and became the majority party in parliament. Archide Gasberg became the Prime Minister of Italy. He announced that he would protect Italy's traditions and democracy, maintain order and existing institutions in Italy."
 ita.6.a:0 "Viva l'Italia della giustizia!"
 
 ita.7.t:0 "Italian Communist Party accepts the election results"
 
 ita.8.t:0 "Italian right-wing parties accept election results"
 
 ita.9.t:0 "Attention to the situation in Italy"
 ita.9.d:0 "The Italian general election ended with the victory of the Communist Party, which sounded the alarm for free European countries. The continuous expansion of the Communist Party's power in Europe has threatened our interests, and their seizure of Italian power means that they will continue to expand into the Mediterranean region, which is unacceptable to us. Our diplomatic and intelligence agencies are demanding that we intervene as soon as possible."
 
 ita.10.t:0 "[From.GetName] declares boycott of Italian election results"
 ita.10.d:0 "[From.GetName] announcing the boycott of the Italian election results and condemning the Italian Communist Party for illegally seizing power."
 
 ita.11.t:0 "[From.GetName] declares acceptance of Italian election results"
 ita.11.d:0 "[From.GetName] announced recognition of the Italian election results and recognized the new Italian government formed by the Italian Communist Party."
 
 ita.12.t:0 "Italian left-wing armed revolt!"
 ita.12.d:0 "After the Catholic Democratic Party won the election, the political situation in Italy continued to deteriorate, and some radical left-wing groups began to organize armed forces and create riots."
 
 ita.13.t:0 "Italian right-wing armed revolt!"
 ita.13.d:0 "After the Communist Party won the election, the political situation in Italy continued to deteriorate, and some radical right-wing groups began to organize armed forces and create riots."
 
 ita.14.t:0 "The Italian People's Liberation Army is established!"
 ita.14.d:0 "The Italian People's Liberation Army announced its establishment in the mountainous areas of Tyrol! These Italian left-wing armed groups have received support from the Soviet Union and Yugoslavia, announcing an armed struggle aimed at overthrowing the Italian right-wing government!"
 
 ita.15.t:0 "The Italian Salvation Army is established!"
 ita.15.d:0 "The Italian Salvation Army is declared established in Naples! This right-wing Italian armed group has received support from Western countries such as England, the United States, France, and France, announcing an armed struggle aimed at overthrowing the Italian Communist government!"
 
 ita.16.t:0 "The Italian Civil War broke out!"
 ita.16.d:0 "Urgent message from Italy! The armed Italian Communist Party has launched riots in several large cities such as Milan, Venice, and Mantua, occupying local governments! The Italian Communist Party announced that the Italian People's Liberation War has begun, and they will use force to seize power, overthrow the right-wing government, and liberate all of Italy!"
 
 ita.17.t:0 "The Italian Civil War broke out!"
 ita.17.d:0 "Urgent message from Italy! Italian right-wing armed groups have launched riots in major cities such as Naples, Taranto, and Palermo, occupying local governments! The Italian Salvation Army announced that the Italian War of Protection has begun, and they will use force to overthrow the Communist Party and liberate all of Italy!"
 
 ita.18.t:0 "Sicily declares independence!"
 
 ita.19.t:0 "萨丁尼亚宣布独立！"
 
 ita.20.t:0 "威尼斯宣布脱离意大利人民政府！"
 
 ita.21.t:0 "托斯卡纳宣布独立！"
 
 ita.22.t:0 "教宗流亡法国"
 
 ita.23.t:0 "夺取的里亚斯特的最佳时机！"
 
 ita.24.t:0 "意大利人民政府与南斯拉夫的新边境条约"
 
 ita.25.t:0 "意大利人民政府拒绝南斯拉夫的索要"
 
 ita.26.t:0 "[From.GetName]军队进入干涉意大利内战"
 
 ita.27.t:0 "[From.GetName]军队进入干涉意大利内战"
 
 ita.28.t:0 "[From.GetName]提出和谈"
 
 ita.29.t:0 "[From.GetName]拒绝和谈"
 
 ita.30.t:0 "The Italian Communist Party wins the election!"
 ita.30.d:0 "After fierce competition, the Italian Communist Party ultimately won the election and became the majority party in parliament. The General Secretary of the Italian Communist Party, Palmillo Togliati, became the Prime Minister of Italy. He announced the establishment of a socialist government and will lead Italy towards a socialist path."
 ita.30.a:0 "Viva l'Italia socialista!"
 
 ita.35.t:0 "Vittorio Emmanuel III passed away"
 ita.35.d:0 "Former Italian King Vittorio Emmanuel III passed away in Egypt at the age of 78. Vittorio Emmanuel III ascended to the throne in 1900 and led Italy through two world wars. At the end of World War II, he was forced to abdicate and flee overseas. Umberto II, son of Vittorio Emmanuel III, is currently the heir to the throne of the Savoy dynasty in Italy, but he has no intention of opposing the already established Italian republican regime."
 ita.35.a:0 "Viva l'Italia socialista!"
 
 ita.36.t:0 "Peace Accord with Italy"
 ita.36.d:0 "The Italian government signed a peace treaty with countries such as Britain, France, the United States, and the Soviet Union, marking the official end of Italy's state of war with other belligerent countries. Italy resumed normal diplomatic and political operations, but still imposed certain restrictions on its military development and fascist movement."