 sau.2.t:0 "Preparation of the Organization of Petroleum Exporting Countries"
 sau.2.d:0 "[FROM.GetName] proposes to establish the Organization of Petroleum Exporting Countries to counter the monopoly of Western oil companies and protect the interests of oil producing countries."
 sau.2.a:0 "We should participate!"
 
 sau.3.t:0 "Establishment of the Organization of Petroleum Exporting Countries"
 sau.3.d:0 "[FROM.GetName] proposes to establish the Organization of Petroleum Exporting Countries to counter the monopoly of Western oil companies and protect the interests of oil producing countries."
 sau.2.a:0 "A solidarity in the Third World."
 
 sau.4.t:0 "[FROM.GetName] Announces Membership in the OPEC"
 sau.4.d:0 "[FROM.GetName] Announces Membership in the Organization of Petroleum Exporting Countries"
 
 sau.5.t:0 "The Organization of Petroleum Exporting Countries announced a reduction in oil exports!"
 sau.5.d:0 "The Organization of Petroleum Exporting Countries, led by Saudi Arabia, has announced that in retaliation for Western countries' support for Israel in the Middle East War, the Organization of Petroleum Exporting Countries will reduce oil production and exports. Experts predict that this will lead to a rapid rise in oil prices and trigger an energy crisis and economic turmoil!"
 
 sau.6.t:0 "The United Arab Emirates is established!"
 sau.6.d:0 "After negotiations, former British protectorates such as Abu Dhabi and Dubai located in the Persian Gulf officially declared independence and established a federal United Arab Emirates."
 
 sau.7.t:0 "Invitation from Abu Dhabi"
 sau.7.d:0 "Abu Dhabi invites us to join the newly established United Arab Emirates with the aim of unifying the various states of the Gulf region."
 
 sau.8.t:0 "[FROM.GetName] announced its accession to the United Arab Emirates."
 sau.8.d:0 "[FROM.GetName] announced its accession to the United Arab Emirates."
 
 sau.9.t:0 "[FROM.GetName] reject its accession to the United Arab Emirates."
 sau.9.d:0 "[FROM.GetName] reject its accession to the United Arab Emirates."