l_english:
 NUKE_BUTTON:0 "View the nuclear weapons console"
 
 nuclear_fusion:0 "Nuclear fusion"
 nuclear_fusion_desc:0 "Nuclear fusion refers to the release of energy when two atomic nuclei combine. The reason why the sun above us emits light and heat is because a large number of hydrogen atoms are attracted and combined by gravity due to the enormous mass of the sun, thus producing energy. If humans could artificially combine atomic nuclei, they could obtain enormous energy like the sun."
 LiD6:0 "Hydrogen isotope production"
 LiD6_desc:0 "Artificially creating nuclear fusion requires nuclear materials capable of undergoing fusion reactions, such as lithium deuterium or other hydrogen isotopes."
 Enriched_Uranium:0 "Enriched uranium production"
 Enriched_Uranium_desc:0 "The uranium content in natural uranium mines is extremely low, mostly consisting of low levels of uranium-238, which absorbs the neutrons released by the fission of uranium-235, making it difficult for chain reactions to occur. To obtain nuclear fuel grade uranium-235, a complex and arduous purification process must be carried out."
 Plutonium_techs:0 "Plutonium isotope preparation"
 Plutonium_techs_desc:0 "Plutonium-239 is a radioactive material obtained by inserting neutrons into uranium, which can undergo fission reactions with low purity uranium elements. The Fat Man atomic bomb was detonated in this way, making the manufacture of atomic bombs no longer require high-purity uranium ore, but it is also an extremely complex technology."
 fat_man:0 "Implosion plutonium bomb"
 fat_man_desc:0 "The Fat Man atomic bomb, which uses an implosion plutonium bomb structure, has a much greater power than the little boy. Place plutonium fuel in the middle of a large iron ball and install explosives around the ball. The implosion pressure generated by the explosives during the explosion will compress the plutonium fuel, causing it to undergo a chain reaction and detonate."
 breeder_reactor:0 "Fast neutron multiplication reaction"
 nuke_Centrifuge:0 "Improving the uranium hexafluoride centrifuge"
 nuke_Centrifuge_desc:0 "A high-speed centrifuge can be used to improve the purity of uranium. Reacting impure uranium material with fluorine gas to form uranium hexafluoride gas, which is then injected into a centrifuge for extraction."
 nuke_moderator:0 "Neutron moderator"
 nuke_moderator_desc:0 "Neutron moderator refers to materials that can slow down nuclear fission and fusion, such as graphite, water, and heavy water. It can block the frequency of neutrons hitting other atomic nuclei to achieve the purpose of artificially controlling nuclear fission. It is an important material for human use of nuclear technology, especially energy."
 nuke_11111:0 "水下核试验"
 
 nuke_dest_title:0 "STRATEGIC WEAPONS CONTROL CENTRE"
 nuke_dest_current_nuke:0 "Current nukes: §Y[?num_of_nukes]"
 DEFCON:0 "DEFCON"
 nuke_unaviliable_text:0 "The strategic weapon system cannot be used now!\nTo use strategic weapons, you must:\n has developed nuclear weapons and has at least 10 nuclear bombs"
 nuke_deterrence:0 "Nuclear deterrence: §Y[?nuke_deterrence]"
 nuke_deterrence_text:0 "Nuclear deterrence is the ability of your nuclear weapons to intimidate hostile countries. The higher your nuclear deterrence capability, the more the other party dare not use nuclear weapons against you. On the contrary, if it is too low, the nuclear powers will use more military threats against you."
 nuke_base_num:0 "Standby launch base:§Y[?nuke_base_num]"
 nuke_base_text:0 "Here you can command the number of nuclear weapon launch bases, including missile silos and bomber squadrons. \n if these units are destroyed, you will not be able to launch a nuclear bomb."
 launch_tips:0 "Click to launch a nuclear bomb into the region\nYou need to：\n   §Yat war§W with this country\n   has §Y5§W nukes\n   has §Y5§W staby order\n   this area is in range of §Ystrategic bombers §Wor §YICBM§W\nor the fleets with §Ystrategic nuclear submarine§W in the nearby ocean\n      §R“I CAN FLY!MEIN FUHRER!!!!!”§W"
 nuke_state_name:0 "§Y[THIS.GetName]§W has completed nuclear weapons project"
 current_nuke_production:0 "Nuclear weapon production efficiency：[?nuke_produc_speed]"
 edit_nuke_production:0 "Click here to edit nuke production efficiency,limit is [?nuke_produc_max]\nIt will add military expenditure"
 nuke_limit_num:0 "Limit of nuclear arsenal: §Y[?nukes_limit]"
 nuke_limit_num_text:0 "The upper limit of a nuclear arsenal is the limit on the maximum number of nuclear bombs you can have. When you produce nuclear bombs beyond this limit, production will stop. You can increase this limit by researching technology or increasing nuclear arsenals, but it may increase global tension."
 nuclear_planes_num:0 "Standby strategic bomber:§Y[?num_deployed_planes_with_type@strat_bomber_equipment]\n§WStandby nuclear missile:§Y[?num_deployed_planes_with_type@guided_missile_equipment]"
 nuclear_ships_num:0 "Standby nuclear submarines:§Y[?num_ships_with_type@nuclear_submarine]§W"