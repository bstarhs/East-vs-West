 jap.25.t:0 "Japan's Repression of Student Movement"
 jap.25.d:0 "Breaking news from Tokyo! Under the order of Japanese Prime Minister Nobusuke Kishi, several units of the Japanese Self-Defense Forces entered Tokyo. The Japanese authorities declared martial law, and then the Self-Defense Forces began to use force to suppress the opposition movement. The demonstrators threw stones, Molotov cocktails and homemade weapons at the Self-Defense Forces in resistance, and most of Tokyo has been reduced to a battlefield!"
