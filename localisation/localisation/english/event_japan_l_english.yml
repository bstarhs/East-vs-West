 jap.1.t:0 "San Francisco Peace Treaty"
 jap.1.d:0 "Representatives of the United States and Japan signed the "Peace Treaty with Japan" in San Francisco. This treaty declared the official end of the Japan-U.S. war and the official end of the military occupation of Japan. On the other hand, the treaty declared the recognition of Japan The current regime has aroused the dissatisfaction of the Soviet Union, the CCP, and the leftist forces in Japan."
 jap.1.a:0 ""
 
 jap.2.t:0 "The Tokyo Trials are over"
 jap.2.d:0 "After two years of trials, the Far East International Military Tribunal has announced the end of trials against 14 Japanese A-level war criminals, including Hideki Tojo, Kenji Tokai, and Masatoro Itagaki. Most Class A war criminals have been sentenced to death."
 jap.2.a:0 ""
 
 jap.3.t:0 "War criminals released"
 jap.3.d:0 ""
