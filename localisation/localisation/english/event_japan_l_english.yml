 jap.9.t:0 "Security Law"
 jap.9.d:0 "The Japanese Occupation Command, under U.S. control, publishes the Vigilance Act, a hard-line crackdown on the growing Japanese Communist Party and other left-wing forces."
 jap.9.a:0 ""
 
 jap.10.t:0 "Showa Denko Scandal"
 jap.10.d:0 "Japanese media exposed a scandal involving the government. Showa Electric Company bribed several officials nearly 70 million yen in order to obtain loans from the Japanese government. The coalition cabinet of the Socialist Party, Democratic Party, and National Synergy Party, led by Ashida Hitoshi as prime minister, was forced to resign, and the Democratic Liberal Party, led by Shigeru Yoshida, came to power as the largest opposition party."
 jap.10.a:0 ""
 jap.10.b:0 ""
 
 jap.11.t:0 "Free Democratic Party established"
 jap.11.d:0 "As Japan's left, led by the Japan Social Party, continues to grow, conservative and right-wing forces have realized the importance of uniting. With the support of right-wing politicians such as Yoshida Shigeru, Kishi Nobuosuke, and Ogata Taketora , The Liberal Party of Japan and the Democratic Party of Japan announced their merger into the Liberal Democratic Party, which will become the largest conservative party in Japanese politics in the future."
