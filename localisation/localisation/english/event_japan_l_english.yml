 jap.6.t:0 "Katayama Tetsuya's Cabinet Resigns"
 jap.6.d:0 "After the establishment of the Katayama Tetsuya Cabinet, everything went wrong, and a series of pressures from within the party, outside the party, and the United States made it difficult for them to implement policies. Prime Minister Katayama announced his resignation, and Ashida Hitoshi from the Liberal Party of Japan took over as Prime Minister."
 jap.6.a:0 ""
 
 jap.7.t:0 "Social Party Split"
 jap.7.d:0 "After the signing of the San Francisco Peace Treaty, the Japanese Social Party had a huge disagreement over whether to recognize the Treaty, which eventually led to the split of the Social Party into left and right."
 jap.7.a:0 ""
 
