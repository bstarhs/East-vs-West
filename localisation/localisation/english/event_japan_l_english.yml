 jap.55.t:0 "Sato Eisaku resigns"
 jap.55.d:0 "The news of President Nixon's visit to China shocked the world. Prime Minister Sato realized that his previous hostile policy towards China was a major mistake. He wrote to Chinese Premier Zhou Enlai, hoping to promote the establishment of diplomatic relations between China and Japan, but The Chinese government thought Sato was a liar and refused. Sato's popularity in the Liberal Democratic Party declined, and he was finally forced to resign. Other senior members of the Liberal Democratic Party began to compete for a new president, and it is clear that the resumption of diplomatic relations between China and Japan has become an important part of the competition."
 jap.55.a:0 "Mr. Fukuda is the right person."
 jap.55.b:0 "Mr. Tanaka is the right person."

 jap.56.t:0 "[JAP.GetLeader] request to visit China"
 jap.56.d:0 "After US President Nixon's visit to China, the Japanese Prime Minister [JAP.GetLeader] also raised the idea of ​​seeking an early visit to China and ending the abnormal state between China and Japan."
