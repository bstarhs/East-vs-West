 jap.27.d:0 "The demonstrations in Tokyo, Japan were brutally suppressed. Hundreds of demonstrators were shot and killed by the Self-Defense Forces. After the situation was basically under control, Kishi declared a national emergency and the Diet was dissolved. Martial law in Tokyo and the arrest of a large number of opposition politicians."
