 jap.21.t:0 "Japan-US Security Treaty"
 jap.21.d:0 "Under the great controversy, the Prime Minister of Japan [JAP.GetLeader] insisted on renewing and expanding the "Japan-US Security Treaty" signed with the United States, the Japanese Communist Party, Social Party, student organizations and all sectors of society Massive demonstrations were launched, reactionary security treaties, and demands for the dissolution of the Diet, and Kishi's resignation."
 jap.21.a:0 ""
 
 jap.22.t:0 "Anti-Security Treaty Movement"
 jap.22.d:0 "At the scene of the parliament where the "Security Treaty" was finally decided, the speaker, Ichiro Kiyori, who supported Nobusuke Kishi, called in the police to obstruct the entrance of the opposition lawmakers, and unilaterally passed the bill in the absence of many people. This violation completely angered the people who opposed the treaty. The day after the bill was passed, more than 100,000 demonstrators surrounded the Japanese parliament building and clashed violently with the police."
 jap.22.a:0 ""
 jap.22.b:0 ""
 
 jap.23.t:0 "The Birch Michiko Incident"
 jap.23.d:0 "The first casualty appears in the vigorous Japanese security treaty movement! Tokyo University female student Kagura Michiko died unexpectedly in a clash with the police! Although the police insisted that Michiko fell and died of her own injuries, but In the eyes of the angry crowd, Michiko was undoubtedly killed by the police beating. Michiko's death ignited the anger of the demonstrators."
 jap.23.a:0 ""
 
