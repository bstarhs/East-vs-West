 jap.94.t:0 "A mutiny broke out in Tokyo！" 
 jap.94.d:0 "Message from Tokyo! The Japanese Self Defense Forces stationed in Tokyo, Japan, suddenly broke into the urban area, took control of the political center of Japan, the Xiaguan area, seized a large number of government officials, and announced the launch of a new round of revolution. The leader of these mutinies was Yukio Mishima, a right-wing writer who advocated the revival of Bushido and the Japanese Empire. He infiltrated the base through his acquaintances in the Self Defense Forces and incited rebellion."
 jap.94.a:0 "Madness！"

 jap.96.t:0 "A poisoning incident occurred in Tokyo, Japan" 
 jap.96.d:0 "A drug robbery occurred in Tokyo, Japan. A man disguised himself as a government worker and entered a bank to make the bank staff drink drugs to prevent infectious diseases. The staff then fell to the ground and died. The man disappeared after taking a check worth nearly 180000 yen. This matter has attracted widespread attention from Japanese society, especially as Japan is still under the control of the Allied forces led by the United States. Japanese people have expressed concerns about public security, and there are conspiracy theories that suggest that this matter involves the remnants of the Japanese Communist Party or the infamous 731 unit."
 jap.96.a:0 ""

