 jap.102.t:0 "Establishment of the Japanese Socialist Party Cabinet" 
 jap.102.d:0 "The Japanese parliament welcomed parliamentary elections. Against the backdrop of the rise of the left-wing movement in post-war Japan, the left-wing Socialist Party of Japan became the largest party in parliament with the support of the working class, and Tetsuya Katayama became the Prime Minister of Japan."
 jap.102.a:0 ""
