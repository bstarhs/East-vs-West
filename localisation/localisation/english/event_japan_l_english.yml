 jap.4.t:0 "The Constitution of Japan"
 jap.4.d:0 "Emperor Hirohito of Japan signed and promulgated a new Constitution of Japan, which declared that Japan would implement a democratic constitutional monarchy, safeguard human rights, and most importantly, completely abandon the country's right to war and military armament."
 jap.4.a:0 "I believe it can promote democratization in Japan"
 
