 jap.91.t:0 "Intense conflict erupts at the construction site of Narita Airport！" 
 jap.91.d:0 "In the Sanlizuka area on the outskirts of Tokyo, Japan, a fierce and bloody conflict broke out between the Japanese police mobile team and a coalition of local residents and left-wing groups in the airport. Since the Japanese government forced the construction of Narita Airport, disregarding the harm it posed to nearby residents, and even confiscated the land of local residents, opposition organizations supported by left-wing groups have been obstructing the airport for a long time. Today, the Japanese government decided to send police to forcibly expel the opposition, and the opposition then established simple buildings around the airport construction site to resist. After intense conflict, the police dispersed the opposition, but caused three deaths and over 700 arrests, making it the most serious mass movement after World War II. Sporadic opposition movements still exist, and the opposition has stated that they will fight the injustice brought by the government to the end."
 jap.91.a:0 ""

 jap.92.t:0 "Intense conflict erupts at the construction site of Narita Airport！" 
 jap.92.d:0 "“三里塚芝山連合空港反対同盟”再次在成田机场一带与警察爆发激烈冲突。"
