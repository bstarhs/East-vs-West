 jap.57.t:0 "China rejects [JAP.GetLeader] request"
 jap.57.d:0 "The Ministry of Foreign Affairs of the People's Republic of China has rejected the request of the Prime Minister of Japan [JAP.GetLeader] to visit China, and there is still a long way to go to normalize relations between the two countries."
 jap.57.a:0 ""

 jap.58.t:0 "[JAP.GetLeader] visits China"
 jap.58.d:0 "The special plane of the Japanese Prime Minister [JAP.GetLeader] landed at Beijing International Airport, outside ChinaMinister of Foreign Affairs Zhou Enlai met with him. This is the first official visit of a Japanese prime minister to the People's Republic of China. The purpose of this visit is to restore Sino-Japanese diplomatic relations and end the abnormal state between the two countries. "
