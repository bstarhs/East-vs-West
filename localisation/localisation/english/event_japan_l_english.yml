 jap.61.t:0 "The Sino-Japanese Joint Statement"
 jap.61.d:0 "After the Chinese and Japanese diplomats completed negotiations, the People's Republic of China and Japan officially issued a joint statement, announcing that Japan would sever diplomatic relations with the Republic of China and formally establish diplomatic relations with the People's Republic of China. Apologize to China for war crimes, and China forgoes war reparations for the sake of relations between the two countries.\n The ROC authorities are clearly furious about this, but they still refuse to comment on the matter."
