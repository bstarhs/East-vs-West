 tur.5.t:0 "1950 Election"
 tur.5.d:0 "Since 1923,Turkey has rule by the Republican People's Party,lead by Kemal Atatürk and İsmet İnönü.After the World War,liberalism began to rise.Adnan Menderes,Mahmut Celal Bayar and their Democratic Party ask for political freedom and multi parties.The Democratic Party get the support from rural and private enterprises./n Now,the General election of 1950 is come,Which one can be the ruling party in Turke?"
