 tur.40.t:0 "Soviet Union claimed the navigation in the Turkey Strait!"

 tur.41.t:0 "Turkey agrees the free passage of the Soviet Union through the Türkiye Strait"
 tur.41.d:0 "Under the diplomatic, political and military deterrence of the Soviet Union, Türkiye was forced to announce that it agreed to amend the Russian Turkish Treaty and a series of agreements on military navigation in the Dardanelles Strait, the Gallipoli Strait and other places, allowing the Soviet navy to cross the region to the eastern Mediterranean. This matter has raised concerns among Western countries, as the Soviet Union will have the opportunity to enter the Eastern Mediterranean and deter Greece, Italy, the Middle East, and the Suez Canal."

 tur.42.t:0 "Türkiye refuses Soviet passage through the Türkiye Strait"
 tur.42.d:0 "Despite the tremendous pressure exerted by the Soviet Union, Türkiye still firmly rejected the other party's request for military navigation through the Türkiye Strait. Serious contradictions occurred between the two countries. At the same time, the United States and other western countries expressed their support for Türkiye's decision."

 tur.43.t:0 "The Soviet Union made territorial claims on eastern Türkiye"
 tur.43.d:0 "The contradiction between the Soviet Union and Türkiye was further planned. The leaders of the Soviet Union announced that they would reconsider the territorial dispute between the two countries in eastern Asia Minor, including the territorial sovereignty of Georgia and Armenia under the control of the Soviet Union over Trabzong and Western Asia."