l_english:
 sov.1.t:0 "The establishment of the Communist Party and the Workers' Intelligence Bureau"
 sov.1.d:0 "The Communist Party and the Worker Intelligence Bureau were established in Moscow, with the aim of sharing and collecting political intelligence from various European countries to promote socialist movements."
 sov.1.a:0 "The Cold War confrontation situation is intensifying"
 
 sov.2.t:0 "Comrade Stalin's Birthday"
 sov.2.d:0 ""
 sov.2.a:0 "I wish Comrade Stalin a long life! Always healthy!"
 
 sov.3.t:0 "Invite Mao Zedong to visit Soviet Union"
 sov.3.d:0 ""
 sov.3.a:0 "Yes, immediately arrange for Comrade Mao Zedong's visit."
 sov.3.b:0 "This is not necessary."
 
 sov.4.t:0 "Request to China to lease Port Lushun"
 sov.4.d:0 ""
 sov.4.a:0 "The nascent socialist China really needs the protection of a powerful Soviet."
 sov.4.b:0 "Forget it, don't hurt Sino-Soviet relations because of this incident."
 
 sov.5.t:0 "China reportedly refused to lease Port Arthur"
 sov.5.d:0 ""
 sov.5.a:0 "We may need to take a tough stance."
 sov.5.b:0 "Forget it, don't hurt Sino-Soviet relations because of this incident."
 
 sov.6.t:0 "The Sino-Soviet Treaty of Friendship and Alliance was signed"
 sov.6.d:0 ""
 sov.6.a:0 "The Chinese and Russian people will always be brothers!"
 
 sov.7.t:0 "The establishment of the Communist Party and the Workers' Intelligence Service"
 sov.7.d:0 "The Communist and Workers' Intelligence Service was established in Moscow to share and collect political intelligence from various European countries to promote the socialist movement. Moscow has sent us a message inviting us to join."
 sov.7.a:0 "It's good for us."
 sov.7.b:0 "This is not necessary."
 
 sov.8.t:0 "Committee for Mutual Economic Aid"
 sov.8.d:0 "Committee for Mutual Economic Assistance was established in Moscow. The purpose of this organization is to provide economic aid and trade support to member states. Moscow invites our country to join."
 sov.8.a:0 "It's good for us."
 sov.8.b:0 "This is not necessary."
 
 sov.9.t:0 "Stalin is dead!"
 sov.9.d:0 "On March 5, 1953, the great leader and mentor of the working people of the world, Chairman of the Council of Ministers of the Soviet Union, Secretary of the Central Committee of the Communist Party of the Communist Union, General Marshal of the Soviet Union Joseph Visario Novi Chi Stalin died of a sudden illness. Comrade Stalin suddenly collapsed while everyone was drinking, and Comrade Stalin died of a cerebral hemorrhage after a forensic examination."

 sov.10.t:0 "Criticism of Beria"
 sov.10.d:0 "Since Stalin's death, Lavlenti Beria has become the second-largest figure in the Soviet Union after Malenkov. Beria vigorously advocated liberalization policies, including the release of political prisoners, de-Russiaization And the de-escalation of the United States. This caused dissatisfaction at the top of the Soviet Union, including Molotov, Khrushchev and Kaganovich."
 sov.10.a:0 "Against Belial!"
 sov.10.b:0 "The charges against Beria are fabricated!"

 sov.11.t:0 "Criticism of Malenkov"
 sov.11.d:0 "Today, at the plenary session of the CPSU Central Committee, the Central Committee members headed by Khrushchev denounced Malenkov's policy of de-escalation and nuclear abolition, and received the support of all members. Malenkov's Central Committee and the Presidium members Later, Malenkov was dismissed from the posts of Vice-Chairman of the Council of Ministers of the Soviet Union and Minister of Power Stations. In the subsequent meeting of the Soviet Union, Nikita Khrushchev and Lazar Kaganovich will compete for the Soviet Union. The chairmanship of the Union Council of Ministers."
 
 sov.12.t:0 "Warsaw Pact established"
 sov.12.d:0 "Soviet Union and other Eastern European socialist countries signed a mutual defense treaty in Warsaw, marking the establishment of the Warsaw Pact. The Warsaw Pact, led by the Soviet Union, will make the Communism regime's rule in Eastern Europe more stable."
 sov.12.a:0 "It's good for us."
 sov.12.b:0 "This is not necessary."
 
 sov.13.t:0 "Malinkov resigns"
 sov.13.d:0 "At the plenary session of the CPSU Central Committee, the Central Committee members headed by Khrushchev denounced Malenkov's policy of de-escalation and nuclear abolition, and received the support of all members. Then Malenkov was dismissed from his posts as Vice-Chairman of the Council of Ministers of the Soviet Union and Minister of Power Stations, and in the subsequent meeting of the Soviets, [SOV.GetLeader] was elected Chairman of the Council of Ministers."
 
 sov.14.t:0 "Criticism of Khrushchev"
 sov.14.d:0 "A group of Kaganovich's comrades made a critique of Khrushchev, accusing him of having to resign for various mistakes such as de-Stalinization during his tenure."
 sov.14.a:0 "Against Khrushchev!"
 sov.14.b:0 "The charges against Khrushchev are fabricated!"
 
 sov.15.t:0 "We shot down an American U2 reconnaissance plane!"
 sov.15.d:0 "We shot down an American U2 reconnaissance plane that was scouting and stealing our military intelligence in Central Asia. After the U2 was shot down, our ground forces captured a pilot. Now Washington This has to be explained."
 sov.15.a:0 "Put this out and let the world see what imperialism is doing."
 sov.15.b:0 "Power to Washington, they must make a deal if they don't want this to be exposed."
 
 sov.16.t:0 "Soviet Union shoots down a U2 reconnaissance plane!"
 sov.16.d:0 "Soviet Union shot down a Chinese U2 reconnaissance plane! The reconnaissance plane departed from Pakistan to the hinterland of the Soviet Union and was shot down in Central Asia. The pilot was captured by the Soviet army. The Soviet Union warned that if you do not want this To be made public, we must exchange for a sufficient number of captured Soviet Union spies."
 sov.16.a:0 "We have no choice."
 
 sov.17.t:0 "Soviet Union shoots down a U2 reconnaissance plane!"
 sov.17.d:0 "Soviet Union shot down a Chinese U2 reconnaissance plane! The reconnaissance plane set off from Pakistan to the hinterland of the Soviet Union, was shot down in Central Asia, and the pilot was captured by the Soviet army. The Ministry of Foreign Affairs of the Soviet Union called a reporter, Announcing this violation of international law to the world will put the United States under enormous diplomatic pressure."
 sov.17.a:0 "We have no choice."
 
 sov.18.t:0 "City renamed"
 sov.18.d:0 "As part of its policy to remove the Stalin cult of personality, the Soviet Union government has changed the names of a large number of cities bearing Stalin, including Stalingrad, which had established meritorious deeds in World War II, will be Renamed Volgograd."
 sov.18.a:0 "Dating."
 
 sov.20.t:0 "Khrushchev was asked to resign!!"
 sov.20.a:0 "While General Secretary Khrushchev was on vacation in the Black Sea, some party members led by Brezhnev, Kosygin and Suslov held a meeting to demand Khrushchev's resignation."
 sov.20.b:0 "Khrushchev should stop his work."
 
 sov.21.t:0 "The new leader"
 sov.21.d:0 "Khrushchev has stepped down, who will replace him now?"
 sov.21.a:0 "Make Comrade Suslov the new general secretary."
 sov.21.b:0 "Comrade Brezhnev would be a suitable leader."
 
 sov.22.t:0 "Beria is executed"
 sov.22.d:0 "Lavrendy Beria, the Internal Affairs Council of the Soviet Union, was arrested on the spot at a meeting of the Presidium of the Council of Ministers of the Soviet Union, where he was accused of orchestrating an anti-party bloc that subverted the previous policies of the Soviet Union Recently, the Communist Party of the Soviet Union held a Central Plenary Session and decided to remove Beria from the Central Committee of the CPSU and expel him from the party. Beria was allegedly executed after a secret trial a few months later."
 
 sov.23.t:0 "Beria takes power"
 sov.23.d:0 "At a meeting of the Presidium of the Council of Ministers of the Soviet Union, clashes broke out at the top of the Soviet Union. Several people, led by Zhukov, tried to arrest Beria, but Beria resisted fiercely. Khrushchew Fu and Zhukov were shot dead, then the Ministry of Internal Affairs broke into the meeting site to control the situation, and Malenkov, general secretary of the CPSU Central Committee, was arrested. The forces supporting Beria declared the Soviet Union to enter a state of martial law, and Beria will serve as the chairman of the interim council of ministers take over power."

 sov.28.t:0 "Brezhnev is dead!"
 sov.28.a:0 "Make Comrade Suslov the new general secretary."
 sov.28.b:0 "Comrade Brezhnev would be a suitable leader."
 
 sov.27.t:0 "[SOV.GetLeader]'s biography published"
 sov.27.d:0 "Since Brezhnev became the general secretary of the Communist Party of the Soviet Union, he has resumed various personal cult activities. By accepting medals, shooting movies, etc., he has created propaganda for himself. As a "quiet Stalinization".\nRecently, Brezhnev published a new personal biography, to which the general secretary said: "I heard that everyone said that my autobiography was well written, so I bought a copy that day. Take a look. ""
 sov.27.a:0 "General secretary is humor"
 
 sov.29.t:0 "From Aldrich Amus"
 
 sov.30.t:0 "Dear Mr. Andropov"
 sov.30.d:0 "My name is Samantha Smith and I am 10 years old. Congratulations on your new job. I have been worried that Russia and the United States will be involved in a huge war. Would you choose war? If you don't Agreed, please tell me how you will help avoid war, you don't have to answer that, but I'm happy to answer if you want. Why do you want to conquer the world, or at least our country? God created the world, let us Share and take care of each other, not for contention or for a group of people to have it. Please let us do what we want and make everyone happy. Samantha Smith, Manchester, ME, USA."
 sov.30.a:0 "Why don't you invite this girl over here to see?"
 sov.30.b:0 "Boring fool girld."
 
 sov.31.t:0 "Smith Samantha visits Russia!"
 sov.31.d:0 "At the invitation of the general secretary of the Soviet Union Yuri Andropov, 14-year-old American girl Samantha Smith will visit Moscow. According to the arrangement of the Soviet Union, Samantha and her parents Will visit the Pioneers camp in Moscow and watch various shows."
 
 sov.32.t:0 "Andropov is dead!"
 sov.32.d:0 "Seventy-year-old Yuri Andropov died as Communist Party General Secretary of the Soviet Union after years of suffering from kidney disease. Despite his ambitious The Soviet Union has undergone drastic reforms, but time will not allow it to do more."
 sov.32.a:0 "This is a tragedy for the Soviet Union!"

 sov.34.t:0 "Nuclear accident at Chernobyl!!"
 sov.34.d:0 ""
 sov.34.a:0 "Do every thing we can do and save it!"
 
 sov.37.t:0 "Chernenko is dead!"
 
 sov.40.t:0 "Coup in Moscow!"
 sov.40.d:0 "This morning, radio and television news in Moscow was abruptly interrupted and replaced by a press conference of the State of Emergency Committee. The committee, headed by Yanayev, declared that President Gorbachev was unwell, The council took over. At the same time, the Soviet Union troops entered Moscow. With Gorbachev's whereabouts unknown, some other leaders of the Soviet Union denounced the act as a coup. Russian President Boris Yeltsin condemned the coup and was ready to go to the city of Moscow to seek Citizen support."

 sov.41.t:0 "Yeltsin and liberals refuse to compromise"

 sov.42.t:0 "Civil war broke out in Russia"
 
 sov.43.t:0 "Gorbachev resigns"
 sov.43.d:0 "Moscow has sent us a message to sign a treaty of mutual military assistance with our country. The leaders of the Soviet Union claim that it is the responsibility of the Soviet Union to assist the socialist revolution. With the support of the Soviet Union, we can further Good fight against imperialism and the opposition it supports."
 sov.43.a:0 "We should fight alongside the socialist camp."

 sov.44.t:0 "Create Commonwealth of Independent States"

 sov.45.t:0 "Create Commonwealth of Independent States"
 
 sov.50.t:0 "Soviet Union wants to sign a military treaty with us"
 sov.50.d:0 "Moscow sent us a message to sign with our country Military Mutual Assistance Treaty. Soviet Union leaders claimed that it was the responsibility of the Soviet Union to assist the socialist revolution. With the support of the Soviet Union, we can better fight imperialism and the opposition it supports. "
 sov.50.a:0 "We should fight alongside the socialist camp."
 sov.50.b:0 "This is not in our national interest."
 
 sov.51.t:0 "[Root.GetName] has declined our invitation."
 sov.51.d:0 "The leaders of [Root.GetName] have rejected our military alliance proposal, and their decision will expose themselves to the military threat of imperialism!"
 sov.51.a:0 "Fool!"
 
 sov.52.t:0 "Soviet Union invited us to join the Warsaw Pact"
 sov.52.d:0 "Moscow told us that, after discussions, the Presidium of Soviets believed that it would be feasible to invite us to join the Warsaw Pact, in order to protect us from imperialist aggression. At the same time, they also believed that as a socialist Country, we have a responsibility to help other comrades fight the military threat."
 sov.52.a:0 "We should fight alongside the socialist camp."
 sov.52.b:0 "This is not in our national interest."
 
 sov.53.t:0 "Nuclear alert!"
 sov.53.d:0 "The radar on our nuclear submarine picked up a sign that the United States fired a missile, we don't know where it was targeted, but it could be any city in our country. The rules of nuclear counterattack allow us to The U.S. strikes back first with a nuke. What do we do?"
 sov.53.a:0 "This is a false positive and ignore him."
 sov.53.b:0 "Nuclear war begins."
 
 sov.58.t:0 "Europe Liberation!"
 sov.58.d:0 "The NATO army was crushed at the touch of a button under the fierce offensive of the Red Army of the Soviet Union, our valiant soldiers broke through the Iron Curtain, liberated Paris, landed in Britain, planted the red flag in the sea from the Norwegian Sea To more than half of Europe in Gibraltar!\n Now, imperialism has to hide in North America, and we must choose between stopping the war and taking it easy, or continuing to attack the U.S. imperialist homeland."
 sov.58.a:0 "Europe is ours, we can choose to take it as soon as we can."
 sov.58.b:0 "Nuclear war begins."
 
 sov.59.t:0 "The Vigilant Rebellion!"
 sov.59.d:0 "There is a rebellion on the guided missile cruiser Vigilant of the Red Navy! Major Valery Sabrin kidnapped the captain, denounced the corruption and incompetence of the Soviet Union government to the sailors, accused them of betraying Lenin, and Call for the overthrow of the Moscow bureaucracy. The warning horn from Riga to Leningrad, down the Neva River, how do we respond?"
 sov.59.a:0 "Destroy the rebels now!"
 sov.59.b:0 "Sabrin is right, take this opportunity to shuffle Moscow."
 
 sov.60.t:0 "Vigilance Coup"
 sov.60.d:0 "The guided-missile cruiser Vigilance was hijacked by Soviet Union Lieutenant Colonel Valery Sabrin, who denounced the corruption of the Moscow bureaucracy and attempted to re-establish the Leninist government. The Soviet Union leader personally ordered the attack on the Vigilance. After the fighter jets grounded the Vigilance, the Marines boarded the ship and captured Sablin. Sablin will face a treason trial."
 sov.60.a:0 "What a pity, a man with ideals."
 
 sov.61.t:0 "[SOV.GetLeader] resigns."
 sov.61.d:0 "Soviet Union Lieutenant Valery Sabrin, who hijacked the guided-missile cruiser Vigilance, denounced the corruption of the Moscow bureaucracy and tried to re-establish a Leninist government. Sabrin's claims were supported in part by the Soviet Union With high-level support, they deliberately let Sabrin into Moscow and used it to put pressure on the general secretary [SOV.GetLeader]. [SOV.GetLeader] was eventually forced to resign, and the Politburo changed. Afterwards, Deputy Prime Minister Niko Ra Tikhonov became the new general secretary and Sabrin was able to enter the Politburo, but it remains to be seen whether this will reinvigorate the politics of the Soviet Union."
 sov.61.a:0 "Where is the future of Social Union going?"
 
 sov.62.t:0 "Andropov is dead!"
 sov.62.d:0 "Ninety-year-old Yuri Andropov died as Communist Party General Secretary of the Soviet Union after several years of cancer. The Soviet Union has undergone drastic reforms, but time will not allow it to do more."
 sov.62.a:0 "This is a tragedy for the Soviet Union!"
 
 sov.63.t:0 "Soviet Union coup!"
 sov.63.d:0 "When Khrushchev, the general secretary of the Communist Party of the Soviet Union, was on vacation in the Black Sea, part of the party members led by Brezhnev, Kosygin and Suslov held a meeting to demand his resignation. Khrushchev The husband was eventually forced to step down and [SOV.GetLeader] took his place."
 sov.63.a:0 "A colossal turn of events."
 
 sov.64.t:0 "Corn Movement"
 sov.64.d:0 "Soviet Union Communist Party General Secretary Khrushchev delivered a speech after his return from his visit to the United States, and introduced the large-scale cultivation of corn in American agriculture. Khrushchev believes that corn can be used as both rations and as food. Feed for livestock is a valuable crop, and he called on the major agricultural bases of the Soviet Union to plant more corn to improve the agricultural situation of the Soviet Union."
 sov.64.a:0 "That's a good thing about corn."
 
 sov.65.t:0 "[SOV.GetLeader] speaks in Tashkent"
 sov.65.d:0 "Soviet Union Communist Party General Secretary [SOV.GetLeader] delivered a speech in Tashkent expressing ideas for improving Sino-Soviet relations, currently the People's Republic of China has not commented"
 sov.65.a:0 "A colossal turn of events."
 
 sov.66.t:0 "The nuclear test by the Soviet Union"
 sov.66.d:0 "The Soviet government carried out the largest nuclear test ever conducted on the Arctic Ocean's Novaya Zemlya Island, and nearly 50 million tons of explosive hydrogen bomb "Tsar" was detonated, with a power equivalent to 3800 times that of the Hiroshima atomic bomb."
 sov.66.a:0 "Nuclear weapons are developing."
 
 sov.67.t:0 "The Soviet Union announces political reforms"
 sov.67.d:0 "Soviet leader [SOV. GetLeader] announced that the Soviet Union will undertake comprehensive political reforms, including establishing an open and transparent democratic government and promoting freedom of speech."
 sov.67.a:0 "OK"
 
 sov.68.t:0 "The Glasnost"
 sov.68.d:0 "Soviet leader [SOV. GetLeader] proposed a new political proposition called Glasnost,which mean the Change, hoping to promote internal reforms in the Soviet Union."
 sov.68.a:0 "OK"
 
 sov.69.t:0 "The Soviet government proposed the Peaceful coexistence"
 sov.69.d:0 "Soviet leader [SOV.GetLeader] proposed a new diplomatic proposition called Peaceful Coexistence, advocating that socialist countries do not necessarily have to fight against capitalism through war, but can undermine the prestige of capitalism through economic and technological competition."
 sov.69.a:0 "OK"
 
 sov.70.t:0 "[FROM.GetName]announce support for the struggle of the Communist Vietnam"
 sov.70.d:0 "The Leader of [FROM.GetName],[FROM.GetLeader]Announce that they will firmly support the Vietnamese people's struggle against imperialism and its puppet regime."
 sov.70.a:0 "OK"
 
 sov.71.t:0 "The Soviet government criticizes China's revisionism"
 sov.71.d:0 "Soviet leader [SOV. GetLeader] announced a tough speech at the new party congress, criticizing the revisionism and dogmatism of Chinese leaders, which has brought serious harm to Sino Soviet relations."
 sov.71.a:0 "OK"
 
 sov.72.t:0 "The Soviet Union hopes to improve its relationship with [ROOT.GetName]"
 sov.72.d:0 "Soviet leader [SOV.GetLeader] stated that the Soviet Union hoped to establish friendly relations with [ROOT.GetName]."
 sov.72.a:0 "OK"
 
 sov.73.t:0 "The Soviet Union announces support for the struggle of [ROOT.GetName]"
 sov.73.d:0 "The leader of [SOV.GetName] announced that the country will firmly support the struggle of the [ROOT.GetName] people against imperialism and its puppet regime."
 sov.73.a:0 "OK"
 
 sov.74.t:0 "The Soviet Union announces economic reforms"
 sov.74.d:0 "Soviet leader [SOV.GetLeader] announced that the Soviet Union will carry out comprehensive economic reforms."
 sov.74.a:0 "OK"
 
 sov.75.t:0 "Anton Denikin death"
 sov.75.d:0 "Anton Ivanovich Denikin, the leader of the Russian White Army during the Russian Civil War and exiled to the United States, passed away."
 sov.75.a:0 "The end of an era."
 
 sov.76.t:0 "The disintegration of the Belarusian nationalist resistance movement"
 sov.76.d:0 "After being besieged by the Soviet army, the last organized armed group in Belarus announced the abandonment of their weapons, marking the end of the nearly decade long Belarusian nationalist rebellion after the end of World War II."
 sov.76.a:0 "OK."
 
 sov.77.t:0 "The collapse of the Metsavennad resistance movement"
 sov.77.d:0 "After the encirclement and suppression by the Soviet army, the last organized armed group in the Baltic States announced the abandonment of weapons, marking the end of the nearly decade long nationalist rebellion in the Baltic States after the end of World War II."
 sov.77.a:0 "OK."
 
 sov.78.t:0 "The disintegration of the Bandra resistance movement"
 sov.78.d:0 "After being besieged by the Soviet and Polish armies, the last organized Bandra armed group in western Ukraine and southeastern Poland announced the laying down of their weapons, marking the end of the nearly ten-year Bandra Ukrainian nationalist rebellion after the end of World War II."
 sov.78.a:0 "OK."
 
 sov.79.t:0 "The Soviet Union announces acceptance of the Marshall Plan"
 sov.79.d:0 "After consulting with representatives from countries such as the United States and the United States, Soviet Foreign Minister Molotov decided to announce acceptance of the Marshall Plan and receive post-war reconstruction assistance from Western countries. The socialist countries in Eastern Europe under Soviet vassal rule will also be included in the scope of Marshall Plan assistance."
 sov.79.a:0 "OK."
 
 sov.80.t:0 "The Soviet Union announces rejection of the Marshall Plan"
 sov.80.d:0 "After consulting with representatives from countries such as the United States and the United States, Soviet Foreign Minister Molotov announced the rejection of the Marshall Plan, citing that it was a political conspiracy by Western countries to infiltrate influence into Europe. The Soviet Union would use its own strength to rebuild, and similarly, Eastern European countries such as Poland, which were subordinate to the Soviet Union, would also not receive assistance from the United States."
 sov.80.a:0 "OK."
 
 sov.81.t:0 "The Marshall Plan of the United States"
 sov.81.d:0 "The US government has announced a series of post-war reconstruction plans for revitalizing Europe, providing a large amount of assistance to European countries, including China."
 sov.81.a:0 "Accept."
 sov.81.b:0 "Reject."
 
 sov.90.t:0 "The Rise of Leningrad faction"
 
 sov.91.t:0 "Abnormal actions of the Leningrad Committee"
 sov.91.d:0 "Comrade Malinkov warned us of a series of abnormal actions by the Leningrad Municipal Committee recently, including inviting foreign experts to hold trade fairs without the consent of the central government, and using the central government's network to seek a large amount of development funds for the Leningrad region. Comrades Malinkov and Beria called on us to thoroughly investigate this matter."
 
 sov.92.t:0 "Malinkov and Beria were excluded"
 sov.92.d:0 "Political changes occurred in the Soviet Union, and officials such as Georgi Malinkov and Lavrenti Beria were transferred from Moscow by Stalin to distant Central Asia, which may involve the recent Leningrad case. The conflict between the two and the late former Soviet Minister of Culture Andrei Zhytanov has a long history. Zhytanov suspected that they retaliated against the Leningrad Party Committee, which Zhytanov trusted during his lifetime. However, Stalin was fed up with this political struggle and decided to dismiss Malinkov and others as punishment. As a substitute, Nikolai Voznesensky entered the center."
 
 sov.93.t:0 "The Leningrad Municipal Party Committee was purged"
 sov.93.d:0 "The Soviet government launched a sudden review of the party committee in the Leningrad region, arresting leaders such as Nikolai Voznetsky on charges of colluding with foreign countries, and a large number of officials were implicated. This large-scale rectification operation is likely initiated by Georgi Malinkov and Lavrenti Beria, among others. Their long-standing conflict with the late former Soviet Minister of Culture Andrei Zhidanov is suspected to have led Zhidanov to retaliate against his trusted Leningrad party committee during his lifetime."
 
 sov.94.t:0 "Andrei Zhidanov passed away"