l_english:
 ang.1.t:0 "Angola revolt!"
 ang.1.d:0 "A group of Angolan rebels attacked a prison near Luanda and released arrested black movement leaders. The rebels claim to be from the Angolan People's Liberation Movement, which aims to expel all Portuguese people from Angola. According to our investigation, these rebels have great influence in rural areas and may be influenced by communism."
 ang.1.a:0 "Foda-se comunista!"
 
