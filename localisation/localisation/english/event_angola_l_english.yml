 ang.9.t:0 "[FROM.GetName] Suppressed"
 ang.9.d:0 "Under the strong suppression of the Portuguese army, the [FROM.GetName] led armed forces were defeated, and survivors were forced to move underground."
 ang.9.a:0 "OK"
 
 ang.10.t:0 "The War of Independence in Angola has erupted!"
 ang.10.d:0 "With the Angolan independence armed forces launching a comprehensive attack on Portuguese strongholds, the Angolan independence war has begun! The leaders of the Angolan People's Liberation Movement, the Angolan National Liberation Front, and the Alliance for the Comprehensive Independence of Angola have announced that the time has come to liberate the country from Portuguese rule for over three hundred years. The Portuguese government has issued a tough announcement, announcing that it will spare no effort to defend Angola!"
 ang.10.a:0 "OK"
 
 ang.11.t:0 "Angola's civil war breaks out!"
 ang.11.d:0 "Angola is once again embroiled in war! An armed conflict broke out between the People's Movement for the Betterment and Progress of the People, the Front for the Betterment and Progress of the People, and the League of Arab States over the control of this new country. After Portugal withdrew from Angola, there was a huge power vacuum left, but the three Angolan armed groups were unable to reach a consensus and ultimately chose to resolve it by force."
 ang.11.a:0 "OK"
 
 