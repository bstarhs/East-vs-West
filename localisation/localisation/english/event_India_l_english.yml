 raj.56.t:0 "Portugal withdraws from Goa"
 raj.56.d:0 "After the breakdown of negotiations between Portugal and India regarding Goa, the confrontation between the two countries in the Goa region has become increasingly serious. Under pressure from the Indian government, the Portuguese army ultimately had to withdraw from the Goa region, and the Indian army subsequently entered the area to achieve control of Goa."
 raj.56.a:0 "OK"
 
 raj.57.t:0 "Portugal refuses to withdraw from Goa"
 raj.57.d:0 "The Portuguese government brutally refused our request and continued to send troops to Goa. How do we respond?"
 raj.57.a:0 "We can only let it go."
 raj.57.b:0 "It's time for military action!"
 
 raj.58.t:0 "The border war between Portugal and India has erupted!"
 raj.58.d:0 "After the breakdown of negotiations between Portugal and India regarding Goa, the confrontation between the two countries in the Goa region became increasingly severe. Portugal continuously strengthened its military presence in the Goa region and refused warnings from the Indian government to withdraw its troops. Ultimately, the Indian army chose to take military action."
 raj.58.a:0 "OK"
 
 raj.59.t:0 "Indian army forced to evacuate Goa"
 raj.59.d:0 "Despite launching multiple attacks, the Indian army was still unable to break through the defense line built by the Indian army in Goa and was ultimately forced to withdraw. The war ended in Portugal's victory."
 raj.59.a:0 "OK"
 
 raj.60.t:0 "Successfully defeated the potruguese army's defense line"
 raj.60.d:0 "Our military operation in Goa achieved victory, and the Portuguese army surrendered in confusion."
 raj.60.a:0 "OK"
 
 raj.62.t:0 "Indian army occupying Goa"
 raj.62.d:0 "Under the fierce attack of the Indian army, their defense lines were quickly destroyed, and the Indian army won the border war and took control of the area."
 raj.62.a:0 "OK"
 
