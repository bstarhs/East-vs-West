 raj.19.t:0 "Kashmir is under attack"
 raj.19.d:0 "Kashmir has been invaded by Muslim armed groups supported by Pakistan, who are attempting to integrate Kashmir into Pakistan. The King of Kashmir has requested the Indian army to enter the region to resist Muslims." 
 
