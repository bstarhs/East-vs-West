europe.1.t:0 "Change of Goverment"
  europe.1.d:0 "After the brutal fascist rule of the Japanese colonists, the Korean people finally ushered in freedom. The leader of the government of the Republic of Korea, Syngman Rhee, announced in Seoul the official establishment of the Republic of Korea in the US-occupied zone, marking the Korean A new era has come for the peninsula. The north of the peninsula is still under the control of the Soviet Union."
  europe.1.a:0 "Long Live Korean Independence!"
 
  europe.2.t:0 "Red Brigade uprising!"
  europe.2.d:0 "Some unidentified people attacked the police convoy with guns and grenades. They opened fire suddenly, killed the driver and took the hostages. The defense minister declared it a terrorist attack, and a group called " The organization of the "Red Brigade" announced this attack to destroy imperialism, capitalism and American puppets."
  europe.2.a:0 "How Terror!"