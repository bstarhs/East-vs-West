l_english:
 col.1.t:0 "The Colombian presidential election is about to begin!"
 col.1.d:0 "In 1948, Colombia was about to hold a presidential election, and the Conservative Party, which had ruled the country for several years, was working tirelessly to suppress the left-wing Liberal Party in order to win the election. However, the leader of the Liberal Party, Jorge Eli é cer Gait á n, had great prestige and was seeking the support of the working class and intellectuals in the hope of winning the election."
 col.1.a:0 "Let's see what will happen next."
 
 col.2.t:0 "Jorge Gaitán was assassinated!"
 col.2.d:0 "The shocking news came from Colombia. Jorge Eliécer Gaitán, leader of the Colombian Liberal Party, was assassinated. He was shot by a gunman on his way home and was taken to the hospital where he died. Jorge Gait á n is a liberal leader supported by the Colombian people, who are expecting him to win this year's presidential election. His death has angered Colombians, and large-scale demonstrations have erupted in the capital Bogotá and multiple regions."
 col.2.a:0 "Let's see what will happen next."
 
 col.3.t:0 "Jorge Gaitán evaded the assassination!"
 col.3.d:0 "According to news from the Colombian capital Bogotá, the leader of the Liberal Party, Jorge Eliécer Gaitán, narrowly escaped an assassination attempt. He was attacked by a gunman on his way to work, but did not suffer fatal injuries. The gunman was arrested by Gaitán's accomplices and Gaitán himself was admitted to the hospital for treatment before announcing that he was unharmed. This assassination occurred on the eve of the Colombian general election, when the Conservative Party had been practicing dictatorship for nearly three years, leading to various conspiracy theories quickly spreading among the Colombian people."
 col.3.a:0 "Let's see what will happen next."
 
 col.4.t:0 "The Liberal Party wins the Colombian presidential election!"
 col.4.d:0 "After fierce competition, the Liberal Party led by Jorge Eliécer Gaitán won the Colombian general election, ending the Conservative Party's nearly three-year dictatorship. Jorge Gaitán, as a left-wing politician, supports improving the status of workers, implementing land reforms, developing domestic industry, and opposing foreign capital. At the same time, the right-wing forces in Colombia remain strong, and it is uncertain whether Jorge will succeed in governing."
 col.4.a:0 "Let's see what will happen next."
 
 col.5.t:0 "Conservative win in Colombia's presidential election!"
 col.5.d:0 "The results of the Colombian election were announced, and the Conservative Party unexpectedly won the election, continuing their rule. After Jorge Gaitán's assassination, the Liberal Party was severely weakened, and it seemed that no one could shake the Conservative Party's rule. However, the liberals, leftists, and lower classes in Colombia have reached the edge of patience with the Conservative Party."
 
 col.6.t:0 "Political changes in Colombia"
 col.6.d:0 "Political changes have occurred in Colombia, and Jorge Gaitán and his Liberal Party have formed a government that advocates leftist policies and is pro communist, posing a threat to our sphere of influence in Latin America. The CIA suggests that China intervene quickly and try to disrupt or subvert the Jorge regime as much as possible."
 
 col.7.t:0 "Conservative revolt"
 col.7.d:0 "President Jorge's series of policies have caused dissatisfaction among vested interests, with the rise of counter revolutionary movements supported by the military, large plantation owners, monopolistic capitalists, and the Conservative Party. They have organized and supported frequent uprisings, causing great trouble for our government."
 
 col.8.t:0 "Military coup!"
 col.8.d:0 "Emergency situation! A military unit suddenly broke into the capital Bogot á, quickly gaining control of radio stations, government agencies, and surrounding the Presidential Palace. The military has been instructed by right-wing forces, who accuse President Jorge of a series of reforms that have undermined Colombia's national system and social stability. They demand that President Jorge resign or resort to force."
 
 col.9.t:0 "Colombian military coup!"
 col.9.t:0 "Urgent message from Bogota! The armed forces launched a coup, took control of the capital Bogot á and surrounded the presidential palace, demanding the resignation of left-wing President Jorge Gaitán. In order to avoid triggering a national civil war, Jorge was forced to announce his resignation and go into exile overseas. The military has taken control of the country's political power, and General Gustavo Rojas Pinellia announced his appointment as the interim president of the military government."
 
 col.10.t:0 "The Colombian Civil War has erupted!"
 
 col.11.t:0 "Liberal revolt!"
 col.11.d:0 "The people who support the Liberal Party have reached the limit of their patience with the government, and they have started organizing armed groups to launch riots."
 
 col.12.t:0 "The Colombian Communist Party Uprising!"
 col.12.d:0 "支持共产党的左派民众对政府忍耐已到极限，他们开始组织武装团体发起暴动。"
 
 col.13.t:0 "1950年哥伦比亚大选！"