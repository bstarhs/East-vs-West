l_english:
 pol.2.t:0 "Death of Bolesław Bierut"
 pol.2.d:0 "Polish Leader Bolesław Bierut passed away due to illness during his visit to Moscow, and Comrade Edward Ohab took over his position."
 pol.2.a:0 "OK"
 
 pol.3.t:0 "Protest march in Poznan!"
 pol.3.d:0 "Workers and the masses in Poznan City have launched demonstrations to protest against the deterioration of workers' treatment and the corruption of the party and government. How should we respond?"
 pol.3.a:0 "This is a reactionary march, immediately suppress it."
 pol.3.b:0 "Attempts should be made to engage in dialogue with workers."
 
 pol.4.t:0 "Protest march in Poznan!"
 pol.4.d:0 "Workers and the masses in Poznan city launched a demonstration to protest against the deterioration of worker treatment and the corruption of the party and government. How can we respond to the Polish authorities choosing to engage in dialogue with protesters?"
 pol.4.a:0 "It is handled by the Polish government itself."
 pol.4.b:0 "This is a reactionary march, notifying Poland to immediately suppress it."
 
 pol.5.t:0 "Protest march in Poznan!"
 pol.5.d:0 "Workers and the masses in Poznan city launched a demonstration to protest against the deterioration of worker treatment and the corruption of the party and government. The Polish authorities deployed military and police forces to suppress the march, resulting in multiple deaths. This incident seriously damaged the credibility of the Polish Unified Workers' Party government in the hearts of the people."
 pol.5.a:0 "Tragedy."
 
 pol.9.t:0 "The 8th Congress of the United Workers' Party"
 pol.9.d:0 "Comrade Wadisaw Gomulka, who was once labeled as a right-wing nationalist, has regained his reputation. The 8th National Congress of the Party is about to be held, who will lead Poland?"
 pol.9.a:0 "Comrade Gomulka was the right choice."
 
 pol.10.t:0 "Wadisaw Gomulka Elected as Polish Leader"
 pol.10.d:0 "The de Stalinization movement and the Poznan incident caused quite a stir, and the once right-wing nationalist Wadisaw Gomulka was elected as the leader of the Polish Unified Workers' Party to stabilize the situation."
 pol.10.a:0 "Comrade Gomulka was the right choice."
 
 pol.13.t:0 "John Paul II Visits Poland"
 pol.13.d:0 "Pope John Paul II of Rome visited his hometown of Poland under Communist rule. Despite the authorities' efforts to obstruct it, hundreds of thousands of people still came to visit the Pope and listen to his Mass. This shows that Catholicism still has great influence in Poland."
 pol.13.a:0 " "
 
 pol.12.t:0 "Edward Gielek Elected as Polish Leader"
 pol.12.d:0 "Due to Wadislaw Gomulka's inability to solve Poland's economic problems, he was forced to resign, and Edward Gielek, a miner, was elected as Poland's leader."
 pol.12.a:0 " "
 
 pol.14.t:0 "The masses are dissatisfied with economic policies!"
 pol.14.d:0 "Demonstrations have erupted in Warsaw, Krakow, and major cities, expressing strong dissatisfaction with our recent economic policies. Due to excessive external debt, Poland has experienced severe inflation and rising prices, which have brought serious difficulties to the people's lives."
 pol.14.a:0 " "
 
 pol.16.t:0 "Solidarność  Established!"
 pol.16.d:0 "As the anti government movement grew stronger, more and more workers participated in liberal social organizations. Electrician Lech Walesa announced the establishment of the Solidarność  and quickly developed into the largest worker movement group in Poland."
 pol.16.a:0 " "
 
 pol.18.t:0 "A military coup broke out in Poland！"
 pol.18.d:0 "As the liberalization movement grew stronger, Poland fell into political turmoil, and Polish People's Army General Vojcech Jaruzelsky announced the takeover of power and the implementation of military control."
 pol.18.a:0 " "
 
 pol.20.t:0 "A large-scale demonstration broke out!"
 pol.20.d:0 "An unprecedented demonstration broke out in Warsaw and major cities, with workers, students, and other classes participating."
 pol.20.a:0 " "
 
 pol.21.t:0 "Polish Round Table Agreement"
 pol.21.d:0 "After several hours of negotiations, the Polish Round Table Conference was successfully concluded, and the Polish Workers' Party was forced to declare the end of nearly forty years of rule and promise to hold general elections. Poland became the first domino of the fall of European communism."
 pol.21.a:0 " "
 
 pol.22.t:0 "Solidarity Union Wins Polish Elections"
 pol.22.d:0 "The first democratic election in Poland ended, and the Solidarity Union led by Lech Walesa won the election."
 pol.22.a:0 " "
 
 poltext.30.t:0 "Political influence from the conflict between the Soviet Union and Yugoslavia"
 pol.30.d:0 "With the continuous deterioration of relations between the Soviet Union and Yugoslavia, the political struggle between the two countries inevitably had an impact on our country. At that time, different factions took sides on this issue, with the pro Soviet faction led by Boleslav Beirut firmly on Moscow's side, while the nationalist faction led by Władysław Gomurka advocated neutrality."
 pol.30.a:0 "Firmly support Comrade Stalin and oppose Titoism!"
 pol.30.b:0 "Oppose Moscow's interference in our party's line and maintain neutrality."
 
 pol.31.t:0 "Poland announces the purge of Titoists"
 pol.31.d:0 "The political struggle between the Soviet Union and Yugoslavia spread to Poland. The Polish Unified Workers Party announced its firm support for Comrade Stalin's leadership position in the socialist camp, criticized Tito's pro Western behavior, and subsequently purged party members such as Władysław Gomulka who were not resolute on this issue."
 
 pol.32.t:0 "Poland declares neutrality in conflict between USSR and Yugoslavia"
 pol.32.d:0 "The political struggle between the Soviet Union and Yugoslavia spread to Poland. After intense political struggles, sympathizers of the Tito faction gained an advantage, and under their pressure, pro Soviet Boles ł aw Beirut was forced to self criticize. The Polish Unified Workers Party also declared neutrality in the Yugoslav Soviet issue."