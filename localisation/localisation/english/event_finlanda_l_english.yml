l_english:
 finTEXT.1.t:0 "The USSR proposed a new policy towards Finland"
 fin.1.d:0 "The Soviet government proposed a new policy related to the Finnish issue. Moscow believed that as long as Finland no longer supported any military actions against the Soviet Union, remained neutral on international issues, and maintained friendly relations with the Soviet Union, the Soviet Union would not pursue the overthrow of Finland's current system and policies, including not supporting the Finnish Communist Party to seize power."
 
 fin.2.t:0 "The USSR expressed support for the Finnish Communist Party"
 fin.2.d:0 "The Soviet government issued a public declaration accusing the Finnish government of remaining hostile towards the Soviet Union and posing a potential threat to its national security. The Soviet Union will take action to seek to eliminate the threat posed by Finland to the Soviet Union, such as establishing a new Finnish government close to Moscow."
 
 fin.3.t:0 "Preparing for parliamentary elections"
 
 fin.4.t:0 "The Finnish Communist Party wins the general election"
 fin.4.d:0 "After fierce competition, the Finnish Communist Party ultimately won the Finnish general election and announced the formation of a government. President Paasikivi's efforts to please the Soviet government in exchange for political independence in Finland failed, and the Communist Party ultimately gained power in Finland."
 
 fin.5.t:0 "Finnish parliamentary elections have ended"
 
 fin.6.t:0 "Soviet-Finland Friendship Agreement"
 fin.6.d:0 "The foreign ministry has drafted a Social Finland Friendship Agreement, which includes demands for Finland's political neutrality and strengthening economic and trade exchanges between the two countries."
 
 fin.7.t:0 "The Soviet Union proposed a friendly agreement"
 fin.7.d:0 "The Soviet government has proposed a new agreement to us, which includes requiring our country to remain neutral in the future European situation, opposing military threats against the Soviet Union, and strengthening economic and trade exchanges between the two countries. In return, the Soviet Union will provide us with military and economic assistance."
 
 fin.8.t:0 "The Soviet Union and Finland signed a friendly agreement"
 fin.8.d:0 "The Soviet government signed a new agreement with Finland, which required Finland to remain neutral in the future European situation, oppose military threats against the Soviet Union, and strengthen economic and trade exchanges between the two countries. In return, the Soviet Union will provide military and economic assistance to Finland."
 
 fin.9.t:0 "Finland rejects friendly agreements"
 fin.9.d:0 "Finland rejected the friendly agreement proposed by the Soviet Union and decided to pursue an independent diplomatic path."
 
 fin.10.t:0 "Attention to the situation in Finland"
 fin.10.d:0 "The Finnish general election ended with the victory of the Communist Party, which sounded an alarm for free European countries. The continuous expansion of the Communist Party's influence in Europe has threatened our interests, and their seizure of Finnish power means that they will continue to expand into Northern Europe, which is unacceptable to us. Our diplomatic and intelligence agencies are demanding that we intervene as soon as possible."
 
 fin.11.t:0 "[From.GetName] declares boycott of Finnish election results"
 fin.11.d:0 "[From.GetName] announced a boycott of the Finnish election results and condemned the Finnish Communist Party for illegally seizing power."
 
 fin.12.t:0 "[From.GetName] declares acceptance of Finnish election results"
 fin.12.d:0 "[From.GetName]Sweden announced recognition of the Finnish election results and recognized the new Finnish government formed by the Finnish Communist Party."
 
 fin.13.t:0 "The Soviet Union's policy of infiltration into Finland"
 fin.13.d:0 "Be careful! Our intelligence agency has discovered that the Soviet Union is secretly supporting the Finnish Communist Party and helping them seize power!"
 
 fin.14.t:0 "The Communist Party launches a coup!"
 fin.14.d:0 "Emergency situation! A group of armed militants claiming to be the Finnish Red Army suddenly entered cities such as Helsinki and Turku, attacked radio stations, government agencies, and surrounded the Presidential Palace. They were instructed by left-wing forces to attempt to seize power!"
 
 fin.15.t:0 "The Finnish Communist Party has seized power!"
 fin.15.d:0 "Urgent message from Helsinki! A group of armed militants claiming to be the Finnish Red Army launched a coup, taking control of cities such as Helsinki and Turku and surrounding the Presidential Palace, demanding the resignation of President Juho Kusti Paasikivi. Paasikivi was forced to resign in order to avoid triggering a national civil war. The armed forces under the leadership of the Finnish Communist Party quickly took control of the country's political power and announced the establishment of a provisional revolutionary government!"
 
 fin.16.t:0 "Support the Finnish democratic"
 fin.16.d:0 "来自赫尔辛基的紧急消息！一伙自称为芬兰红军的武装分子发动政变，控制了赫尔辛基、图尔库等城市并包围总统府，要求总统Juho Kusti Paasikivi下台。芬兰政府拒绝屈服，调动武装部队进行镇压，第二次芬兰内战爆发了！"
 
 fin.17.t:0 "Anti communist forces revolt!"
 fin.17.d:0 "After the Finnish Communist Party seized power, the political situation continued to deteriorate, and some radical right-wing groups began to organize armed forces and create riots."
 
 fin.18.t:0 "The Finnish Salvation Army is established!"
 fin.18.d:0 "The Finnish Salvation Army is announced to be established in Stockholm! These right-wing Finnish armed groups have received support from Western countries such as Britain, the United States, France, and France, announcing armed struggle aimed at resisting the Finnish Communist Party!"
 
 fin.19.t:0 "The Finnish Civil War has erupted!"
 fin.19.d:0 "Urgent message from Finland! Finnish right-wing armed groups have launched riots in major cities such as Turku and Vasa, occupying local governments! The Finnish Salvation Army announced that the second Finnish Civil War has begun, and they will use force to overthrow the Communist Party and Russian puppets to rescue Finland!"
 
 fin.20.t:0 "The Finnish Civil War has erupted!"
 fin.20.d:0 "Urgent message from Helsinki! A group of armed militants claiming to be the Finnish Red Army launched a coup, taking control of cities such as Helsinki and Turku and surrounding the Presidential Palace, demanding the resignation of President Juho Kusti Paasikivi. The Finnish government refused to surrender and mobilized armed forces to suppress it, and the second Finnish civil war broke out!"
 
 fin.21.t:0 "General Mannerheim has arrived in Stockholm!"
 fin.21.d:0 "Faced with the survival of the country, the elderly Finnish national hero General Karl Mannerheim traveled from Switzerland to Sweden to meet with representatives of the Finnish Salvation Army and declared himself the nominal leader of the Salvation Army, supporting his compatriots in resisting Soviet and Communist rule!"
 
 fin.22.t:0 "救国军解放赫尔辛基"
 
 fin.23.t:0 "芬兰共产党被推翻"
 
 fin.24.t:0 "芬兰救国军退守奥兰群岛"