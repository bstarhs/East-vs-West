 PER_isfahan_region:0 "Isfahan Industrial Zone"
 PER_Abbas_port:0 "Construction of Bandar Abbas"
 PER_Abbas_region:0 "Fars Industrial Zone"
 PER_industrial:0 "Industrialize"
 PER_heavy_industrial:0 "Develop heavy industry"
 PER_heavy_industrial_desc:0 "Heavy industry is an industry that provides means of production. We need to first develop heavy industry and enter industrialization before we can develop other industries."
 PER_steelmaking:0 "Steel industry"
 PER_steelmaking_desc:0 "By mass, iron is the most common element on Earth, and it has good ductility when heated... and is very useful. Iron began around 3500 BC and was discovered in Galzah, Egypt. Iron was very useful for various things needed by early civilizations, such as cooking pots, small hardware, tools, and sharp weapons used to stab others."
 PER_auto_industrial:0 "Developing the automotive industry"
 PER_expand_oilfield:0 "Persian Gulf oil fields"
 PER_expand_oilfield_desc:0 "The Persian Gulf is the region with the richest oil reserves in the world. Although we have invested in several oil fields since the 1930s, we still need to increase mining output if we want to meet our industrial production."
 PER_oil_refinery:0 "Chemical industry"
 PER_electronic:0 "Electronics industry"
 PER_electronic_desc:0 "The electronics industry is the most important high-tech industry in the second half of the 20th century. Small transistors can not only produce advanced electronic products, but also serve as a threshold for developing countries."
 PER_oil_nationalized:0 "Nationalization of oil prodction"
 PER_oil_nationalized_desc:0 "For a long time, China's oil resources have been controlled by the Anglo Iranian Oil Company under the manipulation of British capital, and a large amount of oil profits have flowed into the wallets of the British people. As an independent sovereign country, this is intolerable."
 PER_khuzestan:0 "Khuzestan Industrial Zone"
 PER_khuzestan_desc:0 "Khuzestan Province is located in southwestern Iran, which is one of the earliest human civilizations in the world - the birthplace of the Elan civilization. Currently, it is the region with the richest oil resources in China. It is feasible to establish industrial zones by utilizing petroleum resources."
 PER_shah_port:0 "Developing Bndar Shah"
 PER_military_industrial:0 "Military industry"
 PER_military_industrial_desc:0 "Iran was once the most powerful empire in human history, but in modern times our military technology has declined. If we want to establish a strong modern military, we cannot rely on foreign aid, but must have our own military industry."
 PER_navy:0 "Developing the Navy"
 PER_airforce:0 "Developing the Air Force"
 PER_education_reform:0 "Educational reform"
 PER_Secularism:0 "Promote secularization"
 PER_Secularism_desc:0 "Islam is an obstacle for Iran to become a modern powerhouse, and its laws and morals will only hinder the development of our country. Therefore, we need to take measures to remove the influence of Islam from the government, education, and society."
 PER_nuclear:0 "Developing nuclear technology"
 PER_nuke:0 "Nuclear weapons"
 PER_lecurity_corp:0 "Lecurity corp"
 PER_nuclear_power:0 "Developing nuclear power"
 PER_modernized_gov:0 "Modernize the government"
 PER_savak:0 "Shawak"
 PER_savak_desc:0 "Shawak was the national intelligence agency of the Pahlavi dynasty in Iran, whose main task was to suppress political enemies and maintain the authority of the Shah."
 PER_law_reform:0 "Judicial reform"
 PER_female:0 "Improving women's rights"
 PER_vote:0 "Promote universal suffrage"
 PER_strenth_shah:0 "Strengthening the power of the Shah"
 PER_strenth_shah_desc:0 "Shah, also known as Shahran Shah, means King of Kings and has been a term used since ancient Persia to refer to Iranian monarchs. Since the establishment of the Pahlavi dynasty, both Shahs have been committed to achieving modernization, secularization, and social development in Iran. In the future, we will also need the leadership of the Shahs."
 PER_puppet_party:0 "Puppet political parties"
 PER_puppet_party_desc:0 "Although we need to strengthen the power of the Shah, the country has already moved towards modernization and still needs a decent political party system. We can support some puppet political parties, recruit middle-class supporters of the Shah, and serve as His Majesty's representatives in the government and parliament."
