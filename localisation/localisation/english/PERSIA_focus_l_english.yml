 PER_anit_usa:0 "Against America"
 PER_expanded_east:0 "Expand to the East"
 PER_support_rebels:0 "Supporting Pakistani rebels"
 PER_support_rebels_desc:0 "There are active separatist rebels in Pakistan's Balochistan, Sindh, and Peshawar, and we can sponsor their activities to break away from Pakistan and establish a regime close to Iran."
 PER_anti_communism:0 "Against communism"
 PER_anti_communism_desc:0 "The communist revolution is endangering our social order and national interests. We declare to everyone that our country will never tolerate red elements, and once discovered, they will be thrown into prison."
 PER_taken_khrosan:0 "Claime Khorasan"
 PER_taken_khrosan_desc:0 "The Turkmen region under Soviet rule was historically a part of the Khorasan region of Persia."
 PER_support_turks_rebels:0 "Supporting revolt in Central Asia"
 PER_support_azerbaijan:0 "Supporting revolt in Azerbaijan"
 PER_anti_turk:0 "Against Turkey"
 PER_support_kurds:0 "Support Kurdish rebels"
 PER_islam_party:0 "Islamic Party"
 PER_islam_republic:0 "Islamic Republic"
 PER_ulima_concil:0 "Ulima Concil"
 PER_islam_guards:0 "Islamic Revolutionary Guard"
 PER_islam_cultuire:0 "Social Islamization"
 PER_islam_social:0 "Islamic society"
 PER_shariah:0 "Shariah"
 PER_shariah_desc:0 "The feudal social organization with Islam as its core has existed in our country for thousands of years, and its religious law is the Shariah law. It is the wisdom crystallization of our pan Islamic civilization. It is an indisputable divine law that withstands the test of time and guides all Muslim societies."
 PER_assisstance:0 "Western aid"
 PER_assisstance_desc:0 "Requesting military, political, and economic assistance from the US government."
 PER_misssle:0 "Shehabs missile"
 PER_mujahideen:0 "Mujahideen"
 PER_mujahideen_desc:0 "The campaign against the pagans has begun, and for the sake of truth, we will crush everything that goes against Islam! Allahu Akbar!"
 PER_support_mujaheden:0 "Support foreign holy warriors"