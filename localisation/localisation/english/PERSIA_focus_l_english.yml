l_english:
 PER_white_revolution:0 "White Revolution"
 PER_politician_reofrom:0 "Political reform"
 PER_grand_iran:0 "Greater Iran"
 PER_expanded_gulf:0 "Expanding into the Persian Gulf"
 PER_islam:0 "Way to Allahj"
 PER_islam_desc:0 "No matter how the world changes, the Quran and the will of the prophets remain eternal truths, and our country needs the governance of Islamic law to ensure that our country is always within the realm of truth. Allah is calling us to forge ahead. Brothers, please pick up our machetes and defend our right to survival!"
 per_landreform:0 "land reform"
 PER_urbanization:0 "Urbanization"
 PER_tehran_region:0 "Mazandaran Industrial Zone"
 PER_health_corp:0 "Health Corp"
 PER_Azerbaijan_region:0 "Azerbaijan Industrial Zone"
 PER_agriculture:0 "Agricultural modernization"
