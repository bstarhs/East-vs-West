l_english:
 por.20.t:0 "Prime Minister Salazar suspended due to illness"
 por.20.a:0 "Suppress the riots!"

 por.22.t:0 "Demonstrations break out in Lisbon!"
 por.22.d:0 "A group of captains entered Lisbon today with guns and carnation flowers. They called themselves the Revolutionary Armed Council and demanded an end to the colonial war and political reforms. Some citizens of Lisbon joined them in launching a massive protests. Protesters demand the overthrow of the Military Dictator."
 por.22.a:0 "The new state dictatorship is over!"
 por.22.b:0 "Punches to Zuo Ren!"

 por.23.t:0 "Portuguese Civil War!"
 por.23.d:0 "Soldiers and citizens protesting in Lisbon were attacked by pro-Nation forces! After a fierce battle, left-wing forces retreated from Lisbon. Last night, some divisions of the Portuguese army declared an uprising, Antonio Spino General Ra, their leader, declared that the war to overthrow Salazar's regime had begun!"
 por.23.a:0 "News from Lisbon!"

 por.24.t:0 "Carnation Revolution!"
 por.24.d:0 "News from Lisbon! Yesterday, Portuguese Prime Minister Marcelo José das Cardano announced his resignation, marking the end of 42 years of dictatorship under the new state system. General Antonio Spinola And a military council came to power. The council promised that Portugal would be a democracy in the future, and then they would try to negotiate with the rebels in the colony."
 por.24.a:0 "Viva Portugal!"