l_english:
 africa.1.t:0 "demonstration！"
 africa.1.d:0 "The Blacks initiated a demonstration in the capital city of colony in Africa！They call for self-determination from the colonial system"
 
 africa.10.t:0 "Rebellion in colony！"
 africa.10.d:0 "The Blacks initiated a Rebellion in [From.GetName]！The Blacks nationalist attacked the arsenal and took the weapons.They announced that a insurrection war of fighting the whites has begun."
 
 africa.11.t:0 "Wing of change"
 africa.11.d:0 "British Prime Minister [ENG.GetLeader] delivered a speech in Cape Town, South Africa: A wind of change has arrived. In connection with the fact that Britain has recently begun to give autonomy to the African colonies, and independence movements are in full swing in various places, people think this is an epoch-making historical signal: the British Empire, and even the entire colonial system, is about to collapse in Africa. "
 africa.11.a:0 "The new era is about to replace the old one. "
 
 africa.14.t:0 "[From.GetName]nationalists released"
 africa.14.d:0 "British colonial authorities announced that the [From.GetName] nationalist to be arrested has been released."
 africa.14.a:0 "Let's see what happens next."
 
 africa.15.t:0 "Parliamentary elections are about to begin"
 africa.15.d:0 "The British colonial authorities announced that the [From.GetName] nationalists who were arrested would be released on their own. "
 africa.15.a:0 "Let's see what happens next."
 