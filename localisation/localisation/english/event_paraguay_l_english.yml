 par.3.t:0 "The Rise of Feberistas"
 par.3.d:0 "The Paraguayan military government under the leadership of Higinio Mor í nigo is in turmoil, and the left-wing political party Feberistas, which supports former President Rafael Franco, is expanding its influence in Paraguayan politics."
 
 par.4.t:0 "The Rise of the Liberal Party"
 par.4.d:0 "The Paraguayan military government under the leadership of Higinio Mor í nigo is in turmoil, and the Paraguayan Liberal Party is expanding its influence in Paraguayan politics."
 
 par.5.t:0 "The Rise of the Communist Party"
 par.5.d:0 "The Paraguayan military government under the leadership of Higinio Mor í nigo is in turmoil, and the Paraguayan Communist Party is expanding its influence in Paraguayan politics."
 
 par.6.t:0 "The opposition party demands the dissolution of the military junta!"
 par.6.d:0 "The attempt by the Paraguayan military government led by Higinio Mor í nigo to engage in political dialogue with the opposition party ended in failure. Feberistas, the Liberal Party, and the Communist Party demanded the dissolution of the military government and a general election."
 
 par.7.t:0 "Paraguayan military junta steps down"
 par.7.d:0 "The attempt of the Paraguayan military government led by Higinio Mor í nigo to engage in political dialogue with the opposition party ended in failure. At the request of Feberista, the Liberal Party, and the Communist Party, Morinigo announced his resignation, and former President Rafael Franco, a respected leader of the Paraguayan democratic forces, returned to power as interim president."
 
 par.8.t:0 "Paraguay's civil war erupts!"
 par.8.d:0 "Under the leadership of Higinio Mor í nigo, the relationship between the Paraguayan military government and the opposition party has completely broken down. Militia supporting Feberistas, the Liberal Party, and the Communist Party have launched a rebellion against the military government."
 
 par.9.t:0 "The establishment of a new government in Paraguay"
 
 par.10.t:0 "The end of the civil war in Paraguay"
 
 par.11.t:0 "Paraguay's general election is imminent"
 
 par.12.t:0 "[FROM.GetLeader] elected as the President of Paraguay"