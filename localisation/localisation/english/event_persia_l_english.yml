l_english:
 per.1.t:0 "Celebration of the 2500 year anniversary of the establishment of the Persian Empire"
 per.1.d:0 "In order to celebrate the 2500 year anniversary of the establishment of the Persian Empire, King Reza Balevi of Iran will hold a grand celebration in the former capital of the Persian Empire, Persepolis, which will invite representatives of governments from around the world to attend. Balavi's move not only aims to enhance Iran's international image and status, but also attempts to win public support. However, in the eyes of the lower class, this celebration only proves the king's extravagance and corruption."
 
 per.2.t:0 "Mohammad Mossad as Prime Minister"
 per.2.d:0 "Mohammad Mossad will be appointed as the Prime Minister of the Iranian government, which has aroused the vigilance of Western countries, as Mossad is committed to excluding Western forces in Iran, especially in oil equity."
 
 per.3.t:0 "Nationalization of oil in Iran"
 per.3.d:0 "The Iranian government has announced that they have decided to fully nationalize the joint venture Iranian oil company with the West, eliminate foreign capital, and fully nationalize oil revenue."
 
 per.4.t:0 "Nationalization of oil in Iran"
 per.4.t:0 "The Iranian government has announced that they have decided to fully nationalize the joint venture Iranian oil company with the West, eliminate foreign capital, and fully nationalize oil revenue.What should we do?"
 
 per.5.t:0 "Mossadai resigns"
 per.5.d:0 "Under pressure from Western countries, Iranian Prime Minister Mossadai was forced to resign."
 
 per.6.t:0 "Revolution!"
 
 per.7.t:0 "The Iranian Civil War!"
 per.7.d:0 "The suppression of the people by the Iranian king ultimately ignited the anger of the masses. The rebels and defectors who opposed the king marched towards Tehran, and Iran was already embroiled in a full-scale civil war!"
 
 per.8.t:0 "Parade and demonstration!"
 per.8.d:0 "The retrograde actions of King Pahlavi have finally ignited the anger accumulated by the Iranian people! Demonstrations have emerged in major cities across the country! The crowd shouted slogans to overthrow Shah, and students, workers, and even the military all participated in the opposition movement! What should we do?"
 per.8.a:0 "Shah has failed, he must leave Iran"
 per.8.b:0 "Suppress the thugs!"
 
 per.9.t:0 "Constitutional Reform in Iran"
 
 per.10.t:0 "Enactment of the Iranian Constitution"
 
 per.11.t:0 "Shah Pahlavi Leaving Iran!"
 per.11.d:0 "Iran's King Reza Pahlavi ultimately succumbed to the anger of the people and hastily fled from Tehran to Egypt, marking the end of the Pahlavi dynasty, which had ruled Iran for over fifty years."
 
 per.12.t:0 "The Future of Iran"
 per.12.a:0 "The great Ayatollah Khomeini Imam will lead us back to the path of Allah."
 per.12.b:0 "Democracy and socialism can save Iran."
 
 per.13.t:0 "Oil Crisis"
 
 per.14.t:0 "Demonstrators besieged the embassy！"
 
 per.15.t:0 "The United States demands that we release the hostages"
 
 per.16.t:0 "Response from Iran"
 
 per.17.t:0 "The United States accepts our request"
 
 per.18.t:0 "The hostages were released"
 
 per.19.t:0 "The United States rejects our request！"
 
 per.20.t:0 "Hostages killed！"
 
 per.21.t:0 "Hostages rescued！"
 
 per.22.t:0 "Action failed！"
 
 per.23.t:0 "Information from the United States"
 
 per.24.t:0 "Iran agrees"
 
 per.25.t:0 "Iran Gate scandal！"
 
 per.26.t:0 "IR655 air crash"
 
 per.27.t:0 "Establishment of the Islamic Republic of Iran！"
 per.27.d:0 "The election in Iran yielded an unquestionable result, with the Islamic Party led by Ayatollah Khomeini winning the election and declaring the establishment of the Islamic Republic, which would be the first republic in the modern world to achieve the unity of administration and religion. Khomeini promised that the Islamic Republic would return Iran's political life to Islamic domination and achieve true peace and democracy, but the outside world generally believed that the Islamic Republic was just another form of dictatorship."
 
 per.28.t:0 "Establishment of the Republic of Iran！"
 per.28.d:0 "After intense competition, the Republican Party led by the leader of Iran's democratic movement, Abu Hassan Banisadar, won the election and became the president of Iran's first democratic government. The Islamic Republic advocated by Ayatollah Khomeini was not achieved as scheduled, but it recognized the election results and retained parliamentary seats."
 
 per.30.t:0 "Khomeini passed away"
 
 per.40.t:0 "The fall of the People's Government of Azerbaijan"
 per.40.d:0 "With the Iranian army occupying Tabriz, the Azerbaijani People's Government supported by the Soviet Union in northwestern Iran collapsed, and most of its leaders fled or were arrested by the Iranian government."
 per.40.a:0 "The failed attempts of communism in the Middle East"

