l_english:

 bri.1.t:0 "Princess Elizabeth and Prince Philip marry"
 bri.1.d:0 "Princess Elizabeth, the eldest daughter of King George VI of England, married Prince Philip of Greece. Elizabeth and Philip met in 1932, and Philip voluntarily renounced his right to the Greek throne in pursuit of the princess."

 bri.2.t:0 "Queen Elizabeth II succeeds to the throne"
 bri.2.d:0 "With the death of King George VI, his eldest daughter, Elizabeth II, succeeded by the grace of God, Queen of the United Kingdom of Great Britain and Northern Ireland and other territories and dependencies, Head of the Commonwealth, Protector of Christianity, and in Westminster The coronation ceremony was held at the cathedral, becoming the fourth monarch of the British House of Windsor. \nQueen Elizabeth II is the third Queen of the United Kingdom, and her succession came at a time when the British colonial independence movement was surging."
 
 bri.3.t:0 "Prince Charles and Princess Diana marry"
 bri.3.d:0 "Prince Charles, Prince of Wales, married Diana Spencer, daughter of Earl Spencer."
 
 bri.20.t:0 "Attack in Northern Ireland!"
 bri.20.d:0 "A car bomb exploded in Belfast, the capital of Northern Ireland. Solid explosives were detonated in cars parked on the street. The loud noise shattered several blocks of glass, and the mushroom cloud was tens of meters high. There were about 20 casualties. The IRA, a separatist group in Northern Ireland, claimed responsibility for the attack, saying it was retaliation for the illegal occupation of Northern Ireland by British colonists."
 bri.20.t:0 "HOLY SHIT！"
 
 bri.21.t:0 "Strike！"
 bri.21.d:0 "There's a big riot in Yorkshire! Tens of thousands of workers, students and leftists gathered in the streets to demonstrate and rushed to police barricades. Protesters are deeply dissatisfied with Thatcher's nationalisation policy and will fight to the end if the bill that strips workers of their rights is not repealed."
 bri.21.a:0 "Policemen will solve it."
 bri.21.b:0 "Negotiate with them."
 
 bri.22.t:0 "March to London"
 bri.22.d:0 "Mrs Thatcher's refusal to negotiate with unions has angered striking workers, who have called for a general strike across the UK. Union representatives in London say they welcome workers from Yorkshire and Liverpool to come to London to make their claims. Yesterday, union leaders announced they would march to London if Thatcher continued to be hostile to workers."
 bri.22.a:0 "Never give in to unions！"
 bri.22.b:0 "Negotiate with them."
 
 bri.23.t:0 "Miners strike！"
 bri.23.d:0 "The latest news from the UK: British Prime Minister Margaret Thatcher refused to speak to striking miners, and angry union members decided to march into London to launch the largest demonstration in British history. More than 100,000 workers from across England headed to London, with protesters gathering in front of the Palace of Westminster, St James's Park and Trafalgar Square. Although Scotland Yard has sent almost all police to stop the demonstrators, it has only been able to stop them in the Whitehall area."
 bri.23.a:0 "Never give in to unions！"
 
 bri.25.t:0 "London massacre"
 bri.25.d:0 "The shocking news came from London, where the London Battalion and the 2nd Royal Tank Battalion, under Mrs Thatcher's command, entered London, besieging thousands of protesters from Buckingham Palace to Waterloo Station. At nine o'clock last night, the demonstrators were shot as they tried to approach the soldiers! At 11 p.m., troops began cracking down on demonstrators, firing relentlessly at fleeing crowds, with witnesses saying thousands were killed. As of press time, thousands of people are still surrounded in St. James' Park, and the army continues to push them!"
 bri.25.a:0 "The dead peoples dead in London last night."
 
 bri.26.t:0 "Tank man"
 bri.26.d:0 "A journalist who had just escaped the clashes in London showed the media a photo he took: Several centurion tanks tried to drive along Westminster Palace after cracking down on demonstrators near the Palace of Westminster and Whitehall Bridge evacuated. Suddenly, a man in a white shirt holding two plastic bags blocked their way. The machine guns on the tank fired suddenly, killing the man and running over his body."
 bri.26.a:0 "The dead peoples dead in London last night."
 
 bri.50.t:0 "Scottish independence！"
 bri.50.d:0 "The Scottish Parliament passed a controversial bill yesterday, arguing that Britain's economic collapse, political chaos, high unemployment and corruption spell disaster for Scotland. Only independence could save them from the crisis brought on by Britain. The British government accused Scotland of breaking its promise to form a British kingdom and would use special measures to suppress separatism."
 bri.50.a:0 "Teach the Highlanders a lesson!"
 
 bri.51.t:0 "Irish riot！"
 bri.51.d:0 "The rebels are in rebellion all over Ulster! They have declared that the war against British rule has begun!"
 bri.51.a:0 "Teach the Finnians a lesson!"
 
 bri.52.t:0 "United Kingdom involved in war!！"
 bri.52.d:0 "United Kingdom involved in war!！Queen Elizabeth calls on all members of the Commonwealth to fight together."
 bri.52.a:0 "Join the war!For Queen and Commonwealth!"
 
 bri.55.t:0 "UK wants to use Polaris missiles"
 bri.55.d:0 "With Britain's own unsuccessful development of a new land-based missile, London hopes to acquire an advanced sea-based missile to strengthen its nuclear weapons. The UK wants to be able to buy America's newest Polaris submarine-launched missile, what is our response?"
 bri.55.a:0 "we should support our allies"
 
 bri.56.t:0 "Nassau Accords"
 bri.56.d:0 "The US President [USA.GetLeader] and the British Prime Minister [ENG.GetLeader] held talks in Nassau, the capital of the Bahamas, and signed the "Nassau Agreement", which agreed that the United States would provide Britain with advanced Polaris submarine-launched missiles to strengthen Britain's nuclear stockpile. At the most cost, British nuclear weapons would be subject to American command in wartime."
 bri.56.a:0 "Join the war!For Queen and Commonwealth!"
 
 bri.57.t:0 "Central treaty organization established."
 bri.57.d:0 "Under the leadership of Britain and Turkey, many countries in the Middle East have established the Middle East Treaty Organization to establish a pro Western military alliance in the Middle East."
 bri.57.a:0 "The situation in the Middle East has become more tense."
 
 bri.58.t:0 "Invitation of the Central Treaty Organization"
 bri.58.d:0 "The British government invited us to join cento. How should we respond?"
 bri.58.a:0 "We should join"
 
 bri.59.t:0 "[FROM.GetName] join CENTO"
 bri.59.d:0 "[FROM.GetName] has joined CENTO."
 bri.59.a:0 "OK。"
 
 bri.60.t:0 "Collapse of the central Treaty Organization"
 bri.60.d:0 "With the deepening political turmoil in the Middle East countries, the central Treaty Organization has existed in name only."
 bri.60.a:0 "OK。"
 
 bri.61.t:0 "Brussele treaty"
 bri.61.d:0 "Under the leadership of Britain, many Western European countries signed the Brussels treaty to establish a military alliance in a pro Western European region."
 bri.61.a:0 "The situation in the Europe has become more tense."
 
 bri.62.t:0 "Invitation of the Brussels treaty"
 bri.62.d:0 "The British government invited us to join Brussels treaty. How should we respond?？"
 bri.62.a:0 "We should join"
 
 bri.63.t:0 "[FROM.GetName] has jpined Brussels treaty。"
 bri.63.d:0 "[FROM.GetName] has joined Brussels treaty。"
 bri.63.a:0 "OK。"
 
 bri.64.t:0 "Britain seeks to improve relations with France."
 bri.64.d:0 "Prime minister [ENG.GetLeader]said that the British government seeks to strengthen cooperation with France to meet future challenges."
 bri.63.a:0 "OK。"
 
 bri.65.t:0 "Britain seeks to improve relations with West Germany"
 bri.65.d:0 "Prime minister [ENG.GetLeader]said that the British government seeks to strengthen cooperation with West Germany to meet future challenges."
 bri.65.a:0 "OK。"
 
 bri.66.t:0 "Britain proposed the three ring foreign policy"
 bri.66.d:0 "Prime minister [ENG.GetLeader] put forward the three ring foreign policy, hoping to maintain Britain's status by establishing friendly relations between Britain, the United States and the Commonwealth."
 bri.66.a:0 "OK。"
 
 bri.66.t:0 "Five Nation Joint Defense Agreement"
 bri.66.d:0 "Under the leadership of the UK, the five countries of New Zealand, Malaysia, and Australia and New Zealand signed a Five Nation Joint Defense Agreement to counter the expanding power of communism in Southeast Asia."
 bri.66.a:0 "The tension in Europe has intensified."
 
 bri.67.t:0 "Invitation to the Five Nation Joint Defense Agreement"
 bri.67.d:0 "How should we respond to the invitation from the British government to sign the Five Nation Joint Defense Agreement?"
 bri.62.a:0 "We should join"
 
 bri.68.t:0 "[FROM.GetName] signs the Five Nation Joint Defense Agreement"
 bri.68.d:0 "[FROM.GetName] signs the Five Nation Joint Defense Agreement."
 bri.68.a:0 "We should join"
 
 bri.69.t:0 "Establishment of the Commonwealth"
 bri.69.d:0 "The British government has revised relevant Commonwealth regulations, including allowing the Republic to join, strengthening economic and diplomatic ties, and so on. The British government hopes that the existence of the Commonwealth can replace the "British Empire" and become a link between Britain and former colonial countries."
 bri.69.a:0 "Goods"
 
 bri.71.t:0 "Establishment of the Arab Federation and the United Arab Emirates"
 bri.71.d:0 "After political operation, Britain began to withdraw from their colonies on the Arabian Peninsula and integrate them into two countries - the United Arab Emirates in the Persian Gulf and the Arab Confederation in the south. These two countries still belong to the Commonwealth and maintain political ties with London."
 bri.71.a:0 "Goods"
 
 bri.72.t:0 "Operation to suppress the Irish Republican Army"
 bri.72.d:0 "Our army searched and destroyed the bases and troops of the Irish Republican Army, and achieved good results. Some of the Irish Republican Army have been defeated and retreated to the suburbs, and they will not appear again for a long time."
 bri.72.a:0 "Good."
 
 bri.73.t:0 "Failed to suppress the Irish Republican Army!"
 bri.73.d:0 "Our troops launched a search operation and attacked the Irish Republican Army, but it failed! The Irish Republican Army defeated our troops and seized many weapons!"
 bri.73.a:0 "Bad news."
 
 bri.74.t:0 "Britain announces the establishment of the British Dominion of Hanover!"
 bri.74.d:0 "The British government has released news! London has decided to establish an independent Hanover Dominion in its occupied German territory and to place it under British protection!"
 bri.73.a:0 "德国的分裂已成定局。"
 
 bri.75.t:0 "The UK enacts a nationalization bill"
 bri.75.d:0 "The UK Prime Minister [ENG.GetLeader] announced that the country has decided to undertake a series of economic nationalizations in the coming years, in order to promote rapid reconstruction from the world war."
 
 bri.76.t:0 "The UK enacts the Railway Nationalization Act"
 bri.76.d:0 "The UK Prime Minister [ENG GetLeader] announced that the country has decided to nationalize railways in the coming years, in order to quickly rebuild the country from the world war."
 
 bri.77.t:0 "[FROM.GetName] enacts the Universal Health Insurance Act"
 bri.77.d:0 "[FROM.GetName] government has announced the establishment of a universal health insurance system, providing every citizen with the opportunity to receive free medical services."
 bri.77.a:0 "Keynesianism and welfare states are becoming a consensus"
 
 bri.78.t:0 "Britain sells jet engines to the Soviet Union"
 bri.78.d:0 "During the Soviet delegation's visit to the Rolls Royce factory in the UK, British Chancellor of the Exchequer, Stauff Cripps, announced the sale of advanced Nene jet engines to the Soviet Union as a gesture of friendship between the two countries"