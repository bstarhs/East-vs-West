l_english:
 lle.1.t:0 "Riots erupt in Lithuania!"
 lle.1.d:0 "With turmoil and unrest sweeping across the country, Lithuania has also erupted in armed uprisings demanding independence! The rioters plundered weapons, occupied government strongholds in Vilnius and Kaunas, and launched attacks on our garrison!"
 
 lle.2.t:0 "Riots erupt in Latvia!"
 lle.2.d:0 "With turmoil and unrest sweeping across the country, Latvia has also erupted in armed uprisings demanding independence! The rioters plundered weapons, occupied government strongholds in Riga, and launched attacks on our garrison!"
 
 lle.3.t:0 "Riots erupt in Estonia!"
 lle.3.d:0 "With turmoil and unrest sweeping across the country, Estonia has also erupted in armed uprisings demanding independence! The rioters plundered weapons, occupied government strongholds in Tallinn, and launched attacks on our garrison!"
 
 lle.4.t:0 "The Baltic way movemnt"
 lle.4.d:0 "An unprecedented demonstration broke out in the Baltic region under Soviet rule. In order to commemorate the 50th anniversary of the Soviet Union's annexation of the three Baltic countries, the people of Lithuania, Latvia, and Estonia launched a large-scale movement, forming a team spanning thousands of kilometers."
 
 lle.5.t:0 "Riots erupt in the Baltic Sea!"
 lle.5.d:0 "With turmoil and unrest sweeping across the country, riots demanding independence have also erupted in the Baltic Sea! The protesters occupied government strongholds and radio stations in Vilnius, Kaunas, Riga, and Tallinn, and faced off with our troops. The highest Soviet of the Baltic countries also decided to vote on independence."
 
 lle.6.t:0 "The Baltic Independence War broke out!"
 lle.6.d:0 "As the Soviet army entered Vilnius and engaged in fierce exchanges of fire with armed protesters, a full-scale Baltic independence war broke out! Independents in Lithuania, Latvia, and Estonia launched riots and organized armed forces to resist the Soviet army."
 
 lle.7.t:0 "Soviet troops withdraw from the Baltic Sea!"
 lle.7.d:0 "After a confrontation with the nationalists in the Baltic Sea, Moscow was forced by political pressure to withdraw all its troops in the Baltic Sea, and all government institutions in the Baltic Sea also broke away from Moscow's control. At this point, Lithuania, Latvia, and Estonia emerged from over forty years of Soviet rule and achieved de facto independence."