 vin.1.t:0 "Viet Minh occupt the Dien Bien!"
 vin.1.d:0 "After dozens of days of siege, the French army, running out of supplies and food, had to surrender to the Vietnam Independence Alliance, and the Battle of Dien Bien Phu ended with the victory of the Vietnamese army. The news came that the French army's morale It was hit, and public opinion believed that the outcome of the Franco-Vietnamese war might be skewed in favor of the Vietnamese."
 vin.1.a:0 "Got it."
 
 vin.2.t:0 "Viet Minh occupt the Hue!"
 vin.2.d:0 "After a fierce battle, the Viet Minh army finally broke through the French defense line and entered the urban area of ​​Hanoi. With the sporadic street battles, the French commander had to announce the abandonment of Hanoi, and a large number of French soldiers and Francophiles and Catholics in Hanoi retreated south."
 vin.2.a:0 "Got it."
 
 vin.3.t:0 "Viet Minh occupt the Sai gong!"
 
 vin.4.t:0 "Viet Minh Occupy Hanoi!"
 vin.4.d:0 "After a fierce battle, the Viet Minh army finally broke through the French defense line and entered the urban area of ​​Hanoi. With the sporadic street battles, the French commander had to announce the abandonment of Hanoi, and a large number of French soldiers and Pro-French and Catholics in Hanoi retreated south. Viet Minh soldiers, welcomed by the pro-independence crowd, entered the city centre and raised their flags on the site of the old Vietnamese Royal Palace and the French Governor's Palace."
 vin.4.a:0 "Got it."
 
