 vin.13.t:0 "End of Geneva Meeting"
 vin.13.d:0 "After months of negotiations, the dispute over Vietnam's future was finally resolved. With the intervention of the United States and France, Vietnam was divided into two parts: the North was the Democratic Republic of Vietnam under the Viet Cong, To the south is Vietnam. Both sides are exercising autonomy and establishing a new government. There is concern in public opinion that Vietnam will soon be plunged into a bloody civil war with ideological divisions like North Korea."
 vin.13.a:0 "What will the future of Vietnam look like?"
 
 vin.14.t:0 "Election in South Vietnam"
 
 vin.15.t:0 "Invite Bao Dai to return to Vietnam"
 
 vin.16.t:0 "Nguyen Phuc Vinh Thuy served as a North Vietnamese official"
 
 vin.17.t:0 "Invite Bao Dai to return to Vietnam"
 
 vin.18.t:0 "Nguyen Phuc Vinh Thuy as South Vietnamese head of state"
 
 vin.19.t:0 "Restore the Monarchy"
 
 vin.20.t:0 "Bao Dai refused the throne"
 vin.20.d:0 "After months of negotiations, the dispute over the future of Vietnam has finally settled. Under the intervention of the United States and France, Vietnam is divided into two parts: the Democratic Republic of Vietnam under the rule of the Communist Party of Vietnam in the north and the Vietnam in the south. Each side exercises autonomy and establishes a new government. Public opinion expressed concern about this situation and believed that Vietnam would soon fall into a bloody civil war just like North Korea after being divided by ideology."
 vin.20.a:0 "What is the future of Vietnam?"
 
 vin.21.t:0 "Vietnamese Empire Restoration"
 vin.21.d:0 "Yesterday, South Vietnam ushered in great changes - under the advice of royalists at home and abroad, the former Vietnamese emperor, Bao Dai, who made a declaration of abdication in 1945, finally accepted the "suggestion", Once accepted the throne and proclaimed himself emperor, he restored the Vietnamese Empire, established Saigon as the capital, restored the reign title to Baoda, and held the enthronement ceremony in the imperial city of Hue. The restoration of the monarchy in southern Vietnam caused a storm, and many anti-communists and conservatives in the south vigorously Support Bao Dai's ascension to the throne, while the Viet Cong in the north condemned it and said it would liberate the country from the feudal monarch."
 vin.21.a:0 "What is the future of Vietnam?"
 
 vin.22.t:0 "Vote in South Vietnam"
 
 vin.23.t:0 "Vote in South Vietnam"
 
 vin.24.t:0 "The Republic of Vietnam is established"
 vin.24.d:0 "The referendum on the state system in South Vietnam is over, and the leader of the Hardworking Party, conservative Catholic and anti-communist Ngo Dinh Diem, won the election through apparent fraud. He ousted South Vietnamese head of state Nguyen Phuc Diem and established The Republic of Vietnam with itself as president. The Communist Party of Vietnam in the north declared that it would not recognize the results of this illegal election."
 vin.24.a:0 "What is the future of Vietnam?"
 
 vin.25.t:0 "North Vietnamese Catholics moved south"
 vin.25.d:0 "Under the arrangement of Dinh Diem and the support of U.S. intelligence agents, the Republic of Vietnam organized "Operation Freedom Road" to resettle a large number of anti-communist and Catholic refugees from the north to the south."
 vin.25.a:0 "What will the future of Vietnam look like?"
 
 vin.26.t:0 "Sari Temple Incident"
 vin.26.d:0 "New news came from Saigon that South Vietnamese President Ngo Dinh Diem dispatched agents to break into the relic Temple, the largest Buddhist temple in Saigon, killing and injuring many people. This move has seriously threatened the prestige of the government of the Republic of Vietnam.\n National Defense Minister McNamara believes that the Diem government has been angry with people in Vietnam and has recently been ambiguous in the suppression of the Viet Cong. To prevent Vietnam from falling into the hands of the Viet Cong, we need to take action to replace Diem."
 vin.26.a:0 "Wu Tingyan is a scourge and must be eliminated."
 vin.26.b:0 "Retaining Diem will stabilize Vietnam."
 
 vin.27.t:0 "Buddhist demonstrations"
 vin.27.d:0 "Vietnamese Buddhists staged demonstrations in the streets of Saigon over dissatisfaction with President Diem's ​​policy of forcibly promoting Catholicism and cracking down on Buddhism and Communism."
 vin.27.a:0 "Suppress marches, arrest leaders."
 vin.27.b:0 "Attempts to appease protesters."
 
 vin.28.t:0 "The North Vietnamese People's Army is infiltrating South Vietnam!"
 vin.28.d:0 "Using the Ho Chi Minh Trail, the North Vietnamese People's Army secretly dispatched several regiments into South Vietnam and participated in military operations against South Vietnam."
 vin.28.a:0 "The war has intensified."
 
 vin.29.t:0 "Viet Cong Uprising!"
 vin.29.d:0 "With the support of North Vietnam, the South Vietnamese National Liberation Front launched a military operation to attack the South Vietnamese army!"
 vin.29.a:0 "The war has intensified."
 
 vin.30.t:0 "The Ho Chi Minh Trail is interrupted!"
 vin.30.d:0 "Due to the weakened presence of our army in Laos and Cambodia, the Ho Chi Minh Trail has been interrupted! We cannot rely on it to export personnel and supplies to the south for the time being!\n Increase the support rate of Communism in Laos and Cambodia Watch the restoration of the Ho Chi Minh Trail."
 vin.30.a:0 "That sucks."
 
 vin.31.t:0 "Military coup in Vietnam!"
 vin.31.d:0 "A military coup broke out in Saigon, the capital of the Republic of Vietnam! The Army of the Republic of Vietnam led by Yang Wenming suddenly broke into the Presidential Palace and announced that President Dinh Diem had been overthrown and the Military Revolutionary Committee was established. A nearby church was eventually found and killed by soldiers.\nPublic opinion generally believed that Washington was behind the coup d'état to replace the Dinh Diem government, which was constantly arousing public anger."
 vin.31.a:0 "Eventual times."
 
 vin.32.t:0 "Military coup in Vietnam!"
 vin.32.d:0 "A military coup d'etat broke out in Saigon, the capital of the Republic of Vietnam! The Army of the Republic of Vietnam led by Yang Minh suddenly attacked the Presidential Palace. President Dinh Diem commanded the troops loyal to him to counterattack, and finally successfully foiled the coup plot.\nThis The incident has made the already unstable political situation in South Vietnam even more chaotic. Public opinion generally believes that Washington is behind the coup to replace the government of Ngo Dinh Diem, which has been arousing public anger. Wu has not yet commented on the matter."
 vin.32.a:0 "An eventful time."
 
 vin.33.t:0 "Military coup in Vietnam!"
 vin.33.d:0 "A military coup broke out again in Saigon, Vietnam! South Vietnamese officers collectively overthrew the [SVN.GetLeader] president, who was not powerful enough to control the political situation in South Vietnam, and established a new military government. In the question of who is the new leader On this issue, army general Nguyen Van Thieu and anti-communist politician Tran Thien Hiem have two choices."
 vin.33.a:0 "Eventual times."
 
 vin.34.t:0 "Ho Chi Minh Trail Restoration"
 vin.34.d:0 "Thanks to our military presence in Laos and Cambodia, the Ho Chi Minh Trail has been restored! We can rely on it to export personnel and supplies to the south!\n Increase the support of Communism in Laos and Cambodia to see gram Restoring the Ho Chi Minh Trail."
 vin.34.a:0 "Excellent."
 
 vin.35.t:0 "Coup in South Vietnam!"
 
 vin.36.t:0 "Coup in South Vietnam!"
 
 vin.37.t:0 "Our army was attacked in Tokyo Bay!"
 vin.37.d:0 "Our Navy ships were attacked by NATO torpedo boats in Tonkin Bay, northeast Vietnam! Our destroyer USS Markdos counterattacked and sank a Vietnamese torpedo boat.\n After the news reached the White House , President [USA.GetLeader] believes it's time to ask Congress to send more troops to Vietnam to fight Communism in the country."
 vin.37.a:0 "The war is on fire after all."
 
 vin.38.t:0 "Tokyo Bay Incident!"
 vin.38.d:0 "A U.S. Navy warship was attacked by a NATO torpedo boat in Tonkin Bay, northeastern Vietnam! The destroyer USS Markdos counterattacked and sank a Vietnamese torpedo boat.\n After news reached the White House, [USA .GetLeader] President proposed to Congress to send more troops to Vietnam to combat Communism forces in the country, marking the US military's full involvement in the Vietnam War."
 vin.38.a:0 "The war is on fire after all."
 
 vin.40.t:0 "Comrade Ho Chi Minh is dead!"
 vin.40.d:0 "Sad news comes that Comrade Ho Chi Minh, General Secretary of the Vietnam Workers' Party and leader of the Vietnam National Liberation Movement, unfortunately passed away on a day before the reunification of the motherland. The funeral was held in Hanoi.\n After Ho Chi Minh died, the Central Committee of the Communist Party of Vietnam began to elect the next general secretary."
 vin.40.a:0 "Comrade Le Duan should take over as General Secretary."
 vin.40.b:0 "Comrade Long March is the most suitable choice."
 
 vin.41.t:0 "Ho Chi Minh is dead!"
 vin.41.d:0 "Comrade Ho Chi Minh, General Secretary of the Vietnamese Workers' Party and leader of the Vietnamese National Liberation Movement, unfortunately passed away on a day before the reunification of the motherland. The funeral was held in Hanoi. Ho Chi Minh's death not only means that Vietnam has lost a A great leader also means that the international left-wing youth has lost a spiritual leader."
 vin.41.a:0 "The battle will continue."
 
 vin.42.t:0 "The United States offers to negotiate"
 vin.42.d:0 "The Americans asked us to negotiate a truce and proposed the complete withdrawal of the Vietnamese People's Army and the US military from South Vietnam. How should we respond?"
 vin.42.a:0 "We agree to suspend the Civil War."
 vin.42.b:0 "Never! Must fight to the last minute!"
 
 vin.43.t:0 "Hanoi rejected our truce talks"
 vin.43.d:0 "Information from Hanoi states that no peace talks will be agreed unless our troops completely withdraw from southern Vietnam."
 vin.43.a:0 "Unlucky"
 
 vin.44.t:0 "Paris Peace Accord"
 vin.44.d:0 "Representatives of North Vietnam, South Vietnam, and the United States signed the "Agreement on Ending the Vietnam War and Restoring Peace" in Paris, and the North Vietnamese People's Army and the U.S. Army agreed to withdraw completely from South Vietnam in order to bring about the speedy end of the Vietnam War.\n The government of the Republic of Vietnam in Saigon strongly condemned the signing of the agreement, saying that the withdrawal of the US military when the Viet Cong had not been completely eliminated was a betrayalSaigon. "
 vin.44.a:0 "Peace may not be far away."
 
 vin.47.t:0 "Vietnamese People's Army enters Saigon!"
 vin.47.d:0 "After fierce fighting, the Vietnam National Liberation Front and the Vietnam People's Army finally entered Saigon, the capital of the Republic of Vietnam. Most of the remaining South Vietnamese soldiers in the city surrendered by laying down their weapons. The Vietnamese people The army's tank slammed into the gate of the presidential palace, and the last president of South Vietnam [SVN.GetLeader] fled in a hurry. General Yang Wenming signed a surrender treaty with the commander of the People's Army as a replacement, announcing that all the troops of the Republic of Vietnam would stop resisting.\nThe fall of Saigon means that The decades-long Vietnam War is finally over, but it seems that peace has yet to come to this land."
 vin.47.a:0 "The war is temporarily over."
 
