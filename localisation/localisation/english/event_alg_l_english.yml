l_english:
 alg.1.t:0 "Algerian Uprising!"
 alg.1.d:0 "The Algerian Liberation Front has launched an uprising in Algiers! They declared that they would launch a war to liberate Algeria from French colonial rule!"
 alg.1.a:0 "Let's see what happens next."
 
 alg.2.t:0 "Algeria declares independence"
 alg.2.d:0 "After experiencing the brutal War of Independence, the Algerian Liberation Front finally forced France to sign a treaty and completely withdraw from the country."
 alg.2.a:0 "Let's see what happens next."
 
 alg.3.t:0 "Attacks by the Algerian Liberation Front"
 alg.3.d:0 "The Algerian Liberation Front attacked a station of our army in Algeria!"
 alg.3.a:0 "Let's see what happens next."
 
 alg.4.t:0 "France's atrocities in Algeria have been exposed！"
 alg.4.d:0 "The series of crimes committed by the French colonial authorities in Algeria have been exposed by the media, including the massacre of civilians, the execution of political prisoners, and the bombing of residential areas, which has greatly weakened France's influence in the international community."
 alg.4.a:0 "Let's see what happens next."
 
 ang.5.t:0 "Algerian resistance forces suppressed"
 ang.5.d:0 "Under the strong suppression of the French army, the Algerian resistance forces were defeated, and survivors were forced to flee underground."
 ang.5.a:0 "OK."