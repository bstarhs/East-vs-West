l_english:
 BM_HISTORY_TITLE:0 "History"
 1947_NAME:0 "Iron Curtain 1947"
 1947_DESC:0 "From Stteting in the Baltic to Trieste in the Adriatic Sea, an iron curtain has been opened across the European continent. In 1945, the Great World War II ended. The two great powers, the United States of America and the Soviet Union, which rose after the war, separated Europe and established a sphere of influence on both sides of the iron curtain. At the same time, the destruction of the war caused the collapse of the colonial system dominated by Europe, and the colonies of various countries set off a wave of independence, which gave opportunities for the expansion of the two major ideologies of capitalism and communism. A war without gunpowder has begun, but this time the protagonists are not soldiers and tanks, but spies and politicians, scientists and think tanks, businessmen and traitors..."

 FRA_1947_DESC:0 "France was the biggest victim of the Second World War in Western Europe after Germany. Their land was destroyed by gunfire and the Third Republic was overthrown. The Fourth Republic accepted the Marshall Plan and rebuilt its country, but it was not without cost - the United States and Britain actively invited France to join their military groups to fight against new enemies from the East. But general de Gaulle, who had just led Free France to liberate the motherland, did not think so. He did not want to see the United States become the hegemony of the western world, but let France lead the rise of post-war Europe and strengthen relations with the Soviet Union and new China. Will France become a pawn of American European strategy? Or lead Europe and become the leader of Western Europe?"

 USA_1947_DESC:0 "If we want to achieve this goal, we must be willing to help free people get rid of the control of totalitarian regime and maintain their free system and national integrity. We need to organize the expansion of communism and their subversive movement... In 1947, there was a civil war between Greece, Turkey and China and communism, and the division between East and West Germany and North and South Korea intensified. President Truman began to implement his foreign policy, changed the United States and the world, curbed communism and promoted American democracy to the world. Now that the cold war between the United States and the Soviet Union has begun, can the United States lead the free world to eliminate the threat of communism?"

 WGR_1947_DESC:0 "The impact of World War II on Germany was undoubtedly devastating. East Prussia and Poznan were divided into Poland under the control of the Soviet Union. Germany was divided by Britain, France, the United States and the Soviet Union, and Berlin was divided in two. However, the war was over. After a long confrontation between the US and Soviet occupation forces, Stalin ordered a blockade of West Berlin. Subsequently, the Federal Republic of Germany and the Democratic Republic of Germany were established one after another. Two Germans who follow different forces and take different paths are pushed to the forefront of ideological conflict, which represents not only the division of one country, but also the division of two worlds."

 ENG_1947_DESC:0 "Among the three giants of the United States, Britain and the Soviet Union in World War II, the United States and the Soviet Union successively established their spheres of influence on the East and west sides of Europe. On the contrary, the British got nothing in return. From Myanmar, Malaya to Africa, the sun never sets, the Empire continuously lost its overseas colonies and finally became a sub power. Therefore, in order to safeguard their interests, Britain chose to stand on the side of the United States and become the backbone of the Western camp. In 1946, Churchill delivered his iron curtain speech, marking the arrival of the Cold War era."

 SOV_1947_DESC:0 "At the cost of 6.88 million casualties, the Soviet Union finally planted a red flag in the Empire State Building in Berlin and won the war. But the fighting has not completely subsided. After the war, Stalin and the West had a dispute on how to deal with Germany, and then the conflict between ideology and national interests broke the alliance. Moscow does not want to repeat the fact that its territory is invaded every 20 years, so they need to take the initiative to establish a socialist barrier in Eastern Europe"

 PRC_1947_DESC:0 "Although the Kuomintang and the Communist Party made arduous efforts to create a peaceful China during the negotiations in Chongqing, their plans were very small and there were differences on many issues. The final agreement is like waste paper. In 1946, Chiang Kai Shek's army attacked areas controlled by the Communist Party. The second civil war broke out between the Kuomintang and the Communist Party. After withdrawing its main force from Shaanxi, the Communist Party of China is ready to launch an attack on the Central Plains. 1947 was a crucial year of China's civil war, which will directly determine China's future. Can the Communist Party of China lead the people of the whole country, defeat the weak Kuomintang government and create a new China?"

 CHI_1947_DESC:0 "During the Chongqing negotiations, Chiang Kai Shek and Mao Zedong failed to reach a plan to abolish the areas and armies controlled by the Communist Party. Although they signed an agreement, both sides are preparing for the war. In 1946, the civil war between the Kuomintang and the Communist party broke out, and the Kuomintang army attacked the areas controlled by the Communist Party. Chiang Kai Shek thought he had advanced equipment, but the Communist Party also received financial support from the Soviet Union. More importantly, the Communist Party has the support of the people. Can Chiang Kai Shek defeat the Communist Party and unify the whole country?"

 JAP_1947_DESC:0 "Bloody killings, senseless deaths and two atomic bombs finally made a belligerent country bow its head. After Japan's surrender, the United States established a United Nations control led by MacArthur, and Japanese Emperor Hirohito had to cooperate with him. Under the supervision of the U.S. military, with the revival of democracy, the abolition of the army, the re establishment of the Communist Party of Japan, how will the new government and Japanese people be liberated from the downturn caused by the war?"

 GRE_1947_DESC:0 "After World War II, the British army occupied Greece and helped Greek King George II regain the throne. But when the Greek communist guerrillas who made meritorious contributions to the German war sought to establish a republican government, the first bloody conflict of the cold war began."

 ALB_1947_DESC:0 "Enver Hoxha led the Albanian Labor Party guerrilla forces to defeat German and Italian aggressors and seize power. Now, Comrade Hoxha will lead the party and the people to establish a new Albania. In addition to internal class enemies and factional struggles, Hoxha also faced pressure from Yugoslavia. Just as the Soviet Union exerted political influence in Eastern Europe, Yugoslavia, as the biggest supporter of Albanian guerrillas during World War II, also hoped to invest in the newly established Albanian government. How should Hoxha respond?"

 ARG_1947_DESC:0 "Argentina remained neutral in this devastating world war and earned a large amount of foreign exchange by exporting urgently needed supplies to the Allies, but the Argentine people were not satisfied with this. General Juan Perón and his Justice Party won the support of the middle class and populists, becoming the President of Argentina. Per ó n hoped that Argentina would take a non communist and non capitalist third path, achieve economic nationalization, exclude foreign capital, improve welfare, and promote secularization and modernization. Beilong's policies have indeed won the support of the people and achieved certain accomplishments, but with the worsening of inflation and fiscal deficits, it is still unknown how long the Justice Party can rule."

 JOR_1947_DESC:0 "The outer Jordan area in the east bank of the Jordan River is currently under the rule of Abdullah I of the Hashemite family. After the Hashemite family failed to establish a great Arab vision, Abdullah, as the second son of the family, was arranged by the British to rule in this area close to the Holy Jerusalem. After the end of World War II, Outer Jordan gained independence and Abdullah I became the king of Jordan. However, his ambition was not satisfied with the land of Jordan. The conflict between Palestinian Israelis and Arabs continued to escalate, and Arabs demanded the expulsion of Jews from Jerusalem. Abdullah was very willing to accept this request and intervene in the situation in Palestine, making himself the new master of Palestine and Jerusalem."

 HUN_1947_DESC:0 "Miklósz Horthy's army was destroyed by the Soviet Union, and post-war Hungary undoubtedly did not regain any territory under the Trianon Treaty and fell under the control of the Soviet Union and the Hungarian Communist Party. The Soviet Union established a democratic coalition government in Hungary that was actually under the control of the Communist Party. The Hungarian Communist Party seemed to have no doubt about taking power, but the Soviet Union's political purge of Hungary was not thorough. At least before the official establishment of the Communist Republic, pro Western forces and even remnants of the Arrow Cross Party still had considerable influence in Hungary."

 SIA_1947_DESC:0 "Due to the fact that sober individuals in the Thai Ministry of Foreign Affairs did not officially declare war on Britain and the United States, Thailand, as a Japanese ally, avoided the Allied attack and trial. Thailand established a short-lived government composed of military personnel, and Prime Minister Plaek Phibunsongkhram announced his resignation, but still maintained considerable influence in the military. The erroneous decision to ally with Japan during World War II greatly damaged the credibility of the military government. While the Phibunsongkhram group was preparing to regain power, democratic forces in Thailand also realized that the opportunity to overthrow the dictatorship and rebuild democracy was imminent."

 YUG_1947_DESC:0 "After arduous battles, Marshal Broz Tito led the Yugoslav Communist Party to defeat the aggressors and establish the new Yugoslav Republic. As the only Eastern European country that did not rely on foreign aid to liberate the motherland, Tito was very alert to Stalin's interference in Eastern European politics. He did not want Yugoslavia to become a puppet of the Russians, even if it cooperated with the West. Internally, Serbs and Croats fought against each other during World War II, leaving a profound ethnic conflict in Yugoslavia. Marshal Tito must handle this issue with caution."

 SPR_1947_DESC:0 "Franco Spain unexpectedly maintained a smelly neutrality during World War II, becoming an untested fascist regime, but he was still not accepted by the post-war new order, and Spain remained an isolated country. Some people in Franco's government tried to contact the United States in an anti communist position, but the Americans made conditions."

 ITA_1947_DESC:0 "As a defeated country in World War II, Italy received the punishment it deserved, the Savoy dynasty abdicated, and Italy became a republic, just as it did three thousand years ago. However, after the end of the World War, new conflicts will come again. The Italian Communist Party formed guerrillas to fight against Nazis and Fascists in World War II. Therefore, after the war, the Italian Communist Party led by Toriyati almost became the leader of Italian politics. Obviously, this is not what the Americans, the emperor and the anti Communist conservative forces want to see. Therefore, they will support the Catholic Democratic Party and the Communist Party in the upcoming elections to fight against each other. The winner will dominate the future of Italy, and the loser will not necessarily stop."

 ROM_1947_DESC:0 "Romania, which originally supported the Axis powers, quickly switched sides and joined the Allies at the end of World War II, becoming an ally of the Soviet Union. After the coup on August 23, Romania established a special constitutional monarchy, with only 26 year old King Michael I and the Romanian Communist Party supported by the Soviet Union forming a coalition government. It is clear that this coalition government will not last long, and the Romanian Communist Party's seizure of power has become a fact."

 CZE_1947_DESC:0 "The Czechs were disappointed with the western countries. The Munich conspiracy made the British and French notorious in the Czech, while the Russians who liberated Prague were widely welcomed by the Czechs, so the Czech Communist Party entered the government. The Americans and the Soviets will compete fiercely for the Czech. The Marshall Plan will be the beginning of the Czech's decision to join the Western countries or the Communist countries."

 POL_1947_DESC:0 "二战后英国军队占领希腊，帮助希腊国王乔治二世夺回王位。但当在对德战争中做出功勋贡献的希腊共产党游击队寻求建立共和政府时，冷战的第一场血腥冲突开始了。"

 TUR_1947_DESC:0 "The government of Türkiye remained neutral in the Second World War, but at the end of the war, the government gradually approached Britain and the United States. After World War II, the Soviet Union hoped to expand its influence in the Mediterranean Sea, so it hoped to gain access to the Dardanelles Strait. In the face of Soviet pressure, Türkiye either succumbed or sought help from Western countries. In addition, the People's Party of the Republic left by Ataturk Kemal has been in power for more than 20 years in Türkiye. After World War II, Türkiye began to call for multi-party system, becoming the most important political issue in Türkiye."

 MAL_1947_DESC:0 "The British army stationed in Malaya was quickly defeated by the Japanese army during World War II, and only a few Malayan Communist armed forces persisted in resisting in the dense forest. After World War II, when the British returned to Malaya, it was obvious that the two sides would not easily give up the land to each other, so a bloody battle would be fought again in Malaya."

 PAR_1947_DESC:0 "The February Revolution government established by Rafael Franco in 1936 was overthrown by the military only a few years later, but the Feberista Party still had a deep influence in Paraguay. They planned to launch a second revolution in Paraguay, and if successful, they would be the first Latin American country to establish a left-wing regime after World War II."

 HOL_1947_DESC:0 "The Second World War turned the Netherlands into ruins, and when Queen Wilhelmina and her interim government returned to their homeland, they found that the Dutch economy was on the brink of collapse. In the distant East, although the Dutch controlled colonies in the East Indies broke away from Japanese control, the local people had already tasted the taste of independence and no longer wanted to return to Dutch rule. The Netherlands decided to use force and, before the smoke of World War II was extinguished, sent a newly rebuilt army to suppress independence riots in the East Indies, because for the Netherlands, the East Indies were their lifeblood in rebuilding their country. The Dutch and the Indonesian interim government held a brief ceasefire in early 1946, and some parts of Indonesia established an autonomous territory that respected the Dutch queen. However, it was clear that neither the Dutch nor Indonesian nationalists accepted this result, and the outbreak of another bloody conflict was only a matter of time."

 TIB_1947_DESC:0 "The 14th Dalai Lama is still underage, and Radreng Rinpoche serves as regent. As the Kuomintang government gradually turned to inferiority in China's civil war, there were fierce internal disputes within Tibet over the future. Some people remained loyal to the Kuomintang government, some advocated following the UK and India to establish independent countries, and some intellectuals who had received western education hoped to overthrow the Dalai Lama regime, so they established relations with the CPC."

 INS_1947_DESC:0 "The Japanese claimed that their invasion was to help Southeast Asia break free from European colonial rule, and perhaps Indonesians would agree with this. Japan did indeed destroy Dutch rule over the East Indies and replaced it with its own rule, and when Japan withdrew from Southeast Asia, Indonesian nationalists led by Sukarno decided to establish their own country. The Dutch will not give up on this region they have ruled for nearly three hundred years, so they sent troops to carry out bloody repression. The Dutch and the Indonesian interim government held a brief ceasefire in early 1946, and some parts of Indonesia established an autonomous territory that respected the Dutch queen. However, it was clear that neither the Dutch nor Indonesian nationalists accepted this result, and the outbreak of another bloody conflict was only a matter of time."
 
 OTHER_1947_DESC:0 "The nations of the world, great and small, are not all content to hold their breath awaiting the outbreak of another global conflict. From major powers on the brink of civil war to the many nations formed and transformed by the Great War, all will have to make difficult decisions and balance ideals with pragmatism to have an impact on the future of the world."



 1950_NAME:0 "Quarrel brothers 1950"

 1950_DESC:0 "If Europe is the target of the cold war, then Asia is the battlefield. After 35 years of Japanese colonial rule, the Korean people are eager to see the establishment of a new country. They see, but there are two new countries - the Republic of Korea of Lee Seung Wan and the Democratic People's Republic of Korea of Kim Il Sung. With the support of Washington and Moscow, the two governments occupying the north and south parts of the 38th front accused each other of illegality and sought to unify the whole peninsula. They hold sticks and watch their compatriots with vigilance..."

 SOV_1950_DESC:0 "Stalin had an unhappy birthday. He hoped that China's new leader Mao Zedong would allow the Soviet Navy to be stationed in Lushun, but Mao Zedong refused, and there was a rift in the relationship between comrades and brothers. In retaliation, Moscow provoked a war with its northeast neighbors when the PLA was ready to liberate Taiwan. In Western Europe, the United States established a national organization called NATO to oppose the infiltration of the Soviet Union. Western European countries are united. What about socialist countries?"

 FRA_1950_DESC:0 "France is in trouble. From Vietnam to Algeria, guerrillas are attacking colonial troops, and Africa calls for independence. In Paris, the president of the Fourth Republic has no power to direct the government. More than 10 heads of government and prime ministers have been replaced. Some people demand a new constitution or a new strong leader. Perhaps the heroes of France in the last World War can do it."

 USA_1950_DESC:0 "The failure of the Kuomintang government in Chinese mainland has greatly disappointed the United States. Now they expect Taiwan, Japan and South Korea to assume the responsibility of anti Communist bases in Asia. However, when the aftermath of China's civil war was not calm and Japan's domestic political situation was still chaotic, the news of the outbreak of war came from the March 8th front. How did Truman protect America's sphere of influence in Asia?"

 PRK_1950_DESC:0 "Kim Il Sung, an anti Japanese guerrilla leader born in rural North Korea, established his own regime in Pyongyang with the support of the Soviet Union. He had planned to form a coalition government with another respected South Korean leader Kim kyu, but after Kim kyu was assassinated, he regarded the South Lee Seung Wan regime as a puppet of the United States and tried to liberate the whole country by force. The Korean army is composed of guerrilla veterans who participated in the Anti Japanese war. With the assistance of the Soviet Union, they are ready to sweep South Korea and unify the Peninsula..."

 PRC_1950_DESC:0 "With the founding of the people's Republic of China, the Chinese civil war ended with the victory of the Communist Party of China. However, while a few Kuomintang troops in the South were still struggling, Mao Zedong faced new problems - China was devastated by the civil war, industry was destroyed, prices soared and social order was chaotic; Tibetan nobles refused to join new China and colluded with India and Britain; The remaining Kuomintang troops withdrew to Yunnan and Burma, waiting for an opportunity to counterattack. The civil war broke out in neighboring North Korea in the northeast, and China's only industrial base was threatened..."

 KOR_1950_DESC:0 "The founding of the Republic of Korea should have been a day when the Korean people welcomed freedom. But the unpopular dictator Synnman Rhee secretly murdered presidential candidate Kim Koo and ruled with the support of the United States. His relations with his northern compatriot Kim Il Sung deteriorated sharply..."

 JAP_1950_DESC:0 "After World War II, Japan needs to establish a new political and economic system. Japan's first general election is coming, and the Communist Party, social democratic conservatives and even former imperial officials are ready. However, the war on the Korean Peninsula led to the withdrawal of U.S. troops, Japan's weak defense and the readiness of leftists. Who will win the crisis?"

 EGY_1950_DESC:0 "The failure of the Israeli war in 1948 angered the Egyptian people, especially the army and officers. The free officers movement is a nationalist organization in the Egyptian army. It is preparing for the revolution, overthrowing King Farouk and establishing a republic. At the same time, liberalism and communism are ready to launch a revolution. Who can be the master of new Egypt?"

 PER_1950_DESC:0 "The invasion and occupation of Britain and Russia awakened Iranian nationalism. King Pahlavi is still restrained by the western world. Their oil fields are still controlled by Britain. Iranian nationalist politicians are planning to recover oil exploitation rights. Some of them even want to overthrow Iran's Shah. Washington will not let it happen. The CIA is ready for its first performance."

 IND_1950_DESC:0 "India is independent, but not perfect. The division of Kashmir has made India and Pakistan permanent enemies. At home, the new country also needs political and economic construction. Internationally, the decolonization of Asia and the establishment of Communist China have brought opportunities and challenges to the Republic of India. How will Nehru make a choice now?"

 VIN_1950_DESC:0 "Since the French invasion of Vietnam in 1946, the Vietnamese nationalist alliance headed by Ho Chi Minh has had guerrillas in the jungle in northern Vietnam. A few years after the founding of the people's Republic of China, Vietnam has obtained many weapons from Beijing and Moscow. Now, the Vietnamese decided to fight back the French and drive them out of Indochina."

 YUG_1950_DESC:0 "The failure of the Greek civil war and the differences between the Communist Party and the workers' intelligence agency intensified the contradiction between the Soviet Union and Yugoslavia. Now Tito decided to recover Trieste with his own strength, seek reunification with Bulgaria and establish a greater Yugoslav Federation. Stalin would not allow anyone to challenge his position as the big brother of socialism, especially when western countries tried to throw an olive branch at Tito."

 TUR_1950_DESC:0 "The 1950 general election ended Kemal's 30-year rule of the Republican people's party in Turkey, and Adnan Mandelis led the Democratic Party to the post of prime minister. The Democratic Party abolished Turkey's neutral policy since World War II and actively approached Britain and the United States to counter the threat of the Soviet Union. In order to vote for North Jonah, Adnan decided to send Turkish troops to participate in the conflict on the other side of the earth."

 INS_1950_DESC:0 "After years of fighting, the Indonesian people drove the Dutch out of the East Indies, but the cost was huge. The newly established Indonesia is a loose confederation. South Maluku, Aceh and West Papua refuse to join and seek independence. The Indonesian Communist Party and Muslim nationalists are hostile to each other, and they still have great influence in Indonesian politics. How should President sugano find a balance among various forces?"

 SVN_1950_DESC:0 "Under the arrangement of the French, Emperor Bao Dai returned to Saigon from Hong Kong and once again acted as the leader of the French puppet regime. This time, Bao Dai's status as head of state was elevated. Catholic nationalist Ngo Dinh-Diem served as prime minister. In addition, there were gangs such as Binh Xuan faction. They are ready to seize Saigon power once the French leave Vietnam."

 TIB_1950_DESC:0 "With the continuous collapse of the Kuomintang government, the Tibetan aristocrats believed that the time had come to break away from Chinese rule. The pro Kuomintang Regent Jerchen was overthrown and killed. Instead, the Regent Takcha actively pursued diplomacy with India and sought recognition. After the Communist Party of China replaced the Kuomintang, it did not recognize all the actions of the Takcha government and gave two choices: peaceful liberation or reunification by force."

 1956_NAME:0 "Revolution 1956"
 1956_DESC:0 "After Khrushchev came to power, the confrontation between the United States and the Soviet Union became white hot. NATO and the Warsaw Pact were established one after another, facing unknown threats. The people's Republic of China has begun a new construction plan. Independent India, Indonesia and Egypt sought to establish a third world camp independent of the United States and the Soviet Union. In Hungary and the Middle East, the fuse of war and revolution is burning."

 SOV_1956_DESC:0 "In 1953, Stalin died. After fierce political struggle, Nikita Khrushchev became the leader of the Soviet Union. Khrushchev decided to carry out a comprehensive reform of the political and economic system of the Soviet Union and overthrow almost all Stalin's policies, including his personal worship. The secret report at the 20th Partys National Congress almost completely denied Stalinism, which is bound to bring a big storm to other socialist countries still pursuing Stalinism"

 USA_1956_DESC:0 "In 1954, the tide of McCarthyism sweeping the United States ended, and Dwight Eisenhower, a veteran of World War II with great achievements, replaced Truman as the president of the United States. Facing Khrushchev, who also just took over the power, Eisenhower decided to ease with the Soviet Union, but this did not mean that he would give up the cold war. With the end of the Vietnam War and the changes in the political situation in the Middle East, the Eisenhower government decided to extend its influence to these regions in order to avoid the fall of dominoes."

 HUN_1956_DESC:0 "Under the manipulation of the Soviet Union, the Hungarian Communist Party and its leader Rákosi Mátyás became the ruler of Hungary. As a loyal supporter of Stalinism, Rákosi imitated and copied all the systems of the Soviet Union in Hungary, including planned economy, one party dictatorship, personal worship and secret police... Now that the Stalin model has been overthrown in the Soviet Union, the wind of reform is about to blow to Budapest, and the people's dissatisfaction with Rákosi will become a fuse"

 PRC_1956_DESC:0 "The achievements of the people's Republic of China in the first ten years were amazing. The Korean war won a strategic victory, economic construction developed rapidly, democratic reform progressed smoothly, and the Communist Party of China entered a golden age. However, with the current national strength, it is far from enough to resist British and American imperialism. Mao Zedong expects China's national strength to develop rapidly, especially steel production and heavy industry. In order to achieve this goal, he does not allow rightists to question his construction line"

 EGY_1956_DESC:0 "Abdul Nasser became the leader of the Republic of Egypt after the July Revolution. As a nationalist, his primary goal was to recover the Suez Canal, which was still controlled by Britain, and to enable Egypt to confront Israel. Nasser's radical attitude on the Suez issue frightened the old colonial countries. British Prime Minister Anthony Eden announced that Nasser would become the next Mussolini and decided to overthrow him by force. Facing the threat of imperialism, Nasser decided to seek cooperation from the socialist faction."

 ISR_1956_DESC:0 "After nearly two thousand years of wandering and suffering, the Jews rebuilt the state of Israel in Palestine in 1948. However, during the period when the Jews left, the land had new owners - Egypt, Syria, Iraq, Jordan and Saudi Arabia. They were not willing to hand over Jerusalem to the Jews. If Israel wants to establish a country, it must take the offensive as the defense and take the initiative to attack"

 ALG_1956_DESC:0 "The gunfire from the desert of North Africa once again dealt a fatal blow to the French Empire. The outbreak of the Algerian War of independence threatened the French colonial system. Paris will never give up this significant colony, especially it will become an important test ground for France to develop nuclear weapons. However, the French are pessimistic about whether the turbulent Fourth Republic can retain these colonies. Some North African colonial officers plot to end the Fourth Republic if it can't hold the French colonies"

 POL_1956_DESC:0 "After World War II, Poland was incorporated into the Soviet satellite state system, and Poland under the rule of the Polish United workers' Party implemented socialist reform. However, as a country with a long tradition of nationalism and Catholicism, Poland's anti Communist and anti Soviet sentiment has never been successfully erased. Now, the storm of de Stalinization swept through Eastern Europe, and the sudden death of Polish Communist leader poleswaf Beirut will have an impact on Poland?"

 BUR_1956_DESC:0 "After the assassination of general Aung San,U Nu took over as the first leader of the Burma, but he had too many problems to face - the threat of ethnic separatism and the remnants of the Kuomintang in the north, and the internal economic downturn and political turmoil. In the face of all this, army general Nevin proposed that he take over the regime for military rule. This will be a decision to change Burma forever"

 VIN_1956_DESC:0 "After the disastrous defeat of Dien Bien Phu, the French rolled out of Vietnam. The Vietnamese people's war against France was over, but the new suffering had just begun. Bounded by 17 ° N latitude, Vietnam is divided from north to south like North Korea. The north is controlled by the Vietnamese Labor Party led by Ho Chi Minh, and the south is ruled by anti Communist Catholic Ngo Dinh Diem. With the support of the Americans, Ngo overthrew Bao Dai through a referendum without any authenticity, expelled the remnants of France, established dictatorship, and actively sought the support of the United States. A new war is brewing."

 JAP_1956_DESC:0 "In 1955, Japan's right-wing conservative forces unified, the Liberal Democratic Party was established, and dominated Japanese politics. After the LDP formed a cabinet, it became close to the United States, opposed the left, and actively promoted the establishment of the Japanese self defense force. This has aroused the dissatisfaction of the Japanese people. The new generation of Japanese do not want to see Japan involved in the war of the world war, especially kishisuke's coming to power. He held an important post in Manchukuo during World War II. Now he is ready to run for prime minister to realize Japan's military normalization and the signing of the Japan US security treaty. The Japanese people decided to decide Japan's future by means of demonstrations."

 CHI_1956_DESC:0 "The Chinese Kuomintang lost in a mess in the second civil war. Chiang Kai Shek and his wife withdrew to Taiwan with tens of thousands of troops, but the people in Taiwan did not welcome the arrival of the Kuomintang army. The corrupt Kuomintang bureaucrats and savage Kuomintang army ruffians aroused a public riot. After the uprising was brutally suppressed, Chiang Kai Shek declared martial law in Taiwan and arrested and killed anyone who might be a Communist Party or Taiwan independence./n On the other side of the Strait, the Kuomintang army lost all the land from Guangdong to Yunnan to Xinjiang, leaving only the coastal islands of Zhejiang and Fujian. In order to prepare for the future counter attack on the mainland, the National Army decided to stick to these islands."
 
 OTHER_DESC:0 "The nations of the world, great and small, are not all content to hold their breath awaiting the outbreak of another global conflict. From major powers on the brink of civil war to the many nations formed and transformed by the Great War, all will have to make difficult decisions and balance ideals with pragmatism to have an impact on the future of the world."

 1961_NAME:0 "Red Alert 1961"
 1961_DESC:0 "Castro's revolution overthrew the American puppet regime. Eisenhower and Kennedy regarded it as the number one threat and hoped to eliminate it as soon as possible. After the failed invasion of the bay of pigs, Castro sought help from Moscow. Khrushchev sought to establish a stronghold in the Western Hemisphere. He readily accepted the request to send missiles by sea to the Caribbean to protect the new Cuban regime against NATO missiles deployed in Turkey. How will the White House and the Kremlin react when U2 finds that the Soviet Union has established a missile base in Cuba?"

 CUB_1961_DESC:0 "The dictator is over! Fidel Castro and Che Guevara led guerrillas into Havana, and Batista, the puppet tyrant of the United States, fled in a hurry. Castro was regarded as an enemy by Eisenhower and the newly established Kennedy government. In order to seek the help of the Soviet Union, Castro announced to join the Communist Party and become an ally of the Soviet Union./n After the failure of the bay of Pigs invasion, Khrushchev decided to give Castro assistance. Several medium and long-range ballistic missiles were secretly transported to Cuba, which became Castro's capital to threaten Kennedy."

 SOV_1961_DESC:0 "Although the de Stalinization storm brought great setbacks to Khrushchev, the reform still made progress. The economic situation of the Soviet Union has improved. Collective farm workers have left the countryside to go to cities, which has promoted urbanization. The virgin land movement and the corn movement are being carried out. The most important thing is that Yuri Gagarin went into space by carrier rocket, realized the greatest ideal of mankind and greatly improved the international status of the Soviet Union. However, as a level of the cold war, the purpose of the Soviet Union is still to compete for hegemony with the United States. Moscow has always wanted to establish influence in the Western Hemisphere. Now, Castro's Cuban revolutionary regime has brought an opportunity."

 USA_1961_DESC:0 "Ask not what your country can do for you, but what you can do for your country.——John F.Kennedy /n Kennedy, 42, became the youngest president in American history. He was full of ambition and prepared to change the country and consolidate freedom. However, his first policy stumbled - the plan to send mercenaries to the bay of pigs to overthrow Castro ended in failure, leading Cuba to completely fall into the arms of the Soviet Union. In Asia, Kennedy inherited Eisenhower's policy, supported Diem's regime and pioneered the sending of land troops to Vietnam. However, the implementation of the special war did not change the situation that the South Vietnamese army was beaten everywhere. Now the Soviet Union has successfully launched a manned spaceship, took a step ahead in the space race, and delivered missiles to Cuba. How should Kennedy make a choice?"

 VIN_1961_DESC:0 "Diem brutally suppressed the Communist Party and Buddhists after he established the notice in southern Vietnam. With the support of North Vietnam, the South Vietnam National Liberation Front was established to crack down on the Diem regime. In order to protect diem, the Eisenhower and Kennedy governments, from paying for guns and equipment to directly sending land troops to the war, failed to suppress the Vietnamese Communist Party. With the increasingly volatile Saigon regime, McNamara believes that Saigon needs a stable regime, and to have a stable regime, there can be no unstable President"

 PRC_1961_DESC:0 "Mao Zedong's great leap forward and steel smelting ended in failure. The golden age of the people's Republic of China ended with the outbreak of the great famine. Mao gave up the post of head of state to Liu Shaoqi, but he himself remained the chairman of the Communist Party of China. There were differences within the party on Mao Zedong's line, laying the groundwork for greater political disputes. Nevertheless, the national defense construction of new China still needs to be carried out, and the development and research of atomic bombs and missiles continue."

 IND_1961_DESC:0 "By leading the conference of Asian and African countries, the non aligned movement and diplomatic relations with the Soviet Union and China, Nehru enabled India to show its skills on the international stage and win the status of leader of the third world. However, Nehru's failure was also diplomatic. After the people's Republic of China recognized Myanmar's sovereignty over jiangxinpo, India also hoped that China could recognize the McMahon line, but it was rejected. After many unsuccessful negotiations, Nehru decided to use force to actually occupy. He believes that China will not fight India for Arunachal region, but his judgment may be very wrong"

 CAM_1961_DESC:0 "After the signing of the Geneva treaty, Vietnam, Laos and Cambodia gained independence. Norodom Sihanouk became king of Cambodia and enjoyed certain real power. Sihanouk has built Cambodia into a richer country in Southeast Asia, but this new country faces the threat of war in Vietnam. The Vietnamese Communist Party's Ho Chi Minh Trail crosses western Cambodia. South Vietnam and Thailand always threaten Cambodia's border security. Sihanouk must choose between the two."

 BRA_1961_DESC:0 "The populist Caudillo Getulio Vargas died in the coup. After a period of turbulence,Juscelino Kubitschek of the Social Democratic Party became the president of Brazil. Kubitschek, who believes in development, moved his experience as mayor of Belo Horizonte to the whole country, actively encouraged foreign investment and developed Brazil's steel and automobile manufacturing industry, and set an ambition to move the capital inland."

 KOR_1961_DESC:0 "Dictator Synnman Rhee finally fled to Hawaii after the April 19 revolution. Yin Shushan took over the presidency, but the real power was in the hands of prime minister Zhang Mian. The Second Republic led by Chang Myeong is famous for its corruption and incompetence. Chaebols and corrupt officials are rampant. People are worried that such a government cannot resist the attack of North Korea and continue to make changes, especially a group of young officers who are planning to enter Seoul to seize power"

 COG_1961_DESC:0 "The Cuban Missile Crisis shocked the world so much that everyone forgot the Congo crisis that sparked controversy at the United Nations General Assembly the previous year. Congolese Prime Minister Lumumba died in the coup, and casabuvu and Mobutu seized power. In southwestern Congo, separatist forces in Kasai and Katanga still exist, and Lumumba supporters are ready to resist in the northeast."

 FRA_1961_DESC:0 "With the support of the Algerian coup force, Charles de Gaulle took over as French president and led France again. De Gaulle's first problem was to end the turbulent and chaotic political situation in the Fourth Republic, and secondly to make a decision on the more and more intense decolonization movement in Africa, especially the war of independence in Algeria. In European affairs, de Gaulle questioned the expansion of NATO and the United States in Western Europe. France will not allow Britain and the United States to intervene in the European continent. De Gaulle will establish independent diplomatic and military forces to ensure his status."

 1965_NAME:0 "War quagmire 1965"

 1965_DESC:0 "With the development of science and technology, ordinary American families also have color TV sets, but what they see through the lens is the battlefield on the other side of the earth, just like hell on earth. US President Johnson strongly advocated sending us troops to participate in the Vietnam War, but it was tenaciously resisted by the Viet Cong. Mao Zedong's great leap forward did not make China's industrial output catch up with Britain and the United States. On the contrary, hundreds of thousands of people died of famine. Liu Shaoqi suggested that Mao Zedong improve the economy. Mao Zedong believed that this was an act of bourgeois revival. He is ready to launch the cultural revolution and wipe out the capitalists. In Eastern Europe, the leaders of Hungary, Poland and Czechoslovakia hope to improve people's living standards through limited reforms, but Brezhnev, the leader of the new Soviet Union known for his toughness, cannot tolerate such behavior..."

 USA_1965_DESC:0 "The accidental assassination of John Kennedy led Lyndon Baines Johnson to take over the presidency. The thorny problem facing Johnson is not only the expanding Vietnam War, but also the deteriorating American civil rights movement. Martin Luther King called on black Americans to take action to eliminate the policy of apartheid. Huge anti Vietnam War and anti racist demonstrators occupied the Lincoln Memorial. How would Johnson respond？"

 VIN_1965_DESC:0 "After Diem and Kennedy were assassinated one after another, the conflict in Vietnam not only did not end, but became more and more serious. Johnson took over the power of the White House and was determined to intervene directly in the Vietnam War by force. After several coups, the Saigon regime welcomed President Nguyen Van Thieu. With international assistance from the Soviet Union and China, the Communist Party of Vietnam is determined to fight American imperialism to the end, and the bloodiest bloody conflict in human history is about to begin."

 PRC_1965_DESC:0 "Mao Zedong was very dissatisfied with the new policies of Deng Xiaoping and Liu Shaoqi. According to the experience of the people's war in the past, it is absolutely right to launch the people's great leap forward and steel smelting, even though the people have paid a huge price for it. Mao Zedong's wife Jiang Qing and his confidant and defense minister Lin Biao took the opportunity to give Mao Zedong advice, accused Liu and Deng of being bourgeois reactionaries, launched the Proletarian Cultural Revolution and called on the people to expel them. Mao Zedong listened to their suggestions and made the most wrong decision in his life."

 SOV_1965_DESC:0 "In October 1964, a coup broke out in the Soviet Union, ending Khrushchev's 11 year rule, and Brezhnev became the new supreme leader of the Soviet Union. The hardline conservative was committed to improving the military strength and sphere of influence of the Soviet Union, which gave the Soviet Union the upper hand in the confrontation with the United States. Brezhnev's policy was to restrict the freedom of other socialist countries and make them a pawn of the Soviet Union. Then, when the Prague Democratic Movement broke out and the Sino Soviet border conflict broke out, will the limited sovereignty theory take effect?"

 KOR_1965_DESC:0 "After the military coup, Park Chung Hee and their soldiers became the rulers of the Republic of Korea. The primary purpose of Park Chung Hee's regime is to change the backward state of South Korea and resist the threat of the Communist Party of the north. The US military's involvement in the Vietnam War made Seoul worried that the US military's protection of South Korea would be weakened. Park Chung Hee chose economy as his first goal to win the support of the people so that South Korea can defend its country. Can he and his government do it?"

 RHO_1965_DESC:0 "The winds of change ended Africa's history as a European colony, but angered the white rulers of South Africa and Rhodesia. The Prime Minister of Rhodesia, Ian Smith, explicitly rejected the decision of Rhodesia to be ruled by blacks after independence, and did not hesitate to unilaterally secede from Britain for independence. The international community immediately imposed sanctions on Rhodesia, and the black resistance forces began to rise. Smith's Rhodesia must defend this land on its own."

 SAF_1965_DESC:0 "The wind of change ended Africa's history of becoming a European colony, but angered the white rulers of South Africa and Rhodesia. In order to maintain the policy of apartheid, the South African nationalist party did not hesitate to unilaterally secede from Britain for independence. The international community immediately imposed sanctions on South Africa, and resistance forces such as the African Congress Party and the southwest African Liberation Front also began to rise. However, South Africa is rich in minerals and armed. They are not only confident in eliminating black resistance, but also confident in developing nuclear weapons, intervening in the Angolan war and establishing hegemony in southern Africa."

 POR_1965_DESC:0 "Although decolonization was in full swing in Africa, Portugal under Antonio Salazar refused to follow the times and insisted on not giving up any colonies in Africa. When communist guerrillas appeared in Angola, Mozambique and Guinea Bissau, Portugal's choice was ruthless repression."

 IND_1965_DESC:0 "Nehru died with regret for his failure in the Sino Indian War. As a result of the internal struggle and compromise of the Congress party, shaistry became India's second prime minister. After Nehru's death, the depravity and corruption of the Congress party continued to intensify, and the new government did nothing to disappoint the people. At this time, Nehru's daughter Indira Gandhi stood out as the only man in the old woman's cabinet. The people expected her to lead India to a new glory like her father, on the premise that she could defeat the Congress Party veteran Desai."

 BRA_1965_DESC:0 "巴西军队出动坦克，杀进首都巴西利亚，左派总统若昂·古拉特被政变推翻，取而代之的使右翼军政府。"

 ISR_1965_DESC:0 "In the 1960s, the confrontation between Israel and Arab countries entered a new stage. The Palestine Liberation Organization was established to carry out armed resistance in Israel. Egypt and Jordan blocked the Gulf of Aqaba and cut off the main route of the Israeli navy to the Red Sea. Jordan is building dams in the upper reaches of the Jordan River, and Jerusalem, the ideal capital of Israel, is still under Jordan's control. The Israeli cabinet believes that if these problems cannot be solved peacefully, it is ready to use force."

 HKN_1965_DESC:0 "In the final stage of the civil war between the Kuomintang and the Communist Party of China, the Communist Party of China gave up the opportunity to recover Hong Kong and stopped by the river of Shenzhen. After the Korean War broke out, the Chinese mainland coast was blocked. Hongkong became an isolated island on the side of bamboo curtain and the "West Berlin" in the Far East. The special geographical location makes Hong Kong a transit point for smuggling and the center of competition between various forces. The British Hong Kong government and police are corrupt and incompetent, the forces of pro China Republic and pro Kuomintang infiltrate and develop, and crime and political struggle spread in this pearl of the East."

 SIA_1965_DESC:0 "After World War II, Thailand once again fell into military dictatorship after only a brief democratic politics. In order to stabilize its regime, the military government sought the support of the United States. Thailand provided US troops with bases to fight in Vietnam. In return, US aid was constantly sent to Bangkok. The money finally went into the wallets of the army and bureaucrats, leaving only pornographic services to the Thai people. Resistance is brewing as the military government tightens its crackdown on the democratic movement."

 INS_1965_DESC:0 "Sukarno's policy of being close to the Communist Party and Muslim nationalists finally failed. The 9.30 coup ended the nasakom regime, and the notorious tyrant Suharto came to power, followed by the massacre of the Indonesian Communist Party, Democrats and Chinese."
 
 1972_NAME:0 "Peace attempt 1972"
 1972_DESC:0 "The international environment has undergone profound changes, especially in the face of the expansionist threat of the Soviet Union, China and the United States have gradually abandoned their past grievances and began to gradually improve bilateral relations to deal with the common threat from the Soviet Union. However, under the 20-year confrontation, the governments of China and the United States do not recognize each other's political legitimacy, and the two countries have not established diplomatic relations. However, it is clear that the cold war has entered another stage. Where will China go after ten years of turmoil? What will the United States, which has just got rid of the economic quagmire of the Vietnam War, do in the face of the threat from the Soviet Union? Two hot ideological Suns have risen all over the world. If you are careless, the end of war will rekindle the world and destroy the world's illusion of peace and prosperity."

 1978_NAME:0 "Graveyard of Empire 1978"

 1978_DESC:0 "Brezhnev's tough strategy soon turned the Soviet Union into a superpower that could destroy the United States. He used military means to destroy any democratic reform forces in Eastern Europe that threatened the Soviet Union, but this planted the seeds for Eastern European countries to strengthen resistance. Now, he has set his sights on Afghanistan, a volatile southern neighbour. The death of Mao Zedong plunged China into great grief. They must decide whether to continue the proletarian revolution or consider other routes. The new president Jimmy Carter won the 1976 election by a narrow margin. How will this prestigious leader face the challenges of the future?"

 AFG_1978_DESC:0 "In 1974, a military coup in Afghanistan overthrew the king and Daud Khan seized power. The Soviet Union wanted Kabul to remain within their sphere of influence, but Daud tried to get in touch with them. West Moscow was the limit. If Daud did not obey them, they would overthrow him again. But the problem is that the Afghan people's Democratic Party, which replaced Daud, is not strong, United and popular with Muslims。"

 SOV_1978_DESC:0 "The Soviet Union under Brezhnev's leadership entered a military heyday, but politics continued to move towards stagnant and hardened old-age politics, and the original economic and political reforms were suspended. Nevertheless, the Soviet Union still hopes to take advantage of the opportunity of the global contraction of the United States to attack the world and expand its influence."

 PRC_1978_DESC:0 "In 1976, when Chairman Mao Zedong, whom the people loved, died, the whole country was devastated. Jiang Qing and her "Gang of four" Red Guards seized power and became China's ruler. With the support of the party elders, Hua Guofeng took over the power and then ordered the arrest of the gang of four, ending the cultural revolution that had harmed China for nearly a decade. However, for Mao Zedong's wrong economic and ideological policies, Hua Guofeng chose to remain unchanged. At that time, Deng Xiaoping, who was under house arrest during the cultural revolution, was reinstated. He questioned China's existing policies and began his own reform plan."

 VIN_1978_DESC:0 "In 1965, Ho Chi Minh died of illness before he could see the liberation of his motherland. His successor, Le Duan, plans to extend Vietnam's influence to Indochina as a whole with the support of the Soviet Union. After the resumption of Sino US relations, the Soviet government promised to provide more assistance to Vietnam to induce Vietnam to participate in their anti China plan. The Le Duan government readily accepted, then tore up the China Vietnam border agreement and deployed heavy troops on the China Vietnam border to prepare for the invasion of Cambodia."

 USA_1978_DESC:0 "In 1978, James Earl Carter became the new president of the United States. The main challenge he faced was the economic crisis and revolution in the Middle East."

 ENG_1978_DESC:0 "In the late 1970s, the oil crisis, inflation, trade union strikes and the problems of Northern Ireland plagued the sunset empire. The Labor Party had lost its power, and the Conservative Party decided to win the re-election of the house of Commons in 1979. Margaret Thatcher, the leader of the conservative party, defied all opinions and announced that Keynesian economics marked by nationalization and high welfare had become unworkable in Britain, and Neoliberalism would become the goal of reform, but this reform obviously could not get everyone's support."

 PER_1978_DESC:0 "The White Revolution ended in failure, mass demonstrations broke out one after another, the Pahlavi Dynasty was crumbling, and Iran was about to change. While working to overthrow the king, various forces in Iran are also competing for the rule of the new government. The most powerful is Iran's Shiite leader, Ayatollah Khomeini. He has led the movement of Iran's Islamic forces against the king since the 1960s. He is also the most influential in the opposition. In addition, the Iranian people's party and the Iranian people's jihad are also actively participating in the political movement."

 IRQ_1978_DESC:0 "After several coups, the Arab Baath party gradually took over the power of Iraq. Saddam Hussein will go from behind the scenes to in front of the stage and become the ruler of Iraq this year. As an ambitious dictator, Saddam always wanted to establish a great Iraqi state. To the west, he was ready to develop nuclear weapons and go to war with Israel. To the East, neighboring Iran is in turmoil, which is a good opportunity for him to expand his territory."

 CAM_1978_DESC:0 "Killing, death, purge... Cambodia under Pol Pot's rule has established one of the most brutal and terrorist regimes in human history. The Khmer Rouge killed four million people during its four years of rule, turning Cambodia into a large slaughterhouse. In addition to the internal self slaughter, the Khmer Rouge continues to launch armed provocations on the Vietnam Cambodia border, which just gives Vietnam, which has long attempted to bring Cambodia into the sphere of influence."

 POL_1978_DESC:0 "After gomerka's death, Edward gelek took over as general secretary of the Polish United workers' Party and carried out economic reform. Gelek's reform has achieved certain results, Poland's productivity and consumer goods have been improved to a certain extent, and the political atmosphere has been relaxed, but this is based on the government's high taxes and high expenditure. Gelek's economic policy had a crisis in the late 1970s. If it could not be properly solved, the army would take over power."

 CHL_1978_DESC:0 "In September 1973, bombers roared over Santiago, and Chilean President Salvador Allende died in a coup, ending Chile's socialist regime and Chile's more than hundres years of democratic politics. Augusto Pinochet took over power and established a brutal military government. Countless leftists and Democrats were thrown into the sea by helicopter./n what is more terrible than military repression is that the Pinochet government adopted the Chicago school theory and implemented liberal policies and shock therapy on the Chilean economy. Neo liberal scholars believe that this has created an economic miracle in Chile, but the authenticity of this miracle is obviously questioned."

 ANG_1978_DESC:0 "In 1974, the carnation revolution broke out and the new state system that had ruled Portugal for nearly 50 years collapsed. After the establishment of the new government, it withdrew from the colonial war and all colonies such as Angola, Mozambique, Cape Verde and Guinea Bissau became independent. However, in Angola, the war is not over. South African troops continue to launch offensives on the border because of fears that Angolan communist guerrillas will enter Southwest Africa. In Angola, the Alliance for the full independence of Angola and the Angolan national liberation front, supported by the United States, Zaire and South Africa, fought against the pro Soviet Angolan people's movement. The civil war in Angola will continue for decades."

 ETH_1978_DESC:0 "1974年，海尔·塞拉西皇帝被军队推翻，在皇宫中被枕头闷死，海尔·门格斯图将军夺取政权，建立披着社会主义伪装的军阀统治。门格斯图政权不得人心，埃塞俄比亚全国到处都是分离主义运动，而在国家的东面，穆罕默德·巴雷统治下的索马里正蠢蠢欲动，谋求收复欧加登地区。"

 SML_1978_DESC:0 "1969年，穆罕默德·巴雷夺取索马里政权，与其他军阀不同的是，巴雷对内积极进行改革建设，对外亲近苏联获取援助，将索马里打造成为东非的地方强国。接下来是实现领土野心的时候了-邻国埃塞俄比亚动荡不安，巴雷决定一举收复欧加登地区。"

 CHI_1978_DESC:0 "1976年，蒋介石带着未能光复大陆的遗憾去世，其子蒋经国子承父业。讲究实用主义的蒋经国决定先建设台湾，将台湾的经济带动起来，才有与中共对抗的资本。毛泽东去世后，中华人民共和国新领导人发表《告台湾同胞书》，蒋经国应如何应对呢？"

 SYR_1978_DESC:0 "1970年，哈菲兹·阿萨德通过纠正运动，取得了叙利亚的政权。阿萨德的首要任务包括建设叙利亚，镇压反对派，使叙利亚拥有与以色列对抗的能力。而黎巴嫩内战的爆发，使阿萨德得到一个与以色列一教高下的机会。"

 ISR_1978_DESC:0 "巴勒斯坦解放组织被逐出约旦后，移师黎巴嫩，以黎巴嫩为基地继续向以色列发起袭击。巴解组织在黎巴嫩的壮大激化了当地族群矛盾，最终导致了黎巴嫩内战的爆发。以色列军队认为，这是一个大好时机，向黎巴嫩发动进攻，活捉阿拉法特，根除巴解组织，并在贝鲁特建立一个亲以政权。"

 KOR_1978_DESC:0 "自从妻子陆英修遇刺后，韩国总统朴正熙一蹶不振，长期抑郁。韩国国内的民主运动愈演愈烈，釜山地区爆发了前所未有的骚乱。朴正熙总统邀请情报部长金载桂、警护室长车智澈等赴宴商讨镇压问题，而这将成为改变大韩民国历史的一夜……"

 1984_NAME:0 "Reform 1984"
 1984_DESC:0 "Reform was the most common term in the political circles of various countries in the early 1980s. Facing the deteriorating economic situation after the oil crisis and inflation, Reagan and Thatcher ended the Keynesian economic system and chose neoliberalism. The Soviet Union, Poland and China will also carry out limited reforms in their own economic and political systems to ensure the continuation of the socialist regime.\n The 1980s was the peak of the cold war. After restoring the national strength of the United States, the Reagan administration implemented a push back policy to compete with the Soviet Union for global power. Chinese leader Deng Xiaoping chose to cooperate with the United States and join the NATO camp. The implementation of the Star Wars plan, the political turmoil in Poland, the western -81 exercise and the excellent shooter exercise filled both sides of the iron curtain with the smell of fire and medicine. The two camps fought in Europe, Afghanistan and Africa."

 POL_1984_DESC:0 "沃伊切赫·雅鲁泽尔斯基主导的军管结束了盖莱克下台之后的动荡，波兰进入管制状态，但不能阻止反共运动的发展。莱赫·瓦文萨领导的团结工会日益壮大。尽管雅鲁泽尔斯基宣称无意建立军事政权，但苏联警告：如果波兰当局无法镇压自由主义运动，那就由苏军来执行。"

 USA_1984_DESC:0 "通过里根主义的改革，美国逐渐从70年代末的挫折中恢复，现在是全面反击的时候了。通过回滚政策，美国在全球各地支持颠覆亲苏政权的行动，包括对波兰团结工会、阿富汗圣战者和尼加拉瓜孔特拉斯的支持。除了陆地上，里根政府还将在太空中发起战略武器防御计划，以星球大战的形式向苏联发起新一轮军备竞赛。"

 ENG_1984_DESC:0 "马岛战争的大获全胜，大大增加了玛格丽特·撒切尔的威信，但更大的难题还在后头。北京发来了就香港前途问题进行谈判的邀请，并表示不会放弃香港的主权与治权。私有化和削减福利的改革引发了工人大罢工，北爱尔兰问题仍然悬而未解。铁娘子将如何应对？"

 IRQ_1984_DESC:0 "伊朗与伊拉克之间的战争贯穿整个80年代，"

 PRC_1984_DESC:0 "邓小平主导的改革开放取得了成功，经济发展取得成效，也加速了市场经济和自由主义思想进入中国大陆的进程。这即推动了中国生产力的现代化，但也导致了物价上升、贪污腐败等恶劣影响。现在邓小平的任务是利用好改革开放带来的效果，实现四个现代化，以及收回中国第一个被侵占的殖民地——香港。"

 SOV_1984_DESC:0 "勃列日涅夫在统治了苏联近二十年后，于1982年去世，留下了体制僵硬的苏联政府和一群已是两鬓斑白的老人政治家。安德罗波夫接任后，立即着手开始改革，为苏联谋求变革和出路，但此时他也已经癌症缠身，其改革是否能够进行下去，还是未知数。"

 KOR_1984_DESC:0 "双十二政变后，全斗焕夺取韩国政权成为总统，为了稳定统治，他急需实行经济改革。3S政策、新自由主义的实行和基础设施建设为韩国带来了又一次经济起飞，超过了北朝鲜，随后全斗焕开始着手准备为汉城申办奥运会。但这一切并不能有效维护全斗焕政权的威望，更不能阻止民主运动的继续发展。"

 JAP_1984_DESC:0 "80年代初，日本经济飞速崛起，成为全球第二大经济体，日本资本疯狂扩张，日本商品充斥全球市场，并将很快取代美国成为世界第一大债权国。有了资本作为底牌，日本政府开始谋求政治和军事上的地位。日本首相中曾根康弘打破战后自卫队经费不得超过GNP的1%的戒律，开始了军事扩充，以期将日本打造为“不沉的航空母舰”，以对抗苏联的“东京急行”。日本与苏联在北方四岛问题上存在领土冲突，日本的扩军加剧了两国关系。苏联认为，如果日本的军事威胁加剧，就准备实行“攀登纳罗达峰”计划。"

 VIN_1984_DESC:0 "越南占领柬埔寨后，很快陷入了与中国、泰国长期的边境战争中，而苏联自身经济状况的恶化使其无法对越南进行积极的援助。面对不断恶化的国内经济，越共需要做出抉择，是否从柬埔寨撤军，以及是否开始自己的改革。"

 PHI_1984_DESC:0 "菲律宾总统费迪南德·马科斯及其妻子伊梅尔达·马科斯对菲律宾长达20年的统治摧毁了这个国家，使其从东南亚最富有的国家变成的亚洲最贫穷的国家之一。到了80年代，菲律宾民怨沸腾，要求马科斯下台的呼声与日俱增。流亡美国的菲律宾民主人士贝尼尼奥·阿基诺决定回国，与马科斯在1986年的总统大选中一较高下。"

 LBA_1984_DESC:0 "穆阿迈尔·卡扎菲在1969年夺权成为利比亚独裁者，作为狂热的阿拉伯民族主义者，他极端仇恨以色列和美国，并谋求成为阿拉伯国家和非洲的霸主。为此，他积极支持各种反对以色列和美国的恐怖组织，在全球发起针对美国的进攻。"
 
 1989_NAME:0 "End 1989"

 1989_DESC:0 "The failure of Gorbachev's reform led to the disintegration of the socialist camp. From East Germany, Poland to Beijing, people who have long complained about the Communist Party have taken to the streets, shouting slogans for freedom and democracy. The leaders of these countries must immediately decide whether to carry out political change, embrace the West, or adhere to the socialist path.\n\n... Or, let the whole world bury themselves for their final glory."

 ENG_1989_DESC:0 "Thatcher, who won the Massachusetts War, tried to make China succumb to the Hong Kong issue like Argentina, but she was wrong. After intense negotiations and a fall at the gate of the Great Hall of the People, the Iron Lady finally had to accept Deng Xiaoping's request. In 1984, China and Britain signed a joint declaration and agreed to transfer sovereignty to Hong Kong in 1997. Thatcher was not willing to do so. Now there is an opportunity to change Hong Kong's future. The Democratic Movement in Beijing,1989 used this opportunity to encourage Hong Kong citizens to confront the Chinese government and then force Deng Xiaoping to abandon Hong Kong..."

 ROM_1989_DESC:0 "In March 1989, six former leaders of the Communist Party of Rome issued an open letter to General Secretary Ceausescu of the Communist Party of Rome, criticizing his internal and external policies and calling for comprehensive reform. But he scorned it. After more than 20 years of rule in Romania, the rule of Nicolas Ceausescu and his wife is coming to an end. In power, although Ceausescu adjusted Romania's economic policy, created a revival of Romania's economy, and became a minority of the European Socialist Group countries not controlled by the Soviet Union, they did not make any political achievements, but engaged in personal worship and family politics, the anger of the Romanian people will be ignited, as a key person at a critical moment. Things, the key choice Ceausescu made is to choose political reform, lay down all his efforts, Or stick to the original policy and continue to rule autocratically..."

 PRC_1989_DESC:0 "In 1989, the People's Republic faced the greatest crisis since its establishment. Hu Yaobang, a former president who supported students in the 1986 Shanghai academic tide, died. Students from universities in Beijing gathered in Tiananmen to mourning President Hu, and asked the government to open up freedom of speech. Li Peng, Premier of the State Council, and People's Daily criticized students'practices, and then an unprecedented Student Movement broke out in Beijing. Hundreds of thousands of students from various universities in Beijing gathered in Tian'anmen Square to demand that the government put an end to personal worship and unlock freedom of speech and newspaper running. Deng Xiaoping clearly opposed the student movement, while Zhao Ziyang, then president of the state, tried to negotiate with the students, but failed. With more and more demonstrators in Tiananmen Square and almost chaos in China's capital, what should the central government do in the face of such catastrophe?"
