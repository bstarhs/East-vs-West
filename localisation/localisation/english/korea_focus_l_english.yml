 KOR_semaul:0 "Semaul"
 KOR_semaul_desc:0 "The Semaul(New Village) Movement is a rural reform movement initiated by the South Korean government in 1961. Its main content is to carry out infrastructure construction in rural areas, improve the living environment of rural populations, and end the backwardness of South Korea and promote urbanization."
