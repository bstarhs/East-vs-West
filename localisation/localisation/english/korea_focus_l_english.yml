 KOR_NewGovernment_desc:0 "The Korean nation has gained independence from Japan's colonial rule, and now we need to establish a government as soon as possible."
 KOR_AntiCommunist:0 "Anti Communism"
 KOR_NorthInvation:0 "War against the North"
 KOR_Rhee_Line:0 "Rhee line"
 KOR_Rhee_Line_desc:0 "The Lee Seong wan Line is the South Korean maritime border line designated by South Korean President Lee Seong wan, which includes large territorial waters around South Korea and disputed islands with Japan such as Dokdo. The delineation of this border line has to some extent increased Li Chengwan's prestige, but it has endangered relations with Japan and China."
 KOR_Military_goverment:0 "Militarist goverment"
 KOR_Jap_relation:0 "Establish relation with Japan"
 KOR_Ulsin_constitution:0 "Ulsin"
 KOR_Ulsin_constitution_desc:0 "Ulsin, meaning change or reform. The Ulsin Constitution refers to the 1972 Constitution of South Korea. In order to achieve indefinite re-election, Park Chung hee declared a state of emergency throughout the country that year, dissolved the parliament, and elected the president by the main National Unity Council. Park Chung hee thus became the de facto lifelong president."
 KOR_KCIA:0 "KCIA"
 KOR_Vietnam:0 "Send troop to Vietnam"
 KOR_Nationalism:0 "Korean Nationalism"
 KOR_Nationalism_desc:0 "During Park Chung hee's reign, in order to raise nationalist sentiment in South Korea and actively engage in development, the government instilled nationalist sentiment in the Koreans, encouraging them to become a cog in the economic miracle in order to revitalize the 5000 year old Korean nation."
 KOR_Seoul_spring:0 "Seoul spring"
 KOR_629deceration:0 "6·29 Deceration"
 KOR_629deceration_desc:0 "The June 29th Manifesto was issued in 1988 by Jeon Doo hwan's trusted presidential candidate, Roh Tae woo, against the backdrop of the democratic movement sweeping South Korea. The declaration promises to hold fair elections and promote democratization in South Korea, marking the end of the military government's rule over South Korea."
