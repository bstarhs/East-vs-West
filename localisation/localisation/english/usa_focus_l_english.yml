 Latin_Ameria:0 "Good-neighborliness policy"
 Latin_Ameria_desc:0 "The Good Neighbor Policy was a foreign policy aimed at Latin America proposed by US President Franklin Roosevelt in 1933, which aimed to ensure that Latin American countries did not interfere in their internal affairs and did not engage in pro Axis or communist activities. After the outbreak of World War II, the US changed its Good Neighbor Policy to ensure that Latin American countries joined the Allied forces. Argentina was sanctioned by the United States due to its pro German neutrality during World War II. After World War II, the neighborly policy and Monroe Doctrine became the two core elements of American Latin American policy."
