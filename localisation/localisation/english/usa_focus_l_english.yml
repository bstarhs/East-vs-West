 Defence_Taiwan:0 "Defence Taiwan"
 Defence_Taiwan_desc:0 "台湾已成为我们对抗亚洲共产主义的第一线，我们必须为台湾提供包括武装部队在内的更多军事支持，以抵抗中共的进攻。"
 us_sigital_war:0 "Digital warfare"
 us_sigital_war_desc:0 "计算机的出现改变了现代战争，它不仅广泛运用到人民的生活中，而且也广泛运用到军事上。计算机可以使得复杂的坦克、飞机和军舰操作变得简单，可以帮助计算炮弹的弹道，可以更好地处理甚至获取情报……一支数字化的军队将让我们有能力打一场21世纪的战争。"
 us_mechanized:0 "Develop Mechanized"
 us_mechanized_desc:0 "许多在二战时期出现的各种军事发明，在二战后被运用到实战中，例如直升机、导弹、复合装甲、机械化车辆以及合成材料制作的装备等。军事科技是不断发展的，如果我们在军事研究上停滞不前，就随时可能落后。"
