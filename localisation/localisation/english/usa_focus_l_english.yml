 USA_Nuclear:0 "Nuclear technology"
 USA_Atom_Peace:0 "Atomic for peace"
 USA_Atom_Peace_desc:0 "Atomic for peace is a nuclear energy policy proposed by US President Eisenhower. Against the backdrop of nuclear deterrence worldwide, the Eisenhower administration proposed the peaceful use of atomic energy for nuclear power generation, manufacturing of nuclear powered ships, and more. Under this policy guidance, nuclear technology in the United States rapidly developed in the late 1950s, with the construction of nuclear power plants, the manufacture of nuclear powered transport ships, and the emergence of plans to use radiation energy for medical treatment or agricultural transformation. The United States also planned to provide nuclear technology to its allies."
 USA_OperationPlowshare:0 "Ploughshare Operation"
 USA_OperationPlowshare_desc:0 "The Ploughshare Program was a series of nuclear tests conducted by the US government in the 1950s and 1960s for peaceful purposes, including testing the role of nuclear explosions in mountaineering, canal construction, or port construction."
 USA_super_carrier:0 "Supercarrier"
 USA_super_carrier_desc:0 "The United States completed three such aircraft carriers. However, the true super aircraft carrier was a nuclear powered aircraft carrier built by the United States and the Soviet Union during the Cold War. The Nimitz class aircraft carrier of the United States changed fuel rods every 20 to 25 years, almost equivalent to a floating city at sea. It was driven by two nuclear reactors, carried over 5000 crew and crew members, carried 85 to 90 aircraft and helicopters, and had a displacement of 100000 to 104000 tons. This does not include missiles carried on board."
