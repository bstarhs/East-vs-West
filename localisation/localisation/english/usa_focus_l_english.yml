 Middle_east_exist_desc:0 "Carter doctrine is the foreign policy put forward by US President James Earl Carter in his state of the Union address on January 23, 1980. The content is that the United States will use force against the Persian Gulf region when necessary to protect its national interests, as a response to Soviet Union's invasion of Afghanistan and its attempt to expand its sphere of influence to the Gulf region. After the policy was put forward, the United States established the rapid deployment joint mission force (later renamed the central command) as the command organization of the U.S. military forces in the Persian Gulf and the Indian Ocean, and led the subsequent Desert Storm operation."
