 roc.1.t:0 "Conquering Yan'an"
 roc.1.d:0 "After a few days of fighting, the Communist army was forced to withdraw from Yan'an, and the national army entered Yan'an, the most important base of the Communist Party, without bloodshed. Chairman Jiang then visited Yan'an in person, which greatly boosted the morale of the front line."

 roc.1.t:0 "Conquer Peiping"
 roc.1.d:0 "After days of fighting, the national army entered Peiping, the capital of the People's Republic of China. Although the resistance of the Communist army was extremely fierce and tenacious, and even suicide attacks appeared, the lack of equipment of the Communist army was under the superior firepower of the national army. Continuing to retreat, the national army finally invaded "Beijing". Before the national army entered the Forbidden City, all the top Communist Party leaders fled to Shenyang/Moscow by plane."
 
 roc.1.t:0 "Conquer Tower Mountain"
 roc.1.d:0 "In order to relieve Jinzhou's predicament, Chairman Jiang urgently ordered the East Advance Corps commanded by Hou Jingru and the West Advance Corps led by Liao Yaoxiang to storm Tashan from October 10th to 15th. Successfully captured Tashan. The frontline news said that thanks to a soldier's report of the situation in Tashan, Hou and Liao gave up their contempt and carried out a three-hour artillery bombardment on Tashan."
 
 roc.1.t:0 "Chiang Kai-shek was elected President of the Republic of China"

 roc.6.t:0 "Anti-Communist National Salvation Army Retreat"
 roc.6.d:0 "After fierce fighting, the Kuomintang anti-Communist National Salvation Army that invaded the border of Yunnan was repelled by the PLA, and some pro-KMT armed forces lurking in Yunnan were also eliminated by the PLA."
 roc.6.a:0 "A tense battle."
 
 roc.1.t:0 "Li Zongren was elected President of the Republic of China"
 
 roc.1.t:0 "The National Government moved the capital"
 
 roc.8.t:0 "Chiang Kai-shek joins the Communist Party"
 roc.8.d:0 "After talking with CCP members, the Kuomintang leader Chiang Kai-shek finally came to his senses and deeply realized his mistake in starting the civil war. Chiang decided to reform his past mistakes, join the Chinese Communist Party, and transform the Republic of China. To become a socialist country. In order to express a complete break with the past, he changed his name to "Chang Kaishen"."
 
 roc.12.t:0 "Chinese People's Liberation Army Occupies Mainland China"
 roc.12.d:0 "After the fall of Nanjing, the President of the Republic of China, Chiang Kai-shek, fled to Chongqing, Kunming, Guangzhou, and finally settled in Taipei, Taiwan. The war situation in mainland China is already very obvious. Except for some coastal islands, the Chinese People's Liberation Army led by the CCP Has controlled most of the mainland. Chiang Kai-shek looks very lost, but he still believes that if Taiwan is used as the last base, the counterattack on the mainland will one day be realized. /n With the CCP army occupying Guangzhou, Kunming and Dihua, The entire mainland has fallen under the rule of the Chinese Communist Party. Mao Zedong has announced the establishment of the People's Republic of China in Beijing, and now, how to manage this new country well and remove the remaining Kuomintang forces has become a problem that he needs to consider."
 
 roc.13.t:0 "金门炮战"
 
 roc.15.t:0 "Civil unrest in Taiwan"
 
 roc.16.t:0 "General Resignation of Taiwan Provincial Government"
 roc.16.d:0 "In Taiwan under the control of the Republic of China, police-citizen clashes broke out. A vendor was beaten to death by the police, triggering mass riots. The ROC government quickly intervened, sending an investigation team to Taipei to quell the furor. Nanjing finally decided to place the blame on the Taiwan Provincial Government under Chen Yi, forcing Chen Yi and others to resign, organize a new provincial government, release political prisoners, and make a series of promises before quelling public dissatisfaction."
 
 roc.17.t:0 "Chinese troops suppress uprising in Taiwan"
 roc.17.d:0 "In Taiwan under the control of the Republic of China, police-citizen clashes broke out. A vendor was beaten to death by the police, triggering mass riots. The government of the Republic of China quickly intervened and sent troops to Taiwan to carry out violent suppression. The military's indiscriminate attacks caused serious casualties and a large number of Taiwanese politicians were arrested."
 
 roc.20.t:0 "Regulations on Purging Bandits and Spies"
 roc.20.d:0 "In order to combat the increasingly serious infiltration of CCP forces in Taiwan, the Republic of China promulgated regulations on the purge of gangsters and espionage, encouraging the public to report anyone related to the Chinese Communist Party."
 roc.20.a:0 "The situation in Taiwan has become complex."
 
 roc.21.t:0 "Taiwan Security Command is established"
 roc.21.d:0 "After the February 28th Incident, the Taiwanese people's resistance to the Chinese Kuomintang regime became increasingly serious, and the government established the Taiwan Security Command to use military and police to suppress it."
 
 roc.22.t:0 "Taiwan Nantou riots"
 roc.22.d:0 "The suppression of the February 28th Incident led to large-scale mass riots in Taiwan. A mass riot called the February 7th Unit broke out in Nantou County, and its leaders were supported by the Communist Party of China."
 
 roc.23.t:0 "The 27th Army Uprising"
 roc.23.d:0 "The 27th Unit led by the Taiwan Communist Party expanded rapidly. After defeating the Kuomintang's suppressive forces, it began to attack Kaohsiung, Tainan and other cities. Xie Xuehong announced the establishment of the Taiwan People's Liberation Army to cooperate with the Chinese Communist Party to fight against the Chinese Kuomintang regime that rules Taiwan."
 
 roc.24.t:0 "Kuomintang troops suppressed in Tainan"
 roc.24.d:0 "The riots caused by the February 28th Incident gradually declined under the violent suppression of the Chinese Kuomintang troops."
 
 roc.26.t:0 "Taiwan Provincial Special Government is established"
 roc.26.d:0 "After the February 28th Incident, the reputation of the Chinese Kuomintang government in Taiwan was severely damaged. Chiang Kai-shek was forced to dissolve the Taiwan Provincial Government and appointed Chen Cheng to Taiwan to form a new special government. After Chen Cheng arrived in Taiwan, he successfully stabilized the situation and was recognized by most Taiwanese people. This also allowed Chen Cheng to obtain huge autonomy powers in Taiwan."
 
 roc.1.t:0 "美国援助"
 
 roc.27.t:0 "The government of the Republic of China moved to Canton"
 roc.27.d:0 "As Nanking was occupied by the Chinese Communists, a series of military and political agencies of the Republic of China government moved south to the southern city of Canton."
 
 roc.28.t:0 "The government of the Republic of China moves to Taipei"
 roc.28.d:0 "With the complete collapse of the Chinese Kuomintang army in mainland China, cities such as Canton and Chungking were in emergency, and the government agencies and remaining troops of the Kuomintang government evacuated to Taiwan."
 
