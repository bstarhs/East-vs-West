 roc.50.t:0 "Purge Order of Foreigners"
 roc.50.d:0 "The new President of the Republic of Taiwan, Zheng Nanrong, delivered a televised speech in Taipei, announcing that the first task after the founding of Taiwan is to eliminate the Chinese who have been intimidating the Taiwanese for a long time, and to repeat the 228, With the release of martial law, the Taiwan National Defense Forces, which have been completely controlled by Taiwanese natives, began to arrest former Chinese Kuomintang members. According to the news sent by the reporters ahead, more than 5,000 Kuomintang members and their families have been arrested by the army. Fang was arrested, and gunshots were heard from time to time on the streets of Taiwan. According to the plan of the Zheng Nanrong government, the Republic of Taiwan will exterminate the "Tangshanzai" on the island within 2 years."
 roc.50.a:0 "The Imperial Army gave me the spirit of Yamato and killed all the Chinese dolphins in the world"