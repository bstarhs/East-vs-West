l_english:
 cub.4.t:0 "古巴革命军进入哈瓦那！"
 cub.4.d:0 "昨天上午，由菲德尔·卡斯特罗和切·格瓦拉领导的古巴革命武装部队进入首都哈瓦那，独裁者巴蒂斯特逃离总统府前往美国。市民们在街道两旁欢迎革命军的胜利。卡斯特罗和其他革命领导人宣布在总统府前成立新的革命临时政府，古巴将迎来自由。显然，这场革命激怒了美国人，中央情报局已经计划推翻古巴新政府。"
 cub.4.a:0 "自由古巴万岁！！"
 
 cub.3.t:0 "古巴革命军在东南部登陆"
 cub.3.d:0 "以菲德尔·卡斯特罗和切·格瓦拉为首的古巴革命军乘坐“格拉马”号游轮在古巴东南海岸登陆。尽管被当地驻军封锁，但登陆的革命军冲破封锁，进入了古巴南部的马埃斯特拉山脉。革命军将在这里建立一个基地，补给并准备发动一场革命，推翻巴蒂斯塔政府。"
 cub.3.a:0 "自由古巴万岁！！"
 
 cub.5.t:0 "古巴需要帮助"
 cub.5.d:0 "美帝国主义入侵古巴的猪湾事件震惊了世界。面对美国帝国主义侵略的威胁，古巴领导人菲德尔·卡斯特罗请求我们的支持。我们的军事顾问认为，必须在古巴部署一定数量的弹道导弹，以对美国大陆构成威胁，这也是为了实现美国在土耳其部署导弹的平衡。"
 cub.5.a:0 "自由古巴万岁！！"
 
 cub.6.t:0 "苏联的支持"
 cub.6.d:0 "莫斯科同意了我们的要求，他们将秘密向我国运送弹道导弹，我国已经对美国形成了威慑。"
 cub.6.a:0 "自由古巴万岁！！"
 
 cub.10.t:0 "苏联导弹基地出现在古巴！"
 cub.10.d:0 "我们派往古巴的U2侦察机发现了重要信息！苏联正在秘密向古巴运送大量弹道导弹，并建立了发射基地。据我们的军事部门估计，这些导弹将覆盖美国东海岸的每一个城市/n情报将在联合国大会上公布，以了解俄国人对此的反应。"
 cub.10.a:0 "自由古巴万岁！！"
 
 cub.11.t:0 "美国宣布封锁古巴！"
 cub.11.d:0 "美国总统[USA.GetLeaer]宣布，美国军方已决定封锁古巴，以防止苏联继续向古巴派遣战略导弹武器，全军已进入二级警戒状态。苏联声称此举是为了阻止美国入侵古巴。目前，两国处于对峙状态，随时都有可能爆发全球性的热战。"
 cub.11.a:0 "自由古巴万岁！！"
 
 cub.12.t:0 "苏联战舰试图进入古巴"
 cub.12.d:0 "我们在前往古巴东北部港口的途中发现一支苏联舰队，可能携带战略武器。我们该怎么办？"
 cub.12.a:0 "Let them pass,no one want a war"
 cub.12.b:0 "Stop them！"
 
 cub.13.t:0 "我们的舰队被美军拦截"
 cub.13.d:0 "我们派往古巴的舰队被美军拦截，他们已经启动了武器。我们该怎么办？"
 cub.13.a:0 "Call back the fleet and avoid war."
 cub.13.b:0 "rush over."
 
 cub.14.t:0 "核战争危机结束了！"
 cub.14.d:0 "在紧张的对峙之后，苏联最终选择从古巴撤军。核战争危机已经结束。"
 
 cub.15.t:0 "Soviet Union missile base appears in Cuba!"
 cub.15.d:0 "The U2 reconnaissance plane sent by the United States to Cuba found important intelligence! The Soviet Union is secretly sending large quantities of ballistic missiles to Cuba and has established launch bases. /nThe intelligence was released at the United Nations General Assembly, where U.S. Representative Adlai Stevenson strongly condemned the threat posed by the Soviet Union to stability in the Western Hemisphere. /n "Ambassador Zorin, do you not acknowledge that the Soviet Union has and is still deploying long-range missiles and missile bases in Cuba? Is it or is it not? - Don't wait for translation - is it or is it not?""
 cub.15.a:0 "自由古巴万岁！！"