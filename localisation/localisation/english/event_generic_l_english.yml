l_english:
 gen.1.t:0 "US-Soviet Summit"
 gen.1.d:0 "The [From.GetName] leader [From.GetLeader] has invited us to Vienna for talks on international affairs and future US-Soviet relations."
 gen.1.a:0 "We accept."
 gen.1.b:0 "Rejected."
 
 gen.2.t:0 "US-Soviet Summit"
 gen.2.d:0 "The President of the United States [USA.GetLeader] held a summit with the Leader of the Soviet Union [SOV.GetLeader] in Vienna."
 gen.2.a:0 "Good."
 
 gen.3.t:0 "[From.GetName] declined our invitation"
 gen.3.d:0 "The [From.GetLeader] has declined our invitation to a summit of leaders, it seems they have no interest in world peace."
 gen.3.a:0 "Well."
 
 gen.4.t:0 "Operations to Suppress Rebels"
 gen.4.d:0 "Our army searched and destroyed the rebel bases and troops with good results, some of the rebels have been routed and retreated to the jungle, they will not be for a long time appeared again."
 gen.4.a:0 "Good."
 
 gen.5.t:0 "Failed to suppress the rebels!"
 gen.5.d:0 "Our troops launched a search operation and attacked the rebels, but they failed! The rebels defeated our troops and seized many weapons!"
 gen.5.a:0 "Bad news."
 
 gen.6.t:0 "The rebels appear!"
 gen.6.d:0 "An armed rebellion by some liberals! They raided the arsenal, seized the guns, and declared that a war against our government has begun!"
 gen.6.a:0 "Destroy them!"
 
 gen.7.t:0 "Rebels appear!"
 gen.7.d:0 "An armed rebellion by some Communisms! They raided the arsenal, seized the guns, and declared that a war against our government has begun!"
 gen.7.a:0 "Destroy them!"
 
 gen.8.t:0 "Our country is powerless to support war"
 gen.8.d:0 "After a long war, our national strength has been overdrawn, our economy can no longer support this war, and our people have complained."
 gen.8.a:0 "We have to get out of the war."
 
 gen.9.t:0 "[From.GetName] ask us for peace"
 gen.9.d:0 "The leaders of the [From.GetName] have sent us a message that their country has been overdrawn by war and wish to end this dispute."
 gen.9.a:0 "We accept peace."
 gen.9.b:0 "We do not accept begging."
 
 gen.13.t:0 "Muslim parade!"
 gen.13.d:0 "Muslim conservatives and ulemas staged demonstrations against protests against Islamic teachings."
 gen.13.a:0 "Stop the march and arrest the leader."
 gen.13.b:0 "Acquiesce to march."
 
 gen.14.t:0 "Muslim protest!"
 gen.14.d:0 "Muslim conservatives and ulemas have issued an open letter to the government, accusing the reforms of our country against the teachings of Islam.Muslims demand that the government stop the radical reforms, or they will resist."
 gen.14.a:0 "Unlucky."
 
 gen.15.t:0 "We have the atomic bomb!"
 gen.15.d:0 "After years of research and development, our country has successfully possessed the atomic bomb! This will be the greatest day in the history of our nation, it will mark our country as a world power to deter our enemies , has a greater voice in the international arena."
 gen.15.a:0 "Excellent."
 
 gen.16.t:0 "Are we in the world war?"
 gen.16.d:0 "The socialist camp headed by the Soviet Union has gone to war against Western imperialism and World War III has broken out.As a member of the socialist camp, are we going to join the war?"
 gen.16.a:0 "Join the socialist front and defeat Western imperialism."
 gen.16.b:0 "Remain neutral."
 
 gen.17.t:0 "Are we in the world war?"
 gen.17.d:0 "The free world, led by the United States, has gone to war on Communism, and World War III has broken out.As members of the free world, do we join the war?"
 gen.17.a:0 "Join the free world and defeat the tyranny of Communism."
 gen.17.b:0 "Remain neutral."
 
 gen.22.t:0 "[From.GetName] achieves democratic transition"
 gen.22.d:0 "The leaders of [From.GetName] held a roundtable with the opposition for a dialogue on the country's future path.The [From.GetName] Communist Party finally decided to abandon one-party dictatorship, achieve political pluralism, and Preparing for parliamentary elections./n Currently the Communist Party is still in power, but the opposition has gained legal rights and the right to vote.If the Communist Party still gets more than 40% support in future parliamentary elections, they will remain in power."
 gen.22.a:0 "An era is over."
 
 gen.23.t:0 "The [From.GetName] election is over"
 gen.23.d:0 "Despite the democratic transition, the [From.GetName] Communist government still has a strong support rate.In the first democratic election, the [From.GetName] Communist Party was reorganized into the Social Democratic Party, Win the election and stay in power."
 gen.23.a:0 "An era is over."
 
 gen.24.t:0 "The [From.GetName] election is over"
 gen.24.d:0 "As expected, the [From.GetName] Communist Party lost the election and the Opposition won the election to form a new government.The [From.GetName]'s decades-long Communist era has come to an end ."
 gen.24.a:0 "An era is over."
 
 gen.25.t:0 "Opposition protests"
 gen.25.d:0 "Although the [From.GetName] Communist Party wins"
 
 gen.28.t:0 "Rebels defeated!"
 gen.28.d:0 "A rebel army attacked our garrison! Our army responded quickly.After a fierce battle, the rebels fled with dozens of corpses.stronghold."
 
 gen.27.t:0 "We are attacked by rebels!"
 gen.27.d:0 "A rebel army attacked our garrison! Our army responded quickly, and after fierce fighting, our troops were unable to withstand it and were forced to withdraw, and the weapons in the garrison were robbed by the rebels."
 
 gen.31.t:0 "Leader's Speech"
 gen.31.d:0 "You are about to deliver an important speech as the leader of the party and state, and you intend to:"
 gen.31.a:0 "Praise the working class."
 gen.31.b:0 "Praise the People's Army."
 
 gen.32.t:0 "Communist rebels disappear."
 gen.32.d:0 "Under our vigorous suppression, the armed forces of the Communist Party's rebellion have been greatly weakened.Many rebels have either been eliminated or surrendered to us.The rebellion can no longer pose a threat to us."
 gen.32.a:0 "Good luck."
 
 gen.33.t:0 "Muslim rebels disappear."
 gen.33.d:0 "Under our vigorous suppression, the armed strength of the Muslim rebellion has been greatly weakened.Many rebels have either been eliminated or surrendered to us.The rebellion can no longer pose a threat to us."
 gen.33.a:0 "Good luck."
 
 gen.34.t:0 "[FROM.GetName] asks for our protection."
 gen.34.d:0 "[FROM.GetName] has proposed to us a military cooperation agreement to garrison their territory against the Communism threat."
 gen.34.a:0 "It is our responsibility."
 
 gen.35.t:0 "[FROM.GetName] gained independence."
 gen.35.d:0 "After centuries of imperial colonial rule, [FROM.GetName] finally achieved national independence today.[FROM.GetName] President [FROM.LeaderName] took the oath at his inauguration today , he will lead his country to a bright future."
 gen.35.a:0 "The era of colonial empires is falling apart."
 
 gen.36.t:0 "[FROM.GetName] establish a socialist government!"
 gen.36.d:0 "After a series of intense power struggles, the [FROM.GetName] Communist Party finally gained the right to the country and declared the establishment of the [FROM.GetName] socialist regime."
 gen.36.a:0 "A new era"
 
 gen.36.t:0 "[FROM.GetName] establish a socialist government!"
 gen.37.d:0 "[FROM.GetName] Tactical Nuke."
 gen.36.a:0 "A new era"
 
 gen.38.t:0 "[FROM.GetName] started TV news"
 gen.38.d:0 "[FROM.GetName]'s state-run TV station has started broadcasting news on TV, providing a new channel for the masses to obtain news information and for the government's political propaganda."
 gen.38.a:0 "A new era"
 
 gen.39.t:0 "[FROM.GetName] joins the Non-Aligned Movement"
 gen.39.d:0 "[FROM.GetName] announced that it will join the Non-Aligned Movement and become a member of the Non-Aligned Movement.The government believes that in the international environment where the United States and the Soviet Union are competing for hegemony, it is a reasonable decision to remain neutral.."
 gen.39.a:0 "OK."
 
 gen.40.t:0 "[FROM.GetName] seeks engagement with the United States"
 gen.40.d:0 "[FROM.GetName] leaders said in a speech today that their government is seeking to build a good relationship with the United States to jointly confront the "challenge"."
 gen.40.a:0 "Where does this take [FROM.GetName]?"
 
 gen.41.t:0 "[FROM.GetName] seeks contact with the socialist camp"
 gen.41.d:0 "The leader of [FROM.GetName] said in a speech today that the country's government is seeking to establish good relations with the socialist camp to jointly confront "challenges"."
 gen.41.a:0 "Where does this take [FROM.GetName]?"
 
 gen.42.t:0 "[FROM.GetName] Announces Joining the CME"
 gen.42.d:0 "The government of [FROM.GetName] has announced that it will become a member of the Council of Mutual Economic Assistance from now on, in order to obtain more economic cooperation and assistance from the socialist camp."
 gen.42.a:0 "Where does this take [FROM.GetName]?"
 
 gen.43.t:0 "[FROM.GetName] signs cooperation agreement with China"
 gen.43.d:0 "The [FROM.GetName] government today signed a series of cooperation agreements with the People's Republic of China, further strengthening relations with Beijing."
 gen.43.a:0 "Where does this take [FROM.GetName]?"
 
 gen.44.t:0 "[FROM.GetLeader]'s biography published"
 gen.44.d:0 "Since [FROM.GetLeader] became the general secretary of the Communist Party of [FROM.GetName], he has resumed various personal cult activities.By accepting medals, filming films, etc., he has created a publicity for himself.A personal cult style.\nRecently, [FROM.GetLeader] published a new personal biography, to which the general secretary said: "I heard that everyone said that my autobiography was well written, so I bought a copy and read it that day.."
 gen.44.a:0 "General secretary is humor"
 
 gen.45.t:0 "[FROM.GetName] conducts a major purge"
 gen.45.d:0 "[FROM.GetName] launched a purge today against the army and the government to purge the "anti-Party conspirators" in the party, government and army.Seizing power and being arrested or executed."
 gen.45.a:0 "Where does this take [FROM.GetName]?"
 
 gen.46.t:0 "Humane Socialism"
 gen.46.d:0 "[FROM.GetName] Communist Party General Secretary [FROM.GetLeader] delivered a report at today's work conference, advocating reforming the existing political system, removing ills, rectifying corruption, strengthening democracy, Achieving 'Humane Socialism'.This report is considered the beginning of an impending political renewal for [FROM.GetName]."
 gen.46.a:0 "Where does this take [FROM.GetName]?"
 
 gen.47.t:0 "[FROM.GetName] requesting assistance"
 gen.47.d:0 "[FROM.GetName] sent us a message, hoping we"
 gen.48.t:0 "[FROM.GetName] has requested to join NATO"
 gen.48.d:0 "[FROM.GetName] has sent us a message to join the North Atlantic Treaty and become a member of NATO to counter the threat of the Soviet Union."
 gen.48.a:0 "Assistance should be given"
 
 gen.49.t:0 "The United States has denied our request"
 gen.49.d:0 "The United States rejected our request to join NATO, they do not consider us part of the free world."
 gen.49.a:0 "Assistance should be given"
 
 gen.50.t:0 "[ROOT.GetName] joins NATO"
 gen.50.d:0 "[ROOT.GetName] joins the North Atlantic Treaty and becomes a member of the European free world under the protection of the United States."
 gen.50.a:0 "Assistance should be given"
 
 gen.51.t:0 "[FROM.GetName] announces suppression of the Communist Party"
 gen.51.d:0 "The [FROM.GetName] government issued an order yesterday, declaring that the existence of Communism has posed a threat to the country, and that all Communism and left-wing groups will be forcibly disbanded with immediate effect.Today, the country's military police forcibly disbanded the Communist Party and other left-wing groups The headquarters of the group, and a large number of social activists have been arrested."
 gen.51.a:0 "Where does this take [FROM.GetName]？"
 
 gen.52.t:0 "[FROM.GetName] implement educational reform"
 gen.52.d:0 "The government of [FROM.GetName] issued an order yesterday, announcing that the influence of religion in education will be completely removed, that religious content will not be added to teaching, and that religious people will be excluded from the education system."
 gen.52.a:0 "Confirm."
 
 gen.53.t:0 "Muslim demonstrations"
 gen.53.d:0 "Some conservative Muslim religious leaders launched a demonstration in the parliament building to protest some recent government reform measures.Religious leaders believe that the government's measures run counter to the will of the Koran and the interests of Muslims, accusing reform supporting officials of colluding with foreign countries."
 gen.53.a:0 "They are so fool."
 
 gen.54.t:0 "[FROM.GetName] implement new reform"
 gen.54.d:0 "The government of [FROM.GetName] passed a new bill to give women full equal legal status with men.Traditionally, prejudice against women has been eliminated from the law, and women have equal rights to marriage, divorce and property inheritance between women and men.This decision triggered the dissatisfaction of conservative religious forces."
 gen.54.a:0 "Confirm."
 
 gen.55.t:0 "[FROM.GetName] announce the crackdown on religious forces."
 gen.55.d:0 "The government of [FROM.GetName] issued a new order and began to implement a strict policy of suppressing religion.They accused religion of being a feudal remnant of barbarism and backwardness and an obstacle to the country's modernization.Religious churches were forcibly dissolved, many priests were arrested and imprisoned, and a large number of believers fled abroad."
 gen.55.a:0 "Confirm."
 
 gen.56.t:0 "Rebbels!"
 gen.56.d:0 "Some Islamic extremists launched an armed rebellion! They attacked the arsenal, seized guns and declared that a war against our government had begun!"
 gen.56.a:0 "Weep them!"
 
 gen.57.t:0 "[FROM.GetName]提议签订《战略武器裁减协议》"
 gen.57.d:0 "随着世界局势不断紧张恶化，[FROM.GetName]政府呼吁签订《战略武器裁减协议》"
 gen.57.a:0 "这是好的。"
 
 gen.58.t:0 "Strategic Arms Reduction Agreement"
 gen.58.d:0 "The governments of the United States and the Soviet Union signed the Strategic Arms Reduction Agreement to reduce nuclear weapons inventories and alleviate world tensions."
 gen.58.a:0 "Goods"
 
 gen.59.t:0 "The royalists launched a rebellion！"
 gen.59.d:0 "The royalists launched a rebellion！"
 
 gen.60.t:0 "The rebels refused to negotiate！"
 
 gen.61.t:0 "The rebels offered conditions！"
 
 gen.62.t:0 "The rebels lay down their weapons！"
 
 gen.63.t:0 "The monarchist movement is reviving in [FROM.GetName]!"
 gen.63.d:0 "Due to the chaotic government of [FROM.GetName], the public became increasingly disappointed with the existing system, and various political movements began to develop, including political parties calling for the abolition of the republican system and the reconstruction of the monarchy, which have also risen in recent years."
 
 gen.64.t:0 "[FROM.GetName]宇航局成立！"
 gen.64.d:0 "[FROM.GetName]政府宣布成立宇航局，以发展太空探索事业。"
 
 gen.65.t:0 "[FROM.GetName] announce land reform!"
 gen.65.d:0 "[FROM.GetName] has issued a new land bill to carry out land reform.The new bill will redeem some of the land occupied by landlords, plantation owners, and large enterprises, and distribute it to farmers to alleviate social conflicts."
 
 gen.66.t:0 "Rural population influx into cities"
 gen.66.d:0 "Since the implementation of land reform in our country, many rural residents have been allocated land.However, owning land means taking responsibility for their own profits and losses.Many farmers who obtain land do not know how to operate it, unable to pay costs, purchase agricultural tools, or cultivate it themselves, ultimately choosing to give up their land.Many farmers who give up their farmland choose to work in cities."
 
 gen.67.t:0 "Discontent from plantation owners"
 gen.67.d:0 "Members of parliament and political parties representing the interests of large plantations have challenged the government in parliament, accusing the ongoing land reform of threatening their interests and demanding the suspension of land reform."
 
 gen.68.t:0 "The land reform in [FROM.GetName] has triggered political conflicts"
 gen.68.d:0 "The land reform carried out by the [FROM.GetName] government poses a threat to the interests of its domestic plantation owners, as well as to the interests of the United Fruit Company. Members of the United Fruit in both houses of Congress are trying to lobby the US government to intervene."
 
 gen.69.t:0 "[FROM.GetName] government announces democratization"
 gen.69.d:0 "[FROM.GetName] government leaders delivered an important speech announcing that the country has decided to initiate a democratization process, end the long-term rule of [FROM. GetRulingParty], and hold democratic elections at the appropriate time."
 
 gen.80.t:0 "[FROM.GetName] hopes to improve relationship with [ROOT.GetName]"
 gen.80.d:0 "[FROM.GetLeader] expressed his desire to establish a friendly relationship with [ROOT.GetName]."
 gen.80.a:0 "OK."
 
 gen.81.t:0 "[FROM.GetName] announces support for the struggle of [ROOT. GetName]"
 gen.81.d:0 "The leader of [FROM.GetName] announced that the country will firmly support the people of [ROOT.GetName] in their struggle against imperialism and its puppet regime."
 gen.81.a:0 "OK."
 
 gen.82.t:0 "[FROM.GetName] announces an election"
 gen.82.d:0 "[FROM.GetName] has announced that the country is about to hold elections, which may result in party rotation."
 gen.82.a:0 "OK."
 
 gen.83.t:0 "Election in [FROM.GetName]"
 gen.83.d:0 "Election in [FROM.GetName] end,Due to the low support of most opposition groups, [FROM.GetRulingParty] was able to continue organizing the government."
 gen.83.a:0 "OK."
 
 gen.84.t:0 "Election in [FROM.GetName]"
 gen.84.d:0 "Election in [FROM.GetName] end,the party advocating liberalization and democratization has won and announced the formation of a new government!"
 gen.84.a:0 "OK."
 
 gen.85.t:0 "Election in [FROM.GetName]"
 gen.85.d:0 "Election in [FROM.GetName] end,advocating for liberalization and democratization, [FROM.GetRulingParty] won, [FROM.GetLeader] announced his inauguration and organized a new government!"
 gen.85.a:0 "OK."
 
 gen.86.t:0 "Election in [FROM.GetName]"
 gen.86.d:0 "Election in [FROM.GetName] end,the party advocating the socialist left-wing line has won and announced the formation of a new government!"
 gen.87.a:0 "OK."
 
 gen.87.t:0 "Election in [FROM.GetName]"
 gen.87.d:0 "Election in [FROM.GetName] end, the socialist left-wing line [FROM.GetRulingParty] has won，[FROM. GetLeader] announces inauguration and organizes a new government!"
 gen.87.a:0 "OK."
 
 gen.88.t:0 "Election in [FROM.GetName]"
 gen.88.d:0 "Election in [FROM.GetName] end,The right-wing conservative party has won and announced the formation of a new government!"
 gen.88.a:0 "OK."
 
 gen.89.t:0 "Election in [FROM.GetName]"
 gen.89.d:0 "Election in [FROM.GetName] end,The right-wing [FROM.GetRulingParty] has won,[FROM. GetLeader] announces inauguration and organizes a new government!"
 gen.89.a:0 "OK."
 
 gen.90.t:0 "[FROM.GetName] announce support for [ROOT.GetName] government"
 gen.90.d:0 "[FROM.GetName] announced that the country will firmly support the military actions of the [ROOT.GetName] government against communism and anarchism."
 gen.90.a:0 "OK."
 
 gen.91.t:0 "[FROM.GetName] announce the promotion of social reform"
 gen.91.d:0 "[FROM.GetName] has issued the latest social reform plan, calling for the elimination of bad habits that still widely exist in the country's society and culture, and promoting the civilization and modernization of social customs."
 gen.91.a:0 "OK."
 
 gen.92.t:0 "[FROM.GetName] announcement of granting women the right to vote"
 gen.92.d:0 "[FROM.GetName] has issued a historic new bill, under which eligible adult women will be granted the right to vote."
 gen.92.a:0 "OK."
 
 gen.93.t:0 "Muslim protests against reform！"
 gen.93.d:0 "Muslims have launched a protest march against the recent social reform resolution granting women the right to vote, believing it goes against Islamic doctrine."
 gen.93.a:0 "OK."
 
 gen.94.t:0 "The Catholic Church protests against reform!"
 gen.94.d:0 "The Catholic Church has launched a demonstration against the recent social reform resolution granting women the right to vote, believing it goes against traditional Christian morality."
 gen.94.a:0 "OK."
 
 gen.95.t:0 "[FROM.GetName] announcement of agricultural collectivization"
 gen.95.d:0 "[FROM.GetName] has issued a bill on agricultural collectivization, requiring all parts of the country to centrally manage and distribute land in order to increase food production."
 gen.95.a:0 "OK."
 
 gen.96.t:0 "[FROM.GetName] government issues a decision on economic system reform"
 gen.96.d:0 "[FROM.GetName] government has announced reforms for existing enterprises, especially state-owned enterprises, including expanding enterprise autonomy, introducing more market regulation and private components, and improving bankruptcy and transfer mechanisms for loss making state-owned enterprises."
 gen.96.a:0 "OK."
 
 gen.97.t:0 "[FROM.GetName] issued new constitution"
 gen.97.d:0 "[FROM.GetName]  has issued a new constitution, establishing a parliament, cabinet, and prime minister position. However, the monarch still retains enormous power. Not only does the election and establishment of the cabinet, prime minister, and parliament require the monarch's recognition, but the monarch can also dissolve the cabinet and parliament at any time. The country has effectively entered a binary constitutional monarchy system."
 
 gen.98.t:0 "[FROM.GetName] established temporary Cabinet"
 gen.98.t:0 "[FROM.GetName] government announced the establishment of the country's first cabinet, but all members of the cabinet were appointed by the monarch."
 
 gen.99.t:0 "[FROM.GetName] issued new constitution"
 gen.99.d:0 "[FROM.GetName] has issued a new constitution, established a parliament, cabinet, and prime minister position, and plans to elect new parliamentary senators and cabinet through elections. This is an important moment in the country's history, marking the monarch gradually releasing his power to the public."
 
 gen.100.t:0 "[FROM.GetName] established new party"
 gen.100.d:0 "With the support of the King of [FROM.GetName], a new party was established in the country and quickly rose to power, gaining an advantage in the latest parliamentary elections. Obviously, this new party is just a puppet party of His Majesty the King, acting as his representative in parliament and politics."
 
 gen.101.t:0 "[FROM.GetName] issued new law"
 gen.101.d:0 "[FROM.GetName]i government has issued new laws,Require all public places across the country to display the portrait of the great [FROM.GetLeader] as a sign of admiration and love for the national leader."
 
 gen.102.t:0 "[FROM.GetName] government announces the monarch's anthem"
 gen.102.d:0 "[FROM.GetName] government has issued a new monarch anthem, requiring all parts of the country to sing it during flag raising ceremonies and public events."
 
 gen.103.t:0 "[FROM.GetName] has issued a law prohibiting offending the monarch"
 gen.103.d:0 "[FROM.GetName] has issued a law prohibiting offenses against the monarch, and any behavior that insults or attacks the king will be considered a criminal offense."
 
 gen.104.t:0 "Some lower class people have offended our great king"
 gen.104.d:0 "How should we deal with a despicable person who boldly made remarks that offended His Majesty the King?"
 gen.104.a:0 "Make him pay the price"
 gen.104.b:0 "Not worry about it"
 
 gen.105.t:0 "A monarch offense case occurred in [FROM.GetName]"
 gen.105.d:0 "[FROM.GetName] Supreme Court recently sentenced a criminal to imprisonment for making statements criticizing the country's king. This incident has attracted widespread attention from the international community, with many democratic countries criticizing the authorities for trampling on citizens' right to freedom of speech."
 
 gen.106.t:0 "A monarch offense case occurred in [FROM.GetName]"
 
 gen.107.t:0 "[FROM.GetName] abolishes Prime Minister's position"
 gen.107.d:0 "[FROM.GetName] government has issued a new constitution, officially announcing the abolition of the position of Prime Minister, and the monarch will regain control of the country's administrative power, returning the country to the system of absolute monarchy."
 
 gen.108.t:0 "The Rise of the [FROM.GetName] Liberal Party"
 gen.108.d:0 "In the recent election, the liberal party won the majority of votes in the [FROM.GetName] parliament, and we believe that liberalism will dominate the political situation in the country in the future."
 
 gen.109.t:0 "The Rise of the [FROM.GetName] Social democratic Party"
 gen.109.d:0 "In the recent election, the Social democratic party won the majority of votes in the [FROM.GetName] parliament, and we believe that Social democratic will dominate the political situation in the country in the future."
 
 gen.110.t:0 "[FROM.GetName] announced to given vote right for Weman"
 gen.110.d:0 "[FROM.GetName] government has enacted laws allowing women to have the opportunity to vote in elections, which means the country will be committed to eliminating gender discrimination and taking a step towards social equality."
 
 gen.111.t:0 "[FROM.GetName] announced to given vote right for minor ethnics"
 gen.111.d:0 "[FROM.GetName] government has enacted laws allowing minor ethnics to have the opportunity to vote in elections, which means the country will be committed to eliminating ethnics discrimination and taking a step towards social equality."
 
 gen.112.t:0 "[FROM.GetName] announced to given vote right for illiterate person"
 gen.112.d:0 "[FROM.GetName] government has enacted laws allowing illiterate to have the opportunity to vote in elections, which means the country will be committed to eliminating education discrimination and taking a step towards social equality."
 
 gen.113.t:0 "[FROM.GetName] announced to given vote right for youth"
 gen.113.d:0 "[FROM.GetName] government has enacted laws allowing all citizens over 18 years old to have the opportunity to vote in elections, which means the country will be committed to eliminating social discrimination and taking a step towards social equality."
 
 gen.114.t:0 "[FROM.GetName] announced accept the labour union"
 gen.114.d:0 "[FROM.GetName] government has issued a law declaring the legalization of trade unions, allowing workers to protect their rights by organizing and participating in unions."
 
 gen.115.t:0 "[FROM.GetName] issued Labor Rights Law"
 gen.115.d:0 "[FROM.GetName] government has issued the Labor Rights Law and announced that it will protect the legitimate rights and interests of workers through the implementation of working time restrictions, overtime subsidies, work-related injury subsidies, and social security."
 
 gen.116.t:0 "[FROM.GetName] government holds talks with representatives of homosexuality"
 gen.116.d:0 "[FROM.GetName] government officials recently had conversations with several homosexuals and stated that the government is considering recognizing homosexuality as a normal phenomenon rather than a disease, which has sparked widespread discussion in the country."
 
 gen.117.t:0 "Catholicism opposes contact the homosexuality"
 gen.117.d:0 "Catholicism have launched protests against the government's engagement with homosexuality and condemned the government's submission to these deviant individuals who violate social morality and human instincts."
 
 gen.118.t:0 "Muslim opposes contact with homosexuality"
 gen.118.d:0 "Muslim  have launched protests against the government's engagement with homosexuality and condemned the government's submission to these deviant individuals who violate social morality and human instincts."
 
 gen.119.t:0 "Christian opposes contact with homosexuality"
 gen.119.d:0 "Christian  have launched protests against the government's engagement with homosexuality and condemned the government's submission to these deviant individuals who violate social morality and human instincts."
 
 gen.120.t:0 "[FROM.GetName]宣布接纳移民"
 gen.120.d:0 "[FROM.GetName]政府宣布，该国已经决定接受来自海外的移民来本国定居和就业，并承诺平等对待移民。这一决定引起了该国民众的关注和讨论，一些人担心外来移民会抢走他们的工作和带来社会问题。"
 
 gen.121.t:0 "反对移民的游行示威"
 gen.121.d:0 "市民发起示威游行，反对政府开放外来移民的政策。"
 
 gen.122.t:0 "本地居民与移民的冲突"
 gen.122.d:0 "本地居民与移民的冲突"
 
 gen.123.t:0 "[FROM.GetName]政府与伊斯兰党接触"
 gen.123.d:0 "[FROM.GetName]的高级官员与最近成立的伊斯兰党进行了接触，当局似乎有意支持伊斯兰党扩大政治影响力。"
 
 gen.124.t:0 "伊斯兰教在[FROM.GetName]的崛起"
 gen.124.d:0 "来自[FROM.GetName]的报道，伊斯兰主义的意识形态正在该国获得影响力。该国的伊斯兰主义者反对违背伊斯兰教义的政治势力，并呼吁政府回到古兰经上治理国家。"
 
 gen.125.t:0 "抵制伊斯兰政治的示威游行"
 gen.125.d:0 "许多市民和知识分子发起示威游行，反对伊斯兰党不断扩大的政治影响力。"
 
 gen.126.t:0 "[FROM.GetName]伊斯兰党在大选中落败"
 gen.126.d:0 "伊斯兰党在[FROM.GetName]大选中铩羽而归，获得的票数不足以进入议会。"
 
 gen.127.t:0 "[FROM.GetName]伊斯兰党在大选中取胜"
 gen.127.d:0 "伊斯兰党在[FROM.GetName]大选中大获全胜，拿下大量选票成为议会中的强势政党，毫无疑问，伊斯兰主义者将在未来很长一段时间内主导该国的政治局势。"
 
 gen.128.t:0 "[FROM.GetName]接见伊斯兰乌里马代表"
 gen.128.d:0 "[FROM.GetName]政府官员接见了伊斯兰教乌里马代表团，舆论认为这是该国政府积极支持伊斯兰教扩大政治影响力的体现。"
 
 gen.129.t:0 "[FROM.GetName]官员出席清真寺礼拜"
 gen.129.d:0 "[FROM.GetName]政府官员最近公开前往清真寺出席礼拜活动，舆论认为这是该国政府积极支持伊斯兰教扩大政治影响力的体现。"
 
 gen.130.t:0 "[FROM.GetName]伊斯兰政权的成立！"
 
 gen.131.t:0 "抵制伊斯兰政权的示威游行！"
 gen.131.d:0 "新成立的[FROM.GetName]政权并未能获得所有人的认可，反对伊斯兰政教政权的群众发起示威游行，并与警察爆发对峙！"
 
 gen.132.t:0 "[FROM.GetName]镇压示威游行！"
 gen.132.d:0 "[FROM.GetName]警察暴力驱散了进行示威游行反对伊斯兰政权的示威者，多名示威者受伤或被捕。" 
 
 gen.133.t:0 "警惕[FROM.GetName]的伊斯兰崛起"
 
 gen.134.t:0 "[FROM.GetName]对我国的伊斯兰崛起感到不安"
 
 gen.135.t:0 "[FROM.GetName]设立宗教法庭"
 gen.135.d:0 "[FROM.GetName]政府宣布，该国将废除现有的一系列司法机构，设立专门的伊斯兰法庭，法庭将根据古兰经的训示和沙里亚法学，处置各种案件，尤其是审判违背伊斯兰教法的异教徒和叛教者。"
 
 gen.136.t:0 "[FROM.GetName] issued 道德法案"
 gen.136.d:0 "[FROM.GetName]政府宣布，该国已正式颁布基于古兰经和沙里亚教法的社会道德法案，要求全体公民遵从古兰经的意志，让自己的行为和举止符合伊斯兰的教义。"
 
 gen.137.t:0 "[FROM.GetName]宣布禁止女性接受教育"
 gen.137.d:0 "[FROM.GetName]政府宣布，从即日起，女性将不得接受公立教育，所有公立学校禁止女性进入，女性只能通过清真寺接受教育。"
 
 gen.138.t:0 "[FROM.GetName]宣布强制女性带头巾"
 gen.138.d:0 "[FROM.GetName]政府宣布，从即日起，所有女性进出公共场合，必须佩戴头巾遮住头发和脸部，违者将处以严厉处罚。"
 
 gen.139.t:0 "[FROM.GetName]设立乌里马最高会议"
 gen.139.d:0 "[FROM.GetName]正式成立乌里马最高会议，这一机构由伊斯兰教法学者和知名的宗教领袖组成，以监督政府和司法机关的行为是否符合古兰经的意志。"
 
 gen.140.t:0 "[FROM.GetName]'s government contact with Christian church"
 gen.140.d:0 "[FROM.GetName]'s leader [FROM.GetLeader] have recently become closer to the Christian Church and often express their support for the Church's claims, such as opposing homosexuality, abortion, and anti communism. Public opinion believes that they may be trying to win the support of religious believers and conservatives by supporting the Church's conservative policies."
 
 gen.141.t:0 "反对教会介入政治的示威游行"
 gen.141.d:0 "[FROM.GetName]爆发了示威游行，反对政府与Christian 会关系过于亲密，认为这会导致政府的政策不断趋向保守。"
 
 gen.142.t:0 "[FROM.GetName]政府镇压游行"
 gen.142.d:0 "[FROM.GetName]警察暴力驱散了进行示威游行反对反对教会介入政治的示威者，多名示威者受伤或被捕。" 
 
 gen.143.t:0 "[FROM.GetName]领导人出席弥撒"
 
 gen.144.t:0 "反对教会介入政治的示威游行"
 
 gen.145.t:0 "[FROM.GetName]'s government contact with Catholic church"
 gen.145.d:0 "[FROM.GetName]'s leader [FROM.GetLeader] have recently become closer to the Catholic Church and often express their support for the Church's claims, such as opposing homosexuality, abortion, and anti communism. Public opinion believes that they may be trying to win the support of religious believers and conservatives by supporting the Church's conservative policies."
 
 gen.146.t:0 "[FROM.GetName]'s government contact with Orthodox church"
 gen.146.d:0 "[FROM.GetName] have recently become closer to the Orthodox Church and often express their support for the Church's claims, such as opposing homosexuality, abortion, and anti communism. Public opinion believes that they may be trying to win the support of religious believers and conservatives by supporting the Church's conservative policies."
 
 gen.147.t:0 "[FROM.GetName]'s government contact with Protestantism church"
 gen.147.d:0 "[FROM.GetName]'s leader [FROM.GetLeader] have recently become closer to the Protestantism Church and often express their support for the Church's claims,like opposing racial segregation, advocating limited social reforms and improving relations with Western countries, public opinion believes that he may attempt to win the support of religious believers and pro Western individuals by supporting the church's pro Western policies."
 
 gen.148.t:0 "[FROM.GetName]'s government contact with Lutherism church"
 gen.148.d:0 "[FROM.GetName]'s leader [FROM.GetLeader] have recently become closer to the Lutherism Church and often express their support for the Church's claims,like opposing racial segregation, advocating limited social reforms and improving relations with Western countries, public opinion believes that he may attempt to win the support of religious believers and pro Western individuals by supporting the church's pro Western policies."
 
 gen.149.t:0 "[FROM.GetName] government advocates the establishment of a society based on Christian values"
 gen.149.d:0 "[FROM.GetName]'s leader [FROM.GetLeader]  has stated in recent speeches that excessive political modernization has almost destroyed the country, and if the country wants to rebuild order, it must return to the Catholic faith and guide the people to be loyal to Christ, the Bible, and its guidance."
 
 gen.150.t:0 "[FROM.GetName] government announces the teaching of the Bible in education"
 gen.150.d:0 "[FROM.GetName] government has officially announced that the country has legislated to require all schools to teach the Bible in their curriculum, in order to guide the younger generation in the country to be loyal to the values of Christ."
 
 gen.151.t:0 "[FROM.GetName] government announces a ban on the theory of biological evolution"
 gen.151.d:0 "[FROM.GetName] government has officially announced that teaching, disseminating, and supporting the so-called 'theory of biological evolution' will be a criminal offense. The conservative [FROM.GetName] government criticized Darwin as a monkey abandoned by God, advocating that the creation of humans by the Heavenly Father is an unquestionable truth, and that the great [FROM.GetName] nation is the purest and most excellent higher race created by God."
 
 gen.152.t:0 "[FROM.GetName] government announces a ban on the theory of the Earth's Circle"
 gen.152.d:0 "[FROM.GetName] government has officially announced that teaching, disseminating, and supporting the so-called Earth Circle theory will be considered a criminal offense. The conservative government believes that the earth where humans live was created by God and is perfect, and the theory of roundness is a blatant challenge to God's creation in the Bible."
 
 gen.153.t:0 "[FROM.GetName] government issues ethics bill"
 gen.153.d:0 "[FROM.GetName] government announced that the country has officially enacted a social morality bill based on Christian doctrine, requiring all citizens to obey God's will and conform their actions and behavior to the teachings of Christ."
 
 gen.154.t:0 "[FROM.GetName] government has issued a prohibition on alcohol consumption"
 gen.154.d:0 "[FROM.GetName] government has officially announced that, except for the wine symbolizing the blood of Christ, the production of any alcoholic beverage is prohibited from now on, otherwise it will be considered a criminal offense!"
 
 gen.155.t:0 "[FROM.GetName] call for the suppression of non believers"
 gen.155.d:0 "[FROM.GetName]'s leader [FROM.GetLeader] made passionate remarks in a speech.[FROM.GetLeader] said that [FROM.GetName] as God's chosen people and messengers of Christ Jesus, it is our duty to spread the gospel outward. Many neighboring countries of the country are controlled by heretics, so it is necessary for them to pick up swords and shields and launch another crusade. This speech has attracted high attention from the international community and further tension in the regional situation."
 
 gen.156.t:0 "[FROM.GetName] establish religious court"
 gen.156.d:0 "[FROM.GetName] government has issued a shocking executive order: the Supreme Court will establish religious courts to try criminals who violate the country's extremely conservative religious laws, and may impose capital punishment on them."
 
 gen.157.t:0 "[FROM.GetName]邀请教皇阁下访问"
 
 gen.158.t:0 "The Pope arrive [FROM.GetName]"
 gen.158.d:0 "Roman Catholic Pope [VAT.GetLeader]has arrived to the [FROM.GetName].This morning local time, His Holiness the Pope's special plane has arrived in the capital of the country and will receive Catholic believers in the country during a Mass event a few days later. The government is very active in supporting Catholic influence policies and hopes that the Pope's visit can further expand the influence of Catholicism in the country."
 
 gen.159.t:0 "Pope refuses to visit [FROM.GetName]"
 gen.159.d:0 "The Vatican Foreign Office issued a statement,Roman Catholic Pope [VAT.GetLeader] refused [FROM.GetName] government's proposal to invite the Pope to visit the country."
 
 gen.160.t:0 "[FROM.GetName] announced  suppressing Muslim "
 gen.160.d:0 "[FROM.GetName] government issued an order yesterday declaring that Islam's presence poses a threat to the country and all muslim activities are prohibited from now on. Today, the country's military and police forcibly blockaded and closed masjid, confiscated religious supplies, eligious activities as criminal offenses, and arrested a large number of pastors and religious figures."
 
 gen.161.t:0 "[FROM.GetName] announced  suppressing Christian"
 gen.161.d:0 "[FROM.GetName] government issued an order yesterday declaring that Christian's presence poses a threat to the country and all Christian activities are prohibited from now on. Today, the country's military and police forcibly blockaded and closed churches, confiscated religious supplies, destroyed Christ statues, burned Bibles, classified religious activities as criminal offenses, and arrested a large number of pastors and religious figures."
 
 gen.160.t:0 "[FROM.GetName] announced  suppressing zoroastrian"
 gen.160.d:0 "[FROM.GetName] government issued an order yesterday declaring that zoroastrian's presence poses a threat to the country and all zoroastrian activities are prohibited from now on. Today, the country's military and police forcibly blockaded and closed churches, confiscated religious supplies, destroyed Ahura Mazda statues, burned Avesta, classified religious activities as criminal offenses, and arrested a large number of pastors and religious figures"
 
 gen.161.t:0 "[FROM.GetName] announced  suppressing Buddhists"
 gen.161.d:0 "[FROM.GetName] government issued an order yesterday declaring that Christian's presence poses a threat to the country and all Christian activities are prohibited from now on. Today, the country's military and police forcibly blockaded and closed churches, confiscated religious supplies, destroyed Buddha statues, burned Buddhist books, classified religious activities as criminal offenses, and arrested a large number of monks and religious figures."
 
 gen.162.t:0 "[FROM.GetName] announced  suppressing Orthodox"
 gen.162.d:0 "[FROM.GetName] government issued an order yesterday declaring that Orthodox's presence poses a threat to the country and all Christian activities are prohibited from now on. Today, the country's military and police forcibly blockaded and closed churches, confiscated religious supplies, burned Orthodox Bibles, classified religious activities as criminal offenses, and arrested a large number of pastors and religious figures."
 
 gen.163.t:0 "[FROM.GetName] announced  suppressing Protestantist"
 gen.163.d:0 "[FROM.GetName] government issued an order yesterday declaring that Protestantist's presence poses a threat to the country and all Christian activities are prohibited from now on. Today, the country's military and police forcibly blockaded and closed churches, confiscated religious supplies, burned Protestantist Bibles, classified religious activities as criminal offenses, and arrested a large number of pastors and religious figures."
 
 gen.164.t:0 "[FROM.GetName] begins to scrutinize the media industry"
 gen.164.d:0 "[FROM.GetName] government announced that the country will issue new censorship laws on the media, scrutinizing newspapers, magazines, radio, and television content, prohibiting the publication and dissemination of any content that may endanger national and social security. Violators will face criminal prosecution. Today, FROM.GetName police conducted surprise inspections on multiple newspapers, and several newspaper leaders were arrested."
 
 gen.165.t:0 "A newspaper that goes against our policy"
 gen.165.d:0 "We have discovered a group of groups that violate media policies and secretly distribute newspapers and magazines that publish hostile information. We have started investigating and traced the whereabouts of this group. How should we deal with it?"
 
 gen.166.t:0 "[FROM.GetName] government seizes underground newspaper office"
 gen.166.d:0 "[FROM.GetName]警察部门最近查封了一个出版团伙，并逮捕了团伙的成员。该团伙被指控出版危害国家和社会安全。"
 
 gen.167.t:0 "[FROM.GetName]政府 government is beginning to support nationalism"
 gen.167.d:0 "[FROM.GetName]政府开始支持民族主义"
 
 gen.168.t:0 "Warning nationalism growth in [FROM.GetName]"
 gen.168.d:0 "[FROM.GetName]的民族主义政权最近正在不断扩充军力，煽动仇恨和制造地区冲突，我们必须对该国保持高度警惕！"
 
 gen.169.t:0 "[FROM.GetName] is uneasy about our policies"
 gen.169.d:0 "[FROM.GetName]发布声明，该国对政权的军事扩张感到十分不满，并提出外交抗议！"
 
 gen.170.t:0 "[FROM.GetName] military establishes industrial group"
 gen.170.d:0 "[FROM.GetName] military has established an industrial group under military control, which covers industries, mining, and finance, allowing the military to participate in and even control significant economic activities."
 
 gen.171.t:0 "[FROM.GetName] launches a wave of xenophobia！"
 
 gen.172.t:0 "The exclusionary crisis of the [FROM.GetName] has resulted in the deaths of our residents!"
 
 gen.173.t:0 "[FROM.GetName]谴责排外暴行！"
 
 gen.174.t:0 "[FROM.GetName] declares the country a mono ethnic group!"
 
 gen.175.t:0 "[FROM.GetName] is moving towards militarism!"
 
 gen.176.t:0 "[FROM.GetName] has begun to expand its military and recruit soldiers"
 
 gen.177.t:0 "[FROM.GetName]青年团的成立"
 
 gen.178.t:0 "[FROM.GetName] begins to control the issuance of currency"
 
 gen.179.t:0 "[FROM.GetName] announces tax cuts"
 gen.179.d:0 "[FROM.GetName] Ministry of Finance announced that the country has implemented new tax policies to reduce income and business taxes levied on private enterprises, in order to encourage their development and capital investment."
 
 gen.180.t:0 "[FROM.GetName] begins to close abandoned factories"
 gen.180.d:0 "[FROM.GetName] Ministry of Finance announced that the country has ordered the cessation of operations of enterprises and factories that can no longer provide profitable value. These factories will be dissolved or sold to private enterprises, but the government has not provided a clear response on how factory employees will be treated."
 
 gen.181.t:0 "The strong dissatisfaction of unemployed workers"
 gen.181.d:0 "Unemployed workers' demonstrations erupted in the capital, protesting against a series of economic reforms that have led to corporate bankruptcies, welfare cuts, and severe unemployment rates. Many laid-off workers are unable to receive basic living security. The protesters demand that the authorities suspend economic reforms and take measures to improve the lives of unemployed workers."
 
 gen.182.t:0 "Unemployed workers launch protest march"
 gen.182.d:0 "Unemployed workers' demonstrations erupted in the capital, protesting against a series of economic reforms that have led to corporate bankruptcies, welfare cuts, and severe unemployment rates. Many laid-off workers are unable to receive basic living security. The protesters demand that the authorities suspend economic reforms and take measures to improve the lives of unemployed workers. They are currently in a tense standoff with the police."
 
 gen.183.t:0 "[FROM.GetName]镇压工人运动"
 gen.183.d:0 "[FROM.GetName]警察暴力驱散了进行示威游行要求改善待遇的工人，多名示威者受伤或被捕。" 
 
 gen.184.t:0 "[FROM.GetName]宣布限制工会运动"
 gen.184.d:0 "[FROM.GetName]政府昨天发布命令，宣布受共产主义影响的罢工和工会运动已经对国家构成威胁，即日起强制解散所有共产主义和左翼团体。今天，该国军警强制解散了共产党等左翼团体的总部，逮捕了大量社会运动家。"
 
 gen.185.t:0 "工会的大规模示威游行"
 gen.185.d:0 "首都爆发工会组织的工人示威游行，抗议当局一系列改革使得工人的政治权益受损。示威者要求当局暂停改革，并采取措施保护工人权益。目前示威者正和警察紧张对峙中。"
 
 gen.186.t:0 "[FROM.GetName]开始削减福利"
 gen.186.d:0 "[FROM.GetName]财政部发表声明，该国已决定削减诸如失业保险、养老保险和教育、医疗上的支出，以缓解该国严重的财政问题。"
 
 gen.187.t:0 "群众对削减福利感到不满"
 gen.187.d:0 "首都爆发群众示威游行，抗议当局一系列削减福利的政策。示威者要求当局暂停改革，以维护民众基本权益和生活保障。目前示威者正和警察紧张对峙中。"
 
 gen.188.t:0 "[FROM.GetName]开始削减行政支出"
 gen.188.d:0 "[FROM.GetName]财政部发表声明，该国已决定削减行政支出，包括裁撤低效的政府部门和官员，并削减公务员薪资，以缓解该国严重的财政问题。"
 
 gen.189.t:0 "[FROM.GetName] issued 新的经济法律"
 gen.189.d:0 "[FROM.GetName]商务部发表声明，该国决定逐步取消针对一些商品的价格补贴和控制政策，以促进市场对经济的作用，以利润刺激生产与消费。"
 
 gen.190.t:0 "[FROM.GetName]改革经济政策"
 gen.190.d:0 "[FROM.GetName]政府财政部宣布，该国已决定基于凯恩斯主义理论全面调整经济政策。该国政府新的经济政策认为，无序的市场竞争只会使得大资本大财团做大，政府应该介入经济活动以进行宏观调控，同时加大财政投入和福利支出，以刺激消费，创造需求。政府将基于行政体系进行经济改革，包括国有化大型企业，增加社会投资和福利政策，以刺激经济和促进社会公平，"
 
 gen.191.t:0 "[FROM.GetName]改革经济政策"
 gen.191.d:0 "[FROM.GetName]政府财政部宣布，该国已决定基于新自由主义全面调整经济政策。该国政府新的经济政策认为，政府高度干预经济导致市场失去活力，政府腐败和失去竞争力的企业使得经济增长放缓。政府将基于市场经济进行改革，减少政府干预、扩大市场的作用，削减税收和财政支出，出售低效的企业，"
 
 gen.192.t:0 "[FROM.GetName] issued 国家福利政策"
 gen.192.d:0 "[FROM.GetName]政府发表声明，该国已正是通过了最新的福利政策，将为人民提供一定的社会保障体系，包括失业保险、工伤保险、医疗保险和承担一定的教育支出。[FROM.GetName]政府希望通过改善福利制度，促进社会公平，减少贫富差距，改善中下层人民的生活水平，同时提高群众的可支配收入，以鼓励和刺激消费。"
 
 gen.193.t:0 "[FROM.GetName]推动企业国有化"
 gen.193.d:0 "[FROM.GetName]政府发表声明，该国已经决定将铁路、电力、医疗、交通等产业进行国有化，政府将在不久之后将从事这些产业的主要大企业收购，从而确保政府能够更好的对重要产业进行管理。"
 
 gen.194.t:0 "[FROM.GetName] issued 失业救济法"
 
 gen.195.t:0 "[FROM.GetName] issued 新的旅游支持政策"
 
 gen.196.t:0 "美国与[ROOT.GetName]签订新的军事条约！"
 gen.196.d:0 "[FROM.GetName]政府代表和美国代表已于昨日签署了新的共同防御协定，该国将与美国结为盟友！美国将保护[ROOT.GetName]的领土和国家安全不受侵犯，作为回报，美国将获得在该国驻军的权力。这一条约引起[ROOT.GetName]国内舆论和国际社会的关注，[ROOT.GetName]政府表示，该国将在自由世界庇护下，对抗共产主义和极权主义，但民间认为，这一条约将危害[ROOT.GetName]的主权。"
 
 gen.200.t:0 "[FROM.GetName]宣布走苏联模式的斯大林主义道路！"
 gen.200.d:0 "[FROM.GetName]的共产党总书记[FROM.GetLeader]从苏联访问回来后，似乎成为了苏联政治与经济制度的忠实拥趸。最近他在共产党大会上正式宣布，[FROM.GetName]将开始新的经济改造和发展计划！该国将进行快速的工业化、集体化路线，动员一切可利用的资源，优先发展重工业。[FROM.GetLeader]同志指出：我们将以集体的力量，为我国的工业化进程铺平道路。在党中央的坚强领导下，[FROM.GetName]的计划委员会已开始着手实行工业化计划，规划工厂建设，培训专业工人，引进苏联的先进生产技术和管理经验。"
 
 gen.201.t:0 "[FROM.GetName]政府颁布关于经济体制改革的决定"
 gen.201.d:0 "[FROM.GetName]政府宣布对现有的企业、尤其是国有企业进行改革，包括扩大企业自主权、导入更多的市场调节和民营成分，以及完善亏损国有企业的破产和转让机制。"
 gen.201.a:0 "确定。"
 
 gen.202.t:0 "[FROM.GetName]政府给予女性独立财产权"
 gen.202.d:0 "[FROM.GetName]政府宣布，该国将正式颁布新的法案，允许女性持有属于自己的私有财产，包括现金、银行存款和不动产等，同时这些财产将得到法律保护，不得被家庭成员中的男性干涉和私吞。该国政府的发言人表示，拥有属于自己的财产是保障女性社会地位的重要体现，同时也希望以此鼓励女性群体参与到经济活动中。"
 
 gen.203.t:0 "[FROM.GetName]领导人抨击反对社会改革的保守分子"
 gen.203.d:0 "[FROM.GetName]'s leader [FROM.GetLeader]今日在一次演讲中，严厉地抨击反对妇女权利改革的保守分子，他宣称：我们伟大国家的每一个人，无论性别，都应当积极参与到国家走向繁荣的建设当中。宗教保守势力和其他反对改革的反动分子，正在阻挡我们国家走向光明，我们要严厉谴责这些愚钝的人！"
 
 gen.204.t:0 "[FROM.GetName]妇女协会成立"
 gen.204.d:0 "[FROM.GetName]政府宣布，该国将成立当局支持下的妇女协会，以支持妇女权益改革，维护妇女合法权利。"
 
 gen.205.t:0 "[FROM.GetName]领导人接见妇女代表"
 gen.205.d:0 "[FROM.GetName]'s leader [FROM.GetLeader]接见了来自社会各界的解除妇女代表，包括在军警、行政、教育和工业等各部门当中任职的女性代表。[FROM.GetLeader]高度赞扬了这些为国家发展做出贡献的女性。"
 
 gen.206.t:0 "[FROM.GetName]政府颁布反对家庭暴力法案"
 gen.206.d:0 "[FROM.GetName]政府颁布了新的刑法，将家庭暴力纳入刑事犯罪范畴，殴打妻子、孩子等家庭成员者将面临刑事指控。"
 
 gen.207.t:0 "[FROM.GetName]修改婚姻法"
 gen.207.d:0 "[FROM.GetName]政府颁布了新的婚姻法，给予女方提出离婚并分得财产的权力。该国司法部门表示，婚姻平等不仅要保障婚姻自由，也要保障离婚自由的权利。"
 
 gen.208.t:0 "[FROM.GetName]政府颁布就业平等法案"
