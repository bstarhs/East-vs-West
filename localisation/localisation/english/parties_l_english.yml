 CHI_communism_party:0 "Communist Party of China"
 CHI_marxism_desc:0 "The CPC was founded in 1921, and then began to grow with the help of the workers' and students' movements. In 1925, it formed an alliance with the Chinese Kuomintang. In 1927, Chiang Kai shek launched a coup, which led to the outbreak of civil war between the Communist Party and the Kuomintang. In 1936, the two parties stopped the civil war and fought against Japanese aggression together/ Unlike traditional Stalinism, after Mao Zedong became the leader of the Communist Party of China in 1933, he implemented his own Maoist theory, emphasizing mass movements and the interests of farmers."
 CHI_democratic_party:0 "Democratic Progressvie Party"
 CHI_neutrality_party:0 "Kuomintang"
 CHI_despotism_desc:0 "The Chinese Kuomintang originated from Sun Yat sen, the founding father of China, and the Chinese Chinese Revolutionary League founded in 1905. It led the anti Qing revolution and the subsequent democratic movement. In 1924, Sun Yat sen rebuilt the Kuomintang in Guangzhou, proposed the Three People's Principles of Nationalism, People's Livelihood, and Civil Rights, and allied himself with the Communist Party to confront warlords. In 1926, Sun Yat sen died and Chiang Kai shek ascended the throne. Chiang Kai shek sought to become a dictator after unifying China in 1927. He waged war against the Communist Party and made the Kuomintang corrupt and autocratic. After the end of the Anti Japanese War, Chiang Kai shek and the Kuomintang lost their power in the mainland and withdrew to Taiwan."
 
