 SOV_stalinism_desc:0 "The full name of the Communist Party of the Soviet Union is the All-Union Communist Party, which is the only ruling party in the Soviet Union. It originated from the Social Democratic Party established by Vladimir Lenin, and later split into the Mensheviks and Bolsheviks. Bolsheviks became synonymous with the Communist Party led by Lenin. As the first Leninist Party and Communist Party to become the ruling party, the Soviet Communist Party established a one-party rule in the Soviet Union and entered a one-party dictatorship during Stalin's period."
