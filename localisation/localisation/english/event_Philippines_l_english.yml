 phi.1.t:0 "Philippine presidential election"

 phi.2.t:0 "Hukbalahap Rebellion"

 phi.3.t:0 "President Rojas passed away"
 phi.3.d:0 "Philippine President Manuel Rojas passed away due to a sudden heart attack, and his Vice President, Elpidio Kirino, took over as the President of the Philippines."
 
 phi.4.t:0 "Mrs. Aurora Quezon died in an attack!"
 phi.4.d:0 "Former Philippine President Manuel Luis Quezon's wife, Mrs. Aurora Quezon, died in an attack by the Philippine Communist Party! Communist militants attempted to intercept Aurora Quezon's car and kidnap her, but during the process, the bodyguard engaged in a firefight with the kidnappers, and Aurora Quezon and her daughter were shot and killed in the battle! Mrs. Quezon is known for actively supporting charitable movements, and her death shocked the entire Philippines, leading to fierce criticism of the Philippine Communist Party."
 
