l_english:
 
 irq.1.t:0 "Civil unrest in Baghdad"
 
 irq.2.t:0 "General Resignation of the Iraqi Cabinet"
 irq.2.d:0 "Iraq's attempt to join the Central Treaty Organization led by Britain has caused dissatisfaction among many Iraqi people, especially left-wing forces and intellectuals. A large-scale mass movement has erupted in Baghdad. The Iraqi king had to announce his acceptance of the demands of the protesters, order the Iraqi cabinet to take responsibility and resign, and launch a central treaty organization."
 
 irq.3.t:0 "A mass uprising occurred in Baghdad"
 irq.3.d:0 "Iraq's attempt to join the Central Treaty Organization led by Britain has caused dissatisfaction among many Iraqi people, especially left-wing forces and intellectuals. A large-scale mass movement has erupted in Baghdad. The Iraqi army quickly intervened and dispatched troops to carry out violent repression. The indiscriminate attacks by the army resulted in serious casualties, and a large number of politicians were arrested."

 irq.10.t:0 "Military coup!"

 irq.15.t:0 "Military coup!"

 irq.18.t:0 "Military coup!"

 irq.20.t:0 "萨达姆·侯赛因上台"

 irq.23.t:0 "Sink the tanker!"

 irq.24.t:0 "Iraqi army captures Hamadan"
 irq.24.d:0 "Under the attack of the Iraqi army, the western stronghold of Hamadan in Iran has fallen, and a large number of Iranian remnants and civilians have been forced to evacuate. The scale of the Iran Iraq war seems to be tilting towards Saddam."

 irq.25.t:0 "Ask for peace"

 irq.26.t:0 "两伊战争结束"
 irq.26.d:0 "随着伊朗与伊拉克代表签署停火协议，这场导致数万人死亡的战争宣告结束。"

 irq.27.t:0 "伊拉克入侵科威特!"
 irq.27.d:0 "今天上午，数个师的伊拉克军队向科威特发起了突然进攻！伊拉克领导人萨达姆·侯赛因宣布，科威特说伊拉克未收复的一个省，这场军事行动旨在实现伊拉克的统一。"




