 rom.22.t:0 "Ceausescu was executed"
 rom.22.d:0 "Romania has experienced a revolution! Angry protesters stormed and occupied the Presidential Palace in Bucharest, and Nicolas Ceausescu was overthrown by the uprising army. The Communist rule in Romania came to an end! The coup forces arrested Ceausescu who attempted to escape and executed them after a simple trial. Ian Iliescu, the second largest figure of the Communist Party, was elected as the head of the interim government."
 rom.22.a:0 "The most important day in Romanian history."

