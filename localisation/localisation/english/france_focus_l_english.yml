 FRA_Schuman_plan:0 "Schuman Declaration"
 FRA_Schuman_plan_desc:0 "The lesson of the Treaty of Versailles reminds us that imposing harsh post-war punishments on Germany is unreasonable. Mr. Robert Schumann, the Foreign Minister, put forward a new plan, which conditionally allows and even supports the post-war economic reconstruction of Germany, so as to suppress the remaining hostile and extremist forces in Germany."
