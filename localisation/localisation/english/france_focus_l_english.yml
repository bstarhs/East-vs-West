 FRA_ovsersea_provinces:0 "Mainland Prolongism"
 FRA_ovsersea_provinces_desc:0 "France's colonial policy is known as mainland prolongation, which involves assimilating the residents of colonies through education and bureaucratic systems, in order to maintain France's influence in the area."
 FRA_inflect_china:0 "Infiltration into mainland China"
 FRA_inflect_china_desc:0 "France was a supporter of expanding its influence in China at the end of the 19th century, but after World War II, our colonies and concessions in China were reclaimed. At present, China is in the midst of the civil war between the Kuomintang and the Communist Party of China. By supporting agents and financing opposition forces in China, we can re-establish our sphere of influence in China, especially to prevent the Chinese government from supporting the independence movement in Indochina."
 FRA_inflect_quebec:0 "Separatist in Quebec"
 FRA_control_europe:0 "European hegemony"
 FRA_Rhineland:0 "Republic of Rhineland"
 FRA_Rhineland_desc:0 "Expanding our territory to the natural border of the Rhine River and controlling the natural resources here has always been France's ideal, but the international situation after World War II no longer allows us to directly annex this region. However, as the victors of post-war control of German territory, we can establish a puppet Rhineland Republic here, just like Napoleon."
 FRA_take_netherlands:0 "Pressure to lowland countries"
 FRA_take_netherlands_desc:0 "We need to expand our control in Europe, and the Netherlands and Belgium, as our neighboring countries and important European countries, should be included in our control. We will issue an ultimatum to them, demanding that they join the camp we lead."
 FRA_take_spain:0 "Pressure to Iberia"
 FRA_take_spain_desc:0 "We need to expand our control in Europe, and Spain and Portugal, as our neighboring countries and important European countries, should be included in our control. We will issue an ultimatum to them, demanding that they join the camp we lead."
 FRA_take_italy:0 "Pressure to Italy"
 FRA_take_italy_desc:0 "We need to expand our control in Europe, and Italy, as a neighboring and important country in Europe, should be included in our control. We will issue an ultimatum to them, demanding that they join the camp we lead."
 FRA_grand_europe:0 "Greater Europe"