 FRA_navbase_brittany:0 "Expanded naval base in Brittany"
 FRA_navbase_brittany_desc:0 "布列塔尼是法国海军的起源地，我们应当加强在布雷斯特等地的海军基地建设。"
 FRA_navbase_massille:0 "Expanded naval base in Massille"
 FRA_navbase_massille_desc:0 "马赛和土伦是我国最重要的海军基地，直面地中海和非洲殖民地，我们应当加强这一地区的海军基地建设，以维护我们对非洲领地的支援。"
 FRA_navbase_basque:0 "Expanded naval base in Biscay"
 FRA_navbase_basque_desc:0 "比斯开湾沿岸有许多优良港湾，应该积极开发这里潜在的海港作为军事用途。"
 
