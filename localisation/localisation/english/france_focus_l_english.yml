l_english:
 FRA_Minitel:0 "Minitel"
 FRA_Concorde:0 "Concorde Airways"
 FRA_economics:0 "Develop Economic"
 FRA_manufacture1:0 "Develop Manufacture I"
 FRA_manufacture1_desc:0 "Develop Manufacture I"
 FRA_manufacture2:0 "Develop Manufacture II"
 FRA_manufacture3:0 "Develop Manufacture III"
 FRA_auto_indus:0 "Expanded Auto Industrial"
 FRA_invest_africa:0 "Develop Africa"
 FRA_iranium:0 "Develop Uranium mineral"
 FRA_iranium_desc:0 "We have abundant uranium mines in many territories in Africa, such as Central Africa, Gabon, and Niger, which will be essential resources for China's development of nuclear energy."
 FRA_gabon_oil:0 "Develop Gabon oil field"
 FRA_gabon_oil_desc:0 "加蓬地区蕴含丰富的石油资源，我们将帮助加蓬政府开采石油，以获得回报。"
 FRA_zaire:0 "Relation Zaire"
 FRA_guinea_oil:0 "Develop Guinea oil field"
 FRA_guinea_oil_desc:0 "加蓬地区蕴含丰富的石油资源，我们将帮助加蓬政府开采石油，以获得回报。"
 FRA_africa_army_proxy:0 "Proxies in African armies"
 FRA_latin_africa:0 "Federate Latin Africa"
 FRA_africa_railway:0 "Centural Africa Railway"
 FRA_anti_communist:0 "Anti-Communism"
 FRA_anti_communist_desc:0 "共产主义革命正在危害我们的社会秩序和国家利益，向大家宣布我们国家绝不容忍红色分子。"
 FRA_focus_special_forces_modifiers:0 "GIGN"
 FRA_GIGN:0 "GIGN"
 FRA_GIGN_desc:0 "恐怖主义在世界许多国家崛起，我们需要一支专门的精英部队，来专门对抗恐怖主义活动，保护国家领袖和人民安全。"
 FRA_africa_immigrate:0 "Accept Immigrate from North Africa"
 FRA_diplomacy_syria:0 "Relation with Syria"
 FRA_diplomacy_lebanon:0 "Relation with Lebanon"
 FRA_brasil:0 "Relation with Brazil"
 FRA_caribbeam:0 "Develop Carribeans"
 FRA_guyana:0 "Develop Guyana"
 FRA_guyana_desc:0 "圭亚那曾经一直是我国最贫穷的海外领地，甚至被当作流放地，但航天事业的发展改变了圭亚那的命运。作为最接近赤道的海外领地，没有比圭亚那更适合发展航天基地的地区了。"
 FRA_against_brasil:0 "Against Brazil"
 FRA_pacific_develop:0 "Develop Pacific"
 FRA_pacific_autonomy:0 "太平洋地区自治"
 FRA_railway:0 "National Railway"
 FRA_social_reform:0 "Social Reform"
 FRA_social_reform_desc:0 "许多落后的文化和生活习惯依然影响着我们的国家，例如男女的不平等和等级制度，如果我国想要成为一个现代国家，就必须将这些落后文化清除。"
 FRA_invets_china:0 "Invest China"
 FRA_invets_china_desc:0 "中国大陆在改革开放之后，希望吸引外资投资，我们应该抓住这个机会，获取庞大的中国市场。"
 FRA_lowlands:0 "Relation with Dutch and Belgium"
 FRA_lowlands_desc:0 "比利时、荷兰与卢森堡是欧洲重要的邻居，我们应当加强与低地国家的关系，以获得卢森堡的钢铁、比利时的煤炭和荷兰的金融市场。"
 FRA_leon_way:0 "Paris-Lyon Railway"
 FRA_tunnel:0 "France-Britan tunnel"
 FRA_navy:0 "Develop Navy"
 FRA_navy_desc:0 "要保护我们的领海和海外领地，就必须拥有一支先进的现代化海军。"
 FRA_carrier:0 "Develop Carrier"
 FRA_gaulle_carrier:0 "Carrier De Gaulle"
 FRA_gaulle_carrier_desc:0 "核动力将让我们的海军走向世界每一个角落。"
 FRA_electronic:0 "Develop Electronic"
 FRA_electronic_desc:0 "计算机毫无疑问是二十世纪最伟大的发明，也许没有之一，1948年ENIAC一条条电路板的运作标志着第三次科技革命的诞生。1960年代，随着民用计算机投入使用，人类的生活方式被极大的改变，许多冗杂的工作可以被计算机所协助甚至代替。起初计算机只能帮助处理文书工作，但后期计算机有了更多功能，例如制图、传真、模拟和娱乐。计算机不仅可以帮助人们工作，对于80年代的许多国家来说，计算机还是经济腾飞的阶梯，亚洲的日本、韩国、台湾和中国大陆通过承接计算机制造业实现了经济的迅速增长。"
 FRA_agriculture:0 "Develop Agriculture"
 FRA_wine:0 "Expanded Wine plantation"
 FRA_develop_south:0 "Develop Southern"
 FRA_develop_south_desc:0 "我国南部的奥克塔尼亚，有许多地区依然是一片农田和森林，应该进行开发，扩大城市和工业区。"
 FRA_sdp:0 "Support Socialism Party"
 FRA_sdp_desc:0 "社会民主主义要求政府关注每一个公民的利益，尤其是贫困阶层和弱势群体的利益，而非富有阶层的利益。促进社会平等以调和社会矛盾是社会民主主义的优先政策。"
 FRA_union_republique:0 "Support Union pour la République"
 FRA_union_republique_desc:0 "共和国联盟将继承戴高乐总统的意志，继续坚持法兰西独立自主的道路并保护我们的国家利益。"
 FRA_conservatism:0 "Conservatism"
 FRA_conservatism_desc:0 "二战后的世界充斥着各种意识形态，共产主义、社会主义、民主主义、无政府主义……但这些新颖的政治主张真的符合我们的国家吗？也许我们应该回到过去的历史中，寻找正确的答案。如果旧日的思想确实给我们带来了稳定和秩序，那么就沿着旧有的道路前进。"
 FRA_national_front:0 "Support Front Vational"
 FRA_national_front_desc:0 "第四共和国的左派和民主派把国家搞得一团糟，我们在海外利益的丢失证明了民主制度的无能。幸运的是，法兰西也有许多关心祖国利益的政治家。新秩序、国家人民联盟、民族动员等团体也活跃于政坛，他们将会团结起来，共同组建法兰西最大的保守主义政党——国民阵线。"
 FRA_right_wing:0 "Support the right wing"
 FRA_right_wing_desc:0 "一方面我们批判菲利普·贝当和维希政权的投敌行为，但另一方面，这不代表维希政府反对共产主义，反对犹太人和他们的美苏傀儡的政策是错误的。法兰西在二战后依然面临许多困境，这就是证明。我们应当重新考虑是否应该恢复维希政府的一些政策，以对抗布尔什维克和犹太人。"
 FRA_france_first:0 "Vive la France!"
 FRA_france_first_desc:0 "共和国召唤着我们！\n要么得胜，要么牺牲。\n法国人必须为祖国而生\n为了她，法国人必须成仁！"
 FRA_catholics:0 "Support Catholic church"
 FRA_catholics_desc:0 "法兰西的人民自古以来就是天主忠实的仆人，圣丹尼的虔诚、圣女贞德的忠勇和圣马丁的善良是法兰西忠于上帝的证明和我们要向子孙后代传播的价值。"
 FRA_Dieu_patria_familia:0 "Travail!Famille!Patrie!"
 FRA_social_law:0 "Social Ethics Act"
 FRA_social_law_desc:0 "我们要把基督耶稣和上帝的信条深深地刻入我们的社会文化，每一个公民都应当虔诚地根据基督的旨意行事。"
 FRA_control_media:0 "Control the media"
 FRA_racist:0 "Saint-Empire Francais"
 FRA_neo_liberaism:0 "Neoliberalism"
 FRA_neo_liberaism_desc:0 "新自由主义者主张减少政府的行政干预，让市场自由运行从而刺激经济增长。政府的腐败、政治混乱和官僚主义使得他们无法有效管理经济，因此让市场无形的大手来促进经济系统自我调节才是最好的办法。政府干预越少，经济运行越好。"
 FRA_market:0 "增加市场调控"
 FRA_market_desc:0 "既然市场能够比行政机构更好地运营经济，那我们就应该将经济完全交给市场和市场参与者自由运营，一个完全没有行政干涉的经济体制无疑是最健康，最完美的。"
 FRA_Reduce_social_spending:0 "削减社会开支"
 FRA_privatization:0 "Privatization of enterprises"
 FRA_social_free:0 "Reform of Women's Rights"
 FRA_communie:0 "Vive la Commune!"
 FRA_YUG:0 "Relations with Yugoslav"
 FRA_supress:0 "Suppression of Counterrevolutionaries"
 FRA_supress_desc:0 "一些敌视社会主义[FROM.GetName]的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。"
 FRA_stalinism_focus:0 "Stalinist model"
 FRA_stalinism_focus_desc:0 "在斯大林模式的指导下，苏联人民不仅在短短十年内把俄罗斯变成了工业强国，而且还战胜了法西斯。我们要摆脱贫困，进入工业化和现代化，就必须学习苏联人民的先进经验。"
 FRA_nkvd:0 "Public security committee"
 FRA_nkvd_desc:0 "我们要建立专门的机构，调查、监视、逮捕反革命分子和帝国主义间谍。"
 FRA_terror:0 "Tribunal révolutionnaire"
 FRA_terror_desc:0 "恐怖暴力无非是正义的，及时，严厉的，没有弹性的。\n如果人民政府在和平时期的基础是美德，人民政府在革命时期的基础既是美德也是恐怖暴力；美德，没有这些恐怖暴力会导致毁灭的；恐怖暴力，没有这些美德是没有无权力基础的。无权力的无非是快速，严厉和没有弹性的正义;以上 因此它是美德的化身；它本身是欠缺原则，而且不是民主的一般原则的结果，适用于祖国最迫切的需求。\n——马克西米连·罗伯斯庇尔"
 FRA_union_gov:0 "Coalition government"
 FRA_collectivization:0 "Agricultural collectivization"
 FRA_collectivization_desc:0 "分散的农业生产不利于我国经济的快速建设。建议将农民组织到集体农场，集体劳动和分享生产资料，共有劳动成果。"
 FRA_planing:0 "Planned economy"
 FRA_planing_desc:0 "要实现快速发展，必须统一现有的一切生产资料，有计划地使用和分配生产生活资料。"
 FRA_5_planing:0 "Five-year plan"
 FRA_5_planing_desc:0 "我们将开始实行第一个五年计划，以快速建设社会主义经济。"
 FRA_nationalized:0 "Industrial nationalization"
 FRA_nationalized_desc:0 "在从资本主义社会过渡到共产主义社会之前，党和国家将以国有企业的形式管理我国的重要生产资料。"
 FRA_humanity:0 "Humanized socialism"
 FRA_worker_communie:0 "Workers' Committee"
 FRA_worker_communie_desc:0 "中国的工人委员会模式下，工人们以民主形式直接参与工厂的管理和决策，委员会的成员由选举产生，他们不仅参与管理，并且也要参与工作。"
 FRA_workerism:0 "Syndicalism"
 FRA_maoism:0 "Maoism"
 FRA_maoism_desc:0 "来自中国共产党领袖毛泽东的政策为我们提供了宝贵的经验和理想的学习对象。中国政府所实行的文化革命、工人自治、群众路线和第三世界理论将成为我们走向共产主义的指路明灯。"
 FRA_against_soviet:0 "Against Soviet imperialism"
 FRA_europe_revolution:0 "Support Europe revolution"
 FRA_pla_paris:0 "Les Chinois à Paris"
 FRA_pla_paris_desc:0 "让我们热烈欢迎来自中国的同志来到巴黎，知道我们的社会主义文化革命，我们将为中国同志们献上我们创作的《红军与卡门》芭蕾舞剧。"
 FRA_mai68:0 "Mai en rouge"
 FRA_liberate_colonies:0 "Liberate colonies"
 FRA_joined:0 "Allow foreign comrades"
 FRA_air_force:0 "Develop Air force"
 FRA_missile:0 "Develop Missles"
 FRA_Bourbon:0 "Le Retour des Princes à Paris"
 FRA_Napoleon:0 "Sa Majesté has arrived in Paris"
 FRA_Napoleon_desc:0 "没有脑子的君主制分子妄图参与大选\n荒诞的保皇党正到处拉票\n君主主义者获得议会席位\n王党领袖宣布获得多数席位\n尊敬的君主主义议员先生们成立新的政府！"
 FRA_Grognards:0 "Les Grognards"
 FRA_Grognards_desc:0 "拿破仑皇帝陛下麾下的老近卫军战无不胜，所向睥睨，是法兰西军人的典范！"
 FRA_militarism:0 "Militarist"
 FRA_war_uk:0 "Avenge for rafalgar"
 FRA_war_uk_desc:0 "我们希望拿破仑皇帝的英灵能够看见，我们没有重蹈特拉法尔加的耻辱，战胜了所谓无敌的皇家海军，并登上了不列颠的土地！"
 FRA_war_russia:0 "1812 Overture"
 FRA_war_russia_desc:0 "我们希望拿破仑皇帝的英灵能够看见，我们没有重蹈博罗季诺和莫斯科的耻辱，战胜了所谓无敌的苏俄红军，看见了乌拉尔山另一端的亚洲大陆！"
 FRA_space_beurau:0 "European Space Agency"
 
 FRA_students_autonomy:0 "Student Autonomy Committee"
 FRA_students_autonomy_desc:0 "毛泽东说，年轻人是早晨的太阳，应当成为革命的领导力量。学校和教育机构不应该掌握在腐朽低效的官僚系统中，因为行政官僚指挥照本宣科，扼杀年轻人的激情和对进步理念的探索。教育系统而应该由学生、教师民主选举出的委员会来管理，以确保民主制度能在校园内实行，鼓励年轻人在学习文化知识的同时，又能进行更好的革命实践。"
 FRA_radical_socialreform:0 "More radical social reforms"
 FRA_radical_socialreform_desc:0 "法兰西目前存在许多的封建和资本主义残余，例如封建的教会，落后的文化。我们如果要创造一个新世界，就要砸碎旧世界！"
 FRA_Cooperatives:0 "Agricultural cooperatives"
 FRA_Cooperatives_desc:0 "农业生产的社会主义改革要从生产关系开始。我们将颁布土地改革法，没收大资本家、大庄园主和富农的多于土地，并成立农业合作社，鼓励农民加入，分享生产资料和生产成果。"
 FRA_rural_communie:0 "Rural Commune Movement"
 FRA_rural_communie_desc:0 "来自中国的人民公社运动为我们提供了宝贵经验。"
 FRA_social_system:0 "Improve social management system"
 FRA_work_communie:0 "Counter-Slowdown Commission"
 FRA_work_communie_desc:0 "在新一次五年计划建设的关键时刻，我们不允许有人掉链子。反怠工委员会将监督和惩罚没有完成生产计划的生产单位。"
 FRA_purge:0 "Raise Guillotine"
 FRA_purge_desc:0 "一些敌视社会主义法兰西的破坏分子、反革命分子和帝国主义间谍正在密谋进行颠覆活动。必须消灭他们，维护人民政权。"
 
 FRA_revolution_holland:0 "Support revolution in Holland"
 FRA_revolution_holland_desc:0 "比利时和荷兰的革命群众正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 FRA_revolution_italy:0 "Support revolution in Italy"
 FRA_revolution_italy_desc:0 "意大利的革命群众正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 FRA_revolution_nordic:0 "Support revolution in Scandinavia"
 FRA_revolution_nordic_desc:0 "瑞典、丹麦和挪威的革命群众正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 FRA_revolution_ireland:0 "Support revolution in Ireland"
 FRA_revolution_ireland_desc:0 "爱尔兰的革命群众正在与反动势力及英帝国主义进行激烈的斗争，他们需要我们的帮助！"
 FRA_revolution_usa:0 "Support revolution in America"
 FRA_revolution_usa_desc:0 "American 的革命群众正在与反动势力进行激烈的斗争，他们需要我们的帮助！"
 FRA_revolution_vietnam:0 "Support revolution in Vietnam"
 FRA_revolution_vietnam_desc:0 "印度支那的革命势力正在和美帝国主义及其走狗进行激烈的斗争，他们需要我们的帮助！"
 
 FRA_MJCF:0 "Mouvement Jeunes Communistes"
 FRA_MJCF_desc:0 "青年共产主义者运动是法国共产党的青年翼。"
 FRA_left_army:0 "Support liftist in the army"
 FRA_left_army_desc:0 "军队中依然存在许多反动势力，我们必须将右翼势力从军队中剔除，并以支持革命，支持社会主义的人士所取代。"
 FRA_political_comisars:0 "Political Comisars"
 FRA_political_comisars_desc:0 "政委是人民军队中政治动员的核心机构，通常包括自成一体的政工组织和文化工作团队。然而并不是每一个政权都能容忍有军队有思想，这既取决于他们有没有足以自圆其说的战略目标，同时也取决于他们的执政理念。很显然我国二者兼备。"
 FRA_armee_pueble:0 "Armée populaire"
 FRA_nacional_defence:0 "Garde Nationale"
 FRA_nacional_defence_desc:0 "现有的法国军队已完全被反革命分子所控制和腐蚀，与其花时间改造反动军队，不如解散现有武装力量，重组国民自卫军，让民众武装起来，保卫社会主义法兰西！\n武装起来，公民们\n组织起你们的队伍！"
 
 FRA_lefts_colonies:0 "Support socialist in colonies"
 FRA_lefts_colonies_desc:0 "社会主义的法兰西当然不再需要榨取殖民地了，但另一方面，如果我们能在撤离殖民地之前，支持一下当地的左翼势力，邀请他们进入当地政府，可以有效支持国际社会主义运动。"
 FRA_invite_social_party:0 "Invite Social party"
 FRA_socialism_reform:0 "Socialism reform"
 FRA_accept_church_left:0 "Accepting the Left in the Church"
 
 FRA_UDCA:0 "Support Poujadistas"
 Poujadistas:0 "UDCA"
 
 FRA_Jeune_Nation:0 "Support Jeune Nation"
 FRA_Loeuvre_Francaise:0 "Support  L'Œuvre française"
 
 FRA_wipe_neoringht:0 "镇压右翼势力"
 
 FRA_democratic_monarchism:0 "Democratic Constitution under Monarchy"
 FRA_democratic_monarchism_desc:0 "1830年的七月革命使得奥尔良家族登上了法国王位，但先王路易·菲利普没有继承波旁王朝的反动政策，而是尝试了君主立宪改革，有志于打造一个符合法兰西群众需求的君主立宪国家。而当奥尔良家族第二次获得法国王冠时，亨利六世也致力于打造一个民主的、现代化的君主立宪制度，创造一个君主制下的民主国家。"
 FRA_progress_roi:0 "Progressive monarchs"
 FRA_new_election:0 "Constitution election"
 
 FRA_nacional_revolucion:0 "Révolution nationale"
 FRA_nacional_revolucion_desc:0 "在1940年的失败之后，菲利普·贝当元帅就已经看出，议会制、共和制、多党制云云，只能给法兰西带来失败与灾难。法兰西真正需要的，是强有力的政府，强有力的领袖，以及在天主教和爱国主义的基础上团结起来的国民！国民阵线的旗帜下，团结了让·马利·勒庞先生这样的爱国者，只有让他们成为法兰西的领袖，才能拯救这个国家！"
 
 FRA_algieria_oil:0 "Develop Alger oil field"
 FRA_algieria_oil_desc:0 "阿尔及利亚地区探测出了珍贵的石油和天然气资源。"
 FRA_retreat_algeria:0 "Retreat from Algeria"
 FRA_retreat_algeria_desc:0 "高昂的军费，可怕的伤亡数字，国际的制裁和谴责，国内的反战运动……尽管阿尔及利亚对我们是如此重要，但我们已经没有能力再继续殖民地的冒险了。"
 FRA_Etrangere_focus:0 "Expanded Légion Étrangère"
 FRA_Etrangere_focus_desc:0 "法国外籍军团是从殖民地征召当地居民组建的武装力量，通过征募当地人口进入军队，可以大大补充法国本土的兵员稀缺，同时从外籍军团退役的士兵也可以成为我们在殖民地的傀儡。"
 FRA_war_sweden:0 "Punishment Bernadotte"
 FRA_war_sweden_desc:0 "叛徒让·贝尔纳多特，出卖了拿破仑皇帝以换取瑞典的王座，现在他的子孙还在斯德哥尔摩的王宫里享清福，让我们以陛下的名义向他的后代讨回代价！"
 FRA_algeri_immigrate:0 "Immigrate to Maghreb"
 FRA_algeri_immigrate_desc:0 "我们应当鼓励法国本土白人前往北非，投资、工作、创业、传教并定居，从而在北非建立起属于法国人的资产，在当地留下法兰西的印记。"
 FRA_afrique_immigrate:0 "Immigrate to Africa"
 FRA_afrique_immigrate_desc:0 "我们应当鼓励法国本土白人前往北非，投资、工作、创业、传教并定居，从而在北非建立起属于法国人的资产，在当地留下法兰西的印记。"
 FRA_expanded_catholic:0 "Expand Catholicsm"
 FRA_expanded_catholic_desc:0 "推广天主教，引导海外领地的群众皈依天主，是在当地传播法国价值观，引导群众认同法兰西的重要一步。"
 FRA_develop_algeria:0 "Develop Algeria"
 FRA_develop_algeria_desc:0 "我们希望经济发展可以有效削弱阿尔及利亚人的不满情绪，当他们有稳定的工作和可观的薪水时也就不会再支持叛乱。"
 FRA_retreat_vietnam:0 "Retreat from Indochina"
 FRA_retreat_vietnam_desc:0 "高昂的军费，可怕的伤亡数字，国际的制裁和谴责，国内的反战运动……尽管印度支那对我们是如此重要，但我们已经没有能力再继续殖民地的冒险了。"
 FRA_anti_bulshvek:0 "Légion contre le bolchévisme"
 FRA_anti_bulshvek_desc:0 "布尔什维克志愿兵团由反对共产主义的右翼分子组成，是致力于对抗赤色威胁的准军事团体。"
 
 FRA_111111:0 "外交攻势"
 
 FRA_Armee_secrete:0 "Support OAS"
 FRA_Armee_secrete_desc:0 "法国政府出卖国家海外利益，向叛军妥协的行为不可容忍，一些军人已经团结起来，反对第四共和国。"
 FRA_Consulat:0 "Consulat"
 FRA_Consulat_desc:0 "法兰西祖国已经处于最危险的时候！在我们的历史上，只有军人能够拯救于法兰西于水火之中！圣女贞德算半个军人，拿破仑将军和戴高乐将军毫无疑问也是军人，而我们也将继承法兰西军人的意志，推翻愚蠢无能的第四共和国，建立一个爱国军人领导下的真正爱国主义政府！Vive le France!"
 
 FRA_militarist_pol:0 "Expanded militarists power"
 FRA_militarist_pol_desc:0 "无能的政客还在波旁宫及爱丽舍宫内瓜分利益，让我们把他们赶出去，让军人来掌握政治。"
 FRA_militarist_ecnomic:0 "Economic for military"
 FRA_militarist_ecnomic_desc:0 "Expanded 我们的军事力量，需要经济层面的全力支持。我们应当让我们的经济体制抛弃掉没用的奢侈品生产，将重心投入到军工当中。"
 
 FRA_crusade:0 "Crusader Kings"
 FRA_crusade_desc:0 "让法兰西的孩子们为了天主和基督的荣耀而战。我们将像我们的祖先鲍德温一世和腓力二世一样，向异教徒举起讨伐的长剑！"
 FRA_crusade_on_spain:0 "La Chanson de Roland"
 FRA_crusade_on_spain_desc:0 "《罗兰之歌》歌颂了法兰西历史上最伟大的骑士罗兰，与伊比利亚异教徒作战的故事，他将激励我们的战士再一次征服伊比利亚！"
 FRA_crusade_on_italy:0 "Le Bel's legacy"
 FRA_crusade_on_italy_desc:0 "美男子腓力四世国王的铁蹄征服罗马，让教皇俯首称臣，他将激励我们的战士再一次征服意大利！"
 FRA_crusade_on_england:0 "Norman conquer"
 FRA_crusade_on_england_desc:0 "诺曼公爵威廉在黑斯廷斯战役中，将英格兰的伪王斩首，让盎格鲁撒克逊人臣服，他将激励我们的战士再一次征服不列颠！"
 FRA_crusade_on_german:0 "Charlemagne's legacy"
 FRA_crusade_on_german_desc:0 "查理大帝率军出征，统一了从比利牛斯到易北河的大半个欧洲，建立伟大的法兰克帝国，他将激励我们的战士再一次征服日耳曼！"
 FRA_crusade_on_russia:0 "War on the East"
 FRA_crusade_on_russia_desc:0 "邪恶的布尔什维克无神论匪徒将整个东欧的基督徒踩在脚下，让我们前去解救我们的同胞！"
 
 FRA_usa_techs:0 "American economic assisstance"
 FRA_usa_techs_desc:0 "我们可以请求美国政府向我们派遣技术顾问，帮助我国科技发展和工业建设。"
 FRA_usa_intel:0 "American intellegence assisstance"
 FRA_usa_intel_desc:0 "我们应当邀请美国情报部门来为我国提供情报援助。虽然这有让我国被美国渗透控制的风险，但利大于弊。"
 FRA_garrison:0 "American military assisstance"
 FRA_garrison_desc:0 "我们可以请求军事政府为我们提供军事援助，包括援助军事装备和军事顾问。""
 
