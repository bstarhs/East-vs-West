 YUG_Spomenik:0 "Spomenik Monument"
 YUG_Spomenik_desc:0 "Spomenik monument is a large number of modernist and futuristic monuments built by the Yugoslav government. It mainly commemorates the previous battles of the Yugoslav people against fascism during World War II. These monuments adopt a distinctive style of Brutalism and futurism, rather than traditional statues and other forms. Tito believes that traditional monuments will be linked to nationalism, so he hopes that futuristic monuments will become part of the unified Yugoslav culture."