 YUG_balkan_treaty:0 "Balkan treaty"
 YUG_balkan_treaty_desc:0 "With the deteriorating relations between Yugoslavia and the Soviet Union, Tito began to move closer to western countries. The Balkan treaty is a military alliance treaty dominated by Yugoslavia, Greece and Turkey. This treaty means that Yugoslavia will form an alliance with western countries."
