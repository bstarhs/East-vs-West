 YUG_united:0 "Balkan federation"
 YUG_united_desc:0 "The unification of Yugoslavia, Bulgaria, Albania and even Greece into a great Balkan Federation has always been one of the ambitions of Yugoslav politicians. In the 1950s, Tito began to strengthen relations with Bulgaria and Albania to realize this vision."
