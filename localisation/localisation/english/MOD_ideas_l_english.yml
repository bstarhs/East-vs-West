 FRA_common_gov_ideas:0 "United lefts govenrment"
 workers_communie_ideas:0 "Workers commune"
 workers_communie_ideas_desc:0 "In a country led by the proletariat, the proletariat owns and manages the means of production. The Workers' Committee will manage all institutions from the factory to the city government, with workers participating in management and managers participating in labor."
 Garde_Nationale_ideas:0 "Garde Nationale"
 Garde_Nationale_ideas_desc:0 "The working class will arm yourselves, defend themselves, and defend the commune!"
 propataria_communie_ideas:0 "Propataria dictatorship"
 propataria_communie_ideas_desc:0 "The people's commune will no longer be a bourgeois style state machine, but a proletarian state under collective leadership, and people will democratically elect commune committees to manage administrative affairs."
 students_communie_ideas:0 "Students Autonomous Commune"
 students_communie_ideas_desc:0 "Schools and educational institutions should not be controlled by corrupt and inefficient bureaucratic systems, but should be managed by committees democratically elected by students and teachers to ensure that democratic systems can be implemented on campus."
 terreur_ideas:0 "Terreur"
 terreur_ideas_ideas:0 "The National Convention, in the name of the French people, declares its firm intention to strike its enemies with terror, expand its scope to its allies, and treat the people fairly.\n——Maximilien de Robespierre"
 
 FRA_milice:0 "Légion contre le bolchévisme"
 FRA_milice_desc:0 "The Anti-Bolshevik Volunteer Corps was composed of right-wing members who opposed communism and was a quasi military group dedicated to combating the threat of communism. "
 FRA_boubor_debuff:0 "Bourbor's return"
 FRA_boubor_debuff_desc:0 "The rulers of the Bourbon dynasty are notorious for being reactionary and autocratic. Since Charles X fell, the Bourbon family has never won the throne of France. Therefore, the rule of Jaimei I is hardly recognized by the French, let alone he is now a Spaniard."
 patria_familia_ideas:0 "God!Home country!Family!"
 patria_familia_ideas_desc:0 "Loyal to the Almighty God, loyal to the great homeland, loyal to one's own family, in order to promote social stability, is the ideal country of Christian conservatives."
 FRA_patria_familia_ideas:0 "Travail!Famille!Patrie!"
 crusade_ideas:0 "Crusader Kings"
 French_revolution_ideas:0 "Once Again Revolution"
 French_revolution_ideas_desc:0 "In 1789, 1830, 1848, 1870, and 1944... as long as tyranny still oppresses the French people, the revolution will not stop!"
 
 FRA_Etrangere:0 "Etrangere corp"
 FRA_republique_legacy:0 "La Revolution e la Republique"
 FRA_republique_legacy_desc:0 "Since 1789, France has experienced more than a dozen bloody revolutions, establishing one republic and empire after another, and finally establishing a republican system in the Constitution of the Third Republic in 1870. In the following fifty years, the French Republic has gained the recognition of the people and monarchism has disappeared."
 FRA_Vieille_Garde:0 "Vieille Garde"
 FRA_Vieille_Garde_desc:0 "Let us fight like the great Emperor Napoleon and his brave and fearless Imperial Guard more than a hundred years ago!"
 FRA_napoleon_reback:0 "Return of Napoleon"
 FRA_napoleon_reback_desc:0 "The noble heir of Napoleon Bonaparte returned to his loyal Paris."
 FRA_policia_afrique:0 "Policia Afrique"
 FRA_policia_afrique_desc:0 "The French armed forces continue to fight on African soil to protect Paris' agents in Africa."
 FRA_paris_communie_ideas:0 "Vive la Commune!"
 FRA_paris_communie_ideas_desc:0 "Debout les damnés de la terre!\nDebout les forçats de la faim!\nLa raison tonne en son cratère\nC'est l'éruption de la fin!"
 FRA_culure_revolution:0 "France under eastern sun"
 FRA_culure_revolution_desc:0 "The great leader from the East guides the direction of a new revolution in France!"
 FRA_immgrate_comeback:0 "Immigrate of former colonies"
 FRA_immgrate_comeback_desc:0 "After France lost its overseas colonies, a large number of expatriates and naturalized individuals from former territories went to France to seek a new language."
 FRA_rightwing_revolt:0 "Conservatism revolt"
 FRA_rightwing_revolt_desc:0 "Anti communists, conservatives, monarchists, and religious believers have all risen up to arm themselves against the French Communist regime."
 FRA_unrest_armee_ideas:0 "Rise of OAS"
 FRA_unrest_armee_ideas_desc:0 "The secret military organization is composed of a group of soldiers who are dissatisfied with the government's abandonment of Algeria and are brewing sinister plans."
 FRA_chaos_ideas:0 "Chaos after world war"
 
