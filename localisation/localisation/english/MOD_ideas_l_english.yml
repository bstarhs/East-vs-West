 ENG_broken_marry_desc:0 "The marriage between Prince Charles and Princess Diana ended in divorce, which dealt a heavy blow to the reputation of the royal family."
 ENG_the_kings:0 "God blessing monarch of Great Britain"
 ENG_the_kings_desc:0 "Since the unification of England by Ethelstein in Wessex in 927 AD, the monarchy has ruled England for over a thousand years. Simon Monfort, Cromwell, and Napoleon were unable to destroy the monarchy's rule, while the improvement of the constitutional monarchy and the victories in the two World Wars further consolidated the crown of the British Empire. Most British people believe that Britain needs a monarch to become a symbol of the country's tradition and honor.God Save the King!or Queen!"
