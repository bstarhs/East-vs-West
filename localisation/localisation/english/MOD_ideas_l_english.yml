 CHI_warlords_spirits_desc:0 "Since the establishment of the Republic of China, military commanders in various regions have used their power to control provinces, forming warlord separatism, which has been a problem that has plagued China for decades. The contradiction between the warlords of the provinces and the central government in Nanjing has a long history. If the warlords and their armies are unwilling to obey Nanjing, they will not only affect the war between Chiang Kai shek and the Communist Party, but also join the Communist Party."
 
