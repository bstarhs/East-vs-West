 IND_govern_companies:0 "企业执照"
 IND_religion_conflict:0 "Religion Conflict"
 IND_Caste_1:0 "Caste influence-Less"
 IND_Caste_1_desc:0 "The caste system has basically disappeared in Indian society, and equality and freedom have gradually been accepted by Indian society."
 IND_Caste_2:0 "Caste influence-In reduce"
 IND_Caste_2_desc:0 "The caste system is gradually being abandoned by well-educated Indians, and discrimination and exclusion against lower castes are gradually decreasing."
 IND_Caste_3:0 "Caste influence-Popular"
 IND_Caste_4_desc:0 "The caste system still maintains its influence in many rural and underdeveloped areas, and discrimination and exclusion against lower castes are still common."
 IND_Caste_4:0 "Caste influence-Deep popular"
 IND_Caste_4_desc:0 "The caste system deeply influences Indian society, and discrimination and exclusion against lower castes are ubiquitous."
 
