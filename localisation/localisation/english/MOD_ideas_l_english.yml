 theory_police_idea_desc:0 "The moral police will check whether everyone's behavior and clothing comply with the moral norms of the Quran"
 royal_Bonyad_idea:0 "Royal Bonyad"
 royal_Bonyad_idea_desc:0 "Shah demands that all large corporations join the Royal Foundation and contribute nearly 40% of profits. A portion of the foundation's income goes into the pockets of the Shah, while another portion is rewarded by the Shah to businesses that actively support Shah policies."
 PER_Ghorb_group:0 "Ghorb group"
 PER_Pasdaran:0 "Pasdaran Islam"
 PER_Pasdaran_desc:0 "The Islamic Revolutionary Guard Corps is an armed force directly under the Imam"
 PER_reneval_soroastic:0 "Reneval of Soroastism"
 PER_reneval_soroastic_desc:0 "Ahura Mazda, the God of Light, the wise Lord bestows upon his beloved humanity - my people - a joyful gift from truth and power. Everyone will unite to defend your teachings and those who remember your hymns of praise. Let all those who do good deeds unite and raise Mother Earth together."
 state_modifier_kanr_broken:0 "Broken Kanr"
 state_modifier_kanr_broken_desc:0 "Kanr cannot be used due to lack of maintenance."
 state_modifier_kanr:0 "Kanr"
 state_modifier_kanr_desc:0 "Kanr is an ancient irrigation system originating from the Iranian plateau and widely used in Central Asia, West Asia, and North Africa, originating from the Media Dynasty in the 6th century BC. Seasonal rivers are formed in mountainous areas of West and Central Asia due to the melting of ice and snow, but freshwater cannot be used due to evaporation or infiltration into the ground. Kanr is a complex underground ditch that can collect fresh water that seeps into the ground and irrigate farmland. In areas without modern water systems, Kanr provides precious water resources for local residents and farmland."
 PER_latinized_farsi:0 "Latinized Farsi"
 PER_latinized_farsi_desc:0 "The Iranian government has changed Persian from Arabic to Latin letters, which will greatly improve the literacy level and social work efficiency of the people."
 PER_ally_occupied:0 "Allies influence"
 PER_ally_occupied_desc:0 "In order to prevent Iran from leaning towards Nazi Germany, Britain and the Soviet Union invaded Iran and took control of the country. Even after the end of World War II, Britain and the Soviet Union still firmly controlled the political situation in Iran."
 PER_jabheye_melli_ideas:0 "Unrest Cumhuriye"
 PER_jabheye_melli_ideas_desc:0 "King Reza Pahlavi fled abroad, and Mohammad Mossadegh and his Iranian National Front took over the government, establishing an unstable interim government."
 PER_after_coup:0 "Effect of coup"
 PER_after_coup_desc:0 "The downfall of Mossadegh and the political interference of Britain and the United States have brought enormous political instability to Iran."
 
 FRA_left_union:0 "Union of French lefts"
 FRA_left_union_desc:0 "The French Socialist Party, French Communist Party, and National Republican Movement form a three party ruling coalition."
 CSA_shounting:0 "Southern right Hurrah!"
 CSA_shounting_desc:0 "Hurrah! Hurrah!\nFor Southern rights, hurrah!\nHurrah for the Bonnie Blue Flag that bears a single star."
 KKK_Revolt:0 "Racist Revolt"
 Blakcs_Revolution:0 "Negro Liberation Revolution"
 KKK_ideas:0 "Unrest of whites racists"
 jimmClound_ideas:0 "Jim Crow laws"
 jimmClound_ideas_desc:0 "Although the American Civil War ended slavery, restrictions on black rights still existed widely. During the Reconstruction period, a series of laws passed in the South established the principle of "segregation but equality". The public facilities and schools used by black and white people were separated, and the quality of facilities used by different races often varied greatly. Essentially, there was still a serious social hierarchy between white and colored people."
 LeopoldCrisis:0 "Leopold Crisis"
 LeopoldCrisis_desc:0 "Leopold III's pro Nazi tendencies during World War II made him a target of public criticism in Belgium, and the fate of the king became the center of political struggle in post-war Belgium"
 korean_christ:0 "Christian influence in Korea"
 korean_christ_desc:0 "Christianity was introduced to Korea in the 19th century and was welcomed by intellectuals and the upper class. During the Japanese colonial period, Christian progressives led the independence movement, and when Korea gained independence with the support of the United States, Christianity gained tremendous influence in Korean society."
 korean_culture:0 "Classical culture"
 korean_culture_desc:0 "Under the influence of the Bones System of the Silla Dynasty, the aristocratic system of the Korean Dynasty and Confucianism from China, Koreans attach great importance to the social hierarchy, and everyone should act in accordance with their own identity."
 rok_parliament:0 "Rights of Parliament senators"
 rok_parliament_desc:0 "South Korean parliamentarians have enormous political power, controlling the review of social and economic budgets and bills for their own benefit, even during the period of military dictatorship."
 kor_industrial_pionners:0 "Industrial pioneers"
