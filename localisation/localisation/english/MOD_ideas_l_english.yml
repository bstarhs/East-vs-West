 ENG_immigrate_ideas:0 "Foreign Immigrate"
 ENG_immigrate_ideas_desc:0 "Immigrants from former colonies such as India, Africa, and Jamaica entered the UK as laborers, which not only solved the problem of labor shortage in the UK, but also caused social problems and dissatisfaction among some conservatives."
