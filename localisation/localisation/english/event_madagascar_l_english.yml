l_english:
 mad.1.t:0 "Madagascar Uprising!"
 mad.1.d:0 "A group of Madagascar rebels have attacked multiple plantations in the area. The rebels claim to be from the Madagascar People's Liberation Movement, which aims to expel all French people from Madagascar. According to our investigation, these rebels have significant influence in rural areas and may be influenced by communism."
 mad.1.a:0 "The decolonization movement is developing."
 
 mad.2.t:0 "Madagascar Uprising!"
 mad.2.d:0 "Madagascar rebels have organized an armed force to launch an attack on us!"
 mad.2.a:0 "Foda-se comunista!"
 
 mad.3.t:0 "[FROM.GetName] was suppressed"
 mad.3.d:0 "Under the strong suppression of the French army, the armed forces led by [FROM.GetName] were defeated, and survivors were forced to flee underground."
 mad.3.a:0 "OK"
 
 mad.4.t:0 "The War of Independence in Madagascar has erupted!"
 mad.4.d:0 "With the comprehensive attack of Madagascar's independence armed forces on French strongholds, the Madagascar War of Independence has begun! The leaders of the Malagasy People's Liberation Movement, the Malagasy National Liberation Front, and the Alliance for Comprehensive Independence of Madagascar have announced that the time has come to liberate the country from French rule for over three hundred years. The French government has issued a tough announcement, announcing that it will spare no effort to defend Madagascar!"
 mad.4.a:0 "OK"