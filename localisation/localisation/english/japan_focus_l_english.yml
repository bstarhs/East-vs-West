 tanaka_faction:0 "Tanaka Faction"
 JAP_Judgment:0 "Tokyo Trial"
 JAP_Judgment_desc:0 "The Japanese warlords and politicians who launched the war of aggression must get what they deserve, so as to deter the remaining militarism."
 JAP_Humanity_Declaration:0 "secular declaration"
 JAP_remove_emperor:0 "Abolish the Imperial"
 JAP_reserved_emperor:0 "Preserve the real power of the emperor"
 JAP_reconstruction_rightwing:0 "Right-wing revival"
 JAP_Revitalize_nationalism:0 "New militarism"
 JAP_Revitalize_nationalism_desc:0 "Americans want to turn our nation into powerless water, which is unacceptable. Without the spirit of martial arts, Japanese people cannot survive and must regain respect for military personnel."
 JAP_freed_warcrimeer:0 "Release war criminals"
 JAP_execute_warcrimer:0 "Executing war criminals"
 JAP_Military_Pension:0 "Support for right-wing groups"
 JAP_YASUKUNI:0 "Rebuilding the Yasukuni Shrine"
 JAP_warcrimeer_adivisor:0 "Inviting old officers to join JSDF"
 JAP_new_army:0 "National Defense Force"
 JAP_new_army_desc:0 "The threat of war continues to worsen, and relying solely on self-defense forces cannot defend the country. A formal army that is not subject to the so-called peace constitution can protect Japan."
 JAP_Privazed:0 "Privatization of state-owned enterprises"
 JAP_Privazed_desc:0 "The oil crisis has dealt a heavy blow to Japan and many countries, and our finances are insufficient to support the operations of some large state-owned enterprises. Some countries in Europe and America have overcome difficulties through privatization reforms, which is worth trying."
 JAP_Vindicated_crime:0 "Denial of war crimes"
 JAP_against_communist:0 "Peace Preservation Law"
 JAP_against_communist_desc:0 "The strength of the Communist Party of Japan is constantly growing, and there is a possibility of seizing power at any time. Americans and right-wing forces hope to take measures against them."
 JAP_breakwater:0 "Breakwaters in Asia"
 JAP_breakwater_desc:0 "After the CPC seized power in Chinese Mainland, communism threatened free countries in the Asia Pacific region. We will unite with them to meet the challenges."
 JAP_Northern_Islands:0 "Claime of Kuril Islands"
 JAP_Northern_Islands_desc:0 "The treaty signed between Japan and Russia designated the Kuril Islands as belonging to Japan, but the Soviet Union occupied the area after World War II, and the Japanese government did not abandon its territorial claims to the area."
 JAP_Republic:0 "Towards the Republic"
 JAP_Republic_desc:0 "The Eternal Line of the Emperor is nothing but a myth of the ruling class, and the failure of the war marks the incompetence of the Emperor's regime and their dereliction of duty to the people. The rule of the Yamato Dynasty should come to an end, and a democratic republic is about to arrive in Japan."
 JAP_peace_constitution:0 "Peace Constitution"
 JAP_peace_constitution_desc:0 "Japan has lost too much in the war, and only by permanently giving up the right to war and rearm can peace be achieved on this land."
 JAP_Promote_democracy:0 "Democratization"
 JAP_Promote_democracy_desc:0 "Japan was once an authoritarian country controlled by warlords and chaebols, but now these ruling classes have been overthrown. Japan is about to move towards democratization, and the people will receive the political rights they deserve."
 JAP_accept_communist:0 "Accept communism"
 JAP_accept_communist_desc:0 "The Communist Party of Japan was brutally suppressed by the authorities during World War II. After World War II, they were able to regain freedom of movement and gained support from the working class. Now they hope to enter the government."
 JAP_pro_socialist:0 "Socialism"
 JAP_pro_socialist_desc:0 "The socialist movement in Japan had already emerged as early as the Meiji period, and the Taisho era continued to grow. After World War II, the influence of various socialist factions such as the labor and peasant factions rapidly expanded and actively participated in political activities."
 JAP_kill_Emeror:0 "Social reform"
 JAP_kill_Emeror_desc:0 "To change Japan, it is not only necessary to reform politics, but also to reform ideas. Emperor worship, hierarchy, and gender discrimination are still etched in the minds of Japanese people, and now they need to be eliminated."
 JAP_Yoshida_Idea:0 "Yoshida Doctrine"
 JAP_Yoshida_Idea_desc:0 "Japanese Prime Minister Yoshida Shigeru put forward Japan's post-war development line, that is, light armaments, heavy economy, and focus on economic construction. The military can be handed over to the United States."
 JAP_people_republic:0 "People's Republic"
 JAP_democratic:0 "Rebuilding democratic politics"
 JAP_SanFrancisco_treaty:0 "San Francisco Treaty"
 JAP_SanFrancisco_treaty_desc:0 "Although Japan has already lost the war, its state of war with other countries has not yet fully ended in legal terms. If Japan wants to return to the international community, it needs to sign contracts with other countries in writing to deal with the remaining issues of the war."
 JAP_end_occup:0 "Ending US regulation"
 JAP_end_occup_desc:0 "The United States used the United Nations Command to control Japan's politics. Now that the war has ended for many years and the democratization of Japan has been basically completed, it is time to end American control."
 JAP_third_worlds:0 "The Third World"
 JAP_third_worlds_desc:0 "Under the vigorous decolonization, many emerging countries in Asia and Africa were born, and Japan needs to establish relations with them as soon as possible, not only to improve our international status, but also to open up overseas markets."
 JAP_shakaito:0 "Socialist Party"
 JAP_shakaito_desc:0 "The Socialist Party was a caravan party established after World War II, composed of various left-wing non Liberal Democratic Party members, and its influence rapidly expanded in the 1950s."
 JAP_Pro_America:0 "Relations with Americans"
 JAP_Pro_America_desc:0 "The United States conquered Japan with powerful force, and during the Cold War, Japan became the forefront of the United States. Whether Japan is willing or not, it must establish good relations with the Americans, which is also to gain the support of Washington."
 JAP_Pro_Taiwan:0 "Relations with Taiwan"
 JAP_Korea_relationship:0 "Relations with South Korea"
 JAP_Korea_relationship_desc:0 "As Japan's first annexation country, South Korea's relationship with Japan remains extremely poor, but under the threat of communism and various political and economic needs, Japan and South Korea still have reasons to come together."
 JAP_security_accord:0 "Japan US Security Treaty"
 JAP_okinawa_base:0 "Retrieving the Okinawa"
 JAP_Police:0 "Police Reserve"
 JAP_Police_desc:0 "Although the US authorities have been trying to completely disarm Japan, as the threat of communism becomes increasingly severe, it is ultimately necessary for the Japanese to pick up their guns again."
 JAP_JSDF:0 "Japan Self Defense Force"
 JAP_JSDF_desc:0 "Japan's rearmament has gradually begun, and now we need to turn them into a true armed force."
 JAP_economic:0 "Revitalizing the economy"
 JAP_Revenue_growth:0 "Income doubling programme"
 JAP_Revenue_growth_desc:0 "The National Income Doubling Plan is a plan proposed by Japan in its 1956 Economic White Paper, which aims to increase the economic income of all citizens several times within two years."
 JAP_Jinmu_boom:0 "Jinmu boom"
 JAP_Military_industry:0 "Revitalizing Military Industry"
 JAP_Plaza_Accord:0 "Encourage investment"
 JAP_Plaza_Accord_desc:0 "When the Plaza Accord makes the yen appreciate and the development of the manufacturing industry is blocked, the demand for investment in land and stocks will greatly increase. Appropriate support may be beneficial to our economy."
 JAP_remove_militarism:0 "De militarism"
 JAP_remove_Yasukuni:0 "Demolition of Yasukuni Shrine"
 JAP_remove_Yasukuni_desc:0 "The Yasukuni Shrine is a shrine located in the center of Tokyo, dedicated to all the war dead soldiers from the Meiji Restoration to World War II. In the eyes of Japanese democrats, it is a symbol of militarism."
 JAP_remove_Amrcia:0 "Expel American Troops"
 JAP_reback_Pacific:0 "Returning to the Pacific"
 JAP_New_Empire:0 "The Second Empire of Great Japan"
 JAP_china_relationship:0 "Relations with Peking"
 JAP_remove_tycoon:0 "Eradicate the Oligarch"
 JAP_Peace_with_soviet:0 "Normalization of Soviet relations"
 JAP_Pro_chisov:0 "Close to Eastern"
 JAP_Remodeling_Japan:0 "Japanese Transformation Theory"
 JAP_Remodeling_Japan_desc:0 "The Japan Reform Theory was a grand plan proposed by Japanese Prime Minister Kakuei Tanaka during his tenure, aiming to promote rural development and alleviate pressure on the capital Tokyo through large-scale infrastructure construction nationwide. However, this plan was defeated due to the oil crisis."
 JAP_non_nuke:0 "Three Principles of Non Nuclear"
 JAP_non_nuke_desc:0 "The Three Principles of Non Nuclear Power is a policy proposed by Japanese Prime Minister Rongzuo Sato regarding the use of nuclear energy, which states that Japan does not manufacture, possess, or research nuclear weapons."
 history_japan_invasion:0 "History of Japanese Aggression"
 JAP_Pacific_belt:0 "Pacific Industrial Belt"
 JAP_Shingansen:0 "Shinkansen Line"
 JAP_Shingansen_desc:0 "Shinkansen is the name given to a series of electrified railways manufactured by Japan in the 1960s and 1980s. The earliest Tokai Main Line was built in 1967, connecting Osaka from Tokyo. The Shinkansen not only greatly promoted population mobility between the east and west of Japan, but also represented the world's most advanced level of electric railway technology at that time."
 JAP_LDP_forever:0 "Eternal 1955 System"
 JAP_LDP_forever_desc:0 "After the establishment of the Liberal Democratic Party in 1955, the Japanese parliament was in a long period of confrontation under the monopoly of the Liberal Democratic Party, with numerous small parties occupying the other half, known as the 1955 system. The 1955 system is a synonym for the Liberal Democratic Party's domination of Japanese politics, which lasted until the rise of the Social Democratic Party in 1994."
 JAP_semiconductor:0 "Developing semiconductors"
 JAP_semiconductor_desc:0 "Computers are one of the fastest growing and most significant scientific and technological advancements in the second half of the 20th century. To become a manufacturing and technological powerhouse, we must master the semiconductor industry."
 JAP_JSDF_naval:0 "Maritime Self Defense Force"
 JAP_JSDF_naval_desc:0 "As an island country, naval construction has been the top priority of Japan's military since the Meiji period. Fortunately, the Japanese Imperial Navy was not severely emasculated after World War II. Now we need to rebuild a strong naval force with the Maritime Self Defense Force."
 JAP_JSDF_airforce:0 "Air Self Defense Force"
 JAP_korea_research:0 "Three Vector Research"
 JAP_korea_research_desc:0 "The Three Vector Research is a war prophecy made by some right-wing elements in the Japanese Self Defense Forces in the 1970s, which envisioned that if North Korea invaded South Korea, the Japanese Self Defense Forces would send ground troops into the Korean Peninsula. This means that Japan must expand its armed forces in response to the situation in North Korea and may engage in foreign military intervention in violation of the Peace Constitution."
 JAP_Tokyo_construction:0 "Tokyo Construction"
 JAP_Tokyo_construction_desc:0 "With the rapid growth of Japan's economy and the continuous development of the capital Tokyo, the large-scale population growth and urbanization require Tokyo to carry out larger scale construction to adapt."