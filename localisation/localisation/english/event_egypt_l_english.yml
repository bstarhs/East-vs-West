l_english:
 egy.1.t:0 "Egyptian revolution!"
 
 egy.2.t:0 "Egyptian civilwar!"
 
 egy.3.t:0 "Egypt nationalized the Suez Canal"
 
 egy.4.t:0 "[FROM.GetName] plans war on Egypt"
 
 egy.5.t:0 "Suez Canal War!"
 egy.5.d:0 "Because of dissatisfaction with the Egyptian government's forced recovery of sovereignty over the Suez Canal, Britain and Israel have sent troops to invade Egypt!"
 
 egy.6.t:0 "Warning from [FROM.GetName]"
 egy.6.d:0 "[FROM.GetName]is very dissatisfied with our military intervention in the Suez Canal. They have put forward a resolution at the United Nations asking us to withdraw from Egypt."
 
 egy.7.t:0 "[FROM.GetName]withdrawal from Egypt"
 egy.7.d:0 "Under the pressure of the United Nations and the United States and the Soviet Union, [FROM.GetName] was forced to withdraw from Egypt, which marked the failure of [FROM.GetName] in its attempt to maintain its political presence in the Middle East and Africa and the collapse of its colonial empire."
 
 egy.8.t:0 "Israel withdraws from Suez Canal"
 egy.8.d:0 "Under the pressure of the United Nations, the Israeli army withdrew from Egypt, marking the failure of Israel's military action to occupy the southwest Peninsula and curb Egypt with the support of Britain and France."
 
 egy.13.t:0 "Egypt invites us to join the United Arab Republic"
 egy.13.d:0 "Cairo sent us a message inviting us to join the United Arab Republic in order to achieve the unity of the Arab world."
 
 egy.14.t:0 "[FROM.GetName] has joined United Arab Republic"
 egy.14.d:0 "[FROM.GetName] has join the United Arab Republic to achieve the unity of the Arab world."
 
 egy.17.t:0 "The rise of Arab Nationalism"
 egy.17.d:0 "With Egypt's political victory in the Suez Canal War, Egyptian President Nasser became a hero in the whole Arab world. Nasser not only inspired the morale of the Arab people, but also welcomed the Arab nationalism advocating the expulsion of foreign colonial infiltration and the realization of Arab national unity and rejuvenation by many Arab intellectuals."
 
 egy.20.t:0 "Egypt's plan"
 egy.20.d:0 "Egypt has decided to go to war with Israel to recapture the Sinai Peninsula. The other side invited us to launch simultaneous attacks on the Golan Heights to form two bread and cheese against Israel."
 
 egy.21.t:0 "Yom Kippur War!!!"
 egy.21.d:0 "[FROM.GetName] launched a surprise attack on Israel on the Yom Kippur to recapture the lost land!"
 Yom_lippur_war:0 "Yom Kippur War"

 egy.22.t:0 "Egypt declares its will for peace"
 egy.22.d:0 "President [EGY.GetLeader] of Egypt believed that after a series of wars, it was impossible to eliminate Israel. The Egyptian government decided to change its policy and seek reconciliation with Israel."
 Egy_Isr_relation:0 "PEact treaty"
 
 egy.23.t:0 "The United Nations demands a ceasefire!"
 egy.23.d:0 "The United Nations demands that we immediately establish a ceasefire with Egypt based on the current front!!"
 egy.23.a:0 "We have no other choice."
 
 egy.24.t:0 "Israel Accepts Ceasefire"
 egy.24.d:0 "At the request of the United Nations, Israel was forced to accept a ceasefire with Egypt. Although the Egyptian army was unable to recapture the Sinai Peninsula, its achievements in breaking through the Palev Line and annihilating the main force of the Israeli army won the applause of the world, breaking the myth of Israel's invincibility, and once again uniting the Arab world."
 egy.24.a:0 "The situation in the Middle East has reversed."
 
 egy.25.t:0 "Israel Accepts Ceasefire"
 egy.25.d:0 "At the request of the United Nations, Israel was forced to accept a ceasefire with Egypt. Under the fierce attack of the Egyptian army, the Israeli army was completely defeated, and the Egyptian army recaptured the Sinai Peninsula in one fell swoop. Egypt's achievements have won the applause of the world, shattered the myth of Israel's invincibility, and once again united the Arab world."
 egy.25.a:0 "The situation in the Middle East has reversed."
 
 egy.26.t:0 "Egypt breaks through the Balev Line!"
 egy.26.d:0 "The Egyptian army broke through the indestructible Palev Line, which Israel had been operating for many years, and boarded the east bank of the Suez Canal!"
 egy.26.a:0 "The situation in the Middle East has reversed."
 
 egy.27.t:0 "埃及与以色列签订戴维营协议！"
 egy.27.d:0 "埃及总统与以色列总理在美国签订和平协议，宣布两国几十年的敌对状态结束。"
 egy.27.a:0 "The situation in the Middle East has reversed."
 
 egy.28.t:0 "[FROM.GetName]拒绝加入阿拉伯联合共和国！"
 egy.28.d:0 "[FROM.GetName]与[EGY.GetName]就两国合并一事的谈判以失败告终，[FROM.GetName]拒绝加入阿拉伯联合共和国！"
 
 egy.30.t:0 "埃及政府出台新外交政策！"
 egy.30.d:0 "[EGY.GetName]领导人在今日的一次讲话中表示，该国政府正寻求与美国建立良好关系，共同对抗共产主义“挑战”。"
 
 egy.31.t:0 "埃及寻求与英国改善关系！"
 egy.31.d:0 "[EGY.GetName]领导人在今日的一次讲话中表示，该国政府正寻求与英国建立良好关系，共同对抗共产主义“挑战”。"
 
 egy.32.t:0 "[EGY.GetName]宣布放弃对苏丹的主权！"
 egy.32.d:0 "[EGY.GetName]政府正式宣布放弃对苏丹地区的主权，并支持其独立！此前该地区名义上由埃及和英国共管。观察家认为，埃及此举旨在换取英国在苏伊士运河问题上的让步。"
 
 egy.33.t:0 "[EGY.GetName]宣布加入英联邦！"
 egy.33.d:0 "[EGY.GetName]政府已正式加入英联邦，并希望与伦敦建立更加牢固的关系！"
 
 egy.34.t:0 "[EGY.GetName]提出有关苏伊士运河问题的谈判"
 egy.34.d:0 "[EGY.GetName]政府已正式向我国提出外交交涉，要求全面收回苏伊士运河的控制权和运营权。"
 
 egy.35.t:0 "英国拒绝归还苏伊士运河"
 egy.35.d:0 "英国与[EGY.GetName]两国政府就苏伊士运河问题的谈判破裂，英国拒绝移交苏伊士运河区的主权和管理权。"
 
 egy.36.t:0 "英埃签订苏伊士运河新条约"
 egy.36.d:0 "英国与[EGY.GetName]两国政府经过艰难谈判，终于就苏伊士运河问题达成了最终协议。英国宣布，将在协议签署若干个月后，正式向[EGY.GetName]移交苏伊士运河及周边地区的主权和管理权。"
 
 egy.37.t:0 "苏伊士运河回归[EGY.GetName]"
 egy.37.d:0 "随着英国国旗在塞得港缓缓降下，英国对苏伊士运河长达七十多年的占领宣告结束，[EGY.GetName]的士兵接管塞得港，正式宣布恢复对苏伊士运河行使主权。"
 
 egy.38.t:0 "英埃签订苏伊士运河新条约"
 egy.38.d:0 "在巨大争议中，英国与[EGY.GetName]政府签署了苏伊士运河的新条约，开罗方面同意英国继续管理苏伊士运河10年，这引发了埃及国内巨大的热议。"
 
 egy.39.t:0 "反对新运河条约的游行示威"
 egy.39.d:0 "埃及群众在开罗、亚历山大、伊斯梅利亚等城市发起游行示威，反对新的苏伊士运河条约，指责埃及现政府无能且卖国。"
 
 egy.40.t:0 "[EGY.GetName]请求加入中央条约组织"
 egy.40.d:0 "[EGY.GetName]外交部向我们发来信息，希望能加入中央条约组织。"
 
 egy.41.t:0 "英国拒绝我们加入中央条约组织"
 egy.41.d:0 "英国拒绝我们加入中央条约组织"
 
 egy.42.t:0 "埃及政府发起纠正运动"
 egy.4d.t:0 "[EGY.GetName]领导人[EGY.GetLeader]宣布，埃及政府已决定通过一系列新法案和人事变动，来全面修改埃及现有的内外政策，其中包括放弃大阿拉伯主义、放弃与以色列的全面对抗，并解除依然支持这些政策的高官的职务。[EGY.GetLeader]解释，随着埃及与以色列实现和解，该国的内外政治决策需要进行重大改变，以适应未来的新环境，但阿拉伯国家和埃及国内的反对派指责，这不过是埃及政府对阿拉伯盟友和阿拉伯主义背叛的一部分，"
 
 egy.43.t:0 "[EGY.GetName]寻求与伊朗改善关系"
 egy.43.d:0 "[EGY.GetName]外交部门宣称，该国正寻求与伊朗改善外交关系"
 
 egy.44.t:0 "埃及寻求与沙特改善关系"
 egy.44.d:0 "[EGY.GetName]外交部门宣称，该国正寻求与沙特阿拉伯改善外交关系"
 
 egy.45.t:0 "穆斯林兄弟会的崛起"
 egy.45.d:0 "随着埃及进行政治改革以转向政治多元化，许多政党开始壮大并积极参与政治。埃及穆斯林兄弟会在最近的政治局势中迅速崛起，他们是一支由保守派知识分子组成的保守政党，他们认为埃及未来的政治道路应当遵循《古兰经》的原则，反对社会和经济的过度改革。领导人库特布认为，埃及只有坚持伊斯兰教的教义，优先追群稳定，反对共产主义和自由主义的渗透。才能在两级对抗中保护自己。"
 
 egy.46.t:0 "华夫脱党的崛起"
 egy.46.d:0 "随着埃及进行政治改革以转向政治多元化，许多政党开始壮大并积极参与政治。华夫脱党在最近的政治局势中迅速崛起，该党是埃及最早创立的政党之一，党名Waft意为“组织”。该党派由社会精英阶层组成，其中大部分是旧王国时代的权贵。华夫脱党支持实行君主立宪制度，抑或稳步走向共和制，并维持现有的政治局面，从而保证国家在稳定中走向现代化，"
 
 egy.47.t:0 "穆斯林兄弟会赢得埃及议会选举！"
 egy.47.d:0 "随着埃及大选落幕，穆斯林兄弟会赢得了埃及议会的选举！"
 
 egy.48.t:0 "华夫脱党赢得埃及议会选举！"
 egy.48.d:0 "随着埃及大选落幕，华夫脱党赢得了埃及议会的选举！"

 egy.49.t:0 "埃及宣布进行君主立宪改革"
 egy.49.d:0 "埃及政府正式宣布，即将颁布新宪法，以改革君主立宪制度。新的埃及宪法将加强议会和内阁的权力，进行更广泛的民主选举，并限制国王的权力。"
 
 egy.50.t:0 "法鲁克一世宣布退位"
 egy.50.d:0 "埃及政治局势日渐复杂，法鲁克一世国王在各个政治势力压力下，被迫正式宣布退位。"
 
 egy.51.t:0 "法鲁克二世即位"
 egy.51.d:0 "在埃及国王法鲁克一世退位后，还是婴儿的法鲁克二世即位，埃及摄政委员会宣布接管权力。"
 
 egy.52.t:0 "埃及议会向约旦国王发出邀请"
 
 egy.53.t:0 "约旦国王拒绝埃及王位"
 
 egy.54.t:0 "约旦国王抵达开罗"
 egy.54.d:0 "约旦国王[JOR.GetLeader]已乘坐专机抵达开罗，受埃及议会邀请，作为先知穆罕默德后裔、著名的哈希姆家族成员的[FROM.GetLeader]将取代阿里王朝，接过埃及君主的地位。"
 
 egy.55.t:0 "法鲁克二世退位"
 egy.55.d:0 "埃及政治局势日渐复杂，法鲁克二世退位国王在各个政治势力压力下，被迫正式宣布退位。"
 
 egy.56.t:0 "[FROM.GetLeader]继任为埃及国王"
 
 egy.57.t:0 "埃及-约旦合并法案正式通过"
 egy.57.d:0 "哈希姆家族的[JOR.GetLeader]已乘坐专机抵达开罗，受埃及议会邀请，作为先知穆罕默德后裔、著名的哈希姆家族成员的[FROM.GetLeader]将取代阿里王朝，接过埃及君主的地位。"
 
 egy.58.t:0 "[FROM.GetName]发起阿拉伯民族复兴运动"
 
 egy.59.t:0 "阿拉伯复兴党的崛起"
 egy.59.d:0 "随着埃及进行政治改革以转向政治多元化，许多政党开始壮大并积极参与政治。阿拉伯复兴党在最近的政治局势中迅速崛起，该党是由受到社会主义影响的精英阶级组成，他们主张反对西方帝国主义和苏联共产主义的干涉，反对君主制，建立社会主义政治体系，促使国家走向现代化和世俗化，同时该党也支持阿拉伯统一和阿拉伯民族主义。"
 
 egy.60.t:0 "埃及政府提出三环外交理论"
 
 egy.61.t:0 "埃及民族主义的崛起"
 egy.61.d:0 "[EGY.GetName]在[EGY.GetLeader]的领导下，收复苏伊士运河，建立了强大的军队和经济，使得埃及的民族主义高涨。"
 
 egy.62.t:0 "埃及提出建立阿拉伯联盟"
 
 egy.63.t:0 "[FROM.GetName]表态支持阿拉伯联盟"
 
 egy.64.t:0 "埃及宣布支持非洲反殖民运动"
 egy.64.d:0 "[FROM.GetName]已发表公开声明，正式宣布支持非洲各国热火朝天的反殖民独立运动。开罗方面表示，该国将为反对帝国主义殖民统治的非洲人民提供必要的援助。"
 
 egy.65.t:0 "埃及宣布支持黎巴嫩革命阵线"
 egy.65.d:0 "[FROM.GetName]已发表公开声明，正式宣布支持非洲各国热火朝天的反殖民独立运动。开罗方面表示，该国将为反对帝国主义殖民统治的非洲人民提供必要的援助。"
 
 egy.66.t:0 "埃及政府希望与非洲国家改善关系"
 
 egy.67.t:0 "埃及要求与苏丹统一"
 egy.67.d:0 "埃及政府发布关于苏丹问题的声明，埃及人认为苏丹是埃及领土的一部分，要求英国放弃苏丹以实现埃及领土的统一。"
 
 egy.68.t:0 "英国拒绝埃及与苏丹的统一"
 egy.68.d:0 "英国拒绝了埃及有关苏丹问题的要求，并表示将按照自己的政策处理苏丹问题。"
 
 egy.69.t:0 "苏丹反英暴动"
 egy.69.d:0 "苏丹爆发反对英国统治的暴动！"
 
 egy.70.t:0 "苏丹爆发全面叛乱！"
 egy.70.d:0 "苏丹解放阵线在苏丹各地发动起义！他们宣称将会发动一场将苏丹从英国殖民统治下解放出来的战争！"
 
 egy.71.t:0 "苏丹独立战争爆发"
 egy.71.d:0 "苏丹解放阵线在苏丹各地发动起义！他们宣称将会发动一场将苏丹从英国殖民统治下解放出来的战争！"
 
 egy.72.t:0 "英国撤离苏丹！"
 
 egy.73.t:0 "埃及介入苏丹战争！"
 
 egy.74.t:0 "苏丹宣布与埃及统一！"
 egy.74.d:0 "经过艰难的政治斗争，苏丹正式宣布与埃及合并，埃及领导人[EGY.GetLeader]抵达喀土穆，正式宣布苏丹已成为埃及不可分割的一部分。"
 
 egy.75.t:0 "埃及政府表态批判君主制！"
 egy.75.d:0 "[EGY.GetLeader]发表措辞严厉的声明，指责其他阿拉伯国家中的君主制政权敌视且试图颠覆新生的共和国政权。[EGY.GetLeader]领导人指出，君主制与君主已成为出卖阿拉伯人民利益的叛徒集团和帝国主义的傀儡，呼吁阿拉伯各国人民站起来推翻君主制度。"
 
 egy.76.t:0 "埃及政府表态支持阿拉伯革命！"
 egy.76.d:0 "[EGY.GetLeader]发表声明，表态支持阿拉伯国家中不断壮大的共和主义革命。[EGY.GetLeader]领导人指出，君主制与君主已成为出卖阿拉伯人民利益的叛徒集团和帝国主义的傀儡，呼吁阿拉伯各国人民站起来推翻君主制度。"
 
 egy.77.t:0 "埃及政府在苏丹推行新的文化政策"
 egy.77.d:0 "[EGY.GetLeader]宣布，该国已决定在苏丹地区推行新的文化政策，以引导该地区人民认同阿拉伯文化。"
 
 egy.78.t:0 "埃及政府在苏丹推行新的语言政策"
 egy.78.d:0 "[EGY.GetLeader]宣布，该国已决定在苏丹地区推行新的语言政策，阿拉伯语和阿拉伯文字将成为苏丹唯一的官方语言，而南方黑人民族的语言文化将被从教育和行政中剔除。"
 
 egy.79.t:0 "埃及政府在苏丹推行新的宗教政策"
 egy.79.d:0 "[EGY.GetLeader]宣布，该国已决定在苏丹地区推行新的宗教政策，伊斯兰教的教义和思想将被纳入苏丹地区的教育和社会体系，而南方的基督教将被打压。"
 
 egy.80.t:0 "苏丹南部爆发示威游行"
 
 egy.81.t:0 "埃及政府表态支持约旦共和派！"
 egy.81.d:0 "[EGY.GetLeader]发表声明，表态支持约旦不断壮大的共和主义革命。[EGY.GetLeader]领导人指出，君主制与君主已成为出卖阿拉伯人民利益的叛徒集团和帝国主义的傀儡，呼吁阿拉伯各国人民站起来推翻君主制度。"
 
 egy.82.t:0 "埃及政府表态支持也门共和派！"
 egy.82.d:0 "[EGY.GetLeader]发表声明，表态支持也门不断壮大的共和主义革命。[EGY.GetLeader]领导人指出，君主制与君主已成为出卖阿拉伯人民利益的叛徒集团和帝国主义的傀儡，呼吁阿拉伯各国人民站起来推翻君主制度。"
 
 egy.83.t:0 "埃及政府表态支持沙特共和派！"
 egy.83.d:0 "[EGY.GetLeader]发表声明，表态支持沙特不断壮大的共和主义革命。[EGY.GetLeader]领导人指出，君主制与君主已成为出卖阿拉伯人民利益的叛徒集团和帝国主义的傀儡，呼吁阿拉伯各国人民站起来推翻君主制度。"
 
 egy.84.t:0 "埃及向的共和派提供援助！"
 
 egy.85.t:0 "埃及政府在苏丹推行新的人口政策"
 
 egy.86.t:0 "阿拉伯联合共和国发布新的民族政策"
 
 egy.87.t:0 "阿拉伯联合共和国发布宽容的民族政策"
 
 egy.88.t:0 "[FROM.GetName]宣布驱逐苏丹非阿拉伯人口！"
 
 egy.89.t:0 "[FROM.GetName]颁布科普特人的新政策！"
 egy.89.d:0 "[EGY.GetLeader]宣布，该国已决定推行新的民族政策，阿拉伯语和阿拉伯文字将成为该国唯一的官方语言，以引导该地区人民认同阿拉伯文化，而科普特的语言文化将被从教育和行政中剔除。"
 
 egy.90.t:0 "[FROM.GetName]颁布柏伯尔人的新政策！"
 egy.90.d:0 "[EGY.GetLeader]宣布，该国已决定在北非推行新的民族政策，阿拉伯语和阿拉伯文字将成为全国唯一的官方语言，以引导该地区人民认同阿拉伯文化，而柏伯尔的语言文化将被从教育和行政中剔除。"
 
 egy.91.t:0 "[FROM.GetName]颁布阿拉米人的新政策！"
 egy.91.d:0 "[EGY.GetLeader]宣布，该国已决定在近东推行新的民族政策，阿拉伯语和阿拉伯文字将成为全国唯一的官方语言，以引导该地区人民认同阿拉伯文化，而阿拉米的语言文化将被从教育和行政中剔除。"
 
 egy.92.t:0 "[FROM.GetName]颁布库尔德人的新政策！"
