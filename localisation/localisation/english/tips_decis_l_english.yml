l_english:
 tops_efforts:0 "Game guides"
 
 tops_efforts_buy_resource:0 "How do I purchase strategic resources?"
 tips.1.t:0 "How do I purchase strategic resources?"
 tips.1.d:0 "Please click on the production interface in the upper left corner of the screen, and then select import and export resources according to your needs."
 tips.1.a:0 "OK"
 
 tops_efforts_finance:0 "How do I get funding?"
 tips.2.t:0 "How do I get funding?"
 tips.2.d:0 "This mod designs a fiscal and economic system, where you can obtain funds through exporting resources through the production interface in the upper left corner of the screen, or open the consumer goods button interface to invest factories in production activities and generate taxes. Factories can only provide taxes when producing goods. Excess funds can be converted into political points, and fiscal shortfall will result in punishment."
 tips.2.a:0 "OK"
 
 tops_efforts_crack:0 "Why does the game get stuck every few days?"
 tips.3.t:0 "Why does the game get stuck every few days?"
 tips.3.d:0 "This is due to the inability of the game's numerical calculation to support the newly added system of mods. The production, consumption, power generation, food, and financial systems used by mods all require a large amount of computation, while the single core computation in Paradox games causes the computation process to lag. We will do our best to address this issue in future updates."
 tips.3.a:0 "OK"
 
 tops_efforts_comsumer:0 "What is the use of the new consumer goods system?"
 tips.4.t:0 "What is the use of the new consumer goods system?"
 tips.4.d:0 "Open the game production interface and on the third consumer goods page, you can use civilian factories for consumer goods production. After meeting the demand, consumer goods can receive additional bonuses and can also be used for export to obtain funds."
 tips.4.a:0 "OK"
 
 tops_efforts_foods:0 "What should we do if there is not enough food?"
 tips.5.t:0 "What should we do if there is not enough food?"
 tips.5.d:0 "Grain is mainly produced through farms, and some technology and national spirit can increase the output of individual farms, or import grain through the production interface, or open the provincial interface to store excess grain and redistribute it."
 tips.5.a:0 "OK"
 
 tops_efforts_power:0 "What to do if there is insufficient electricity?"
 tips.6.t:0 "What to do if there is insufficient electricity?"
 tips.6.d:0 "Provincial electricity is mainly produced through power plants, and some technologies and policies can increase electricity production or consumption. The larger the province, the more buildings it has, and the more electricity it consumes. Electricity production requires coal and fuel, and insufficient coal and fuel can lead to a decrease in electricity generation."
 tips.6.a:0 "OK"
 
 tops_efforts_focus:0 "Why do many focuses lack content?"
 tips.7.t:0 "Why do many focuses lack content?"
 tips.7.d:0 "The production plan of this mod is to be done in chronological order, currently mainly producing content from 1947 to 1950, and the content will be gradually updated thereafter."
 tips.7.a:0 "OK"
 
 tops_efforts_close:0 "Close Answers"