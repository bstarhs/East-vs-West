 nor.20.t:0 "The Soviet Union proposed a friendly treaty to us"
 nor.20.d:0 "The Soviet Union proposed to sign a friendly treaty with us, hoping that we would declare neutrality and not join the Western alliance led by the United States. In exchange, the Soviet Union would respect our neutrality and territorial integrity."

 nor.21.t:0 "Treaty of Soviet Union and Norway"
 nor.21.d:0 "Under the advocacy of the Soviet Union, the Norwegian government signed a friendly peace treaty with Moscow. As part of the treaty, Norway will not join any form of military alliance and become a permanently neutral country."

 nor.22.t:0 "Norway rejects the treaty proposed by the Soviet Union"
 nor.22.d:0 "The Norwegian government rejected the so-called friendly peace treaty proposed by the Soviet Union, which required Norway to become a permanent neutral country. Obviously, the Norwegian government has decided to join a military alliance led by Western countries."