 WDR_Hallstein:0 "Hallstein doctrine"
 WDR_Hallstein_desc:0 "Halstein Doctrine was proposed by West German Foreign Minister Walter Halst, advocating that the West German government represents the entire Germany, does not recognize the legitimacy of Democratic Germany, and does not establish diplomatic relations with members of the Eastern camp who have established diplomatic relations with East Germany."
 WDR_Neo_Ost:0 "Neue Ostpolitik"
 WDR_Neo_Ost_desc:0 "Neue Ostpolitik,the New East pilitic,was first proposed by German Economy Minister Egon Hal, advocating for the normalization of relations with Eastern bloc member states such as East Germany and the Soviet Union."
 WDR_currency_reform:0 "Currency and Tax Reform"
 WDR_Soziale_Marktwirtschaft:0 "Soziale Marktwirtschaft"
 WDR_Soziale_Marktwirtschaft_desc:0 "The social market economy was an economic policy proposed by the Freiburg School of Economics in post-war Germany, which laid the foundation for Germany's post-war economic revival and the Rhine miracle."
