 WDR_law_130:0 "Article 86 of the Criminal Law"
 WDR_law_130_desc:0 "The first paragraph of Article 86 of the German Criminal Law prohibits the use of symbols containing unconstitutional content. Although it does not specify which symbol it is, it is often considered communism or neo-Nazism. With the support of Article 86 of the Criminal Law, the West German government successively banned the German Communist Party and the neo-Nazist German Social Imperialist Party."
 WDR_nuclear:0 "Nuclear Energy"
 WDR_welfare_state:0 "Welfare state"
 WDR_welfare_state_desc:0 "Welfare states are becoming a consensus among post-war Western European countries, utilizing Keynesian economic theory to provide welfare guarantees, stimulate consumption, promote social equality, and attract the working class."
 WDR_economic:0 "Revitalizing the economy"
 WDR_break_effect:0 "Get rid of the influence of defeated countries"
 WDR_remove_allie:0 "Excluding British and American influence"
