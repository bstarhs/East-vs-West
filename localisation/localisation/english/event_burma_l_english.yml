l_english:
 bur.1.t:0 "Aung San was assassinated!"
 bur.1.d:0 "During a meeting between the leader of Burmar's independence movement, Mr. Aung San, and his cabinet members, several thugs armed with submachine guns rushed into the venue and shot them to death! Due to Burmar still under British control, the British authorities have announced that they will conduct a thorough investigation into the perpetrator."
 bur.1.a:0 "What a mess!"
 
 bur.3.t:0 "Burmar declares independence"
 bur.3.d:0 "After experiencing a hundred years of British colonial rule, the Union of Burmar declared independence. The road to independence is difficult, but for the new government of Burmar, how to handle various social and ethnic conflicts within the country is a greater challenge."
 bur.3.a:0 "OK"
 
 bur.5.t:0 "Riots occurred in Karen State"
 bur.5.d:0 "The ethnic minorities in Karen's area are unwilling to merge with Burma and have launched a violent rebellion against us!"
 
 bur.6.t:0 "Karen State Rebellion!"
 bur.6.d:0 "Karen's ethnic minority armed forces launched a surprise attack! They attacked local military and political institutions and proclaimed independence!"
 
 bur.7.t:0 "Karen's state is in rebellion!"
 bur.7.d:0 "Burmese national crisis triggers war! Karen National Liberation Front raided local government institutions, seized power, and declared independence! The Burmese government is mobilizing troops to suppress it!"
 
 bur.8.t:0 "Karen's state is in rebellion!！"
 bur.8.d:0 "Burmese national crisis triggers war! Karen National Liberation Front raided local government institutions, seized power, and declared independence! Burmese's army is forced to withdraw!"