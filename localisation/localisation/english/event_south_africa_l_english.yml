 saf.11.t:0 "South African elections are about to begin!"
 saf.11.d:0 "The South African parliamentary elections are about to begin, with the United Party led by Jan Smuts facing the United Nations Democratic Party led by Daniel Fran ç ois Maran. Observations suggest that the United Nations Democratic Party may have a huge advantage because it focuses on the economic issues of the white class in South Africa and strongly supports racial segregation. However, the United Party has been criticized for its pro British and pro Republican decisions during World War II"
 
 saf.11.t:0 "The Unity Party won the South African elections!"
 
 saf.12.t:0 "The United Nations Democratic Party wins South African elections!"
 saf.12.d:0 "The United Nations Democratic Party wins South African elections!"
 
