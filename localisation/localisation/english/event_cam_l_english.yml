l_english:
 cam.1.t:0 "Cambodia declares autonomy"
 cam.1.d:0 "The French government announced that it would establish its Cambodian protectorate as an autonomous territory under the protection of the French Union, in order to resist the growing Cambodian independence and communist movement."
 cam.1.a:0 "Time to get out of this mess."
 
 cam.2.t:0 "Cambodia declares independence"
 cam.2.d:0 "Cambodian King Sihanouk officially announced at the Royal Palace in Phnom Penh that the Kingdom of Cambodia has finally ushered in independence today after nearly a hundred years of French colonial rule. He will lead the Cambodian people and work together to build a new country."
 cam.2.a:0 "congratulate."
 
 cam.3.t:0 "Cambodian War of Independence"
 cam.3.d:0 "The proclamation of the French colonists' rejection of Cambodian independence angered Cambodian independence forces. Yesterday, they revolted in Siem Reap, occupied the city center, and declared in the temple of Angkor Wat, the symbol of Cambodia, that the war of independence had begun, and that the Cambodian people would fight for their freedom. The French government claims that this is a rebellion influenced by the Vietnamese Communism, and they will put down the rebellion."
 cam.3.a:0 "Let's see what happens"
 
 cam.4.t:0 "Lon Nol's coup!"
 
 cam.5.t:0 "Communist Party of Cambodia launches guerrilla warfare"
 
 cam.6.t:0 "Kampuchea-Vietnam border conflict"
 cam.6.d:0 "Border conflict broke out between Cambodia and Vietnam under the Khmer Rouge rule. Cambodian army invaded Vietnam and killed many residents. Cambodia did not respond to the matter, while the angry Vietnamese government announced that it would take military means to retaliate."
 
 cam.7.t:0 "The Communist Party of Cambodia conquers Phnom Penh"
 cam.7.d:0 "After fierce fighting, the armed forces of the Communist Party of Cambodia captured the capital Phnom Penh. Lon Nol, the head of the Khmer Republic, and his cronies fled. After communist armed forces took control of the entire city, Phnom Penh was cut off from the outside world. CPK leader Pol Pot announced the establishment of Democratic Kampuchea and was ready to implement a complete Communism transformation in the country."
 