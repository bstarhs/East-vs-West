l_english:
can.1.t:0 "The future of Labrador and Newfoundland!"
can.1.d:0 "Labrador and Newfoundland, two territories located at the northeast end of the North American continent, have been ruled by the British Empire for hundreds of years and have never been incorporated into the Canadian Federation. With the rise of decolonization around the world after the end of World War II, there were increasing calls for Labrador and Newfoundland to secede from Britain, and many local people and members of society hoped for independence or integration into Canada."

can.2.t:0 "Britain has decided to maintain its rule over Labrador and Newfoundland"
can.2.d:0 "The British government has responded strongly to the rising Labrador Newfoundland separatist movement, and London has stated that their control over Labrador and Newfoundland will continue."

can.3.t:0 "Labrador and Newfoundland are preparing for a referendum"
can.3.d:0 "The UK has issued a statement deciding to abandon control over Labrador and Newfoundland, and these two regions will hold a referendum at a later date to decide on independence or joining the Canadian Commonwealth."

can.4.t:0 "Labrador and Newfoundland Decide on Independence"
can.4.d:0 "After a referendum, most of the people of Labrador and Newfoundland hope to achieve independence from Britain, but they are also unwilling to join Canada. These two regions will choose a new government and establish a new country."

can.5.t:0 "Labrador and Newfoundland merged into Canada"
can.5.d:0 "After a referendum, the majority of the people of Labrador and Newfoundland chose to leave the UK and join the Canadian Commonwealth."

can.6.t:0 "Canada's claim to Newfoundland"
can.6.d:0 "The Canadian government has issued a statement regarding the development of the situation in the Labrador and Newfoundland regions, and Vancouver hopes that these two regions will merge with Canada to complete the unification of British North America."

can.7.t:0 "Our decision on the crises in Labrador and Newfoundland"
can.7.d:0 "The issue of ownership between Labrador and Newfoundland has led to a diplomatic crisis between Canada and the United Kingdom. As a major power in North America, an ally of both countries, and a leader of the Western world, it is necessary for the United States to take a clear stance on this crisis in order to avoid its impact on the unity of the Western faction."

can.8.t:0 "The United States expresses its attitude towards Labrador and Newfoundland"
can.8.d:0 "The US government has issued a statement opposing Britain's decision to maintain colonial rule in Labrador and Newfoundland, and calling for a referendum to determine the future of the region as soon as possible."

can.9.t:0 "Britain insists on retaining Labrador and Newfoundland"
can.9.d:0 "The UK has harshly criticized the US statement regarding Labrador and Newfoundland, stating that Labrador and Newfoundland have been an integral part of the British Empire since ancient times."

can.10.t:0 "我们对拉布拉多和纽芬兰危机的决定"
can.10.d:0 "我们对拉布拉多和纽芬兰危机的决定"

can.11.t:0 "加拿大宣布放弃拉布拉多和纽芬兰"