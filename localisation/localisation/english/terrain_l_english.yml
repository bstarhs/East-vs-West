 peking_desc:0 "Peking,or Beijing,is capital of the People's Republic of China,it established at BC 5th century,named Yan-Jing,as the capital of Yan kingdom of Chinese warlords era.After Qin unificated China,it became a important fort on the Great Wall.at the 12th centutry,The Jin dynasty which established by Jurchen,select it as their capital,then Mongols taken and explore the city.AD 1352,Emperor Yongle setting his new capital here,changed the mane to Peking,which mean the Nrothern Capital.Since that Peking always the tencer of Chinese pilitic unless 1927-1949."
 shanghai_desc:0 "Shanghai is the biggest city and economic center of China,base on the Yang-tze delta.Shanghai established at Song dynasty,the name meaning The way to the sea,after Opium war 1840,british select it as their trade terminal at eastern China,soon Shanghai became a international port,gethering foreigh businessman,factories and bank.During the WWII,Shanghai invade by Japanese because it's important location,now it still the most development city of China."
 lhasa_desc:0 "Lhasa is the capital and biggest city of Tibet,and it also the most height city in the world.Lhasa siting by the Yarutsambo river,once a name of a tibetan tribe,At the 7th century,King Songtsam Gambo unificated Tibet and select here as his capital.Songtsam Gambo married Chinese princess and converted Buddhism,so Lhasa also became the center of Tibetan religion.AD 1243,Master Pagba,leader of Tibetan Buddhism submit to Mongolds,Khublai Khan appint him as Tibet regent,since that,Tibet became theocracy and Lhasa once again became the center of Tibet."
 seoul_desc:0 "Seoul is the Capital and bigest of Republic of Korea,its old name is Han-Seong,name by the Han river.Seoul rise at the 14th century,first King of Joseon dynasty Yi Seong-gui selcet here as his new capital,the Han-Seong soon to development,and became center of Korea.After Japanese annex Korea 1910,it changed name into Kyeong-Seong,while Korea liberated 1945,it call Seoul,which mean the Capital."
 gyeongju_desc:0 "Geong-Jy is a citry which located at Southeast Korea,it is the dolest city of South Korea.Geong-Ju probaly established at AD1-3th century,as the center of Silu tribe.During the 6th century,Silu rise became Silla Kingdom,and Geyong-Ju became its capital.Geong-Ju left many cultural heritage of Silla era,like biggest Buddhism temple of Korea."
 shengyang_desc:0 "Sheng-Yang is the capital of Liao-Ning province China,it establish at Tang dynasty as a border fort which against northern nomandics.AD 1616,Leader of manchu people Khan Huangtaiji occupied here,changed name to Mukden and declear the foundation of Qing dynasty.After 1859,in order to against Russian invade,Qing start to immigrate chinese people to the Manchuria,the population of Mukden soon be glowing.1912 AD,Mukden control by Fengtian warlord Zhang-Zuolin,After Zhang assassinate,Fengtian taken by Kuomintang.11th Sep 1931,Japanese invade Mukden,then taken Manchuria,after WWII,it changed name to Shen-yang,is the battlefield of Chinese civil war.After The People's republic establish,Shen-yang bcame a important steel industry city."
 tokyo_desc:0 "Geong-Jy is a citry which located at Southeast Korea,it is the dolest city of South Korea.Geong-Ju probaly established at AD1-3th century,as the center of Silu tribe.During the 6th century,Silu rise became Silla Kingdom,and Geyong-Ju became its capital.Geong-Ju left many cultural heritage of Silla era,like biggest Buddhism temple of Korea."