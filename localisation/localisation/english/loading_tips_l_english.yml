l_english:
 LOADING_TIP_0:0 "From Stettin in the Baltic to Trieste in the Adriatic an iron curtain has descended across the Continent.  \n- Winston Churchill"
 LOADING_TIP_1:0 "In short, what we did in Korea was that we tried to prevent World War III.\n- Harry S.Truman, April 16, 1951"
 LOADING_TIP_2:0 "Mr. Gorbachev, open this gate. Mr. Gorbachev, tear down this wall!\n- Ronald Reagan"
 LOADING_TIP_3:0 "It takes money to get this house in the United States, but in our country, you just need to be a citizen of the Soviet Union. If American citizens have no money, they have only the right to sleep on the sidewalk. And you say we are slaves to communism!\n- 24 July 1959，Nikita Khrushchev "
 LOADING_TIP_4:0 "No one wants to build a wall.\n- Walter Ublich, 15 June 1961"
 LOADING_TIP_5:0 "All the Imperialists are paper tiger\n- Mao Ze-Dong，August 6, 1946"
 LOADING_TIP_6:0 "Giraffes are heartless creatures"
 LOADING_TIP_7:0 "So long as the sovereign state holds strong force, war can not be avoided.\n- Albert Einstein"
 LOADING_TIP_8:0 "The people who cast the votes decide nothing. The people who count the votes decide everything.\n- Joseph Stalin"
 LOADING_TIP_9:0 "History shows that there are no invincible armies and that there never have been.\n- Joseph Stalin"
 LOADING_TIP_10:0 "The economy is not something that we are at our mercy.\n- Nikita Khrushchev"
 LOADING_TIP_11:0 "The art of politics is to be able to accurately understand when a slight blow is needed \n- below the opponent's belt.\n- Konrad Adenauer"
 LOADING_TIP_12:0 "The only real power comes out of a long rifle.\n- Joseph Stalin"
 LOADING_TIP_13:0 "All free men, wherever they may live, are citizens of Berlin, and, therefore, as a free man, I take pride in the words Ich bin ein Berliner. \n- John Kennedy，June 26, 1963"
 LOADING_TIP_14:0 "I will not send the American boys 8 or 10000 miles around the world to do a job that Asian boys ought to be doing for themselve.\n- Lyden Johnson，October 21, 1964"
 LOADING_TIP_15:0 " History is the sum of things that should be avoided.\n- Konrad Adenauer"
 LOADING_TIP_16:0 "The bigger/more blatant a lie, the more people will believe it.\n- Adolf Hitler"
 LOADING_TIP_17:0 "Not only in China, but all over the world, either on the imperialist side or on the socialist side. Neutrality is only camouflage; the third road does not exist.\n- Mao Ze-Dong，1949"
 LOADING_TIP_18:0 "Died in the war is not certainly fearful, is so many sacrifices which is fearful has not traded peace .\n- Winston Churchill"
 LOADING_TIP_19:0 "If you're going through hell, keep going.\n- Winston Churchill"
 LOADING_TIP_20:0 "The best argument against democracy is a five-minute conversation with the average voter.\n- Winston Churchill"
 LOADING_TIP_21:0 "Armored forces will play a decisive role no matter what wars they will take in the future.\n- Heinz Guderian"
 LOADING_TIP_22:0 "The Soviet Union is indeed our greatest threat, not because of what it has done, but because we have provided an excuse for our failure.\n- J. William Fulbright (Senator of the United States)"
 LOADING_TIP_23:0 "No bastard ever won a war by dying for his country. He won it by making the other poor dumb bastard die for his country.\n- George S. Patton"
 LOADING_TIP_24:0 "A good plan violently executed now is better than a perfect plan executed next week.\n- George S. Patton"
 LOADING_TIP_25:0 "Lead me, follow me, or get out of my way.\n- George S. Patton"
 LOADING_TIP_26:0 "Nobody ever defended anything successfully, there is only attack and attack and attack some more.\n- George S. Patton"
 LOADING_TIP_27:0 "Wars may be fought with weapons, but they are won by men. It is the spirit of men who follow and of the man who leads that gains the victory.\n- George S. Patton"
 LOADING_TIP_28:0 "Communism sometimes succeeds as a scavenger, but not as a leader. It has never had power in a country that has not been subjected to war or corruption, or both.\n- John Kennedy, 1963"
 LOADING_TIP_29:0 "Tear Down This Wall\n- Ronald Reagan, 12 June 1987"
 LOADING_TIP_30:0 "I am a Marxist-Leninist, and I will always believe in it until the last day of my life.\n- Fidel Castro, 2 December 1961"
 LOADING_TIP_31:0 "Capitalism is using its money; our socialists are throwing it away.\n- Fidel Castro, 8 November 1964"
 LOADING_TIP_32:0 "In preparing for battle I have always found that plans are useless, but planning is indispensable.\n- Dwight D. Eisenhower"
 LOADING_TIP_33:0 "What counts is not necessarily the size of the dog in the fight - it's the size of the fight in the dog.\n- Dwight D. Eisenhower"
 LOADING_TIP_34:0 "The threat of World War is gone.\n- Mikhail Gorbachev, December 1991"
 LOADING_TIP_35:0 "In a man-to-man fight, the winner is he who has one more round in his magazine.\n- Erwin Rommel"
 LOADING_TIP_36:0 "Every time I kill one of you, you can kill 10 of us, but even if we do that, we will still win.\n- Ho Chi-Minh (to French)"
 LOADING_TIP_37:0 "Sweat saves blood, blood saves lives, but brains saves both.\n- Erwin Rommel"
 LOADING_TIP_38:0 "Let's recapture our legacy.\n- Philip Leclerce, Vietnam, September 1945"
 LOADING_TIP_39:0 "The war of ninety-nine left no seat for the winner.\n- 99 Luftbollin"
 LOADING_TIP_40:0 "West Berlin is like the testicles of the West. If I want them to scream, pinch West Berlin.\n- Nikita Khrushchev"
 LOADING_TIP_41:0 "Revolutionary war is a war of the masses. Only by mobilizing the masses can we wage war, and only by relying on the masses can we wage war.\n- Mao Ze-Dong，1934"
 LOADING_TIP_42:0 "When the army returns to the barracks, it will supervise politics like a big brother. If it is unsatisfactory, it will intervene in politics again.\n- Park Chung-Hee"
 LOADING_TIP_43:0 "You go and tell General Gavrier that the President of Chile will never run away. He knows how to perform a soldier's duty!\n- Salvador Allende, 11 September 1973"
 LOADING_TIP_44:0 "Forgive your enemies, but never forget their names.\n- John Kennedy"
 LOADING_TIP_45:0 "Reform is the second revolution in China. This is a very important thing to do, albeit a risky one.\n- Deng Hsiao-Ping, 28 March 1985"
 LOADING_TIP_46:0 "Whether a black cat or a white cat, catching a mouse is a good cat.\n- Deng Hsiao-Ping"
 LOADING_TIP_47:0 "If something bad happens in China, it still happens within the Communist Party.\n- Deng Hsiao-Ping"
 LOADING_TIP_48:0 "I started the revolution with 82 people. If you let me start again, even if I have only 10 or 15 people\n- I'm absolutely confident, too. If you have faith and plan, no matter how small you are, it doesn't matter.\n- Fidel Castro"
 LOADING_TIP_49:0 "We'll bury you!\n- Nikita Khrushchev 18 November 1956"
 LOADING_TIP_50:0 "That's one small step for a man, one giant leap for mankind.\n- Nile Armstrong, 21 July 1969"
 LOADING_TIP_51:0 "When I traveled in a spaceship in Earth orbit, I was amazed at the beauty of the earth. People on earth, let's protect and increase her beauty instead of destroying her!\n- Yuri Gagalin"
 LOADING_TIP_52:0 "How can you shoot us? I care about you so much. I am your mother.\n- Elena Ceausescu, 26 December 1989"
 LOADING_TIP_53:0 "Those who make nonviolent revolution impossible will make it inevitable. \n- John Kennedy"
 LOADING_TIP_55:0 "We are awaiting aggression by Israel and any supporters of Israel. We will make it a decisive battle and get rid of Israel once and for all… This is the dream of every Arab.\n- Gamal Nasser，1967"
 LOADING_TIP_56:0 "If the reasons for building up have not yet been eliminated, the Berlin wall will stand for about 50 years or even 100 years.\n- Erich Honneker，19 January 1989"
 LOADING_TIP_57:0 "I'm Imre Nagy. At dawn today, Soviet troops attacked our capital, apparently trying to overthrow the legitimate Hungarian democratic government. Our army is in the battle, and the government is sticking to its post. I tell the whole country and people all over the world this fact.\n- Imre Nagy，31 October 1956"
 LOADING_TIP_58:0 "They are the same as us!\n- Smith Thamantha"
 LOADING_TIP_59:0 "When you really own land and property, freedom is self-evident, and democracy is not far away......\n- Augusto Pinochet"
 LOADING_TIP_61:0 "Ask not what your country can do for you — ask what you can do for your country.\n- John Kennedy，1961
 LOADING_TIP_62:0 "Don't let anybody make you think God chose America as his divine messianic force to be a sort of policeman of the whole world.\n- Martin Luther King, August 28, 1963"
 LOADING_TIP_63:0 " I have a dream that one day on the red hills of Georgia the sons of former slaves and the sons of former slaveowners will be able to sit down together at a table of brotherhood.\n- Martin Luther King, August 28, 1963"
 LOADING_TIP_64:0 "We can only eliminate war through war. If we don't want a gun, we must take it.\n- Mao Ze-Dong"
 LOADING_TIP_65:0 "A strange game. The only winning move is not to play. \n- War game, 1965"
 LOADING_TIP_66:0 "Do you, Ambassador Zorin, deny that the U.S.S.R. has placed and is placing medium- and intermediate-range missiles and sites in Cuba? Yes or no — don't wait for the translation — yes or no?\n- Adlai Stevenson II"
 LOADING_TIP_67:0 "This nation should commit itself to achieving the goal, before the decade is out, of landing a man on the moon and returning him safely to the earth.\n- John Kennedy"
 LOADING_TIP_68:0 "How far can the army go and how far the system can go.\n- Joseph Stalin"
 LOADING_TIP_69:0 "Restraint? Why do you care so much about their lives? All we have to do is kill these bastards. By the end of the war, with two Americans and one Russian still alive, we won.\n- General Thomas Bauer, US Strategic Air Force"
 LOADING_TIP_70:0 "Again, I say,don't hold any more meetings, talk nonsense and protests, or I'll knock your teeth off.\n- Ayatollah Khomeini"
 LOADING_TIP_71:0 "You yearn for freedom, freedom of all things, freedom of association, but those freedoms will corrupt our young people, and those freedoms will pave the way for tyrants and push our nation into abyss.\n- Ayatollah Khomeini"
 LOADING_TIP_72:0 "If I had been in power, I would have launched missiles without hesitation.\n- Che Guevara, on the Cuban Missile Crisis"
 LOADING_TIP_73:0 "When you see a rattlesnake poised to strike, you do not wait until he has struck to crush him.\n- Franklin D. Roosevelt"
 LOADING_TIP_74:0 "Rules are not necessarily sacred, principles are.\n- Franklin D. Roosevelt"
 LOADING_TIP_75:0 "People who are hungry and out of a job are the stuff of which dictatorships are made.\n- Franklin D. Roosevelt"
 LOADING_TIP_76:0 "I hope everyone understands the motivation for our actions. Military coups and dictatorships are not our goal.\n- Wojczech Jaruzelski"
 LOADING_TIP_77:0 "We need to establish a very democratic new socialist pattern suitable for Czechoslovakia.\n- Alexander Dubcek，1968"
 LOADING_TIP_78:0 "Condemn me, it does not matter: history will absolve me.\n- Fidel Castro 1953，7月26日"
 LOADING_TIP_79:0 "I came to join the revolution, not to kill the Cambodian people. Look at me now. Am I a violent person?\n- Pol Pot"
 LOADING_TIP_80:0 "The fingers of those who block the wheel of history will be crushed.\n- Lech Walensa"
 LOADING_TIP_81:0 "Now freezing (nuclear weapons) would be an extremely dangerous deception, because it was only a phantom of peace. The fact is that we must find peace through strength.\n- Ronald Reagan, March 1983"
 LOADING_TIP_82:0 "What are the advantages of our washing machines? Isn't it better than the power of our rockets? Isn't that what you want?\n-  Richard Nixon,debated in the kitchen July 24, 1959"
 LOADING_TIP_83:0 "You're a capitalist lawyer. I'm a socialist lawyer. Come and kiss one.\n- Nikita Khrushchev debated in the kitchen July 24, 1959"
 LOADING_TIP_84:0 "When we leave, they will give you schools and hospitals and raise your wages, not because of their conscience, not because they have become good people, but because we have been here.\n- Che Guevara"
 LOADING_TIP_85:0 "Guns, warships, rockets and bombs are symbols of human failure.\n- Lyden Johnson"
 LOADING_TIP_86:0 "I believe that children living in the nuclear age have their ability to love diminished. When you brace yourself to face this impact, strive to love.\n- Sir Martin mis"
 LOADING_TIP_87:0 "Democracy is a Western concept, which is not suitable for Asians who have grown up under the influence of Confucianism.\n- Lee Kwang-Yew"
 LOADING_TIP_88:0 "The release of atomic energy has changed everything except for the way humans think... The solution to this problem lies in the human heart. If I had known, I would have become a clockmaker.\n- Albert Einstein"
 LOADING_TIP_89:0 "The inherent evil of capitalism is that happiness is shared unequally. The inherent evil of socialism is that pain is shared equally.\n- Winston Churchill"
 LOADING_TIP_90:0 "The Cold War will not melt; it is burning fiercely under the deadly heat.\n- Richard Nixon"
 LOADING_TIP_91:0 "NASA spent millions of dollars developing a ballpoint pen that can be used in space, while the Russians only need a pencil.\n- 威尔·沙博"
 LOADING_TIP_92:0 "A peaceful solution is no longer possible, and there will inevitably be winners and losers.\n- South African Foreign Minister Pik Botha to Ian Smith"
 LOADING_TIP_93:0 "No Luke,I am your fater.\n- Darth Vader,May 21th 1980"
 LOADING_TIP_94:0 "hristianity will eventually fade away; it will wither and disappear slowly... We are more popular now than Jesus, and I don't know which will disappear first, rock music or Christianity. Jesus is good, but his followers are really stupid and vulgar.\n- John Lenon,March 4th 1962"
 LOADING_TIP_95:0 "The security and well-being of all ethnic minorities in South Africa depend on the Afrikaner people. It does not matter whether they speak English, German, Portuguese, Italian, or even Jewish.\n-Peter Botha,Feb 20th 1980"
 LOADING_TIP_96:0 "Since I knew (Mandela) would resort to violence again, why should I, as a responsible head of state, release him, let him continue with violence, and then arrest him again? This is simply an absurd argument.\n-Peter Botha,April 23th 1986"
 LOADING_TIP_97:0 "I have devoted my life to this struggle for the African people. I oppose white rule, but also black rule. I harbor the ideal of a democratic and free society where everyone lives in harmony and opportunities are equal. I hope to live for this ideal.\n-Nalson Mandela,April 20th 1964"
 LOADING_TIP_98:0 "As long as poverty persists, there will be no true freedom... Sometimes, greatness requires a generation to bear. You can be that generation. Let your greatness bloom.\n-Nalson Mandela,April 20th 1964"
 LOADING_TIP_99:0 "I believe that when you become famous, all your weaknesses will be exaggerated... Creativity must stem from humanity, and as a human being, you will feel, you will suffer. You are gay, you will get sick, you will be nervous, and so on.\n-Marilyn Monroe,Aug 3th 1962"
 LOADING_TIP_100:0 "We, non-communists, must today lead the struggle, primarily against chaos, indiscipline, and selfishness. This struggle is for the honor of a Vietnam that cherishes freedom, for the safety and well-being of millions of compatriots who have suffered from war, and for the brotherhood among people of the same race, which is known as the motherland.\n——Ngo Dinh-Diem,Feb 13th 1955"
 LOADING_TIP_101:0 "The Jewish people have only one way to save themselves - to return to their own nation and migrate to their own land.\n——Theodor Herzl"
 LOADING_TIP_102:0 "To me, Judaism, like all other religions, is the embodiment of the most childish superstitions. And the Jewish people to whom I gladly belong, and with whose ideas I deeply resonate, seem to me no different from all other people... I see nothing in them that indicates they are chosen.\n——Albert Einstein"
 LOADING_TIP_103:0 "My friends and I do not discriminate against anyone. We do not ask about his race or religion. He must be a human being. This is the most important thing to us.\n——Theodor Herzl"
 LOADING_TIP_104:0 "When I give food to the poor, they call me a saint. When I ask the poor why they have no food, they call me a communist.\n- Archbishop Hélder Câmara"
 LOADING_TIP_105:0 "I just want to reiterate that Israel will not be the first country to introduce nuclear weapons to the region.\n- Shimon Peres"
 LOADING_TIP_106:0 "The enemies of the Soviet Union speculated that our heavy losses would lead to internal chaos and instability. But their hopes were dashed: what awaited them was bitter disappointment. It is clear to all that our party is more united and steadfast in difficult times.\n——Lavrentiy Beria, 1953"