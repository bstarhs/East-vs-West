l_english:
 geo.1.t:0 "New Georgian supreme soviet organazied."
 geo.1.d:0 "As the Soviet government began implementing the New Union Treaty, each Soviet republic began to establish its own government and parliament. The Georgian SSR announced the establishment of a new Supreme Soviet and held multi-party elections."
 geo.1.a:0 "OK。"
 
 geo.2.t:0 "Conflict in Abkhazia"
 geo.2.d:0 "A conflict has erupted in the Abkhaz SSR located in northwestern Georgia, with locals demanding independence. The Glasnost policy implemented by the Soviet government led to a serious wave of nationalism in various regions, including the Abkhazia, resulting in a serious conflict between Georgians and Abkhazians."
 geo.2.a:0 "OK。"
 
 geo.3.t:0 "Demonstration in Tbilisi"
 geo.3.d:0 "A demonstration broke out in Tbilisi Georgia, with a large number of protesters gathering on Rustaveli Avenue. They condemned the Moscow government for supporting the division of Abkhazia from Georgia after implementing the New Union Treaty, demanded sanctions against Abkhaz separatists, and obtained greater autonomy from the USSR. Our security department believes that this is an event instigated by nationalism. How should we respond?"
 geo.3.a:0 "Command the military to control the situation"
 geo.3.b:0 "Let them go"
 
 geo.4.t:0 "Georgia erupts into bloody conflict"
 geo.4.d:0 "The news comes from Tbilisi. A demonstration broke out in the USSR controlled Georgia SSR and was suppressed. The protesters opposed Abkhazia's separatism and demanded that Georgia obtain more autonomy. The Soviet army forcibly expelled the protesters, resulting in more than ten deaths."
 geo.4.a:0 "令人不安。"
 
 geo.5.t:0 "Georgia declares independence"
 geo.5.d:0 "After the gradual collapse of the Soviet Union,Georgia,the homeland of Josif Stalin became the next republic to break away from the Soviet. The Supreme Soviet Parliament of Georgia announced a vote to secede from the Soviet Union, change the country's name to the Republic of Georgia, and adopt a new national flag."
 geo.5.a:0 "令人不安。"
 
 geo.6.t:0 "Georgian parliamentary elections"
 geo.6.d:0 "With Georgia declaring independence, a new government is expected to be formed. Famous nationalist politician Gamsakhurdia and former Soviet officer Shevardnadze will run for Georgia's first president."
 geo.6.a:0 "令人不安。"
 
 geo.7.t:0 "The new government of Georgia"
 geo.7.d:0 "The first presidential election in Georgia has ended,[GEO.GetLeader] has won the election to form a government as Georgia's first president."
 geo.7.a:0 "令人不安。"
 
 geo.8.t:0 "Abkhazia rebellion！"
 geo.8.d:0 "Armed rebellion erupts in the Abkhaz region! Armed militants who support Abkhaz independence have attacked and occupied multiple strongholds!"
 
 geo.8.t:0 "Abkhazia war！"
 geo.8.d:0 "An armed conflict has erupted in the Abkhaz region of the Caucasus Mountains with the aim of gaining independence from Georgia. Currently, Abkhaz rebels have engaged in fierce fighting with the Georgian army!"
 
 geo.9.t:0 "Abkhazia war！"
 geo.9.d:0 "An armed conflict has erupted in the Abkhaz region of the Caucasus Mountains with the aim of gaining independence from Georgia. Currently, Abkhaz rebels have engaged in fierce fighting with the Georgian army!"
 
 geo.10.t:0 "Georgia's withdrawal from Abkhazia！"
 geo.10.d:0 "After fighting, Georgia's military operation to suppress the Abkhaz revolt ended in failure and was forced to withdraw. Abkhaz militants occupied most of the territory, including the capital Sukhumi, and announced their preparations to establish a new country."
 
 geo.11.t:0 "Georgian occupation of Sukhumi！"
 geo.11.d:0 "The Georgian army successfully repelled Abkhaz rebels and occupied Sukhumi,the capital of Abkhazia. The remaining rebels were forced to retreat to mountainous areas and Russian."
 
 geo.12.t:0 "Coup d'état！"
 geo.12.d:0 "As the conflict between the President [GEO.GetLeader] and opposition political forces worsens, a military coup is imminent. The opposition has begun organizing armed forces into Tbilisi, demanding the President's resignation."
 geo.12.a:0 "[GEO.GetLeader] must down"
 geo.12.b:0 "Strike the rebels"
 
 geo.13.t:0 "Georgia's coup！"
 geo.13.d:0 "The conflict between Georgian President Gamsakhurdia and the opposition has intensified, and armed opposition groups have surrounded the capital, forcing the president to relinquish power. Gamsakhurdia was forced to resign and go into exile, and Shervadnadze was invited to serve as interim president."
 
 geo.14.t:0 "Georgia's outbreak of civil war！"
 geo.14.d:0 "The conflict between Georgian President Gamsakhurdia and the opposition has intensified, and armed opposition groups have surrounded the capital, forcing the president to relinquish power. Gamsakhurdia refused to resign and mobilized his loyal forces to resist, and the war quickly spread throughout Georgia!"
 
 geo.15.t:0 "Gamsakhurdia returns to Georgia！"
 geo.15.d:0 "Former Georgian President Gamsakhurdia, who was overthrown, led his loyal subordinates back to western Georgia and prepared to launch a new war to regain power."
 
 geo.16.t:0 "Georgia's outbreak of civil war！"
 geo.16.d:0 "Armed rebels supporting Gamsakhurdia declare war on the Georgian government!"
 
 geo.17.t:0 "The unrest in Georgia has ended"
 geo.17.d:0 "The armed rebels supporting Gamsakhurdia collapsed under the suppression of the Georgian government, and Gamsakhurdia himself died for unknown reasons."