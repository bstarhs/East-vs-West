l_english:
 SRI.1.t:0 "锡兰人的独立"
 SRI.1.d:0 "为了结束英国的殖民统治，曾经不共戴天的锡兰两大民族，泰米尔人和僧伽罗人团结在了一起。他们共同发表了宣言，要求建立一个在英联邦内的自治共和国。"
 SRI.1.a:0 "结束对锡兰的统治。"
 SRI.1.a:0 "开什么玩笑？"

 BUR.1.t:0 "缅甸独立"
 BUR.1.d:0 "缅甸独立领导人昂山与英国首相艾德礼达成的协议在今天生效。缅甸在经历了近百年的英国殖民统治以后终于迎来了独立与自由。"
 BUR.1.a:0 "伊洛瓦底江的日出今天显得无比美丽。"

