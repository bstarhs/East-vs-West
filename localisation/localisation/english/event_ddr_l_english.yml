l_english:
 ddr.1.t:0 "Establishment of the German Democratic Republic"
 ddr.1.d:0 "With the support of the Soviet Union, the German Democratic Republic was established in the occupied territories of the Soviet Union. The country was governed by the United Socialist Party formed by the merger of the German Communist Party and the German Social Democratic Party, with William Picker as its first president. \nDemocratic Germany was one of the communist satellite states established under the control of the Soviet Union, which faced off against the Federal Germany supported by the Western United States."
 ddr.1.a:0 "Germany and Europe have fallen into division."

 ddr.4.t:0 "Unified Socialist Party elections"
 ddr.4.d:0 "n 1971, with the death of Ubrlich, the People's Assembly of Democratic Germany and the United Socialist Party held a meeting to elect the next Secretary of the United Socialist Party and Chairman of the State Council of Democratic Germany. Comrade Erich Onnak was the most popular candidate, with his social and political theories accepted and the support of Soviet leader Brezhnev. But some also pointed out that Comrade Willy Stove, who had served as Minister of Defense, Chairman of the Council of Ministers, and Vice Chairman of the State Council, could better cope with potential confrontations with the West in the future."
 ddr.4.a:0 "Comrade Onnak is calm, talented, and experienced, and he is the leader of the country."
 ddr.4.b:0 "Minister Stove has sufficient capabilities in war and politics to lead us in the fight against capitalism."
 
 ddr.5.t:0 "Refugees fleeing to the West"
 ddr.5.d:0 "A large number of refugees dissatisfied with the ruling United Socialist Party crossed the border to West Germany, which in the long run will lead to the loss of talent and intellectuals in our country."
 ddr.5.a:0 "真见鬼。"
 
 ddr.9.t:0 "Youth crossing Berlin"
 ddr.9.d:0 "While the Berlin Wall was being built, a 19-year-old East German soldier, Conrad Schumann, stepped over the barbed wire separating East and West Berlin at the call of West Berlin citizens and arrived in West Berlin. He then boarded a police car and left. \This moment was captured by photographer Peter Leibin and made headlines in various news newspapers around the world. At present, the East German government has not responded to this."
 ddr.9.a:0 "Germany and Europe have fallen into division."
 
 ddr.10.t:0 "Protest marches erupt in East Berlin！"
 ddr.10.d:0 "Workers and the masses in East Berlin have launched demonstrations to protest against the deterioration of worker treatment and corruption in the party and government. How should we respond?"
 ddr.10.a:0 "This is a reactionary march, immediately suppress it."
 ddr.10.b:0 "Attempts should be made to engage in dialogue with workers."
 
 ddr.11.t:0 "Protest marches erupt in East Berlin！"
 ddr.11.d:0 "Workers and the masses in East Berlin launched a demonstration to protest against the deterioration of workers' treatment and the corruption of the party and government. How can we respond to the East German authorities choosing to engage in dialogue with protesters?"
 ddr.11.a:0 "The East German government will handle it itself."
 ddr.11.b:0 "This is a reactionary march, and East German should immediately suppress it."
 
 ddr.12.t:0 "Protest marches erupt in East Berlin！"
 ddr.12.d:0 "Workers and the masses in East Berlin launched a demonstration to protest against the deterioration of workers' treatment and the corruption of the party and government. The Polish authorities deployed military and police forces to suppress the march, resulting in multiple deaths. This incident seriously damaged the prestige of the United Socialist Party government in the hearts of the people."
 ddr.12.a:0 "Sad"
 

 ddr.20.t:0 "The going to West!"

 ddr.21.t:0 "Honecker resigned"

 ddr.22.t:0 "The collapse of the Berlin Wall"
 ddr.22.d:0 "What is socialism? Frogs in the well and complacency are not socialism. To be open minded, face others, and coexist with other countries is in line with socialism. It's not just about longing for a better world, but about achieving it. Therefore, I have decided to open up the borders of Democratic Germany. With the television speech of Politburo member Shapovsky, the Berlin Wall, which had isolated Germany for decades, came to an end. After the border guards who finished their last day of work at the checkpoint left their posts, excited residents on both sides of Berlin rushed towards the Brandenburg Gate, breaking the wall that separated the two worlds and embracing their loved ones living on the other side."
 ddr.22.a:0 "今夜，德国不在分为东西，分为你我。"
 
 ddr.23.t:0 "Election in DDR"
 
 ddr.24.t:0 "德国统一会议"
 
 ddr.26.t:0 "The Soviet Union demands a revision of West Berlin's status!"
 ddr.26.d:0 "The Soviet leaders issued an ultimatum demanding that we sign a separate peace treaty with East Germany, making West Berlin a free city, and thus terminating the Four Nation Agreement. The right of the West to enter West and East Berlin will be the responsibility of the Soviet army."
 ddr.26.a:0 "This is impossible."
 ddr.26.b:0 "We have no choice."
 
 ddr.27.t:0 "US military withdraws from West Berlin!"
 ddr.27.d:0 "At the request of the Soviet Union, NATO troops were forced to withdraw from West Berlin, ending more than a decade of Western control over West Berlin. The East German border army quickly took over this city, and it is unclear whether the Soviet East German authorities will abide by their promise to maintain West Berlin's free market status."
 ddr.27.a:0 "This is impossible."
 
 ddr.28.t:0 "The United States rejects our request！"
 ddr.28.d:0 "The United States and NATO countries have rejected our ultimatum to demand their withdrawal from West Berlin."
 ddr.28.a:0 "Blockade Berlin"
 
 ddr.29.t:0 "The East German government has begun isolating West Berlin!"
 ddr.29.d:0 "As the second Berlin crisis began to worsen, the East German government, with the support of the Soviet Union, began building reinforced concrete walls in Berlin to prevent East Germans from entering West Berlin."
 ddr.29.a:0 "Blockade Berlin"
 
 ddr.30.t:0 "The East German government is building the Berlin Wall!"
 ddr.30.d:0 "After the second Berlin crisis, the East German government began to continuously strengthen and reinforce the Berlin Wall. In the end, a huge cement barrier sealed the entire West Berlin, becoming a symbol of division between Germany and even the two worlds."
 ddr.30.a:0 "Blockade Berlin"