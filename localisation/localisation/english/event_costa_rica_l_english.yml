l_english:
 cos.1.t:0 "Costa Rica's general election is imminent!"
 cos.1.d:0 "Costa Rica is about to hold a presidential election, and the leader of the ruling Republican Party, Rafael Mikharski, is seeking re-election, while the opposition party led by Luis Otirio Blanco is participating in the election!"
 
 cos.2.t:0 "Rafael Mikharski wins the Costa Rican election!"
 cos.2.d:0 "The National Republican Party led by Rafael Mikharski won the Costa Rican election and will continue to rule the country."
 
 cos.3.t:0 "The National Liberation Party refuses to recognize elections!"
 
 cos.4.t:0 "Costa Rican political party rotation!"
 cos.4.d:0 "After intense political struggles, Raphael Mikharski and the National Republican Party were forced to announce party rotations, ending the party's over twenty year rule over Costa Rica."
 
 cos.5.t:0 "Costa Rican political crisis!"
 cos.5.d:0 "The general election in Costa Rica ended with the victory of the national Republican Party, but the opposition refused to recognize the election results and demanded that the current government step down! The situation between both sides is tense and there is a risk of civil war breaking out!"
 
 cos.6.t:0 "The liberal unrest in the north!"
 
 cos.7.t:0 "Costa Rica's civil war erupts!"
 cos.7.d:0 "Liberal and opposition armed groups in Costa Rica are organizing armed groups in the northern part of the country, opposing the government!"
 
 cos.8.t:0 "哥斯达黎加共产主义动乱！"
 cos.8.d:0 "哥斯达黎加的人民先锋党为首的左派势力拒绝承认新政府，并发起了游击战争！"
 
 cos.9.t:0 "民族解放党夺取哥斯达黎加政权！"
 cos.9.d:0 "民族解放党赢得哥斯达黎加内战！叛军攻占首都圣何塞，拉斐尔·米哈尔斯基总统被迫辞职逃亡，结束了该党对哥斯达黎加二十余年的统治。新总统安东尼奥·费雷尔宣布就职。"
 
 cos.10.t:0 "哥斯达黎加内战结束！"
 
 cos.11.t:0 "哥斯达黎加颁布十二条宪法！"
 
 cos.12.t:0 "人民先锋党夺取哥斯达黎加政权！"