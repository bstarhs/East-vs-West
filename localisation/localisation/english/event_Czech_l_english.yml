l_english:
 cze.1.t:0 "7 Ministers Requesting Resignation"
 
 cze.2.t:0 "The Communist Party forms a government in the Czech Republic!"
 cze.2.d:0 "The political struggle in Czechoslovakia ended with the victory of pro communist forces, and several anti communist government officials were forced to resign. President Edward Bernays authorized the Czech Communist Party to form a cabinet, and the Czechoslovak government was effectively under communist control."
 cze.2.a:0 "The power of communism is constantly expanding"
 
 cze.12.t:0 "1968 Czechoslovak Communist Party Conference"
 cze.12.d:0 "The Communist Party of Czechoslovakia is about to hold a new conference. Reformist leader Alexander Dubchek criticized the party leader Antonin Novotny for his incompetence in political and economic reforms, as well as his prejudice against Slovaks, and demanded his resignation. Dubchek's proposal received the support of the majority. How do we view this issue?"
 cze.12.a:0 "Comrade Dubchek should take over the work of Novotny."
 cze.12.b:0 "Comrade Nowotny did nothing wrong and will continue to hold the leadership position."
 
 cze.13.t:0 "Prague Spring"
 cze.13.d:0 "Alexander Dubchek was elected as the new leader of the Czech Communist Party and announced his new policies. Czechoslovakia needs a new socialist political system, a democratic and hungry socialist. Political reform is ready."
 cze.13.a:0 "A warm spring."
 
 cze.14.t:0 "Czech Republic Attempts Liberal Reform"
 cze.14.d:0 "The new leader of the Czech Communist Party, Dubchek, attempted political reforms characterized by liberalism and pro Western tendencies. Our intelligence personnel have warned that if reforms continue, pro Western factions may gain power in the Czech Republic."
 cze.14.a:0 "Reform must stop"
 cze.14.b:0 "Leave it to its own discretion"
 
 cze.15.t:0 "Warning from Moscow"
 cze.15.d:0 "The Kremlin is dissatisfied with our political reforms, as they will give the West an opportunity to influence us. Soviet leaders warned that they had the right to block statements from pro Western factions."
 cze.15.a:0 "他们无法阻止我们！"
 cze.15.b:0 "我们不得不放弃"
 
 cze.16.t:0 "布拉格拒绝了我们！"
 cze.16.d:0 "捷克斯洛伐克领导人拒绝我们的警告，他们坚持错误的自由主义道路！我们不能让他们成为资本主义入侵社会主义的大门！"
 cze.16.a:0 "他们会付出代价！"
 
 cze.18.t:0 "捷克内战！"
 
 cze.19.t:0 "胡萨克上台"
 
 cze.20.t:0 "The Warsaw Pact invaded Czechoslovakia!"
 cze.20.d:0 "The Warsaw Pact army led by the Soviet Union entered Czechoslovakia this morning. Airborne troops attacked and took control of Prague airport, followed by thousands of tanks invading Czech territory. Soviet leaders stated that this move was to prevent Alexander Dubchek's liberal reforms, as it would lead to the capitalization of Czechoslovakia. The Czech government did not choose to resist, but the citizens of Prague attempted to attack the Soviet army."
 cze.20.a:0 "They will pay for it!"
 
 cze.22.t:0 "Band of Univers plastic"
 
 cze.23.t:0 "Intellectuals publish the Charter of 77"
 
 cze.26.t:0 "The demonstration broke out!"
 
 cze.26.t:0 "The Communist Party of Czechoslovakia steps down!"
 cze.26.d:0 "Under immense public pressure, the Czechoslovakian Communist Party, which had ruled Czechoslovakia for nearly 50 years, finally announced political reforms and held national elections. The Citizen Forum led by Watslav Havel defeated the Communist Party and won the election, and the democratization of Czechoslovakia declared victory."