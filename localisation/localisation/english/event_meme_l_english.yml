 meme.29.d:0 "闻名全球的香港武术明星李小龙在香港因药物过敏意外去世，年仅32岁，李生前在筹备电影《龙争虎斗》的拍摄工作，因劳累服用错误药物最终不幸离世。约三万香港市民聚集在李小龙生前的居所送别这位武术明星。/n李小龙是中国历史上最伟大的电影演员之一，他曾参与《精武门》、《猛龙过江》和《青蜂侠》等电影，改变了西方眼中剃发留辫的刻板中国人印象。"
 meme.29.a:0 "艺海星沉"
 
