 meme.1.t:0 "The detector detected an unknown signal!"
 meme.1.d:0 "Our intelligence, technology and military personnel reported an emergency report to us: our space probe received an unknown electromagnetic signal from the sender not long ago, with the content of an unknown noise. Our scientific and technological personnel cannot confirm whether it is from the earth or not, nor can they decipher its significance. But after calculation, we think that this information comes from the direction of Neptune, and there was a unidentified object nearby that we thought was a comet just a month ago!"
 meme.1.a:0 "I hope to live in a more enlightened era..."
 meme.1.b:0 "Did I fucking play the wrong game?"
 
 meme.2.t:0 "The Future of Russia"
 meme.2.d:0 "While the capture of Moscow, the question of how to deal with Russia's future course is also before us,although some have suggested that we take this opportunity to completely eliminate Communism and build a new, democratic and free Russia, Most sane advisors think that most Russians have a favorable opinion of Communism, that overthrowing the Communist Party directly could lead to unnecessary riots, and that the Soviet system should be preserved and a puppet installed as it was with Japan."
 meme.2.a:0 "A free new Russia should be established immediately."
 meme.2.b:0 "The Soviet system should be preserved, creating a non-threatening Soviet Union."
 
 meme.3.t:0 "Star Wars"
 meme.3.d:0 "After the Galactic Empire was established, the Emperor ordered the creation of a terrible weapon, the Death Star, to threaten the rebels. To destroy it, Princess Leia took the blueprints and gave them to the rebels. But now She's taken prisoner, and now her only hope is two R2D2s and C-3PO, and Obi-Wan Kenobi, the Jedi Master.\nThis is a Star Wars story. The movie came out in 1977, We believe it will be the greatest sci-fi movie ever made."
 meme.3.a:0 "May the Force be with you."
 
 meme.4.t:0 "Thatcher and Yes, Prime Minister"
 meme.4.d:0 "Prime Minister Margaret Thatcher's decision to abolish economists to advance her reform plan entrusted to Jim Harker and Sir Humphrey. But they don't seem to like the decision , because they both have degrees in economics."
 meme.4.a:0 "Capital!"
 
