 meme.34.t:0 "An unidentified flying object crash that occurred in the western United States"
 meme.34.d:0 "An unidentified flying object crashed on a farm in Roswell, New Mexico, USA. Witnesses claimed that a circular object resembling a flying saucer hit farmland. The US military then arrived at the scene, expelled local residents, and took the unidentified flying object with them. Although the US government claims to be just a weather balloon, conspiracy theorists believe that this unidentified flying object came from outside of Earth and may even have carried aliens inside."
 meme.34.a:0 "It's just a conspiracy theorist's frenzy"
 
