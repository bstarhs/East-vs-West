 hun.12.d:0 "The election of the chairman of the Hungarian Council of Ministers has begun. Nagy Imre, who advocates reform and the establishment of socialism with Hungarian characteristics, is welcomed by the people. However, Rakosi and some ex-Soviet Union members strongly No, they prefer the conservative Gro Erno."
