hun.1.t:0 "Hungarian elections"
 hun.1.d:0 "The election of the chairman of the Hungarian Council of Ministers has begun. Nagy Imre, who advocates reform and the establishment of socialism with Hungarian characteristics, is welcomed by the people. However, Rakosi and some ex-Soviet Union members strongly No, they prefer the conservative Gro Erno."
 hun.1.a:0 "Lead us to an independent and democratic Hungary by Comrade Nagy!"
 hun.1.b:0 "Comrade Gro's policies are indeed in line with a socialist country."
 
