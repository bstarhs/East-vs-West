 hun.13.t:0 "Hungarian Reform"
 hun.13.d:0 "The chairman of the Hungarian Council of Ministers, Nagy Imre, implemented a new policy, further proposing to replace the Soviet Union model with the Hungarian socialist road, and to oppose the control of the Soviet Union with sovereign independence and national equality. Resonance among intellectuals within. Hungary started the process of the "non-Soviet Union model" earlier than other Eastern European countries."
 hun.13.a:0 "Long live Comrade Nagy! Long live Hungary!"
 
