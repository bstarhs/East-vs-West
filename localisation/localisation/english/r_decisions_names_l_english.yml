l_english:

nuclear_fuel_making:0 "Production of nuclear fuel"
nuclear_fuel_making_desc:0 "After crushing high-purity uranium ore, acid and other chemical substances are added for reaction to obtain ammonium uranate (known as yellow cake). After the yellow cake reacts with materials such as hydrogen fluoride, radioactive nuclear fuel can be obtained. By placing the nuclear fuel into a tube made of tungsten, the original uranium hexafluoride can be obtained."
uranium_enrichment:0 "Uranium enrichment experiment"
uranium_enrichment_desc:0 "Uranium mines cannot be immediately used as nuclear fuel as they contain a large amount of impurities inside. By using a centrifuge to separate impurities from natural uranium ore, pure uranium elements can be purified. "

Catholics_decis:0 "Rebuilding the Nation of God"
Catholics_decis_desc:0 "You are Peter, on this rock I will establish my church, and the gates of hell will not defeat her. I will give you the key to heaven: Whatever you bind on earth will also be bound in heaven; Whatever you release on earth will also be released in heaven./n ——The Matthew"
bible_educate_decis:0 "Include the Bible in education"
ban_humanized_decis:0 "Prohibition of biological evolution theory"
ban_humanized_decis_desc:0 "In the emptiness and chaos, the Lord created the material world of heaven and earth in six days, and successively created light, atmosphere, dry land, plants, celestial bodies, and animals. On the sixth day, the Lord created Adam and his wife Eve in his own image and placed them in the Garden of Eden, so that their descendants would rule over the whole earth./n ——The Genesis"
ban_globe_decis:0 "Prohibition of the Earth Circle Theory"
ban_globe_decis_desc:0 "Prohibition of the Earth Circle Theory"
ban_alcohol_decis:0 "Prohibition"
ban_alcohol_decis_desc:0 "Don't be a fool, understand the will of the Lord. Do not get drunk, alcohol can lead to debauchery, but be filled with the Holy Spirit./n ——Ephesians"
ban_alcohol_decis_islam_desc:0 "People who believe! Drinking alcohol, gambling, worshipping idols, and seeking divination are just despicable and demonic behaviors, so stay away so that you can succeed./n——Quran"


deci_worship_statue_capital:0 "Building a statue of the great leader in the capital"
deci_worship_statue_capital_desc:0 "Our leader's majestic image should be erected in the most prominent position in the capital to showcase his supreme status!"
deci_worship_statue:0 "在[From.GetName]建造伟大领袖的雕像"
deci_worship_statue_desc:0 "我们伟大领袖的威严形象应当被竖立在国土的每一处，以展示他至高无上的地位！"
deci_worship_book:0 "Publish the works of our leaders"
deci_worship_book_desc:0 "Our leaders possess profound wisdom, outstanding talents, and outstanding leadership skills. Every citizen of ours should read and comprehend the thoughts of our leaders, and unify their line with them."
deci_worship_biography:0 "Publish the biography of our leader"
deci_worship_biography_desc:0 "Our leader has always held the grand ideal of building our country since childhood, and his extraordinary experience of becoming the head of state step by step is worth understanding by every citizen!"
deci_worship_titled:0 "Endow our leader with a new title"
deci_worship_titled_desc:0 "Father of the Nation, helmsman, flag bearer, grand marshal... No matter what title is used to praise our leaders, it is far from enough!"
deci_worship_capital:0 "Name the capital after our leader"
deci_worship_capital_desc:0 "In order to let the people of the whole country firmly remember the honor of our leader, we can use his name to rename our capital, which can make this city even more beautiful!"
deci_worship_home:0 "Expand our leader's hometown"
deci_worship_home_desc:0 "Our leader's hometown has nurtured the greatest figures of our country. We should build a large architectural complex there, including museums and monuments, to showcase the extraordinary life of our leader to tourists."
deci_worship_loyalty:0 "Require the army to be loyal to the great marshal"
deci_worship_loyalty_desc:0 "Our country's military should be unconditionally loyal to our great commander."
deci_worship_ban_protest:0 "Prohibition of protest"
deci_worship_ban_protest_desc:0 "Some subversive elements supported by foreign and hostile forces often organize protests and make absurd anarchist remarks. Leaders are very unhappy when they watch from the balcony of the presidential palace."
deci_worship_party_desc:0 "Organize a party"
deci_worship_party_desc_desc:0 "A grand banquet can both win over political forces and divert the attention of the masses. Bread and circus are always the best means to cover up social conflicts."
deci_worship_spuress:0 "Strike political opponents"
deci_worship_spuress_desc:0 "The policy of the president is the policy of the country, opposing the president is the enemy of the country! The more the enemy opposes the president, the more it means that His Excellency has done the right thing! If a friend opposes the president, it means that the friend is actually an enemy!"
deci_worship_strike_nologies:0 "Strike on intellectuals"
deci_worship_strike_nologies_desc:0 "Intellectuals enjoy participating in politics and becoming potential political opponents, while illiterate individuals only need to work as laborers according to the president's policies."
deci_worship_killed:0 "Public execution of political prisoners"
deci_worship_killed_desc:0 "杀鸡儆猴，以儆效尤。"
deci_worship_luxury:0 "Import foreign luxury goods"
deci_worship_luxury_desc:0 "Luxury cars, villas, jewelry... of course, these luxury goods belong to the people, and Mr. President is only obligated to use them to showcase our country's financial resources in international occasions."
deci_worship_rub_companies:0 "Plundering private enterprise"
deci_worship_rub_companies_desc:0 "Many industrial industries in our country are occupied by capitalists,and Mr. President will represent the people to include these assets under his name. What the President receives is equal to what the people receive."
deci_worship_rub_plants:0 "Plundering plantations"
deci_worship_rub_plants_desc:0 "Many economic crop industries in our country are occupied by large plantation owners,and Mr. President will represent the people to include these assets under his name. What the President receives is equal to what the people receive."
deci_worship_rub_foreign:0 "Plundering foreign investment"
deci_worship_rub_foreign_desc:0 "Many industries in our country are occupied by foreign capital, and Mr. President will represent the people to include these assets under his name. What the President receives is equal to what the people receive."
deci_worship_rub_land:0 "Annex cultivated land"
deci_worship_rub_land_desc:0 "A small number of self cultivated farmers still retain a portion of their land, and the President will represent the country to nationalize these lands and use them wherever he wants."
deci_worship_families:0 "Family government"
deci_worship_families_desc:0 "Leaders have great bloodlines and great families, so it should be considered to appoint their relatives to positions in the government."
deci_worship_:0 "放款腐败"
deci_worship_rub_cash:0 "President's Personal Assets"
deci_worship_rub_cash_desc:0 "Under the guidance of our great leaders, our country is moving towards prosperity and strength, but economic development has led to many countries' wealth being occupied by individual capitalists. There is no other way, so let the President manage these assets for the people."

