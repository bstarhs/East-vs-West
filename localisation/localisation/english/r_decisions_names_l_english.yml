JF_deci_contact_buisness_desc:0 "[From.GetName]地区经济发达，有许多金融、工业和商业的人士希望与人民政府接触。"

JF_deci_contact_minor_leaders:0 "与[From.GetName]少数民族领袖进行接触"
JF_deci_contact_minor_leaders_desc:0 "我们与[From.GetName]地区的少数民族团体的对话取得进展，当地的少数民族首领希望与新中国政府进行合作，我们可以和他们进行进一步的谈判。"
JF_deci_land_refrom:0 "进行[From.GetName]土地改革"
JF_deci_land_refrom_desc:0 "中国最广大的农民阶层长期遭受地主阶级剥削，让农民获得自己的土地，翻身做主人，一直是我党的基本政策，也是我们争取人民群众支持的重要手段。"
JF_deci_advance_land_refrom:0 "进行[From.GetName]进一步土地改革"
JF_deci_advance_land_refrom_desc:0 "[From.GetName]的大部分农民已经分到土地，但只有土地是不够的。当地的农业设施、生产设备和生产资料也要进行进一部的分配，确保农民不仅拥有土地，还要拥有进行农业生产的能力。"

JF_deci_police:0 "设立[From.GetName]公安机关"
JF_deci_police_desc:0 "在[From.GetName]设立人民公安警察机关以维持社会稳定。"
JF_deci_judge:0 "设立[From.GetName]司法机关"
