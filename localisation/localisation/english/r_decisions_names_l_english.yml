Sanmen_dam:0 "Sanmenxia Water Conservancy Project"
Sanmen_dam_desc:0 "The Yellow River is the mother river of the Chinese nation, but it is also a restless mother. Henan and Shandong provinces in the middle and lower reaches of the Yellow River have been affected by the flooding of the Yellow River for a long time, making agricultural production difficult. Located at the corner of the Yellow River at the junction of Henan, Shanxi, and Shanxi, there is an estuary called Sanmenxia. The modern Chinese government has always hoped to build water conservancy projects here to control the water flow of the Yellow River and improve the land conditions of the two provinces in the lower reaches of the Yellow River."
