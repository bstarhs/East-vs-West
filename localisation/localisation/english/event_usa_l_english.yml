 usatext.1.t:0 "US President Truman Delivers State of the Union Address"
 usatext.1.d:0 "Yesterday, President Harry Truman delivered his State of the Union address to Congress. He said that the situation facing the world today is dire and that there are two ways of life in the world. One is based on the will of the majority. Its Characterized by free institutions, representative government, free elections, guarantees of personal liberty, freedom of speech and belief, and freedom from political oppression. The second way of life is based on the will of the minority imposed on the majority. It relies on terror and oppression, suffering Controlled newspapers and radio, domestic elections, and the suppression of individual liberties. I think the policy of the United States must be to support free nations that resist the pressure of armed minorities or foreign peoples trying to subdue them\n This speech caused the Socialt Union vigilance, which the Soviet Union sees as the beginning of hostilities by the United States."
 usatext.1.a:0 "See what happens next."
 
 usatext.4.t:0 "The United States wants to sign a military treaty with us"
 usatext.4.d:0 "Washington has sent us a message to sign a mutual military assistance treaty with our country. The White House asserts that the United States has a responsibility to help the free world. With the support of the United States, we can better cooperate with the Communist Party and its allies Supported opposition to fight."
 usatext.4.a:0 "We should fight alongside the free world."
 usatext.4.b:0 "This is not in our national interest."
 
 usatext.5.t:0 "[From.GetName] has accepted american military cooperation."
 usatext.5.d:0 "Now that the [From.GetName] has signed a mutual defense pact with us, we will fight against Communism and terrorists together in the future."
 usatext.5.a:0 "Very good."
 
 usatext.8.t:0 "American Aid"
 usatext.8.d:0 "U.S. Secretary of State Marshall has proposed a European recovery plan, and the U.S. government will provide European countries with a sizeable loan. Should we accept this money?"
 usatext.8.a:0 "Welcome to America."
 usatext.8.b:0 "It's all a Yankee conspiracy."
 
 usatext.9.t:0 "[ROOT.GetName] accepts our military cooperation."
 usatext.9.d:0 "[ROOT.GetName] has accepted the aid of the Marshall Plan."
 usatext.9.a:0 "Very good."
 
 usatext.10.t:0 "NATO"
 usatext.10.d:0 "Yesterday, the United States, Canada and eight European countries met in Brussels to announce the signing of the North Atlantic Treaty Organization. In this treaty, the United States and other free nations will establish military cooperation to counter military threats. The Soviet Union condemned the treaty as a threat to European socialist countries."
 usatext.10.a:0 "Very good."
 
 usatext.11.t:0 "Marilyn Monroe - Rising Hollywood Star"
 usatext.11.d:0 "With the release of the movie 'Niagara', a new Hollywood actress has captured the media's attention. 27-year-old actress Marilyn Monroe plays a sexy, glamorous killer in the film Daughter of husband, fascinated by audience."
 usatext.11.a:0 "Very good."
 
 usatext.12.t:0 "Marilyn Monroe condolences to US troops in South Korea"
 usatext.12.d:0 "Hollywood actress Marilyn Monroe travels to Seoul to perform for U.S. troops in South Korea."
 usatext.12.a:0 "Very good."
 
 usatext.13.t:0 "Marilyn Monroe Supports Civil Rights Movement"
 usatext.13.d:0 "As the black civil rights movement intensifies, Hollywood actress Marilyn Monroe speaks out. At her insistence, a black actress gets a major role, which is black An important breakthrough in the status of the film and television industry."
 usatext.13.a:0 "Very good."
 
 usatext.14.t:0 "Marilyn Monroe Supports Civil Rights Movement"
 usatext.14.d:0 "Actress Marilyn Monroe, dressed in modest clothing, visited a slum in the suburbs of Los Angeles and had close conversations with residents, many of whom were black. Faced with reporters' questions, Monroe complained And criticized the existing social system in the United States and called for the improvement of the status of the lower class."
 usatext.14.a:0 "Very good."
 
 usatext.15.t:0 "Marilyn Monroe visits Beijing"
 usatext.15.d:0 "Despite the enormous pressure, Marilyn Monroe and her husband Joe DiMaggio made their dream of visiting the People's Republic of China a reality through Switzerland. The Monroes and CCP leaders Mao Zedong met and praised China under Mao Zedong for the liberation of the people. Mao Zedong also praised Monroe's contribution to the American civilian movement, and it seems that the supreme leader of Red China was also fascinated by Monroe's charm."
 
 usatext.16.t:0 "The Marilyn Monroe Scandal!"
 usatext.16.d:0 "Under the cameras of the media, Marilyn Monroe disclosed her lover relationship with US President John Fitzgerald Kennedy! Monroe claimed that Kennedy gave Monroe gifts for a long time, When the two met, Kennedy occasionally leaked state secrets to Monroe. Monroe warned Kennedy that if she could not be given a name, she would reveal the Pentagon's secrets to the public."
 
 usatext.17.t:0 "John F. Kennedy resigns"
 usatext.17.d:0 "Influenced by the events of Marilyn Monroe, Kennedy was forced to resign from his presidency and be replaced by Lyndon Baines Johnson."
 usatext.17.a:0 "Very good."
 
 usatext.18.t:0 "Monroe committed suicide at home!"
 usatext.18.d:0 "Marilyn Monroe was found dead in her home! She collapsed on the sofa at home after taking a large amount of sleeping pills. The FBI announced that Monroe died by suicide, but most people believe that the dream Lou was killed for being involved in a political conspiracy."
 usatext.18.t:0 "What a sad tragedy."
 
 usatext.20.t:0 "The Montgomery Incident"
 usatext.20.d:0 "Some black civil rights movements protest in Montgomery, Alabama, to protest the arrest of Rosa Parks, a black woman who refused to give up her seat to a white man on the bus. Protesters boycott the bus , to demand civil rights for people of color."
 usatext.20.a:0 "The wheel of history has begun..."
 
 usatext.21.t:0 "Black Riots"
 usatext.21.d:0 "Yesterday, some civil rights protesters of color clashed violently with police. They held some demonstrations in cities like Detroit and Chicago, police tried to stop them, but angry protesters rushed To the police car. It caused some injuries."
 usatext.21.a:0 "Calm me all."
 
 usatext.22.t:0 "I have a dream."
 usatext.22.d:0 "Martin Luther King Jr. delivered the greatest speech in American history today at the Lincoln Memorial. "I have a dream that one day this country will rise up and live out the true meaning of its creed: We think These truths are self-evident, that all men are created equal. I have a dream that the sons of ex-slaves and the sons of ex-slave owners will one day be able to sit together at the dinner table in Red Hill, Georgia, in brotherhood. ""
 usatext.22.a:0 "Calm me all."
 
 usatext.23.t:0 "[USA.GetLeader] Meets Martin Luther King"
 usatext.23.d:0 "[USA.GetLeader] President Meets at White House with Civil Rights Leader Martin Rosser King of Color as They Seek Solutions to Black Rights Issues"
 usatext.23.a:0 "Good omen."
 
 usatext.24.t:0 "Civil Rights Act"
 usatext.24.d:0 "Today, the President of [USA.GetLeader] signed a new civil rights bill proclaiming a ban on racial discrimination of all kinds. All racial discrimination in education, public service and other areas will be banned, this is the A new take on the protest movement of people of color."
 usatext.24.a:0 "Good omen."
 
 usatext.25.t:0 "American Progressive Alliance"
 usatext.25.d:0 "The U.S. government invited us to join the Progressive Alliance of the Americas to support the development of Latin American countries. After the Cuban Revolution, Washington realized that poverty and backwardness were the main reasons for the Communism uprising, and that only by uniting with other countries could these be contained. Red Devil."
 usatext.25.a:0 "Good omen."
 
 usatext.27.t:0 "Kennedy was assassinated!!!"
 usatext.27.d:0 "Today, President Kennedy's motorcade passed through the most prosperous districts of Dallas on its parade route in Dallas. The motorcade was driving on the streets of Elm at a speed of only 15 to 20 kilometers per hour. When all was well, The motorcade passed the textbook warehouse in Texas, a gunshot rang out, and President Kennedy was hit in the forehead by a killer on a high-rise building in the distance and collapsed in the back seat of the car..."
 usatext.27.a:0 "Bad news!"
 
 usatext.28.t:0 "JFK is alive!!!"
 usatext.28.d:0 "God bless the president! Fortunately, the killer's bullet only scratched Kennedy's forehead. Both the governor and the first lady were only slightly injured. The killer left the scene quickly after the shooting and took the bus back to his residence. On the ground, agents found the killer's body at his residence."
 usatext.28.a:0 "It's over."
 
 usatext.30.t:0 "Anti-War Rally"
 usatext.30.d:0 "Since the outbreak of the Vietnam War, hundreds of protesters have taken to the streets every month across the country, some in skirmishes with the military and police."
 usatext.30.a:0 "Calm me all."
 
 usatext.31.t:0 "Shooting at the University of Kent!"
 usatext.31.d:0 "In his election campaign, Nixon vowed to end the Vietnam War. But after he was elected, it was announced that U.S. combat troops had been sent to Cambodia to bomb the "Ho Chi Minh Trail" in eastern Cambodia to destroy the The Vietnamese army there. This once again stirred up the anti-war wave of the American people. University of Kent students finally organized a rally to oppose the Vietnam War. The school authorities sent a request to the National Guard to restore order on the campus. The National Guard with guns The team drove into the campus to disperse the demonstrators. The angry students shouted at the soldiers and threw stones. In the chaos, the National Guard opened fire, killing four and wounding many more."
 usatext.31.a:0 "Tragedy!"
 
 usatext.32.t:0 "[USA.GetLeader] delivers State of the Union address"
 usatext.32.d:0 "The President of the United States [USA.GetLeader] delivered his State of the Union address, advocating to replace British and French forces after they left the Middle East. The Middle East Resolution, drafted by Secretary of State Dulles, stated that the United States would impose an "economic cooperation” and military assistance programs; authorizes the President to use force as he deems necessary to “protect” any country that requests military assistance to preserve its territorial integrity and political independence and prevent “Communism aggression.”
 usatext.32.a:0 "OK"
 
 usatext.33.t:0 "Moderation Policy"
 usatext.33.d:0 "The President of the United States [USA.GetLeader] recently proposed a détente with the Soviet Union to reduce the threat of a world war."
 usatext.33.a:0 "OK"
 
 usatext.34.t:0 "Domino Theory"
 usatext.34.d:0 "The President of the United States [USA.GetLeader] speaks at a press conference. He noted that communist revolts are intensifying across Asia, especially in Southeast Asia, as the Chinese Communist Party seizes mainland China. If the communists seize power in North Korea or Vietnam, then Asian countries will be controlled like dominoes, from Vietnam to Laos, Laos, Cambodia, Thailand, Myanmar, Malaysia, etc."
 usatext.34.a:0 "OK"
 
 usatext.35.t:0 "The Taiwan Relations Act"
 usatext.35.d:0 "The US Congress recently passed the Taiwan Relations Act to deal with the special relationship between the United States and the Republic of China after the establishment of diplomatic relations with the People's Republic of China. Although the US government has emphasized the recognition of the People's Republic of China as China The only legitimate government of Taiwan, but still passed the "Taiwan Relations Act", implying that it will still maintain necessary cooperative relations with Taiwan."
 usatext.35.a:0 "OK"
 
 usatext.40.t:0 "Watergate"
 usatext.40.d:0 "In order to obtain intelligence on the Democratic Party's internal campaign strategy, five people, led by James McCord, the chief security adviser to the Nixon campaign, infiltrated the Democratic Party National Committee Office at the Watergate Building in Washington, D.C. Install bugs and secretly photograph relevant documents."
 usatext.40.a:0 "Shame on America!"
 
 usatext.41.t:0 "Nixon resigned!"
 usatext.41.d:0 "Due to the continued fermentation of the Watergate scandal, Nixon tried his best to cover up his excuses, but in the subsequent investigation of the case, many people in the Nixon administration were exposed one after another., and directly related to Nixon himself, which caused a serious constitutional crisis. The U.S. House of Representatives decided that the Judiciary Committee of the House of Representatives would be responsible for investigating and collecting evidence of Nixon's crimes and preparing for the impeachment of Nixon. The Judiciary Committee decided to release all the evidence related to the impeachment of Nixon, and finally passed three articles of impeachment against Nixon. Nixon, under pressure from public opinion, wrote a letter to Secretary of State Henry Kissinger announcing his resignation, thus becoming the first president in American history to resign due to a scandal. "
 usatext.41.a:0 "Liar!"
 
 usatext.60.t:0 "The Kidnapping of Journalists"
 usatext.60.d:0 "In Lebanon, incidents of hostage-taking between pro-Iranian Shiite Muslims and pro-Syrian Sunni Muslims continue to occur. In more than ten days, seven kidnapping incidents have occurred in a row, with a total of nine hostages. detained."
 usatext.60.a:0 "Good luck to them."
 
 usatext.90.t:0 "Texas Independence Movement"
 usatext.90.d:0 "In recent days, some groups in Texas have advocated increasing California's autonomy or independence, and some groups have even claimed to separate California from the United States."
 usatext.90.a:0 "This is not a good sign."
 
 usatext.91.t:0 "California Independence Movement"
 usatext.91.d:0 "In recent days, some groups in California have advocated increasing California's autonomy or independence, and some groups have even claimed to separate California from the United States."
 usatext.91.a:0 "This is not a good sign."
 
 usatext.92.t:0 "Hawaiian Independence Movement"
 usatext.92.d:0 "Since the 1970s, several groups have emerged among Native Hawaiians demanding some form of sovereignty, arguing that the 1893 coup that overthrew the Queen of Hawaii and the 1898 annexation were both illegal , demanding an apology and reparations from the U.S. government for these two events and the prolonged military occupation after 1898. Their campaign for sovereignty forced the U.S. government to start making concessions."
 usatext.92.a:0 "This is not a good sign."

 usatext.93.t:0 "Threats from the Ku Klux Klan"
 usatext.93.d:0 "In recent days, the Ku Klux Klan, a white supremacist organization in the country, has begun to move and target other groups of color."
 usatext.93.a:0 "This is not a good sign."

 usatext.94.t:0 "Southern Rebellion"
 usatext.94.d:0 "The government is reported to be deeply anxious about the growing insurgency in the South. With the rise of the Confederate army, some southern towns and cities in the United States have been occupied by the Confederate army."
 usatext.94.a:0 "This is not a good sign."
 
 usatext.95.t:0 "Calvert Cliffs Nuclear Power Plant Incident"
 usatext.95.d:0 "Last night, the Calvert Cliff nuclear power plant suffered a terrorist attack and a nuclear leak occurred. The second reactor of the nuclear power plant exploded. The successive explosions started a fire and released a large amount of high-energy radiation into the atmosphere. , the fallout covered a large area. The U.S. government urgently evacuated residents near the nuclear power plant. The radiation dose released by the disaster was more than 600 times that of the atomic bomb that exploded on Hiroshima during World War II. Experts estimate that the accident It will cause large areas of no-man's land and hundreds of billions of dollars in damage."
 usatext.95.a:0 "This is not a good sign."
 
 usatext.96.t:0 "The United States invited us to join NATO"
 usatext.96.d:0 "Washington has sent us a message, and after discussion, the White House believes that it is beneficial to invite us to join NATO, which will protect us from Communism and terrorism. At the same time, they also believe that as a As an ally, we have a responsibility to assist other nations in the fight against military threats."
 usatext.96.a:0 "We should fight alongside the free world."
 usatext.96.b:0 "This is not in our national interest."
 
 usatext.97.t:0 "[Root.GetName] has declined our invitation."
 usatext.97.d:0 "The leaders of the [Root.GetName] have rejected our offer, and their wrong decision will expose themselves to the threat of Communism!"
 usatext.97.a:0 "Silly decision!"
 
 nuke.5.t:0 "Restriction of Strategic Arms Talks"
 nuke.5.d:0 "Yesterday, the President of the United States [USA.GetLeader] held an important meeting with the leader of the Soviet Union [SOV.GetLeader] in Vienna. At the meeting, the two sides discussed how to avoid nuclear weapons and weapons of mass destruction The destruction caused to humanity has finally reached an important consensus. The two sides signed the historic Strategic Arms Reduction Treaty, agreeing to destroy some nuclear weapons and limit their development within 10 years."
 nuke.5.a:0 "Because they don't want to see mankind perish."
 
 usatext.99.t:0 "The Trial of the Rosenbergs"
 usatext.99.d:0 "The two leaders of the American Youth Communism Union, Julius Rosenberg and Ethel Greengrass Rosenberg, have been arrested on charges of providing Soviet Union with intelligence on U.S. nuclear weapons. According to The Espionage Act of 1917, they'll be subject to capital punishment."
 usatext.99.a:0 "Silly decision!"
 
 usatext.100.t:0 "The Trial of the Rosenbergs"
 usatext.100.d:0 "The two leaders of the American Youth Communism Union, Julius Rosenberg and Ethel Greengrass Rosenberg, have been arrested on charges of providing Soviet Union with intelligence on U.S. nuclear weapons. According to They were punished by the Espionage Act of 1917. The executions of the Rosenbergs captured the attention of American public opinion, which was widely seen as an injustice under the influence of McCarthyism."
 usatext.100.a:0 "Stupid decision!"
 
 usatext.101.t:0 "Rosenbergs released"
 usatext.101.d:0 "Under the intervention of the U.S. government, the Rosenbergs were eventually acquitted and became survivors of McCarthyism persecution. The Rosenbergs' case has attracted widespread attention in the American society, and people have noticed the crimes of Communism. It could be applied to innocent people, and the FBI and CIA were furious about it."
 usatext.101.a:0 "Stupid decision!"
 
 usatext.102.t:0 "The Trial of the Rosenbergs"
 usatext.102.d:0 "The two leaders of the American Youth Communism Union, Julius Rosenberg and Ethel Greengrass Rosenberg, have been arrested on charges of providing Soviet Union with intelligence on U.S. nuclear weapons. According to They were punished by the Espionage Act of 1917. The executions of the Rosenbergs captured the attention of American public opinion, which was widely seen as an injustice under the influence of McCarthyism."
 usatext.102.a:0 "Stupid decision!"
 
 usatext.103.t:0 "A Commission of Inquiry into Un-American Behavior Established"
 usatext.103.d:0 "Under the leadership of Senator McCarthy, the "Committee of Inquiry into Un-American Conduct" was established. The committee was authorized to investigate the collusion of pro-Soviet Union or pro-Communism forces in the U.S. government and dealt a heavy blow. "
 usatext.103.a:0 "How did the iron fist hit me in the head?"
 
 usatext.104.t:0 "Inquiry into Un-American Practices Disbanded"
 usatext.104.d:0 "Under pressure from the Supreme Court of the United States, the Commission of Inquiry into Absurd Un-American Practice has been dissolved, and the era of McCarthyism has ended."
 usatext.104.a:0 "Stupid decision!"

 usatext.105.t:0 "US government pardons Vietnam War deserters"
 usatext.105.d:0 "President [USA.GetLeader] signed a decree declaring that the US government would pardon American citizens who evaded military service during the Vietnam War."
 usatext.105.a:0 "OK"
 
 usatext.106.t:0 "The prosperity of hippie culture"
 usatext.106.d:0 "The late 1960s was the heyday of the anti cultural movement in Western countries in the 20th century, and the most representative of them was the hippie movement in the United States. Hippies, characterized by long hair, colorful costumes and popular music, devoted themselves to the movement against the Vietnam War, discrimination and the pursuit of pacifism and sexual liberation, and became a landscape of the United States in the 1960s and 1970s."
 usatext.106.a:0 "OK"
 
 usatext.107.t:0 "Greenpeace was founded in Canada"
 
 usatext.108.t:0 "Martin Luther King was assassinated"
 usatext.108.d:0 "Martin Luther King, leader of the African American civil rights movement, was assassinated in Tennessee!"
 usatext.106.a:0 "OK"
 
 usatext.109.t:0 "The assassination of Martin Luther King caused riots"
 usatext.109.d:0 "Martin Luther King, leader of the African American civil rights movement, was assassinated in Tennessee!"
 usatext.106.a:0 "OK"
 
 usatext.110.t:0 "The United States launches a special war"
 usatext.110.d:0 "President [USA.GetLeader] announced that in order to support Vietnam and other Indian ** countries to fight against the expansion of communism and prevent the radicalization of Southeast Asia, the United States will send armed forces to Southeast Asia."
 usatext.110.a:0 "局势不断恶化。"
 
 usatext.111.t:0 "The United States invites us to join the American Progressive Alliance
 usatext.111.d:0 "The United States invites us to join the Alliance for American Progress to jointly protect peace in the Americas and support the development of American countries/ Joining the Organization of American States can provide more economic and military assistance from the United States."
 usatext.111.a:0 "We should accept"
 usatext.111.b:0 "Reject"
 
 usatext.112.t:0 "[FROM.GetName] joining the American Progressive Alliance"
 usatext.112.d:0 "[FROM.GetName]announce joining the American Progressive Alliance led by the United States."
 usatext.112.a:0 "OK"
 
 usatext.113.t:0 "President [USA.GetLeader] propose a change in foreign policy"
 usatext.113.d:0 "President [USA.GetLeader] proposed a new foreign policy for the United States in Guam. The United States will minimize or no longer send ground troops to participate in the defense missions of its Asian allies, but will replace them with military, economic assistance, and nuclear umbrellas."
 usatext.113.a:0 "OK"
 
 usatext.114.t:0 "President [USA.GetLeader] announce strategic weapon defense plan"
 usatext.114.d:0 "President [USA.GetLeader] announced a strategic weapons defense plan to use various means to attack the enemy's intercontinental strategic missiles and spacecraft in outer space, in order to prevent nuclear strikes by hostile countries against the United States and its allies."
 usatext.114.a:0 "OK"
 
 usatext.115.t:0 "Evil Empire"
 usatext.115.d:0 "President [USA.GetLeader] gave a speech at the National Evangelical Association in Orlando, Florida, calling the Soviet Union the evil empire."
 usatext.115.a:0 "OK"
 
 usatext.116.t:0 "George Kennan publishes an X paper"
 usatext.116.d:0 "George Kennan, Counselor of the US Embassy in the Soviet Union, published a paper under the pseudonym of Mr. X on the basis of Soviet actions. George Kennan sharply criticized Russia and the communist government's external expansion, and urged the US government to take action. This paper has been submitted to the United States Department of State, indicating that it will have an impact on the international situation for the next few decades."
 usatext.116.a:0 "OK."
 
 usatext.117.t:0 "The Universal Declaration of Human Rights was promulgated"
 usatext.117.d:0 "The Universal Declaration of Human Rights, drafted by judges dispatched by major member states of the United Nations, was promulgated in Paris. The Declaration was the result of the victory against Nazism in World War II, emphasizing that everyone is born equal and free, and that the freedom of speech, belief, fear, and scarcity of the people cannot be deprived."
 usatext.117.a:0 "OK."
 
 usatext.118.t:0 "Establishment of the United States Air Force"
 usatext.118.d:0 "The US Department of Defense has decided to establish a new independent air force, merging the existing US Army Aviation and Navy Aviation from the Army and Navy to form a new service."
 usatext.118.a:0 "OK."
 
 usatext.119.t:0 "President [USA.GetLeader] expresses support for civil rights reform"
 usatext.119.d:0 "In World War II, African Americans actively joined the military and made significant contributions to defeating the Nazis. However, this did not change the widespread discrimination against black people in the United States, and even led to situations where retired black soldiers were still discriminated against and persecuted. President [USA.GetLeader] issued a statement strongly condemning such behavior and officially announcing that his government will further support the elimination of racial violence."
 usatext.119.a:0 "OK."
 
 usatext.120.t:0 "President [USA.GetLeader] signs Executive Order No. 9981"
 usatext.120.d:0 "President [USA.GetLeader] announced the signing of Executive Order 9981, which declared the complete abolition of racial segregation in the United States military, allowing every American soldier to enjoy equal treatment regardless of skin color."
 usatext.120.a:0 "OK."
 
 usatext.121.t:0 "Alger Hiss case"
 usatext.121.d:0 "The latest article by Whittaker Chambers, editor of Time, has attracted attention from American society. He accused State Department official Alger Hiss of long-term espionage activities for the Soviet Union and the Communist Party, which has raised concerns in American society about communist infiltration activities."
 usatext.119.a:0 "OK."