 EGY_Conciliation_desc:0 "After several Middle East wars, it is an unchangeable fact that Israel cannot be eliminated. Perhaps it is time to change its policy towards Israel."
 EGY_Camp_David:0 "Camp David Agreement"
 EGY_Camp_David_desc:0 "After several Middle East wars, it is an unchangeable fact that Israel cannot be eliminated. Perhaps it is time to change its policy towards Israel."
 EGY_Nasserism:0 "Nasserism"
 EGY_Third_World:0 "Pro Third World"
 EGY_Third_World_desc:0 "The newly formed Republic of Egypt is regarded as an enemy by the British and French powers, but it is also seen by the international community as a rising star in the Third World for the anti colonial movement."
 EGY_Non-Aligned:0 "Non-Aligned Movement"
 EGY_arab_league:0 "United arab republic"
 EGY_arab_league_desc:0 "The unification of the Arab world has always been a great ideal for the people of Arab countries, and now the rise of Egypt will make it possible. Starting from the establishment of a federation, the Arab countries were unified into one country."
 EGY_Muslim_Alliance:0 "Arab league"
 EGY_war_on_Isreal:0 "Confronting Israel"
 EGY_war_on_Isreal_desc:0 "Israel's occupation of Arab land is unacceptable, and his act as a puppet of Britain and America in the Middle East is destined to make them a permanent threat to Egypt."
