 EGY_Corrective_Revolution:0 "Corrective Movement"
 EGY_Corrective_Revolution_desc:0 "The Corrective Movement was a series of political liquidations initiated by Sadat after taking over the presidency of Egypt, which eliminated the influence of Nasserists in Egypt and strengthened Sadat's own authority, thus paving the way for future domestic and foreign policy shifts."
 EGY_Aswan_Dam:0 "Aswan Dam"
 EGY_Aswan_Dam_desc:0 "Since ancient times, the constantly overflowing Nile River has been a concern for the Egyptian people, and the construction of the Aswan Dam was a large-scale project planned by the Egyptian government for a long time. He will save Egypt's agricultural production, but the cost may not be affordable for the Egyptian government."
 EGY_Aswan_Dam_tool:0 "允许通过决议进行阿斯旺大坝的建设，大坝建设分三期工程，每期工程都消耗一定的政治点数、财力和资源，同时还要处理古迹淹没问题，但大坝建成后，将大大改善我国农业生产效果"
