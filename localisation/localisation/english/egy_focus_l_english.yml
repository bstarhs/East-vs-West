l_english:
 EGY_native_egyptism:0 "Egyptian centrism"
 
 EGY_weman_right:0 "Weman right reform"
 EGY_weman_right_desc:0 "Granting women the right to vote is an important milestone in achieving equality and promoting social modernization. When women control the votes, they also control their own destiny."
 EGY_education_refrom:0 "Education reform"
 EGY_education_refrom_desc:0 "二战前发展的教育产业已经日渐不能满足我国经济和社会对产业人才的需求，我们必须用行政手段加紧在全国范围内普及公立的、国际化的科教体系。"
 EGY_new_town:0 "New urban project"
 EGY_contact_iraq:0 "Unificate "
 EGY_united_arab_kingdom:0 "United Kingdom of Arabs"
 EGY_claime_syria:0 "Claime Syria"
 EGY_claime_maghreb:0 "Claime Maghreb"
 EGY_relation_morroco:0 "Relation with Morroco"
 EGY_against_morroco:0 "Against Morroco"
 EGY_relation_saudi:0 "Relation with Saudi"
 EGY_against_saudi:0 "Take back Hejaz"
 
 EGY_misr_al_misr:0 "Misr Al-Misriyun"
 EGY_misr_al_misr_desc:0 "The rise of Egyptian nationalism has made the national identity of Egyptians a political topic. Although Egyptians have been culturally assimilated by Arabs, our bloodline still comes from the ancient Nile civilization. The so-called Arabism will only bind our country to war with Israel and provide an excuse for Islam to oppose modernization. Perhaps Egyptians should reject the Islamic identity brought by Arabs and focus on our great ancestors. The ancient Egyptian civilization can truly bring us national identity and pride, making Misr became Misr."
 EGY_strike_islam:0 "Strike radical muslims"
 EGY_develop_sinai:0 "Develop Sinai"
 EGY_develop_sinai_desc:0 "如果要保护好西奈，就需要在这里建设完善的工业后勤和基础设施。"
 EGY_voice_of_arabia:0 "Sawt Al-Arab"
 EGY_voice_of_arabia_desc:0 "阿拉伯之声广播电台将向阿拉伯世界传播我们的主张，强化阿拉伯人民的团结。"
 EGY_water_project:0 "Water-diversion Project"
 EGY_water_project_desc:0 "随着我国水利技术日益发展，将淡化后的海水引入到沙漠深处，供内地居民使用的计划成为可能。"
 EGY_develop_desert:0 "Develop deserts"
 EGY_develop_desert_desc:0 "埃及的人口不断增长，尼罗河及地中海沿岸的土地已经不够我们使用了。科技的发展让我们把目光放到沙漠深处的绿洲，供水、交通和医疗设施的发展，将让这篇被沙漠覆盖的土地焕发生机。"
 EGY_project_toshka:0 "Toshka project"
 EGY_project_toshka_desc:0 "阿斯旺大坝建造和纳赛尔水库形成后，从水库溢出的河水进入了西南部的沙漠，形成了几个名为托什卡的季节性湖泊。如果将他们利用起来，或许我们可以尝试在湖泊周围建立新的定居点。"
 EGY_solar_powered:0 "Solar power generate"
 EGY_solar_powered_desc:0 "科学技术的进步改变了沙漠国家的未来，如果在沙漠地区发展光伏电池建设，将会大大改善我们的用电问题。"
 EGY_maghreb_railway:0 "Maghreb railways"
 EGY_maghreb_railway_desc:0 "铁路将把埃及和马格里布各地区连接起来，改善当地经济发展，并强化开罗对这些地区的集权。"
 EGY_arabs_railway:0 "UPgrade Arab railways"
 EGY_arabs_railway_desc:0 "电气化的阿拉伯大铁路将把埃及和马什里奇各地区连接起来，改善当地经济发展，并强化开罗对这些地区的集权。"
 EGY_support_west_africa:0 "Support Mujahedeen in Sahra"
 EGY_support_west_africa_desc:0 "撒哈拉沙漠深处的圣战者正在对抗新殖民主义匪徒，我们应当支持他们！"
 EGY_claime_arabstan:0 "Claime Arabstan"
 EGY_claime_arabstan_desc:0 "伊朗西南部的阿拉伯斯坦居住着许多信仰逊尼派的阿拉伯同胞，但他们却被伊朗的什叶派异端残酷统治，我们将解救同胞！"
 EGY_annex_isr:0 "The tears of Moses"
 EGY_annex_isr_desc:0 "让摩西的信徒在三千多年以后再次见证，他们将又一次成为尼罗河之子的奴仆！"
 EGY_latinized_arabs:0 "Latinization of Arabic"
 EGY_latinized_arabs_desc:0 "埃及阿拉伯方言与马什里奇的标准阿拉伯语有很大差别，我们只需要学习土耳其人的经验，将我们的官方文字从阿拉伯文改为拉丁文字，不仅可以大大改善进行文化扫盲的效率，还可以创造出一门独特的语言，从而更好地将埃及从阿拉伯世界区分开。"
 EGY_steelmaking:0 "Steel Industrial"
 EGY_steelmaking_desc:0 "以质量计算,铁是地球上最常见的元素,它加热后有很好的延展性…并且非常有用。铁始于公元前3500年左右,在埃及的盖尔扎赫被发掘出来铁对早期文明所需的各式东西都非常有用:如,蒸煮罐、小五金、工具,以及用来刺伤他人的尖锐武器。"
 EGY_auto_industrial:0 "Auto Industrial"
 EGY_auto_industrial_desc:0 "随着全球汽车产量增加和汽车技术的发展，汽车已不再是一种富人专属的奢侈品，而实进入中产阶层，成为一种重要的消费品。我国的汽车依然高度依赖进口，因此我们需要发展汽车工业，不仅是为了满足消费需求，也是为了让国家更快实现汽车国产、加速经济和工业发展。"
 EGY_oil_refinery:0 "Plastic Industrial"
 EgyInviteHashim:0 "Hasheem house arrived Cairo"
 EGY_united_sudan:0 "Unificate with Sudan"
 EGY_united_sudan_desc:0 "苏丹人民和埃及人民都是尼罗河的子嗣，都是真主的信徒，目前他们正受到英国人的统治，我们应该向英国方面正式提出，要求将苏丹地区的主权移交开罗。"
 EGY_abandon_sudan:0 "Abandoning Sudan"
 EGY_abandon_sudan_desc:0 "目前南方的苏丹正处于英国人通知一下，虽然严格上说，苏丹毫无疑问应该归属埃及，但从长远来看，对苏丹的统治高投入而低回报。应该将苏丹视作一个筹码，向英国人交换更有价值的东西。"
 EGY_Reform:0 "Political"
 EGY_Reform_desc:0 "尽管埃及是一个古老的国家，但在过去的帝国主义时代，我们遭到了英法列强的入侵和控制。现在新的时代已经来临，我们将谨慎选择国家未来的道路。"
