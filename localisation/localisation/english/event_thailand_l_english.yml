l_english:
 sia.1.t:0 "Soldiers launched a coup in Thailand!"
 sia.1.d:0 "After World War II, the government led by Free Thailand ruled Thailand, but their corruption and inefficiency caused dissatisfaction from the military. The army led by Ping Chunwang, Bao Xinong, and Shali Tanale launched a coup, forcing the then Prime Minister to step down, supporting Lieutenant Colonel Kuan Abhaiwongse as Prime Minister, and establishing a preliminary military regime."
 sia.1.b:0 "Confirm."
 
 sia.2.t:0 "Prime Minister Abhaiwongse's new constitution"
 sia.2.d:0 "With the reign of Prime Minister Kuan Abhaiwongse, the gap between him and the military has deepened. There are reports that Prime Minister Abhaiwongse is trying to persuade Congress to pass a new constitution to restrict the rights of the military."
 sia.2.a:0 "This will make Thailand's politics more beautiful."
 sia.2.b:0 "He can't do this!"
 
 sia.3.t:0 "Khuang Abhaiwongse"
 sia.3.d:0 "Prime Minister Khuang Abhaiwongse's disagreement with the military reached a climax and he decided to resign. The military strongman Plaek Phibungsongkhram succeeded the Prime Minister, although Phibungsongkhram had already ruled the country during World War II"
 
 sia.4.t:0 "The Prime Minister was kidnapped"
 sia.4.d:0 "Prime Minister Plaek Phibungsongkhram was kidnapped while attending the ceremony! Rebel sailors are demanding that the military dictatorship step down and restore democracy!"
 sia.4.a:0 "This is impossible! Get ready for action!"
 sia.4.b:0 "We have to give in"
 
 sia.5.t:0 "Thailand rebellion incident was quelled"
 sia.5.d:0 "There was a coup in Thailand, where sailors tried to hijack the Prime Minister to force the military government to step down. The Thai military chose to take action, defeated the rebels and rescued the Prime Minister. After the incident, the Thai military carried out a purge, making the military government's power more stable."
 
 sia.6.t:0 "Thailand Prime Minister was killed!"
 sia.6.d:0 "The Thai army launched an attack on the rebel navy and engaged in a fierce battle with them. The navy quickly retreated, but they shot and killed Plaek Phibungsongkhram before they dispersed. After that, the military government held a solemn funeral for Song Kan, and Thanom Kittikakorn was elected as the new Prime Minister."
 
 sia.7.t:0 "Political struggles within the military"
 sia.7.d:0 "The government of Plaek Khitasangkha is becoming corrupt and incompetent, and has encountered opposition from all sectors of society and even within the military. General Sarit Thanarat considered himself a suitable candidate to replace him and therefore planned to seize power."
 sia.7.a:0 "Plaek Khitasangkha is already too old, let the new leader come up."
 
 sia.8.t:0 "Sarit Thanarat became Prime Minister of Thailand"
 sia.8.d:0 "After ruling Thailand for nearly two decades, Plaek Khitasangkha stepped down under pressure from the military and the king, and General Sarit Thanarat became the new leader of the military government."
 
 sia.9.t:0 "Thailand's new Prime Minister"
 sia.9.d:0 "General Sarit Thanarat died after ruling Thailand for eight years, and Thanom Kittikakorn became the new leader of the military government."
 
 sia.11.t:0 "Kings's visit"
 sia.11.d:0 "The King of Thailand recently visited a rural area to meet with local village leaders and residents to increase the influence of the royal family."
 
 sia.13.t:0 "The Rise of the Communist Party of Thailand"
 sia.13.d:0 "In the context of political turmoil in Thailand, some opponents of the military government are beginning to find another way out. The Communist Party of Thailand rose in northern Thailand and received assistance from China and North Vietnam. The Communist Party of Thailand has announced that a people's war against the military dictatorship has begun."
 
 sia.14.t:0 "The Rise of the Student Movement"
 sia.14.d:0 "After General Thanom Kittikakorn became Prime Minister, he allowed a certain degree of political openness, and more and more college students began to participate in politics and express their dissatisfaction."
 
 sia.15.t:0 "Student demonstrations erupt on the streets of Bangkok"
 sia.15.d:0 "After the military arrested several professors and students, the Thai people's dissatisfaction with the military government fully erupted. Hundreds of thousands of demonstrators gathered in Bangkok to demand the resignation of the military government."
 
 sia.16.t:0 "Thailand's military government steps down"
 sia.16.d:0 "Hundreds of thousands of demonstrators gathered in Bangkok to oppose the military government, and the military was unable to confront. Under the pressure of the king, the head of the military government was forced to resign. The king appointed Sanya Dharmasakti as interim prime minister, and Thailand began a difficult attempt to enter democracy."
 
 sia.17.t:0 "The threat of communism"
 sia.17.d:0 "After the fall of the military government, in addition to the rise of democrats, the influence of communism is also expanding, which requires our vigilance."
 
 sia.18.t:0 "Riots break out in Thailand"
 sia.18.d:0 "Thailand's former dictator, Thanom Kittikakorn, returned to Bangkok after years of exile in the United States. He received a welcome from the right wing, but was boycotted by democratic forces. Hundreds of thousands of people took to the streets of Bangkok to protest against the dictator's return, making the situation in Thailand chaotic again."
 
 sia.19.t:0 "The Holocaust at Thailand's Law and Political University"
 sia.19.d:0 "The shocking news came from Thailand's Law and Political University, where armed right-wing elements broke into and attacked the university, killing nearly 100 people, as students suspected of democracy were defaming the royal family in propaganda. This incident has caused great damage to the democratic movement in Thailand, and the prestige of the democrats has been frustrated. The right wing has declared that only the military government can save the political situation in Thailand."
 
 sia.20.t:0 "Return of the Thai military government"
 sia.20.d:0 "Thailand's three-year democratic experiment ended in failure. In an extremely chaotic political situation, the Thai Democratic Party cabinet was forced to resign, and the king appointed the military chief, Thanin Kraivichien, as prime minister. Thailand once again returned to the era of military dictatorship."
 
 sia.24.t:0 "Border conflict with Laos broke out!"
 sia.24.d:0 "We have a border conflict with the Communist army of Laos!"
 
 sia.25.t:0 "Border conflict with Cambodia broke out!"
 sia.25.d:0 "We have a border conflict with the Communist army of Cambodia!"
 
 sia.30.t:0 "Thailand undergoes a military coup!"
 sia.30.d:0 "After World War II, the government led by Free Thailand ruled Thailand, but their corruption and inefficiency caused dissatisfaction from the military. The army led by Sarit Thanarat launched a coup, forcing the then Prime Minister to step down, supporting Lieutenant Colonel Kuan Apawang as Prime Minister, and establishing a preliminary military regime."
 sia.30.b:0 "Confirm."
 
 sia.32.t:0 "Military coup!"
 sia.32.d:0 "A group of Royal Thai Army soldiers suddenly occupied the palace and radio station, and demanded the resignation of Prime Minister Plaek Phibunsongkhram. They were supporters of exiled Democratic Party member Pridi Banomyong."
 sia.32.b:0 "Confirm."
 
 sia.33.t:0 "Thai regime changes!"
 sia.33.d:0 "Thailand has experienced a military coup! A group of soldiers suddenly attacked and occupied a radio station in the palace, demanding the resignation of General Plaek Phibungsongkhram. This coup received support from the military and the king, forcing Song Kan to resign. Diplomat Direk Jayanama took over as Prime Minister temporarily."
 
 sia.34.t:0 "Thai military coup!"
 sia.34.d:0 "Thailand has experienced a military coup! A group of soldiers suddenly attacked and occupied a radio station in the palace, demanding the resignation of Prime Minister Plaek Phibungsongkhram. The Thai military took action to suppress the coup, and the rebel soldiers were forced to evacuate."
 
 sia.35.t:0 "Pridi Banomyong elected as Prime Minister of Thailand"