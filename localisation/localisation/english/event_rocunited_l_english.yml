l_english:
 rocc.1.t:0 "ROC Army Conquers CCP CentralLiberation Area"
 rocc.1.d:0 "After intense battle, the ROC Army successively occupied multiple important CCP strongholds in the Central Plains areas of Shandong and Hebei. The liberated areas of the Central Plains have been completely eliminated, and the surviving CCP has withdrawn northward."
 rocc.1.a:0 "Good."
 
 rocc.2.t:0 "ROC Army Conquers CCP Shaanxi Liberated Area"
 rocc.2.d:0 "After fierce battle, Kuomintang Army successively occupied multiple important CCP strongholds in Shaanxi, Shanxi and other regions. The liberated area in northern Shaanxi has been completely eliminated, and the surviving CCP has evacuated to the northeast."
 
 rocc.3.t:0 "ROC Army captured the liberated areas of Suiyuan and Chahar"
 rocc.3.d:0 "After intense battle, Kuomintang Army successively occupied multiple important CCP strongholds in Chahar and Suiyuan, and the surviving CCP withdrew to the northeast."
 
 rocc.4.t:0 "ROC Army Conquers Harbin"
 rocc.4.d:0 "After fierce battle, Kuomintang Army captured the last major city and railway core of CCP in the Northeast region, Harbin, and CCP's sphere of influence in the Northeast continued to shrink。"
 
 rocc.5.t:0 "ROC Army Conquers Manzhouli"
 rocc.5.d:0 "After fierce battle, Kuomintang Army captured Manzhouli, an important transportation hub from Northeast China to the Soviet Union, and the connection between CCP and the Soviet Union was completely cut off."
 
 rocc.6.t:0 "ROC Army Conquers Chichihar"
 rocc.6.d:0 "After fierce battle, Kuomintang Army captured the largest city in Northeast Heilongjiang Province, Chichihar."
 
 rocc.7.t:0 "ROC Army Conquers Fuyuan"
 rocc.7.d:0 "Kuomintang Army captured Fuyuan, the most northeastern city in China after fierce battle, which means that the last occupied area of the CPC has basically collapsed."
 
 rocc.8.t:0 "蒋介石宣布戡乱战争完全胜利"
 
 rocc.9.t:0 "阎锡山接任华北行政公署长官"
 
 rocc.10.t:0 "中华民国宣布收编地方部队"
 
 rocc.1.t:0 "CCP溃逃进入远东"
 
 rocc.1.t:0 "毛泽东等CCP领袖被俘"
 
 rocc.1.t:0 "毛泽东等CCP领袖撤往伯力"
 
 rocc.1.t:0 "斯大林宣布介入中国内战"
 
 rocc.1.t:0 "就苏联介入中国战局进行投票"
 
 rocc.1.t:0 "谴责苏联之决议未能通过"
 
 rocc.1.t:0 "联合国要求苏联撤离中国东北"
 
 rocc.21.t:0 "南京方面要求整合我方部队"
 
 rocc.22.t:0 "[From.GetName]宣布接受中央整编"