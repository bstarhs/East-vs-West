l_english:
 city.1.t:0 "Soviet occupation of the Fulda Valley"
 city.1.d:0 "在苏联红军的猛烈攻势下，北约军队被迫撤离富尔达山谷这一战略要地。现在，苏军进攻莱茵河流域西德城市的道路已经畅通无阻。"
 city.1.a:0 "确定。"
 
 city.2.t:0 "Soviet occupation of Frankfurt"
 city.2.d:0 "苏联红军已经占领了联邦德国重要城市、北约驻德部队总司令部法兰克福。"
 city.2.a:0 "确定。"
 
 city.3.t:0 "The capital of [FROM.GetName] has fallen！"
 city.3.d:0 "[FROM.Capital.GetName],Capital of [FROM.GetName] fell under the powerful attack of the enemy! Defenders and citizens were forced to evacuate the city."
 city.3.a:0 "确定。"