l_english:
 kor.1.t:0 "The Republic of Korea is established"
 kor.1.d:0 "After the brutal rule of the Japanese colonists, the Korean people finally ushered in freedom. The Korean government leader Kim Goo announced in Seoul that the Republic of Korea was officially established in Seoul, marking the arrival of a new era on the Korean peninsula. The north is still under the control of the Soviet Union."
 kor.1.a:0 "Long live the independence of Korea!"

 kor.2.t:0 "Korea Elections"

 kor.3.t:0 "Kim Goo becomes President of the Republic of Korea"

 kor.4.t:0 "Syngman Rhee becomes president of the Republic of Korea"
 kor.4.d:0 "One of the leaders of the Korean independence movement, Syngman Rhee, won the South Korean parliamentary election and was elected as the President of the Republic of Korea."

 kor.5.t:0 "It's time to liberate the South!"

 kor.6.t:0 "North Korea invades South Korea!"
 kor.6.d:0 "Communist troops from North Korea invade the South! North Korean leader Kim Il-sung says the Republic of Korea is a puppet of the Americans. The Korean People's Army has launched an attack on the South Korean army at the 38°N parallel and announced that it will again Unify the Korean Peninsula."
 kor.7.t:0 "A new battle has broken out!"

 kor.8.t:0 "South Korea invades North Korea!"
 kor.8.d:0 "The army from South Korea invaded the North! The President of South Korea [KOR.GetLeader] stated that the North Korean Communist Party was a puppet of the Soviet Union and the Chinese. The National Army of the Republic of Korea attacked the North Korean army at the 38°N parallel, And announced that it will reunite the Korean peninsula."
 kor.7.t:0 "A new battle has broken out!"

 kor.9.t:0 "Seoul is occupied!"

 kor.10.t:0 "Busan is occupied!"

 kor.11.t:0 "Pyongyang is occupied!"

 kor.12.t:0 "Chinese People's Volunteers enter North Korea!"

 kor.13.t:0 "United Nations forces enter North Korea!"

 kor.14.t:0 "Peace Negotiations"

 kor.15.t:0 "The Korean Armistice Agreement Signed"

 kor.16.t:0 "The Korean Armistice Agreement Signed"

 kor.17.t:0 "Peace talks break down!"

 kor.18.t:0 "Peace talks break down!!"

 kor.19.t:0 "Park Chung-hee staged a coup!"
 kor.19.d:0 "Due to dissatisfaction with the government's policies, South Korean Army Chief Park Chung-hee and others staged a military coup and led troops loyal to Park Chung-hee to attack the Blue House and Parliament."
 kor.19.a:0 "Quickly suppress the rebellion!"
 kor.19.b:0 "Park Chung-hee is right, we should work with him."

 kor.20.t:0 "Student demonstration!"

 kor.21.t:0 "Park Chung-hee elected president!"

 kor.25.t:0 "Park Chung-hee survived the assassination!"

 kor.26.t:0 "Park Chung-hee was assassinated!"
 kor.26.d:0 "Shocking news! South Korean President Park Chung-hee and his wife, Lu Yingxiu, were attacked by assassin Moon Se-kwang when they were attending the Liberation Day commemoration! The president and his wife were both shot and killed! Moon Se-kwang was arrested on the spot, And most likely related to North Korea. The history of the Republic of Korea has entered a turning point. After Park Chung-hee died, Vice President Choi Gyu-ha took over."
 kor.26.a:0 "Tragedy."

 kor.27.t:0 "Park Chung-hee was assassinated!"
 kor.27.d:0 "Shocking news! South Korean President Park Chung-hee was killed by Intelligence Minister Kim Jae-gyu while dining at the Central Intelligence Agency restaurant in Miyagi-dong! The president was shot in the chest by Kim Jae-gyu with a pistol, and the police chief Cha Ji-cheol also died At present, Kim Jae-gyu has been arrested, and it is uncertain whether he is related to North Korea. The history of the Republic of Korea has entered a turning point. After his death, Vice President Choi Kyu-ha took over."
 kor.27.a:0 "Tragedy."

 kor.28.t:0 "Military coup!"
 kor.28.d:0 "The troops of General Chun Doo-hwan and General Roh Tae-woo suddenly entered Seoul, trying to seize the highest military command and control the presidential palace. General Chun's organization in the South Korean army, the "One Heart Association", has infiltrated the army's high-level, making their coup into the support of the majority of the military."
 kor.28.a:0 "We have no choice but to surrender power."
 kor.28.b:0 "These traitors, stay with me and watch me send tanks to take you to the sky!"

 kor.29.t:0 "The demonstration against Syngman Rhee!"

 kor.30.t:0 "Syngman Rhee flees!"

 kor.31.t:0 "Protests break out in Gwangju!"
 kor.31.d:0 "The Democratic Party, led by Kim Dae-jung, held a rally in Gwangju, issued the "Declaration for the Promotion of a Democratic Nation" and demanded the resignation of President Chun Doo-hwan. Among the demonstrators and as many as 30,000 people at the current rally, the police The demonstrations have been unable to be stopped. Some generals have suggested that we increase our troops against the demonstrators. What should we do?"
 kor.31.b:0 "Give in."
 kor.31.a:0 "Put down the mob immediately."

 kor.32.t:0 "Gwangju Uprising!"
 kor.32.d:0 "The South Korean military sent its armed forces to a massive demonstration in Gwangju. Armored vehicles and helicopters surrounded the city. At Gwangju National University, 54 people were killed when the army opened fire on demonstrators . Angry citizens organized, blocked the army, surrounded the city hall, broke into police stations and arsenals to confiscate guns, organized armed resistance and tried to drive the repressive forces out of the city."

 kor.33.t:0 "金钟泌接任韩国总统"
 kor.33.d:0 "经历了朴正熙遇刺后激烈的政治斗争，韩国迎来了民主的曙光。崔圭夏政府成功清除了军部的影响力，使政权和平移交给民主共和党领袖金钟泌。金钟泌曾是朴正熙的女婿和接班人，但因与朴政见不合辞职流亡美国。金钟泌继任后，可能会采取一系列的改革政策，使得政权平稳地过渡到民主制度。"

 kor.34.t:0 "The United States hopes to support the Korean democratic movement"
 kor.34.d:0 "美国总统[USA.GetLeader]最近在一次讲话中，指责韩国现政府过于独裁和暴力，敦促韩国政府停止侵犯人权，尽快走向民主改革。"

 kor.36.t:0 "The South Korean government proposes a new border line！"
 kor.36.d:0 "The South Korean government has issued a statement announcing the establishment of the maritime boundary line of the Republic of Korea, but this setting includes a large number of areas that overlap with Japan's territorial waters, which has caused dissatisfaction from Japan."

 kor.37.t:0 "The South Korean government requests to improve relations with us!"
 kor.37.d:0 "The South Korean government has issued a statement hoping to improve relations with Japan."

 kor.38.t:0 "Japan and South Korea announce the establishment of diplomatic relations!"
 kor.38.d:0 "The governments of South Korea and Japan have issued a statement announcing the establishment of diplomatic relations between the two countries."

 kor.39.t:0 "Japan refuses to improve relations!"
 kor.39.d:0 "The Japanese government has rejected our country's request to improve the relationship between the two countries."

 kor.40.t:0 "Outbreak of protests and demonstrations!"
 kor.40.d:0 "A student organized protest broke out on the streets of Seoul, protesting against the government's diplomatic agreement with Japan. The history of Japan as an aggressor cannot be erased."

 kor.41.t:0 "The South Korean government launches the New Village Movement"
 kor.41.d:0 "South Korean President [KOR.GetLeader] announced that in order to improve the living standards of the South Korean people as soon as possible and lift them out of poverty, South Korea will launch the New Village Movement to build infrastructure, schools, and other facilities for rural areas, so that rural areas in South Korea can rely on backward development."

 kor.42.t:0 "The South Korean government hopes to improve relations with Pyongyang"
 kor.42.d:0 "South Korean President [KOR.GetLeader] announced that South Korea hopes to improve relations with North Korea and achieve permanent peace on the peninsula and peaceful national reunification as soon as possible."

 kor.43.t:0 "Pyongyang responds"
 kor.43.d:0 "North Korean leader [PRK.GetLeader] responded to South Korea's request and supported the proposal for early peaceful dialogue between the two sides."

 kor.44.t:0 "Pyongyang rejects South Korea's request"
 kor.44.d:0 "North Korean leader [PRK.GetLeader] has rejected South Korea's request, claiming that North Korea will be committed to military reunification of the peninsula."

 kor.45.t:0 "Kim-Koo is assassinated!"
 kor.45.d:0 "The founding father of the Republic of Korea, politician Kim-Koo, was assassinated by extreme right-wing elements! Kim-Koo had previously opposed the establishment of a separate Syngman Rhee government in the south and advocated peaceful negotiations to achieve unification with the Kim Il-sung government in the north. This made him hostile to anti-communists. Kim-Koo was assassinated by a right-wing military officer at his residence!"
 kor.45.a:0 "The situation on the Korea has deteriorated!"

 kor.46.t:0 "Kim Koo dodged the assassination!"
 kor.46.d:0 "The father of the Republic of Korea and North Korean politician Kim Jong il has been attacked at home! Kim Koo had previously opposed the establishment of a separate Synman Rhee government in the south and advocated for peaceful negotiations with the North's Kim Il sung government to achieve reunification, which led to him being met with hostility from anti communists. Kim Koo was assassinated by a right-wing officer at his residence, but security arrived in time to kill the criminals. Kim Koo only suffered minor injuries. The assassination of Kim Koo shocked South Korea, and conspiracy theorists believe that the assassination was orchestrated by South Korean President Synman Rhee. The conflict between him and Kim Koo has a long history."
 kor.46.a:0 "The situation on the Korea has deteriorated!"

 kor.47.t:0 "反对托管统治运动"

 kor.48.t:0 "Synman Rhee elected as interim president of South Korea"
 kor.48.d:0 "One of the leaders of the Korean independence movement, Synman Rhee, won the South Korean parliamentary election and was elected as the President of the Republic of Korea."

 kor.2.t:0 "Found of Democratic People's Republic of Korea"

 kor.2.t:0 "Devided Koran"

 kor.2.t:0 "Kim-Koo make an appeal to the North"

 kor.2.t:0 "Kim Il-sung accept the appeal"

 kor.2.t:0 "Kim Il-sung rejected the appeal"

 kor.2.t:0 "People's Republic of Korea"

 kor.2.t:0 "Kim Il-sung issues initiative to South Korea"

 kor.2.t:0 "Jin Jiu accepts the initiative"

 kor.2.t:0 "Jin Jiu rejects the initiative"

 kor.2.t:0 "Korea infiltrated by Communism"

 kor.2.t:0 "Pro-Americans stage a coup in Busan"

 kor.2.t:0 "North Korea infiltrated by imperialists"

 kor.2.t:0 "Pro-Soviet elements stage a coup d'etat in Luoxian"

 kor.2.t:0 "Jin Jiu passed away"

 kor.2.t:0 "Kim Il Sung unveils new constitution"

 kor.2.t:0 "The Democratic People's Republic of Korea is established"

 kor.2.t:0 "Park Chung-hee staged a coup in Busan"

 kor.2.t:0 "The Yan'an faction has grown stronger"

 kor.2.t:0 "Maximum Movement"

 kor.198.t:0 "Suicide of Jron Il-Tae"
 kor.198.d:0 "South Korean worker leader Jron Il Tae, after pursuing legal rights and interests in vain, chose to self immolate while holding labor laws, which greatly shocked South Korean society."