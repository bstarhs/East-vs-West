l_english:
 join_UN:0 "Joining the United Nations"
 un.1.t:0 "[FROM.GetName]applying to join the United Nations"
 un.1.d:0 "[FROM.GetName]applying to join the United Nations,Do we support it?"
 un.1:0 "Of course,Wlecome"
 
 un.2.t:0 "[FROM.GetName]joined the United Nations"
 un.2.d:0 "[FROM.GetName] becomes a Member of the United Nations"
 
 un.5.t:0 "Weakening of international influence"
 un.5.d:0 "Due to the decline in China's international influence, our international status has plummeted and we have become an isolated country despised by countries around the world."
 un.5.a:0 "Bad news."
 
 un.6.t:0 "Enhancing international influence."
 un.6.d:0 "Due to the increasing international influence of our country, we are no longer an isolated country despised by countries around the world."
 un.6.a:0 "Wonderful."
 
 un.7.t:0 "Enhancing international influence."
 un.7.d:0 "Due to the increasing international influence of our country, we have become a major country respected by countries around the world."
 un.7.a:0 "Wonderful."
 
 un.8.t:0 "Weakening of international influence"
 un.8.d:0 "Due to the decline in China's international influence, we are no longer a major country respected by countries around the world."
 un.8.a:0 "Bad news."
 
 un.9.t:0 "Expert support from the United Nations"
 un.9.d:0 "The experts dispatched by the United Nations have arrived in our country and will assist in improving our education, healthcare, and capacity building."
 un.9.a:0 "Wonderful."
 
 un.10.t:0 "United Nations experts have left."
 un.10.d:0 "The one-year United Nations expert support has ended, and United Nations technical personnel have left our country."
 un.10.a:0 "Farewell to experts"
 
 un.11.t:0 "[ROOT.GetName] launched sanctions resolution to us!"
 un.11.d:0 "[FROM.GetName] has launched sanctions against us on the grounds of endangering war and peace! The resolution is currently awaiting a vote by the members of the Security Council."
 un.11.a:0 "How dare!"
 
 un.12.t:0 "Voting on the Resolution to Sanction [FROM.GetName]"
 un.12.d:0 "联The United Nations has launched a sanctions resolution against [FROM.GetName] on the grounds of endangering peace and human rights! The resolution is currently awaiting a vote by the members of the Security Council."
 un.12.a:0 "[FROM.GetName] must be punished."
 un.12.b:0 "There is no need for this."
 
 un.13.t:0 "[ROOT.GetName]being sanctioned by the United Nations"
 un.13.d:0 "After voting, the majority of countries in the Security Council have decided to launch a sanctions resolution against [ROOT.GetName] on the grounds of endangering peace and human rights!"
 un.13.a:0 "This will affect the progress of the war."
 
 un.14.t:0 "The resolution against [ROOT.GetName] was not passed"
 un.14.d:0 "The resolution against [ROOT.GetName] was not receive the support of the majority of countries in the Security Council."
 un.14.a:0 "This will affect the progress of the war."
 
 un.15.t:0 "Loans from the International Monetary Fund"
 un.15.d:0 "The loan worth 500 political points provided by the International Monetary Fund has arrived."
 un.15.a:0 "Wonderful."
 
 un.16.t:0 "The loan repayment period has arrived"
 un.16.d:0 "The loan repayment period provided by the International Monetary Fund has expired, and we will repay 650 political points with interest and principal."
 un.16.a:0 "OK"
 
 un.17.t:0 "[ROOT.GetName] launched sanctions resolution to us!"
 un.17.d:0 "[FROM.GetName] has launched sanctions against us on the grounds of endangering war and peace! The resolution is currently awaiting a vote by the members of the Security Council.。"
 un.17.a:0 "How dare!"
 
 un.18.t:0 "Voting on the Resolution to Sanction [FROM.GetName]."
 un.18.d:0 "The United Nations condemns [FROM.GetName] for suppressing social movements and endangering human rights! The resolution is currently awaiting a vote by the members of the Security Council."
 un.18.a:0 "[FROM.GetName] Must be punished."
 un.18.b:0 "There is no need for this."
 
 un.19.t:0 "[ROOT.GetName]being sanctioned by the United Nations"
 un.19.d:0 "After voting, the majority of countries in the Security Council have decided to condemn [ROOT.GetName] on the grounds of endangering social movements and human rights! Their international influence has declined significantly."
 un.19.a:0 "This will affect the progress of the war."
 
 un.20.t:0 "The resolution against [ROOT.GetName] was not passed"
 un.20.d:0 "The resolution against [ROOT.GetName] was not receive the support of the majority of countries in the Security Council."
 un.20.a:0 "This will affect the progress of the war.
 
 un.22.t:0 "You have been invited to give a speech at the United Nations！"
 un.22.d:0 "With diplomatic efforts, your diplomatic influence has been improved, and you have been asked to give a speech at the United Nations General Assembly!"
 un.22.a:0 "Discuss the international situation and peace and stability."
 un.22.b:0 "Discuss economic and social development."
 
 un.23.t:0 "Leader of [FROM.GetName] speech at the United Nations"
 un.23.d:0 "As a responsible major country,leader of [FROM.GetFlag][FROM.GetName],[From.GetLeader]give a speech on the international situation and peace issues at the United Nations General Assembly."
 un.23.a:0 "确定。"
 
 un.24.t:0 "Leader of [FROM.GetName] speech at the United Nations"
 un.24.d:0 "As a responsible major country,leader of [FROM.GetFlag][FROM.GetName],[From.GetLeader]give a speech on economic and social development issues at the United Nations General Assembly."