l_english:
 fra.1.t:0 "Government replacement"
 
 fra.3.t:0 "Election 1954"
 
 fra.5.t:0 "Algerian Legion rebellion!"
 fra.5.d:0 "Algerian Legion mutiny! They have lost confidence in the volatile political situation in the Fourth Republic and the incompetence of Algeria. These officers established an interim government in Algiers and asked de Gaulle to form a cabinet to lead France, otherwise they would launch a mutiny!"
 
 fra.8.t:0 "The French government invited Charles de Gaulle to form a cabinet"
 fra.8.d:0 "Under the pressure of the masses, the French president was forced to invite de Gaulle to form a new government. Twelve years after his withdrawal from politics, the leader of Free France once again became the leader of this declining European power."
 
 fra.10.t:0 "Formation of French community"
 fra.10.d:0 "As de colonization became a world trend, France began to relax its control over colonies. France has adopted a new draft constitution, transforming the French Union into a French community and giving African countries certain political rights."
 
 fra.12.t:0 "Student demonstration!"
 
 fra.13.t:0 "1969 constitutional election"
 
 fra.14.t:0 "右翼势力崛起！"
 
 fra.15.t:0 "军事政变！"
 
 fra.16.t:0 "France hopes to improve its relations with us"
 fra.16.d:0 "Since Charles de Gaulle came to power, the French government has been committed to improving relations with European countries. The French Ministry of foreign affairs sent us a message, hoping to further improve relations with China in order to achieve the unity of European countries."
 
 fra.18.t:0 "Reply of [FROM.GetName]"
 fra.18.d:0 "[FROM.GetName] responded to our message that they are very interested in improving bilateral relations and achieving European unity."
 
 fra.19.t:0 "France seeks independent diplomacy"
 fra.19.d:0 "French President De Gaulle recently issued a statement, pointing out that France is now too seriously affected by the political influence of the United States, accusing the United States of turning Europe into a servant country. De Gaulle believed that France must seek an independent path rather than serving the United States. He called on France and Europe to unite and get rid of the political influence of the United States."
 
 fra.20.t:0 "France announced its withdrawal from NATO!"
 fra.20.d:0 "With the growing differences between French President De Gaulle and Britain and the United States, de Gaulle became more and more dissatisfied with NATO's intervention in French military policy. Recently, de Gaulle officially announced that France would withdraw from the NATO military integration structure and withdraw French fleets and troops from the NATO joint forces. De Gaulle also plans to expel all NATO troops stationed on French territory in the future. "
 
 fra.21.t:0 "France expels NATO!"
 fra.21.d:0 "French President De Gaulle issued an ultimatum to us asking NATO troops to withdraw from France within a limited time. How can we reply?"
 
 fra.22.t:0 "The NATO refuses to withdraw!"
 fra.22.d:0 "The United States and other NATO countries refuse to withdraw their troops from our territory!"
 
 fra.23.t:0 "France takes force against NATO forces!"
 fra.23.d:0 "The United States and other NATO countries rejected de Gaulle's ultimatum and refused to withdraw their troops from French territory! De Gaulle decided to take military action and send troops to expel NATO troops. At present, there has been a fierce exchange of fire between the two sides！/n(France must occupy Brussels and Bonn before the war support is less than 60%. If these two goals are achieved, it can win. Otherwise, it will be counted as France's failure, which will lead to de Gaulle's resignation and a sharp reduction in stability）"
 
 fra.24.t:0 "NATO seeks peace from France!"
 fra.24.d:0 "After fierce fighting, the French army not only defeated the NATO forces occupying French territory, but even entered Belgium and Federal Germany. The governments of Brussels and Bonn were forced to sign an armistice agreement with France. Under the threat of de Gaulle, the two countries withdrew from the North Atlantic Treaty Organization. The United States was furious about this, but the withdrawal of Belgium and West Germany basically disintegrated the power of the United States in Europe."
 
 fra.25.t:0 "Édith Piaf去世"
 fra.25.d:0 "法National treasure level female singer Édith Piaf passed away due to liver cancer. Édith Piaf is a well-known French singer and a legendary female singer who has written songs such as La vien de Rose and brought them to the United States. However, Piaf's physical condition gradually deteriorated this year due to alcoholism, and she eventually passed away at the age of only 42. The French government held a state funeral for Piaf to mourn the rose in the hearts of the French people."
 
 fra.26.t:0 "Demonstration against the diplomatic relations with Germany"
 fra.26.d:0 "After news of our decision to improve relations with the Germany spread, large-scale demonstrations erupted across the country, including students, left-wing forces, and World War II survivors. The protesters strongly condemned and opposed the decision to improve relations with Germany, claiming that it was a betrayal of the victims of World War II and a compromise with the Nazis."
 
 fra.27.t:0 "Treaty of Elysee"
 fra.27.d:0 "With the emphasis on unionism in post-war Europe, Germany and France decided to abandon their past grievances and improve their relations. The leaders of the two countries witnessed the signing of the Treaty of German French Relations at the Elysee Palace."
 
 fra.28.t:0 "France announces the establishment of the Rhineland Republic!"
 fra.28.d:0 "The French government has released a message! Paris has decided to establish an independent Rhineland Republic on its occupied German territory and place it under French protection!"
 fra.28.a:0 "The division of Germany has become a foregone conclusion."
 
 fra.29.t:0 "Saarland return to Germany"
 fra.29.d:0 "Representatives from France,Germany, and Saarland signed an agreement in Luxembourg to hold a referendum in Saarland, and based on the results of the referendum, Saarland will join Federal Germany."
 
 fra.30.t:0 "Charles de Gaulle announced support for Quebec"
 fra.30.d:0 "French President Charles de Gaulle shouted in his speech at the Montreal City Hall during his visit to the Montreal World Expo in Canada:Vive le Québec libre! This is considered to be support for the Quebec independence movement, which has sparked support from the French speaking population of Quebec and strong dissatisfaction from Canada."
 
 fra.31.t:0 "France announces support the Quebec independence movement!"
 fra.31.d:0 "The French government has officially announced that they will provide support to the independence movement in Quebec to the best of their ability."
 
 fra.32.t:0 "The monarchist movement is reviving!"
 fra.32.d:0 "Due to the chaotic government of the Fourth French Republic, the French people became increasingly disappointed with the existing French system, and various political movements began to develop, including political parties calling for the abolition of the republican system and the reconstruction of the French Empire, which have also risen in recent years."
 
 fra.33.t:0 "France invites us to join the European Defense Community"
 fra.33.d:0 "The recent expansion of France's influence on the European continent is unsettling. Paris has issued a tough ultimatum to us, demanding that we join their leading European Defense Community."
 
 fra.34.t:0 "[FROM.GetName] has joined European Defence Community"
 fra.34.d:0 "[FROM.GetName] has joined European Defence Community。"
 
 fra.35.t:0 "[FROM.GetName] refuse to join European Defence Community"
 fra.35.d:0 "[FROM.GetName] refuse to join European Defence Community。"
 
 fra.36.t:0 "[FROM.GetName] apply to join  European Economic Community"
 fra.36.d:0 "[FROM.GetName] apply to join  European Economic CommunityAs a member state of the European Community, we will vote, and if more than half of the member states cast a negative vote, [FROM.GetName] will be rejected. The voting deadline is 5 days. Please pause the game time before voting."
 
 fra.37.t:0 "[FROM.GetName] has joined  European Economic Community"
 fra.37.d:0 "[FROM.GetName] has joined  European Economic Community。"
 
 fra.38.t:0 "[FROM.GetName] has refused to join  European Economic Community"
 fra.38.d:0 "[FROM.GetName] has refused to join  European Economic Community。"
 
 fra.39.t:0 "Declaration of signing of the Treaty of Rome"
 fra.39.d:0 "France, Germany, Italy and other countries announced the signing of the Treaty of Rome, marking the formation of the European Economic Community."
 
 fra.40.t:0 "Invite us to join the European Economic Community"
 fra.40.d:0 "European unionism is becoming a consensus in post-war Western Europe, and with the establishment of the European Economic Community by France, Italy, and Germany, we will also have the opportunity to participate."
 
 fra.41.t:0 "Choose our king"
 fra.41.d:0 "France is about to rebuild its monarchy, and the descendants of the Bourbon and Napoleon dynasties have the opportunity to become candidates for the French throne."
 
 fra.42.t:0 "The restoration of the French monarchy!"
 fra.42.d:0 "The political chaos in France ultimately led to surprising and unexpected results. After a referendum in the French National Assembly, France has decided to end the chaotic republic and declare the restoration of the monarchy! [FRA.GetLeader] Invited by the National Assembly to announce the coronation of the King of France!"
 
 fra.43.t:0 "Establishment of the World Health Organization"
 fra.43.d:0 "The World Health Organization, a subsidiary of the United Nations, was established in Geneva, Switzerland. The organization is committed to helping people around the world eliminate diseases."
 fra.43.a:0 "May humanity stay away from diseases"
 
 fra.44.t:0 "法国提出与德国的经济合作"
 fra.44.d:0 "法国外交部长罗贝尔·舒曼召开新闻发布会，宣布该国已决定与德国进行接触，以推动两国之间关于煤炭和钢铁产业的进一步合作。"
 
 fra.50.t:0 "[FROM.GetName]在法兰西共同体内独立"
 fra.50.d:0 "[FROM.GetName]政府正式宣布，该国已经结束了长达数十年的法国殖民统治，实现独立，建立新的共和国政府，但该国依然留在巴黎主导的法兰西共同体内，法国人在未来仍将继续对该国的经济和政治产生影响。"
 
 fra.51.t:0 "决定我们未来命运的公投"
 
 fra.52.t:0 "[FROM.GetName]决定完全独立"
 fra.52.d:0 "[FROM.GetName]政府正式宣布，该国已经结束了长达数十年的法国殖民统治，实现独立，建立新的共和国政府。"
 
 fra.60.t:0 "The Constitution of the Fifth French Republic is promulgated!"
 fra.60.d:0 "The French Parliament officially announced today that the new Constitution of the French Republic has come into effect, and France has entered the era of the Fifth Republic! The new constitution strengthens the power of the president, who will have greater executive power to ensure that the highest executive power is not affected by parliamentary elections or changes in political parties, thereby ensuring stable government governance."
 
 fra.61.t:0 "夏尔·戴高乐正式就任法国总统！"
 fra.61.d:0 "来自巴黎的消息，法国政府正式宣布，已经淡出政坛多年的二战英雄夏尔·戴高乐就任法国总统，再一次领导这个国家！然而目前摆在戴高乐面前的问题不比德国人入侵轻松。法国依然处于政治混乱当中，阿尔及利亚分离主义势力和右翼军人也在蠢蠢欲动。"
 
 fra.62.t:0 "夏尔·戴高乐正式就任法国总统！"
 fra.62.d:0 "来自巴黎的消息，法国政府正式宣布，已经淡出政坛多年的二战英雄夏尔·戴高乐就任法国总统，再一次领导这个国家！然而目前摆在戴高乐面前的问题不比德国人入侵轻松。法国依然处于政治混乱当中，阿尔及利亚分离主义势力和右翼军人也在蠢蠢欲动。"
 
 fra.63.t:0 "商人和工匠防御联盟的成立"
 fra.63.d:0 "一个由小店主皮埃尔·布热德成立的政党在法国南方取得了支持，他们自称商人和工匠防御联盟（UDCA），主张保护中小企业和中产阶级的利益，反对政府剥夺群众，尤其是增税。此外，布热德还支持保守的经济政策，反对过度扩大工业化、城市化和美国经济与文化渗透。媒体认为皮埃尔·布热德属于民粹主义政党。"
 
 fra.64.t:0 "UDCA支持率的迅速提高"
 fra.64.d:0 "法兰西第四共和国的经济下滑引起了中产阶级的强烈不满，使得皮埃尔·布热德的威望和支持率迅速提高。"
 
 fra.65.t:0 "皮埃尔·布热德当选法国总理！"
 fra.65.d:0 "法国大选迎来了令人意想不到的结果！民粹主义政治家皮埃尔·布热德和他的商人和工匠防御联盟获得多数选票，入主波旁宫，而党首皮埃尔·布热德也将进入爱丽舍宫，成为法兰西共和国的下一任总理。皮埃尔·布热德宣布，政府向公民盗窃和索取财产的时代结束了，他将大力削减税收和政府支出，限制政府对市场、金融和私人企业的控制。"
 
 fra.66.t:0 "法国青年民族运动崛起"
 fra.66.d:0 "法兰西第四共和国的政治混乱导致了诡异政治团体的兴起。皮埃尔·西多士是法国法西斯运动的前成员和维希政权的拥护者，他在二战结束后短暂被捕后出狱，最近他又纠结了一批维希政府的残党和第四共和国的反对者，组建了新的法西斯政党——法兰西青年民族。"
 
 fra.67.t:0 "皮埃尔·西多士进入政府"
 fra.67.d:0 "极端右翼法西斯主义者，青年民族运动党首皮埃尔·西多士被法国政府邀请，进入内阁。"
 
 fra.68.t:0 "法国青年民族运动被封杀！"
 fra.68.d:0 "法国政府与警察开展了强硬的反对右翼势力的行动，捣毁多个极端组织，逮捕多个右翼势力头目。青年民族运动被法国警方摧毁，头目皮埃尔·西多士再次被捕二进宫。"
 
 fra.69.t:0 "皮埃尔·布热德淡出政坛"
 fra.69.d:0 "随着法国的经济状况逐渐恢复，皮埃尔·布热德和他的民粹主义政策不再受到狂热的拥护。商人和工匠防御联盟宣布解散，布热德宣布淡出政坛，但他依然热衷于发表政治文章。"
 
 fra.70.t:0 "法兰西民族行动党的崛起"
 fra.70.d:0 "在凯尔特十字旗飘扬的波旁宫，法国的极右翼势力齐聚一堂。在让·马里·勒庞、皮埃尔·西多士和莫里斯·帕彭等极右翼政客的见证下，法兰西青年民族运动、火十字团、西方组织和国民阵线等极右翼党派正式合并，成为法国规模最大的的极右翼政党——法兰西民族行动。"
 
 
 
 fra.100.t:0 "法兰西民主共和国的建立！"
 fra.100.d:0 "红星照耀塞纳河，红旗遍布法兰西。万里江山万里红，人民当家做主人！\n在巴黎公社覆灭七十多年后，无产阶级再一次取得了法兰西共和国的政权！法国共产党取得法国政权后，在法国国会上，正式通过了社会主义的宪法，宣布建立无产阶级专政的社会主义国家！资产阶级的国家机器被废除，非左翼的各种党派被限制活动，法国总统一职被废除，法国共产党总书记[FRA.GetLeader]以部长会议主席的身份入主爱丽舍宫。总书记向全国人民宣布，法兰西将在伟大的党的领导下，完成社会主义改革，建立公正、进步、繁荣的工农阶级社会主义国家！"
 
 fra.101.t:0 "法国共产党召开联合政府大会！"
 fra.101.d:0 "法国共产党政府在最近召开的法国国会上，提出了团结法国各阶级，建立发达的民主社会主义的纲领。法国总理，兼共产党总书记指出，斯大林式的社会主义，是一种危险的极权主义路线，不适合具有民主传统的法兰西，因此法国共产党承诺，不搞苏联模式，不高一党专政，而是团结各民主党派，团结各进步阶级，建立民主的社会主义模式。"
 
 fra.102.t:0 "法国共产党代表与天主教会的会面"
 fra.102.d:0 "法国总理，兼共产党总书记率领左派政党代表团，访问了位于圣丹尼、里昂等地的天主教会，并与教会的大主教会面。这一事件引起了法国国内和各国的关注，因为人们常常认为共产主义与宗教是水火不容的，但法国共产党却主动向天主教会排除橄榄枝，而教会中的左翼人士似乎也愿意支持共产党内阁的一些政策，这有效地缓和了共产党与保守人士的紧张关系，也展示了法国共产党非斯大林主义的一面。"
 
 fra.103.t:0 "法国军队中的左翼势力壮大"
 
 fra.104.t:0 "法兰西人民公社成立！"
 fra.104.d:0 "起来 饥寒交迫的奴隶！  起来 全世界受苦的人！\n满腔的热血已经沸腾 要为真理而斗争！！\n在红旗环绕下的巴黎，在工人的欢呼下，[FRA.GetLeader]主席来到了战神广场。1870年，巴黎公社正是在这里宣告成立，而在无产阶级再一次成为法兰西的主人的今天，为了纪念这一次伟大的、不朽的斗争，为了将公社无产阶级革命的精神传承下去，[FRA.GetLeader]同志宣布，工人阶级领导下的法兰西，不再是一个“资产阶级专政的国家机器”，正式改法国国号为法兰西人民公社，法国政府改为公社制度，建立无产阶级的民主专政，并提出，将法兰西建立为真正的，由工人建立的无产阶级政权！"
 
 fra.105.t:0 "法国陷入恐怖统治！"
 fra.105.d:0 "法国的局势已经失控！从加来到比利牛斯，整个法国都陷入了反共分子与共产党拥护者之间的武装冲突中，鲜血几乎染红了塞纳河与卢瓦尔河！然而法国共产党依然坚信，一切的反对者都是外国敌对势力和封建反动顽固势力的傀儡，面对暴力反抗，只有暴力反抗一个手段。\n疯狂的法国共产党在被改名为“革命者宫”的旧波旁宫中，宣布通过《镇压反革命临时条例》，这个与当年马克西米连·罗伯斯比尔推广的恐怖统治如出一辙的条例，宣布任何被怀疑反对革命政权的可疑分子，都可以立刻拘捕甚至处死，为了威慑反革命分子，当局在埃菲尔铁塔下，竖起了断头台，将多个政治犯斩首，以儆效尤！"
 
 fra.106.d:0 "莫里斯·多列士去世"
 fra.106.t:0 "莫里斯·多列士同志因病在巴黎去世，法国共产党召开会议，选举新一任法国共产党总书记。"
 
 fra.107.t:0 "雅克·杜克鲁斯当选法国共产党总书记"
 fra.107.d:0 "雅克·杜克鲁斯在新一届法国共产党大会上，当选法国共产党总书记。"
 
 fra.108.d:0 "雅克·杜克鲁斯辞职"
 fra.108.t:0 "雅克·杜克鲁斯同志因病在宣布辞职，法国共产党召开会议，选举新一任法国共产党总书记。"
 
 fra.109.t:0 "瓦德克·罗歇当选法国共产党总书记"
 fra.109.d:0 "瓦德克·罗歇在新一届法国共产党大会上，当选法国共产党总书记。"
 
 fra.110.t:0 "让·保罗·萨特当选法国共产党总书记"
 fra.110.d:0 "左翼文学家和哲学家让·保罗·萨特在新一届法国共产党大会上，当选法国共产党总书记。"
 
 fra.111.t:0 "亨利·居里当选法国共产党总书记"
 fra.111.d:0 "法国外交部长亨利·居里在新一届法国共产党大会上，当选法国共产党总书记。亨利·居里是法国与埃及混血，曾参与阿尔及利亚革命，法国的共产党政府成立后，亨利·居里作为外长，积极支持世界各地的左翼革命和反殖民运动，支持世界革命理论。"
 
 fra.112.t:0 "夏尔·贝特海姆当选法国共产党总书记"
 fra.112.d:0 "毛主义政治家夏尔·贝特海姆在新一届法国共产党大会上，当选法国共产党总书记。"
 
 fra.113.d:0 "夏尔·贝特海姆辞职"
 fra.113.t:0 "夏尔·贝特海姆总书记同志宣布因年长辞职，法国共产党召开会议，选举新一任法国共产党总书记。"
 
 fra.114.t:0 "雅克·萨瓦热特当选法国共产党总书记"
 fra.114.d:0 "年轻的学生运动领袖雅克·萨瓦热特在新一届法国共产党大会上，当选法国共产党总书记。雅克·萨瓦热特是巴黎大学学生、巴黎学生自治委员会主席和毛主义者，因成功主导了法国的教育改革，被夏尔·贝特海姆书记看中，被提携进入政府，并迅速升迁。现年四十多岁的雅克非常年轻。"
 
 fra.115.t:0 "法兰西公社委员会的成立"
 fra.115.d:0 "在最近的法兰西人民公社总会议上，法国共产党宣布，随着法兰西革命的胜利、社会主义改造的完成、无产阶级专政的推广和公社委员会制度的落实，法国共产党作为列宁主义先锋党的伟大使命已经结束，因此决定结束党对国家的绝对领导，将国家执政大权力，交给由全国无产阶级民主选举产生的公社委员会，由委员会进行集体领导，委员会的所有常务委员将一起担任国家元首兼政府首脑，一同领导这个国家。"
 
 fra.116.t:0 "让·保罗·萨特辞职"
 fra.116.t:0 "让·保罗·萨特总书记同志宣布因年长辞职，法国共产党召开会议，选举新一任法国共产党总书记。"
 
 fra.117.t:0 "乔治·马歇当选法国共产党总书记"
 fra.117.d:0 "乔治·马歇在新一届法国共产党大会上，当选法国共产党总书记。"
 
 fra.118.t:0 "法国共产党与海外领地的左翼势力接触"
 
 fra.120.t:0 "中国代表团抵达巴黎"
 fra.120.d:0 "赛纳河旁波涛涌，香榭丽舍红旗飘\n在法兰西人民的热烈欢呼下，来自遥远东方的中国革命群众代表团，飞抵巴黎欧仁·鲍迪埃机场，法国人民代表亲切接见了中国代表团。\n中国代表团的这次访问，是应法兰西公社的邀请，前来巴黎，参观和指导法国的文化革命和社会主义思想建设，在伟大的毛泽东思想指导下，法国也展开了轰轰烈烈的无产阶级文化革命，杂碎旧世界，传播新文化、新思想。为了让无产阶级革命艺术也能在法国大地发光发热，法国的革命艺术家，深度学习中国知名革命样板戏《白毛女》和《红色娘子军》，与著名的歌剧《卡门》所结合，创作出了具有革命色彩的《新卡门》，并将其作为法兰西文化革命的重大成果，向中国同志展示。"
 
 fra.121.t:0 "《新卡门》在巴黎歌剧院演出"
 fra.121.d:0 "在遥远的中国农村，农民们正在劳作，红军战士兴奋地前来告诉大家，反动的女地主被抓住了！战士把女地主押来，愤怒的群众声讨女地主，然而年轻的战士却对地主产生了怜悯之心。深夜，女地主将战士引诱到河边，战士被对方所欺骗，便擅自将地主放走。\n战士受到审判，被剥夺职权，又偷偷去找女地主，哪知女地主已投入反动士兵怀抱，抛弃了战士。战士幡然醒悟，找到上级领导汇报敌军阵地，红军派出英勇的红色娘子军前去袭击，全歼反动军队。女地主被俘后再一次试图对年轻战士使用美人计，但这一次战士不再受骗，毫不犹豫地杀死了女地主。\n表演结束后，中国代表团对这一优秀的作品表达了高度的赞赏。"
 
 fra.130.t:0 "[FROM.GetName]宣布拒绝承认法国的新政府！"
 fra.130.d:0 "[FROM.GetName]殖民地当局发表声明，拒绝承认的共产党新政府！"
 
 fra.131.t:0 "非洲民主联盟获取[FROM.GetName]政权！"
 
 
 fra.150.t:0 "工人国际法国支部的衰败"
 fra.150.d:0 "随着戴高乐政府的成立和戴高乐主义的崛起，以工人国际法国支部、激进党等党派为代表的左翼势力支持率不断下降。"
 
 fra.151.t:0 "法国社会党成立" #自然发生
 fra.151.d:0 "面对左翼势力的衰败，法国各左派政党决定团结起来，成立一个新的政党以实现统一。工人国际法国支部、左派重建俱乐部联盟和社会主义团体与俱乐部联盟宣布合并，成立法国社会党。"
 
 fra.152.t:0 "法国社会党进入政府" #国策触发
 fra.152.d:0 "法国社会党的支持率在近期的选举活动中迅速增加，并因此获得了进入法国内阁的资格。"
 
 fra.153.t:0 "法国社会党成立" #左线国策触发
 fra.153.d:0 "在法国共产党提议成立联合政府后，法国的许多左翼政党认为，应该将分散的左翼小党派统合起来，以建立一个可以和共产党二分权力的大党。工人国际法国支部、左派重建俱乐部联盟和社会主义团体与俱乐部联盟宣布合并，成立法国社会党。"
 
 fra.154.t:0 "法国共产党与社会党提出联合纲领"
 fra.154.d:0 "法国共产党与法国社会党共同提出了《二月纲领》，作为未来联合政权的基本法。由于大部分法国民众对共产党通知法国仍有顾虑，共产党决定，支持社会党领袖参选总统。"
 
 fra.155.t:0 "法国总统选举"
 
 fra.156.t:0 "左翼联合阵线赢得法国总统选举"
 
 fra.157.t:0 "弗朗索瓦·密特朗加入法国社会党"
 
 fra.158.t:0 "1980年法国总统选举"
 
 fra.159.t:0 "法国左派联盟瓦解！"
 
 fra.160.t:0 "弗朗索瓦·密特朗当选法国总统！"
 
