 fra.200.t:0 "波尔布特当选法国共产党领导人"
 fra.200.d:0 "随着法共党代会落幕，来自柬埔寨的入籍党员波尔布特，原名沙洛特绍，当选为法国共产党和法兰西人民共和国的新一任领导人，这可能是欧洲的第一位亚裔国家元首。"
 
 fra.201.t:0 "[FROM.GetName]宣布支持法国的反对势力"
 fra.201.d:0 "[FROM.GetName]宣布，法国共产党的上台已经对欧洲的自由带来威胁，该国支持一切反对共产党统治的法国反对派。"
 
 fra.202.t:0 "让·德·拉特尔·德·塔西尼病逝"
 fra.202.d:0 "法国将领让·德·拉特尔·德·塔西尼将军因病去世，他在第二次世界大战时期领导自由法国解放北非和法国南部，并在战后前往亚洲对抗越盟。"
 
 fra.203.t:0 "反对继续越南战争的游行示威"
 fra.203.d:0 "巴黎爆发示威游行，反对继续在印度支那的战事，示威者职责当局在殖民地战争中大量投入了无谓的成本，严重浪费了本国的人力物力财力，呼吁尽早结束战争！"
 
 fra.204.t:0 "反对继续阿尔及利亚战争的游行示威"
 fra.204.d:0 "巴黎爆发示威游行，反对继续在阿尔及利亚的战事，示威者职责当局在殖民地战争中大量投入了无谓的成本，严重浪费了本国的人力物力财力，呼吁尽早结束战争！"
 
 fra.205.t:0 "反对接受马歇尔计划的游行示威"
 fra.205.d:0 "左翼势力发动了示威游行，反对接受马谢尔计划的资助，他们认为这是向美国人屈服并出卖本国利益。"
 
 fra.206.t:0 "反对法国共产党的游行"
 fra.206.d:0 "许多市民和知识分子发起示威游行，反对共产党不断扩大的政治影响力。"
 
 fra.207.t:0 "法国共产党反对政府的劳工政策"
 
 fra.208.t:0 "法国左翼联合政府破裂"
 fra.208.d:0 "随着法国总理与法国共产党、工人党等左翼势力的矛盾不断激化，在二战结束后执掌法国的左派联合政府宣告破裂！共产党的官员被开除出政府，而左派势力斥责当局向帝国主义低头。"
 
 fra.209.t:0 "保罗·拉马迪埃内阁倒台"
 fra.209.d:0 "随着法国总理与法国共产党、工人党等左翼势力的矛盾不断激化，在二战结束后执掌法国的左派联合政府宣告破裂！保罗·拉马迪埃在左翼压力下被迫辞职，右派政党也遭到打击，共产主义者趁机获取了许多国会议席。"
 
 
 fra.250.t:0 "左翼势力的示威游行"
 fra.250.d:0 "新成立的[FRA.GetName]并未能获得所有法国人的认可，支持法国共产党、社会党的左翼势力发起示威游行，反对[FRA.GetRulingParty]！"
 
 fra.251.t:0 "左翼势力发起暴动"
 fra.251.d:0 "反对[FRA.GetRulingParty]的左派势力发起示威游行，并演变成暴力冲突！示威者攻击警察和政府部门，多人受伤。"
 
 fra.252.t:0 "左翼势力发起工人罢工！"
 
 fra.253.t:0 "法国爆发左翼势力与警察的流血冲突！"
 
 fra.254.t:0 "法国共产党在莫斯科成立流亡政府"
 fra.254.d:0 "法国境内反对[FRA.GetRulingParty]的斗争进一步激化，以法国共产党、社会党为代表的左翼政治家逃亡苏联莫斯科，并宣布成立法兰西民主共和国临时政府，呼吁法兰西人民像第二次世界大战时期的自由法国一样，团结起来，反对法国现政府的统治！"
 
 fra.255.t:0 "法国人民解放军成立！"
 fra.255.d:0 "法兰西民主共和国临时政府的支持下，法国左翼武装力量组成的人民解放军正式成立！"
 
 fra.256.t:0 "法国解放军暴动！"
 fra.256.d:0 "法国解放军成立后，政治局势不断恶化，一些激进的左派团体开始组织武装部队，制造暴动。"
 
 fra.257.t:0 "法国解放战争爆发！"
 fra.257.d:0 "来自巴黎的紧急消息！法国左派武装在巴黎、马赛、凡尔赛、圣丹尼多个大城市发起暴动，占领了当地政府！法国人民解放军宣布，法国解放战争已经开始，他们将武力推翻[FRA.GetRulingParty]的暴政，解救法兰西！"
 
 
 fra.260.t:0 "右翼势力的示威游行"
 fra.260.d:0 "新成立的[FRA.GetName]并未能获得所有法国人的认可，反对法国共产党的右翼势力发起示威游行，反对共产主义政府统治！"
 
 fra.261.t:0 "法国天主教保守势力在南方发起暴动！"
 fra.261.d:0 "支持天主教保守势力，反对社会主义改革的保守分子发起示威游行，并演变成暴力冲突！示威者攻击警察和政府部门，多人受伤。"
 
 fra.262.t:0 "保王势力在西部发起暴动！"
 fra.262.d:0 "支持君主制度复辟，反对共和制的保皇分子发起示威游行，并演变成暴力冲突！示威者攻击警察和政府部门，多人受伤。"
 
 fra.263.t:0 "保皇党的崛起！"
 
 fra.264.t:0 "法国爆发右翼势力与警察的流血冲突！"
 
 fra.265.t:0 "法国天主教同盟在西班牙成立流亡政府"
 fra.265.d:0 "法国境内反对[FRA.GetRulingParty]的斗争进一步激化，以国民阵线、民族办公室和天主教教会为代表的保守政治家逃亡西班牙，并宣布成立法兰西天主教救国联盟，呼吁法兰西人民像第二次世界大战时期的自由法国一样，团结起来，反对法国现政府的统治！"
 
 fra.266.t:0 "法国君主制同盟在意大利成立流亡政府"
 fra.266.d:0 "法国境内反对[FRA.GetRulingParty]的斗争进一步激化，以天主教教会为代表的保皇政治家逃亡意大利，并宣布成立法兰西王国救国同盟，呼吁法兰西人民像第二次世界大战时期的自由法国一样，团结起来，反对法国现政府的统治！"
 
 fra.267.t:0 "法兰西救国军成立！"
 fra.267.d:0 "再法兰西救国同盟的支持下，法国右翼武装力量组成的人民解放军正式成立！"
 
 fra.268.t:0 "法兰西救国军暴动！"
 
 fra.269.t:0 "法国内战爆发！"
 fra.269.d:0 "来自巴黎的紧急消息！法国右派武装在巴黎、马赛、凡尔赛、圣丹尼多个大城市发起暴动，占领了当地政府！法兰西救国军宣布，圣战已经开始，他们将武力推翻无神论布尔什维克的暴政，解救法兰西！"
 
 
 fra.280.t:0 "法国极右翼抗议放弃殖民地的政策！"
 fra.280.d:0 "法国放弃殖民地的决定引起了军人、民族主义者、宗教人士等右派的不满，他们在巴黎香榭丽舍大街等地发起示威游行，反对放弃阿尔及利亚等殖民地，并认为这是对在殖民地流血牺牲的军人的背叛。"
 
 fra.281.t:0 "军方抗议放弃阿尔及利亚！"
 
 fra.282.t:0 "秘密军事组织的成立"
 
 fra.283.t:0 "法国决定允许殖民地进行自治"
 
 
 fra.290.t:0 "民主势力的示威游行"
 fra.290.d:0 "新成立的[FRA.GetName]并未能获得所有法国人的认可，反当局的势力发起示威游行，反对[FRA.GetRulingParty]政府统治！"
 
 fra.291.t:0 "民主势力发起暴动"
 
 fra.292.t:0 "民主势力发起工人罢工！"
 
 fra.293.t:0 "法国爆发民主势力与警察的流血冲突！"
 
 fra.294.t:0 "法国民主联盟在伦敦成立流亡政府"
 fra.294.d:0 "法国境内反对[FRA.GetRulingParty]的斗争进一步激化，以法国民主联盟为代表的民主派政治家逃亡伦敦，并宣布成立第二自由法国，呼吁法兰西人民像第二次世界大战时期的自由法国一样，团结起来，反对法国现政府的统治！"
 
 fra.295.t:0 "第二自由法国成立！"
 
 fra.296.t:0 "自由法国军暴动！"
 
 fra.297.t:0 "法国解放战争爆发！"
 fra.297.d:0 "来自巴黎的紧急消息！自由法国武装在巴黎、马赛、凡尔赛、圣丹尼多个大城市发起暴动，占领了当地政府！第二自由法国宣布，新一次的法国大革命已经开始，他们将武力推翻独裁和反动统治的暴政，解救法兰西！"
 
 
 fra.300.t:0 "法国共产党的崛起"
 
 fra.301.t:0 "法国共产党进入内阁！"
 
 fra.302.t:0 "[ROOT.GetName]不承认法国的共产主义政府！"
 fra.302.d:0 "[ROOT.GetName]发表声明，斥责法国共产党统治下的法国政府为非法！！"
 
 fra.303.t:0 "法兰西民主共和国的成立！"
 
 fra.310.t:0 "法国邀请我们加入欧洲防务共同体"
 fra.310.d:0 "法国近期在欧洲大陆的势力扩张令人不安。巴黎向我们发出了强硬的通牒，要求我们加入他们主导的欧洲防务共同体。"
 
 fra.311.t:0 "[FROM.GetName]宣布加入欧洲防务共同体"
 fra.311.d:0 "[FROM.GetName]宣布加入欧洲防务共同体。"
 
 fra.312.t:0 "[FROM.GetName]拒绝加入欧洲防务共同体"
 fra.312.d:0 "[FROM.GetName]拒绝加入欧洲防务共同体。"
 
 fra.320.t:0 "亨利六世参与法国政治活动"
 fra.320.d:0 "随着资本主义和共产主义在法国的威望都受到了一定削弱，君主主义者的活动开始死灰复燃。法国奥尔良王朝唯一的国王路易·菲利普一世的后裔、巴黎公爵亨利六世开始积极参与政治活动。奥尔良王朝可能是在法国波旁王朝绝嗣、拿破仑家族淡出政治后，对君主制复辟最积极的法国皇室。亨利六世提出，法国可以考虑重新确立君主立宪制，以解决第四共和国的政治混乱。"
 
 fra.321.t:0 "奥尔良王朝的复辟！"
 fra.321.d:0 "在法国保皇主义者的支持下，法国的政体公投最终重演了1852的历史！绝大多数法国人已经失去了对共和制的一切信心，最终结果显示，大部分法国人民支持恢复君主制。奥尔良王朝的王位继承人亨利六世得到议会支持，在波旁宫正式宣布，结束法兰西共和国的统治，正式改国号为法兰西王国，重建君主制。"
 
 fra.322.t:0 "亨利六世发表君主立宪制改革方案"
 fra.322.d:0 "亨利六世对法兰西王国的未来政治体制发表讲话。虽然君主制被重建，但他也认为，君主专制制度已不再适合法兰西，未来的法兰西王国依然需要一个现代化的君主立宪体制，国王将仅作为礼仪性质的国家元首，选举产生的议会和内阁将掌握政治权利。"
 
 fra.323.t:0 "邀请夏尔·戴高乐进入政府"
 fra.323.d:0 "夏尔·戴高乐将军和亨利六世陛下是老朋友，二战时期戴高乐曾邀请亨利六世加入自由法国，但亨利六世不愿接触英国人而拒绝。法国解放后，戴高乐隐退政界，而亨利六世却成为了法国的新国王。随着法兰西王国决定实行君主立宪，我们也将寻找一位合适的临时首相，我们认为，没有比夏尔·戴高乐更适合的人选。"
 
 fra.324.t:0 "亨利六世任命夏尔·戴高乐为临时总理"
 fra.324.d:0 "在亨利六世的邀请下，隐退政界多年的法兰西英雄夏尔·戴高乐决定重新出山，接受国王的委托，成为法兰西共和国的临时首相！"
 
 fra.325.t:0 "夏尔·戴高乐选择隐退"
 fra.325.d:0 "尽管好友亨利六世再三邀请，但曾经的法兰西英雄夏尔·戴高乐将军还是选择在最近一次记者会上正式宣布，彻底淡出政坛，不会再参加任何形式的法国新政府。"
 
 fra.326.t:0 "玛丽·勒庞与国民阵线的崛起"
 fra.326.d:0 "君主主义的崛起推动了保守主义政客的壮大。阿尔及利亚战争老兵、UDCA联盟前高官玛丽·勒庞和他的政党国民阵线在最近的选举中宛如一批黑马，取得了许多选票。国民阵线鼓吹反共、反犹太、恢复天主教国教地位和民族主义，被认为是极右翼政党。"
 
 fra.327.t:0 "亨利六世宣布即将举行法国议会大选"
 fra.327.d:0 "随着法国重新建立议会为核心的君主立宪制，亨利六世宣布，法国将在不久以后开始新一次议会选举，并由取得议会多数席位的政党成立内阁。最后，亨利六世将把国家政权交给新内阁，完成向礼仪性君主的过度。"
 
