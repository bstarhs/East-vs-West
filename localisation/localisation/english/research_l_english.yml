 basic_machine_tools:0 "Basic Machine tool"
 basic_machine_tools_desc:0 " Machine tool is not only a machine for industrial production, but also a basic tool for industrial production. Workers process raw materials into products with the help of machine tool. From the earliest spinning and weaving machines to lathes and sawing machines, the large-scale use of industrial machinery marked the beginning of industrialization."
 assembly_line:0 "Assembly line"
 assembly_line_desc:0 "Assembly line is a form of industrial production, that is, work tasks are assigned to each unit, so that each unit only needs to carry out one work or produce one accessory product, and finally complete the assembly. The assembly line was first put into practice by Ford Motor Company of the United States, which greatly increased the output and made large-scale production possible. It is a milestone in industrial history."
 improved_machine_tools:0 "Mechanized Machine tool"
 improved_machine_tools_tools:0 "Electronic devices will greatly improve the efficiency of the Machine Tool."
 advanced_machine_tools:0 "Computer Machine tool"
 assembly_line_production:0 "Robot"
 flexible_line:0 "Resource recycling"
 streamlined_line:0 "Institute of Technology"
 
 concentrated_industry:0 "Copper smelting"
 concentrated_industry_tool:0 "Allow to producing copper"
 concentrated_industry_desc:0 "Copper can be extended under high heat conditions and has conductivity. It has been used by humans for thousands of years since at least 8000 BC. Copper is mainly used on alloys such as bronze, brass, and white copper, all of which are more durable and tough, making it very suitable for making items such as armor and swords. Copper itself also has some useful properties, as people need to consume trace amounts of copper in their diet to prevent diseases that can weaken the body."
 concentrated_industry2:0 "Copper sulfate"
 concentrated_industry2_desc:0 "Decompose copper from copper ore through sulfuric acid solution to obtain copper sulfate, which is then chemically reduced."
 concentrated_industry2_tool:0 "Can §Yupgrade the province level to obtain more building slots§W by decisions"
 concentrated_industry3:0 "Copper electrolysis"
 concentrated_industry3_desc:0 "By electrolyzing copper to separate copper and impurities, higher purity copper can be obtained."
 concentrated_industry4:0 "Traditional ironmaking"
 concentrated_industry4_desc:0 "Blast furnace ironmaking is the most basic industrial ironmaking method, which obtains iron by feeding iron oxide ore and coal slag into the blast furnace for oxidation and reduction. However, this method requires high investment and causes serious pollution."
 concentrated_industry5:0 "Industrial furnace ironmaking"
 concentrated_industry5_desc:0 "Blast furnace ironmaking is the most basic industrial ironmaking method, which obtains iron by feeding iron oxide ore and coal slag into the blast furnace for oxidation and reduction. However, this method requires high investment and causes serious pollution."
 electrolytic_aluminum:0 "Electrolytic aluminum"
 electrolytic_aluminum_desc:0 "Aluminum is one of the indispensable metal materials in modern industry. The production cost of aluminum was extremely high and expensive, but with the modern technology of electrolytic aluminum, we can easily prepare bauxite into alumina."
 steel_making_tech:0 "Steelmaking"
 steel_making_tech_desc:0 "Steelmaking is an important step in converting pig iron into steel. By placing iron ore and coal into a blast furnace, the coal reacts with the iron ore to oxidize and reduce it into pig iron. Finally, carbon is added to the pig iron water as needed for rolling and finally forming steel. Steel is the most important alloy material in modern industry, and steelmaking technology is an indispensable technology in industrial countries."
 coal_collection:0 "Coal ash collection"
 aluminum_tech:0 "Aluminum alloy"
 aluminum_tech_desc:0 "By adding various metal elements to aluminum, we can obtain aluminum alloys with different uses, changing their quality, toughness, conductivity, and oxidation resistance to obtain the metal materials we want."
 electric_arc_furnace:0 "Electric arc furnace ironmaking"
 electric_arc_furnace_desc:0 "An electric furnace that uses electrode arcs to produce high-temperature smelting of ores and metals. When gas discharge forms an arc, the energy is very concentrated, and the temperature of the arc zone is above 3000 ℃. For metal smelting, electric arc furnaces have greater flexibility in the process compared to other steelmaking furnaces, effectively removing impurities such as sulfur and phosphorus. The furnace temperature is easy to control, and the equipment occupies a small area, making them suitable for the melting of high-quality alloy steel."
 electric_arc_furnace_steel:0 "电弧炉炼钢"
 electric_arc_furnace_steel_desc:0 "利用电极电弧产生的高温熔炼矿石和金属的电炉。气体放电形成电弧时能量很集中，弧区温度在3000℃以上。对于熔炼金属，电弧炉比其他炼钢炉工艺灵活性大，能有效地除去硫、磷等杂质，炉温容易控制，设备占地面积小，适于优质合金钢的熔炼。"
 
 dispersed_industry:0 "Traditional Agriculture"
 dispersed_industry_desc:0 "Food is the sky of the people.——Chinese proverb./n Humans have learned in thousands of years of history to grow crops and raise livestock to obtain food from driven plants. In order to improve production and focus on the development of agriculture, farmers improved the land for farming through the first slash and burn cultivation, and then reclamation, irrigation, fertilization and other means, thus forming a farm."
 dispersed_industry2:0 "Agriculture chemistry"
 dispersed_industry2_desc:0 "In the 19th century, the development of chemical technology led to the birth of fertilizers and pesticides. Through artificially produced compound fertilizers and pesticides, soil fertility was improved, diseases and pests were removed, and grain yield was greatly increased. However, the excessive use of fertilizers and pesticides will lead to soil salinization."
 can_foods:0 "Food processing"
 can_foods_tech:0 "Food can be produced in civilian factories"
 dispersed_industry3:0 "Greenhouse"
 dispersed_industry3_desc:0 "Greenhouse is a facility that can improve plant water, soil and light conditions. It is mostly made of glass or transparent plastic film. Through glass or plastic film, the light effect of sunlight on plants can be enhanced, and the increase of water can also be controlled.\n"
 dispersed_industry4:0 "Agricultural Mechanization"
 dispersed_industry4_desc:0 "Tractors, harvesters, planters, shellers and various agricultural machinery mark the arrival of agricultural machinery, which not only greatly improves the production efficiency of agriculture and reduces costs, but also makes large-scale agricultural bases possible. Bringing agriculture into the mechanized era is the basic of a country's agricultural modernization."
 dispersed_industry5:0 "Drip irrigation"
 dispersed_industry5_desc:0 "Drip irrigation is an irrigation mode suitable for water deficient areas such as deserts. It is directly connected to crop roots through pipelines to provide water and nutrients, so as to complete irrigation with the least water consumption and save water resources as much as possible."
 agriculture_modernized:0 "Informationize Agriculture"
 agriculture_modernized_desc:0 "With the development of computer and Internet, agricultural production equipment can be operated through computer, which not only greatly saves labor costs, but also better arranges farming tasks according to climate, soil and other data."
 agriculture_hybird_rice:0 "Hybrid rice"
 agriculture_hybird_rice_desc:0 "Hybrid rice is a kind of rice crop that can improve its yield by cross breeding different varieties of rice. Rice grows in subtropical areas and is the staple food of China, India, Japan and other Asian countries with large populations. The emergence of hybrid rice has greatly increased the grain output of China, India and other countries. It is regarded as an important scientific and technological achievement of the green revolution."
 digital_agriculture:0 "Information agriculture"
 digital_agriculture_desc:0 "The emergence of computers and data systems has also led to rapid development in agriculture. Through computers, farms can better observe the growth status of crops, livestock, and fish fry, and easily operate equipment on farms through computers."
 husbandry_tech:0 "Modernization of husbandry"
 husbandry_feed:0 "Livestock feed"
 husbandry_feed_desc:0 "Food determines human growth and health, and the same applies to animals. By using modern methods to produce feed that meets the needs of livestock, they can grow healthy and strong, producing better quality meat and agricultural by-products."
 animal_doc:0 "Veterinary"
 fishing_net:0 "Trawler"
 frozen_food:0 "Food preservation"
 frozen_food_desc:0 "Freeze preservation is a revolutionary technology in the history of modern agriculture, which not only allows food to be preserved for longer periods of time, but also enables the transportation of grains, meat, and food to further places through vehicles and ships carrying refrigeration devices."
 frozen_tips:0 "All Provinces -2 Food Demand"
 fishing_net_desc:0 "Trawling boats are one of the most important fishing methods in modern fisheries. Fishing boats drag a large net through the ocean to catch all the fish they pass by. Although trawlers have greatly increased fishing efficiency, they have caused significant damage to marine ecology. In the late 20th century, calls for reducing the use of trawls grew stronger."
 
 hight_rub:0 "Materials science"
 synth_oil_experiments:0 "Chemistry industry"
 synth_oil_experiments_desc:0 "After entering the 20th century, with the rapid development of petroleum industry and chemical technology, polymer materials represented by plastics and artificial rubber have been further used. Polyethylene, butadiene, hexane and other products produced in the process of petroleum refining can be processed into artificial plastics and synthetic rubber to replace natural resin and rubber."
 early_refining:0 "Early Refining"
 early_refining_desc:0 "Crude oil can be refined into several materials and substances crucial for modern warfare. Maintaining a leading position in refining technology is necessary for building modern industry."
 polymer:0 "Polymer materials"
 polymer_desc:0 "Synthetic or semi synthetic organic polymers (usually) originate from petrochemical products made of polymer materials, which are very durable, ductile, and lightweight, and are ubiquitous in modern civilization. Plastics come in various forms, some are harder, some are more flexible, and some have better or worse heat resistance. Plastic can be molded, pressed, or extruded into almost any desired shape. Nowadays, plastic can be seen everywhere in life, and its use covers various aspects, from car bumpers to prosthetics, from product packaging to modern furniture, from home entertainment to the latest weapons."
 polymer_tool:0 "Allow the establishment of a Materials Science Research Institute through resolution to accelerate research on technologies such as superconducting materials and nanomaterials"
 superconductivity:0 "Superconducting material"
 superconductivity_desc:0 "Superconducting materials are materials that can reduce resistance to extremely low temperatures, allowing current to conduct in an environment without resistance loss. Superconducting materials were initially used to create strong magnetic fields, such as in instruments such as nuclear magnetic resonance. Later, it was discovered that the strong magnetic field created by superconducting materials could levitate metals (the Meissner effect), making the previously only floating vehicles in science fiction a reality."
 superconductivity_tool:0 "Firstly, complete researcher+150 international influence+200 political points\nAll types of power plants +1 generation"
 
 oil_processing:0 "Oil production"
 improved_oil_processing:0 "Water injection"
 advanced_oil_processing:0 "Chemical flooding"
 modern_oil_processing:0 "Drilling platform"
 
 rubber_processing:0 "Synthetic rubber"
 rubber_processing_desc:1 "Once chemistry took control of civilization, scientists began to search for ways to improve natural animal and plant products. Firstly, Joseph Swan discovered synthetic fibers in the early 1880s; he made fibers from tree bark and used them as filaments for long-lasting use in light bulbs. If used as textiles, the effect would be better. The Frenchman Hilaire Chardonnay invented artificial silk, which was widely praised during an exhibition in Paris in 1889. Subsequently, Hua Lasca Rothers invented nylon. In 1941, Britain invented polyester, which was the first type of polyester fiber and a part of the achievements of the war."
 improved_rubber_processing:0 "Polypropylene"
 vulcanization:0 "Vulcanization"
 vulcanization_desc:1 "Some elements in polymers can react with sulfur, resulting in sulfides that can improve the corrosion resistance of plastics."
 vulcanization_tool:0 "Total consumption of rubber reduced by 20%"
 modern_rubber_processing:0 "Aniline"
 
 construction1:0 "Traditional Building Tech"
 construction1_desc:0 "The workers built buildings out of bricks, wood, and concrete in the scorching sun."
 construction2:0 "Reinforced concrete"
 construction2_desc:0 "Mixing sand, lime, or gypsum in a certain proportion can obtain concrete, reinforced with steel, which is the most important building material in the modern world"
 construction3:0 "Mechanization"
 construction3_desc:0 "With various machinery such as forklifts, excavators, and cement mixers, the efficiency of buildings has greatly improved."
 construction4:0 "Skyscraper"
 construction4_desc:0 "Towering buildings and cranes symbolize our nation progress towards a developed modern society"
 construction5:0 "Refractory bricks"
 construction5_desc:0 "Refractory bricks made of silicon or alumina can improve the quality of buildings."
 
 basic_train:0 "Railway and train"
 basic_train_desc:0 "The speeding trains, the laying of the national railway network, and the minerals, arms and passengers transported on the trains are the symbols of our country's entry into industrialization."
 gasoline_train:0 "Gas locomotive"
 gasoline_train_desc:0 "Steam locomotives fueled by coal mines are old-fashioned. Trains fueled by diesel or gasoline will bring higher transportation efficiency with less energy demand."
 electro_train:0 "Electric train"
 train_equipment_3:0 "Electric train"
 electro_train_desc:0 "Electric power technology will bring railway transportation into a new era, where the speed of electrified high-speed trains not only far exceeds that of gasoline locomotives, but also makes them safer and more energy-efficient."
 railway_control:0 "Railway Management System"
 electro_train_desc:0 "The management and operation of railways can be considered one of the most complex processes in the transportation system, and we need to ensure that every train runs on the track according to regulations without accidents."
 
 power_generation1:0 "Thermal power"
 add_1_plantpower_desc:0 "All thermal power plants +1 generation"
 power_generation2:0 "Fuel power generation"
 power_generation2_desc:0 "The power station can be changed from consuming coal to consuming fuel through a resolution。"
 sun_plant:0 "Solar power"
 sun_plant_desc:0 "A solar electric field is a power plant that utilizes a large number of solar cell arrays to convert the energy of the sun into electricity for consumers. Each array consists of solar panels and has multiple installation methods. Some arrays can rotate according to the trajectory of the sun, while others are fixed (although they are adjusted annually based on changes in the angle between the sun and the Earth). Each array installation method has its own considerations, such as energy output, cost, and effective operating space."
 wind_plant:0 "Wind power generation"
 power_generation3:0 "Improving Steam Turbines"
 power_generation3_desc:0 "By improving the sealing of steam turbines and boilers, increasing the heat resistance of equipment, and using flywheels for energy storage, the working efficiency of generators can be effectively improved."
 cooling_tower:0 "Steam cooling tower"
 cooling_tower_desc:0 "After passing through the power generation turbine, high-pressure steam is usually directly discharged into the atmosphere, but with the help of a cooling tower, we can collect this steam and condense it into water, which is then fed back into the boiler for recycling and reducing waste."
 cooling_tower_tool:0 "Maintenance costs for power plants -20%"
 power_cable:0 "Improving transmission equipment"
 power_cable_desc:0 "The use of composite or polymer material insulators to manufacture cables will greatly improve the lifespan and efficiency of transmission equipment."
 power_cable_tool:0 "Electricity demand in all regions -20%"
 
 medical1:0 "Basic healthcare"
 medical1_desc:0 "Clean water supply and sewage facilities are crucial for the rise of civilization, as without these things, people are more susceptible to disease and death, especially when crowded together in the city center."
 medical2:0 "Pharmaceutics"
 medical2_desc:0 "Modern drugs will help us fight against diseases。"
 medical3:0 "Antibiotic"
 medical3_desc:0 "Antibiotics, also known as penicillin, are the greatest medical inventions of the 20th century. They can inhibit bacterial infections and damage to the body, and can be used for civilian medical treatment as well as war trauma."
 medical4:0 "Vaccinum"
 medical4_desc:0 "Using antibodies produced by humans after illness to produce vaccines to combat infectious diseases. In the 20th century, the widespread use of vaccines eliminated plagues such as smallpox, which had killed millions of people."
 medical5:0 "Surgery"
 medical5_desc:0 "Surgical surgery can help our people fight against difficult and complex diseases, as well as save injured soldiers."
 medical6:0 "Advanced medical facilities"
 medical6_desc:0 "In the second half of the 20th century, the rapid development of science led to the application of X-ray, ultrasound, and CT in medicine."
 cell_tech:0 "Cell science"
 cell_tech_desc:0 "Cells are the most fundamental component of all living organisms, and these cells, composed of elements such as amino acids, make up all animals, plants, and bacteria. In the 20th century, with the development of medicine, scientists began to study cells and search for ways to treat difficult diseases and increase crop yields."
 cell_tech_tip:0 "All cities and urban areas+20% of medical output\nNeed to complete the decision to establish a medical school to accelerate research"
 DNA_tech:0 "Genetic engineering"
 DNA_tech_desc:0 "Gene (DNA), also known as deoxyribonucleic acid, is a protein unit in organisms that can determine the growth, development, and operation of organisms. It determines the appearance, constitution, and even personality of a person and their descendants, and is the most basic design blueprint for animals and plants. In the mid to late 20th century, the study of DNA marked the birth of genetics. Scientists could use DNA to study the properties of organisms, such as detecting DNA to find killers or modifying it to create the desired organisms for humans, such as genetically modified crops or even humans with super strong physiques. However, the latter is full of moral controversy."
 DNA_tech_tip:0 "All cities and urban areas+30% of medical output\nNeed to complete the decision to establish a medical school to accelerate research"
 
 electronic_mechanical_engineering:0 "Electronic technologies"
 radio:0 "Radio"
 radio_detection:0 "Radio broadcast"
 laser_weapon:0 "Optical weapon"
 infraed_homing:0 "Infrared guidance"
 television_guidance:0 "Television guidance"
 television_guidance_desc:0 "By installing a pinhole camera on the missile and transmitting the image to the vehicle, manual operation of the missile can achieve much better accuracy than relying on sensors for guidance, but the cost is also more expensive."
 

 weader_radar:0 "气象雷达"
 weader_radar_desc:0 "通过雷达探测云团的动向和气温变化，气象专家将可以预测气象变化和天气情况。"
 SAR_radar:0 "合成孔径雷达"
 SAR_radar_desc:0 "合成孔径雷达使用微波进行探测，这大大增加了雷达探测的范围和精度，也使得人造卫星搭载雷达成为可能。"
 radar_station:0 "大型雷达站"
 radar_station_desc:0 "雷达越来越先进，其体积和所需要的电力也越大，这需要建设一个专门的雷达站来运行。"
 HTTP:0 "Hyper Text Transfer Protocol"
 HTTP_desc:0 "Hypertext transfer protocol allows computer users to obtain pictures, music and even video data other than text through the Internet. After these information is typeset through the protocol, we can see the web browsing."
 single_chip:0 "Single chip processor"
 single_chip_desc:0 "The rapid development of semiconductor technology has made computer processors no longer bulky and bulky. Only by installing nano level integrated circuits on a tiny chip can a large number of calculations be completed."
 floppy:0 "Soft disk"
 floppy_desc:0 "It is a medium that can be stored using magnetic materials. Compared to magnetic tape, it has a smaller volume, is more convenient for transportation and storage, and is also more convenient for computer use."
 electronic_invade:0 "网络入侵"
 labtab:0 "Laptop computer"
 labtab_desc:0 "Since the emergence of computers, portable computers have been a research direction for scientists. With the increasing maturity of computer technology, the size and components of computers have become smaller and smaller, making it possible to package computers into portable microcomputers."
 ADSL:0 "ADSL"
 ADSL_desc:0 "ADSL mediators can transform telephone signals into data signals that can be used by computers, so that people can use telephones for broadband connection, which is the first step of the wonderful Internet into people's lives."
 Optical:0 "Optical fiber"
 Optical_desc:0 "Fiber optic is a type of fiber made of glass or plastic that uses the principle of total internal reflection to transmit light through these fibers. Due to the much lower transmission loss of information in optical fibers compared to electrical transmission in wires, and also because the main production material is silicon, which has a huge reserve and is easy to mine, the price is very cheap, which has led to the use of optical fibers as long-distance information transmission media."
 net_cable:0 "Improve communication cables"
 net_cable_desc:0 "With the popularization of electronic products and mass media, the demand for communication lines is also increasing. Engineers are beginning to search for ways to make television and telephone lines more durable, safer, and spread further."
 net_base:0 "Communication base station"
 net_base_desc:0 "The popularity of wireless television and wireless telephones requires the government to build more wireless communication base stations to provide wireless networks for users' devices. The difficulty in building communication base stations lies in how to make infinite signals propagate further, be less affected by signals, and shut up old guys who think ionizing radiation will affect their health."
 SSdisk:0 "Fixed disk"
 colored_television:0 "Colored Television"
 colored_television_desc:0 "If only we could capture the true colors of nature. The thought of it drives me crazy.——Andrew Weiss, American neorealist painter"
 advanced_laund:0 "Advanced household appliances"
 advanced_laund_desc:0 "Try the latest air conditioning and refrigerator! It allows you to enjoy the most delicious popsicles and the coolest home in the summer of July!"
 medium_laund:0 "Intermediate household appliances"
 medium_laund_desc:0 "Hand over heavy household chores to the latest washing machines, dishwashers, and vacuum cleaners! So you have time to sit in front of the color TV and watch exciting programs!"
 minor_storage_tape:0 "Cartridge tapes"
 minor_storage_tape_desc:0 "Magnetic tape is currently the most important electronic product data carrier, but its volume is too large. It is crucial to reduce the size of magnetic tape so that it can be used by smaller electronic devices."
 storage_tape:0 "Magnetic tape"
 storage_tape_desc:0 "The development of electronic technology requires us to have more convenient carriers that can record more data. Magnetic tape covered in magnetic powder can be read and recorded by magnetic heads, and it is also cheaper than disposable punch cards."
 minor_vaccum_tube:0 "Micro vacuum tube"
 minor_vaccum_tube_desc:0 "Although vacuum tubes are more stable and durable than transistors, their large size is still a disadvantage, and we need to seek technology to minimize the size of vacuum tubes."
 component:0 "Electronic component"
 component_desc:0 "Small electronic components such as wires, resistors, capacitors, and batteries make up complex and massive electronic devices."
 CRT:0 "Cathode-ray tube"
 CRT_desc:0 "When we watch TV programs, the cathode ray tube behind the glass screen is the core of the entire machine. The cathode ray tube projects a beam of light onto a glass screen, illuminating the phosphorus on the glass to emit light, and changing the intensity of the beam to alter black and white, thereby causing the television to produce images."
 transistor:0 "Transistor"
 transistor_desc:0 "A transistor is like a gear of an electronic device. It can control the current and produce all kinds of data."
 early_computer:0 "Early Computer"
 early_computer_desc:0 "Electronic computer can help us with a large number of complex digital calculations."
 USA_early_computer:0 "ENIAC"
 PRC_early_computer:0 "Type 103 Computer"
 SOV_early_computer:0 "BESM"
 SWE_early_computer:0 "BARK"
 medium_computer:0 "Medium Computer"
 medium_computer_desc:0 "The early electronic computer was very large and consisted of several cabinets. With the development of electronic technology, we can simplify it and make a medium-sized computer the size of a cabinet, making it easier to popularize among the people."
 USA_medium_computer:0 "IBM System"
 SOV_medium_computer:0 "Strela"
 integrated_circuit:0 "Integrated circuit"
 integrated_circuit_desc:0 "Integrated circuit is a technology that can miniaturize the circuit design. By making semiconductor materials into thin films, then cutting and printing according to the circuit design, and finally printing them on the chip base plate, the chip can work through this tiny circuit system. The appearance of integrated circuits has greatly reduced the volume of computer components such as processors, making the emergence of micro computers and small household appliances possible."
 micro_computer:0 "Minor Computer"
 micro_computer_desc:0 "The emergence of integrated circuit and micro processor makes the birth of micro computer possible."
 USA_micro_computer:0 "Altair 8800"
 PRC_micro_computer:0 "	DJS-051A"
 SOV_micro_computer:0 "MIR"
 personal_computer:0 "Personal Computer"
 personal_computer_desc:0 "The popularity of microcomputers will eventually allow computers to enter personal homes for use."
 USA_personal_computer:0 "Apple II"
 SOV_personal_computer:0 "Agat"
 PEX_personal_computer:0 "Changcheng 0520"
 basic_language:0 "Programing language"
 USA_basic_language:0 "BASIC"
 SOV_basic_language:0 "ALGOL"
 laundry:0 "Electronic appliances"
 laundry_desc:0 "Household appliances are the product of modern electronic technological revolution. From washing machines and refrigerators to microwave ovens, these electrical devices greatly facilitate people's lives. Household appliances have been around since the 1930s, but it wasn't until the 1950s after WWII that they began to become widely available."
 cable_television:0 "Cable television"
 cable_television_desc:0 "Before WWII, television had already entered people's homes. After the war, the West relaxed restrictions on the production of television sets, and color television was also invented. The popularity of television increased significantly, gradually replacing radio broadcasting as a part of daily life. In 1954, the United States began broadcasting color TV programs. In 1956, Japan introduced the earliest commercial video tape equipment. In the 1960s, various countries began to popularize color television broadcasting standards, and in the 1980s, LCD television emerged. The popularity of television not only brings entertainment to people, but also serves as a platform for political propaganda."
 telegraph:0 "Mass media"
 telegraph_desc:0 "The popularization of telephones after WWII has made communication engineering an important scientific and technological and municipal construction project. By connecting cities through cables or radios, information can be quickly spread across cities, which is of great significance for military, political, and economic purposes."
 game:0 "Video game"
 game_desc:0 "Electronic games appeared in the 1950s, and it is recognized that the earliest electronic game was the doubles tennis game, which was born in 1958. In the 1960s, electronic games began to develop and take shape. In 1975, the American company Atari launched the earliest home game console, and in 1977, the epoch-making Atari 2600 game console. From then on, electronic games became popular among the people. By the 1980s, electronic games had become a popular entertainment activity around the world. Nintendo in Japan launched its first portable game console, Game Boy, in 1985, The Soviet Union also copied some arcade game consoles during the same period."
 internet:0 "Internet"
 internet_desc:0 "The earliest Internet refers to a computer network, which connects computers through communication technology, enabling users of each computer to quickly share information. The existing computer network originated in the 1960s. The United States military established a computer network through ARPANET to achieve rapid transmission of military information. Computer networks entered the private sector in the 1970s, and the World Wide Web was born in 1989. \nThe Soviet Union also developed a computer network in the late 1950s, but failed for various reasons (see OGAS entry for details)."
 civic_internet:0 "World Wide Web"
 sub_cable:0 "Submarine cable"
 sub_cable_desc:0 "Submarine cables can lay communication cables on the seafloor, allowing information to spread across continents."
 mobilized_telephone:0 "Mobile phone"
 mobilized_telephone_desc:0 "A mobile phone is a phone that can communicate without connecting a signal line. The earliest mobile phones appeared in the Soviet Union in the 1950s, but due to their large size, they could not be popularized. The Motorola DynaTAC, developed by Motorola in the 1980s, was the first commercial mobile phone, opening a new era of communication tools."
 USA_mobilized_telephone:0 "Motorola DynaTAC"
 cellular_network:0 "Cellular network"
 decimetric_radar:0 "Radar"
 improved_decimetric_radar:0 "Phased radar"
 improved_decimetric_radar_desc:0 "Phase radar, also known as array radar, is a type of radar that arranges sensors on a plane. By changing the frequency of the sensors, the beam transmitting direction is adjusted, so that the radar itself can scan to a larger range and distance without needing to adjust the direction. Phase radar is widely used for scanning fighter jets and warships, and can also be used to scan Helicopter missiles."
 centimetric_radar:0 "Sky wave radar"
 improved_centimetric_radar:0 "Missile early warning radar"
 computer_consol:0 "Console"
 mechanized_industry:0 "Mechanized industry"
 computer_industry:0 "Automated production management"
 OGAS_desc:0 "OGAS, is an idea of an intelligent economic system under the control of a computer proposed by the Soviet scientist Grushkov in the 1970s. Under the OGAS plan, economic data from the entire Soviet Union would be collected and entered into a computer, which would then be used to formulate production development plans. Grushkov advocated replacing the Soviet bureaucracy with a computer that was intelligent, did not require rest, and would not corrupt, thereby improving the planned economic system and achieving communism. However, this plan ultimately failed under the obstruction of Soviet bureaucrats."
 AI_tech:0 "Artificial intelligence"
 AI_Robot:0 "Intelligent robot"
 
 
 add_space_power_30:0 "Space power +30"
 
 space_research:0 "Space project"
 space_research_desc:0 "\nThe earth is the cradle of mankind, but mankind cannot live in the cradle forever.\n——Konstantin Tsiolkovsky,Soviet Physicist"
 rocket_vehicle:0 "Launch vehicle"
 rocket_vehicle_desc:0 "The rocket weapons left by Germany in the second world war can become a pioneer in space exploration after transformation. Through launch vehicles, we can send satellites and even people into space."
 tech_Satellite:0 "Satellite"
 tech_Satellite_desc:0 "Launching man-made spacecraft into space with the help of launch vehicles is the first step for mankind to enter space."
 communie_Satellite:0 "Communication satellite"
 communie_Satellite_desc:0 "Artificial satellites fly around the earth and cover a wide range. If communication devices are installed on them, we can effectively spread our information to the world."
 rocket_engine:0 "Improved rocket engine"
 rocket_engine_desc:0 ""
 tech_spacemanned:0 "Manned space project"
 astronaut_uniform:0 "Improved spacesuit"
 astronaut_uniform_desc:0 "In order to enable our astronauts to move in outer space in a safer state, we need to improve the indicators of spacesuits."
 adv_cockpit:0 "Improved cockpit"
 adv_cockpit_desc:0 "Using computer to transform the cockpit, astronauts can operate the aircraft more conveniently."
 land_center:0 "Launch Center"
 land_center_desc:0 "Space engineering lies not only in developing spacecraft, but also in keeping with the ground control center. Improve ground communication equipment and control equipment, and use computer for control more."
 command_center:0 "Ground control center"
 solar_power:0 "Solar panel"
 solar_power_desc:0 "The use of solar cells makes it possible for spacecraft to obtain energy with the help of the sun, prolong the life of spacecraft, and make the construction of space station possible."
 capsule_recover:0 "Cabin recovery"
 moon_landing:0 "Moon landing"
 moon_landing_desc:0 "The ideal of human expeditionary space has taken the first step successfully. In the next step, we want to realize the exploration of the solar system. The first goal is our neighbor - the moon."
 modularization:0 "Modularization"
 modularization_desc:0 "Different parts of the spaceship are manufactured first and then assembled, which can greatly reduce the cost of building the spaceship and can also be used in the construction of large space stations in the future."
 space_station:0 "Space station"
 space_station_desc:0 "An important step in the human expedition into space is to build a foothold in the universe. Build a space station to make it a base for human beings in space, where astronauts can rest, supply, engage in research activities, and even live for a long time."
 space_live:0 "Space life"
 space_live_desc:0 "If you want to live in space for a long time, you must provide astronauts with enough means of living. Clothing, food, medicine and other affairs should be specially provided."
 lunar_rover:0 "Discovery vehicle"
 lunar_rover_desc:0 "Before human beings go to Mars and other planets to explore, we need to send some machines to explore instead of us and collect the required information."
 space_shuttle:0 "Space shuttle"
 space_shuttle_desc:0 "With the completion of the construction of large space station, it is very uneconomical to use launch vehicle for replenishment. We need a more advanced and efficient spacecraft, which can complete the task of delivering supplies to the space station more economically and conveniently, and can be returned to the ground for multiple use."
 reconnaissance_satellite:0 "Military reconnaissance satellite"
 reconnaissance_satellite_desc:0 "The broad vision of man-made satellites will provide us with more reconnaissance intelligence."
 space_research:0 "Space technology"
 
 atomic_research:0 "Atomic technologies"
 INFANTRY_NUKES_WEAPONS:0 "Nuclear weapons"
 nukes:0 "Atomic bomb"
 thermonuclear:0 "Hydrogen bomb"
 thermonuclear_desc:0 "Hydrogen bomb mainly uses the energy released by the nuclear fusion reaction of hydrogen isotopes to kill and destroy. It has greater destructive power than atomic bomb."
 neutron_bomb:0 "Neutron bomb"
 neutron_bomb_desc:0 "Neutron bomb is a low-quality tactical hydrogen bomb with high-energy neutron radiation as the main lethality. Its purpose is to kill enemy personnel and cause relatively little damage to buildings and facilities. It is mainly used as a tactical nuclear weapon."
 dirty_bomb:0 "Dirty bomb"
 INFANTRY_STRAIT:0 "Nuclear stratic"
 deterrence:0 "Nuke deterrence"
 deterrence_desc:0 "In the game of great powers, the main function of nuclear weapons is not to use them on the battlefield, but to exist as a deterrent. Possessing nuclear weapons means having an international voice, which can not only avoid the intimidation of great powers, but also be used to intimidate others."
 nuke_banlance:0 "Nuke banlance"
 disarmament:0 "Nuclear disarmament"
 disarmament_desc:0 "With the international community's growing resistance to nuclear war, possession of a large number of nuclear weapons has become an unwelcome target. Some reduction in the number of nuclear weapons can improve their image and reduce military expenditure to a certain extent."
 Mutual_Assured_Destruction:0 "Mutual assured destruction"
 Mutual_Assured_Destruction_desc:0 "At the peak of the nuclear power game, only by ensuring the use of nuclear weapons to destroy each other can we effectively avoid the outbreak of a real nuclear war."
 second_strike:0 "Second strike"
 second_strike_desc:0 "With the help of nuclear submarines and solid underground launch facilities, we can ensure that our nuclear weapon bases will not be completely wiped out in a nuclear attack by the enemy, and that we still have the ability to counterattack after a nuclear attack."
 INFANTRY_NCPLANT_WEAPONS:0 "Nuclear power generation"
 nuclear_plant_1:0 "Nuclear power I"
 nuclear_plant_2:0 "Nuclear power II"
 nuclear_plant_3:0 "Nuclear power III"
 INFANTRY_SHELTER:0 "Shelter"
 duck_cover:0 "Duck and cover"
 shelter_1:0 "Air defense shelter"
 shelter_2:0 "Nuclear shelter"
 shelter_3:0 "Long time  shelter"
 
 helmet:0 "Helmet"
 helmet_desc:0 "Helmet is an invention that changed modern war. It protects the head of soldiers from shrapnel. It was widely used after World War I."
 pattern:0 "Camouflage"
 pattern_desc:0 "Camouflage suits can make soldiers better hide themselves with the help of terrain and improve their survivability. In World War II, camouflage suits were only used by special forces such as snipers or paratroopers. After World War II, countries began to develop camouflage suits for troops as standard clothes."
 gasmask:0 "Gas mask"
 gasmask_desc:0 "The large-scale use of chemical weapons in World War I led to the use of military gas masks, which will protect soldiers from inhaling toxic gas to improve their chances of survival."
 NBCsuit:0 "NBC equipment"
 NBCsuit_desc:0 "As the threat of nuclear war intensifies and the threat of weapons of mass destruction such as chemical weapons, biological weapons and tactical nuclear weapons to the army intensifies, we need to develop more advanced chemical protective clothing, gas masks and drugs to strengthen the survival ability of soldiers in special environments."
 vest:0 "Bulletproof vest"
 vest_desc:0 "With the progress of military technology, individual equipment is becoming more and more advanced. The strap type equipment made of canvas and nylon can no longer meet the carrying needs of soldiers. The tactical vest can not only meet the needs of soldiers, but also install bulletproof inserts to provide protection."
 
 interwar_artillery:0 "Smoke bomb"
 interwar_artillery_desc:0 "Launching smoke bombs can block the vision of enemy forces and cover our attack or transfer."
 artillery2:0 "Artillery reconnaissance radar"
 SOV_artillery2:0 "Zoopark-1"
 artillery2_desc:0 "Artillery reconnaissance radar can help us search the position of enemy artillery by calculating the trajectory of artillery shells launched by the enemy, so as to counterattack."
 artillery3:0 "Laser range finder"
 artillery3_desc:0 "Optical rangefinder can help artillery calculate enemy distance, so as to improve accuracy."
 artillery5:0 "Fire control"
 artillery5_desc:0 "The computer will better improve the artillery ranging ability."
 
 antiair:0 "Anti-Air gun WWII"
 antiair1:0 "Searchlight"
 antiair1_desc:0 "Searchlights enable our artillery to better search for targets at night."
 antiair3:0 "Tracer shell"
 antiair3_desc:0 "Tracer bullet is a shell with luminous agent at the bottom of the bullet. When fired, the ignited agent will emit huge light, illuminate the night sky and leave a long tail. The gunner can observe the flight track of the projectile and calibrate the trajectory according to the trace of the tracer bullet. The tracer bomb can also be used as a flare or signal bomb."
 antiair4:0 "Fire control"
 SOV_antiair4:0 "RPK-2"
 antiair4_desc:0 "The combination of modern radar, computer and automatic loading system will become the key for air defense gun to deal with high-speed aircraft in time."
 AIR_TITLE_CAS:0 "Attacker\n"
 
 basic_medium_td:0 "High explosive bomb"
 basic_medium_art:0 "Composite armor"
 basic_medium_art_desc:0 "Composite armor refers to multi-layer armor with ceramic and other high-temperature resistant materials added to two steel plates to resist the high temperature emitted by armor piercing ejection."
 basic_medium_spaa:0 "Diesel engine"
 basic_medium_spaa_desc:0 "Compared with gasoline, diesel fuel is smaller and less prone to explosion, so that tanks can carry more fuel at one time."
 
 improved_medium_td:0 "Depleted uranium shell"
 autoloader:0 "Automatic loader"
 improved_medium_art:0 "Reactive armor"
 improved_medium_art_desc:0 "Reactive armor is an explosive device installed outside the tank. When it is hit by a shell, the reactive armor will explode to counteract the high-temperature pulse emitted by the armor piercing projectile."
