 ENG_State_monopoly:0 "The Beeching Reports"
 ENG_State_monopoly_desc:0 "The Beeching acts is a policy implemented by the British government in the late 1970s to reduce the national railway network, so as to reduce the cost of the declining railway transportation industry."
