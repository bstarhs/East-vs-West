 ENG_chulchil_plan_desc:0 "The Churchill Plan was a plan proposed by Winston Churchill to divide Germany after World War II, which included the establishment of a pro British regime in the Hanover region of northwestern Germany. In history, the Hanover royal family ruled England as the nephew of Queen Anne and unified these two regions."
