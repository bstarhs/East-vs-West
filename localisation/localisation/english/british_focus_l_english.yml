 ENG_majority_rule:0 "Majority rule"
 ENG_majority_rule_tool:0 "Unable to interfere in colonial elections anymore"
 ENG_majority_rule_desc:0 "As the African colonies of Britain gradually gained independence, the British government began to implement majority rule (i.e. black) in the pre independence colonies. This not only facilitated London's support for black proxy governments, but also eliminated some white people who did not comply with British control, such as South African Boers and Rhodesian white people."
