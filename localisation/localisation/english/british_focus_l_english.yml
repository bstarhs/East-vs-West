 ENG_welfare_State:0 "Post-war consensus"
 ENG_welfare_State_desc:0 "Post war consultations refers to the economic and foreign policy chassis of Britain after World War II, that is, the Keynesian line of high taxes, high welfare and nationalization. Successive British governments, whether the labour party or the conservative party, adhered to this line for decades after the war until it was replaced by neoliberalism in the 1980s."
