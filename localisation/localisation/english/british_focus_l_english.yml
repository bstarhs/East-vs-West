 ENG_loyal:0 "Loyalty Program"
 ENG_intellegent_cooperation:0 "Intelligence sharing"
 ENG_nassau_treaty:0 "Nassau Agreement"
 ENG_nassau_treaty_desc:0 "The Nassau Agreement was a nuclear weapons sharing agreement signed between Britain and the United States in the early 1960s. The United States assisted Britain in establishing a nuclear strike capability, while Britain placed its nuclear weapons under the NATO integrated command system. As part of the agreement, the United States sold the North Star submarine launched nuclear missile to the UK."
 ENG_Arabs_fedarals:0 "Arab Federation"
 ENG_Arabs_fedarals_desc:0 "The Arab League was a colonial autonomy plan implemented by the United Kingdom in the early 1960s, which achieved independence for the Arab region under Commonwealth rule by merging the protectorates of Northern Arabia (Qatar, Bahrain, United Arab Emirates) and Southern Arabia (South Yemen) into two federations."
 ENG_wind_of_change:0 "The Wind of Change"
 ENG_wind_of_change_desc:0 "The Wind of Change was a speech delivered by British Prime Minister Harold Macmillan in Cape Town in 1960, which recognized the surging independence movement in Africa and promised to grant African colonies the right to self-determination. The wind of change marked the collapse of British colonial rule in Africa and the end of the era of neoimperialism."
 ENG_atalantic_anlliance:0 "Atlantic Community"
 ENG_atalantic_anlliance_desc:0 "The Atlantic Community is a policy led by Western countries such as the United States and the United States, supporting the economic and political alliance between free European countries and the United States."
