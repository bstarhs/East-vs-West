 ENG_Southeast_asia_autonomy:0 "FPDA"
 ENG_Southeast_asia_autonomy_desc:0 "The military defense community composed of Britain, Australia, New Zealand, Malaysia and Singapore aims to fight against the expanding Communist forces in Southeast Asia."
 ENG_Africa_autonomy:0 "African autonomy"
 ENG_3ring_diplo:0 "Three Majestic Circles"
 ENG_3ring_diplo_desc:0 "Winston Churchill proposed Britain's diplomatic strategy in the early stages after World War II. Its main purpose is to attempt to serve as a connecting point and link between Britain and the United States, the Commonwealth, and the united Europe through its special connections, in order to maintain Britain's traditional interests and great power status."
