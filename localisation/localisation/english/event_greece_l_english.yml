l_english:
 gre.1.t:0 "The Communist Party of Greece seizes power!"
 gre.1.d:0 "After intense fighting, the armed forces of the Greek Communist Party took control of the capital Athens and most of Greece's cities, and the remaining Greek government forces were forced to evacuate. At this point, the Greek Communist Party won the Greek Civil War and established the Greek Democratic Republic. The leader of the Greek Communist Party [GRE.GetLeader] announced the inauguration of the interim government as Prime Minister."
 gre.1.a:0 "Blessing Greece"
 
 gre.2.t:0 "King George II of Greece passed away"
 gre.2.d:0 "King George II of Greece passed away due to illness at the age of 56. King George II led the Greek government in exile to resist the Nazis during World War II, but when he returned to Greece, the country was still ravaged by civil war. George II had no offspring, and his brother Paul ascended to the throne as the king of Greece."
 
 gre.3.t:0 "[From.GetName] provides assistance to us"
 
 gre.4.t:0 "Greek Communist Party was suppressed"
 gre.4.d:0 "Under the strong suppression of the Greek National Army, the armed forces led by the Greek Communist Party were defeated, and survivors were forced to move into the mountainous areas to continue their resistance."
 gre.4.a:0 "The situation in Greece will not be so easy to improve"
 
 gre.5.t:0 "The Greek Communist Party Uprising!"
 gre.5.d:0 "The Greek Communist Party rebels have organized an armed force to launch an attack on us!"
 
 gre.6.t:0 "The internal struggles of the Greek Communist Party"
 gre.6.d:0 "The conflict between the Soviet Union and Yugoslavia inevitably affected the communist movement in Greece. There was a serious internal disagreement within the Greek Communist Party over whether to support Tito or Stalin, which greatly weakened the power of the Greek Communist Party."
 
 gre.9.t:0 "Alexander Papagos Elected as Prime Minister of Greece"
 gre.9.d:0 "After the end of the Greek Civil War, the Greek political situation remained unstable for a long time. General Alexander Papagos, the Greek army commander, decided to join the political community and form the Greek Unity Party to participate in politics. The Greek Unity Party quickly gained support from all sectors of Greece and successfully elected Alexander Papagos as Prime Minister."
 
 gre.11.t:0 "Alexander Papagos passed away"
 gre.11.d:0 "Greek Prime Minister Alexander Papagos has passed away, and his subordinate, Greek Minister of Transport Konstantinos Karamanlis, took over as Prime Minister."
 
 gre.12.t:0 "Greek parliamentary elections"
 
 gre.13.t:0 "Konstantinos Karamanlis Resigns"
 gre.13.d:0 "Due to concessions on the Cyprus issue, Greek Prime Minister Konstantinos Karamanlis was ostracized by conservatives within the government and decided to resign, with Georgio Papadrius taking over."
 
 gre.14.t:0 "King Paul I of Greece passed away"
 gre.14.d:0 "King Paul I of Greece passed away due to heart disease at the age of 63, and his son Constantine II succeeded to the throne. Constantine II is only 23 years old, and the international community deeply doubts his ability to regulate the relations between various forces in Greece."
 
 gre.15.t:0 "Greek parliamentary elections"
 
 gre.16.t:0 "The Greek military launched a coup!"
 gre.16.d:0 "The army led by Georgio Papadopoulos suddenly stormed into the capital Athens and took control of the government. They claimed that after the 1967 election in Greece, the political situation was chaotic and the government was incompetent. The military would step forward to establish a military government and take over the entire country."
 
 gre.17.t:0 "The Greek military launched a coup!"
 gre.17.d:0 "The army led by Georgio Papadopoulos suddenly stormed into the capital Athens and took control of the government. They claimed that after the 1967 election in Greece, the political situation was chaotic and the government was incompetent. The military would step forward to establish a military government and take over the entire country."
 
 gre.18.t:0 "Constantine II Leaving Greece"
 
 gre.19.t:0 "Establishment of the Greek Republic"
 gre.19.d:0 "King Constantine II of Greece failed in a confrontation with the military government and was forced to flee Rome. The head of the military government [GRE.GetLeader] announced that since the monarch had left, Greece would in fact become a republic"
 
 gre.20.t:0 "Demonstrations erupt at the University of Athens!"
 gre.20.d:0 "The failure of the Cyprus War exposed the incompetence of the military government, and people's dissatisfaction with the military government erupted comprehensively. A massive democratic movement has begun in various universities in Athens."
 
 gre.21.t:0 "Papadopoulos resigns"
 
 gre.22.t:0 "The Greek Military Government Goes Down"
 
 gre.23.t:0 "Constantine II's Return to Greece"
 
 gre.24.t:0 "Greek Monarchy Referendum"
 
 gre.25.t:0 "Greek parliamentary elections"