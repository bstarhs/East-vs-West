l_english:
 mal.1.t:0 "Communist revolt!"
 mal.1.d:0 "A Communist Party armed force has launched a rebellion in rural areas of our country!"
 mal.1.a:0 "We have to stop them!"
 
 mal.2.t:0 "Dismissal of guerrilla forces"
 mal.2.d:0 "With the decline of communism in our country and the increasingly severe suppression of the military, more and more rebels have surrendered, and the Communist guerrilla forces have tended to collapse."
 mal.2.a:0 "Good."
 
 mal.3.t:0 "Communist attack!"
 mal.3.d:0 "A Communist Party armed force has launched a rebellion in rural areas of our country!"
 mal.3.a:0 "We have to stop them!"

 mal.4.t:0 "Malaysian Civil war!"
 mal.4.d:0 "The British Malayan policy of suppressing the Communist Party ended in failure, and the Malayan Communist Party has organized a massive armed force and launched a full-scale civil war!"
 mal.4.a:0 "We have to stop them!"

 mal.5.t:0 "Civil war!"
 mal.5.d:0 "Our policy of suppressing the Communist Party ended in failure, and the Communist has organized a massive armed force and launched a full-scale civil war!"
 mal.5.a:0 "We have to stop them!"
 
 mal.7.t:0 "Alliance wins Malaysian election!"
 mal.7.d:0 "British Malaya held its first parliamentary election, with the Malay National Unity Organization (UMNO) winning a majority of parliamentary seats and becoming the first democratically elected ruling party in Malaya. UMNO promises to promote the independence of Malaya as soon as possible and strive for peaceful reunification among Malayan ethnic groups."
 mal.7.a:0 "Good!"
 
 mal.8.t:0 "Britain announces a state of emergency in Malaya!"
 mal.8.d:0 "As the Communist Party of Malaya's rebellion became increasingly intense, the stability of Malaya was seriously threatened. London officially declared a state of emergency in Malaya and dispatched armed forces to participate in suppressing the communist revolt."
 mal.8.a:0 "We have to stop them!"
 
 mal.10.t:0 "Malayan independence！"
 mal.10.d:0 "With the gradual rise of the Malayan flag in Kuala Lumpur, the Malayan Federation officially gained independence, marking the end of the region's three hundred year rule by Western colonizers. The newly formed Malaya is a federal monarchy composed of multiple Sultanates on the Malayan Peninsula, with the highest monarch elected between each Sultan, while the real power is in the hands of the Prime Minister. Despite gaining independence in Malaya, there are still many issues before this new country. The relationship between the three major ethnic groups of Malay, Indonesian, and Chinese remains tense, while the future of regions such as Singapore, Sarawak, and North Borneo remains uncertain."
 mal.10.a:0 "Congratuation!"
 
 mal.11.t:0 "Conception of the Federation of Malaysia"
 mal.11.d:0 "Prime Minister [MAL.GetLeader] of Malaya proposed the concept of the Greater Federation of Malaysia, advocating for the inclusion of Singapore, Sarawak, Brunei, and Borneo, which were also British colonies, as part of the Federation of Malaysia, in order to address the pending future issues in these regions."
 
 mal.12.t:0 "Conception of the Federation of Malaysia"
 mal.12.d:0 "Prime Minister [MAL.GetLeader] of Malaya proposed the concept of the Greater Federation of Malaysia, advocating for the inclusion of Singapore, Sarawak, Brunei, and Borneo, which were also British colonies, as part of the Federation of Malaysia, in order to address the pending future issues in these regions."
 mal.12.a:0 "Support, which provides a reasonable solution to the Far East issue."
 mal.12.b:0 "Objection, this is just an ambition and delusion of the Malayan government."
 
 mal.13.t:0 "[MAL.GetName] supports the Federated Malaya Plan"
 mal.13.d:0 "[MAL.GetName] supports the Federated Malaya Plan"
 
 mal.13.t:0 "[MAL.GetName] opposes the Federated Malaya Plan"
 mal.13.d:0 "[MAL.GetName] opposes the Federated Malaya Plan"
 
 mal.20.t:0 "Malayan National Liberation Army established!"
 mal.20.d:0 "As the CPC seized power in Chinese Mainland, the Communist guerrillas in Southeast Asia were encouraged. The Malayan Communist Party, which has been active for several years, has issued a statement officially establishing the Malayan National Liberation Army to fight for the expulsion of British colonial rule and the establishment of a People's Republic."
 mal.20.a:0 "We have to stop them!"
 
 mal.21.t:0 "The attack of the Malayan Communists!"
 mal.21.d:0 "The armed forces of the Malayan Communist Party attacked plantations and infrastructure in Perak, Hualing, and other areas, claiming that this was part of the Malayan Liberation War. The British military announced that it will take emergency measures to suppress the communist uprising."
 mal.21.a:0 "We have to stop them!"